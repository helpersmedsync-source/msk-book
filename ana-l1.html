le": "8.2 Mnemonic vault & classic exam traps", "items": [["Coracoclavicular =", "Trapezoid + Conoid ('Two Cords')"], ["Trapezius fibres top to bottom =", "E-R-D"], ["Axillary contents =", "A-V-L-B; apex = C-S-R"], ["Pectoralis minor protracts and", "depresses; serratus anterior protracts and rotates"]]}]}], "labName": "Recall · Rapid Revision (1/2)"}, {"id": "p61", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l1-7-1", "title": "Recall · Rapid Revision (2/2)", "groups": [{"title": "8.3 Self-check — from the lecture", "items": [["Winging of scapula is", "due to paralysis of serratus anterior"], ["Cervicoaxillary canal is found", "at the apex of the axilla"], ["Apex bounded by clavicle, upper", "border of scapula, outer border of 1st rib"]]}]}], "labName": "Recall · Rapid Revision (2/2)"}, {"id": "p62", "head": "Real images · 1 of 2", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one; the muscle pictures also have <b>Movements<\/b> and <b>Cut a nerve<\/b>. Every slide of the session is in the practical book: <a href=\"prac-ana-1.html\">Anatomy practical · Practical 1 – Shoulder region<\/a>."}, {"t": "lab", "lab": "sl13"}], "toc": ["◉", "Real images from the practical"], "labName": "Shoulder region · slide 11"}, {"id": "p63", "head": "Real images · 2 of 2", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl14"}], "labName": "Shoulder region · slide 12"}, {"id": "p64", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "h", "no": "?", "title": "Name it — spotter practice"}, {"t": "note", "kind": "hy", "title": "How it works", "html": "4 pictures from the practical slides of this lecture, each with its title and every label covered, in a new order. Say what it is out loud, then pick. Every one is also in Exam mode."}], "toc": ["?", "Name it — spotter practice"]}, {"id": "p65", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-27"}, {"t": "check", "q": "PRQ-9"}]}, {"id": "p66", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-18"}, {"t": "check", "q": "PRQ-5"}]}, {"id": "p67", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Clavicle fracture: proximal fragment goes UP (sternomastoid), distal goes DOWN (arm)"}, {"t": "note", "kind": "trap", "html": "Upward rotation = lateral rotation; downward rotation = medial rotation"}, {"t": "note", "kind": "trap", "html": "Winging of scapula = serratus anterior (long thoracic n.), not trapezius, levator scapulae or pectorals"}, {"t": "note", "kind": "trap", "html": "Cervicoaxillary canal is the apex of the axilla, not the base or a wall"}, {"t": "note", "kind": "trap", "html": "SC stability = costoclavicular ligament, not the sternoclavicular ligaments"}, {"t": "note", "kind": "trap", "html": "AC stability = coracoclavicular ligament, not the acromioclavicular ligament"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p68", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Pectoralis minor protracts and depresses; serratus anterior protracts and rotates"}, {"t": "note", "kind": "trap", "html": "Trapezius paralysis → sagging shoulder, not winging"}, {"t": "note", "kind": "cl", "html": "Clavicle fracture: fall on shoulder with arm at side; middle third; usually nonoperative"}, {"t": "note", "kind": "cl", "html": "AC joint separation: fall on shoulder/outstretched arm; acromion under clavicle; coracoclavicular ligament torn"}, {"t": "note", "kind": "cl", "html": "Long thoracic nerve injury in radical mastectomy → serratus anterior paralysis: winging, weak abduction &gt;90°, cannot push; push-against-wall test"}]}, {"id": "p69", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Trapezius paralysis: weak raising arm &gt;90°, weak retraction, flattened lower neck, sagging shoulder"}]}, {"id": "p70", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0061": {"id": "Q0061", "stem": "Match each lettered structure with the corresponding number on the X-ray.\nA. Acromion\nB. Glenoid cavity\nC. Clavicle\nD. Spine of scapula\nE. Acromioclavicular joint\nF. Lateral border of the scapula\nG. Coracoid process", "top": false, "rep": "asked 3 years", "tag": "Extra practice", "bank": false, "expl": "The clavicle (1) crosses the top of the film to its acromial end, which meets the acromion (2) at the acromioclavicular joint (3). Below them, the coracoid process (4) projects over the scapular neck, the spine of the scapula (5) runs medially as a bright line, the glenoid cavity (6) faces the humeral head, and the lateral border of the scapula (7) runs down from below the glenoid.", "img": ["figs/Q0061.jpg"], "cap": "Shoulder radiograph with arrows numbered 1–7", "type": "written", "keyhtml": "A. Acromion → 2\nB. Glenoid cavity → 6\nC. Clavicle → 1\nD. Spine of scapula → 5\nE. Acromioclavicular joint → 3\nF. Lateral border of the scapula → 7\nG. Coracoid process → 4"}, "Y26-059": {"id": "Y26-059", "stem": "What are the main movements of the scapula (shoulder girdle)?", "top": true, "rep": "", "tag": "Final bank ANA W1", "bank": true, "expl": "The six scapular movements form three opposing pairs; upward rotation is also called lateral rotation and downward rotation medial rotation. Upward rotation is the movement that allows the arm to be raised above 90°.", "img": ["figs/GA-01.jpg"], "cap": "Six positions of the scapulae; the arrows show the direction of movement.", "aimg": ["figs/GA-01_ans.jpg"], "acap": "Scapular movements, labelled.", "type": "written", "keyhtml": "Movements of the shoulder girdle = movements of the scapula. There are six, in three opposing pairs:\n• Elevation (scapula moves up) and depression (scapula moves down)\n• Protraction (forward movement) and retraction (backward movement)\n• Upward (lateral) rotation and downward (medial) rotation"}, "Y26-067": {"id": "Y26-067", "stem": "Where does the subclavius muscle attach, and which nerve provides its motor innervation?", "top": true, "rep": "", "tag": "Final bank ANA W2", "bank": true, "expl": "Subclavius runs between the first rib and its costal cartilage and the clavicle, and stabilizes the clavicle. It is supplied by the nerve to subclavius, one of the two branches of the upper trunk of the brachial plexus (C5, C6).", "img": ["figs/GA-09.jpg"], "cap": "Subclavius shown in red on a skeletal model.", "type": "written", "keyhtml": "• Attachments: between the first rib and its costal cartilage and the clavicle.\n• Motor innervation: the nerve to subclavius — a branch of the upper trunk of the brachial plexus (C5, C6).\n• Action: stabilizes the clavicle."}, "Y26-063": {"id": "Y26-063", "stem": "A patient has difficulty pushing against a wall, and the medial and inferior borders of the scapula become prominent. Which muscle is most likely paralyzed?", "top": true, "rep": "", "tag": "Final bank ANA W3", "bank": true, "expl": "Winging of the scapula, shown by asking the patient to push against a wall, is due to paralysis of serratus anterior after injury to the long thoracic nerve (e.g. in radical mastectomy). Trapezius paralysis instead causes a sagging shoulder and weak retraction, not winging.", "img": ["figs/GA-05.jpg"], "cap": "Patient pushing against a wall.", "type": "written", "keyhtml": "Serratus anterior (supplied by the long thoracic nerve). Its paralysis causes winging of the scapula: the medial and inferior borders of the scapula become prominent when the patient pushes against a wall, and the arm cannot be used to push with."}, "Y26-065": {"id": "Y26-065", "stem": "Which specific muscle margins define the visible anterior and posterior axillary folds on a physical examination?", "top": true, "rep": "", "tag": "Final bank ANA W4", "bank": true, "expl": "The base of the axilla (skin and fascia) is bounded in front by the anterior axillary fold, formed by pectoralis major, and behind by the posterior axillary fold, formed by latissimus dorsi and teres major.", "img": ["figs/GA-07.jpg"], "cap": "Axillary folds and axillary fossa.", "type": "written", "keyhtml": "• Anterior axillary fold: pectoralis major.\n• Posterior axillary fold: latissimus dorsi and teres major."}, "Y26-066": {"id": "Y26-066", "stem": "During a central venous catheterization via the subclavian vein, the needle enters the cervico-axillary canal (apex of the axilla). Which precise bony boundaries define this canal?", "top": true, "rep": "", "tag": "Final bank ANA W5", "bank": true, "expl": "The apex of the axilla is the triangular cervicoaxillary canal, between the clavicle in front, the upper border of the scapula behind and the outer border of the 1st rib medially. The brachial plexus descends through this canal from the neck to reach the axilla.", "img": ["figs/GA-08.jpg"], "cap": "Bones around the apex of the axilla, highlighted in red (labels removed).", "aimg": ["figs/GA-08_ans.jpg"], "acap": "The same bones, labelled.", "type": "written", "keyhtml": "The cervicoaxillary canal (apex of the axilla) is triangular, bounded by:\n• Anteriorly: the clavicle\n• Posteriorly: the upper border of the scapula\n• Medially: the outer border of the 1st rib\n(Mnemonic: C-S-R — clavicle, scapula, rib)"}, "Q0064": {"id": "Q0064", "stem": "Which of the following muscles does NOT share in forming the boundaries of the axilla?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q7", "bank": true, "expl": "Trapezius is a superficial back muscle and is not one of the axillary walls. Pectoralis minor forms part of the anterior wall, subscapularis and teres major the posterior wall, and serratus anterior the medial wall.", "type": "mcq", "opts": ["Trapezius", "Serratus anterior", "Subscapularis", "Pectoralis minor", "Teres major"], "ans": 0}, "Q0065": {"id": "Q0065", "stem": "Winging of the scapula is due to paralysis of which of the following muscles?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Paralysis of serratus anterior (long thoracic nerve) causes winging of the scapula: its medial and inferior borders become prominent, especially when the patient pushes against a wall. Trapezius paralysis causes a sagging shoulder, not winging.", "type": "mcq", "opts": ["Trapezius", "Levator scapulae", "Pectoralis major", "Pectoralis minor", "Serratus anterior"], "ans": 4}, "Q0066": {"id": "Q0066", "stem": "The cervicoaxillary canal is found at which part of the axilla?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The apex of the axilla is the triangular cervicoaxillary canal, bounded by the clavicle, the upper border of the scapula and the outer border of the 1st rib (C-S-R). The base is formed by skin and fascia.", "type": "mcq", "opts": ["Apex", "Base", "Anterior wall", "Posterior wall", "Medial wall"], "ans": 0}, "Q0123": {"id": "Q0123", "stem": "Which of the following is innervated by the dorsal scapular nerve?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q8", "bank": true, "expl": "The dorsal scapular nerve supplies the 'deep three' back muscles: levator scapulae, rhomboid minor and rhomboid major. Serratus anterior is supplied by the long thoracic nerve.", "type": "mcq", "opts": ["Supraspinatus", "Subscapularis", "Rhomboid major", "Serratus anterior"], "ans": 2}, "Q0125": {"id": "Q0125", "stem": "Which of the following is true concerning the trapezius?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q9", "bank": true, "expl": "Trapezius fibers from top to bottom elevate, retract and depress the scapula (E-R-D), so the middle fibers retract it. Trapezius is supplied by the spinal part of the accessory nerve (CN XI); the dorsal scapular nerve supplies levator scapulae and the rhomboids.", "type": "mcq", "opts": ["Its middle fibers retract the scapula", "It is innervated by the dorsal scapular nerve", "Its superior fibers retract the scapula", "Its inferior fibers retract the scapula"], "ans": 0}, "Q0129": {"id": "Q0129", "stem": "During removal of a malignant mass in the axilla, the surgeon discovered a large lymph node invading a muscle in the posterior wall of the axilla. Which of the following muscles is most likely affected?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q1", "bank": true, "expl": "The posterior wall of the axilla is formed by subscapularis, teres major and latissimus dorsi. Serratus anterior forms the medial wall and pectoralis major the anterior wall.", "type": "mcq", "opts": ["Subscapularis", "Infraspinatus", "Pectoralis major", "Serratus anterior", "Supraspinatus"], "ans": 0}, "Q0131": {"id": "Q0131", "stem": "The shoulder girdle is formed by which of the following bone(s)?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q2", "bank": true, "expl": "The shoulder girdle comprises the clavicle (collar bone) and the scapula (shoulder blade), which together provide a mobile base attaching the upper limb to the trunk. The humerus is not part of the girdle; it articulates with the scapula at the glenoid fossa.", "type": "mcq", "opts": ["Clavicle and humerus", "Scapula and humerus", "Scapula only", "Clavicle and scapula", "Humerus only"], "ans": 3}, "Q0132": {"id": "Q0132", "stem": "Fractures of the clavicle are characterized by:", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q3", "bank": true, "expl": "In a fracture of the clavicle (usually of its middle third) the distal fragment is pulled inferiorly by the arm, so the arm drops. The proximal fragment is lifted superiorly by the sternomastoid, not trapezius; the clavicle lacks marrow and treatment is usually nonoperative.", "type": "mcq", "opts": ["They need rapid surgical intervention", "They occur mainly in the lateral part of the clavicle", "A marrow cavity is seen inside the fractured clavicle", "The proximal fragment is lifted superiorly by trapezius", "The arm is dropped following the fracture"], "ans": 4}, "Q0164": {"id": "Q0164", "stem": "Which of the following muscles is NOT supplied by the brachial plexus?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q4", "bank": true, "expl": "Trapezius is supplied by the spinal part of the accessory nerve (11th cranial nerve), not by the brachial plexus. The others receive brachial plexus branches: levator scapulae (dorsal scapular nerve) and serratus anterior (long thoracic nerve) from the roots, and latissimus dorsi (thoracodorsal nerve) and pectoralis major (medial and lateral pectoral nerves) from the cords.", "type": "mcq", "opts": ["Levator scapulae", "Trapezius", "Pectoralis major", "Latissimus dorsi", "Serratus anterior"], "ans": 1}, "Q0166": {"id": "Q0166", "stem": "The sternoclavicular joint type is:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q5", "bank": true, "expl": "The sternoclavicular joint is a saddle synovial joint, and its fibrocartilaginous articular disc divides it into two cavities ('SC = Saddle'). Plane synovial is the type of the acromioclavicular joint ('AC = flAt').", "type": "mcq", "opts": ["Saddle synovial", "Ellipsoid synovial", "Fibrous", "Secondary cartilaginous", "Plane synovial"], "ans": 0}, "Q0169": {"id": "Q0169", "stem": "Which of the following muscles can perform retraction (of the scapula)?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q6", "bank": true, "expl": "Retraction (backward movement of the scapula) is produced by the middle fibers of trapezius and the rhomboids (minor and major), supplied by the dorsal scapular nerve. Pectoralis minor and serratus anterior produce the opposite movement, protraction.", "type": "mcq", "opts": ["Deltoid", "Serratus anterior", "Pectoralis major", "Rhomboid minor", "Pectoralis minor"], "ans": 3}, "N-ANA-L1-01": {"id": "N-ANA-L1-01", "stem": "A 25-year-old volleyball player reaches high above her head to block the ball, raising her arm well above 90°. Which movement of the scapula makes raising the arm above 90° possible?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Raising the arm above 90° needs upward (lateral) rotation of the scapula, produced by the upper and lower fibers of trapezius with the lower 5 digitations of serratus anterior. Downward rotation is the same as medial rotation, the opposite movement (levator scapulae and rhomboids).", "type": "mcq", "opts": ["Elevation", "Protraction", "Retraction", "Upward (lateral) rotation", "Downward (medial) rotation"], "ans": 3}, "N-ANA-L1-02": {"id": "N-ANA-L1-02", "stem": "A 22-year-old rugby player falls onto his outstretched arm. Examination and X-ray show acromioclavicular joint separation, with the acromion pushed under the clavicle. Which ligament is most likely torn?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In AC joint separation the acromion is pushed under the clavicle and the coracoclavicular ligament, the principal stabilizer of the AC joint, is torn. The costoclavicular ligament stabilizes the sternoclavicular joint at the other end of the clavicle.", "type": "mcq", "opts": ["Costoclavicular", "Coracoclavicular", "Anterior sternoclavicular", "Posterior sternoclavicular"], "ans": 1}, "N-ANA-L1-03": {"id": "N-ANA-L1-03", "stem": "After a neck injury, a 35-year-old man has a sagging right shoulder, flattening of the lower neck on that side and weakness when he braces his shoulders backwards. He also cannot raise the right arm fully above 90°. Which nerve is most likely injured?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Sagging of the shoulder, flattening of the lower neck and weak retraction and raising of the arm above 90° are the signs of trapezius paralysis, and trapezius is supplied by the spinal part of the accessory nerve (CN XI). Long thoracic nerve injury paralyses serratus anterior and causes winging of the scapula rather than a sagging shoulder.", "type": "mcq", "opts": ["Long thoracic nerve", "Dorsal scapular nerve", "Spinal part of the accessory nerve", "Nerve to subclavius"], "ans": 2}, "N-ANA-L1-04": {"id": "N-ANA-L1-04", "stem": "A physiotherapist asks a patient to push the shoulder forwards and downwards against resistance, testing protraction and depression of the scapula together. Which single muscle produces both of these movements?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Pectoralis minor, running from the upper ribs to the coracoid process, both protracts and depresses the scapula. Serratus anterior protracts and rotates the scapula but does not depress it, and the lower fibers of trapezius depress but do not protract it.", "type": "mcq", "opts": ["Serratus anterior", "Pectoralis minor", "Lower fibers of trapezius", "Subclavius", "Levator scapulae"], "ans": 1}, "N-ANA-L1-05": {"id": "N-ANA-L1-05", "stem": "At a bone-identification station, a student holding a right scapula is asked to point to the part that articulates with the humerus. Which feature should the student identify?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The scapula articulates with the humerus at the glenoid fossa (cavity). The acromion articulates with the acromial end of the clavicle at the acromioclavicular joint.", "type": "mcq", "opts": ["Glenoid cavity", "Coracoid process", "Acromion", "Spine of the scapula", "Subscapular fossa"], "ans": 0}, "N-ANA-L1-06": {"id": "N-ANA-L1-06", "stem": "Enumerate the boundaries of the axilla (apex, base and walls) and list its contents.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from Part 06: the shape and apex/base in 6.1-6.2, the four walls in 6.3 and the contents in 6.4.", "type": "written", "keyhtml": "The axilla (arm pit) is a pyramidal space between the upper part of the arm and the chest, with 1 apex, 1 base and 4 walls.\nApex: the cervicoaxillary canal (triangular), bounded by:\n• Clavicle: anterior\n• Upper border of the scapula: posterior\n• Outer border of the 1st rib: medial\n(Mnemonic C-S-R)\nBase: skin and fascia.\nWalls:\n• Anterior: pectoralis major, pectoralis minor, subclavius and clavipectoral fascia\n• Posterior: subscapularis, teres major and latissimus dorsi\n• Medial: serratus anterior and the first 4 ribs with their intercostal muscles\n• Lateral: narrow, where the anterior and posterior walls converge; humerus, coracobrachialis and biceps brachii\nContents (A-V-L-B):\n• Axillary artery and its branches\n• Axillary vein and its tributaries\n• Axillary lymph nodes\n• Brachial plexus"}, "Y26-064": {"id": "Y26-064", "stem": "Which muscle forms the medial wall of the axilla, and how does the lateral wall differ structurally from the medial wall?", "top": true, "rep": "", "tag": "Final bank ANA W6", "bank": true, "expl": "The medial wall of the axilla is serratus anterior lying on the first 4 ribs and their intercostal muscles. Laterally the anterior and posterior walls converge, so the lateral wall is narrow and is formed by the humerus with coracobrachialis and biceps brachii.", "img": ["figs/GA-06.jpg"], "cap": "Dissection of the axilla (labels removed).", "aimg": ["figs/GA-06_ans.jpg"], "acap": "Dissection of the axilla, labelled.", "type": "written", "keyhtml": "• Medial wall: serratus anterior, together with the first 4 ribs and their intercostal muscles.\n• Lateral wall: here the anterior and posterior walls converge, so the space is narrow; it is bounded by the humerus, coracobrachialis and biceps brachii.\n• So the medial wall is muscle on the chest wall (serratus anterior over the ribs), whereas the lateral wall is a narrow wall formed by bone (humerus) and arm muscles."}, "N-ANA-L1-07": {"id": "N-ANA-L1-07", "stem": "(a) Mention the muscles that produce each of the six movements of the scapula (shoulder girdle).\n(b) Which two muscles act together to rotate the scapula so that the arm can be raised above 90°? Give the nerve supply of each.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Part (a) follows the movement-muscle table in 7.1 and part (b) the summary in 7.5; the nerves are given in 5.2 and 4.3.", "type": "written", "keyhtml": "(a)\n• Elevation: upper fibers of trapezius; levator scapulae\n• Depression: lower fibers of trapezius; pectoralis minor\n• Protraction (forward): serratus anterior; pectoralis minor\n• Retraction (backward): middle fibers of trapezius; rhomboideus minor and major\n• Lateral (upward) rotation: upper and lower fibers of trapezius; lower 5 digitations of serratus anterior\n• Medial (downward) rotation: levator scapulae; rhomboids (minor and major)\n(b) Trapezius (upper + lower fibers), supplied by the spinal part of the accessory nerve (CN XI), and serratus anterior (lower 5 digitations), supplied by the long thoracic nerve. Together they produce upward (lateral) rotation of the scapula, which is needed to raise the arm above 90°."}, "N-ANA-L1-08": {"id": "N-ANA-L1-08", "stem": "A 45-year-old woman develops weakness of her right arm a few weeks after a radical mastectomy. On examination, the medial and inferior borders of her right scapula become prominent.\n(a) Name this sign, the paralysed muscle and the injured nerve.\n(b) Mention two other effects of this paralysis.\n(c) How is this muscle tested clinically?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All answers are stated in the lecture's long thoracic nerve injury notes (4.4).", "type": "written", "keyhtml": "(a) Winging of the scapula, due to paralysis of serratus anterior after injury to the long thoracic nerve during the radical mastectomy.\n(b) • Weakness in abduction of the arm above 90°\n• The arm cannot be used to push with\n(c) Ask the patient to push against the wall; the scapula wings."}, "N-ANA-L1-09": {"id": "N-ANA-L1-09", "stem": "Compare the sternoclavicular and acromioclavicular joints regarding type, articular surfaces and main stabilizing ligament.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from the joint tables in 2.1-2.2 and the comparison in 2.4.", "type": "written", "keyhtml": "Sternoclavicular (SC) joint:\n• Type: saddle synovial joint; a fibrocartilaginous articular disc divides it into two cavities\n• Articular surfaces: sternal end of the clavicle; clavicular notch of the manubrium sterni and the 1st costal cartilage (all covered by fibrocartilage)\n• Main stabilizer: costoclavicular ligament (clavicle to the 1st costal cartilage and 1st rib); the anterior and posterior sternoclavicular ligaments only reinforce the capsule\nAcromioclavicular (AC) joint:\n• Type: plane synovial joint\n• Articular surfaces: acromial end of the clavicle; clavicular facet of the acromion process of the scapula\n• Main stabilizer: coracoclavicular ligament (extremely strong; trapezoid and conoid parts); the acromioclavicular ligament covers the upper aspect of the joint"}, "Y26-060": {"id": "Y26-060", "stem": "Which muscles produce elevation of the scapula, and how do their actions differ from those producing depression?", "top": true, "rep": "", "tag": "Final bank ANA W7", "bank": true, "expl": "Trapezius acts in both directions through different fibers: its upper fibers elevate and its lower fibers depress the scapula. Levator scapulae (C1–C4 to the superior angle) lifts the scapula and also rotates it downward, whereas pectoralis minor (upper ribs to the coracoid process) depresses it and also protracts it.", "img": ["figs/GA-02.jpg"], "cap": "3D model of the shoulder region during scapular elevation (still from an animation).", "type": "written", "keyhtml": "• Elevation: upper fibers of trapezius and levator scapulae.\n• Depression: lower fibers of trapezius and pectoralis minor.\n• How they differ:\n  – Trapezius takes part in both, through different fibers: its upper fibers elevate and its lower fibers depress the scapula (trapezius runs from the skull and upper half of the vertebral column to the scapula and clavicle; spinal part of the accessory nerve).\n  – The other elevator, levator scapulae, runs from the transverse processes of C1–C4 down to the superior angle (medial border) of the scapula and pulls it up; it also rotates the scapula medially (downward) (dorsal scapular nerve).\n  – The other depressor, pectoralis minor, runs from the upper ribs to the coracoid process and pulls the scapula down; it also protracts it."}, "Y26-061": {"id": "Y26-061", "stem": "Which muscles produce retraction of the scapula, and why are both trapezius and rhomboids involved?", "top": true, "rep": "", "tag": "Final bank ANA W8", "bank": true, "expl": "Retraction is produced by the middle fibers of trapezius and the two rhomboids, which both pull the scapula backwards towards the vertebral column. They lie in different layers and have different nerves, so trapezius paralysis causes weakness, not loss, of retraction.", "img": ["figs/GA-03.jpg"], "cap": "3D model of the shoulder region during scapular retraction (still from an animation).", "aimg": ["figs/GA-03_ans.jpg"], "acap": "Motion-mode screen listing the muscles active in retraction of the scapula.", "type": "written", "keyhtml": "• Retraction (backward movement of the scapula) is produced by the middle fibers of trapezius and rhomboideus minor and major.\n• Both are involved because both pass from the vertebral column to the scapula — trapezius in the superficial layer (to the scapula and clavicle; spinal part of the accessory nerve) and the rhomboids in the deep layer (to the medial border of the scapula; dorsal scapular nerve) — so both pull the scapula backwards towards the vertebral column.\n• Because they lie in different layers with different nerves, paralysis of trapezius only weakens retraction (the rhomboids still act)."}, "Y26-062": {"id": "Y26-062", "stem": "1. Which muscles work together to produce upward rotation of the scapula, allowing the arm to be raised above 90°?\n2. A patient develops weakness in raising the arm above 90° after an injury to the long thoracic nerve. Which muscle and movement are primarily affected?", "top": true, "rep": "", "tag": "Final bank ANA W9", "bank": true, "expl": "Raising the arm above 90° needs upward (lateral) rotation of the scapula, produced by the upper and lower fibers of trapezius together with the lower 5 digitations of serratus anterior. The long thoracic nerve supplies serratus anterior, so its injury (e.g. in radical mastectomy) weakens abduction above 90° and causes winging of the scapula.", "img": ["figs/GA-04.jpg"], "cap": "3D model of the shoulder region with highlighted muscles (still from an animation).", "type": "written", "keyhtml": "1. Upward (lateral) rotation of the scapula is produced by trapezius (upper and lower fibers; spinal part of the accessory nerve) acting together with serratus anterior (lower 5 digitations; long thoracic nerve). This rotation is needed to raise the arm above 90°.\n2. Serratus anterior (supplied by the long thoracic nerve) is paralysed, so upward (lateral) rotation of the scapula is weakened — trapezius alone cannot complete it — and protraction is lost → weakness in abduction of the arm above 90°; the patient also shows winging of the scapula and cannot use the arm to push."}, "TP-126": {"id": "TP-126", "stem": "What are the important anatomical spaces of the upper limb? Mention their boundaries and contents.", "top": true, "rep": "", "tag": "Final bank ANA W48", "bank": true, "expl": "The axilla is a pyramidal space between the upper arm and the chest, the cubital fossa a triangular region anterior to the elbow joint, and the anatomical snuffbox a depression on the dorsal aspect of the hand. The cubital fossa boundaries cross over: the lateral boundary is the medial border of brachioradialis and the medial boundary is the lateral border of pronator teres.", "type": "written", "keyhtml": "1. Axilla — a pyramidal space between the upper part of the arm and the chest (an apex, a base and 4 walls).\nBoundaries:\n• Apex: the cervicoaxillary canal (triangular), bounded by the clavicle (anteriorly), the upper border of the scapula (posteriorly) and the outer border of the 1st rib (medially)\n• Base: skin and fascia\n• Anterior wall: pectoralis major, pectoralis minor, subclavius and clavipectoral fascia\n• Posterior wall: subscapularis, teres major and latissimus dorsi\n• Medial wall: serratus anterior and the first 4 ribs with their intercostal muscles\n• Lateral wall: narrow, where the anterior and posterior walls converge; bounded by the humerus, coracobrachialis and biceps brachii\nContents: axillary artery and its branches; axillary vein and its tributaries; axillary lymph nodes; brachial plexus; in addition, the tail of the breast.\n\n2. Cubital fossa — a triangular region anterior to the elbow joint.\nBoundaries:\n• Lateral: brachioradialis (its medial border)\n• Medial: pronator teres (its lateral border)\n• Base (superior border): the imaginary line between the epicondyles of the humerus\n• Floor: brachialis medially and supinator laterally\n• Roof: fascia and skin\nContents: the biceps tendon; the brachial artery (medial to the biceps tendon); the median nerve (medial to the brachial artery); the radial nerve (the most lateral structure in the fossa).\n\n3. Anatomical snuffbox — a depression on the dorsal aspect of the hand.\nBoundaries:\n• Floor (base): scaphoid and trapezium\n• Lateral border: tendons of abductor pollicis longus and extensor pollicis brevis\n• Medial border: tendon of extensor pollicis longus\nContents: the radial artery (crosses the floor); the superficial branch of the radial nerve; the cephalic vein."}, "PRQ-27": {"id": "PRQ-27", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Humerus", "Deltoid", "Clavicle", "Scapula"], "ans": 1, "top": false, "rep": "", "tag": "Practical · Practical 1 – Shoulder region", "bank": false, "img": ["prac/q027.jpg"], "expl": "The practical slide \"deltoid muscle origin and insertion\" (Practical 1 – Shoulder region)."}, "PRQ-9": {"id": "PRQ-9", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Humerus", "Axilla", "Scapula", "Deltoid"], "ans": 2, "top": false, "rep": "", "tag": "Practical · Practical 1 – Shoulder region", "bank": false, "img": ["prac/q009.jpg"], "expl": "The practical slide \"SCAPULA\" (Practical 1 – Shoulder region)."}, "PRQ-18": {"id": "PRQ-18", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Clavicle", "Scapula", "Humerus", "Axilla"], "ans": 3, "top": false, "rep": "", "tag": "Practical · Practical 1 – Shoulder region", "bank": false, "img": ["prac/q018.jpg"], "expl": "The practical slide \"AXILLA\" (Practical 1 – Shoulder region)."}, "PRQ-5": {"id": "PRQ-5", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Humerus", "Clavicle", "Scapula", "Axilla"], "ans": 1, "top": false, "rep": "", "tag": "Practical · Practical 1 – Shoulder region", "bank": false, "img": ["prac/q005.jpg"], "expl": "The practical slide \"CLAVICLE\" (Practical 1 – Shoulder region)."}}, "labs": {"sl13": {"id": "sl13", "type": "slide", "title": "Shoulder region · slide 11", "img": "prac/s013.jpg", "labels": [{"t": "Pectoralis minor", "x": 10.16, "y": 71.86, "w": 15.56, "h": 4.29, "id": "l0", "mu": "pmin"}, {"t": "Serratus anterior", "x": 70.94, "y": 82.0, "w": 16.11, "h": 4.29, "id": "l1", "mu": "sa"}], "src": "From the practical slides · Practical 1 – Shoulder region", "act": {"muscles": {"pmin": {"name": "Pectoralis minor", "nerves": [], "moves": ["sprot", "sdep"], "note": "Upper ribs → coracoid process; protracts and depresses the scapula. Its nerve is not given in the lecture."}, "sa": {"name": "Serratus anterior", "nerves": ["lt"], "moves": ["sprot", "slat"], "note": "Upper 8–9 ribs → medial border of scapula; protraction. Lower 5 digitations rotate the scapula laterally (arm above 90°). Injury → winging of the scapula."}}, "nerves": [{"id": "lt", "name": "Long thoracic"}], "moves": [{"id": "sdep", "name": "Depression of scapula"}, {"id": "sprot", "name": "Protraction of scapula"}, {"id": "slat", "name": "Lateral (upward) rotation of scapula"}], "par": {}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}, "sl14": {"id": "sl14", "type": "slide", "title": "Shoulder region · slide 12", "img": "prac/s014.jpg", "labels": [{"t": "Levator scapulae", "x": 17.58, "y": 16.73, "w": 16.38, "h": 4.29, "id": "l0", "mu": "levs"}, {"t": "Rhomboideus minor", "x": 16.72, "y": 26.86, "w": 19.47, "h": 4.29, "id": "l1", "mu": "rmin"}, {"t": "Rhomboideus major", "x": 19.22, "y": 38.11, "w": 19.39, "h": 4.29, "id": "l2", "mu": "rmaj"}, {"t": "Trapezius", "x": 79.45, "y": 90.89, "w": 9.38, "h": 4.29, "id": "l3", "mu": "trap"}], "src": "From the practical slides · Practical 1 – Shoulder region", "act": {"muscles": {"levs": {"name": "Levator scapulae", "nerves": ["ds"], "moves": ["selev", "smed"], "note": "Transverse processes C1–C4 → superior angle; elevates and rotates the scapula medially."}, "rmin": {"name": "Rhomboideus minor", "nerves": ["ds"], "moves": ["sret", "smed"], "note": "Vertebral column → medial border of scapula; retracts and rotates it medially."}, "rmaj": {"name": "Rhomboideus major", "nerves": ["ds"], "moves": ["sret", "smed"], "note": "Vertebral column → medial border of scapula; retracts and rotates it medially."}, "trap": {"name": "Trapezius", "nerves": ["xi"], "moves": ["selev", "sret", "sdep", "slat"], "note": "Upper fibres elevate, middle retract, lower depress (E-R-D); upper + lower fibres rotate the scapula laterally. Paralysis → sagging shoulder."}}, "nerves": [{"id": "xi", "name": "Spinal accessory (CN XI)"}, {"id": "ds", "name": "Dorsal scapular"}], "moves": [{"id": "selev", "name": "Elevation of scapula"}, {"id": "sdep", "name": "Depression of scapula"}, {"id": "sret", "name": "Retraction of scapula"}, {"id": "slat", "name": "Lateral (upward) rotation of scapula"}, {"id": "smed", "name": "Medial (downward) rotation of scapula"}], "par": {}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}}, "cards": [{"id": "ANA-L1-001", "text": "The shoulder girdle = {{c1::clavicle}} (collar bone) + {{c2::scapula}} (shoulder blade) — a mobile base attaching the upper limb to the trunk", "extra": "The humerus is not part of the girdle.", "sec": "Part 01 · 1.1 The clavicle (collar bone)"}, {"id": "ANA-L1-002", "text": "Clavicle roles: a {{c1::bar}} (keeps the scapula & upper limb away from the chest wall) · a {{c2::link}} (sternum ↔ acromion) · a {{c3::force transmitter}} (to the axial skeleton)", "extra": "", "sec": "Part 01 · 1.1 The clavicle (collar bone)"}, {"id": "ANA-L1-003", "text": "The clavicle's two odd features: it {{c1::lacks marrow}} and it {{c2::ossifies in membrane}}", "extra": "So 'a marrow cavity is seen in the fractured clavicle' is false.", "sec": "Part 01 · 1.1 The clavicle (collar bone)"}, {"id": "ANA-L1-004", "text": "Clavicle articulations: sternal (medial) end ↔ {{c1::sternum}}; acromial (lateral) end ↔ {{c2::acromion of the scapula}}", "extra": "", "sec": "Part 01 · 1.1 The clavicle (collar bone)"}, {"id": "ANA-L1-005", "text": "The subclavian groove lies on the {{c1::inferior}} surface of the clavicle", "extra": "", "sec": "Part 01 · 1.1 The clavicle (collar bone)"}, {"id": "ANA-L1-006", "text": "The scapula articulates with the humerus at the {{c1::glenoid fossa (cavity)}}", "extra": "The acromion articulates with the clavicle (AC joint), not the humerus.", "sec": "Part 01 · 1.2 The scapula (shoulder blade)"}, {"id": "ANA-L1-007", "text": "Scapula: a {{c1::triangular}} bone with a prominent {{c2::spine}} on its posterior surface", "extra": "", "sec": "Part 01 · 1.2 The scapula (shoulder blade)"}, {"id": "ANA-L1-008", "text": "Scapular fossae: anterior = {{c1::subscapular}} fossa; posterior = {{c2::supraspinous}} fossa (above the spine) & {{c3::infraspinous}} fossa (below the spine)", "extra": "", "sec": "Part 01 · 1.2 The scapula (shoulder blade)"}, {"id": "ANA-L1-009", "text": "The superior border of the scapula carries the {{c1::scapular notch}}", "extra": "Other borders: medial & lateral; angles: superior & inferior.", "sec": "Part 01 · 1.2 The scapula (shoulder blade)"}, {"id": "ANA-L1-010", "text": "Scapular processes: {{c1::acromion}} · {{c2::coracoid process}} · spine (posterior surface)", "extra": "Acromion → AC joint; coracoid → pectoralis minor & coracoclavicular ligament.", "sec": "Part 01 · 1.2 The scapula (shoulder blade)"}, {"id": "ANA-L1-011", "text": "Glenoid region of the scapula: glenoid cavity + {{c1::supraglenoid}} & {{c2::infraglenoid}} tubercles", "extra": "", "sec": "Part 01 · 1.2 The scapula (shoulder blade)"}, {"id": "ANA-L1-012", "text": "Fracture of the clavicle — mechanism: fall directly on the {{c1::shoulder}} with the arm {{c2::at the side}} (contact sports: rugby, football)", "extra": "", "sec": "Part 01 · 1.3 Fracture of the clavicle"}, {"id": "ANA-L1-013", "text": "Fracture of the clavicle — usual site: {{c1::middle one-third}}", "extra": "Not the lateral part.", "sec": "Part 01 · 1.3 Fracture of the clavicle"}, {"id": "ANA-L1-014", "text": "Fracture of the clavicle: proximal fragment lifted UP by {{c1::sternomastoid}}; distal fragment pulled DOWN by {{c2::the arm (weight of the limb)}}", "extra": "Trap: the proximal fragment is lifted by sternomastoid, not trapezius.", "sec": "Part 01 · 1.3 Fracture of the clavicle"}, {"id": "ANA-L1-015", "text": "Fracture of the clavicle: the arm is {{c1::dropped}} (distal fragment pulled inferiorly by the arm)", "extra": "Official key (Anatomy quiz 2). Pamphlet: 'distal fragment pulled inferiorly by the arm'.", "sec": "Part 01 · 1.3 Fracture of the clavicle"}, {"id": "ANA-L1-016", "text": "Fracture of the clavicle — treatment: usually {{c1::nonoperative}}", "extra": "Not rapid surgical intervention.", "sec": "Part 01 · 1.3 Fracture of the clavicle"}, {"id": "ANA-L1-017", "text": "Joint type — sternoclavicular: {{c1::saddle synovial}}; acromioclavicular: {{c2::plane synovial}}", "extra": "SC = Saddle, AC = flAt (plane).", "sec": "Part 02 · 2.4 SC vs AC joint at a glance"}, {"id": "ANA-L1-018", "text": "SC joint articular surfaces: {{c1::sternal end of the clavicle}} ↔ {{c2::clavicular notch of the manubrium sterni}} + upper surface of the {{c3::1st costal cartilage}}", "extra": "", "sec": "Part 02 · 2.1 Sternoclavicular (SC) joint"}, {"id": "ANA-L1-019", "text": "The articular surfaces of the SC joint are covered by {{c1::fibrocartilage}}", "extra": "", "sec": "Part 02 · 2.1 Sternoclavicular (SC) joint"}, {"id": "ANA-L1-020", "text": "SC joint articular disc: {{c1::fibrocartilaginous}}, attached to the capsule; divides the joint into {{c2::two cavities}}", "extra": "", "sec": "Part 02 · 2.1 Sternoclavicular (SC) joint"}, {"id": "ANA-L1-021", "text": "The SC joint capsule is reinforced by the {{c1::anterior & posterior sternoclavicular}} ligaments", "extra": "They only reinforce the capsule — the main stabilizer is the costoclavicular ligament.", "sec": "Part 02 · 2.1 Sternoclavicular (SC) joint"}, {"id": "ANA-L1-022", "text": "Costoclavicular ligament: just {{c1::lateral}} to the SC joint; connects the clavicle to the {{c2::1st costal cartilage and 1st rib}}", "extra": "Very strong.", "sec": "Part 02 · 2.1 Sternoclavicular (SC) joint"}, {"id": "ANA-L1-023", "text": "Main stabilizer — SC joint: {{c1::costoclavicular}} ligament; AC joint: {{c2::coracoclavicular}} ligament", "extra": "Both are 'C…clavicular'; not the sternoclavicular / acromioclavicular ligaments.", "sec": "Part 02 · 2.4 SC vs AC joint at a glance"}, {"id": "ANA-L1-024", "text": "AC joint articular surfaces: {{c1::acromial end of the clavicle}} ↔ {{c2::clavicular facet of the acromion}}", "extra": "", "sec": "Part 02 · 2.2 Acromioclavicular (AC) joint"}, {"id": "ANA-L1-025", "text": "The acromioclavicular ligament covers the {{c1::upper aspect}} of the AC joint", "extra": "", "sec": "Part 02 · 2.2 Acromioclavicular (AC) joint"}, {"id": "ANA-L1-026", "text": "Coracoclavicular ligament: extremely strong; 2 parts — {{c1::trapezoid}} + {{c2::conoid}}", "extra": "'Two Cords' = Trapezoid + Conoid.", "sec": "Part 02 · 2.2 Acromioclavicular (AC) joint"}, {"id": "ANA-L1-027", "text": "AC joint separation: fall onto the shoulder / outstretched arm → acromion pushed {{c1::under the clavicle}} → {{c2::coracoclavicular}} ligament torn", "extra": "Happens despite the strong ligaments.", "sec": "Part 02 · 2.3 Acromioclavicular joint separation"}, {"id": "ANA-L1-028", "text": "Scapular movements (= movements of the shoulder girdle), 3 opposing pairs: {{c1::elevation / depression}} · {{c2::protraction / retraction}} · {{c3::upward / downward rotation}}", "extra": "Six movements in total.", "sec": "Part 03 · 3.1 The six movements"}, {"id": "ANA-L1-029", "text": "Protraction = {{c1::forward}} movement of the scapula; retraction = {{c2::backward}} movement", "extra": "", "sec": "Part 03 · 3.1 The six movements"}, {"id": "ANA-L1-030", "text": "Upward rotation of the scapula = {{c1::lateral}} rotation; downward rotation = {{c2::medial}} rotation", "extra": "The lecture uses both names.", "sec": "Part 03 · 3.1 The six movements"}, {"id": "ANA-L1-031", "text": "Raising the arm above 90° needs {{c1::upward (lateral) rotation}} of the scapula", "extra": "Produced by trapezius acting with serratus anterior.", "sec": "Part 03 · 3.1 The six movements"}, {"id": "ANA-L1-032", "text": "The 4 muscles of the pectoral region: {{c1::pectoralis major}} · {{c2::pectoralis minor}} · {{c3::serratus anterior}} · {{c4::subclavius}}", "extra": "2 P + 2 S.", "sec": "Part 04 · 4.1 The pectoral region"}, {"id": "ANA-L1-033", "text": "Pectoralis minor attachments: {{c1::upper ribs}} → {{c2::coracoid process}} of the scapula", "extra": "", "sec": "Part 04 · 4.2 Pectoralis minor & subclavius"}, {"id": "ANA-L1-034", "text": "Pectoralis minor action on the scapula: {{c1::protraction}} + {{c2::depression}}", "extra": "Serratus anterior protracts and rotates; pectoralis minor protracts and depresses.", "sec": "Part 04 · 4.2 Pectoralis minor & subclavius"}, {"id": "ANA-L1-035", "text": "Subclavius attachments: {{c1::first rib & its costal cartilage}} → {{c2::clavicle}}", "extra": "", "sec": "Part 04 · 4.2 Pectoralis minor & subclavius"}, {"id": "ANA-L1-036", "text": "Subclavius — nerve: {{c1::nerve to subclavius}}; action: {{c2::stabilizes the clavicle}}", "extra": "GD key: the nerve to subclavius is a branch of the upper trunk of the brachial plexus (C5, C6).", "sec": "Part 04 · 4.2 Pectoralis minor & subclavius"}, {"id": "ANA-L1-037", "text": "Serratus anterior attachments: {{c1::upper 8 or 9 ribs}} (anteriorly) → {{c2::medial border of the scapula}} (posteriorly)", "extra": "", "sec": "Part 04 · 4.3 Serratus anterior"}, {"id": "ANA-L1-038", "text": "Serratus anterior nerve supply: {{c1::long thoracic nerve}}", "extra": "", "sec": "Part 04 · 4.3 Serratus anterior"}, {"id": "ANA-L1-039", "text": "Serratus anterior actions: {{c1::protraction}} of the scapula + {{c2::lateral (upward) rotation}} by its {{c3::lower 5 digitations}} → raises the arm above 90°", "extra": "Pectoralis minor also protracts, but only serratus anterior rotates.", "sec": "Part 04 · 4.3 Serratus anterior"}, {"id": "ANA-L1-040", "text": "The long thoracic nerve may be injured in {{c1::radical mastectomy}} → paralysis of {{c2::serratus anterior}}", "extra": "", "sec": "Part 04 · 4.4 Long thoracic nerve injury"}, {"id": "ANA-L1-041", "text": "Serratus anterior paralysis: {{c1::weakness in abduction of the arm above 90°}} · {{c2::the arm cannot be used to push with}} · {{c3::winging of the scapula}}", "extra": "", "sec": "Part 04 · 4.4 Long thoracic nerve injury"}, {"id": "ANA-L1-042", "text": "Winging of the scapula: the {{c1::medial}} and {{c2::inferior}} borders of the scapula become prominent", "extra": "", "sec": "Part 04 · 4.4 Long thoracic nerve injury"}, {"id": "ANA-L1-043", "text": "Winging of the scapula = paralysis of {{c1::serratus anterior}} ({{c2::long thoracic}} nerve)", "extra": "Not trapezius, levator scapulae or the pectorals; trapezius paralysis → sagging shoulder.", "sec": "Part 04 · 4.4 Long thoracic nerve injury"}, {"id": "ANA-L1-044", "text": "Clinical test for serratus anterior: the patient {{c1::pushes against the wall}} → the scapula wings", "extra": "", "sec": "Part 04 · 4.4 Long thoracic nerve injury"}, {"id": "ANA-L1-045", "text": "Back muscles moving the shoulder girdle — superficial layer: {{c1::trapezius}}; deep layer: {{c2::levator scapulae}} · {{c3::rhomboid minor & major}}", "extra": "", "sec": "Part 05 · 5.1 Two layers"}, {"id": "ANA-L1-046", "text": "Trapezius attachments: {{c1::skull & upper half of the vertebral column}} → {{c2::scapula & clavicle}}", "extra": "", "sec": "Part 05 · 5.2 Trapezius"}, {"id": "ANA-L1-047", "text": "Trapezius nerve supply: {{c1::spinal part of the accessory nerve}} (cranial nerve {{c2::XI}})", "extra": "Not the dorsal scapular nerve.", "sec": "Part 05 · 5.2 Trapezius"}, {"id": "ANA-L1-048", "text": "Muscle NOT supplied by the brachial plexus (vs levator scapulae, serratus anterior, pectoralis major, latissimus dorsi): {{c1::trapezius}}", "extra": "Its nerve is cranial: spinal accessory (XI). Formative 1 key.", "sec": "Part 05 · 5.2 Trapezius"}, {"id": "ANA-L1-049", "text": "The accessory nerve (XI) arises by rootlets from the spinal cord ({{c1::C1–C5}}) and innervates {{c2::sternocleidomastoid}} & trapezius", "extra": "", "sec": "Part 05 · 5.2 Trapezius"}, {"id": "ANA-L1-050", "text": "Trapezius fibers, top → bottom: upper {{c1::elevate}} · middle {{c2::retract}} · lower {{c3::depress}} the scapula", "extra": "E · R · D.", "sec": "Part 05 · 5.2 Trapezius"}, {"id": "ANA-L1-051", "text": "Trapezius paralysis: {{c1::weakness in raising the arm above 90°}} · {{c2::weakness in retraction of the scapula}} · {{c3::flattening of the lower neck}} · {{c4::sagging of the shoulder}}", "extra": "Nerve: spinal accessory.", "sec": "Part 05 · 5.3 Paralysis of trapezius"}, {"id": "ANA-L1-052", "text": "Both paralyses weaken raising the arm above 90°; the extra sign — serratus anterior: {{c1::winging of the scapula}}; trapezius: {{c2::sagging shoulder & weak retraction}}", "extra": "They rotate the scapula together.", "sec": "Part 05 · 5.3 Paralysis of trapezius"}, {"id": "ANA-L1-053", "text": "Levator scapulae attachments: {{c1::transverse processes of C1–C4}} → {{c2::superior angle (medial border) of the scapula}}", "extra": "", "sec": "Part 05 · 5.4 Deep layer — levator scapulae & rhomboids"}, {"id": "ANA-L1-054", "text": "Levator scapulae actions: {{c1::elevates the scapula}} + {{c2::medial (downward) rotation}}", "extra": "", "sec": "Part 05 · 5.4 Deep layer — levator scapulae & rhomboids"}, {"id": "ANA-L1-055", "text": "Rhomboid minor & major: vertebral column → {{c1::medial border of the scapula}}; actions: {{c2::retraction}} + {{c3::medial (downward) rotation}}", "extra": "Rhomboid minor lies above major.", "sec": "Part 05 · 5.4 Deep layer — levator scapulae & rhomboids"}, {"id": "ANA-L1-056", "text": "The dorsal scapular nerve supplies: {{c1::levator scapulae}} · {{c2::rhomboid minor}} · {{c3::rhomboid major}}", "extra": "Deep three, one nerve — all run from the vertebral column to the medial border.", "sec": "Part 05 · 5.4 Deep layer — levator scapulae & rhomboids"}, {"id": "ANA-L1-057", "text": "The axilla: a {{c1::pyramidal}} space between the upper part of the arm and the chest — {{c2::1 apex, 1 base and 4 walls}}", "extra": "", "sec": "Part 06 · 6.1 Definition & shape"}, {"id": "ANA-L1-058", "text": "Apex of the axilla = the {{c1::cervicoaxillary canal}} (triangular)", "extra": "Trap: not the base (skin & fascia) or a wall.", "sec": "Part 06 · 6.2 Apex & base"}, {"id": "ANA-L1-059", "text": "Cervicoaxillary canal (apex of the axilla) boundaries — anterior: {{c1::clavicle}} · posterior: {{c2::upper border of the scapula}} · medial: {{c3::outer border of the 1st rib}}", "extra": "C · S · R.", "sec": "Part 06 · 6.2 Apex & base"}, {"id": "ANA-L1-060", "text": "Base of the axilla: {{c1::skin & fascia}}", "extra": "", "sec": "Part 06 · 6.2 Apex & base"}, {"id": "ANA-L1-061", "text": "Axillary folds — anterior: {{c1::pectoralis major}}; posterior: {{c2::latissimus dorsi & teres major}}", "extra": "", "sec": "Part 06 · 6.2 Apex & base"}, {"id": "ANA-L1-062", "text": "Anterior wall of the axilla: {{c1::pectoralis major}} · {{c2::pectoralis minor}} · {{c3::subclavius}} · {{c4::clavipectoral fascia}}", "extra": "", "sec": "Part 06 · 6.3 The four walls"}, {"id": "ANA-L1-063", "text": "Posterior wall of the axilla: {{c1::subscapularis}} · {{c2::teres major}} · {{c3::latissimus dorsi}}", "extra": "Trapezius forms no wall of the axilla.", "sec": "Part 06 · 6.3 The four walls"}, {"id": "ANA-L1-064", "text": "Medial wall of the axilla: {{c1::serratus anterior}} + the {{c2::first 4 ribs}} with their intercostal muscles", "extra": "", "sec": "Part 06 · 6.3 The four walls"}, {"id": "ANA-L1-065", "text": "Lateral wall of the axilla: narrow (anterior & posterior walls {{c1::converge}}); bounded by the {{c2::humerus}}, {{c3::coracobrachialis}} & {{c4::biceps brachii}}", "extra": "Bone + arm muscles, vs the muscular m   const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {
  const st = lst(L.id, () => ({n: 0, wrong: 0, shake: null, order: shuffled(L.steps.map((_, i) => i), L.id + 's')}));
  const done = st.n >= L.steps.length; if (done) labDone(L.id);
  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>
   <div class="seqline">${st.n ? L.steps.slice(0, st.n).map((s, i) => `<span class="n">${i + 1}</span><span class="chip ok">${esc(s)}</span>`).join('') : '<span class="muted" style="font-size:.78em">Your order appears here.</span>'}</div>
   <div class="pool">${st.order.filter(i => i >= st.n).map(i => `<button class="chip ${st.shake === i ? 'shake' : ''}" data-act="qpick" data-l="${L.id}" data-i="${i}">${esc(L.steps[i])}</button>`).join('')}</div>
   ${done ? `<div class="done">✓ Correct order${L.mnemonic ? ' — ' + esc(L.mnemonic) : ''}${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ''}</div>` : (st.wrong ? `<div class="muted" style="font-size:.78em">Wrong tries: ${st.wrong}</div>` : '')}
   <div class="row"><button class="btn" data-act="qreset" data-l="${L.id}">Start again</button></div>`;
};
// --- labelled diagram ---
const DRAW = {};
LAB.diagram = L => {
  const st = lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.pins.map(p => p.id), L.id)}));
  const pins = L.pins.map((p, i) => {
    const shown = st.mode === 'labels' || (st.mode === 'test' && st.rev[p.id]);
    let c = st.mode === 'test' && st.rev[p.id] ? 'on' : '';
    if (st.mode === 'find' && st.fb && st.fb[2] === p.id) c = st.fb[0];
    const lx = p.lx !== undefined ? p.lx : p.x + 9, anchor = p.anchor || 'start';
    return `<g class="pinbtn ${c}" data-act="pin" data-l="${L.id}" data-id="${p.id}"><circle class="d" cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x}" y="${p.y + 2.8}" text-anchor="middle">${i + 1}</text>${shown ? `<text class="plab" x="${lx}" y="${p.ly !== undefined ? p.ly : p.y + 3}" text-anchor="${anchor}">${esc(p.short || p.name)}</text>` : ''}</g>`;
  }).join('');
  let info;
  if (st.mode === 'labels') info = `<span class="muted">All labels shown. Switch to "Test me" (tap a number to reveal it) or "Find it" (find the named structure).</span>`;
  else if (st.mode === 'test') info = `<span class="muted">Say the name of each numbered structure, then tap it to check. Revealed ${Object.keys(st.rev).length} of ${L.pins.length}.</span>`;

    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Choose "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(L.pins.find(p => p.id === st.order[st.qi]).name)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its number · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  }
  return `<div class="modes">${[['labels', 'Labels on'], ['test', 'Test me'], ['find', 'Find it']].map(([m, n]) => `<button class="mini ${st.mode === m ? 'on' : ''}" data-act="dmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}</div>
   <div class="svgw"><svg viewBox="${L.viewBox}" role="img" aria-label="${esc(L.title)}">${DRAW[L.draw] ? DRAW[L.draw]() : ''}${pins}</svg></div>
   ${st.mode === 'labels' ? `<ol class="key">${L.pins.map(p => `<li>${esc(p.name)}</li>`).join('')}</ol>` : st.mode === 'test' ? `<ol class="key">${L.pins.map(p => `<li>${st.rev[p.id] ? esc(p.name) : '<span class="muted">tap ' + (L.pins.indexOf(p) + 1) + ' to check</span>'}</li>`).join('')}</ol>` : ''}<div class="info">${info}</div>`;
};

A.cover = a => { const t = TB[a.dataset.t]; t.cv = !t.cv; t.rev = {}; rerender(pageOf(a)); };
A.rev = a => { const t = TB[a.dataset.t]; t.rev[a.dataset.c] = 1; rerender(pageOf(a)); };
A.ans = a => { const q = QS[a.dataset.q], i = +a.dataset.i; const ok = i === q.ans; S.ans[q.id] = {pick: i, ok, t: Date.now()}; if (ok) delete S.mist[q.id]; else S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.retry = a => { delete S.ans[a.dataset.q]; save(); rerender(pageOf(a)); };
A.pred = a => { const p = S.pred[a.dataset.q] || {}; if (p.lift) return; p.pick = +a.dataset.i; S.pred[a.dataset.q] = p; save(); rerender(pageOf(a)); };
A.lift = a => { const q = QS[a.dataset.q]; const p = S.pred[q.id]; p.lift = 1; if (p.pick !== q.ans) S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.flap = a => { S.flap[a.dataset.q] = 1; save(); rerender(pageOf(a)); };
A.self = a => { S.self[a.dataset.q] = a.dataset.v; save(); rerender(pageOf(a)); };
const rcst = id => { const st = S.labs[id] || (S.labs[id] = {}); st.r = st.r || {}; return st; };
A.rcv = a => { const st = rcst(a.dataset.l), i = a.dataset.i; if (st.r[i]) delete st.r[i]; else st.r[i] = 1; save(); rerender(pageOf(a)); };
A.rcall = a => { const st = rcst(a.dataset.l); for (let i = 0; i < +a.dataset.n; i++) st.r[i] = 1; save(); rerender(pageOf(a)); };
A.rcno = a => { const st = rcst(a.dataset.l); st.r = {}; save(); rerender(pageOf(a)); };
// labs
A.map = a => { const L = LABS[a.dataset.l], st = LS[L.id];
  if (st.mode === 'explore') st.sel = st.sel === a.dataset.id ? null : a.dataset.id;
  else if (st.qi < L.tests.length){ const t = L.tests[st.order[st.qi]]; if (a.dataset.id === t.a){ st.score += st.fb && st.fb[0] === 'bad' ? 0 : 1; st.qi++; st.fb = null; toast('✓ Correct'); } else st.fb = ['bad', 'Not this one — ' + L.regions.find(r => r.id === a.dataset.id).name + '. Try again.']; }
  rerender(pageOf(a)); };
A.mapmode = a => { const st = LS[a.dataset.l]; st.mode = a.dataset.v; st.sel = null; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(st.order, String(Date.now())); rerender(pageOf(a)); };
A.g = a => { const L = LABS[a.dataset.l], st = gstate(L), t = a.dataset.t, id = a.dataset.id;
  if (st.mode === 'explore') st.sel = st.sel && st.sel[0] === t && st.sel[1] === id ? null : [t, id];
  else if (t === 'n') st.cut[id] = !st.cut[id];
  rerender(pageOf(a)); };
A.gmode = a => { const st = gstate(LABS[a.dataset.l]); st.mode = a.dataset.v; st.sel = null; rerender(pageOf(a)); };
A.gclear = a => { const st = gstate(LABS[a.dataset.l]); st.cut = {}; rerender(pageOf(a)); };
A.gcase = a => { const L = LABS[a.dataset.l], st = gstate(L), c = L.cases[+a.dataset.i]; st.cut = {}; c.cut.forEach(n => st.cut[n] = true); labDone(L.id); rerender(pageOf(a)); };
A.spick = a => { const st = LS[a.dataset.l]; st.sel = st.sel === a.dataset.id ? null : a.dataset.id; st.shake = null; rerender(pageOf(a)); };
A.sdrop = a => { const L = LABS[a.dataset.l], st = LS[L.id]; if (!st.sel) return; const it = L.items.find(x => x.id === st.sel);
  if (it.bin === a.dataset.b){ st.placed[it.id] = it.bin; st.sel = null; st.shake = null; } else { st.wrong++; st.shake = it.id; toast('Not there — try another box'); }
  rerender(pageOf(a)); };
A.sreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.qpick = a => { const L = LABS[a.dataset.l], st = LS[L.id], i = +a.dataset.i; if (i === st.n){ st.n++; st.shake = null; } else { st.wrong++; st.shake = i; } rerender(pageOf(a)); };
A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find'){ if (st.qi >= st.order.length) return; const t = st.order[st.qi];
    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }
    else st.fb = ['bad', 'Not that one. Try again.', id, t]; }
  else st.sel = st.sel === id ? null : id;
  slre(a); };
A.slmv = a => { const st = slst(LABS[a.dataset.l]); st.mv = st.mv === a.dataset.id ? null : a.dataset.id; slre(a); };
A.slcut = a => { const st = slst(LABS[a.dataset.l]); st.cut[a.dataset.id] = !st.cut[a.dataset.id]; slre(a); };
A.slbig = a => { const L = LABS[a.dataset.l]; ov(L.title || 'Practical slide', `<div class="slbig" data-big="${L.id}">${LAB.slide(L, true)}</div>`, 'wide'); };
function slre(a){
  const big = a.closest('[data-big]');
  if (big){ big.innerHTML = LAB.slide(LABS[big.dataset.big], true); const i = pageOf(document.querySelector(`#pgL [data-l="${big.dataset.big}"], #pgR [data-l="${big.dataset.big}"]`) || document.body); if (i >= 0) rerender(i); return; }
  rerender(pageOf(a));
}
A.dmode = a => { const L = LABS[a.dataset.l], st = LS[L.id]; st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(L.pins.map(p => p.id), String(Date.now())); rerender(pageOf(a)); };
A.pin = a => { const L = LABS[a.dataset.l], st = LS[L.id], id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find' && st.qi < st.order.length){ const t = st.order[st.qi];
    if (id === t){ st.score += st.fb && st.fb[0] === 'bad' && st.fb[3] === t ? 0 : 1; st.qi++; st.fb = ['ok', '✓ Correct', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; rerender(pageOf(document.querySelector(`[data-l="${L.id}"]`) || a)); } }, 700); }
    else st.fb = ['bad', 'That is ' + L.pins.find(p => p.id === id).name + '. Try again.', id, t]; }
  rerender(pageOf(a)); };
