": "part", "no": "07", "title": "Concepts Compared", "sub": "Curves of the vertebral column · Back muscles — nerve and action at a glance"}, {"t": "h", "no": "7.1", "title": "Curves of the vertebral column"}, {"t": "list", "items": ["<b>Cervical:<\/b> secondary, 3rd–4th month, convex anteriorly", "<b>Thoracic:<\/b> primary, present at birth; exaggerated = kyphosis", "<b>Lumbar:<\/b> secondary, 12th–18th month; exaggerated = lordosis", "<b>Sacral:<\/b> primary, accommodates abdomino-pelvic organs", "Scoliosis not tied to one curve in the lecture"]}], "toc": ["07", "Concepts Compared"]}, {"id": "p46", "head": "Part 07 · Concepts Compared", "kind": "text", "blocks": [{"t": "h", "no": "7.2", "title": "Back muscles — nerve and action at a glance"}, {"t": "list", "items": ["<b>Extrinsic:<\/b> trapezius, latissimus dorsi, rhomboids; triangle of auscultation", "<b>Intermediate:<\/b> serratus posterior superior and inferior; intercostal nerves; respiration", "<b>Intrinsic:<\/b> splenius, erector spinae, transverso-spinalis; dorsal primary rami; extend trunk"]}]}, {"id": "p47", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l10-6-0", "title": "Recall · Concepts Compared", "groups": [{"title": "7.1 Curves of the vertebral column", "items": [["Cervical:", "secondary, 3rd–4th month, convex anteriorly"], ["Thoracic:", "primary, present at birth; exaggerated = kyphosis"], ["Lumbar:", "secondary, 12th–18th month; exaggerated = lordosis"], ["Sacral:", "primary, accommodates abdomino-pelvic organs"], ["Scoliosis not tied", "to one curve in the lecture"]]}, {"title": "7.2 Back muscles — nerve and action at a glance", "items": [["Extrinsic:", "trapezius, latissimus dorsi, rhomboids; triangle of auscultation"], ["Intermediate:", "serratus posterior superior and inferior; intercostal nerves; respiration"], ["Intrinsic:", "splenius, erector spinae, transverso-spinalis; dorsal primary rami; extend trunk"]]}]}], "labName": "Recall · Concepts Compared"}, {"id": "p48", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Primary curves thoracic and sacral; secondary cervical and lumbar", "Joints between arches synovial; between bodies secondary cartilaginous", "Flexion makes posterior longitudinal ligament tense", "Vertebral body derived from sclerotome of two adjacent somites", "Notochord forms nucleus pulposus"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["7 · 12 · 5 + sacrum + coccyx = 26 bones", "Primary = Place for organs; Secondary = Support weight", "Notochord → Nucleus; Sclerotome → Surrounding annulus"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p49", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "list", "items": ["-melia = limb; -dactyly = digits"]}]}, {"id": "p50", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l10-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Primary curves thoracic", "and sacral; secondary cervical and lumbar"], ["Joints between arches", "synovial; between bodies secondary cartilaginous"], ["Flexion makes", "posterior longitudinal ligament tense"], ["Vertebral body derived", "from sclerotome of two adjacent somites"], ["Notochord forms", "nucleus pulposus"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["7 · 12 · 5 + sacrum + coccyx =", "26 bones"], ["Primary =", "Place for organs; Secondary = Support weight"], ["Notochord →", "Nucleus; Sclerotome → Surrounding annulus"], ["-melia =", "limb; -dactyly = digits"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p51", "head": "Real images · 1 of 2", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one. Every slide of the session is in the practical book: <a href=\"prac-ana-4.html\">Anatomy practical · Practical 4 – Leg, foot &amp; vertebral column<\/a>."}, {"t": "lab", "lab": "sl99"}], "toc": ["◉", "Real images from the practical"], "labName": "Leg, foot & vertebral column · slide 20"}, {"id": "p52", "head": "Real images · 2 of 2", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl105"}], "labName": "Leg, foot & vertebral column · slide 26"}, {"id": "p53", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "h", "no": "?", "title": "Name it — spotter practice"}, {"t": "note", "kind": "hy", "title": "How it works", "html": "3 pictures from the practical slides of this lecture, each with its title and every label covered, in a new order. Say what it is out loud, then pick. Every one is also in Exam mode."}], "toc": ["?", "Name it — spotter practice"]}, {"id": "p54", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-103"}, {"t": "check", "q": "PRQ-100"}]}, {"id": "p55", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-101"}]}, {"id": "p56", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Thoracic and sacral curves are primary; cervical and lumbar are secondary"}, {"t": "note", "kind": "trap", "html": "Joints between arches = synovial; between bodies = secondary cartilaginous"}, {"t": "note", "kind": "trap", "html": "IVDs are absent between C1 and C2 (and in sacrum, coccyx)"}, {"t": "note", "kind": "trap", "html": "End plates are both hyaline and fibrocartilage"}, {"t": "note", "kind": "trap", "html": "Supraspinous ligament runs C7 → sacrum; ligamentum nuchae in the neck"}, {"t": "note", "kind": "trap", "html": "Serratus posterior → intercostal nerves; intrinsic back muscles → dorsal primary rami"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p57", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Coccygeal vertebrae: 3–5 (text) vs 4 or 5 (figure)"}, {"t": "note", "kind": "cl", "html": "Kyphosis (thoracic round-back), lordosis (lumbar swayback), scoliosis (lateral curvature)"}, {"t": "note", "kind": "cl", "html": "Herniated disc: nucleus pulposus breaks through annulus into vertebral canal, compressing spinal nerves → pain"}, {"t": "note", "kind": "cl", "html": "Triangle of auscultation: no musculature, so respiratory sounds heard clearly with stethoscope"}, {"t": "note", "kind": "cl", "html": "Limb anomalies: amelia, meromelia, syndactyly, polydactyly, brachydactyly, club foot, cleft (lobster claw) hand/foot"}]}, {"id": "p58", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0008": {"id": "Q0008", "stem": "Which of the following muscles is NOT a part of the erector spinae muscle?", "top": false, "rep": "", "tag": "Final bank ANA Q128", "bank": true, "expl": "The erector spinae is formed of three parallel columns: spinalis (most medial), longissimus (intermediate) and iliocostalis (lateral). Splenius is a separate subgroup of the intrinsic back muscles, alongside the erector spinae and the transverso-spinalis.", "type": "mcq", "opts": ["Longissimus", "Iliocostalis", "Splenius", "Spinalis"], "ans": 2}, "Q0016": {"id": "Q0016", "stem": "What does the remaining part of the notochord (between the bodies of the vertebrae) give rise to?", "top": false, "rep": "", "tag": "Final bank ANA W45", "bank": true, "expl": "During development the notochord within the vertebral bodies degenerates, and the part between the bodies forms the nucleus pulposus; the surrounding sclerotome forms the annulus fibrosus (4.1, 'required to study').", "type": "written", "keyhtml": "The nucleus pulposus of the intervertebral disc.\n• The notochord within the vertebral bodies degenerates.\n• Between the bodies of the vertebrae, the notochord forms the nucleus pulposus, whereas the surrounding sclerotome forms the annulus fibrosus."}, "Q0046": {"id": "Q0046", "stem": "Name the components of the intervertebral disc (IVD) and give one feature of each.", "top": false, "rep": "", "tag": "Final bank ANA W46", "bank": true, "expl": "The pamphlet's IVD table lists the annulus fibrosus (outer fibrocartilage), the nucleus pulposus (gelatinous shock-absorbing core) and the vertebral end plates (hyaline and fibrocartilage covering the upper and lower surfaces).", "type": "written", "keyhtml": "• Annulus fibrosus: outer layer of fibrocartilage attaching the disc to the bodies of the adjacent vertebrae.\n• Nucleus pulposus: elastic, gelatinous core enabling the disc to absorb the shocks between the vertebral bodies.\n• Vertebral end plates: cover the upper and lower surfaces of the disc; formed of both hyaline and fibrocartilage."}, "Q0048": {"id": "Q0048", "stem": "In the development of the vertebral bodies and the intervertebral discs, which structures are derived from the sclerotome of the somites?", "top": false, "rep": "", "tag": "Final bank ANA W47", "bank": true, "expl": "Each vertebral body is derived from the sclerotome of two adjacent somites, and between the bodies the surrounding sclerotome forms the annulus fibrosus. Only the nucleus pulposus comes from the notochord.", "type": "written", "keyhtml": "• The vertebral body: each vertebral body is an intersegmental structure derived from the sclerotome of two adjacent somites (sclerotome cells migrate to surround the notochord and the neural tube during the 4th week IU).\n• The annulus fibrosus of the intervertebral disc: formed by the sclerotome surrounding the notochord between the vertebral bodies.\n(The nucleus pulposus is not derived from the sclerotome; it is formed by the notochord.)"}, "N-ANA-L10-01": {"id": "N-ANA-L10-01", "stem": "A 15-month-old child has just learned to stand without support. At birth, the child's vertebral column had only a primary curve, concave anteriorly. Which curve is developing in the child's vertebral column at this age?", "top": false, "rep": "", "tag": "Final bank ANA Q129", "bank": true, "expl": "The lumbar region develops a secondary curve, convex anteriorly, at the 12th–18th month as the child learns to stand, balancing the weight of the trunk over the lower limbs. The cervical secondary curve appears earlier, at the 3rd–4th month, as the infant learns to balance the head; the thoracic and sacral curves are primary.", "type": "mcq", "opts": ["Cervical curve — a secondary curve", "Lumbar curve — a secondary curve", "Lumbar curve — a primary curve", "Thoracic curve — a primary curve", "Sacral curve — a secondary curve"], "ans": 1}, "N-ANA-L10-02": {"id": "N-ANA-L10-02", "stem": "A physician examines a patient's back from the side and notes an exaggerated curve giving the patient a swayback appearance. Which of the following correctly names and describes this abnormal curve?", "top": false, "rep": "", "tag": "Final bank ANA Q130", "bank": true, "expl": "Lordosis is an exaggerated lumbar curve causing a swayback appearance. Kyphosis is an exaggerated thoracic curve causing a round-back appearance, and scoliosis is an abnormal lateral curvature.", "type": "mcq", "opts": ["Kyphosis — exaggerated thoracic curve", "Scoliosis — abnormal lateral curvature", "Kyphosis — exaggerated lumbar curve", "Lordosis — exaggerated lumbar curve", "Lordosis — exaggerated thoracic curve"], "ans": 3}, "N-ANA-L10-03": {"id": "N-ANA-L10-03", "stem": "A 45-year-old man presents with severe back pain. MRI shows a herniated intervertebral disc with material protruding into the vertebral canal and compressing a spinal nerve. Which structure has protruded into the vertebral canal?", "top": false, "rep": "", "tag": "Final bank ANA Q131", "bank": true, "expl": "In a herniated disc, the nucleus pulposus breaks through the annulus fibrosus, protrudes into the vertebral canal and compresses the spinal nerves, causing pain. The annulus fibrosus is the outer fibrocartilage ring that is breached, not the part that protrudes.", "type": "mcq", "opts": ["Annulus fibrosus", "Vertebral end plate", "Nucleus pulposus", "Ligamentum flavum"], "ans": 2}, "N-ANA-L10-04": {"id": "N-ANA-L10-04", "stem": "Which of the following correctly describes the joints between the vertebral arches of adjacent vertebrae?", "top": false, "rep": "", "tag": "Final bank ANA Q132", "bank": true, "expl": "The joints between the vertebral arches lie between the superior and inferior articular processes and are plane (gliding) synovial joints allowing little flexion-extension and rotation. Secondary cartilaginous joints are those between the vertebral bodies (the intervertebral discs).", "type": "mcq", "opts": ["Between the laminae; plane (gliding) synovial joints", "Between the superior and inferior articular processes; secondary cartilaginous joints", "Between the superior and inferior articular processes; plane (gliding) synovial joints", "Between the laminae; secondary cartilaginous joints", "Between the spinous processes; secondary cartilaginous joints"], "ans": 2}, "N-ANA-L10-05": {"id": "N-ANA-L10-05", "stem": "A gymnast bends her trunk forwards to touch her toes. During this flexion of the vertebral column, which ligament becomes tense and in which direction is the nucleus pulposus displaced?", "top": false, "rep": "", "tag": "Final bank ANA Q133", "bank": true, "expl": "Flexion (bending anteriorly) makes the posterior longitudinal ligament tense and compresses the nucleus pulposus posteriorly, because movement of the column displaces the nucleus to the opposite direction. Extension (bending posteriorly) does the reverse: the anterior longitudinal ligament becomes tense and the nucleus is pushed anteriorly.", "type": "mcq", "opts": ["Anterior longitudinal ligament; nucleus pulposus displaced anteriorly", "Posterior longitudinal ligament; nucleus pulposus displaced anteriorly", "Anterior longitudinal ligament; nucleus pulposus displaced posteriorly", "Posterior longitudinal ligament; nucleus pulposus displaced posteriorly"], "ans": 3}, "N-ANA-L10-06": {"id": "N-ANA-L10-06", "stem": "During the 4th week of intrauterine life, sclerotome cells migrate to surround the notochord and the neural tube. Each vertebral body that forms is described as an intersegmental structure because it is derived from which of the following?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Each vertebral body is an intersegmental structure derived from the sclerotome of two adjacent somites. The notochord within the vertebral bodies degenerates and forms only the nucleus pulposus between the bodies.", "type": "mcq", "opts": ["The sclerotome of two adjacent somites", "The sclerotome of a single somite", "The notochord", "The neural tube", "The lateral plate mesoderm"], "ans": 0}, "N-ANA-L10-07": {"id": "N-ANA-L10-07", "stem": "A physician wants to listen to a patient's breath sounds from the back. She places the stethoscope over a space where the absence of musculature allows respiratory sounds to be heard clearly. Which structures bound this space?", "top": false, "rep": "", "tag": "Final bank ANA Q134", "bank": true, "expl": "The triangle of auscultation is bounded by the lower border of the trapezius, the latissimus dorsi and the medial margin of the scapula; the absence of musculature here lets respiratory sounds be heard clearly with a stethoscope. It is the medial, not the lateral, margin of the scapula that forms a boundary.", "type": "mcq", "opts": ["Lower border of trapezius, rhomboid major and medial margin of the scapula", "Lower border of trapezius, latissimus dorsi and lateral margin of the scapula", "Rhomboid minor, rhomboid major and medial margin of the scapula", "Latissimus dorsi, serratus posterior inferior and medial margin of the scapula", "Lower border of trapezius, latissimus dorsi and medial margin of the scapula"], "ans": 4}, "N-ANA-L10-08": {"id": "N-ANA-L10-08", "stem": "A newborn is found to have each upper limb represented only by a hand. Which limb anomaly does this describe?", "top": false, "rep": "", "tag": "Final bank ANA Q135", "bank": true, "expl": "Meromelia is when the limb is represented only by the hand or foot, whereas amelia is the complete absence of one or more limbs. Brachydactyly (short digits) and syndactyly (fused digits) affect only the digits.", "type": "mcq", "opts": ["Amelia", "Meromelia", "Brachydactyly", "Syndactyly", "Cleft hand (lobster claw deformity)"], "ans": 1}, "N-ANA-L10-09": {"id": "N-ANA-L10-09", "stem": "Which pair of curves of the vertebral column are the primary (accommodation) curves?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The primary (accommodation) curves are the thoracic curve, which accommodates the thoracic organs, and the sacral (pelvic) curve, which accommodates the abdomino-pelvic organs. The cervical and lumbar curves are secondary (compensation) curves that balance the weight of the head and trunk.", "type": "mcq", "opts": ["Cervical and lumbar", "Cervical and thoracic", "Thoracic and sacral", "Lumbar and sacral", "Thoracic and lumbar"], "ans": 2}, "N-ANA-L10-10": {"id": "N-ANA-L10-10", "stem": "At which of the following sites are intervertebral discs absent?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Intervertebral discs are absent in the sacrum, the coccyx and between the 1st and 2nd cervical vertebrae. Elsewhere, the bodies of adjacent vertebrae are separated by intervertebral discs.", "type": "mcq", "opts": ["Between C2 and C3", "Between C1 and C2", "Between C7 and T1", "Between T12 and L1", "Between L4 and L5"], "ans": 1}, "N-ANA-L10-11": {"id": "N-ANA-L10-11", "stem": "The vertebral end plates covering the upper and lower surfaces of the intervertebral disc are formed of which of the following?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The vertebral end plates cover the upper and lower surfaces of the disc and are formed of both hyaline and fibrocartilage. Fibrocartilage alone forms the annulus fibrosus, and the elastic, gelatinous core is the nucleus pulposus.", "type": "mcq", "opts": ["Hyaline cartilage only", "Fibrocartilage only", "Both hyaline cartilage and fibrocartilage", "Elastic, gelatinous tissue"], "ans": 2}, "N-ANA-L10-12": {"id": "N-ANA-L10-12", "stem": "At which point does the transverse process of a typical vertebra project?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A transverse process projects at the point of meeting between each pedicle and lamina. The spine (spinous process) projects at the point of fusion between the two laminae.", "type": "mcq", "opts": ["At the point of fusion between the two laminae", "At the point of meeting between the pedicle and the lamina", "From the posterior margin of the vertebral body", "At the point of meeting between the two pedicles"], "ans": 1}, "N-ANA-L10-13": {"id": "N-ANA-L10-13", "stem": "Which ligament connects the tips of the spinous processes from C7 to the sacrum?", "top": false, "rep": "", "tag": "Final bank ANA Q136", "bank": true, "expl": "The supraspinous ligament connects the tips of the spinous processes from C7 to the sacrum and is continuous with the ligamentum nuchae in the cervical region. The interspinous ligament connects adjacent spinous processes, and the ligamentum flavum connects the laminae of adjacent vertebrae.", "type": "mcq", "opts": ["Ligamentum flavum", "Interspinous ligament", "Supraspinous ligament", "Posterior longitudinal ligament", "Anterior longitudinal ligament"], "ans": 2}, "N-ANA-L10-14": {"id": "N-ANA-L10-14", "stem": "The thoracolumbar (lumbar) fascia covers the deep muscles of the back. Where is it attached?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The thoracolumbar (lumbar) fascia covers the deep muscles of the back and is attached medially to the spines of the vertebrae and inferiorly to the ilium.", "type": "mcq", "opts": ["Medially to the transverse processes and inferiorly to the ilium", "Medially to the spines of the vertebrae and inferiorly to the sacrum", "Medially to the spines of the vertebrae and inferiorly to the ilium", "Medially to the laminae and inferiorly to the sacrum"], "ans": 2}, "N-ANA-L10-15": {"id": "N-ANA-L10-15", "stem": "Which of the following back muscles is supplied by the intercostal nerves?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The serratus posterior superior and inferior form the intermediate group, associated with respiration, and are supplied by the intercostal nerves. Splenius and the erector spinae columns belong to the intrinsic group, which is innervated by the dorsal primary rami of spinal nerves.", "type": "mcq", "opts": ["Serratus posterior inferior", "Iliocostalis", "Splenius", "Longissimus", "Spinalis"], "ans": 0}, "N-ANA-L10-16": {"id": "N-ANA-L10-16", "stem": "A newborn's feet are found to be constantly plantar-flexed and inverted. Which limb anomaly is this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In club foot, the feet are plantar-flexed and inverted constantly. In cleft foot (lobster claw deformity), one or more middle digits are absent, dividing the foot into two parts with fused digits.", "type": "mcq", "opts": ["Syndactyly", "Cleft foot (lobster claw deformity)", "Brachydactyly", "Meromelia", "Club foot"], "ans": 4}, "N-ANA-L10-17": {"id": "N-ANA-L10-17", "stem": "During development, the upper and lower limbs undergo a 90° rotation about their long axes in opposite directions. Which of the following correctly describes the result?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The upper limb rotates 90° laterally (thumb) and the lower limb 90° medially (big toe); by 7 weeks this torsion makes the elbows point caudally and the knees cranially.", "type": "mcq", "opts": ["Upper limb rotates medially and elbows point caudally; lower limb rotates laterally and knees point cranially", "Upper limb rotates laterally and elbows point cranially; lower limb rotates medially and knees point caudally", "Upper limb rotates laterally and elbows point caudally; lower limb rotates medially and knees point cranially", "Upper limb rotates medially and elbows point cranially; lower limb rotates laterally and knees point caudally"], "ans": 2}, "N-ANA-L10-18": {"id": "N-ANA-L10-18", "stem": "Compare the primary and secondary curves of the vertebral column (curves included, time of appearance and function). Name the abnormal exaggeration of the thoracic and of the lumbar curve.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from Part 01: curve development in 1.2, primary vs secondary in 1.3 and the abnormal curves in 1.4 (mnemonic: Primary = Place for organs; Secondary = Support weight).", "type": "written", "keyhtml": "Primary (accommodation) curves:\n• Thoracic curve: accommodates the thoracic organs\n• Sacral (pelvic) curve: accommodates the abdomino-pelvic organs\n• Present at birth: the newborn's vertebral column has only a primary curve, concave anteriorly\nSecondary (compensation) curves:\n• Cervical curve: develops at the 3rd–4th month, convex anteriorly, as the infant learns to balance the weight of the head on the cervical vertebrae\n• Lumbar curve: develops at the 12th–18th month, convex anteriorly, as the child learns to stand, balancing the weight of the trunk over the lower limbs\nCurves develop in response to upright posture, weight bearing and musculature.\nAbnormal curves:\n• Kyphosis: exaggerated thoracic curve, causing a round-back appearance\n• Lordosis: exaggerated lumbar curve, causing a swayback appearance\n(Scoliosis is an abnormal lateral curvature.)"}, "N-ANA-L10-19": {"id": "N-ANA-L10-19", "stem": "A 45-year-old man presents with severe back pain. MRI shows that part of an intervertebral disc has protruded into the vertebral canal and is pressing on a spinal nerve.\n(a) What is the diagnosis?\n(b) Explain how this condition develops and why it causes pain.\n(c) What type of joint is formed between the vertebral bodies, and where are intervertebral discs absent?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Answers come from the herniated disc clinical note (2.4), the joints table (2.2) and the IVD notes (2.3).", "type": "written", "keyhtml": "(a) Herniated (intervertebral) disc.\n(b) The nucleus pulposus of the IVD breaks through the annulus fibrosus and protrudes into the vertebral canal, where it compresses the spinal nerves and causes pain.\n(c) The joints between the vertebral bodies are the intervertebral discs, which are secondary cartilaginous joints allowing slight movements between the bodies. IVDs are absent in the sacrum, the coccyx and between the 1st and 2nd cervical vertebrae."}, "N-ANA-L10-20": {"id": "N-ANA-L10-20", "stem": "Enumerate the subgroups of the intrinsic group of back muscles and mention three features common to all of them. Arrange the columns of the erector spinae from medial to lateral, and name the nerve supply of the intermediate (serratus posterior) group.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from 5.3 and the intermediate group table in 5.2, summarised in 7.2.", "type": "written", "keyhtml": "Subgroups of the intrinsic group:\n• Splenius\n• Erector spinae\n• Transverso-spinalis (deep to the erector spinae)\nFeatures common to all:\n• Act to extend the trunk when acting bilaterally\n• Located dorsal to the vertebral column\n• Innervated by the dorsal primary rami of spinal nerves\nErector spinae (three parallel columns), medial to lateral:\n• Spinalis (most medial) → longissimus (intermediate) → iliocostalis (lateral)\n(Mnemonic lateral → medial: 'I Love Spine')\nIntermediate group (serratus posterior superior and inferior, associated with respiration): intercostal nerves."}, "N-ANA-L10-21": {"id": "N-ANA-L10-21", "stem": "Define the following anomalies of limb development: (a) amelia, (b) meromelia, (c) syndactyly, (d) polydactyly, (e) brachydactyly, (f) club foot, (g) cleft hand or foot.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All definitions come from the 6.3 table (mnemonic: -melia = limb; -dactyly = digits).", "type": "written", "keyhtml": "(a) Amelia: complete absence of one or more limbs.\n(b) Meromelia: the limb is represented only by the hand or foot.\n(c) Syndactyly: fusion of one or more digits.\n(d) Polydactyly: supernumerary digits.\n(e) Brachydactyly: short digits.\n(f) Club foot: the feet are plantar-flexed and inverted constantly.\n(g) Cleft hand or foot (lobster claw deformity): one or more middle digits are absent, so the hand (or foot) is divided into two parts; in each part the digits are fused."}, "N-ANA-L10-22": {"id": "N-ANA-L10-22", "stem": "Which ligament connects the laminae of adjacent vertebrae?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The ligamentum flavum connects the laminae of adjacent vertebrae. The interspinous ligament connects adjacent spinous processes, and the supraspinous ligament joins their tips from C7 to the sacrum.", "type": "mcq", "opts": ["Interspinous ligament", "Supraspinous ligament", "Ligamentum flavum", "Anterior longitudinal ligament", "Posterior longitudinal ligament"], "ans": 2}, "TP-002": {"id": "TP-002", "stem": "Mention the two components of the intervertebral disc and the embryological origin of each component.", "top": true, "rep": "", "tag": "Final bank ANA W61", "bank": true, "expl": "Between the bodies of the vertebrae the notochord forms the nucleus pulposus of the intervertebral disc, whereas the surrounding sclerotome forms the annulus fibrosus; the notochord within the vertebral bodies degenerates.", "type": "written", "keyhtml": "• Nucleus pulposus: formed by the notochord (the part of the notochord between the vertebral bodies).\n• Annulus fibrosus: formed by the sclerotome surrounding the notochord."}, "PRQ-103": {"id": "PRQ-103", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Sacrum", "Tibia", "Thoracic vertebra", "Lumbar vertebra"], "ans": 0, "top": false, "rep": "", "tag": "Practical · Practical 4 – Leg, foot & vertebral column", "bank": false, "img": ["prac/q103.jpg"], "expl": "The practical slide \"2) Sacrum\" (Practical 4 – Leg, foot & vertebral column)."}, "PRQ-100": {"id": "PRQ-100", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Thoracic vertebra", "Sacrum", "Lumbar vertebra", "Fibula"], "ans": 0, "top": false, "rep": "", "tag": "Practical · Practical 4 – Leg, foot & vertebral column", "bank": false, "img": ["prac/q100.jpg"], "expl": "The practical slide \"Thoracic vertebrae\" (Practical 4 – Leg, foot & vertebral column)."}, "PRQ-101": {"id": "PRQ-101", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Lumbar vertebra", "Thoracic vertebra", "Sacrum", "Tibia"], "ans": 0, "top": false, "rep": "", "tag": "Practical · Practical 4 – Leg, foot & vertebral column", "bank": false, "img": ["prac/q101.jpg"], "expl": "The practical slide \"Lumbar vertebrae\" (Practical 4 – Leg, foot & vertebral column)."}}, "labs": {"sl99": {"id": "sl99", "type": "slide", "title": "Leg, foot & vertebral column · slide 20", "img": "prac/s099.jpg", "labels": [{"t": "Cervical vertebrae", "x": 16.24, "y": 1.35, "w": 48.76, "h": 11.15, "id": "l0"}, {"t": "atlas", "x": 33.6, "y": 35.67, "w": 12.83, "h": 11.15, "id": "l1"}, {"t": "axis", "x": 58.75, "y": 33.45, "w": 10.0, "h": 11.15, "id": "l2"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl105": {"id": "sl105", "type": "slide", "title": "Leg, foot & vertebral column · slide 26", "img": "prac/s105.jpg", "labels": [{"t": "st 1 IV disc", "x": 65.14, "y": 28.1, "w": 15.5, "h": 6.6, "id": "l0"}, {"t": "Cervical Vertebrae", "x": 61.12, "y": 71.24, "w": 24.69, "h": 23.15, "id": "l1"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "ANA-L10-001", "text": "The vertebral column = superimposed {{c1::vertebrae}} + {{c2::intervertebral discs}} in between", "extra": "", "sec": "Part 01 · 1.1 The vertebral column"}, {"id": "ANA-L10-002", "text": "Vertebrae per region: cervical {{c1::7}} · thoracic {{c2::12}} · lumbar {{c3::5}} · sacral {{c4::5 (fused → sacrum)}}", "extra": "Mnemonic: 7 · 12 · 5 — cervical, thoracic, lumbar.", "sec": "Part 01 · 1.1 The vertebral column"}, {"id": "ANA-L10-003", "text": "The vertebral column can be described as having {{c1::26}} bones: {{c2::24}} vertebrae + sacrum + coccyx", "extra": "24 = 7 cervical + 12 thoracic + 5 lumbar.", "sec": "Part 01 · 1.1 The vertebral column"}, {"id": "ANA-L10-004", "text": "Curves of the vertebral column that are convex forwards (anteriorly): {{c1::cervical & lumbar}}", "extra": "Thoracic & sacral (pelvic) are convex backwards. Convex forwards = the secondary curves.", "sec": "Part 01 · 1.1 The vertebral column"}, {"id": "ANA-L10-005", "text": "The vertebral column has {{c1::four}} natural curves", "extra": "Cervical, thoracic, lumbar, sacral.", "sec": "Part 01 · 1.2 Spinal curvatures"}, {"id": "ANA-L10-006", "text": "At birth the vertebral column has only a {{c1::primary}} curve, {{c2::concave anteriorly::concave or convex, which side}}", "extra": "", "sec": "Part 01 · 1.2 Spinal curvatures"}, {"id": "ANA-L10-007", "text": "Secondary curves appear — cervical: {{c1::3rd–4th month}} (head balance) · lumbar: {{c2::12th–18th month}} (standing)", "extra": "Both secondary curves are convex anteriorly.", "sec": "Part 01 · 1.2 Spinal curvatures"}, {"id": "ANA-L10-008", "text": "A child who is just learning to stand is developing the {{c1::lumbar}} curve — a {{c2::secondary}} curve, convex anteriorly", "extra": "The cervical secondary curve comes earlier, as the infant learns to balance the head.", "sec": "Part 01 · 1.2 Spinal curvatures"}, {"id": "ANA-L10-009", "text": "Curves develop in response to: {{c1::upright posture}} · {{c2::weight bearing}} · {{c3::musculature}}", "extra": "", "sec": "Part 01 · 1.2 Spinal curvatures"}, {"id": "ANA-L10-010", "text": "Primary curves of the vertebral column: {{c1::thoracic}} & {{c2::sacral (pelvic)}}", "extra": "Classic trap: thoracic & sacral are primary; cervical & lumbar are secondary.", "sec": "Part 01 · 1.3 Curves of the vertebral column — primary vs secondary"}, {"id": "ANA-L10-011", "text": "Secondary curves of the vertebral column: {{c1::cervical}} & {{c2::lumbar}}", "extra": "They appear after birth: cervical 3rd–4th month, lumbar 12th–18th month.", "sec": "Part 01 · 1.3 Curves of the vertebral column — primary vs secondary"}, {"id": "ANA-L10-012", "text": "Primary curves are {{c1::accommodation}} curves; secondary curves are {{c2::compensation}} curves", "extra": "Mnemonic: Primary = Place for organs · Secondary = Support weight.", "sec": "Part 01 · 1.3 Curves of the vertebral column — primary vs secondary"}, {"id": "ANA-L10-013", "text": "Primary curve functions — thoracic curve accommodates the {{c1::thoracic organs}}; sacral (pelvic) curve accommodates the {{c2::abdomino-pelvic organs}}", "extra": "", "sec": "Part 01 · 1.3 Curves of the vertebral column — primary vs secondary"}, {"id": "ANA-L10-014", "text": "Secondary curve functions — cervical: balance the weight of the {{c1::head}} on the cervical vertebrae · lumbar: balance the weight of the {{c2::trunk}} on the {{c3::lower limbs}}", "extra": "", "sec": "Part 01 · 1.3 Curves of the vertebral column — primary vs secondary"}, {"id": "ANA-L10-015", "text": "Abnormal curves: kyphosis = exaggerated {{c1::thoracic}} curve · lordosis = exaggerated {{c2::lumbar}} curve · scoliosis = abnormal {{c3::lateral}} curvature", "extra": "Mnemonic: Kyphosis → thoracic round-back · Lordosis → Lumbar · Scoliosis → Sideways.", "sec": "Part 01 · 1.4 Abnormal curves of the vertebral column"}, {"id": "ANA-L10-016", "text": "Swayback appearance = {{c1::lordosis}}; round-back appearance = {{c2::kyphosis}}", "extra": "", "sec": "Part 01 · 1.4 Abnormal curves of the vertebral column"}, {"id": "ANA-L10-017", "text": "Part of the vertebra that transfers the weight along the axis of the vertebral column: the {{c1::vertebral body}}", "extra": "", "sec": "Part 02 · 2.1 Structure of the vertebra"}, {"id": "ANA-L10-018", "text": "Bodies of adjacent vertebrae are interconnected by {{c1::ligaments}} and separated by {{c2::intervertebral discs}}", "extra": "", "sec": "Part 02 · 2.1 Structure of the vertebra"}, {"id": "ANA-L10-019", "text": "The vertebral arch is formed of {{c1::2 pedicles}} + {{c2::2 laminae}}", "extra": "", "sec": "Part 02 · 2.1 Structure of the vertebra"}, {"id": "ANA-L10-020", "text": "The vertebral arch forms the {{c1::posterior::anterior or posterior}} margin of each vertebral foramen", "extra": "", "sec": "Part 02 · 2.1 Structure of the vertebra"}, {"id": "ANA-L10-021", "text": "The spine (spinous process) projects at the {{c1::point of fusion between the 2 laminae}}; a transverse process projects at the {{c2::meeting of each pedicle and lamina}}", "extra": "", "sec": "Part 02 · 2.1 Structure of the vertebra"}, {"id": "ANA-L10-022", "text": "Vertebral foramina of successive vertebrae form the {{c1::vertebral canal}}, which encloses the {{c2::spinal cord}}", "extra": "", "sec": "Part 02 · 2.1 Structure of the vertebra"}, {"id": "ANA-L10-023", "text": "Site — joints between the vertebral arches: between the {{c1::superior and inferior articular processes}}; joints between the vertebral bodies: {{c2::the intervertebral discs}}", "extra": "", "sec": "Part 02 · 2.2 Joints between the vertebrae"}, {"id": "ANA-L10-024", "text": "Joint type — between the vertebral arches: {{c1::plane (gliding) synovial}}; between the vertebral bodies (IVDs): {{c2::secondary cartilaginous}}", "extra": "Classic trap: arches = synovial; bodies = secondary cartilaginous.", "sec": "Part 02 · 2.2 Joints between the vertebrae"}, {"id": "ANA-L10-025", "text": "Joints between the vertebral arches allow little movement associated with {{c1::flexion-extension}} and {{c2::rotation}} of the vertebral column", "extra": "The joints between the bodies (IVDs) allow slight movements between the bodies.", "sec": "Part 02 · 2.2 Joints between the vertebrae"}, {"id": "ANA-L10-026", "text": "Components of the intervertebral disc: {{c1::annulus fibrosus}} · {{c2::nucleus pulposus}} · {{c3::vertebral end plates}}", "extra": "Jelly donut: outer ring = annulus · jelly = nucleus · lids = end plates.", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-027", "text": "Annulus fibrosus: outer layer of {{c1::fibrocartilage}} attaching the disc to the {{c2::bodies of the adjacent vertebrae}}", "extra": "", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-028", "text": "Nucleus pulposus: {{c1::elastic, gelatinous}} core that enables the disc to {{c2::absorb the shocks}} between the vertebral bodies", "extra": "", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-029", "text": "Vertebral end plates cover the {{c1::upper and lower surfaces}} of the disc and are formed of {{c2::both hyaline and fibrocartilage}}", "extra": "Classic trap: not hyaline alone, not fibrocartilage alone.", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-030", "text": "Intervertebral discs are absent in the {{c1::sacrum}} · the {{c2::coccyx}} · {{c3::between C1 and C2}}", "extra": "Between the 1st and 2nd cervical vertebrae.", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-031", "text": "Movement of the vertebral column compresses the nucleus pulposus and displaces it to the {{c1::opposite direction}}, permitting {{c2::gliding}} between vertebrae while keeping their alignment", "extra": "", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-032", "text": "The intervertebral discs account for {{c1::¼}} of the length of the vertebral column", "extra": "", "sec": "Part 02 · 2.3 Anatomy of the intervertebral disc (IVD)"}, {"id": "ANA-L10-033", "text": "Herniated disc: {{c1::nucleus pulposus}} breaks through the {{c2::annulus fibrosus}} ▶ protrudes into the {{c3::vertebral canal}} ▶ compresses the {{c4::spinal nerves}} → pain", "extra": "The annulus is breached; the nucleus is what protrudes.", "sec": "Part 02 · 2.4 Herniated disc"}, {"id": "ANA-L10-034", "text": "Ligaments between the vertebral arches — joins the laminae: {{c1::ligamentum flavum}} · joins adjacent spinous processes: {{c2::interspinous ligament}} · joins the tips of the spines, C7 → sacrum: {{c3::supraspinous ligament}}", "extra": "Mnemonic: Flavum → laminae · Interspinous → between spines · Supraspinous → over the tips.", "sec": "Part 03 · 3.1 Ligaments between the vertebrae"}, {"id": "ANA-L10-035", "text": "Ligamentum flavum connects the {{c1::laminae}} of adjacent vertebrae", "extra": "", "sec": "Part 03 · 3.1 Ligaments between the vertebrae"}, {"id": "ANA-L10-036", "text": "Supraspinous ligament connects the tips of the spinous processes from {{c1::C7}} to the {{c2::sacrum}}", "extra": "", "sec": "Part 03 · 3.1 Ligaments between the vertebrae"}, {"id": "ANA-L10-037", "text": "In the cervical region the supraspinous ligament is continuous with the {{c1::ligamentum nuchae}}", "extra": "", "sec": "Part 03 · 3.1 Ligaments between the vertebrae"}, {"id": "ANA-L10-038", "text": "The odontoid process (dens) belongs to the {{c1::axis::atlas or axis}}", "extra": "", "sec": "Part 03 · Atlas & axis (lecture figure)"}, {"id": "ANA-L10-039", "text": "Flexion (bending anteriorly) makes the {{c1::posterior longitudinal}} ligament tense and compresses the nucleus pulposus {{c2::posteriorly::anteriorly or posteriorly}}", "extra": "Both on the side opposite the bend.", "sec": "Part 03 · 3.2 Vertebral movements"}, {"id": "ANA-L10-040", "text": "Extension (bending posteriorly) makes the {{c1::anterior longitudinal}} ligament tense and compresses the nucleus pulposus {{c2::anteriorly::anteriorly or posteriorly}}", "extra": "Both on the side opposite the bend.", "sec": "Part 03 · 3.2 Vertebral movements"}, {"id": "ANA-L10-041", "text": "The four movements of the vertebral column: flexion · extension · {{c1::lateral flexion}} · {{c2::rotation}}", "extra": "", "sec": "Part 03 · 3.2 Vertebral movements"}, {"id": "ANA-L10-042", "text": "Sclerotome cells migrate to surround the {{c1::notochord}} and the {{c2::neural tube}} during the {{c3::4th}} week of intrauterine life", "extra": "", "sec": "Part 04 · 4.1 The vertebral column develops as follows"}, {"id": "ANA-L10-043", "text": "Each vertebral body is an {{c1::intersegmental}} structure derived from the sclerotome of {{c2::two adjacent somites}}", "extra": "", "sec": "Part 04 · 4.1 The vertebral column develops as follows"}, {"id": "ANA-L10-044", "text": "The notochord within the vertebral bodies {{c1::degenerates}}", "extra": "Only the part between the bodies survives — as the nucleus pulposus.", "sec": "Part 04 · 4.1 The vertebral column develops as follows"}, {"id": "ANA-L10-045", "text": "Between the vertebral bodies, the notochord forms the {{c1::nucleus pulposus}} of the intervertebral disc", "extra": "Required to study (IMP). Mnemonic: Notochord → Nucleus.", "sec": "Part 04 · 4.1 The vertebral column develops as follows"}, {"id": "ANA-L10-046", "text": "Derivatives of the sclerotome: the {{c1::vertebral body}} and the {{c2::annulus fibrosus}} of the intervertebral disc", "extra": "Only the nucleus pulposus comes from the notochord.", "sec": "Part 04 · 4.1 The vertebral column develops as follows"}, {"id": "ANA-L10-047", "text": "Origin — nucleus pulposus: {{c1::notochord}}; annulus fibrosus: {{c2::sclerotome}}", "extra": "Mnemonic: Notochord → Nucleus · Sclerotome → Surrounding annulus.", "sec": "Part 04 · 4.1 The vertebral column develops as follows"}, {"id": "ANA-L10-048", "text": "The thoracolumbar (lumbar) fascia covers the {{c1::deep muscles of the back}}", "extra": "", "sec": "Part 05 · 5.1 Thoracolumbar (lumbar) fascia"}, {"id": "ANA-L10-049", "text": "Thoracolumbar (lumbar) fascia attaches medially to the {{c1::spines of the vertebrae}} and inferiorly to the {{c2::ilium}}", "extra": "", "sec": "Part 05 · 5.1 Thoracolumbar (lumbar) fascia"}, {"id": "ANA-L10-050", "text": "Extrinsic muscles of the back: {{c1::trapezius}} · {{c2::latissimus dorsi}} · {{c3::rhomboid minor & major}}", "extra": "", "sec": "Part 05 · 5.2 Extrinsic muscles of the back"}, {"id": "ANA-L10-051", "text": "Triangle of auscultation boundaries: lower border of {{c1::trapezius}} · {{c2::latissimus dorsi}} · {{c3::medial margin of the scapula}}", "extra": "Medial, not lateral, margin of the scapula.", "sec": "Part 05 · 5.2 Extrinsic muscles of the back"}, {"id": "ANA-L10-052", "text": "Triangle of auscultation: the {{c1::absence of musculature}} lets {{c2::respiratory sounds}} be heard clearly with a stethoscope", "extra": "", "sec": "Part 05 · 5.2 Extrinsic muscles of the back"}, {"id": "ANA-L10-053", "text": "Intermediate group of back muscles: {{c1::serratus posterior superior & inferior}} — associated function qimg(q, ans){

function qtags(q){
  const t = [];

function opts(q, st, act){

  }).join('');
}
H.check = b => {

};

H.lab = (b, pg) => { const L = LABS[b.lab]; return L ? labHTML(L, pg) : ''; };
const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];
  if (L.labels.length >= 2) modes.push(['test', 'Test me'], ['find', 'Find it']);
  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);
    if (mode === 'test') return st.rev[l.id] ? 'on' : 'cv';
    if (mode === 'find') return st.fb && st.fb[2] === l.id ? st.fb[0] : 'cv';
    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);
    if (st.sel === l.id) return 'sel';
    return '';
  };
  const pad = (b, k) => `left:${(b.x - k).toFixed(2)}%;top:${(b.y - k * 1.6).toFixed(2)}%;width:${(b.w + 2 * k).toFixed(2)}%;height:${(b.h + 3.2 * k).toFixed(2)}%`;
  const boxes = L.labels.map(l => {
    const c = cls(l);
    // a numbered legend: the label is covered, the number on the picture is the spot to tap
    const lab = `<button class="sb ${l.m && mode === 'find' ? (c === 'cv' ? 'cv' : '') : c}" style="${pad(l, .35)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="${mode === 'test' || mode === 'find' ? 'covered label' : esc(l.t)}"></button>`;
    const mk = l.m ? `<button class="sb mk ${mode === 'find' ? (st.fb && st.fb[2] === l.id ? st.fb[0] : '') : (c === 'cv' ? '' : c)}" style="${pad(l.m, .6)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="number ${esc(l.n)}"></button>` : '';
    return lab + mk;
  }).join('');
  let info = '';
  if (mode === 'labels'){
    const l = L.labels.find(x => x.id === st.sel), m = l && slmus(L, l);
    info = m ? `<h4>${esc(m.name)}</h4>${esc(m.note || '')}<div class="muted" style="margin-top:.25em">Nerve: ${esc(m.nerves.map(n => (L.act.nerves.find(x => x.id === n) || {}).name).filter(Boolean).join(' + ') || 'not used as an answer in this book')}</div>`
      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`
      : l ? `<h4>${esc(l.t)}</h4>` : `<span class="muted">${L.act ? 'Tap a muscle label to see its action and nerve.' : L.labels.some(x => x.nv) ? 'Tap a nerve to see the muscles it supplies. "Test me" covers the labels; "Find it" asks you to find each one.' : L.labels.length >= 2 ? 'The labels as printed on the slide. "Test me" covers them; "Find it" asks you to find each one.' : 'The slide as shown in the practical.'}</span>`;
  } else if (mode === 'test'){
    info = `<span class="muted">Name each covered label, then tap it to check. Uncovered ${Object.keys(st.rev).length} of ${L.labels.length}.</span>`;
  } else if (mode === 'find'){
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    const t = L.labels.find(x => x.id === target);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Tap "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(t.t)}</h4>${st.fb && st.fb[0] === 'bad' ? `<div class="fb bad">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its ${t.m ? 'number on the picture' : 'covered label'} · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){
    const ms = L.labels.map(l => slmus(L, l)).filter(Boolean);
    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {
  const st = lst(L.id, () => ({n: 0, wrong: 0, shake: null, order: shuffled(L.steps.map((_, i) => i), L.id + 's')}));
  const done = st.n >= L.steps.length; if (done) labDone(L.id);
  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>
   <div class="seqline">${st.n ? L.steps.slice(0, st.n).map((s, i) => `<span class="n">${i + 1}</span><span class="chip ok">${esc(s)}</span>`).join('') : '<span class="muted" style="font-size:.78em">Your order appears here.</span>'}</div>
   <div class="pool">${st.order.filter(i => i >= st.n).map(i => `<button class="chip ${st.shake === i ? 'shake' : ''}" data-act="qpick" data-l="${L.id}" data-i="${i}">${esc(L.steps[i])}</button>`).join('')}</div>
   ${done ? `<div class="done">✓ Correct order${L.mnemonic ? ' — ' + esc(L.mnemonic) : ''}${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ''}</div>` : (st.wrong ? `<div class="muted" style="font-size:.78em">Wrong tries: ${st.wrong}</div>` : '')}
   <div class="row"><button class="btn" data-act="qreset" data-l="${L.id}">Start again</button></div>`;
};
// --- labelled diagram ---
const DRAW = {};
LAB.diagram = L => {
  const st = lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.pins.map(p => p.id), L.id)}));
  const pins = L.pins.map((p, i) => {
    const shown = st.mode === 'labels' || (st.mode === 'test' && st.rev[p.id]);
    let c = st.mode === 'test' && st.rev[p.id] ? 'on' : '';
    if (st.mode === 'find' && st.fb && st.fb[2] === p.id) c = st.fb[0];
    const lx = p.lx !== undefined ? p.lx : p.x + 9, anchor = p.anchor || 'start';
    return `<g class="pinbtn ${c}" data-act="pin" data-l="${L.id}" data-id="${p.id}"><circle class="d" cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x}" y="${p.y + 2.8}" text-anchor="middle">${i + 1}</text>${shown ? `<text class="plab" x="${lx}" y="${p.ly !== undefined ? p.ly : p.y + 3}" text-anchor="${anchor}">${esc(p.short || p.name)}</text>` : ''}</g>`;
  }).join('');
  let info;
  if (st.mode === 'labels') info = `<span class="muted">All labels shown. Switch to "Test me" (tap a number to reveal it) or "Find it" (find the named structure).</span>`;
  else if (st.mode === 'test') info = `<span class="muted">Say the name of each numbered structure, then tap it to check. Revealed ${Object.keys(st.rev).length} of ${L.pins.length}.</span>`;
  else {

    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Choose "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(L.pins.find(p => p.id === st.order[st.qi]).name)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its number · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  }
  return `<div class="modes">${[['labels', 'Labels on'], ['test', 'Test me'], ['find', 'Find it']].map(([m, n]) => `<button class="mini ${st.mode === m ? 'on' : ''}" data-act="dmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}</div>
   <div class="svgw"><svg viewBox="${L.viewBox}" role="img" aria-label="${esc(L.title)}">${DRAW[L.draw] ? DRAW[L.draw]() : ''}${pins}</svg></div>
   ${st.mode === 'labels' ? `<ol class="key">${L.pins.map(p => `<li>${esc(p.name)}</li>`).join('')}</ol>` : st.mode === 'test' ? `<ol class="key">${L.pins.map(p => `<li>${st.rev[p.id] ? esc(p.name) : '<span class="muted">tap ' + (L.pins.indexOf(p) + 1) + ' to check</span>'}</li>`).join('')}</ol>` : ''}<div class="info">${info}</div>`;
};
