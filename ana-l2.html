me\" and \"Find it\" quiz you on the labels."}, "sl25": {"id": "sl25", "type": "slide", "title": "Shoulder region · slide 23", "img": "prac/s025.jpg", "labels": [{"t": "Trapezius muscle", "x": 12.58, "y": 9.76, "w": 16.65, "h": 4.13, "id": "l0", "mu": "trap"}, {"t": "Deltoid muscle", "x": 78.83, "y": 40.31, "w": 14.23, "h": 4.13, "id": "l1", "mu": "delt"}, {"t": "Latissimus dorsi muscle", "x": 10.08, "y": 53.37, "w": 22.82, "h": 4.13, "id": "l2", "mu": "ld"}, {"t": "triceps muscle", "x": 80.86, "y": 61.43, "w": 13.92, "h": 4.13, "id": "l3", "mu": "tri"}], "src": "From the practical slides · Practical 1 – Shoulder region", "act": {"muscles": {"trap": {"name": "Trapezius", "nerves": ["xi"], "moves": ["selev", "sret", "sdep", "slat"], "note": "Upper fibres elevate, middle retract, lower depress (E-R-D); upper + lower fibres rotate the scapula laterally. Paralysis → sagging shoulder."}, "delt": {"name": "Deltoid", "nerves": ["ax"], "moves": ["aabd", "aflex", "amr", "aext", "alr"], "note": "Anterior fibres flex and rotate medially; middle fibres abduct (prime mover, after supraspinatus starts it); posterior fibres extend and rotate laterally."}, "ld": {"name": "Latissimus dorsi", "nerves": ["td"], "moves": ["aadd", "amr", "aext"], "note": "Floor of the bicipital groove; adducts, rotates medially and extends the arm."}, "tri": {"name": "Triceps brachii", "nerves": ["rad"], "moves": ["eext"], "note": "Long head: infraglenoid tubercle; medial and lateral heads: back of humerus → olecranon. Extends the elbow."}}, "nerves": [{"id": "xi", "name": "Spinal accessory (CN XI)"}, {"id": "td", "name": "Thoracodorsal"}, {"id": "ax", "name": "Axillary"}, {"id": "rad", "name": "Radial"}], "moves": [{"id": "selev", "name": "Elevation of scapula"}, {"id": "sdep", "name": "Depression of scapula"}, {"id": "sret", "name": "Retraction of scapula"}, {"id": "slat", "name": "Lateral (upward) rotation of scapula"}, {"id": "aflex", "name": "Flexion of arm"}, {"id": "aext", "name": "Extension of arm"}, {"id": "aabd", "name": "Abduction of arm"}, {"id": "aadd", "name": "Adduction of arm"}, {"id": "amr", "name": "Medial rotation of arm"}, {"id": "alr", "name": "Lateral rotation of arm"}, {"id": "eext", "name": "Elbow extension"}], "par": {}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}}, "cards": [{"id": "ANA-L2-001", "text": "The humerus acts as a {{c1::mobile lever}} to direct forearm movement in any direction", "extra": "", "sec": "Part 01 · The humerus"}, {"id": "ANA-L2-002", "text": "Proximal end of the humerus: head · anatomical & surgical necks · {{c1::greater}} & {{c2::lesser}} tubercles (tuberosities) · {{c3::intertubercular (bicipital) groove}}", "extra": "The greater tubercle is proximal — not a feature of the lower end.", "sec": "Part 01 · 1.1 The proximal humerus"}, {"id": "ANA-L2-003", "text": "The two necks of the humerus: {{c1::anatomical neck}} and {{c2::surgical neck}}", "extra": "", "sec": "Part 01 · 1.1 The proximal humerus"}, {"id": "ANA-L2-004", "text": "Distal humerus fossae — anterior: {{c1::coronoid}} & {{c2::radial}} fossae; posterior: {{c3::olecranon}} fossa", "extra": "", "sec": "Part 01 · 1.2 The distal humerus"}, {"id": "ANA-L2-005", "text": "Distal humerus — articular parts: {{c1::capitulum}} & {{c2::trochlea}}; plus the {{c3::medial & lateral epicondyles}}", "extra": "The trochlea and both epicondyles are seen from in front and behind; the capitulum only from in front.", "sec": "Part 01 · 1.2 The distal humerus"}, {"id": "ANA-L2-006", "text": "Shoulder (glenohumeral) joint: between the {{c1::glenoid fossa of the scapula}} and the {{c2::head of the humerus}}", "extra": "Ball = head of humerus · socket = glenoid fossa.", "sec": "Part 02 · 2.1 Shoulder joint (glenohumeral joint)"}, {"id": "ANA-L2-007", "text": "Shoulder joint type: freely mobile {{c1::ball-and-socket synovial}} joint", "extra": "", "sec": "Part 02 · 2.1 Shoulder joint (glenohumeral joint)"}, {"id": "ANA-L2-008", "text": "The shoulder joint capsule is thin and loose {{c1::inferiorly}} to permit a wide range of movement", "extra": "The rotator cuff is also deficient inferiorly.", "sec": "Part 02 · 2.1 Shoulder joint (glenohumeral joint)"}, {"id": "ANA-L2-009", "text": "Glenoid labrum: a rim of {{c1::fibrocartilage}} attached to the {{c2::margins of the glenoid cavity}}", "extra": "", "sec": "Part 02 · 2.1 Shoulder joint (glenohumeral joint)"}, {"id": "ANA-L2-010", "text": "The shoulder joint capsule is strengthened by the {{c1::tendons of the rotator cuff}}", "extra": "", "sec": "Part 02 · 2.1 Shoulder joint (glenohumeral joint)"}, {"id": "ANA-L2-011", "text": "The shoulder is the most frequently dislocated joint in the body because the {{c1::glenoid fossa is shallow}}", "extra": "The humeral head may dislocate anteriorly or posteriorly.", "sec": "Part 02 · 2.2 Dislocation of the shoulder joint"}, {"id": "ANA-L2-012", "text": "Anterior shoulder dislocation: the common type ({{c1::95%}}); may damage the {{c2::axillary nerve}}", "extra": "", "sec": "Part 02 · 2.2 Dislocation of the shoulder joint"}, {"id": "ANA-L2-013", "text": "Posterior shoulder dislocation: rarer ({{c1::4%}}); often caused by {{c2::seizures}} and {{c3::electrocution injuries}}", "extra": "", "sec": "Part 02 · 2.2 Dislocation of the shoulder joint"}, {"id": "ANA-L2-014", "text": "Axillary nerve ({{c1::C5, C6}}) supplies {{c2::deltoid}} · {{c3::teres minor}} · skin via the {{c4::upper cutaneous nerve of the arm}}", "extra": "At risk in anterior dislocation of the shoulder.", "sec": "Part 02 · 2.2 Dislocation of the shoulder joint"}, {"id": "ANA-L2-015", "text": "Coracohumeral ligament: supports the {{c1::superior aspect}} of the shoulder joint capsule", "extra": "Coracohumeral → Ceiling.", "sec": "Part 03 · 3.1 Ligaments of the shoulder joint"}, {"id": "ANA-L2-016", "text": "Glenohumeral ligaments: {{c1::3}} (superior, middle, inferior); the {{c2::inferior}} one in particular plays an important role in stabilizing the joint", "extra": "", "sec": "Part 03 · 3.1 Ligaments of the shoulder joint"}, {"id": "ANA-L2-017", "text": "Transverse humeral ligament: bridges over the {{c1::tendon of the long head of biceps}} in the {{c2::bicipital groove}} to keep it in position", "extra": "Transverse humeral → biceps Tendon.", "sec": "Part 03 · 3.1 Ligaments of the shoulder joint"}, {"id": "ANA-L2-018", "text": "10 muscles act on the shoulder joint: the 6 shoulder-region muscles + {{c1::pectoralis major}} · {{c2::latissimus dorsi}} · {{c3::biceps brachii}} · {{c4::coracobrachialis}}", "extra": "Pectoralis minor and brachialis are not among them.", "sec": "Part 04 · 4.1 Muscles acting on the shoulder joint (10 muscles)"}, {"id": "ANA-L2-019", "text": "Pectoralis major — clavicular head: from the {{c1::front of the medial half of the clavicle}}; sternocostal head: from the {{c2::front of the sternum & upper costal cartilages}}", "extra": "", "sec": "Part 04 · 4.2 Pectoralis major"}, {"id": "ANA-L2-020", "text": "Pectoralis major insertion: both heads unite in a tendon → the {{c1::lateral lip}} of the bicipital groove", "extra": "", "sec": "Part 04 · 4.2 Pectoralis major"}, {"id": "ANA-L2-021", "text": "Pectoralis major nerve supply: {{c1::medial and lateral pectoral nerves}}", "extra": "One of the two muscles of this lecture with a double nerve supply.", "sec": "Part 04 · 4.2 Pectoralis major"}, {"id": "ANA-L2-022", "text": "Pectoralis major — main function as a whole: {{c1::adduction}} and {{c2::medial rotation}} of the arm at the shoulder joint", "extra": "", "sec": "Part 04 · 4.2 Pectoralis major"}, {"id": "ANA-L2-023", "text": "Pectoralis major heads (movements slide): clavicular head → {{c1::flexion}}; sternocostal head → {{c2::extension}} of the shoulder", "extra": "", "sec": "Part 04 · 4.2 Pectoralis major"}, {"id": "ANA-L2-024", "text": "Latissimus dorsi origin: {{c1::lower thoracic spines}} · {{c2::thoracolumbar fascia}} · {{c3::lower ribs}} · {{c4::inferior angle of the scapula}}", "extra": "", "sec": "Part 04 · 4.3 Latissimus dorsi"}, {"id": "ANA-L2-025", "text": "Latissimus dorsi insertion: the {{c1::floor}} of the bicipital groove", "extra": "", "sec": "Part 04 · 4.3 Latissimus dorsi"}, {"id": "ANA-L2-026", "text": "Latissimus dorsi nerve supply: {{c1::thoracodorsal nerve}} (= nerve to latissimus dorsi)", "extra": "Keep it intact in a latissimus dorsi flap (breast reconstruction after mastectomy).", "sec": "Part 04 · 4.3 Latissimus dorsi"}, {"id": "ANA-L2-027", "text": "Latissimus dorsi actions on the arm: {{c1::adduction}} and {{c2::medial rotation}} (+ extension)", "extra": "", "sec": "Part 04 · 4.3 Latissimus dorsi"}, {"id": "ANA-L2-028", "text": "In exercise, with their insertions fixed, {{c1::pectoralis major}} and {{c2::latissimus dorsi}} draw the {{c3::trunk upwards}}", "extra": "E.g. a pull-up.", "sec": "Part 04 · 4.3 Latissimus dorsi"}, {"id": "ANA-L2-029", "text": "Bicipital groove attachments — lateral lip: {{c1::pectoralis major}}; floor: {{c2::latissimus dorsi}}; medial lip: {{c3::teres major}}", "extra": "'A lady between two majors' — latissimus dorsi on the floor.", "sec": "Part 04 · 4.3 Latissimus dorsi"}, {"id": "ANA-L2-030", "text": "Muscles of the shoulder region (scapula → humerus): {{c1::deltoid}} · {{c2::supraspinatus}} · {{c3::infraspinatus}} · {{c4::teres minor}} · {{c5::teres major}} · {{c6::subscapularis}}", "extra": "They move the humerus through the shoulder joint.", "sec": "Part 05 · 5.1 Muscles of the shoulder region"}, {"id": "ANA-L2-031", "text": "Deltoid attachments: from the {{c1::clavicle and scapula}} (opposite the trapezius) → the {{c2::deltoid tuberosity}} of the humerus", "extra": "", "sec": "Part 05 · 5.2 Deltoid"}, {"id": "ANA-L2-032", "text": "Deltoid nerve supply: {{c1::axillary nerve}}", "extra": "", "sec": "Part 05 · 5.2 Deltoid"}, {"id": "ANA-L2-033", "text": "Deltoid anterior fibers: {{c1::flexion}} + {{c2::medial rotation}} of the arm", "extra": "Front → Flex.", "sec": "Part 05 · 5.2 Deltoid"}, {"id": "ANA-L2-034", "text": "Deltoid middle fibers: {{c1::abduction}} of the arm up to {{c2::90°}} (the prime mover of shoulder abduction).", "extra": "Middle → mid-range.", "sec": "Part 05 · 5.2 Deltoid"}, {"id": "ANA-L2-035", "text": "Deltoid posterior fibers: {{c1::extension}} + {{c2::lateral rotation}} of the arm", "extra": "Back → extend.", "sec": "Part 05 · 5.2 Deltoid"}, {"id": "ANA-L2-036", "text": "With the arm by the side, deltoid is ineffective because it {{c1::pulls vertically on the humerus}} → abduction is initiated by {{c2::supraspinatus}}", "extra": "", "sec": "Part 05 · 5.3 Abduction mechanics"}, {"id": "ANA-L2-037", "text": "Abduction relay: {{c1::supraspinatus}} initiates → {{c2::deltoid (middle fibers)}} up to 90° → above 90°: {{c3::lateral rotation of the scapula}}", "extra": "Trap: deltoid cannot start abduction.", "sec": "Part 05 · 5.3 Abduction mechanics"}, {"id": "ANA-L2-038", "text": "Raising the arm above the head (above 90°) = lateral rotation of the scapula by {{c1::upper & lower fibers of trapezius}} + {{c2::lower 5 digitations of serratus anterior}}", "extra": "", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}, {"id": "ANA-L2-039", "text": "Arise from the back of the scapula and insert into the back of the greater tuberosity: {{c1::supraspinatus}} · {{c2::infraspinatus}} · {{c3::teres minor}}", "extra": "SIT — the rotator cuff without subscapularis.", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-040", "text": "Greater tubercle of the humerus broken away → loss of {{c1::abduction}} and {{c2::lateral rotation}}", "extra": "Supraspinatus initiates abduction; infraspinatus & teres minor rotate laterally.", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-041", "text": "Infraspinatus & teres minor — action: {{c1::lateral rotation}} of the arm", "extra": "", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-042", "text": "Suprascapular nerve supplies: {{c1::supraspinatus}} & {{c2::infraspinatus}}", "extra": "", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-043", "text": "Teres minor nerve supply: {{c1::axillary nerve}}", "extra": "Trap: not the suprascapular. Teres major → lower subscapular N.", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-044", "text": "Subscapularis: from the {{c1::front of the scapula}} → the {{c2::lesser tuberosity}} of the humerus", "extra": "", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-045", "text": "Subscapular nerves: upper + lower → {{c1::subscapularis}}; lower only → {{c2::teres major}}", "extra": "", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-046", "text": "Subscapularis — action: {{c1::adduction}} + {{c2::medial rotation}} of the arm", "extra": "", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-047", "text": "Teres major: from the {{c1::lateral border of the scapula}} → the {{c2::medial lip of the bicipital groove}}", "extra": "Lateral-border fracture of the scapula → weak adduction & medial rotation (teres major).", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-048", "text": "Teres major nerve supply: {{c1::lower subscapular nerve}}", "extra": "Not axillary or suprascapular.", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-049", "text": "Teres major — action: {{c1::adduction}} + {{c2::medial rotation}} of the arm (+ extension)", "extra": "Teres minor does the opposite rotation (lateral).", "sec": "Part 05 · 5.5 Supraspinatus, infraspinatus, teres minor, subscapularis & teres major"}, {"id": "ANA-L2-050", "text": "Muscles acting on the shoulder with a double nerve supply: {{c1::pectoralis major}} (medial & lateral pectoral) · {{c2::subscapularis}} (upper & lower subscapular)", "extra": "Teres major gets only the lower subscapular nerve.", "sec": "Part 07 · 7.2 Muscles acting on the shoulder joint — master table"}, {"id": "ANA-L2-051", "text": "The rotator cuff covers the anterior, posterior & superior aspects of the shoulder joint; it is deficient {{c1::inferiorly}} — the site of potential weakness of the joint", "extra": "The capsule is also loose inferiorly.", "sec": "Part 06 · 6.1 Rotator cuff"}, {"id": "ANA-L2-052", "text": "Rotator cuff muscles (SITS): {{c1::supraspinatus}} · {{c2::infraspinatus}} · {{c3::teres minor}} · {{c4::subscapularis}}", "extra": "Teres major is NOT a rotator cuff muscle.", "sec": "Part 06 · 6.1 Rotator cuff"}, {"id": "ANA-L2-053", "text": "The {{c1::tone}} of the rotator cuff muscles helps in stabilizing the shoulder joint", "extra": "", "sec": "Part 06 · 6.1 Rotator cuff"}, {"id": "ANA-L2-054", "text": "Rotator cuff tendon most commonly torn or inflamed: {{c1::supraspinatus}}", "extra": "", "sec": "Part 06 · 6.2 Rotator cuff — applied anatomy"}, {"id": "ANA-L2-055", "text": "Rotator cuff tears cause pain {{c1::anteriorly and superiorly}} to the glenohumeral joint during {{c2::abduction}}", "extra": "", "sec": "Part 06 · 6.2 Rotator cuff — applied anatomy"}, {"id": "ANA-L2-056", "text": "Anterior shoulder dislocation is often associated with {{c1::rotator cuff tears}} — 3 cuff muscles attach to the {{c2::back of the greater tuberosity}}", "extra": "Supraspinatus, infraspinatus, teres minor.", "sec": "Part 06 · 6.2 Rotator cuff — applied anatomy"}, {"id": "ANA-L2-057", "text": "Flexion of the shoulder: {{c1::clavicular head of pectoralis major}} · {{c2::anterior fibers of deltoid}} · {{c3::coracobrachialis}} · {{c4::biceps brachii}}", "extra": "The lecture gives only this action for coracobrachialis and biceps.", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}, {"id": "ANA-L2-058", "text": "Extension of the shoulder: {{c1::teres major}} · {{c2::latissimus dorsi}} · {{c3::sternocostal head of pectoralis major}} · {{c4::posterior fibers of deltoid}}", "extra": "", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}, {"id": "ANA-L2-059", "text": "Adduction of the arm: {{c1::pectoralis major}} · {{c2::teres major}} · {{c3::latissimus dorsi}} · {{c4::subscapularis}}", "extra": "The same four are medial rotators.", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}, {"id": "ANA-L2-060", "text": "Medial rotators of the arm = the 4 adductors (pectoralis major, teres major, latissimus dorsi, subscapularis) + {{c1::anterior fibers of deltoid}}", "extra": "", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}, {"id": "ANA-L2-061", "text": "Lateral rotators of the arm: {{c1::infraspinatus}} · {{c2::teres minor}} · {{c3::posterior fibers of deltoid}}", "extra": "", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}, {"id": "ANA-L2-062", "text": "Circumduction of the shoulder = a combination of {{c1::flexion, abduction, extension and adduction}}", "extra": "", "sec": "Part 07 · 7.1 Movements of the shoulder joint"}], "pracs": [{"href": "prac-ana-1.html", "title": "Anatomy practical · Practical 1 – Shoulder region"}], "lib": "msk.html", "prev": {"href": "ana-l1.html", "title": "Lecture 1 · Shoulder Girdle"}, "next": {"href": "ana-l3.html", "title": "Lecture 3 · Movements of the Forearm"}, "coverImg": "covers/Anatomy.jpg", "searchHint": "e.g. floor, capitulum, surgical neck"};

    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;

    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

/* ---------- click handling ---------- */
const A = {};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = A[a.dataset.act]; if (f){ e.preventDefault(); f(a, e); }
});
document.addEventListener('input', e => { const a = e.target.closest('[data-act="draft"]'); if (a){ S.draft[a.dataset.q] = a.value; save(); } });
A.next = () => go(1); A.prev = () => go(-1);
A.home = () => { closeOv(); home(); };
A.open = () => openBook(S.last > 0 ? S.last : 1);
A.jump = a => jump(+a.dataset.p);
A.mark = a => { const i = +a.dataset.p; if (S.marks[i]) delete S.marks[i]; else S.marks[i] = 1; save(); rerender(i); toast(S.marks[i] ? 'Bookmarked' : 'Bookmark removed'); };
A.cover = a => { const t = TB[a.dataset.t]; t.cv = !t.cv; t.rev = {}; rerender(pageOf(a)); };
A.rev = a => { const t = TB[a.dataset.t]; t.rev[a.dataset.c] = 1; rerender(pageOf(a)); };
A.ans = a => { const q = QS[a.dataset.q], i = +a.dataset.i; const ok = i === q.ans; S.ans[q.id] = {pick: i, ok, t: Date.now()}; if (ok) delete S.mist[q.id]; else S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.retry = a => { delete S.ans[a.dataset.q]; save(); rerender(pageOf(a)); };
A.pred = a => { const p = S.pred[a.dataset.q] || {}; if (p.lift) return; p.pick = +a.dataset.i; S.pred[a.dataset.q] = p; save(); rerender(pageOf(a)); };
A.lift = a => { const q = QS[a.dataset.q]; const p = S.pred[q.id]; p.lift = 1; if (p.pick !== q.ans) S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.flap = a => { S.flap[a.dataset.q] = 1; save(); rerender(pageOf(a)); };
A.self = a => { S.self[a.dataset.q] = a.dataset.v; save(); rerender(pageOf(a)); };
const rcst = id => { const st = S.labs[id] || (S.labs[id] = {}); st.r = st.r || {}; return st; };
A.rcv = a => { const st = rcst(a.dataset.l), i = a.dataset.i; if (st.r[i]) delete st.r[i]; else st.r[i] = 1; save(); rerender(pageOf(a)); };
A.rcall = a => { const st = rcst(a.dataset.l); for (let i = 0; i < +a.dataset.n; i++) st.r[i] = 1; save(); rerender(pageOf(a)); };
A.rcno = a => { const st = rcst(a.dataset.l); st.r = {}; save(); rerender(pageOf(a)); };
// labs
A.map = a => { const L = LABS[a.dataset.l], st = LS[L.id];
  if (st.mode === 'explore') st.sel = st.sel === a.dataset.id ? null : a.dataset.id;
  else if (st.qi < L.tests.length){ const t = L.tests[st.order[st.qi]]; if (a.dataset.id === t.a){ st.score += st.fb && st.fb[0] === 'bad' ? 0 : 1; st.qi++; st.fb = null; toast('✓ Correct'); } else st.fb = ['bad', 'Not this one — ' + L.regions.find(r => r.id === a.dataset.id).name + '. Try again.']; }
  rerender(pageOf(a)); };
A.mapmode = a => { const st = LS[a.dataset.l]; st.mode = a.dataset.v; st.sel = null; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(st.order, String(Date.now())); rerender(pageOf(a)); };
A.g = a => { const L = LABS[a.dataset.l], st = gstate(L), t = a.dataset.t, id = a.dataset.id;
  if (st.mode === 'explore') st.sel = st.sel && st.sel[0] === t && st.sel[1] === id ? null : [t, id];
  else if (t === 'n') st.cut[id] = !st.cut[id];
  rerender(pageOf(a)); };
A.gmode = a => { const st = gstate(LABS[a.dataset.l]); st.mode = a.dataset.v; st.sel = null; rerender(pageOf(a)); };
A.gclear = a => { const st = gstate(LABS[a.dataset.l]); st.cut = {}; rerender(pageOf(a)); };
A.gcase = a => { const L = LABS[a.dataset.l], st = gstate(L), c = L.cases[+a.dataset.i]; st.cut = {}; c.cut.forEach(n => st.cut[n] = true); labDone(L.id); rerender(pageOf(a)); };
A.spick = a => { const st = LS[a.dataset.l]; st.sel = st.sel === a.dataset.id ? null : a.dataset.id; st.shake = null; rerender(pageOf(a)); };
A.sdrop = a => { const L = LABS[a.dataset.l], st = LS[L.id]; if (!st.sel) return; const it = L.items.find(x => x.id === st.sel);
  if (it.bin === a.dataset.b){ st.placed[it.id] = it.bin; st.sel = null; st.shake = null; } else { st.wrong++; st.shake = it.id; toast('Not there — try another box'); }
  rerender(pageOf(a)); };
A.sreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.qpick = a => { const L = LABS[a.dataset.l], st = LS[L.id], i = +a.dataset.i; if (i === st.n){ st.n++; st.shake = null; } else { st.wrong++; st.shake = i; } rerender(pageOf(a)); };
A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find'){ if (st.qi >= st.order.length) return; const t = st.order[st.qi];
    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }
    else st.fb = ['bad', 'Not that one. Try again.', id, t]; }
  else st.sel = st.sel === id ? null : id;
  slre(a); };
A.slmv = a => { const st = slst(LABS[a.dataset.l]); st.mv = st.mv === a.dataset.id ? null : a.dataset.id; slre(a); };
A.slcut = a => { const st = slst(LABS[a.dataset.l]); st.cut[a.dataset.id] = !st.cut[a.dataset.id]; slre(a); };
A.slbig = a => { const L = LABS[a.dataset.l]; ov(L.title || 'Practical slide', `<div class="slbig" data-big="${L.id}">${LAB.slide(L, true)}</div>`, 'wide'); };
function slre(a){
  const big = a.closest('[data-big]');
  if (big){ big.innerHTML = LAB.slide(LABS[big.dataset.big], true); const i = pageOf(document.querySelector(`#pgL [data-l="${big.dataset.big}"], #pgR [data-l="${big.dataset.big}"]`) || document.body); if (i >= 0) rerender(i); return; }
  rerender(pageOf(a));
}
A.dmode = a => { const L = LABS[a.dataset.l], st = LS[L.id]; st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(L.pins.map(p => p.id), String(Date.now())); rerender(pageOf(a)); };
A.pin = a => { const L = LABS[a.dataset.l], st = LS[L.id], id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find' && st.qi < st.order.length){ const t = st.order[st.qi];
    if (id === t){ st.score += st.fb && st.fb[0] === 'bad' && st.fb[3] === t ? 0 : 1; st.qi++; st.fb = ['ok', '✓ Correct', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; rerender(pageOf(document.querySelector(`[data-l="${L.id}"]`) || a)); } }, 700); }
    else st.fb = ['bad', 'That is ' + L.pins.find(p => p.id === id).name + '. Try again.', id, t]; }
  rerender(pageOf(a)); };

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
