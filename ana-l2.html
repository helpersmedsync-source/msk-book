<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand .bdg{width:28px;height:28px;align-self:center;flex:none}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover.cimg{background-size:cover;background-position:center;background-color:var(--leather);padding:0;justify-content:flex-end;overflow:hidden}
.cband{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px 20px;background:linear-gradient(rgba(5,14,38,0),rgba(5,14,38,.93) 46%);color:#fff;font:600 14px/1.38 var(--f-head);text-align:left}
.cband small{display:block;margin-bottom:3px;font:700 10px var(--f-head);letter-spacing:.16em;color:#9cc2ff;text-transform:uppercase}
.credit{display:flex;align-items:center;gap:8px;font:500 12.5px var(--f-head);color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.credit img{width:26px;height:26px}.credit b{font-weight:700;color:#fff}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}

.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}
.btn{font:600 .74em var(--f-head);padding:.5em .95em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--band);color:var(--band-ink);border-color:transparent}
.btn.lift{background:var(--sticky);color:var(--sticky-ink);border-color:transparent;font-family:var(--f-hand);font-size:1.05em;font-weight:700}
.flapc{margin-top:.5em;border-radius:.45em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 6px,var(--cover-2) 6px 12px);padding:.9em;text-align:center}
.ans{margin-top:.5em;padding:.6em .75em;border-left:.25em solid var(--ok);background:var(--ok-bg);border-radius:.3em;font-size:.92em;white-space:pre-line;line-height:1.45}
textarea.dr{width:100%;box-sizing:border-box;min-height:4.2em;margin-top:.4em;border:1px dashed var(--line);border-radius:.45em;background:var(--paper);color:var(--ink);font:inherit;font-size:.9em;padding:.5em;resize:vertical}

/* labs */
.labh{display:flex;align-items:center;gap:.55em;margin:0 0 .5em}
.labh .lb{flex:none;background:var(--red);color:#fff;font:700 .6em var(--f-head);letter-spacing:.16em;padding:.3em .65em;border-radius:.3em}
.labh h3{margin:0;font:700 1.08em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.labi{font-size:.88em;color:var(--ink-2);margin:.2em 0 .6em}
.modes{display:flex;flex-wrap:wrap;gap:.35em;margin:.3em 0 .6em}
.svgw{background:var(--paper-2);border:1px solid var(--line);border-radius:.6em;padding:.4em;margin:.3em 0}
.svgw svg{display:block;width:100%;height:auto;max-height:calc(var(--ph) * .44)}
.rg{cursor:pointer;stroke:var(--paper);stroke-width:2.5;transition:filter .15s, opacity .15s}
.rg:hover{filter:brightness(1.07)}
.rg.dim{opacity:.35}
.svgtxt{font:700 11px var(--f-head);fill:var(--ink);pointer-events:none;letter-spacing:.06em}
.svgsm{font:600 8.5px var(--f-head);fill:var(--muted);pointer-events:none;letter-spacing:.08em}
.pinbtn{cursor:pointer}
.pinbtn circle.d{fill:var(--card);stroke:var(--navy);stroke-width:1.6}
.pinbtn.on circle.d{fill:var(--sticky);stroke:var(--red)}
.pinbtn.ok circle.d{fill:var(--ok)}
.pinbtn.bad circle.d{fill:var(--bad)}
.pinbtn text{font:700 8px var(--f-head);fill:var(--navy-ink);pointer-events:none}
.plab{font:700 8.6px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;pointer-events:none}
.key{columns:2;column-gap:1.2em;margin:.3em 0 .4em;padding-left:1.6em;font-size:.8em;line-height:1.45}.key li{break-inside:avoid}
.info{background:var(--card);border:1px solid var(--line);border-radius:.55em;padding:.55em .7em;font-size:.88em;margin:.4em 0;min-height:2.6em}
.info h4{margin:0 0 .2em;font:700 .95em var(--f-head);color:var(--navy-ink)}
.fb{font:700 .8em var(--f-head);margin:.3em 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:.35em;margin:.4em 0 .7em;min-height:1.8em}
.chip{font:700 .74em var(--f-body);padding:.36em .62em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.2;text-align:left}
.chip.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.chip.hl{background:var(--band);color:var(--band-ink);border-color:transparent}
.chip.dim{opacity:.35}
.chip.cut{background:var(--bad);color:#fff;border-color:transparent}
.chip.lost{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chip.weak{background:#fff4d6;border-color:#e0a422;color:#8a5a00}
:root[data-theme="dark"] .chip.weak{background:#433513;color:#f3cf74}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.weak{background:#433513;color:#f3cf74} }
.chip.unk{border-style:dashed}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.4em,1fr));gap:.45em}
.bin{border:1.5px dashed var(--edge);border-radius:.6em;padding:.45em;min-height:4.2em;cursor:pointer;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:.3em;align-items:flex-start}
.bin:hover{border-color:var(--blue)}
.bin h5{margin:0;font:700 .68em var(--f-head);letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase}
.bin small{font-size:.66em;color:var(--muted);margin-top:-.25em}
.bin .in{display:flex;flex-wrap:wrap;gap:.25em}
.seqline{display:flex;flex-wrap:wrap;align-items:center;gap:.3em;min-height:2.2em;margin:.3em 0 .6em;padding:.4em;border-radius:.5em;background:var(--paper-2);border:1px solid var(--line)}
.seqline .n{font:700 .62em var(--f-head);color:var(--muted)}
.gcols{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:.5em}
.gcols h5{margin:0 0 .3em;font:700 .62em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcol{display:flex;flex-direction:column;gap:.3em;align-items:stretch}
.gcol .chip{font-size:.68em}
.st{font:700 .62em var(--f-head);padding:.12em .5em;border-radius:1em;margin-left:.3em;white-space:nowrap}
.st.lost{background:var(--bad);color:#fff}.st.weak{background:#e0a422;color:#fff}.st.ok{background:var(--ok);color:#fff}
.done{margin:.5em 0;padding:.5em .7em;border-radius:.45em;background:var(--ok-bg);color:var(--ok);font:700 .82em var(--f-head)}
.ref{margin-top:.8em;font:600 .62em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.title-page{display:flex;flex-direction:column;min-height:100%;justify-content:center;gap:.6em}
.kick{font:600 .66em var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.ttl{margin:0;font:700 1.95em/1.12 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sub{color:var(--ink-2);font-size:.95em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.6em 0}
.facts div{background:var(--paper-2);border:1px solid var(--line);border-radius:.55em;padding:.55em;text-align:center}
.facts b{display:block;font:700 1.35em var(--f-head);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.facts span{font:600 .58em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.map{list-style:none;padding:0;margin:.4em 0;display:flex;flex-direction:column;gap:.3em}
.map li button{width:100%;display:flex;align-items:center;gap:.6em;padding:.45em .55em;border-radius:.5em;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.map li button:hover{border-color:var(--blue)}
.map .mn{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--band-ink);font:700 .7em var(--f-head)}
.map .mt{flex:1;font:600 .86em var(--f-head);color:var(--navy-ink)}
.map .mp{font:600 .7em var(--f-head);color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:auto 1fr;gap:.35em .6em;align-items:center;font-size:.82em;margin:.5em 0}
.legend i{font-style:normal;width:1.8em;height:1.3em;border-radius:.25em;display:inline-block}
body.rapid .tx, body.rapid .hook{display:none}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,.55);padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:100%;overflow:auto;border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.45);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.ph h2{margin:0;font:700 17px var(--f-head);color:var(--navy-ink);flex:1;min-width:0}
.ph .x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.pb{padding:14px 16px 18px}
.pb .qb{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;font:600 13px var(--f-head);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--band);color:var(--band-ink)}
.fc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px 18px 16px;min-height:150px;font-size:17px;line-height:1.55;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.fc .ctx{font:600 11px var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.blank{display:inline-block;min-width:3.2em;border-radius:6px;padding:0 .35em;margin:0 .1em;background:var(--chip);border:1px dashed var(--blue);color:transparent;cursor:pointer;line-height:1.35}
.blank.r{background:var(--hl);border-style:solid;border-color:transparent;color:var(--ink);font-weight:700;cursor:default}
.fcx{margin-top:12px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;cursor:pointer;font:700 14px var(--f-head);color:var(--ink)}
.grade small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.grade .g0{border-color:var(--bad);color:var(--bad)}.grade .g1{border-color:var(--blue);color:var(--blue)}.grade .g2{border-color:var(--ok);color:var(--ok)}
.meter{display:flex;gap:14px;flex-wrap:wrap;font:600 12px var(--f-head);color:var(--muted);margin:10px 0}
.meter b{color:var(--navy-ink);font-variant-numeric:tabular-nums}
.big{font:700 40px var(--f-head);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.lst{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.lst button.it{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--ink);font-size:14px}
.lst .pgn{font:700 12px var(--f-head);color:var(--blue);flex:none;font-variant-numeric:tabular-nums}
input.srch{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px;font-size:15px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:9px 16px;border-radius:12px;font:600 13px var(--f-head);z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.35)}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* section priority chips */
.sh .sht{display:inline-flex;flex-wrap:wrap;gap:.3em;margin-left:auto}
.sh .sht .tg{font-size:.56em;white-space:nowrap}
/* recall lab: the start of each fact stays visible, the rest is covered until tapped */
.rcg{margin:.85em 0 .3em;font:700 .72em var(--f-head);letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase}
.rci{display:block;width:100%;text-align:left;margin:.3em 0;padding:.45em .6em;border-radius:.45em;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.92em;line-height:1.45;cursor:pointer}
.rci .cue{font-weight:700;color:var(--navy-ink)}
.rci .hid{color:transparent;border-radius:.25em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rci.on{border-color:var(--ok);background:var(--ok-bg)}
/* figures in questions */
.qf{margin:.5em 0 .6em;text-align:center}
.qf img{max-width:100%;max-height:calc(var(--ph) * .42);border-radius:.4em;border:1px solid var(--line);background:#fff}
.panel .qf img{max-height:46vh}
.qf figcaption{font-size:.74em;color:var(--muted);margin-top:.25em}
/* links back to the library and on to the next lecture */
.libl{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-head);color:#fff;text-decoration:none;padding:7px 12px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.endnav{display:flex;flex-direction:column;gap:.5em;margin:.8em 0}
.endnav a{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.7em .85em;border-radius:.6em;border:1px solid var(--line);background:var(--card);color:var(--navy-ink);text-decoration:none;font:600 .9em var(--f-head)}
.endnav a small{display:block;font:500 .78em var(--f-body);color:var(--muted)}
/* real-image lab: the slide picture with its own printed labels as tap targets */
.slw{position:relative;margin:.35em 0;border-radius:.5em;overflow:hidden;border:1px solid var(--line);background:#fff}
.slw img{display:block;width:100%;height:auto}
.slo{position:absolute;inset:0}
.sb{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:.3em;cursor:pointer;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.sb.cv{background:repeating-linear-gradient(135deg,#d6cfbe 0 5px,#e9e3d5 5px 10px);box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.sb.on{box-shadow:0 0 0 2px var(--ok)}
.sb.sel{box-shadow:0 0 0 3px #2e86de}
.sb.hl{box-shadow:0 0 0 3px #ffc928;animation:slpulse 1.3s ease-in-out infinite}
.sb.dim{background:rgba(255,255,255,.62)}
.sb.lost{box-shadow:0 0 0 3px #d64545;background:rgba(214,69,69,.28)}
.sb.weak{box-shadow:0 0 0 3px #e0a422;background:rgba(224,164,34,.25)}
.sb.ok{box-shadow:0 0 0 3px #1e9e62;background:rgba(30,158,98,.18)}
.sb.bad{box-shadow:0 0 0 3px #d64545;background:rgba(214,69,69,.22)}
.sb.mk{border-radius:50%}
@keyframes slpulse{0%,100%{box-shadow:0 0 0 3px #ffc928,0 0 4px 2px rgba(255,201,40,.55)}50%{box-shadow:0 0 0 3px #ffc928,0 0 16px 6px rgba(255,201,40,.95)}}
.slx .chiprow{display:flex;flex-wrap:wrap;gap:.3em;margin:.35em 0}
.panel.wide{width:min(1100px,100%)}
.slbig .slw{min-width:760px}
.slbigw{overflow:auto;-webkit-overflow-scrolling:touch}
/* iPhone/iPad: Safari zooms into any text field under 16px when it is tapped */
@supports (-webkit-touch-callout:none){ input.srch,textarea.dr{font-size:16px} }
</style>

</head>

<div id="app">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="Back to the cover"><img class="bdg" src="helpers_badge_64.png" alt="" onerror="this.remove()"><b>MSK<em class="bw"> Interactive</em> Book</b><span id="chap"></span></button>
    <div class="sp"></div>
    <span class="pgind" id="pgind"></span>
    <div class="prog" title="Pages read"><i id="progi" style="width:0"></i></div>
    <button class="ib" data-act="open-toc" aria-label="Contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lb">Contents</span></button>
    <button class="ib" data-act="open-search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="lb">Search</span></button>
    <button class="ib" data-act="open-cards" aria-label="Flashcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg><span class="lb">Flashcards</span></button>
    <button class="ib" data-act="open-exam" aria-label="Exam mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg><span class="lb">Exam</span></button>
    <button class="ib" data-act="open-mist" aria-label="Mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span class="lb">Mistakes</span></button>
    <button class="ib" data-act="open-set" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="lb">Settings</span></button>

  <main class="stage" id="stage">

      <div class="pg pg-l" id="pgL"></div>

      <div class="leaf" id="leaf" hidden><div class="face front" id="lf"></div><div class="face back" id="lb"></div></div>

      <button class="turn next" data-act="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="home" id="home"></div>
  </main>
  <nav class="mnav" id="mnav" hidden>
    <button data-act="prev" aria-label="Previous page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="mid" id="mmid"></span>
    <button data-act="next" aria-label="Next page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>

 "q": "Q0128"}, {"t": "check", "q": "N-ANA-L2-05"}]}, {"id": "p43", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-ANA-L2-10"}]}, {"id": "p44", "head": "Part 07 · Movements Compared", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Movements Compared", "sub": "Movements of the shoulder joint · Muscles acting on the shoulder joint — master table"}, {"t": "h", "no": "7.1", "title": "Movements of the shoulder joint"}, {"t": "list", "items": ["<b>Flexion:<\/b> clavicular head <mark>pectoralis major<\/mark>, anterior deltoid, <mark>coracobrachialis<\/mark>, <mark>biceps brachii<\/mark>", "<b>Extension:<\/b> <mark>teres major<\/mark>, <mark>latissimus dorsi<\/mark>, sternocostal head <mark>pectoralis major<\/mark>, posterior deltoid", "<b>Abduction:<\/b> supraspinatus 0–15°, deltoid 15–90°, scapular lateral rotation above 90°", "<b>Above 90°:<\/b> upper and lower trapezius + <mark>lower 5 digitations of serratus anterior<\/mark>", "<b>Adduction:<\/b> <mark>pectoralis major<\/mark>, <mark>teres major<\/mark>, <mark>latissimus dorsi<\/mark>, <mark>subscapularis<\/mark>", "<b>Medial rotation:<\/b> the four adductors + anterior deltoid"]}], "toc": ["07", "Movements Compared"]}, {"id": "p45", "head": "Part 07 · Movements Compared", "kind": "text", "blocks": [{"t": "list", "items": ["<b>Lateral rotation:<\/b> <mark>infraspinatus<\/mark>, <mark>teres minor<\/mark>, posterior deltoid", "<b>Circumduction:<\/b> flexion + abduction + extension + adduction"]}, {"t": "h", "no": "7.2", "title": "Muscles acting on the shoulder joint — master table"}, {"t": "list", "items": ["<mark>Pectoralis major<\/mark>: lateral lip; medial and lateral pectoral nerves", "<b>Latissimus dorsi:<\/b> floor of groove; thoracodorsal nerve", "<b>Deltoid:<\/b> deltoid tuberosity; axillary nerve", "<b>Supraspinatus and infraspinatus:<\/b> suprascapular nerve; teres minor: axillary nerve", "<mark>Subscapularis<\/mark>: lesser tuberosity; teres major: medial lip, lower subscapular nerve", "<b>Coracobrachialis and biceps:<\/b> flexion only; no attachment or nerve given in lecture"]}]}, {"id": "p46", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l2-6-0", "title": "Recall · Movements Compared (1/2)", "groups": [{"title": "7.1 Movements of the shoulder joint", "items": [["Flexion:", "clavicular head pectoralis major, anterior deltoid, coracobrachialis, biceps brachii"], ["Extension:", "teres major, latissimus dorsi, sternocostal head pectoralis major, posterior deltoid"], ["Abduction:", "supraspinatus 0–15°, deltoid 15–90°, scapular lateral rotation above 90°"], ["Above 90°:", "upper and lower trapezius + lower 5 digitations of serratus anterior"], ["Adduction:", "pectoralis major, teres major, latissimus dorsi, subscapularis"], ["Medial rotation:", "the four adductors + anterior deltoid"], ["Lateral rotation:", "infraspinatus, teres minor, posterior deltoid"], ["Circumduction:", "flexion + abduction + extension + adduction"]]}]}], "labName": "Recall · Movements Compared (1/2)"}, {"id": "p47", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l2-6-1", "title": "Recall · Movements Compared (2/2)", "groups": [{"title": "7.2 Muscles acting on the shoulder joint — master table", "items": [["Pectoralis major:", "lateral lip; medial and lateral pectoral nerves"], ["Latissimus dorsi:", "floor of groove; thoracodorsal nerve"], ["Deltoid:", "deltoid tuberosity; axillary nerve"], ["Supraspinatus and infraspinatus:", "suprascapular nerve; teres minor: axillary nerve"], ["Subscapularis:", "lesser tuberosity; teres major: medial lip, lower subscapular nerve"], ["Coracobrachialis and biceps:", "flexion only; no attachment or nerve given in lecture"]]}]}], "labName": "Recall · Movements Compared (2/2)"}, {"id": "p48", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0072"}, {"t": "flap", "q": "Q0020"}]}, {"id": "p49", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0023"}]}, {"id": "p50", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["<b>Glenoid labrum:<\/b> rim of fibrocartilage attached to cavity margins", "Anterior dislocation (95%) may damage axillary nerve", "<b>Initiator of abduction:<\/b> supraspinatus (0–15°)", "Rotator cuff deficient inferiorly; supraspinatus tendon most commonly affected", "Circumduction = flexion + abduction + extension + adduction"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["SITS = supraspinatus, infraspinatus, teres minor, subscapularis", "<b>Abduction relay:<\/b> supraspinatus (0–15°) → deltoid (15–90°) → scapular rotation (&gt;90°)", "Teres minor → axillary N.; teres major → lower subscapular N."]}], "toc": ["08", "Rapid Revision"]}, {"id": "p51", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "list", "items": ["<b>Pectoralis major:<\/b> clavicular head flexes, sternocostal head extends"]}]}, {"id": "p52", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l2-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Glenoid labrum:", "rim of fibrocartilage attached to cavity margins"], ["Anterior dislocation", "(95%) may damage axillary nerve"], ["Initiator of abduction:", "supraspinatus (0–15°)"], ["Rotator cuff deficient", "inferiorly; supraspinatus tendon most commonly affected"], ["Circumduction =", "flexion + abduction + extension + adduction"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["SITS =", "supraspinatus, infraspinatus, teres minor, subscapularis"], ["Abduction relay:", "supraspinatus (0–15°) → deltoid (15–90°) → scapular rotation (&gt;90°)"], ["Teres minor →", "axillary N.; teres major → lower subscapular N."], ["Pectoralis major:", "clavicular head flexes, sternocostal head extends"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p53", "head": "Real images · 1 of 4", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one; the muscle pictures also have <b>Movements<\/b> and <b>Cut a nerve<\/b>. Every slide of the session is in the practical book: <a href=\"prac-ana-1.html\">Anatomy practical · Practical 1 – Shoulder region<\/a>."}, {"t": "lab", "lab": "sl21"}], "toc": ["◉", "Real images from the practical"], "labName": "Shoulder region · slide 19"}, {"id": "p54", "head": "Real images · 2 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl22"}], "labName": "HUMERUS"}, {"id": "p55", "head": "Real images · 3 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl24"}], "labName": "Shoulder region · slide 22"}, {"id": "p56", "head": "Real images · 4 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl25"}], "labName": "Shoulder region · slide 23"}, {"id": "p57", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "h", "no": "?", "title": "Name it — spotter practice"}, {"t": "note", "kind": "hy", "title": "How it works", "html": "1 picture from the practical slides of this lecture, each with its title and every label covered, in a new order. Say what it is out loud, then pick. Every one is also in Exam mode."}], "toc": ["?", "Name it — spotter practice"]}, {"id": "p58", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-20"}]}, {"id": "p59", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Two necks of the humerus: anatomical neck and surgical neck"}, {"t": "note", "kind": "trap", "html": "Bicipital groove: pectoralis major → lateral lip, latissimus dorsi → floor, teres major → medial lip"}, {"t": "note", "kind": "trap", "html": "Teres minor is supplied by the axillary nerve, not the suprascapular"}, {"t": "note", "kind": "trap", "html": "Teres major (lower subscapular N.) is not one of the 4 rotator cuff muscles (SITS)"}, {"t": "note", "kind": "trap", "html": "Cuff deficient inferiorly; capsule also loose inferiorly"}, {"t": "note", "kind": "trap", "html": "Anterior dislocation → axillary nerve; posterior → seizures, electrocution"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p60", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Supraspinatus range: 0–15° (table) vs first 15–20° (abduction mechanics slide)"}, {"t": "note", "kind": "trap", "html": "Pectoralis major: clavicular head flexes, sternocostal head extends"}, {"t": "note", "kind": "cl", "html": "Shoulder is the most frequently dislocated joint because the glenoid fossa is shallow"}, {"t": "note", "kind": "cl", "html": "Anterior dislocation (95%) may damage axillary nerve; posterior (4%) from seizures and electrocution"}, {"t": "note", "kind": "cl", "html": "Rotator cuff tendons may tear or inflame; supraspinatus most commonly affected; pain anterosuperiorly during abduction"}, {"t": "note", "kind": "cl", "html": "Anterior shoulder dislocation often associated with rotator cuff tears"}]}, {"id": "p61", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Y26-068": {"id": "Y26-068", "stem": "A muscle inserts on the lateral lip of the intertubercular sulcus of the humerus and contributes to adduction and medial rotation of the arm. Which muscle is it?", "top": true, "rep": "", "tag": "Final bank ANA Q10", "bank": true, "expl": "Three muscles attach to the bicipital (intertubercular) groove: pectoralis major to its lateral lip, latissimus dorsi to its floor and teres major to its medial lip ('a lady between two majors'). Pectoralis major adducts and medially rotates the arm; teres minor and supraspinatus attach to the greater tuberosity instead.", "type": "mcq", "opts": ["Teres minor", "Supraspinatus", "Pectoralis major", "Brachialis", "Pectoralis minor"], "ans": 2}, "Q0006": {"id": "Q0006", "stem": "Which of the following muscles could perform adduction of the arm?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Teres major runs from the lateral border of the scapula to the medial lip of the bicipital groove and adducts and medially rotates the arm; the other adductors are pectoralis major, latissimus dorsi and subscapularis. Trapezius and serratus anterior rotate the scapula laterally to raise the arm above 90°, and supraspinatus and deltoid are abductors.", "type": "mcq", "opts": ["Supraspinatus", "Teres major", "Serratus anterior", "Deltoid", "Trapezius"], "ans": 1}, "Y26-079": {"id": "Y26-079", "stem": "1. What muscles are indicated in the figure?\n2. What are the origin and insertion of the indicated muscle?\n3. Based on the direction of its fibers and its attachment to the humerus, which movements can these muscles produce at the shoulder joint?\n4. Which of the following combinations includes the two principal movements produced by this muscle?\na) Flexion and abduction\nb) Abduction and lateral rotation\nc) Flexion and medial rotation\nd) Extension and medial rotation\ne) Flexion, abduction, and adduction", "top": true, "rep": "", "tag": "Final bank ANA W10", "bank": true, "expl": "The marked area is the greater tuberosity, to whose back supraspinatus, infraspinatus and teres minor are attached after arising from the back of the scapula. Supraspinatus initiates abduction while infraspinatus and teres minor laterally rotate the arm, so the two principal movements are abduction and lateral rotation.", "img": ["figs/GA-28.jpg"], "cap": "Upper end of the humerus (drawing); the questions refer to the area marked in red.", "type": "written", "keyhtml": "1. The muscles attached to the marked greater tubercle (tuberosity) of the humerus: supraspinatus, infraspinatus and teres minor (three of the four rotator cuff muscles, SITS).\n2. Each arises from the back of the scapula and is inserted into the back of the greater tuberosity of the humerus.\n3. Supraspinatus initiates abduction of the arm; infraspinatus and teres minor laterally rotate the arm. (As part of the rotator cuff, their tone also helps to stabilize the shoulder joint.)\n4. b) Abduction and lateral rotation"}, "Q0020": {"id": "Q0020", "stem": "Mention the muscles that abduct the arm.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Abduction is a relay: supraspinatus initiates it, the middle fibres of deltoid continue from 15° to 90°, and raising the arm above the head takes place by lateral rotation of the scapula by trapezius and serratus anterior.", "type": "written", "keyhtml": "• Supraspinatus: initiates abduction (with the arm by the side, deltoid pulls vertically on the humerus and is ineffective)\n• Deltoid (middle fibres): abducts the arm from 15° to 90°\n• Above 90° (raising the arm above the head): lateral rotation of the scapula by the upper and lower fibres of trapezius and the lower 5 digitations of serratus anterior"}, "Q0023": {"id": "Q0023", "stem": "Mention two muscles acting on the shoulder joint that have a double nerve supply.", "top": false, "rep": "", "tag": "Final bank ANA W12", "bank": true, "expl": "Pectoralis major is supplied by the medial and lateral pectoral nerves and subscapularis by the upper and lower subscapular nerves. Teres major, by contrast, receives only the lower subscapular nerve.", "type": "written", "keyhtml": "• Pectoralis major: medial and lateral pectoral nerves\n• Subscapularis: upper and lower subscapular nerves"}, "Q0060": {"id": "Q0060", "stem": "Which of the following is NOT included in the lower end of the humerus?", "top": false, "rep": "", "tag": "Final bank ANA Q24", "bank": true, "expl": "The greater tubercle (tuberosity) belongs to the proximal end of the humerus, with the head, the anatomical and surgical necks and the lesser tubercle. The olecranon fossa, trochlea and medial and lateral epicondyles are all features of the distal end.", "type": "mcq", "opts": ["Olecranon fossa", "Greater tubercle", "Trochlea", "Epicondyles"], "ans": 1}, "Q0063": {"id": "Q0063", "stem": "Following a radical mastectomy procedure, a surgeon plans to conduct a breast reconstruction utilizing a latissimus dorsi muscle flap. What nerve will the surgeon need to keep intact during the surgical dissection of the chest wall to prevent atrophy of the muscle flap?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q21", "bank": true, "expl": "Latissimus dorsi is supplied by the thoracodorsal nerve (the nerve to latissimus dorsi), so keeping this nerve intact keeps the flap innervated and prevents atrophy. The medial pectoral nerve supplies pectoralis major (with the lateral pectoral nerve), and the axillary nerve supplies deltoid and teres minor.", "type": "mcq", "opts": ["Long thoracic nerve", "Intercostobrachial nerve", "Medial pectoral nerve", "Thoracodorsal nerve", "Axillary nerve"], "ans": 3}, "Q0067": {"id": "Q0067", "stem": "A 27-year-old man was admitted to the emergency department after an automobile collision in which he suffered a fracture of the lateral border of the scapula. Six weeks after the accident, physical examination reveals weakness in medial rotation and adduction of the humerus. Which of the following muscles was most likely injured?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q11", "bank": true, "expl": "The fracture involves the lateral border of the scapula, from which teres major runs to the medial lip of the bicipital groove; of the muscles that both adduct and medially rotate the arm (pectoralis major, teres major, latissimus dorsi, subscapularis), it is the one attached there. Teres minor is the tempting distractor, but it attaches to the back of the greater tuberosity and is a lateral rotator.", "type": "mcq", "opts": ["Teres minor", "Teres major", "Supraspinatus", "Infraspinatus", "Levator scapulae"], "ans": 1}, "Q0069": {"id": "Q0069", "stem": "A 31-year-old male hockey player fell on his elbow and is admitted to the emergency department. Radiographic examination reveals a fracture of the surgical neck of the humerus, producing elevation and adduction of the distal fragment. Which of the following muscles would most likely cause the adduction of the distal fragment?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q12", "bank": true, "expl": "Pectoralis major is the main adductor (and medial rotator) of the arm at the shoulder joint, together with teres major, latissimus dorsi and subscapularis, so it pulls the distal fragment into adduction. Teres minor is a lateral rotator and supraspinatus initiates abduction, while brachialis and pectoralis minor are not among the muscles acting on the shoulder joint.", "img": ["figs/GA-11.jpg"], "cap": "Radiograph of the shoulder.", "type": "mcq", "opts": ["Brachialis", "Teres minor", "Pectoralis major", "Supraspinatus", "Pectoralis minor"], "ans": 2}, "Q0070": {"id": "Q0070", "stem": "If the entire greater tubercle of the humerus was broken away as a result of an injury, which of the following movements of the humerus would be affected?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q13", "bank": true, "expl": "Supraspinatus, infraspinatus and teres minor all attach to the back of the greater tuberosity; supraspinatus initiates abduction, while infraspinatus and teres minor laterally rotate the arm. The medial rotators insert elsewhere (subscapularis into the lesser tuberosity; pectoralis major, latissimus dorsi and teres major into the bicipital groove), so medial rotation is spared.", "img": ["figs/GA-13.jpg"], "cap": "Drawing and radiograph of the injured upper end of the humerus.", "type": "mcq", "opts": ["Flexion and abduction", "Abduction and lateral rotation", "Flexion and medial rotation", "Extension and medial rotation", "Flexion, abduction, and adduction"], "ans": 1}, "Q0071": {"id": "Q0071", "stem": "Concerning the teres major muscle, which of the following is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Teres major inserts into the medial lip of the bicipital groove, is supplied by the lower subscapular nerve, and adducts and medially rotates the arm. It is not one of the four rotator cuff muscles (SITS); teres minor is the cuff muscle supplied by the axillary nerve.", "type": "mcq", "opts": ["It is one of the rotator cuff muscles", "It is supplied by the axillary nerve", "It can do lateral rotation of the arm", "It is supplied by the suprascapular nerve", "It is inserted in the bicipital groove"], "ans": 4}, "Q0072": {"id": "Q0072", "stem": "Which of the following muscles helps raise the arm above 90° of abduction?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Raising the arm above the head (above 90°) takes place by lateral rotation of the scapula, done by the upper and lower fibres of trapezius and the lower 5 digitations of serratus anterior. Deltoid's middle fibres abduct the arm only from 15° to 90°.", "type": "mcq", "opts": ["Supraspinatus", "Deltoid", "Teres minor", "Teres major", "Serratus anterior"], "ans": 4}, "Q0124": {"id": "Q0124", "stem": "What muscles are necessary to raise the arm above the shoulder?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q22", "bank": true, "expl": "With the arm by the side, deltoid pulls vertically on the humerus and is ineffective, so supraspinatus initiates abduction; the middle fibres of deltoid then abduct from 15° to 90°, and above 90° the scapula is rotated laterally by trapezius and serratus anterior. Option a is the trap: deltoid cannot start abduction.", "type": "mcq", "opts": ["First the deltoid, next the supraspinatus, and then the serratus anterior", "First the supraspinatus, next the deltoid, and then the serratus anterior", "First the serratus anterior, next the deltoid, and then the supraspinatus", "First the supraspinatus, next the serratus anterior, and then the deltoid"], "ans": 1}, "Q0127": {"id": "Q0127", "stem": "A 21-year-old woman walks in with a shoulder and arm injury after falling during horseback riding. Examination indicates that she cannot adduct her arm because of paralysis of which of the following muscles?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q23", "bank": true, "expl": "Latissimus dorsi inserts into the floor of the bicipital groove and adducts and medially rotates the arm. Supraspinatus initiates abduction, and infraspinatus and teres minor are lateral rotators.", "type": "mcq", "opts": ["Supraspinatus", "Infraspinatus", "Latissimus dorsi", "Teres minor"], "ans": 2}, "Q0128": {"id": "Q0128", "stem": "Rotator cuff muscles surround the shoulder joint from nearly all aspects, but they are deficient:", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q14", "bank": true, "expl": "The rotator cuff covers the anterior, posterior and superior aspects of the shoulder joint but is deficient inferiorly, which is the site of potential weakness of the joint. The capsule is also thin and loose inferiorly to permit a wide range of movement.", "type": "mcq", "opts": ["Anteriorly", "Posteriorly", "Inferiorly", "Superiorly"], "ans": 2}, "Q0130": {"id": "Q0130", "stem": "A 19-year-old man is brought to the emergency department after dislocating his shoulder while playing football. Following treatment of the dislocation, he cannot initiate abduction of his arm. An MRI of the shoulder shows a torn muscle. Which muscle was most likely damaged by the injury?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q15", "bank": true, "expl": "Supraspinatus initiates abduction, because with the arm by the side deltoid pulls vertically on the humerus and is ineffective. Anterior shoulder dislocation is often associated with rotator cuff tears, and the supraspinatus tendon is the one most commonly affected; teres major is not a rotator cuff muscle and adducts and medially rotates the arm.", "type": "mcq", "opts": ["Pectoralis minor", "Long head of the triceps", "Coracobrachialis", "Supraspinatus", "Teres major"], "ans": 3}, "Q0147": {"id": "Q0147", "stem": "A 25-year-old basketball player falls on his outstretched hand. He feels a sudden pain in his shoulder and is unable to move it. On examination, the shoulder appears flattened laterally, and the humeral head can be felt beneath the coracoid process.\n1. What type of dislocation is most likely?\n2. Which nerve is at risk of injury?\n3. Which muscles are affected by this nerve injury?\n4. What sensory loss might occur?", "top": false, "rep": "", "tag": "Final bank ANA W11", "bank": true, "expl": "Of the two shoulder dislocations, anterior dislocation is the common one (95%) and the one that may damage the axillary nerve; posterior dislocation is rarer (4%) and is often caused by seizures and electrocution injuries. The axillary nerve (C5, C6) supplies deltoid, teres minor and the upper cutaneous nerve of the arm.", "type": "written", "keyhtml": "1. Anterior dislocation of the shoulder joint (the common type, 95%)\n2. Axillary nerve (C5, C6): anterior dislocation may damage it\n3. Deltoid and teres minor\n4. Loss of sensation in the skin supplied by the axillary nerve's cutaneous branch, the upper cutaneous nerve of the arm"}, "Q0150": {"id": "Q0150", "stem": "Which of the following muscles has a dual nerve supply?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q16", "bank": true, "expl": "Subscapularis is supplied by both the upper and lower subscapular nerves. Teres major is the tempting distractor: it receives only the lower subscapular nerve, while supraspinatus and infraspinatus are supplied by the suprascapular nerve and teres minor by the axillary nerve.", "type": "mcq", "opts": ["Teres minor", "Infraspinatus", "Teres major", "Supraspinatus", "Subscapularis"], "ans": 4}, "Q0165": {"id": "Q0165", "stem": "The subscapular nerves supply which of the following muscles?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q17", "bank": true, "expl": "Teres major is supplied by the lower subscapular nerve (subscapularis by the upper and lower subscapular nerves). Deltoid and teres minor are supplied by the axillary nerve, and supraspinatus and infraspinatus by the suprascapular nerve.", "type": "mcq", "opts": ["Deltoid", "Teres major", "Supraspinatus", "Teres minor", "Infraspinatus"], "ans": 1}, "Q0167": {"id": "Q0167", "stem": "Which of the following muscles abducts the arm from 0 to 15 degrees?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q18", "bank": true, "expl": "When the arm is by the side, deltoid pulls vertically on the humerus and is ineffective, so supraspinatus initiates abduction from 0° to 15°. Deltoid is the tempting distractor: its middle fibres take over from 15° to 90°, while pectoralis major adducts the arm.", "type": "mcq", "opts": ["Infraspinatus", "Trapezius", "Pectoralis major", "Supraspinatus", "Deltoid"], "ans": 3}, "Q0168": {"id": "Q0168", "stem": "Which of the following muscles is inserted in the bicipital groove?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q19", "bank": true, "expl": "Teres major inserts into the medial lip of the bicipital groove, with latissimus dorsi on the floor and pectoralis major on the lateral lip ('a lady between two majors'). Supraspinatus, infraspinatus and teres minor insert into the back of the greater tuberosity, and deltoid into the deltoid tuberosity.", "type": "mcq", "opts": ["Deltoid", "Teres major", "Teres minor", "Supraspinatus", "Infraspinatus"], "ans": 1}, "Q0170": {"id": "Q0170", "stem": "The thoracodorsal nerve supplies which of the following muscles?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q20", "bank": true, "expl": "The thoracodorsal nerve is the nerve to latissimus dorsi. Serratus anterior is supplied by the long thoracic nerve and pectoralis major, the other trunk muscle inserting into the bicipital groove, by the medial and lateral pectoral nerves.", "type": "mcq", "opts": ["Serratus anterior", "Trapezius", "Levator scapulae", "Latissimus dorsi", "Pectoralis major"], "ans": 3}, "N-ANA-L2-01": {"id": "N-ANA-L2-01", "stem": "A sports physician explains to a 22-year-old swimmer with an unstable shoulder that, of the ligaments of the shoulder joint, one in particular plays an important role in stabilizing the joint. Which ligament is the physician referring to?", "top": false, "rep": "", "tag": "Final bank ANA Q25", "bank": true, "expl": "There are three glenohumeral ligaments (superior, middle and inferior), and the inferior one in particular plays an important role in stabilizing the shoulder joint. The coracohumeral ligament supports the superior aspect of the capsule, and the transverse humeral ligament holds the tendon of the long head of biceps in the bicipital groove.", "type": "mcq", "opts": ["Coracohumeral ligament", "Superior glenohumeral ligament", "Middle glenohumeral ligament", "Inferior glenohumeral ligament", "Transverse humeral ligament"], "ans": 3}, "N-ANA-L2-02": {"id": "N-ANA-L2-02", "stem": "A 35-year-old man is brought to the emergency department after an electrocution injury at work. He holds his arm still, and an X-ray confirms a dislocation of the shoulder joint. Which of the following best describes the most likely dislocation?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Posterior dislocation of the shoulder is rarer (4%) and is often caused by seizures and electrocution injuries. Anterior dislocation is the common type (95%) and may damage the axillary nerve.", "type": "mcq", "opts": ["Anterior dislocation, the commoner type (95%)", "Posterior dislocation, the rarer type (4%)", "Anterior dislocation, the rarer type (4%)", "Posterior dislocation, the commoner type (95%)"], "ans": 1}, "N-ANA-L2-03": {"id": "N-ANA-L2-03", "stem": "During arthroscopy of the shoulder joint, a surgeon inspects a rim of fibrocartilage attached to the margins of the glenoid cavity. Which structure is this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The glenoid labrum is the rim of fibrocartilage attached to the margins of the glenoid cavity of the shoulder joint. The coracohumeral ligament supports the superior aspect of the capsule, and the inferior glenohumeral ligament stabilizes the joint.", "type": "mcq", "opts": ["Glenoid labrum", "Coracohumeral ligament", "Transverse humeral ligament", "Superior glenohumeral ligament", "Inferior glenohumeral ligament"], "ans": 0}, "N-ANA-L2-04": {"id": "N-ANA-L2-04", "stem": "A physiotherapist wants to test the posterior fibres of the deltoid in a patient recovering from a shoulder injury. Which movements of the arm should she ask the patient to perform against resistance?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The posterior fibres of deltoid extend and laterally rotate the arm, while the anterior fibres flex and medially rotate it and the middle fibres abduct it from 15° to 90° (Front → Flex, Middle → Mid-range, Back → extend).", "type": "mcq", "opts": ["Flexion and medial rotation", "Extension and lateral rotation", "Abduction from 15° to 90°", "Adduction and medial rotation", "Flexion and lateral rotation"], "ans": 1}, "N-ANA-L2-05": {"id": "N-ANA-L2-05", "stem": "After an anterior dislocation of the shoulder, a 30-year-old man is found to have damage to the axillary nerve. Which rotator cuff muscle is most likely to be weakened?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The axillary nerve (C5, C6) supplies teres minor and deltoid, and anterior dislocation may damage it. Supraspinatus and infraspinatus are supplied by the suprascapular nerve, and subscapularis by the upper and lower subscapular nerves.", "type": "mcq", "opts": ["Supraspinatus", "Infraspinatus", "Teres minor", "Subscapularis"], "ans": 2}, "N-ANA-L2-06": {"id": "N-ANA-L2-06", "stem": "During a pull-up, a gymnast's hands are fixed on the bar while her trunk is drawn upwards. Which two muscles, acting with their insertions fixed, draw the trunk upwards in this exercise?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In exercise, when the insertions of pectoralis major and latissimus dorsi are fixed, the two muscles draw the trunk upwards; otherwise both adduct and medially rotate the arm. Trapezius and serratus anterior rotate the scapula laterally to raise the arm above 90°.", "type": "mcq", "opts": ["Pectoralis major and latissimus dorsi", "Deltoid and supraspinatus", "Infraspinatus and teres minor", "Trapezius and serratus anterior", "Biceps brachii and coracobrachialis"], "ans": 0}, "N-ANA-L2-07": {"id": "N-ANA-L2-07", "stem": "At a bone-identification station, a student points to the groove between the greater and lesser tubercles of the humerus. Which of the following muscles is attached to the floor of this groove?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Latissimus dorsi inserts into the floor of the bicipital (intertubercular) groove, between pectoralis major on the lateral lip and teres major on the medial lip ('a lady between two majors'). Subscapularis inserts into the lesser tuberosity and deltoid into the deltoid tuberosity.", "type": "mcq", "opts": ["Latissimus dorsi", "Pectoralis major", "Teres major", "Subscapularis", "Deltoid"], "ans": 0}, "N-ANA-L2-08": {"id": "N-ANA-L2-08", "stem": "At a bone-identification station, a student turns a humerus over to examine the posterior aspect of its lower end. Which fossa will the student see there?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The olecranon fossa is the fossa on the posterior aspect of the distal humerus. The coronoid and radial fossae are on the anterior aspect, and the glenoid fossa belongs to the scapula.", "type": "mcq", "opts": ["Coronoid fossa", "Radial fossa", "Olecranon fossa", "Glenoid fossa"], "ans": 2}, "N-ANA-L2-09": {"id": "N-ANA-L2-09", "stem": "During shoulder surgery, a surgeon identifies a ligament that bridges over the tendon of the long head of biceps in the bicipital groove and keeps it in position. Which ligament is this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The transverse humeral ligament bridges over the tendon of the long head of biceps in the bicipital groove to keep it in position (Transverse humeral → biceps Tendon). The coracohumeral ligament supports the superior aspect of the capsule (Coracohumeral → Ceiling).", "type": "mcq", "opts": ["Coracohumeral ligament", "Superior glenohumeral ligament", "Middle glenohumeral ligament", "Inferior glenohumeral ligament", "Transverse humeral ligament"], "ans": 4}, "N-ANA-L2-10": {"id": "N-ANA-L2-10", "stem": "Enumerate the muscles of the rotator cuff with the nerve supply of each. Mention the weak point of the cuff and two clinical points about rotator cuff injuries.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from Part 06 (6.1 rotator cuff and 6.2 applied anatomy), with the nerve supplies from the muscle table in 5.5.", "type": "written", "keyhtml": "Rotator cuff: a tendinous cuff around the shoulder joint covering its anterior, posterior and superior aspects; the tone of its muscles helps stabilize the joint.\nMuscles (SITS):\n• Supraspinatus: suprascapular nerve\n• Infraspinatus: suprascapular nerve\n• Teres minor: axillary nerve\n• Subscapularis: upper and lower subscapular nerves\n(Teres major is not a rotator cuff muscle.)\nWeak point: the cuff is deficient inferiorly, the site of potential weakness of the joint.\nClinical points (any two):\n• The cuff tendons may become torn or inflamed; the supraspinatus tendon is most commonly affected\n• Rotator cuff tears cause pain anteriorly and superiorly to the joint during abduction\n• Anterior dislocation is often associated with rotator cuff tears, as supraspinatus, infraspinatus and teres minor attach to the back of the greater tuberosity"}, "N-ANA-L2-11": {"id": "N-ANA-L2-11", "stem": "Describe the shoulder joint under the following headings: type, articular surfaces, capsule, ligaments and dislocation.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from Part 02 (2.1 shoulder joint, 2.2 dislocation) and Part 03 (3.1 ligaments).", "type": "written", "keyhtml": "• Type: freely mobile, ball-and-socket synovial joint (glenohumeral joint)\n• Articular surfaces: glenoid fossa of the scapula and head of the humerus; the joint contains the glenoid labrum, a rim of fibrocartilage attached to the cavity margins\n• Capsule: thin and loose inferiorly to permit a wide range of movement; strengthened by the tendons of the rotator cuff\n• Ligaments:\n  – Coracohumeral ligament: supports the superior aspect of the capsule\n  – Glenohumeral ligaments (3: superior, middle, inferior): the inferior one in particular plays an important role in stabilizing the joint\n  – Transverse humeral ligament: bridges the tendon of the long head of biceps in the bicipital groove to keep it in position\n• Dislocation: the glenoid fossa is shallow, so the shoulder is the most frequently dislocated joint in the body\n  – Anterior (95%): may damage the axillary nerve\n  – Posterior (rarer, 4%): often caused by seizures and electrocution injuries"}, "PRQ-20": {"id": "PRQ-20", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Scapula", "Axilla", "Deltoid", "Humerus"], "ans": 3, "top": false, "rep": "", "tag": "Practical · Practical 1 – Shoulder region", "bank": false, "img": ["prac/q020.jpg"], "expl": "The practical slide \"HUMERUS\" (Practical 1 – Shoulder region)."}}, "labs": {"sl21": {"id": "sl21", "type": "slide", "title": "Shoulder region · slide 19", "img": "prac/s021.jpg", "labels": [{"t": "Greater tuberosity", "x": 13.36, "y": 5.41, "w": 15.8, "h": 3.81, "id": "l0"}, {"t": "Lesser tuberosity", "x": 13.28, "y": 11.8, "w": 15.33, "h": 3.81, "id": "l1"}, {"t": "head of humerus", "x": 45.23, "y": 2.91, "w": 14.66, "h": 3.81, "id": "l2"}, {"t": "Greater tuberosity", "x": 78.75, "y": 5.55, "w": 15.8, "h": 3.81, "id": "l3"}, {"t": "anatomical neck", "x": 44.14, "y": 9.71, "w": 14.22, "h": 3.81, "id": "l4"}, {"t": "surgical neck", "x": 45.08, "y": 17.63, "w": 11.33, "h": 3.81, "id": "l5"}, {"t": "bicipital groove", "x": 13.05, "y": 24.71, "w": 13.2, "h": 3.81, "id": "l6"}, {"t": "Deltoid tuberosity", "x": 76.33, "y": 32.21, "w": 8.69, "h": 7.7, "id": "l7"}, {"t": "Deltoid tuberosity", "x": 20.94, "y": 38.88, "w": 8.69, "h": 7.7, "id": "l8"}, {"t": "radial fossa", "x": 16.64, "y": 70.69, "w": 9.73, "h": 3.81, "id": "l9"}, {"t": "medial epicondyle", "x": 52.19, "y": 64.99, "w": 9.37, "h": 7.7, "id": "l10"}, {"t": "Coronoid fossa", "x": 38.59, "y": 74.16, "w": 12.85, "h": 3.81, "id": "l11"}, {"t": "Olecranon fossa", "x": 73.59, "y": 79.71, "w": 13.95, "h": 3.81, "id": "l12"}, {"t": "lateral epicondyle", "x": 10.62, "y": 84.71, "w": 15.23, "h": 3.81, "id": "l13"}, {"t": "Capitulum", "x": 16.8, "y": 90.13, "w": 8.94, "h": 3.81, "id": "l14"}, {"t": "Trochlea", "x": 48.91, "y": 85.96, "w": 7.46, "h": 3.81, "id": "l15"}, {"t": "lateral epicondyle", "x": 81.25, "y": 85.55, "w": 9.37, "h": 7.7, "id": "l16"}], "src": "From the practical slides · Practical 1 – Shou
