w": 14.94, "h": 3.34, "id": "l8", "mu": "pq"}, {"t": "Flexor digitorum superficialis", "x": 33.12, "y": 57.82, "w": 22.01, "h": 3.33, "id": "l9", "mu": "fds"}, {"t": "Superficial group", "x": 30.61, "y": 79.66, "w": 12.88, "h": 3.33, "id": "l10"}, {"t": "Deep group", "x": 61.52, "y": 79.66, "w": 8.91, "h": 3.33, "id": "l11"}], "src": "From the practical slides · Practical 2 – Upper limb", "act": {"muscles": {"brr": {"name": "Brachioradialis", "nerves": ["rad"], "moves": ["eflex"], "note": "In the posterior compartment but flexes the forearm (midprone). Supplied by the radial nerve itself."}, "ptr": {"name": "Pronator teres", "nerves": ["med"], "moves": ["pron", "eflex"], "note": "Medial epicondyle & coronoid → middle of lateral radius; pronates and flexes the forearm."}, "fcr": {"name": "Flexor carpi radialis", "nerves": ["med"], "moves": ["wflex", "wabd"], "note": "Common flexor origin → bases of 2nd & 3rd metacarpals; flexes and abducts the hand."}, "fdp": {"name": "Flexor digitorum profundus", "nerves": ["ain", "uln"], "moves": ["fflex"], "note": "→ distal phalanges of the medial four fingers; flexes the DIP joints. Median (anterior interosseous) + ulnar (medial half)."}, "palm": {"name": "Palmaris longus", "nerves": ["med"], "moves": ["wflex"], "note": "Common flexor origin → palmar aponeurosis (and flexor retinaculum); flexes the wrist."}, "fpl": {"name": "Flexor pollicis longus", "nerves": ["ain"], "moves": ["thflex", "wabd"], "note": "Radius → base of distal phalanx of the thumb. With FDP it makes the \"OK\" sign (anterior interosseous)."}, "fcu": {"name": "Flexor carpi ulnaris", "nerves": ["uln"], "moves": ["wflex", "wadd"], "note": "→ pisiform, hook of hamate, base of 5th metacarpal; flexes and adducts the hand. The only superficial flexor not supplied by the median."}, "pq": {"name": "Pronator quadratus", "nerves": ["ain"], "moves": ["pron"], "note": "Distal anterior ulna → distal anterior radius; pronates."}, "fds": {"name": "Flexor digitorum superficialis", "nerves": ["med"], "moves": ["fflex"], "note": "→ middle phalanges of the medial four fingers; flexes the PIP joints."}}, "nerves": [{"id": "rad", "name": "Radial"}, {"id": "med", "name": "Median"}, {"id": "ain", "name": "Anterior interosseous (branch of median)"}, {"id": "uln", "name": "Ulnar"}], "moves": [{"id": "eflex", "name": "Elbow flexion"}, {"id": "pron", "name": "Pronation"}, {"id": "wflex", "name": "Wrist flexion"}, {"id": "wabd", "name": "Abduction of hand (radial deviation)"}, {"id": "wadd", "name": "Adduction of hand (ulnar deviation)"}, {"id": "fflex", "name": "Finger flexion"}, {"id": "thflex", "name": "Thumb flexion"}], "par": {"ain": "med"}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}, "sl42": {"id": "sl42", "type": "slide", "title": "The cubital fossa", "img": "prac/s042.jpg", "labels": [{"t": "brachialis", "x": 85.16, "y": 13.22, "w": 7.21, "h": 3.33, "id": "l0", "mu": "brach"}, {"t": "supinator", "x": 76.92, "y": 30.68, "w": 7.25, "h": 3.33, "id": "l1", "mu": "supi"}, {"t": "biceps tendon", "x": 61.37, "y": 52.76, "w": 5.48, "h": 7.33, "id": "l2"}, {"t": "Bicipital aponeurosis", "x": 58.67, "y": 70.66, "w": 9.29, "h": 7.33, "id": "l3"}], "src": "From the practical slides · Practical 2 – Upper limb", "act": {"muscles": {"brach": {"name": "Brachialis", "nerves": ["mc", "rad"], "moves": ["eflex"], "note": "Distal anterior humerus → coronoid process of ulna; flexes the elbow. Two nerves: musculocutaneous and radial."}, "supi": {"name": "Supinator", "nerves": ["pin"], "moves": ["sup"], "note": "Lateral epicondyle, ligaments, supinator crest of ulna → upper radius; supinates. Floor of the cubital fossa (laterally)."}}, "nerves": [{"id": "mc", "name": "Musculocutaneous"}, {"id": "rad", "name": "Radial"}, {"id": "pin", "name": "Posterior interosseous (deep branch of radial)"}], "moves": [{"id": "eflex", "name": "Elbow flexion"}, {"id": "sup", "name": "Supination"}], "par": {"pin": "rad"}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}}, "cards": [{"id": "ANA-L3-001", "text": "Ulnar notch · radial tuberosity · dorsal tubercle are features of the {{c1::radius}}", "extra": "Trap: the ulnar notch is on the radius; the radial notch is on the ulna.", "sec": "Part 01 · 1.1 Bones of the right forearm"}, {"id": "ANA-L3-002", "text": "Olecranon · trochlear notch · coronoid process · radial notch · ulnar tuberosity are features of the {{c1::ulna}}", "extra": "The radial notch (on the ulna) receives the radial head.", "sec": "Part 01 · 1.1 Bones of the right forearm"}, {"id": "ANA-L3-003", "text": "Limb muscles are divided into anatomical compartments by {{c1::dense fibrous connective tissue}}", "extra": "", "sec": "Part 01 · 1.2 Compartments of the arm and forearm"}, {"id": "ANA-L3-004", "text": "Muscles in the same compartment share {{c1::similar action}} and {{c2::the same nerve supply}}", "extra": "Lets clinicians predict how patients present after trauma.", "sec": "Part 01 · 1.2 Compartments of the arm and forearm"}, {"id": "ANA-L3-005", "text": "Anterior compartment of the arm (3 muscles): {{c1::biceps brachii}} · {{c2::brachialis}} · {{c3::coracobrachialis}}", "extra": "Mnemonic: bbc.", "sec": "Part 02 · 2.1 Anterior compartment of the arm"}, {"id": "ANA-L3-006", "text": "All three anterior-compartment arm muscles are innervated by the {{c1::musculocutaneous}} nerve (from the {{c2::lateral}} cord)", "extra": "Brachialis also gets the radial nerve.", "sec": "Part 02 · 2.1 Anterior compartment of the arm"}, {"id": "ANA-L3-007", "text": "Biceps brachii origin — long head: {{c1::supraglenoid tubercle}} of the scapula; short head: {{c2::apex of the coracoid process}}", "extra": "Exam trap: biceps long head → supraglenoid · triceps long head → infraglenoid.", "sec": "Part 02 · 2.2 Biceps brachii"}, {"id": "ANA-L3-008", "text": "Biceps brachii insertion: {{c1::radial tuberosity}} of the radius + {{c2::bicipital aponeurosis}}", "extra": "", "sec": "Part 02 · 2.2 Biceps brachii"}, {"id": "ANA-L3-009", "text": "Biceps brachii functions: {{c1::flexion of the forearm at the elbow}} · {{c2::supination of the forearm}} · {{c3::accessory flexion of the arm at the glenohumeral joint}}", "extra": "Shoulder abduction is not one of its actions.", "sec": "Part 02 · 2.2 Biceps brachii"}, {"id": "ANA-L3-010", "text": "The biceps (myotatic) reflex confirms the integrity of the {{c1::musculocutaneous}} nerve", "extra": "Biceps, like all the bbc muscles, is supplied by the musculocutaneous nerve.", "sec": "Part 02 · 2.2 Biceps brachii"}, {"id": "ANA-L3-011", "text": "Tendon of the long head of biceps: {{c1::intracapsular}}, {{c2::extrasynovial}}; it helps steady the {{c3::shoulder}} joint", "extra": "", "sec": "Part 02 · 2.2 Biceps brachii"}, {"id": "ANA-L3-012", "text": "Brachialis: origin {{c1::distal half of the anterior surface of the humerus}} · insertion {{c2::coronoid process of the ulna}} · action {{c3::flexion of the forearm at the elbow}}", "extra": "", "sec": "Part 02 · 2.3 Brachialis & coracobrachialis"}, {"id": "ANA-L3-013", "text": "Brachialis nerve supply (dual): {{c1::musculocutaneous}} + {{c2::radial}} nerves", "extra": "The only anterior arm muscle with a second nerve.", "sec": "Part 02 · 2.3 Brachialis & coracobrachialis"}, {"id": "ANA-L3-014", "text": "Coracobrachialis: origin {{c1::coracoid process of the scapula}} · insertion {{c2::middle of the medial surface of the humeral shaft}}", "extra": "", "sec": "Part 02 · 2.3 Brachialis & coracobrachialis"}, {"id": "ANA-L3-015", "text": "Coracobrachialis action: {{c1::flexion and adduction of the arm}}", "extra": "Nerve: musculocutaneous.", "sec": "Part 02 · 2.3 Brachialis & coracobrachialis"}, {"id": "ANA-L3-016", "text": "Posterior compartment of the arm: one muscle, {{c1::triceps brachii}}, with {{c2::three}} heads", "extra": "", "sec": "Part 02 · 2.4 Posterior compartment of the arm — triceps brachii"}, {"id": "ANA-L3-017", "text": "Triceps brachii origin — long head: {{c1::infraglenoid tubercle}} of the scapula; medial & lateral heads: {{c2::posterior surface of the humerus}}", "extra": "Biceps long head = supraglenoid; triceps long head = infraglenoid.", "sec": "Part 02 · 2.4 Posterior compartment of the arm — triceps brachii"}, {"id": "ANA-L3-018", "text": "Triceps brachii: insertion {{c1::olecranon of ulna}} · nerve {{c2::radial}} · action {{c3::extension of the forearm (elbow)}}", "extra": "", "sec": "Part 02 · 2.4 Posterior compartment of the arm — triceps brachii"}, {"id": "ANA-L3-019", "text": "Ulnar nerve's 'one and a half' forearm muscles: {{c1::flexor carpi ulnaris}} + {{c2::the medial half of flexor digitorum profundus}}", "extra": "The median nerve supplies all the other anterior forearm muscles.", "sec": "Part 02 · 2.5 Overview of the nerves in the arm and forearm"}, {"id": "ANA-L3-020", "text": "Two arm/forearm muscles with a dual nerve supply: {{c1::brachialis}} (musculocutaneous + radial) · {{c2::flexor digitorum profundus}} (ulnar + median)", "extra": "", "sec": "Part 02 · 2.5 Overview of the nerves in the arm and forearm"}, {"id": "ANA-L3-021", "text": "Anterior compartment of the forearm contains the {{c1::pronators}} of the forearm and the {{c2::flexors}} of the forearm, hand & fingers", "extra": "So both pronators lie in the anterior compartment.", "sec": "Part 03 · 3.1 Superficial group of muscles"}, {"id": "ANA-L3-022", "text": "Anterior forearm muscles: superficial group = {{c1::5}} muscles; deep group = {{c2::3}} muscles", "extra": "", "sec": "Part 03 · 3.1 Superficial group of muscles"}, {"id": "ANA-L3-023", "text": "Superficial flexor group, lateral → medial: {{c1::pronator teres}} · {{c2::flexor carpi radialis}} · {{c3::palmaris longus}} · {{c4::flexor carpi ulnaris}} · {{c5::flexor digitorum superficialis}}", "extra": "'Pretty Flowers Prefer Full Sun'.", "sec": "Part 03 · 3.1 Superficial group of muscles"}, {"id": "ANA-L3-024", "text": "Superficial group of the anterior forearm → {{c1::median}} nerve, except {{c2::flexor carpi ulnaris}} → {{c3::ulnar}} nerve", "extra": "Exam trap: FCU is the only superficial flexor on the ulnar nerve.", "sec": "Part 03 · 3.1 Superficial group of muscles"}, {"id": "ANA-L3-025", "text": "Common flexor origin = the front of the {{c1::medial epicondyle}} of the humerus", "extra": "All 5 superficial flexors arise from the common flexor tendon here.", "sec": "Part 03 · 3.2 Attachment of the superficial group — common flexor origin"}, {"id": "ANA-L3-026", "text": "Pronator teres: origin {{c1::medial epicondyle + coronoid process of ulna}} · insertion {{c2::middle of the lateral side of the radius}}", "extra": "Action: pronates and flexes the forearm.", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-027", "text": "{{c1::Flexor carpi radialis}} inserts into the bases of the {{c2::second and third}} metacarpal bones", "extra": "Arises from the medial epicondyle; flexes forearm, flexes & abducts the hand.", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-028", "text": "Palmaris longus inserts into the {{c1::flexor retinaculum & palmar aponeurosis}}", "extra": "Action: flexes forearm and hand.", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-029", "text": "Flexor carpi ulnaris origin — humeral head: {{c1::medial epicondyle}}; ulnar head: {{c2::medial olecranon & posterior border of ulna}}", "extra": "", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-030", "text": "{{c1::Flexor carpi ulnaris}} inserts into the {{c2::pisiform, hook of hamate & base of 5th metacarpal}}", "extra": "Nerve: ulnar. Flexes forearm, flexes & adducts the hand.", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-031", "text": "Abduction of the hand: {{c1::flexor carpi radialis}}; adduction of the hand: {{c2::flexor carpi ulnaris}}", "extra": "Radialis → radial side (abduct); ulnaris → ulnar side (adduct).", "sec": "Part 07 · 7.2 Movement → muscles"}, {"id": "ANA-L3-032", "text": "Flexor digitorum superficialis origin: {{c1::medial epicondyle}}, {{c2::coronoid process}} & {{c3::oblique line of radius}}", "extra": "", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-033", "text": "Flexor digitorum superficialis inserts into the {{c1::middle phalanges}} of the medial four fingers", "extra": "", "sec": "Part 03 · 3.2 Attachment of the superficial group — common flexor origin"}, {"id": "ANA-L3-034", "text": "Flexes the proximal IP joints: {{c1::flexor digitorum superficialis}}; flexes the distal IP joints: {{c2::flexor digitorum profundus}}", "extra": "'Profundus goes Past' — FDP to distal phalanges, FDS to middle.", "sec": "Part 04 · 4.3 Anterior interosseous nerve — the OK sign"}, {"id": "ANA-L3-035", "text": "Inability to flex the distal interphalangeal joints of the fingers → muscle affected: {{c1::flexor digitorum profundus}}", "extra": "FDS reaches only the middle phalanges, so it cannot flex the DIP.", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-036", "text": "Besides their wrist & finger actions, the superficial flexors (PT, FCR, PL, FCU, FDS) all also flex the {{c1::forearm (elbow)}}", "extra": "", "sec": "Part 07 · 7.2 Movement → muscles"}, {"id": "ANA-L3-037", "text": "Flexors of the hand (wrist): {{c1::flexor carpi radialis}} · {{c2::palmaris longus}} · {{c3::flexor carpi ulnaris}} · {{c4::flexor digitorum superficialis}} · {{c5::flexor digitorum profundus}}", "extra": "", "sec": "Part 07 · 7.2 Movement → muscles"}, {"id": "ANA-L3-038", "text": "Deep group of the anterior forearm: {{c1::flexor pollicis longus}} · {{c2::flexor digitorum profundus}} · {{c3::pronator quadratus}}", "extra": "", "sec": "Part 04 · 4.1 Deep group of muscles (3 muscles)"}, {"id": "ANA-L3-039", "text": "Deep flexor group → {{c1::median}} nerve via its {{c2::anterior interosseous}} branch, except the {{c3::medial half of FDP}} → ulnar nerve", "extra": "Exam trap: FDP has a dual (ulnar + median) supply.", "sec": "Part 04 · 4.1 Deep group of muscles (3 muscles)"}, {"id": "ANA-L3-040", "text": "Flexor digitorum profundus: origin {{c1::anteromedial surface of ulna & interosseous membrane}} → insertion {{c2::bases of the distal phalanges}} of the medial 4 fingers", "extra": "", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-041", "text": "Flexor pollicis longus: origin {{c1::anterior surface of radius}} (+ interosseous membrane & coronoid process) → insertion {{c2::base of the distal phalanx of the thumb}}", "extra": "Action: flexes the thumb.", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-042", "text": "Pronator quadratus: anterior surface of distal {{c1::ulna}} → anterior surface of distal {{c2::radius}}; action: {{c3::pronates the forearm}}", "extra": "", "sec": "Part 04 · 4.2 Muscles table of the anterior compartment of the forearm"}, {"id": "ANA-L3-043", "text": "The 'OK' sign examines the integrity of the {{c1::anterior interosseous}} nerve, a branch of the {{c2::median}} nerve", "extra": "Cannot make a round O → anterior interosseous nerve injury.", "sec": "Part 04 · 4.3 Anterior interosseous nerve — the OK sign"}, {"id": "ANA-L3-044", "text": "The two muscles tested by the 'OK' sign: {{c1::flexor digitorum profundus}} + {{c2::flexor pollicis longus}}", "extra": "Round O needs flexion of the distal phalanx of the thumb (FPL) and of the index DIP joint (FDP).", "sec": "Part 04 · 4.3 Anterior interosseous nerve — the OK sign"}, {"id": "ANA-L3-045", "text": "Cubital fossa: a {{c1::triangular}} region {{c2::anterior}} to the elbow joint", "extra": "", "sec": "Part 05 · 5.1 Boundaries of the cubital fossa"}, {"id": "ANA-L3-046", "text": "Cubital fossa — lateral boundary: {{c1::medial border of brachioradialis}}; medial boundary: {{c2::lateral border of pronator teres}}", "extra": "Exam trap: the boundaries cross over.", "sec": "Part 05 · 5.1 Boundaries of the cubital fossa"}, {"id": "ANA-L3-047", "text": "Cubital fossa base (superior border): {{c1::imaginary line between the epicondyles of the humerus}}", "extra": "", "sec": "Part 05 · 5.1 Boundaries of the cubital fossa"}, {"id": "ANA-L3-048", "text": "Cubital fossa floor: {{c1::brachialis}} medially + {{c2::supinator}} laterally; roof: {{c3::fascia and skin}}", "extra": "Brachialis is floor, not a boundary.", "sec": "Part 05 · 5.1 Boundaries of the cubital fossa"}, {"id": "ANA-L3-049", "text": "Cubital fossa contents, lateral → medial: {{c1::biceps tendon}} → {{c2::brachial artery}} → {{c3::median nerve}}", "extra": "TAN: Tendon · Artery · Nerve.", "sec": "Part 05 · 5.2 Contents of the cubital fossa"}, {"id": "ANA-L3-050", "text": "In the cubital fossa the brachial artery lies {{c1::medial::medial or lateral}} to the biceps tendon; the median nerve lies {{c2::medial::medial or lateral}} to the brachial artery", "extra": "", "sec": "Part 05 · 5.2 Contents of the cubital fossa"}, {"id": "ANA-L3-051", "text": "Most lateral structure in the cubital fossa: {{c1::radial nerve}}", "extra": "Most medial of the TAN contents: the median nerve.", "sec": "Part 05 · 5.2 Contents of the cubital fossa"}, {"id": "ANA-L3-052", "text": "One of the commonest sites for intravenous injection: the {{c1::median cubital vein}}", "extra": "", "sec": "Part 05 · 5.3 Median cubital vein & bicipital aponeurosis"}, {"id": "ANA-L3-053", "text": "The bicipital aponeurosis arises from the {{c1::medial::medial or lateral}} side of the biceps tendon", "extra": "", "sec": "Part 05 · 5.3 Median cubital vein & bicipital aponeurosis"}, {"id": "ANA-L3-054", "text": "Elbow joint type: {{c1::hinge synovial}} — uniaxial with a {{c2::transverse}} axis", "extra": "", "sec": "Part 06 · 6.1 Elbow joint"}, {"id": "ANA-L3-055", "text": "Elbow joint articular surfaces (2 parts): {{c1::humero-ulnar}} + {{c2::humero-radial}} articulations", "extra": "", "sec": "Part 06 · 6.1 Elbow joint"}, {"id": "ANA-L3-056", "text": "Elbow ligaments: ulnohumeral → {{c1::medial collateral}} · radiohumeral → {{c2::lateral collateral}} · radioulnar → {{c3::annular}} ligament", "extra": "", "sec": "Part 06 · 6.1 Elbow joint"}, {"id": "ANA-L3-057", "text": "Pulled (nursemaid's) elbow: a child is lifted forcibly by the arms while the forearm is {{c1::pronated::pronated or supinated}}", "extra": "", "sec": "Part 06 · 6.2 Pulled elbow (nursemaid's elbow)"}, {"id": "ANA-L3-058", "text": "Pulled elbow lesion: torn {{c1::annular ligament}} → {{c2::subluxation of the radial head}}", "extra": "", "sec": "Part 06 · 6.2 Pulled elbow (nursemaid's elbow)"}, {"id": "ANA-L3-059", "text": "Pulled elbow: pain from {{c1::pinching of the annular ligament}} in the elbow joint; {{c2::pronation & supination}} become very limited", "extra": "", "sec": "Part 06 · 6.2 Pulled elbow (nursemaid's elbow)"}, {"id": "ANA-L3-060", "text": "Reduction of a pulled elbow: {{c1::supinate the forearm::pronate or supinate}} with the elbow {{c2::flexed}}", "extra": "Injured in pronation → reduced by supination.", "sec": "Part 06 · 6.2 Pulled elbow (nursemaid's elbow)"}, {"id": "ANA-L3-061", "text": "Muscles of supination: {{c1::supinator}} + {{c2::biceps brachii}}", "extra": "", "sec": "Part 06 · 6.3 Pronation & supination"}, {"id": "ANA-L3-062", "text": "Muscles of pronation: {{c1::pronator teres}} + {{c2::pronator quadratus}}", "extra": "Both in the anterior forearm compartment (superficial & deep groups).", "sec": "Part 06 · 6.3 Pronation & supination"}, {"id": "ANA-L3-063", "text": "Radius & ulna in supination: {{c1::parallel}}; in pronation: {{c2::crossed}}", "extra": "", "sec": "Part 06 · 6.3 Pronation & supination"}, {"id": "ANA-L3-064", "text": "In pronation & supination the moving bone is the {{c1::radius}}", "extra": "", "sec": "Part 06 · 6.3 Pronation & supination"}, {"id": "ANA-L3-065", "text": "Proximal radioulnar joint type: {{c1::uniaxial pivot}} joint", "extra": "", "sec": "Part 06 · 6.4 Radioulnar joints"}, {"id": "ANA-L3-066", "text": "Proximal radioulnar joint: circumference of the {{c1::radial head}} turns in a fibro-osseous ring formed by the {{c2::radial notch of the ulna}} + annular ligament", "extra": "", "sec": "Part 06 · 6.4 Radioulnar joints"}, {"id": "ANA-L3-067", "text": "Ligament that surrounds and supports the head of the radius at the proximal radioulnar joint: {{c1::annular ligament}}", "extra": "Torn in pulled elbow.", "sec": "Part 06 · 6.4 Radioulnar joints"}, {"id": "ANA-L3-068", "text": "Distal (inferior) radioulnar joint: {{c1::pivot synovial}} (uniaxial); between the {{c2::head of the ulna}} and the {{c3::ulnar notch of the radius}}", "extra": "", "sec": "Part 06 · 6.4 Radioulnar joints"}, {"id": "ANA-L3-069", "text": "{{c1::Colles}} fracture: distal radius fracture with {{c2::dorsal}} displacement of the distal fragments → '{{c3::dinner fork}}' deformity", "extra": "Colles = dorsal · Smith = anterior.", "sec": "Part 06 · 6.5 Distal radius fracture"}, {"id": "ANA-L3-070", "text": "{{c1::Smith (reverse Colles)}} fracture: distal radial fragment displaced {{c2::anteriorly}}; seen in older people who fall on the {{c3::dorsum of the hand}}", "extra": "Colles = dorsal · Smith = anterior.", "sec": "Part 06 · 6.5 Distal radius fracture"}], "pracs": [{"href": "prac-ana-2.html", "title": "Anatomy practical · Practical 2 – Upper limb"}], "lib": "./", "prev": {"href": "ana-l2.html", "title": "Lecture 2 · Movements of the Arm"}, "next": {"href": "ana-l4.html", "title": "Lecture 4 · Movements of the Hand"}, "coverImg": "covers/Anatomy.jpg", "searchHint": "e.g. three, shoulder, biceps brachii"};
(() => {

const $ = s => document.querySelector(s);

const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}

function layout(force){

/* ---------- page rendering ---------- */
const H = {};   // block renderers

function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }

  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }

H.recall = b => {

    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');

    ${nx ? `<a href="${esc(nx.href)}"><span><small>${esc(nx.label || 'Next lecture')}</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>${esc(pv.label || 'Previous lecture')}</small>${esc(pv.title)}</span><span>←</span></a>` : ''}

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;

A.retry = a => { delete S.ans[a.dataset.q]; save(); rerender(pageOf(a)); };
A.pred = a => { const p = S.pred[a.dataset.q] || {}; if (p.lift) return; p.pick = +a.dataset.i; S.pred[a.dataset.q] = p; save(); rerender(pageOf(a)); };
A.lift = a => { const q = QS[a.dataset.q]; const p = S.pred[q.id]; p.lift = 1; if (p.pick !== q.ans) S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.flap = a => { S.flap[a.dataset.q] = 1; save(); rerender(pageOf(a)); };

A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }

    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
