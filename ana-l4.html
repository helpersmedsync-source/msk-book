"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl47": {"id": "sl47", "type": "slide", "title": "Upper limb · slide 14", "img": "prac/s047.jpg", "labels": [{"t": "Adductor pollicis 7", "x": 15.97, "y": 69.49, "w": 15.51, "h": 4.55, "id": "l0", "mu": "addp"}, {"t": "Lumbricals", "x": 16.08, "y": 76.32, "w": 8.89, "h": 3.31, "id": "l1", "mu": "lum"}], "src": "From the practical slides · Practical 2 – Upper limb", "act": {"muscles": {"addp": {"name": "Adductor pollicis", "nerves": ["uln"], "moves": ["thadd"], "note": "Oblique and transverse heads; ulnar nerve."}, "lum": {"name": "Lumbricals", "nerves": ["med", "uln"], "moves": ["fflex"], "note": "Flex the MCP and extend the IP joints (writing position). 1st & 2nd: median; 3rd & 4th: ulnar."}}, "nerves": [{"id": "med", "name": "Median"}, {"id": "uln", "name": "Ulnar"}], "moves": [{"id": "fflex", "name": "Finger flexion"}, {"id": "thadd", "name": "Thumb adduction"}], "par": {}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}}, "cards": [{"id": "ANA-L4-001", "text": "Posterior compartment of the forearm contains {{c1::extensors}} and {{c2::supinators}}", "extra": "One exception: brachioradialis, which flexes the forearm.", "sec": "Part 01 · Back of the forearm"}, {"id": "ANA-L4-002", "text": "The flexor in the posterior forearm compartment: {{c1::brachioradialis}} — flexes the forearm in the {{c2::midprone}} position", "extra": "Exam trap: posterior compartment, yet a flexor.", "sec": "Part 01 · Back of the forearm"}, {"id": "ANA-L4-003", "text": "All posterior-compartment forearm muscles are innervated by the {{c1::radial}} nerve or its {{c2::posterior interosseous}} branch", "extra": "", "sec": "Part 01 · Back of the forearm"}, {"id": "ANA-L4-004", "text": "Common extensor origin: the front of the {{c1::lateral::medial or lateral}} epicondyle of the humerus", "extra": "Common flexor origin = medial epicondyle.", "sec": "Part 01 · Back of the forearm"}, {"id": "ANA-L4-005", "text": "Back-of-forearm muscles supplied by the radial nerve itself: {{c1::brachioradialis}} · {{c2::extensor carpi radialis longus}} · {{c3::anconeus}}", "extra": "BEA. All the others → posterior interosseous nerve.", "sec": "Part 01 · 1.1 Muscles of the back of the forearm"}, {"id": "ANA-L4-006", "text": "Nerve — extensor carpi radialis longus: {{c1::radial nerve}}; extensor carpi radialis brevis: {{c2::posterior interosseous nerve}}", "extra": "Exam trap: same action (extend wrist, abduct hand), different nerves.", "sec": "Part 01 · 1.1 Muscles of the back of the forearm"}, {"id": "ANA-L4-007", "text": "Superficial group of the back of the forearm (7): 1 {{c1::brachioradialis}} · 2 {{c2::extensor carpi radialis longus}} · 3 {{c3::extensor carpi radialis brevis}} · 4 extensor digitorum · 5 extensor digiti minimi · 6 extensor carpi ulnaris · 7 anconeus", "extra": "", "sec": "Part 01 · 1.1 Muscles of the back of the forearm"}, {"id": "ANA-L4-008", "text": "Superficial group of the back of the forearm (7): 1 brachioradialis · 2 ECRL · 3 ECRB · 4 {{c1::extensor digitorum}} · 5 {{c2::extensor digiti minimi}} · 6 {{c3::extensor carpi ulnaris}} · 7 {{c4::anconeus}}", "extra": "", "sec": "Part 01 · 1.1 Muscles of the back of the forearm"}, {"id": "ANA-L4-009", "text": "Deep group of the back of the forearm (5): {{c1::supinator}} · {{c2::abductor pollicis longus}} · {{c3::extensor pollicis longus}} · {{c4::extensor pollicis brevis}} · {{c5::extensor indicis}}", "extra": "", "sec": "Part 01 · 1.1 Muscles of the back of the forearm"}, {"id": "ANA-L4-010", "text": "Nerve supply of the deep group of the back of the forearm: {{c1::posterior interosseous nerve}}", "extra": "Includes supinator.", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-011", "text": "Brachioradialis: origin {{c1::lateral supracondylar ridge}} of the humerus → insertion {{c2::base of the styloid process}} of the radius", "extra": "Nerve: radial.", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-012", "text": "Insertion — extensor carpi radialis longus: base of the {{c1::2nd}} metacarpal; extensor carpi radialis brevis: base of the {{c2::3rd}} metacarpal", "extra": "Both from the lateral epicondyle; both extend the wrist & abduct the hand.", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-013", "text": "Extensor digitorum inserts into the {{c1::extensor expansion of the medial four fingers}}", "extra": "Lateral epicondyle origin; posterior interosseous nerve; extends the medial 4 fingers.", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-014", "text": "Extensor digiti minimi inserts into the {{c1::extensor expansion of the 5th digit}}", "extra": "Action: little finger extension.", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-015", "text": "Extensor carpi ulnaris: lateral epicondyle → base of the {{c1::5th}} metacarpal; action: extend wrist & {{c2::adduct::abduct or adduct}} the hand", "extra": "", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-016", "text": "Anconeus: a {{c1::triangular}} short muscle on the back of the elbow, {{c2::lateral::medial or lateral}} to the olecranon", "extra": "", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-017", "text": "Anconeus: back of the lateral epicondyle → {{c1::lateral side of the olecranon}}; nerve: {{c2::radial}}; action: {{c3::extends the elbow}}", "extra": "", "sec": "Part 01 · 1.2 Superficial group (7)"}, {"id": "ANA-L4-018", "text": "Supinator origin: lateral epicondyle · {{c1::radial collateral & annular ligaments}} · {{c2::supinator fossa & crest of ulna}}", "extra": "", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-019", "text": "Supinator inserts into the {{c1::lateral side of the upper part of the radius}}", "extra": "Action: supinates the forearm.", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-020", "text": "Abductor pollicis longus: interosseous membrane & middle third of posterior radius & ulna → {{c1::lateral surface of the base of the 1st metacarpal}}; action: {{c2::abducts thumb and hand}}", "extra": "", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-021", "text": "Origin (middle third) — extensor pollicis longus: interosseous membrane + posterior surface of the {{c1::ulna}}; extensor pollicis brevis: interosseous membrane + posterior surface of the {{c2::radius}}", "extra": "", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-022", "text": "Insertion — extensor pollicis longus: base of the {{c1::distal}} phalanx of the thumb; extensor pollicis brevis: base of the {{c2::proximal}} phalanx", "extra": "Each extends the phalanx it inserts into; both also abduct the hand.", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-023", "text": "Extensor indicis: posterior surface of ulna & interosseous membrane → {{c1::extensor expansion of the index finger}}", "extra": "Action: extends the index finger.", "sec": "Part 01 · 1.3 Deep group (5)"}, {"id": "ANA-L4-024", "text": "Bones of the hand: carpus = bones of the {{c1::wrist}} · metacarpus = bones of the {{c2::palm}} · phalanges = bones of the {{c3::digits}}", "extra": "", "sec": "Part 02 · Bones of the hand"}, {"id": "ANA-L4-025", "text": "Proximal carpal row, lateral → medial: {{c1::scaphoid}} · {{c2::lunate}} · {{c3::triquetrum}} · {{c4::pisiform}}", "extra": "'So Long To Pinky…'", "sec": "Part 02 · 2.1 Carpal bones"}, {"id": "ANA-L4-026", "text": "Distal carpal row, lateral → medial: {{c1::trapezium}} · {{c2::trapezoid}} · {{c3::capitate}} · {{c4::hamate}}", "extra": "'…Here Comes The Thumb' reads this row medial → lateral.", "sec": "Part 02 · 2.1 Carpal bones"}, {"id": "ANA-L4-027", "text": "Most lateral bone of the proximal carpal row: {{c1::scaphoid}}; most medial bone of the distal row: {{c2::hamate}}", "extra": "Pisiform is the most medial of the proximal row.", "sec": "Part 02 · 2.1 Carpal bones"}, {"id": "ANA-L4-028", "text": "Metacarpals: {{c1::five}}, each with a base, shaft & head; numbered 1st–5th from the {{c2::lateral::medial or lateral}} side", "extra": "1st metacarpal = thumb.", "sec": "Part 02 · 2.2 Metacarpal bones & phalanges"}, {"id": "ANA-L4-029", "text": "Phalanges: {{c1::three}} in each finger (proximal, middle, distal); {{c2::two}} in the thumb ({{c3::proximal & distal}})", "extra": "Exam trap: the thumb has no middle phalanx.", "sec": "Part 02 · 2.2 Metacarpal bones & phalanges"}, {"id": "ANA-L4-030", "text": "Wrist joint = the {{c1::radio-carpal}} joint; type: {{c2::synovial ellipsoid}}", "extra": "Not a hinge (the elbow is the hinge).", "sec": "Part 03 · 3.1 Radio-carpal joint = wrist joint"}, {"id": "ANA-L4-031", "text": "Wrist joint articulation: distal end of the radius + {{c1::intra-articular disc}} with {{c2::scaphoid, lunate & triquetrum}}", "extra": "Exam trap: the pisiform is in the proximal row but not listed at the wrist joint.", "sec": "Part 03 · 3.1 Radio-carpal joint = wrist joint"}, {"id": "ANA-L4-032", "text": "Wrist joint capsule is strengthened by the {{c1::radial & ulnar collateral}} ligaments and by {{c2::dorsal & palmar}} ligaments", "extra": "", "sec": "Part 03 · 3.1 Radio-carpal joint = wrist joint"}, {"id": "ANA-L4-033", "text": "Wrist flexion: {{c1::flexor carpi radialis}} · {{c2::flexor carpi ulnaris}} · {{c3::palmaris longus}} · {{c4::long flexors of the digits}}", "extra": "", "sec": "Part 03 · 3.2 Muscles producing movement of the wrist joint"}, {"id": "ANA-L4-034", "text": "Wrist extension: {{c1::extensor carpi radialis}} · {{c2::extensor carpi ulnaris}} · {{c3::long extensors of the digits}}", "extra": "", "sec": "Part 03 · 3.2 Muscles producing movement of the wrist joint"}, {"id": "ANA-L4-035", "text": "Wrist abduction (radial deviation): {{c1::flexor carpi radialis}} · {{c2::extensor carpi radialis}} · {{c3::long flexor & extensor of the thumb}}", "extra": "'Radialis' muscles abduct.", "sec": "Part 03 · 3.2 Muscles producing movement of the wrist joint"}, {"id": "ANA-L4-036", "text": "Wrist adduction (ulnar deviation): {{c1::flexor carpi ulnaris}} + {{c2::extensor carpi ulnaris}}", "extra": "'Ulnaris' muscles adduct.", "sec": "Part 03 · 3.2 Muscles producing movement of the wrist joint"}, {"id": "ANA-L4-037", "text": "First carpometacarpal joint: {{c1::saddle synovial}} joint → allows {{c2::opposition of the thumb}}", "extra": "", "sec": "Part 03 · 3.3 Joints of the hand"}, {"id": "ANA-L4-038", "text": "Metacarpophalangeal joints: type = {{c1::ellipsoid synovial}}", "extra": "Official key (Anatomy quiz 4 Q1); the pamphlet table leaves the MCP type blank. Same type as the wrist.", "sec": "Part 03 · 3.3 Joints of the hand"}, {"id": "ANA-L4-039", "text": "Joints of the hand: {{c1::intercarpal}} · {{c2::carpometacarpal}} · {{c3::metacarpophalangeal}} · {{c4::interphalangeal}} (proximal & distal)", "extra": "", "sec": "Part 03 · 3.3 Joints of the hand"}, {"id": "ANA-L4-040", "text": "Flexor retinaculum: a fibrous band that bridges the {{c1::concavity of the carpal bones}}; it retains the {{c2::flexor tendons}}", "extra": "", "sec": "Part 04 · 4.1 Fascial thickening in the hand"}, {"id": "ANA-L4-041", "text": "Palmar aponeurosis: a strong fibrous sheet in the middle of the palm; shape: {{c1::triangular}}", "extra": "", "sec": "Part 04 · 4.1 Fascial thickening in the hand"}, {"id": "ANA-L4-042", "text": "Extensor retinaculum: a strong fibrous band across the {{c1::back of the wrist}}; it retains the {{c2::extensor tendons}}", "extra": "", "sec": "Part 04 · 4.1 Fascial thickening in the hand"}, {"id": "ANA-L4-043", "text": "Carpal tunnel is formed by the {{c1::concavity of the palmar surface of the carpal bones}} + the overlying {{c2::flexor retinaculum}}", "extra": "", "sec": "Part 04 · 4.2 A — The carpal tunnel"}, {"id": "ANA-L4-044", "text": "Carpal tunnel contents: {{c1::long flexor tendons of the thumb & fingers}} + the {{c2::median nerve}}", "extra": "", "sec": "Part 04 · 053", "text": "Thenar eminence muscles: {{c1::abductor pollicis brevis}} · {{c2::flexor pollicis brevis}} · {{c3::opponens pollicis}}", "extra": "A F O; actions according to their names.", "sec": "Part 05 · 5.1 Intrinsic muscles of the thumb & of the little finger"}, {"id": "ANA-L4-054", "text": "Hypothenar eminence muscles: {{c1::abductor digiti minimi}} · {{c2::flexor digiti minimi}} · {{c3::opponens digiti minimi}}", "extra": "A F O — same pattern as the thenar eminence.", "sec": "Part 05 · 5.1 Intrinsic muscles of the thumb & of the little finger"}, {"id": "ANA-L4-055", "text": "In both the thenar and the hypothenar eminence the deep muscle is the {{c1::opponens}}", "extra": "", "sec": "Part 05 · 5.1 Intrinsic muscles of the thumb & of the little finger"}, {"id": "ANA-L4-056", "text": "Adductor pollicis has two heads: {{c1::oblique}} + {{c2::transverse}}", "extra": "", "sec": "Part 05 · 5.1 Intrinsic muscles of the thumb & of the little finger"}, {"id": "ANA-L4-057", "text": "Palmaris brevis: a {{c1::subcutaneous}} muscle superficial to the {{c2::hypothenar::thenar or hypothenar}} eminence", "extra": "", "sec": "Part 05 · 5.1 Intrinsic muscles of the thumb & of the little finger"}, {"id": "ANA-L4-058", "text": "Intrinsic muscles of the fingers: the {{c1::interossei}} and the {{c2::lumbricals}}", "extra": "", "sec": "Part 05 · 5.2 Intrinsic muscles of the fingers — interossei & lumbricals"}, {"id": "ANA-L4-059", "text": "Dorsal interossei {{c1::abduct::abduct or adduct}} the fingers; palmar interossei {{c2::adduct::abduct or adduct}} the fingers", "extra": "DAB = Dorsal ABduct · PAD = Palmar ADduct.", "sec": "Part 05 · 5.2 Intrinsic muscles of the fingers — interossei & lumbricals"}, {"id": "ANA-L4-060", "text": "All the interossei (dorsal & palmar) are supplied by the {{c1::ulnar}} nerve", "extra": "", "sec": "Part 05 · 5.2 Intrinsic muscles of the fingers — interossei & lumbricals"}, {"id": "ANA-L4-061", "text": "Cannot abduct nor adduct the fingers → lesion of the {{c1::ulnar}} nerve", "extra": "Both interossei groups (DAB, PAD) are ulnar; the median supplies only thenar + lumbricals 1–2.", "sec": "Part 06 · 6.1 Hand movements"}, {"id": "ANA-L4-062", "text": "Lumbricals: flex the {{c1::metacarpophalangeal}} joints + extend the {{c2::interphalangeal (PIP & DIP)}} joints → the {{c3::writing}} position", "extra": "", "sec": "Part 05 · 5.2 Intrinsic muscles of the fingers — interossei & lumbricals"}, {"id": "ANA-L4-063", "text": "Lumbricals nerve supply: lumbricals 1 & 2 → {{c1::median}}; lumbricals 3 & 4 → {{c2::ulnar}}", "extra": "Lumbricals 1 & 2 = index & middle fingers.", "sec": "Part 05 · 5.2 Intrinsic muscles of the fingers — interossei & lumbricals"}, {"id": "ANA-L4-064", "text": "All muscles of the hand are supplied by the {{c1::ulnar}} nerve except {{c2::5}}, which are supplied by the median nerve", "extra": "15 ulnar + 5 median = 20 muscles.", "sec": "Part 06 · 6.2 Nerve supply of intrinsic muscles of the hand"}, {"id": "ANA-L4-065", "text": "The 5 median-supplied hand muscles: {{c1::abductor pollicis brevis}} · {{c2::flexor pollicis brevis}} · {{c3::opponens pollicis}} · {{c4::lumbricals 1 & 2}}", "extra": "3 thenar + 2 lumbricals = 5.", "sec": "Part 06 · 6.2 Nerve supply of intrinsic muscles of the hand"}, {"id": "ANA-L4-066", "text": "Ulnar-supplied hand muscles: hypothenar muscles · {{c1::adductor pollicis}} · {{c2::palmaris brevis}} · all the {{c3::interossei}} · lumbricals {{c4::3 & 4}}", "extra": "The remaining 15.", "sec": "Part 06 · 6.2 Nerve supply of intrinsic muscles of the hand"}, {"id": "ANA-L4-067", "text": "Adductor pollicis is supplied by the {{c1::ulnar}} nerve — so loss of thumb adduction = ulnar nerve lesion", "extra": "It is not a thenar muscle; only the 3 thenar muscles are median.", "sec": "Part 06 · 6.2 Nerve supply of intrinsic muscles of the hand"}, {"id": "ANA-L4-068", "text": "Thumb movements by nerve — thenar muscles (abductor & flexor pollicis brevis, opponens pollicis): {{c1::median}     if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){
      if (at + 1 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at, 'r'); lb.innerHTML = '<div class="pin"></div>'; setPage(pgL, at + 1, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)', opacity: 1}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .7}, {transform: 'rotateY(-180deg)', opacity: 0}], () => { at++; clearLeaf(); busy = false; mark(at); upd(); });
    } else {
      if (at - 1 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at - 1, 'r'); lb.innerHTML = '<div class="pin"></div>'; leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(-180deg)', opacity: 0}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .3}, {transform: 'rotateY(0deg)', opacity: 1}], () => { at--; setPage(pgL, at, 'r'); clearLeaf(); busy = false; upd(); });
    }
  }
}
function jump(i){
  i = Math.max(0, Math.min(N - 1, i)); closeOv();
  if (!opened) openBook(i); else { at = i; draw(); }
}
document.addEventListener('keydown', e => {
  if (!opened || document.querySelector('#ovs .ov')) { if (e.key === 'Escape') closeOv(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
let tx0 = null, ty0 = 0;
book.addEventListener('touchstart', e => { const t = e.touches[0]; if (e.target.closest('.nosw,input,textarea,button,svg')) { tx0 = null; return; } tx0 = t.clientX; ty0 = t.clientY; }, {passive: true});
book.addEventListener('touchend', e => { if (tx0 === null) return; const t = e.changedTouches[0]; const dx = t.clientX - tx0, dy = t.clientY - ty0; tx0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1); }, {passive: true});

const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];
  if (L.labels.length >= 2) modes.push(['test', 'Test me'], ['find', 'Find it']);
  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);
    if (mode === 'test') return st.rev[l.id] ? 'on' : 'cv';
    if (mode === 'find') return st.fb && st.fb[2] === l.id ? st.fb[0] : 'cv';
    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);
    if (st.sel === l.id) return 'sel';
    return '';
  };
  const pad = (b, k) => `left:${(b.x - k).toFixed(2)}%;top:${(b.y - k * 1.6).toFixed(2)}%;width:${(b.w + 2 * k).toFixed(2)}%;height:${(b.h + 3.2 * k).toFixed(2)}%`;
  const boxes = L.labels.map(l => {
    const c = cls(l);
    // a numbered legend: the label is covered, the number on the picture is the spot to tap
    const lab = `<button class="sb ${l.m && mode === 'find' ? (c === 'cv' ? 'cv' : '') : c}" style="${pad(l, .35)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="${mode === 'test' || mode === 'find' ? 'covered label' : esc(l.t)}"></button>`;
    const mk = l.m ? `<button class="sb mk ${mode === 'find' ? (st.fb && st.fb[2] === l.id ? st.fb[0] : '') : (c === 'cv' ? '' : c)}" style="${pad(l.m, .6)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="number ${esc(l.n)}"></button>` : '';
    return lab + mk;
  }).join('');
  let info = '';
  if (mode === 'labels'){
    const l = L.labels.find(x => x.id === st.sel), m = l && slmus(L, l);
    info = m ? `<h4>${esc(m.name)}</h4>${esc(m.note || '')}<div class="muted" style="margin-top:.25em">Nerve: ${esc(m.nerves.map(n => (L.act.nerves.find(x => x.id === n) || {}).name).filter(Boolean).join(' + ') || 'not used as an answer in this book')}</div>`
      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`
      : l ? `<h4>${esc(l.t)}</h4>` : `<span class="muted">${L.act ? 'Tap a muscle label to see its action and nerve.' : L.labels.some(x => x.nv) ? 'Tap a nerve to see the muscles it supplies. "Test me" covers the labels; "Find it" asks you to find each one.' : L.labels.length >= 2 ? 'The labels as printed on the slide. "Test me" covers them; "Find it" asks you to find each one.' : 'The slide as shown in the practical.'}</span>`;
  } else if (mode === 'test'){
    info = `<span class="muted">Name each covered label, then tap it to check. Uncovered ${Object.keys(st.rev).length} of ${L.labels.length}.</span>`;
  } else if (mode === 'find'){
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    const t = L.labels.find(x => x.id === target);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Tap "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(t.t)}</h4>${st.fb && st.fb[0] === 'bad' ? `<div class="fb bad">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its ${t.m ? 'number on the picture' : 'covered label'} · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){

    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);

};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();

function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>

</body>
