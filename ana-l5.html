<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSK Book">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>MSK Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}
.op[disabled]{cursor:default}
.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}

 "Q0022"}, {"t": "flap", "q": "Q0149"}]}, {"id": "p42", "head": "Part 07 · Nerves Compared", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Nerves Compared", "sub": "Terminal nerve master table · Cutaneous supply of the hand"}, {"t": "h", "no": "7.1", "title": "Terminal nerve master table"}, {"t": "list", "items": ["<b>Musculocutaneous:<\/b> C5,6,7; lateral cord; pierces coracobrachialis", "<b>Median:<\/b> C5–T1, 2 roots; pronator teres heads, carpal tunnel", "<b>Ulnar:<\/b> medial cord; behind medial epicondyle; in front of flexor retinaculum", "<b>Radial:<\/b> C5–T1; posterior cord; spiral groove; nearly all extensors", "<b>Axillary:<\/b> C5,6; posterior cord; surgical neck; teres minor and deltoid"]}, {"t": "h", "no": "7.2", "title": "Cutaneous supply of the hand", "top": true}, {"t": "list", "items": ["<mark>Median<\/mark>: palmar surface and nail bed of lateral 3½ digits; skin of palm", "<mark>Ulnar<\/mark>: palmar and dorsal aspects of medial 1½ digits", "<mark>Radial<\/mark>: dorsal aspect of lateral 3½ digits"]}], "toc": ["07", "Nerves Compared"]}, {"id": "p43", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l5-6-0", "title": "Recall · Nerves Compared", "groups": [{"title": "7.1 Terminal nerve master table", "items": [["Musculocutaneous:", "C5,6,7; lateral cord; pierces coracobrachialis"], ["Median:", "C5–T1, 2 roots; pronator teres heads, carpal tunnel"], ["Ulnar:", "medial cord; behind medial epicondyle; in front of flexor retinaculum"], ["Radial:", "C5–T1; posterior cord; spiral groove; nearly all extensors"], ["Axillary:", "C5,6; posterior cord; surgical neck; teres minor and deltoid"]]}, {"title": "7.2 Cutaneous supply of the hand", "items": [["Median:", "palmar surface and nail bed of lateral 3½ digits; skin of palm"], ["Ulnar:", "palmar and dorsal aspects of medial 1½ digits"], ["Radial:", "dorsal aspect of lateral 3½ digits"]]}]}], "labName": "Recall · Nerves Compared"}, {"id": "p44", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-ANA-L5-08"}, {"t": "check", "q": "Q0159"}]}, {"id": "p45", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Nerve plexuses are ventral rami traveling together", "Trunks pass over the first rib; cords named relative to axillary artery", "Phrenic nerve (C3,4,5) supplies the diaphragm", "Thoracodorsal root value C6, 7, 8", "Axillary nerve related to surgical neck of humerus"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["5-3-6-3-5: roots, trunks, divisions, cords, terminal branches", "2LM lateral, 4MU medial, ULTRA posterior cord", "<b>LOAF:<\/b> median hand muscles; BBC: musculocutaneous muscles", "<b>3½ + 1½:<\/b> median/radial lateral 3½, ulnar medial 1½"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p46", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l5-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Nerve plexuses", "are ventral rami traveling together"], ["Trunks pass over the", "first rib; cords named relative to axillary artery"], ["Phrenic nerve", "(C3,4,5) supplies the diaphragm"], ["Thoracodorsal root", "value C6, 7, 8"], ["Axillary nerve related", "to surgical neck of humerus"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["5-3-6-3-5:", "roots, trunks, divisions, cords, terminal branches"], ["2LM lateral", "4MU medial, ULTRA posterior cord"], ["LOAF:", "median hand muscles; BBC: musculocutaneous muscles"], ["3½ + 1½:", "median/radial lateral 3½, ulnar medial 1½"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p47", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "No branches arise from the divisions; of the trunks only the upper trunk (C5, C6) gives branches"}, {"t": "note", "kind": "trap", "html": "Phrenic nerve (C3, 4, 5) is listed with the root branches"}, {"t": "note", "kind": "trap", "html": "Thoracodorsal is C6, 7, 8, unlike the two subscapular nerves (C5, 6)"}, {"t": "note", "kind": "trap", "html": "At the wrist median passes deep to flexor retinaculum (carpal tunnel); ulnar passes in front of it"}, {"t": "note", "kind": "trap", "html": "Ulnar root value: C7, 8, T1 (origin slide) vs C8, T1 (cords slide)"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p48", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Deep branch of radial = posterior interosseous nerve"}, {"t": "note", "kind": "trap", "html": "Axillary nerve supplies teres minor + deltoid"}, {"t": "note", "kind": "cl", "html": "Wrist drop shown with the radial nerve path (figure)"}, {"t": "note", "kind": "cl", "html": "Ulnar nerve at the wrist labelled 'dangerous position' on the slide"}]}, {"id": "p49", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0021": {"id": "Q0021", "stem": "Injury of the axillary nerve affects which muscles?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The axillary nerve (C5, 6), a branch of the posterior cord, ends by dividing into anterior and posterior branches that supply teres minor and deltoid and the skin overlying the deltoid.", "type": "written", "keyhtml": "Teres minor and deltoid (the axillary nerve also supplies the area of skin overlying the deltoid)."}, "Q0022": {"id": "Q0022", "stem": "Fracture of the surgical neck of the humerus leads to injury of which nerve?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The axillary nerve (C5, 6), a branch of the posterior cord, passes posteriorly in relation to the surgical neck of the humerus, so a fracture there can injure it. It supplies teres minor and deltoid and the skin overlying the deltoid.", "type": "written", "keyhtml": "The axillary nerve: it passes posteriorly in relation to the surgical neck of the humerus to reach the back of the limb."}, "Q0036": {"id": "Q0036", "stem": "Describe the anatomical position of the brachial plexus.", "top": false, "rep": "", "tag": "Final bank ANA W20", "bank": true, "expl": "The pamphlet states that the brachial plexus takes origin in the neck and descends through the cervicoaxillary canal to reach the axilla. Its trunks pass downward and laterally over the first rib, and its three cords are named by their relation to the axillary artery.", "type": "written", "keyhtml": "• It takes origin in the neck: its roots are the ventral rami of C5–C8 (in the neck) and T1 (in the thorax).\n• Its trunks (upper C5 + C6, middle C7, lower C8 + T1) pass downward and laterally over the first rib.\n• It descends through the cervicoaxillary canal to reach the axilla.\n• Its cords lie lateral, medial and posterior to the axillary artery (and are named by this relation); the terminal nerves arise from the cords."}, "Q0085": {"id": "Q0085", "stem": "A 29-year-old man comes in with a stab wound. He now cannot raise his arm above the horizontal plane and exhibits a condition known as 'winged scapula'. Which of the following structures of the brachial plexus would most likely be damaged?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q56", "bank": true, "expl": "Winging of the scapula with weakness raising the arm above 90° is paralysis of serratus anterior, supplied by the long thoracic nerve (Lecture 1). The long thoracic nerve (C5, 6, 7) is a branch of the roots of the brachial plexus; the upper trunk gives only the nerve to subclavius and the suprascapular nerve.", "type": "mcq", "opts": ["Medial cord", "Posterior cord", "Lower trunk", "Upper trunk", "Roots"], "ans": 4}, "Q0086": {"id": "Q0086", "stem": "A man injures his wrist on broken glass. Which of the following structures entering the palm superficial to the flexor retinaculum may be damaged?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q57", "bank": true, "expl": "The ulnar nerve enters the palm in front of (superficial to) the flexor retinaculum, close to the pisiform and hook of hamate, with the ulnar artery beside it in the 'dangerous position' shown at the wrist. The median nerve passes deep to the flexor retinaculum in the carpal tunnel with the long flexor tendons, so every option containing the median nerve or a long flexor tendon is wrong.", "type": "mcq", "opts": ["Ulnar nerve and median nerve", "Median nerve and flexor digitorum profundus", "Median nerve and flexor pollicis longus", "Ulnar artery and ulnar nerve", "Ulnar nerve and flexor digitorum superficialis"], "ans": 3}, "Q0088": {"id": "Q0088", "stem": "A 31-year-old patient complains of sensory loss over the anterior and posterior surfaces of the medial third of the hand and the medial one and one-half fingers. He is diagnosed by a physician as having 'funny bone' symptoms. Which of the following nerves is injured?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q58", "bank": true, "expl": "The ulnar nerve supplies the skin of the palmar and dorsal aspects of the medial 1½ digits, and it reaches the back of the medial epicondyle at the elbow. The median nerve supplies the palm and the palmar surface and nail bed of the lateral 3½ digits, and the radial nerve the dorsal aspect of the lateral 3½ digits.", "type": "mcq", "opts": ["Axillary", "Radial", "Median", "Ulnar", "Musculocutaneous"], "ans": 3}, "Q0090": {"id": "Q0090", "stem": "The posterior interosseous nerve is a branch of the:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The radial nerve reaches the groove between brachioradialis and brachialis and divides into superficial and deep terminal branches; the deep branch is the posterior interosseous nerve. It should not be confused with the anterior interosseous nerve, a branch of the median nerve.", "type": "mcq", "opts": ["Median nerve", "Ulnar nerve", "Radial nerve", "Musculocutaneous nerve", "Axillary nerve"], "ans": 2}, "Q0091": {"id": "Q0091", "stem": "An 18-year-old male is brought to the emergency department after an injury while playing rugby. Imaging reveals a transverse fracture of the medial epicondyle of the humerus. Which nerve is most frequently injured by the jagged edges of the broken bone at this location?", "top": false, "rep": "asked 3 years", "tag": "Extra practice", "bank": false, "expl": "The ulnar nerve descends in the front of the arm, then reaches the back of the medial epicondyle and enters the forearm between the two heads of flexor carpi ulnaris, so a medial epicondyle fracture can injure it. The radial nerve lies in the spiral groove and the axillary nerve is related to the surgical neck of the humerus.", "type": "mcq", "opts": ["Axillary", "Median", "Musculocutaneous", "Radial", "Ulnar"], "ans": 4}, "Q0093": {"id": "Q0093", "stem": "A 32-year-old woman is admitted to the emergency department after an automobile collision. Radiographic examination reveals multiple fractures of the humerus. Flexion and supination of the forearm are severely weakened. She also has loss of sensation on the lateral surface of the forearm. Which of the following nerves has most likely been injured?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q59", "bank": true, "expl": "The musculocutaneous nerve supplies coracobrachialis, biceps and brachialis (BBC) and continues as the lateral cutaneous nerve of the forearm; biceps flexes and supinates the forearm, so its loss weakens both movements and numbs the lateral forearm. The lateral cutaneous nerve of the forearm is only the sensory continuation and cannot explain the weakness, and the medial cord does not supply these muscles or the lateral forearm skin.", "type": "mcq", "opts": ["Musculocutaneous", "Median", "Axillary", "Medial cord of the brachial plexus", "Lateral cutaneous nerve of the forearm"], "ans": 0}, "Q0094": {"id": "Q0094", "stem": "A 10-year-old boy falls off his bike, has difficulty in moving his shoulder, and is brought to the ER. His radiograph and angiograph reveal a fracture of the surgical neck of his humerus and bleeding from the point of the fracture. Which of the following nerves is most likely injured as a result of this accident?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q60", "bank": true, "expl": "The axillary nerve (C5, 6; posterior cord) passes posteriorly in relation to the surgical neck of the humerus, so a fracture there can injure it, weakening deltoid and teres minor. The radial nerve, also from the posterior cord, runs in the spiral groove of the posterior compartment of the arm instead.", "type": "mcq", "opts": ["Musculocutaneous", "Axillary", "Median", "Radial", "Ulnar"], "ans": 1}, "Q0138": {"id": "Q0138", "stem": "The brachial plexus is formed by:", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q51", "bank": true, "expl": "The brachial plexus is formed of the ventral rami of spinal nerves C5, 6, 7, 8 and T1; nerve plexuses are ventral rami traveling together. These ventral rami are called the 'roots' of the plexus, which makes 'ventral roots' the tempting wrong answer.", "type": "mcq", "opts": ["C5–T1 dorsal rami", "C5–T1 dorsal roots", "C5–T1 ventral rami", "C5–T1 spinal nerve trunks", "C5–T1 ventral roots"], "ans": 2}, "Q0139": {"id": "Q0139", "stem": "Fracture of the medial epicondyle of the humerus will lead to injury of which of the following nerves?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q52", "bank": true, "expl": "The ulnar nerve descends in the front of the arm, then reaches the back of the medial epicondyle to enter the forearm between the two heads of flexor carpi ulnaris, so a medial epicondyle fracture puts it at risk. The median nerve instead enters the forearm between the two heads of pronator teres, and the radial nerve lies in the spiral groove.", "type": "mcq", "opts": ["Musculocutaneous nerve", "Ulnar nerve", "Median nerve", "Axillary nerve", "Radial nerve"], "ans": 1}, "Q0140": {"id": "Q0140", "stem": "The medial cord of the brachial plexus has five collateral branches; four of the five carry the word \"medial\" in their names. Which branch of the medial cord does not carry the word \"medial\" in its name?", "top": true, "rep": "asked 4 years", "tag": "Final bank ANA Q53", "bank": true, "expl": "The medial cord gives five branches (4MU): medial pectoral nerve, medial root of the median nerve, medial cutaneous nerves of the arm and of the forearm, and the ulnar nerve. Only the medial root of the median nerve comes from the medial cord; the radial and axillary nerves arise from the posterior cord and the musculocutaneous from the lateral cord.", "type": "mcq", "opts": ["Ulnar nerve", "Radial nerve", "Median nerve", "Axillary nerve", "Musculocutaneous nerve"], "ans": 0}, "Q0143": {"id": "Q0143", "stem": "A 41-year-old man sustains a penetrating injury just above the cubital fossa. Afterwards he cannot oppose his thumb to the rest of his fingers and has lost sensation over the palmar surface of the lateral 3½ digits. Which of the following movements is most affected?", "top": false, "rep": "", "tag": "Final bank ANA Q61", "bank": true, "expl": "Loss of thumb opposition with sensory loss over the palmar lateral 3½ digits is a median nerve injury; above the elbow this paralyses the median-supplied forearm flexors, including both pronators (pronator teres and pronator quadratus), so wrist flexion and forearm pronation are most affected. Flexion of the ring and little fingers is partly preserved because the ulnar nerve supplies the medial half of flexor digitorum profundus.", "type": "mcq", "opts": ["Wrist flexion and forearm pronation", "Wrist extension and finger abduction", "Elbow extension and forearm supination", "Finger flexion of the ring and little fingers"], "ans": 0}, "Q0149": {"id": "Q0149", "stem": "A 30-year-old motorcyclist suffers a fracture of the surgical neck of the humerus. After healing, he notices weakness in shoulder abduction and numbness over the lateral aspect of the shoulder.\n1. Which nerve is injured?\n2. Which movements are affected?\n3. What is the area of sensory loss?", "top": false, "rep": "", "tag": "Final bank ANA W19", "bank": true, "expl": "The axillary nerve passes posteriorly in relation to the surgical neck of the humerus and supplies teres minor and deltoid and the skin overlying the deltoid. The deltoid's middle fibres abduct the arm from 15° to 90° and teres minor laterally rotates the arm (Lecture 2).", "type": "written", "keyhtml": "1. The axillary nerve (C5, 6; branch of the posterior cord), which passes posteriorly in relation to the surgical neck of the humerus.\n2. Movements of deltoid and teres minor:\n• Abduction of the arm from 15° to 90° (deltoid, middle fibres)\n• Flexion and medial rotation (anterior fibres) and extension and lateral rotation (posterior fibres) of deltoid\n• Lateral rotation of the arm (teres minor)\n3. The area of skin overlying the deltoid."}, "Q0159": {"id": "Q0159", "stem": "The cutaneous supply of the dorsum of the hand is from:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q54", "bank": true, "expl": "On the dorsum, the radial nerve supplies the lateral side of the dorsum of the hand and the dorsal aspect of the lateral 3½ digits, the ulnar nerve the dorsal aspect of the medial 1½ digits, and the median nerve the nail beds of the lateral 3½ digits. 'Ulnar and radial' misses the median nail-bed territory.", "type": "mcq", "opts": ["Ulnar and posterior interosseous nerves", "Ulnar and median nerves", "Ulnar and radial nerves", "Ulnar, median and radial nerves", "Ulnar, anterior and posterior interosseous nerves"], "ans": 3}, "Q0161": {"id": "Q0161", "stem": "Which of the following nerves is NOT a branch from the roots of the brachial plexus?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q55", "bank": true, "expl": "The branches of the roots are the dorsal scapular (C5), long thoracic (C5, 6, 7) — the nerve to serratus anterior — and phrenic (C3, 4, 5) nerves. The thoracodorsal nerve (C6, 7, 8) arises from the posterior cord.", "type": "mcq", "opts": ["Dorsal scapular", "Thoracodorsal", "Long thoracic", "Phrenic", "Nerve to serratus anterior"], "ans": 1}, "N-ANA-L5-01": {"id": "N-ANA-L5-01", "stem": "Describe the radial nerve under the following headings:\n(a) Origin and root value\n(b) Course from the axilla to its termination\n(c) Terminal branches\n(d) Cutaneous supply in the hand", "top": false, "rep": "", "tag": "Final bank ANA W21", "bank": true, "expl": "All points come from Part 03: origin and course in 3.1, branches and skin supply in 3.2. Overall, the radial nerve supplies nearly all the extensor muscles and the skin of the posterior aspect of the upper limb.", "type": "written", "keyhtml": "(a) Branch of the posterior cord of the brachial plexus; root value C5, 6, 7, 8, T1.\n(b) In the axilla it runs behind the axillary artery; it passes to the spiral groove in the posterior compartment of the arm, then reaches the groove between brachioradialis and brachialis.\n(c) There it divides into superficial and deep terminal branches. The deep branch is the posterior interosseous nerve, supplying extensor carpi radialis brevis, supinator, extensor digitorum, extensor digiti minimi, extensor carpi ulnaris, abductor pollicis longus, extensor pollicis longus, extensor pollicis brevis and extensor indicis.\n(d) The superficial branch supplies the skin of the lateral side of the dorsum of the hand and the dorsal aspect of the lateral 3½ fingers."}, "N-ANA-L5-02": {"id": "N-ANA-L5-02", "stem": "A student is building a labelled model of the brachial plexus and attaches each named branch to the part of the plexus it arises from. Which of the following parts will have no branches attached?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "No branches arise from the divisions. The roots give the dorsal scapular, long thoracic and phrenic nerves, and the upper trunk is the only trunk that gives branches (nerve to subclavius and suprascapular nerve), which makes it the tempting wrong answer.", "type": "mcq", "opts": ["Roots", "Upper trunk", "Divisions", "Medial cord", "Posterior cord"], "ans": 2}, "N-ANA-L5-03": {"id": "N-ANA-L5-03", "stem": "A stab wound to the neck injures the upper trunk of the brachial plexus. Which of the following nerves arises directly from the injured trunk?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Of the trunks, only the upper trunk (C5, C6) gives branches: the nerve to subclavius and the suprascapular nerve. The dorsal scapular (C5) and long thoracic nerves arise from the roots, the lateral pectoral from the lateral cord and the thoracodorsal from the posterior cord.", "type": "mcq", "opts": ["Dorsal scapular nerve", "Long thoracic nerve", "Suprascapular nerve", "Lateral pectoral nerve", "Thoracodorsal nerve"], "ans": 2}, "N-ANA-L5-04": {"id": "N-ANA-L5-04", "stem": "Which part of the brachial plexus is formed by the union of the ventral rami of C8 and T1?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "C5 and C6 unite to form the upper trunk, C7 becomes the middle trunk, and C8 and T1 unite to form the lower trunk; the trunks pass downward and laterally over the first rib. The cords are formed later, when the anterior and posterior divisions recombine.", "type": "mcq", "opts": ["Upper trunk", "Middle trunk", "Lower trunk", "Medial cord", "Posterior cord"], "ans": 2}, "N-ANA-L5-05": {"id": "N-ANA-L5-05", "stem": "A 30-year-old man sustains a fracture of the shaft of the humerus. On examination he has wrist drop. Which nerve has most likely been injured?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "After running behind the axillary artery, the radial nerve passes to the spiral groove in the posterior compartment of the arm and supplies nearly all the extensor muscles; the lecture illustrates wrist drop with the radial nerve path. The axillary nerve is related to the surgical neck of the humerus and the ulnar nerve to the back of the medial epicondyle.", "type": "mcq", "opts": ["Axillary", "Musculocutaneous", "Radial", "Median", "Ulnar"], "ans": 2}, "N-ANA-L5-06": {"id": "N-ANA-L5-06", "stem": "During dissection of the front of the elbow, a student follows a nerve that enters the forearm by passing between the two heads of pronator teres and then descends along the middle of the front of the forearm, deep to flexor digitorum superficialis. Which nerve is the student following?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The median nerve enters the forearm between the two heads of pronator teres, descends deep to flexor digitorum superficialis and enters the palm deep to the flexor retinaculum in the carpal tunnel. The ulnar nerve also passes between two heads of a muscle, but those of flexor carpi ulnaris, after passing behind the medial epicondyle.", "type": "mcq", "opts": ["Median", "Ulnar", "Radial", "Musculocutaneous", "Posterior interosseous"], "ans": 0}, "N-ANA-L5-07": {"id": "N-ANA-L5-07", "stem": "A 50-year-old woman has compression of the nerve that passes deep to the flexor retinaculum in the carpal tunnel. Which of the following muscles is most likely to be weak?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The median nerve passes deep to the flexor retinaculum in the carpal tunnel and then divides to supply its five hand muscles (LOAF): lumbricals 1 and 2, opponens pollicis, abductor pollicis brevis and flexor pollicis brevis. The third lumbrical and flexor carpi ulnaris are supplied by the ulnar nerve, and extensor indicis and brachioradialis by the radial nerve.", "type": "mcq", "opts": ["Opponens pollicis", "Third lumbrical", "Flexor carpi ulnaris", "Extensor indicis", "Brachioradialis"], "ans": 0}, "N-ANA-L5-08": {"id": "N-ANA-L5-08", "stem": "Compare the median and ulnar nerves as regards:\n(a) How each enters the forearm\n(b) Relation to the flexor retinaculum at the wrist\n(c) Muscles supplied in the forearm\n(d) Cutaneous supply of the hand", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from 4.2–4.3 and 5.1–5.2, summarised in the 7.1 master table; the relation to the flexor retinaculum is the lecture's classic exam trap.", "type": "written", "keyhtml": "(a) Median: passes between the two heads of pronator teres. Ulnar: reaches the back of the medial epicondyle, then passes between the two heads of flexor carpi ulnaris.\n(b) Median: passes deep to the flexor retinaculum in the carpal tunnel, then divides into medial and lateral divisions. Ulnar: passes in front of the flexor retinaculum, close to the pisiform and hook of hamate, then divides into superficial and deep terminal branches.\n(c) Median: the flexor muscles except flexor carpi ulnaris and the medial half of flexor digitorum profundus. Ulnar: flexor carpi ulnaris and the medial half of flexor digitorum profundus.\n(d) Median: skin of the palm and the palmar surface and nail bed of the lateral 3½ digits. Ulnar: palmar and dorsal aspects of the medial 1½ digits."}, "N-ANA-L5-09": {"id": "N-ANA-L5-09", "stem": "Enumerate the branches of the three cords of the brachial plexus.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All branches are listed in 2.2 with the mnemonics 2LM, 4MU and ULTRA. The five terminal nerves (musculocutaneous, median, ulnar, radial, axillary) arise from the cords, while the divisions give no branches.", "type": "written", "keyhtml": "• Lateral cord (2LM): lateral pectoral nerve, lateral root of the median nerve, musculocutaneous nerve.\n• Medial cord (4MU): medial pectoral nerve, medial root of the median nerve, medial cutaneous nerve of the arm, medial cutaneous nerve of the forearm, ulnar nerve.\n• Posterior cord (ULTRA): upper subscapular nerve, lower subscapular nerve, thoracodorsal nerve (nerve to latissimus dorsi, between the two subscapular nerves), radial nerve, axillary nerve."}, "N-ANA-L5-10": {"id": "N-ANA-L5-10", "stem": "Which of the following nerve plexuses is formed by the ventral rami of L4–S4 and gives rise to the sciatic nerve?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Nerve plexuses are ventral rami traveling together: the cervical plexus is C1–C5, the brachial plexus C5–T1, the lumbar plexus L1–L4 and the sacral plexus L4–S4, which gives the sciatic nerve. The lumbar plexus (L1–L4) is the tempting answer because it shares L4, but the sciatic nerve is listed with the sacral plexus.", "type": "mcq", "opts": ["Cervical plexus", "Brachial plexus", "Lumbar plexus", "Sacral plexus"], "ans": 3}, "N-ANA-L5-11": {"id": "N-ANA-L5-11", "stem": "Which of the following terminal nerves of the brachial plexus arises from the posterior cord and carries fibres from the posterior divisions?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The posterior cord gives the axillary (C5, 6) and radial (C5–T1) nerves, both from the posterior divisions. The musculocutaneous, median and ulnar nerves come from the lateral and medial cords and the anterior divisions, and the lateral pectoral nerve is a branch of the lateral cord, not a terminal nerve.", "type": "mcq", "opts": ["Musculocutaneous", "Median", "Ulnar", "Axillary", "Lateral pectoral"], "ans": 3}, "TP-124": {"id": "TP-124", "stem": "Which muscles of the upper limb have a double nerve supply? Mention the nerves supplying each.", "top": true, "rep": "", "tag": "Final bank ANA W50", "bank": true, "expl": "Pectoralis major is supplied by the medial and lateral pectoral nerves and subscapularis by the upper and lower subscapular nerves. Brachialis receives the musculocutaneous and radial nerves, while flexor digitorum profundus is supplied by the median nerve except its medial half, which is ulnar. Levator scapulae is also supplied by C4, which is why it keeps working after a complete brachial plexus lesion.", "type": "written", "keyhtml": "1. Pectoralis major: medial and lateral pectoral nerves.\n2. Subscapularis: upper and lower subscapular nerves.\n3. Brachialis: musculocutaneous and radial nerves (the radial nerve supplies a small part).\n4. Flexor digitorum profundus: ulnar nerve (medial half) and median nerve (anterior interosseous branch) for the rest of the muscle.\n5. Levator scapulae: dorsal scapular nerve, and also the C4 nerve."}}, "labs": {}, "cards": [{"id": "ANA-L5-001", "text": "Nerve plexuses = {{c1::ventral rami}} traveling together", "extra": "Not dorsal rami, not roots.", "sec": "Part 01 · 1.1 Spinal nerves & nerve plexuses"}, {"id": "ANA-L5-002", "text": "Ventral rami of the plexuses — cervical {{c1::C1–C5}} · brachial {{c2::C5–T1}} · lumbar {{c3::L1–L4}} · sacral {{c4::L4–S4}}", "extra": "", "sec": "Part 01 · 1.1 Spinal nerves & nerve plexuses"}, {"id": "ANA-L5-003", "text": "The {{c1::sacral}} plexus (L4–S4) gives rise to the sciatic nerve", "extra": "Not the lumbar plexus (L1–L4), although both share L4.", "sec": "Part 01 · 1.1 Spinal nerves & nerve plexuses"}, {"id": "ANA-L5-004", "text": "Thoracic region: {{c1::no plexus}} — {{c2::12}} pairs of thoracic nerves", "extra": "", "sec": "Part 01 · 1.1 Spinal nerves & nerve plexuses"}, {"id": "ANA-L5-005", "text": "The brachial plexus is formed of the {{c1::ventral rami}} of spinal nerves {{c2::C5, 6, 7, 8 & T1}}", "extra": "These ventral rami are the 'roots' of the plexus — so 'ventral roots' is the trap option.", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-006", "text": "The brachial plexus takes origin in the {{c1::neck}} and descends through the {{c2::cervicoaxillary canal}} to reach the {{c3::axilla}}", "extra": "It provides the motor and sensory innervation of the upper limb.", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-007", "text": "Stages of the brachial plexus, in order: {{c1::roots}} → {{c2::trunks}} → {{c3::divisions}} → {{c4::cords}} → {{c5::branches}}", "extra": "Mnemonic: Really Tired? Drink Coffee in Bed!", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-008", "text": "Brachial plexus counts — roots {{c1::5}} · trunks {{c2::3}} · divisions {{c3::6}} · cords {{c4::3}} · terminal branches {{c5::5}}", "extra": "5 · 3 · 6 · 3 · 5", "sec": "Part 01 · 1.3 Stages of the brachial plexus"}, {"id": "ANA-L5-009", "text": "Roots of the brachial plexus: C5–C8 arise in the {{c1::neck}}; T1 arises in the {{c2::thorax}}", "extra": "Roots = anterior primary (ventral) rami.", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-010", "text": "Trunks of the brachial plexus — upper = {{c1::C5 + C6}} · middle = {{c2::C7}} · lower = {{c3::C8 + T1}}", "extra": "", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-011", "text": "The trunks of the brachial plexus pass downward and laterally over the {{c1::first rib}}", "extra": "", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-012", "text": "Fibres of each trunk redistribute into {{c1::anterior and posterior}} divisions, which recombine to form the {{c2::cords}}", "extra": "", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-013", "text": "The three cords (lateral, medial, posterior) are named by their relation to the {{c1::axillary artery}}", "extra": "", "sec": "Part 01 · 1.2 The brachial plexus"}, {"id": "ANA-L5-014", "text": "Terminal nerves of the lateral cord: {{c1::musculocutaneous nerve}} + {{c2::lateral root of the median nerve}}", "extra": "Both C5, 6, 7.", "sec": "Part 01 · 1.4 The five terminal nerves"}, {"id": "ANA-L5-015", "text": "Terminal nerves of the medial cord: {{c1::ulnar nerve}} + {{c2::medial root of the median nerve}}", "extra": "", "sec": "Part 01 · 1.4 The five terminal nerves"}, {"id": "ANA-L5-016", "text": "Terminal nerves of the posterior cord: {{c1::axillary nerve}} + {{c2::radial nerve}}", "extra": "", "sec": "Part 01 · 1.4 The five terminal nerves"}, {"id": "ANA-L5-017", "text": "Musculocutaneous, median & ulnar nerves carry the {{c1::anterior}} divisions; radial & axillary nerves carry the {{c2::posterior}} divisions", "extra": "Anterior divisions → lateral & medial cords; posterior divisions → posterior cord.", "sec": "Part 01 · 1.4 The five terminal nerves"}, {"id": "ANA-L5-018", "text": "Root value — musculocutaneous {{c1::C5, 6, 7}} · axillary {{c2::C5, 6}} · radial {{c3::C5, 6, 7, 8, T1}}", "extra": "Median: lateral root C5, 6, 7 + medial root C8, T1.", "sec": "Part 01 · 1.4 The five terminal nerves"}, {"id": "ANA-L5-019", "text": "Branches of the roots of the brachial plexus: {{c1::dorsal scapular nerve}} · {{c2::long thoracic nerve}} · {{c3::phrenic nerve}}", "extra": "The thoracodorsal nerve is NOT a root branch (posterior cord).", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-020", "text": "Root value of the root branches — dorsal scapular {{c1::C5}} · long thoracic {{c2::C5, 6, 7}} · phrenic {{c3::C3, 4, 5}}", "extra": "", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-021", "text": "The phrenic nerve (C3, 4, 5) supplies the {{c1::diaphragm}}", "extra": "Listed with the root branches of the brachial plexus.", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-022", "text": "The long thoracic nerve (a root branch) is the nerve to {{c1::serratus anterior}}", "extra": "Formative 3 Q27: both names are root branches.", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-023", "text": "Stab wound → winged scapula + cannot raise the arm above the horizontal → damaged part of the brachial plexus: {{c1::roots}}", "extra": "Serratus anterior palsy → long thoracic nerve (C5, 6, 7) → a branch of the roots.", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-024", "text": "Thoracodorsal nerve: root value {{c1::C6, 7, 8}}; arises from the {{c2::posterior cord}}", "extra": "Not a root branch (Formative 3 Q27). Unlike the two subscapular nerves (C5, 6).", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-025", "text": "The thoracodorsal nerve = nerve to {{c1::latissimus dorsi}}; it arises between the two {{c2::subscapular}} nerves", "extra": "", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-026", "text": "Of the trunks, only the {{c1::upper}} trunk (C5, C6) gives branches: {{c2::nerve to subclavius}} & {{c3::suprascapular nerve}}", "extra": "", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-027", "text": "Branches arising from the divisions of the brachial plexus: {{c1::none}}", "extra": "Branches come from roots, upper trunk and cords only.", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-028", "text": "Lateral cord branches (2LM): {{c1::lateral pectoral n.}} · {{c2::lateral root of the median n.}} · {{c3::musculocutaneous n.}}", "extra": "2LM = 2 Lateral + Musculocutaneous.", "sec": "Part 02 · 2.2 All branches from the cords"}, {"id": "ANA-L5-029", "text": "Medial cord branches (4MU): {{c1::medial pectoral n.}} · {{c2::medial root of the median n.}} · {{c3::medial cutaneous n. of the arm}} · {{c4::medial cutaneous n. of the forearm}} · {{c5::ulnar n.}}", "extra": "4MU = 4 Medial + Ulnar.", "sec": "Part 02 · 2.2 All branches from the cords"}, {"id": "ANA-L5-030", "text": "The only medial-cord branch whose name does not carry the word 'medial': the {{c1::ulnar}} nerve", "extra": "Anatomy quiz 5 Q1.", "sec": "Part 02 · 2.2 All branches from the cords"}, {"id": "ANA-L5-031", "text": "Posterior cord branches (ULTRA): {{c1::upper subscapular}} · {{c2::lower subscapular}} · {{c3::thoracodorsal}} · {{c4::radial}} · {{c5::axillary}}", "extra": "ULTRA = Upper subscapular, Lower subscapular, Thoracodorsal, Radial, Axillary.", "sec": "Part 02 · 2.2 All branches from the cords"}, {"id": "ANA-L5-032", "text": "Root value — lateral pectoral {{c1::C5, 6, 7}} · medial pectoral {{c2::C8, T1}} · upper & lower subscapular {{c3::C5, 6}}", "extra": "Medial cutaneous nerves of arm & forearm: C8, T1.", "sec": "Part 02 · 2.1 Branches of the brachial plexus by level"}, {"id": "ANA-L5-033", "text": "Radial nerve: branch of the {{c1::posterior}} cord; root value {{c2::C5, 6, 7, 8, T1}}", "extra": "", "sec": "Part 03 · 3.1 Radial nerve — origin & course"}, {"id": "ANA-L5-034", "text": "In the axilla the radial nerve runs {{c1::behind the axillary artery}}", "extra": "", "sec": "Part 03 · 3.1 Radial nerve — origin & course"}, {"id": "ANA-L5-035", "text": "In the arm the radial nerve passes in the {{c1::spiral groove}}, in the {{c2::posterior}} compartment of the arm", "extra": "Hence humeral shaft fracture → radial nerve → wrist drop.", "sec": "Part 03 · 3.1 Radial nerve — origin & course"}, {"id": "ANA-L5-036", "text": "The radial nerve ends in the groove between {{c1::brachioradialis}} and {{c2::brachialis}} by dividing into {{c3::superficial and deep}} terminal branches", "extra": "", "sec": "Part 03 · 3.1 Radial nerve — origin & course"}, {"id": "ANA-L5-037", "text": "{{c2::Posterior interosseous nerve}} = the deep terminal branch of the {{c1::radial}} nerve", "extra": "Not the anterior interosseous nerve (a median branch).", "sec": "Part 03 · 3.1 Radial nerve — origin & course"}, {"id": "ANA-L5-038", "text": "Radial nerve branches in the axilla: {{c1::posterior cutaneous n. of the arm}} + {{c2::triceps (long head)}}", "extra": "", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-039", "text": "Radial nerve muscle branches in the upper arm: triceps ({{c1::medial & lateral heads}}) · {{c2::brachioradialis}} · a small part of {{c3::brachialis}}", "extra": "Also extensor carpi (radialis longus) and the elbow joint, before the nerve divides.", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-040", "text": "Radial nerve cutaneous branches in the upper arm: {{c1::lower lateral cutaneous n. of the arm}} + {{c2::posterior cutaneous n. of the forearm}}", "extra": "", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-041", "text": "Deep branch of radial (posterior interosseous) — wrist & forearm muscles: {{c1::extensor carpi radialis brevis}} · {{c2::supinator}} · {{c3::extensor carpi ulnaris}}", "extra": "", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-042", "text": "Deep branch of radial (posterior interosseous) — finger extensors: {{c1::extensor digitorum}} · {{c2::extensor digiti minimi}} · {{c3::extensor indicis}}", "extra": "", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-043", "text": "Deep branch of radial (posterior interosseous) — thumb muscles: {{c1::abductor pollicis longus}} · {{c2::extensor pollicis longus}} · {{c3::extensor pollicis brevis}}", "extra": "", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-044", "text": "Superficial branch of the radial nerve supplies the skin of the {{c1::lateral side of the dorsum of the hand}} and the {{c2::dorsal aspect of the lateral 3½ fingers}}", "extra": "", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-045", "text": "Radial nerve overall supplies: {{c1::nearly all extensor muscles}} · skin of the {{c2::posterior aspect}} of the upper limb · dorsal aspect of the lateral {{c3::3½}} digits", "extra": "Posterior skin via the posterior cutaneous nerves of the arm & forearm.", "sec": "Part 03 · 3.2 Distribution of the radial nerve"}, {"id": "ANA-L5-046", "text": "Median nerve roots: lateral root ({{c1::C5, 6, 7}}) from the {{c2::lateral}} cord + medial root ({{c3::C8, T1}}) from the {{c4::medial}} cord", "extra": "", "sec": "Part 04 · 4.1 Median nerve — formation"}, {"id": "ANA-L5-047", "text": "The two roots of the median nerve unite in the {{c1::axilla}}, on the {{c2::lateral}} side of the axillary artery", "extra": "", "sec": "Part 04 · 4.1 Median nerve — formation"}, {"id": "ANA-L5-048", "text": "Median nerve in the arm: descends at first {{c1::lateral}}, then {{c2::medial}} to the brachial artery", "extra": "", "sec": "Part 04 · 4.2 Median nerve — course in the arm, forearm & hand"}, {"id": "ANA-L5-049", "text": "The median nerve enters the forearm between the two heads of {{c1::pronator teres}}", "extra": "Ulnar enters between the two heads of flexor carpi ulnaris.", "sec": "Part 04 · 4.2 Median nerve — course in the arm, forearm & hand"}, {"id": "ANA-L5-050", "text": "In the forearm the median nerve descends along the middle of the front of the forearm, deep to {{c1::flexor digitorum superficialis}}", "extra": "", "sec": "Part 04 · 4.2 Median nerve — course in the arm, forearm & hand"}, {"id": "ANA-L5-051", "text": "The median nerve enters the palm {{c1::deep to}} the flexor retinaculum, in the {{c2::carpal tunnel}}", "extra": "Ulnar nerve passes in front of the retinaculum.", "sec": "Part 04 · 4.2 Median nerve — course in the arm, forearm & hand"}, {"id": "ANA-L5-052", "text": "Division in the hand — median nerve (distal to the flexor retinaculum): {{c1::medial & lateral divisions}}; ulnar nerve: {{c2::superficial & deep terminal branches}}", "extra": "", "sec": "Part 04 · 4.2 Median nerve — course in the arm, forearm & hand"}, {"id": "ANA-L5-053", "text": "Median nerve in the forearm supplies the flexor muscles except {{c1::flexor carpi ulnaris}} and the {{c2::medial half of flexor digitorum profundus}}", "extra": "Those tw function qimg(q, ans){
  const L = ans ? q.aimg : q.img; if (!L || !L.length) return '';

}
function qtags(q){

function opts(q, st, act){

H.check = b => {

  return `<div class="qb"><div class="qh">Check question ${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'ans')}${res}</div>`;
};
H.predict = b => {
  const q = QS[b.q]; if (!q) return ''; const p = S.pred[q.id] || {};

  else tail = `<div class="flapc"><span class="muted" style="font-size:.82em">Pick your prediction, then lift the flap</span></div>`;
  return `<div class="qb"><div class="qh">Predict, then reveal ${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'pred')}${tail}</div>`;
};
H.flap = b => {

};
H.title = b => `<div class="title-page"><div class="kick">${esc(b.kick)}</div><h1 class="ttl">${esc(b.title)}</h1><div class="sub">${esc(b.sub)}</div>

  <div class="legend"><i style="background:var(--sticky)"></i><span>Sticky notes = high-yield facts</span><i style="background:var(--trap-bg);border-left:3px solid var(--red)"></i><span>Exam traps</span>

H.progress = () => {

};
H.lab = (b, pg) => { const L = LABS[b.lab]; return L ? labHTML(L, pg) : ''; };
H.recall = b => {
  const st = S.labs[b.id] || {}, rv = st.r || {}; let n = 0, k = 0;
  const body = b.groups.map(g => `<div class="rcg">${esc(g.title)}</div>` + g.items.map(it => { const i = n++, on = !!rv[i]; if (on) k++;

  return `<div class="labh"><span class="lb">LAB</span><h3>${esc(b.title)}</h3></div>

    <div class="modes"><button class="mini" data-act="rcall" data-l="${b.id}" data-n="${n}">Uncover all</button><button class="mini" data-act="rcno" data-l="${b.id}">Cover all</button></div>${body}`;
};

    ${pv ? `<a href="${esc(pv.href)}"><span><small>Previous lecture</small>${esc(pv.title)}</span><span>←</span></a>` : ''}
    ${BOOK.lib ? `<a href="${esc(BOOK.lib)}"><span><small>The MSK book</small>All subjects and lectures</span><span>≡</span></a>` : ''}</div>`;

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
const LAB = {};
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {
  const st = lst(L.id, () => ({n: 0, wrong: 0, shake: null, order: shuffled(L.steps.map((_, i) => i), L.id + 's')}));
  const done = st.n >= L.steps.length; if (done) labDone(L.id);
  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>
   <div class="seqline">${st.n ? L.steps.slice(0, st.n).map((s, i) => `<span class="n">${i + 1}</span><span class="chip ok">${esc(s)}</span>`).join('') : '<span class="muted" style="font-size:.78em">Your order appears here.</span>'}</div>
   <div class="pool">${st.order.filter(i => i >= st.n).map(i => `<button class="chip ${st.shake === i ? 'shake' : ''}" data-act="qpick" data-l="${L.id}" data-i="${i}">${esc(L.steps[i])}</button>`).join('')}</div>
   ${done ? `<div class="done">✓ Correct order${L.mnemonic ? ' — ' + esc(L.mnemonic) : ''}${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ''}</div>` : (st.wrong ? `<div class="muted" style="font-size:.78em">Wrong tries: ${st.wrong}</div>` : '')}
   <div class="row"><button class="btn" data-act="qreset" data-l="${L.id}">Start again</button></div>`;
};
// --- labelled diagram ---
const DRAW = {};
LAB.diagram = L => {
  const st = lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.pins.map(p => p.id), L.id)}));
  const pins = L.pins.map((p, i) => {
    const shown = st.mode === 'labels' || (st.mode === 'test' && st.rev[p.id]);
    let c = st.mode === 'test' && st.rev[p.id] ? 'on' : '';
    if (st.mode === 'find' && st.fb && st.fb[2] === p.id) c = st.fb[0];
    const lx = p.lx !== undefined ? p.lx : p.x + 9, anchor = p.anchor || 'start';
    return `<g class="pinbtn ${c}" data-act="pin" data-l="${L.id}" data-id="${p.id}"><circle class="d" cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x}" y="${p.y + 2.8}" text-anchor="middle">${i + 1}</text>${shown ? `<text class="plab" x="${lx}" y="${p.ly !== undefined ? p.ly : p.y + 3}" text-anchor="${anchor}">${esc(p.short || p.name)}</text>` : ''}</g>`;
  }).join('');
  let info;
  if (st.mode === 'labels') info = `<span class="muted">All labels shown. Switch to "Test me" (tap a number to reveal it) or "Find it" (find the named structure).</span>`;
  else if (st.mode === 'test') info = `<span class="muted">Say the name of each numbered structure, then tap it to check. Revealed ${Object.keys(st.rev).length} of ${L.pins.length}.</span>`;
  else {
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Choose "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(L.pins.find(p => p.id === st.order[st.qi]).name)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its number · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  }
  return `<div class="modes">${[['labels', 'Labels on'], ['test', 'Test me'], ['find', 'Find it']].map(([m, n]) => `<button class="mini ${st.mode === m ? 'on' : ''}" data-act="dmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}</div>
   <div class="svgw"><svg viewBox="${L.viewBox}" role="img" aria-label="${esc(L.title)}">${DRAW[L.draw] ? DRAW[L.draw]() : ''}${pins}</svg></div>
   ${st.mode === 'labels' ? `<ol class="key">${L.pins.map(p => `<li>${esc(p.name)}</li>`).join('')}</ol>` : st.mode === 'test' ? `<ol class="key">${L.pins.map(p => `<li>${st.rev[p.id] ? esc(p.name) : '<span class="muted">tap ' + (L.pins.indexOf(p) + 1) + ' to check</span>'}</li>`).join('')}</ol>` : ''}<div class="info">${info}</div>`;
};
