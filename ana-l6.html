erior Gemillus", "x": 49.17, "y": 48.14, "w": 13.54, "h": 3.34, "id": "l4", "mu": "gs"}, {"t": "Semitendinosus", "x": 3.53, "y": 49.13, "w": 12.09, "h": 3.33, "id": "l5", "mu": "st"}, {"t": "Biceps femoris", "x": 31.81, "y": 55.52, "w": 11.07, "h": 3.33, "id": "l6", "mu": "bf"}, {"t": "Obturator internus", "x": 49.17, "y": 53.52, "w": 14.29, "h": 3.33, "id": "l7", "mu": "oi"}, {"t": "Inferior Gemillus", "x": 49.17, "y": 59.89, "w": 12.68, "h": 3.33, "id": "l8", "mu": "gi"}, {"t": "Semimembranosus", "x": 2.85, "y": 67.49, "w": 14.59, "h": 3.33, "id": "l9", "mu": "sm"}, {"t": "Quadratus femoris", "x": 49.17, "y": 67.01, "w": 14.17, "h": 3.33, "id": "l10", "mu": "qf"}], "src": "From the practical slides · Practical 3 – Hip & thigh", "act": {"muscles": {"gmed": {"name": "Gluteus medius", "nerves": ["sgl"], "moves": ["habd", "hmr"], "note": "Abducts & rotates the thigh medially; also stabilizes the pelvis."}, "gmax": {"name": "Gluteus maximus", "nerves": ["igl"], "moves": ["hext", "hlr"], "note": "Extends the thigh and rotates it laterally."}, "gmin": {"name": "Gluteus minimus", "nerves": ["sgl"], "moves": ["habd", "hmr"], "note": "Abducts & rotates the thigh medially."}, "pir": {"name": "Piriformis", "nerves": ["s12"], "moves": ["hlr"], "note": "Rotates the thigh laterally; ventral rami of S1 & S2."}, "gs": {"name": "Gemellus superior", "nerves": ["noi"], "moves": ["hlr"], "note": "Rotates the thigh laterally; nerve to obturator internus."}, "st": {"name": "Semitendinosus", "nerves": ["sct"], "moves": ["hext", "kflex", "lmr"], "note": "Ischial tuberosity → medial surface of the upper tibia."}, "bf": {"name": "Biceps femoris", "nerves": ["sct", "scp"], "moves": ["hext", "kflex", "llr"], "note": "Long head: tibial part; short head: common peroneal part. The only hamstring that rotates the leg laterally."}, "oi": {"name": "Obturator internus", "nerves": ["noi"], "moves": ["hlr", "habd"], "note": "Abducts and rotates the thigh laterally."}, "gi": {"name": "Gemellus inferior", "nerves": ["nqf"], "moves": ["hlr"], "note": "Rotates the thigh laterally; nerve to quadratus femoris."}, "sm": {"name": "Semimembranosus", "nerves": ["sct"], "moves": ["hext", "kflex", "lmr"], "note": "Ischial tuberosity → medial condyle of the tibia."}, "qf": {"name": "Quadratus femoris", "nerves": ["nqf"], "moves": ["hlr"], "note": "Ischial tuberosity → intertrochanteric crest; rotates the thigh laterally."}}, "nerves": [{"id": "sct", "name": "Sciatic — tibial part"}, {"id": "scp", "name": "Common peroneal (fibular)"}, {"id": "sgl", "name": "Superior gluteal"}, {"id": "igl", "name": "Inferior gluteal"}, {"id": "noi", "name": "Nerve to obturator internus"}, {"id": "nqf", "name": "Nerve to quadratus femoris"}, {"id": "s12", "name": "Ventral rami S1–S2"}], "moves": [{"id": "hext", "name": "Hip extension"}, {"id": "habd", "name": "Hip abduction"}, {"id": "hmr", "name": "Medial rotation of thigh"}, {"id": "hlr", "name": "Lateral rotation of thigh"}, {"id": "kflex", "name": "Knee flexion"}, {"id": "lmr", "name": "Medial rotation of leg"}, {"id": "llr", "name": "Lateral rotation of leg"}], "par": {}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}}, "cards": [{"id": "ANA-L6-001", "text": "Pelvic girdle = the {{c1::hip (innominate) bone}} + the {{c2::sacrum}}", "extra": "", "sec": "Part 01 · 1.1 The pelvic girdle"}, {"id": "ANA-L6-002", "text": "Functions of the pelvic girdle: {{c1::transmit the weight of the structures above to the lower limbs}} · {{c2::protect & support the pelvic organs}}", "extra": "", "sec": "Part 01 · 1.1 The pelvic girdle"}, {"id": "ANA-L6-003", "text": "The deep fascia of the thigh = {{c1::fascia lata}}; it is strongest laterally, where it forms the {{c2::iliotibial tract}}", "extra": "", "sec": "Part 01 · 1.2 Fascia lata & compartments"}, {"id": "ANA-L6-004", "text": "The fascia lata forms {{c1::3 intermuscular septa}}, dividing the thigh into 3 compartments", "extra": "", "sec": "Part 01 · 1.2 Fascia lata & compartments"}, {"id": "ANA-L6-005", "text": "Thigh compartments — contents: anterior = {{c1::quadriceps femoris}} · medial = {{c2::adductor muscles}} · posterior = {{c3::hamstring muscles}}", "extra": "", "sec": "Part 01 · 1.2 Fascia lata & compartments"}, {"id": "ANA-L6-006", "text": "Thigh compartments — nerve: anterior = {{c1::femoral}} · medial = {{c2::obturator}} · posterior = {{c3::sciatic}}", "extra": "A-F · M-O · P-S.", "sec": "Part 01 · 1.2 Fascia lata & compartments"}, {"id": "ANA-L6-007", "text": "Saphenous opening: an oval gap in the fascia lata below the {{c1::inguinal ligament}}, covered by the {{c2::cribriform fascia}}; it transmits the {{c3::greater saphenous vein}}", "extra": "Cribriform fascia is part of the superficial fascia.", "sec": "Part 01 · 1.2 Fascia lata & compartments"}, {"id": "ANA-L6-008", "text": "Hip joint type: {{c1::ball-and-socket synovial}} joint", "extra": "", "sec": "Part 02 · 2.1 Structure of the hip joint"}, {"id": "ANA-L6-009", "text": "Hip joint articulation: head of the femur with the cartilage-lined, horseshoe-shaped {{c1::lunate surface}} of the acetabulum", "extra": "", "sec": "Part 02 · 2.1 Structure of the hip joint"}, {"id": "ANA-L6-010", "text": "The hip socket is {{c1::far deeper}} than the equivalent socket of the shoulder joint", "extra": "", "sec": "Part 02 · 2.1 Structure of the hip joint"}, {"id": "ANA-L6-011", "text": "Structure that deepens the acetabulum: the {{c1::acetabular labrum}} — a stabilizing ring of {{c2::fibrocartilage}} around its margin", "extra": "Pamphlet wording: 'a stabilizing ring'; the staff question says 'deepens'.", "sec": "Part 02 · 2.1 Structure of the hip joint"}, {"id": "ANA-L6-012", "text": "Transverse acetabular ligament: bridges the {{c1::acetabular notch}} to {{c2::complete the socket}}", "extra": "", "sec": "Part 02 · 2.1 Structure of the hip joint"}, {"id": "ANA-L6-013", "text": "Ligamentum teres (round ligament): from the {{c1::transverse acetabular ligament}} to the {{c2::fovea}} at the centre of the femoral head", "extra": "", "sec": "Part 02 · 2.1 Structure of the hip joint"}, {"id": "ANA-L6-014", "text": "Hip capsular ligaments: anteriorly {{c1::iliofemoral}} · medially {{c2::pubofemoral}} · posteriorly {{c3::ischiofemoral}}", "extra": "A-M-P → I-P-I.", "sec": "Part 02 · 2.2 Ligaments strengthening the capsule"}, {"id": "ANA-L6-015", "text": "Strongest ligament of the hip joint (prevents hyperextension): {{c1::iliofemoral ligament}}", "extra": "Official key (Formative 3 Q18). Pamphlet: the largest and most important hip ligament.", "sec": "Part 02 · 2.2 Ligaments strengthening the capsule"}, {"id": "ANA-L6-016", "text": "The iliofemoral ligament resists {{c1::hyperextension}} and {{c2::lateral rotation}} at the hip during {{c3::standing}}", "extra": "", "sec": "Part 02 · 2.2 Ligaments strengthening the capsule"}, {"id": "ANA-L6-017", "text": "Nerve that may be injured (impinged) in posterior dislocation of the hip: {{c1::sciatic nerve}}", "extra": "SGD self-assessment question; taught with hip dislocation in ANA-L9.", "sec": "Part 02 · Hip joint (SGD self-assessment key)"}, {"id": "ANA-L6-018", "text": "Hip flexors (movements slide): {{c1::psoas major}} · {{c2::iliacus}} · {{c3::pectineus}} · {{c4::sartorius}} · {{c5::rectus femoris}}", "extra": "", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-019", "text": "Main flexor of the hip joint: {{c1::iliopsoas}} (iliacus + psoas major)", "extra": "Official key (Formative 3 Q26). Pamphlet: iliacus flexes the thigh with psoas major.", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-020", "text": "Psoas major nerve supply: {{c1::lumbar nerves L1–4}} — not the femoral nerve", "extra": "So some hip flexion survives a complete femoral nerve injury.", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-021", "text": "Femoral nerve supplies (thigh): {{c1::iliacus}} · {{c2::sartorius}} · {{c3::rectus femoris}} · {{c4::the three vasti}}", "extra": "The anterior-compartment nerve.", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-022", "text": "Hip nerve pattern: extensors → {{c1::inferior gluteal + sciatic}} · abductors → {{c2::superior gluteal}} · adductors → {{c3::obturator}} (adductor magnus also sciatic)", "extra": "Flexors → mainly femoral (psoas major: L1–4).", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-023", "text": "Hip extensors: {{c1::gluteus maximus}} + {{c2::the hamstrings}} (semimembranosus · semitendinosus · biceps femoris)", "extra": "", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-024", "text": "Hip abductors: {{c1::gluteus medius & minimus}} · {{c2::tensor fasciae latae}} — all supplied by the {{c3::superior gluteal nerve}}", "extra": "", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-025", "text": "Hip adductors: adductor longus, brevis & magnus + {{c1::gracilis}} — nerve: {{c2::obturator}} (adductor magnus also {{c3::sciatic}})", "extra": "", "sec": "Part 03 · 3.1 Muscles & nerve supply by movement"}, {"id": "ANA-L6-026", "text": "Medial rotators of the thigh: {{c1::gluteus medius}} · {{c2::gluteus minimus}} · {{c3::tensor fasciae latae}} · {{c4::adductor longus}}", "extra": "", "sec": "Part 07 · 7.3 Rotators of the thigh and leg"}, {"id": "ANA-L6-027", "text": "Lateral rotators of the thigh in the gluteal region: {{c1::gluteus maximus}} + {{c2::the smaller gluteal muscles}} (piriformis, gemelli, obturator internus, quadratus femoris)", "extra": "", "sec": "Part 07 · 7.3 Rotators of the thigh and leg"}, {"id": "ANA-L6-028", "text": "Lateral rotators of the thigh outside the gluteal region: {{c1::obturator externus}} (medial compartment) · {{c2::sartorius}} (anterior compartment)", "extra": "Both are exam traps.", "sec": "Part 07 · 7.3 Rotators of the thigh and leg"}, {"id": "ANA-L6-029", "text": "Medial rotators of the leg: {{c1::sartorius}} · {{c2::gracilis}} · {{c3::semitendinosus}} · {{c4::semimembranosus}}; lateral rotator of the leg: {{c5::biceps femoris}}", "extra": "", "sec": "Part 07 · 7.3 Rotators of the thigh and leg"}, {"id": "ANA-L6-030", "text": "Quadriceps femoris = {{c1::rectus femoris}} · {{c2::vastus medialis}} · {{c3::vastus lateralis}} · {{c4::vastus intermedius}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-031", "text": "Anterior thigh muscles besides the quadriceps: {{c1::sartorius}} · {{c2::iliacus}} · {{c3::psoas major}}", "extra": "Iliacus is NOT part of the quadriceps.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-032", "text": "Iliacus: origin {{c1::iliac fossa & ala of sacrum}} → insertion {{c2::lesser trochanter}}; flexes the thigh with psoas major", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-033", "text": "Sartorius: origin {{c1::anterior-superior iliac spine}} → insertion {{c2::upper medial side of the tibia}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-034", "text": "Sartorius action — thigh: {{c1::flexes & rotates laterally}}; leg: {{c2::flexes & rotates medially}}", "extra": "Exam trap: lateral at the thigh, medial at the leg.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-035", "text": "Muscle that flexes both the hip and the knee and rotates the thigh laterally (crossing the legs): {{c1::sartorius}}", "extra": "Gracilis also flexes both but adducts the thigh; rectus femoris extends the leg.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-036", "text": "Sciatic nerve cut (hamstrings paralysed), yet some knee flexion remains: {{c1::sartorius}}, supplied by the {{c2::femoral nerve}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-037", "text": "Rectus femoris: origin {{c1::anterior-inferior iliac spine}} + posterior-superior rim of the acetabulum → insertion {{c2::base of patella → tibial tuberosity}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-038", "text": "{{c3::Rectus femoris}} flexes the {{c1::thigh}} and extends the {{c2::leg}}", "extra": "Weak hip flexion + weak knee extension → rectus femoris. The vasti only extend the leg.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-039", "text": "Vasti origins (linear): medialis — {{c1::medial side of the femoral shaft}} · lateralis — {{c2::lateral side of the femoral shaft}} · intermedius — {{c3::upper shaft of the femur}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-040", "text": "Vasti insertions (then tibial tuberosity): medialis — {{c1::medial side of patella}} · lateralis — {{c2::lateral side of patella}} · intermedius — {{c3::upper border of patella}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-041", "text": "Muscle to strengthen to prevent lateral dislocation of the patella: {{c1::vastus medialis}}", "extra": "Official key (Formative 3 Q5): it inserts into the medial side of the patella.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-042", "text": "Quadriceps femoris — nerve: {{c1::femoral}}; action: {{c2::extends the leg}} (knee extensor)", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-043", "text": "Deep wound in the femoral triangle + marked weakness of knee extension → injury of the {{c1::femoral nerve}}", "extra": "It lies in the triangle (outside the sheath) and supplies the quadriceps.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-044", "text": "Ligamentum patellae: carries the insertion of the {{c1::quadriceps}} into the tibia — from the {{c2::patella}} to the {{c3::upper part of the tibial tuberosity}}", "extra": "", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-045", "text": "Patellar reflex: the tendon stretched belongs to the {{c1::quadriceps femoris}}", "extra": "Official key (Formative 3 Q17): the ligamentum patellae carries its insertion.", "sec": "Part 04 · 4.1 Anterior muscles of the thigh"}, {"id": "ANA-L6-046", "text": "Medial thigh muscles: {{c1::pectineus}} · adductor longus, brevis & magnus · {{c2::gracilis}} · {{c3::obturator externus}}", "extra": "", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-047", "text": "Adductor longus: origin {{c1::body of pubis below its crest}} → insertion {{c2::middle third of the linea aspera}}", "extra": "Adducts & flexes the thigh.", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-048", "text": "Adductor brevis: origin body & inferior pubic ramus → insertion {{c1::pectineal line & upper part of the linea aspera}}", "extra": "", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-049", "text": "Adductor magnus: origin {{c1::ischiopubic ramus & ischial tuberosity}} → insertion {{c2::linea aspera, medial supracondylar line & adductor tubercle}}", "extra": "", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-050", "text": "Adductor magnus nerve supply: {{c1::obturator nerve}} + {{c2::sciatic nerve (tibial part)}}", "extra": "Cut both → complete paralysis of adductor magnus.", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-051", "text": "Adductor magnus adducts, flexes and also {{c1::extends}} the thigh", "extra": "Other adductors only adduct & flex.", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-052", "text": "Pectineus attachments: {{c1::pectineal line of the pubis}} → {{c2::pectineal line of the femur}}; adducts & flexes the thigh", "extra": "", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-053", "text": "Gracilis: insertion {{c1::medial surface of upper quarter of tibia}}; action: adducts & flexes the thigh, {{c2::flexes & rotates the leg medially}}", "extra": "Origin: body & inferior pubic ramus.", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-054", "text": "Obturator externus: origin {{c1::margin of obturator foramen & obturator membrane}} → insertion {{c2::intertrochanteric fossa of the femur}}", "extra": "", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-055", "text": "{{c1::Obturator externus}}, a medial thigh muscle (obturator nerve), rotates the thigh {{c2::laterally}}", "extra": "Exam trap: a medial-compartment muscle that is a lateral rotator.", "sec": "Part 04 · 4.2 Medial muscles of the thigh"}, {"id": "ANA-L6-056", "text": "Hamstrings: {{c1::semitendinosus}} · {{c2::semimembranosus}} · {{c3::biceps femoris}}", "extra": "Figure also labels adductor magnus (ischial part).", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-057", "text": "Semitendinosus, semimembranosus & long head of biceps femoris arise from the {{c1::ischial tuberosity}}", "extra": "", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-058", "text": "Biceps femoris short head arises from the {{c1::linea aspera & upper supracondylar line}}", "extra": "", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-059", "text": "Insertions: semitendinosus — {{c1::medial surface of upper tibia}} · semimembranosus — {{c2::medial condyle of tibia}}", "extra": "", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-060", "text": "Tendon inserted into the head of the fibula: {{c1::biceps femoris}}", "extra": "", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-061", "text": "Semitendinosus & semimembranosus nerve: {{c1::tibial portion of the sciatic nerve}}", "extra": "", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-062", "text": "Biceps femoris nerve: long head — {{c1::tibial}} division; short head — {{c2::common peroneal}} division of the sciatic nerve", "extra": "", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-063", "text": "Hamstrings all extend the thigh & flex the leg; semitendinosus & semimembranosus rotate the leg {{c1::medially}}, biceps femoris {{c2::laterally}}", "extra": "Biceps femoris = the only hamstring that rotates the leg laterally.", "sec": "Part 04 · 4.3 Posterior muscles of the thigh"}, {"id": "ANA-L6-064", "text": "Gluteal region boundaries: superiorly {{c1::iliac crest}} · inferiorly {{c2::gluteal fold}} · medially {{c3::natal cleft}} · laterally {{c4::line joining the ASIS & greater trochanter}}", "extra": "", "sec": "Part 05 · 5.1 Boundaries of the gluteal region"}, {"id": "ANA-L6-065", "text": "Smaller lateral rotators, top → bottom: {{c1::piriformis}} · {{c2::gemellus superior}} · {{c3::obturator internus}} · {{c4::gemellus inferior}} · {{c5::quadratus femoris}}", "extra": "P-G-O-G-Q.", "sec": "Part 05 · 5.1 Boundaries of the gluteal region"}, {"id": "ANA-L6-066", "text": "The glutei mainly {{c1::extend & abduct}} the thigh and are supplied by the {{c2::gluteal nerves}}", "extra": "", "sec": "Part 05 · 5.2 Two main groups of gluteal muscles"}, {"id": "ANA-L6-067", "text": "The smaller gluteal muscles are covered by the {{c1::gluteus maximus}} and {{c2::rotate the thigh laterally}}", "extra": "Piriformis, gemelli, obturator internus, quadratus femoris.", "sec": "Part 05 · 5.2 Two main groups of gluteal muscles"}, {"id": "ANA-L6-068", "text": "Nerve supply: gluteus maximus — {{c1::inferior gluteal}}; gluteus medius, minimus & tensor fasciae latae — {{c2::superior gluteal}}", "extra": "", "sec": "Part 05 · 5.2 Two main groups of gluteal muscles"}, {"id": "ANA-L6-069", "text": "{{c3::Gluteus maximus}} {{c1::extends}} the thigh and rotates it {{c2::laterally}}", "extra": "Weak hip extension (+ lateral rotation) → gluteus maximus.", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-070", "text": "Gluteus maximus: origin {{c1::ilium, sacrum, coccyx & sacrotuberous ligament}} → insertion {{c2::gluteal tuberosity & iliotibial tract}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-071", "text": "Gluteus medius & minimus {{c1::abduct}} the thigh and rotate it {{c2::medially}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-072", "text": "Gluteal muscle that stabilizes the pelvis: {{c1::gluteus medius}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-073", "text": "Origins: gluteus medius — ilium between iliac crest and {{c1::anterior & posterior}} gluteal lines; gluteus minimus — between {{c2::anterior & inferior}} gluteal lines", "extra": "Both insert into the greater trochanter.", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-074", "text": "Tensor fasciae latae: origin {{c1::iliac crest & ASIS}} → insertion {{c2::iliotibial tract}}; flexes, abducts & rotates the thigh {{c3::medially}}", "extra": "Superior gluteal nerve.", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-075", "text": "Piriformis: from the {{c1::pelvic surface of the sacrum}} (+ sacrotuberous ligament) to the {{c2::upper end of the greater trochanter}}; rotates the thigh {{c3::laterally}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-076", "text": "Piriformis nerve supply: {{c1::ventral rami of S1 & S2}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-077", "text": "Obturator internus: origin {{c1::ischiopubic rami & obturator membrane}} → insertion greater trochanter; {{c2::abducts}} and rotates the thigh laterally", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-078", "text": "Obturator internus nerve: {{c1::nerve to obturator internus}} — not the obturator nerve", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-079", "text": "Gemelli nerves: superior gemellus — {{c1::nerve to obturator internus}}; inferior gemellus — {{c2::nerve to quadratus femoris}}", "extra": "Order P-G-O-G-Q: each gemellus takes the nerve of the muscle just below it.", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-080", "text": "Nerve to quadratus femoris supplies quadratus femoris + {{c1::inferior gemellus}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-081", "text": "Root value of the nerve to obturator internus, the nerve to quadratus femoris and the gemelli: {{c1::L5, S1}}", "extra": "Piriformis: S1–S2.", "sec": "Part 05 · 5.2 Two main groups of gluteal muscles"}, {"id": "ANA-L6-082", "text": "Gemelli origins: superior — {{c1::ischial spine}}; inferior — {{c2::ischial tuberosity}}; both insert into the {{c3::obturator internus tendon}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-083", "text": "Quadratus femoris: {{c1::ischial tuberosity}} → {{c2::intertrochanteric crest}}", "extra": "", "sec": "Part 05 · 5.3 Muscles of the gluteal region"}, {"id": "ANA-L6-084", "text": "Femoral triangle boundaries: above — {{c1::inguinal ligament}} · laterally — {{c2::sartorius}} · medially — {{c3::adductor longus}}", "extra": "Pectineus is in the floor, not the medial border.", "sec": "Part 06 · 6.1 The femoral triangle"}, {"id": "ANA-L6-085", "text": "Roof of the femoral triangle: {{c1::deep fascia containing the saphenous opening}}", "extra": "", "sec": "Part 06 · 6.1 The femoral triangle"}, {"id": "ANA-L6-086", "text": "Floor of the femoral triangle, medial → lateral: {{c1::adductor longus}} · {{c2::pectineus}} · {{c3::psoas}} · {{c4::iliacus}}", "extra": "A-P-P-I; psoas + iliacus = iliopsoas.", "sec": "Part 06 · 6.1 The femoral triangle"}, {"id": "ANA-L6-087", "text": "Femoral triangle contents: femoral artery, vein & lymphatics inside the {{c1::femoral sheath}}; the femoral nerve {{c2::outside the sheath}}", "extra": "", "sec": "Part 06 · 6.1 The femoral triangle"}, {"id": "ANA-L6-088", "text": "Femoral sheath: a {{c1::funnel}}-shaped sleeve of fascia around the femoral artery & vein, continuous above with the {{c2::transversalis & iliac fascia}}", "extra": "", "sec": "Part 06 · 6.2 The femoral sheath & femoral canal"}, {"id": "ANA-L6-089", "text": "Femoral canal: the {{c1::most medial}} compartment of the femoral sheath; contains {{c2::lymphatic vessels}}; {{c3::conical}} in shape", "extra": "", "sec": "Part 06 · 6.2 The femoral sheath & femoral canal"}, {"id": "ANA-L6-090", "text": "Femoral ring: the {{c1::superior opening of the femoral canal}} — a weak point in the lower abdomen and the site of {{c2::femoral hernias}}", "extra": "Not the saphenous opening (fossa ovalis).", "sec": "Part 06 · 6.2 The femoral sheath & femoral canal"}, {"id": "ANA-L6-091", "text": "Femoral sheath region, lateral → medial: {{c1::femoral nerve (outside)}} · {{c2::femoral artery}} · {{c3::femoral vein}} · {{c4::femoral canal (lymphatics)}}", "extra": "N-A-V-canal.", "sec": "Part 06 · 6.2 The femoral sheath & femoral canal"}, {"id": "ANA-L6-092", "text": "In the femoral triangle the femoral vein lies {{c1::medial}} to the femoral artery", "extra": "The canal (not the vein) is the most medial compartment.", "sec": "Part 06 · 6.2 The femoral sheath & femoral canal"}, {"id": "ANA-L6-093", "text": "Muscles arising from the anterior-superior iliac spine: {{c1::sartorius}} · {{c2::tensor fasciae latae}}", "extra": "AIIS: rectus femoris.", "sec": "Part 07 · 7.4 Attachments at a glance"}, {"id": "ANA-L6-094", "text": "Insertions into the greater trochanter: {{c1::gluteus medius}} · {{c2::gluteus minimus}} · {{c3::obturator internus}} · {{c4::piriformis}} (upper end)", "extra": "Lesser trochanter: iliacus.", "sec": "Part 07 · 7.4 Attachments at a glance"}, {"id": "ANA-L6-095", "text": "Muscles inserting into the iliotibial tract: {{c1::gluteus maximus}} · {{c2::tensor fasciae latae}}", "extra": " const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){
      if (at + 1 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at, 'r'); lb.innerHTML = '<div class="pin"></div>'; setPage(pgL, at + 1, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)', opacity: 1}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .7}, {transform: 'rotateY(-180deg)', opacity: 0}], () => { at++; clearLeaf(); busy = false; mark(at); upd(); });
    } else {
      if (at - 1 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at - 1, 'r'); lb.innerHTML = '<div class="pin"></div>'; leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(-180deg)', opacity: 0}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .3}, {transform: 'rotateY(0deg)', opacity: 1}], () => { at--; setPage(pgL, at, 'r'); clearLeaf(); busy = false; upd(); });
    }
  }
}
function jump(i){
  i = Math.max(0, Math.min(N - 1, i)); closeOv();
  if (!opened) openBook(i); else { at = i; draw(); }
}
document.addEventListener('keydown', e => {
  if (!opened || document.querySelector('#ovs .ov')) { if (e.key === 'Escape') closeOv(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
let tx0 = null, ty0 = 0;
book.addEventListener('touchstart', e => { const t = e.touches[0]; if (e.target.closest('.nosw,input,textarea,button,svg')) { tx0 = null; return; } tx0 = t.clientX; ty0 = t.clientY; }, {passive: true});
book.addEventListener('touchend', e => { if (tx0 === null) return; const t = e.changedTouches[0]; const dx = t.clientX - tx0, dy = t.clientY - ty0; tx0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1); }, {passive: true});

/* ---------- home (closed book) ---------- */
function examDays(d){ const t = new Date(d + 'T00:00:00'); const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return Math.round((t - a) / 864e5); }
function chipFor(e){ const n = examDays(e.date); if (n < 0) return ''; return `<span class="cd">${esc(e.name)} · <b>${n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'}</b></span>`; }
function stats(){
  const nr = Object.keys(S.read).length;
  const ids = Object.keys(S.ans).filter(q => QS[q]); const ok = ids.filter(q => S.ans[q].ok).length;
  const learned = Object.values(S.cards).filter(c => c.step >= 2).length;
  return {nr, ok, n: ids.length, learned};
}

    <div class="frame"></div>

  <div class="side">
    ${BOOK.lib ? `<a class="libl" href="${esc(BOOK.lib)}">← ${esc(BOOK.libLabel || 'All lectures')}</a>` : ''}
    <h1>${esc(BOOK.title)}</h1>
    <p>${esc(BOOK.blurb)}</p>

    <div class="stats">
      <div class="stat"><b>${st.nr}/${N}</b><span>pages read</span></div>

      ${BOOK.cards.length ? `<div class="stat"><b>${st.learned}/${BOOK.cards.length}</b><span>cards learned</span></div>` : `<div class="stat"><b>${Object.keys(LABS).filter(l => S.labs[l] && S.labs[l].done).length}/${Object.keys(LABS).length}</b><span>slides done</span></div>`}
    </div>

    </div>
    <div class="credit"><img src="helpers_badge_40.png" alt="" onerror="this.remove()"><span><b>The Helpers</b> · MedSync Team</span></div>
  </div>`;
  $('#chap').textContent = BOOK.short;

function openBook(i){
  const go2 = () => { $('#home').hidden = true; book.hidden = false; opened = true; if (i !== undefined) at = i; layout(true); };
  const c = $('#cover');
  if (c && DUR && c.animate){ c.animate([{transform: 'perspective(1400px) rotateY(0)'}, {transform: 'perspective(1400px) rotateY(-80deg)', opacity: .2}], {duration: 520, easing: 'ease-in'}).onfinish = go2; }
  else go2();

/* ---------- block renderers ---------- */
H.part = b => `<div class="part"><span class="pn">${esc(b.no)}</span><div><small>Part ${esc(b.no)}</small><h2>${esc(b.title)}</h2>${b.sub ? `<p>${esc(b.sub)}</p>` : ''}</div><span class="big">${esc(b.no)}</span></div>`;
H.h = b => `<h3 class="sh"><span class="num">${esc(b.no)}</span><span>${esc(b.title)}</span>${b.top || b.rep ? `<span class="sht">${b.top ? '<span class="tg top">★ Top priority</span>' : ''}${b.rep ? '<span class="tg">↻ High yield</span>' : ''}</span>` : ''}</h3>`;
H.hook = b => `<p class="hook">${b.html}</p>`;
H.p = b => `<p class="tx">${b.html}</p>`;
H.list = b => `<ul class="ls">${b.items.map(x => `<li>${x}</li>`).join('')}</ul>`;
const NL = {hy: 'High yield', trap: 'Exam trap', mn: 'Mnemonic', cl: 'Clinical', def: 'Definition', nb: 'N.B.'};
H.note = b => `<aside class="note n-${b.kind}"><span class="nl">${esc(b.title || NL[b.kind])}</span>${b.html}</aside>`;
H.flow = b => `<div class="flow">${b.steps.map(s => `<span>${s}</span>`).join('<i>→</i>')}</div>`;
const TB = {};
H.table = (b, pg, k) => {
  const id = pg.id + '-' + k; const st = TB[id] || (TB[id] = {cv: false, rev: {}});
  const rows = b.rows.map((r, ri) => `<tr>${r.map((c, ci) => { const cov = st.cv && ci > 0 && !st.rev[ri + ':' + ci]; return `<td${cov ? ` class="cv" data-act="rev" data-t="${id}" data-c="${ri}:${ci}"` : ''}>${cov ? '<span>' + c + '</span>' : c}</td>`; }).join('')}</tr>`).join('');
  return `<div class="tbl"><div class="tbl-h"><span>${esc(b.cap || '')}</span>${b.cover !== false ? `<button class="mini ${st.cv ? 'on' : ''}" data-act="cover" data-t="${id}">${st.cv ? 'Show answers' : 'Cover answers'}</button>` : ''}</div><div class="tw"><table><thead><tr>${b.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
};
function qimg(q, ans){
  const L = ans ? q.aimg : q.img; if (!L || !L.length) return '';
  const cap = ans ? q.acap : q.cap;
  return L.map((u, i) => `<figure class="qf"><img src="${esc(u)}" alt="${esc(cap || 'Figure for this question')}" loading="lazy">${i === L.length - 1 && cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`).join('');
}
function qtags(q){
  const t = [];
  if (q.top) t.push('<span class="tg top">★ Top priority</span>');
  if (q.rep) t.push(`<span class="tg">↻ ${esc(q.rep)}</span>`);
  t.push(`<span class="tg">${esc(q.tag)}</span>`);
  return t.join('');
}
function opts(q, st, act){
  return q.opts.map((o, i) => {
    let c = '';
    if (st && st.show){ if (i === q.ans) c = 'ok'; else if (i === st.pick) c = 'bad'; }
    else if (st && st.pick === i) c = 'pick';
    return `<button class="op ${c}" data-act="${act}" data-q="${q.id}" data-i="${i}" ${st && st.show ? 'disabled' : ''}><span class="lt">${'ABCDEFGH'[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
}
H.check = b => {
  const q = QS[b.q]; if (!q) return ''; const a = S.ans[q.id];
  const st = a ? {pick: a.pick, show: true} : null;
  const res = a ? `<div class="res ${a.ok ? 'ok' : 'bad'}">${a.ok ? '✓ Correct' : '✗ Not quite — the answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div>${qimg(q, 1)}<div class="row"><button class="btn" data-act="retry" data-q="${q.id}">Try again</button></div>` : '';
  return `<div class="qb"><div class="qh">Check question ${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'ans')}${res}</div>`;
};
H.predict = b => {
  const q = QS[b.q]; if (!q) return ''; const p = S.pred[q.id] || {};
  const st = p.lift ? {pick: p.pick, show: true} : (p.pick !== undefined ? {pick: p.pick} : null);
  let tail = '';
  if (p.pick !== undefined && !p.lift) tail = `<div class="row"><button class="btn lift" data-act="lift" data-q="${q.id}">Lift the flap ↑</button><span class="muted" style="font-size:.8em">You predicted ${'ABCDEFGH'[p.pick]}</span></div>`;
  else if (p.lift) tail = `<div class="res ${p.pick === q.ans ? 'ok' : 'bad'}">${p.pick === q.ans ? '✓ Your prediction was right' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div>`;
  else tail = `<div class="flapc"><span class="muted" style="font-size:.82em">Pick your prediction, then lift the flap</span></div>`;
  return `<div class="qb"><div class="qh">Predict, then reveal ${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'pred')}${tail}</div>`;
};
H.flap = b => {
  const q = QS[b.q]; if (!q) return ''; const lifted = S.flap[q.id]; const self = S.self[q.id];
  const dr = `<textarea class="dr" data-act="draft" data-q="${q.id}" placeholder="Write your answer first (optional)…">${esc(S.draft[q.id] || '')}</textarea>`;
  const body = lifted
    ? `<div class="ans">${q.keyhtml}</div>${qimg(q, 1)}${q.expl ? `<div class="ex">${q.expl}</div>` : ''}<div class="row"><span class="muted" style="font-size:.78em">How did you do?</span><button class="btn ${self === 'got' ? 'pri' : ''}" data-act="self" data-q="${q.id}" data-v="got">Got it</button><button class="btn ${self === 'later' ? 'pri' : ''}" data-act="self" data-q="${q.id}" data-v="later">Review later</button></div>`
    : `${dr}<div class="flapc"><button class="btn lift" data-act="flap" data-q="${q.id}">Lift the flap ↑</button></div>`;
  return `<div class="qb"><div class="qh">Written question ${qtags(q)}</div><div class="qs" style="white-space:pre-line">${esc(q.stem)}</div>${qimg(q)}${body}</div>`;
};
H.title = b => `<div class="title-page"><div class="kick">${esc(b.kick)}</div><h1 class="ttl">${esc(b.title)}</h1><div class="sub">${esc(b.sub)}</div>
  <div class="facts">${b.facts.map(f => `<div><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('')}</div>
  ${b.hook ? `<p class="hook">${b.hook}</p>` : ''}${b.note ? `<aside class="note n-hy"><span class="nl">${esc(b.note[0])}</span>${b.note[1]}</aside>` : ''}</div>`;

  <ul class="map">${items.map(([p, i]) => `<li><button data-act="jump" data-p="${i}"><span class="mn">${esc(p.toc[0])}</span><span class="mt">${esc(p.toc[1])}</span><span class="mp">p. ${i}</span></button></li>`).join('')}</ul>
  <div class="legend"><i style="background:var(--sticky)"></i><span>Sticky notes = high-yield facts</span><i style="background:var(--trap-bg);border-left:3px solid var(--red)"></i><span>Exam traps</span>
  <i style="background:var(--chip);border:1px solid var(--line)"></i><span>Check questions answer instantly</span><i style="background:var(--red)"></i><span>LAB pages: interactive drills</span></div>
  <p class="tx" style="font-size:.86em">Turn pages with the arrows, the ← → keys, or a swipe. Tap the ribbon to bookmark a page. Every fact comes from this year's Helpers pamphlet; every question is from the checked question bank.</p>`;
};
H.actions = () => `<div class="row" style="gap:.6em;margin:.8em 0">${MCQ.length ? '<button class="btn pri" data-act="open-exam">Start exam mode</button>' : ''}${BOOK.cards.length ? `<button class="btn" data-act="open-cards">Flashcards (${BOOK.cards.length})</button>` : ''}${Object.keys(QS).length ? '<button class="btn" data-act="open-mist">My mistakes</button>' : ''}</div>`;
H.progress = () => {
  const st = stats(); const labs = Object.keys(LABS); const ld = labs.filter(l => S.labs[l] && S.labs[l].done).length;
  const ex = S.exams.length ? S.exams[S.exams.length - 1] : null;
  const third = labs.length ? `<div><b>${ld}/${labs.length}</b><span>labs done</span></div>` : `<div><b>${st.learned}/${BOOK.cards.length}</b><span>cards learned</span></div>`;
  return `<div class="facts"><div><b>${st.nr}/${N}</b><span>pages read</span></div><div><b>${st.ok}/${st.n}</b><span>questions right</span></div>${third}</div>
  <p class="tx" style="font-size:.86em">${ex ? `Last exam: <b>${ex.score}/${ex.n}</b> in ${Math.round(ex.secs / 60)} min.` : 'No exam taken yet.'} ${Object.keys(S.mist).length ? `You have <b>${Object.keys(S.mist).length}</b> questions in your mistakes list.` : ''}</p>`;
};
H.lab = (b, pg) => { const L = LABS[b.lab]; return L ? labHTML(L, pg) : ''; };
const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];
  if (L.labels.length >= 2) modes.push(['test', 'Test me'], ['find', 'Find it']);
  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);
    if (mode === 'test') return st.rev[l.id] ? 'on' : 'cv';
    if (mode === 'find') return st.fb && st.fb[2] === l.id ? st.fb[0] : 'cv';
    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);
    if (st.sel === l.id) return 'sel';
    return '';
  };
  const pad = (b, k) => `left:${(b.x - k).toFixed(2)}%;top:${(b.y - k * 1.6).toFixed(2)}%;width:${(b.w + 2 * k).toFixed(2)}%;height:${(b.h + 3.2 * k).toFixed(2)}%`;
  const boxes = L.labels.map(l => {
    const c = cls(l);
    // a numbered legend: the label is covered, the number on the picture is the spot to tap
    const lab = `<button class="sb ${l.m && mode === 'find' ? (c === 'cv' ? 'cv' : '') : c}" style="${pad(l, .35)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="${mode === 'test' || mode === 'find' ? 'covered label' : esc(l.t)}"></button>`;
    const mk = l.m ? `<button class="sb mk ${mode === 'find' ? (st.fb && st.fb[2] === l.id ? st.fb[0] : '') : (c === 'cv' ? '' : c)}" style="${pad(l.m, .6)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="number ${esc(l.n)}"></button>` : '';
    return lab + mk;
  }).join('');
  let info = '';
  if (mode === 'labels'){
    const l = L.labels.find(x => x.id === st.sel), m = l && slmus(L, l);
    info = m ? `<h4>${esc(m.name)}</h4>${esc(m.note || '')}<div class="muted" style="margin-top:.25em">Nerve: ${esc(m.nerves.map(n => (L.act.nerves.find(x => x.id === n) || {}).name).filter(Boolean).join(' + ') || 'not used as an answer in this book')}</div>`
      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`

    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;

    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

/* ---------- click handling ---------- */
const A = {};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = A[a.dataset.act]; if (f){ e.preventDefault(); f(a, e); }
});
document.addEventListener('input', e => { const a = e.target.closest('[data-act="draft"]'); if (a){ S.draft[a.dataset.q] = a.value; save(); } });
A.next = () => go(1); A.prev = () => go(-1);
A.home = () => { closeOv(); home(); };
A.open = () => openBook(S.last > 0 ? S.last : 1);
A.jump = a => jump(+a.dataset.p);
A.mark = a => { const i = +a.dataset.p; if (S.marks[i]) delete S.marks[i]; else S.marks[i] = 1; save(); rerender(i); toast(S.marks[i] ? 'Bookmarked' : 'Bookmark removed'); };
A.cover = a => { const t = TB[a.dataset.t]; t.cv = !t.cv; t.rev = {}; rerender(pageOf(a)); };
A.rev = a => { const t = TB[a.dataset.t]; t.rev[a.dataset.c] = 1; rerender(pageOf(a)); };
A.ans = a => { const q = QS[a.dataset.q], i = +a.dataset.i; const ok = i === q.ans; S.ans[q.id] = {pick: i, ok, t: Date.now()}; if (ok) delete S.mist[q.id]; else S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.retry = a => { delete S.ans[a.dataset.q]; save(); rerender(pageOf(a)); };
A.pred = a => { const p = S.pred[a.dataset.q] || {}; if (p.lift) return; p.pick = +a.dataset.i; S.pred[a.dataset.q] = p; save(); rerender(pageOf(a)); };
A.lift = a => { const q = QS[a.dataset.q]; const p = S.pred[q.id]; p.lift = 1; if (p.pick !== q.ans) S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.flap = a => { S.flap[a.dataset.q] = 1; save(); rerender(pageOf(a)); };
A.self = a => { S.self[a.dataset.q] = a.dataset.v; save(); rerender(pageOf(a)); };
const rcst = id => { const st = S.labs[id] || (S.labs[id] = {}); st.r = st.r || {}; return st; };
A.rcv = a => { const st = rcst(a.dataset.l), i = a.dataset.i; if (st.r[i]) delete st.r[i]; else st.r[i] = 1; save(); rerender(pageOf(a)); };
A.rcall = a => { const st = rcst(a.dataset.l); for (let i = 0; i < +a.dataset.n; i++) st.r[i] = 1; save(); rerender(pageOf(a)); };
A.rcno = a => { const st = rcst(a.dataset.l); st.r = {}; save(); rerender(pageOf(a)); };
// labs
A.map = a => { const L = LABS[a.dataset.l], st = LS[L.id];
  if (st.mode === 'explore') st.sel = st.sel === a.dataset.id ? null : a.dataset.id;
  else if (st.qi < L.tests.length){ const t = L.tests[st.order[st.qi]]; if (a.dataset.id === t.a){ st.score += st.fb && st.fb[0] === 'bad' ? 0 : 1; st.qi++; st.fb = null; toast('✓ Correct'); } else st.fb = ['bad', 'Not this one — ' + L.regions.find(r => r.id === a.dataset.id).name + '. Try again.']; }
  rerender(pageOf(a)); };
A.mapmode = a => { const st = LS[a.dataset.l]; st.mode = a.dataset.v; st.sel = null; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(st.order, String(Date.now())); rerender(pageOf(a)); };
A.g = a => { const L = LABS[a.dataset.l], st = gstate(L), t = a.dataset.t, id = a.dataset.id;
  if (st.mode === 'explore') st.sel = st.sel && st.sel[0] === t && st.sel[1] === id ? null : [t, id];
  else if (t === 'n') st.cut[id] = !st.cut[id];
  rerender(pageOf(a)); };
A.gmode = a => { const st = gstate(LABS[a.dataset.l]); st.mode = a.dataset.v; st.sel = null; rerender(pageOf(a)); };
A.gclear = a => { const st = gstate(LABS[a.dataset.l]); st.cut = {}; rerender(pageOf(a)); };
A.gcase = a => { const L = LABS[a.dataset.l], st = gstate(L), c = L.cases[+a.dataset.i]; st.cut = {}; c.cut.forEach(n => st.cut[n] = true); labDone(L.id); rerender(pageOf(a)); };
A.spick = a => { const st = LS[a.dataset.l]; st.sel = st.sel === a.dataset.id ? null : a.dataset.id; st.shake = null; rerender(pageOf(a)); };
A.sdrop = a => { const L = LABS[a.dataset.l], st = LS[L.id]; if (!st.sel) return; const it = L.items.find(x => x.id === st.sel);
  if (it.bin === a.dataset.b){ st.placed[it.id] = it.bin; st.sel = null; st.shake = null; } else { st.wrong++; st.shake = it.id; toast('Not there — try another box'); }
  rerender(pageOf(a)); };
A.sreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.qpick = a => { const L = LABS[a.dataset.l], st = LS[L.id], i = +a.dataset.i; if (i === st.n){ st.n++; st.shake = null; } else { st.wrong++; st.shake = i; } rerender(pageOf(a)); };
A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find'){ if (st.qi >= st.order.length) return; const t = st.order[st.qi];
    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }
    else st.fb = ['bad', 'Not that one. Try again.', id, t]; }
  else st.sel = st.sel === id ? null : id;
  slre(a); };
A.slmv = a => { const st = slst(LABS[a.dataset.l]); st.mv = st.mv === a.dataset.id ? null : a.dataset.id; slre(a); };
A.slcut = a => { const st = slst(LABS[a.dataset.l]); st.cut[a.dataset.id] = !st.cut[a.dataset.id]; slre(a); };
A.slbig = a => { const L = LABS[a.dataset.l]; ov(L.title || 'Practical slide', `<div class="slbig" data-big="${L.id}">${LAB.slide(L, true)}</div>`, 'wide'); };
function slre(a){
  const big = a.closest('[data-big]');
  if (big){ big.innerHTML = LAB.slide(LABS[big.dataset.big], true); const i = pageOf(document.querySelector(`#pgL [data-l="${big.dataset.big}"], #pgR [data-l="${big.dataset.big}"]`) || document.body); if (i >= 0) rerender(i); return; }
  rerender(pageOf(a));
}
A.dmode = a => { const L = LABS[a.dataset.l], st = LS[L.id]; st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(L.pins.map(p => p.id), String(Date.now())); rerender(pageOf(a)); };
A.pin = a => { const L = LABS[a.dataset.l], st = LS[L.id], id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find' && st.qi < st.order.length){ const t = st.order[st.qi];
    if (id === t){ st.score += st.fb && st.fb[0] === 'bad' && st.fb[3] === t ? 0 : 1; st.qi++; st.fb = ['ok', '✓ Correct', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; rerender(pageOf(document.querySelector(`[data-l="${L.id}"]`) || a)); } }, 700); }
    else st.fb = ['bad', 'That is ' + L.pins.find(p => p.id === id).name + '. Try again.', id, t]; }
  rerender(pageOf(a)); };

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
