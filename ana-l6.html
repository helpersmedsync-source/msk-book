<script>
const BOOK = {"id": "ana-l6", "title": "Anatomy · Lecture 6 — Movement of the Thigh", "short": "Anatomy L6 · Thigh", "subject": "Anatomy", "coverLine": "Lecture 6 · Anatomical Basis of Movement of the Thigh", "coverNote": "Interactive edition", "blurb": "The pamphlet, turned into a book you can work with: text pages with sticky notes, eight hand-made labs, real-image labs from the practical slides, check questions that answer instantly, lift-the-flap written questions, flashcards with spaced repetition and an exam mode.", "exams": [{"name": "Final", "date": "2026-11-09"}, {"name": "Practical", "date": "2026-11-11"}], "pages": [{"id": "p0", "head": "", "kind": "cover", "blocks": [{"t": "contents"}]}, {"id": "p1", "head": "Lecture 6", "kind": "text", "blocks": [{"t": "title", "kick": "MSK Module · Anatomy · Lecture 6", "title": "Anatomical Basis of Movement of the Thigh", "sub": "Pelvic girdle and fascia lata, the hip joint, the three compartments, the gluteal region and the femoral triangle.", "facts": [["8", "pamphlet parts"], ["24", "labs"], ["27", "Final-bank questions"]], "hook": "Cut the sciatic nerve and the hamstrings are paralysed — yet the patient can still bend the knee a little. Which muscle does it, and why does it survive? You will find out in the movement lab.", "note": ["In the Final", "Lower limb comes as <b>MCQ + essay<\/b>. 19 of this lecture's Final-bank questions are <b>top priority<\/b> — the department used them this year."]}]}, {"id": "p2", "head": "Part 01 · Pelvic girdle & fascia lata", "kind": "text", "blocks": [{"t": "part", "no": "01", "title": "Pelvic Girdle & Fascia Lata", "sub": "The girdle that carries the body's weight, and the fascia that splits the thigh into three"}, {"t": "h", "no": "1.1", "title": "The pelvic girdle"}, {"t": "p", "html": "The pelvic girdle is formed by the <mark>hip (innominate) bone<\/mark> and the <mark>sacrum<\/mark>. It transmits the weight of the structures above to the lower limbs, and it protects and supports the pelvic organs."}, {"t": "h", "no": "1.2", "title": "Deep fascia of the thigh — fascia lata"}, {"t": "hook", "html": "Three walls of fascia, three compartments, three nerves. Can you name all three before you read on?"}, {"t": "p", "html": "The deep fascia of the thigh is the <mark>fascia lata<\/mark>. It is strong, especially laterally, where it forms the <mark>iliotibial tract<\/mark>. It forms <b>3 intermuscular septa<\/b> that divide the thigh into 3 compartments."}, {"t": "table", "cap": "The three compartments", "cols": ["Compartment", "Contents", "Nerve"], "rows": [["Anterior", "Quadriceps femoris", "Femoral"], ["Medial", "Adductor muscles", "Obturator"], ["Posterior", "Hamstring muscles", "Sciatic"]], "cover": true}, {"t": "note", "kind": "mn", "html": "Anterior–Femoral · Medial–Obturator · Posterior–Sciatic: <b>A-F · M-O · P-S<\/b>."}, {"t": "p", "html": "The <mark>saphenous opening<\/mark> is an oval gap in the fascia lata below the inguinal ligament. It is covered by the <b>cribriform fascia<\/b> (part of the superficial fascia) and transmits the <b>greater saphenous vein<\/b>."}], "toc": ["01", "Pelvic girdle & fascia lata"]}, {"id": "p3", "head": "Lab · The three compartments", "kind": "lab", "blocks": [{"t": "lab", "lab": "compart"}, {"t": "check", "q": "N-ANA-L6-01"}, {"t": "check", "q": "N-ANA-L6-05"}], "labName": "The three compartments (cross-section)"}, {"id": "p4", "head": "Part 02 · The hip joint", "kind": "text", "blocks": [{"t": "part", "no": "02", "title": "The Hip Joint", "sub": "A deep ball-and-socket joint, held by three capsular ligaments"}, {"t": "h", "no": "2.1", "title": "Structure of the hip joint"}, {"t": "p", "html": "The hip is a <mark>ball-and-socket synovial joint<\/mark>. The head of the femur articulates with the cartilage-lined, horseshoe-shaped <mark>lunate surface<\/mark> of the acetabulum. Its socket is <b>far deeper<\/b> than the equivalent socket of the shoulder joint."}, {"t": "list", "items": ["<b>Acetabular labrum<\/b> — a stabilizing ring of <mark>fibrocartilage<\/mark> around the margin of the acetabulum.", "<b>Transverse acetabular ligament<\/b> — bridges the <mark>acetabular notch<\/mark> to complete the socket.", "<b>Ligamentum teres<\/b> — from the transverse acetabular ligament to the <mark>fovea<\/mark> at the centre of the femoral head."]}, {"t": "h", "no": "2.2", "title": "Ligaments strengthening the capsule"}, {"t": "table", "cap": "Capsular ligaments", "cols": ["Side", "Ligament"], "rows": [["Anterior", "Iliofemoral"], ["Medial", "Pubofemoral"], ["Posterior", "Ischiofemoral"]], "cover": true}, {"t": "note", "kind": "mn", "html": "Anterior · Medial · Posterior → <b>I-P-I<\/b> (Ilio · Pubo · Ischio): <b>A-M-P → I-P-I<\/b>."}, {"t": "note", "kind": "hy", "html": "The <b>iliofemoral ligament<\/b> is the largest and most important ligament of the hip. It resists <b>hyperextension<\/b> and <b>lateral rotation<\/b> at the hip during standing.", "title": "Strongest ligament"}], "toc": ["02", "The hip joint"]}, {"id": "p5", "head": "Part 02 · Check yourself", "kind": "text", "blocks": [{"t": "h", "no": "2", "title": "Hip joint — check yourself"}, {"t": "check", "q": "Q0173"}, {"t": "flap", "q": "Y26-034"}, {"t": "flap", "q": "N-ANA-L6-03"}]}, {"id": "p6", "head": "Part 03 · Movements at the hip", "kind": "text", "blocks": [{"t": "part", "no": "03", "title": "Movements at the Hip", "sub": "Six movements, the muscles that produce them and the nerves behind them"}, {"t": "h", "no": "3.1", "title": "Muscles & nerve supply by movement"}, {"t": "table", "cap": "Hip movements", "cols": ["Movement", "Muscles", "Nerve"], "rows": [["Flexion", "Psoas major · iliacus · pectineus · sartorius · rectus femoris", "Femoral (psoas major: lumbar nerves L1–4)"], ["Extension", "Gluteus maximus · hamstrings (semimembranosus, semitendinosus, biceps femoris)", "Inferior gluteal · sciatic"], ["Abduction", "Gluteus medius & minimus · tensor fasciae latae", "Superior gluteal"], ["Adduction", "Adductor longus, brevis & magnus · gracilis", "Obturator (adductor magnus also sciatic)"], ["Medial rotation", "Adductor longus · tensor fasciae latae · gluteus medius", "—"], ["Lateral rotation", "Gluteus maximus · piriformis (S1–2) · obturator internus · quadratus femoris", "—"]], "cover": true}, {"t": "note", "kind": "hy", "html": "<b>Psoas major<\/b> is supplied by the <b>lumbar nerves L1–4<\/b>, not the femoral nerve — so some hip flexion survives a complete femoral nerve injury.", "title": "Psoas major"}, {"t": "note", "kind": "def", "html": "The main flexor of the hip joint is the <b>iliopsoas<\/b> (iliacus + psoas major): iliacus flexes the thigh with psoas major.", "title": "Main hip flexor"}, {"t": "note", "kind": "nb", "html": "The pamphlet gives two versions of the nerve of <b>pectineus<\/b> (femoral on the movements slide; obturator and femoral in the muscle table). It is not used as an answer anywhere in this book."}], "toc": ["03", "Movements at the hip"]}, {"id": "p7", "head": "Lab · Nerve-injury simulator", "kind": "lab", "blocks": [{"t": "lab", "lab": "graph"}, {"t": "check", "q": "Q0174"}], "labName": "Nerves → muscles → movements, and nerve injuries"}, {"id": "p8", "head": "Part 04 · Anterior muscles", "kind": "text", "blocks": [{"t": "part", "no": "04", "title": "Muscles of the Thigh", "sub": "The anterior, medial and posterior groups — attachments, actions and nerves"}, {"t": "h", "no": "4.1", "title": "Anterior muscles of the thigh"}, {"t": "p", "html": "<mark>Quadriceps femoris<\/mark> = rectus femoris + vastus medialis + vastus lateralis + vastus intermedius. The other anterior muscles are <b>sartorius<\/b>, <b>iliacus<\/b> and <b>psoas major<\/b> — iliacus is not part of the quadriceps."}, {"t": "table", "cap": "Anterior group", "cols": ["Muscle", "Origin", "Insertion", "Action"], "rows": [["Iliacus", "Iliac fossa & ala of sacrum", "Lesser trochanter", "Flexes the thigh (with psoas major)"], ["Sartorius", "Anterior-superior iliac spine", "Upper medial side of the tibia", "Thigh: flexes & rotates laterally · leg: flexes & rotates medially"], ["Rectus femoris", "Anterior-inferior iliac spine + posterior-superior rim of the acetabulum", "Base of patella → tibial tuberosity", "Flexes the thigh · extends the leg"], ["Vastus medialis", "Medial side of the femoral shaft", "Medial side of patella → tibial tuberosity", "Extends the leg"], ["Vastus lateralis", "Lateral side of the femoral shaft", "Lateral side of patella → tibial tuberosity", "Extends the leg"], ["Vastus intermedius", "Upper shaft of the femur", "Upper border of patella → tibial tuberosity", "Extends the leg"]], "cover": true}, {"t": "p", "html": "The <b>femoral nerve<\/b> supplies iliacus, sartorius, rectus femoris and the three vasti. The quadriceps is the extensor of the knee; the <mark>ligamentum patellae<\/mark> carries its insertion from the patella to the upper part of the tibial tuberosity."}], "toc": ["04", "Muscles of the thigh"]}, {"id": "p9", "head": "Part 04 · Anterior muscles — traps & checks", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "<b>Sartorius<\/b> rotates the <b>thigh laterally<\/b> but the <b>leg medially<\/b>. It flexes both the hip and the knee — the muscle of crossing the legs."}, {"t": "note", "kind": "hy", "html": "<b>Rectus femoris<\/b> flexes the thigh <b>and<\/b> extends the leg: weak hip flexion + weak knee extension → rectus femoris. The vasti only extend the leg.", "title": "Two joints, two actions"}, {"t": "note", "kind": "cl", "html": "To prevent <b>lateral dislocation of the patella<\/b>, strengthen <b>vastus medialis<\/b> — it inserts into the medial side of the patella. The patellar reflex stretches the tendon of the <b>quadriceps femoris<\/b>."}, {"t": "note", "kind": "cl", "html": "A deep wound in the femoral triangle with marked weakness of knee extension → <b>femoral nerve<\/b>: it lies in the triangle (outside the sheath) and supplies the quadriceps."}, {"t": "predict", "q": "Y26-020"}, {"t": "check", "q": "Q0099"}, {"t": "check", "q": "Y26-021"}]}, {"id": "p10", "head": "Part 04 · Medial muscles", "kind": "text", "blocks": [{"t": "h", "no": "4.2", "title": "Medial muscles of the thigh"}, {"t": "p", "html": "The medial group: <b>pectineus<\/b>, adductor longus, brevis and magnus, <b>gracilis<\/b> and <b>obturator externus<\/b>. They are supplied by the <mark>obturator nerve<\/mark>; adductor magnus is also supplied by the sciatic nerve (tibial part)."}, {"t": "table", "cap": "Medial group", "cols": ["Muscle", "Origin", "Insertion", "Action"], "rows": [["Pectineus", "Pectineal line of the pubis", "Pectineal line of the femur", "Adducts & flexes the thigh"], ["Adductor longus", "Body of pubis below its crest", "Middle third of the linea aspera", "Adducts & flexes the thigh; rotates it medially"], ["Adductor brevis", "Body & inferior pubic ramus", "Pectineal line & upper part of the linea aspera", "Adducts & flexes the thigh"], ["Adductor magnus", "Ischiopubic ramus & ischial tuberosity", "Linea aspera, medial supracondylar line & adductor tubercle", "Adducts, flexes and also extends the thigh"], ["Gracilis", "Body & inferior pubic ramus", "Medial surface of the upper quarter of the tibia", "Adducts & flexes the thigh; flexes & rotates the leg medially"], ["Obturator externus", "Margin of obturator foramen & obturator membrane", "Intertrochanteric fossa of the femur", "Rotates the thigh laterally"]], "cover": true}, {"t": "note", "kind": "hy", "html": "<b>Adductor magnus<\/b> has two nerves — <b>obturator + sciatic (tibial part)<\/b> — and also extends the thigh. Cut both nerves and it is completely paralysed.", "title": "Two nerves"}, {"t": "note", "kind": "trap", "html": "<b>Obturator externus<\/b> is a medial-compartment muscle (obturator nerve) that rotates the thigh <b>laterally<\/b>."}]}, {"id": "p11", "head": "Part 04 · Posterior muscles", "kind": "text", "blocks": [{"t": "h", "no": "4.3", "title": "Posterior muscles of the thigh"}, {"t": "p", "html": "The <mark>hamstrings<\/mark>: semitendinosus, semimembranosus and biceps femoris. They all extend the thigh and flex the leg."}, {"t": "table", "cap": "Posterior group", "cols": ["Muscle", "Origin", "Insertion", "Nerve", "Rotates the leg"], "rows": [["Semitendinosus", "Ischial tuberosity", "Medial surface of the upper tibia", "Tibial portion of sciatic", "Medially"], ["Semimembranosus", "Ischial tuberosity", "Medial condyle of the tibia", "Tibial portion of sciatic", "Medially"], ["Biceps femoris", "Long head: ischial tuberosity · short head: linea aspera & upper supracondylar line", "Head of the fibula", "Long head: tibial · short head: common peroneal", "Laterally"]], "cover": true}, {"t": "note", "kind": "hy", "html": "<b>Biceps femoris<\/b> is the only hamstring that rotates the leg <b>laterally<\/b>, and the tendon inserted into the <b>head of the fibula<\/b>.", "title": "Biceps femoris"}, {"t": "note", "kind": "cl", "html": "Sciatic nerve cut and the hamstrings paralysed, yet some knee flexion remains → <b>sartorius<\/b>, supplied by the femoral nerve."}]}, {"id": "p12", "head": "Lab · Sort the thigh muscles", "kind": "lab", "blocks": [{"t": "lab", "lab": "sortcomp"}, {"t": "check", "q": "Q0098"}], "labName": "Sort the muscles into their compartments"}, {"id": "p13", "head": "Part 04 · Check yourself", "kind": "text", "blocks": [{"t": "h", "no": "4", "title": "Muscles of the thigh — check yourself"}, {"t": "check", "q": "Q0104"}, {"t": "check", "q": "Q0172"}, {"t": "check", "q": "Y26-027"}]}, {"id": "p14", "head": "Part 04 · Check yourself (2)", "kind": "text", "blocks": [{"t": "check", "q": "Q0115"}, {"t": "check", "q": "Q0175"}, {"t": "check", "q": "Q0176"}, {"t": "check", "q": "N-ANA-L6-08"}]}, {"id": "p15", "head": "Part 04 · Written questions", "kind": "text", "blocks": [{"t": "flap", "q": "TP-082"}, {"t": "flap", "q": "N-ANA-L6-10"}]}, {"id": "p16", "head": "Part 05 · The gluteal region", "kind": "text", "blocks": [{"t": "part", "no": "05", "title": "The Gluteal Region", "sub": "The glutei, the small lateral rotators and their nerves"}, {"t": "h", "no": "5.1", "title": "Boundaries of the gluteal region"}, {"t": "table", "cap": "Boundaries", "cols": ["Side", "Boundary"], "rows": [["Superiorly", "Iliac crest"], ["Inferiorly", "Gluteal fold"], ["Medially", "Natal cleft"], ["Laterally", "Line joining the ASIS & the greater trochanter"]], "cover": true}, {"t": "h", "no": "5.2", "title": "Two main groups of muscles"}, {"t": "p", "html": "The <b>glutei<\/b> mainly extend and abduct the thigh and are supplied by the <mark>gluteal nerves<\/mark>: gluteus maximus by the <b>inferior gluteal<\/b>; gluteus medius, minimus and tensor fasciae latae by the <b>superior gluteal<\/b>. The <b>smaller muscles<\/b> are covered by gluteus maximus and rotate the thigh laterally."}, {"t": "h", "no": "5.3", "title": "Muscles of the gluteal region"}, {"t": "table", "cap": "Gluteal muscles", "cols": ["Muscle", "Origin", "Insertion", "Action", "Nerve"], "rows": [["Gluteus maximus", "Ilium, sacrum, coccyx & sacrotuberous ligament", "Gluteal tuberosity & iliotibial tract", "Extends & rotates the thigh laterally", "Inferior gluteal"], ["Gluteus medius", "Ilium between iliac crest and anterior & posterior gluteal lines", "Greater trochanter", "Abducts & rotates the thigh medially; stabilizes the pelvis", "Superior gluteal"], ["Gluteus minimus", "Ilium between anterior & inferior gluteal lines", "Greater trochanter", "Abducts & rotates the thigh medially", "Superior gluteal"], ["Tensor fasciae latae", "Iliac crest & ASIS", "Iliotibial tract", "Flexes, abducts & rotates the thigh medially", "Superior gluteal"], ["Piriformis", "Pelvic surface of the sacrum (+ sacrotuberous ligament)", "Upper end of the greater trochanter", "Rotates the thigh laterally", "Ventral rami S1, S2"], ["Superior gemellus", "Ischial spine", "Obturator internus tendon", "Rotates the thigh laterally", "Nerve to obturator internus"], ["Obturator internus", "Ischiopubic rami & obturator membrane", "Greater trochanter", "Abducts & rotates the thigh laterally", "Nerve to obturator internus"], ["Inferior gemellus", "Ischial tuberosity", "Obturator internus tendon", "Rotates the thigh laterally", "Nerve to quadratus femoris"], ["Quadratus femoris", "Ischial tuberosity", "Intertrochanteric crest", "Rotates the thigh laterally", "Nerve to quadratus femoris"]], "cover": true}], "toc": ["05", "The gluteal region"]}, {"id": "p17", "head": "Lab · Small rotators & their nerves", "kind": "lab", "blocks": [{"t": "note", "kind": "mn", "html": "The smaller lateral rotators, top → bottom: <b>P-G-O-G-Q<\/b> — piriformis · gemellus superior · obturator internus · gemellus inferior · quadratus femoris. Each gemellus takes the nerve of the muscle just below it."}, {"t": "lab", "lab": "seqrot"}, {"t": "lab", "lab": "sortglut"}, {"t": "note", "kind": "trap", "html": "The <b>obturator internus<\/b> is supplied by the <b>nerve to obturator internus<\/b> — not the obturator nerve. Root value of the nerves to obturator internus and quadratus femoris: <b>L5, S1<\/b> (piriformis: S1–S2)."}], "labName": "Order the small rotators; match the gluteal nerves"}, {"id": "p18", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "h", "no": "5", "title": "Gluteal region — check yourself"}, {"t": "check", "q": "Y26-025"}, {"t": "check", "q": "Y26-026"}, {"t": "check", "q": "Q0096"}]}, {"id": "p19", "head": "Part 05 · Written question", "kind": "text", "blocks": [{"t": "check", "q": "N-ANA-L6-07"}, {"t": "flap", "q": "N-ANA-L6-04"}]}, {"id": "p20", "head": "Part 06 · Femoral triangle & sheath", "kind": "text", "blocks": [{"t": "part", "no": "06", "title": "Femoral Triangle & Sheath", "sub": "Boundaries, floor and contents — and the weak point for hernias"}, {"t": "h", "no": "6.1", "title": "The femoral triangle"}, {"t": "table", "cap": "Femoral triangle", "cols": ["Part", "Formed by"], "rows": [["Above", "Inguinal ligament"], ["Laterally", "Sartorius"], ["Medially", "Adductor longus"], ["Roof", "Deep fascia containing the saphenous opening"], ["Floor (medial → lateral)", "Adductor longus · pectineus · psoas · iliacus"], ["Contents", "Femoral artery, vein & lymphatics inside the femoral sheath; the femoral nerve outside the sheath"]], "cover": true}, {"t": "note", "kind": "mn", "html": "Floor from medial to lateral: <b>A-P-P-I<\/b> — Adductor longus, Pectineus, Psoas, Iliacus (psoas + iliacus = iliopsoas)."}, {"t": "h", "no": "6.2", "title": "The femoral sheath & femoral canal"}, {"t": "p", "html": "The <mark>femoral sheath<\/mark> is a funnel-shaped sleeve of fascia around the femoral artery and vein, continuous above with the <b>transversalis and iliac fascia<\/b>. Its most medial compartment is the <mark>femoral canal<\/mark> — conical, containing the lymphatic vessels."}, {"t": "note", "kind": "cl", "html": "The <b>femoral ring<\/b> — the superior opening of the femoral canal — is a weak point in the lower abdomen and the site of <b>femoral hernias<\/b>. It is not the saphenous opening."}, {"t": "note", "kind": "trap", "html": "The <b>femoral nerve<\/b> is in the femoral triangle but <b>outside<\/b> the femoral sheath. The femoral <b>canal<\/b>, not the vein, is the most medial compartment. Pectineus is in the floor, not the medial border."}], "toc": ["06", "Femoral triangle & sheath"]}, {"id": "p21", "head": "Lab · Femoral triangle", "kind": "lab", "blocks": [{"t": "lab", "lab": "femtri"}, {"t": "lab", "lab": "seqnav"}], "labName": "Femoral triangle diagram"}, {"id": "p22", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "h", "no": "6", "title": "Femoral triangle — check yourself"}, {"t": "predict", "q": "N-ANA-L6-06"}, {"t": "check", "q": "Y26-019"}, {"t": "check", "q": "Y26-022"}, {"t": "check", "q": "Y26-023"}, {"t": "check", "q": "Y26-024"}, {"t": "check", "q": "Q0100"}]}, {"id": "p23", "head": "Part 06 · Written questions", "kind": "text", "blocks": [{"t": "flap", "q": "Q0040"}, {"t": "flap", "q": "TP-083"}, {"t": "flap", "q": "N-ANA-L6-09"}]}, {"id": "p24", "head": "Part 07 · Muscles compared", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Muscles Compared", "sub": "The lecture's master tables — read across a row"}, {"t": "h", "no": "7.2", "title": "Nerve → muscles supplied"}, {"t": "table", "cap": "Nerves of the thigh & gluteal region", "cols": ["Nerve", "Muscles"], "rows": [["Femoral", "Iliacus · sartorius · quadriceps"], ["Obturator", "Adductors · gracilis · obturator externus"], ["Sciatic — tibial part", "Semitendinosus · semimembranosus · biceps femoris (long head) · adductor magnus"], ["Sciatic — common peroneal part", "Biceps femoris (short head)"], ["Superior gluteal", "Gluteus medius · gluteus minimus · tensor fasciae latae"], ["Inferior gluteal", "Gluteus maximus"], ["Nerve to obturator internus", "Obturator internus · superior gemellus"], ["Nerve to quadratus femoris", "Quadratus femoris · inferior gemellus"]], "cover": true}, {"t": "h", "no": "7.3", "title": "Rotators of the thigh and leg"}, {"t": "table", "cap": "Rotators", "cols": ["Movement", "Muscles"], "rows": [["Lateral rotation of the thigh", "Gluteus maximus · piriformis · obturators · gemelli · quadratus femoris · sartorius"], ["Medial rotation of the thigh", "Gluteus medius · gluteus minimus · tensor fasciae latae · adductor longus"], ["Medial rotation of the leg", "Sartorius · gracilis · semitendinosus · semimembranosus"], ["Lateral rotation of the leg", "Biceps femoris"]], "cover": true}, {"t": "note", "kind": "nb", "html": "Pectineus is left out of the nerve table on purpose (see Part 03)."}], "toc": ["07", "Muscles compared"]}, {"id": "p25", "head": "Part 07 · Attachments at a glance", "kind": "lab", "blocks": [{"t": "h", "no": "7.4", "title": "Attachments at a glance"}, {"t": "table", "cap": "Bony attachments", "cols": ["Attachment", "Muscles"], "rows": [["ASIS", "Sartorius · tensor fasciae latae"], ["AIIS", "Rectus femoris"], ["Ischial tuberosity", "Hamstrings · adductor magnus · inferior gemellus · quadratus femoris"], ["Lesser trochanter", "Iliacus"], ["Greater trochanter", "Gluteus medius · gluteus minimus · obturator internus · piriformis (upper end)"], ["Iliotibial tract", "Gluteus maximus · tensor fasciae latae"], ["Medial tibia", "Sartorius · gracilis · semitendinosus · semimembranosus"]], "cover": true}, {"t": "lab", "lab": "sortatt"}], "labName": "Match muscles to their attachments"}, {"id": "p26", "head": "Part 08 · Rapid revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "The last pages to read before the exam"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "table", "cap": "Cover the answers and test yourself", "cols": ["Question", "Answer"], "rows": [["Nerve of each thigh compartment?", "Anterior femoral · medial obturator · posterior sciatic"], ["Largest hip ligament — what does it resist?", "Iliofemoral; hyperextension & lateral rotation during standing"], ["Nerve of psoas major?", "Lumbar nerves L1–4"], ["Gluteal muscle that stabilizes the pelvis?", "Gluteus medius"], ["Site of femoral hernias?", "Femoral ring"], ["Floor of the femoral triangle (medial → lateral)?", "Adductor longus · pectineus · psoas · iliacus"], ["Femoral sheath region, lateral → medial?", "Femoral nerve (outside) · artery · vein · canal"], ["Tendon inserted into the head of the fibula?", "Biceps femoris"], ["Medial-compartment muscle that rotates the thigh laterally?", "Obturator externus"], ["Nerves of the gemelli?", "Superior: nerve to obturator internus · inferior: nerve to quadratus femoris"], ["Knee flexion left after a sciatic injury?", "Sartorius (femoral nerve)"], ["Muscle to strengthen against lateral patellar dislocation?", "Vastus medialis"]], "cover": true}], "toc": ["08", "Rapid revision"]}, {"id": "p27", "head": "Part 08 · Mnemonics & exam traps", "kind": "text", "blocks": [{"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "note", "kind": "mn", "html": "<b>A-F · M-O · P-S<\/b> — compartments and nerves<br><b>A-M-P → I-P-I<\/b> — capsular ligaments<br><b>A-P-P-I<\/b> — femoral triangle floor, medial → lateral<br><b>N-A-V-canal<\/b> — femoral sheath region, lateral → medial<br><b>P-G-O-G-Q<\/b> — small lateral rotators, top → bottom<br>Gluteal nerves: maximus = <b>inferior<\/b>; medius, minimus, TFL = <b>superior<\/b>", "title": "Mnemonic vault"}, {"t": "note", "kind": "trap", "html": "Femoral nerve: in the femoral triangle, outside the femoral sheath.<br>Femoral canal: the most medial compartment of the sheath.<br>Superior gemellus → nerve to obturator internus; inferior gemellus → nerve to quadratus femoris.<br>Sartorius rotates the thigh laterally but the leg medially.<br>Obturator externus is a medial muscle that rotates the thigh laterally.<br>Adductor magnus has two nerves and also extends the thigh.<br>Iliacus is not part of the quadriceps.", "title": "Classic exam traps"}, {"t": "flap", "q": "TP-125"}]}, {"id": "p28", "head": "Real images · 1 of 16", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one; the muscle pictures also have <b>Movements<\/b> and <b>Cut a nerve<\/b>. Every slide of the session is in the practical book: <a href=\"prac-ana-3.html\">Anatomy practical · Practical 3 – Hip &amp; thigh<\/a>."}, {"t": "lab", "lab": "sl57"}], "toc": ["◉", "Real images from the practical"], "labName": "The hip = The innominate bones"}, {"id": "p29", "head": "Real images · 2 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl58"}], "labName": "Right Hip bone"}, {"id": "p30", "head": "Real images · 3 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl59"}], "labName": "Hip & thigh · slide 4"}, {"id": "p31", "head": "Real images · 4 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl60"}], "labName": "Pubis"}, {"id": "p32", "head": "Real images · 5 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl61"}], "labName": "Ischium"}, {"id": "p33", "head": "Real images · 6 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl62"}], "labName": "Acetabulum"}, {"id": "p34", "head": "Real images · 7 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl64"}], "labName": "Upper end right femur"}, {"id": "p35", "head": "Real images · 8 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl65"}], "labName": "Hip & thigh · slide 10"}, {"id": "p36", "head": "Real images · 9 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl66"}], "labName": "Hip & thigh · slide 11"}, {"id": "p37", "head": "Real images · 10 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl68"}], "labName": "The patella"}, {"id": "p38", "head": "Real images · 11 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl69"}], "labName": "Hip & thigh · slide 14"}, {"id": "p39", "head": "Real images · 12 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl70"}], "labName": "Sciatic Foramina"}, {"id": "p40", "head": "Real images · 13 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl71"}], "labName": "Anterior muscles of the thigh"}, {"id": "p41", "head": "Real images · 14 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl72"}], "labName": "Medial muscles of the thigh"}, {"id": "p42", "head": "Real images · 15 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl73"}], "labName": "Hip & thigh · slide 18"}, {"id": "p43", "head": "Real images · 16 of 16", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl74"}], "labName": "Hip & thigh · slide 19"}, {"id": "p44", "head": "Test yourself", "kind": "text", "blocks": [{"t": "h", "no": "★", "title": "Test yourself"}, {"t": "p", "html": "Exam mode draws on this lecture's 21 Final-bank MCQs (and 5 checked extra-practice questions). Flashcards cover every pamphlet fact of the lecture, with spaced repetition."}, {"t": "actions"}, {"t": "progress"}, {"t": "note", "kind": "hy", "html": "Do the <b>top-priority<\/b> questions twice: they are the ones the department used this year.", "title": "Before the Final"}]}, {"id": "p45", "head": "End of Lecture 6", "kind": "text", "blocks": [{"t": "title", "kick": "End of Lecture 6", "title": "Next: Lecture 7 — Movement of the Leg", "sub": "This is the test chapter of the MSK Interactive Book. The other Final lectures follow the same pattern.", "facts": [["95", "pamphlet facts"], ["24", "labs"], ["35", "questions"]], "hook": "", "note": null}]}], "questions": {"N-ANA-L6-01": {"id": "N-ANA-L6-01", "stem": "While examining a cross-section of the thigh, a student traces the three intermuscular septa formed by the fascia lata and identifies the compartments they enclose. Which of the following correctly matches a compartment with its muscle group and nerve?", "top": false, "rep": "", "tag": "Final bank ANA Q93", "bank": true, "expl": "The fascia lata forms 3 intermuscular septa that divide the thigh into anterior (quadriceps femoris, femoral nerve), medial (adductor muscles, obturator nerve) and posterior (hamstring muscles, sciatic nerve) compartments: A-F, M-O, P-S.", "type": "mcq", "opts": ["Anterior — hamstring muscles — sciatic nerve", "Medial — adductor muscles — obturator nerve", "Posterior — quadriceps femoris — femoral nerve", "Medial — adductor muscles — femoral nerve", "Anterior — quadriceps femoris — obturator nerve"], "ans": 1}, "N-ANA-L6-05": {"id": "N-ANA-L6-05", "stem": "During a dissection of the groin, a student follows the greater saphenous vein through an oval gap in the fascia lata just below the inguinal ligament. Which structure covers this gap?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The saphenous opening is an oval gap in the fascia lata below the inguinal ligament, covered by the part of the superficial fascia called the cribriform fascia, and it transmits the greater saphenous vein. The iliotibial tract is formed by the strong lateral part of the fascia lata.", "type": "mcq", "opts": ["Iliotibial tract", "Cribriform fascia", "Femoral sheath", "Transversalis fascia", "Iliac fascia"], "ans": 1}, "Q0173": {"id": "Q0173", "stem": "The strongest hip joint ligament that prevents hyperextension is:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q76", "bank": true, "expl": "The iliofemoral ligament, on the anterior aspect of the capsule, is the largest and most important hip ligament and resists hyperextension and lateral rotation during standing. The pubofemoral lies medially and the ischiofemoral posteriorly, and the acetabular labrum is a fibrocartilage ring around the acetabular margin, not a capsular ligament.", "type": "mcq", "opts": ["Iliofemoral", "Ischiofemoral", "Acetabular labrum", "Pubofemoral"], "ans": 0}, "Y26-034": {"id": "Y26-034", "stem": "Answer the following questions about the hip joint:\n1. What is the type of the hip joint?\n2. Which ligament is the strongest ligament of the hip joint?\n3. Which nerve may be injured in posterior dislocation of the hip?\n4. Which structure deepens the acetabulum?", "top": true, "rep": "", "tag": "Final bank ANA W34", "bank": true, "expl": "The hip is a ball-and-socket synovial joint with a socket far deeper than the shoulder's, rimmed by the fibrocartilaginous labrum and completed by the transverse acetabular ligament. The iliofemoral ligament is its largest and most important ligament, and the sciatic nerve can be impinged in posterior dislocation.", "type": "written", "keyhtml": "1. Ball-and-socket synovial joint, between the head of the femur and the cartilage lining the horseshoe-shaped lunate surface of the acetabulum.\n2. The iliofemoral ligament (anterior): the largest and most important ligament of the hip joint; it resists hyperextension and lateral rotation during standing.\n3. The sciatic nerve: impingement of the sciatic nerve is a complication of posterior hip dislocation.\n4. The acetabular labrum: a stabilizing ring of fibrocartilage around the margin of the acetabulum (the transverse acetabular ligament bridges the acetabular notch to complete the socket)."}, "N-ANA-L6-03": {"id": "N-ANA-L6-03", "stem": "Mention the type of the hip joint and the structures that deepen and complete its socket. Enumerate the ligaments that strengthen its capsule, and state what the most important one resists.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from Part 02: the structure of the joint in 2.1 and the capsular ligaments with the A-M-P → I-P-I mnemonic in 2.2.", "type": "written", "keyhtml": "Type: ball-and-socket synovial joint between the head of the femur and the cartilage lining the horseshoe-shaped lunate surface of the acetabulum; the socket is far deeper than that of the shoulder joint.\nSocket:\n• Acetabular labrum: a stabilizing ring of fibrocartilage around the margin of the acetabulum\n• Transverse acetabular ligament: bridges the notch of the acetabulum to complete the socket\n• (Ligamentum teres runs from the transverse ligament to the fovea at the centre of the femoral head)\nCapsular ligaments (A-M-P → I-P-I):\n• Anteriorly: iliofemoral ligament\n• Medially: pubofemoral ligament\n• Posteriorly: ischiofemoral ligament\nThe iliofemoral ligament is the largest and most important; it resists hyperextension and lateral rotation at the hip joint during standing."}, "Q0174": {"id": "Q0174", "stem": "The main muscle(s) that flexes the hip joint is the:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q77", "bank": true, "expl": "Iliopsoas is the iliacus together with the psoas major, which flex the thigh together at the hip. Sartorius and rectus femoris also flex the thigh but act on the knee as well, while gluteus maximus and biceps femoris extend the thigh.", "type": "mcq", "opts": ["Sartorius", "Rectus femoris", "Iliopsoas", "Gluteus maximus", "Biceps femoris"], "ans": 2}, "Y26-020": {"id": "Y26-020", "stem": "A patient trying to cross their legs in a sitting position (flexing and laterally rotating the hip while flexing the knee) uses a prominent superficial muscle of the anterior thigh. What is this muscle?", "top": true, "rep": "", "tag": "Final bank ANA Q80", "bank": true, "expl": "Sartorius, a superficial anterior thigh muscle arising from the anterior-superior iliac spine, flexes and rotates the thigh laterally and flexes the leg — the movements described. Gracilis flexes the thigh and leg but adducts the thigh, and rectus femoris flexes the thigh but extends the leg.", "type": "mcq", "opts": ["Rectus femoris", "Gracilis", "Vastus lateralis", "Sartorius", "Pectineus"], "ans": 3}, "Q0099": {"id": "Q0099", "stem": "A 24-year-old woman presents to her physician with weakness in flexing the hip joint and extending the knee joint. Which muscle is most likely involved in this scenario?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q90", "bank": true, "expl": "Rectus femoris arises from the anterior-inferior iliac spine and inserts into the base of the patella and the tibial tuberosity, so it flexes the thigh and extends the leg. Vastus medialis only extends the leg, and sartorius flexes the thigh but flexes (not extends) the leg.", "type": "mcq", "opts": ["Sartorius", "Gracilis", "Rectus femoris", "Vastus medialis", "Semimembranosus"], "ans": 2}, "Y26-021": {"id": "Y26-021", "stem": "Which of the following muscles is NOT a part of the quadriceps femoris?", "top": true, "rep": "", "tag": "Final bank ANA Q81", "bank": true, "expl": "The quadriceps femoris is formed by rectus femoris, vastus medialis, vastus lateralis and vastus intermedius. Iliacus is another anterior thigh muscle (with sartorius and psoas major) that flexes the thigh, but it is not part of the quadriceps.", "type": "mcq", "opts": ["Rectus femoris", "Vastus medialis", "Vastus lateralis", "Vastus intermedius", "Iliacus"], "ans": 4}, "Q0098": {"id": "Q0098", "stem": "The obturator nerve and the sciatic (tibial portion) nerve of a 15-year-old boy are transected as a result of a motorcycle accident. This injury would result in complete paralysis of which of the following muscles?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q89", "bank": true, "expl": "Adductor magnus is supplied by both the obturator nerve and the sciatic nerve (tibial part), so cutting both nerves paralyses it completely. The short head of biceps femoris is supplied by the common peroneal division of the sciatic nerve, and obturator internus by the nerve to obturator internus despite its name.", "type": "mcq", "opts": ["Rectus femoris", "Biceps femoris, short head", "Obturator internus", "Adductor magnus", "Sartorius"], "ans": 3}, "Q0104": {"id": "Q0104", "stem": "A patient has weakness when flexing both her thigh and leg. Which of the following muscles is most likely injured?", "top": true, "rep": "asked 3 years", "tag": "Final bank ANA Q74", "bank": true, "expl": "Sartorius flexes and rotates the thigh laterally and flexes and rotates the leg medially, so it flexes both the thigh and the leg. Rectus femoris flexes the thigh but extends the leg, while semitendinosus and biceps femoris extend the thigh and flex the leg.", "type": "mcq", "opts": ["Rectus femoris", "Semitendinosus", "Biceps femoris", "Sartorius", "Adductor longus"], "ans": 3}, "Q0172": {"id": "Q0172", "stem": "Which muscle acts as both a flexor of the hip joint and a flexor of the knee joint, while also assisting in lateral rotation of the thigh?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q75", "bank": true, "expl": "Sartorius flexes and rotates the thigh laterally, and flexes and rotates the leg medially. Gracilis also flexes the thigh and the leg but adducts the thigh rather than rotating it laterally, and rectus femoris flexes the thigh but extends the leg.", "type": "mcq", "opts": ["Tensor fasciae latae", "Pectineus", "Rectus femoris", "Gracilis", "Sartorius"], "ans": 4}, "Y26-027": {"id": "Y26-027", "stem": "A patient sustains an injury to the tendon inserted into the head of the fibula. Which muscle is most likely affected?", "top": true, "rep": "", "tag": "Final bank ANA Q82", "bank": true, "expl": "Biceps femoris (long head from the ischial tuberosity, short head from the linea aspera) inserts into the head of the fibula. Semitendinosus inserts into the medial surface of the upper tibia and semimembranosus into the medial condyle of the tibia.", "type": "mcq", "opts": ["Semitendinosus", "Semimembranosus", "Biceps femoris", "Gracilis", "Sartorius"], "ans": 2}, "Q0115": {"id": "Q0115", "stem": "Muscles in the posterior thigh compartment are paralyzed because the sciatic nerve has been severed. Nevertheless, the patient can still produce some flexion of the leg at the knee due to the action of the:", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q92", "bank": true, "expl": "Sartorius flexes the leg and is supplied by the femoral nerve, so it still works after the sciatic nerve is cut. Semitendinosus and the short head of biceps femoris are supplied by the tibial and common peroneal divisions of the sciatic nerve, and rectus femoris extends the leg.", "type": "mcq", "opts": ["Sartorius", "Semitendinosus", "Rectus femoris", "Short head of biceps femoris", "Gastrocnemius"], "ans": 0}, "Q0175": {"id": "Q0175", "stem": "The patellar reflex appears to be markedly reduced in a 33-year-old diabetic female patient, due to deficient vascular supply of the nerves of her lower limb. The tendon of which of the following muscles is stretched during the patellar reflex?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q78", "bank": true, "expl": "The ligamentum patellae carries the insertion of the quadriceps femoris into the tibia, so tapping it stretches the quadriceps; its nerve is the femoral nerve, and femoral nerve injury may abolish the knee-jerk (patellar) reflex. Quadratus femoris is a small lateral rotator of the thigh in the gluteal region.", "type": "mcq", "opts": ["Quadriceps femoris", "Biceps femoris", "Pectineus", "Quadratus femoris", "Sartorius"], "ans": 0}, "Q0176": {"id": "Q0176", "stem": "A 34-year-old woman had a direct blow to the patella during a car collision. The woman is admitted to the emergency department and radiographic examination reveals patellofemoral syndrome. This type of syndrome is characterized by lateral dislocation of the patella. Which of the following muscles needs to be strengthened to prevent future dislocation of the patella?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q79", "bank": true, "expl": "Vastus medialis inserts into the medial side of the patella, so strengthening it pulls the patella medially and resists lateral dislocation. Vastus lateralis inserts into the lateral side of the patella and would pull it laterally, and the patellar ligament is a ligament, not a muscle.", "type": "mcq", "opts": ["Vastus lateralis", "Vastus medialis", "Patellar ligament", "Rectus femoris", "Vastus intermedius"], "ans": 1}, "N-ANA-L6-08": {"id": "N-ANA-L6-08", "stem": "On a prosected specimen, a student identifies a medial-compartment muscle that arises from the margin of the obturator foramen and the obturator membrane and inserts into the intertrochanteric fossa of the femur. What is the action of this muscle?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is obturator externus, a medial thigh muscle supplied by the obturator nerve that rotates the thigh laterally. Adductor longus and brevis adduct and flex the thigh, and adductor magnus also extends it.", "type": "mcq", "opts": ["Rotates the thigh laterally", "Rotates the thigh medially", "Adducts and flexes the thigh", "Adducts, flexes and extends the thigh", "Flexes the thigh and extends the leg"], "ans": 0}, "TP-082": {"id": "TP-082", "stem": "A football player presents with pain in the upper medial part of his leg after suddenly changing direction while running. Examination shows tenderness below the medial side of the knee. The doctor suspects involvement of the sartorius muscle.\na) What is its origin and insertion?\nb) What is its main action?\nc) Mention the names of the 2 muscles that share a common insertion with the sartorius muscle.", "top": true, "rep": "", "tag": "Final bank ANA W52", "bank": true, "expl": "Sartorius runs from the ASIS to the upper medial tibia and is supplied by the femoral nerve. It inserts with gracilis and semitendinosus on the medial tibia, where the pes anserine bursa lies, causing pain medially below the knee in athletes.", "type": "written", "keyhtml": "a) Origin: anterior-superior iliac spine (ASIS). Insertion: upper medial side of the tibia.\nb) Flexes the thigh and rotates it laterally; flexes the leg and rotates it medially.\nc) Gracilis and semitendinosus (sartorius, gracilis and semitendinosus = SGS; the pes anserine bursa lies between the tibia and their insertion)."}, "N-ANA-L6-10": {"id": "N-ANA-L6-10", "stem": "Compare semitendinosus and biceps femoris as regards origin, insertion, nerve supply and action.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Both rows are taken from the posterior-muscles table in 4.3; biceps femoris is the only hamstring that rotates the leg laterally.", "type": "written", "keyhtml": "Semitendinosus:\n• Origin: ischial tuberosity\n• Insertion: medial surface of the upper part of the tibia\n• Nerve: tibial portion of the sciatic nerve\n• Action: extends the thigh, flexes the leg and rotates it medially\nBiceps femoris:\n• Origin: long head from the ischial tuberosity; short head from the linea aspera and upper supracondylar line\n• Insertion: head of the fibula\n• Nerve: tibial (long head) and common peroneal (short head) divisions of the sciatic nerve\n• Action: extends the thigh, flexes the leg and rotates it laterally"}, "Y26-025": {"id": "Y26-025", "stem": "A patient has difficulty rising from a chair and climbing stairs after a pelvic injury. Examination reveals marked weakness of hip extension. Which muscle is most likely affected?", "top": true, "rep": "", "tag": "Final bank ANA Q83", "bank": true, "expl": "Gluteus maximus, supplied by the inferior gluteal nerve, extends the thigh. Gluteus medius and minimus, supplied by the superior gluteal nerve, abduct and medially rotate the thigh instead.", "type": "mcq", "opts": ["Gluteus medius", "Gluteus minimus", "Gluteus maximus", "Tensor fasciae latae", "Piriformis"], "ans": 2}, "Y26-026": {"id": "Y26-026", "stem": "During examination, a patient has weakness of lateral rotation of the extended thigh. Which muscle is described?", "top": true, "rep": "", "tag": "Final bank ANA Q84", "bank": true, "expl": "Piriformis, one of the smaller gluteal muscles covered by gluteus maximus, rotates the thigh laterally. Gluteus medius, gluteus minimus and tensor fasciae latae all rotate the thigh medially, and iliacus flexes the thigh.", "type": "mcq", "opts": ["Gluteus minimus", "Piriformis", "Gluteus medius", "Tensor fasciae latae", "Iliacus"], "ans": 1}, "Q0096": {"id": "Q0096", "stem": "A 24-year-old woman complains of weakness when she extends her thigh and rotates it laterally. Which of the following muscles is paralyzed?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q88", "bank": true, "expl": "Gluteus maximus (inferior gluteal nerve) extends the thigh and rotates it laterally. Semitendinosus also extends the thigh but rotates the leg medially, while obturator externus and sartorius rotate the thigh laterally without extending it.", "type": "mcq", "opts": ["Obturator externus", "Sartorius", "Tensor fasciae latae", "Gluteus maximus", "Semitendinosus"], "ans": 3}, "N-ANA-L6-07": {"id": "N-ANA-L6-07", "stem": "A 35-year-old man sustains a deep injury in the gluteal region that damages the nerve to quadratus femoris. Besides quadratus femoris, which of the following muscles will be weakened?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The nerve to quadratus femoris supplies quadratus femoris and the inferior gemellus, whereas the superior gemellus is supplied by the nerve to obturator internus. Piriformis is supplied by the sacral nerves S1–S2.", "type": "mcq", "opts": ["Superior gemellus", "Inferior gemellus", "Piriformis", "Obturator internus", "Gluteus minimus"], "ans": 1}, "N-ANA-L6-04": {"id": "N-ANA-L6-04", "stem": "Enumerate the boundaries of the gluteal region. Mention the nerve supply and the actions of gluteus maximus, gluteus medius and gluteus minimus.", "top": false, "rep": "", "tag": "Final bank ANA W36", "bank": true, "expl": "The boundaries are from 5.1 and the nerves and actions from the tables in 5.2 and 5.3 (gluteus maximus = inferior gluteal; medius and minimus = superior gluteal).", "type": "written", "keyhtml": "Boundaries:\n• Superiorly: the iliac crest\n• Inferiorly: the gluteal fold\n• Medially: the natal cleft\n• Laterally: a line joining the ASIS and the greater trochanter\nGlutei (mainly extend and abduct the thigh; supplied by the gluteal nerves):\n• Gluteus maximus: inferior gluteal nerve; extends the thigh and rotates it laterally\n• Gluteus medius: superior gluteal nerve; abducts and medially rotates the thigh and stabilizes the pelvis\n• Gluteus minimus: superior gluteal nerve; abducts and medially rotates the thigh"}, "N-ANA-L6-06": {"id": "N-ANA-L6-06", "stem": "During a dissection of the femoral triangle, a student opens the funnel-shaped femoral sheath just below the inguinal ligament. Which of the following structures of the triangle lies outside this sheath?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The femoral sheath surrounds the femoral artery and vein, and its most medial compartment, the femoral canal, contains the lymphatic vessels; the femoral nerve lies in the femoral triangle but outside the sheath. From lateral to medial: nerve (outside), artery, vein, canal.", "type": "mcq", "opts": ["Femoral artery", "Femoral vein", "Femoral nerve", "Lymphatic vessels of the femoral canal"], "ans": 2}, "Y26-019": {"id": "Y26-019", "stem": "Which of the following structures forms the medial boundary of the femoral triangle?", "top": true, "rep": "", "tag": "Final bank ANA Q73", "bank": true, "expl": "The femoral triangle is bounded above by the inguinal ligament, laterally by sartorius and medially by adductor longus. Sartorius is the lateral boundary, and pectineus lies in the floor, not at the medial border.", "type": "mcq", "opts": ["Inguinal ligament", "Rectus femoris muscle", "Pectineus muscle (floor)", "Sartorius muscle", "Adductor longus muscle"], "ans": 4}, "Y26-022": {"id": "Y26-022", "stem": "Which of the following muscles forms part of the floor of the femoral triangle?", "top": true, "rep": "", "tag": "Final bank ANA Q85", "bank": true, "expl": "The floor of the femoral triangle, from medial to lateral, is adductor longus, pectineus, psoas and iliacus (A-P-P-I), so psoas and iliacus (iliopsoas) form its lateral part. Gracilis is a medial thigh muscle but is not part of the floor.", "type": "mcq", "opts": ["Biceps femoris", "Gluteus maximus", "Iliopsoas", "Semitendinosus", "Gracilis"], "ans": 2}, "Y26-023": {"id": "Y26-023", "stem": "A 26-year-old man sustains a deep wound in the femoral triangle. On examination, he has marked weakness of knee extension. Which nerve is most likely injured?", "top": true, "rep": "", "tag": "Final bank ANA Q86", "bank": true, "expl": "The femoral nerve lies in the femoral triangle (outside the femoral sheath) and supplies the quadriceps femoris, which extends the leg. The obturator nerve supplies the adductor muscles of the medial compartment, and the sciatic nerve the hamstrings.", "type": "mcq", "opts": ["Obturator nerve", "Femoral nerve", "Sciatic nerve", "Common fibular nerve", "Superior gluteal nerve"], "ans": 1}, "Y26-024": {"id": "Y26-024", "stem": "During surgery in the femoral triangle, the surgeon identifies the femoral artery and needs to locate the femoral vein. In the femoral triangle, the femoral vein normally lies:", "top": true, "rep": "", "tag": "Final bank ANA Q87", "bank": true, "expl": "From lateral to medial the order is femoral nerve (outside the sheath), femoral artery, femoral vein, then the femoral canal. The femoral canal is the most medial compartment of the sheath and contains the lymphatic vessels, not the vein.", "type": "mcq", "opts": ["Lateral to the femoral artery", "Medial to the femoral artery", "Posterior to the femoral nerve", "Within the femoral canal", "Superficial to the inguinal ligament"], "ans": 1}, "Q0100": {"id": "Q0100", "stem": "A 49-year-old construction worker is admitted to the emergency department with a painful lump on the proximal medial aspect of his thigh. Radiographic and physical examinations reveal that the patient has a herniation of abdominal viscera beneath the inguinal ligament into the thigh. Through which of the following openings will a hernia of this type initially pass to extend from the abdomen into the thigh?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q91", "bank": true, "expl": "The femoral ring is the superior opening of the femoral canal, the most medial compartment of the femoral sheath; it is a weak point in the lower abdomen and the site of femoral hernias. The saphenous opening is an oval gap in the fascia lata, covered by cribriform fascia, that transmits the greater saphenous vein.", "type": "mcq", "opts": ["Femoral ring", "Superficial inguinal ring", "Deep inguinal ring", "Fossa ovalis (saphenous opening)", "Obturator canal"], "ans": 0}, "Q0040": {"id": "Q0040", "stem": "Mention the muscles that form the floor of the femoral triangle.", "top": false, "rep": "", "tag": "Final bank ANA W35", "bank": true, "expl": "The floor of the femoral triangle, from medial to lateral, is formed by adductor longus, pectineus, psoas and iliacus (A-P-P-I). Its roof is the deep fascia containing the saphenous opening.", "type": "written", "keyhtml": "From medial to lateral:\n• Adductor longus\n• Pectineus\n• Psoas (major)\n• Iliacus\n(Mnemonic A-P-P-I)"}, "TP-083": {"id": "TP-083", "stem": "A doctor needs to insert a catheter into the femoral artery to obtain arterial blood for blood gas analysis.\na) What structures are located medial and lateral to the femoral artery within the femoral triangle?\nb) Mention two muscles present in the floor of the femoral triangle.", "top": true, "rep": "", "tag": "Final bank ANA W53", "bank": true, "expl": "Lateral to medial in the femoral triangle: femoral nerve (outside the sheath), femoral artery, femoral vein, femoral canal. The floor is formed, medial to lateral, by adductor longus, pectineus, psoas and iliacus.", "type": "written", "keyhtml": "a) Medial: the femoral vein (and, most medially, the femoral canal containing lymphatics). Lateral: the femoral nerve (outside the femoral sheath).\nb) Any two of: adductor longus, pectineus, psoas, iliacus (floor from medial to lateral)."}, "N-ANA-L6-09": {"id": "N-ANA-L6-09", "stem": "A 45-year-old woman presents with a painful lump in the upper medial thigh just below the inguinal ligament, and a femoral hernia is diagnosed.\n(a) Through which opening does this hernia pass, and why does it occur there?\n(b) Describe the femoral sheath: its shape, continuity and contents.\n(c) Arrange the femoral nerve, artery, vein and canal from lateral to medial, stating which lies outside the sheath.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All three answers come from 6.2: the femoral sheath table, the clinical note on the femoral ring and the lateral → medial arrangement.", "type": "written", "keyhtml": "(a) The femoral ring, the superior opening of the femoral canal; it is potentially a weak point in the lower abdomen and is the site for femoral hernias.\n(b) A funnel-shaped sleeve of fascia surrounding the femoral artery and vein, continuous superiorly with the transversalis fascia and iliac fascia of the abdomen. Its most medial compartment, the femoral canal, is conical and contains the lymphatic vessels.\n(c) Lateral → medial: femoral nerve (outside the sheath) → femoral artery → femoral vein → femoral canal (lymphatics)."}, "TP-125": {"id": "TP-125", "stem": "Which muscles of the lower limb have a double nerve supply? Mention the nerves supplying each.", "top": true, "rep": "", "tag": "Final bank ANA W54", "bank": true, "expl": "Adductor magnus has two nerves (obturator + sciatic) and also extends the thigh. Biceps femoris is supplied by the tibial (long head) and common peroneal (short head) divisions of the sciatic nerve; the short head is the only hamstring from the common fibular division.", "type": "written", "keyhtml": "1. Adductor magnus — obturator nerve + sciatic nerve (tibial part):\n• Anterior portion → obturator nerve (posterior branch)\n• Posterior (ischial / hamstring) portion → tibial division of the sciatic nerve\n2. Biceps femoris — two divisions of the sciatic nerve:\n• Long head → tibial division\n• Short head → common peroneal (fibular) division"}, "N-ANA-L6-02": {"id": "N-ANA-L6-02", "stem": "A 40-year-old man has a complete injury of the femoral nerve, yet he can still weakly flex his hip. Which of the following hip flexors is supplied by the lumbar nerves L1–4 rather than by the femoral nerve?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Psoas major is supplied by the lumbar nerves L1–4, whereas iliacus, sartorius and rectus femoris are supplied by the femoral nerve. Tensor fasciae latae also flexes the thigh but is supplied by the superior gluteal nerve.", "type": "mcq", "opts": ["Iliacus", "Sartorius", "Psoas major", "Rectus femoris", "Tensor fasciae latae"], "ans": 2}}, "labs": {"compart": {"type": "map", "title": "The three compartments of the thigh", "ref": "Part 01 · 1.2 and Part 07 · 7.1", "intro": "A schematic cross-section of the thigh. The fascia lata's three intermuscular septa (dashed) divide it into three compartments. Tap one, or let the lab test you.", "caption": "SCHEMATIC CROSS-SECTION · NOT TO SCALE", "regions": [{"id": "ant", "name": "Anterior compartment", "short": "ANTERIOR", "a1": 192, "a2": 22, "color": "#e9a99f", "html": "Quadriceps femoris (rectus femoris, vastus medialis, lateralis, intermedius) · sartorius · iliacus · psoas major.<br><b>Nerve: femoral<\/b> (psoas major: lumbar nerves L1–4)."}, {"id": "pos", "name": "Posterior compartment", "short": "POSTERIOR", "a1": 22, "a2": 120, "color": "#a9c3e6", "html": "Hamstrings: semitendinosus · semimembranosus · biceps femoris.<br><b>Nerve: sciatic<\/b> (biceps short head: its common peroneal part)."}, {"id": "med", "name": "Medial compartment", "short": "MEDIAL", "a1": 120, "a2": 192, "color": "#b9dcb4", "html": "Pectineus · adductor longus, brevis & magnus · gracilis · obturator externus.<br><b>Nerve: obturator<\/b> (adductor magnus also sciatic, tibial part)."}], "tests": [{"q": "Which compartment is supplied by the obturator nerve?", "a": "med"}, {"q": "Which compartment holds the quadriceps femoris?", "a": "ant"}, {"q": "Which compartment holds the hamstrings?", "a": "pos"}, {"q": "Where is obturator externus?", "a": "med"}, {"q": "Which compartment is supplied by the femoral nerve?", "a": "ant"}, {"q": "Which compartment is supplied by the sciatic nerve?", "a": "pos"}, {"q": "Where is sartorius?", "a": "ant"}, {"q": "Where is gracilis?", "a": "med"}], "id": "compart"}, "graph": {"type": "graph", "title": "Nerve-injury simulator", "ref": "Parts 03, 04, 05 and 07", "intro": "<b>Explore links<\/b>: tap a nerve, a muscle or a movement to light up everything connected to it. <b>Cut a nerve<\/b>: see which muscles are paralysed (red) or partly working (amber), and which movements are lost or only weakened.", "nerves": [{"id": "fem", "name": "Femoral", "note": "Anterior compartment: iliacus, sartorius, rectus femoris and the three vasti."}, {"id": "obt", "name": "Obturator", "note": "Medial compartment: adductors, gracilis, obturator externus."}, {"id": "sct", "name": "Sciatic — tibial part", "note": "Semitendinosus, semimembranosus, biceps femoris (long head), adductor magnus."}, {"id": "scp", "name": "Sciatic — common peroneal part", "note": "Biceps femoris (short head)."}, {"id": "sgl", "name": "Superior gluteal", "note": "Gluteus medius, gluteus minimus, tensor fasciae latae."}, {"id": "igl", "name": "Inferior gluteal", "note": "Gluteus maximus."}, {"id": "noi", "name": "Nerve to obturator internus", "note": "Obturator internus and the superior gemellus (L5, S1)."}, {"id": "nqf", "name": "Nerve to quadratus femoris", "note": "Quadratus femoris and the inferior gemellus (L5, S1)."}, {"id": "l14", "name": "Lumbar nerves L1–4", "note": "Psoas major — not the femoral nerve."}, {"id": "s12", "name": "Ventral rami S1–S2", "note": "Piriformis."}], "moves": [{"id": "hflex", "name": "Hip flexion"}, {"id": "hext", "name": "Hip extension"}, {"id": "habd", "name": "Hip abduction"}, {"id": "hadd", "name": "Hip adduction"}, {"id": "hmr", "name": "Medial rotation of thigh"}, {"id": "hlr", "name": "Lateral rotation of thigh"}, {"id": "kext", "name": "Leg extension (knee)"}, {"id": "kflex", "name": "Leg flexion (knee)"}, {"id": "lmr", "name": "Medial rotation of leg"}, {"id": "llr", "name": "Lateral rotation of leg"}], "muscles": [{"id": "psoas", "name": "Psoas major", "nerves": ["l14"], "moves": ["hflex"], "note": "Flexes the thigh with iliacus; lumbar nerves L1–4."}, {"id": "iliacus", "name": "Iliacus", "nerves": ["fem"], "moves": ["hflex"], "note": "Iliac fossa & ala of sacrum → lesser trochanter."}, {"id": "pect", "name": "Pectineus", "nerves": [], "moves": ["hflex", "hadd"], "note": "Adducts & flexes the thigh. Nerve: the pamphlet gives two versions, so it is left out of the injury model."}, {"id": "sart", "name": "Sartorius", "nerves": ["fem"], "moves": ["hflex", "hlr", "kflex", "lmr"], "note": "Thigh: flexes & rotates laterally. Leg: flexes & rotates medially."}, {"id": "rf", "name": "Rectus femoris", "nerves": ["fem"], "moves": ["hflex", "kext"], "note": "Flexes the thigh and extends the leg."}, {"id": "vm", "name": "Vastus medialis", "nerves": ["fem"], "moves": ["kext"], "note": "Inserts into the medial side of the patella."}, {"id": "vl", "name": "Vastus lateralis", "nerves": ["fem"], "moves": ["kext"], "note": "Inserts into the lateral side of the patella."}, {"id": "vi", "name": "Vastus intermedius", "nerves": ["fem"], "moves": ["kext"], "note": "Inserts into the upper border of the patella."}, {"id": "gmax", "name": "Gluteus maximus", "nerves": ["igl"], "moves": ["hext", "hlr"], "note": "Extends the thigh and rotates it laterally."}, {"id": "st", "name": "Semitendinosus", "nerves": ["sct"], "moves": ["hext", "kflex", "lmr"], "note": "Ischial tuberosity → medial surface of the upper tibia."}, {"id": "sm", "name": "Semimembranosus", "nerves": ["sct"], "moves": ["hext", "kflex", "lmr"], "note": "Ischial tuberosity → medial condyle of the tibia."}, {"id": "bf", "name": "Biceps femoris", "nerves": ["sct", "scp"], "moves": ["hext", "kflex", "llr"], "note": "Long head: tibial; short head: common peroneal. The only lateral rotator of the leg."}, {"id": "gmed", "name": "Gluteus medius", "nerves": ["sgl"], "moves": ["habd", "hmr"], "note": "Also stabilizes the pelvis."}, {"id": "gmin", "name": "Gluteus minimus", "nerves": ["sgl"], "moves": ["habd", "hmr"], "note": "Abducts & rotates the thigh medially."}, {"id": "tfl", "name": "Tensor fasciae latae", "nerves": ["sgl"], "moves": ["hflex", "habd", "hmr"], "note": "Flexes, abducts & rotates the thigh medially."}, {"id": "al", "name": "Adductor longus", "nerves": ["obt"], "moves": ["hadd", "hflex", "hmr"], "note": "Adducts & flexes the thigh; a medial rotator of the thigh."}, {"id": "ab", "name": "Adductor brevis", "nerves": ["obt"], "moves": ["hadd", "hflex"], "note": "Adducts & flexes the thigh."}, {"id": "am", "name": "Adductor magnus", "nerves": ["obt", "sct"], "moves": ["hadd", "hflex", "hext"], "note": "Two nerves: obturator + sciatic (tibial part). Also extends the thigh."}, {"id": "grac", "name": "Gracilis", "nerves": ["obt"], "moves": ["hadd", "hflex", "kflex", "lmr"], "note": "Adducts & flexes the thigh; flexes & rotates the leg medially."}, {"id": "oe", "name": "Obturator externus", "nerves": ["obt"], "moves": ["hlr"], "note": "A medial-compartment muscle that rotates the thigh laterally."}, {"id": "pir", "name": "Piriformis", "nerves": ["s12"], "moves": ["hlr"], "note": "Ventral rami of S1 & S2."}, {"id": "oi", "name": "Obturator internus", "nerves": ["noi"], "moves": ["hlr", "habd"], "note": "Abducts and rotates the thigh laterally; nerve to obturator internus."}, {"id": "gs", "name": "Gemellus superior", "nerves": ["noi"], "moves": ["hlr"], "note": "Nerve to obturator internus."}, {"id": "gi", "name": "Gemellus inferior", "nerves": ["nqf"], "moves": ["hlr"], "note": "Nerve to quadratus femoris."}, {"id": "qf", "name": "Quadratus femoris", "nerves": ["nqf"], "moves": ["hlr"], "note": "Ischial tuberosity → intertrochanteric crest."}], "cases": [{"name": "Femoral nerve cut", "cut": ["fem"]}, {"name": "Sciatic nerve cut", "cut": ["sct", "scp"]}, {"name": "Obturator + sciatic (tibial) cut", "cut": ["obt", "sct"]}, {"name": "Superior gluteal nerve cut", "cut": ["sgl"]}, {"name": "Inferior gluteal nerve cut", "cut": ["igl"]}], "footnote": "Model built from the pamphlet's muscle tables (Parts 03–05 and 07). Pectineus (dashed) has no nerve in the model.", "id": "graph"}, "sortcomp": {"type": "sort", "title": "Put each muscle in its compartment", "ref": "Part 04 and Part 07 · 7.1", "intro": "Tap a muscle, then tap its compartment.", "bins": [{"id": "a", "name": "Anterior", "sub": "femoral nerve"}, {"id": "m", "name": "Medial",
