eg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl83": {"id": "sl83", "type": "slide", "title": "Leg, foot & vertebral column · slide 4", "img": "prac/s083.jpg", "labels": [{"t": "Right foot superior view", "x": 88.6, "y": 2.0, "w": 9.18, "h": 6.51, "id": "l0"}, {"t": "5 medial, intermediate and lateral", "x": 49.34, "y": 29.65, "w": 24.47, "h": 7.98, "id": "l1"}, {"t": "The talus bone", "x": 7.26, "y": 56.23, "w": 15.28, "h": 4.44, "id": "l2"}, {"t": "Neck", "x": 52.56, "y": 60.52, "w": 3.79, "h": 3.33, "id": "l3"}, {"t": "Trochlea", "x": 55.42, "y": 74.21, "w": 6.45, "h": 3.33, "id": "l4"}, {"t": "Medial tubercle", "x": 42.52, "y": 93.19, "w": 10.65, "h": 2.96, "id": "l5"}, {"t": "Lateral tubercle", "x": 57.36, "y": 93.84, "w": 10.56, "h": 2.96, "id": "l6"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl85": {"id": "sl85", "type": "slide", "title": "Right knee joint", "img": "prac/s085.jpg", "labels": [{"t": "Anterior cruciate ligament", "x": 21.18, "y": 27.61, "w": 12.52, "h": 6.6, "id": "l0"}, {"t": "Posterior cruciate ligament", "x": 65.34, "y": 26.03, "w": 13.29, "h": 6.61, "id": "l1"}, {"t": "Fibular collateral ligament", "x": 23.04, "y": 40.71, "w": 12.51, "h": 6.6, "id": "l2"}, {"t": "Lateral meniscus", "x": 22.47, "y": 52.97, "w": 13.21, "h": 3.26, "id": "l3"}, {"t": "Ligamentum patellae", "x": 23.96, "y": 62.79, "w": 9.29, "h": 6.6, "id": "l4"}, {"t": "Tibial collateral ligament", "x": 66.56, "y": 50.74, "w": 11.37, "h": 6.6, "id": "l5"}, {"t": "Medial meniscus", "x": 63.52, "y": 65.39, "w": 12.5, "h": 3.26, "id": "l6"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "ANA-L7-001", "text": "The leg is divided into 3 compartments by the {{c1::anterior & posterior intermuscular septa}} and the {{c2::interosseous membrane}}", "extra": "", "sec": "Part 01 · 1.1 The three compartments"}, {"id": "ANA-L7-002", "text": "Leg compartments — muscles: anterior = {{c1::extensor group}} · lateral = {{c2::fibular group}} · posterior = {{c3::flexor group}}", "extra": "", "sec": "Part 01 · 1.1 The three compartments"}, {"id": "ANA-L7-003", "text": "Leg compartments — nerve: anterior = {{c1::deep peroneal (fibular)}} · lateral = {{c2::superficial peroneal (fibular)}} · posterior = {{c3::tibial}}", "extra": "Front → side → back = D-S-T.", "sec": "Part 01 · 1.1 The three compartments"}, {"id": "ANA-L7-004", "text": "Popliteal fossa: a {{c1::diamond}}-shaped intermuscular space behind the knee", "extra": "", "sec": "Part 02 · 2.1 Popliteal fossa — boundaries"}, {"id": "ANA-L7-005", "text": "Popliteal fossa — superior boundaries: laterally {{c1::biceps femoris}}; medially {{c2::semitendinosus & semimembranosus}}", "extra": "", "sec": "Part 02 · 2.1 Popliteal fossa — boundaries"}, {"id": "ANA-L7-006", "text": "Popliteal fossa — inferior boundaries: the {{c1::medial & lateral heads of gastrocnemius}}", "extra": "Figure: plantaris lies with the lateral head.", "sec": "Part 02 · 2.1 Popliteal fossa — boundaries"}, {"id": "ANA-L7-007", "text": "Popliteal fossa — roof: {{c1::deep fascia}}; floor: posterior surface of lower femur · {{c2::oblique popliteal ligament}} · posterior surface of tibia · {{c3::popliteus}}", "extra": "", "sec": "Part 02 · 2.1 Popliteal fossa — boundaries"}, {"id": "ANA-L7-008", "text": "Popliteal fossa contents: {{c1::popliteal artery}} · {{c2::popliteal vein}} · {{c3::tibial nerve}} · {{c4::common peroneal nerve}} + popliteal fat & lymph nodes", "extra": "", "sec": "Part 02 · 2.2 Popliteal fossa — contents"}, {"id": "ANA-L7-009", "text": "The popliteal artery is the continuation of the {{c1::femoral artery}}", "extra": "", "sec": "Part 02 · 2.2 Popliteal fossa — contents"}, {"id": "ANA-L7-010", "text": "Popliteal fossa, superficial → deep: {{c1::tibial nerve}} → {{c2::common fibular nerve}} (laterally) → {{c3::popliteal vein}} → {{c4::popliteal artery}} (deepest)", "extra": "N-V-A: Nerve → Vein → Artery.", "sec": "Part 02 · 2.2 Popliteal fossa — contents"}, {"id": "ANA-L7-011", "text": "Knee joint type: {{c1::modified hinge synovial}} joint", "extra": "", "sec": "Part 03 · 3.1 Structure of the knee joint"}, {"id": "ANA-L7-012", "text": "Knee joint is formed by the medial & lateral {{c1::femoral condyles}}, medial & lateral {{c2::tibial condyles}} and the {{c3::patella}}; the {{c4::fibula}} plays no part", "extra": "", "sec": "Part 03 · 3.1 Structure of the knee joint"}, {"id": "ANA-L7-013", "text": "The femoral and tibial articular surfaces of the knee are partially separated by two crescent-shaped {{c1::fibrocartilaginous menisci}}", "extra": "", "sec": "Part 03 · 3.1 Structure of the knee joint"}, {"id": "ANA-L7-014", "text": "Knee capsule: attached {{c1::posteriorly and laterally}} to the femur and tibia", "extra": "Anteriorly it is replaced by other structures.", "sec": "Part 03 · 3.1 Structure of the knee joint"}, {"id": "ANA-L7-015", "text": "Anteriorly the knee capsule is replaced, from above down, by: {{c1::quadriceps tendon}} → {{c2::patella & patellar retinacula}} → {{c3::ligamentum patellae}}", "extra": "", "sec": "Part 03 · 3.1 Structure of the knee joint"}, {"id": "ANA-L7-016", "text": "Patellar retinacula = fascial expansions from the {{c1::vasti medialis & lateralis}}", "extra": "", "sec": "Part 03 · 3.1 Structure of the knee joint"}, {"id": "ANA-L7-017", "text": "Tibial (medial) collateral ligament: {{c1::medial epicondyle of femur}} → {{c2::medial condyle of tibia}}", "extra": "", "sec": "Part 03 · 3.2 Collateral ligaments"}, {"id": "ANA-L7-018", "text": "Fibular (lateral) collateral ligament: {{c1::lateral condyle of femur}} → {{c2::styloid process of fibula}}", "extra": "", "sec": "Part 03 · 3.2 Collateral ligaments"}, {"id": "ANA-L7-019", "text": "Tibial collateral prevents {{c1::lateral displacement (abduction)}} of the tibia under the femur; fibular collateral prevents {{c2::medial displacement (adduction)}}", "extra": "", "sec": "Part 03 · 3.2 Collateral ligaments"}, {"id": "ANA-L7-020", "text": "The collateral ligaments of the knee are tense in knee {{c1::extension}}", "extra": "Same as the ACL; the PCL is tense in flexion.", "sec": "Part 03 · 3.2 Collateral ligaments"}, {"id": "ANA-L7-021", "text": "The {{c1::medial meniscus}} is firmly attached to the tibial collateral ligament; the lateral meniscus is {{c2::not attached}} to the fibular collateral ligament", "extra": "So a torn tibial collateral usually tears the medial meniscus too.", "sec": "Part 03 · 3.2 Collateral ligaments"}, {"id": "ANA-L7-022", "text": "The cruciate ligaments maintain the {{c1::anteroposterior}} stability of the knee; they cross each other like the letter {{c2::X}}", "extra": "", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-023", "text": "ACL: from the {{c1::anterior}} aspect of the tibia, runs superiorly, {{c2::posteriorly}} and laterally to the {{c3::lateral condyle}} of the femur", "extra": "LAMP: Lateral condyle — ACL · Medial condyle — PCL.", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-024", "text": "PCL: from the {{c1::posterior}} aspect of the tibia, runs superiorly, {{c2::anteriorly}} and medially to the {{c3::medial condyle}} of the femur", "extra": "LAMP: Lateral condyle — ACL · Medial condyle — PCL.", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-025", "text": "ACL prevents {{c1::anterior}} displacement of the tibia under the femur; PCL prevents {{c2::posterior}} displacement", "extra": "", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-026", "text": "Ligament that prevents backward dislocation of the femur at the knee: {{c1::anterior cruciate ligament}}", "extra": "SGD self-assessment key: femur backward on the tibia = tibia forward under the femur.", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-027", "text": "Greatest tension: ACL — knee {{c1::extended}} (resists {{c2::hyperextension}}); PCL — knee {{c3::flexed}}", "extra": "", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-028", "text": "The weaker cruciate ligament: {{c1::ACL}}", "extra": "", "sec": "Part 03 · 3.3 Anterior and posterior cruciate ligaments"}, {"id": "ANA-L7-029", "text": "Posterior (oblique popliteal) ligament of the knee resists {{c1::torsional stresses}}", "extra": "", "sec": "Part 03 · 3.4 Posterior (oblique popliteal) ligament"}, {"id": "ANA-L7-030", "text": "Oblique popliteal ligament: an oblique band on the posterior capsule, attached to the {{c1::medial condyle of the tibia}} (continuous with the {{c2::semimembranosus tendon}}) and to the {{c3::lateral condyle of the femur}}", "extra": "", "sec": "Part 03 · 3.4 Posterior (oblique popliteal) ligament"}, {"id": "ANA-L7-031", "text": "Menisci: intracapsular wedges of {{c1::fibrocartilage}} between the articulating condyles", "extra": "", "sec": "Part 03 · 3.5 Medial and lateral menisci"}, {"id": "ANA-L7-032", "text": "Functions of the menisci: {{c1::make the articulating surfaces more fitting}} · {{c2::shock absorbers}}", "extra": "", "sec": "Part 03 · 3.5 Medial and lateral menisci"}, {"id": "ANA-L7-033", "text": "Meniscus shape: medial — {{c1::C-shaped}}; lateral — {{c2::circular}}", "extra": "", "sec": "Part 03 · 3.5 Medial and lateral menisci"}, {"id": "ANA-L7-034", "text": "Meniscus injured more frequently: the {{c1::medial}} — firmly attached to the tibial collateral ligament, so {{c2::less mobile}}", "extra": "The lateral meniscus is free of the fibular collateral → more mobile.", "sec": "Part 03 · 3.5 Medial and lateral menisci"}, {"id": "ANA-L7-035", "text": "Terrible (unhappy) triad — the 3 most commonly injured knee structures: {{c1::tibial collateral ligament}} · {{c2::medial meniscus}} · {{c3::ACL}}", "extra": "A-M-M: ACL · Medial collateral · Medial meniscus. The PCL is not part of it.", "sec": "Part 04 · 4.1 The terrible (unhappy) triad"}, {"id": "ANA-L7-036", "text": "Mechanism of the terrible triad: a blow to the {{c1::lateral}} aspect of the knee with the {{c2::foot on the ground}}", "extra": "", "sec": "Part 04 · 4.1 The terrible (unhappy) triad"}, {"id": "ANA-L7-037", "text": "Medial meniscus tear → pain when the leg is {{c1::medially rotated}} at the knee", "extra": "", "sec": "Part 04 · 4.1 The terrible (unhappy) triad"}, {"id": "ANA-L7-038", "text": "Anterior drawer sign (tests the ACL): the tibia is easily pulled {{c1::forward}} on the flexed knee → torn {{c2::ACL}}", "extra": "", "sec": "Part 04 · 4.2 Drawer signs"}, {"id": "ANA-L7-039", "text": "Posterior drawer sign: the tibia is easily pulled {{c1::posteriorly}} → torn {{c2::PCL}}", "extra": "", "sec": "Part 04 · 4.2 Drawer signs"}, {"id": "ANA-L7-040", "text": "Knee bursae shown in the bursitis figure: {{c1::suprapatellar}} · {{c2::prepatellar}} · {{c3::infrapatellar}}", "extra": "", "sec": "Part 04 · 4.3 Bursitis"}, {"id": "ANA-L7-041", "text": "Pes anserine bursa: between the tibia and the insertion of {{c1::sartorius}}, {{c2::gracilis}} & {{c3::semitendinosus}}", "extra": "SGS.", "sec": "Part 04 · 4.4 Pes anserine bursitis"}, {"id": "ANA-L7-042", "text": "Pes anserine bursitis cause: {{c1::overuse or constant friction}} → common in {{c2::athletes}}", "extra": "", "sec": "Part 04 · 4.4 Pes anserine bursitis"}, {"id": "ANA-L7-043", "text": "Pes anserine bursitis symptoms: pain with {{c1::exercising & climbing stairs}}; pain {{c2::medially, 2–3 inches below the knee joint}}", "extra": "", "sec": "Part 04 · 4.4 Pes anserine bursitis"}, {"id": "ANA-L7-044", "text": "Knee flexors: {{c1::semimembranosus}} · {{c2::biceps femoris}} · {{c3::semitendinosus}} · {{c4::gastrocnemius}}", "extra": "", "sec": "Part 05 · 5.1 Muscles producing movements of the knee"}, {"id": "ANA-L7-045", "text": "Unable to extend the leg at the knee → paralysed {{c1::quadriceps femoris}}", "extra": "The only knee extensor listed.", "sec": "Part 05 · 5.1 Muscles producing movements of the knee"}, {"id": "ANA-L7-046", "text": "Medial rotation of the flexed leg: {{c1::popliteus}}, helped by {{c2::semimembranosus}} and the {{c3::SGS}} muscles", "extra": "SGS = sartorius · gracilis · semitendinosus.", "sec": "Part 05 · 5.1 Muscles producing movements of the knee"}, {"id": "ANA-L7-047", "text": "Lateral rotation of the flexed leg: {{c1::biceps femoris}}", "extra": "", "sec": "Part 05 · 5.1 Muscles producing movements of the knee"}, {"id": "ANA-L7-048", "text": "Knee locking: in full extension, some inevitable {{c1::passive rotation}} occurs because of the {{c2::shape of the articular surfaces}} of femur & tibia", "extra": "", "sec": "Part 05 · 5.2 Locking & unlocking — popliteus"}, {"id": "ANA-L7-049", "text": "Muscle that unlocks the knee (initiates flexion): {{c1::popliteus}} — it rotates the {{c2::femur laterally on the tibia}}", "extra": "", "sec": "Part 05 · 5.2 Locking & unlocking — popliteus"}, {"id": "ANA-L7-050", "text": "Popliteus has two rotations: the flexed leg — {{c1::medially}}; the femur on the tibia (unlocking) — {{c2::laterally}}", "extra": "Exam trap.", "sec": "Part 05 · 5.2 Locking & unlocking — popliteus"}, {"id": "ANA-L7-051", "text": "Superior tibiofibular joint: {{c1::plane synovial}}, between the {{c2::head of the fibula}} and the {{c3::lateral condyle of the tibia}}", "extra": "", "sec": "Part 06 · 6.1 Tibiofibular joints"}, {"id": "ANA-L7-052", "text": "Inferior tibiofibular joint: {{c1::fibrous (syndesmosis)}}, between the {{c2::lower end of the fibula}} and the {{c3::fibular notch of the tibia}}", "extra": "Superior = synovial; inferior = fibrous.", "sec": "Part 06 · 6.1 Tibiofibular joints"}, {"id": "ANA-L7-053", "text": "The firm linking of the distal tibia and fibula is essential to produce the {{c1::skeletal framework for articulation with the foot at the ankle joint}}", "extra": "", "sec": "Part 06 · 6.1 Tibiofibular joints"}, {"id": "ANA-L7-054", "text": "Ankle joint: {{c1::synovial hinge}} joint between the {{c2::talus}} and the {{c3::malleoli of the tibia & fibula}}", "extra": "", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-055", "text": "Ankle abduction & adduction are restricted because the {{c1::malleoli grip the sides of the talus}}", "extra": "", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-056", "text": "Medial (deltoid) ligament of the ankle: {{c1::triangular}}; parts: {{c2::tibionavicular}} · {{c3::tibiotalar}} · {{c4::tibiocalcaneal}}", "extra": "All its parts start with 'tibio'.", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-057", "text": "Deltoid ligament attachments: apex to the {{c1::medial malleolus}}; lower margin continuous to the {{c2::talus}}, {{c3::spring ligament}} and {{c4::navicular bone}}", "extra": "", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-058", "text": "Lateral ligament of the ankle — 3 separate bands: {{c1::anterior talofibular}} · {{c2::calcaneofibular}} · {{c3::posterior talofibular}}", "extra": "", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-059", "text": "Lateral ankle ligament bands radiate from the lateral malleolus to: anterior talofibular → {{c1::neck of talus}} · calcaneofibular → {{c2::lateral surface of calcaneus}} · posterior talofibular → {{c3::lateral tubercle of calcaneus}}", "extra": "", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-060", "text": "Ankle sprain most commonly damages the {{c1::lateral}} ligament — {{c2::weaker}} than the very strong medial (deltoid) ligament", "extra": "", "sec": "Part 06 · 6.2 The ankle joint"}, {"id": "ANA-L7-061", "text": "Ankle dorsiflexors: {{c1::tibialis anterior}} · {{c2::extensor digitorum longus}} · {{c3::extensor hallucis longus}} · {{c4::peroneus tertius}}", "extra": "", "sec": "Part 06 · 6.3 Movements of the ankle joint"}, {"id": "ANA-L7-062", "text": "Ankle plantar flexors: {{c1::gastrocnemius}} · {{c2::soleus}} · {{c3::plantaris}} · {{c4::tibialis posterior}} · {{c5::flexor digitorum longus}} · {{c6::flexor hallucis longus}}", "extra": "", "sec": "Part 06 · 6.3 Movements of the ankle joint"}, {"id": "ANA-L7-063", "text": "Tibialis anterior = {{c1::dorsiflexor::dorsiflexor or plantar flexor}}; tibialis posterior = {{c1::plantar flexor::dorsiflexor or plantar flexor}}", "extra": "", "sec": "Part 06 · 6.3 Movements of the ankle joint"}, {"id": "ANA-L7-064", "text": "Ankle range of movement: dorsiflexion {{c1::20–30°}}; plantar flexion {{c2::40–50°}}", "extra": "", "sec": "Part 06 · 6.3 Movements of the ankle joint"}], "pracs": [{"href": "prac-ana-4.html", "title": "Anatomy practical · Practical 4 – Leg, foot & vertebral column"}], "lib": "./", "prev": {"href": "ana-l6.html", "title": "Lecture 6 · Thigh"}, "next": {"href": "ana-l8.html", "title": "Lecture 8 · Movement of the Foot"}, "coverImg": "covers/Anatomy.jpg", "searchHint": "e.g. talus, posterior, hyperextension"};
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){
  const r = document.documentElement;
  if (S.set.theme === 'light' || S.set.theme === 'dark') r.dataset.theme = S.set.theme; else r.removeAttribute('data-theme');
  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);
  if (rs.getPropertyValue('--ph') !== vph) rs.setProperty('--ph', vph);
  book.classList.toggle('single', mode === 'single');
  // a new size only reflows the CSS; the pages are rebuilt only when the book switches between one and two pages,

  if (opened && (force || mode !== drawnMode)) draw();

});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;

function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){

  upd();

function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }

function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){

  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);

    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};
H.recall = b => {
  const st = S.labs[b.id] || {}, rv = st.r || {}; let n = 0, k = 0;
  const body = b.groups.map(g => `<div class="rcg">${esc(g.title)}</div>` + g.items.map(it => { const i = n++, on = !!rv[i]; if (on) k++;
    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');
  return `<div class="labh"><span class="lb">LAB</span><h3>${esc(b.title)}</h3></div>
    <p class="labi">Say the rest of each line out loud, then tap it to check. Tap again to cover it. <b>${k}/${n}</b> uncovered.</p>
    <div class="modes"><button class="mini" data-act="rcall" data-l="${b.id}" data-n="${n}">Uncover all</button><button class="mini" data-act="rcno" data-l="${b.id}">Cover all</button></div>${body}`;

H.end = () => {

    ${nx ? `<a href="${esc(nx.href)}"><span><small>${esc(nx.label || 'Next lecture')}</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>${esc(pv.label || 'Previous lecture')}</small>${esc(pv.title)}</span><span>←</span></a>` : ''}

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---

const DRAW = {};
LAB.diagram = L => {

const A = {};
document.addEventListener('click', e => {

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };

   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
