ed; entire sole touches floor when standing"], ["Normal in infants", "and toddlers; arch not yet developed"], ["Some never develop arches:", "normal variation, may or may not cause problems"], ["Some experience pain in", "heel or arch, worse with activity"]]}]}], "labName": "Recall · Arches & Clinical (2/2)"}, {"id": "p36", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0112"}]}, {"id": "p37", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-ANA-L8-16"}]}, {"id": "p38", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-ANA-L8-14"}]}, {"id": "p39", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-ANA-L8-06"}]}, {"id": "p40", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-ANA-L8-15"}]}, {"id": "p41", "head": "Part 07 · Muscles Compared", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Muscles Compared", "sub": "Movement → muscles → nerve · Nerve → muscles supplied · Insertions at a glance · Deep to the retinacula — side by side"}, {"t": "h", "no": "7.1", "title": "Movement → muscles → nerve"}, {"t": "list", "items": ["<b>Dorsiflexion:<\/b> TA, EHL, EDL, <mark>fibularis tertius<\/mark> (deep peroneal)", "<b>Plantar flexion:<\/b> <mark>fibularis longus<\/mark>, brevis (<mark>superficial peroneal<\/mark>); posterior muscles (<mark>tibial<\/mark>)", "<b>Inversion:<\/b> TA, EHL (deep peroneal); <mark>tibialis posterior<\/mark> (<mark>tibial<\/mark>)", "<b>Eversion:<\/b> EDL, <mark>fibularis tertius<\/mark> (deep peroneal); <mark>fibularis longus<\/mark>, brevis (<mark>superficial peroneal<\/mark>)"]}, {"t": "h", "no": "7.2", "title": "Nerve → muscles supplied"}, {"t": "list", "items": ["<b>Deep peroneal:<\/b> TA, EHL, EDL, fibularis tertius, extensor digitorum brevis", "<b>Superficial peroneal:<\/b> fibularis longus and brevis", "<b>Tibial:<\/b> gastrocnemius, soleus, plantaris, popliteus, FHL, FDL, tibialis posterior"]}], "toc": ["07", "Muscles Compared"]}, {"id": "p42", "head": "Part 07 · Muscles Compared", "kind": "text", "blocks": [{"t": "list", "items": ["<b>Medial plantar:<\/b> <mark>flexor hallucis brevis<\/mark>, <mark>flexor digitorum brevis<\/mark>"]}, {"t": "h", "no": "7.3", "title": "Insertions at a glance"}, {"t": "list", "items": ["<b>Base of 5th metatarsal:<\/b> <mark>fibularis tertius<\/mark> and brevis", "Base of 1st metatarsal, medial cuneiform: fibularis longus", "<b>Base distal phalanx big toe:<\/b> EHL and FHL", "<b>Calcaneus via tendo calcaneus:<\/b> gastrocnemius, soleus; posterior surface: plantaris", "<b>Tibialis posterior:<\/b> navicular tuberosity, sustentaculum tali, cuneiforms, cuboid, metatarsals 2–4"]}, {"t": "h", "no": "7.4", "title": "Deep to the retinacula — side by side"}, {"t": "list", "items": ["<b>Superior extensor:<\/b> TA, EHL, anterior tibial vessels, deep peroneal nerve, EDL, peroneus tertius", "<b>Flexor:<\/b> tibialis posterior, FDL, posterior tibial vessels, tibial nerve, FHL", "Order is medial → lateral in both"]}]}, {"id": "p43", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l8-6-0", "title": "Recall · Muscles Compared (1/2)", "groups": [{"title": "7.1 Movement → muscles → nerve", "items": [["Dorsiflexion:", "TA, EHL, EDL, fibularis tertius (deep peroneal)"], ["Plantar flexion:", "fibularis longus, brevis (superficial peroneal); posterior muscles (tibial)"], ["Inversion:", "TA, EHL (deep peroneal); tibialis posterior (tibial)"], ["Eversion:", "EDL, fibularis tertius (deep peroneal); fibularis longus, brevis (superficial peroneal)"]]}, {"title": "7.2 Nerve → muscles supplied", "items": [["Deep peroneal:", "TA, EHL, EDL, fibularis tertius, extensor digitorum brevis"], ["Superficial peroneal:", "fibularis longus and brevis"], ["Tibial:", "gastrocnemius, soleus, plantaris, popliteus, FHL, FDL, tibialis posterior"], ["Medial plantar:", "flexor hallucis brevis, flexor digitorum brevis"]]}]}], "labName": "Recall · Muscles Compared (1/2)"}, {"id": "p44", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l8-6-1", "title": "Recall · Muscles Compared (2/2)", "groups": [{"title": "7.3 Insertions at a glance", "items": [["Base of 5th metatarsal:", "fibularis tertius and brevis"], ["Base of 1st metatarsal, medial cuneiform:", "fibularis longus"], ["Base distal phalanx big toe:", "EHL and FHL"], ["Calcaneus via tendo calcaneus:", "gastrocnemius, soleus; posterior surface: plantaris"], ["Tibialis posterior:", "navicular tuberosity, sustentaculum tali, cuneiforms, cuboid, metatarsals 2–4"]]}, {"title": "7.4 Deep to the retinacula — side by side", "items": [["Superior extensor:", "TA, EHL, anterior tibial vessels, deep peroneal nerve, EDL, peroneus tertius"], ["Flexor:", "tibialis posterior, FDL, posterior tibial vessels, tibial nerve, FHL"], ["Order is medial →", "lateral in both"]]}]}], "labName": "Recall · Muscles Compared (2/2)"}, {"id": "p45", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["EHL inverts; EDL everts; both dorsiflex", "Spring ligament strengthens talocalcaneonavicular joint", "<b>Short toe flexors:<\/b> medial plantar nerve; EDB: deep peroneal", "<b>Pott fracture:<\/b> severe eversion → medial malleolus avulsion + fibula fracture", "<b>Muscles supporting arches:<\/b> tibialis anterior and posterior, peroneus longus"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["Tom Has Very Nice Dog (Poopy); Tom Does Very Nice Hats", "Evertors = fibulares; invertors = tibiales", "Sole layers 3 · 2+2 · 3 · 2+2", "<b>Transverse arch:<\/b> 3 C + C + B"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p46", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-l8-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["EHL inverts", "EDL everts; both dorsiflex"], ["Spring ligament", "strengthens talocalcaneonavicular joint"], ["Short toe flexors:", "medial plantar nerve; EDB: deep peroneal"], ["Pott fracture:", "severe eversion → medial malleolus avulsion + fibula fracture"], ["Muscles supporting arches:", "tibialis anterior and posterior, peroneus longus"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["Tom Has Very Nice", "Dog (Poopy); Tom Does Very Nice Hats"], ["Evertors =", "fibulares; invertors = tibiales"], ["Sole layers 3", "· 2+2 · 3 · 2+2"], ["Transverse arch:", "3 C + C + B"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p47", "head": "Real images · 1 of 5", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one; the muscle pictures also have <b>Movements<\/b> and <b>Cut a nerve<\/b>. Every slide of the session is in the practical book: <a href=\"prac-ana-4.html\">Anatomy practical · Practical 4 – Leg, foot &amp; vertebral column<\/a>."}, {"t": "lab", "lab": "sl84"}], "toc": ["◉", "Real images from the practical"], "labName": "Leg, foot & vertebral column · slide 5"}, {"id": "p48", "head": "Real images · 2 of 5", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl86"}], "labName": "Leg, foot & vertebral column · slide 7"}, {"id": "p49", "head": "Real images · 3 of 5", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl88"}], "labName": "Leg, foot & vertebral column · slide 9"}, {"id": "p50", "head": "Real images · 4 of 5", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl89"}], "labName": "Leg, foot & vertebral column · slide 10"}, {"id": "p51", "head": "Real images · 5 of 5", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl90"}], "labName": "Leg, foot & vertebral column · slide 11"}, {"id": "p52", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Plantaris inserts on posterior surface of calcaneus; gastrocnemius and soleus via tendo calcaneus"}, {"t": "note", "kind": "trap", "html": "Under both retinacula vessels are 3rd and nerve 4th (medial → lateral)"}, {"t": "note", "kind": "trap", "html": "Long toe flexors are tibial, short (brevis) are medial plantar"}, {"t": "note", "kind": "trap", "html": "Fibularis (peroneus) tertius everts but is anterior — deep peroneal, not superficial"}, {"t": "note", "kind": "trap", "html": "Extensor hallucis longus inverts but extensor digitorum longus everts"}, {"t": "note", "kind": "trap", "html": "Fibularis longus inserts on the first metatarsal; brevis and tertius on the fifth"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p53", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Pott fracture: the deltoid ligament does not tear"}, {"t": "note", "kind": "trap", "html": "The longitudinal arch is highest medially"}, {"t": "note", "kind": "cl", "html": "Pott fracture: severe eversion overstretches deltoid ligament → medial malleolus transverse avulsion + fibula fracture"}, {"t": "note", "kind": "cl", "html": "Flat feet: flattened medial arches; normal in infants/toddlers; may cause heel or arch pain worse with activity"}]}, {"id": "p54", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0056": {"id": "Q0056", "stem": "One of the most common causes of heel pain involves inflammation of a thick band of tissue that runs across the bottom of your foot and connects your heel bone to your toes. What is the name of this band?", "top": false, "rep": "", "tag": "Final bank ANA W40", "bank": true, "expl": "The protective plantar aponeurosis extends from the calcaneus to the flexor sheaths at the base of the toes, matching the band described. It is also listed with the spring, short plantar and long plantar ligaments as a support of the arches of the foot.", "type": "written", "keyhtml": "Plantar aponeurosis: the protective plantar aponeurosis of the sole extends from the calcaneus (heel bone) to the flexor sheaths at the base of the toes. It is also one of the structures that support the arches of the foot."}, "Q0111": {"id": "Q0111", "stem": "Which of the following muscles is innervated by the deep fibular (peroneal) nerve?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q103", "bank": true, "expl": "The deep peroneal (fibular) nerve supplies all four anterior-compartment muscles, including fibularis tertius, which dorsiflexes and everts the foot. Fibularis longus is the trap: it is a lateral-compartment muscle supplied by the superficial peroneal nerve; flexor digitorum longus and tibialis posterior are tibial, and flexor digitorum brevis is medial plantar.", "type": "mcq", "opts": ["Fibularis (peroneus) longus", "Flexor digitorum brevis", "Flexor digitorum longus", "Fibularis (peroneus) tertius", "Tibialis posterior"], "ans": 3}, "Q0122": {"id": "Q0122", "stem": "Which of the following muscles is innervated by the superficial fibular nerve?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q104", "bank": true, "expl": "The superficial peroneal (fibular) nerve supplies the two lateral-compartment muscles, fibularis longus and brevis, which evert and plantar flex the foot. Fibularis tertius is the trap: it also everts, but it lies in the anterior compartment and is supplied by the deep peroneal nerve.", "type": "mcq", "opts": ["Fibularis (peroneus) longus", "Flexor digitorum brevis", "Flexor digitorum longus", "Fibularis (peroneus) tertius", "Tibialis posterior"], "ans": 0}, "Q0112": {"id": "Q0112", "stem": "A 25-year-old woman is brought to the emergency room in severe pain due to an ankle injury. She tells the attending physician she was wearing high-heeled shoes, stepped off the curb into the street, lost her balance and landed awkwardly, causing her foot to turn extremely outward (eversion). Which of the following ligaments is most likely overly stretched?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q105", "bank": true, "expl": "Severe eversion overly stretches the medial (deltoid) ligament, as in Pott fracture; being strong, it does not tear but causes a transverse avulsion fracture of the medial malleolus, and the fibula also fractures. The lateral ligament bands (anterior talofibular, calcaneofibular) are the ones most commonly damaged in an ordinary sprain, not in severe eversion.", "type": "mcq", "opts": ["Plantar calcaneonavicular (spring) ligament", "Calcaneofibular ligament", "Deltoid ligament", "Anterior talofibular ligament", "Plantar calcaneocuboid (short plantar) ligament"], "ans": 2}, "N-ANA-L8-01": {"id": "N-ANA-L8-01", "stem": "A 35-year-old man feels a sudden snap at the back of his heel while sprinting for a bus, and a complete rupture of the tendo calcaneus is diagnosed. Which muscles insert on the calcaneus through this tendon?", "top": false, "rep": "", "tag": "Final bank ANA Q106", "bank": true, "expl": "Gastrocnemius and soleus insert on the posterior aspect of the calcaneus via the tendo calcaneus, and both plantar flex the foot. Plantaris is the classic trap: it inserts directly on the posterior surface of the calcaneus, not through the tendo calcaneus.", "type": "mcq", "opts": ["Gastrocnemius and plantaris", "Soleus and plantaris", "Gastrocnemius and soleus", "Soleus and flexor hallucis longus", "Gastrocnemius and tibialis posterior"], "ans": 2}, "N-ANA-L8-02": {"id": "N-ANA-L8-02", "stem": "During an operation, a surgeon divides the flexor retinaculum and identifies the structures deep to it from medial to lateral. Which structure lies immediately lateral to the posterior tibial vessels?", "top": false, "rep": "", "tag": "Final bank ANA Q107", "bank": true, "expl": "Deep to the flexor retinaculum the order from medial to lateral is tibialis posterior, flexor digitorum longus, posterior tibial vessels, tibial nerve and flexor hallucis longus ('Tom Does Very Nice Hats'), so the nerve is 4th, just lateral to the vessels. Flexor hallucis longus is the most lateral structure, lying lateral to the nerve.", "type": "mcq", "opts": ["Flexor hallucis longus", "Flexor digitorum longus", "Tibialis posterior", "Tibial nerve", "Deep peroneal (fibular) nerve"], "ans": 3}, "N-ANA-L8-03": {"id": "N-ANA-L8-03", "stem": "To assess the subtalar joint, a physiotherapist holds a patient's heel and turns the foot inward and then outward. Which ligament strengthens the anterior (talocalcaneonavicular) part of the joint being tested?", "top": false, "rep": "", "tag": "Final bank ANA Q108", "bank": true, "expl": "The subtalar joint permits inversion and eversion; its anterior part, the talocalcaneonavicular joint (a synovial ball-and-socket joint), is strengthened by the plantar calcaneonavicular ('spring') ligament. The short and long plantar ligaments are listed among the supports of the arches of the foot, not as strengtheners of this joint.", "type": "mcq", "opts": ["Long plantar ligament", "Plantar calcaneonavicular (spring) ligament", "Plantar calcaneocuboid (short plantar) ligament", "Medial (deltoid) ligament"], "ans": 1}, "N-ANA-L8-04": {"id": "N-ANA-L8-04", "stem": "After a deep wound in the sole of the foot, a 28-year-old man is found to have an injury of the medial plantar nerve. Which of the following muscles is most likely paralysed?", "top": false, "rep": "", "tag": "Final bank ANA Q109", "bank": true, "expl": "The short toe flexors, flexor hallucis brevis and flexor digitorum brevis, are supplied by the medial plantar nerve. Flexor digitorum longus is the trap: the long toe flexors are supplied by the tibial nerve, while extensor digitorum brevis is supplied by the deep peroneal nerve.", "type": "mcq", "opts": ["Flexor digitorum longus", "Flexor hallucis longus", "Extensor digitorum brevis", "Tibialis posterior", "Flexor digitorum brevis"], "ans": 4}, "N-ANA-L8-05": {"id": "N-ANA-L8-05", "stem": "A sports physiotherapist explains to a sprinter that small muscles of the sole keep the toes from buckling under the foot during running by maintaining extension at the interphalangeal joints. Which muscles is she describing?", "top": false, "rep": "", "tag": "Final bank ANA Q110", "bank": true, "expl": "The 4 lumbricals of the 2nd layer flex the metatarsophalangeal joints and extend the interphalangeal joints of the lateral 4 toes, helping prevent the toes buckling under the foot during walking or running. The plantar and dorsal interossei belong to the 4th layer, and their action is summarised as PAD.", "type": "mcq", "opts": ["Lumbricals", "Plantar interossei", "Dorsal interossei", "Flexor digitorum brevis", "Flexor hallucis brevis"], "ans": 0}, "N-ANA-L8-06": {"id": "N-ANA-L8-06", "stem": "During a gait analysis, a physiotherapist explains that some leg muscles give dynamic support to the arches of the foot while walking. Which of the following muscles is one of them?", "top": false, "rep": "", "tag": "Final bank ANA Q111", "bank": true, "expl": "The muscles giving dynamic support to the arches during walking are tibialis anterior, tibialis posterior and peroneus longus. Peroneus brevis and tertius are tempting because they are also fibulares, but only peroneus longus is listed.", "type": "mcq", "opts": ["Peroneus (fibularis) brevis", "Peroneus (fibularis) longus", "Peroneus (fibularis) tertius", "Extensor digitorum longus", "Soleus"], "ans": 1}, "N-ANA-L8-07": {"id": "N-ANA-L8-07", "stem": "Enumerate, from medial to lateral, the structures passing deep to (a) the superior extensor retinaculum and (b) the flexor retinaculum.", "top": false, "rep": "", "tag": "Final bank ANA W41", "bank": true, "expl": "Both orders run medial to lateral, with the vessels 3rd and the nerve 4th. The extensor retinacula (superior and Y-shaped inferior) retain the extensor tendons to the dorsum of the foot, and the flexor retinaculum retains the flexor tendons.", "type": "written", "keyhtml": "(a) Deep to the superior extensor retinaculum (medial → lateral):\n1. Tibialis anterior\n2. Extensor hallucis longus\n3. Anterior tibial vessels\n4. Deep peroneal (fibular) nerve\n5. Extensor digitorum longus\n6. Peroneus tertius\n(Mnemonic: Tom Has Very Nice Dog – Poopy)\n(b) Deep to the flexor retinaculum (medial → lateral):\n1. Tibialis posterior\n2. Flexor digitorum longus\n3. Posterior tibial vessels\n4. Tibial nerve\n5. Flexor hallucis longus\n(Mnemonic: Tom Does Very Nice Hats / Tom Drives Very Nice Honda)\nIn both, the vessels are 3rd and the nerve 4th."}, "N-ANA-L8-09": {"id": "N-ANA-L8-09", "stem": "A 40-year-old man has an injury of the superficial peroneal (fibular) nerve. Eversion of his foot is weak but not completely lost. Which of the following muscles can still evert his foot?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The superficial peroneal nerve supplies fibularis longus and brevis, but fibularis tertius is an anterior-compartment evertor supplied by the deep peroneal nerve, so it still works. Extensor hallucis longus is also supplied by the deep peroneal nerve, but it inverts the foot.", "type": "mcq", "opts": ["Fibularis (peroneus) brevis", "Fibularis (peroneus) longus", "Tibialis anterior", "Fibularis (peroneus) tertius", "Extensor hallucis longus"], "ans": 3}, "N-ANA-L8-10": {"id": "N-ANA-L8-10", "stem": "During a dissection of the front of the leg, a student lifts the superior extensor retinaculum and identifies the structures deep to it. Counting from medial to lateral, which structures lie on either side of the deep peroneal (fibular) nerve?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Deep to the superior extensor retinaculum the order from medial to lateral is tibialis anterior, extensor hallucis longus, anterior tibial vessels, deep peroneal nerve, extensor digitorum longus and peroneus tertius ('Tom Has Very Nice Dog – Poopy'). As under the flexor retinaculum, the vessels are 3rd and the nerve 4th.", "type": "mcq", "opts": ["Extensor hallucis longus medially and anterior tibial vessels laterally", "Anterior tibial vessels medially and extensor digitorum longus laterally", "Tibialis anterior medially and extensor hallucis longus laterally", "Extensor digitorum longus medially and peroneus tertius laterally", "Anterior tibial vessels medially and peroneus tertius laterally"], "ans": 1}, "N-ANA-L8-11": {"id": "N-ANA-L8-11", "stem": "As a footballer begins to bend his knee from full extension, a deep muscle of the posterior compartment first unlocks the knee and rotates the leg medially. Which muscle is this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Popliteus, a deep-group muscle supplied by the tibial nerve, runs from the lateral condyle of the femur to the upper posterior side of the tibia; it flexes by unlocking the knee and rotates the leg medially. Gastrocnemius and plantaris also flex the knee (leg), but they are superficial-group muscles and are not described as unlocking it.", "type": "mcq", "opts": ["Plantaris", "Gastrocnemius", "Soleus", "Flexor digitorum longus", "Popliteus"], "ans": 4}, "N-ANA-L8-12": {"id": "N-ANA-L8-12", "stem": "An X-ray of a 30-year-old woman's foot after a twisting injury shows a small fragment of bone pulled off the base of the fifth metatarsal. Which of the following muscles inserts at this site?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Fibularis brevis and fibularis tertius insert on the base of the fifth metatarsal. Fibularis longus is the trap: it inserts on the base of the first metatarsal and the medial cuneiform, near tibialis anterior (first cuneiform, first metatarsal).", "type": "mcq", "opts": ["Fibularis (peroneus) longus", "Tibialis anterior", "Fibularis (peroneus) brevis", "Tibialis posterior", "Extensor digitorum longus"], "ans": 2}, "N-ANA-L8-13": {"id": "N-ANA-L8-13", "stem": "During a dissection of the sole, a student removes the first three layers and reaches the 4th layer. Which two tendons will the student find in this layer?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The 4th layer is formed of 2 tendons, tibialis posterior and peroneus longus, and 2 groups of muscles, the 3 plantar and 4 dorsal interossei. Tibialis anterior is tempting because it supports the arches together with these two muscles, but it is not part of the 4th layer.", "type": "mcq", "opts": ["Tibialis posterior and peroneus longus", "Tibialis anterior and peroneus longus", "Tibialis posterior and peroneus brevis", "Tibialis anterior and tibialis posterior", "Tibialis anterior and peroneus tertius"], "ans": 0}, "N-ANA-L8-14": {"id": "N-ANA-L8-14", "stem": "On a skeleton of the foot, a tutor asks a student to point to the bones that form the transverse arch. Which of the following should the student choose?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The transverse arch is formed by the 3 cuneiforms, the cuboid and the bases of the metatarsal bones ('3 C + C + B'). The calcaneus and the heads of the metatarsals are the two ends of the longitudinal arch, which is highest on the medial side.", "type": "mcq", "opts": ["The three cuneiforms, the navicular and the heads of the metatarsals", "The calcaneus, the cuboid and the bases of the metatarsals", "The calcaneus, the talus and the navicular", "The three cuneiforms, the cuboid and the bases of the metatarsals", "The navicular, the cuboid and the heads of the metatarsals"], "ans": 3}, "N-ANA-L8-15": {"id": "N-ANA-L8-15", "stem": "A mother is worried because the entire sole of her 18-month-old son's foot touches the floor when he stands. He has no pain. Which of the following is the best explanation?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In flat feet the arches on the inside of the feet are flattened so the entire sole touches the floor on standing; this is normal in infants and toddlers because the arch has not yet developed. Most arches develop during childhood, and some people never develop them as a normal variation.", "type": "mcq", "opts": ["The spring ligament has torn and the arch has collapsed", "The arch has not yet developed, which is normal at his age", "Tibialis posterior has been paralysed by a tibial nerve injury", "The plantar aponeurosis has failed to develop in the sole", "Peroneus longus is too weak to support the arches"], "ans": 1}, "N-ANA-L8-16": {"id": "N-ANA-L8-16", "stem": "A 30-year-old footballer lands awkwardly and his foot is forced into severe eversion. His ankle becomes painful and swollen.\n(a) Which ligament is overstretched by this movement?\n(b) Does this ligament usually tear? What happens instead?\n(c) What is this injury called?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All three answers come from the Pott fracture clinical box: severe eversion overstretches the deltoid ligament, which does not tear but fractures the medial malleolus (transverse avulsion) and the fibula.", "type": "written", "keyhtml": "(a) The medial (deltoid) ligament.\n(b) No: the deltoid ligament is strong and does not tear. Instead it causes a transverse avulsion fracture of the medial malleolus, and the fibula also fractures.\n(c) Pott fracture."}, "N-ANA-L8-17": {"id": "N-ANA-L8-17", "stem": "Enumerate the 4 layers of the sole of the foot. Mention the muscles and action of the 2nd layer, and the components of the 4th layer.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The layers are given in 5.2 (odd layers = 3 muscles; even layers = 2 tendons + 2 muscles), the lumbricals in 5.3 and the 4th layer in 5.4.", "type": "written", "keyhtml": "The muscles and tendons of the sole are arranged into 4 layers, from below upwards (3 · 2+2 · 3 · 2+2):\n• 1st layer: 3 muscles that extend through the whole length of the sole\n• 2nd layer: 2 tendons and 2 muscles\n• 3rd layer: 3 muscles that extend in the distal half of the sole\n• 4th layer: 2 tendons and 2 muscles\n2nd layer, the lumbricals:\n• 4 lumbrical muscles\n• Flex the metatarsophalangeal joints and extend the interphalangeal joints of the lateral 4 toes\n• Help prevent the toes from buckling under the foot during walking or running\n4th layer:\n• Tendons: tibialis posterior and peroneus longus\n• Muscles: 3 plantar and 4 dorsal interossei (action summarised as PAD; plantar interossei on the lateral 3 toes — 3, 4, 5; dorsal interossei on the middle 3 toes — 2, 3, 4)"}, "N-ANA-L8-18": {"id": "N-ANA-L8-18", "stem": "Describe the subtalar joint (its parts, their type and the ligament that strengthens it). Mention the muscles producing inversion and eversion of the foot, with their nerve supply.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The joint's parts and ligament are in 4.1 and the subtalar evertors and invertors with their nerves in 4.2 (evertors = fibulares; invertors = tibiales).", "type": "written", "keyhtml": "Subtalar joint: a compound joint comprising:\n• Posterior part: the talocalcaneal joint, a synovial plane joint\n• Anterior part: the talocalcaneonavicular joint, a synovial ball-and-socket joint, strengthened by the plantar calcaneonavicular (spring) ligament\nMovements: the subtalar joint permits inversion and eversion.\nEversion (the 3 fibulares):\n• Peroneus (fibularis) longus and brevis: superficial peroneal nerve\n• Peroneus (fibularis) tertius: deep peroneal nerve\nInversion (the 2 tibiales):\n• Tibialis anterior: deep peroneal nerve\n• Tibialis posterior: tibial nerve"}, "TP-005": {"id": "TP-005", "stem": "During neurological examination of an old diabetic man with a 20-year history of uncontrolled diabetes, there were obvious signs of neuropathy. Eversion and inversion of his feet were severely affected. On an anatomical basis, complete the following:\n- The evertors of the foot are ... and ...\n- The invertors of the foot are ... and ...\n- The joint of the foot which permits eversion and inversion is ...", "top": true, "rep": "", "tag": "Final bank ANA W57", "bank": true, "expl": "The subtalar joint permits inversion and eversion; its evertors are the 3 fibulares (longus and brevis, superficial peroneal nerve; tertius, deep peroneal nerve) and its invertors the 2 tibiales (anterior, deep peroneal; posterior, tibial).", "type": "written", "keyhtml": "• Evertors: peroneus (fibularis) longus and peroneus (fibularis) brevis (also peroneus tertius)\n• Invertors: tibialis anterior and tibialis posterior\n• Joint: the subtalar joint"}, "TP-084": {"id": "TP-084", "stem": "A patient with a ruptured tendo calcaneus (Achilles tendon) has difficulty with knee flexion and ankle plantar flexion.\na) Mention the muscle that performs both actions.\nb) Mention the origin of this muscle.", "top": true, "rep": "", "tag": "Final bank ANA W58", "bank": true, "expl": "Gastrocnemius flexes the knee and plantar flexes the foot, and inserts on the posterior aspect of the calcaneus via the tendo calcaneus. Soleus shares the tendon but only plantar flexes, while plantaris inserts separately on the posterior surface of the calcaneus.", "type": "written", "keyhtml": "a) Gastrocnemius.\nb) Lateral head: lateral femoral condyle; medial head: medial femoral condyle."}}, "labs": {"sl84": {"id": "sl84", "type": "slide", "title": "Leg, foot & vertebral column · slide 5", "img": "prac/s084.jpg", "labels": [{"t": "Calcaneus", "x": 68.77, "y": 16.32, "w": 6.78, "h": 2.96, "id": "l0"}, {"t": "The metatarsal bones 5", "x": 28.05, "y": 64.55, "w": 16.61, "h": 3.33, "id": "l1"}, {"t": "The phalanges 6", "x": 59.23, "y": 64.56, "w": 11.76, "h": 3.68, "id": "l2"}, {"t": "Right foot inferior view", "x": 71.91, "y": 92.1, "w": 8.48, "h": 6.52, "id": "l3"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl86": {"id": "sl86", "type": "slide", "title": "Leg, foot & vertebral column · slide 7", "img": "prac/s086.jpg", "labels": [{"t": "Tibialis anterior", "x": 16.98, "y": 25.65, "w": 13.01, "h": 3.42, "id": "l0", "m": {"x": 46.9, "y": 24.8, "w": 0.84, "h": 2.96}, "n": "1", "mu": "ta"}, {"t": "Extensor hallucis longus", "x": 16.78, "y": 34.41, "w": 20.09, "h": 3.49, "id": "l1", "m": {"x": 53.31, "y": 62.51, "w": 0.84, "h": 2.96}, "n": "2", "mu": "ehl"}, {"t": "Extensor digitorum longus", "x": 16.59, "y": 43.67, "w": 21.67, "h": 3.4, "id": "l2", "m": {"x": 42.75, "y": 47.18, "w": 0.84, "h": 2.96}, "n": "3", "mu": "edl"}, {"t": "Fibularis (peroneus) tertius", "x": 16.57, "y": 52.31, "w": 22.04, "h": 3.92, "id": "l3", "m": {"x": 43.65, "y": 66.96, "w": 0.84, "h": 2.96}, "n": "4", "mu": "pt"}, {"t": "Fibularis (peroneus) longus", "x": 16.48, "y": 61.72, "w": 22.48, "h": 3.67, "id": "l4", "m": {"x": 69.09, "y": 35.16, "w": 0.84, "h": 2.96}, "n": "5", "mu": "pl"}, {"t": "Fibularis (peroneus) brevis", "x": 16.42, "y": 71.39, "w": 21.99, "h": 3.16, "id": "l5", "m": {"x": 76.04, "y": 64.25, "w": 0.84, "h": 2.96}, "n": "6", "mu": "pb"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "act": {"muscles": {"ta": {"name": "Tibialis anterior", "nerves": ["dp"], "moves": ["df", "inv"], "note": "Lateral tibial condyle → first cuneiform, first metatarsal; dorsiflexes and inverts."}, "ehl": {"name": "Extensor hallucis longus", "nerves": ["dp"], "moves": ["df", "inv", "text"], "note": "Extends the big toe and inverts; dorsiflexes the foot."}, "edl": {"name": "Extensor digitorum longus", "nerves": ["dp"], "moves": ["df", "ev", "text"], "note": "Extends the toes and everts; dorsiflexes the foot."}, "pt": {"name": "Fibularis (peroneus) tertius", "nerves": ["dp"], "moves": ["df", "ev"], "note": "Distal 1/3 fibula → base of 5th metatarsal; dorsiflexes and everts."}, "pl": {"name": "Fibularis (peroneus) longus", "nerves": ["sp"], "moves": ["ev", "pf"], "note": "Everts and plantar flexes the foot."}, "pb": {"name": "Fibularis (peroneus) brevis", "nerves": ["sp"], "moves": ["ev", "pf"], "note": "Lower lateral fibula → base of 5th metatarsal; everts and plantar flexes."}}, "nerves": [{"id": "scp", "name": "Common peroneal (fibular)"}, {"id": "dp", "name": "Deep peroneal (fibular)"}, {"id": "sp", "name": "Superficial peroneal (fibular)"}], "moves": [{"id": "df", "name": "Dorsiflexion"}, {"id": "pf", "name": "Plantar flexion"}, {"id": "inv", "name": "Inversion"}, {"id": "ev", "name": "Eversion"}, {"id": "text", "name": "Toe extension"}], "par": {"dp": "scp", "sp": "scp"}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}, "sl88": {"id": "sl88", "type": "slide", "title": "Leg, foot & vertebral column · slide 9", "img": "prac/s088.jpg", "labels": [{"t": "Gastrocnemius", "x": 28.31, "y": 33.25, "w": 13.27, "h": 3.17, "id": "l0", "m": {"x": 72.38, "y": 39.98, "w": 0.74, "h": 2.6}, "n": "1", "mu": "gast"}, {"t": "Soleus", "x": 28.47, "y": 41.89, "w": 7.27, "h": 3.1, "id": "l1", "m": {"x": 57.46, "y": 41.48, "w": 0.74, "h": 2.6}, "n": "2", "mu": "sol"}, {"t": "Plantaris", "x": 28.47, "y": 50.95, "w": 8.55, "h": 3.1, "id": "l2", "m": {"x": 68.17, "y": 8.96, "w": 0.74, "h": 2.6}, "n": "3", "mu": "plan"}, {"t": "Tendo-calcaneus", "x": 28.47, "y": 58.58, "w": 14.65, "h": 3.1, "id": "l3", "m": {"x": 64.89, "y": 77.92, "w": 0.74, "h": 2.6}, "n": "4"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "act": {"muscles": {"gast": {"name": "Gastrocnemius", "nerves": ["tib"], "moves": ["pf", "kflex"], "note": "Flexes the knee and plantar flexes the foot."}, "sol": {"name": "Soleus", "nerves": ["tib"], "moves": ["pf"], "note": "Plantar flexes the foot via the tendo calcaneus."}, "plan": {"name": "Plantaris", "nerves": ["tib"], "moves": ["pf", "kflex"], "note": "Flexes the leg and plantar flexes the foot."}}, "nerves": [{"id": "sct", "name": "Sciatic — tibial part"}, {"id": "tib", "name": "Tibial"}], "moves": [{"id": "kflex", "name": "Knee flexion"}, {"id": "pf", "name": "Plantar flexion"}], "par": {"tib": "sct"}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}, "sl89": {"id": "sl89", "type": "slide", "title": "Leg, foot & vertebral column · slide 10", "img": "prac/s089.jpg", "labels": [{"t": "Popliteus", "x": 21.43, "y": 29.49, "w": 8.72, "h": 3.1, "id": "l0", "m": {"x": 66.94, "y": 34.21, "w": 0.74, "h": 2.6}, "n": "1", "mu": "pop"}, {"t": "Flexor hallucis longus", "x": 21.17, "y": 35.58, "w": 18.47, "h": 3.1, "id": "l1", "m": {"x": 57.69, "y": 46.82, "w": 0.74, "h": 2.6}, "n": "2", "mu": "fhl"}, {"t": "Flexor digitorum longus", "x": 21.17, "y": 41.72, "w": 19.87, "h": 3.37, "id": "l2", "m": {"x": 54.72, "y": 47.43, "w": 0.74, "h": 2.6}, "n": "3", "mu": "fdl"}, {"t": "Tibialis posterior", "x": 21.43, "y": 47.93, "w": 14.3, "h": 3.1, "id": "l3", "m": {"x": 56.74, "y": 35.53, "w": 0.74, "h": 2.6}, "n": "4", "mu": "tp"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "act": {"muscles": {"pop": {"name": "Popliteus", "nerves": ["tib"], "moves": ["kflex", "lmr"], "note": "Unlocks the knee at the start of flexion; rotates the leg medially."}, "fhl": {"name": "Flexor hallucis longus", "nerves": ["tib"], "moves": ["pf", "tflex"], "note": "Plantar flexes; flexes the big toe."}, "fdl": {"name": "Flexor digitorum longus", "nerves": ["tib"], "moves": ["pf", "tflex"], "note": "Middle posterior tibia → distal phalanges of the lateral four toes."}, "tp": {"name": "Tibialis posterior", "nerves": ["tib"], "moves": ["pf", "inv"], "note": "Plantar flexes and inverts the foot."}}, "nerves": [{"id": "sct", "name": "Sciatic — tibial part"}, {"id": "tib", "name": "Tibial"}], "moves": [{"id": "kflex", "name": "Knee flexion"}, {"id": "lmr", "name": "Medial rotation of leg"}, {"id": "pf", "name": "Plantar flexion"}, {"id": "inv", "name": "Inversion"}, {"id": "tflex", "name": "Toe flexion"}], "par": {"tib": "sct"}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}, "sl90": {"id": "sl90", "type": "slide", "title": "Leg, foot & vertebral column · slide 11", "img": "prac/s090.jpg", "labels": [{"t": "Flexor retinaculum", "x": 33.73, "y": 71.3, "w": 14.53, "h": 3.33, "id": "l0"}, {"t": "Superior Extensor Retinaculum", "x": 56.81, "y": 15.58, "w": 13.54, "h": 7.33, "id": "l1"}, {"t": "Inferior Extensor Retinaculum", "x": 57.68, "y": 32.43, "w": 12.68, "h": 7.33, "id": "l2"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "ANA-L8-001", "text": "Anterior compartment of the leg — 4 muscles: {{c1::tibialis anterior}} · {{c2::extensor hallucis longus}} · {{c3::extensor digitorum longus}} · {{c4::fibularis (peroneus) tertius}}", "extra": "The Happy Dog Trots.", "sec": "Part 01 · 1.1 Muscles of the anterior and lateral compartments of the leg"}, {"id": "ANA-L8-002", "text": "Lateral compartment of the leg — 2 muscles: {{c1::fibularis (peroneus) longus}} · {{c2::fibularis (peroneus) brevis}}", "extra": "", "sec": "Part 01 · 1.1 Muscles of the anterior and lateral compartments of the leg"}, {"id": "ANA-L8-003", "text": "Nerve of the anterior compartment muscles of the leg: {{c1::deep peroneal (fibular)}}; of the lateral compartment muscles: {{c2::superficial peroneal (fibular)}}", "extra": "Extensor digitorum brevis (in the foot) is also deep peroneal.", "sec": "Part 01 · 1.1 Muscles of the anterior and lateral compartments of the leg"}, {"id": "ANA-L8-004", "text": "Action shared by all 4 anterior compartment muscles: {{c1::dorsiflexion of the foot}}; by both lateral compartment muscles: {{c2::eversion and plantar flexion of the foot}}", "extra": "", "sec": "Part 01 · 1.1 Muscles of the anterior and lateral compartments of the leg"}, {"id": "ANA-L8-005", "text": "Fibularis (peroneus) tertius lies in the {{c1::anterior}} compartment, so it is supplied by the {{c2::deep peroneal (fibular)}} nerve — although it everts the foot", "extra": "Exam trap: not superficial peroneal like fibularis longus & brevis.", "sec": "Part 01 · 1.1 Muscles of the anterior and lateral compartments of the leg"}, {"id": "ANA-L8-006", "text": "Tibialis anterior — origin: {{c1::lateral tibial condyle & interosseous membrane}}; insertion: {{c2::first cuneiform & first metatarsal}}", "extra": "", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-007", "text": "Tibialis anterior action: {{c1::dorsiflexes and inverts}} the foot", "extra": "", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-008", "text": "Extensor hallucis longus — origin: {{c1::middle half of anterior surface of fibula & interosseous membrane}}; insertion: {{c2::base of distal phalanx of big toe}}", "extra": "", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-009", "text": "Long toe extensors (both also dorsiflex the foot) — extensor hallucis longus: {{c1::inverts::inverts or everts}} the foot; extensor digitorum longus: {{c2::everts::inverts or everts}} the foot", "extra": "EHL also extends the big toe; EDL extends the toes.", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-010", "text": "Extensor digitorum longus — origin: {{c1::lateral tibial condyle, upper two-thirds of fibula & interosseous membrane}}; insertion: {{c2::bases of middle and distal phalanges}}", "extra": "", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-011", "text": "Fibularis (peroneus) tertius — origin: {{c1::distal one-third of fibula & interosseous membrane}}; insertion: {{c2::base of fifth metatarsal}}; action: {{c3::dorsiflexes and everts}} the foot", "extra": "", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-012", "text": "Fibularis (peroneus) longus — origin: {{c1::lateral tibial condyle, head & upper lateral side of fibula}}; insertion: {{c2::base of first metatarsal & medial cuneiform}}", "extra": "First metatarsal for longus; fifth for brevis & tertius.", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-013", "text": "Fibularis (peroneus) brevis — origin: {{c1::lower lateral side of fibula & intermuscular septa}}; insertion: {{c2::base of fifth metatarsal}}", "extra": "", "sec": "Part 01 · 1.2 Origin, insertion, nerve & action"}, {"id": "ANA-L8-014", "text": "Posterior compartment of the leg — superficial group: {{c1::gastrocnemius}} · {{c2::soleus}} · {{c3::plantaris}}", "extra": "", "sec": "Part 02 · 2.1 Superficial group"}, {"id": "ANA-L8-015", "text": "Posterior compartment of the leg — deep group: {{c1::popliteus}} · {{c2::flexor hallucis longus}} · {{c3::flexor digitorum longus}} · {{c4::tibialis posterior}}", "extra": "", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-016", "text": "All 7 muscles of the posterior compartment of the leg are supplied by the {{c1::tibial}} nerve", "extra": "", "sec": "Part 02 · 2.1 Superficial group"}, {"id": "ANA-L8-017", "text": "Gastrocnemius — origin: {{c1::lateral & medial femoral condyles}} (lateral & medial heads); action: {{c2::flexes knee, plantar flexes foot}}", "extra": "", "sec": "Part 02 · 2.1 Superficial group"}, {"id": "ANA-L8-018", "text": "Soleus — origin: {{c1::upper fibula head & soleal line on tibia}}; action: {{c2::plantar flexes foot}}", "extra": "", "sec": "Part 02 · 2.1 Superficial group"}, {"id": "ANA-L8-019", "text": "Muscles that insert on the posterior aspect of the calcaneus via the tendo calcaneus: {{c1::gastrocnemius}} & {{c2::soleus}}", "extra": "Exam trap: plantaris inserts on the calcaneus directly, not via the tendo calcaneus.", "sec": "Part 02 · 2.1 Superficial group"}, {"id": "ANA-L8-020", "text": "Plantaris — origin: {{c1::lower lateral supracondylar line}}; insertion: {{c2::posterior surface of calcaneus}} (directly, not via the tendo calcaneus); action: {{c3::flexes leg, plantar flexes foot}}", "extra": "", "sec": "Part 02 · 2.1 Superficial group"}, {"id": "ANA-L8-021", "text": "Popliteus — origin: {{c1::lateral condyle of femur & popliteal ligament}}; insertion: {{c2::upper posterior side of tibia}}", "extra": "", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-022", "text": "Popliteus action: flexes the knee by {{c1::unlocking}} it and rotates the leg {{c2::medially::medially or laterally}}", "extra": "", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-023", "text": "Flexor hallucis longus — origin: {{c1::lower two-thirds of fibula, interosseous membrane & intermuscular septa}}; insertion: {{c2::base of distal phalanx of big toe}}", "extra": "Action: plantar flexes foot, flexes distal phalanx of big toe.", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-024", "text": "Flexor digitorum longus — origin: {{c1::middle posterior aspect of tibia}}; insertion: {{c2::distal phalanges of lateral four toes}}", "extra": "Action: flexes lateral four toes, plantar flexes foot.", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-025", "text": "Tibialis posterior — origin: {{c1::interosseous membrane & upper parts of tibia and fibula}}; action: {{c2::plantar flexes and inverts}} the foot", "extra": "", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-026", "text": "Tibialis posterior insertion: {{c1::tuberosity of navicular}} · {{c2::sustentaculum tali}} · {{c3::three cuneiforms}} · {{c4::cuboid}} · {{c5::bases of metatarsals 2–4}}", "extra": "", "sec": "Part 02 · 2.2 Deep group"}, {"id": "ANA-L8-027", "text": "Extensor retinacula (retain the extensor tendons to the dorsum of the foot): {{c1::superior}} + {{c2::inferior}}; the inferior one is {{c3::Y-shaped}}", "extra": "The flexor retinaculum retains the flexor tendons.", "sec": "Part 03 · 3.1 Extensor & flexor retinacula"}, {"id": "ANA-L8-028", "text": "Deep to the superior extensor retinaculum, medial → lateral: {{c1::tibialis anterior}} · {{c2::extensor hallucis longus}} · {{c3::anterior tibial vessels}} · {{c4::deep peroneal (fibular) nerve}} · {{c5::extensor digitorum longus}} · {{c6::peroneus tertius}}", "extra": "Tom Has Very Nice Dog — Poopy.", "sec": "Part 03 · 3.2 Deep to the superior extensor retinaculum"}, {"id": "ANA-L8-029", "text": "Deep to the flexor retinaculum, medial → lateral: {{c1::tibialis posterior}} · {{c2::flexor digitorum longus}} · {{c3::posterior tibial vessels}} · {{c4::tibial nerve}} · {{c5::flexor hallucis longus}}", "extra": "Tom Does Very Nice Hats / Tom Drives Very Nice Honda.", "sec": "Part 03 · 3.3 Deep to the flexor retinaculum"}, {"id": "ANA-L8-030", "text": "Under both the superior extensor and the flexor retinaculum (counting medial → lateral) the vessels are {{c1::3rd}} and the nerve {{c2::4th}}", "extra": "Anterior tibial vessels + deep peroneal nerve; posterior tibial vessels + tibial nerve.", "sec": "Part 03 · 3.3 Deep to the flexor retinaculum"}, {"id": "ANA-L8-031", "text": "Subtalar joint (compound) — posterior part: the {{c1::talocalcaneal}} joint, a synovial {{c2::plane}} joint; anterior part: the {{c3::talocalcaneonavicular}} joint, a synovial {{c4::ball-and-socket}} joint", "extra": "", "sec": "Part 04 · 4.1 Subtalar joint"}, {"id": "ANA-L8-032", "text": "The talocalcaneonavicular joint is strengthened by the {{c1::plantar calcaneonavicular ('spring')}} ligament", "extra": "", "sec": "Part 04 · 4.1 Subtalar joint"}, {"id": "ANA-L8-033", "text": "Movements permitted by the subtalar joint: {{c1::inversion and eversion}}", "extra": "Inversion = foot turns inward (medially); eversion = outward (laterally).", "sec": "Part 04 · 4.1 Subtalar joint"}, {"id": "ANA-L8-034", "text": "Subtalar evertors: {{c1::peroneus (fibularis) longus, brevis & tertius}}; subtalar invertors: {{c2::tibialis anterior & tibialis posterior}}", "extra": "Evertors = the 3 fibulares; invertors = the 2 tibiales.", "sec": "Part 04 · 4.2 Movements of the joints of the foot"}, {"id": "ANA-L8-035", "text": "Nerves of the subtalar evertors — peroneus longus & brevis: {{c1::superficial peroneal}}; peroneus tertius: {{c2::deep peroneal}}", "extra": "", "sec": "Part 04 · 4.2 Movements of the joints of the foot"}, {"id": "ANA-L8-036", "text": "Nerves of the subtalar invertors — tibialis anterior: {{c1::deep peroneal}}; tibialis posterior: {{c2::tibial}}", "extra": "", "sec": "Part 04 · 4.2 Movements of the joints of the foot"}, {"id": "ANA-L8-037", "text": "Toe flexors — the long ones (flexor hallucis longus, flexor digitorum longus): {{c1::tibial}} nerve; the short ones (flexor hallucis brevis, flexor digitorum brevis): {{c2::medial plantar}} nerve", "extra": "Exam trap: brevis → medial plantar; longus → tibial.", "sec": "Part 04 · 4.2 Movements of the joints of the foot"}, {"id": "ANA-L8-038", "text": "Toe extensors — extensor hallucis longus, extensor digitorum longus and extensor digitorum brevis — are all supplied by the {{c1::deep peroneal}} nerve", "extra": "", "sec": "Part 04 · 4.2 Movements of the joints of the foot"}, {"id": "ANA-L8-039", "text": "Medial plantar nerve supplies the short toe flexors: {{c1::flexor hallucis brevis}} & {{c2::flexor digitorum brevis}}", "extra": "", "sec": "Part 07 · 7.2 Nerve → muscles supplied"}, {"id": "ANA-L8-040", "text": "The protective {{c3::plantar aponeurosis}} extends from the {{c1::calcaneus}} to the {{c2::flexor sheaths at the base of the toes}}", "extra": "It is also one of the supports of the arches of the foot.", "sec": "Part 05 · 5.1 Muscles of the foot & the plantar aponeurosis"}, {"id": "ANA-L8-041", "text": "Layers of the sole, from below upwards — 1st: {{c1::3 muscles}} · 2nd: {{c2::2 tendons + 2 muscles}} · 3rd: {{c3::3 muscles}} · 4th: {{c4::2 tendons + 2 muscles}}", "extra": "3 · 2+2 · 3 · 2+2 — odd layers = 3 muscles; even layers = 2 tendons + 2 muscles.", "sec": "Part 05 · 5.2 The 4 layers of the sole — from below upwards"}, {"id": "ANA-L8-042", "text": "Sole layers made of 3 muscles — in the 1st layer they extend through {{c1::the whole length of the sole}}; in the 3rd layer they extend in {{c2::the distal half of the sole}}", "extra": "", "sec": "Part 05 · 5.2 The 4 layers of the sole — from below upwards"}, {"id": "ANA-L8-043", "text": "2nd layer of the sole: the {{c1::4 lumbrical}} muscles — they {{c2::flex::flex or extend}} the metatarsophalangeal joints and {{c3::extend::flex or extend}} the interphalangeal joints of the lateral 4 toes", "extra": "", "sec": "Part 05 · 5.3 2nd layer — the lumbricals"}, {"id": "ANA-L8-044", "text": "Lumbricals of the foot help prevent the toes from {{c1::buckling under the foot}} during walking or running, by maintaining {{c2::extension at the interphalangeal joints}}", "extra": "", "sec": "Part 05 · 5.3 2nd layer — the lumbricals"}, {"id": "ANA-L8-045", "text": "4th layer of the sole — its 2 tendons: {{c1::tibialis posterior}} & {{c2::peroneus longus}}", "extra": "", "sec": "Part 05 · 5.4 4th layer — 2 tendons and 2 muscles"}, {"id": "ANA-L8-046", "text": "4th layer of the sole — its 2 groups of muscles: the {{c1::3 plantar}} and {{c2::4 dorsal}} interossei", "extra": "", "sec": "Part 05 · 5.4 4th layer — 2 tendons and 2 muscles"}, {"id": "ANA-L8-047", "text": "Interossei of the foot act on — plantar: the {{c1::lateral 3 toes (3, 4, 5)}}; dorsal: the {{c2::middle 3 toes (2, 3, 4)}}", "extra": "Slide mnemonic for their action: PAD.", "sec": "Part 05 · 5.4 4th layer — 2 tendons and 2 muscles"}, {"id": "ANA-L8-048", "text": "Pott fracture: severe foot {{c1::eversion::inversion or eversion}} overly stretches the {{c2::medial (deltoid)}} ligament", "extra": "", "sec": "Part 06 · 6.1 Clinical correlate — Pott fracture"}, {"id": "ANA-L8-049", "text": "In Pott fracture the strong deltoid ligament {{c1::does not tear}}; instead it causes a {{c2::transverse avulsion}} fracture of the {{c3::medial malleolus}} plus a fracture of the {{c4::fibula}}", "extra": "", "sec": "Part 06 · 6.1 Clinical correlate — Pott fracture"}, {"id": "ANA-L8-050", "text": "Severe eversion → deltoid ligament overstretched → transverse avulsion of the medial malleolus + fracture of the fibula = {{c1::Pott}} fracture", "extra": "", "sec": "Part 06 · 6.1 Clinical correlate — Pott fracture"}, {"id": "ANA-L8-051", "text": "The bones of the foot form {{c1::longitudinal}} and {{c2::transverse}} arches, which {{c3::absorb and distribute downward forces}} from the body during standing and moving", "extra": "The bones of the foot do not lie in a horizontal plane.", "sec": "Part 06 · 6.2 Arches of the foot"}, {"id": "ANA-L8-052", "text": "Longitudinal arch: formed between the {{c1::posterior end of the calcaneus}} and the {{c2::heads of the metatarsals}}", "extra": "", "sec": "Part 06 · 6.2 Arches of the foot"}, {"id": "ANA-L8-053", "text": "The longitudinal arch is highest on the {{c1::medial::medial or lateral}} side and lowest on the {{c2::lateral::medial or lateral}} side", "extra": "", "sec": "Part 06 · 6.2 Arches of the foot"}, {"id": "ANA-L8-054", "text": "Transverse arch: formed by the {{c1::3 cuneiforms}} · {{c2::cuboid}} · {{c3::bases of the metatarsal bones}}", "extra": "3 C + C + B.", "sec": "Part 06 · 6.2 Arches of the foot"}, {"id": "ANA-L8-055", "text": "Ligaments supporting the arches of the foot: {{c1::plantar calcaneonavicular (spring)}} · {{c2::plantar calcaneocuboid (short plantar)}} · {{c3::long plantar}} · {{c4::plantar aponeurosis}}", "extra": "", "sec": "Part 06 · 6.3 Ligament and muscle support of the arches"}, {"id": "ANA-L8-056", "text": "Muscles giving dynamic support to the arches during walking: {{c1::tibialis anterior}} · {{c2::tibialis posterior}} · {{c3::peroneus longus}}", "extra": "Of the fibulares, only peroneus longus.", "sec": "Part 06 · 6.3 Ligament and muscle support of the arches"}, {"id": "ANA-L8-057", "text": "Plantar calcaneonavicular ligament = the {{c1::spring}} ligament; plantar calcaneocuboid ligament = the {{c2::short plantar}} ligament", "extra": "", "sec": "Part 06 · 6.3 Ligament and muscle support of the arches"}, {"id": "ANA-L8-058", "text": "Flat feet: the arches on the {{c1::inside}} of the feet are flattened, so the {{c2::entire sole}} touches the floor on standing", "extra": "", "sec": "Part 06 · 6.4 Flat feet"}, {"id": "ANA-L8-059", "text": "A flat foot is normal in {{c1::infants and toddlers}}, because the arch {{c2::hasn't yet developed}}", "extra": "", "sec": "Part 06 · 6.4 Flat feet"}, {"id": "ANA-L8-060", "text": "Most people's arches develop {{c1::throughout childhood}}; some never develop arches — a {{c2::normal variation}} in foot type", "extra": "People without arches may or may not have problems.", "sec": "Part 06 · 6.4 Flat feet"}, {"id": "ANA-L8-061", "text": "Flat feet — when there is pain, it is particularly in the {{c1::heel or arch}} and may worsen with {{c2::activity}}", "extra": "", "sec": "Part 06 · 6.4 Flat feet"}, {"id": "ANA-L8-062", "text": "Plantar flexion of the foot — posterior compartment muscles (gastrocnemius, soleus, plantaris, long toe flexors, tibialis posterior): {{c1::tibial}} nerve; fibularis longus & brevis: {{c2::superficial peroneal}} nerve", "extra": "", "sec": "Part 07 · 7.1 Movement → muscles → nerve"}, {"id": "ANA-L8-063", "text": "Leg muscles that invert the foot (muscle tables): {{c1::tibialis anterior}} · {{c2::extensor hallucis longus}} · {{c3::tibialis posterior}}", "extra": "The subtalar-movements slide lists only the 2 tibiales.", "sec": "Part 07 · 7.1 Movement → muscles → nerve"}, {"id": "ANA-L8-064", "text": "Leg muscles that evert the foot (muscle tables): {{c1::extensor digitorum longus}} · {{c2::fibularis tertius}} · {{c3::fibularis longus}} · {{c4::fibularis brevis}}", "extra": "The subtalar-movements slide lists only the 3 fibulares.", "sec": "Part 07 · 7.1 Movement → muscles → nerve"}, {"id": "ANA-L8-065", "text": "Muscles inserting on the base of the fifth metatarsal: {{c1::fibularis brevis}} & {{c2::fibularis tertius}}", "extra": "Fibularis longus goes to the first metatarsal.", "sec": "Part 07 · 7.3 Insertions at a glance"}, {"id": "ANA-L8-066", "text": "Muscles inserting on the base of the distal phalanx of the big toe: {{c1::extensor hallucis longus}} & {{c2::flexor hallucis longus}}", "extra": "", "sec": "Part 07 · 7.3 Insertions at a glance"}], "pracs": [{"href": "prac-ana-4.html", "title": "Anatomy practical · Practical 4 – Leg, foot & vertebral column"}], "lib": "msk.html", "prev": {"href": "ana-l7.html", "title": "Lecture 7 · Movement of the Leg"}, "next": {"href": "ana-l9.html", "title": "Lecture 9 · Innervation of the Lower Limb"}, "coverImg": "covers/Anatomy.jpg", "searchHint": "e.g. plane, anterior, tibial nerve"};

  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){
    const ms = L.labels.map(l => slmus(L, l)).filter(Boolean);
    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>

</body>
</html>
