ef=\"prac-ana-4.html\">Anatomy practical · Practical 4 – Leg, foot &amp; vertebral column<\/a>."}, {"t": "lab", "lab": "sl76"}], "toc": ["◉", "Real images from the practical"], "labName": "Hip & thigh · slide 21"}, {"id": "p65", "head": "Real images · 2 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl93"}], "labName": "Leg, foot & vertebral column · slide 14"}, {"id": "p66", "head": "Real images · 3 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl95"}], "labName": "Leg, foot & vertebral column · slide 16"}, {"id": "p67", "head": "Real images · 4 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl96"}], "labName": "Leg, foot & vertebral column · slide 17"}, {"id": "p68", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Femoral and obturator share roots L2–L4: femoral = posterior divisions, obturator = anterior"}, {"t": "note", "kind": "trap", "html": "Tibial = anterior divisions (L4–S3); common fibular = posterior divisions (L4–S2)"}, {"t": "note", "kind": "trap", "html": "Lateral rotation of thigh listed for inferior gluteal and both nerves to gemelli/obturator internus/quadratus femoris"}, {"t": "note", "kind": "trap", "html": "Only the short head of biceps femoris is from the common fibular division; long head is tibial"}, {"t": "note", "kind": "trap", "html": "Sciatic injury: medial leg and foot keep sensation (saphenous branch of femoral)"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p69", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Tibial injury → weakness in plantar flexion; sciatic injury → loss of plantar flexion with foot drop"}, {"t": "note", "kind": "trap", "html": "First web space spared in superficial fibular sensory loss (deep fibular medial branch)"}, {"t": "note", "kind": "trap", "html": "Superior gluteal nerve enters above piriformis; sciatic inferior to piriformis"}, {"t": "note", "kind": "trap", "html": "Damaged superior gluteal nerve is opposite to the side where pelvis falls"}, {"t": "note", "kind": "trap", "html": "Posterior femoral cutaneous has both posterior (S1–S2) and anterior (S2–S3) divisions"}, {"t": "note", "kind": "cl", "html": "Femoral nerve injury: weak hip flexion and knee extension, absent knee jerk, sensory loss anterior thigh, medial leg and foot"}]}, {"id": "p70", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Obturator nerve injury: loss of thigh adduction, medial thigh sensory loss"}, {"t": "note", "kind": "cl", "html": "Gluteal injection in upper lateral (outer) quadrant avoids the sciatic nerve"}, {"t": "note", "kind": "cl", "html": "Sciatic injury causes: hip dislocation, acetabular fracture, surgery, anaesthesia positioning, neurotoxic injection, tourniquets, casts"}, {"t": "note", "kind": "cl", "html": "Sciatic nerve injury: weak thigh extension and knee flexion, foot drop, loss of plantar flexion"}, {"t": "note", "kind": "cl", "html": "Sciatica: most common cause is bulging/herniated disc"}, {"t": "note", "kind": "cl", "html": "Tibial nerve injury: weak knee flexion, plantar flexion and inversion"}]}, {"id": "p71", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Common fibular nerve injury at fibular neck: foot drop, steppage gait, loss of eversion"}, {"t": "note", "kind": "cl", "html": "Superior gluteal nerve injury: Trendelenburg gait; bilateral → waddling gait"}]}, {"id": "p72", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Y26-028": {"id": "Y26-028", "stem": "A 45-year-old male undergoes a complex repair of an inguinal hernia. Postoperatively, he reports difficulty climbing stairs and notices that his right knee frequently \"gives way.\" Physical examination reveals weakness in knee extension, an absent patellar reflex, and sensory loss along the anterior thigh and medial aspect of the leg down to the foot. Which nerve was injured during the procedure?", "top": true, "rep": "", "tag": "Final bank ANA Q112", "bank": true, "expl": "Femoral nerve injury weakens hip flexion and knee extension, the knee-jerk (patellar) reflex may be absent, and there is sensory loss on the anterior thigh, medial leg and foot. Obturator nerve injury would instead cause loss of thigh adduction with sensory loss on the medial thigh.", "type": "mcq", "opts": ["Obturator nerve", "Femoral nerve", "Sciatic nerve", "Common fibular nerve", "Lateral femoral cutaneous nerve"], "ans": 1}, "Y26-029": {"id": "Y26-029", "stem": "A 38-year-old woman develops a large psoas abscess following a severe retroperitoneal infection. CT imaging demonstrates significant compression of a nerve emerging from the lateral border of the psoas major muscle. Which of the following clinical signs is most consistent with this presentation?", "top": true, "rep": "", "tag": "Final bank ANA Q113", "bank": true, "expl": "The nerve emerging from the lateral side of psoas major is the femoral nerve, whose injury weakens knee extension and causes sensory loss on the anterior thigh, medial leg and foot. Loss of thigh adduction with medial thigh sensory loss is obturator nerve injury; that nerve emerges from the medial side of psoas major.", "type": "mcq", "opts": ["Loss of thigh adduction with sensory deficit on the medial thigh", "Weakened knee extension and loss of sensation over the medial leg", "Inability to dorsiflex the foot resulting in steppage gait", "Trendelenburg sign when standing on the affected side", "Loss of plantar flexion and diminished Achilles reflex"], "ans": 1}, "Y26-030": {"id": "Y26-030", "stem": "A 34-year-old woman undergoing pelvic staging surgery for uterine cancer experiences post-op difficulty walking, with her right leg swinging laterally during ambulation. Examination shows severe weakness in thigh adduction and numbness over the mid-medial thigh. Which nerve was injured?", "top": true, "rep": "", "tag": "Final bank ANA Q114", "bank": true, "expl": "Obturator nerve injury causes loss of adduction of the thigh with sensory loss on the medial thigh. Femoral nerve injury would instead weaken hip flexion and knee extension, with sensory loss on the anterior thigh and medial leg.", "type": "mcq", "opts": ["Femoral nerve", "Obturator nerve", "Sciatic nerve", "Genitofemoral nerve"], "ans": 1}, "Y26-031": {"id": "Y26-031", "stem": "A 28-year-old unrestrained driver is involved in a high-speed motor vehicle collision and suffers a posterior dislocation of the right hip joint. On examination, he shows marked weakness in knee flexion and complete paralysis of all movements at the ankle and foot. Sensation is preserved ONLY on the medial side of his leg. Which nerve is injured?", "top": true, "rep": "", "tag": "Final bank ANA Q115", "bank": true, "expl": "Posterior hip dislocation can impinge the sciatic nerve, causing weak knee flexion, paralysis of most muscles below the knee and sensory loss over most of the leg and foot except the medial side, which is supplied by the saphenous nerve. A tibial nerve injury would leave dorsiflexion and eversion, which belong to the fibular nerves.", "type": "mcq", "opts": ["Femoral nerve", "Tibial nerve", "Sciatic nerve", "Obturator nerve", "Inferior gluteal nerve"], "ans": 2}, "Y26-032": {"id": "Y26-032", "stem": "A 32-year-old athlete sustains a deep laceration inside the popliteal fossa during an accident. Examination reveals that the patient is unable to plantarflex the foot or flex the toes. Dorsiflexion and eversion of the foot remain normal. Which nerve has been severed?", "top": true, "rep": "", "tag": "Final bank ANA Q116", "bank": true, "expl": "The tibial nerve descends through the popliteal fossa and supplies the posterior muscles of the leg, so its injury weakens plantar flexion and flexion of the digits. A common fibular nerve injury would instead cause loss of dorsiflexion (foot drop) and loss of eversion.", "type": "mcq", "opts": ["Common fibular nerve", "Deep fibular nerve", "Superficial fibular nerve", "Tibial nerve", "Saphenous nerve"], "ans": 3}, "Q0105": {"id": "Q0105", "stem": "A 22-year-old football player sustains a direct blow to the lateral side of his knee, resulting in a fracture of the neck of the fibula. On examination, he presents with \"foot drop,\" lifting his knee high while walking to clear his toes off the ground (steppage gait). Which nerve is most susceptible to injury at this anatomical site?", "top": true, "rep": "asked 3 years", "tag": "Final bank ANA Q117", "bank": true, "expl": "The common fibular nerve winds laterally around the neck of the fibula, where it is vulnerable to injury; loss of dorsiflexion gives foot drop with a steppage gait. The tibial nerve runs through the popliteal fossa and on the posterior surface of popliteus, away from the fibular neck.", "img": ["figs/Q0105.jpg"], "cap": "The patient walking (still from the clip on the case slide).", "type": "mcq", "opts": ["Tibial nerve", "Femoral nerve", "Common fibular (peroneal) nerve", "Obturator nerve", "Saphenous nerve"], "ans": 2}, "Y26-033": {"id": "Y26-033", "stem": "A patient with a tight leg cast applied below the knee develops weakness of foot dorsiflexion and sensory impairment. On physical exam, sensation is completely preserved over the entire leg and dorsum of the foot, EXCEPT for an isolated triangular area of skin between the 1st and 2nd toes (first web space). Which specific nerve branch is involved?", "top": true, "rep": "", "tag": "Final bank ANA Q118", "bank": true, "expl": "The medial branch of the deep fibular nerve supplies the skin on the adjacent sides of the first and second toes, and deep fibular injury causes loss of dorsiflexion. The superficial fibular nerve supplies the lateral lower leg and the dorsum of the foot except the first web space, so it is not the nerve here.", "type": "mcq", "opts": ["Superficial fibular nerve", "Deep fibular nerve", "Tibial nerve", "Lateral sural cutaneous nerve", "Saphenous nerve"], "ans": 1}, "Q0116": {"id": "Q0116", "stem": "A 60-year-old female presents with an abnormal gait following a total hip arthroplasty. When she stands on her left leg and lifts her right foot off the ground, her right side of the pelvis sags downward. Which nerve was injured during the surgical approach?", "top": true, "rep": "asked 3 years", "tag": "Final bank ANA Q119", "bank": true, "expl": "When the right foot is lifted and the right pelvis falls, the left superior gluteal nerve is damaged: the damaged nerve is on the opposite side to the pelvis that falls. The right superior gluteal nerve is the tempting distractor; its injury makes the left pelvis fall when the left foot is lifted.", "type": "mcq", "opts": ["Right superior gluteal nerve", "Left superior gluteal nerve", "Left inferior gluteal nerve", "Right obturator nerve", "Left femoral nerve"], "ans": 1}, "Q0117": {"id": "Q0117", "stem": "After an obturator nerve injury, which of the following muscles keeps part of its nerve supply, because one portion of it is also supplied by the tibial division of the sciatic nerve?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q123", "bank": true, "expl": "Adductor magnus has two nerve supplies: its anterior portion from the obturator nerve and its posterior (ischial, hamstring) portion from the tibial division of the sciatic nerve. Adductor brevis is the tempting distractor, but both of its supplying branches belong to the obturator nerve, so it is lost with it.", "type": "mcq", "opts": ["Gracilis", "Adductor magnus", "Sartorius", "Adductor longus", "Adductor brevis"], "ans": 1}, "Q0119": {"id": "Q0119", "stem": "Injury to the tibial nerve in the popliteal fossa might result in which of the following?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q124", "bank": true, "expl": "Tibial nerve injury causes weakness of plantar flexion (with weak knee flexion and weakened inversion), so standing on the toes becomes difficult. Foot drop and loss of eversion are fibular nerve deficits, and the dorsum of the foot and the skin between the first and second toes are supplied by the superficial and deep fibular nerves.", "type": "mcq", "opts": ["Loss of eversion", "Diminished sensation on the dorsum of the foot", "Difficulty standing on the toes", "Foot drop", "Loss of sensation between the great and second toes"], "ans": 2}, "Q0120": {"id": "Q0120", "stem": "The major cutaneous innervation of the medial side of the leg is provided by which nerve?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q125", "bank": true, "expl": "The saphenous nerve, a branch of the femoral nerve, supplies the medial aspects of the knee and lower leg, which is why the medial leg keeps sensation in sciatic nerve injury. The lateral sural cutaneous nerve supplies the lateral part of the back of the leg, and the superficial fibular nerve the lateral side of the lower leg and the dorsum of the foot.", "type": "mcq", "opts": ["Obturator", "Lateral sural cutaneous", "Superficial fibular (peroneal)", "Saphenous", "Medial sural cutaneous"], "ans": 3}, "Q0121": {"id": "Q0121", "stem": "Which of the following statements concerning the inferior gluteal nerve is correct?", "top": false, "rep": "asked 2 years", "tag": "Final bank ANA Q126", "bank": true, "expl": "The inferior gluteal nerve (posterior divisions of L5–S2) supplies gluteus maximus, which extends the hip and laterally rotates the thigh. Stabilizing the pelvis during gait and supplying tensor fasciae latae belong to the superior gluteal nerve, L2–L3 is the lateral femoral cutaneous nerve, and gemellus inferior is supplied by the nerve to inferior gemellus and quadratus femoris.", "type": "mcq", "opts": ["It contains fibres from the second and third lumbar nerves", "It innervates the gluteus maximus muscle", "It must be intact to resist pelvic tilt during gait", "It innervates the tensor fasciae latae muscle", "It innervates the gemellus inferior muscle"], "ans": 1}, "Q0171": {"id": "Q0171", "stem": "If the superior gluteal nerve is injured, which of the following muscles will escape paralysis?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q122", "bank": true, "expl": "The superior gluteal nerve supplies gluteus medius, gluteus minimus and tensor fasciae latae, so all three are paralysed when it is injured. Gluteus maximus is supplied by the inferior gluteal nerve and escapes, so the four muscles are not all paralysed.", "type": "mcq", "opts": ["Gluteus minimus", "Tensor fasciae latae", "Gluteus medius", "Gluteus maximus", "The four muscles will be paralysed"], "ans": 3}, "N-ANA-L9-01": {"id": "N-ANA-L9-01", "stem": "While dissecting the lumbosacral plexus, a student traces a nerve formed by the posterior divisions of the ventral rami of L2–L4. Which of the following muscles does this nerve supply?", "top": false, "rep": "", "tag": "Final bank ANA Q127", "bank": true, "expl": "The posterior divisions of L2–L4 form the femoral nerve, which supplies iliacus in the abdomen and sartorius and quadriceps femoris in the thigh. Adductor longus and gracilis are supplied by the obturator nerve, which has the same roots but comes from the anterior divisions.", "type": "mcq", "opts": ["Iliacus and quadriceps femoris", "Adductor longus and gracilis", "Gluteus medius and gluteus minimus", "Short head of biceps femoris", "Fibularis longus and fibularis brevis"], "ans": 0}, "N-ANA-L9-02": {"id": "N-ANA-L9-02", "stem": "A 35-year-old man is stabbed in the front of the groin, just below the inguinal ligament. On examination, flexion of his hip and extension of his knee are both weak. Which of the following additional findings is most likely?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Weak hip flexion and knee extension after a wound below the inguinal ligament point to the femoral nerve, whose injury may also abolish the knee-jerk (patellar) reflex. Loss of thigh adduction and sensory loss on the medial thigh are features of obturator nerve injury.", "type": "mcq", "opts": ["Absent knee-jerk (patellar) reflex", "Loss of adduction of the thigh", "Foot drop with a steppage gait", "Sensory loss confined to the medial side of the thigh", "Trendelenburg gait"], "ans": 0}, "N-ANA-L9-03": {"id": "N-ANA-L9-03", "stem": "A 40-year-old man's lower limb is faultily positioned during a long operation under anaesthesia. Afterwards he has weak thigh extension, weak knee flexion, foot drop and loss of plantar flexion. Sensation is most likely preserved over which area?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Faulty positioning during anaesthesia is an iatrogenic cause of sciatic nerve injury, which causes sensory loss over most of the leg and foot. The medial side of the leg and foot is spared because it is supplied by the saphenous nerve, a branch of the femoral nerve.", "type": "mcq", "opts": ["Medial side of the leg and foot", "Lateral side of the lower leg and dorsum of the foot", "Heel and sole", "Lateral part of the back of the leg", "Adjacent sides of the first and second toes"], "ans": 0}, "N-ANA-L9-04": {"id": "N-ANA-L9-04", "stem": "A nurse receives training on administering intramuscular injections into the gluteal region. To prevent iatrogenic injury to the main trunk of the sciatic nerve, which quadrant of the buttock is safest for performing deep intramuscular injections?", "top": true, "rep": "", "tag": "Final bank ANA Q120", "bank": true, "expl": "The upper lateral (outer) quadrant of the buttock is the injection site, away from the usual course of the sciatic nerve; the other three quadrants are marked unsafe. Injection of neurotoxic substances is one of the iatrogenic causes of sciatic nerve injury.", "type": "mcq", "opts": ["Upper inner (superomedial) quadrant", "Upper outer (superolateral) quadrant", "Lower inner (inferomedial) quadrant", "Lower outer (inferolateral) quadrant", "Central gluteal region"], "ans": 1}, "N-ANA-L9-05": {"id": "N-ANA-L9-05", "stem": "A 28-year-old man has a deep wound of the front of the leg. Afterwards he cannot dorsiflex his foot or extend his toes, and he walks with a steppage gait. Eversion of the foot is normal. Which nerve is most likely injured?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Loss of dorsiflexion (foot drop) with a steppage gait and loss of extension of the digits are deficits of the deep fibular nerve, which supplies the anterior compartment of the leg. A common fibular nerve injury would add loss of eversion from the superficial fibular nerve, and eversion is normal here.", "type": "mcq", "opts": ["Deep fibular nerve", "Superficial fibular nerve", "Common fibular nerve", "Tibial nerve", "Sciatic nerve"], "ans": 0}, "N-ANA-L9-06": {"id": "N-ANA-L9-06", "stem": "A 25-year-old footballer injures his superficial fibular nerve. He cannot evert his foot and has sensory loss over the anterolateral leg and dorsum of the foot, but sensation in the first web space is normal. This web space is supplied by which nerve?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The medial branch of the deep fibular nerve accompanies the dorsalis pedis artery to supply the skin on the adjacent sides of the first and second toes, so the first web space is spared in superficial fibular nerve injury. The lateral branch supplies muscles (extensor hallucis brevis and extensor digitorum brevis), not this skin.", "type": "mcq", "opts": ["Medial branch of the deep fibular nerve", "Lateral branch of the deep fibular nerve", "Saphenous nerve", "Calcaneal branch of the tibial nerve", "Lateral sural cutaneous nerve"], "ans": 0}, "N-ANA-L9-07": {"id": "N-ANA-L9-07", "stem": "A 52-year-old male with severe lumbar radiculopathy presents with a characteristic \"waddling gait\" (swaying from side to side with every step taken). Physical exam confirms bilateral weakness of hip abduction. Which nerve roots and nerve pathway are bilaterally involved in this patient's clinical presentation?", "top": true, "rep": "", "tag": "Final bank ANA Q121", "bank": true, "expl": "Bilateral affection of the superior gluteal nerves (L4–S1, entering the buttock through the greater sciatic foramen above the piriformis) weakens hip abduction and causes a waddling (swaying) gait. The inferior gluteal nerve supplies gluteus maximus, which extends the hip, so its injury does not weaken abduction.", "type": "mcq", "opts": ["Superior gluteal nerve (L4–S1) emerging above piriformis", "Inferior gluteal nerve (L5–S2) emerging below piriformis", "Femoral nerve (L2–L4) emerging lateral to psoas", "Obturator nerve (L2–L4) emerging medial to psoas", "Sciatic nerve (L4–S3) exiting via greater sciatic foramen"], "ans": 0}, "N-ANA-L9-08": {"id": "N-ANA-L9-08", "stem": "After a pelvic injury, a 45-year-old woman cannot adduct her thigh and has sensory loss on the medial side of the thigh. By which route does the injured nerve enter the thigh?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Loss of thigh adduction with sensory loss on the medial thigh indicates obturator nerve injury; this nerve emerges from the medial side of psoas major, passes deep to the obturator foramen and then enters the adductor compartment. Passing deep to the inguinal ligament, lateral to the femoral sheath, is the route of the femoral nerve.", "type": "mcq", "opts": ["Deep to the obturator foramen, then into the adductor compartment", "Deep to the inguinal ligament, lateral to the femoral sheath", "Through the greater sciatic foramen, above the piriformis", "Through the greater sciatic foramen, inferior to the piriformis"], "ans": 0}, "N-ANA-L9-09": {"id": "N-ANA-L9-09", "stem": "A patient has weakness of extension of the hip and of lateral rotation of the thigh. Abduction of the hip is normal, and he can keep his pelvis level when standing on one leg. Which nerve is most likely injured?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The inferior gluteal nerve (L5–S2) supplies gluteus maximus, whose actions are extension of the hip and lateral rotation of the thigh. The nerve to inferior gemellus and quadratus femoris also gives lateral rotation but not hip extension, and the superior gluteal nerve abducts the hip and stabilizes the pelvis.", "type": "mcq", "opts": ["Inferior gluteal nerve", "Superior gluteal nerve", "Nerve to inferior gemellus and quadratus femoris", "Femoral nerve", "Obturator nerve"], "ans": 0}, "N-ANA-L9-10": {"id": "N-ANA-L9-10", "stem": "Which of the following nerves is a branch of the lumbar part of the lumbosacral plexus?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The lumbar part gives the iliohypogastric, ilioinguinal, genitofemoral, lateral femoral cutaneous, obturator and femoral nerves ('I'm Interesting getting Lunch On Friday'). The pudendal, posterior femoral cutaneous and gluteal nerves come from the sacral part (SIPPS).", "type": "mcq", "opts": ["Genitofemoral nerve", "Pudendal nerve", "Posterior femoral cutaneous nerve", "Superior gluteal nerve", "Inferior gluteal nerve"], "ans": 0}, "N-ANA-L9-11": {"id": "N-ANA-L9-11", "stem": "A deep wound in the upper part of the back of the thigh cuts the common fibular division of the sciatic nerve, but the tibial division is intact. Which thigh muscle is paralysed?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In the thigh, the common fibular division of the sciatic nerve supplies only the short head of biceps femoris. The long head of biceps femoris, semitendinosus, semimembranosus and the ischial part of adductor magnus are supplied by the tibial division.", "type": "mcq", "opts": ["Short head of biceps femoris", "Long head of biceps femoris", "Semitendinosus", "Semimembranosus", "Ischial (hamstring) part of adductor magnus"], "ans": 0}, "N-ANA-L9-12": {"id": "N-ANA-L9-12", "stem": "During an operation deep to the flexor retinaculum, a surgeon identifies the two terminal branches of the tibial nerve. Which are they?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The tibial nerve terminates deep to the flexor retinaculum by dividing into the medial and lateral plantar nerves. The deep and superficial fibular nerves are the terminal branches of the common fibular nerve, which divides in the substance of fibularis longus.", "type": "mcq", "opts": ["Medial and lateral plantar nerves", "Deep and superficial fibular nerves", "Medial and lateral sural cutaneous nerves", "Medial and lateral branches of the deep fibular nerve", "Anterior and posterior branches"], "ans": 0}, "N-ANA-L9-13": {"id": "N-ANA-L9-13", "stem": "A 22-year-old footballer receives a blow to the lateral side of the knee that fractures the neck of the fibula. Afterwards his foot drops when he walks, and he cannot evert it.\n(a) Which nerve is injured, and why is it vulnerable at this site?\n(b) Describe the course of this nerve from the popliteal fossa to its division.\n(c) Mention the motor and sensory deficits of this injury, grouped under the two terminal branches of the nerve, and name the resulting gait.", "top": false, "rep": "", "tag": "Final bank ANA W42", "bank": true, "expl": "A fibular neck fracture injures the common fibular nerve, combining deep fibular deficits (foot drop, steppage gait) with superficial fibular deficits (loss of eversion). Mnemonic: Superficial → Side (eversion); Deep → Dorsiflexion.", "type": "written", "keyhtml": "(a) Common fibular (peroneal) nerve (L4–S2). It winds laterally around the neck of the fibula, where it is vulnerable to injury and can also be palpated; a broken fibula can damage it.\n(b) Descends through the popliteal fossa → passes behind the head of the fibula → winds laterally around the neck of the fibula → pierces fibularis longus, where it divides into the deep fibular and superficial fibular nerves. Cutaneous branch: lateral sural cutaneous nerve (skin of the lateral part of the back of the leg).\n(c) Injury produces a combination of the deficits of deep and superficial fibular nerve lesions:\n• Deep fibular nerve (anterior compartment of the leg): loss of dorsiflexion (foot drop) → steppage gait; loss of extension of the digits; weakened inversion\n• Superficial fibular nerve (lateral compartment: fibularis longus and brevis): loss of eversion of the foot; sensory loss on the anterolateral leg and dorsum of the foot (the first web space is not part of this loss: its skin, the adjacent sides of the first and second toes, is supplied by the medial branch of the deep fibular nerve)"}, "N-ANA-L9-14": {"id": "N-ANA-L9-14", "stem": "Compare the femoral and obturator nerves regarding: root value and divisions, relation to psoas major, entry into the thigh, muscles supplied, and effects of injury.", "top": false, "rep": "", "tag": "Final bank ANA W43", "bank": true, "expl": "Both nerves come from L2–L4: the femoral nerve (posterior divisions, lateral to psoas) serves the front of the thigh, and the obturator nerve (anterior divisions, medial to psoas) serves the inner thigh.", "type": "written", "keyhtml": "• Root value: femoral L2, 3, 4 | obturator L2, 3, 4\n• Divisions: femoral — posterior divisions | obturator — anterior divisions\n• Psoas major: femoral emerges from its lateral side | obturator emerges from its medial side\n• Entry into the thigh: femoral — deep to the inguinal ligament, lateral to the femoral sheath | obturator — deep to the obturator foramen, then into the adductor (medial) compartment\n• Muscles: femoral — iliacus (in the abdomen); sartorius and quadriceps femoris (anterior compartment of the thigh); gives the saphenous nerve (medial aspects of the knee and lower leg) | obturator — anterior branch: adductor longus, adductor brevis, gracilis; posterior branch: obturator externus, adductors brevis and magnus\n• Actions: femoral — extend knee, flex hip | obturator — adduct and medially rotate the thigh\n• Injury: femoral — weakened hip flexion, weakened knee extension, knee-jerk (patellar) reflex may be absent, sensory loss on the anterior thigh, medial leg and foot | obturator — loss of adduction of the thigh, sensory loss on the medial thigh\n(Mnemonic: Femoral → Front; Obturator → inner thigh)"}, "N-ANA-L9-15": {"id": "N-ANA-L9-15", "stem": "A 30-year-old man has a posterior dislocation of the hip in a road traffic accident. Later he has weakness of knee flexion, foot drop and loss of plantar flexion, but sensation on the medial side of his leg and foot is normal.\n(a) Which nerve is injured? Mention its root value, how it enters the buttock and where it divides.\n(b) Mention the muscles supplied by each of its two divisions in the thigh.\n(c) Why is sensation on the medial side of the leg and foot preserved?\n(d) Enumerate four other causes of injury to this nerve, and name the safe site for an intramuscular injection in the buttock.", "top": false, "rep": "", "tag": "Final bank ANA W44", "bank": true, "expl": "Posterior hip dislocation can impinge the sciatic nerve, giving weak thigh extension and knee flexion, foot drop and loss of plantar flexion. The medial leg and foot keep sensation because the saphenous nerve (femoral) supplies them.", "type": "written", "keyhtml": "(a) Sciatic nerve: the largest nerve in the body, root value L4–S3 (the tibial and common fibular nerves in a common connective tissue sheath). It enters the buttock through the greater sciatic foramen inferior to the piriformis and divides at the mid-thigh into the tibial and common fibular nerves. Impingement of the sciatic nerve is a complication of posterior hip dislocation.\n(b) • Tibial division: the hamstrings — semitendinosus, semimembranosus, long head of biceps femoris — and the ischial (hamstring) part of adductor magnus\n• Common fibular division: the short head of biceps femoris\n(Injury therefore causes weakness of thigh extension, weakness or loss of knee flexion, and paralysis of most muscles below the knee → foot drop and loss of plantar flexion.)\n(c) The medial side of the leg and foot is supplied by the saphenous nerve, a branch of the femoral nerve, so it escapes the sensory loss that covers most of the leg and foot.\n(d) Any four of: acetabular fracture (trauma); iatrogenic causes — direct surgical trauma; faulty positioning during anaesthesia; injection of neurotoxic substances; tourniquets; dressings, casts or faulty fitting orthotics. Safe injection site: the upper lateral (outer) quadrant of the buttock, away from the usual course of the sciatic nerve (the other three quadrants are marked as unsafe)."}, "N-ANA-L9-16": {"id": "N-ANA-L9-16", "stem": "A patient is examined from behind while raising each foot off the ground. When she raises her left foot, the left side of her pelvis falls.\n(a) Which nerve is damaged, and on which side?\n(b) Mention the root value of this nerve, how it enters the buttock and the muscles it supplies.\n(c) What is the motor deficit, and what is the resulting gait called?\n(d) What gait results if this nerve is injured on both sides?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The superior gluteal nerve keeps the pelvis level through gluteus medius, minimus and tensor fasciae latae; its injury gives a Trendelenburg gait, with the damaged nerve opposite the falling pelvis, and bilateral injury gives a waddling gait.", "type": "written", "keyhtml": "(a) The right superior gluteal nerve: the damaged nerve is on the opposite side to the pelvis that falls (left foot lifted, left pelvis falls → right superior gluteal nerve).\n(b) Root value L4–S1 (posterior divisions); arises from the sacral plexus; enters the buttock through the greater sciatic foramen above the piriformis; passes between gluteus medius and minimus, dividing into numerous branches. Supplies gluteus medius, gluteus minimus and tensor fasciae latae (stabilize the pelvis, abduct the hip).\n(c) Weakness in abduction of the hip; the patient cannot keep the pelvis level when standing on one leg. Sign: Trendelenburg gait.\n(d) Waddling (swaying) gait."}, "N-ANA-L9-17": {"id": "N-ANA-L9-17", "stem": "Enumerate the branches of the lumbar and sacral parts of the lumbosacral plexus, and mention the origin (roots and divisions) of the femoral, obturator, tibial and common fibular nerves.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Femoral and obturator share L2–L4 (posterior vs anterior divisions), and tibial and common fibular share the sciatic sheath (anterior L4–S3 vs posterior L4–S2).", "type": "written", "keyhtml": "Lumbosacral plexus: formed by the ventral rami of L2–S4; gives the motor and sensory supply of the lower limb.\nLumbar part (roots L2–4, within psoas major): iliohypogastric, ilioinguinal, genitofemoral, lateral femoral cutaneous, obturator and femoral nerves (mnemonic: 'I'm Interesting getting Lunch On Friday').\nSacral part (roots L4–S4, on the posterior pelvic wall): superior gluteal, inferior gluteal, sciatic, tibial, common fibular, posterior femoral cutaneous and pudendal nerves (mnemonic: SIPPS).\nLumbosacral trunk: branch of L4 + L5; joins S1–3 to form the sciatic nerve.\nOrigins:\n• Femoral: posterior divisions of L2–L4\n• Obturator: anterior divisions of L2–L4\n• Tibial: anterior divisions of L4–S3\n• Common fibular: posterior divisions of L4–S2\n(The tibial and common fibular nerves travel together in a common connective tissue sheath as the sciatic nerve.)"}, "TP-003": {"id": "TP-003", "stem": "A young adult was diagnosed with piriformis muscle syndrome, in which the hypertrophied muscle compresses the other structures passing through the greater sciatic foramen. Mention two other structures passing through this foramen.", "top": true, "rep": "", "tag": "Final bank ANA W59", "bank": true, "expl": "Both nerves enter the buttock through the greater sciatic foramen: the superior gluteal nerve above the piriformis and the sciatic nerve inferior to it.", "type": "written", "keyhtml": "• Sciatic nerve: enters the buttock through the greater sciatic foramen inferior to the piriformis.\n• Superior gluteal nerve: enters the buttock through the greater sciatic foramen above the piriformis."}, "TP-081": {"id": "TP-081", "stem": "A 45-year-old man is brought to the emergency department after a motorcycle accident. Physical examination reveals a deep laceration in the upper anterior thigh, near the inguinal region. He cannot straighten his left knee and has difficulty walking. On examination there is weakness or inability to extend the knee, difficulty climbing stairs and rising from a seated position, and sensory loss over the anterior thigh and medial side of the leg.\na) What nerve is most likely injured?\nb) Which muscle group is primarily affected?\nc) Name the root value of this nerve.", "top": true, "rep": "", "tag": "Final bank ANA W60", "bank": true, "expl": "Femoral nerve injury weakens knee extension (and hip flexion) and causes sensory loss on the anterior thigh, medial leg and foot (the medial leg through its saphenous branch). The obturator nerve shares the same roots (L2–L4, anterior divisions) but supplies the adductors and the skin of the medial thigh.", "type": "written", "keyhtml": "a) Femoral nerve.\nb) The muscles of the anterior compartment of the thigh, mainly the quadriceps femoris (the knee extensors); the femoral nerve also supplies sartorius.\nc) L2, 3, 4 (posterior divisions)."}}, "labs": {"sl76": {"id": "sl76", "type": "slide", "title": "Hip & thigh · slide 21", "img": "prac/s076.jpg", "labels": [{"t": "Femoral nerve", "x": 41.38, "y": 15.73, "w": 10.98, "h": 3.33, "id": "l0", "nv": {"name": "Femoral nerve", "own": ["Iliacus", "Sartorius", "Rectus femoris", "Vastus medialis", "Vastus lateralis", "Vastus intermedius"], "via": []}}, {"t": "Femoral artery", "x": 42.63, "y": 27.95, "w": 11.22, "h": 3.33, "id": "l1"}, {"t": "Femoral vein", "x": 43.26, "y": 34.62, "w": 9.81, "h": 3.33, "id": "l2"}, {"t": "Femoral sheath", "x": 53.26, "y": 78.17, "w": 15.68, "h": 4.44, "id": "l3"}], "src": "From the practical slides · Practical 3 – Hip & thigh", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl93": {"id": "sl93", "type": "slide", "title": "Leg, foot & vertebral column · slide 14", "img": "prac/s093.jpg", "labels": [{"t": "Superior gluteal nerve", "x": 18.49, "y": 15.07, "w": 13.13, "h": 2.6, "id": "l0", "nv": {"name": "Superior gluteal nerve", "own": ["Gluteus medius", "Gluteus minimus", "Tensor fasciae latae"], "via": []}}, {"t": "Inferior gluteal nerve", "x": 58.99, "y": 29.17, "w": 12.46, "h": 2.6, "id": "l1", "nv": {"name": "Inferior gluteal nerve", "own": ["Gluteus maximus"], "via": []}}, {"t": "Sciatic nerve", "x": 61.58, "y": 60.25, "w": 7.46, "h": 2.6, "id": "l2", "nv": {"name": "Sciatic nerve", "own": ["Semitendinosus", "Semimembranosus", "Biceps femoris (long head)", "Adductor magnus", "Biceps femoris (short head)"], "via": [["Tibial", ["Gastrocnemius", "Soleus", "Plantaris", "Popliteus", "Flexor hallucis longus", "Flexor digitorum longus", "Tibialis posterior"]], ["Deep peroneal (fibular)", ["Tibialis anterior", "Extensor hallucis longus", "Extensor digitorum longus", "Fibularis (peroneus) tertius"]], ["Superficial peroneal (fibular)", ["Fibularis (peroneus) longus", "Fibularis (peroneus) brevis"]]]}}, {"t": "Posterior cutaneous nerve of the thigh", "x": 22.39, "y": 75.21, "w": 11.86, "h": 5.71, "id": "l3"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl95": {"id": "sl95", "type": "slide", "title": "Leg, foot & vertebral column · slide 16", "img": "prac/s095.jpg", "labels": [{"t": "Sciatic nerve", "x": 69.12, "y": 5.98, "w": 7.46, "h": 2.6, "id": "l0", "nv": {"name": "Sciatic nerve", "own": ["Semitendinosus", "Semimembranosus", "Biceps femoris (long head)", "Adductor magnus", "Biceps femoris (short head)"], "via": [["Tibial", ["Gastrocnemius", "Soleus", "Plantaris", "Popliteus", "Flexor hallucis longus", "Flexor digitorum longus", "Tibialis posterior"]], ["Deep peroneal (fibular)", ["Tibialis anterior", "Extensor hallucis longus", "Extensor digitorum longus", "Fibularis (peroneus) tertius"]], ["Superficial peroneal (fibular)", ["Fibularis (peroneus) longus", "Fibularis (peroneus) brevis"]]]}}, {"t": "Piriformis", "x": 52.62, "y": 9.11, "w": 5.72, "h": 2.6, "id": "l1", "mu": "pir"}, {"t": "Piriformis", "x": 26.31, "y": 18.09, "w": 5.72, "h": 2.6, "id": "l2", "mu": "pir"}, {"t": "Adductor brevis", "x": 64.53, "y": 42.05, "w": 9.38, "h": 2.6, "id": "l3", "mu": "ab"}, {"t": "Tibial nerve", "x": 46.58, "y": 69.08, "w": 6.91, "h": 2.6, "id": "l4", "nv": {"name": "Tibial nerve", "own": ["Gastrocnemius", "Soleus", "Plantaris", "Popliteus", "Flexor hallucis longus", "Flexor digitorum longus", "Tibialis posterior"], "via": []}}, {"t": "Common fibular (peroneal)", "x": 66.08, "y": 66.55, "w": 9.58, "h": 5.71, "id": "l5"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "act": {"muscles": {"pir": {"name": "Piriformis", "nerves": ["s12"], "moves": ["hlr"], "note": "Rotates the thigh laterally; ventral rami of S1 & S2."}, "ab": {"name": "Adductor brevis", "nerves": ["obt"], "moves": ["hadd", "hflex"], "note": "Adducts & flexes the thigh."}}, "nerves": [{"id": "obt", "name": "Obturator"}, {"id": "s12", "name": "Ventral rami S1–S2"}], "moves": [{"id": "hflex", "name": "Hip flexion"}, {"id": "hadd", "name": "Hip adduction"}, {"id": "hlr", "name": "Lateral rotation of thigh"}], "par": {}}, "intro": "A real practical slide. Tap a muscle for its action and nerve, light up a movement, or cut a nerve. \"Test me\" and \"Find it\" quiz you on the labels."}, "sl96": {"id": "sl96", "type": "slide", "title": "Leg, foot & vertebral column · slide 17", "img": "prac/s096.jpg", "labels": [{"t": "Tibial nerve", "x": 48.88, "y": 5.98, "w": 6.91, "h": 2.6, "id": "l0", "nv": {"name": "Tibial nerve", "own": ["Gastrocnemius", "Soleus", "Plantaris", "Popliteus", "Flexor hallucis longus", "Flexor digitorum longus", "Tibialis posterior"], "via": []}}, {"t": "Lateral plantar n.", "x": 48.87, "y": 57.21, "w": 10.07, "h": 2.6, "id": "l1"}, {"t": "Medial plantar n.", "x": 78.39, "y": 66.31, "w": 10.15, "h": 2.6, "id": "l2"}, {"t": "Medial sural n.", "x": 16.18, "y": 86.05, "w": 8.77, "h": 2.6, "id": "l3"}], "src": "From the practical slides · Practical 4 – Leg, foot & vertebral column", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "ANA-L9-001", "text": "The lumbosacral plexus is formed by the {{c1::ventral rami of L2–S4}} spinal nerves and gives the {{c2::motor and sensory}} innervation of the lower limb", "extra": "", "sec": "Part 01 · Lumbosacral plexus — definition & lecture map"}, {"id": "ANA-L9-002", "text": "Lumbar part of the lumbosacral plexus: roots {{c1::L2–4}}, located {{c2::within psoas major}}", "extra": "", "sec": "Part 01 · Lumbosacral plexus — definition & lecture map"}, {"id": "ANA-L9-003", "text": "Sacral part of the lumbosacral plexus: roots {{c1::L4–S4}}, lying on the {{c2::posterior pelvic wall}}", "extra": "", "sec": "Part 01 · Lumbosacral plexus — definition & lecture map"}, {"id": "ANA-L9-004", "text": "Lumbosacral trunk = a branch of {{c1::L4}} + {{c2::L5}}; it joins {{c3::S1–3}} to form the {{c4::sciatic nerve}}", "extra": "", "sec": "Part 01 · Lumbosacral plexus — definition & lecture map"}, {"id": "ANA-L9-005", "text": "Femoral nerve: {{c1::posterior::anterior or posterior}} divisions of L2–L4; obturator nerve: {{c2::anterior::anterior or posterior}} divisions of L2–L4", "extra": "Exam trap: same roots — only the divisions differ.", "sec": "Part 01 · 1.1 The major terminal nerves of the plexus"}, {"id": "ANA-L9-006", "text": "Tibial nerve: {{c1::anterior::anterior or posterior}} divisions of {{c2::L4–S3}}; common fibular nerve: {{c3::posterior::anterior or posterior}} divisions of {{c4::L4–S2}}", "extra": "", "sec": "Part 01 · 1.1 The major terminal nerves of the plexus"}, {"id": "ANA-L9-007", "text": "The tibial and common fibular nerves travel together through the gluteal region and thigh in a {{c1::common connective tissue sheath}}; together they are called the {{c2::sciatic}} nerve", "extra": "", "sec": "Part 01 · 1.1 The major terminal nerves of the plexus"}, {"id": "ANA-L9-008", "text": "Superior gluteal nerve: posterior divisions of {{c1::L4–S1}}; inferior gluteal nerve: posterior divisions of {{c2::L5–S2}}", "extra": "", "sec": "Part 01 · 1.1 The major terminal nerves of the plexus"}, {"id": "ANA-L9-009", "text": "Branches of the lumbar part of the plexus: {{c1::iliohypogastric}} · {{c2::ilioinguinal}} · {{c3::genitofemoral}} · {{c4::lateral femoral cutaneous}} · {{c5::obturator}} · {{c6::femoral}}", "extra": "I'm Interesting getting Lunch On Friday.", "sec": "Part 01 · 1.2 Branches of the lumbar and sacral parts"}, {"id": "ANA-L9-010", "text": "Branches of the sacral part of the plexus: {{c1::superior gluteal}} · {{c2::inferior gluteal}} · {{c3::pudendal}} · {{c4::posterior femoral cutaneous}} · {{c5::sciatic}} (→ tibial + common fibular)", "extra": "Mnemonic: SIPPS.", "sec": "Part 01 · 1.2 Branches of the lumbar and sacral parts"}, {"id": "ANA-L9-011", "text": "Femoral nerve — primary actions: {{c1::extend knee}} & {{c2::flex hip}}", "extra": "", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-012", "text": "Obturator nerve — supplies the {{c1::medial compartment of the thigh}}; primary actions: {{c2::adduct and medially rotate the thigh}}", "extra": "", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-013", "text": "Tibial nerve — primary actions: {{c1::flex knee}} · {{c2::extend thigh}} · {{c3::plantar flex foot}} · {{c4::flex digits}} · {{c5::inversion}}", "extra": "", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-014", "text": "Tibial nerve supplies: the posterior compartment of the {{c1::thigh}} · the posterior compartment of the {{c2::leg}} · the {{c3::plantar muscles of the foot}}", "extra": "", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-015", "text": "Superficial fibular nerve — supplies the {{c1::lateral compartment of the leg}} (fibularis longus & brevis); primary action: {{c2::eversion}}", "extra": "Superficial → Side.", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-016", "text": "Deep fibular nerve — supplies the {{c1::anterior compartment of the leg}}; primary actions: {{c2::dorsiflex foot}} · {{c3::extend digits}} · {{c4::inversion}}", "extra": "Deep → Dorsiflexion.", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-017", "text": "Root values given with the actions: plantar flexion of the foot = {{c1::S1–2}} (tibial); dorsiflexion of the foot = {{c2::L4–5}} (deep fibular)", "extra": "", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-018", "text": "Inversion is listed under two nerves: the {{c1::tibial}} and the {{c2::deep fibular}}", "extra": "So injury of either one only weakens inversion.", "sec": "Part 02 · 2.1 Terminal nerves of lumbosacral plexus"}, {"id": "ANA-L9-019", "text": "Superior gluteal nerve supplies: {{c1::gluteus medius}} · {{c2::gluteus minimus}} · {{c3::tensor fasciae latae}}", "extra": "", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-020", "text": "Superior gluteal nerve — primary actions: {{c1::stabilize pelvis}} & {{c2::abduct hip}}", "extra": "", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-021", "text": "Inferior gluteal nerve supplies {{c1::gluteus maximus}} → {{c2::extension of hip}} & {{c3::lateral rotation of thigh}}", "extra": "", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-022", "text": "Superior gluteal nerve injury paralyses gluteus medius, gluteus minimus & tensor fasciae latae, but {{c1::gluteus maximus}} escapes — it is supplied by the {{c2::inferior gluteal}} nerve", "extra": "", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-023", "text": "Lateral rotation of the thigh is listed for 3 collateral nerves: {{c1::inferior gluteal}} · nerve to {{c2::superior gemellus & obturator internus}} · nerve to {{c3::inferior gemellus & quadratus femoris}}", "extra": "Exam trap.", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-024", "text": "Root values (posterior divisions) — nerve to superior gemellus & obturator internus: {{c1::L5–S2}}; nerve to inferior gemellus & quadratus femoris: {{c2::L4–S1}}", "extra": "", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-025", "text": "Lateral femoral cutaneous nerve: {{c1::L2–L3}} posterior divisions → skin of the {{c2::anterolateral thigh}}", "extra": "Skin only — no primary action.", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-026", "text": "Posterior femoral cutaneous nerve: {{c1::S1–S2 posterior}} + {{c2::S2–S3 anterior}} divisions → skin of the {{c3::posterior thigh}}", "extra": "The one collateral nerve with both posterior and anterior divisions.", "sec": "Part 02 · 2.2 Collateral nerves of lumbosacral plexus"}, {"id": "ANA-L9-027", "text": "Femoral nerve emerges from the {{c1::lateral::medial or lateral}} side of psoas major; obturator nerve from the {{c2::medial::medial or lateral}} side", "extra": "", "sec": "Part 03 · 3.1 Femoral nerve"}, {"id": "ANA-L9-028", "text": "Femoral nerve enters the thigh by passing deep to the {{c1::inguinal ligament}}, {{c2::lateral to the femoral sheath}}", "extra": "", "sec": "Part 03 · 3.1 Femoral nerve"}, {"id": "ANA-L9-029", "text": "Femoral nerve branches — in the abdomen: {{c1::iliacus}}; in the thigh: muscles of the {{c2::anterior compartment of the thigh}} (sartorius, quadriceps femoris) + the {{c3::saphenous}} nerve", "extra": "", "sec": "Part 03 · 3.1 Femoral nerve"}, {"id": "ANA-L9-030", "text": "The {{c3::saphenous}} nerve, a branch of the {{c1::femoral}} nerve, supplies the skin of the {{c2::medial aspects of the knee and lower leg}}", "extra": "", "sec": "Part 03 · 3.1 Femoral nerve"}, {"id": "ANA-L9-031", "text": "Femoral nerve injury — motor: weakened {{c1::hip flexion}} & weakened {{c2::knee extension}}", "extra": "", "sec": "Part 03 · 3.2 Injury of the femoral nerve"}, {"id": "ANA-L9-032", "text": "Femoral nerve injury: the {{c1::knee-jerk (patellar)}} reflex may be absent", "extra": "", "sec": "Part 03 · 3.2 Injury of the femoral nerve"}, {"id": "ANA-L9-033", "text": "Femoral nerve injury — sensory loss: {{c1::anterior thigh}}, {{c2::medial leg}} and foot", "extra": "", "sec": "Part 03 · 3.2 Injury of the femoral nerve"}, {"id": "ANA-L9-034", "text": "Weak knee extension (the knee 'gives way'), absent patellar reflex, sensory loss on the anterior thigh & medial leg → {{c1::femoral}} nerve injury", "extra": "Femoral → Front.", "sec": "Part 03 · 3.2 Injury of the femoral nerve"}, {"id": "ANA-L9-035", "text": "Obturator nerve enters the thigh by passing deep to the {{c1::obturator foramen}}, then enters the {{c2::adductor}} compartment", "extra": "", "sec": "Part 03 · 3.3 Obturator nerve"}, {"id": "ANA-L9-036", "text": "Obturator nerve — anterior branch: {{c1::adductor longus, adductor brevis, gracilis}}; posterior branch: {{c2::obturator externus, adductor brevis, adductor magnus}}", "extra": "Adductor brevis is listed under both branches.", "sec": "Part 03 · 3.3 Obturator nerve"}, {"id": "ANA-L9-037", "text": "Adductor magnus has two nerve supplies: anterior portion — {{c1::obturator}} nerve; posterior (ischial / hamstring) portion — {{c2::tibial}} division of the sciatic", "extra": "So it keeps part of its supply after obturator nerve injury.", "sec": "Part 03 · 3.3 Obturator nerve"}, {"id": "ANA-L9-038", "text": "Obturator nerve injury: loss of {{c1::adduction of the thigh}} + sensory loss on the {{c2::medial thigh}}", "extra": "Obturator → inner thigh.", "sec": "Part 03 · 3.4 Injury of the obturator nerve"}, {"id": "ANA-L9-039", "text": "Severe weakness of thigh adduction + numbness of the medial thigh → {{c1::obturator}} nerve injury", "extra": "", "sec": "Part 03 · 3.4 Injury of the obturator nerve"}, {"id": "ANA-L9-040", "text": "The sciatic nerve is the {{c1::largest}} nerve in the body; root value {{c2::L4–S3}}", "extra": "", "sec": "Part 04 · Sciatic nerve — definition"}, {"id": "ANA-L9-041", "text": "Both enter the buttock through the {{c1::greater sciatic foramen}}: the superior gluteal nerve {{c2::above::above or below}} the piriformis, the sciatic nerve {{c3::inferior to::above or below}} the piriformis", "extra": "Exam trap.", "sec": "Part 06 · 6.1 Superior gluteal nerve (L4–S1)"}, {"id": "ANA-L9-042", "text": "The sciatic nerve divides at the {{c1::mid-thigh}} into the {{c2::tibial}} and {{c3::common fibular}} nerves", "extra": "", "sec": "Part 04 · Sciatic nerve — definition"}, {"id": "ANA-L9-043", "text": "After the sciatic divides — tibial nerve: runs through the popliteal fossa to disappear {{c1::deep to the gastrocnemius}}; common fibular nerve: runs along the {{c2::medial border of the biceps femoris}}, superficial to the lateral head of gastrocnemius", "extra": "", "sec": "Part 04 · 4.1 Sciatic nerve — course"}, {"id": "ANA-L9-044", "text": "Tibial division of the sciatic supplies the hamstrings: {{c1::semitendinosus}} · {{c2::semimembranosus}} · {{c3::long head of biceps femoris}} · {{c4::ischial part of adductor magnus}}", "extra": "", "sec": "Part 04 · 4.2 Muscles supplied by the two divisions"}, {"id": "ANA-L9-045", "text": "Common fibular division of the sciatic supplies only the {{c1::short head}} of biceps femoris; the long head is from the {{c2::tibial}} division", "extra": "Exam trap.", "sec": "Part 04 · 4.2 Muscles supplied by the two divisions"}, {"id": "ANA-L9-046", "text": "Safe site for deep intramuscular injection in the buttock: the {{c1::upper lateral (outer)}} quadrant — away from the usual course of the {{c2::sciatic}} nerve", "extra": "The other three quadrants carry a red ✗ on the lecture figure.", "sec": "Part 04 · 4.3 The sciatic nerve in the buttock"}, {"id": "ANA-L9-047", "text": "Traumatic causes of sciatic nerve injury: {{c1::hip dislocation}} · {{c2::acetabular fracture}}", "extra": "", "sec": "Part 04 · 4.4 Causes of sciatic nerve injury"}, {"id": "ANA-L9-048", "text": "Iatrogenic causes of sciatic nerve injury: {{c1::direct surgical trauma}} · {{c2::faulty positioning during anaesthesia}} · {{c3::injection of neurotoxic substances}} · {{c4::tourniquets}} · {{c5::dressings, casts or faulty fitting orthotics}}", "extra": "", "sec": "Part 04 · 4.4 Causes of sciatic nerve injury"}, {"id": "ANA-L9-049", "text": "Complications of posterior hip dislocation (lecture figure): {{c1::femoral head and/or acetabulum fracture}} · {{c2::avascular necrosis of the femoral head}} · the {{c3::medial circumflex femoral artery}} · {{c4::impingement of the sciatic nerve}}", "extra": "", "sec": "Part 04 · 4.4 Causes of sciatic nerve injury"}, {"id": "ANA-L9-050", "text": "Sciatic nerve injury — motor: weakness of {{c1::thigh extension}} · weakness or loss of {{c2::knee flexion}} · paralysis of most muscles below the knee → {{c3::foot drop}} & loss of {{c4::plantar flexion}}", "extra": "", "sec": "Part 04 · 4.5 Injury of the sciatic nerve"}, {"id": "ANA-L9-051", "text": "Sciatic nerve injury: sensory loss over most of the leg and foot, except the {{c1::medial side of the leg and foot}} — supplied by the {{c2::saphenous}} nerve", "extra": "Saphenous = branch of the femoral nerve.", "sec": "Part 04 · 4.5 Injury of the sciatic nerve"}, {"id": "ANA-L9-052", "text": "Plantar flexion — tibial nerve injury: {{c1::weakness::weakness or loss}}; sciatic nerve injury: {{c2::loss::weakness or loss}} (with foot drop)", "extra": "Exam trap.", "sec": "Part 04 · 4.5 Injury of the sciatic nerve"}, {"id": "ANA-L9-053", "text": "Posterior hip dislocation → weak knee flexion, paralysis of all ankle & foot movements, sensation kept only on the medial leg → {{c1::sciatic}} nerve injury", "extra": "", "sec": "Part 04 · 4.5 Injury of the sciatic nerve"}, {"id": "ANA-L9-054", "text": "Most common cause of sciatica (lecture figure): a {{c1::bulging or herniated disk}}", "extra": "", "sec": "Part 04 · 4.5 Injury of the sciatic nerve"}, {"id": "ANA-L9-055", "text": "Tibial nerve course: descends through the {{c1::popliteal fossa}}, then lies on the posterior surface of the {{c2::popliteus}} muscle", "extra": "Root value L4–S3.", "sec": "Part 05 · 5.1 Tibial nerve"}, {"id": "ANA-L9-056", "text": "Tibial nerve terminates {{c1::deep to the flexor retinaculum}} by dividing into the {{c2::medial and lateral plantar}} nerves", "extra": "", "sec": "Part 05 · 5.1 Tibial nerve"}, {"id": "ANA-L9-057", "text": "Tibial nerve — muscular branches: to the {{c1::posterior muscles of the leg}}; cutaneous branches: the {{c2::medial sural cutaneous}} nerve and the {{c3::calcaneal}} branch (skin of heel and sole)", "extra": "", "sec": "Part 05 · 5.1 Tibial nerve"}, {"id": "ANA-L9-058", "text": "Tibial nerve injury: weakness in {{c1::flexion of the knee}} · weakness in {{c2::plantar flexion}} · weakened {{c3::inversion}} · sensory loss in the leg (except medial) and the {{c4::plantar foot}}", "extra": "", "sec": "Part 05 · 5.1 Tibial nerve"}, {"id": "ANA-L9-059", "text": "Deep wound in the popliteal fossa → cannot plantar flex the foot or flex the toes, but dorsiflexion & eversion are normal → {{c1::tibial}} nerve", "extra": "Dorsiflexion and eversion belong to the fibular nerves.", "sec": "Part 05 · 5.1 Tibial nerve"}, {"id": "ANA-L9-060", "text": "Tibial nerve injury in the popliteal fossa → difficulty {{c1::standing on the toes}}", "extra": "Plantar flexion is weakened, not lost.", "sec": "Part 05 · 5.1 Tibial nerve"}, {"id": "ANA-L9-061", "text": "Common fibular nerve course: popliteal fossa → behind the {{c1::head of the fibula}} → winds laterally around the {{c2::neck of the fibula}} → pierces {{c3::fibularis longus}}, where it divides", "extra": "Root value L4–S2.", "sec": "Part 05 · 5.2 Common fibular (peroneal) nerve"}, {"id": "ANA-L9-062", "text": "In the substance of fibularis longus the common fibular nerve divides into the {{c1::deep fibular}} and {{c2::superficial fibular}} nerves", "extra": "", "sec": "Part 05 · 5.2 Common fibular (peroneal) nerve"}, {"id": "ANA-L9-063", "text": "The common fibular nerve is vulnerable to injury as it winds around the {{c1::neck of the fibula}}, where it can also be {{c2::palpated}}", "extra": "", "sec": "Part 05 · 5.2 Common fibular (peroneal) nerve"}, {"id": "ANA-L9-064", "text": "Common fibular nerve cutaneous branch: the {{c1::lateral sural cutaneous}} nerve → skin on the {{c2::lateral part of the back of the leg}}", "extra": "", "sec": "Part 05 · 5.2 Common fibular (peroneal) nerve"}, {"id": "ANA-L9-065", "text": "Superficial fibular nerve pierces the deep fascia at the {{c1::lower third of the leg}} to become subcutaneous", "extra": "", "sec": "Part 05 · 5.3 Superficial and deep fibular (peroneal) nerves"}, {"id": "ANA-L9-066", "text": "Superficial fibular nerve — muscles: {{c1::fibularis longus & brevis}}; skin: the {{c2::lateral side of the lower leg}} and the {{c3::dorsum of the foot}}", "extra": "", "sec": "Part 05 · 5.3 Superficial and deep fibular (peroneal) nerves"}, {"id": "ANA-L9-067", "text": "Deep fibular nerve enters the anterior compartment by passing through the {{c1::extensor digitorum longus}} muscle", "extra": "", "sec": "Part 05 · 5.3 Superficial and deep fibular (peroneal) nerves"}, {"id": "ANA-L9-068", "text": "Deep fibular nerve supplies the anterior muscles of the leg; then its {{c1::lateral::medial or lateral}} branch supplies {{c2::extensor hallucis brevis & extensor digitorum brevis}}", "extra": "", "sec": "Part 05 · 5.3 Superficial and deep fibular (peroneal) nerves"}, {"id": "ANA-L9-069", "text": "Deep fibular nerve — its {{c1::medial::medial or lateral}} branch accompanies the {{c2::dorsalis pedis artery}} to supply the skin on the {{c3::adjacent sides of the first and second toes}}", "extra": "The first web space.", "sec": "Part 05 · 5.3 Superficial and deep fibular (peroneal) nerves"}, {"id": "ANA-L9-070", "text": "Deep fibular nerve lesion: loss of {{c1::dorsiflexion ('foot drop')}} → {{c2::steppage}} gait · loss of {{c3::extension of the digits}} · weakened {{c4::inversion}}", "extra": "Common fibular injury = deep + superficial fibular deficits combined.", "sec": "Part 05 · 5.4 Injury of the common fibular nerve"}, {"id": "ANA-L9-071", "text": "Superficial fibular nerve lesion: loss of {{c1::eversion of the foot}} · sensory loss on the {{c2::anterolateral leg and dorsum of the foot}}, except the {{c3::first web space}}", "extra": "The first web space is supplied by the deep fibular nerve's medial branch.", "sec": "Part 05 · 5.4 Injury of the common fibular nerve"}, {"id": "ANA-L9-072", "text": "Fracture of the neck of the fibula → foot drop with steppage gait + loss of eversion → {{c1::common fibular (peroneal)}} nerve injury", "extra": "", "sec": "Part 05 · 5.4 Injury of the common fibular nerve"}, {"id": "ANA-L9-073", "text": "Foot drop with normal eversion → {{c1::deep fibular}} nerve; foot drop plus loss of eversion → {{c2::common fibular}} nerve", "extra": "Superficial → Side (eversion) · Deep → Dorsiflexion.", "sec": "Part 05 · 5.4 Injury of the common fibular nerve"}, {"id": "ANA-L9-074", "text": "Weak dorsiflexion + sensory loss only in the first web space (between toes 1 & 2) → {{c1::deep fibular}} nerve", "extra": "", "sec": "Part 05 · 5.4 Injury of the common fibular nerve"}, {"id": "ANA-L9-075", "text": "Superior gluteal nerve: arises from the {{c1::sacral plexus}}; passes between {{c2::gluteus medius and minimus}}, dividing into numerous branches", "extra": "Root value L4–S1; enters the buttock above the piriformis.", "sec": "Part 06 · 6.1 Superior gluteal nerve (L4–S1)"}, {"id": "ANA-L9-076", "text": "Superior gluteal nerve injury: weakness in {{c1::abduction of the hip}}; the patient cannot keep the {{c2::pelvis level}} when standing on one leg → sign: {{c3::Trendelenburg gait}}", "extra": "", "sec": "Part 06 · 6.2 Injury of the superior gluteal nerve"}, {"id": "ANA-L9-077", "text": "Trendelenburg test: observe the patient's {{c1::back}} while the patient raises each foot off the ground", "extra": "", "sec": "Part 06 · 6.2 Injury of the superior gluteal nerve"}, {"id": "ANA-L9-078", "text": "Trendelenburg test: the damaged superior gluteal nerve is on the {{c1::opposite::same or opposite}} side to the pelvis that falls", "extra": "Exam trap.", "sec": "Part 06 · 6.2 Injury of the superior gluteal nerve"}, {"id": "ANA-L9-079", "text": "Right foot lifted → right pelvis falls → damaged nerve: the {{c1::left::right or left}} superior gluteal nerve", "extra": "The damaged nerve is on the opposite side to the falling pelvis.", "sec": "Part 06 · 6.2 Injury of the superior gluteal nerve"}, {"id": "ANA-L9-080", "text": "Bilateral affection of the superior gluteal nerves → {{c1::waddling (swaying)}} gait", "extra": "Unilateral → Trendelenburg gait.", "sec": "Part 06 · 6.2 Injury of the superior gluteal nerve"}, {"id": "ANA-L9-081", "text": "Waddling gait + bilateral weakness of hip abduction → both {{c1::superior gluteal}} nerves are affected", "extra": "L4–S1; enter the buttock above the piriformis.", "sec": "Part 06 · 6.2 Injury of the superior gluteal nerve"}, {"id": "ANA-L9-082", "text": "Foot drop is listed for {{c1::sciatic}} and {{c2::deep fibular (common fibular)}} nerve injuries", "extra": "Steppage gait: deep fibular (common fibular).", "sec": "Part 07 · 7.4 Gait & signs — at a glance"}], "pracs": [{"href": "prac-ana-3.html", "title": "Anatomy practical · Practical 3 – Hip & thigh"}, {"href": "prac-ana-4.html", "title": "Anatomy practical · Practical 4 – Leg, foot & vertebral column"}], "lib": "msk.html", "prev": {"href": "ana-l8.html", "title": "Lecture 8 · Movement of the Foot"}, "next": {"href": "ana-l10.html", "title": "Lecture 10 · Vertebral Column and Development"}, "coverImg": "covers/Anatomy.jpg", "searchHint": "e.g. above, mid-thigh, sacral plexus"};
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){
  const r = document.documentElement;
  if (S.set.theme === 'light' || S.set.theme === 'dark') r.dataset.theme = S.set.theme; else r.removeAttribute('data-theme');
  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);

  if (opened && (force || mode !== drawnMode)) draw();
}
window.addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(function again(){ if (busy){ layout.t = setTimeout(again, 120); return; } layout(); }, 80);
});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){
      if (at + 1 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at, 'r'); lb.innerHTML = '<div class="pin"></div>'; setPage(pgL, at + 1, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)', opacity: 1}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .7}, {transform: 'rotateY(-180deg)', opacity: 0}], () => { at++; clearLeaf(); busy = false; mark(at); upd(); });
    } else {
      if (at - 1 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at - 1, 'r'); lb.innerHTML = '<div class="pin"></div>'; leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(-180deg)', opacity: 0}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .3}, {transform: 'rotateY(0deg)', opacity: 1}], () => { at--; setPage(pgL, at, 'r'); clearLeaf(); busy = false; upd(); });
    }
  }
}
function jump(i){
  i = Math.max(0, Math.min(N - 1, i)); closeOv();
  if (!opened) openBook(i); else { at = i; draw(); }
}
document.addEventListener('keydown', e => {
  if (!opened || document.querySelector('#ovs .ov')) { if (e.key === 'Escape') closeOv(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});

function opts(q, st, act){

    return `<button class="op ${c}" data-act="${act}" data-q="${q.id}" data-i="${i}" ${st && st.show ? 'disabled' : ''}><span class="lt">${'ABCDEFGH'[i]}</span><span>${esc(o)}</span></button>`;

}

H.lab = (b, pg) => { const L = LABS[b.lab]; return L ? labHTML(L, pg) : ''; };
const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];
  if (L.labels.length >= 2) modes.push(['test', 'Test me'], ['find', 'Find it']);
  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);
    if (mode === 'test') return st.rev[l.id] ? 'on' : 'cv';
    if (mode === 'find') return st.fb && st.fb[2] === l.id ? st.fb[0] : 'cv';
    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);
    if (st.sel === l.id) return 'sel';
    return '';
  };
  const pad = (b, k) => `left:${(b.x - k).toFixed(2)}%;top:${(b.y - k * 1.6).toFixed(2)}%;width:${(b.w + 2 * k).toFixed(2)}%;height:${(b.h + 3.2 * k).toFixed(2)}%`;
  const boxes = L.labels.map(l => {
    const c = cls(l);
    // a numbered legend: the label is covered, the number on the picture is the spot to tap
    const lab = `<button class="sb ${l.m && mode === 'find' ? (c === 'cv' ? 'cv' : '') : c}" style="${pad(l, .35)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="${mode === 'test' || mode === 'find' ? 'covered label' : esc(l.t)}"></button>`;
    const mk = l.m ? `<button class="sb mk ${mode === 'find' ? (st.fb && st.fb[2] === l.id ? st.fb[0] : '') : (c === 'cv' ? '' : c)}" style="${pad(l.m, .6)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="number ${esc(l.n)}"></button>` : '';
    return lab + mk;
  }).join('');
  let info = '';
  if (mode === 'labels'){
    const l = L.labels.find(x => x.id === st.sel), m = l && slmus(L, l);
    info = m ? `<h4>${esc(m.name)}</h4>${esc(m.note || '')}<div class="muted" style="margin-top:.25em">Nerve: ${esc(m.nerves.map(n => (L.act.nerves.find(x => x.id === n) || {}).name).filter(Boolean).join(' + ') || 'not used as an answer in this book')}</div>`
      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`
      : l ? `<h4>${esc(l.t)}</h4>` : `<span class="muted">${L.act ? 'Tap a muscle label to see its action and nerve.' : L.labels.some(x => x.nv) ? 'Tap a nerve to see the muscles it supplies. "Test me" covers the labels; "Find it" asks you to find each one.' : L.labels.length >= 2 ? 'The labels as printed on the slide. "Test me" covers them; "Find it" asks you to find each one.' : 'The slide as shown in the practical.'}</span>`;
  } else if (mode === 'test'){
    info = `<span class="muted">Name each covered label, then tap it to check. Uncovered ${Object.keys(st.rev).length} of ${L.labels.length}.</span>`;
  } else if (mode === 'find'){
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    const t = L.labels.find(x => x.id === target);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Tap "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(t.t)}</h4>${st.fb && st.fb[0] === 'bad' ? `<div class="fb bad">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its ${t.m ? 'number on the picture' : 'covered label'} · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){
    const ms = L.labels.map(l => slmus(L, l)).filter(Boolean);
    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};
H.recall = b => {
  const st = S.labs[b.id] || {}, rv = st.r || {}; let n = 0, k = 0;
  const body = b.groups.map(g => `<div class="rcg">${esc(g.title)}</div>` + g.items.map(it => { const i = n++, on = !!rv[i]; if (on) k++;
    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');
  return `<div class="labh"><span class="lb">LAB</span><h3>${esc(b.title)}</h3></div>
    <p class="labi">Say the rest of each line out loud, then tap it to check. Tap again to cover it. <b>${k}/${n}</b> uncovered.</p>
    <div class="modes"><button class="mini" data-act="rcall" data-l="${b.id}" data-n="${n}">Uncover all</button><button class="mini" data-act="rcno" data-l="${b.id}">Cover all</button></div>${body}`;
};
