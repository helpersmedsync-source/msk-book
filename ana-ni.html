": "Part 07 · Injuries Compared", "kind": "text", "blocks": [{"t": "list", "items": ["<b>Ulnar:<\/b> hypothenar paralysed, thenar preserved; paper test", "<b>Radial axilla:<\/b> wrist drop; posterior interosseous: finger drop only", "<b>Median/CTS:<\/b> thenar weakness, cannot oppose; counting test; ape hand"]}]}, {"id": "p46", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-ni-6-0", "title": "Recall · Injuries Compared", "groups": [{"title": "7.1 Match the nerve with the classic deformity", "items": [["Radial nerve →", "wrist drop"], ["Median nerve →", "ape-like hand"], ["Ulnar nerve →", "incomplete claw hand"], ["Lower trunk lesion →", "complete claw hand"], ["Upper trunk lesion →", "waiter's tip hand"]]}, {"title": "7.2 Master table — motor, sensory, deformity", "items": [["Complete plexus:", "gunshot; flaccid limb; C4 and T2 skin spared"], ["Erb:", "C5,6 lateral dermatomes; waiter's tip"], ["Klumpke:", "C8,T1 medial dermatomes; complete claw hand"], ["Ulnar:", "hypothenar paralysed, thenar preserved; paper test"], ["Radial axilla:", "wrist drop; posterior interosseous: finger drop only"], ["Median/CTS:", "thenar weakness, cannot oppose; counting test; ape hand"]]}]}], "labName": "Recall · Injuries Compared"}, {"id": "p47", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Y26-078"}]}, {"id": "p48", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Identify the nerve — lecture cases · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["<b>Muscles spared in complete lesion:<\/b> trapezius (accessory) and levator scapulae (C4)", "<b>Erb's point:<\/b> meeting point of 6 nerves", "<b>Klumpke's roots:<\/b> mainly T1, partly C8", "Median test = counting test; ulnar test = paper test", "CTS = median + 3½ fingers + thenar weakness + spared thenar skin"]}, {"t": "h", "no": "8.2", "title": "Identify the nerve — lecture cases"}, {"t": "list", "items": ["Wrist drop after humeral shaft fracture → radial nerve (site not answered on slides)", "Cannot oppose thumb with flattened thenar → median nerve; ape hand", "Claw hand with wasted interossei and hypothenar → ulnar nerve; paper test"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p49", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "list", "items": ["Finger drop, no wrist drop, no sensory loss → posterior interosseous nerve"]}, {"t": "h", "no": "8.3", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["<b>2 + 2 spared:<\/b> trapezius and levator scapulae; tip of shoulder and floor of axilla", "Upper (C5–6) → lateral, waiter's tip; lower (C8–T1) → medial, claw hand", "Radial → wrist drop; median → ape hand; ulnar → incomplete claw", "<b>Erb's position:<\/b> Adducted, Medially rotated, elbow Extended, forearm Pronated"]}]}, {"id": "p50", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-ni-7-0", "title": "Recall · Rapid Revision (1/2)", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Muscles spared in complete lesion:", "trapezius (accessory) and levator scapulae (C4)"], ["Erb's point:", "meeting point of 6 nerves"], ["Klumpke's roots:", "mainly T1, partly C8"], ["Median test =", "counting test; ulnar test = paper test"], ["CTS =", "median + 3½ fingers + thenar weakness + spared thenar skin"]]}, {"title": "8.2 Identify the nerve — lecture cases", "items": [["Wrist drop after humeral shaft fracture →", "radial nerve (site not answered on slides)"], ["Cannot oppose thumb with flattened thenar →", "median nerve; ape hand"], ["Claw hand with wasted interossei and hypothenar →", "ulnar nerve; paper test"], ["Finger drop, no wrist drop, no sensory loss →", "posterior interosseous nerve"]]}]}], "labName": "Recall · Rapid Revision (1/2)"}, {"id": "p51", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-ana-ni-7-1", "title": "Recall · Rapid Revision (2/2)", "groups": [{"title": "8.3 Mnemonic vault & classic exam traps", "items": [["2 + 2 spared:", "trapezius and levator scapulae; tip of shoulder and floor of axilla"], ["Upper (C5–6) →", "lateral, waiter's tip; lower (C8–T1) → medial, claw hand"], ["Radial →", "wrist drop; median → ape hand; ulnar → incomplete claw"], ["Erb's position:", "Adducted, Medially rotated, elbow Extended, forearm Pronated"]]}]}], "labName": "Recall · Rapid Revision (2/2)"}, {"id": "p52", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Thenar muscles preserved in partial (ulnar) claw hand, paralysed/atrophied in complete (lower trunk) claw hand"}, {"t": "note", "kind": "trap", "html": "Ulnar claw hand is also called an incomplete claw hand"}, {"t": "note", "kind": "trap", "html": "Posterior interosseous lesion: finger drop without wrist drop because ECRL is preserved"}, {"t": "note", "kind": "trap", "html": "Only the axilla radial lesion adds loss of elbow extension; superficial radial lesion is purely sensory"}, {"t": "note", "kind": "trap", "html": "Levator scapulae survives complete plexus lesion because it is also supplied by C4"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p53", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Erb's: brachialis and biceps → elbow extended; biceps → forearm pronated"}, {"t": "note", "kind": "trap", "html": "CTS spares the palm and thenar skin (palmar cutaneous branch superficial)"}, {"t": "note", "kind": "trap", "html": "Complete claw = ulnar + median (C8, T1), all four fingers"}, {"t": "note", "kind": "cl", "html": "Complete brachial plexus lesion (gunshot): flaccid limb; only trapezius, levator scapulae, C4 and T2 skin spared"}, {"t": "note", "kind": "cl", "html": "Erb's palsy (birth injury or fall on shoulder): waiter's tip hand, lateral sensory loss"}, {"t": "note", "kind": "cl", "html": "Klumpke's paralysis (birth stretch, cervical rib): complete claw hand, medial sensory loss"}]}, {"id": "p54", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Ulnar nerve lesion: partial claw hand; paper test"}, {"t": "note", "kind": "cl", "html": "Radial nerve compression (crutch, arm over chair back): wrist drop"}, {"t": "note", "kind": "cl", "html": "Median nerve lesion: cannot oppose thumb (counting test); ape hand"}, {"t": "note", "kind": "cl", "html": "Carpal tunnel syndrome: middle-aged women/pregnancy; lateral 3½ finger symptoms; thenar weakness and flattening"}]}, {"id": "p55", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Y26-069": {"id": "Y26-069", "stem": "What do you expect to happen if a peripheral nerve of the upper limb is injured?", "top": true, "rep": "", "tag": "Final bank ANA W22", "bank": true, "expl": "Injury of a peripheral nerve of the upper limb paralyses the muscles it supplies (motor changes), causes loss of sensation in its area of skin (sensory changes) and produces a characteristic deformity, e.g. wrist drop (radial), ape-like hand (median) or claw hand (ulnar).", "type": "written", "keyhtml": "1. Motor changes\n2. Sensory changes\n3. Deformity"}, "Y26-070": {"id": "Y26-070", "stem": "Which muscles may remain functioning despite complete brachial plexus injury? Why?", "top": true, "rep": "", "tag": "Final bank ANA W23", "bank": true, "expl": "Trapezius and levator scapulae keep working because their supply does not depend only on the brachial plexus: trapezius is supplied by the spinal part of the accessory nerve and levator scapulae also by C4. For the same reason the tip of the shoulder (C4) and the floor of the axilla (T2) keep their sensation.", "aimg": ["figs/GA-16_ans.jpg", "figs/GA-16_ans2.jpg"], "acap": "Upper limb lying flaccid by the side; levator scapulae and trapezius; skin areas supplied by C4 (tip of shoulder) and T2 (floor of axilla).", "type": "written", "keyhtml": "Complete lesion of the brachial plexus (cause: gunshot wounds):\n1. Motor paralysis of all muscles of the upper limb except 2 muscles:\n  a. Trapezius — supplied by the spinal part of the accessory nerve\n  b. Levator scapulae — also supplied by the C4 nerve\n2. Sensory loss of all sensations of the whole upper limb except 2 areas: the tip of the shoulder (C4) and the floor of the axilla (T2 nerve).\n3. The patient presents with the upper limb lying flaccid by the side of the body."}, "Y26-071": {"id": "Y26-071", "stem": "1. Which nerve injury produces claw hand?\n2. Which muscles are spared in an ulnar nerve lesion at the wrist?\n3. What clinical tests can be used to detect ulnar nerve injury?", "top": true, "rep": "", "tag": "Final bank ANA W24", "bank": true, "expl": "Claw hand follows paralysis of the lumbricals and interossei: an ulnar lesion paralyses only the ulnar-supplied intrinsic muscles, giving an incomplete claw (mainly ring and little fingers) with preserved thenar muscles, whereas a lower trunk lesion paralyses all of them, giving a complete claw. Ulnar nerve injury is detected by the paper test.", "aimg": ["figs/GA-19_ans.jpg", "figs/GA-19_ans2.jpg", "figs/GA-19_ans3.jpg", "figs/GA-19_ans4.jpg"], "acap": "Ulnar claw hand (4th and 5th fingers); paper test (Froment's sign); cutaneous nerve supply of the hand.", "type": "written", "keyhtml": "1. • Ulnar nerve injury (usually a distal ulnar nerve lesion) → partial (incomplete) claw hand: clawing mainly of the 4th &amp; 5th fingers (MCP hyperextended, IP flexed).\n• Lower trunk (C8, T1) lesion, involving ulnar + median → complete claw hand: clawing of the 2nd–5th fingers.\n2. Only the ulnar-supplied intrinsic muscles are paralysed (including the hypothenar muscles); the median-supplied hand muscles are spared — the thenar muscles are preserved (as are the 1st and 2nd lumbricals).\n3. Paper test."}, "Y26-076": {"id": "Y26-076", "stem": "Identify the nerve. Case 3: Claw hand with wasting of interossei and hypothenar muscles.\n1. Which nerve?\n2. What clinical test?", "top": true, "rep": "", "tag": "Final bank ANA W25", "bank": true, "expl": "The interossei and hypothenar muscles are supplied by the ulnar nerve, whose lesion gives the incomplete claw hand (mainly ring and little fingers) with the thenar muscles preserved. Ulnar nerve injury is detected by the paper test.", "type": "written", "keyhtml": "1. Ulnar nerve — partial (incomplete) claw hand: the ulnar-supplied interossei and hypothenar muscles are paralysed, the thenar muscles are preserved.\n2. Paper test."}, "Q0010": {"id": "Q0010", "stem": "Following a car accident, a 24-year-old man presents to the ER with a lacerated arm. On examination he has lost extension of his fingers in the affected limb. Which of the following nerves is most likely affected?", "top": false, "rep": "", "tag": "Final bank ANA Q71", "bank": true, "expl": "The radial nerve is responsible for extension of the elbow, wrist, fingers and thumb, so loss of finger extension after an arm wound points to it. The median nerve is the tempting distractor, but it controls flexion of the wrist and fingers and opposition of the thumb, not extension.", "type": "mcq", "opts": ["Anterior interosseous nerve", "Musculocutaneous nerve", "Median nerve", "Ulnar nerve", "Radial nerve"], "ans": 4}, "Y26-072": {"id": "Y26-072", "stem": "A patient uses a crutch incorrectly, resulting in wrist drop.\n1. Which nerve is injured?\n2. Why does radial nerve injury cause wrist drop?\n3. If the radial nerve is injured in the axilla, will elbow extension be affected? Why?", "top": true, "rep": "", "tag": "Final bank ANA W26", "bank": true, "expl": "Crutch pressure in the axilla compresses the radial nerve, which supplies the major wrist extensors (ECRL, ECRB, ECU), so the wrist drops. A lesion this high is also above the branches to triceps, so elbow extension is lost too, unlike a posterior interosseous lesion, which causes finger drop without wrist drop.", "img": ["figs/GA-20.jpg", "figs/GA-20_2.jpg"], "cap": "Patient walking with crutches; man asleep with his arm over a chair back (text removed).", "aimg": ["figs/GA-20_ans.jpg", "figs/GA-20_ans2.jpg"], "acap": "Radial nerve compression in the axilla or upper arm; sensory loss in radial nerve injury (R = radial, M = median, U = ulnar).", "type": "written", "keyhtml": "1. Radial nerve (compressed in the axilla by the crutch).\n2. The radial nerve supplies the major wrist extensors — extensor carpi radialis longus, extensor carpi radialis brevis and extensor carpi ulnaris — so the wrist cannot be extended and drops.\n3. Yes. A radial nerve lesion in the axilla causes wrist drop + finger drop + loss of elbow extension, because it lies above the branches to triceps (long head given off in the axilla, medial and lateral heads in the upper arm); triceps extends the elbow.\n(Lower lesions: posterior interosseous nerve → finger drop without wrist drop (ECRL preserved); superficial radial nerve → sensory loss only. Sensory loss: posterior surface of the lower part of the arm, a narrow strip on the back of the forearm, lateral 2/3 of the back of the hand and lateral 3½ fingers up to the middle phalanges.)"}, "Y26-074": {"id": "Y26-074", "stem": "Identify the nerve. Case 1: Wrist drop after a humeral shaft fracture.\n1. Which nerve?\n2. What site?", "top": true, "rep": "", "tag": "Final bank ANA W27", "bank": true, "expl": "In the arm the radial nerve runs in the spiral groove of the humerus, in the posterior compartment, so a shaft fracture can injure it there. The radial nerve supplies the wrist extensors, so its injury causes wrist drop.", "type": "written", "keyhtml": "1. Radial nerve (radial nerve injury → wrist drop).\n2. The spiral groove of the humerus: in the arm the radial nerve passes in the spiral groove (posterior compartment of the arm), where a shaft fracture can injure it."}, "Y26-077": {"id": "Y26-077", "stem": "Identify the nerve. Case 4: Finger drop but no wrist drop and no sensory loss. Which nerve?", "top": true, "rep": "", "tag": "Final bank ANA W28", "bank": true, "expl": "The posterior interosseous nerve (deep branch of the radial nerve) supplies the finger and thumb extensors but not ECRL, which comes from the radial nerve itself, so the fingers drop while the wrist can still be extended. The skin is supplied by the superficial radial branch, so there is no sensory loss.", "type": "written", "keyhtml": "Posterior interosseous nerve (the deep branch of the radial nerve): finger drop without wrist drop because extensor carpi radialis longus, supplied by the radial nerve itself, is preserved; no sensory loss because the skin is supplied by the superficial radial branch, which is spared."}, "Q0015": {"id": "Q0015", "stem": "A baby has an upper limb hanging by the side, with the arm adducted and medially rotated. Which part of the brachial plexus is most likely injured?", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA W29", "bank": true, "expl": "An upper limb hanging adducted and medially rotated in a baby indicates an upper trunk (C5, C6) lesion — Erb's palsy from undue separation of the head from the shoulder at birth. Paralysis of supraspinatus and deltoid (abduction), infraspinatus and teres minor (lateral rotation), and biceps and brachialis gives the policeman's (waiter's) tip posture.", "aimg": ["figs/GA-17_ans.jpg", "figs/GA-17_ans2.jpg", "figs/GA-17_ans3.jpg", "figs/GA-17_ans4.jpg", "figs/GA-17_ans5.jpg", "figs/GA-17_ans6.jpg"], "acap": "Erb's point marked on the plexus and in a dissection; causes (difficult birth — shoulder dystocia; fall on the shoulder); policeman's (waiter's) tip posture; C5, C6 dermatomes (bracketed).", "type": "written", "keyhtml": "Upper trunk lesion (Erb's palsy, Erb-Duchenne paralysis):\n• Roots: C5, C6 — mainly C5 and partly C6\n• Site: mainly at Erb's point (point of meeting of 6 nerves) — a point in the posterior triangle of the neck where six branches of the brachial plexus are closely related (suprascapular nerve, nerve to subclavius, axillary, musculocutaneous, radial and median nerves)\n• Cause: undue separation of the head from the shoulder — commonly a birth injury or a fall on the shoulder\n• Nerves mainly affected: suprascapular, nerve to subclavius, axillary, musculocutaneous\n• Motor effect: paralysis of\n  1. supraspinatus &amp; deltoid → loss of abduction (arm adducted)\n  2. infraspinatus &amp; teres minor → loss of lateral rotation (arm medially rotated)\n  3. brachialis &amp; biceps → loss of elbow flexion (elbow extended)\n  4. biceps → loss of supination (forearm pronated)\n• Deformity: policeman's tip / porter's (waiter's) tip hand — the arm hangs by the side adducted and medially rotated, the forearm extended and pronated\n• Sensory: dermatomes C5, C6 → loss of sensation over the lateral side of the upper limb"}, "Q0037": {"id": "Q0037", "stem": "In Erb's palsy, why is the arm adducted?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In upper trunk (Erb's) palsy, paralysis of supraspinatus and deltoid causes loss of abduction of the arm, so the arm is adducted. Medial rotation is a separate effect, caused by paralysis of infraspinatus and teres minor.", "type": "written", "keyhtml": "Because supraspinatus and deltoid are paralysed, so abduction of the arm is lost and the arm hangs adducted by the side.\n(The rest of the Erb's posture: infraspinatus and teres minor paralysed → arm medially rotated; brachialis and biceps paralysed → elbow extended; biceps paralysed → forearm pronated.)"}, "Q0038": {"id": "Q0038", "stem": "What is the deformity caused by Erb's palsy called?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Erb's palsy (upper trunk, C5, C6) produces the policeman's or porter's (waiter's) tip hand. The claw hand belongs to lower trunk (Klumpke's) and ulnar lesions, not to Erb's.", "type": "written", "keyhtml": "Policeman's tip hand, or porter's (waiter's) tip hand: the arm hangs by the side adducted and medially rotated, and the forearm is extended and pronated."}, "Q0039": {"id": "Q0039", "stem": "Erb's palsy is an injury of which part of the brachial plexus?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Erb's (Erb-Duchenne) palsy is an upper trunk lesion of C5 and C6, usually at Erb's point. Klumpke's paralysis is the lower trunk lesion (mainly T1, partly C8).", "type": "written", "keyhtml": "Upper trunk of the brachial plexus: roots C5, C6 (mainly C5, partly C6), mainly at Erb's point (point of meeting of 6 nerves)."}, "Q0092": {"id": "Q0092", "stem": "A 52-year-old band director develops problems in her right arm several days after strenuous field exercises for a major athletic tournament. Examination in the orthopaedic clinic reveals finger drop, but wrist extension and extension of the elbow joint are normal. There is no loss of sensation in the affected limb. Which nerve was most likely affected?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q69", "bank": true, "expl": "A posterior interosseous nerve lesion causes finger drop with no wrist drop (ECRL is preserved), elbow extension is unaffected (that is lost only in an axilla lesion), and there is no sensory loss. A superficial radial nerve lesion is the tempting distractor, but it causes sensory loss only.", "type": "mcq", "opts": ["Ulnar", "Anterior interosseous", "Posterior interosseous", "Median", "Superficial radial"], "ans": 2}, "Q0095": {"id": "Q0095", "stem": "A 50-year-old female equestrian falls from a horse. In the ER, she has pain and paraesthesia in the axilla and along the medial aspect of her upper limb. She has marked weakness in the movements of her dominant hand, especially abduction and adduction of the fingers. Which structure was most likely damaged?", "top": false, "rep": "asked 3 years", "tag": "Final bank ANA Q70", "bank": true, "expl": "A lower trunk (Klumpke's) lesion paralyses all intrinsic muscles of the hand, mainly lumbricals and interossei, causing loss of abduction and adduction of the fingers, with sensory loss over the medial side of the upper limb (C8, T1). An upper trunk lesion would instead affect the shoulder and elbow and the lateral side of the limb (C5, C6).", "type": "mcq", "opts": ["Upper trunk of the brachial plexus", "Lower trunk of the brachial plexus", "Posterior cord of the brachial plexus", "Lateral cord of the brachial plexus", "Long thoracic nerve"], "ans": 1}, "Q0142": {"id": "Q0142", "stem": "A 45-year-old woman presents with arm pain after being struck by a car. Examination reveals a midshaft humeral fracture and wrist drop. Which of the following findings is most likely also present?", "top": false, "rep": "", "tag": "Final bank ANA Q72", "bank": true, "expl": "Wrist drop after a midshaft humeral fracture indicates a radial nerve injury, and radial nerve sensory loss includes the lateral 2/3 of the back of the hand and the lateral 3½ fingers. Weakness of shoulder abduction points to the axillary nerve at the surgical neck, while medial forearm sensory loss and weak finger flexion are not radial nerve findings.", "type": "mcq", "opts": ["Loss of sensation over the medial forearm", "Loss of sensation over the lateral part of the dorsum of the hand", "Weakness of shoulder abduction", "Weakness of finger flexion"], "ans": 1}, "Q0144": {"id": "Q0144", "stem": "A 30-year-old woman presents with weakness in finger and thumb extension after a forearm fracture. Wrist extension is intact, but she cannot extend her fingers or thumb. Which branch of the radial nerve is most likely injured?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A posterior interosseous nerve lesion causes finger drop with no wrist drop because ECRL is preserved. The superficial radial nerve is purely sensory, so its injury would cause sensory loss only.", "type": "mcq", "opts": ["Superficial branch", "Deep branch (posterior interosseous nerve)", "Muscular branch to triceps", "Lateral cutaneous branch"], "ans": 1}, "Y26-073": {"id": "Y26-073", "stem": "A patient cannot oppose the thumb.\n1. Which nerve is likely injured?\n2. What is the clinical test for median nerve injury?\n3. Why does a median nerve lesion produce an ape-like hand?", "top": true, "rep": "", "tag": "Final bank ANA W30", "bank": true, "expl": "Opposition of the thumb depends on the median-supplied thenar muscles, so a median nerve lesion is detected by the counting test. Wasting of the thenar eminence with the thumb adducted and extended gives the ape-like (simian) hand.", "img": ["figs/GA-21.jpg"], "cap": "The patient's hand.", "aimg": ["figs/GA-21_ans.jpg"], "acap": "Simian (ape) hand: emaciation of the thenar eminence, thumb adducted and extended; inability to oppose the thumb.", "type": "written", "keyhtml": "1. Median nerve.\n2. Counting test: the patient cannot oppose his thumb to the rest of the fingers.\n3. Ape hand deformity: the median nerve supplies the thenar muscles (abductor pollicis brevis, flexor pollicis brevis, opponens pollicis); their paralysis causes emaciation of the thenar eminence, with the thumb adducted and extended and unable to be opposed (simian, ape-like hand)."}, "Y26-075": {"id": "Y26-075", "stem": "Identify the nerve. Case 2: Inability to oppose the thumb with flattened thenar eminence.\n1. Which nerve?\n2. What deformity?", "top": true, "rep": "", "tag": "Final bank ANA W31", "bank": true, "expl": "The median nerve supplies the thenar muscles, so its lesion causes inability to oppose the thumb and flattening of the thenar eminence. The resulting deformity is the ape-like (simian) hand, tested by the counting test.", "type": "written", "keyhtml": "1. Median nerve.\n2. Ape (ape-like, simian) hand."}, "Q0151": {"id": "Q0151", "stem": "All of the following could be signs of carpal tunnel syndrome EXCEPT:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q63", "bank": true, "expl": "Carpal tunnel syndrome compresses the median nerve, giving burning pain, pins and needles and numbness in the lateral 3½ fingers (including the index and middle fingers) and weakness and flattening of the thenar muscles, so abduction and opposition of the thumb are weak. Adduction of the thumb is the action of adductor pollicis, which is supplied by the ulnar nerve and is spared.", "type": "mcq", "opts": ["Pain over the index finger", "Weakness in abduction of the thumb", "Weakness in opposition of the thumb", "Weakness in adduction of the thumb", "Numbness in the middle finger"], "ans": 3}, "Q0156": {"id": "Q0156", "stem": "The incomplete claw hand is the characteristic deformity of:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q64", "bank": true, "expl": "An ulnar nerve lesion gives the partial (incomplete) claw hand, with clawing mainly of the 4th and 5th fingers and the thenar muscles preserved. A lower trunk injury is the tempting distractor, but it involves the ulnar and median components (C8, T1) and gives the complete claw hand of all four fingers; a median nerve injury gives the ape hand.", "type": "mcq", "opts": ["Median nerve injury", "Axillary nerve injury", "Long thoracic nerve injury", "Ulnar nerve injury", "Lower trunk injury"], "ans": 3}, "Q0157": {"id": "Q0157", "stem": "In Erb-Duchenne paralysis, the patient cannot abduct his shoulder from:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q65", "bank": true, "expl": "In Erb's palsy, supraspinatus and deltoid are both paralysed: supraspinatus initiates abduction and the middle fibres of deltoid continue it up to 90°, so abduction is lost from 0° to 90°. Raising the arm above 90° depends on lateral rotation of the scapula by trapezius and serratus anterior, so the whole range is not lost, and 15–90° would fit loss of the deltoid alone.", "type": "mcq", "opts": ["Abduction is not affected", "Above 90°", "The whole abduction range", "15–90°", "0–90°"], "ans": 4}, "Q0158": {"id": "Q0158", "stem": "In Erb-Duchenne paralysis, the patient cannot laterally rotate his shoulder due to paralysis of the:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q66", "bank": true, "expl": "In Erb's palsy, infraspinatus and teres minor are paralysed, so lateral rotation of the arm is lost and the arm lies medially rotated. Biceps brachii is also paralysed in Erb's palsy, but its loss gives the extended elbow and pronated forearm, while subscapularis and teres major are medial rotators.", "type": "mcq", "opts": ["Biceps brachii", "Subscapularis", "Coracobrachialis", "Teres minor", "Teres major"], "ans": 3}, "Q0162": {"id": "Q0162", "stem": "Skin over the axilla is supplied by:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q67", "bank": true, "expl": "In a complete brachial plexus lesion, sensation is lost over the whole upper limb except the floor of the axilla, supplied by T2, and the tip of the shoulder, supplied by C4. C4 is the tempting distractor because it supplies the other spared area.", "type": "mcq", "opts": ["C5", "C4", "C6", "T1", "T2"], "ans": 4}, "Q0163": {"id": "Q0163", "stem": "Positive Froment sign is caused by the inability of the patient to move his:", "top": true, "rep": "asked 2 years", "tag": "Final bank ANA Q68", "bank": true, "expl": "Adductor pollicis is supplied by the ulnar nerve, which supplies all the hand muscles except the three thenar muscles and the first two lumbricals, so it is the thumb muscle lost in an ulnar nerve lesion; the ulnar lesion is tested by asking the patient to hold a paper. Opponens pollicis, abductor pollicis brevis and flexor pollicis brevis are thenar muscles supplied by the median nerve.", "type": "mcq", "opts": ["Opponens pollicis", "Flexor pollicis brevis", "Adductor pollicis", "Abductor pollicis brevis", "Extensor pollicis brevis"], "ans": 2}, "N-ANA-NI-01": {"id": "N-ANA-NI-01", "stem": "A 30-year-old carpenter injures the front of his wrist with a saw. Weeks later he cannot touch the tip of his thumb to the tips of his other fingers when asked to count on them, and his thenar eminence is flattened. Which deformity is his hand most likely to show?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Inability to oppose the thumb to the rest of the fingers (counting test) indicates a median nerve lesion, which produces the ape-like (simian) hand: emaciation of the thenar eminence with the thumb adducted and extended. The incomplete claw hand belongs to the ulnar nerve, and in it the thenar muscles are preserved.", "type": "mcq", "opts": ["Ape-like (simian) hand", "Incomplete claw hand", "Complete claw hand", "Wrist drop", "Policeman's (waiter's) tip hand"], "ans": 0}, "N-ANA-NI-02": {"id": "N-ANA-NI-02", "stem": "A newborn is delivered after a difficult birth in which the head was forcibly pulled away from the shoulder. The right upper limb hangs by the side with the arm adducted and medially rotated, the elbow extended and the forearm pronated. Over which area is sensory loss expected?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The waiter's tip posture after undue separation of the head from the shoulder is an upper trunk (Erb's) lesion, whose sensory loss is limited to dermatomes C5, 6 over the lateral side of the upper limb. Medial-side loss (C8, T1) belongs to the lower trunk (Klumpke's) lesion.", "type": "mcq", "opts": ["Lateral side of the upper limb (dermatomes C5, C6)", "Medial side of the upper limb (dermatomes C8, T1)", "Whole upper limb except the tip of the shoulder and the floor of the axilla", "Lateral 3½ fingers, with the palm spared", "Posterior lower arm and lateral 2/3 of the back of the hand"], "ans": 0}, "N-ANA-NI-03": {"id": "N-ANA-NI-03", "stem": "A 28-year-old woman with a cervical rib develops a lower trunk (Klumpke's) lesion of the brachial plexus. Her fingers become clawed. Which muscle produces the hyperextension of her metacarpophalangeal joints?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In the claw hand the lumbricals and interossei are paralysed, so the MP joints are hyperextended by the unopposed extensor digitorum. Flexor digitorum superficialis and profundus are the tempting distractors: they flex the IP joints, not the MP joints.", "type": "mcq", "opts": ["Extensor digitorum", "Flexor digitorum superficialis", "Flexor digitorum profundus", "Lumbricals", "Interossei"], "ans": 0}, "N-ANA-NI-04": {"id": "N-ANA-NI-04", "stem": "A 30-year-old man presents with weakness of his right hand. His ring and little fingers are clawed, with hyperextended metacarpophalangeal joints and flexed interphalangeal joints. The hypothenar muscles are wasted, but the thenar eminence is normal. Which lesion best explains these findings?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Clawing mainly of the 4th and 5th fingers with paralysed hypothenar muscles but preserved thenar muscles is the partial (incomplete) claw hand of an ulnar nerve lesion. A lower trunk lesion involves the ulnar and median nerves, so it claws all four fingers and paralyses the thenar muscles too.", "type": "mcq", "opts": ["Ulnar nerve lesion", "Lower trunk (C8, T1) lesion", "Median nerve lesion", "Upper trunk (C5, C6) lesion", "Posterior interosseous nerve lesion"], "ans": 0}, "N-ANA-NI-05": {"id": "N-ANA-NI-05", "stem": "A 22-year-old man sustains a gunshot wound that injures his entire right brachial plexus. His upper limb lies flaccid by the side of his body. Which of the following muscles can he still contract?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A complete brachial plexus lesion paralyses all muscles of the upper limb except trapezius (spinal part of the accessory nerve) and levator scapulae (also supplied by C4). Deltoid, supraspinatus, infraspinatus and biceps are all supplied through the plexus, so they are paralysed.", "type": "mcq", "opts": ["Levator scapulae", "Deltoid", "Supraspinatus", "Biceps brachii", "Infraspinatus"], "ans": 0}, "N-ANA-NI-06": {"id": "N-ANA-NI-06", "stem": "A patient presents with clawing of the fingers following excessive stretching of the upper limb.\n1. Which part of the brachial plexus is probably injured?\n2. Which roots are mainly affected?\n3. Which muscles of the hand are paralyzed?\n4. Why does a claw hand develop?\n5. How would you distinguish this claw hand from the claw hand of an ulnar nerve lesion?", "top": true, "rep": "", "tag": "Final bank ANA W32", "bank": true, "expl": "Excessive stretch of the upper limb injures the lower trunk (mainly T1, partly C8) and paralyses all the intrinsic hand muscles. With the lumbricals and interossei lost, extensor digitorum hyperextends the MP joints and FDS and FDP flex the IP joints unopposed, giving a complete claw hand; in an ulnar lesion the thenar muscles are preserved and the claw is incomplete.", "img": ["figs/GA-18.jpg"], "cap": "Drawings of mechanisms of injury to the upper limb.", "aimg": ["figs/GA-18_ans.jpg", "figs/GA-18_ans2.jpg"], "acap": "Complete claw hand, labelled; C8, T1 dermatomes (bracketed).", "type": "written", "keyhtml": "1. Lower trunk of the brachial plexus (Klumpke's paralysis). Causes: birth difficulty and undue stretch of the upper limb; cervical rib.\n2. Mainly T1 and partly C8.\n3. All the intrinsic muscles of the hand, mainly the lumbricals and interossei (also some flexors of the wrist and fingers) → loss of abduction and adduction of the fingers, loss of flexion of the MP joints and loss of extension of the IP joints.\n4. Complete claw hand: the MP joints are hyperextended by extensor digitorum and the IP joints are flexed by FDS and FDP, both unopposed by the paralysed lumbricals and interossei. (Sensory loss: dermatomes C8, T1 — medial side of the upper limb.)\n5. • Lower trunk: complete claw hand (ulnar + median, C8 + T1); clawing of the 2nd–5th fingers; thenar muscles paralysed/atrophied; sensory loss over the medial side of the upper limb (C8, T1)\n• Ulnar nerve (usually distal lesion): partial (incomplete) claw hand; clawing mainly of the 4th and 5th fingers; thenar muscles preserved; tested by the paper test\n• Hypothenar muscles are paralysed in both"}, "N-ANA-NI-07": {"id": "N-ANA-NI-07", "stem": "Carpal tunnel syndrome:\n1. What happens to the median nerve in carpal tunnel syndrome?\n2. What sensory symptoms are common?\n3. Why is sensation over the palm spared?\n4. What happens to the thenar muscles?\n5. Mention two causes of carpal tunnel syndrome.\n6. Name the resulting hand deformity and the clinical test for the median nerve.", "top": true, "rep": "", "tag": "Final bank ANA W33", "bank": true, "expl": "In carpal tunnel syndrome the median nerve is compressed deep to the flexor retinaculum, giving symptoms in the lateral 3½ fingers and thenar weakness and flattening. The palm and thenar skin are spared because the palmar cutaneous branch passes superficial to the retinaculum.", "aimg": ["figs/GA-22_ans.jpg", "figs/GA-22_ans2.jpg", "figs/GA-22_ans3.jpg"], "acap": "Carpal tunnel in cross-section; median nerve territory in carpal tunnel syndrome; ape hand.", "type": "written", "keyhtml": "1. It is compressed deep to the flexor retinaculum (carpal tunnel syndrome is a pathological lesion that decreases the size of the tunnel and compresses the median nerve deep to the flexor retinaculum).\n2. Burning pain, pins and needles, numbness and sensory loss in the lateral 3½ fingers.\n3. The palmar cutaneous branch of the median nerve passes superficial to the flexor retinaculum, so it is not compressed; sensation over the palm (thenar eminence) is usually preserved.\n4. Weakness and flattening.\n5. • Spontaneously in middle-aged women or during pregnancy\n• Thickening of the synovial sheaths due to inflammation of the long flexor tendons\n6. Ape hand deformity; counting test (the patient cannot oppose the thumb to the rest of the fingers)."}, "N-ANA-NI-08": {"id": "N-ANA-NI-08", "stem": "Compare upper (Erb's) and lower (Klumpke's) brachial plexus injuries regarding: roots affected, mechanism of injury, characteristic deformity and sensory loss.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Upper plexus (C5–6) injuries affect the lateral side, shoulder and elbow and give the waiter's tip hand; lower plexus (C8–T1) injuries affect the medial side and the hand and give the claw hand.", "type": "written", "keyhtml": "• Roots: Erb's: C5–C6 (mainly C5, partly C6) | Klumpke's: C8–T1 (mainly T1, partly C8)\n• Mechanism: Erb's: excessive separation of the head from the shoulder (birth injury, fall on the shoulder) | Klumpke's: excessive upward traction on the upper limb (birth difficulty and undue stretch); cervical rib\n• Main nerves: Erb's: suprascapular, musculocutaneous, axillary, partly radial | Klumpke's: mainly ulnar and median components\n• Deformity: Erb's: policeman's / waiter's tip (arm adducted and medially rotated, elbow extended, forearm pronated; hand relatively preserved) | Klumpke's: complete claw hand (shoulder and elbow relatively preserved)\n• Sensory loss: Erb's: lateral side of the upper limb (C5, C6) | Klumpke's: medial side of the upper limb (C8, T1)"}, "Y26-078": {"id": "Y26-078", "stem": "Match the nerve with the classic deformity:\n1. Radial nerve\n2. Median nerve\n3. Ulnar nerve\n4. Lower trunk lesion\n5. Upper trunk lesion\nDeformities: a) Ape-like hand · b) Complete claw hand · c) Incomplete claw hand · d) Waiter's tip hand · e) Wrist drop", "top": true, "rep": "", "tag": "Final bank ANA Q62", "bank": true, "expl": "The radial nerve supplies the wrist extensors (wrist drop), the median nerve the thenar muscles (ape-like hand), and the upper trunk the shoulder abductors, lateral rotators and elbow flexors (waiter's tip). The ulnar claw is incomplete because the median-supplied thenar muscles survive, whereas a lower trunk lesion paralyses all the intrinsic hand muscles (complete claw).", "aimg": ["figs/GA-27_ans.jpg", "figs/GA-27_ans2.jpg"], "acap": "Wrist drop (radial nerve), claw hand (ulnar nerve) and ape hand (median nerve); photographs of the three deformities.", "type": "written", "keyhtml": "1 → e) Wrist drop\n2 → a) Ape-like hand\n3 → c) Incomplete claw hand\n4 → b) Complete claw hand\n5 → d) Waiter's tip hand"}, "TP-101": {"id": "TP-101", "stem": "A 32-year-old man presents to the emergency department after a fall. On examination, he has swelling over the midshaft of the humerus and cannot extend his wrist or fingers. Sensation is decreased over the dorsum of the hand near the base of the thumb. Which of the following muscles is NOT affected in this patient?", "top": true, "rep": "", "tag": "Final bank ANA Q144", "bank": true, "expl": "Inability to extend the wrist and fingers (wrist drop + finger drop) with sensory loss on the back of the hand near the thumb indicates radial nerve injury. Loss of elbow extension is added only by a lesion in the axilla, so with this lesion at the humeral shaft the triceps brachii (the elbow extensor, radial nerve) is spared. Brachioradialis is tempting because it flexes the forearm, but it is still a radial-nerve muscle of the back of the forearm; extensor digitorum, supinator and extensor carpi radialis brevis are supplied by the posterior interosseous branch.", "type": "mcq", "opts": ["Brachioradialis", "Triceps brachii", "Extensor digitorum", "Supinator", "Extensor carpi radialis brevis"], "ans": 1}, "TP-107": {"id": "TP-107", "stem": "A 32-year-old man presents to the clinic after a deep cut on the medial side of his wrist. He reports numbness on the medial side of his hand. Physical examination reveals loss of abduction and adduction of the fingers, with difficulty holding a piece of paper between the fingers. Which nerve is injured?", "top": true, "rep": "", "tag": "Final bank ANA W51", "bank": true, "expl": "The interossei, which abduct and adduct the fingers, are all supplied by the ulnar nerve, and the paper test detects an ulnar nerve lesion. The median nerve supplies only the thenar muscles and lumbricals 1–2 in the hand and the lateral 3½ digits.", "type": "written", "keyhtml": "The ulnar nerve:\n• It supplies all the interossei (dorsal interossei abduct — DAB; palmar interossei adduct — PAD) → loss of finger abduction and adduction.\n• Paper test = the clinical test for an ulnar nerve lesion.\n• It supplies the skin of the palmar and dorsal aspects of the medial 1½ digits → numbness on the medial side of the hand."}}, "labs": {}, "cards": [{"id": "ANA-NI-001", "text": "If a peripheral nerve of the upper limb is injured, expect: {{c1::motor changes}} · {{c2::sensory changes}} · {{c3::deformity}}", "extra": "Anatomy GD (nerve injury) Q1.", "sec": "Part 01 · 1.1 Terminal branches of the brachial plexus"}, {"id": "ANA-NI-002", "text": "Function of the axillary nerve: {{c1::shoulder movement}}; of the musculocutaneous nerve: {{c2::flexion of the elbow}}", "extra": "", "sec": "Part 01 · 1.1 Terminal branches of the brachial plexus"}, {"id": "ANA-NI-003", "text": "Function of the median nerve: {{c1::flexion of the wrist and fingers}} + {{c2::opposition of the thumb}}", "extra": "", "sec": "Part 01 · 1.1 Terminal branches of the brachial plexus"}, {"id": "ANA-NI-004", "text": "Function of the radial nerve: extension of the {{c1::elbow, wrist, fingers and thumb}}", "extra": "So lacerated arm + lost finger extension → radial nerve.", "sec": "Part 01 · 1.1 Terminal branches of the brachial plexus"}, {"id": "ANA-NI-005", "text": "Function of the ulnar nerve: {{c1::fine manipulative movements}} of the fingers", "extra": "", "sec": "Part 01 · 1.1 Terminal branches of the brachial plexus"}, {"id": "ANA-NI-006", "text": "Cause of a complete lesion of the brachial plexus: {{c1::gunshot wounds}}", "extra": "", "sec": "Part 01 · 1.2 Complete lesion of brachial plexus"}, {"id": "ANA-NI-007", "text": "Complete brachial plexus lesion — muscles still working: {{c1::trapezius}} ({{c3::spinal part of the accessory nerve}}) & {{c2::levator scapulae}} ({{c4::also supplied by C4}})", "extra": "2 + 2 spared: 2 muscles, 2 skin areas.", "sec": "Part 01 · 1.2 Complete lesion of brachial plexus"}, {"id": "ANA-NI-008", "text": "Complete brachial plexus lesion — skin that keeps sensation: {{c1::tip of the shoulder}} ({{c3::C4}}) & {{c2::floor of the axilla}} ({{c4::T2}})", "extra": "Formative 3 Q10: skin over the axilla = T2 (C4 is the distractor).", "sec": "Part 01 · 1.2 Complete lesion of brachial plexus"}, {"id": "ANA-NI-009", "text": "Complete brachial plexus lesion presentation: the upper limb lies {{c1::flaccid by the side of the body}}", "extra": "", "sec": "Part 01 · 1.2 Complete lesion of brachial plexus"}, {"id": "ANA-NI-010", "text": "Upper trunk lesion = {{c1::Erb's (Erb-Duchenne)}} palsy; roots {{c2::C5, C6 — mainly C5, partly C6}}", "extra": "", "sec": "Part 02 · Upper trunk lesion (Erb's palsy)"}, {"id": "ANA-NI-011", "text": "Site of Erb's palsy: mainly at {{c1::Erb's point}} — the point of meeting of {{c2::6}} nerves", "extra": "", "sec": "Part 02 · Upper trunk lesion (Erb's palsy)"}, {"id": "ANA-NI-012", "text": "Erb's point lies in the {{c1::posterior triangle of the neck}}", "extra": "GD Q3 key (pamphlet says only 'point of meeting of 6 nerves'): suprascapular, n. to subclavius, axillary, musculocutaneous, radial, median.", "sec": "Part 02 · Upper trunk lesion (Erb's palsy)"}, {"id": "ANA-NI-013", "text": "Cause of Erb's palsy: undue {{c1::separation of the head from the shoulder}} — commonly a {{c2::birth injury}} or a {{c3::fall on the shoulder}}", "extra": "", "sec": "Part 02 · Upper trunk lesion (Erb's palsy)"}, {"id": "ANA-NI-014", "text": "Nerves mainly affected in Erb's palsy: {{c1::suprascapular}} · {{c2::nerve to subclavius}} · {{c3::axillary}} · {{c4::musculocutaneous}}", "extra": "The 3.3 comparison table adds 'partly radial'.", "sec": "Part 02 · Upper trunk lesion (Erb's palsy)"}, {"id": "ANA-NI-015", "text": "Erb's palsy: paralysis of {{c1::supraspinatus & deltoid}} → loss of {{c2::abduction}} → arm adducted", "extra": "", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-016", "text": "Erb's palsy: paralysis of {{c1::infraspinatus & teres minor}} → loss of {{c2::lateral rotation}} → arm medially rotated", "extra": "Formative 3 Q14 answer: teres minor (subscapularis & teres major are medial rotators).", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-017", "text": "Erb's palsy: paralysis of {{c1::brachialis & biceps}} → loss of {{c2::flexion at the elbow}} → elbow extended", "extra": "", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-018", "text": "Erb's palsy: paralysis of {{c1::biceps}} → loss of {{c2::supination}} → forearm pronated", "extra": "", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-019", "text": "In Erb-Duchenne paralysis the patient cannot abduct the shoulder from {{c1::0–90°}}", "extra": "Formative 3 Q22 key — supraspinatus & deltoid are both paralysed.", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-020", "text": "Erb's posture: arm {{c1::adducted}} & {{c2::medially rotated}}; forearm {{c3::extended}} & {{c4::pronated}}", "extra": "Top down: Adducted · Medially rotated · Extended · Pronated.", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-021", "text": "Deformity of Erb's palsy: {{c1::policeman's}} tip hand, or {{c2::porter's (waiter's)}} tip hand", "extra": "", "sec": "Part 02 · 2.1 Erb's palsy — motor effect & deformity"}, {"id": "ANA-NI-022", "text": "Baby with the upper limb hanging by the side, arm adducted & medially rotated → injured part of the plexus: {{c1::upper trunk (C5, C6)}}", "extra": "Anatomy GD (nerve injury) Q3 — Erb's palsy.", "sec": "Part 02 · 2.2 Erb's palsy — sensory changes"}, {"id": "ANA-NI-023", "text": "Erb's palsy sensory loss: dermatomes {{c1::C5, 6}} → {{c2::lateral}} side of the upper limb", "extra": "", "sec": "Part 02 · 2.2 Erb's palsy — sensory changes"}, {"id": "ANA-NI-024", "text": "Lower trunk lesion = {{c1::Klumpke's}} paralysis; roots mainly {{c2::T1}}, partly {{c3::C8}}", "extra": "", "sec": "Part 03 · Lower trunk lesion (Klumpke's paralysis)"}, {"id": "ANA-NI-025", "text": "Causes of Klumpke's paralysis: {{c1::birth difficulty & undue stretch of the upper limb}} · {{c2::cervical rib}}", "extra": "", "sec": "Part 03 · Lower trunk lesion (Klumpke's paralysis)"}, {"id": "ANA-NI-026", "text": "Klumpke's motor effect: paralysis of {{c1::all intrinsic muscles of the hand}} (mainly {{c2::lumbricals & interossei}}) + some {{c3::flexors of the wrist & fingers}}", "extra": "", "sec": "Part 03 · 3.1 Klumpke's — motor effect & deformity"}, {"id": "ANA-NI-027", "text": "Paralysed lumbricals & interossei → loss of finger {{c1::abduction & adduction}} · loss of {{c2::flexion}} of MP joints · loss of {{c3::extension}} of IP joints", "extra": "", "sec": "Part 03 · 3.1 Klumpke's — motor effect & deformity"}, {"id": "ANA-NI-028", "text": "Claw hand: MP joints {{c1::hyperextended}} by {{c2::extensor digitorum}}; IP joints {{c3::flexed}} by {{c4::FDS & FDP}} — both unopposed by the lumbricals & interossei", "extra": "", "sec": "Part 03 · 3.1 Klumpke's — motor effect & deformity"}, {"id": "ANA-NI-029", "text": "Deformity of a lower trunk (Klumpke's) lesion: {{c1::complete claw hand}}", "extra": "", "sec": "Part 03 · 3.1 Klumpke's — motor effect & deformity"}, {"id": "ANA-NI-030", "text": "Klumpke's sensory loss: dermatomes {{c1::C8, T1}} → {{c2::medial}} side of the upper limb", "extra": "", "sec": "Part 03 · 3.2 Klumpke's — sensory changes"}, {"id": "ANA-NI-031", "text": "Clawing of the fingers after excessive stretching of the upper limb → injured part of the plexus: {{c1::lower trunk}}", "extra": "Anatomy GD (nerve injury) Q4 — Klumpke's paralysis.", "sec": "Part 03 · 3.2 Klumpke's — sensory changes"}, {"id": "ANA-NI-032", "text": "Fall from a horse: paraesthesia in the axilla & medial upper limb + weak finger abduction & adduction → {{c1::lower trunk}} of the brachial plexus", "extra": "Intrinsic hand muscles + C8, T1 dermatomes.", "sec": "Part 03 · 3.2 Klumpke's — sensory changes"}, {"id": "ANA-NI-033", "text": "Typical mechanism — upper plexus (Erb): excessive {{c1::separation of head and shoulder}}; lower plexus (Klumpke): excessive {{c2::upward traction on the upper limb}}", "extra": "", "sec": "Part 03 · 3.3 Upper vs lower brachial plexus injuries"}, {"id": "ANA-NI-034", "text": "Main nerves affected — upper plexus: suprascapular, musculocutaneous, axillary, partly {{c1::radial}}; lower plexus: mainly {{c2::ulnar and median}} components", "extra": "", "sec": "Part 03 · 3.3 Upper vs lower brachial plexus injuries"}, {"id": "ANA-NI-035", "text": "Upper plexus (C5–6) → {{c1::lateral}} side, shoulder & elbow; lower plexus (C8–T1) → {{c2::medial}} side, hand", "extra": "Upper → waiter's tip; lower → claw hand.", "sec": "Part 03 · 3.3 Upper vs lower brachial plexus injuries"}, {"id": "ANA-NI-036", "text": "Upper plexus (Erb) injury: the hand is {{c1::relatively preserved}}; lower plexus (Klumpke) injury: shoulder & elbow {{c2::relatively preserved}}", "extra": "", "sec": "Part 03 · 3.3 Upper vs lower brachial plexus injuries"}, {"id": "ANA-NI-037", "text": "Partial (incomplete) claw hand: {{c1::ulnar}} nerve only — usually a {{c2::distal}} ulnar nerve lesion", "extra": "Formative 2 Q17: incomplete claw = ulnar nerve injury.", "sec": "Part 04 · 4.1 Partial vs complete claw hand"}, {"id": "ANA-NI-038", "text": "Complete claw hand: {{c1::ulnar + median}} nerves — a {{c2::lower trunk (C8–T1)}} lesion", "extra": "", "sec": "Part 04 · 4.1 Partial vs complete claw hand"}, {"id": "ANA-NI-039", "text": "Fingers clawed — partial (ulnar) claw: mainly {{c1::4th & 5th}}; complete (lower trunk) claw: {{c2::2nd–5th}}", "extra": "MCP hyperextended, IP flexed.", "sec": "Part 04 · 4.1 Partial vs complete claw hand"}, {"id": "ANA-NI-040", "text": "Thenar muscles — partial (ulnar) claw: {{c1::preserved}}; complete (lower trunk) claw: {{c2::paralysed / atrophied}}", "extra": "The thenar muscles separate the two.", "sec": "Part 04 · 4.1 Partial vs complete claw hand"}, {"id": "ANA-NI-041", "text": "Hypothenar muscles in partial (ulnar) and complete claw hand: {{c1::paralysed in both}}", "extra": "", "sec": "Part 04 · 4.1 Partial vs complete claw hand"}, {"id": "ANA-NI-042", "text": "Ulnar nerve lesion at the wrist — hand muscles spared: the {{c1::thenar muscles}} (+ 1st & 2nd lumbricals)", "extra": "They are median-supplied; only the ulnar-supplied intrinsic muscles are paralysed.", "sec": "Part 04 · 4.1 Partial vs complete claw hand"}, {"id": "ANA-NI-043", "text": "Clinical test for an ulnar nerve lesion: {{c1::paper test}}", "extra": "Holding a paper between the fingers. Median test = counting test.", "sec": "Part 04 · 4.2 Tests for ulnar nerve lesion"}, {"id": "ANA-NI-044", "text": "Claw hand with wasting of interossei & hypothenar muscles (thenar normal) → {{c1::ulnar}} nerve; clinical test: {{c2::paper test}}", "extra": "Anatomy GD (nerve injury) Case 3.", "sec": "Part 04 · 4.2 Tests for ulnar nerve lesion"}, {"id": "ANA-NI-045", "text": "Positive Froment sign = inability to move {{c1::adductor pollicis}}", "extra": "Official key (Formative 3 Q9); not named in the pamphlet. Adductor pollicis is ulnar-supplied (not one of LOAF).", "sec": "Part 04 · 4.2 Tests for ulnar nerve lesion"}, {"id": "ANA-NI-046", "text": "Radial nerve injury in the axilla: {{c1::wrist drop}} + {{c2::finger drop}} + loss of {{c3::elbow extension}}", "extra": "Only the axilla lesion adds loss of elbow extension.", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-047", "text": "Radial injury causes wrist drop because it supplies the major wrist extensors: {{c1::ECRL}} · {{c2::ECRB}} · {{c3::ECU}}", "extra": "", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-048", "text": "Radial lesion in the axilla also loses elbow extension: it is above the branches to {{c1::triceps}} (long head given off in the axilla)", "extra": "Official GD answer (pamphlet leaves this as a discussion point).", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-049", "text": "Crutch used incorrectly → wrist drop → {{c1::radial}} nerve compressed in the {{c2::axilla}}", "extra": "Anatomy GD (nerve injury) Q6.", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-050", "text": "Radial nerve compression in the axilla or upper arm: by a {{c1::crutch}}, or sleeping with the arm over a {{c2::chair back / edge of the bed}}", "extra": "", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-051", "text": "Wrist drop after a humeral shaft fracture → {{c1::radial}} nerve, injured in the {{c2::spiral groove}}", "extra": "GD Case 1 key; the site is from Anatomy L5 3.1 (the NI pamphlet leaves it as a discussion point).", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-052", "text": "Posterior interosseous nerve lesion: {{c1::finger drop}} but no wrist drop, because {{c2::ECRL}} is preserved", "extra": "ECRL is supplied by the radial nerve itself, above the posterior interosseous.", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-053", "text": "Finger drop, no wrist drop, normal elbow extension and no sensory loss → {{c1::posterior interosseous nerve}}", "extra": "Anatomy GD Case 4. No sensory loss: skin is the superficial radial branch, spared.", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-054", "text": "Superficial radial nerve lesion: {{c1::sensory loss only}}", "extra": "", "sec": "Part 05 · 5.1 Radial nerve injury by site"}, {"id": "ANA-NI-055", "text": "Radial nerve sensory loss: posterior surface of the {{c1::lower part of the arm}} · a {{c2::narrow strip on the back of the forearm}} · {{c3::lateral 2/3 of the back of the hand}} · lateral 3½ fingers up to the {{c4::middle phalanges}}", "extra": "", "sec": "Part 05 · 5.2 Sensory loss in radial nerve injury"}, {"id": "ANA-NI-056", "text": "Midshaft humeral fracture + wrist drop → also expect sensory loss over the {{c1::lateral part of the dorsum of the hand}}", "extra": "Radial nerve; weak shoulder abduction would point to the axillary nerve instead.", "sec": "Part 05 · 5.2 Sensory loss in radial nerve injury"}, {"id": "ANA-NI-057", "text": "Test for a median nerve lesion: {{c1::counting test}} — the patient cannot {{c2::oppose the thumb}} to the rest of the fingers", "extra": "", "sec": "Part 06 · 6.1 Median nerve lesion"}, {"id": "ANA-NI-058", "text": "Median nerve lesion → {{c1::ape-like (simian)}} hand", "extra": "", "sec": "Part 06 · 6.1 Median nerve lesion"}, {"id": "ANA-NI-059", "text": "Ape (simian) hand: emaciation of the {{c1::thenar eminence}}; thumb {{c2::adducted and extended}}; cannot oppose the thumb", "extra": "", "sec": "Part 06 · 6.1 Median nerve lesion"}, {"id": "ANA-NI-060", "text": "A median lesion produces an ape-like hand because it paralyses the {{c1::thenar muscles}} (abductor pollicis brevis, flexor pollicis brevis, opponens pollicis)", "extra": "Anatomy GD (nerve injury) Q7.", "sec": "Part 06 · 6.1 Median nerve lesion"}, {"id": "ANA-NI-061", "text": "Opposition of the thumb occurs at the {{c1::carpometacarpal}} joint", "extra": "", "sec": "Part 06 · 6.1 Median nerve lesion"}, {"id": "ANA-NI-062", "text": "Inability to oppose the thumb + flattened thenar eminence → {{c1::median}} nerve; deformity: {{c2::ape hand}}", "extra": "Anatomy GD (nerve injury) Case 2.", "sec": "Part 06 · 6.1 Median nerve lesion"}, {"id": "ANA-NI-063", "text": "Carpal tunnel syndrome: a lesion that {{c1::decreases the size of the tunnel}} and compresses the {{c2::median nerve}} deep to the {{c3::flexor retinaculum}}", "extra": "", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-064", "text": "Causes of carpal tunnel syndrome: spontaneously in {{c1::middle-aged women}} or during {{c2::pregnancy}} · thickening of the synovial sheaths from {{c3::inflammation of the long flexor tendons}}", "extra": "", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-065", "text": "Carpal tunnel syndrome sensory symptoms: burning pain, pins & needles, numbness in the {{c1::lateral 3½ fingers}}", "extra": "", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-066", "text": "Carpal tunnel syndrome spares sensation over the palm (thenar eminence): the {{c1::palmar cutaneous branch}} of the median nerve passes {{c2::superficial to}} the flexor retinaculum", "extra": "", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-067", "text": "Carpal tunnel syndrome — the thenar muscles show {{c1::weakness & flattening}}", "extra": "", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-068", "text": "Carpal tunnel syndrome — deformity: {{c1::ape hand}}; clinical test: {{c2::counting test}}", "extra": "CTS = median + 3½ fingers + thenar weakness + spared thenar skin.", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-069", "text": "Sign NOT expected in carpal tunnel syndrome: weakness of thumb {{c1::adduction}}", "extra": "Formative 2 Q3: adductor pollicis is ulnar; thumb abduction & opposition are weak, index/middle finger pain & numbness occur.", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-070", "text": "Contents of the carpal tunnel (deep to the flexor retinaculum): the {{c1::median nerve}} + tendons of {{c2::FDS & FDP}} + tendon of {{c3::flexor pollicis longus}}", "extra": "Ulnar nerve & artery are outside, in front of the retinaculum.", "sec": "Part 06 · 6.2 Carpal tunnel syndrome"}, {"id": "ANA-NI-071", "text": "Classic deformity — radial nerve: {{c1::wrist drop}} · median nerve: {{c2::ape-like hand}} · ulnar nerve: {{c3::incomplete claw hand}} · lower trunk: {{c4::complete claw hand}} · upper trunk: {{c5::waiter's tip hand}}", "extra": "Anatomy GD (nerve injury) Q9.", "sec": "Part 07 · 7.1 Match the nerve with the classic deformity"}], "lib": "./", "prev": {"href": "ana-l5.html", "title": "Lecture 5 · Innervation of the Upper Limb"}, "next": {"href": "ana-l6.html", "title": "Lecture 6 · Thigh"}, "searchHint": "e.g. ulnar, abduction, hyperextended"};
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){
  const r = document.documentElement;
  if (S.set.theme === 'light' || S.set.theme === 'dark') r.dataset.theme = S.set.theme; else r.removeAttribute('data-theme');
  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);
  if (rs.getPropertyValue('--ph') !== vph) rs.setProperty('--ph', vph);
  book.classList.toggle('single', mode === 'single');
  // a new size only reflows the CSS; the pages are rebuilt only when the book switches between one and two pages,
  // so a phone's sliding toolbar, the keyboard or a resizing frame can never reset the page you are reading
  if (opened && (force || mode !== drawnMode)) draw();
}
window.addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(function again(){ if (busy){ layout.t = setTimeout(again, 120); return; } layout(); }, 80);
});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);

  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){
      if (at + 1 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at, 'r'); lb.innerHTML = '<div class="pin"></div>'; setPage(pgL, at + 1, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)', opacity: 1}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .7}, {transform: 'rotateY(-180deg)', opacity: 0}], () => { at++; clearLeaf(); busy = false; mark(at); upd(); });
    } else {
      if (at - 1 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at - 1, 'r'); lb.innerHTML = '<div class="pin"></div>'; leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(-180deg)', opacity: 0}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .3}, {transform: 'rotateY(0deg)', opacity: 1}], () => { at--; setPage(pgL, at, 'r'); clearLeaf(); busy = false; upd(); });
    }
  }
}
