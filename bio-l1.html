deficiency after fusion or high PTH"]]}]}], "labName": "Recall · Vitamin D Toxicity & Osteoporosis (2/2)"}, {"id": "p41", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0213"}]}, {"id": "p42", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L1-15"}]}, {"id": "p43", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0181"}]}, {"id": "p44", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0182"}]}, {"id": "p45", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0183"}]}, {"id": "p46", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0193"}]}, {"id": "p47", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L1-06"}]}, {"id": "p48", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0179"}]}, {"id": "p49", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "TP-048"}]}, {"id": "p50", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L1-07"}]}, {"id": "p51", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0180"}]}, {"id": "p52", "head": "Part 06 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "06", "title": "Rapid Revision", "sub": "One-liners, mnemonic vault, exam traps"}, {"t": "h", "no": "", "title": "One-liners, mnemonic vault, exam traps"}, {"t": "list", "items": ["ADEK stays, B &amp; C go away", "Liver before Kidney, 25 before 1", "Low Phos, Low Ca, High PTH switch renal hydroxylase on", "OsteoPorosis = Poor quantity; OsteoMalacia = poor Mineral"]}], "toc": ["06", "Rapid Revision"]}, {"id": "p53", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l1-5-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonic vault, exam traps", "items": [["ADEK stays", "B &amp; C go away"], ["Liver before", "Kidney, 25 before 1"], ["Low Phos, Low Ca", "High PTH switch renal hydroxylase on"], ["OsteoPorosis =", "Poor quantity; OsteoMalacia = poor Mineral"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p54", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "B12 is water-soluble but is stored"}, {"t": "note", "kind": "trap", "html": "25-OH D3 is the storage/circulating form — not the active form"}, {"t": "note", "kind": "trap", "html": "Milk is a poor source — only fortified milk supplies vitamin D"}, {"t": "note", "kind": "trap", "html": "Vitamin D excess and deficiency both cause bone resorption"}, {"t": "note", "kind": "trap", "html": "In renal failure plain vitamin D won't work — give 1,25-DHCC"}, {"t": "note", "kind": "trap", "html": "Calcitriol mobilizes bone Ca2+ only with PTH present"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p55", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Osteoporosis has normal mineralization"}, {"t": "note", "kind": "cl", "html": "Cirrhosis/liver failure may produce bone demineralization (no 25-hydroxylation)"}, {"t": "note", "kind": "cl", "html": "End-stage renal disease → renal osteodystrophy; IV or oral 1,25-DHCC may be given"}, {"t": "note", "kind": "cl", "html": "Vitamin D toxicity: hypercalcaemia impairs renal function; supplementation must be monitored"}]}, {"id": "p56", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0178": {"id": "Q0178", "stem": "A 2-year-old girl has failure to thrive and an unusual gait. She has bowed legs, thick wrists and dental caries. Her weight and height are below the 3rd percentile for her age. Her diet consists predominantly of breastfeeding 5 times daily. Her antenatal, delivery and postnatal history are unremarkable.\nWhat would be your advice for the mother of this child?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Rickets is treated with calcium + vitamin D supplements. Vitamin D can also be made in the skin by UV light or taken from food, where fish liver oils are rich, liver and egg yolk good and milk poor unless fortified.", "type": "written", "keyhtml": "• Give the child calcium + vitamin D supplements (the treatment of rickets), within recommended doses — excess vitamin D is toxic.\n• Expose the child to sunlight: UV light converts 7-dehydrocholesterol in the skin to vitamin D3.\n• Add vitamin D-rich foods: fish liver oils (richest), liver and egg yolk, and vitamin D-fortified milk — ordinary milk is a poor source, so a diet based mainly on milk supplies little vitamin D."}, "Q0192": {"id": "Q0192", "stem": "A 2-year-old girl has failure to thrive and unusual gait. She has bowed legs, thick wrists and dental caries. Her weight and height are below the 3rd percentile for her age. Her diet consists predominantly of breast feeding 5 times daily. The patient's antenatal, delivery and postnatal history are unremarkable.\n1. What is your diagnosis?\n2. What is the recommended treatment?", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO W1", "bank": true, "expl": "Rickets is vitamin D deficiency in childhood: abnormal ossification bows the soft bones, most strikingly in the legs, and muscle weakness is common. It is treated with calcium + vitamin D supplements.", "img": ["figs/GB-26.jpg", "figs/GB-26_2.jpg"], "cap": "The child, and an X-ray of her lower limbs", "type": "written", "keyhtml": "1. Diagnosis: rickets — vitamin D deficiency in childhood (before epiphyseal fusion).\n• Abnormal ossification → bowing of the soft bones, most striking in the legs (bowed legs, seen on the X-ray); muscle weakness is common (unusual gait).\n• Her diet is mainly milk, which is a poor source of vitamin D.\n2. Treatment: calcium + vitamin D supplements, within the recommended doses (vitamin D in excess is toxic).\n• Supporting advice: sun (UV) exposure for skin synthesis of D₃; vitamin D sources such as fish liver oils, liver, egg yolk and fortified milk."}, "Q0179": {"id": "Q0179", "stem": "Mrs. M, 82 years old, broke her right hip while attempting to go to the bathroom in the middle of the night. Prior to this accident, she had been living alone and spent most of her time watching TV. She had a history of a wrist fracture 20 years ago when she slipped and fell on a wet floor. She is a strict vegan.\nWhat would be your provisional diagnosis? Give your justifications.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Osteoporosis is a gradual loss of bone mass giving weak, porous bones and an increased fracture risk; it occurs with ageing, postmenopausal oestrogen loss and lack of exercise.", "type": "written", "keyhtml": "Provisional diagnosis: osteoporosis.\nJustifications:\n• Elderly (82 years), postmenopausal woman — osteoporosis occurs with ageing and with loss of oestrogen stimulation after menopause.\n• Physically inactive (spends most of her time watching TV) — lack of exercise decreases bone density.\n• Fractures after mild trauma (hip now; wrist after a slip 20 years ago) — weak, porous bones with an increased fracture risk.\n• Mostly indoors and a strict vegan — little UV exposure and no fish liver oil, liver or egg yolk, so a poor vitamin D supply (calcium + vitamin D supplements are part of her treatment)."}, "Q0180": {"id": "Q0180", "stem": "Mrs. M, 82 years old, broke her right hip while attempting to go to the bathroom in the middle of the night. Prior to this accident, she had been living alone and spent most of her time watching TV. She had a history of a wrist fracture 20 years ago when she slipped and fell on a wet floor. She is a strict vegan.\nWhat is the difference between osteoporosis and osteomalacia?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The core distinction is quantity versus mineral: osteoporosis has less bone that is normally mineralized, whereas osteomalacia has deficient mineralization.", "type": "written", "keyhtml": "• Osteoporosis: a decrease in bone mass with normal mineralization; main causes are ageing, menopause (oestrogen loss) and inactivity.\n• Osteomalacia: deficient mineralization of bone; main causes are vitamin D deficiency after epiphyseal fusion, or high PTH."}, "Q0193": {"id": "Q0193", "stem": "Mrs. M, 82 years old, broke her right hip while attempting to go to the bathroom in the middle of the night. Prior to this accident, she had been living alone and spent most of her time watching the TV. She had a history of wrist fracture 20 years ago when she slipped and fell on a wet floor. She is a strict vegan.\nWhat are the diagnosis and treatment of the disease?", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO W2", "bank": true, "expl": "Osteoporosis follows ageing, postmenopausal oestrogen loss and inactivity. Treatment is exercise, calcium + vitamin D, oestrogen receptor drugs or HRT, and bisphosphonates, which bind hydroxyapatite so bone resists osteoclasts.", "type": "written", "keyhtml": "Diagnosis: osteoporosis — an elderly (postmenopausal) woman, physically inactive, with fractures after minor falls (gradual loss of bone mass → weak, porous bones, ↑ fracture risk).\nTreatment:\n1. Exercise.\n2. Calcium and vitamin D supplements.\n3. Estrogen receptor drugs or hormone replacement therapy (estrogen and progesterone) may be used.\n4. Bisphosphonates (such as alendronate and ibandronate) combine with hydroxyapatite in bone, and bones become more resistant to osteoclast-induced breakdown."}, "Q0181": {"id": "Q0181", "stem": "A 45-year-old man has a 3-week history of weakness, excessive urination, intense thirst and a staggering walk. For most of his adult life he took excessive amounts of vitamin C because he was told it would help prevent the common cold. For the past month he took excessive amounts of vitamin D and calcium every day because he learned that he was developing osteoporosis. Recent lab tests revealed greatly elevated serum calcium.\nWhat is the most likely diagnosis?", "top": false, "rep": "", "tag": "Final bank BIO Q4", "bank": true, "expl": "Excess vitamin D increases gut absorption of Ca²⁺ and PO₄ and causes bone resorption, giving hypercalcaemia that impairs renal function — hence his polyuria and intense thirst. Vitamin D deficiency would lower, not raise, calcium absorption.", "type": "mcq", "opts": ["Vitamin D deficiency", "Vitamin A toxicity", "Vitamin D toxicity", "Vitamin A deficiency"], "ans": 2}, "Q0182": {"id": "Q0182", "stem": "A 45-year-old man has a 3-week history of weakness, excessive urination, intense thirst and a staggering walk. For most of his adult life he took excessive amounts of vitamin C because he was told it would help prevent the common cold. For the past month he took excessive amounts of vitamin D and calcium every day because he learned that he was developing osteoporosis. Recent lab tests revealed greatly elevated serum calcium.\nWhen do you expect vitamin D to reach a toxic level?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Vitamin D toxicity follows intake continuously exceeding 10× RDA; being fat-soluble, the excess is stored in the liver as 25-hydroxycholecalciferol rather than excreted.", "type": "written", "keyhtml": "When intake continuously exceeds 10× the recommended daily allowance (RDA).\n• Unlike water-soluble vitamins, the excess is not excreted in urine but stored in the liver as 25-hydroxycholecalciferol, so it accumulates."}, "Q0183": {"id": "Q0183", "stem": "A 45-year-old man has a 3-week history of weakness, excessive urination, intense thirst and a staggering walk. For most of his adult life he took excessive amounts of vitamin C because he was told it would help prevent the common cold. For the past month he took excessive amounts of vitamin D and calcium every day because he learned that he was developing osteoporosis. Recent lab tests revealed greatly elevated serum calcium.\nWhat are the consequences of vitamin D toxicity?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Excess vitamin D raises serum calcium from two sources (gut absorption and bone resorption), causing hypercalcaemia and hypercalciuria; the kidney is damaged first functionally, then by calcification.", "type": "written", "keyhtml": "• Hypercalcaemia — from ↑ intestinal absorption of Ca²⁺ and PO₄ plus direct bone resorption\n• Hypercalciuria\n• Impaired renal function — early signs: polyuria, polydipsia and nocturia\n• Prolonged hypercalcaemia: calcium deposition in soft tissues, notably the kidney → irreversible kidney damage (so supplementation must be monitored)"}, "Q0213": {"id": "Q0213", "stem": "A 45-year-old man had a 3-week history of weakness, excessive urination, intense thirst, and staggering walk. For most of his adult life, he took excessive amounts of vitamin C because he was told it would help prevent the common cold. The past month, he took excessive amounts of vitamin D and calcium every day because he learned that he was developing osteoporosis. Recent lab tests revealed greatly elevated serum calcium, and vitamin D toxicity was diagnosed.\nExplain the biochemical basis of the condition.", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W3", "bank": true, "expl": "This is vitamin D toxicity: fat-soluble vitamin D is stored rather than excreted, so excess accumulates; extra gut absorption plus bone resorption raise serum calcium, and the kidney pays the price.", "type": "written", "keyhtml": "Vitamin D toxicity (hypervitaminosis D):\n• Vitamin D is highly toxic at consumption levels that continuously exceed 10× the recommended daily allowance (RDA), resulting in hypercalcemia and hypercalciuria.\n• Unlike water-soluble vitamins, which are excreted in excess amounts (as with his excess vitamin C), vitamin D can be stored in the liver as 25-hydroxycholecalciferol, so it accumulates.\n• The excess vitamin D promotes intestinal absorption of calcium and phosphate.\n• The direct effect of excessive vitamin D on bone is resorption, similar to that seen in vitamin D deficiency.\n• Therefore, the increased intestinal absorption plus bone resorption raise serum calcium → hypercalcemia + hypercalciuria.\n• Hypercalcemia impairs renal function → polyuria, polydipsia, nocturia (his excessive urination and intense thirst); if prolonged → calcium deposition in soft tissues, notably the kidney → irreversible kidney damage. Vitamin D supplementation must therefore be monitored."}, "Q0188": {"id": "Q0188", "stem": "Enumerate the provitamins (vitamin precursors).", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO W4", "bank": true, "expl": "Provitamins are inactive precursors converted to active vitamins inside the body: carotenes give vitamin A, 7-dehydrocholesterol gives vitamin D₃ and ergosterol gives vitamin D₂.", "type": "written", "keyhtml": "Provitamin A: carotenoids (carotenes → vitamin A).\nProvitamin D: 7-dehydrocholesterol (→ vitamin D₃, cholecalciferol, by UV light in the skin) — ergosterol (→ vitamin D₂, ergocalciferol, in plants and yeast after UV exposure)."}, "Q0191": {"id": "Q0191", "stem": "List the functions of vitamin D as regard PTH influence (numbered 1–3 on the figure).", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO W5", "bank": true, "expl": "Hypocalcaemia releases PTH, which binds renal proximal tubule cells and switches on 1α-hydroxylase; the calcitriol formed raises blood calcium through gut absorption, renal reabsorption and, with PTH, mobilization of calcium from bone.", "img": ["figs/GB-32.jpg"], "cap": "PTH and vitamin D activity — sites 1, 2 and 3", "aimg": ["figs/GB-32_ans.jpg", "figs/GB-32_ans2.jpg"], "acap": "Labelled PTH / vitamin D activity diagram; response of vitamin D and PTH to hypocalcaemia", "type": "written", "keyhtml": "PTH is released when ionized Ca²⁺ falls (or PO₄³⁻ rises, or 1,25-(OH)₂D₃ falls); it acts on the renal tubular cells and stimulates 1α-hydroxylase (as does ↓ PO₄³⁻), so 25-OH D₃ → 1,25-(OH)₂D₃ (calcitriol).\n1. Renal tubular cells: ↑ 1,25-(OH)₂D₃ synthesis; reabsorption ↑ Ca²⁺, ↓ PO₄³⁻ (urine: ↓ Ca²⁺, ↑ PO₄³⁻).\n2. Bone: ↑ Ca²⁺ and ↑ PO₄³⁻ released from bone (calcitriol mobilizes bone calcium when PTH is present).\n3. Intestines/kidneys: ↑ absorption of Ca²⁺ and PO₄³⁻ (calcitriol induces calcium-binding proteins in the duodenum).\nNet result: ↑ Ca²⁺ (and ↓ PO₄³⁻); 1,25-(OH)₂D₃ gives feedback inhibition of PTH synthesis."}, "Q0205": {"id": "Q0205", "stem": "Enumerate: the active form of vitamin D.", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W6", "bank": true, "expl": "Calcitriol is the active steroid-hormone form of vitamin D, made in the kidney; 25-OH D3 from the liver is only the storage/circulating form.", "type": "written", "keyhtml": "Calcitriol — 1,25-dihydroxycholecalciferol [1,25-(OH)₂D₃], formed in the kidney by 1α-hydroxylase."}, "Q0206": {"id": "Q0206", "stem": "Enumerate the 2 enzymes responsible for activation of vitamin D (mention their sites).", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W7", "bank": true, "expl": "Vitamin D2 and D3 are not biologically active; activation is liver first (C-25) and then kidney (C-1), and the renal step is rate-limiting.", "type": "written", "keyhtml": "1. 25-hydroxylase — liver: hydroxylation at C-25 → 25-OH D₃ (25-hydroxycholecalciferol), the major storage and predominant circulating form.\n2. 1α-hydroxylase (25-hydroxycholecalciferol 1α-hydroxylase) — kidney (proximal tubule): hydroxylation at C-1 → 1,25-(OH)₂D₃ (calcitriol), the active form; the final, rate-limiting step."}, "Q0207": {"id": "Q0207", "stem": "Enumerate the functions of vitamin D (calciferol).", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W8", "bank": true, "expl": "Calcitriol regulates blood Ca²⁺ through the gut (absorption), the kidney (reabsorption) and bone. Its bone effect depends on the dose — mineralization at low levels but resorption at high levels — which is why both deficiency and toxicity damage bone.", "type": "written", "keyhtml": "1. Intestine: increases absorption of Ca²⁺ (and PO₄) — calcitriol induces calcium-binding proteins.\n2. Kidney: increases (facilitates) reabsorption of Ca²⁺.\n3. Bone: increases deposition of Ca²⁺ (mineralization at low levels; at high levels the effect is resorption; mobilizes Ca²⁺ from bone when PTH is present)."}, "Q0208": {"id": "Q0208", "stem": "Enumerate the deficiency manifestations of vitamin D.", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W9", "bank": true, "expl": "Vitamin D deficiency causes rickets before the epiphyses fuse and osteomalacia after they fuse.", "type": "written", "keyhtml": "According to age:\n• Infants &amp; growing children: rickets — abnormal ossification, bowing of soft bones (most striking in the legs), muscle weakness.\n• Adults (after epiphyseal fusion): osteomalacia — bone demineralization, bone pain, muscle weakness, less deformity.\n(Kidney disease: insufficient 1,25-DHCC → renal osteodystrophy.)"}, "Q0209": {"id": "Q0209", "stem": "Enumerate the causes of rickets (vitamin D deficiency).", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W10", "bank": true, "expl": "Vitamin D deficiency can arise at any step of its pathway — too little vitamin D (intake or skin synthesis), failed activation in the liver or kidney (1α-hydroxylase), or failure of calcitriol to act.", "type": "written", "keyhtml": "1. Decreased intake.\n2. Lack of exposure to UVR (insufficient UV light — cold, cloudy climates → too little D₃ made from 7-dehydrocholesterol).\n3. Defect in 1α-hydroxylase (genetic — vitamin D-resistant rickets).\n4. Calcitriol receptor defect.\n(Pamphlet also lists: severe liver disease → defective 25-hydroxylation; end-stage renal disease, e.g. secondary to diabetes mellitus; Fanconi renal syndrome.)"}, "Q0210": {"id": "Q0210", "stem": "Enumerate the causes of vitamin D-resistant rickets.", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO W11", "bank": true, "expl": "Vitamin D-resistant rickets is genetic 1α-hydroxylase deficiency: plain vitamin D cannot be activated, so the already active 1,25-DHCC is given.", "type": "written", "keyhtml": "Defect in 1α-hydroxylase — genetic deficiency of renal 1α-hydroxylase, so calcitriol cannot be formed. Treatment: 1,25-DHCC or a drug analogue that does not need renal metabolism."}, "Q0202": {"id": "Q0202", "stem": "A 30-month-old girl whose growth rate has been in the lower 10th percentile over the last year presents with a chronic, nonproductive cough and diarrhoea with foul-smelling, fatty stools (steatorrhoea). She is diagnosed with cystic fibrosis. For which of the following vitamins is this child most at risk of deficiency?", "top": false, "rep": "", "tag": "Final bank BIO Q3", "bank": true, "expl": "Fat-soluble vitamins (A, D, E, K) are absorbed efficiently only when fat absorption is normal, so steatorrhoea (malabsorption) causes their deficiency; retinol is the only one of these among the options. Vitamin C and riboflavin (B2) are water-soluble.", "type": "mcq", "opts": ["Ascorbic acid (vitamin C)", "Biotin", "Folic acid", "Retinol (vitamin A)", "Riboflavin (vitamin B2)"], "ans": 3}, "Q0203": {"id": "Q0203", "stem": "Before the introduction of vitamin D-fortified milk, children who spent most of their time indoors often developed rickets. In these vitamin D deficient children, the most likely explanation for their bone malformations is which of the following?", "top": true, "rep": "asked 4 years", "tag": "Final bank BIO Q1", "bank": true, "expl": "Vitamin D, as calcitriol, increases intestinal absorption of Ca²⁺ and PO₄ by inducing calcium-binding proteins, so in deficiency too little calcium is taken up to mineralize growing bone. Lack of exercise lowers bone density, but it does not cause rickets if vitamin D is sufficient.", "type": "mcq", "opts": ["Excessive renal excretion of calcium", "Excessive renal excretion of phosphate ion", "Inadequate uptake of calcium in the intestine", "Lack of weight-bearing exercise", "Excessive renal tubular reabsorption of calcium"], "ans": 2}, "Q0204": {"id": "Q0204", "stem": "In adults, a severe deficiency of vitamin D causes:", "top": true, "rep": "asked 4 years", "tag": "Final bank BIO Q2", "bank": true, "expl": "After epiphyseal fusion, vitamin D deficiency causes osteomalacia — bone demineralization with bone pain, muscle weakness and less deformity. Rickets is the same deficiency in childhood, before the epiphyses fuse.", "type": "mcq", "opts": ["Night blindness", "Osteomalacia", "Rickets", "Osteogenesis imperfecta", "Osteopetrosis"], "ans": 1}, "N-BIO-L1-01": {"id": "N-BIO-L1-01", "stem": "A child who plays outdoors every day makes much of her vitamin D in her skin. Which provitamin does UV light convert there into vitamin D3 (cholecalciferol)?", "top": false, "rep": "", "tag": "Final bank BIO Q5", "bank": true, "expl": "7-dehydrocholesterol (provitamin D) is made from cholesterol by the intestinal mucosa, passes to the skin, and UV light converts it to D3. Ergosterol is the plant and yeast precursor that UV turns into D2, and carotenes are provitamin A.", "type": "mcq", "opts": ["Ergosterol", "7-dehydrocholesterol", "Carotene", "Cholesterol", "25-hydroxycholecalciferol"], "ans": 1}, "N-BIO-L1-02": {"id": "N-BIO-L1-02", "stem": "A man who has taken vitamin D far above the recommended daily allowance for months develops hypervitaminosis D because, unlike water-soluble vitamins, the excess is stored in his liver. Which form of vitamin D is the major storage form and also the predominant circulating form?", "top": false, "rep": "", "tag": "Final bank BIO Q6", "bank": true, "expl": "Hydroxylation at C-25 in the liver forms 25-OH D3, the major storage and predominant circulating form — the form in which excess vitamin D is stored in toxicity. Calcitriol is the active form made in the kidney, not the storage form.", "type": "mcq", "opts": ["Cholecalciferol (D3)", "25-hydroxycholecalciferol (25-OH D3)", "1,25-dihydroxycholecalciferol (calcitriol)", "Ergocalciferol (D2)", "7-dehydrocholesterol"], "ans": 1}, "N-BIO-L1-03": {"id": "N-BIO-L1-03", "stem": "Which of the following changes in serum mineral levels stimulates renal 1α-hydroxylase directly, rather than through PTH?", "top": false, "rep": "", "tag": "Final bank BIO Q7", "bank": true, "expl": "Low serum phosphate stimulates renal 1α-hydroxylase directly. Low serum calcium also stimulates it, but indirectly, by triggering PTH release; a rise in serum calcitriol inhibits the enzyme by negative feedback.", "type": "mcq", "opts": ["Fall in serum calcium", "Fall in serum phosphate", "Rise in serum calcium", "Rise in serum phosphate"], "ans": 1}, "N-BIO-L1-04": {"id": "N-BIO-L1-04", "stem": "A lipid-soluble hormone enters duodenal epithelial cells, binds an intracellular receptor that attaches to response elements in DNA, and induces the synthesis of calcium-binding proteins, increasing calcium uptake from the gut. Which hormone is this?", "top": false, "rep": "", "tag": "Final bank BIO Q8", "bank": true, "expl": "Calcitriol (1,25-dihydroxycholecalciferol) is the active steroid-hormone form of vitamin D and acts in the duodenum through an intracellular receptor and gene transcription. PTH acts on the kidney, binding receptors on proximal tubule cells to switch on 1α-hydroxylase; D2, D3 and 25-OH D3 are not the active form.", "type": "mcq", "opts": ["Parathormone (PTH)", "Calcitriol", "25-hydroxycholecalciferol", "Cholecalciferol", "Ergocalciferol"], "ans": 1}, "N-BIO-L1-05": {"id": "N-BIO-L1-05", "stem": "A 58-year-old man with end-stage renal disease secondary to diabetes mellitus has bone pain and demineralized bones (renal osteodystrophy). Which preparation should be given to correct his vitamin D status?", "top": false, "rep": "", "tag": "Final bank BIO Q9", "bank": true, "expl": "The diseased kidney cannot perform the final 1α-hydroxylation, so plain vitamin D is useless; give 1,25-DHCC or an analogue that does not need renal metabolism. 25-hydroxycholecalciferol suits liver disease, where 25-hydroxylation is the broken step, but it still needs the kidney.", "type": "mcq", "opts": ["Cholecalciferol (D3)", "Ergocalciferol (D2)", "25-hydroxycholecalciferol", "1,25-dihydroxycholecalciferol", "7-dehydrocholesterol"], "ans": 3}, "N-BIO-L1-06": {"id": "N-BIO-L1-06", "stem": "A 70-year-old postmenopausal woman with osteoporosis is started on alendronate. How does this drug protect her bones?", "top": false, "rep": "", "tag": "Final bank BIO Q10", "bank": true, "expl": "Bisphosphonates (alendronate, ibandronate) combine with hydroxyapatite in bone, making it more resistant to osteoclast-induced breakdown. Oestrogen receptor drugs or HRT are a separate treatment option, and inducing calcium-binding proteins is calcitriol's action in the gut.", "type": "mcq", "opts": ["Binds hydroxyapatite so bone resists osteoclast breakdown", "Acts on oestrogen receptors to replace lost oestrogen", "Induces calcium-binding proteins in duodenal cells", "Stimulates renal 1α-hydroxylase to raise calcitriol", "Supplies calcium for mineralization of new bone"], "ans": 0}, "N-BIO-L1-07": {"id": "N-BIO-L1-07", "stem": "A bone biopsy from a 75-year-old inactive woman with a recent wrist fracture shows decreased bone mass with normal mineralization. Which diagnosis is most likely?", "top": false, "rep": "", "tag": "Final bank BIO Q11", "bank": true, "expl": "Osteoporosis is a decrease in bone mass with normal mineralization, seen with ageing, postmenopausal oestrogen loss and inactivity. Osteomalacia, the tempting answer, is deficient mineralization of bone (vitamin D deficiency after epiphyseal fusion, or high PTH).", "type": "mcq", "opts": ["Osteoporosis", "Osteomalacia", "Rickets", "Renal osteodystrophy", "Vitamin D toxicity"], "ans": 0}, "N-BIO-L1-08": {"id": "N-BIO-L1-08", "stem": "Which of the following is a role of vitamins in the body?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Vitamins are organic nutrients needed in small amounts that act as cofactors for enzymes; they do not act as structural units or provide energy. Emulsifying fat is the job of bile, which fat-soluble vitamins need for absorption.", "type": "mcq", "opts": ["Acting as cofactors for enzymes in biochemical reactions", "Acting as structural units of cells and tissues", "Providing energy as a metabolic fuel", "Emulsifying dietary fat for absorption"], "ans": 0}, "N-BIO-L1-09": {"id": "N-BIO-L1-09", "stem": "Which vitamin is water-soluble yet, unlike the rest of its group, is stored in the body?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Water-soluble vitamins (B group and C) have limited storage and their excess is excreted in urine — the exception is vitamin B12. Vitamins A, D and K are stored in the liver, but they are fat-soluble.", "type": "mcq", "opts": ["Vitamin C", "Vitamin B12", "Vitamin D", "Vitamin K", "Vitamin A"], "ans": 1}, "N-BIO-L1-10": {"id": "N-BIO-L1-10", "stem": "Which group lists the vitamins that are needed for bone health?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Bones need 'A D-K and a C': A (bone health), D (strengthens bones, calcium absorption), K (bone health and blood clotting) and the water-soluble C (connective tissue). E is the fat-soluble vitamin without a bone role.", "type": "mcq", "opts": ["A, D, K and C", "A, D, E and K", "D, E and B12", "D and E only", "A, E and C"], "ans": 0}, "N-BIO-L1-11": {"id": "N-BIO-L1-11", "stem": "A mother asks which food is the richest natural dietary source of vitamin D for her child. Which is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Fish liver oils are the richest source of preformed D3; liver and egg yolk are good sources, while milk is poor unless fortified. Yeast contains ergosterol, which gives D2 only after UV exposure.", "type": "mcq", "opts": ["Fish liver oil", "Unfortified milk", "Egg yolk", "Liver", "Yeast"], "ans": 0}, "N-BIO-L1-12": {"id": "N-BIO-L1-12", "stem": "In the activation of vitamin D, which reaction is the final, rate-limiting step?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Activation needs two hydroxylations — liver first (C-25), then kidney (C-1, by 1α-hydroxylase in the proximal tubule) — and the renal step is the final, rate-limiting one. Liver 25-hydroxylation comes first and gives the storage form, not the active hormone.", "type": "mcq", "opts": ["UV conversion of 7-dehydrocholesterol to cholecalciferol in the skin", "Hydroxylation at C-25 by 25-hydroxylase in the liver", "Hydroxylation at C-1 by 1α-hydroxylase in the renal proximal tubule", "Formation of 7-dehydrocholesterol from cholesterol in the intestinal mucosa", "Conversion of ergosterol to ergocalciferol by UV light"], "ans": 2}, "N-BIO-L1-13": {"id": "N-BIO-L1-13", "stem": "In a patient with hypocalcaemia, which event directly switches on renal 1α-hydroxylase?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Hypocalcaemia releases PTH from the parathyroid; PTH binds renal proximal tubule cells and activates 1α-hydroxylase, so calcitriol is formed. A rise in calcitriol inhibits the enzyme by negative feedback.", "type": "mcq", "opts": ["PTH binding to receptors on renal proximal tubule cells", "Calcitriol binding to intracellular receptors in duodenal cells", "A rise in serum 1,25-(OH)2 D3", "25-hydroxylation of vitamin D3 in the liver"], "ans": 0}, "N-BIO-L1-14": {"id": "N-BIO-L1-14", "stem": "A 60-year-old man with severe liver disease (cirrhosis) has bone demineralization. Which vitamin D preparation bypasses his defective metabolic step?", "top": false, "rep": "", "tag": "Final bank BIO Q12", "bank": true, "expl": "Severe liver disease blocks 25-hydroxylation, so an already 25-hydroxylated form is given — 25-hydroxycholecalciferol (or 1,25-DHCC). Plain D3 or D2 still needs the liver step before the kidney can activate it.", "type": "mcq", "opts": ["Cholecalciferol (D3)", "Ergocalciferol (D2)", "25-hydroxycholecalciferol", "7-dehydrocholesterol", "Ergosterol"], "ans": 2}, "N-BIO-L1-15": {"id": "N-BIO-L1-15", "stem": "A woman taking vitamin D continuously above 10× the RDA develops hypercalcaemia with polyuria, polydipsia and nocturia. If her intake continues, what is the main long-term risk?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Prolonged hypercalcaemia in vitamin D toxicity deposits calcium in soft tissues, notably the kidney, causing irreversible kidney damage. At high levels vitamin D causes bone resorption, not increased mineralization.", "type": "mcq", "opts": ["Calcium deposition in the kidney with irreversible damage", "Bowing of the weight-bearing long bones", "Increased bone mineralization with denser bones", "Osteoporosis with normal mineralization"], "ans": 0}, "N-BIO-L1-16": {"id": "N-BIO-L1-16", "stem": "Compare fat-soluble and water-soluble vitamins as regards examples, absorption, storage, onset of deficiency and toxicity.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Everything follows from storage: stored fat-soluble vitamins give late deficiency and can be toxic, while water-soluble vitamins give rapid deficiency and their excess is excreted.", "type": "written", "keyhtml": "• Examples: fat-soluble — A, D, E, K; water-soluble — B group and C.\n• Absorption: fat-soluble are associated with fats, need bile for emulsification and are absorbed well only with normal fat absorption (steatorrhoea and biliary disorders → deficiency); water-soluble are found in the water of food.\n• Transport: fat-soluble travel in lipoproteins or on specific binding proteins.\n• Storage: fat-soluble are stored in the liver; water-soluble have limited storage (except B12) and must be provided regularly.\n• Onset of deficiency: fat-soluble — appears late after diet restriction; water-soluble — appears quickly.\n• Excess/toxicity: fat-soluble are not excreted in urine → hypervitaminosis; water-soluble excess is excreted in urine and rarely toxic."}, "N-BIO-L1-17": {"id": "N-BIO-L1-17", "stem": "Enumerate the factors that regulate renal 1α-hydroxylase, stating the effect of each.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Low phosphate, low calcium and high PTH all switch the renal hydroxylase on; its own product, calcitriol, switches it off.", "type": "written", "keyhtml": "• ↓ Serum phosphate — stimulates (direct)\n• ↓ Serum calcium — stimulates indirectly, via PTH release\n• Parathormone (PTH) — stimulates (direct)\n• ↑ Serum 1,25-(OH)2 D3 (calcitriol) — inhibits (negative feedback)"}, "N-BIO-L1-18": {"id": "N-BIO-L1-18", "stem": "Compare rickets and osteomalacia.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Both are vitamin D deficiency states; the dividing line is epiphyseal fusion — rickets in growing bone, osteomalacia in mature bone.", "type": "written", "keyhtml": "• Age: rickets — childhood; osteomalacia — after epiphyseal fusion (adults).\n• Lesion: rickets — abnormal ossification → bowing of soft bones; osteomalacia — bone demineralization (insufficient 1,25-DHCC → renal osteodystrophy).\n• Deformity: rickets — marked, most striking in the legs; osteomalacia — less deformity.\n• Symptoms: rickets — muscle weakness common; osteomalacia — bone pain + muscle weakness.\n• Other cause of osteomalacia: bone resorption from high PTH (primary parathyroid disease or secondary PTH stimulation).\n• Treatment: rickets — calcium + vitamin D supplements; osteomalacia — calcium + vitamin D and lowering high PTH, depending on the cause."}, "TP-048": {"id": "TP-048", "stem": "A 72-year-old woman who is a strict vegan broke her wrist after a minor trauma. She has been living alone and spends most of her time watching TV. Radiological investigations reveal a decrease in bone mass with normal mineralization. Which of the following would be your diagnosis?", "top": true, "rep": "", "tag": "Final bank BIO Q46", "bank": true, "expl": "Osteoporosis is a decrease in bone mass with normal mineralization; it occurs with ageing and after menopause (oestrogen loss), and lack of exercise also decreases bone density. Osteomalacia (adults, after epiphyseal fusion) is instead deficient mineralization, and rickets (vitamin D deficiency in childhood) is abnormal ossification with bowing of soft bones.", "type": "mcq", "opts": ["Rickets", "Osteomalacia", "Tuberculosis of bone", "Hyperthyroidism", "Osteoporosis"], "ans": 4}, "TP-032": {"id": "TP-032", "stem": "A 55-year-old woman with chronic kidney disease has low serum calcium despite vitamin D supplementation. What is the cause of her hypocalcemia?", "top": true, "rep": "", "tag": "Final bank BIO W19", "bank": true, "expl": "Kidney disease breaks the last activation step of vitamin D, so the supplement cannot be converted to calcitriol and gut calcium absorption stays low. Treatment must bypass the broken step with 1,25-DHCC.", "type": "written", "keyhtml": "• Vitamin D is not biologically active: after 25-hydroxylation in the liver it must be hydroxylated at C-1 by renal 1α-hydroxylase (proximal tubule) — the final, rate-limiting step — to form calcitriol (1,25-DHCC), the active form.\n• The diseased kidney cannot perform this 1α-hydroxylation → insufficient calcitriol (renal osteodystrophy).\n• Without calcitriol, calcium-binding proteins are not induced in the duodenum → ↓ intestinal Ca²⁺ absorption (and ↓ renal Ca²⁺ reabsorption) → hypocalcemia.\n• So plain vitamin D does not work; she needs 1,25-DHCC or an analogue that does not need renal metabolism."}, "TP-085": {"id": "TP-085", "stem": "A 58-year-old patient suffers from easy fatigue and muscle weakness. Lab tests reveal low serum levels of vitamin D and calcium. Explain on a biochemical basis how vitamin D affects GIT absorption of calcium.", "top": true, "rep": "", "tag": "Final bank BIO W20", "bank": true, "expl": "Calcitriol behaves like a steroid hormone: it binds an intracellular receptor and changes gene transcription so that duodenal cells make calcium-binding proteins. With low vitamin D these proteins are not induced, so calcium absorption and serum calcium fall.", "type": "written", "keyhtml": "• Vitamin D acts through its active form, calcitriol (1,25-dihydroxycholecalciferol), made by 25-hydroxylation in the liver and then 1α-hydroxylation in the kidney.\n• Calcitriol acts as a lipid-soluble (steroid) hormone on the duodenal epithelial cells: it enters the cell and binds an intracellular receptor.\n• The receptor binds response elements in the DNA enhancer regions and changes gene transcription.\n• This induces the synthesis of calcium-binding proteins → ↑ Ca²⁺ uptake from the GI tract (calcitriol also ↑ PO₄ absorption)."}}, "labs": {}, "cards": [{"id": "BIO-L1-001", "text": "Vitamins: {{c1::organic}} nutrients required in {{c2::small amounts}}, essential for normal growth, development and maintenance of life", "extra": "", "sec": "Part 01 · 1.1 What vitamins do — and don't do"}, {"id": "BIO-L1-002", "text": "Vitamins DO act as {{c1::cofactors for enzymes}} in biochemical reactions; they do NOT act as a {{c2::structural unit of the cell or tissue}} and do NOT {{c3::provide energy}}", "extra": "Dietary absence or relative deficiency → characteristic deficiency states.", "sec": "Part 01 · 1.1 What vitamins do — and don't do"}, {"id": "BIO-L1-003", "text": "Pro-vitamins: {{c1::inactive precursors}} of vitamins that are converted to active vitamins {{c2::inside the body}}", "extra": "", "sec": "Part 01 · 1.2 Pro-vitamins"}, {"id": "BIO-L1-004", "text": "Provitamin A = {{c1::carotenoids (carotenes)}}; provitamin D = {{c2::7-dehydrocholesterol}} (→ D₃) and {{c3::ergosterol}} (→ D₂)", "extra": "Official GD answer says carotenoids; the pamphlet says carotenes.", "sec": "Part 01 · 1.2 Pro-vitamins (GD key)"}, {"id": "BIO-L1-005", "text": "Vitamins are classified by {{c1::solubility}}: fat-soluble = vitamins {{c2::A, D, E, K}}; water-soluble = {{c3::B group & C}}", "extra": "", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-006", "text": "Fat-soluble vitamins are associated with fats and need {{c1::bile}} for emulsification; they are absorbed efficiently only when {{c2::normal fat absorption}} is taking place", "extra": "", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-007", "text": "Fat-soluble vitamin deficiency (avitaminosis) is caused by {{c1::steatorrhoea (malabsorption syndrome)}} and {{c2::biliary disorders}}", "extra": "e.g. steatorrhoea → risk of vitamin A (retinol) deficiency; water-soluble C and B₂ are spared.", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-008", "text": "Fat-soluble vitamins are transported in blood in {{c1::lipoproteins}} or on {{c2::specific binding proteins}}", "extra": "", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-009", "text": "Storage — fat-soluble vitamins: {{c1::stored in the liver}}; water-soluble: {{c2::limited storage}}, so they must be provided {{c3::regularly in the diet}}", "extra": "", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-010", "text": "The water-soluble vitamin that IS stored in the body: {{c1::vitamin B₁₂}}", "extra": "Classic exam trap.", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-011", "text": "After diet restriction, deficiency appears {{c1::late}} with fat-soluble vitamins but {{c2::quickly}} with water-soluble vitamins", "extra": "Everything follows from storage.", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-012", "text": "Excess — fat-soluble vitamins: {{c1::not excreted in urine → hypervitaminosis (toxic)}}; water-soluble: {{c2::excreted in urine, rarely toxic}}", "extra": "'ADEK stays, B & C go away.'", "sec": "Part 01 · 1.3 Classification — by solubility"}, {"id": "BIO-L1-013", "text": "Vitamins needed for bone health: {{c1::A}} · {{c2::D}} · {{c3::K}} (fat-soluble) + {{c4::C}} (water-soluble)", "extra": "Bones need 'A D-K and a C'; E is the fat-soluble vitamin left out.", "sec": "Part 01 · 1.4 Vitamins needed for bone health"}, {"id": "BIO-L1-014", "text": "Bone-related roles — vitamin D: strengthens bones + {{c1::calcium absorption}}; vitamin K: bone health + {{c2::blood clotting}}; vitamin C: {{c3::connective tissue}}", "extra": "", "sec": "Part 01 · 1.4 Vitamins needed for bone health"}, {"id": "BIO-L1-015", "text": "Vitamin D is a group of {{c1::steroid}} compounds", "extra": "Its active form, calcitriol, acts as a steroid hormone.", "sec": "Part 02 · 2.1 Forms of vitamin D"}, {"id": "BIO-L1-016", "text": "Vitamin D₃ = {{c1::cholecalciferol}} (7-dehydrocholesterol + UV, skin); vitamin D₂ = {{c2::ergocalciferol}} (ergosterol + UV, plants, fungi, yeasts)", "extra": "D₂ and D₃ are of equal potency.", "sec": "Part 02 · 2.1 Forms of vitamin D"}, {"id": "BIO-L1-017", "text": "Vitamin D₃ is made in the skin layer {{c1::stratum basale}} on exposure to sun", "extra": "", "sec": "Part 02 · 2.1 Forms of vitamin D"}, {"id": "BIO-L1-018", "text": "Active form of vitamin D: {{c1::calcitriol}} = {{c2::1,25-dihydroxycholecalciferol [1,25-(OH)₂D₃]}}, formed in the {{c3::kidney}}", "extra": "Official GD answer: 'calcitriol (1,25-dihydroxycholecalciferol)'.", "sec": "Part 02 · 2.1 Forms of vitamin D (GD key)"}, {"id": "BIO-L1-019", "text": "Storage form and predominant circulating form of vitamin D: {{c1::25-OH D₃ (25-hydroxycholecalciferol)}}, made in the {{c2::liver}}", "extra": "Exam trap: the storage/circulating form — not the active form.", "sec": "Part 02 · 2.1 Forms of vitamin D"}, {"id": "BIO-L1-020", "text": "7-dehydrocholesterol is derived from {{c1::cholesterol}} by the {{c2::intestinal mucosa}}, passes to the skin, and {{c3::UV rays}} convert it to D₃", "extra": "", "sec": "Part 02 · 2.2 Sources of vitamin D"}, {"id": "BIO-L1-021", "text": "Preformed D₃ (animal sources): {{c1::fish liver oils}} — rich · {{c2::liver, egg yolk}} — good · {{c3::milk}} — poor", "extra": "Fish liver oil = the richest dietary source.", "sec": "Part 02 · 2.2 Sources of vitamin D"}, {"id": "BIO-L1-022", "text": "Milk is a {{c1::poor}} natural source of vitamin D — it is a source only when {{c2::fortified}} (D added)", "extra": "A diet based mainly on milk supplies little vitamin D.", "sec": "Part 02 · 2.2 Sources of vitamin D"}, {"id": "BIO-L1-023", "text": "Vitamin D₂ and D₃ are not biologically active — they are activated in vivo by {{c1::two hydroxylation}} reactions", "extra": "", "sec": "Part 02 · 2.3 Activation — two hydroxylations"}, {"id": "BIO-L1-024", "text": "The 2 enzymes that activate vitamin D: {{c1::25-hydroxylase}} in the {{c2::liver}} ▶ {{c3::1α-hydroxylase}} in the {{c4::kidney}}", "extra": "Liver before Kidney, 25 before 1 — Liver Loads the store, Kidney Kick-starts the hormone.", "sec": "Part 02 · 2.3 Activation — two hydroxylations (GD key)"}, {"id": "BIO-L1-025", "text": "Vitamin D activation — liver: hydroxylation at {{c1::C-25}} → 25-OH D₃; kidney: hydroxylation at {{c2::C-1}} in the {{c3::proximal tubule}} → calcitriol", "extra": "", "sec": "Part 02 · 2.3 Activation — two hydroxylations"}, {"id": "BIO-L1-026", "text": "The final, rate-limiting step of vitamin D activation: {{c1::1α-hydroxylation in the kidney}}", "extra": "Liver 25-hydroxylation comes first and gives only the storage form.", "sec": "Part 02 · 2.3 Activation — two hydroxylations"}, {"id": "BIO-L1-027", "text": "Renal 1α-hydroxylase is stimulated directly by ↓ serum {{c1::phosphate}} and by {{c2::PTH}}; ↓ serum calcium stimulates it {{c3::indirectly, via PTH release}}", "extra": "'Low Phos, Low Ca, High PTH' — all switch the renal hydroxylase ON.", "sec": "Part 02 · 2.4 Regulation of renal 1α-hydroxylase"}, {"id": "BIO-L1-028", "text": "Renal 1α-hydroxylase is inhibited by ↑ serum {{c1::1,25-(OH)₂D₃ (calcitriol)}} — {{c2::negative feedback}}", "extra": "", "sec": "Part 02 · 2.4 Regulation of renal 1α-hydroxylase"}, {"id": "BIO-L1-029", "text": "Functions of vitamin D: intestine — ↑ {{c1::Ca²⁺ absorption}} · kidney — ↑ {{c2::Ca²⁺ reabsorption}} · bone — ↑ {{c3::Ca²⁺ deposition}}", "extra": "Official GD answer. Pamphlet: the bone effect is dose-dependent — mineralization at low, resorption at high levels.", "sec": "Part 02 · 2.5 Functions of vitamin D (GD key)"}, {"id": "BIO-L1-030", "text": "Vitamin D's effect on bone is dose-dependent: low levels → ↑ bone {{c1::mineralization}}; high levels → ↑ bone {{c2::resorption}}", "extra": "So both deficiency and toxicity end up damaging bone.", "sec": "Part 02 · 2.5 Functions of vitamin D"}, {"id": "BIO-L1-031", "text": "Calcitriol is the active {{c1::steroid hormone}} form of vitamin D — it regulates Ca²⁺ via bone resorption, gut Ca²⁺ transport and kidney Ca²⁺ reabsorption", "extra": "", "sec": "Part 02 · 2.5 Functions of vitamin D"}, {"id": "BIO-L1-032", "text": "Response to hypocalcaemia: {{c1::PTH}} released from the parathyroid → binds receptors on {{c2::renal proximal tubule cells}} → activates {{c3::1α-hydroxylase}} → calcitriol formed", "extra": "Calcitriol then acts on gut + kidney + bone → blood Ca²⁺ back to normal.", "sec": "Part 03 · 3.1 The response to hypocalcaemia"}, {"id": "BIO-L1-033", "text": "PTH release is triggered by ↓ {{c1::ionized Ca²⁺}}, ↑ {{c2::PO₄³⁻}} or ↓ {{c3::1,25-(OH)₂D₃}}", "extra": "Official GD figure; the pamphlet names only hypocalcaemia.", "sec": "Part 03 · 3.1 The response to hypocalcaemia (GD figure key)"}, {"id": "BIO-L1-034", "text": "Calcitriol on the duodenum: acts as a {{c1::lipid-soluble}} hormone → {{c2::intracellular receptor}} binds response elements in DNA → induces synthesis of {{c3::calcium-binding proteins}} → ↑ Ca²⁺ uptake", "extra": "Behaves like a steroid hormone: it changes gene transcription.", "sec": "Part 03 · 3.2 Target actions of calcitriol"}, {"id": "BIO-L1-035", "text": "Calcitriol mobilizes calcium from bone ({{c1::osteoclasts}}) only when {{c2::PTH}} is also present", "extra": "Classic exam trap.", "sec": "Part 03 · 3.2 Target actions of calcitriol"}, {"id": "BIO-L1-036", "text": "PTH + vitamin D on the renal tubule: ↑ {{c1::1,25-(OH)₂D₃ synthesis}} · ↑ reabsorption of {{c2::Ca²⁺}} · ↓ reabsorption of {{c3::PO₄³⁻}}", "extra": "Official GD answer (urine: ↓ Ca²⁺, ↑ PO₄³⁻). The pamphlet gives only the Ca²⁺ reabsorption.", "sec": "Part 03 · 3.2 Target actions of calcitriol (GD figure key)"}, {"id": "BIO-L1-037", "text": "PTH + vitamin D: bone → release of {{c1::Ca²⁺ and PO₄³⁻}}; intestine → ↑ absorption of {{c2::Ca²⁺ and PO₄³⁻}}", "extra": "", "sec": "Part 03 · 3.2 Target actions of calcitriol (GD figure key)"}, {"id": "BIO-L1-038", "text": "Net result of PTH + vitamin D: serum Ca²⁺ {{c1::↑::↑ or ↓}} · serum PO₄³⁻ {{c2::↓::↑ or ↓}}; 1,25-(OH)₂D₃ gives {{c3::feedback inhibition of PTH synthesis}}", "extra": "Official GD answer. Pamphlet's only calcitriol feedback: inhibition of renal 1α-hydroxylase.", "sec": "Part 03 · 3.2 Target actions of calcitriol (GD figure key)"}, {"id": "BIO-L1-039", "text": "Causes of rickets (vitamin D deficiency): {{c1::decreased intake}} · {{c2::lack of exposure to UV radiation}} · {{c3::defect in 1α-hydroxylase}} · {{c4::calcitriol receptor defect}}", "extra": "Official GD answer. Pamphlet groups causes by break point: skin (UV) · liver disease · kidney disease.", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney (GD key)"}, {"id": "BIO-L1-040", "text": "Skin cause of vitamin D deficiency: insufficient UV in {{c1::cold, cloudy climates}} → too little D₃ from 7-dehydrocholesterol → give {{c2::vitamin D supplementation}}", "extra": "", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney"}, {"id": "BIO-L1-041", "text": "Severe liver disease (cirrhosis) → defective {{c1::25-hydroxylation}} → bone demineralization; give {{c2::25-hydroxycholecalciferol}} (or 1,25-DHCC)", "extra": "Treat past the broken step: give an already 25-hydroxylated form.", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney"}, {"id": "BIO-L1-042", "text": "Kidney causes of vitamin D deficiency: {{c1::end-stage renal disease}} (e.g. secondary to diabetes mellitus) · {{c2::Fanconi renal syndrome}} (proximal tubule defect) · {{c3::genetic 1α-hydroxylase deficiency}}", "extra": "", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney"}, {"id": "BIO-L1-043", "text": "End-stage renal disease → insufficient 1,25-DHCC → {{c1::renal osteodystrophy}}", "extra": "", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney"}, {"id": "BIO-L1-044", "text": "Kidney disease (renal osteodystrophy): plain vitamin D won't work — give {{c1::1,25-DHCC (IV or oral)}} or a drug analogue that {{c2::does not need renal metabolism}}", "extra": "The diseased kidney cannot do the final 1α-hydroxylation.", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney"}, {"id": "BIO-L1-045", "text": "Vitamin D-resistant rickets is caused by a genetic defect of {{c1::renal 1α-hydroxylase}}", "extra": "Official GD answer. Calcitriol cannot be formed → give 1,25-DHCC (or an analogue not needing the kidney).", "sec": "Part 04 · 4.1 Causes — skin, liver or kidney (GD key)"}, {"id": "BIO-L1-046", "text": "Vitamin D deficiency by age: infants & growing children → {{c1::rickets}}; adults (after epiphyseal fusion) → {{c2::osteomalacia}}", "extra": "Rickets = Running kids (growing bone); Malacia = Mature (fused epiphyses).", "sec": "Part 04 · 4.2 Rickets vs osteomalacia (GD key)"}, {"id": "BIO-L1-047", "text": "Rickets: abnormal {{c1::ossification}} → {{c2::bowing}} of soft bones, most striking in the {{c3::legs}}", "extra": "", "sec": "Part 04 · 4.2 Rickets vs osteomalacia"}, {"id": "BIO-L1-048", "text": "Osteomalacia: bone {{c1::demineralization}} with {{c2::less}} deformity than rickets", "extra": "", "sec": "Part 04 · 4.2 Rickets vs osteomalacia"}, {"id": "BIO-L1-049", "text": "Symptoms — rickets: {{c1::muscle weakness}} (common); osteomalacia: {{c2::bone pain + muscle weakness}}", "extra": "", "sec": "Part 04 · 4.2 Rickets vs osteomalacia"}, {"id": "BIO-L1-050", "text": "Other cause of osteomalacia: bone resorption from {{c1::high PTH}} (primary parathyroid disease or secondary PTH stimulation)", "extra": "", "sec": "Part 04 · 4.2 Rickets vs osteomalacia"}, {"id": "BIO-L1-051", "text": "Treatment — rickets: {{c1::calcium + vitamin D supplements}}; osteomalacia: Ca + vitamin D and {{c2::lowering high PTH}}, depending on the cause", "extra": "Keep within recommended doses — excess vitamin D is toxic.", "sec": "Part 04 · 4.2 Rickets vs osteomalacia"}, {"id": "BIO-L1-052", "text": "2-year-old: bowed legs, thick wrists, unusual gait, failure to thrive; diet mainly breastfeeding → {{c1::rickets}}", "extra": "Mainly-milk diet = little vitamin D; bowing of soft bones + muscle weakness.", "sec": "Part 04 · 4.2 Rickets vs osteomalacia (GD case)"}, {"id": "BIO-L1-053", "text": "Rickets — advice to the mother: {{c1::calcium + vitamin D supplements}} · {{c2::sun (UV) exposure}} · vitamin D foods: {{c3::fish liver oils, liver, egg yolk, fortified milk}}", "extra": "UV converts 7-dehydrocholesterol in the skin to D₃.", "sec": "Part 04 · 4.2 Rickets vs osteomalacia (GD case)"}, {"id": "BIO-L1-054", "text": "Rickets in children kept indoors: their bone malformations are best explained by {{c1::inadequate uptake of calcium in the intestine}}", "extra": "Official GD key. No calcitriol → no gut calcium-binding proteins; not lack of exercise.", "sec": "Part 04 · 4.2 Rickets vs osteomalacia (GD key)"}, {"id": "BIO-L1-055", "text": "Vitamin D toxicity: intake continuously exceeding {{c1::10× RDA}}", "extra": "", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D)"}, {"id": "BIO-L1-056", "text": "Vitamin D excess accumulates because, unlike water-soluble vitamins, it is stored in the {{c1::liver}} as {{c2::25-hydroxycholecalciferol}}", "extra": "Excess vitamin C, by contrast, is excreted in urine.", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D)"}, {"id": "BIO-L1-057", "text": "Hypercalcaemia of vitamin D toxicity has two sources: ↑ {{c1::intestinal absorption of Ca²⁺ & PO₄}} + direct {{c2::bone resorption}}", "extra": "Vitamin D excess and deficiency both cause bone resorption.", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D)"}, {"id": "BIO-L1-058", "text": "Vitamin D toxicity result: {{c1::hypercalcaemia}} + {{c2::hypercalciuria}}", "extra": "", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D)"}, {"id": "BIO-L1-059", "text": "Hypercalcaemia impairs renal function — early signs: {{c1::polyuria}} · {{c2::polydipsia}} · {{c3::nocturia}}", "extra": "", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D)"}, {"id": "BIO-L1-060", "text": "Prolonged hypercalcaemia → calcium deposition in soft tissues, notably the {{c1::kidney}} → {{c2::irreversible kidney damage}}", "extra": "Therefore vitamin D supplementation must be monitored.", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D)"}, {"id": "BIO-L1-061", "text": "Weakness, polyuria, intense thirst + greatly ↑ serum Ca²⁺ after a month of excess vitamin D & calcium → {{c1::vitamin D toxicity}}", "extra": "", "sec": "Part 05 · 5.1 Vitamin D toxicity (hypervitaminosis D) (GD case)"}, {"id": "BIO-L1-062", "text": "Osteoporosis: gradual loss of {{c1::bone mass}} → weak, porous bones and ↑ fracture risk", "extra": "", "sec": "Part 05 · 5.2 Related disorder — osteoporosis"}, {"id": "BIO-L1-063", "text": "Osteoporosis occurs with {{c1::ageing}} and in {{c2::postmenopausal women (loss of oestrogen)}}; {{c3::lack of exercise}} also ↓ bone density", "extra": "", "sec": "Part 05 · 5.2 Related disorder — osteoporosis"}, {"id": "BIO-L1-064", "text": "Osteoporosis treatment: {{c1::exercise}} · {{c2::calcium + vitamin D supplements}} · {{c3::oestrogen receptor drugs or HRT (oestrogen + progesterone)}} · {{c4::bisphosphonates}}", "extra": "Official GD answer = pamphlet.", "sec": "Part 05 · 5.2 Related disorder — osteoporosis (GD key)"}, {"id": "BIO-L1-065", "text": "Bisphosphonates ({{c1::alendronate, ibandronate}}) bind {{c2::hydroxyapatite}} → bone resists {{c3::osteoclast}} breakdown", "extra": "", "sec": "Part 05 · 5.2 Related disorder — osteoporosis"}, {"id": "BIO-L1-066", "text": "82-year-old inactive woman: hip fracture on a minor fall + old wrist fracture after a slip → {{c1::osteoporosis}}", "extra": "Ageing + menopause + inactivity + low-trauma fractures.", "sec": "Part 05 · 5.2 Related disorder — osteoporosis (GD case)"}, {"id": "BIO-L1-067", "text": "Osteoporosis: ↓ bone mass with {{c1::normal}} mineralization; osteomalacia: {{c2::deficient}} mineralization", "extra": "OsteoPorosis = Poor quantity; OsteoMalacia = poor Mineral.", "sec": "Part 05 · 5.3 Osteoporosis vs osteomalacia"}, {"id": "BIO-L1-068", "text": "Main causes — osteoporosis: {{c1::ageing, menopause (oestrogen loss), inactivity}}; osteomalacia: {{c2::vitamin D deficiency after epiphyseal fusion; high PTH}}", "extra": "", "sec": "Part 05 · 5.3 Osteoporosis vs osteomalacia"}], "pracs": [], "lib": "./", "prev": null, "next": {"href": "bio-l2.html", "title": "Lecture 2 · Skeletal Muscle Metabolism"}, "coverImg": "covers/Biochemistry.jpg", "searchHint": "e.g. PO₄³⁻, calcitriol, hydroxyapatite"};
(() => {

const $ = s => document.querySelector(s);

let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */

const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages

  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside

  if (opened && (force || mode !== drawnMode)) draw();

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){

  const pg = BOOK.pages[i];

  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;

function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }

  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn

    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};
H.recall = b => {

  const body = b.groups.map(g => `<div class="rcg">${esc(g.title)}</div>` + g.items.map(it => { const i = n++, on = !!rv[i]; if (on) k++;
    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');

H.end = () => {

    ${nx ? `<a href="${esc(nx.href)}"><span><small>${esc(nx.label || 'Next lecture')}</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>${esc(pv.label || 'Previous lecture')}</small>${esc(pv.title)}</span><span>←</span></a>` : ''}

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;

A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }

    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }
