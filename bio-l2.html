Chronic:", "tophi — MSU deposits in soft tissue around joints"], ["Chronic:", "inflammation involving granulomas"]]}]}], "labName": "Recall · Hyperuricemia & Gout (1/3)"}, {"id": "p45", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l2-4-1", "title": "Recall · Hyperuricemia & Gout (2/3)", "groups": [{"title": "5.3 Conditions that accompany hyperuricemia & gout", "items": [["Lesch-Nyhan:", "near-complete HGPRT deficiency, no purine salvage"], ["Partial HGPRT deficiency:", "reduced salvage"], ["Alcoholism:", "lactate and urate compete for same renal transport"], ["Von Gierke:", "G6P shifted to ribose → ↑ purine synthesis &amp; catabolism"], ["Tumor lysis syndrome:", "chemo/radiation of large tumours → nucleic acid turnover"]]}, {"title": "5.4 Lesch-Nyhan syndrome", "items": [["X-linked recessive", "near-complete HGPRT deficiency"], ["Mental retardation; spastic cerebral", "palsy with compulsive biting of hands and lips"], ["Hyperuricaemia or", "gout (purines cannot be salvaged)"], ["Death often", "in first decade"]]}]}], "labName": "Recall · Hyperuricemia & Gout (2/3)"}, {"id": "p46", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l2-4-2", "title": "Recall · Hyperuricemia & Gout (3/3)", "groups": [{"title": "5.5 Von Gierke disease (glucose-6-phosphatase deficiency)", "items": [["G6Pase:", "key gluconeogenesis enzyme; deficiency → liver can't release free glucose"], ["Severe fasting", "hypoglycaemia"], ["Lactic acidaemia", "(defect in Cori cycle)"], ["Hyperuricaemia (G6P shifted", "to ribose); hyperlipidaemia (TAG main energy)"], ["Case:", "short stature, hepatomegaly, enlarged kidneys, ↑ lactate, lipids, urate"]]}, {"title": "5.6 Tumor lysis syndrome", "items": [["Chemotherapy or", "radiation of large tumours"], ["Destroyed cancer-cell nucleic acid →", "purine turnover → excessive uric acid → gout"]]}]}], "labName": "Recall · Hyperuricemia & Gout (3/3)"}, {"id": "p47", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L2-18"}, {"t": "check", "q": "N-BIO-L2-16"}]}, {"id": "p48", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-BIO-L2-24"}]}, {"id": "p49", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Y26-080"}]}, {"id": "p50", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L2-05"}, {"t": "flap", "q": "N-BIO-L2-25"}]}, {"id": "p51", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0233"}]}, {"id": "p52", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L2-19"}, {"t": "flap", "q": "N-BIO-L2-26"}]}, {"id": "p53", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L2-17"}]}, {"id": "p54", "head": "Part 06 · Diagnosing Arthritis", "kind": "text", "blocks": [{"t": "part", "no": "06", "title": "Diagnosing Arthritis", "sub": "Diagnosis of gouty arthritis · Rheumatoid arthritis · Diagnosis of RA"}, {"t": "h", "no": "6.1", "title": "Diagnosis of gouty arthritis", "top": true}, {"t": "list", "items": ["ESR and CRP may be elevated", "Serum uric acid elevated <mark>&gt; 7 mg/dL<\/mark>", "<mark>Joint aspiration<\/mark> confirms: MSU crystals <mark>intracellular &amp; extracellular<\/mark>"]}, {"t": "h", "no": "6.2", "title": "Rheumatoid arthritis"}, {"t": "list", "items": ["Chronic <mark>autoimmune<\/mark> process → inflammatory <mark>synovitis<\/mark> of joints", "<b>Players:<\/b> <mark>T cells<\/mark>, <mark>B cells (produce RF)<\/mark>, cytokines/chemokines, <mark>synovial fibroblasts<\/mark>, <mark>degradative enzymes<\/mark>"]}, {"t": "h", "no": "6.3", "title": "Diagnosis of RA"}, {"t": "list", "items": ["Primarily <mark>clinical<\/mark> diagnosis (<mark>joint deformity<\/mark>); ESR, CRP may be elevated", "RF positive in up to <mark>80%<\/mark>", "<mark>Anti-CCP antibody<\/mark> is more specific"]}], "toc": ["06", "Diagnosing Arthritis"]}, {"id": "p55", "head": "Part 06 · Diagnosing Arthritis", "kind": "text", "blocks": [{"t": "list", "items": ["<b>Anaemia of chronic disease:<\/b> <mark>normochromic, normocytic<\/mark>"]}]}, {"id": "p56", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l2-5-0", "title": "Recall · Diagnosing Arthritis", "groups": [{"title": "6.1 Diagnosis of gouty arthritis", "items": [["ESR and", "CRP may be elevated"], ["Serum uric", "acid elevated &gt; 7 mg/dL"], ["Joint aspiration confirms:", "MSU crystals intracellular &amp; extracellular"]]}, {"title": "6.2 Rheumatoid arthritis", "items": [["Chronic autoimmune process →", "inflammatory synovitis of joints"], ["Players:", "T cells, B cells (produce RF), cytokines/chemokines, synovial fibroblasts, degradative enzymes"]]}, {"title": "6.3 Diagnosis of RA", "items": [["Primarily clinical diagnosis (joint", "deformity); ESR, CRP may be elevated"], ["RF positive", "in up to 80%"], ["Anti-CCP antibody", "is more specific"], ["Anaemia of chronic disease:", "normochromic, normocytic"]]}]}], "labName": "Recall · Diagnosing Arthritis"}, {"id": "p57", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0235"}]}, {"id": "p58", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-BIO-L2-06"}, {"t": "check", "q": "N-BIO-L2-20"}]}, {"id": "p59", "head": "Part 07 · Master Tables", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Master Tables", "sub": "Fuel metabolism across nutritional states · Gouty arthritis vs rheumatoid arthritis · Enzyme → job → clinical link · Each tissue's fuel at a glance · Scenario → answer"}, {"t": "h", "no": "7.1", "title": "Fuel metabolism across nutritional states"}, {"t": "list", "items": ["<b>Fed:<\/b> insulin; fasting: glucagon/epinephrine; starvation: ketogenesis; &gt; 3 d: protein spared"]}, {"t": "h", "no": "7.2", "title": "Gouty arthritis vs rheumatoid arthritis"}, {"t": "list", "items": ["Gout metabolic (MSU) vs RA autoimmune synovitis", "<b>Gout:<\/b> uric acid &gt; 7, aspiration; RA: RF, anti-CCP, anaemia of chronic disease"]}, {"t": "h", "no": "7.3", "title": "Enzyme → job → clinical link"}, {"t": "list", "items": ["HGPRT → Lesch-Nyhan; G6Pase → von Gierke; xanthine oxidase → allopurinol", "LPL → TG storage; HSL → lipolysis/hyperlipidaemia"]}], "toc": ["07", "Master Tables"]}, {"id": "p60", "head": "Part 07 · Master Tables", "kind": "text", "blocks": [{"t": "h", "no": "7.4", "title": "Each tissue's fuel at a glance"}, {"t": "list", "items": ["Summary of resting/active muscle, heart, adipose, brain fuels"]}, {"t": "h", "no": "7.5", "title": "Scenario → answer"}, {"t": "list", "items": ["<b>Marathon runner slows after 1–3 h:<\/b> glycogen depleted", "<b>Day 2 of fast with rising ketones:<\/b> rapid lipolysis → ketogenesis", "Joint deformity, anti-CCP +, normocytic anaemia: RA"]}]}, {"id": "p61", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l2-6-0", "title": "Recall · Master Tables (1/2)", "groups": [{"title": "7.1 Fuel metabolism across nutritional states", "items": [["Fed:", "insulin; fasting: glucagon/epinephrine; starvation: ketogenesis; &gt; 3 d: protein spared"]]}, {"title": "7.2 Gouty arthritis vs rheumatoid arthritis", "items": [["Gout metabolic", "(MSU) vs RA autoimmune synovitis"], ["Gout:", "uric acid &gt; 7, aspiration; RA: RF, anti-CCP, anaemia of chronic disease"]]}, {"title": "7.3 Enzyme → job → clinical link", "items": [["HGPRT →", "Lesch-Nyhan; G6Pase → von Gierke; xanthine oxidase → allopurinol"], ["LPL →", "TG storage; HSL → lipolysis/hyperlipidaemia"]]}, {"title": "7.4 Each tissue's fuel at a glance", "items": [["Summary of resting/active", "muscle, heart, adipose, brain fuels"]]}]}], "labName": "Recall · Master Tables (1/2)"}, {"id": "p62", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l2-6-1", "title": "Recall · Master Tables (2/2)", "groups": [{"title": "7.5 Scenario → answer", "items": [["Marathon runner slows after 1–3 h:", "glycogen depleted"], ["Day 2 of fast with rising ketones:", "rapid lipolysis → ketogenesis"], ["Joint deformity", "anti-CCP +, normocytic anaemia: RA"]]}]}], "labName": "Recall · Master Tables (2/2)"}, {"id": "p63", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-BIO-L2-27"}]}, {"id": "p64", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "One-liners, mnemonic vault, traps, numbers"}, {"t": "h", "no": "", "title": "One-liners, mnemonic vault, traps, numbers"}, {"t": "list", "items": ["G-E-C-G insulin opponents; 9 vs 4 kcal/g; ⅔ K ⅓ G", "LPL = Loading, HSL = Hunger-Sensitive; 90/10 purines", "Lazy Purines Accumulate, Giving Tophi; Von Gierke glucose down, L-U-L up", "<b>Numbers:<\/b> 70–100 mg/dl; 1–3 h; &gt; 7 mg/dL; up to 80% RF"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p65", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-bio-l2-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonic vault, traps, numbers", "items": [["G-E-C-G insulin opponents; 9", "vs 4 kcal/g; ⅔ K ⅓ G"], ["LPL =", "Loading, HSL = Hunger-Sensitive; 90/10 purines"], ["Lazy Purines Accumulate, Giving", "Tophi; Von Gierke glucose down, L-U-L up"], ["Numbers:", "70–100 mg/dl; 1–3 h; &gt; 7 mg/dL; up to 80% RF"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p66", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Fed state: resting skeletal muscle burns glucose, heart still burns fatty acids"}, {"t": "note", "kind": "trap", "html": "Liver makes TG from glucose only after glycogen stores are filled"}, {"t": "note", "kind": "trap", "html": "Gluconeogenesis driven by glucagon; amino acid &amp; FA release by ↓ insulin + ↑ epinephrine"}, {"t": "note", "kind": "trap", "html": "In prolonged starvation the brain still takes ⅓ of energy from glucose"}, {"t": "note", "kind": "trap", "html": "Cori cycle spares energy because hepatic fatty-acid oxidation pays for gluconeogenesis"}, {"t": "note", "kind": "trap", "html": "After 1–3 h of exercise intensity falls — glycogen depleted"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p67", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "LPL is in capillary bed (fed); HSL in fat cells (fasting)"}, {"t": "note", "kind": "trap", "html": "Only ~10% of purines become uric acid — salvage recycles ~90%"}, {"t": "note", "kind": "trap", "html": "Alcohol = under-excretion: lactate competes with urate in kidney"}, {"t": "note", "kind": "trap", "html": "Von Gierke's lactic acidaemia = defective Cori cycle"}, {"t": "note", "kind": "trap", "html": "ESR &amp; CRP rise in both gout and RA; anti-CCP more specific than RF"}, {"t": "note", "kind": "cl", "html": "Increased purine catabolism → hyperuricaemia and potentially gout"}]}, {"id": "p68", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Lesch-Nyhan: mental retardation, spastic CP, biting of hands/lips, hyperuricaemia"}, {"t": "note", "kind": "cl", "html": "Von Gierke: fasting hypoglycaemia, hepatomegaly, enlarged kidneys, ↑ lactate, lipids, urate"}, {"t": "note", "kind": "cl", "html": "Tumor lysis syndrome after chemo/radiation → excessive uric acid → gout"}, {"t": "note", "kind": "cl", "html": "Acute gout: male, inflamed big toe, needle-shaped crystals"}, {"t": "note", "kind": "cl", "html": "Heart failure: ↑ glucose oxidation, ↓ β-oxidation"}]}, {"id": "p69", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0195": {"id": "Q0195", "stem": "Study the figure.\n1. Name this cycle and complete the missing labels (???????).\n2. What is the importance of this cycle?", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO W12", "bank": true, "expl": "Muscle and RBCs turn glucose into lactate by glycolysis; the liver converts the lactate back into glucose by gluconeogenesis and returns it. This keeps blood glucose up, stops lactate being lost in urine and spares energy in RBCs and contracting muscle, because the liver's own fatty-acid oxidation pays the ATP cost of gluconeogenesis.", "img": ["figs/GB-05.jpg"], "cap": "Liver–muscle cycle with the missing labels marked ???????", "aimg": ["figs/GB-05_ans.jpg"], "acap": "Lactic acid (Cori) cycle — liver, blood, muscle & RBCs", "type": "written", "keyhtml": "1. The Cori cycle (lactic acid cycle).\n• Muscle &amp; RBCs: glucose → pyruvate (glycolysis — glycolytic pathway) → lactate.\n• Lactate is carried by the blood to the liver.\n• Liver: lactate → pyruvate → glucose (gluconeogenesis); the glucose returns through the blood to muscle &amp; RBCs.\nMissing labels: liver — gluconeogenesis (pyruvate → glucose) and lactate; muscle — glycolysis (glucose → pyruvate) and lactate.\n2. Importance of the Cori cycle:\n• Helps to maintain the blood glucose level.\n• Prevents loss of lactate as a waste product in urine.\n• Spares energy in red cells and contracting muscles: the amino acids and fatty acids are taken up by the liver, where the amino acids provide the carbon skeletons (needed for glucose synthesis) and the oxidation of fatty acids provides the ATP necessary for hepatic gluconeogenesis. Therefore, it supplies red cells and contracting muscles with glucose for reutilization and ATP production.\n• Clearing lactate also prevents its build-up — a defective Cori cycle causes the lactic acidemia of von Gierke disease."}, "Q0197": {"id": "Q0197", "stem": "A college professor celebrating his 60th birthday had too much foie gras and wine at his dinner. The next morning he woke with a hangover and severe pain in his right great toe, a condition he had experienced several times before. He then remembered that he had forgotten to take his allopurinol tablets for over 2 weeks. Allopurinol blocks which of the following reactions?", "top": false, "rep": "", "tag": "Final bank BIO Q20", "bank": true, "expl": "Recurrent great-toe attacks after high-purine food and alcohol point to gout; allopurinol inhibits xanthine oxidase, which converts hypoxanthine → xanthine → uric acid, so less uric acid is formed. Hypoxanthine → IMP (HGPRT), adenine → AMP (APRT) and adenosine → inosine (ADA) are not blocked by the drug.", "type": "mcq", "opts": ["Hypoxanthine to IMP", "Adenosine to inosine", "Hypoxanthine to xanthine", "Adenine to AMP", "Ribose-5-phosphate to PRPP"], "ans": 2}, "Q0227": {"id": "Q0227", "stem": "A young athlete performed sprinting sport (early stage). What are the metabolic pathways occurring in muscles to supply it with energy? (Multiple answers are required.)", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO Q13", "bank": true, "expl": "A sprint is a short burst of high-intensity exercise by fast-twitch fibres, supported by anaerobic glycolysis drawing on stored muscle glycogen — so glycogenolysis feeds anaerobic glycolysis. β-oxidation of fatty acids matters in moderately high, continuous exercise, and gluconeogenesis from the lactate formed takes place in the liver, not in muscle.", "type": "mcq", "opts": ["Glycogenesis", "Ketogenesis", "Anaerobic glycolysis of intracellular glucose", "Glycogenolysis", "Fatty acid beta oxidation", "Ketolysis", "Gluconeogenesis", "Krebs cycle"], "ans": 2}, "Q0228": {"id": "Q0228", "stem": "A 30-year-old was subjected to prolonged fasting. What is the significance of the Cori cycle that occurs in muscle? (Multiple answers are required.)", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO Q14", "bank": true, "expl": "The Cori cycle carries lactate from muscle and RBCs through the blood to the liver, which turns it back into glucose for the muscle, so it helps maintain the blood glucose level and supplies active muscle with glucose. Clearing lactate this way also stops it being lost in urine and stops it building up — a defective Cori cycle causes lactic acidemia.", "type": "mcq", "opts": ["Provoke lactic acidosis", "Prevent lactic acidosis", "Provide active muscle with required glucose", "Prevent maintenance of normal blood glucose", "Help maintenance of normal blood glucose", "Allow loss of glucose in urine", "Allow loss of lactic acid in urine"], "ans": 1}, "Q0229": {"id": "Q0229", "stem": "In a prolonged state of starvation, which of the following is the major source of energy for muscles?", "top": true, "rep": "asked 3 years", "tag": "Final bank BIO Q15", "bank": true, "expl": "In starvation, rapid lipolysis floods the blood with fatty acids and skeletal muscle uses β-oxidation of fatty acids as its major fuel (adding ketones as fasting is prolonged). Muscle protein is broken down to release amino acids into the blood as gluconeogenic precursors rather than as the muscle's own fuel, and glucose is the fuel of resting muscle only in the well-fed state.", "type": "mcq", "opts": ["Fatty acids", "Glucose", "Glycogen", "Amino acids"], "ans": 0}, "Q0231": {"id": "Q0231", "stem": "An Olympic runner participates in a 100-meter race. During this race, it is estimated that only ½ L oxygen will be consumed by the runner. However, more than 10 L oxygen would be consumed if the metabolism in this interval were entirely aerobic. The majority of ATP generated during this 100-meter race is derived from which of the following?", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO Q18", "bank": true, "expl": "Using only ½ L of the more than 10 L of oxygen that fully aerobic metabolism would need shows the race is run almost entirely without oxygen, and short bursts of high-intensity exercise are supported by anaerobic glycolysis drawing on stored muscle glycogen in fast-twitch fibres. Stored ATP is not kept in large amounts and creatine phosphate lasts only seconds, while lipolysis belongs to fasting and gluconeogenesis takes place in the liver.", "type": "mcq", "opts": ["Creatine phosphate", "Glycolysis", "Gluconeogenesis", "Lipolysis", "ATP stores"], "ans": 1}, "Y26-080": {"id": "Y26-080", "stem": "Inherited defects in components of purine catabolism and salvage are associated with various conditions and syndromes. The enzyme hypoxanthine-guanine phosphoribosyltransferase (HGPRT) is a key enzyme in the purine salvage pathway. It is responsible for reforming IMP and GMP from hypoxanthine and guanine, respectively. In this manner purine bases are salvaged back into the purine nucleotide pool. Genetic defects that lead to the loss of HGPRT activity are the primary cause for which of the following conditions?", "top": true, "rep": "", "tag": "Final bank BIO Q16", "bank": true, "expl": "HGPRT salvages hypoxanthine → IMP and guanine → GMP; its near-complete (X-linked recessive) deficiency is Lesch-Nyhan syndrome — mental retardation, spastic cerebral palsy with compulsive biting of hands and lips, and hyperuricemia because purines cannot be salvaged. Gout can accompany HGPRT deficiency, but as a consequence of the hyperuricemia; it is not the syndrome caused by losing the enzyme.", "type": "mcq", "opts": ["Gout", "Lesch-Nyhan syndrome", "Orotic aciduria", "Severe combined immunodeficiency syndrome", "Tay-Sachs disease"], "ans": 1}, "Q0233": {"id": "Q0233", "stem": "A patient has an enlarged liver and kidneys, gout, and xanthomas. Studies show that he has a genetic deficiency of glucose-6-phosphatase. Additional studies would most likely show which of the following sets of laboratory results (fasting blood glucose / blood lactate / serum uric acid)?", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO Q19", "bank": true, "expl": "Glucose-6-phosphatase deficiency (von Gierke disease) prevents the liver from releasing free glucose, so fasting blood glucose is low, while lactate (defective Cori cycle), uric acid (G6P shifted to ribose → more purine synthesis and catabolism, hence the gout) and lipids (TAG becomes the main energy source, hence the xanthomas) all rise. Glucose goes down while lactate, urate and lipids go up, so the only fitting set is one Low (glucose) followed by Highs.", "type": "mcq", "opts": ["High / High / Low", "High / High / High", "Low / High / High", "High / Low / Low", "Low / Low / Low"], "ans": 2}, "Q0235": {"id": "Q0235", "stem": "A 46-year-old male presents to the emergency department with severe right toe pain. The patient was in his usual state of health until early in the morning when he woke up with severe pain in his right big toe. The patient denies any trauma to the toe and no previous history of such pain in other joints. On examination, he was found to have a temperature of 38.2°C. The right big toe was swollen, warm, red, and exquisitely tender. The remainder of the examination was normal. Synovial fluid was obtained and revealed needle-shaped crystals under microscopy. On laboratory diagnosis, plasma level of uric acid was more than 7 mg/dL.\n1. What is the likely diagnosis?\n2. How would you make a definite diagnosis?\n3. What is the pathophysiology of this disorder?", "top": true, "rep": "asked 2 years", "tag": "Final bank BIO W13", "bank": true, "expl": "Gout starts with hyperuricemia from overproduction or renal underexcretion of uric acid; monosodium urate then precipitates in joints as needle-shaped crystals, often first in the big toe, and triggers neutrophil-mediated inflammation. Joint aspiration showing MSU crystals confirms the diagnosis, and a uric acid above 7 mg/dL supports it.", "type": "written", "keyhtml": "1. Diagnosis: gouty arthritis (acute gouty arthritis) — male patient; sudden severe pain, swelling, warmth and redness of the big toe (gout often first affects the big toe); needle-shaped crystals in the synovial fluid; plasma uric acid &gt; 7 mg/dL.\n2. Confirming (definite) diagnosis: demonstration of monosodium urate (MSU) crystals within the synovial leukocytes, or in material derived from tophi, under polarizing microscopy — joint aspiration shows MSU crystals, intracellular &amp; extracellular.\n• Supporting: plasma uric acid more than 7 mg/dL; ESR and CRP may be elevated but are non-specific (they also rise in rheumatoid arthritis).\n3. Pathophysiology:\n• Increased conversion of purine bases to uric acid (overproduction — normally only ~10% of free purine bases become uric acid) or decreased excretion of uric acid by the kidney → hyperuricemia.\n• Elevated levels of the insoluble uric acid result in precipitation of (monosodium) urate crystals in the joints and surrounding soft tissue → needle-shaped crystals trigger neutrophil-mediated acute inflammation.\n• Over time: tophi (MSU deposits in soft tissue around joints) with granulomatous inflammation → chronic gout."}, "N-BIO-L2-01": {"id": "N-BIO-L2-01", "stem": "A medical student eats a large, carbohydrate-rich meal. His blood glucose and insulin rise, and his liver glycogen stores soon become full. Which process does his liver then use to handle the excess glucose that keeps arriving?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "After a meal, insulin promotes glycogenesis in liver and muscle; once the liver's glycogen stores are filled, excess glucose is converted to triglycerides (lipogenesis). Glycogenolysis and gluconeogenesis are fasting processes driven by glucagon (and epinephrine), not by insulin.", "type": "mcq", "opts": ["Lipogenesis", "Ketogenesis", "Glycogenolysis", "Gluconeogenesis", "Lipolysis"], "ans": 0}, "N-BIO-L2-02": {"id": "N-BIO-L2-02", "stem": "A 40-year-old man has been on a hunger strike for 2 weeks. His brain now obtains about two-thirds of its energy from ketone bodies. What is the main advantage of this shift from glucose to ketones?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In prolonged starvation (&gt; 3 days) the brain takes ⅔ of its energy from ketones and ⅓ from glucose; this shift spares protein that would otherwise be used for gluconeogenesis to keep blood glucose at 70–100 mg/dl. The brain does not stop using glucose — it still takes ⅓ of its energy from it.", "type": "mcq", "opts": ["It spares body protein that would otherwise be used for gluconeogenesis", "It allows the brain to stop taking up glucose entirely", "It raises blood glucose well above 100 mg/dl", "It refills liver and muscle glycogen stores", "It increases muscle protein synthesis"], "ans": 0}, "N-BIO-L2-03": {"id": "N-BIO-L2-03", "stem": "A 68-year-old man has chronic heart failure. Compared with a healthy adult heart, which change in the fuel use of his cardiac myocytes is expected?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Fatty acids (β-oxidation) are the major fuel of adult cardiac myocytes, but in heart failure glucose oxidation increases and β-oxidation decreases (in hypertrophy the situation reverses to some extent). Ketones are added to fatty acids in prolonged fasting, not in heart failure.", "type": "mcq", "opts": ["↑ Glucose oxidation and ↓ β-oxidation of fatty acids", "↓ Glucose oxidation and ↑ β-oxidation of fatty acids", "Ketone bodies replace fatty acids as the major fuel", "Amino acids become the major fuel"], "ans": 0}, "N-BIO-L2-04": {"id": "N-BIO-L2-04", "stem": "A healthy woman has fasted for 18 hours. Her insulin is low, her epinephrine is raised, and her plasma fatty acids are increased (hyperlipidemia). Which enzyme released these fatty acids, and where does it act?", "top": false, "rep": "", "tag": "Final bank BIO Q21", "bank": true, "expl": "In fasting (↓ insulin, ↑ epinephrine), hormone-sensitive lipase in the fat cells carries out lipolysis, releasing fatty acids into the circulation and causing hyperlipidemia. Lipoprotein lipase sits in the capillary bed and, after a meal under insulin, frees fatty acids from VLDL and chylomicron triglyceride for storage.", "type": "mcq", "opts": ["Lipoprotein lipase, in the capillary bed of adipose tissue", "Lipoprotein lipase, inside the fat cells", "Hormone-sensitive lipase, in the capillary bed of adipose tissue", "Hormone-sensitive lipase, inside the fat cells"], "ans": 3}, "N-BIO-L2-05": {"id": "N-BIO-L2-05", "stem": "A 4-year-old boy has mental retardation and spastic cerebral palsy, and he compulsively bites his hands and lips. His serum uric acid is high. His maternal uncle had a similar illness. Deficiency of which enzyme is the most likely cause?", "top": false, "rep": "", "tag": "Final bank BIO Q22", "bank": true, "expl": "Lesch-Nyhan syndrome is an X-linked recessive, near-complete deficiency of HGPRT: mental retardation, spastic cerebral palsy with compulsive biting of hands and lips, and hyperuricemia because purines cannot be salvaged. APRT salvages adenine to AMP; it is HGPRT that salvages hypoxanthine and guanine.", "type": "mcq", "opts": ["HGPRT", "APRT", "Xanthine oxidase", "Adenosine deaminase (ADA)", "Glucose-6-phosphatase"], "ans": 0}, "N-BIO-L2-06": {"id": "N-BIO-L2-06", "stem": "A 45-year-old woman has painful, deformed joints of both hands. Her ESR and CRP are raised, and she has a normochromic, normocytic anemia. Which laboratory test is the most specific for rheumatoid arthritis?", "top": false, "rep": "", "tag": "Final bank BIO Q23", "bank": true, "expl": "Anti-CCP antibody is a more specific lab finding for RA than the other tests; rheumatoid factor is positive in up to 80% of patients but is less specific. ESR and CRP rise in both RA and gout, so they cannot tell them apart.", "type": "mcq", "opts": ["Anti-CCP antibody", "Rheumatoid factor", "Erythrocyte sedimentation rate", "C-reactive protein", "Serum uric acid"], "ans": 0}, "N-BIO-L2-07": {"id": "N-BIO-L2-07", "stem": "The shift of fuel metabolism between the well-fed and fasting states is regulated mainly by which of the following?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The shifting metabolic patterns are regulated mainly by the insulin/glucagon ratio: insulin is the anabolic hormone that promotes fuel storage, and glucagon opposes it, responding rapidly to a fall in blood glucose. Epinephrine, cortisol and growth hormone also oppose insulin but are not named as the main regulator.", "type": "mcq", "opts": ["The insulin/glucagon ratio", "The cortisol level", "The growth hormone level", "The epinephrine level", "The blood ketone level"], "ans": 0}, "N-BIO-L2-08": {"id": "N-BIO-L2-08", "stem": "During fasting between meals, skeletal muscle protein is degraded and amino acids are released into the blood as gluconeogenic precursors. Which hormonal change stimulates this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In fasting, muscle protein degradation (amino-acid release) and adipose lipolysis (fatty-acid release) are both stimulated by ↓ insulin + ↑ epinephrine, whereas hepatic gluconeogenesis is driven by glucagon. Insulin promotes muscle protein synthesis after a meal.", "type": "mcq", "opts": ["↓ Insulin + ↑ epinephrine", "↑ Insulin + ↓ epinephrine", "↑ Insulin + ↑ epinephrine", "↓ Insulin + ↓ epinephrine"], "ans": 0}, "N-BIO-L2-09": {"id": "N-BIO-L2-09", "stem": "On the second day of a total fast, a woman's blood ketone bodies are rising. Which sequence best explains this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In starvation days 1–3, glucagon and epinephrine are markedly elevated; rapid lipolysis gives excess acetyl-CoA, which goes to ketogenesis, raising blood lipids and ketones. Muscle protein degradation supplies amino acids for gluconeogenesis, which maintains glucose, not ketones.", "type": "mcq", "opts": ["Rapid lipolysis → excess acetyl-CoA → ketogenesis", "Muscle glycogenolysis → lactate → Cori cycle", "Hepatic glycogenesis → excess glucose → lipogenesis", "Muscle protein degradation → amino acids → gluconeogenesis"], "ans": 0}, "N-BIO-L2-10": {"id": "N-BIO-L2-10", "stem": "Two hours after a carbohydrate-rich meal, what is the major fuel of resting skeletal muscle and of cardiac muscle, respectively?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In the well-fed state resting skeletal muscle burns glucose (taken up by insulin-sensitive GLUT-4), but cardiac muscle still burns fatty acids. In fasting, both use fatty acids – ketones.", "type": "mcq", "opts": ["Glucose; fatty acids", "Glucose; glucose", "Fatty acids; fatty acids", "Fatty acids; glucose", "Ketones; fatty acids"], "ans": 0}, "N-BIO-L2-11": {"id": "N-BIO-L2-11", "stem": "A muscle biopsy from a trained marathon runner shows mainly red fibres that are well vascularized, rich in mitochondria and resistant to fatigue. Which description fits these fibres?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Slow-twitch (type 1) fibres are primarily oxidative, red and well vascularized with many mitochondria; they resist fatigue, serve prolonged exercise (marathoner), and their mitochondria increase dramatically in trained athletes. Fast-twitch (type 2a/2b) fibres rely on anaerobic glycolysis, are pale and fatigue quickly (sprinter).", "type": "mcq", "opts": ["Type 1, slow-twitch, primarily oxidative", "Type 2a, fast-twitch, high capacity for anaerobic glycolysis", "Type 2b, fast-twitch, high capacity for anaerobic glycolysis", "Type 2, slow-twitch, primarily oxidative"], "ans": 0}, "N-BIO-L2-12": {"id": "N-BIO-L2-12", "stem": "A young athlete performed sprinting sport (late stage or severe exercise). What are the metabolic pathways occurring in muscles to supply it with energy? (Multiple answers are required.)", "top": true, "rep": "", "tag": "Final bank BIO Q17", "bank": true, "expl": "Sprinting is a short burst of high-intensity exercise by fast-twitch fibres, supported by anaerobic glycolysis drawing on stored muscle glycogen (glycogenolysis); the lactate is turned back into glucose in the liver (Cori cycle). Fatty-acid β-oxidation belongs to the late stage of moderately high, continuous exercise (after 1–3 hours), and ketones are a fuel of fasting, not of exercise.", "type": "mcq", "opts": ["Glycogenesis", "Ketogenesis", "Anaerobic glycolysis of intracellular glucose", "Glycogenolysis", "Fatty acid beta oxidation", "Ketolysis", "Gluconeogenesis", "Krebs cycle"], "ans": 2}, "N-BIO-L2-13": {"id": "N-BIO-L2-13", "stem": "In the Cori cycle, what provides the ATP that the liver needs for gluconeogenesis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The liver takes up amino acids and fatty acids: oxidation of fatty acids provides the ATP for hepatic gluconeogenesis, while amino acids provide the carbon skeletons. This is how the Cori cycle spares energy in red cells and contracting muscle.", "type": "mcq", "opts": ["Oxidation of fatty acids in the liver", "Carbon skeletons of amino acids", "Anaerobic glycolysis in red cells", "Glycogenolysis in contracting muscle"], "ans": 0}, "N-BIO-L2-14": {"id": "N-BIO-L2-14", "stem": "Nucleases release purine nucleotides from DNA and RNA; these are degraded to nucleosides and then to free purine bases. What is the normal fate of most of these free bases?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "About 90% of free purine bases are salvaged by salvage enzymes such as HGPRT, and only about 10% are converted to uric acid and excreted in urine. When purine catabolism rises significantly, hyperuricemia and potentially gout follow.", "type": "mcq", "opts": ["About 90% are salvaged back into nucleotides", "About 90% are converted to uric acid", "About 90% are excreted unchanged in urine", "About half are salvaged and half become uric acid"], "ans": 0}, "N-BIO-L2-15": {"id": "N-BIO-L2-15", "stem": "In de novo nucleotide synthesis, which enzyme converts ribose-5-phosphate to PRPP?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "De novo synthesis builds purines and pyrimidines from smaller precursors, and PRPP synthetase converts ribose-5-phosphate to PRPP. HGPRT and APRT are salvage enzymes that use PRPP to turn preformed bases into nucleotides.", "type": "mcq", "opts": ["PRPP synthetase", "HGPRT", "APRT", "Adenosine deaminase (ADA)", "Xanthine oxidase"], "ans": 0}, "N-BIO-L2-16": {"id": "N-BIO-L2-16", "stem": "A 50-year-old man with chronic alcoholism has hyperuricemia. Which mechanism best explains his raised uric acid?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In alcoholism, ethanol metabolites compete with uric acid for renal excretion — lactate and urate compete for the same transport system in the kidney, so this is underexcretion. Shifting of G6P to ribose is the overproduction mechanism of von Gierke disease.", "type": "mcq", "opts": ["Lactate competes with urate for the same renal transport system", "Near-complete HGPRT deficiency prevents purine salvage", "Glucose-6-phosphate is shifted to ribose, increasing purine synthesis", "Nucleic acids of destroyed tumour cells increase purine turnover"], "ans": 0}, "N-BIO-L2-17": {"id": "N-BIO-L2-17", "stem": "A 55-year-old man with a large tumour develops an acutely painful, swollen big toe a few days after starting chemotherapy. His serum uric acid is markedly raised. What is the source of the excess uric acid?", "top": false, "rep": "", "tag": "Final bank BIO Q24", "bank": true, "expl": "Chemotherapy or radiation of large tumours destroys cancer cells, and the purines of their nucleic acids undergo turnover, producing excessive uric acid and gout (tumor lysis syndrome). G6P shifted to ribose is the mechanism of von Gierke disease.", "type": "mcq", "opts": ["Purines from the nucleic acids of destroyed cancer cells", "Lactate competing with urate for renal excretion", "Reduced purine salvage from HGPRT deficiency", "Glucose-6-phosphate shifted to ribose in the liver"], "ans": 0}, "N-BIO-L2-18": {"id": "N-BIO-L2-18", "stem": "Which feature distinguishes chronic gout from acute gouty arthritis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Chronic gout manifests over time as tophi — deposits of monosodium urate in the soft tissue around joints — with chronic inflammation involving granulomas. Needle-shaped crystals, neutrophil-mediated inflammation and early big-toe involvement describe acute gouty arthritis, which is most common in males.", "type": "mcq", "opts": ["Tophi with granulomatous inflammation", "Needle-shaped monosodium urate crystals", "Neutrophil-mediated inflammation", "Involvement of the big toe first", "Predominance in males"], "ans": 0}, "N-BIO-L2-19": {"id": "N-BIO-L2-19", "stem": "A patient with short stature has fasting hypoglycemia, hepatomegaly and enlarged kidneys. Laboratory tests show raised lactate, cholesterol, triglyceride and uric acid. Which enzyme is deficient?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Glucose-6-phosphatase, a key gluconeogenesis enzyme, lets the liver release free glucose; its deficiency (von Gierke disease) gives severe fasting hypoglycemia with lactic acidemia (defective Cori cycle), hyperuricemia (G6P shifted to ribose) and hyperlipidemia (TAG as the main energy source). Glucose goes down while lactate, urate and lipids go up.", "type": "mcq", "opts": ["Brancher enzyme", "Debrancher enzyme", "Glucose-6-phosphatase", "Hepatic phosphorylase", "Muscle phosphorylase"], "ans": 2}, "N-BIO-L2-20": {"id": "N-BIO-L2-20", "stem": "Which blood picture is typical of rheumatoid arthritis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "RA causes the anemia of chronic disease, which is normochromic and normocytic. A serum uric acid above 7 mg/dL is the blood finding of gout, not RA.", "type": "mcq", "opts": ["Anemia of chronic disease — normochromic, normocytic", "Anemia of chronic disease — hypochromic, microcytic", "Anemia of chronic disease — normochromic, macrocytic", "Raised serum uric acid above 7 mg/dL"], "ans": 0}, "N-BIO-L2-21": {"id": "N-BIO-L2-21", "stem": "Compare the well-fed and fasting states as regards the main hormones and the processes in the liver, skeletal muscle and adipose tissue.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Insulin drives storage in the fed state (glycogen, triglyceride, protein); in fasting, glucagon and epinephrine with low insulin mobilize glucose, amino acids and fatty acids.", "type": "written", "keyhtml": "• Hormones: well-fed — ↑ insulin (anabolic; promotes fuel storage). Fasting — ↑ glucagon and epinephrine, ↓ insulin.\n• Liver: well-fed — glycogenesis; once glycogen stores are filled, excess glucose → triglycerides (lipogenesis). Fasting — glycogenolysis (glucagon &amp; epinephrine) and gluconeogenesis (glucagon) → glucose released into the blood.\n• Skeletal muscle: well-fed — glucose entry by insulin-sensitive GLUT-4, glycogenesis, protein synthesis; resting muscle burns glucose. Fasting — protein degradation → amino acids released (↓ insulin + ↑ epinephrine); fatty acids and ketone bodies used as fuel.\n• Adipose tissue: well-fed — glucose uptake (GLUT-4) and fat storage; lipoprotein lipase frees fatty acids from VLDL and chylomicrons → triglyceride stored. Fasting — hormone-sensitive lipase → lipolysis → fatty acids released (↓ insulin + ↑ epinephrine)."}, "N-BIO-L2-22": {"id": "N-BIO-L2-22", "stem": "Compare fast-twitch and slow-twitch skeletal muscle fibres.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Type 1 = slow = red = oxidative (marathoner); type 2 = fast = pale = anaerobic glycolysis (sprinter).", "type": "written", "keyhtml": "• Type: fast-twitch — 2a or 2b; slow-twitch — 1.\n• Metabolism: fast — high capacity for anaerobic glycolysis; slow — primarily oxidative (aerobic).\n• Fatigue: fast — quick to fatigue; slow — resist fatigue.\n• Exercise: fast — short-term, high-intensity; slow — prolonged, low-to-moderate intensity.\n• Blood supply: fast — low, few capillaries; slow — well vascularized, many capillaries.\n• Mitochondria: fast — few; slow — many, increasing dramatically in trained athletes.\n• Colour / athlete: fast — pale, sprinter; slow — red, marathoner."}, "N-BIO-L2-23": {"id": "N-BIO-L2-23", "stem": "Explain how adipose tissue stores triglyceride after a meal and releases fatty acids during fasting.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "LPL in the capillary bed loads fat into adipose tissue after a meal; HSL inside fat cells releases it in fasting.", "type": "written", "keyhtml": "After a meal (↑ insulin):\n• Glucose is taken up by GLUT-4 and oxidized by glycolysis → glycerol phosphate.\n• Lipoprotein lipase (LPL), in the capillary bed of adipose tissue, releases fatty acids from VLDL and chylomicron triglyceride.\n• The fatty acids are taken up and re-esterified with glycerol phosphate → triglyceride stored (lipogenesis).\nDuring fasting (↓ insulin + ↑ epinephrine):\n• Hormone-sensitive lipase (HSL), in the fat cells, carries out lipolysis → fatty acids released into the circulation → hyperlipidemia."}, "N-BIO-L2-24": {"id": "N-BIO-L2-24", "stem": "Enumerate the conditions that accompany hyperuricemia and gout, and state why uric acid rises in each.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Each condition raises uric acid either by more purine breakdown or lost salvage (Lesch-Nyhan, partial HGPRT, von Gierke, tumor lysis) or by renal underexcretion (alcoholism).", "type": "written", "keyhtml": "• Lesch-Nyhan syndrome — near-complete HGPRT deficiency → no purine salvage.\n• Partial HGPRT deficiency — reduced purine salvage.\n• Alcoholism — ethanol metabolites compete with uric acid for renal excretion: lactate and urate compete for the same transport system in the kidney.\n• Von Gierke disease (glucose-6-phosphatase deficiency) — G6P is shifted to ribose → ↑ purine synthesis and catabolism.\n• Tumor lysis syndrome — chemotherapy/radiation of large tumours → destroyed cancer-cell nucleic acids → purines undergoing turnover."}, "N-BIO-L2-25": {"id": "N-BIO-L2-25", "stem": "Mention the inheritance, enzyme defect and clinical features of Lesch-Nyhan syndrome.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Without HGPRT, hypoxanthine and guanine cannot be salvaged and are degraded by xanthine oxidase to uric acid, so hyperuricemia accompanies the neurological picture.", "type": "written", "keyhtml": "• Inheritance: X-linked recessive.\n• Enzyme defect: near-complete deficiency of HGPRT (hypoxanthine–guanine phosphoribosyltransferase) — HGPRT normally salvages hypoxanthine → IMP and guanine → GMP using PRPP.\n• Clinical features: mental retardation; spastic cerebral palsy with compulsive biting of hands and lips; hyperuricemia or gout (purines cannot be salvaged).\n• Outcome: death often in the first decade."}, "N-BIO-L2-26": {"id": "N-BIO-L2-26", "stem": "A child with short stature has fasting hypoglycemia, hepatomegaly and enlarged kidneys. Glucose-6-phosphatase deficiency (von Gierke disease) is suspected. Mention the expected biochemical findings and explain the cause of each.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In von Gierke disease glucose goes down while lactate, urate and lipids go up.", "type": "written", "keyhtml": "Glucose-6-phosphatase is a key enzyme of gluconeogenesis; its deficiency prevents the liver from releasing free glucose into the blood.\n• Severe fasting hypoglycemia — the liver cannot release free glucose.\n• Lactic acidemia — defect in the Cori cycle.\n• Hyperuricemia — G6P is shifted to ribose → ↑ purine synthesis and catabolism.\n• Hyperlipidemia (↑ cholesterol and triglyceride) — TAG becomes the main source of energy."}, "N-BIO-L2-27": {"id": "N-BIO-L2-27", "stem": "Compare gouty arthritis and rheumatoid arthritis as regards their nature and laboratory diagnosis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "ESR and CRP rise in both; gout is confirmed by uric acid &gt; 7 mg/dL and MSU crystals on aspiration, RA by clinical deformity with RF and the more specific anti-CCP.", "type": "written", "keyhtml": "• Nature: gout — metabolic, monosodium urate (MSU) deposition from hyperuricemia; RA — chronic autoimmune process → inflammatory synovitis of joints.\n• Mechanism: gout — needle-shaped MSU crystals → neutrophil-mediated acute inflammation (chronic: tophi + granulomas); RA — T and B cells (B cells make RF), cytokines and chemokines, synovial fibroblasts and degradative enzymes.\n• ESR and CRP: may be elevated in both — they do not tell them apart.\n• Specific blood test: gout — serum uric acid &gt; 7 mg/dL; RA — RF (positive in up to 80%) and anti-CCP antibody (more specific).\n• Confirmation: gout — joint aspiration showing MSU crystals, intracellular and extracellular; RA — primarily a clinical diagnosis (joint deformity).\n• Blood picture: RA — anemia of chronic disease (normochromic, normocytic)."}, "TP-066": {"id": "TP-066", "stem": "A 40-year-old man has been fasting for more than 3 days after a surgical procedure. His brain now obtains approximately two-thirds of its energy from which of the following substrates?", "top": true, "rep": "", "tag": "Final bank BIO Q48", "bank": true, "expl": "In starvation, rapid lipolysis gives excess acetyl-CoA and ketogenesis, and the brain shifts to ketones: in prolonged starvation ⅔ of its energy comes from ketones and only ⅓ from glucose. This shift spares body protein that would otherwise be used for gluconeogenesis.", "type": "mcq", "opts": ["Glucose", "Ketone bodies", "Lactate", "Amino acids", "Fatty acids"], "ans": 1}, "TP-067": {"id": "TP-067", "stem": "A patient with gout has elevated uric acid levels due to increased purine breakdown. Which enzyme normally salvages purine bases and prevents excess uric acid production?", "top": true, "rep": "", "tag": "Final bank BIO Q49", "bank": true, "expl": "HGPRT salvages free purine bases back into nucleotides (hypoxanthine → IMP, guanine → GMP, using PRPP), so normally ~90% of the bases are recycled and only ~10% become uric acid. Xanthine oxidase does the opposite: it converts hypoxanthine to xanthine and then to uric acid.", "type": "mcq", "opts": ["Adenosine deaminase", "Xanthine oxidase", "Hypoxanthine-guanine phosphoribosyl transferase", "Carbamoyl phosphate synthetase", "Dihydrofolate reductase"], "ans": 2}, "TP-069": {"id": "TP-069", "stem": "A 22-year-old marathon runner collapses after running continuously for 3 hours. Laboratory studies show depleted muscle glycogen stores. His muscles are now primarily using which of the following fuels to maintain ATP production?", "top": true, "rep": "", "tag": "Final bank BIO Q50", "bank": true, "expl": "After 1–3 hours of sustained exercise muscle glycogen is depleted, and intensity declines to a rate supported by fatty-acid oxidation, using free fatty acids from the blood. Glycogenolysis is no longer possible once glycogen is gone, and body protein is used only in extreme cases such as starvation.", "type": "mcq", "opts": ["Glucose from glycogenolysis", "Fatty acids from adipose tissue", "Amino acids from muscle proteolysis", "Lactate oxidation", "Ketone bodies exclusively"], "ans": 1}, "TP-086": {"id": "TP-086", "stem": "Complete the following table about the energy sources for skeletal muscle during exercise (activity → metabolic pathway/fuel): Short intense exercise → ? ; Moderate exercise → ? ; Prolonged exercise → ?", "top": true, "rep": "", "tag": "Final bank BIO W23", "bank": true, "expl": "The fuel depends on the magnitude and duration of exercise and the fibres involved: short bursts use stored glycogen anaerobically, continuous exercise adds aerobic oxidation of glucose and fatty acids, and once glycogen runs out after 1–3 hours fatty-acid oxidation takes over.", "type": "written", "keyhtml": "• Short intense exercise → anaerobic glycolysis of stored muscle glycogen (fast-twitch fibres); the lactate formed goes to the liver → glucose (Cori cycle).\n• Moderate (moderately high, continuous) exercise → aerobic glycolysis + aerobic β-oxidation of fatty acids (slow-twitch fibres).\n• Prolonged exercise → after 1–3 hours muscle glycogen is depleted → fatty-acid oxidation (β-oxidation) supports the declining intensity."}}, "labs": {}, "cards": [{"id": "BIO-L2-001", "text": "The shift of fuel metabolism between the well-fed and fasting states is regulated mainly by the {{c1::insulin/glucagon ratio}}", "extra": "Nutritional status decides which pathways are active.", "sec": "Part 01 · 1.1 Nutritional states & the hormones that switch them"}, {"id": "BIO-L2-002", "text": "Nutritional states: fasting = {{c1::between meals}} · starvation = {{c2::days 1–3}} · prolonged starvation = {{c3::> 3 days}}", "extra": "Sequence: well-fed → fasting → starvation → prolonged starvation.", "sec": "Part 01 · 1.1 Nutritional states & the hormones that switch them"}, {"id": "BIO-L2-003", "text": "Insulin is an {{c1::anabolic}} hormone — it promotes {{c2::fuel storage}}", "extra": "Insulin puts fuel IN.", "sec": "Part 01 · 1.1 Nutritional states & the hormones that switch them"}, {"id": "BIO-L2-004", "text": "Glucagon opposes insulin: it responds rapidly to {{c1::↓ blood glucose}} by promoting the synthesis & release of {{c2::glucose}} into the circulation", "extra": "", "sec": "Part 01 · 1.1 Nutritional states & the hormones that switch them"}, {"id": "BIO-L2-005", "text": "Hormones that oppose the action of insulin: {{c1::glucagon}} · {{c2::epinephrine}} · {{c3::cortisol}} · {{c4::growth hormone}}", "extra": "Mnemonic G-E-C-G.", "sec": "Part 01 · 1.1 Nutritional states & the hormones that switch them"}, {"id": "BIO-L2-006", "text": "The 3 major target tissues for insulin: {{c1::liver}} · {{c2::muscle}} · {{c3::adipose tissue}}", "extra": "", "sec": "Part 01 · 1.2 Well-fed state (after a meal)"}, {"id": "BIO-L2-007", "text": "Well-fed liver: insulin promotes {{c1::glycogenesis}}; only after the glycogen stores are filled does excess glucose → {{c2::triglycerides (lipogenesis)}}", "extra": "Trap: lipogenesis comes after glycogen is full.", "sec": "Part 01 · 1.2 Well-fed state (after a meal)"}, {"id": "BIO-L2-008", "text": "Insulin-sensitive glucose transporter of muscle & adipose tissue: {{c1::GLUT-4}}", "extra": "", "sec": "Part 01 · 1.2 Well-fed state (after a meal)"}, {"id": "BIO-L2-009", "text": "Insulin in well-fed muscle promotes: glucose entry (GLUT-4) · {{c1::glycogenesis}} · {{c2::protein synthesis}}", "extra": "Resynthesizes proteins degraded in the postabsorptive period; excess glucose & amino acids can also be oxidized.", "sec": "Part 01 · 1.2 Well-fed state (after a meal)"}, {"id": "BIO-L2-010", "text": "Fasting (between meals): {{c1::glucagon}} and {{c2::epinephrine}} rise and act on skeletal muscle, adipose tissue and liver", "extra": "Insulin falls.", "sec": "Part 01 · 1.3 Fasting state (between meals)"}, {"id": "BIO-L2-011", "text": "Fasting liver: glycogenolysis is stimulated by {{c1::glucagon & epinephrine}}; gluconeogenesis by {{c2::glucagon}}", "extra": "Trap: gluconeogenesis is glucagon-driven.", "sec": "Part 01 · 1.3 Fasting state (between meals)"}, {"id": "BIO-L2-012", "text": "Fasting: muscle protein degradation and adipose lipolysis are both stimulated by {{c1::↓ insulin + ↑ epinephrine}}", "extra": "Not by glucagon.", "sec": "Part 01 · 1.3 Fasting state (between meals)"}, {"id": "BIO-L2-013", "text": "Fasting muscle releases amino acids into the blood as {{c1::gluconeogenic precursors}}; it burns {{c2::fatty acids & ketone bodies}} (→ acetyl CoA → TCA)", "extra": "", "sec": "Part 01 · 1.3 Fasting state (between meals)"}, {"id": "BIO-L2-014", "text": "Starvation (days 1–3) — why blood ketones rise: rapid {{c1::lipolysis}} → excess {{c2::acetyl-CoA}} → {{c3::ketogenesis}}", "extra": "Glucagon & epinephrine are markedly elevated; ↑ lipids & ketones in the blood.", "sec": "Part 01 · 1.4 Starvation — days 1–3"}, {"id": "BIO-L2-015", "text": "In a prolonged state of starvation, the major source of energy for muscles: {{c1::fatty acids}} (β-oxidation)", "extra": "GD Q4 key. Not glucose, glycogen or amino acids; ketones are added as fasting is prolonged.", "sec": "Part 01 · 1.4 Starvation — days 1–3"}, {"id": "BIO-L2-016", "text": "Starvation days 1–3 — the brain uses {{c1::ketones}} (ketolysis) for some of its energy", "extra": "", "sec": "Part 01 · 1.4 Starvation — days 1–3"}, {"id": "BIO-L2-017", "text": "Brain energy in prolonged starvation (> 3 days): {{c1::⅔}} from ketones · {{c2::⅓}} from glucose", "extra": "Trap: the brain still takes ⅓ of its energy from glucose.", "sec": "Part 01 · 1.5 Prolonged starvation — more than 3 days"}, {"id": "BIO-L2-018", "text": "The shift from glucose to ketones as the major fuel {{c1::spares protein}} — protein otherwise used for {{c2::gluconeogenesis}}", "extra": "Protein is also essential for other specific functions in the cell.", "sec": "Part 01 · 1.5 Prolonged starvation — more than 3 days"}, {"id": "BIO-L2-019", "text": "Normal blood glucose kept by gluconeogenesis: {{c1::70–100 mg/dl}}", "extra": "", "sec": "Part 01 · 1.5 Prolonged starvation — more than 3 days"}, {"id": "BIO-L2-020", "text": "The major fuels of skeletal muscle: {{c1::glucose}} and {{c2::fatty acids}}", "extra": "", "sec": "Part 02 · 2.1 Resting muscle"}, {"id": "BIO-L2-021", "text": "Resting muscle in fasting (under {{c1::epinephrine}}): uses {{c2::fatty acids}} from blood free fatty acids; {{c3::ketones}} if fasting is prolonged", "extra": "", "sec": "Part 02 · 2.1 Resting muscle"}, {"id": "BIO-L2-022", "text": "Energy yield on complete combustion: fat {{c1::9}} kcal/g · carbohydrate, protein & ketones {{c2::4}} kcal/g", "extra": "Fats are much more energy-rich.", "sec": "Part 02 · 2.2 Energy yield & fuel pattern"}, {"id": "BIO-L2-023", "text": "Well-fed state fuel: resting skeletal muscle burns {{c1::glucose}}; cardiac muscle burns {{c2::fatty acids}}", "extra": "Trap: the two muscles differ in the fed state.", "sec": "Part 02 · 2.2 Energy yield & fuel pattern"}, {"id": "BIO-L2-024", "text": "Fasting fuel of both resting skeletal muscle and cardiac muscle: {{c1::fatty acids – ketones}}", "extra": "", "sec": "Part 02 · 2.2 Energy yield & fuel pattern"}, {"id": "BIO-L2-025", "text": "Muscle & RBCs: glucose → pyruvate ({{c1::glycolysis}}) → lactate ▶ blood ▶ liver: lactate → pyruvate → glucose ({{c2::gluconeogenesis}}) ▶ back to muscle & RBCs = the {{c3::Cori (lactic acid)}} cycle", "extra": "GD Q5 figure labels: glycolysis & lactate in muscle; lactate & gluconeogenesis in liver.", "sec": "Part 02 · 2.3 The Cori cycle (lactic acid cycle)"}, {"id": "BIO-L2-026", "text": "Importance of the Cori cycle: {{c1::helps maintain the blood glucose level}} · {{c2::prevents loss of lactate as a waste product in urine}} · {{c3::spares energy in red cells and contracting muscles}}", "extra": "GD Q5 answer = the pamphlet's three points.", "sec": "Part 02 · 2.3 The Cori cycle (lactic acid cycle)"}, {"id": "BIO-L2-027", "text": "Significance of the Cori cycle in muscle (multiple answers): {{c1::prevents lactic acidosis}} · {{c2::provides active muscle with required glucose}} · {{c3::helps maintain normal blood glucose}}", "extra": "Official GD Q3 key. Pamphlet: maintain blood glucose · prevent lactate loss in urine · spare energy in RBCs & muscle.", "sec": "Part 02 · 2.3 The Cori cycle (lactic acid cycle)"}, {"id": "BIO-L2-028", "text": "How the Cori cycle spares energy: in the liver, {{c1::amino acids}} provide the carbon skeletons and {{c2::fatty-acid oxidation}} provides the ATP for gluconeogenesis", "extra": "So RBCs & contracting muscle get glucose back for reuse and ATP production.", "sec": "Part 02 · 2.3 The Cori cycle (lactic acid cycle)"}, {"id": "BIO-L2-029", "text": "The primary fuel for muscle contraction depends on the {{c1::magnitude and duration}} of exercise and the {{c2::major fibres involved}}", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-030", "text": "Skeletal muscle stores both {{c1::glycogen}} and some {{c2::triglycerides}}; blood glucose and free fatty acids may also be used", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-031", "text": "Fibre type: fast-twitch = type {{c1::2a or 2b}}; slow-twitch = type {{c2::1}}", "extra": "\"One Slow Red Ox\" — type 1 = slow = red = oxidative.", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-032", "text": "Metabolism: fast-twitch — {{c1::high capacity for anaerobic glycolysis}}; slow-twitch — {{c2::primarily oxidative (aerobic)}}", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-033", "text": "Fatigue: fast-twitch fibres {{c1::fatigue quickly}}; slow-twitch fibres {{c2::resist fatigue}}", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-034", "text": "Exercise type: fast-twitch — {{c1::short-term, high-intensity}}; slow-twitch — {{c2::prolonged, low-to-moderate intensity}}", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-035", "text": "Blood supply: fast-twitch — {{c1::low, few capillaries}}; slow-twitch — {{c2::well-vascularized, many capillaries}}", "extra": "Slow-twitch example: arm & leg muscles.", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-036", "text": "Mitochondria: fast-twitch {{c1::few}}; slow-twitch {{c2::many}} — they increase dramatically in {{c3::trained athletes}}", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-037", "text": "Colour · athlete: fast-twitch = {{c1::pale}} · {{c2::sprinter}}; slow-twitch = {{c3::red}} · {{c4::marathoner}}", "extra": "", "sec": "Part 02 · 2.4 Active muscle & the two fibre types"}, {"id": "BIO-L2-038", "text": "Short bursts of high-intensity exercise are supported by {{c1::anaerobic glycolysis}} drawing on stored {{c2::muscle glycogen}} ({{c3::fast-twitch}} fibres)", "extra": "The lactate goes via blood to the liver → glucose (gluconeogenesis).", "sec": "Part 02 · 2.5 Exercise by magnitude & duration"}, {"id": "BIO-L2-039", "text": "Sprinting, early stage — energy pathways in muscle (multiple answers): {{c1::anaerobic glycolysis of intracellular glucose}} + {{c2::glycogenolysis}}", "extra": "Official GD Q1 key: the burst runs on stored muscle glycogen.", "sec": "Part 02 · 2.5 Exercise by magnitude & duration"}, {"id": "BIO-L2-040", "text": "Sprinting (late stage or severe exercise) is a short, high-intensity burst: muscle energy comes from {{c1::anaerobic glycolysis}} drawing on {{c2::stored muscle glycogen}} (glycogenolysis).", "extra": "Fast-twitch fibres; the lactate goes to the liver → glucose (Cori cycle). Fatty-acid oxidation only after 1–3 h of continuous exercise.", "sec": "Part 02 · 2.5 Exercise by magnitude & duration"}, {"id": "BIO-L2-041", "text": "100-m race: only ½ L O₂ used vs > 10 L if fully aerobic → the majority of ATP comes from {{c1::glycolysis}}", "extra": "Formative 3 key: a short, high-intensity burst = anaerobic glycolysis (fast-twitch).", "sec": "Part 02 · 2.5 Exercise by magnitude & duration"}, {"id": "BIO-L2-042", "text": "Moderately high, continuous exercise — at the beginning: {{c1::aerobic glycolysis}} and {{c2::aerobic β-oxidation of fatty acids}} are both important ({{c3::slow-twitch}} fibres)", "extra": "", "sec": "Part 02 · 2.5 Exercise by magnitude & duration"}, {"id": "BIO-L2-043", "text": "After {{c1::1–3 hours}} of sustained exercise, muscle {{c2::glycogen is depleted}} → intensity declines to a rate supported by {{c3::fatty-acid oxidation}}", "extra": "Scenario: a marathon runner slows down after 1–3 hours.", "sec": "Part 02 · 2.5 Exercise by magnitude & duration"}, {"id": "BIO-L2-044", "text": "Fuel of cardiac myocytes: fetal life — {{c1::primarily glucose}}; postnatal → adult — {{c2::fatty acids (β-oxidation)}} = major fuel", "extra": "", "sec": "Part 03 · 3.1 Cardiac muscle"}, {"id": "BIO-L2-045", "text": "Heart in prolonged fasting: fatty acids + {{c1::ketones}} (when present)", "extra": "", "sec": "Part 03 · 3.1 Cardiac muscle"}, {"id": "BIO-L2-046", "text": "Heart failure: glucose oxidation {{c1::↑::↑ or ↓}} · β-oxidation {{c2::↓::↑ or ↓}}", "extra": "The heart shifts back toward glucose.", "sec": "Part 03 · 3.1 Cardiac muscle"}, {"id": "BIO-L2-047", "text": "Cardiac hypertrophy: the adult fatty-acid pattern {{c1::reverses to some extent}}", "extra": "Shift back toward glucose, as in heart failure.", "sec": "Part 03 · 3.1 Cardiac muscle"}, {"id": "BIO-L2-048", "text": "Fed adipose tissue (↑ insulin): glucose enters by {{c1::GLUT-4}} → glycolysis → {{c2::glycerol phosphate}}", "extra": "Glycerol phosphate comes from glucose oxidation in the adipocyte.", "sec": "Part 03 · 3.2 Adipose tissue"}, {"id": "BIO-L2-049", "text": "Lipoprotein lipase (LPL): sits in the {{c1::capillary bed of adipose tissue}}; frees fatty acids from {{c2::VLDL & chylomicron}} triglyceride (fed, insulin)", "extra": "LPL = \"Loading\" lipase.", "sec": "Part 03 · 3.2 Adipose tissue"}, {"id": "BIO-L2-050", "text": "Fed adipose: fatty acids are taken up and re-esterified with glycerol phosphate → {{c1::triglyceride}} stored ({{c2::lipogenesis}})", "extra": "", "sec": "Part 03 · 3.2 Adipose tissue"}, {"id": "BIO-L2-051", "text": "Hormone-sensitive lipase (HSL): acts {{c1::inside fat cells}} in fasting ({{c2::↓ insulin + ↑ epinephrine}}) → lipolysis → fatty acids into the circulation → {{c3::hyperlipidemia}}", "extra": "HSL = \"Hunger-Sensitive\" lipase.", "sec": "Part 03 · 3.2 Adipose tissue"}, {"id": "BIO-L2-052", "text": "Two ways to make nucleotides: {{c1::de novo synthesis}} (from smaller precursors) and {{c2::salvage pathways}} (preformed bases → nucleotides)", "extra": "", "sec": "Part 04 · 4.1 Two ways to make nucleotides"}, {"id": "BIO-L2-053", "text": "De novo nucleotide synthesis: {{c1::PRPP synthetase}} converts {{c2::ribose-5-phosphate}} → PRPP", "extra": "", "sec": "Part 04 · 4.1 Two ways to make nucleotides"}, {"id": "BIO-L2-054", "text": "Purine catabolism: nucleotides (excess, or from DNA & RNA by {{c1::nucleases}}) → loss of {{c2::Pi}} → nucleosides → release of {{c3::ribose / deoxyribose}} → free purine bases", "extra": "", "sec": "Part 04 · 4.2 Purine catabolism — the 90 / 10 rule"}, {"id": "BIO-L2-055", "text": "Normal fate of free purine bases: ~{{c1::90%}} salvaged · ~{{c2::10%}} → uric acid → urine", "extra": "When purine catabolism rises significantly → risk of hyperuricemia and gout.", "sec": "Part 04 · 4.2 Purine catabolism — the 90 / 10 rule"}, {"id": "BIO-L2-056", "text": "HGPRT salvage: hypoxanthine → {{c1::IMP}} · guanine → {{c2::GMP}}, using {{c3::PRPP}}", "extra": "HGPRT rescues the H and the G; no HGPRT → bases go to xanthine oxidase → uric acid.", "sec": "Part 04 · 4.3 The salvage & degradation map"}, {"id": "BIO-L2-057", "text": "Salvage enzyme for adenine → AMP: {{c1::APRT}}", "extra": "", "sec": "Part 04 · 4.3 The salvage & degradation map"}, {"id": "BIO-L2-058", "text": "ADA (adenosine deaminase): adenosine → {{c1::inosine}}", "extra": "", "sec": "Part 04 · 4.3 The salvage & degradation map"}, {"id": "BIO-L2-059", "text": "Xanthine oxidase: {{c1::hypoxanthine}} → {{c2::xanthine}} → {{c3::uric acid}}", "extra": "", "sec": "Part 04 · 4.3 The salvage & degradation map"}, {"id": "BIO-L2-060", "text": "Xanthine oxidase inhibitors: {{c1::allopurinol}} and {{c2::febuxostat}}", "extra": "So allopurinol blocks hypoxanthine → xanthine.", "sec": "Part 04 · 4.3 The salvage & degradation map"}, {"id": "BIO-L2-061", "text": "Drugs on the purine map: probenecid {{c1::⊕::⊕ or ⊖}} urate excretion · aspirin {{c2::⊖::⊕ or ⊖}} urate excretion · rasburicase acts on {{c3::uric acid}}", "extra": "", "sec": "Part 04 · 4.3 The salvage & degradation map"}, {"id": "BIO-L2-062", "text": "Hyperuricemia is produced by {{c1::overproduction}} of uric acid or {{c2::underexcretion}} of uric acid by the kidneys", "extra": "GD Q8 wording: ↑ conversion of purine bases to uric acid, or ↓ renal excretion.", "sec": "Part 05 · 5.1 Hyperuricemia"}, {"id": "BIO-L2-063", "text": "Uric acid is produced from excess {{c1::endogenous}} or {{c2::dietary}} purines; both are carried in the blood to the kidneys for excretion", "extra": "High-purine food & drinks → kidneys can't remove the excess → gout.", "sec": "Part 05 · 5.1 Hyperuricemia"}, {"id": "BIO-L2-064", "text": "Gout pathophysiology: the {{c1::insoluble}} uric acid precipitates as {{c2::monosodium urate}} crystals in {{c3::joints & surrounding soft tissue}} → inflammation", "extra": "'Insoluble' is from the official GD Q8 answer; the pamphlet says MSU is deposited.", "sec": "Part 05 · 5.1 Hyperuricemia"}, {"id": "BIO-L2-065", "text": "Acute gouty arthritis: {{c1::needle-shaped}} monosodium urate crystals in joints → {{c2::neutrophil}}-mediated acute inflammation", "extra": "Acute = \"Needles & Neutrophils\".", "sec": "Part 05 · 5.2 Gout — acute vs chronic"}, {"id": "BIO-L2-066", "text": "Acute gout: most common in {{c1::males}}; often first affects the {{c2::big toe}}", "extra": "", "sec": "Part 05 · 5.2 Gout — acute vs chronic"}, {"id": "BIO-L2-067", "text": "Chronic gout: {{c1::tophi}} — deposits of monosodium urate in the {{c2::soft tissue around joints}} — with chronic inflammation involving {{c3::granulomas}}", "extra": "Chronic = \"Tophi & granulomas\"; it manifests over time.", "sec": "Part 05 · 5.2 Gout — acute vs chronic"}, {"id": "BIO-L2-068", "text": "Conditions that accompany hyperuricemia & gout: {{c1::Lesch-Nyhan syndrome}} · {{c2::partial HGPRT deficiency}} · {{c3::alcoholism}} · {{c4::von Gierke disease}} · {{c5::tumor lysis syndrome}}", "extra": "\"Lazy Purines Accumulate, Giving Tophi\".", "sec": "Part 05 · 5.3 Conditions that accompany hyperuricemia & gout"}, {"id": "BIO-L2-069", "text": "Why uric acid rises — Lesch-Nyhan: {{c1::no purine salvage}}; partial HGPRT deficiency: {{c2::reduced purine salvage}}", "extra": "", "sec": "Part 05 · 5.3 Conditions that accompany hyperuricemia & gout"}, {"id": "BIO-L2-070", "text": "Alcoholism raises uric acid because {{c1::lactate}} and urate compete for the same {{c2::renal transport system}}", "extra": "Alcohol = under-excretion.", "sec": "Part 05 · 5.3 Conditions that accompany hyperuricemia & gout"}, {"id": "BIO-L2-071", "text": "Von Gierke disease raises uric acid because {{c1::G6P is shifted to ribose}} → ↑ purine synthesis & catabolism", "extra": "", "sec": "Part 05 · 5.3 Conditions that accompany hyperuricemia & gout"}, {"id": "BIO-L2-072", "text": "Lesch-Nyhan syndrome: {{c1::X-linked recessive}}; {{c2::near-complete}} deficiency of {{c3::HGPRT}}", "extra": "HGPRT = hypoxanthine–guanine phosphoribosyltransferase.", "sec": "Part 05 · 5.4 Lesch-Nyhan syndrome"}, {"id": "BIO-L2-073", "text": "Genetic loss of HGPRT activity is the primary cause of {{c1::Lesch-Nyhan syndrome}}", "extra": "GD Q7 key (not gout).", "sec": "Part 05 · 5.4 Lesch-Nyhan syndrome"}, {"id": "BIO-L2-074", "text": "Lesch-Nyhan features: {{c1::mental retardation}} · {{c2::spastic cerebral palsy}} with {{c3::compulsive biting of hands and lips}} · {{c4::hyperuricemia or gout}}", "extra": "HGPRT: Hyperuricemia · Gout · Palsy · Retardation · Teeth into hands & lips.", "sec": "Part 05 · 5.4 Lesch-Nyhan syndrome"}, {"id": "BIO-L2-075", "text": "Lesch-Nyhan outcome: death often in the {{c1::first decade}}", "extra": "", "sec": "Part 05 · 5.4 Lesch-Nyhan syndrome"}, {"id": "BIO-L2-076", "text": "Von Gierke disease = deficiency of {{c1::glucose-6-phosphatase}}, a key enzyme of {{c2::gluconeogenesis}}", "extra": "Its loss stops the liver releasing free glucose into the blood.", "sec": "Part 05 · 5.5 Von Gierke disease (glucose-6-phosphatase deficiency)"}, {"id": "BIO-L2-077", "text": "Von Gierke findings: {{c1::severe fasting hypoglycemia}} · {{c2::lactic acidemia}} · {{c3::hyperuricemia}} · {{c4::hyperlipidemia}}", "extra": "Glucose goes DOWN, L-U-L go UP (lactate, urate, lipids).", "sec": "Part 05 · 5.5 Von Gierke disease (glucose-6-phosphatase deficiency)"}, {"id": "BIO-L2-078", "text": "Von Gierke causes: lactic acidemia ← {{c1::defect in the Cori cycle}}; hyperlipidemia ← {{c2::TAG becomes the main source of energy}}", "extra": "Hypoglycemia ← the liver cannot release free glucose.", "sec": "Part 05 · 5.5 Von Gierke disease (glucose-6-phosphatase deficiency)"}, {"id": "BIO-L2-079", "text": "Glucose-6-phosphatase deficiency labs: fasting blood glucose {{c1::low::high or low}} · blood lactate {{c2::high::high or low}} · serum uric acid {{c3::high::high or low}}", "extra": "Formative 3 Q25 key: Low / High / High.", "sec": "Part 05 · 5.5 Von Gierke disease (glucose-6-phosphatase deficiency)"}, {"id": "BIO-L2-080", "text": "Short stature, fasting hypoglycemia, hepatomegaly, enlarged kidneys; ↑ lactate, cholesterol, TG & uric acid → deficient enzyme: {{c1::glucose-6-phosphatase}}", "extra": "Not brancher, debrancher, hepatic or muscle phosphorylase.", "sec": "Part 05 · 5.5 Von Gierke disease (glucose-6-phosphatase deficiency)"}, {"id": "BIO-L2-081", "text": "Tumor lysis syndrome: chemo / radiation of large tumours → destroyed cancer-cell {{c1::nucleic acids}} → purines turned over → ↑↑ {{c2::uric acid}} → gout", "extra": "", "sec": "Part 05 · 5.6 Tumor lysis syndrome"}, {"id": "BIO-L2-082", "text": "Male, sudden hot, red, swollen big toe; needle-shaped crystals in synovial fluid; uric acid > 7 mg/dL → {{c1::acute gouty arthritis}}", "extra": "GD Q8 case.", "sec": "Part 06 · 6.1 Diagnosis of gouty arthritis"}, {"id": "BIO-L2-083", "text": "Serum uric acid in gout: elevated — {{c1::> 7 mg/dL}}", "extra": "", "sec": "Pa const LS = {};

function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
