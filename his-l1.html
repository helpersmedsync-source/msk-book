discs"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p68", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l1-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Q&amp;A recap of all parts", "(coverings, bands, filaments, triad, fibre types, cardiac features, Pompe)"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["Mnemonics:", "Epi›Peri›Endo; dArk=Anisotropic; One Slow Red Ox; Desmin→DRM, Dystrophin→DMD"]]}, {"title": "8.3 Complete — the lecture's own questions", "items": [["Sarcosome =", "mitochondrion; sarcoplasmic reticulum = sER"], ["Skeletal muscle regenerates", "by division of satellite cells"], ["Junctions between cardiac fibres =", "intercalated discs"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p69", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Extensibility = stretch without tearing; elasticity = recoil — don't swap"}, {"t": "note", "kind": "trap", "html": "Diaphragm &amp; upper third of oesophagus are skeletal yet involuntary"}, {"t": "note", "kind": "trap", "html": "Epimysium &amp; perimysium are dense C.T.; only endomysium is loose"}, {"t": "note", "kind": "trap", "html": "Troponin is in skeletal &amp; cardiac only — not smooth muscle"}, {"t": "note", "kind": "trap", "html": "A band never changes length in contraction — only H &amp; I shrink"}, {"t": "note", "kind": "trap", "html": "Hypertrophy = bigger fibres, not more fibres"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p70", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Skeletal = triad at A–I junction; cardiac = diad at Z line with larger T tubules, poor SR"}, {"t": "note", "kind": "trap", "html": "Skeletal fibres do branch in tongue &amp; face"}, {"t": "note", "kind": "trap", "html": "Cardiac nuclei may be binucleated but still central"}, {"t": "note", "kind": "cl", "html": "Desmin-related myopathy: absent desmin → disorganized myofibrils; progressive leg weakness spreading; cardiac/respiratory involvement → fatal"}, {"t": "note", "kind": "cl", "html": "Duchenne muscular dystrophy: dystrophin defect → atrophy of muscle fibres"}, {"t": "note", "kind": "cl", "html": "Anabolic steroids: ↑ muscle mass; liver cancer; detectable 6 months"}]}, {"id": "p71", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Pompe disease: lysosomal glucosidase deficiency → glycogen accumulation, hypotonia, heart &amp; breathing problems in infants"}, {"t": "note", "kind": "cl", "html": "Cardiac injury repaired by fibrous scar (no satellite cells)"}]}, {"id": "p72", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0865": {"id": "Q0865", "stem": "In the muscle myofibril, the A band is formed of:", "top": true, "rep": "asked 3 years", "tag": "Final bank HIS Q11", "bank": true, "expl": "The A (dark) band is made of the thick filaments plus the thin filaments that lie between them, so its molecular structure is both actin and myosin. Myosin only is found in the H zone at the centre of the A band, and actin only in the light I band.", "type": "mcq", "opts": ["T tubules", "Myosin filaments only", "Sarcoplasmic reticulum", "Actin filaments only", "Actin and myosin filaments"], "ans": 4}, "Q0237": {"id": "Q0237", "stem": "Which of the following is true of mammalian skeletal muscle?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Skeletal muscle has triads: each T tubule lies between two terminal cisternae of the SR at the A–I junction. T tubules at the Z disk are the cardiac pattern, and troponin is present in both skeletal and cardiac muscle.", "type": "mcq", "opts": ["It possesses caveolae.", "Its T tubules are located at the Z disk.", "It possesses triads.", "T tubules are absent.", "Troponin is absent."], "ans": 2}, "Q0238": {"id": "Q0238", "stem": "Which of the following statements concerning triads in mammalian skeletal muscle is true?", "top": false, "rep": "", "tag": "Final bank HIS Q14", "bank": true, "expl": "A triad is one T tubule lying between two terminal cisternae of the SR, with 2 triads per sarcomere at the A–I junctions. Option d reverses the arrangement, and a Z-line site belongs to the cardiac diad; calcium release and re-uptake is the job of the SR, not the T tubule.", "type": "mcq", "opts": ["They consist of two terminal cisternae of the SR separated by a T tubule.", "They are located in the Z disk.", "They are characterized by a T tubule that sequesters calcium ions.", "They consist of two T tubules separated by a central terminal cisterna.", "They can be observed with the light microscope."], "ans": 0}, "Q0240": {"id": "Q0240", "stem": "Multiple biopsies were taken from different types of muscle. In one of these specimens, the researcher described cylindrical muscle fibers with distinct striations and multiple peripheral nuclei. He also found that in this muscle the fibers branch. The biopsy was taken from which of the following sites?", "top": false, "rep": "", "tag": "Final bank HIS Q15", "bank": true, "expl": "Distinct striations with multiple, oval, peripheral nuclei identify skeletal muscle, and skeletal fibres branch only in the tongue and face. Heart muscle also branches, but its nuclei are one or two and central; the biceps and the upper third of the oesophagus are skeletal muscle whose fibres do not branch.", "type": "mcq", "opts": ["Biceps", "Face muscles", "Heart muscle", "Muscle of the lower third of the esophagus", "Muscle of the upper third of the esophagus"], "ans": 1}, "Y26-009": {"id": "Y26-009", "stem": "An old woman is suffering from a disease diagnosed as muscular dystrophy. Its mechanism is:", "top": true, "rep": "", "tag": "Final bank HIS Q12", "bank": true, "expl": "Skeletal muscle regenerates by the activity of satellite cells, which are activated, proliferate and fuse to form new muscle fibres; when they fail to replace the degenerated fibres, the muscle atrophies, as in muscular dystrophy. Division by mitosis is how smooth muscle regenerates, and fibroblasts only form a fibrous scar (the repair of cardiac muscle, which has no satellite cells).", "type": "mcq", "opts": ["Fibroblasts fail to replace degenerated muscle fibers", "Muscle fibers fail to divide by mitosis to replace degeneration", "Satellite cells fail to replace degenerated muscle fibers", "Pericytes fail to replace degenerated muscle fibers", "Actin fails to replace degenerated muscle fibers"], "ans": 2}, "Q0241": {"id": "Q0241", "stem": "A 52-year-old man with a high blood cholesterol level had severe chest pain. Investigation showed a thrombus in a coronary artery that caused the anginal pain and led to death of part of his cardiac muscle (myocardial infarction). Repair of the damaged cardiac muscle will occur through which of the following?", "top": false, "rep": "", "tag": "Final bank HIS Q16", "bank": true, "expl": "Cardiac muscle has no satellite cells, so it cannot regenerate; the injury is repaired by fibroblasts forming fibrous connective tissue (a scar). Differentiation of satellite cells is how skeletal, not cardiac, muscle regenerates.", "type": "mcq", "opts": ["Activation of fibroblasts and fibrous tissue formation", "Differentiation of satellite cells", "Differentiation of undifferentiated mesenchymal cells (UMCs) into myocytes", "Change of pericytes into cardiac muscle cells", "Division of cardiac muscle fibers"], "ans": 0}, "Q0244": {"id": "Q0244", "stem": "The parents of a 5-year-old boy are concerned that their son tires easily. Physical examination reveals enlargement of the child's calf muscles. Serum levels of creatine kinase are elevated. A biopsy of calf muscle reveals muscle fiber necrosis, regenerating fibers, and fibrosis. The child is subsequently diagnosed with Duchenne muscular dystrophy. This X-linked recessive disease is caused by mutations in the gene for which of the following muscle proteins?", "top": true, "rep": "asked 2 years", "tag": "Final bank HIS Q1", "bank": true, "expl": "Duchenne muscular dystrophy is caused by a defect in dystrophin, the protein that binds actin to the sarcolemma and then to the extracellular matrix; the defect leads to atrophy of muscle fibres. Desmin, the tempting distractor, joins the Z disks of adjacent myofibrils, and its absence causes desmin-related myopathy.", "aimg": ["figs/GH-08_ans.jpg"], "acap": "Whole muscle → fascicle → muscle fibre; dystrophin linking the cytoskeleton to the basal lamina", "type": "mcq", "opts": ["Creatine kinase", "Desmin", "Dystrophin", "Glycogen phosphorylase", "Myosin"], "ans": 2}, "Q0245": {"id": "Q0245", "stem": "Arrow 2 indicates which of the following structures?", "top": true, "rep": "asked 2 years", "tag": "Final bank HIS Q2", "bank": true, "expl": "Arrow 2 marks a dark transverse line crossing the fibres where two cells meet end to end: an intercalated disc, the step-like junction between cardiac muscle cells (note the central oval nucleus at arrow 1). T tubules are invaginations of the sarcolemma that carry the impulse inward, not junctions between cells.", "img": ["figs/GH-11.jpg"], "cap": "Light micrograph of muscle tissue (longitudinal section)", "type": "mcq", "opts": ["Intercalated disk", "Motor end-plate", "Sarcoplasmic reticulum", "Tendinous junction", "Transverse tubule or T tubule"], "ans": 0}, "Q0247": {"id": "Q0247", "stem": "A 30-year-old woman begins a vigorous program of bodybuilding. After 6 months, her muscles have become prominent and strong. Which of the following physiologic changes underlies muscle enlargement in this woman?", "top": true, "rep": "asked 2 years", "tag": "Final bank HIS Q3", "bank": true, "expl": "Strength training causes hypertrophy: muscle size increases without an increase in the number of fibres, because each fibre grows in width by synthesis of new proteins by ribosomes. Option c (more fibres) is exactly what hypertrophy is not.", "type": "mcq", "opts": ["Deposition of newly formed adipocytes", "Increase in the diameter of individual muscle fibers", "Increase in the number of muscle fibers", "Thickening of the endomysium", "Thickening of the perimysium"], "ans": 1}, "Q0259": {"id": "Q0259", "stem": "Observation of histologic preparation of muscle reveals cross striations and peripherally located nuclei. The same tissue preparation for electron microscopy shows many mitochondria in rows between myofibrils and under the sarcolemma. Which of the following best describes this tissue?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q4", "bank": true, "expl": "Cross striations with multiple peripheral nuclei identify skeletal muscle (cardiac muscle has central nuclei and smooth muscle no striations), and many mitochondria mark red (type 1) fibres, which use aerobic oxidative phosphorylation. White (type 2) fibres, the fast ones, have few mitochondria and more glycogen.", "type": "mcq", "opts": ["Red skeletal muscle fibers", "Fast fibers", "White skeletal muscle fibers", "Smooth muscle", "Cardiac muscle"], "ans": 0}, "Q0260": {"id": "Q0260", "stem": "In the transmission electron micrograph of skeletal muscle shown below, which of the following is true of the zone labeled C?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q5", "bank": true, "expl": "Zone C is the I band, the light band on either side of the Z line, which contains thin (actin) filaments only, so thick and thin filaments do not overlap there. The Z line defines the sarcomere, and the H zone with its central M line lies in the middle of the A band, not in the I band.", "img": ["figs/GH-05.jpg"], "cap": "", "type": "mcq", "opts": ["It defines the sarcomere", "Thick filaments are anchored to this structure", "This structure bisects the H band and is formed predominantly of creatine kinase", "No overlap of thick and thin filaments occurs in this zone", "This portion of the A band consists solely of the rodlike portions of myosin"], "ans": 3}, "Q0261": {"id": "Q0261", "stem": "In a given muscle fiber at rest, the length of I band is 1.0 micron and the A band is 1.5 micron. Contraction of that muscle fiber results in a 10% shortening of the sarcomere. What is the length of the A band after the shortening produced by the muscle contraction?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q6", "bank": true, "expl": "During contraction the A band remains the same length; only the H zone (which disappears) and the I band (which decreases) shorten as the Z lines move inward. 1.35 micron wrongly applies the 10% shortening to the A band.", "aimg": ["figs/GH-04_ans.jpg", "figs/GH-04_ans2.jpg", "figs/GH-04_ans3.jpg", "figs/GH-04_ans4.jpg"], "acap": "EM of skeletal muscle; bands and lines in the contractile apparatus of skeletal muscle; skeletal muscle fibre with SR and T tubules around the myofibrils; muscle fibre — myofibrils with dark A and light I bands", "type": "mcq", "opts": ["1.5 micron", "1.35 micron", "1.0 micron", "0.90 micron", "0.45 micron"], "ans": 0}, "Q0262": {"id": "Q0262", "stem": "The sarcoplasmic reticulum of skeletal muscle functions in which of the following?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q7", "bank": true, "expl": "The SR (sER) stores calcium and regulates contraction by releasing it and taking it back up. During contraction calcium is released from the terminal cisternae, not transported into them (d), and the T tubules conduct the impulse rather than release calcium (e).", "type": "mcq", "opts": ["Cellular calcium storage", "Cellular glycogen storage", "Glycogen degradation", "Transport of calcium ions into the terminal cisternae during muscle contraction", "Calcium ion release from the transverse tubules during muscle relaxation"], "ans": 0}, "Q0264": {"id": "Q0264", "stem": "A 25-year-old boy sustains a tear in his gastrocnemius muscle when he is involved in a bicycle accident. Regeneration of muscle will occur through which of the following?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q8", "bank": true, "expl": "Skeletal muscle regenerates by the activity of satellite cells, which lie on the myofibre under the basal lamina: after injury they are activated, proliferate and fuse to form new skeletal muscle fibres. It is the satellite cells, not the damaged myofibres (c), that fuse.", "aimg": ["figs/GH-03_ans.jpg"], "acap": "Satellite cells — activation, proliferation, differentiation and return to quiescence", "type": "mcq", "opts": ["Differentiation of satellite cells", "Dedifferentiation of myocytes into myoblasts", "Fusion of damaged myofibers to form new myotubes", "Differentiation of fibroblasts to form myocytes", "Hyperplasia of existing myofibers"], "ans": 0}, "Q0265": {"id": "Q0265", "stem": "The endomysium is a connective tissue investment that surrounds which of the following?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q9", "bank": true, "expl": "The endomysium is loose C.T. surrounding each individual muscle fibre. Muscle bundles (fascicles) are surrounded by the dense perimysium and the whole muscle by the dense epimysium.", "aimg": ["figs/GH-12_ans.jpg"], "acap": "Connective tissue of skeletal muscle — epimysium, perimysium, endomysium", "type": "mcq", "opts": ["Individual muscle fibers", "Muscle fascicles", "Individual myofibrils", "An entire muscle", "Small bundles of muscle cells"], "ans": 0}, "Q0267": {"id": "Q0267", "stem": "In muscular dystrophy, the actin-binding protein dystrophin is absent or defective. Dystrophin contains a similar actin-binding domain to spectrin and alpha-actinin and has a similar structure. Which of the following is most likely to occur as a result of this deficiency?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q10", "bank": true, "expl": "Dystrophin binds actin to the sarcolemma and then to the extracellular matrix; because the I band is made of actin (thin filaments) only, its loss detaches the I bands from the cell membrane and leads to atrophy of fibres (DMD). Desmosomes of intercalated discs are a cardiac junction unrelated to dystrophin.", "type": "mcq", "opts": ["Enhanced smooth muscle contractility", "Deficiency in skeletal muscle actin synthesis", "Loss of binding of the I bands to the cell membrane", "Loss of organelle and vesicle transport throughout the muscle cell", "Loss of integrity of the desmosomes of the intercalated discs"], "ans": 2}, "Q0276": {"id": "Q0276", "stem": "What unique structure connects individual cardiac muscle cells end to end, forming long fibers?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Intercalated discs are step-like junctions forming end-to-end attachments between adjacent cardiac cells, joining short columnar cells into long fibres. T tubules are sarcolemmal invaginations that carry the impulse inward, not cell-to-cell junctions.", "type": "mcq", "opts": ["T tubule", "Caveolae", "Intercalated discs", "Dense bodies"], "ans": 2}, "Q0277": {"id": "Q0277", "stem": "Which statement accurately describes the nuclei of a cardiac muscle fiber?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Cardiac muscle cells are mono- or binucleated, with oval, central nuclei. Numerous, oval, peripheral nuclei describe skeletal muscle, and 'single' is incomplete because a cell may have two nuclei.", "type": "mcq", "opts": ["Numerous, oval and peripheral", "Single, oval and central", "Mono- or binucleated, oval and central", "Absent"], "ans": 2}, "Q0278": {"id": "Q0278", "stem": "In cardiac muscle, the sarcoplasmic reticulum is poorly defined and forms a structure with one T tubule at the Z line. What is this structure called?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In cardiac muscle the poorly defined SR forms diads: one T tubule plus one SR profile at the Z line. A triad (1 T tubule + 2 terminal cisternae at the A–I junction) is the skeletal arrangement.", "type": "mcq", "opts": ["Triad", "Syncytium", "Diad", "Sarcomere"], "ans": 2}, "Q0279": {"id": "Q0279", "stem": "Which of the following cellular structures distributes electrochemical signals between cardiac myocytes to ensure a normal heart rhythm?", "top": true, "rep": "asked 2 years", "tag": "Final bank HIS Q13", "bank": true, "expl": "Large gap junctions in the longitudinal portion of the intercalated disc give ionic continuity between cardiac cells, so contraction is coordinated and the muscle behaves as a functional syncytium. Fascia adherens and macula adherens (desmosomes) lie in the transverse portion and only anchor actin or hold the cells together.", "type": "mcq", "opts": ["Endomysium", "Sarcomere", "Fascia adherens", "Gap junctions", "Macula adherens"], "ans": 3}, "Q0280": {"id": "Q0280", "stem": "Since cardiac muscle fibers do not regenerate, how are injuries to cardiac muscle primarily repaired?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Cardiac muscle has no satellite cells and cannot regenerate, so injuries are repaired by fibroblasts forming fibrous C.T. (a scar). Differentiation of satellite cells is the skeletal muscle mechanism.", "type": "mcq", "opts": ["Hypertrophy of existing cardiac muscle cells", "Mitotic division of existing cardiac muscle cells", "Formation of fibrous connective tissue by fibroblasts", "Differentiation of satellite cells"], "ans": 2}, "Q0290": {"id": "Q0290", "stem": "How are the T tubules organized differently in cardiac muscle compared with skeletal muscle?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Cardiac T tubules are larger than skeletal ones and meet the SR at the Z line, forming diads (1 T tubule + 1 SR profile). Triads at the A–I junction are the skeletal pattern, and T tubules are present in both.", "type": "mcq", "opts": ["In cardiac muscle, T tubules are absent.", "In cardiac muscle, they form a triad at the A–I junction.", "In cardiac muscle, they form a diad at the Z line.", "In cardiac muscle, they form a triad at the Z line."], "ans": 2}, "Q0250": {"id": "Q0250", "stem": "Does cardiac muscle regenerate? Explain.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Cardiac muscle lacks satellite cells, the cells that regenerate skeletal muscle, so its injuries heal by a fibrous scar made by fibroblasts.", "type": "written", "keyhtml": "No. Cardiac muscle has no satellite cells, so it cannot regenerate; an injury is repaired by fibroblasts forming fibrous connective tissue (a scar)."}, "Q0254": {"id": "Q0254", "stem": "Describe skeletal muscle fibers as seen under the light microscope.", "top": false, "rep": "asked 2 years", "tag": "Final bank HIS W1", "bank": true, "expl": "The light-microscope picture is a distinct sarcolemma, multiple oval peripheral nuclei and acidophilic sarcoplasm with clear transverse striations; fibre shape and the polarized-light bands complete the description.", "type": "written", "keyhtml": "• Fibre: long cylindrical cell (myocyte), 1–40 mm long; polygonal in cross section; does not branch except in the tongue and face\n• Sarcolemma (cell membrane): distinct\n• Nuclei: multiple, oval and peripheral in position\n• Sarcoplasm (cytoplasm): acidophilic, showing clear transverse striation (alternating dark and light bands)\n• Under the polarized microscope: A band = anisotropic (dark); I band = isotropic (light)"}, "Q0255": {"id": "Q0255", "stem": "Enumerate the organelles seen in skeletal muscle fibers by the electron microscope, and give the function of the sarcoplasmic reticulum, mitochondria, myofibrils and ribosomes.", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "The E/M organelle list (well-developed SR, rows of mitochondria, numerous Golgi, few RER, myofibrils, few ribosomes) and the functions come from the lecture's sections on E/M, the SR, contraction and growth.", "type": "written", "keyhtml": "A. Membranous organelles\n• Well-developed sER called the sarcoplasmic reticulum (longitudinal network + terminal cisternae) — regulates contraction by releasing and taking back calcium (excitation–contraction coupling)\n• Rows of mitochondria in between the myofibrils — supply ATP for contraction\n• Numerous Golgi apparatus\n• Few RER\nB. Non-membranous organelles\n• Myofilaments (thick and thin) forming well-developed, parallel, longitudinally arranged myofibrils — actin–myosin interaction produces contraction\n• Few ribosomes — synthesis of new proteins (growth of the fibre in width)\nC. Inclusions: myoglobin (oxygen-binding) and glycogen (energy source for contraction)"}, "Q0256": {"id": "Q0256", "stem": "Define and describe the sarcomere.", "top": false, "rep": "asked 2 years", "tag": "Final bank HIS W2", "bank": true, "expl": "The sarcomere runs from Z line to Z line and is an A band plus half an I band on each side; the I band holds thin filaments only, while the Z line is the α-actinin line where thin filaments attach.", "type": "written", "keyhtml": "Definition: the sarcomere is the distance between 2 successive Z lines; it is the basic structural and functional unit of striated muscle. It consists of a dark A band in the middle plus half a light I band on either side.\n• A band (dark): thick filaments with thin filaments between them\n• H zone: paler region in the centre of the A band; thick filaments only (relaxed muscle)\n• M line: dark line in the middle of the H zone (middle of the sarcomere)\n• I band (light): thin filaments only; bisected by the Z line\n• Z line: darker transverse line containing α-actinin; thin filaments attach here\nThick filaments occupy the central portion; thin filaments attach to the Z line and run between the thick ones but do not reach the centre of the A band — hence the H zone."}, "Q0257": {"id": "Q0257", "stem": "Differentiate between red and white skeletal muscle fibers.", "top": false, "rep": "asked 2 years", "tag": "Final bank HIS W3", "bank": true, "expl": "Myoglobin concentration decides whether a fibre is red or white: red (type 1) fibres are small, myoglobin- and mitochondria-rich, oxidative, slow and fatigue-resistant, while white (type 2) fibres are larger, glycogen-rich, glycolytic, fast and easily fatigued.", "type": "written", "keyhtml": "Feature | Red fibres (type 1) | White fibres (type 2)\nDiameter | Small | Larger\nMyoglobin | Large amount | Less\nGlycogen | Few | More (pale)\nMitochondria | Many | Few\nOxidative phosphorylation enzymes | Rich | Poor\nEnergy source | Aerobic oxidative phosphorylation of fatty acids | Glycolysis\nContraction | Slow, continuous over time (long-distance running) | Fast (sprinting; fingers — playing music and computer games)\nFatigue | Not easily fatigued | Easily fatigued"}, "Q0258": {"id": "Q0258", "stem": "Describe the connective tissue coverings of a skeletal muscle and give their functions.", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Outside to in: epimysium (whole muscle, dense), perimysium (bundle, dense), endomysium (single fibre, loose); together they carry vessels and nerves and bind the bundles into one working unit.", "type": "written", "keyhtml": "1. Epimysium: dense C.T. surrounding the whole muscle\n2. Perimysium: dense C.T. surrounding each muscle bundle (fascicle)\n3. Endomysium: loose C.T. surrounding each individual muscle fibre\nFunctions:\n• Carry blood vessels, lymphatics and nerves to the muscle fibres\n• Firmly attach the muscle bundles together so they act as one unit"}, "Q0268": {"id": "Q0268", "stem": "A 7-year-old boy sustains a tear in his gastrocnemius muscle when he is involved in a bicycle accident.\n\nWill the tear in the skeletal muscle heal? If yes, how?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Satellite cells are the regenerative cells of skeletal muscle: after injury they are activated, divide and fuse to form new fibres.", "type": "written", "keyhtml": "Yes. Skeletal muscle regenerates by the activity of satellite cells, which lie on the myofibre under the basal lamina:\n• Activation of satellite cells after the injury\n• Proliferation — the satellite cells divide\n• Fusion (differentiation) to form new skeletal muscle fibres"}, "Q0269": {"id": "Q0269", "stem": "A 7-year-old boy sustains a tear in his gastrocnemius muscle when he is involved in a bicycle accident.\n\nIn cases of injury to cardiac muscle, will the cardiac muscle heal, and how?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Unlike skeletal muscle, cardiac muscle lacks satellite cells, so damaged fibres are replaced by a fibrous C.T. scar made by fibroblasts.", "type": "written", "keyhtml": "No, cardiac muscle cannot regenerate because it has no satellite cells. The injury is repaired by fibroblasts, which form fibrous connective tissue (a scar)."}, "Q0271": {"id": "Q0271", "stem": "A 30-year-old man begins a vigorous program of bodybuilding. After 6 months, his muscles have become prominent and strong.\n\nWhich physiologic change underlies the skeletal muscle enlargement in this man?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Hypertrophy means bigger fibres, not more fibres; growth in width comes from new proteins made by ribosomes.", "type": "written", "keyhtml": "Hypertrophy: strength training (contraction against resistance, e.g. weight lifting) increases muscle size without an increase in the number of fibres. Each fibre grows in width by synthesis of new proteins by ribosomes."}, "N-HIS-L1-01": {"id": "N-HIS-L1-01", "stem": "During a warm-up, a gymnast's hamstring muscles are stretched beyond their resting length without tearing. Which characteristic of muscular tissue does this demonstrate?", "top": false, "rep": "", "tag": "Final bank HIS Q17", "bank": true, "expl": "Extensibility is the ability of muscle to stretch beyond its resting length without tearing. Elasticity is the ability to recoil back to the original resting length after being stretched — the two are easily swapped.", "type": "mcq", "opts": ["Elasticity", "Excitability", "Extensibility", "Contractility", "Vascularity"], "ans": 2}, "N-HIS-L1-02": {"id": "N-HIS-L1-02", "stem": "While studying an electron micrograph of a skeletal muscle fibre, a student is asked to point to the sarcosomes. Which organelles should she point to?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In muscle terminology a sarcosome is a mitochondrion, while the sarcoplasmic reticulum is the sER. Smooth endoplasmic reticulum is the tempting distractor because of the shared 'sarco-' prefix.", "type": "mcq", "opts": ["Smooth endoplasmic reticulum", "Mitochondria", "Golgi apparatus", "Rough endoplasmic reticulum", "Free ribosomes"], "ans": 1}, "N-HIS-L1-03": {"id": "N-HIS-L1-03", "stem": "Which of the following muscles is skeletal muscle, yet is listed in the lecture among the involuntary sites?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The diaphragm and the upper third of the oesophagus are skeletal muscle but are listed as involuntary sites. The heart is involuntary but is cardiac, not skeletal, muscle; tongue, face and eye muscles are voluntary skeletal muscle.", "type": "mcq", "opts": ["Tongue muscles", "Diaphragm", "Heart", "Face muscles", "Eye muscles"], "ans": 1}, "N-HIS-L1-04": {"id": "N-HIS-L1-04", "stem": "A researcher compares the thin filaments of skeletal, cardiac and smooth muscle. Which thin-filament protein is present in skeletal and cardiac muscle but not in smooth muscle?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The thin filament has three proteins — actin, tropomyosin and troponin — and troponin is found in skeletal and cardiac muscle only. Tropomyosin, which lies in the grooves of actin, is the closest distractor; myosin forms the thick filament.", "type": "mcq", "opts": ["Actin", "Tropomyosin", "Troponin", "Myosin", "α-actinin"], "ans": 2}, "N-HIS-L1-05": {"id": "N-HIS-L1-05", "stem": "A young man develops progressive weakness that begins in his leg muscles and later spreads to the rest of his body, eventually involving his cardiac and respiratory muscles. A muscle biopsy shows disorganized myofibrils. Absence of which protein best explains these findings?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Desmin is the intermediate filament joining the Z disks of adjacent myofibrils; its absence disorganizes the myofibrils and causes desmin-related myopathy, which starts in the legs and can become fatal when cardiac and respiratory muscles are involved. Dystrophin, the tempting distractor, links actin to the sarcolemma, and its defect causes Duchenne muscular dystrophy.", "type": "mcq", "opts": ["Dystrophin", "Desmin", "α-actinin", "Troponin", "Myoglobin"], "ans": 1}, "N-HIS-L1-06": {"id": "N-HIS-L1-06", "stem": "Which structure conducts the impulse from the sarcolemma to the deeper parts of a skeletal muscle fibre?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The T tubule is a finger-like invagination of the sarcolemma at the A–I junction that conducts the impulse to the deeper parts of the muscle. The terminal cisternae belong to the SR, which releases and takes back calcium rather than conducting the impulse.", "type": "mcq", "opts": ["Terminal cisterna", "T tubule", "Longitudinal sarcoplasmic reticulum", "Z line", "Intercalated disc"], "ans": 1}, "N-HIS-L1-07": {"id": "N-HIS-L1-07", "stem": "An electron micrograph of cardiac muscle from an elderly man shows abundant mitochondria, glycogen granules at the poles of the nucleus, and a pigment. Which inclusion of cardiac muscle increases in amount with age?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Cardiac inclusions are glycogen granules (especially at either pole of the nucleus), myoglobin and lipochrome pigment, and it is the lipochrome that increases with age. Glycogen and myoglobin are present but are not described as increasing with age.", "type": "mcq", "opts": ["Glycogen granules", "Myoglobin", "Lipochrome pigment", "Fat droplets"], "ans": 2}, "N-HIS-L1-08": {"id": "N-HIS-L1-08", "stem": "A 4-month-old infant has feeding and breathing difficulties, muscle hypotonia, generalized muscle weakness and heart complications. A muscle biopsy shows accumulation of glycogen. Which of the following is the underlying cause?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is Pompe disease: lysosomal glucosidase deficiency causes glycogen accumulation with skeletal muscle and heart problems, hypotonia, and feeding and breathing difficulties in infants. Dystrophin and desmin defects cause muscle disease (DMD and DRM) without glycogen accumulation.", "type": "mcq", "opts": ["Deficiency of lysosomal glucosidase", "Defect in dystrophin", "Absence of desmin", "Absence of satellite cells", "Deficiency of myoglobin"], "ans": 0}, "N-HIS-L1-09": {"id": "N-HIS-L1-09", "stem": "The cells of the myocardium are bound so firmly that they do not pull apart under constant contraction. Which junction of the intercalated disc is mainly responsible for this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Desmosomes in the transverse portion of the intercalated disc bind cells together and prevent them pulling apart under constant contraction. Fasciae adherentes, also transverse, are anchoring sites for actin filaments, while gap junctions in the longitudinal portion give ionic continuity.", "type": "mcq", "opts": ["Large gap junctions", "Desmosomes (macula adherens)", "Fasciae adherentes", "T tubules"], "ans": 1}, "N-HIS-L1-10": {"id": "N-HIS-L1-10", "stem": "Compare skeletal and cardiac muscle as regards: (a) nuclei, (b) branching of fibres, (c) site of T tubules and their relation to the SR, (d) intercalated discs, and (e) regeneration.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "These five rows are the key differences in the lecture's skeletal-versus-cardiac master table.", "type": "written", "keyhtml": "Feature | Skeletal | Cardiac\nNuclei | Multiple, oval, peripheral | 1 or 2 (mono- or binucleated), oval, central\nBranching | No — except in the tongue and face | Branch and anastomose, forming a network\nT tubules &amp; SR | T tubules at the A–I junction; triad = 1 T tubule + 2 terminal cisternae; 2 triads per sarcomere; well-developed SR | Larger T tubules at the Z line; diad = 1 T tubule + 1 SR profile; poorly defined SR\nIntercalated discs | Absent | Present: fasciae adherentes and desmosomes (transverse portion), large gap junctions (longitudinal portion)\nRegeneration | Yes — by satellite cells | No — no satellite cells; repaired by a fibrous scar made by fibroblasts"}, "N-HIS-L1-11": {"id": "N-HIS-L1-11", "stem": "Describe the intercalated discs of cardiac muscle, giving the function of each component.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The transverse portion holds the cells together (fasciae adherentes and desmosomes), while the longitudinal gap junctions let ions pass so the heart contracts as a functional syncytium.", "type": "written", "keyhtml": "Definition: step-like junctions forming end-to-end attachments between adjacent cardiac muscle cells, with transverse and longitudinal portions.\na. Transverse portion:\n• Fasciae adherentes — anchoring sites for actin filaments\n• Desmosomes (macula adherens) — bind cells together and prevent them pulling apart under constant contraction\nb. Longitudinal portion:\n• Large gap junctions — ionic continuity between cells → coordinated contraction, so cardiac muscle behaves as a functional syncytium"}, "TP-045": {"id": "TP-045", "stem": "A 9-year-old boy presents with progressive weakness in his legs, difficulty climbing stairs and enlarged calf muscles. Muscle biopsy reveals absence of dystrophin protein. Which of the following is the most likely diagnosis?", "top": true, "rep": "", "tag": "Final bank HIS Q42", "bank": true, "expl": "Dystrophin binds actin to the sarcolemma and then to the extracellular matrix; its defect causes atrophy of muscle fibres — Duchenne muscular dystrophy. Desmin-related myopathy is due to absent desmin, Pompe disease to lysosomal glucosidase deficiency, and myasthenia gravis is a disease of the neuromuscular junction.", "type": "mcq", "opts": ["Becker muscular dystrophy", "Duchenne muscular dystrophy", "Myasthenia gravis", "Desmin-related myopathy", "Pompe disease"], "ans": 1}, "TP-046": {"id": "TP-046", "stem": "A biopsy from a long-distance runner shows muscle fibers that are small in size, contain abundant mitochondria and myoglobin, and resist fatigue. What is the type of these muscle fibers?", "top": true, "rep": "", "tag": "Final bank HIS Q43", "bank": true, "expl": "Red (type 1) fibres have a small diameter, a large amount of myoglobin, many mitochondria and rich oxidative enzymes, and contract slowly and continuously without fatiguing easily — the fibres of long-distance running. White (type 2) fibres are larger, rich in glycogen, use glycolysis and fatigue easily (sprinting).", "type": "mcq", "opts": ["Cardiac fibers", "Type I (Red fibers)", "Intermediate fibers", "Type II (White fibers)", "Smooth fibers"], "ans": 1}, "TP-008": {"id": "TP-008", "stem": "During a small group seminar, you are asked to discuss the histology of cardiac muscle. Define the intercalated disc.", "top": true, "rep": "", "tag": "Final bank HIS W10", "bank": true, "expl": "The intercalated disc is the step-like end-to-end junction unique to cardiac muscle. Its transverse part holds the cells together (fasciae adherentes, desmosomes) and its longitudinal gap junctions let ions pass, so the muscle acts as a functional syncytium.", "type": "written", "keyhtml": "Intercalated disc: a step-like junction forming end-to-end attachments between adjacent cardiac muscle cells (joining the short columnar cells into long fibres). It has two portions:\n• Transverse portion: fasciae adherentes (anchoring sites for actin filaments) + desmosomes / macula adherens (bind the cells together and prevent them pulling apart under constant contraction)\n• Longitudinal portion: large gap junctions (ionic continuity → coordinated contraction → functional syncytium)"}, "TP-009": {"id": "TP-009", "stem": "What is the diad (dyad), and at which level is it located?", "top": true, "rep": "", "tag": "Final bank HIS W11", "bank": true, "expl": "In cardiac muscle the SR is poorly defined, so each T tubule meets only one SR profile, forming a diad at the Z line. Skeletal muscle instead has triads (1 T tubule + 2 terminal cisternae) at the A–I junction.", "type": "written", "keyhtml": "Diad (cardiac muscle) = 1 T tubule + 1 profile (expansion) of the poorly defined sarcoplasmic reticulum.\n• Located at the level of the Z line (Z disc) — not at the A–I junction, where the skeletal-muscle triad lies\n• Cardiac T tubules are larger than those of skeletal muscle"}, "TP-029": {"id": "TP-029", "stem": "A 25-year-old athlete complains of sudden muscle weakness during training. His laboratory tests are normal, but electromyography reveals a delay in the spread of depolarization from the muscle cell membrane into the interior of the muscle fiber, indicating a structural defect in the tubular system of the skeletal muscle fiber. Describe the tubular system of skeletal muscle, mentioning the function of each tubule.", "top": true, "rep": "", "tag": "Final bank HIS W12", "bank": true, "expl": "The T tubule brings the signal in from the sarcolemma, and the SR releases and takes back Ca²⁺; their meeting point, the triad at each A–I junction, couples excitation to contraction. A defect in the T tubules therefore delays the spread of depolarization into the fibre.", "type": "written", "keyhtml": "1. T (transverse) tubules: finger-like invaginations of the sarcolemma that surround each myofibril, sent into the sarcoplasm at the A–I junction.\n• Function: conduct the impulse (depolarization) from the sarcolemma to the deeper parts of the muscle fibre — the step delayed in this patient.\n2. Sarcoplasmic reticulum (SR): well-developed smooth ER forming a longitudinal network around the myofibrils, with transverse parts called terminal cisternae.\n• Function: regulates contraction by releasing Ca²⁺ and taking it back (re-uptake).\n3. Triad: each T tubule lies between 2 terminal cisternae; 2 triads per sarcomere, at the A–I junctions. Together the T tubule and SR give excitation–contraction coupling."}, "TP-047": {"id": "TP-047", "stem": "A histological section of skeletal muscle shows a triad structure at the A–I junction. Which of the following components form this triad?", "top": true, "rep": "", "tag": "Final bank HIS Q44", "bank": true, "expl": "A triad is one T tubule lying between two terminal cisternae of the sarcoplasmic reticulum, with two triads per sarcomere at the A–I junctions. Two T tubules around one cisterna is the reversed arrangement, and caveolae replace T tubules in smooth muscle rather than forming triads.", "type": "mcq", "opts": ["Two T-tubules and one terminal cisterna", "One T-tubule and two terminal cisternae", "Three terminal cisternae", "Two T-tubules only", "One T-tubule and two caveolae"], "ans": 1}, "TP-087": {"id": "TP-087", "stem": "A histological section of cardiac muscle shows a diad structure.\na) What are the components of this diad?\nb) At which level is it located?", "top": true, "rep": "", "tag": "Final bank HIS W13", "bank": true, "expl": "Because cardiac SR is poorly defined, each T tubule pairs with a single SR profile, giving a diad at the Z line. The skeletal-muscle triad (1 T tubule + 2 terminal cisternae) sits at the A–I junction.", "type": "written", "keyhtml": "a) 1 T tubule + 1 profile (expansion) of the sarcoplasmic reticulum (the cardiac SR is poorly defined; cardiac T tubules are larger than skeletal ones).\nb) At the level of the Z line (Z disc) — not at the A–I junction as in the skeletal-muscle triad."}, "TP-108": {"id": "TP-108", "stem": "A 30-year-old man suffered a deep laceration in his thigh muscle. The biopsy shows separated bundles of muscle fibers surrounded by connective tissue layers containing blood vessels. A few weeks later, partial regeneration of the muscle was noticed.\na) Name the connective tissue components surrounding skeletal muscle.\nb) Name the cells responsible for regeneration of skeletal muscle.", "top": true, "rep": "", "tag": "Final bank HIS W14", "bank": true, "expl": "Skeletal muscle is wrapped by epimysium (whole muscle), perimysium (each bundle) and endomysium (each fibre); only the endomysium is loose C.T. It regenerates through satellite cells, unlike cardiac muscle, which has none and heals by a fibrous scar.", "type": "written", "keyhtml": "a) Connective tissue coverings (outside → in):\n• Epimysium — dense C.T. around the whole muscle\n• Perimysium — dense C.T. around each muscle bundle (fascicle)\n• Endomysium — loose C.T. around each individual muscle fibre\nThey carry blood vessels, lymphatics and nerves to the fibres and bind the bundles together to act as one unit.\nb) Satellite cells — stem cells lying on the muscle fibre under the basal lamina: after injury they are activated → proliferate (divide) → fuse to form new skeletal muscle fibres."}}, "labs": {}, "cards": [{"id": "HIS-L1-001", "text": "Muscular tissue: a basic tissue whose cells are {{c1::elongated}} and whose cytoplasm shows contractile elements called {{c2::myofibrils}}", "extra": "", "sec": "Part 01 · 1.1 Definition & characteristics"}, {"id": "HIS-L1-002", "text": "Muscle tissue — 4 of its 7 characteristics: {{c1::excitability}} · {{c2::contractility}} · {{c3::extensibility}} · {{c4::elasticity}}", "extra": "Mnemonic: Excited → Contracts → Extended → Elastic recoil.", "sec": "Part 01 · 1.1 Definition & characteristics"}, {"id": "HIS-L1-003", "text": "Excitability = ability to {{c1::respond to a stimulus (e.g. a nerve signal) that triggers contraction}}; contractility = ability to {{c2::shorten forcefully}}", "extra": "", "sec": "Part 01 · 1.1 Definition & characteristics"}, {"id": "HIS-L1-004", "text": "Extensibility = ability to {{c1::stretch beyond resting length without tearing}}; elasticity = ability to {{c2::recoil to the original resting length after being stretched}}", "extra": "Exam trap: don't swap them.", "sec": "Part 01 · 1.1 Definition & characteristics"}, {"id": "HIS-L1-005", "text": "Muscle tissue — the other 3 of its 7 characteristics: {{c1::highly cellular}} (myocytes) · {{c2::vascular}} (abundant blood vessels) · {{c3::control}} (voluntary or involuntary)", "extra": "", "sec": "Part 01 · 1.1 Definition & characteristics"}, {"id": "HIS-L1-006", "text": "Muscle types — striated: {{c1::skeletal & cardiac}} · involuntary: {{c2::cardiac & smooth}} → the striated but involuntary type: {{c3::cardiac}}", "extra": "Smooth muscle is the only non-striated type.", "sec": "Part 01 · 1.2 Classification — structure & function"}, {"id": "HIS-L1-007", "text": "Sarco- terms: sarcolemma = {{c1::cell membrane}} · sarcoplasm = {{c2::cytoplasm}} · sarcoplasmic reticulum = {{c3::sER}} · sarcosome = {{c4::mitochondrion}}", "extra": "Myocyte = muscle fibre.", "sec": "Part 01 · 1.3 Terms you will meet"}, {"id": "HIS-L1-008", "text": "Skeletal muscle (voluntary movement) sites: muscles attached to the {{c1::skeleton}} · head: {{c2::face, eye & tongue}} muscles", "extra": "", "sec": "Part 02 · 2.1 Sites"}, {"id": "HIS-L1-009", "text": "Skeletal muscle sites listed as involuntary: the {{c1::diaphragm}} & the {{c2::upper third of the oesophagus}}", "extra": "Exam trap: skeletal muscle, yet involuntary.", "sec": "Part 02 · 2.1 Sites"}, {"id": "HIS-L1-010", "text": "Skeletal muscle C.T. coverings: whole muscle → {{c1::epimysium}} · each bundle (fascicle) → {{c2::perimysium}} · each muscle fibre → {{c3::endomysium}}", "extra": "Outside → in: Epi › Peri › Endo.", "sec": "Part 02 · 2.2 Connective tissue coverings"}, {"id": "HIS-L1-011", "text": "The only loose C.T. covering of skeletal muscle: the {{c1::endomysium}} — epimysium & perimysium are {{c2::dense}} C.T.", "extra": "", "sec": "Part 02 · 2.2 Connective tissue coverings"}, {"id": "HIS-L1-012", "text": "Functions of the muscle C.T. coverings: carry {{c1::blood vessels, lymphatics & nerves}} to the fibres · {{c2::firmly attach the bundles together to act as one unit}}", "extra": "", "sec": "Part 02 · 2.2 Connective tissue coverings"}, {"id": "HIS-L1-013", "text": "Skeletal muscle fibre: long {{c1::cylindrical}} cell, {{c2::1–40 mm}} long; {{c3::polygonal}} in cross section", "extra": "", "sec": "Part 02 · 2.3 The skeletal muscle fibre — shape & size"}, {"id": "HIS-L1-014", "text": "Skeletal muscle fibres do not branch — except in the {{c1::tongue & face}}", "extra": "Striations + multiple peripheral nuclei + branching → face / tongue muscle.", "sec": "Part 02 · 2.3 The skeletal muscle fibre — shape & size"}, {"id": "HIS-L1-015", "text": "Skeletal muscle L/M: sarcolemma distinct · nuclei {{c1::multiple, oval & peripheral}} · sarcoplasm {{c2::acidophilic}} with clear {{c3::transverse striation}}", "extra": "", "sec": "Part 02 · 2.4 Light & polarized microscopy"}, {"id": "HIS-L1-016", "text": "Polarized microscope: A band = {{c1::anisotropic}} (dark) · I band = {{c2::isotropic}} (light)", "extra": "dArk = Anisotropic · lIght = Isotropic.", "sec": "Part 02 · 2.4 Light & polarized microscopy"}, {"id": "HIS-L1-017", "text": "Skeletal muscle E/M — membranous organelles: well-developed SER (= {{c1::sarcoplasmic reticulum}}) · {{c2::rows of mitochondria}} between myofibrils · {{c3::numerous}} Golgi · {{c4::few}} RER", "extra": "", "sec": "Part 03 · 3.1 Electron microscopy"}, {"id": "HIS-L1-018", "text": "Skeletal muscle E/M — non-membranous: {{c1::myofilaments (thick & thin)}} in parallel, longitudinal myofibrils · {{c2::few}} ribosomes; inclusions: {{c3::myoglobin & glycogen}}", "extra": "", "sec": "Part 03 · 3.1 Electron microscopy"}, {"id": "HIS-L1-019", "text": "Myofibrils lie {{c1::parallel to the long axis}} of the muscle fibre; each myofibril is a series of {{c2::sarcomeres}}", "extra": "", "sec": "Part 03 · 3.2 Myofibrils"}, {"id": "HIS-L1-020", "text": "Transverse striations of skeletal muscle = {{c1::alternating dark & light bands}} on each myofibril", "extra": "", "sec": "Part 03 · 3.2 Myofibrils"}, {"id": "HIS-L1-021", "text": "Sarcomere = distance between {{c1::2 successive Z lines}}; the basic {{c2::structural & functional}} unit of striated muscle", "extra": "", "sec": "Part 03 · 3.3 The sarcomere"}, {"id": "HIS-L1-022", "text": "Sarcomere = a dark {{c1::A band}} in the middle + {{c2::half a light I band}} on either side", "extra": "", "sec": "Part 03 · 3.3 The sarcomere"}, {"id": "HIS-L1-023", "text": "Filaments by region — I band: {{c1::thin only}} · H zone: {{c2::thick only}} · A band: {{c3::thick + thin}}", "extra": "I = thIn only · H = Heavy (thick) only · A = All. So thick & thin do not overlap in the I band.", "sec": "Part 03 · 3.3 The sarcomere"}, {"id": "HIS-L1-024", "text": "Molecular structure — A band: {{c1::both actin & myosin}}; I band: {{c2::actin only}}", "extra": "", "sec": "Part 03 · 3.4 I band vs A band"}, {"id": "HIS-L1-025", "text": "H zone: paler region in the centre of the {{c1::A band}}, seen in {{c2::relaxed}} muscle; the {{c3::M line}} is the dark line in its middle", "extra": "", "sec": "Part 03 · 3.3 The sarcomere"}, {"id": "HIS-L1-026", "text": "Z line: darker transverse line containing {{c1::α-actinin}}; the {{c2::thin}} filaments attach here; it bisects the {{c3::I band}}", "extra": "", "sec": "Part 03 · 3.3 The sarcomere"}, {"id": "HIS-L1-027", "text": "The H zone exists because thin filaments attach to the Z line and run between the thick ones but {{c1::do not reach the centre of the A band}}", "extra": "", "sec": "Part 03 · 3.3 The sarcomere"}, {"id": "HIS-L1-028", "text": "E/M — I band: electron {{c1::lucent}} with a central dark {{c2::Z line}}; A band: electron {{c3::dense}} with a light {{c4::H zone}} in the middle", "extra": "", "sec": "Part 03 · 3.4 I band vs A band"}, {"id": "HIS-L1-029", "text": "Thin filament proteins: {{c1::actin}} · {{c2::tropomyosin}} · {{c3::troponin}}", "extra": "", "sec": "Part 03 · 3.5 Thin & thick filaments"}, {"id": "HIS-L1-030", "text": "F-actin = {{c1::2}} strands of globular {{c2::G-actin}} twisted in a {{c3::double helix}}", "extra": "", "sec": "Part 03 · 3.5 Thin & thick filaments"}, {"id": "HIS-L1-031", "text": "Tropomyosin: filaments lying in the {{c1::grooves of actin}}; troponin: attached to {{c2::tropomyosin}} at regular intervals", "extra": "", "sec": "Part 03 · 3.5 Thin & thick filaments"}, {"id": "HIS-L1-032", "text": "Troponin is found in {{c1::skeletal & cardiac}} muscle only — not in {{c2::smooth}} muscle", "extra": "Smooth muscle uses calmodulin instead.", "sec": "Part 03 · 3.5 Thin & thick filaments"}, {"id": "HIS-L1-033", "text": "Thick filament = {{c1::myosin}}: a tail + two heads carrying {{c2::ATPase activity}} & {{c3::actin-binding}} sites", "extra": "", "sec": "Part 03 · 3.5 Thin & thick filaments"}, {"id": "HIS-L1-034", "text": "Desmin: {{c1::intermediate filament}} that joins the {{c2::Z disks}} of adjacent myofibrils", "extra": "", "sec": "Part 03 · 3.6 The anchors — desmin & dystrophin"}, {"id": "HIS-L1-035", "text": "Absence of desmin → {{c1::desmin-related myopathy (DRM)}}: {{c2::disorganized myofibrils}} & atrophy of fibres", "extra": "", "sec": "Part 03 · 3.6 The anchors — desmin & dystrophin"}, {"id": "HIS-L1-036", "text": "DRM: progressive weakness beginning in the {{c1::leg muscles}}, then the rest of the body; can affect {{c2::cardiac & respiratory}} muscles → fatal", "extra": "", "sec": "Part 03 · 3.6 The anchors — desmin & dystrophin"}, {"id": "HIS-L1-037", "text": "Dystrophin binds {{c1::actin}} with the {{c2::sarcolemma}} of skeletal fibres, then to the {{c3::extracellular matrix}}", "extra": "So its loss detaches the I bands (actin only) from the cell membrane.", "sec": "Part 03 · 3.6 The anchors — desmin & dystrophin"}, {"id": "HIS-L1-038", "text": "Defect in {{c1::dystrophin}} → atrophy of muscle fibres = {{c2::Duchenne muscular dystrophy (DMD)}}", "extra": "Desmin → DRM · Dystrophin → DMD.", "sec": "Part 03 · 3.6 The anchors — desmin & dystrophin"}, {"id": "HIS-L1-039", "text": "T tubule: a finger-like invagination of the {{c1::sarcolemma}} that surrounds each {{c2::myofibril}}", "extra": "", "sec": "Part 04 · 4.1 The transverse tubular system"}, {"id": "HIS-L1-040", "text": "Skeletal T tubule: sent into the sarcoplasm at the {{c1::A–I junction}}; conducts the {{c2::impulse from the sarcolemma to the deeper parts}} of the muscle", "extra": "", "sec": "Part 04 · 4.1 The transverse tubular system"}, {"id": "HIS-L1-041", "text": "Sarcoplasmic reticulum = {{c1::SER}}: a {{c2::longitudinal network}} + transverse parts called {{c3::terminal cisternae}}", "extra": "", "sec": "Part 04 · 4.2 Sarcoplasmic reticulum & the triad"}, {"id": "HIS-L1-042", "text": "Triad = 1 {{c1::T tubule}} lying between 2 {{c2::terminal cisternae}} of the SR", "extra": "TRI-ad = 3 structures.", "sec": "Part 04 · 4.2 Sarcoplasmic reticulum & the triad"}, {"id": "HIS-L1-043", "text": "Skeletal muscle: {{c1::2}} triads per sarcomere, at the {{c2::A–I junctions}}", "extra": "One at each A–I junction.", "sec": "Part 04 · 4.2 Sarcoplasmic reticulum & the triad"}, {"id": "HIS-L1-044", "text": "SR function: regulates contraction by {{c1::release & re-uptake of Ca²⁺}}; with the T tubule it gives {{c2::excitation–contraction coupling}}", "extra": "", "sec": "Part 04 · 4.2 Sarcoplasmic reticulum & the triad"}, {"id": "HIS-L1-045", "text": "Skeletal SR (terminal cisternae) = the cell's {{c1::Ca²⁺ store}}: releases Ca²⁺ on {{c2::depolarisation}}, takes it back on {{c3::relaxation}}", "extra": "The triad's lateral parts = sites of Ca²⁺ sequestration & release.", "sec": "Part 04 · 4.2 Sarcoplasmic reticulum & the triad"}, {"id": "HIS-L1-046", "text": "In the triad, the {{c1::T tubule}} conducts the impulse inward; the {{c2::terminal cisternae (SR)}} release & take back Ca²⁺", "extra": "", "sec": "Part 04 · 4.2 Sarcoplasmic reticulum & the triad"}, {"id": "HIS-L1-047", "text": "Contraction: impulse → depolarization along the sarcolemma into the {{c1::T tubules}} → Ca²⁺ from the {{c2::sER}} + ATP from {{c3::mitochondria}} → actin–myosin interaction pulls the 2 {{c4::Z lines}} inward", "extra": "", "sec": "Part 04 · 4.3 Contraction of the muscle"}, {"id": "HIS-L1-048", "text": "During contraction: H zone {{c1::disappears}} · I band {{c2::decreases}} · A band {{c3::remains the same}}", "extra": "H & I say bye; A stays Always.", "sec": "Part 04 · 4.3 Contraction of the muscle"}, {"id": "HIS-L1-049", "text": "The H zone disappears in contraction because it now contains {{c1::both actin & myosin}}", "extra": "", "sec": "Part 04 · 4.3 Contraction of the muscle"}, {"id": "HIS-L1-050", "text": "In contraction the sarcomere & myofibril {{c1::shorten}} — the distance between the {{c2::Z lines}} shortens (filament sliding)", "extra": "", "sec": "Part 04 · 4.3 Contraction of the muscle"}, {"id": "HIS-L1-051", "text": "Rest: I band 1.0 µm, A band 1.5 µm; the sarcomere shortens 10% → A band after contraction = {{c1::1.5 µm}}", "extra": "The A band never changes length; only H & I shrink.", "sec": "Part 04 · 4.3 Contraction of the muscle (GD key)"}, {"id": "HIS-L1-052", "text": "Inclusions {{c1::glycogen & fat droplets}} = source of energy for muscle contraction", "extra": "", "sec": "Part 05 · 5.1 Inclusions"}, {"id": "HIS-L1-053", "text": "Myoglobin: {{c1::oxygen}}-binding protein, functionally & chemically related to {{c2::Hb}}; {{c3::red to brown}} in colour", "extra": "", "sec": "Part 05 · 5.1 Inclusions"}, {"id": "HIS-L1-054", "text": "A skeletal fibre is red or white according to its {{c1::myoglobin}} concentration", "extra": "", "sec": "Part 05 · 5.1 Inclusions"}, {"id": "HIS-L1-055", "text": "Red fibres = type {{c1::1}}; white fibres = type {{c2::2}}", "extra": "One Slow Red Ox — type 1 = slow, red, oxidative.", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-056", "text": "Diameter — red fibres: {{c1::small}}; white fibres: {{c2::larger}}", "extra": "", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-057", "text": "Mitochondria & oxidative phosphorylation enzymes — red fibres: {{c1::many / rich}}; white fibres: {{c2::few / poor}}", "extra": "", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-058", "text": "Myoglobin — red: {{c1::large amount}}; white: {{c2::less}} · Glycogen — red: {{c3::few}}; white: {{c4::more (pale)}}", "extra": "", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-059", "text": "Energy source — red fibres: {{c1::aerobic oxidative phosphorylation of fatty acids}}; white fibres: {{c2::glycolysis}}", "extra": "", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-060", "text": "Contraction & fatigue — red: {{c1::slow, continuous}}, {{c2::not easily}} fatigued; white: {{c3::fast}}, {{c4::easily}} fatigued", "extra": "", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-061", "text": "Typical use — red fibres: {{c1::long-distance running}}; white fibres: {{c2::sprinting; fingers (playing music, computer games)}}", "extra": "", "sec": "Part 05 · 5.2 Types of skeletal muscle fibres"}, {"id": "HIS-L1-062", "text": "Cross striations + peripheral ibres", "extra": "Hypertrophy = bigger fibres, not more fibres.", "sec": "Part 05 · 5.4 Effect of exercise"}, {"id": "HIS-L1-071", "text": "Anabolic steroids: ↑ muscle mass; serious side effect: {{c1::liver cancer}}; detectable in body fluids for {{c2::6 months}} after the last dose", "extra": "", "sec": "Part 05 · 5.4 Effect of exercise"}, {"id": "HIS-L1-072", "text": "Cardiac muscle fibres contract {{c1::spontaneously}} and display a {{c2::rhythmic}} beat", "extra": "", "sec": "Part 06 · 6.1 General features & shape"}, {"id": "HIS-L1-073", "text": "Cardiac fibres: individual {{c1::short columnar}} cells joined end-to-end by {{c2::intercalated discs}} into long fibres", "extra": "", "sec": "Part 06 · 6.1 General features & shape"}, {"id": "HIS-L1-074", "text": "Cardiac fibres {{c1::branch & anastomose}} into a network; their diameter is {{c2::intermediate between skeletal & smooth}} muscle", "extra": "", "sec": "Part 06 · 6.1 General features & shape"}, {"id": "HIS-L1-075", "text": "Cardiac nuclei: {{c1::mono- or binucleated}}, oval & {{c2::central}}", "extra": "Can be binucleated — still central.", "sec": "Part 06 · 6.2 Light microscopy"}, {"id": "HIS-L1-076", "text": "Cardiac L/M: acidophilic cytoplasm with {{c1::less distinct}} striation than skeletal; filaments in {{c2::poorly defined}} myofibrils", "extra": "", "sec": "Part 06 · 6.2 Light microscopy"}, {"id": "HIS-L1-077", "text": "Cardiac E/M: mitochondria {{c1::more abundant}} than in skeletal muscle; SR {{c2::poorly defined}}", "extra": "", "sec": "Part 06 · 6.3 Electron microscopy"}, {"id": "HIS-L1-078", "text": "Cardiac diad = 1 {{c1::T tubule}} + 1 {{c2::profile (expansion) of SR}}, at the level of the {{c3::Z line}}", "extra": "", "sec": "Part 06 · 6.3 Electron microscopy"}, {"id": "HIS-L1-079", "text": "Cardiac T tubules are {{c1::larger}} than skeletal ones and meet the SR at the {{c2::Z discs}}, not at the A–I junctions", "extra": "", "sec": "Part 06 · 6.3 Electron microscopy"}, {"id": "HIS-L1-080", /* ---------- page rendering ---------- */

}

/* ---------- block renderers ---------- */
H.part = b => `<div class="part"><span class="pn">${esc(b.no)}</span><div><small>Part ${esc(b.no)}</small><h2>${esc(b.title)}</h2>${b.sub ? `<p>${esc(b.sub)}</p>` : ''}</div><span class="big">${esc(b.no)}</span></div>`;
H.h = b => `<h3 class="sh"><span class="num">${esc(b.no)}</span><span>${esc(b.title)}</span>${b.top || b.rep ? `<span class="sht">${b.top ? '<span class="tg top">★ Top priority</span>' : ''}${b.rep ? '<span class="tg">↻ High yield</span>' : ''}</span>` : ''}</h3>`;
H.hook = b => `<p class="hook">${b.html}</p>`;
H.p = b => `<p class="tx">${b.html}</p>`;
H.list = b => `<ul class="ls">${b.items.map(x => `<li>${x}</li>`).join('')}</ul>`;
const NL = {hy: 'High yield', trap: 'Exam trap', mn: 'Mnemonic', cl: 'Clinical', def: 'Definition', nb: 'N.B.'};
H.note = b => `<aside class="note n-${b.kind}"><span class="nl">${esc(b.title || NL[b.kind])}</span>${b.html}</aside>`;
H.flow = b => `<div class="flow">${b.steps.map(s => `<span>${s}</span>`).join('<i>→</i>')}</div>`;
const TB = {};
H.table = (b, pg, k) => {
  const id = pg.id + '-' + k; const st = TB[id] || (TB[id] = {cv: false, rev: {}});
  const rows = b.rows.map((r, ri) => `<tr>${r.map((c, ci) => { const cov = st.cv && ci > 0 && !st.rev[ri + ':' + ci]; return `<td${cov ? ` class="cv" data-act="rev" data-t="${id}" data-c="${ri}:${ci}"` : ''}>${cov ? '<span>' + c + '</span>' : c}</td>`; }).join('')}</tr>`).join('');
  return `<div class="tbl"><div class="tbl-h"><span>${esc(b.cap || '')}</span>${b.cover !== false ? `<button class="mini ${st.cv ? 'on' : ''}" data-act="cover" data-t="${id}">${st.cv ? 'Show answers' : 'Cover answers'}</button>` : ''}</div><div class="tw"><table><thead><tr>${b.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
};
function qimg(q, ans){
  const L = ans ? q.aimg : q.img; if (!L || !L.length) return '';
  const cap = ans ? q.acap : q.cap;
  return L.map((u, i) => `<figure class="qf"><img src="${esc(u)}" alt="${esc(cap || 'Figure for this question')}" loading="lazy">${i === L.length - 1 && cap ? `<figcaption>${esc(cap)}</figcaption>` : ''}</figure>`).join('');
}
function qtags(q){
  const t = [];
  if (q.top) t.push('<span class="tg top">★ Top priority</span>');
  if (q.rep) t.push(`<span class="tg">↻ ${esc(q.rep)}</span>`);
  t.push(`<span class="tg">${esc(q.tag)}</span>`);
  return t.join('');
}
function opts(q, st, act){
  return q.opts.map((o, i) => {
    let c = '';
    if (st && st.show){ if (i === q.ans) c = 'ok'; else if (i === st.pick) c = 'bad'; }
    else if (st && st.pick === i) c = 'pick';
    return `<button class="op ${c}" data-act="${act}" data-q="${q.id}" data-i="${i}" ${st && st.show ? 'disabled' : ''}><span class="lt">${'ABCDEFGH'[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
}
H.check = b => {
  const q = QS[b.q]; if (!q) return ''; const a = S.ans[q.id];
  const st = a ? {pick: a.pick, show: true} : null;
  const res = a ? `<div class="res ${a.ok ? 'ok' : 'bad'}">${a.ok ? '✓ Correct' : '✗ Not quite — the answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div>${qimg(q, 1)}<div class="row"><button class="btn" data-act="retry" data-q="${q.id}">Try again</button></div>` : '';
  return `<div class="qb"><div class="qh">Check question ${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'ans')}${res}</div>`;
};
H.predict = b => {
  const q = QS[b.q]; if (!q) return ''; const p = S.pred[q.id] || {};
  const st = p.lift ? {pick: p.pick, show: true} : (p.pick !== undefined ? {pick: p.pick} : null);
  let tail = '';
  if (p.pick !== undefined && !p.lift) tail = `<div class="row"><button class="btn lift" data-act="lift" data-q="${q.id}">Lift the flap ↑</button><span class="muted" style="font-size:.8em">You predicted ${'ABCDEFGH'[p.pick]}</span></div>`;
  else if (p.lift) tail = `<div class="res ${p.pick === q.ans ? 'ok' : 'bad'}">${p.pick === q.ans ? '✓ Your prediction was right' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div>`;
  else tail = `<div class="flapc"><span class="muted" style="font-size:.82em">Pick your prediction, then lift the flap</span></div>`;
  return `<div class="qb"><div class="qh">Predict, then reveal ${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'pred')}${tail}</div>`;
};
H.flap = b => {
  const q = QS[b.q]; if (!q) return ''; const lifted = S.flap[q.id]; const self = S.self[q.id];
  const dr = `<textarea class="dr" data-act="draft" data-q="${q.id}" placeholder="Write your answer first (optional)…">${esc(S.draft[q.id] || '')}</textarea>`;
  const body = lifted
    ? `<div class="ans">${q.keyhtml}</div>${qimg(q, 1)}${q.expl ? `<div class="ex">${q.expl}</div>` : ''}<div class="row"><span class="muted" style="font-size:.78em">How did you do?</span><button class="btn ${self === 'got' ? 'pri' : ''}" data-act="self" data-q="${q.id}" data-v="got">Got it</button><button class="btn ${self === 'later' ? 'pri' : ''}" data-act="self" data-q="${q.id}" data-v="later">Review later</button></div>`
    : `${dr}<div class="flapc"><button class="btn lift" data-act="flap" data-q="${q.id}">Lift the flap ↑</button></div>`;
  return `<div class="qb"><div class="qh">Written question ${qtags(q)}</div><div class="qs" style="white-space:pre-line">${esc(q.stem)}</div>${qimg(q)}${body}</div>`;
};
H.title = b => `<div class="title-page"><div class="kick">${esc(b.kick)}</div><h1 class="ttl">${esc(b.title)}</h1><div class="sub">${esc(b.sub)}</div>
  <div class="facts">${b.facts.map(f => `<div><b>${esc(f[0])}</b><span>${esc(f[1])}</span></div>`).join('')}</div>
  ${b.hook ? `<p class="hook">${b.hook}</p>` : ''}${b.note ? `<aside class="note n-hy"><span class="nl">${esc(b.note[0])}</span>${b.note[1]}</aside>` : ''}</div>`;
H.contents = () => {
  const items = BOOK.pages.map((p, i) => [p, i]).filter(([p]) => p.toc);
  return `<h3 class="sh" style="margin-top:0"><span class="num">≡</span><span>Contents</span></h3>
  <ul class="map">${items.map(([p, i]) => `<li><button data-act="jump" data-p="${i}"><span class="mn">${esc(p.toc[0])}</span><span class="mt">${esc(p.toc[1])}</span><span class="mp">p. ${i}</span></button></li>`).join('')}</ul>
  <div class="legend"><i style="background:var(--sticky)"></i><span>Sticky notes = high-yield facts</span><i style="background:var(--trap-bg);border-left:3px solid var(--red)"></i><span>Exam traps</span>
  <i style="background:var(--chip);border:1px solid var(--line)"></i><span>Check questions answer instantly</span><i style="background:var(--red)"></i><span>LAB pages: interactive drills</span></div>
  <p class="tx" style="font-size:.86em">Turn pages with the arrows, the ← → keys, or a swipe. Tap the ribbon to bookmark a page. Every fact comes from this year's Helpers pamphlet; every question is from the checked question bank.</p>`;
};
H.actions = () => `<div class="row" style="gap:.6em;margin:.8em 0"><button class="btn pri" data-act="open-exam">Start exam mode</button><button class="btn" data-act="open-cards">Flashcards (${BOOK.cards.length})</button><button class="btn" data-act="open-mist">My mistakes</button></div>`;
H.progress = () => {
  const st = stats(); const labs = Object.keys(LABS); const ld = labs.filter(l => S.labs[l] && S.labs[l].done).length;
  const ex = S.exams.length ? S.exams[S.exams.length - 1] : null;
  const third = labs.length ? `<div><b>${ld}/${labs.length}</b><span>labs done</span></div>` : `<div><b>${st.learned}/${BOOK.cards.length}</b><span>cards learned</span></div>`;
  return `<div class="facts"><div><b>${st.nr}/${N}</b><span>pages read</span></div><div><b>${st.ok}/${st.n}</b><span>questions right</span></div>${third}</div>
  <p class="tx" style="font-size:.86em">${ex ? `Last exam: <b>${ex.score}/${ex.n}</b> in ${Math.round(ex.secs / 60)} min.` : 'No exam taken yet.'} ${Object.keys(S.mist).length ? `You have <b>${Object.keys(S.mist).length}</b> questions in your mistakes list.` : ''}</p>`;
};
H.lab = (b, pg) => { const L = LABS[b.lab]; return L ? labHTML(L, pg) : ''; };
H.recall = b => {
  const st = S.labs[b.id] || {}, rv = st.r || {}; let n = 0, k = 0;
  const body = b.groups.map(g => `<div class="rcg">${esc(g.title)}</div>` + g.items.map(it => { const i = n++, on = !!rv[i]; if (on) k++;
    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');
  return `<div class="labh"><span class="lb">LAB</span><h3>${esc(b.title)}</h3></div>
    <p class="labi">Say the rest of each line out loud, then tap it to check. Tap again to cover it. <b>${k}/${n}</b> uncovered.</p>
    <div class="modes"><button class="mini" data-act="rcall" data-l="${b.id}" data-n="${n}">Uncover all</button><button class="mini" data-act="rcno" data-l="${b.id}">Cover all</button></div>${body}`;
};
H.end = () => {
  const nx = BOOK.next, pv = BOOK.prev;
  return `<div class="endnav">${nx ? `<a href="${esc(nx.href)}"><span><small>Next lecture</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>Previous lecture</small>${esc(pv.title)}</span><span>←</span></a>` : ''}
    ${BOOK.lib ? `<a href="${esc(BOOK.lib)}"><span><small>The MSK book</small>All subjects and lectures</span><span>≡</span></a>` : ''}</div>`;
};

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
const LAB = {};
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {
  const st = lst(L.id, () => ({n: 0, wrong: 0, shake: null, order: shuffled(L.steps.map((_, i) => i), L.id + 's')}));
  const done = st.n >= L.steps.length; if (done) labDone(L.id);
  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>
   <div class="seqline">${st.n ? L.steps.slice(0, st.n).map((s, i) => `<span class="n">${i + 1}</span><span class="chip ok">${esc(s)}</span>`).join('') : '<span class="muted" style="font-size:.78em">Your order appears here.</span>'}</div>
