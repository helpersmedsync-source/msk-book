in plug; onset 9–11 years"]]}, {"title": "5.2 Sweat glands", "items": [["In both thin &amp;", "thick skin; epidermal invaginations in dermis"], ["Secretory unit:", "secretory + myoepithelial cells on basal lamina"], ["Duct:", "stratified cuboidal (2 layers)"], ["Functions:", "excretion &amp; body temperature control"]]}]}], "labName": "Recall · Skin Appendages (1/3)"}, {"id": "p39", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-4-1", "title": "Recall · Skin Appendages (2/3)", "groups": [{"title": "5.3 Eccrine vs apocrine glands", "items": [["Eccrine:", "all over body, esp. palms &amp; soles; no hormonal control; opens into epidermis"], ["Eccrine:", "dark, clear &amp; myoepithelial cells; duct 2–3 cuboidal layers; watery odourless"], ["Apocrine:", "axilla, pubic, perianal, areola; hormonal, function at puberty; opens into hair follicle"], ["Apocrine:", "merocrine mechanism; columnar + myoepithelial cells; duct 1 cuboidal layer"], ["Apocrine secretion", "viscous; odour from bacterial decomposition"]]}]}], "labName": "Recall · Skin Appendages (2/3)"}, {"id": "p40", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-4-2", "title": "Recall · Skin Appendages (3/3)", "groups": [{"title": "5.4 Hair & nails", "items": [["Hair grows from", "hair follicle (epidermal invagination); organized keratin"], ["Follicle controlled", "by arrector pili muscle"], ["Hair shaft:", "cuticle, cortex, medulla; root sheaths; bulb, matrix, papilla"], ["Nails:", "hard keratinized plates — modified stratum corneum"]]}]}], "labName": "Recall · Skin Appendages (3/3)"}, {"id": "p41", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-HIS-L3-09"}, {"t": "check", "q": "Y26-038"}]}, {"id": "p42", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-HIS-L3-10"}, {"t": "flap", "q": "N-HIS-L3-13"}]}, {"id": "p43", "head": "Part 06 · Skin Problems — Clinical Correlations", "kind": "text", "blocks": [{"t": "part", "no": "06", "title": "Skin Problems — Clinical Correlations", "sub": "Skin cancers · Moles & malignant melanoma · Blistering disorders · Disturbed cell → skin problem"}, {"t": "h", "no": "6.1", "title": "Skin cancers", "top": true, "rep": true}, {"t": "list", "items": ["Skin cancers = <mark>1/3<\/mark> of all cancers; ↑ in <mark>fair-skinned<\/mark> in <mark>sunny<\/mark> regions", "BCC from <mark>basal cells<\/mark> — <mark>good prognosis<\/mark>", "SCC from <mark>spinous layer<\/mark> — <mark>good prognosis<\/mark>", "Merkel cell carcinoma — very aggressive, difficult to treat"]}, {"t": "h", "no": "6.2", "title": "Moles & malignant melanoma"}, {"t": "list", "items": ["Melanocyte proliferation → moles (<mark>benign nevi<\/mark>)", "Change in <mark>size or appearance<\/mark> → <mark>malignant melanoma<\/mark>, aggressive"]}], "toc": ["06", "Skin Problems — Clinical Correlations"]}, {"id": "p44", "head": "Part 06 · Skin Problems — Clinical Correlations", "kind": "text", "blocks": [{"t": "h", "no": "6.3", "title": "Blistering disorders", "top": true, "rep": true}, {"t": "list", "items": ["<b>Pemphigus:<\/b> autoimmune; disrupts <mark>desmosomes<\/mark>; upper epidermal blister; staining within epidermis", "<b>Bullous pemphigoid:<\/b> autoimmune; <mark>dermis–epidermis junction<\/mark>; subepidermal blister", "<b>Pemphigoid:<\/b> <mark>IgG<\/mark> against <mark>lamina lucida<\/mark> antigen — linear staining along junction"]}, {"t": "h", "no": "6.4", "title": "Disturbed cell → skin problem"}, {"t": "list", "items": ["Maps psoriasis, albinism, vitiligo, melanoma, BCC, SCC, Merkel carcinoma, pemphigus, pemphigoid, acne to disturbed structure"]}]}, {"id": "p45", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-5-0", "title": "Recall · Skin Problems — Clinical Correlations (1/2)", "groups": [{"title": "6.1 Skin cancers", "items": [["Skin cancers =", "1/3 of all cancers; ↑ in fair-skinned in sunny regions"], ["BCC from basal cells —", "good prognosis"], ["SCC from spinous layer —", "good prognosis"], ["Merkel cell carcinoma —", "very aggressive, difficult to treat"]]}, {"title": "6.2 Moles & malignant melanoma", "items": [["Melanocyte proliferation →", "moles (benign nevi)"], ["Change in size or appearance →", "malignant melanoma, aggressive"]]}, {"title": "6.3 Blistering disorders", "items": [["Pemphigus:", "autoimmune; disrupts desmosomes; upper epidermal blister; staining within epidermis"], ["Bullous pemphigoid:", "autoimmune; dermis–epidermis junction; subepidermal blister"], ["Pemphigoid:", "IgG against lamina lucida antigen — linear staining along junction"]]}]}], "labName": "Recall · Skin Problems — Clinical Correlations (1/2)"}, {"id": "p46", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-5-1", "title": "Recall · Skin Problems — Clinical Correlations (2/2)", "groups": [{"title": "6.4 Disturbed cell → skin problem", "items": [["Maps psoriasis, albinism, vitiligo, melanoma", "BCC, SCC, Merkel carcinoma, pemphigus, pemphigoid, acne to disturbed structure"]]}]}], "labName": "Recall · Skin Problems — Clinical Correlations (2/2)"}, {"id": "p47", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0302"}]}, {"id": "p48", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-HIS-L3-11"}]}, {"id": "p49", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0303"}]}, {"id": "p50", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0304"}]}, {"id": "p51", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Y26-037"}]}, {"id": "p52", "head": "Part 07 · Thick vs Thin Skin — Compared", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Thick vs Thin Skin — Compared", "sub": "Master comparison table — types of skin · The five strata side by side · Non-keratinocytes compared · Numbers to remember"}, {"t": "h", "no": "7.1", "title": "Master comparison table — types of skin"}, {"t": "list", "items": ["<b>Thick:<\/b> palms &amp; soles; thick spinosum, granulosum (3–5), corneum; lucidum present", "<b>Thin:<\/b> granulosum <mark>2–3 layers<\/mark>; lucidum absent", "<b>Thick:<\/b> <mark>more<\/mark> eccrine; no apocrine, no <mark>sebaceous glands<\/mark>, no <mark>hair follicles<\/mark>", "<b>Thin:<\/b> apocrine (<mark>axilla<\/mark>), <mark>sebaceous glands<\/mark> &amp; <mark>hair follicles<\/mark> present"]}, {"t": "h", "no": "7.2", "title": "The five strata side by side"}, {"t": "list", "items": ["<b>Basale:<\/b> hemidesmosomes + desmosomes, mitosis", "<b>Spinosum:<\/b> 4–8 layers, thickest; tonofilaments", "<b>Lucidum:<\/b> thick skin only; corneum: no desmosomes, desquamation"]}], "toc": ["07", "Thick vs Thin Skin — Compared"]}, {"id": "p53", "head": "Part 07 · Thick vs Thin Skin — Compared", "kind": "text", "blocks": [{"t": "h", "no": "7.3", "title": "Non-keratinocytes compared"}, {"t": "list", "items": ["<b>Melanocyte:<\/b> ectodermal, basale &amp; dermis, melanin", "<b>Langerhans:<\/b> bone marrow monocytes, spinosum, APC", "<b>Merkel:<\/b> basale, touch, Merkel cell carcinoma"]}, {"t": "h", "no": "7.4", "title": "Numbers to remember"}, {"t": "list", "items": ["16% body weight; renewal 15–30 days; soles 25 / back 45 days", "Psoriasis ×7; spinosum 4–8, granulosum 3–5, corneum 15–20 layers", "Skin cancers 1/3 of all cancers; acne onset 9–11 years", "Eccrine 3 vs apocrine 2 secretory cell types; duct 2–3 vs 1 layer"]}]}, {"id": "p54", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-6-0", "title": "Recall · Thick vs Thin Skin — Compared (1/2)", "groups": [{"title": "7.1 Master comparison table — types of skin", "items": [["Thick:", "palms &amp; soles; thick spinosum, granulosum (3–5), corneum; lucidum present"], ["Thin:", "granulosum 2–3 layers; lucidum absent"], ["Thick:", "more eccrine; no apocrine, no sebaceous glands, no hair follicles"], ["Thin:", "apocrine (axilla), sebaceous glands &amp; hair follicles present"]]}, {"title": "7.2 The five strata side by side", "items": [["Basale:", "hemidesmosomes + desmosomes, mitosis"], ["Spinosum:", "4–8 layers, thickest; tonofilaments"], ["Lucidum:", "thick skin only; corneum: no desmosomes, desquamation"]]}, {"title": "7.3 Non-keratinocytes compared", "items": [["Melanocyte:", "ectodermal, basale &amp; dermis, melanin"], ["Langerhans:", "bone marrow monocytes, spinosum, APC"], ["Merkel:", "basale, touch, Merkel cell carcinoma"]]}]}], "labName": "Recall · Thick vs Thin Skin — Compared (1/2)"}, {"id": "p55", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-6-1", "title": "Recall · Thick vs Thin Skin — Compared (2/2)", "groups": [{"title": "7.4 Numbers to remember", "items": [["16% body weight; renewal", "15–30 days; soles 25 / back 45 days"], ["Psoriasis ×7; spinosum", "4–8, granulosum 3–5, corneum 15–20 layers"], ["Skin cancers 1/3 of", "all cancers; acne onset 9–11 years"], ["Eccrine 3 vs apocrine 2", "secretory cell types; duct 2–3 vs 1 layer"]]}]}], "labName": "Recall · Thick vs Thin Skin — Compared (2/2)"}, {"id": "p56", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-HIS-L3-12"}, {"t": "flap", "q": "N-HIS-L3-14"}]}, {"id": "p57", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["<b>Q&amp;A recap of all parts:<\/b> strata, granules, non-keratinocytes, glands, cancers, blistering"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["Come, Let's Get Sun Burned (corneum → basale); M &amp; M at the Bottom, L in the Spines", "Pemphig-US = Upper split; Pemphig-OID = lOwer, lucIDa; thick skin = Lucid but Bald"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p58", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-his-l3-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Q&amp;A recap of all parts:", "strata, granules, non-keratinocytes, glands, cancers, blistering"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["Come, Let's Get Sun Burned (corneum →", "basale); M &amp; M at the Bottom, L in the Spines"], ["Pemphig-US =", "Upper split; Pemphig-OID = lOwer, lucIDa; thick skin = Lucid but Bald"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p59", "head": "Real images · 1 of 4", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one. Every slide of the session is in the practical book: <a href=\"prac-his-1.html\">Histology practical · Muscle &amp; skin histology<\/a>."}, {"t": "lab", "lab": "sl347"}], "toc": ["◉", "Real images from the practical"], "labName": "Thin skin (H&E)"}, {"id": "p60", "head": "Real images · 2 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl349"}], "labName": "Thin skin H&E"}, {"id": "p61", "head": "Real images · 3 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl350"}], "labName": "Thin skin H&E"}, {"id": "p62", "head": "Real images · 4 of 4", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl352"}], "labName": "Thick skin H&E"}, {"id": "p63", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "h", "no": "?", "title": "Name it — spotter practice"}, {"t": "note", "kind": "hy", "title": "How it works", "html": "2 pictures from the practical slides of this lecture, each with its title and every label covered, in a new order. Say what it is out loud, then pick. Every one is also in Exam mode."}], "toc": ["?", "Name it — spotter practice"]}, {"id": "p64", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-352"}, {"t": "check", "q": "PRQ-347"}]}, {"id": "p65", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Hemidesmosomes = cell → basal lamina; desmosomes = cell → cell"}, {"t": "note", "kind": "trap", "html": "Keratinocyte stem cells also in hair follicle sheaths, not only basale"}, {"t": "note", "kind": "trap", "html": "Keratohyalin granules non-membranous; lamellar granules membranous — easy to swap"}, {"t": "note", "kind": "trap", "html": "Lucidum still has desmosomes; corneum has none → desquamation"}, {"t": "note", "kind": "trap", "html": "Melanocytes ectodermal; Langerhans from bone marrow monocytes"}, {"t": "note", "kind": "trap", "html": "Melanocyte number is nearly the same in all races"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p66", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Apocrine glands are merocrine by mechanism; odour from bacterial decomposition"}, {"t": "note", "kind": "trap", "html": "Thick skin: no hair, sebaceous or apocrine glands, but more eccrine; lucidum lacking in thin skin"}, {"t": "note", "kind": "trap", "html": "Sebaceous glands in thin skin only"}, {"t": "note", "kind": "trap", "html": "Eccrine duct 2–3 layers; apocrine 1 layer"}, {"t": "note", "kind": "trap", "html": "SCC from spinous layer, not basale"}, {"t": "note", "kind": "trap", "html": "Spinosum is the thickest layer (4–8 layers)"}, {"t": "note", "kind": "cl", "html": "Psoriasis: ↑ keratinocyte proliferation, turnover ↑ up to 7× → thick epidermis, patchy lesions"}]}, {"id": "p67", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Albinism: congenital, no tyrosinase activity / tyrosine uptake"}, {"t": "note", "kind": "cl", "html": "Vitiligo: acquired, autoimmune melanocyte destruction → depigmented patches"}, {"t": "note", "kind": "cl", "html": "Acne: commonest dermatology disease; sebum &amp; keratin plug in follicles; onset 9–11 with sex hormones"}, {"t": "note", "kind": "cl", "html": "Skin cancers: BCC &amp; SCC good prognosis; Merkel cell carcinoma very aggressive"}, {"t": "note", "kind": "cl", "html": "Moles may change in size/appearance → malignant melanoma"}, {"t": "note", "kind": "cl", "html": "Pemphigus (desmosomes, intraepidermal) vs bullous pemphigoid (IgG vs lamina lucida, subepidermal)"}]}, {"id": "p68", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0243": {"id": "Q0243", "stem": "A 37-year-old man complains of visual inaccuracy. Physical examination reveals fair skin, platinum-white hair and hypopigmentation of the iris. He reports that his brother has a similar condition. He is diagnosed with albinism. Which of the following seems to be a cause of this condition?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Albinism is a congenital defect in which melanocytes cannot synthesize melanin, because of absence of tyrosinase activity or inability of the cells to take up tyrosine. The fault lies in the melanocyte itself, not in a lack of dietary tyrosine or of sun exposure.", "type": "mcq", "opts": ["Lack of sun exposure", "Overactivity of Langerhans cells", "Melanocytes unable to take up tyrosine", "Melanocyte tumour", "Deficiency of dietary tyrosine"], "ans": 2}, "Y26-038": {"id": "Y26-038", "stem": "During a 3rd year clinical rotation, you are asked to discuss the biological functions of the skin. Thermoregulation is the primary function of which of the following epidermal appendages?", "top": true, "rep": "", "tag": "Final bank HIS Q35", "bank": true, "expl": "Sweat glands, which develop as epidermal invaginations, function in excretion of unwanted materials and control of body temperature; eccrine glands are found all over the body, especially on the palms and soles. Sebaceous glands, the tempting distractor, secrete sebum into the hair follicle for lubrication, to prevent evaporation and protect the skin.", "type": "mcq", "opts": ["Arrector pili muscles", "Keratinocytes", "Eccrine sweat glands", "Sebaceous glands", "Hair follicles"], "ans": 2}, "Q0251": {"id": "Q0251", "stem": "In which cells is melanin present?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Melanin is made in melanocytes and passed by cytocrine secretion to neighbouring basal and prickle keratinocytes, where it sits above the nucleus as a shield against UV rays.", "type": "written", "keyhtml": "• Melanocytes (stratum basale &amp; dermis): melanin is formed in their membrane-bound granules (melanosomes) by the enzyme tyrosinase.\n• Keratinocytes of the basal and prickle (spinosum) layers: the granules travel along the melanocyte's processes and are injected into these cells (cytocrine secretion), where melanin accumulates above the nucleus (supra-nuclear) to protect against UV rays."}, "Q0252": {"id": "Q0252", "stem": "Which cell forms melanin?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Melanin synthesis is the function of melanocytes, which contain tyrosinase and are DOPA positive.", "type": "written", "keyhtml": "Melanocytes: branched cells of the stratum basale and dermis that synthesize melanin in melanosomes using the enzyme tyrosinase (DOPA positive)."}, "Q0295": {"id": "Q0295", "stem": "Case: A 37-year-old man complains of visual inaccuracy. Physical examination reveals fair skin, platinum-white hair and hypopigmentation of the iris. He reports that his brother has a similar condition. He is diagnosed with albinism.\n1. Enumerate the non-keratinocytes and mention the function of each one.\n2. Mention the non-keratinocyte responsible for this condition.", "top": false, "rep": "asked 2 years", "tag": "Final bank HIS W7", "bank": true, "expl": "The non-keratinocytes are melanocytes (melanin), Langerhans cells (antigen presentation) and Merkel cells (touch). Albinism is a melanocyte defect: the cells cannot make melanin because tyrosinase activity is absent or tyrosine cannot be taken up.", "type": "written", "keyhtml": "1. Non-keratinocytes of the epidermis:\n• Melanocytes (stratum basale &amp; dermis): synthesis of melanin, which accumulates supra-nuclear in keratinocytes to protect against UV rays\n• Langerhans cells (stratum spinosum): the macrophage of the skin; antigen-presenting cells that bind, process and present antigen to T lymphocytes, stimulating them\n• Merkel cells (stratum basale): sensory mechanoreceptors, i.e. touch receptors\n2. Melanocytes. Albinism is a congenital defect in which the melanocytes are unable to synthesize melanin, because of absence of tyrosinase activity or inability of the cells to take up tyrosine."}, "Q0297": {"id": "Q0297", "stem": "Case: A woman in her twenties presents with sudden onset of vitiligo vulgaris six months after her mother died. The depigmented patches cover approximately 60% of her body.\n1. Enumerate the types of cells present in the epidermis of the skin.\n2. Enumerate the layers of keratinocytes.\n3. Enumerate the non-keratinocytes and point to the cell responsible for this condition.", "top": false, "rep": "asked 2 years", "tag": "Final bank HIS W8", "bank": true, "expl": "The epidermis has keratinocytes in five strata plus three non-keratinocytes (melanocytes, Langerhans and Merkel cells). Vitiligo results from loss of melanocytes destroyed by autoimmune dysfunction.", "type": "written", "keyhtml": "1. Four types of cells in the epidermis:\n• Keratinocytes: the main cell type; epithelial cells forming keratin\n• Melanocytes\n• Langerhans cells\n• Merkel cells\n2. Keratinocyte layers, deep → superficial:\n• Stratum basale (stratum germinativum)\n• Stratum spinosum (prickle cell layer)\n• Stratum granulosum (granular cell layer)\n• Stratum lucidum (clear cell layer), found only in thick skin\n• Stratum corneum (horny cell layer)\n3. Non-keratinocytes: melanocytes, Langerhans cells and Merkel cells. The responsible cell is the melanocyte: vitiligo is an acquired, non-infectious depigmentation in patches due to loss or decreased activity of melanocytes, which are destroyed secondary to autoimmune dysfunction (causes may also be environmental or genetic)."}, "Q0300": {"id": "Q0300", "stem": "We present a case of a sudden onset of vitiligo vulgaris from a woman in her twenties, six months after her mother died in a car accident and treated at the Department of Dermatology and Venereology. She has been previously diagnosed with type I diabetes and autoimmune endocrinopathies. The depigmented patches covered approximately 60% of her body. Histopathological and immunohistochemical analyses of the lesions revealed which of the following pictures?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q30", "bank": true, "expl": "Vitiligo is an acquired, non-infectious depigmentation in patches caused by loss of melanocytes, which are destroyed secondary to autoimmune dysfunction; this fits her autoimmune history. Overactivity of keratinocytes describes psoriasis, which thickens the epidermis and does not depigment it.", "img": ["figs/GH-17.jpg"], "cap": "Clinical photograph of the patient", "type": "mcq", "opts": ["Absence of melanocytes", "Overactivity of keratinocytes", "Increased number of Langerhans cells", "Diminished Langerhans cells", "Disturbed Merkel cells"], "ans": 0}, "Q0301": {"id": "Q0301", "stem": "A 37-year-old man came to our observation and complained of visual inaccuracy. Physical examination revealed the presence of fair skin, platinum white hair, and hypopigmentation of the iris. He reported that his brother also has a similar condition. He was diagnosed with albinism. Which of the following seems to be a cause of such case?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q31", "bank": true, "expl": "Albinism is a congenital defect in which melanocytes cannot synthesize melanin because of absence of tyrosinase activity (or inability to take up tyrosine). The defect is in the melanocyte itself, not in dietary tyrosine or sun exposure, and a melanocyte tumour gives moles or malignant melanoma, not albinism.", "img": ["figs/GH-15.jpg"], "cap": "Clinical photograph of the patient", "type": "mcq", "opts": ["Overactivity of Langerhans cells", "Melanocytes lack tyrosinase enzyme", "Deficiency of dietary tyrosine", "Melanocyte tumor", "Lack of sun exposure"], "ans": 1}, "Q0302": {"id": "Q0302", "stem": "A 37-year-old man came to our observation and complained of visual inaccuracy. Physical examination revealed the presence of fair skin, platinum white hair, and hypopigmentation of the iris. He reported that his brother also has a similar condition. He was diagnosed with albinism. This patient is suspected to develop which of the following conditions as a complication?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q32", "bank": true, "expl": "Without melanin, which normally caps the keratinocyte nuclei to protect them against damaging UV rays, the skin is unprotected, and skin cancers increase in fair-skinned individuals exposed to the sun. Acne is a disease of the sebaceous glands and hair follicles and has no link to melanin.", "img": ["figs/GH-16.jpg"], "cap": "Clinical photograph of the patient", "type": "mcq", "opts": ["Skin infection", "Intellectual disability", "Acne", "Skin cancer", "Obesity"], "ans": 3}, "Q0303": {"id": "Q0303", "stem": "A 60-year-old woman was referred with blisters in the mouth, apart from thrush, drooling, dysphagia, intermittent fever, and diarrhea. Clinical examination showed mucosal ulcers, and white plaques in the buccal, gingival mucosae. She was prescribed antibiotics without improvement. Biopsy of lesions showed squamous epithelium with suprabasal blisters. She was diagnosed as pemphigus vulgaris that is caused by antibodies against the junction between the keratinocytes. Which of the following cell junctions is affected?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q33", "bank": true, "expl": "Pemphigus is an autoimmune blistering disorder that disrupts the desmosomes linking keratinocytes, so the split is upper, within the epidermis. Hemidesmosomes join basal cells to the basal lamina, at the dermis–epidermis junction targeted in bullous pemphigoid.", "img": ["figs/GH-18.jpg", "figs/GH-18_2.jpg", "figs/GH-18_3.jpg"], "cap": "Oral lesion, skin lesions and lesion biopsy (H&E)", "type": "mcq", "opts": ["Zonula adherens", "Hemidesmosomes", "Gap junctions", "Desmosomes", "Occluding junctions"], "ans": 3}, "Q0304": {"id": "Q0304", "stem": "A 70-year-old woman presents with thin-walled, tense blisters with clear fluid centers (bullae) appearing on the arms and legs, in the axillae, on the abdomen. This was preceded by redness and itching of the skin. She was diagnosed as bullous pemphigoid, which is a skin condition characterized by presence of antibodies directed towards the junction between the keratinocytes and the basement membrane. What is the name of this cell junction?", "top": true, "rep": "asked 4 years", "tag": "Final bank HIS Q34", "bank": true, "expl": "In the stratum basale, hemidesmosomes join the cells to the basal lamina, while desmosomes bind the cells to each other. Bullous pemphigoid targets this dermis–epidermis junction (IgG against the lamina lucida, a lower, subepidermal blister), whereas pemphigus disrupts the desmosomes linking keratinocytes.", "img": ["figs/GH-19.jpg", "figs/GH-19_2.jpg", "figs/GH-19_3.jpg"], "cap": "Lesion biopsy (immunofluorescence and H&E) and skin lesions", "type": "mcq", "opts": ["Zonula adherens", "Hemidesmosomes", "Gap junctions", "Desmosomes", "Occluding junctions"], "ans": 1}, "N-HIS-L3-01": {"id": "N-HIS-L3-01", "stem": "A woman who keeps her skin fully covered and avoids the sun is advised to get more sun exposure, because UV rays are needed to form vitamin D3 in the skin. In which cells does UV act on dehydrocholesterol to form vitamin D3?", "top": false, "rep": "", "tag": "Final bank HIS Q37", "bank": true, "expl": "Vitamin D3 is formed by the action of UV rays on dehydrocholesterol in keratinocytes. Melanocytes also respond to sunlight, but their job is melanin synthesis.", "type": "mcq", "opts": ["Melanocytes", "Keratinocytes", "Langerhans cells", "Merkel cells", "Sebaceous gland cells"], "ans": 1}, "N-HIS-L3-02": {"id": "N-HIS-L3-02", "stem": "After a superficial abrasion of the skin, the epidermis is regenerated from keratinocyte stem cells. Where are these stem cells found?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Basal stem cells for keratinocytes are found in the stratum basale and also in the hair follicle sheaths. The granulosum, lucidum and corneum are the upper layers whose cells are keratinizing and being shed, not regenerating.", "type": "mcq", "opts": ["Stratum basale and the hair follicle sheaths", "Stratum spinosum and stratum granulosum", "Stratum granulosum and stratum lucidum", "Stratum lucidum and stratum corneum", "Stratum corneum and the sebaceous glands"], "ans": 0}, "N-HIS-L3-03": {"id": "N-HIS-L3-03", "stem": "An electron micrograph of the granular cell layer of the epidermis shows two kinds of granules. One kind is membrane-bound and contains lipid lamellae. What is the function of these granules?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Lamellar granules are membranous and lipid in nature; their contents are exocytosed to form a waterproof barrier that prevents loss of fluid and electrolytes and entry of toxins. Bundling keratin filaments is the job of the non-membranous keratohyalin granules, which are easily swapped with them.", "type": "mcq", "opts": ["Bundling of keratin filaments together", "Formation of a waterproof lipid barrier", "Protection of the nuclei against UV rays", "Presentation of antigen to T lymphocytes", "Detection of touch as mechanoreceptors"], "ans": 1}, "N-HIS-L3-04": {"id": "N-HIS-L3-04", "stem": "A 30-year-old man has patchy, scaly lesions along the margin of his scalp. A skin biopsy shows a markedly thickened epidermis. Which of the following best explains this finding?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Psoriasis causes patchy lesions through an increased keratinocyte proliferation rate and an accelerated cell cycle; turnover rises up to seven times, giving a thicker epidermis. Autoimmune destruction of melanocytes produces the depigmented patches of vitiligo, not a thick epidermis.", "type": "mcq", "opts": ["Autoimmune destruction of melanocytes", "Increased keratinocyte proliferation with up to seven-fold turnover", "Antibodies against the desmosomes linking keratinocytes", "Impaction of sebum and keratin within hair follicles", "Proliferation of melanocytes forming benign nevi"], "ans": 1}, "N-HIS-L3-05": {"id": "N-HIS-L3-05", "stem": "Skin biopsies from a dark-skinned and a fair-skinned person are compared. Which finding explains the difference in their skin colour?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Differences in skin pigmentation relate to the amount of melanin and its rate of transfer by melanocytes. The total number of melanocytes is nearly the same in all races, and absence of tyrosinase activity is the defect of albinism.", "type": "mcq", "opts": ["A greater number of melanocytes in the darker skin", "A greater amount of melanin and a faster rate of its transfer in the darker skin", "Absence of tyrosinase activity in the fairer skin", "Melanocytes located in the stratum spinosum of the darker skin", "A greater number of Langerhans cells in the darker skin"], "ans": 1}, "N-HIS-L3-06": {"id": "N-HIS-L3-06", "stem": "In a section of skin, a few cells in the stratum basale contain neuroendocrine granules and are surrounded by the disc-like expanded naked terminals of myelinated afferent nerves. What is the function of these cells?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Merkel cells are few, lie in the stratum basale, contain neuroendocrine granules and form a terminal disk with afferent nerve endings; they are sensory mechanoreceptors (touch receptors). Melanocytes also sit in the basale but synthesize melanin.", "type": "mcq", "opts": ["Presentation of antigen to T lymphocytes", "Synthesis of melanin", "Touch sensation", "Synthesis of keratin", "Formation of vitamin D3"], "ans": 2}, "N-HIS-L3-07": {"id": "N-HIS-L3-07", "stem": "A skin biopsy shows branched cells with many processes scattered among the polygonal cells of the stratum spinosum. These cells bind, process and present antigen to T lymphocytes. What is the origin of these cells?", "top": false, "rep": "", "tag": "Final bank HIS Q38", "bank": true, "expl": "Langerhans cells originate in the bone marrow from blood monocytes and act as the macrophage of the skin. Melanocytes, the other branched epidermal cells, are ectodermal, so the two are told apart by origin, site and job.", "type": "mcq", "opts": ["Ectoderm", "Blood monocytes from the bone marrow", "Keratinocyte stem cells of the stratum basale", "Keratinocyte stem cells of the hair follicle sheaths"], "ans": 1}, "N-HIS-L3-08": {"id": "N-HIS-L3-08", "stem": "A section of fingertip skin shows extensive interdigitation between downgrowths of the epidermis and upward projections of the dermis. What is the main function of this arrangement?", "top": false, "rep": "", "tag": "Final bank HIS Q39", "bank": true, "expl": "Epidermal ridges and dermal papillae increase the area of attachment between epidermis and dermis and resist shearing forces; they are extensive at the fingertips and minimal over the back. The waterproof barrier comes from the lamellar granules of the stratum granulosum.", "type": "mcq", "opts": ["Increasing the area of attachment and resisting shearing forces", "Forming a waterproof barrier against fluid loss", "Renewing the epidermis every 15–30 days", "Protecting keratinocyte nuclei against UV rays", "Controlling body temperature through sweat"], "ans": 0}, "N-HIS-L3-09": {"id": "N-HIS-L3-09", "stem": "An 11-year-old boy develops acne on his face: a chronic inflammation of the hair follicles and of the glands that open into them, with obstruction by impacted sebum and keratinous debris. By which mechanism do these glands release their secretion?", "top": false, "rep": "", "tag": "Final bank HIS Q40", "bank": true, "expl": "Sebaceous glands are holocrine: their cells die and rupture to release their fat contents (sebum). Merocrine is the mechanism of both eccrine and apocrine sweat glands, and cytocrine describes melanin transfer from melanocytes to keratinocytes.", "type": "mcq", "opts": ["Merocrine", "Holocrine", "Cytocrine", "Paracrine"], "ans": 1}, "N-HIS-L3-10": {"id": "N-HIS-L3-10", "stem": "A 15-year-old boy has noticed axillary body odour since puberty. The responsible sweat glands open into the hair follicles of the axilla. Which statement about these glands is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Apocrine glands are merocrine by mechanism in spite of their name; they function at puberty and their odour comes from bacterial decomposition. A 2–3-layer cuboidal duct, dark and clear cells, and no hormonal control all describe eccrine glands.", "type": "mcq", "opts": ["They secrete by the merocrine mechanism", "They secrete by the holocrine mechanism", "Their duct is lined by 2–3 layers of cuboidal cells", "Their secretory unit has dark, clear and myoepithelial cells", "They are not under hormonal control"], "ans": 0}, "N-HIS-L3-11": {"id": "N-HIS-L3-11", "stem": "A 65-year-old fair-skinned man living in a sunny region develops a tumour on the skin of his face. Biopsy shows squamous cell carcinoma. From which part of the epidermis does this tumour arise, and what is its usual behaviour?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Squamous cell carcinoma is derived from the spinous layer and has a good prognosis. Basal cell carcinoma comes from the basal cells (the common swap), and Merkel cell carcinoma is the very aggressive one.", "type": "mcq", "opts": ["Basal cells; good prognosis", "Spinous layer; good prognosis", "Spinous layer; very aggressive", "Merkel cells; very aggressive", "Melanocytes; good prognosis"], "ans": 1}, "Y26-037": {"id": "Y26-037", "stem": "A 48-year-old man presents with numerous large blisters on his scalp and around his umbilicus. Examination of a skin biopsy suggests the diagnosis of pemphigus vulgaris. The biopsy shows loss of cohesion between keratinocytes of which of the following two layers of the patient’s skin?", "top": true, "rep": "", "tag": "Final bank HIS Q36", "bank": true, "expl": "Pemphigus is an autoimmune blistering disorder that disrupts the desmosomes linking keratinocytes, so the split is upper, within the epidermis (an epidermal blistering disease) — here between the basal and spinous keratinocytes. A split between the epidermis and its basement membrane is the lower, subepidermal blister of bullous pemphigoid, which targets the dermis–epidermis junction.", "type": "mcq", "opts": ["Stratum basale and stratum spinosum of epidermis", "Papillary dermis and reticular dermis", "Reticular dermis and hypodermis", "Epidermis and basement membrane", "Basement membrane and papillary dermis"], "ans": 0}, "N-HIS-L3-12": {"id": "N-HIS-L3-12", "stem": "A skin biopsy from the sole of the foot shows all five epidermal layers, including a thin translucent layer of flattened eosinophilic cells beneath a thick keratin layer. Which other feature is expected in this skin?", "top": false, "rep": "", "tag": "Final bank HIS Q41", "bank": true, "expl": "The sole is thick skin, which has a stratum lucidum and more eccrine sweat glands but no hair follicles, sebaceous glands or apocrine glands. A granulosum of only 2–3 layers is a feature of thin skin.", "type": "mcq", "opts": ["Numerous eccrine sweat glands", "Sebaceous glands opening into hair follicles", "Apocrine sweat glands", "Hair follicles with arrector pili muscles", "A stratum granulosum of only 2–3 layers"], "ans": 0}, "N-HIS-L3-13": {"id": "N-HIS-L3-13", "stem": "Compare eccrine and apocrine sweat glands as regards site, mechanism of secretion, hormonal control, secretory unit, duct, opening and secretion.", "top": false, "rep": "", "tag": "Final bank HIS W9", "bank": true, "expl": "Both are merocrine sweat glands, but they differ in site, hormonal control, secretory cells, duct lining, opening and secretion, as set out in the lecture's eccrine vs apocrine table.", "type": "written", "keyhtml": "Feature | Eccrine gland | Apocrine gland\nSite | All over the body, especially palm of hand &amp; sole of foot | Various areas, e.g. axilla, pubic region, perianal region &amp; areola of nipple\nMechanism of secretion | Merocrine | Merocrine, in spite of being called apocrine\nHormonal control | No | Yes: these glands function at puberty\nSecretory unit | 3 types of cells: dark cells, clear cells, myoepithelial cells | Larger acini lined with 2 types of cells: columnar cells, myoepithelial cells\nDuct | 2–3 layers of cuboidal cells | One layer of cuboidal cells\nOpens into | The epidermis | The hair follicle\nSecretion | Watery &amp; odourless | Viscous; acquires its distinctive odour from bacterial decomposition"}, "N-HIS-L3-14": {"id": "N-HIS-L3-14", "stem": "Compare thick and thin skin.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Thick skin (palms and soles) has a stratum lucidum and more eccrine glands but no hair follicles, sebaceous or apocrine glands; thin skin has the reverse.", "type": "written", "keyhtml": "Feature | Thick skin | Thin skin\nSites | Palms &amp; soles | Most of the body surface\nEpidermis | Thick | Thin\nStratum basale | One cell row | One row\nStratum spinosum | Thicker | Thinner\nStratum granulosum | Thick, 3–5 layers | Thinner, 2–3 layers\nStratum lucidum | Present | Absent\nStratum corneum | Thick, prominent | Thin, less prominent\nEccrine sweat glands | More | Less\nApocrine sweat glands | Absent | Present in axilla\nSebaceous glands | Absent | Present\nHair follicles | Absent | Present"}, "N-HIS-L3-15": {"id": "N-HIS-L3-15", "stem": "Enumerate the functions of the skin.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The skin, the largest organ (16% of body weight), has eight functions in the lecture, from barrier and waterproofing to vitamin D3 formation and fingerprints.", "type": "written", "keyhtml": "1. Barrier: an effective mechanical barrier against microorganisms\n2. Waterproof layer\n3. Pigmentation to protect against harmful UV light\n4. Regulation of body temperature\n5. Excretion of harmful material in sweat\n6. Formation of vitamin D3 by the action of UV rays on dehydrocholesterol in keratinocytes\n7. Sensation: pain, touch &amp; temperature\n8. Identity: fingerprints are used as one of the personal recognitions"}, "TP-006": {"id": "TP-006", "stem": "A 45-year-old man complains of a skin rash that appeared after exposure to an allergenic plant called \"poison ivy\". Physical examination reveals skin rashes and blisters on his upper limb and trunk. Which skin cell presents the \"poison ivy\" antigens to the lymphatic cells of the immune system in this patient?", "top": true, "rep": "", "tag": "Final bank HIS W16", "bank": true, "expl": "Langerhans cells are the antigen-presenting macrophages of the skin, lying in the stratum spinosum; they bind, process and present antigen to T lymphocytes. Melanocytes are also branched but synthesize melanin, and Merkel cells are touch receptors.", "type": "written", "keyhtml": "Langerhans cells:\n• Site: stratum spinosum of the epidermis\n• Origin: bone marrow, from blood monocytes\n• Branched cells with many processes to increase surface area\n• The macrophage of the skin — an antigen-presenting cell that binds, processes and presents antigen to T lymphocytes, stimulating them"}, "TP-007": {"id": "TP-007", "stem": "Enumerate the types of granules present in the stratum granulosum and the function of each.", "top": true, "rep": "", "tag": "Final bank HIS W17", "bank": true, "expl": "The stratum granulosum (3–5 layers of flattened cells undergoing keratinization) contains two kinds of granules. Keratohyalin granules are non-membranous and bundle keratin, while lamellar granules are membranous lipid granules that form the waterproof barrier — the two are easy to swap.", "type": "written", "keyhtml": "1. Keratohyalin granules — non-membranous; contain keratin + proteins: the proteins collect keratin filaments into bundles.\n2. Lamellar granules — membranous, lipid in nature: they undergo exocytosis → a lipid-rich substance forming the waterproof skin barrier, which prevents loss of fluid and electrolytes and prevents entry of toxins from the environment."}, "TP-089": {"id": "TP-089", "stem": "A 25-year-old male presents with red scaly lesions. Histology shows increased proliferation of the keratinocytes with a shortened turnover time. Which epidermal layer is mainly responsible for regeneration?", "top": true, "rep": "", "tag": "Final bank HIS W18", "bank": true, "expl": "In psoriasis keratinocyte proliferation rises and turnover increases up to seven times, thickening the epidermis. Regeneration comes from the mitotically active stem cells of the stratum basale; the stratum spinosum is the thickest layer but mainly synthesizes keratin.", "type": "written", "keyhtml": "Stratum basale (stratum germinativum):\n• A single row of columnar, basophilic cells resting on the basal lamina\n• High mitotic activity — contains the stem cells; renewed every 15–30 days, so it is responsible for regeneration of the epidermis\n• (With the basally located keratinocytes of the stratum spinosum it forms the mitotically active Malpighian layer that drives keratinocyte turnover; keratinocyte stem cells are also found in the hair follicle sheaths.)"}, "PRQ-352": {"id": "PRQ-352", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Smooth muscle", "Thick skin", "Synovial joint", "Cardiac muscle"], "ans": 1, "top": false, "rep": "", "tag": "Practical · Muscle & skin histology", "bank": false, "img": ["prac/q352.jpg"], "expl": "The practical slide \"Thick skin H&E\" (Muscle & skin histology)."}, "PRQ-347": {"id": "PRQ-347", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Cardiac muscle", "Thick skin", "Synovial joint", "Thin skin"], "ans": 3, "top": false, "rep": "", "tag": "Practical · Muscle & skin histology", "bank": false, "img": ["prac/q347.jpg"], "expl": "The practical slide \"Thin skin (H&E)\" (Muscle & skin histology)."}}, "labs": {"sl347": {"id": "sl347", "type": "slide", "title": "Thin skin (H&E)", "img": "prac/s347.jpg", "labels": [{"t": "Stratified squamous epithelium", "x": 52.46, "y": 46.01, "w": 18.36, "h": 2.51, "id": "l0"}, {"t": "Hair follicle", "x": 44.81, "y": 81.25, "w": 7.35, "h": 2.78, "id": "l1"}], "src": "From the practical slides · Muscle & skin histology", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl349": {"id": "sl349", "type": "slide", "title": "Thin skin H&E", "img": "prac/s349.jpg", "labels": [{"t": "Keratin", "x": 55.76, "y": 23.76, "w": 5.59, "h": 3.33, "id": "l0"}, {"t": "Stratified squamous epithelium", "x": 22.55, "y": 28.74, "w": 11.7, "h": 5.74, "id": "l1"}], "src": "From the practical slides · Muscle & skin histology", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl350": {"id": "sl350", "type": "slide", "title": "Thin skin H&E", "img": "prac/s350.jpg", "labels": [{"t": "Hair follicle", "x": 38.69, "y": 55.21, "w": 7.35, "h": 2.78, "id": "l0"}, {"t": "Sebaceous gland", "x": 56.04, "y": 64.52, "w": 10.79, "h": 2.78, "id": "l1"}], "src": "From the practical slides · Muscle & skin histology", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl352": {"id": "sl352", "type": "slide", "title": "Thick skin H&E", "img": "prac/s352.jpg", "labels": [{"t": "Stratified squamous epithelium", "x": 17.01, "y": 40.85, "w": 6.4, "h": 8.93, "id": "l0"}, {"t": "Keratin", "x": 61.7, "y": 38.51, "w": 5.59, "h": 3.33, "id": "l1"}], "src": "From the practical slides · Muscle & skin histology", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "HIS-L3-001", "text": "Skin appendages: {{c1::hair (hair follicles)}} · {{c2::nail}} · {{c3::glands — sebaceous & sweat}}", "extra": "Integumentary system = skin (epidermis + dermis) + its appendages.", "sec": "Part 01 · 1.1 The integumentary system"}, {"id": "HIS-L3-002", "text": "Skin layers — epidermis: {{c1::epithelium}} (superficial); dermis: {{c2::connective tissue}} (deep)", "extra": "", "sec": "Part 01 · 1.2 Types of skin & its two layers"}, {"id": "HIS-L3-003", "text": "Thick skin is found in the {{c1::palms & soles}}; thin (hairy) skin covers {{c2::most of the body surface}}", "extra": "", "sec": "Part 01 · 1.2 Types of skin & its two layers"}, {"id": "HIS-L3-004", "text": "The skin is the largest organ in the body — {{c1::16%}} of body weight", "extra": "", "sec": "Part 01 · 1.3 The skin & its functions"}, {"id": "HIS-L3-005", "text": "Skin functions (1–4): {{c1::mechanical barrier against microorganisms}} · {{c2::waterproof layer}} · {{c3::pigmentation against harmful UV light}} · {{c4::regulation of body temperature}}", "extra": "8 jobs: \"Big Wet Umbrella Keeps Every Doctor Safe Forever\".", "sec": "Part 01 · 1.3 The skin & its functions"}, {"id": "HIS-L3-006", "text": "Skin functions (5–8): {{c1::excretion of harmful material in sweat}} · {{c2::vitamin D3 formation}} · {{c3::sensation — pain, touch & temperature}} · {{c4::identity — fingerprints}}", "extra": "8 jobs: \"Big Wet Umbrella Keeps Every Doctor Safe Forever\".", "sec": "Part 01 · 1.3 The skin & its functions"}, {"id": "HIS-L3-007", "text": "Vitamin D3 is formed by the action of {{c1::UV rays}} on {{c2::dehydrocholesterol}} in {{c3::keratinocytes}}", "extra": "Melanocytes respond to sunlight too, but their job is melanin.", "sec": "Part 01 · 1.3 The skin & its functions"}, {"id": "HIS-L3-008", "text": "Epidermis: {{c1::stratified squamous keratinized}} epithelium, separated from the dermis by a {{c2::basement membrane}}", "extra": "", "sec": "Part 02 · 2.1 The epidermis"}, {"id": "HIS-L3-009", "text": "Epidermal cell types — main cell: {{c1::keratinocytes}}; non-keratinocytes: {{c2::melanocytes}} · {{c3::Langerhans cells}} · {{c4::Merkel cells}}", "extra": "Four cell types in the epidermis.", "sec": "Part 02 · 2.1 The epidermis"}, {"id": "HIS-L3-010", "text": "Keratinocytes = epithelial cells that form {{c1::keratin}}; the main cell type of the epidermis", "extra": "", "sec": "Part 02 · 2.2 Keratinocytes & the five layers"}, {"id": "HIS-L3-011", "text": "Keratinocyte strata, deep → superficial: {{c1::basale}} · {{c2::spinosum}} · {{c3::granulosum}} · {{c4::lucidum}} · {{c5::corneum}}", "extra": "Superficial → deep: \"Come, Let's Get Sun Burned\".", "sec": "Part 02 · 2.2 Keratinocytes & the five layers"}, {"id": "HIS-L3-012", "text": "Other names: stratum basale = stratum {{c1::germinativum}} · spinosum = {{c2::prickle}} cell layer · lucidum = {{c3::clear}} cell layer · corneum = {{c4::horny}} cell layer", "extra": "Granulosum = granular cell layer.", "sec": "Part 02 · 2.2 Keratinocytes & the five layers"}, {"id": "HIS-L3-013", "text": "As keratinocytes differentiate and move upward, the amount & types of {{c1::keratin filaments}} {{c2::increase::increase or decrease}}", "extra": "", "sec": "Part 02 · 2.2 Keratinocytes & the five layers"}, {"id": "HIS-L3-014", "text": "Stratum basale: a {{c1::single row of columnar cells}} resting on the {{c2::basal lamina}}", "extra": "", "sec": "Part 02 · 2.3 Stratum basale"}, {"id": "HIS-L3-015", "text": "Stratum basale is {{c1::basophilic}} due to {{c2::free ribosomes}}", "extra": "", "sec": "Part 02 · 2.3 Stratum basale"}, {"id": "HIS-L3-016", "text": "Stratum basale junctions: {{c1::hemidesmosomes}} join cells to the basal lamina; {{c2::desmosomes}} bind cells together (lateral & upper surfaces)", "extra": "Hemidesmosome = cell → basal lamina · desmosome = cell → cell.", "sec": "Part 02 · 2.3 Stratum basale"}, {"id": "HIS-L3-017", "text": "Stratum basale cytoskeleton: keratins = {{c1::intermediate filaments}}", "extra": "", "sec": "Part 02 · 2.3 Stratum basale"}, {"id": "HIS-L3-018", "text": "Stratum basale: high {{c1::mitotic}} activity (stem cells) — renewed every {{c2::15–30 days}}", "extra": "Regeneration of the whole epidermis also takes ~15–30 days.", "sec": "Part 02 · 2.3 Stratum basale"}, {"id": "HIS-L3-019", "text": "Keratinocyte stem cells are found in the {{c1::stratum basale}} and also in the {{c2::hair follicle sheaths}}", "extra": "Exam trap: not only in the basale.", "sec": "Part 02 · 2.3 Stratum basale"}, {"id": "HIS-L3-020", "text": "Thickest layer of the epidermis: stratum {{c1::spinosum}} ({{c2::4–8}} layers)", "extra": "", "sec": "Part 02 · 2.4 Stratum spinosum"}, {"id": "HIS-L3-021", "text": "Stratum spinosum cells: {{c1::polygonal (polyhedral)}} with a single, central, rounded {{c2::vesicular}} nucleus; actively synthesizing {{c3::keratin}}", "extra": "", "sec": "Part 02 · 2.4 Stratum spinosum"}, {"id": "HIS-L3-022", "text": "The spines (prickles) of stratum spinosum cells are joined by {{c1::desmosomes}} ({{c2::macula adherens}})", "extra": "", "sec": "Part 02 · 2.4 Stratum spinosum"}, {"id": "HIS-L3-023", "text": "Stratum spinosum tonofilament bundles radiate outward from the {{c1::perinuclear region}} toward the {{c2::desmosomes}}", "extra": "Basale cells keep producing tonofilaments as they move up through the spinosum.", "sec": "Part 02 · 2.4 Stratum spinosum"}, {"id": "HIS-L3-024", "text": "Stratum granulosum: {{c1::3–5}} layers of flattened cells undergoing terminal differentiation = {{c2::keratinization}}", "extra": "Cytoplasm full of intensely basophilic keratohyalin granules.", "sec": "Part 02 · 2.5 Stratum granulosum"}, {"id": "HIS-L3-025", "text": "Stratum granulosum granules — keratohyalin: {{c1::non-membranous}}; lamellar: {{c2::membranous}} and {{c3::lipid}} in nature", "extra": "Exam trap: easy to swap.", "sec": "Part 02 · 2.5 Stratum granulosum"}, {"id": "HIS-L3-026", "text": "Keratohyalin granules (keratin + proteins): the proteins {{c1::collect keratin filaments into bundles}}", "extra": "Keratohyalin = Keratin bundler.", "sec": "Part 02 · 2.5 Stratum granulosum"}, {"id": "HIS-L3-027", "text": "Lamellar granules undergo {{c1::exocytosis}} → lipid-rich substance → {{c2::waterproof skin barrier}}", "extra": "LAmellar = Lipid + wAterproof.", "sec": "Part 02 · 2.5 Stratum granulosum"}, {"id": "HIS-L3-028", "text": "The lamellar-granule lipid barrier prevents {{c1::loss of fluid & electrolytes}} and {{c2::entry of toxins from the environment}}", "extra": "", "sec": "Part 02 · 2.5 Stratum granulosum"}, {"id": "HIS-L3-029", "text": "Stratum {{c1::lucidum}} is found only in {{c2::thick}} skin", "extra": "It is the layer thin skin lacks.", "sec": "Part 02 · 2.6 Stratum lucidum"}, {"id": "HIS-L3-030", "text": "Stratum lucidum: thin, translucent layer of flattened {{c1::eosinophilic}} keratinocytes; {{c2::nuclei & organelles}} lost; still held by {{c3::desmosomes}}", "extra": "Cytoplasm: packed keratin filaments in an electron-dense matrix.", "sec": "Part 02 · 2.6 Stratum lucidum"}, {"id": "HIS-L3-031", "text": "Stratum corneum: most superficial; {{c1::15–20}} layers of flattened cells filled with densely packed {{c2::filamentous keratin}}; {{c3::no nucleus, no organelles}}", "extra": "", "sec": "Part 02 · 2.7 Stratum corneum"}, {"id": "HIS-L3-032", "text": "Stratum corneum cells have {{c1::no desmosomes}} → they shed off the surface = {{c2::desquamation}}", "extra": "Lucidum still has desmosomes; corneum has none — that is why it sheds.", "sec": "Part 02 · 2.7 Stratum corneum"}, {"id": "HIS-L3-033", "text": "Epidermal turnover is faster at traumatized sites: soles of feet {{c1::25 days}} vs back {{c2::45 days}}", "extra": "", "sec": "Part 02 · 2.8 Turnover of skin & the Malpighian layer"}, {"id": "HIS-L3-034", "text": "{{c1::Malpighian}} layer (stratum germinativum) = basal cell layer + {{c2::basally located keratinocytes of the stratum spinosum}} — mitotically active, responsible for keratinocyte turnover", "extra": "", "sec": "Part 02 · 2.8 Turnover of skin & the Malpighian layer"}, {"id": "HIS-L3-035", "text": "{{c1::Psoriasis}}: patchy lesions from ↑ keratinocyte proliferation & accelerated cell cycle — turnover ↑ up to {{c2::7 times}} → {{c3::greater epidermal thickness}}", "extra": "Keratinocyte overactivity thickens the epidermis; it does not depigment it.", "sec": "Part 02 · 2.9 Psoriasis"}, {"id": "HIS-L3-036", "text": "Sites — melanocytes: {{c1::stratum basale & dermis}} · Merkel cells: {{c2::stratum basale}} · Langerhans cells: {{c3::stratum spinosum}}", "extra": "\"M & M sit at the Bottom, L Stands in the Spines\".", "sec": "Part 03 · 3.1 The four epidermal cells at a glance"}, {"id": "HIS-L3-037", "text": "Key roles — melanocyte: {{c1::synthesis of melanin}} · Langerhans cell: {{c2::antigen-presenting macrophage of the skin}} · Merkel cell: {{c3::touch receptor}}", "extra": "", "sec": "Part 03 · 3.1 The four epidermal cells at a glance"}, {"id": "HIS-L3-038", "text": "Origin — melanocytes: {{c1::ectodermal}}; Langerhans cells: {{c2::bone marrow (blood monocytes)}}", "extra": "Both are branched — tell them apart by origin, site & job.", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-039", "text": "Melanocyte shape: branched cell with a rounded body, central nucleus and cytoplasmic processes called {{c1::dendrites}} that extend between the surrounding {{c2::keratinocytes}}", "extra": "", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-040", "text": "Melanin is formed in membrane-bound granules called {{c1::melanosomes}} (different stages of melanin)", "extra": "", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-041", "text": "{{c1::Cytocrine}} secretion: melanin granules advance along melanocyte processes and are injected into neighbouring {{c2::basal & prickle}} cells", "extra": "Cyto-crine = injected into the keratinocyte's cyto-plasm.", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-042", "text": "Melanocyte enzyme needed to form melanin granules: {{c1::tyrosinase}} — melanocytes are {{c2::DOPA}} positive", "extra": "", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-043", "text": "In keratinocytes, melanin accumulates {{c1::supra-nuclear}} to protect against {{c2::UV rays}}", "extra": "Melanin = an umbrella cap above the nucleus.", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-044", "text": "Melanin pathway: tyrosinase made in the {{c1::RER}} → {{c2::Golgi}} → melanosome → melanin granule pinched off into keratinocytes", "extra": "Sunlight ↑ melanin production.", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-045", "text": "Skin colour differences between races relate to the {{c1::amount of melanin}} and its {{c2::rate of transfer}} — melanocyte number is {{c3::nearly the same in all races}}", "extra": "", "sec": "Part 03 · 3.2 Melanocytes"}, {"id": "HIS-L3-046", "text": "Albinism: {{c1::congenital}}; vitiligo: {{c2::acquired}}, non-infectious", "extra": "", "sec": "Part 03 · 3.3 Albinism & vitiligo"}, {"id": "HIS-L3-047", "text": "Albinism: melanocytes cannot synthesize melanin — absence of {{c1::tyrosinase activity}} or inability to {{c2::take up tyrosine}}", "extra": "The fault is in the melanocyte — not dietary tyrosine or sun exposure.", "sec": "Part 03 · 3.3 Albinism & vitiligo"}, {"id": "HIS-L3-048", "text": "Albinism (no melanin) — the patient is at risk of {{c1::skin cancer}} as a complication", "extra": "Official key (Histology GD Q14): no melanin cap over the nuclei; skin cancers ↑ in fair skin.", "sec": "Part 03 · 3.3 Albinism & vitiligo"}, {"id": "HIS-L3-049", "text": "Vitiligo: depigmentation in {{c1::patches}} due to {{c2::loss or decreased activity}} of melanocytes", "extra": "", "sec": "Part 03 · 3.3 Albinism & vitiligo"}, {"id": "HIS-L3-050", "text": "Vitiligo: melanocytes destroyed secondary to {{c1::autoimmune}} dysfunction (causes may also be environmental or genetic)", "extra": "", "sec": "Part 03 · 3.3 Albinism & vitiligo"}, {"id": "HIS-L3-051", "text": "Vitiligo lesion on histopathology & immunohistochemistry: {{c1::absence of melanocytes}}", "extra": "Keratinocyte overactivity = psoriasis, not vitiligo.", "sec": "Part 03 · 3.3 Albinism & vitiligo"}, {"id": "HIS-L3-052", "text": "Tanning (two steps, at the same time): 1 — a {{c1::physicochemical reaction}} darkens {{c2::pre-existing melanin}}; 2 — {{c3::paracrine factors from keratinocytes}} accelerate melanin synthesis", "extra": "", "sec": "Part 03 · 3.4 Skin tanning"}, {"id": "HIS-L3-053", "text": "Merkel cells: {{c1::few}} in number, in the stratum basale, containing {{c2::neuroendocrine}} granules", "extra": "", "sec": "Part 03 · 3.5 Merkel cells"}, {"id": "HIS-L3-054", "text": "Merkel cell + naked terminals of {{c1::myelinated afferent}} nerves form a disc-like {{c2::terminal disk}} → a {{c3::touch}} mechanoreceptor", "extra": "", "sec": "Part 03 · 3.5 Merkel cells"}, {"id": "HIS-L3-055", "text": "Langerhans cells have many processes to {{c1::increase surface area}}", "extra": "", "sec": "Part 03 · 3.6 Langerhans cells"}, {"id": "HIS-L3-056", "text": "Langerhans cells = the {{c1::macrophage}} of the skin — bind, process & present antigen to {{c2::T lymphocytes}}, stimulating them", "extra": "", "sec": "Part 03 · 3.6 Langerhans cells"}, {"id": "HIS-L3-057", "text": "Dermo-epidermal junction: {{c1::epidermal ridges}} = downgrowth of epidermis; {{c2::dermal papillae}} = upward growth of dermis", "extra": "", "sec": "Part 04 · 4.1 Dermo-epidermal junction"}, {"id": "HIS-L3-058", "text": "Epidermal ridges & dermal papillae {{c1::increase the area of attachment}} and {{c2::resist shearing forces}}", "extra": "", "sec": "Part 04 · 4.1 Dermo-epidermal junction"}, {"id": "HIS-L3-059", "text": "Epidermal ridges & dermal papillae are extensive at the {{c1::fingertips}} and minimal over the {{c2::back}}", "extra": "", "sec": "Part 04 · 4.1 Dermo-epidermal junction"}, {"id": "HIS-L3-060", "text": "Dermis: {{c1::connective tissue}} underlying the epidermis, with a {{c2::papillary}} and a {{c3::reticular}} layer", "extra": "", "sec": "Part 04 · 4.2 The dermis"}, {"id": "HIS-L3-061", "text": "Dermis is rich in {{c1::blood vessels}} · {{c2::lymphatic vessels}} · {{c3::nerves}}; its derivatives: {{c4::hair follicles}} · {{c5::sebaceous glands}} · {{c6::sweat glands}}", "extra": "", "sec": "Part 04 · 4.2 The dermis"}, {"id": "HIS-L3-062", "text": "Sebaceous glands lie around the hair follicle (= {{c1::pilosebaceous unit}}) and open into the {{c2::hair follicle}}", "extra": "", "sec": "Part 05 · 5.1 Sebaceous glands"}, {"id": "HIS-L3-063", "text": "Sebaceous glands secrete {{c1::sebum}} (a lipid mixture) into the hair shaft for {{c2::lubrication}}; sebum {{c3::prevents evaporation}} & protects skin", "extra": "", "sec": "Part 05 · 5.1 Sebaceous glands"}, {"id": "HIS-L3-064", "text": "Sebaceous glands are present in {{c1::thin}} skin only", "extra": "They sit by the hair → only where there is hair.", "sec": "Part 05 · 5.1 Sebaceous glands"}, {"id": "HIS-L3-065", "text": "Sebaceous glands are {{c1::holocrine}}: cells full of lipid droplets {{c2::die & rupture}} to release sebum", "extra": "HOLocrine = the WHOLE cell is the secretion.", "sec": "Part 05 · 5.1 Sebaceous glands"}, {"id": "HIS-L3-066", "text": "{{c1::Acne}}: chronic inflammatory disease of the {{c2::sebaceous glands & hair follicles}}; one cause = impaction of {{c3::sebum & keratinous debris}} within follicles", "extra": "The most common disease seen by dermatologists.", "sec": "Part 05 · 5.1 Sebaceous glands"}, {"id": "HIS-L3-067", "text": "Acne starts most commonly at age {{c1::9–11}}, when rising {{c2::sex hormones}} stimulate the glands", "extra": "", "sec": "Part 05 · 5.1 Sebaceous glands"}, {"id": "HIS-L3-068", "text": "Sweat glands: present in {{c1::both thin & thick}} skin; develop as long {{c2::epidermal invaginations}} embedded in the dermis", "extra": "", "sec": "Part 05 · 5.2 Sweat glands"}, {"id": "HIS-L3-069", "text": "Sweat gland functions: {{c1::excretion of unwanted materials}} · {{c2::control of body temperature}}", "extra": "", "sec": "Part 05 · 5.2 Sweat glands"}, {"id": "HIS-L3-070", "text": "Epidermal appendage whose primary function is thermoregulation: {{c1::eccrine sweat glands}}", "extra": "Official key (Formative 3 Q16). Sebaceous glands lubricate; they don't regulate temperature.", "sec": "Part 05 · 5.2 Sweat glands"}, {"id": "HIS-L3-071", "text": "Sweat gland secretory unit: secretory cells + {{c1::myoepithelial cells}} on a basal lamina; duct lined by {{c2::stratified cuboidal}} epithelium (2 layers)", "extra": "", "sec": "Part 05 · 5.2 Sweat glands"}, {"id": "HIS-L3-072", "text": "Site — eccrine: all over the body, especially {{c1::palms & soles}}; apocrine: {{c2::axilla, pubic & perianal regions, areola of nipple}}", "extra": "", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-073", "text": "Apocrine sweat glands secrete by the {{c1::merocrine}} mechanism, in spite of their name", "extra": "Eccrine glands are merocrine too.", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-074", "text": "Hormonal control — eccrine: {{c1::no::yes or no}}; apocrine: {{c2::yes — they function at puberty}}", "extra": "", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-075", "text": "Secretory cells — eccrine: {{c1::dark}} · {{c2::clear}} · myoepithelial; apocrine (larger acini): {{c3::columnar}} · myoepithelial", "extra": "3 vs 2 cell types.", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-076", "text": "Duct lining — eccrine: {{c1::2–3 layers}} of cuboidal cells; apocrine: {{c2::one layer}} of cuboidal cells", "extra": "", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-077", "text": "Opens into — eccrine: {{c1::the epidermis}}; apocrine: {{c2::the hair follicle}}", "extra": "Eccrine = Everywhere, Epidermis, no Endocrine control · Apocrine = Armpit, At puberty, Attached to hair.", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-078", "text": "Secretion — eccrine: {{c1::watery & odourless}}; apocrine: {{c2::viscous}}, its odour from {{c3::bacterial decomposition}}", "extra": "The odour does not come from the secretion itself.", "sec": "Part 05 · 5.3 Eccrine vs apocrine glands"}, {"id": "HIS-L3-079", "text": "Hair grows from an invagination of epidermal tissue — the {{c1::hair follicle}}; hair is formed of {{c2::organized keratin}}", "extra": "", "sec": "Part 05 · 5.4 Hair & nails"}, {"id": "HIS-L3-080", "text": "The hair follicle is controlled by the {{c1::arrector (erector) pili}} muscle", "extra": "", "sec": "Part 05 · 5.4 Hair & nails"}, {"id": "HIS-L3-081", "text": "Nails: hard plates of keratinized epithelium — a modified stratum {{c1::corneum}}", "extra": "", "sec": "Part 05 · 5.4 Hair & nails"}, {"id": "HIS-L3-082", "text": "Hair shaft layers function qimg(q, ans){

function qtags(q){
  const t = [];

function opts(q, st, act){

  }).join('');
}
H.check = b => {

};

H.lab = (b, pg) => { const L = LABS[b.lab]; return L ? labHTML(L, pg) : ''; };
const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];
  if (L.labels.length >= 2) modes.push(['test', 'Test me'], ['find', 'Find it']);
  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);
    if (mode === 'test') return st.rev[l.id] ? 'on' : 'cv';
    if (mode === 'find') return st.fb && st.fb[2] === l.id ? st.fb[0] : 'cv';
    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);
    if (st.sel === l.id) return 'sel';
    return '';
  };
  const pad = (b, k) => `left:${(b.x - k).toFixed(2)}%;top:${(b.y - k * 1.6).toFixed(2)}%;width:${(b.w + 2 * k).toFixed(2)}%;height:${(b.h + 3.2 * k).toFixed(2)}%`;
  const boxes = L.labels.map(l => {
    const c = cls(l);
    // a numbered legend: the label is covered, the number on the picture is the spot to tap
    const lab = `<button class="sb ${l.m && mode === 'find' ? (c === 'cv' ? 'cv' : '') : c}" style="${pad(l, .35)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="${mode === 'test' || mode === 'find' ? 'covered label' : esc(l.t)}"></button>`;
    const mk = l.m ? `<button class="sb mk ${mode === 'find' ? (st.fb && st.fb[2] === l.id ? st.fb[0] : '') : (c === 'cv' ? '' : c)}" style="${pad(l.m, .6)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="number ${esc(l.n)}"></button>` : '';
    return lab + mk;
  }).join('');
  let info = '';
  if (mode === 'labels'){
    const l = L.labels.find(x => x.id === st.sel), m = l && slmus(L, l);
    info = m ? `<h4>${esc(m.name)}</h4>${esc(m.note || '')}<div class="muted" style="margin-top:.25em">Nerve: ${esc(m.nerves.map(n => (L.act.nerves.find(x => x.id === n) || {}).name).filter(Boolean).join(' + ') || 'not used as an answer in this book')}</div>`
      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`
      : l ? `<h4>${esc(l.t)}</h4>` : `<span class="muted">${L.act ? 'Tap a muscle label to see its action and nerve.' : L.labels.some(x => x.nv) ? 'Tap a nerve to see the muscles it supplies. "Test me" covers the labels; "Find it" asks you to find each one.' : L.labels.length >= 2 ? 'The labels as printed on the slide. "Test me" covers them; "Find it" asks you to find each one.' : 'The slide as shown in the practical.'}</span>`;
  } else if (mode === 'test'){
    info = `<span class="muted">Name each covered label, then tap it to check. Uncovered ${Object.keys(st.rev).length} of ${L.labels.length}.</span>`;
  } else if (mode === 'find'){
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    const t = L.labels.find(x => x.id === target);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Tap "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(t.t)}</h4>${st.fb && st.fb[0] === 'bad' ? `<div class="fb bad">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its ${t.m ? 'number on the picture' : 'covered label'} · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){
    const ms = L.labels.map(l => slmus(L, l)).filter(Boolean);
    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};
