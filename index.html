<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Helpers · Interactive Books</title>
<meta name="theme-color" content="#0b1f45"><link rel="icon" href="helpers_badge_64.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="common.css">
</head><body>
<div id="bar" hidden></div>
<div id="view"></div>
<script src="fb.js"></script>
<script src="hub.js"></script>
<script>
/* One card per semester. Change status to 'prog' or 'done' and give a url when a semester opens. */
const SEMS = [
  {n: 1, year: 1, status: 'soon', url: '', text: 'Not added yet.'},
  {n: 2, year: 1, status: 'soon', url: '', text: 'Not added yet.'},
  {n: 3, year: 2, status: 'prog', url: 'sem3/', text: 'MSK is finished, RES is in progress, CVS is coming soon.', color: '#2e86de'},
  {n: 4, year: 2, status: 'soon', url: '', text: 'Not planned yet.'},
  {n: 5, year: 3, status: 'soon', url: '', text: 'Not planned yet.'},
  {n: 6, year: 3, status: 'soon', url: '', text: 'Not planned yet.'},
  {n: 7, year: 4, status: 'soon', url: '', text: 'Not planned yet.'},
  {n: 8, year: 4, status: 'soon', url: '', text: 'Not planned yet.'},
  {n: 9, year: 5, status: 'soon', url: '', text: 'Not planned yet.'},
  {n: 10, year: 5, status: 'soon', url: '', text: 'Not planned yet.'}
];
const LAB = {done: 'Finished', prog: 'In progress', soon: 'Coming soon'}, view = document.getElementById('view'), bar = document.getElementById('bar');
const next = (() => { const n = new URLSearchParams(location.search).get('next'); return n && n.startsWith(Hub.ROOT) && n !== Hub.ROOT ? n : ''; })();
let shown = '';
function render(){
  const s = Hub.session;
  if (!s){
    bar.hidden = true; shown = 'welcome';
    view.innerHTML = `<div class="welcome"><div class="card"><img src="helpers_badge_192.png" alt="The Helpers">
      <h1>The Helpers<br>Interactive Books</h1><p>Every lecture as a book you can turn, tap and test yourself on.</p>
      <button class="btn" id="in">Continue with Google</button><button class="btn gh" id="guest">Continue as guest</button>
      ${Hub.err ? `<p class="or" style="color:var(--red)">${Hub.err}</p>` : ''}
      ${Hub.inApp ? '<p class="or"><b>This looks like an in-app browser.</b> Google blocks sign-in here. Open this page in Chrome or Safari to sign in.</p>' : ''}
      <p class="or"><b>With Google:</b> your progress follows you to every device, and you can join the leaderboard when it opens.</p>
      <p class="or"><b>As a guest:</b> everything works, but progress stays on this device only. You can sign in later from the account button.</p></div></div>`;
    document.getElementById('in').onclick = () => Hub.signIn(); document.getElementById('guest').onclick = () => Hub.guest();
    return;
  }
  if (next) return location.replace(next);
  if (shown === 'home') return; shown = 'home';
  bar.hidden = false; Hub.bar([]);
  const years = [...new Set(SEMS.map(x => x.year))];
  view.innerHTML = `<div class="wrap"><div class="hero"><small>The Helpers · MedSync</small><h1>Pick your semester</h1><p>Ten semesters, one shelf. Semesters open here as their books are built.</p></div>` +
    years.map(y => `<div class="yr">Year ${y}</div><div class="grid">` + SEMS.filter(x => x.year === y).map(x => { const open = x.status !== 'soon' && x.url;
      return `<${open ? `a href="${x.url}"` : 'div'} class="card mod ${open ? '' : 'soon'}" style="--c:${x.color || '#8c92a2'}"><span><span class="tag ${x.status}">${LAB[x.status]}</span></span><h2>Semester ${x.n}</h2><p>${x.text}</p><span class="go">${open ? 'Open the modules →' : 'Not open yet'}</span></${open ? 'a' : 'div'}>`; }).join('') + '</div>').join('') + '</div>';
  if (location.hash === '#settings') Hub.settings();
}
Hub.subs.push(render); render(); Hub.init();
</script></body></html>
