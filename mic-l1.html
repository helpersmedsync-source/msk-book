d": "l2"}], "src": "From the practical slides · Labs 1 & 2 – Skin & bone infections", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl187": {"id": "sl187", "type": "slide", "title": "Skin & bone infections · slide 14", "img": "prac/s187.jpg", "labels": [{"t": "Catalase Positive", "x": 15.06, "y": 93.25, "w": 14.21, "h": 4.14, "id": "l0"}, {"t": "non-hemolytic on blood agar", "x": 60.13, "y": 36.47, "w": 21.88, "h": 3.33, "id": "l1"}, {"t": "Diphtheroid in culture Gram stain palisade form", "x": 62.55, "y": 89.07, "w": 21.16, "h": 8.16, "id": "l2"}], "src": "From the practical slides · Labs 1 & 2 – Skin & bone infections", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl198": {"id": "sl198", "type": "slide", "title": "Skin & bone infections · slide 25", "img": "prac/s198.jpg", "labels": [{"t": "Laboratory identification of cutaneous candidiasis", "x": 15.52, "y": 4.62, "w": 47.65, "h": 4.07, "id": "l0"}, {"t": "Gram’s stained films of Candida", "x": 57.03, "y": 51.58, "w": 27.03, "h": 3.71, "id": "l1"}, {"t": "Germ tube test for Candida albicans", "x": 17.0, "y": 88.99, "w": 31.33, "h": 3.71, "id": "l2"}], "src": "From the practical slides · Labs 1 & 2 – Skin & bone infections", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl205": {"id": "sl205", "type": "slide", "title": "Identification of Streptococcus agalactia", "img": "prac/s205.jpg", "labels": [{"t": "Streptococcus in culture", "x": 22.62, "y": 48.5, "w": 20.61, "h": 3.71, "id": "l0"}, {"t": "β- haemolysis on bl ood agar", "x": 63.29, "y": 66.3, "w": 18.01, "h": 7.33, "id": "l1"}, {"t": "Bacitracin sensitivity : resistant to bacitracin", "x": 18.81, "y": 94.21, "w": 37.71, "h": 3.71, "id": "l2"}], "src": "From the practical slides · Labs 1 & 2 – Skin & bone infections", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl206": {"id": "sl206", "type": "slide", "title": "CAMP test", "img": "prac/s206.jpg", "labels": [{"t": "S. aureus", "x": 68.81, "y": 61.14, "w": 7.8, "h": 3.71, "id": "l0"}, {"t": "S. agalactia", "x": 17.46, "y": 66.97, "w": 9.99, "h": 3.71, "id": "l1"}, {"t": "S.pyogenes", "x": 69.76, "y": 86.95, "w": 9.68, "h": 3.71, "id": "l2"}], "src": "From the practical slides · Labs 1 & 2 – Skin & bone infections", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl214": {"id": "sl214", "type": "slide", "title": "Skin & bone infections · slide 41", "img": "prac/s214.jpg", "labels": [{"t": "Catalase test", "x": 39.73, "y": 94.16, "w": 15.33, "h": 5.18, "id": "l0"}, {"t": "Staphylococci in culture", "x": 64.52, "y": 55.42, "w": 16.48, "h": 9.78, "id": "l1"}, {"t": "Coagulase negative", "x": 66.76, "y": 95.05, "w": 14.91, "h": 3.33, "id": "l2"}], "src": "From the practical slides · Labs 1 & 2 – Skin & bone infections", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "MIC-L1-001", "text": "On the skin, the microbiota (normally harmless residents of the body) act as {{c1::biological anatomical barriers}}", "extra": "", "sec": "Part 01 · 1.1 Functions of the skin microbiota"}, {"id": "MIC-L1-002", "text": "Skin microbiota defence: {{c1::cover the binding sites (receptors) used for attachment}} · {{c2::consume available nutrients}} · {{c3::produce chemicals that interfere with the growth of other microbes}}", "extra": "Block · Starve · Poison. The first two prevent colonization; the third is chemical interference.", "sec": "Part 01 · 1.1 Functions of the skin microbiota"}, {"id": "MIC-L1-003", "text": "Gram-stain arrangement: grape-like clusters = {{c1::staphylococci}}; chains = {{c2::streptococci}}", "extra": "The arrangement is the first clue on a Gram stain.", "sec": "Part 01 · 1.2 Cocci — the three families"}, {"id": "MIC-L1-004", "text": "Staphylococci are Gram-positive spherical bacteria that produce {{c1::endopigments}}, varying from white to yellow", "extra": "", "sec": "Part 02 · 2.1 Three species — named by their pigment"}, {"id": "MIC-L1-005", "text": "Staph pigments: S. aureus {{c1::golden yellow}} · S. epidermidis {{c2::white}} · S. saprophyticus {{c3::lemon yellow}}", "extra": "Aureus = aurum = gold.", "sec": "Part 02 · 2.1 Three species — named by their pigment"}, {"id": "MIC-L1-006", "text": "S. aureus carriage: {{c1::40–50%}} of the population are nasal carriers; {{c2::15–20%}} of healthy adults are persistent nasopharyngeal carriers", "extra": "Carriers are more numerous among hospital staff.", "sec": "Part 02 · 2.2 Asymptomatic colonization of S. aureus"}, {"id": "MIC-L1-007", "text": "S. aureus colonizes {{c1::moist skin folds}} · {{c2::oropharynx}} · {{c3::gastrointestinal tract}} · {{c4::urogenital tract}}", "extra": "Some strains are normal flora of skin and mucous membranes.", "sec": "Part 02 · 2.2 Asymptomatic colonization of S. aureus"}, {"id": "MIC-L1-008", "text": "S. aureus morphology: Gram-positive cocci in clusters · {{c1::non-motile}} · {{c2::non-spore-forming}}", "extra": "", "sec": "Part 02 · 2.3 Staphylococcus aureus — the organism"}, {"id": "MIC-L1-009", "text": "S. aureus and St. pyogenes are both {{c1::non-capsulated}} — some strains have a {{c2::polysaccharide}} capsule", "extra": "Contrast: B. anthracis has a polypeptide capsule.", "sec": "Part 02 · 2.3 Staphylococcus aureus — the organism"}, {"id": "MIC-L1-010", "text": "S. aureus oxygen requirement: {{c1::facultative anaerobe}} (aerobic respiration or microaerophilic), at {{c2::37 °C}}", "extra": "", "sec": "Part 02 · 2.3 Staphylococcus aureus — the organism"}, {"id": "MIC-L1-011", "text": "S. aureus: catalase {{c1::positive::+ or −}} · coagulase {{c2::positive::+ or −}}", "extra": "Triple-positive staph: catalase +, coagulase +, mannitol fermenter.", "sec": "Part 02 · 2.3 Staphylococcus aureus — the organism"}, {"id": "MIC-L1-012", "text": "S. aureus on mannitol salt agar: {{c1::ferments mannitol}} — of differentiating value from other species", "extra": "Mannite fermenter.", "sec": "Part 02 · 2.3 Staphylococcus aureus — the organism"}, {"id": "MIC-L1-013", "text": "S. aureus tolerates {{c1::7–10%}} NaCl", "extra": "", "sec": "Part 02 · 2.3 Staphylococcus aureus — the organism"}, {"id": "MIC-L1-014", "text": "S. aureus enzymes: {{c1::coagulase}} · {{c2::catalase}} · {{c3::hyaluronidase}} · {{c4::DNase}} · {{c5::haemolysins}}", "extra": "", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-015", "text": "S. aureus coagulase → {{c1::localization of the staph infection}}", "extra": "So staph skin infections are focal; strep hyaluronidase spreads infection instead.", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-016", "text": "S. aureus toxins: {{c1::exfoliative toxin (epidermolytic toxins A & B)}} · {{c2::enterotoxins}} · {{c3::toxic shock syndrome toxin}}", "extra": "", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-017", "text": "The exfoliative (epidermolytic) toxins A & B of S. aureus cause {{c1::staphylococcal scalded skin syndrome (SSSS)}}", "extra": "They do NOT cause abscesses — localization (focal suppuration) is coagulase's work.", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-018", "text": "Staphylococcal toxic shock syndrome is caused by {{c1::toxic shock syndrome toxin}}", "extra": "Staff key TSST-1. Exfoliative toxin causes SSSS instead.", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-019", "text": "S. aureus pathogenicity = combined effect of {{c1::extracellular factors and enzymes}} together with {{c2::invasive properties}}", "extra": "", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-020", "text": "S. aureus invasion is due to {{c1::protein A}} and {{c2::clumping factor (bound coagulase)}}", "extra": "", "sec": "Part 02 · 2.4 Selected virulence factors"}, {"id": "MIC-L1-021", "text": "S. aureus direct smear: Gram-positive cocci in {{c1::grape-like clusters}} among {{c2::pus cells}}", "extra": "Specimen chosen according to the site of infection.", "sec": "Part 02 · 2.5 Laboratory identification of S. aureus"}, {"id": "MIC-L1-022", "text": "S. aureus culture: blood agar → {{c1::complete (β) haemolysis}}; nutrient agar → {{c2::golden-yellow endopigment}}", "extra": "", "sec": "Part 02 · 2.5 Laboratory identification of S. aureus"}, {"id": "MIC-L1-023", "text": "Tests to identify S. aureus colonies: {{c1::Gram stain}} · {{c2::catalase}} · {{c3::coagulase}} · {{c4::mannitol salt agar}}", "extra": "", "sec": "Part 02 · 2.5 Laboratory identification of S. aureus"}, {"id": "MIC-L1-024", "text": "The test used to identify / differentiate S. aureus: {{c1::coagulase test}} (positive)", "extra": "Catalase is + too, but catalase separates staph from strep — it does not single out S. aureus.", "sec": "Part 02 · 2.5 Laboratory identification of S. aureus"}, {"id": "MIC-L1-025", "text": "Catalase test separates {{c1::staphylococci (positive)}} from {{c2::streptococci (negative)}}", "extra": "Both S. aureus and St. pyogenes are β-haemolytic — catalase is what separates them.", "sec": "Part 08 · 8.2 Lab tests & stains at a glance"}, {"id": "MIC-L1-026", "text": "The Staphylococcus species behind folliculitis → carbuncle, SSSS and ~80% of impetigo: {{c1::S. aureus}}", "extra": "Staff Q1 (most common staph in skin infection). S. epidermidis & S. saprophyticus appear only in the pigment table.", "sec": "Part 03 · 3.1 Selected diseases caused by S. aureus"}, {"id": "MIC-L1-027", "text": "Characteristic staphylococcal skin infection: {{c1::focal suppuration}} — localized abscess, folliculitis, furuncle, carbuncle (pustules & boils)", "extra": "Because coagulase localizes the infection; widespread lesions = strep (hyaluronidase).", "sec": "Part 03 · 3.1 Selected diseases caused by S. aureus"}, {"id": "MIC-L1-028", "text": "S. aureus disease categories: focal suppuration · wound infections · deep infections = {{c1::bacteraemia}} · {{c2::osteomyelitis}} · {{c3::endocarditis}}", "extra": "", "sec": "Part 03 · 3.1 Selected diseases caused by S. aureus"}, {"id": "MIC-L1-029", "text": "S. aureus toxin-mediated diseases: {{c1::food poisoning}} · {{c2::SSSS}} · {{c3::toxic shock syndrome}}", "extra": "", "sec": "Part 03 · 3.1 Selected diseases caused by S. aureus"}, {"id": "MIC-L1-030", "text": "Folliculitis = infection of a {{c1::hair follicle}}: staphylococci on the skin surface grow into hair follicles and invade {{c2::sebaceous glands}}", "extra": "", "sec": "Part 03 · 3.2 Folliculitis → furuncle → carbuncle"}, {"id": "MIC-L1-031", "text": "Folliculitis is often called a {{c1::pimple}}; at the base of an eyelid it is called a {{c2::stye}}", "extra": "", "sec": "Part 03 · 3.2 Folliculitis → furuncle → carbuncle"}, {"id": "MIC-L1-032", "text": "Folliculitis spreading into the hypodermis (large, painful, raised nodule) = {{c1::furuncle}}; several furuncles joined together = {{c2::carbuncle}}", "extra": "Folliculitis → furuncle → carbuncle (abscesses in the subcutaneous layer).", "sec": "Part 03 · 3.2 Folliculitis → furuncle → carbuncle"}, {"id": "MIC-L1-033", "text": "Besides S. aureus, folliculitis can be caused by {{c1::Propionibacterium}} — the cause of acne", "extra": "Propionibacterium = Gram-positive diphtheroid; its lipases cause acne.", "sec": "Part 03 · 3.2 Folliculitis → furuncle → carbuncle"}, {"id": "MIC-L1-034", "text": "Staphylococcal folliculitis is transmitted by {{c1::contact}}", "extra": "Impetigo is likewise contagious.", "sec": "Part 03 · 3.2 Folliculitis → furuncle → carbuncle"}, {"id": "MIC-L1-035", "text": "SSSS affects primarily {{c1::infants & children under five}}; it can also affect the {{c2::elderly and immunosuppressed}}", "extra": "", "sec": "Part 03 · 3.3 Staphylococcal scalded skin syndrome (SSSS)"}, {"id": "MIC-L1-036", "text": "SSSS: exfoliative toxins A & B are carried by the {{c1::blood}} from sites of infection throughout the body → {{c2::toxaemia}}", "extra": "So peeling spreads far beyond the site of infection.", "sec": "Part 03 · 3.3 Staphylococcal scalded skin syndrome (SSSS)"}, {"id": "MIC-L1-037", "text": "SSSS lesion: cells of the {{c1::outer epidermis}} separate from one another and from the underlying tissue", "extra": "", "sec": "Part 03 · 3.3 Staphylococcal scalded skin syndrome (SSSS)"}, {"id": "MIC-L1-038", "text": "SSSS course: reddening & wrinkling beginning near the {{c1::mouth}} → spreads over the entire body → within {{c2::two days}} the outer epidermis peels off in {{c3::sheets}}", "extra": "", "sec": "Part 03 · 3.3 Staphylococcal scalded skin syndrome (SSSS)"}, {"id": "MIC-L1-039", "text": "SSSS heals in {{c1::7–10 days}} with {{c2::no scarring}}, because the toxin does not affect the {{c3::dermis}}", "extra": "", "sec": "Part 03 · 3.3 Staphylococcal scalded skin syndrome (SSSS)"}, {"id": "MIC-L1-040", "text": "Impetigo (pyoderma): a contagious {{c1::superficial}} skin infection — small, flattened, red patches mainly on the {{c2::face and limbs}}", "extra": "", "sec": "Part 03 · 3.4 Impetigo (pyoderma)"}, {"id": "MIC-L1-041", "text": "Impetigo occurs particularly in {{c1::children}}, because their {{c2::immune systems are incompletely developed}}", "extra": "Quiz T/F \"most commonly affects adults\" = False.", "sec": "Part 03 · 3.4 Impetigo (pyoderma)"}, {"id": "MIC-L1-042", "text": "Impetigo progression: red patches → oozing, {{c1::pus-filled vesicles}} → vesicles break → thick, sticky, {{c2::honey-coloured}} crust", "extra": "", "sec": "Part 03 · 3.4 Impetigo (pyoderma)"}, {"id": "MIC-L1-043", "text": "Impetigo causes: S. aureus acting alone ≈ {{c1::80%}}; involving St. pyogenes ≈ {{c2::20%}}", "extra": "", "sec": "Part 03 · 3.4 Impetigo (pyoderma)"}, {"id": "MIC-L1-044", "text": "Streptococci are classified by: {{c1::oxygen requirement}} → {{c2::haemolysis on blood agar}} → {{c3::cell-wall carbohydrate}} (β-haemolytic)", "extra": "", "sec": "Part 04 · 4.1 Classification of streptococci"}, {"id": "MIC-L1-045", "text": "The obligate (strict) anaerobic streptococci: {{c1::Peptostreptococcus}}", "extra": "All others are aerobic & facultative anaerobic.", "sec": "Part 04 · 4.1 Classification of streptococci"}, {"id": "MIC-L1-046", "text": "Streptococci by haemolysis on blood agar: {{c1::β-haemolytic}} · {{c2::α-haemolytic}} · {{c3::non-haemolytic}}", "extra": "", "sec": "Part 04 · 4.1 Classification of streptococci"}, {"id": "MIC-L1-047", "text": "Cell-wall carbohydrate of β-haemolytic streptococci → groups {{c1::A–H and K–U}}; groups causing human disease: {{c2::A, B, C, D and G}}", "extra": "", "sec": "Part 04 · 4.1 Classification of streptococci"}, {"id": "MIC-L1-048", "text": "β-haemolytic group A = {{c1::St. pyogenes}}; β-haemolytic group B = {{c2::St. agalactiae}}", "extra": "", "sec": "Part 04 · 4.1 Classification of streptococci"}, {"id": "MIC-L1-049", "text": "St. pyogenes morphology: Gram-positive cocci in chains · non-motile · non-spore-forming; colonies {{c1::small}}", "extra": "S. aureus colonies: round, raised, golden.", "sec": "Part 04 · 4.2 Streptococcus pyogenes — the organism"}, {"id": "MIC-L1-050", "text": "St. pyogenes {{c1::does not grow}} on ordinary media (nutrient agar) — it requires an {{c2::enriched medium (blood agar)}}", "extra": "S. aureus grows on nutrient agar with golden pigment.", "sec": "Part 04 · 4.2 Streptococcus pyogenes — the organism"}, {"id": "MIC-L1-051", "text": "Identification of St. pyogenes: catalase {{c1::negative}} · bacitracin {{c2::sensitive}} · blood agar {{c3::complete (β) haemolysis}}", "extra": "Group A = bAcitracin sensitive.", "sec": "Part 04 · 4.8 Identification of St. pyogenes"}, {"id": "MIC-L1-052", "text": "St. pyogenes virulence factors: {{c1::streptolysins S & O}} · {{c2::M protein}} · {{c3::hyaluronidase}} · {{c4::streptokinase}} · {{c5::pyrogenic (erythrogenic) exotoxins}}", "extra": "", "sec": "Part 04 · 4.3 Selected virulence factors & their effects"}, {"id": "MIC-L1-053", "text": "The streptolysin that gives the haemolysis on blood agar: streptolysin {{c1::S}}", "extra": "S = Seen on the plate. Also kills neutrophils & erythrocytes (necrotizing fasciitis figure).", "sec": "Part 04 · 4.3 Selected virulence factors & their effects"}, {"id": "MIC-L1-054", "text": "St. pyogenes M protein → {{c1::virulence and invasion}}; it helps the organism {{c2::survive phagocytosis}}", "extra": "", "sec": "Part 04 · 4.3 Selected virulence factors & their effects"}, {"id": "MIC-L1-055", "text": "Localize vs spread: St. pyogenes {{c1::hyaluronidase}} is a spreading factor; S. aureus {{c2::coagulase}} localizes the infection", "extra": "So staph skin lesions stay focal: abscess, furuncle, carbuncle.", "sec": "Part 04 · 4.3 Selected virulence factors & their effects"}, {"id": "MIC-L1-056", "text": "Pyrogenic exotoxins (= {{c1::erythrogenic}} exotoxins) are produced only by {{c2::lysogenic}} streptococci, coded by {{c3::phage DNA}}", "extra": "", "sec": "Part 04 · 4.3 Selected virulence factors & their effects"}, {"id": "MIC-L1-057", "text": "St. pyogenes local infections: {{c1::impetigo}} · {{c2::acute follicular tonsillitis}} · {{c3::sore throat}} · {{c4::pharyngitis}}", "extra": "", "sec": "Part 04 · 4.4 Diseases caused by St. pyogenes"}, {"id": "MIC-L1-058", "text": "St. pyogenes invasive infections: {{c1::erysipelas}} · {{c2::cellulitis}} · {{c3::puerperal sepsis}} · {{c4::acute endocarditis}} · {{c5::necrotizing fasciitis}}", "extra": "", "sec": "Part 04 · 4.4 Diseases caused by St. pyogenes"}, {"id": "MIC-L1-059", "text": "Post-streptococcal diseases of St. pyogenes: {{c1::rheumatic fever}} · {{c2::glomerulonephritis}}", "extra": "Scarlet fever is toxigenic, not post-streptococcal. Strep impetigo → acute glomerulonephritis.", "sec": "Part 04 · 4.4 Diseases caused by St. pyogenes"}, {"id": "MIC-L1-060", "text": "The toxigenic disease of St. pyogenes: {{c1::scarlet fever}}", "extra": "Its toxins: pyrogenic (erythrogenic) exotoxins.", "sec": "Part 04 · 4.4 Diseases caused by St. pyogenes"}, {"id": "MIC-L1-061", "text": "Scarlet fever (sore throat, fever, red rash) — organism: {{c1::St. pyogenes (β-haemolytic group A)}}; cause of the rash: its {{c2::erythrogenic (pyrogenic) exotoxins}}", "extra": "Staff case. These toxins come only from lysogenic strains (phage DNA).", "sec": "Part 04 · 4.4 Diseases caused by St. pyogenes"}, {"id": "MIC-L1-062", "text": "Impetigo caused by {{c1::St. pyogenes}} is the more dangerous one — it may be followed by {{c2::acute glomerulonephritis}}", "extra": "S. aureus causes most impetigo (≈ 80%); strep (≈ 20%) is the dangerous one.", "sec": "Part 04 · 4.5 Impetigo — staph or strep?"}, {"id": "MIC-L1-063", "text": "Erysipelas cause: bacterial inoculation into an area of {{c1::skin trauma}}; most common sites: {{c2::face or legs}}", "extra": "", "sec": "Part 04 · 4.6 Erysipelas"}, {"id": "MIC-L1-064", "text": "Erysipelas involves the {{c1::upper dermis}} and {{c2::superficial lymphatics}}", "extra": "Necrotizing fasciitis = subcutaneous tissue & fascia.", "sec": "Part 04 · 4.6 Erysipelas"}, {"id": "MIC-L1-065", "text": "Erysipelas features: reddening of the skin · {{c1::swollen local lymph nodes}} · pain · fever · chills · {{c2::leukocytosis}}", "extra": "", "sec": "Part 04 · 4.6 Erysipelas"}, {"id": "MIC-L1-066", "text": "Erysipelas diagnosis: {{c1::blood cultures}} (may identify sepsis) · {{c2::ASO test}}", "extra": "", "sec": "Part 04 · 4.6 Erysipelas"}, {"id": "MIC-L1-067", "text": "Necrotizing fasciitis (streptococcal gangrene): progressive infection of {{c1::subcutaneous tissue and fascia}} with {{c2::rapid necrosis}}", "extra": "", "sec": "Part 04 · 4.7 Necrotizing fasciitis (streptococcal gangrene)"}, {"id": "MIC-L1-068", "text": "St. pyogenes causing necrotizing fasciitis has been termed \"{{c1::flesh-eating bacteria}}\"", "extra": "", "sec": "Part 04 · 4.7 Necrotizing fasciitis (streptococcal gangrene)"}, {"id": "MIC-L1-069", "text": "Necrotizing fasciitis figure: {{c1::exotoxin A}} triggers an overactive immune response that further damages healthy tissue", "extra": "Same figure: M proteins resist phagocytosis; streptolysin S kills neutrophils & erythrocytes.", "sec": "Part 04 · 4.7 Necrotizing fasciitis (streptococcal gangrene)"}, {"id": "MIC-L1-070", "text": "Acne is caused by {{c1::Propionibacterium}}, a microaerophilic {{c2::diphtheroid}}", "extra": "It can also cause folliculitis.", "sec": "Part 05 · 5.1 Acne — Propionibacterium"}, {"id": "MIC-L1-071", "text": "Propionibacterium morphology: Gram-{{c1::positive}} bacilli in {{c2::palisade or paired in angles}}", "extra": "", "sec": "Part 05 · 5.1 Acne — Propionibacterium"}, {"id": "MIC-L1-072", "text": "Acne mechanism: Propionibacterium {{c1::lipases}} split {{c2::free fatty acids}} from skin lipid → the fatty acids trigger {{c3::inflammation}}", "extra": "", "sec": "Part 05 · 5.1 Acne — Propionibacterium"}, {"id": "MIC-L1-073", "text": "Cat scratch disease: {{c1::Bartonella henselae}}, a Gram-{{c2::negative}} aerobic bacillus", "extra": "Think kittens — and fleas.", "sec": "Part 05 · 5.2 Cat scratch disease — Bartonella henselae"}, {"id": "MIC-L1-074", "text": "Bartonella henselae main virulence factor: {{c1::endotoxin (lipid A)}} in the outer membrane, released when the bacterium {{c2::dies}}", "extra": "", "sec": "Part 05 · 5.2 Cat scratch disease — Bartonella henselae"}, {"id": "MIC-L1-075", "text": "Bartonella henselae grows & reproduces inside {{c1::red blood cells}} and {{c2::cells lining blood-vessel walls}}", "extra": "It also grows intracellularly in the skin.", "sec": "Part 05 · 5.2 Cat scratch disease — Bartonella henselae"}, {"id": "MIC-L1-076", "text": "Bartonella henselae transmission (cats → people): {{c1::cat scratches or bites, particularly by kittens}} · {{c2::blood-sucking arthropods such as fleas}}", "extra": "A bacterium passed from animals to humans.", "sec": "Part 05 · 5.2 Cat scratch disease — Bartonella henselae"}, {"id": "MIC-L1-077", "text": "Cat scratch disease: endotoxin → fever, blood clotting, inflammation and {{c1::localized swelling at the site and nearby lymph nodes}}, lasting {{c2::several months}}", "extra": "", "sec": "Part 05 · 5.2 Cat scratch disease — Bartonella henselae"}, {"id": "MIC-L1-078", "text": "Rocky Mountain spotted fever: {{c1::Rickettsia rickettsii}} — a small, non-motile, aerobic, Gram-negative, {{c2::obligate intracellular}} bacterium", "extra": "", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-079", "text": "R. rickettsii wall: peptidoglycan cell wall + outer membrane of {{c1::lipopolysaccharide}}, surrounded by a {{c2::slime layer}}", "extra": "", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-080", "text": "Rickettsiae do not Gram stain well — they are stained by {{c1::Giemsa}} stain", "extra": "", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-081", "text": "RMSF vector: {{c1::hard tick}}; reservoir: {{c2::horses & dogs}}", "extra": "R. rickettsii requires a vector between hosts.", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-082", "text": "In the tick, males infect females during mating and females pass R. rickettsii to the eggs in their ovaries = {{c1::transovarian transmission}}", "extra": "", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-083", "text": "RMSF transmission to humans: {{c1::tick bite}} · {{c2::contamination of abrasions by fresh tick faeces}}", "extra": "Never crush ticks between the fingers.", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-084", "text": "The tick introduces R. rickettsii in its saliva only after feeding for at least {{c1::six hours}}", "extra": "", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-085", "text": "RMSF rash: R. rickettsii damages {{c1::endothelial cells}} → blood leaks into tissues → {{c2::petechiae}}", "extra": "", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-086", "text": "RMSF diagnosis: {{c1::blood culture or skin biopsy at the rash site}} to isolate the organism · {{c2::rickettsial agglutination}} (patient serum + rickettsia suspension)", "extra": "Agglutination = positive.", "sec": "Part 05 · 5.3 Rocky Mountain spotted fever (RMSF)"}, {"id": "MIC-L1-087", "text": "Genus Bacillus: large, aerobic, Gram-positive, {{c1::spore-forming}} bacilli", "extra": "", "sec": "Part 06 · 6.1 The Bacillus group"}, {"id": "MIC-L1-088", "text": "Bacillus group: pathogenic = {{c1::B. anthracis}} (anthrax); saprophytic = {{c2::anthracoids}}, some pathogenic, e.g. {{c3::B. cereus}} (food poisoning)", "extra": "Some anthracoids cause disease in the immunocompromised (conjunctivitis).", "sec": "Part 06 · 6.1 The Bacillus group"}, {"id": "MIC-L1-089", "text": "Anthrax is primarily a disease of {{c1::farm (herbivorous) animals}} — cattle, sheep, horses, goats — transmitted to humans = a {{c2::zoonosis}}", "extra": "Bartonella henselae (cats → people) is the other animal-to-human bacterium of the lecture.", "sec": "Part 06 · 6.2 Anthrax — a zoonosis"}, {"id": "MIC-L1-090", "text": "B. anthracis virulence factors: {{c1::capsule}} · {{c2::endospores}} · {{c3::3 anthrax toxins}}", "extra": "", "sec": "Part 06 · 6.2 Anthrax — a zoonosis"}, {"id": "MIC-L1-091", "text": "Most common form of anthrax: {{c1::cutaneous}} — direct contact of {{c2::abraded skin}} with endospores of infected animals or contaminated animal products", "extra": "", "sec": "Part 06 · 6.2 Anthrax — a zoonosis"}, {"id": "MIC-L1-092", "text": "Anthrax forms by route: intestinal = {{c1::ingestion of raw meat or blood}}; pulmonary = {{c2::inhalation of anthrax spores}}", "extra": "Touch – Eat – Breathe = skin – gut – lung const LS = {};

function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }

LAB.graph = L => {
  const st = gstate(L);

    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';

    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;

    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');

    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>

  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find'){ if (st.qi >= st.order.length) return; const t = st.order[st.qi];
    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }
    else st.fb = ['bad', 'Not that one. Try again.', id, t]; }
  else st.sel = st.sel === id ? null : id;
  slre(a); };
A.slmv = a => { const st = slst(LABS[a.dataset.l]); st.mv = st.mv === a.dataset.id ? null : a.dataset.id; slre(a); };
A.slcut = a => { const st = slst(LABS[a.dataset.l]); st.cut[a.dataset.id] = !st.cut[a.dataset.id]; slre(a); };
A.slbig = a => { const L = LABS[a.dataset.l]; ov(L.title || 'Practical slide', `<div class="slbig" data-big="${L.id}">${LAB.slide(L, true)}</div>`, 'wide'); };
function slre(a){
  const big = a.closest('[data-big]');
  if (big){ big.innerHTML = LAB.slide(LABS[big.dataset.big], true); const i = pageOf(document.querySelector(`#pgL [data-l="${big.dataset.big}"], #pgR [data-l="${big.dataset.big}"]`) || document.body); if (i >= 0) rerender(i); return; }
  rerender(pageOf(a));
}
A.dmode = a => { const L = LABS[a.dataset.l], st = LS[L.id]; st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(L.pins.map(p => p.id), String(Date.now())); rerender(pageOf(a)); };
A.pin = a => { const L = LABS[a.dataset.l], st = LS[L.id], id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find' && st.qi < st.order.length){ const t = st.order[st.qi];
    if (id === t){ st.score += st.fb && st.fb[0] === 'bad' && st.fb[3] === t ? 0 : 1; st.qi++; st.fb = ['ok', '✓ Correct', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; rerender(pageOf(document.querySelector(`[data-l="${L.id}"]`) || a)); } }, 700); }
    else st.fb = ['bad', 'That is ' + L.pins.find(p => p.id === id).name + '. Try again.', id, t]; }
  rerender(pageOf(a)); };

/* ---------- overlays ---------- */
function ov(title, body, cls){
  $('#ovs').innerHTML = `<div class="ov" data-act="ovbg"><div class="panel ${cls || ''}" role="dialog" aria-label="${esc(title)}"><div class="ph"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="pb" id="pbody">${body}</div></div></div>`;
}
function closeOv(){ $('#ovs').innerHTML = ''; if (!opened) home(); }
A.close = closeOv;
A.ovbg = (a, e) => { if (e.target === a) closeOv(); };
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1500); }

// contents
A['open-toc'] = () => {
  const items = BOOK.pages.map((p, i) => [p, i]).filter(([p]) => p.toc);
  const labs = BOOK.pages.map((p, i) => [p, i]).filter(([p]) => p.kind === 'lab');
  const marks = Object.keys(S.marks).map(Number).sort((a, b) => a - b);
  ov('Contents', `${BOOK.lib ? `<div class="endnav" style="margin-top:0"><a href="${esc(BOOK.lib)}"><span><small>The MSK book</small>All subjects and lectures</span><span>≡</span></a></div>` : ''}<div class="lst">${items.map(([p, i]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span><b>${esc(p.toc[0])}</b> · ${esc(p.toc[1])}</span></button>`).join('')}</div>
   <h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Labs</h3><div class="lst">${labs.map(([p, i]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>${esc(p.labName || p.head)}</span></button>`).join('')}</div>
   <h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Bookmarks</h3>${marks.length ? `<div class="lst">${marks.map(i => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>${esc(BOOK.pages[i].head || 'Page ' + i)}</span></button>`).join('')}</div>` : '<p class="muted">No bookmarks yet. Tap the ribbon at the top of a page.</p>'}`);
};
// search
function pageText(p){ const out = []; (p.blocks || []).forEach(b => { ['title', 'html', 'sub', 'hook'].forEach(k => { if (typeof b[k] === 'string') out.push(b[k]); }); if (b.items) out.push(b.items.join(' ')); if (b.rows) out.push(b.rows.flat().join(' ')); if (b.q && QS[b.q]) out.push(QS[b.q].stem); if (b.lab && LABS[b.lab]) out.push(LABS[b.lab].title + ' ' + LABS[b.lab].intro); }); return out.join(' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' '); }
const PT = BOOK.pages.map(pageText);
A['open-search'] = () => { ov('Search the book', `<input class="srch" id="sq" type="search" placeholder="${esc(BOOK.searchHint || 'Search this lecture')}" aria-label="Search"><div class="lst" id="sres"></div>`);
  const inp = $('#sq'); inp.focus(); inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase(); const r = $('#sres');
    if (q.length < 2){ r.innerHTML = ''; return; }
    const hits = [];
    PT.forEach((t, i) => { const j = t.toLowerCase().indexOf(q); if (j >= 0) hits.push([i, t.slice(Math.max(0, j - 40), j + q.length + 60)]); });
    r.innerHTML = hits.length ? hits.map(([i, s]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>…${esc(s)}…</span></button>`).join('') : '<p class="muted">Nothing found.</p>';
  }); };
// settings
A['open-set'] = () => {
  const seg = (k, vals) => `<div class="seg">${vals.map(([v, n]) => `<button class="${String(S.set[k]) === String(v) ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>`;
  ov('Settings', `<div class="setrow"><span>Theme</span>${seg('theme', [['system', 'Auto'], ['light', 'Day'], ['dark', 'Night']])}</div>
   <div class="setrow"><span>Text size</span>${seg('size', [[0.9, 'S'], [1, 'M'], [1.15, 'L']])}</div>
   <div class="setrow"><span>Rapid revision<br><small class="muted">Hides running text; keeps tables, notes, questions and labs.</small></span>${seg('rapid', [[false, 'Off'], [true, 'On']])}</div>
   <div class="setrow"><span>Progress<br><small class="muted">Saved in this browser only.</small></span><button class="btn" data-act="reset">Reset all progress</button></div>`);
};
A.set = a => { let v = a.dataset.v; if (a.dataset.k === 'size') v = +v; if (a.dataset.k === 'rapid') v = v === 'true'; S.set[a.dataset.k] = v; save(); applySet(); A['open-set'](); if (opened) draw(); };
A.reset = a => { if (a.dataset.sure){ S = JSON.parse(JSON.stringify(DEF)); for (const k in LS) delete LS[k]; save(); applySet(); closeOv(); toast('Progress reset'); if (opened) draw(); } else { a.dataset.sure = 1; a.textContent = 'Tap again to confirm'; } };

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
