<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSK Book">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>MSK Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}
.op[disabled]{cursor:default}
.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}

mission:", "direct contact or autoinoculation"], ["Clinical:", "cutaneous warts, genital warts, oral papilloma"]]}]}], "labName": "Recall · Coxsackie & HPV"}, {"id": "p46", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-MIC-L2-06"}]}, {"id": "p47", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-MIC-L2-11"}, {"t": "flap", "q": "Q0368"}]}, {"id": "p48", "head": "Part 07 · Viruses Compared", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Viruses Compared", "sub": "Genome & envelope at a glance · Transmission routes at a glance · Clue → answer"}, {"t": "h", "no": "7.1", "title": "Genome & envelope at a glance"}, {"t": "list", "items": ["<b>Enveloped DNA:<\/b> herpesviruses, variola, molluscum contagiosum", "<b>Non-enveloped DNA:<\/b> HPV", "<b>ssRNA:<\/b> measles (Paramyxoviridae), rubella; enterovirus: Coxsackie"]}, {"t": "h", "no": "7.2", "title": "Transmission routes at a glance"}, {"t": "list", "items": ["<b>Sexual:<\/b> <mark>HSV-2<\/mark>, molluscum; blood transfusion: <mark>parvovirus B19<\/mark>; faecal–oral: Coxsackie A", "<b>Mother→fetus:<\/b> <mark>HSV-2<\/mark>, <mark>monkeypox<\/mark>, B19, <mark>rubella<\/mark>", "<b>Reactivation (not contact):<\/b> shingles, recurrent HSV"]}], "toc": ["07", "Viruses Compared"]}, {"id": "p49", "head": "Part 07 · Viruses Compared", "kind": "text", "blocks": [{"t": "h", "no": "7.3", "title": "Clue → answer"}, {"t": "list", "items": ["Trigeminal → HSV-1; sacral → HSV-2; dorsal root ganglia → VZV", "Koplik's spots → measles; slapped cheek → B19; umbilicated nodules → molluscum"]}]}, {"id": "p50", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-mic-l2-6-0", "title": "Recall · Viruses Compared", "groups": [{"title": "7.1 Genome & envelope at a glance", "items": [["Enveloped DNA:", "herpesviruses, variola, molluscum contagiosum"], ["Non-enveloped DNA:", "HPV"], ["ssRNA:", "measles (Paramyxoviridae), rubella; enterovirus: Coxsackie"]]}, {"title": "7.2 Transmission routes at a glance", "items": [["Sexual:", "HSV-2, molluscum; blood transfusion: parvovirus B19; faecal–oral: Coxsackie A"], ["Mother→fetus:", "HSV-2, monkeypox, B19, rubella"], ["Reactivation (not contact):", "shingles, recurrent HSV"]]}, {"title": "7.3 Clue → answer", "items": [["Trigeminal →", "HSV-1; sacral → HSV-2; dorsal root ganglia → VZV"], ["Koplik's spots →", "measles; slapped cheek → B19; umbilicated nodules → molluscum"]]}]}], "labName": "Recall · Viruses Compared"}, {"id": "p51", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps · The \"only\" & number facts"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Q&amp;A recap of herpes, pox, parvo, measles, rubella, Coxsackie, HPV"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["Belt rule; CentriFugal flees trunk vs CentriPetal pulled to trunk; Coxsackie A = All three sites"]}, {"t": "h", "no": "8.3", "title": "The \"only\" & number facts"}, {"t": "list", "items": ["<b>Largest viruses:<\/b> Poxviridae; only significant human parvovirus: B19", "<b>Smallpox &amp; molluscum:<\/b> humans only; 2 smallpox repositories; 85% monkeypox protection"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p52", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-mic-l2-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Q&amp;A recap of herpes", "pox, parvo, measles, rubella, Coxsackie, HPV"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["Belt rule; CentriFugal flees trunk", "vs CentriPetal pulled to trunk; Coxsackie A = All three sites"]]}, {"title": "8.3 The \"only\" & number facts", "items": [["Largest viruses:", "Poxviridae; only significant human parvovirus: B19"], ["Smallpox &amp; molluscum:", "humans only; 2 smallpox repositories; 85% monkeypox protection"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p53", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Latent HSV: no clinical manifestation, yet persists for life"}, {"t": "note", "kind": "trap", "html": "Shingles not caught from chickenpox/zoster patients — own latent virus reactivates"}, {"t": "note", "kind": "trap", "html": "Smallpox &amp; chickenpox share transmission; differ in distribution, site, family, lesion depth"}, {"t": "note", "kind": "trap", "html": "HPV is non-enveloped; herpes, variola &amp; molluscum are enveloped"}, {"t": "note", "kind": "trap", "html": "Gingivostomatitis heals without scar; smallpox ends with permanent scar"}, {"t": "note", "kind": "trap", "html": "Herpes whitlow can come from HSV-2 (genitals → hands)"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p54", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Smallpox has no animal reservoir"}, {"t": "note", "kind": "trap", "html": "Monkeypox rash favours face &amp; extremities, not trunk"}, {"t": "note", "kind": "trap", "html": "Measles is diagnosed clinically"}, {"t": "note", "kind": "cl", "html": "HSV-1 whitlow often contracted by health care workers"}, {"t": "note", "kind": "cl", "html": "Rubella vaccine for girls before marriage — virus crosses placenta → fetal damage"}, {"t": "note", "kind": "cl", "html": "Smallpox a biological threat: many unvaccinated, no treatment, stocks concern"}]}, {"id": "p55", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0316": {"id": "Q0316", "stem": "What is the name of the herpes simplex skin infection of the fingers?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The pamphlet lists herpes whitlow as the HSV skin infection of the hand, caused by implantation of the virus into the fingers. Eczema herpeticum is a different form: a severe cutaneous herpes in children with atopic eczema.", "type": "written", "keyhtml": "Herpes (herpetic) whitlow — hand infection with HSV due to implantation of the virus into the fingers.\n• It can also be caused by transfer of HSV-2 from the genitals to the hands.\n• HSV-1 whitlow is often contracted by health care workers who come in contact with the virus."}, "Q0317": {"id": "Q0317", "stem": "What is the spot diagnosis of chickenpox?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The pamphlet's spot diagnosis of chickenpox is a centripetal rash (face and trunk first) plus polymorphic lesions. Smallpox differs: its rash is centrifugal and most common on the extremities.", "type": "written", "keyhtml": "• Characteristic centripetal rash: it starts on the face and trunk, then spreads to the extremities.\n• Polymorphic lesions: macules, papules, vesicles and pustules are present together."}, "Q0318": {"id": "Q0318", "stem": "What is the vaccine used against variola (smallpox) virus?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Smallpox is prevented by vaccination with vaccinia virus, a live attenuated avirulent variola, given by skin scarification. Vaccination provides life-long immunity, one of the causes of the successful eradication of smallpox.", "type": "written", "keyhtml": "Vaccinia virus — a live attenuated avirulent variola that induces immunity to smallpox.\n• Administered by skin scarification."}, "Q0339": {"id": "Q0339", "stem": "Compare smallpox and chickenpox.", "top": true, "rep": "asked 2 years", "tag": "Final bank MIC W6", "bank": true, "expl": "The two share droplet and contact transmission; they differ in rash distribution, common site, virus family and depth of lesions (4.4). The outcome row comes from the variola (4.2) and chickenpox (3.1) tables.", "type": "written", "keyhtml": "Feature: smallpox | chickenpox\n• Cause: smallpox (variola) virus | varicella virus\n• Transmission: droplet, contact | droplet, contact\n• Rash distribution: centrifugal | centripetal\n• Common site: extremities | trunk\n• Virus family: Orthopoxviridae | Herpesviridae\n• Affected part: deep, hard lesions | superficial lesions\n• Outcome: lesions progress to pustules and crust and end with a permanent scar | full recovery, but the virus remains latent in the dorsal root ganglia"}, "Q0341": {"id": "Q0341", "stem": "Smallpox is transmitted by which of the following routes?", "top": false, "rep": "", "tag": "Final bank MIC Q18", "bank": true, "expl": "Smallpox spreads by the respiratory route or by contact with dried crusts from skin lesions. Transplacental spread is described for other viruses in this lecture (HSV-2, monkeypox, parvovirus B19, rubella), not for variola.", "type": "mcq", "opts": ["Contact", "Transplacental", "Sexually", "Food-borne", "Insect bite"], "ans": 0}, "Q0342": {"id": "Q0342", "stem": "Measles is an infection that is also known as rubeola. Identify the causative agent and mode of transmission of measles.", "top": false, "rep": "", "tag": "Final bank MIC Q19", "bank": true, "expl": "Measles (rubeola) is caused by a single-stranded RNA virus of the Paramyxoviridae family and is transmitted by droplets. It is a virus, not a bacterium, and the pamphlet places it in Paramyxoviridae, not Orthomyxoviridae.", "type": "mcq", "opts": ["Bacteria belongs to Streptococcaceae family, spreads through water", "Bacteria belongs to Enterobacteriaceae family, spreads through air", "Virus belongs to family Paramyxoviridae, spreads through air", "Virus belongs to family Orthomyxoviridae, spreads through water"], "ans": 2}, "Q0347": {"id": "Q0347", "stem": "Vaccinia virus gives lifelong immunity against smallpox.", "top": true, "rep": "asked 3 years", "tag": "Final bank MIC Q17", "bank": true, "expl": "Smallpox is prevented by vaccination with vaccinia virus (live attenuated avirulent variola) given by skin scarification. Life-long immunity from vaccination is one of the three causes of the successful eradication of smallpox, with no latent carriers and only one stable serotype.", "type": "mcq", "opts": ["True", "False"], "ans": 0}, "Q0364": {"id": "Q0364", "stem": "What is the genetic material of herpesviruses?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The pamphlet defines herpesviruses as enveloped DNA viruses with an icosahedral symmetry capsid; herpes is also an oncogenic virus.", "type": "written", "keyhtml": "DNA — herpesviruses are enveloped DNA viruses with an icosahedral capsid."}, "Q0365": {"id": "Q0365", "stem": "Mention the site of latency of HSV-1 and HSV-2.", "top": false, "rep": "", "tag": "Final bank MIC W7", "bank": true, "expl": "Both sites are given in the HSV-1 vs HSV-2 table, with the latent-infection pattern in 2.2. Belt rule: HSV-1 lives above the belt, HSV-2 below it.", "type": "written", "keyhtml": "• HSV-1: trigeminal ganglia (above the belt — oral herpes).\n• HSV-2: sacral ganglia (below the belt — genital herpes).\nAfter the primary infection the virus travels up the sensory nerves to these ganglia and persists for life with no clinical manifestation."}, "Q0366": {"id": "Q0366", "stem": "What is the difference between chickenpox and shingles?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Varicella zoster causes both diseases: chickenpox is the primary illness and shingles is reactivation of the virus left latent after it. Shingles therefore comes from the patient's own latent virus, not from contact with a case.", "type": "written", "keyhtml": "• Chickenpox (varicella): the primary illness with varicella zoster virus; spread by respiratory droplets or contact with skin lesions; centripetal, polymorphic rash; full recovery, but the virus remains latent in the dorsal root ganglia.\n• Shingles (herpes zoster): reactivation of the earlier varicella infection — latent virus in a sensory nerve; highly painful vesicles on the skin supplied by the affected nerve; not acquired by contact with cases of varicella or zoster; risk factors are low cell-mediated immunity and stress."}, "Q0367": {"id": "Q0367", "stem": "Name the virus that causes German measles.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "German measles is caused by rubella virus. Measles itself (rubeola) is caused by the measles virus of the Paramyxoviridae family.", "type": "written", "keyhtml": "Rubella virus — a single-stranded RNA virus with only 1 serotype, spread by droplets."}, "Q0368": {"id": "Q0368", "stem": "What is the causative agent of warts?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "HPV infects epithelial cells of skin and mucous membranes, causing warts or papilloma: cutaneous warts, genital warts and oral papilloma.", "type": "written", "keyhtml": "Human papilloma virus (HPV) — a small non-enveloped DNA virus that infects and multiplies in epithelial cells of skin and mucous membranes; transmitted by direct contact or autoinoculation."}, "N-MIC-L2-01": {"id": "N-MIC-L2-01", "stem": "Herpes simplex virus types 1 and 2, varicella zoster virus and human herpes virus 6 all cause skin infections. Which of the following structural features do these viruses share?", "top": false, "rep": "", "tag": "Final bank MIC Q20", "bank": true, "expl": "Herpesviruses are enveloped DNA viruses with an icosahedral capsid. A brick-shaped dsDNA virus that replicates in the cytoplasm describes the poxviruses, and the small non-enveloped DNA virus is HPV.", "type": "mcq", "opts": ["Small non-enveloped DNA virus", "Brick-shaped double-stranded DNA virus that replicates in the cytoplasm", "Enveloped DNA virus with an icosahedral capsid", "Single-stranded RNA virus of the Paramyxoviridae family", "Enterovirus related to the Picornavirus family"], "ans": 2}, "N-MIC-L2-02": {"id": "N-MIC-L2-02", "stem": "A staff nurse who regularly gives mouth care to patients develops vesicles on the tip of her index finger. Which virus is the most likely cause?", "top": false, "rep": "", "tag": "Final bank MIC Q21", "bank": true, "expl": "This is herpes whitlow, a hand infection due to implantation of HSV into the fingers; HSV-1 spreads by contact with saliva, and HSV-1 whitlow is often contracted by health care workers. Coxsackie A also causes vesicles, but in the mouth, hands and feet together, and spreads by the faecal–oral route.", "type": "mcq", "opts": ["Human papilloma virus", "Herpes simplex virus type 1", "Coxsackie A virus", "Molluscum contagiosum virus", "Human herpes virus 6"], "ans": 1}, "N-MIC-L2-03": {"id": "N-MIC-L2-03", "stem": "A 68-year-old man under severe emotional stress develops highly painful vesicles confined to a band of skin on one side of his chest. He had chickenpox in childhood. Which of the following statements about his condition is correct?", "top": false, "rep": "", "tag": "Final bank MIC Q22", "bank": true, "expl": "Shingles is reactivation of an earlier varicella infection whose virus lay latent in a sensory nerve, giving highly painful vesicles on the skin supplied by that nerve; low cell-mediated immunity and stress are risk factors. It is not acquired by contact with cases of varicella or zoster.", "type": "mcq", "opts": ["It was most likely acquired by contact with a child who has chickenpox", "It is caused by reactivation of herpes simplex virus latent in the sacral ganglia", "It occurs mainly in people with strong cell-mediated immunity", "It is caused by reactivation of varicella zoster virus that was latent in a sensory nerve", "It is a primary infection with varicella zoster virus"], "ans": 3}, "N-MIC-L2-04": {"id": "N-MIC-L2-04", "stem": "A 6-year-old girl has a febrile illness with a 'slapped cheek' rash on her face. The virus causing this illness has a lytic effect on which of the following?", "top": false, "rep": "", "tag": "Final bank MIC Q23", "bank": true, "expl": "A febrile illness with a slapped cheek rash is erythema infectiosum (fifth disease), caused by parvovirus B19, which has a lytic effect on erythroid precursors in the bone marrow. Inclusions in B lymphocytes are the cytopathic effect of HHV-6, the cause of roseola infantum (sixth disease).", "type": "mcq", "opts": ["B lymphocytes", "Erythroid precursors in the bone marrow", "Epithelial cells of the skin and mucous membranes", "Sensory neurons of the dorsal root ganglia"], "ans": 1}, "N-MIC-L2-05": {"id": "N-MIC-L2-05", "stem": "A 22-year-old woman who will be married next month is advised by her doctor to receive the live attenuated rubella vaccine. What is the main reason for this advice?", "top": false, "rep": "", "tag": "Final bank MIC Q24", "bank": true, "expl": "Rubella virus crosses the placenta to the fetus, causing fetal damage, so the live attenuated rubella vaccine alone is given to girls before marriage, in addition to MMR. The lytic effect on erythroid precursors belongs to parvovirus B19, and rubella spreads by droplets.", "type": "mcq", "opts": ["Rubella virus becomes latent in the sacral ganglia and reactivates during pregnancy", "Rubella virus is transmitted mainly by the sexual route", "Rubella virus can cross the placenta and cause fetal damage", "Rubella virus has a lytic effect on erythroid precursors in the bone marrow"], "ans": 2}, "N-MIC-L2-06": {"id": "N-MIC-L2-06", "stem": "Several children in a nursery develop vesicles and ulcers in the mouth together with vesicles on the hands and feet. The outbreak is traced to poor hand washing after nappy changing. Which virus is the most likely cause?", "top": false, "rep": "", "tag": "Final bank MIC Q25", "bank": true, "expl": "Vesicles and ulcers in the mouth, hands and feet are hand-foot-and-mouth disease, caused by Coxsackie A and spread by the faecal–oral route (Coxsackie A = All three sites). Coxsackie B causes epidemic myalgia (B = Body aches).", "type": "mcq", "opts": ["Coxsackie B virus", "Herpes simplex virus type 1", "Varicella zoster virus", "Coxsackie A virus", "Parvovirus B19"], "ans": 3}, "N-MIC-L2-07": {"id": "N-MIC-L2-07", "stem": "A 7-year-old unvaccinated boy develops a rash that began on his face and trunk and then spread to his limbs. On examination, macules, papules, vesicles and pustules are seen at the same time. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A centripetal rash (face and trunk first, then the extremities) with polymorphic lesions is the spot diagnosis of chickenpox. Smallpox is centrifugal (extremities), monkeypox favours the face and extremities rather than the trunk, and shingles is limited to the skin supplied by one sensory nerve.", "type": "mcq", "opts": ["Smallpox", "Chickenpox (varicella)", "Shingles (herpes zoster)", "Monkeypox", "German measles (rubella)"], "ans": 1}, "N-MIC-L2-08": {"id": "N-MIC-L2-08", "stem": "A 24-year-old man presents with multiple small, umbilicated, cheesy skin nodules. His sexual partner has similar lesions. Which virus is the most likely cause?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Molluscum contagiosum, a dsDNA enveloped poxvirus that affects only humans, causes multiple small or umbilicated cheesy skin nodules and spreads by contact or sexually. HPV causes warts, and HSV-2 causes genital herpes with vesicles.", "type": "mcq", "opts": ["Human papilloma virus", "Herpes simplex virus type 2", "Molluscum contagiosum virus", "Variola virus", "Cowpox virus"], "ans": 2}, "N-MIC-L2-09": {"id": "N-MIC-L2-09", "stem": "A man returns from travel to an area where monkeypox is endemic. He develops a pox rash concentrated on the face and extremities rather than the trunk. Which of the following statements about this infection is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Monkeypox is an Orthopoxvirus of the family Poxviridae, and smallpox vaccination is 85% effective at preventing it. It can pass from mother to child (transplacental, during labour and post-natal); spread from an infected udder during milking describes cowpox.", "type": "mcq", "opts": ["The causative virus belongs to the family Herpesviridae", "It cannot be transmitted from mother to child", "It is acquired only by contact with an infected cow's udder during milking", "Smallpox vaccination is about 85% effective in preventing it"], "ans": 3}, "N-MIC-L2-10": {"id": "N-MIC-L2-10", "stem": "A 3-year-old unvaccinated child has an acute respiratory tract infection with a rash of the skin and mucous membranes. Examination of the buccal mucosa shows Koplik's spots. Which virus is the most likely cause?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Koplik's spots on the buccal mucosa are the hallmark of measles (rubeola), a contagious acute respiratory tract infection with a rash of skin and mucous membranes that is diagnosed clinically. Rubella (German measles) causes a pink macular rash with arthritis, not Koplik's spots.", "type": "mcq", "opts": ["Rubella virus", "Parvovirus B19", "Human herpes virus 6", "Coxsackie A virus", "Measles virus"], "ans": 4}, "N-MIC-L2-11": {"id": "N-MIC-L2-11", "stem": "A 12-year-old boy has a wart on his finger. Over the following weeks, new warts appear on neighbouring fingers after he repeatedly picks at the first one. Which statement about the causative virus is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Warts are caused by HPV, a small non-enveloped DNA virus that infects epithelial cells and spreads by direct contact or autoinoculation. Herpesviruses, variola and molluscum contagiosum are all enveloped.", "type": "mcq", "opts": ["It is an enveloped DNA virus with an icosahedral capsid", "It is a brick-shaped double-stranded DNA virus that replicates in the cytoplasm", "It is a small non-enveloped DNA virus", "It is a single-stranded RNA virus with only one serotype"], "ans": 2}, "N-MIC-L2-12": {"id": "N-MIC-L2-12", "stem": "A 2-year-old child has very painful vesicles that rapidly ulcerate on the gums and buccal mucosa, with further vesicles on the lips and the skin around the mouth. Which of the following statements about these lesions is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is herpetic gingivostomatitis: vesicles rapidly ulcerate on the gums or buccal mucosa, are very painful and heal without scar; the oral virus (HSV-1) becomes latent in the trigeminal ganglia. A permanent scar is the end stage of smallpox lesions.", "type": "mcq", "opts": ["They end with a permanent scar", "They heal without a scar", "They are caused by a virus that becomes latent in the sacral ganglia", "They are caused by Coxsackie B virus"], "ans": 1}, "N-MIC-L2-16": {"id": "N-MIC-L2-16", "stem": "An infant has a mild febrile illness with a facial rash, diagnosed as roseola infantum (sixth disease). In adults, the causative virus produces which of the following?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Roseola infantum is caused by HHV-6, a lymphotropic herpesvirus with inclusions in B lymphocytes, which causes an infectious mononucleosis-like disease in adults. Arthritis in adults and transient aplastic crisis are caused by parvovirus B19, the cause of the fifth disease.", "type": "mcq", "opts": ["Arthritis", "Shingles", "Epidemic myalgia", "Infectious mononucleosis-like disease", "Transient aplastic crisis"], "ans": 3}, "N-MIC-L2-13": {"id": "N-MIC-L2-13", "stem": "Enumerate the causes of the successful eradication of smallpox, and mention why smallpox is still considered one of the most serious biological threats today.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from 4.2 (biological threat) and 4.3 (prevention and eradication).", "type": "written", "keyhtml": "Causes of successful eradication:\n• No carriers with latent infections\n• Vaccination (vaccinia virus by skin scarification) provides life-long immunity\n• Only one stable serotype\nWhy it is a serious biological threat:\n• Many people have not been vaccinated\n• There is no treatment\n• Only 2 repositories of smallpox virus exist — the CDC (United States) and Russia — with serious concern about virus stocks in other nations"}, "N-MIC-L2-14": {"id": "N-MIC-L2-14", "stem": "Mention the modes of transmission and the clinical diseases caused by parvovirus B19.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points are listed in the pamphlet's parvovirus B19 definition and clinical-diseases boxes (5.1).", "type": "written", "keyhtml": "Transmission: respiratory route · blood transfusion · transplacental.\nClinical diseases:\n• Erythema infectiosum (fifth disease): febrile illness with a slapped cheek rash\n• Arthritis in adults\n• Transient aplastic crisis\n• Fetal infection: depletion of red blood cells or hydrops fetalis\n(Parvovirus B19 has a lytic effect on erythroid precursors in the bone marrow.)"}, "N-MIC-L2-15": {"id": "N-MIC-L2-15", "stem": "Compare measles and rubella.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All rows come from the pamphlet's measles vs rubella table (5.4).", "type": "written", "keyhtml": "Feature: measles | rubella\n• Other name: rubeola | German measles\n• Virus: ssRNA, Paramyxoviridae | ssRNA, only 1 serotype\n• Disease: contagious acute respiratory tract infection with a rash of skin and mucous membrane | acute febrile childhood infection with a pink macular rash and arthritis\n• Key point: Koplik's spots on the buccal mucosa | crosses the placenta → fetal damage\n• Transmission: droplet | droplet\n• Prevention: MMR (compulsory in Egypt) + passive immunoglobulin for immunodeficient children | MMR + live attenuated rubella vaccine alone for girls before marriage"}, "TP-040": {"id": "TP-040", "stem": "Enumerate four common characteristics of herpes simplex virus.", "top": true, "rep": "", "tag": "Final bank MIC W13", "bank": true, "expl": "Herpesviruses, including HSV-1 and HSV-2, are enveloped DNA viruses with an icosahedral capsid, and herpes is oncogenic. HSV is neurotropic: it becomes latent in the trigeminal (HSV-1) or sacral (HSV-2) ganglia for life and can reactivate to cause recurrent lesions.", "type": "written", "keyhtml": "Any four of:\n• Enveloped virus\n• DNA virus\n• Icosahedral symmetry capsid\n• Oncogenic virus\n• Neurotropic: from the primary lesion the virus travels up the sensory nerves and becomes latent in the ganglia (HSV-1 trigeminal, HSV-2 sacral), persisting for life with no clinical manifestation\n• Reactivation of the latent virus → recurrent (secondary) infection with new vesicles in skin and mucous membrane"}, "TP-057": {"id": "TP-057", "stem": "A 5-year-old child attends school while feeling mildly unwell with low-grade fever and malaise, then presents with a generalized vesicular rash at different stages, mainly on the trunk. Several of his classmates subsequently develop similar symptoms. What is the primary mode of transmission of this infection?", "top": true, "rep": "", "tag": "Final bank MIC Q42", "bank": true, "expl": "A polymorphic vesicular rash (lesions at different stages) concentrated on the trunk is chickenpox, which is highly contagious to the unvaccinated and spreads by respiratory droplets from infectious saliva or by contact with skin lesions. Blood transfusion is a route of parvovirus B19 and the faecal–oral route belongs to Coxsackie A.", "type": "mcq", "opts": ["Bloodborne", "Respiratory droplets", "Fecal-oral", "Vector-borne", "Airborne"], "ans": 1}, "TP-080": {"id": "TP-080", "stem": "A child presents with mild fever followed by a bright red rash over the cheeks (\"slapped cheek\") and a lacy rash on the body. Which additional complication is most likely in adults?", "top": true, "rep": "", "tag": "Final bank MIC Q43", "bank": true, "expl": "A febrile illness with a slapped cheek rash is erythema infectiosum (fifth disease), caused by parvovirus B19. Its other clinical diseases are arthritis in adults, transient aplastic crisis and fetal infection (RBC depletion or hydrops fetalis).", "type": "mcq", "opts": ["Pneumonia", "Arthritis", "Hepatitis", "Encephalitis", "Carditis"], "ans": 1}, "TP-090": {"id": "TP-090", "stem": "Explain the reasons behind the successful eradication of smallpox worldwide.", "top": true, "rep": "", "tag": "Final bank MIC W14", "bank": true, "expl": "Smallpox could be eradicated because there are no latent carriers, the vaccinia vaccine gives life-long immunity and the virus has only one stable serotype.", "type": "written", "keyhtml": "1. No carriers with latent infections.\n2. Vaccination provides life-long immunity (vaccinia virus — live attenuated avirulent variola — given by skin scarification).\n3. Only one stable serotype."}, "TP-111": {"id": "TP-111", "stem": "List two microorganisms that can be used as a biological weapon.", "top": true, "rep": "", "tag": "Final bank MIC W15", "bank": true, "expl": "The variola (smallpox) virus could be used as a biological weapon: many people have not been vaccinated, there is no treatment, and there are only 2 repositories of the virus.", "type": "written", "keyhtml": "Smallpox (variola) virus, Bacillus anthracis."}, "TP-112": {"id": "TP-112", "stem": "Mention latent viruses.", "top": true, "rep": "", "tag": "Final bank MIC W16", "bank": true, "expl": "HSV: from the primary lesion the virus travels up the sensory nerves to the ganglia (HSV-1 trigeminal, HSV-2 sacral) and persists for life with no clinical manifestation. VZV: after chickenpox the virus remains latent in the dorsal root ganglia; its reactivation causes shingles.", "type": "written", "keyhtml": "Herpes simplex virus, Varicella zoster virus."}, "TP-113": {"id": "TP-113", "stem": "What is the only virus that can be seen by the light microscope (L.M)?", "top": true, "rep": "", "tag": "Final bank MIC W17", "bank": true, "expl": "Poxviridae are the largest viruses of all — brick-shaped, double-stranded DNA viruses that replicate in the cytoplasm.", "type": "written", "keyhtml": "Variola (smallpox) virus."}, "TP-114": {"id": "TP-114", "stem": "Mention zoonotic viruses.", "top": true, "rep": "", "tag": "Final bank MIC W18", "bank": true, "expl": "The zoonotic pox are cowpox, monkeypox and pseudocowpox. Monkeypox spreads by bites or scratches of infected animals (monkeys, rodents, wildlife); cowpox by contact with an infected udder during milking.", "type": "written", "keyhtml": "Monkeypox virus, Cowpox virus, Pseudocowpox virus."}, "TP-115": {"id": "TP-115", "stem": "Mention zoonotic diseases.", "top": true, "rep": "", "tag": "Final bank MIC W19", "bank": true, "expl": "Anthrax is primarily a disease of farm (herbivorous) animals transmitted to humans — a zoonosis (Microbiology L1). The zoonotic pox are cowpox, monkeypox and pseudocowpox (Microbiology L2).", "type": "written", "keyhtml": "Anthrax, cowpox, monkeypox, pseudocowpox."}, "TP-116": {"id": "TP-116", "stem": "Mention zoonotic organisms.", "top": true, "rep": "", "tag": "Final bank MIC W20", "bank": true, "expl": "Bacillus anthracis causes anthrax, a disease of farm (herbivorous) animals transmitted to humans — a zoonosis (Microbiology L1). The zoonotic pox are cowpox, monkeypox and pseudocowpox (Microbiology L2).", "type": "written", "keyhtml": "Bacillus anthracis, cowpox virus, monkeypox virus, pseudocowpox virus."}, "TP-117": {"id": "TP-117", "stem": "Mention RNA viruses.", "top": true, "rep": "", "tag": "Final bank MIC W21", "bank": true, "expl": "Measles (rubeola) virus: single-stranded RNA, family Paramyxoviridae. Rubella virus (German measles): single-stranded RNA with only 1 serotype.", "type": "written", "keyhtml": "Measles virus (rubeola), Rubella virus (German measles)."}}, "labs": {}, "cards": [{"id": "MIC-L2-001", "text": "Varicella zoster virus causes {{c1::chickenpox (varicella)}} as the primary illness and {{c2::shingles (herpes zoster)}} on reactivation", "extra": "One virus, two diseases.", "sec": "Part 01 · 1.1 Selected viral diseases of the skin"}, {"id": "MIC-L2-002", "text": "Fifth disease = {{c1::erythema infectiosum}}, caused by {{c2::parvovirus B19}}", "extra": "", "sec": "Part 01 · 1.1 Selected viral diseases of the skin"}, {"id": "MIC-L2-003", "text": "Sixth disease = {{c1::roseola infantum}}, caused by {{c2::human herpes virus 6 (HHV-6)}}", "extra": "The 6 in HHV-6.", "sec": "Part 01 · 1.1 Selected viral diseases of the skin"}, {"id": "MIC-L2-004", "text": "Herpesviruses: {{c1::enveloped}} {{c2::DNA}} viruses with an {{c3::icosahedral}} symmetry capsid", "extra": "Herpes is also an oncogenic virus.", "sec": "Part 01 · 1.2 General properties of herpesviruses"}, {"id": "MIC-L2-005", "text": "Herpesviruses causing skin infections: {{c1::HSV-1}} · {{c2::HSV-2}} · {{c3::varicella zoster}} · {{c4::HHV-6}}", "extra": "", "sec": "Part 01 · 1.2 General properties of herpesviruses"}, {"id": "MIC-L2-006", "text": "Herpesvirus tropism — neurotropic: {{c1::HSV and varicella zoster virus}}; lymphotropic: {{c2::HHV-6}}", "extra": "", "sec": "Part 01 · 1.2 General properties of herpesviruses"}, {"id": "MIC-L2-007", "text": "Ganglion = a collection of the {{c1::enlarged portion of nerve cells}} — where neurotropic herpesviruses become {{c2::latent}}", "extra": "", "sec": "Part 01 · 1.2 General properties of herpesviruses"}, {"id": "MIC-L2-008", "text": "HSV-1 → {{c1::oral}} herpes; HSV-2 → {{c2::genital}} herpes", "extra": "Belt rule: HSV-1 above the belt, HSV-2 below.", "sec": "Part 02 · 2.1 HSV-1 vs HSV-2"}, {"id": "MIC-L2-009", "text": "HSV-1 transmission: {{c1::contact with saliva or droplets}}", "extra": "", "sec": "Part 02 · 2.1 HSV-1 vs HSV-2"}, {"id": "MIC-L2-010", "text": "HSV-2 transmission: {{c1::sexually}} · to the newborn {{c2::through the birth canal during birth}} · {{c3::transplacental}}", "extra": "", "sec": "Part 02 · 2.1 HSV-1 vs HSV-2"}, {"id": "MIC-L2-011", "text": "Site of latency — HSV-1: {{c1::trigeminal ganglia}}; HSV-2: {{c2::sacral ganglia}}", "extra": "Belt rule: trigeminal above the belt, sacral below.", "sec": "Part 02 · 2.1 HSV-1 vs HSV-2"}, {"id": "MIC-L2-012", "text": "Patterns of HSV infection: {{c1::primary}} · {{c2::latent}} · {{c3::recurrent (secondary)}}", "extra": "", "sec": "Part 02 · 2.2 Pattern of HSV infections"}, {"id": "MIC-L2-013", "text": "Primary HSV infection: the virus infects the {{c1::mucocutaneous junction or abraded skin}}, causing vesicles which may change to {{c2::shallow ulcers}}", "extra": "", "sec": "Part 02 · 2.2 Pattern of HSV infections"}, {"id": "MIC-L2-014", "text": "Latent HSV infection: from the primary lesion the virus travels up the {{c1::sensory nerves}} to the ganglia and persists {{c2::for life}} with {{c3::no clinical manifestation}}", "extra": "Exam trap: silent, yet still there.", "sec": "Part 02 · 2.2 Pattern of HSV infections"}, {"id": "MIC-L2-015", "text": "Recurrent (secondary) HSV infection = {{c1::reactivation of latent virus}} with renewed formation of vesicles in skin and mucous membrane", "extra": "", "sec": "Part 02 · 2.2 Pattern of HSV infections"}, {"id": "MIC-L2-016", "text": "Herpetic gingivostomatitis: macule → papule → vesicle that rapidly {{c1::ulcerates}} on the {{c2::gums or buccal mucosa}}", "extra": "Vesicles may also develop on the lips, nose and skin around the mouth.", "sec": "Part 02 · 2.3 Clinical manifestations"}, {"id": "MIC-L2-017", "text": "Herpetic gingivostomatitis lesions are very {{c1::painful}} and heal {{c2::without scar}}", "extra": "Contrast: smallpox ends with a permanent scar.", "sec": "Part 02 · 2.3 Clinical manifestations"}, {"id": "MIC-L2-018", "text": "Herpes (herpetic) whitlow = HSV hand infection due to {{c1::implantation of the virus into the fingers}}", "extra": "", "sec": "Part 02 · 2.3 Clinical manifestations"}, {"id": "MIC-L2-019", "text": "Herpes whitlow can also be caused by transfer of {{c1::HSV-2}} from the {{c2::genitals}} to the hands", "extra": "", "sec": "Part 02 · 2.3 Clinical manifestations"}, {"id": "MIC-L2-020", "text": "HSV-1 whitlow is often contracted by {{c1::health care workers}} who come in contact with the virus", "extra": "e.g. a nurse giving mouth care → vesicles on a fingertip.", "sec": "Part 02 · 2.3 Clinical manifestations"}, {"id": "MIC-L2-021", "text": "Eczema herpeticum: a severe form of cutaneous herpes that may occur in children with {{c1::atopic eczema}}", "extra": "", "sec": "Part 02 · 2.3 Clinical manifestations"}, {"id": "MIC-L2-022", "text": "Chickenpox transmission: {{c1::respiratory droplets}} from infectious saliva or {{c2::contact with skin lesions}}", "extra": "Same routes as smallpox (droplet, contact).", "sec": "Part 03 · 3.1 Chickenpox (varicella) — the primary illness"}, {"id": "MIC-L2-023", "text": "Chickenpox spot diagnosis: a {{c1::centripetal}} rash (face & trunk first, then the extremities) that is {{c2::polymorphic}}", "extra": "CentriPetal = Pulled to the trunk.", "sec": "Part 03 · 3.1 Chickenpox (varicella) — the primary illness"}, {"id": "MIC-L2-024", "text": "Polymorphic rash of chickenpox: {{c1::macules, papules, vesicles and pustules}} present together", "extra": "", "sec": "Part 03 · 3.1 Chickenpox (varicella) — the primary illness"}, {"id": "MIC-L2-025", "text": "Chickenpox outcome: {{c1::full recovery}}, but the virus remains latent in the {{c2::dorsal root ganglia}}", "extra": "", "sec": "Part 03 · 3.1 Chickenpox (varicella) — the primary illness"}, {"id": "MIC-L2-026", "text": "Chickenpox is highly contagious to those {{c1::not vaccinated or never infected}}; those who have had it are generally {{c2::immune}}", "extra": "", "sec": "Part 03 · 3.1 Chickenpox (varicella) — the primary illness"}, {"id": "MIC-L2-027", "text": "Shingles = {{c1::reactivation}} of an earlier varicella infection — virus latent in a {{c2::sensory nerve}}", "extra": "", "sec": "Part 03 · 3.2 Shingles (herpes zoster)"}, {"id": "MIC-L2-028", "text": "Shingles lesions: highly painful {{c1::vesicles}} on the skin supplied by the {{c2::affected nerve}}", "extra": "A band of vesicles along one nerve's skin area.", "sec": "Part 03 · 3.2 Shingles (herpes zoster)"}, {"id": "MIC-L2-029", "text": "Shingles is {{c1::not acquired}} by contact with cases of varicella or zoster", "extra": "It comes from the patient's own latent virus.", "sec": "Part 03 · 3.2 Shingles (herpes zoster)"}, {"id": "MIC-L2-030", "text": "Shingles risk factors: {{c1::low cell-mediated immunity}} · {{c2::stress}}", "extra": "", "sec": "Part 03 · 3.2 Shingles (herpes zoster)"}, {"id": "MIC-L2-031", "text": "HHV-6 is lymphotropic: it induces a cytopathic effect with {{c1::inclusions in human B lymphocytes}}", "extra": "", "sec": "Part 03 · 3.3 Human herpes virus 6 (HHV-6)"}, {"id": "MIC-L2-032", "text": "HHV-6 in children: mild febrile illness with facial rashes = {{c1::roseola infantum (sixth disease)}}; in adults: {{c2::infectious mononucleosis-like disease}}", "extra": "", "sec": "Part 03 · 3.3 Human herpes virus 6 (HHV-6)"}, {"id": "MIC-L2-033", "text": "Poxviridae: the {{c1::largest}} viruses of all — {{c2::brick}}-shaped, {{c3::double-stranded DNA}} viruses that replicate in the {{c4::cytoplasm}}", "extra": "", "sec": "Part 04 · Poxviruses — definition"}, {"id": "MIC-L2-034", "text": "The pox family: variola → {{c1::smallpox}} · {{c2::vaccinia virus}} → vaccination against smallpox · {{c3::molluscum contagiosum}} → benign skin nodules · zoonotic pox → {{c4::cowpox, monkeypox, pseudocowpox}}", "extra": "", "sec": "Part 04 · 4.1 The pox family"}, {"id": "MIC-L2-035", "text": "Variola structure: {{c1::dsDNA}} · {{c2::enveloped}} · brick-shaped", "extra": "", "sec": "Part 04 · 4.2 Variola (smallpox)"}, {"id": "MIC-L2-036", "text": "Smallpox only infects {{c1::humans}} — there is {{c2::no animal reservoir}}", "extra": "Molluscum contagiosum is also humans-only.", "sec": "Part 04 · 4.2 Variola (smallpox)"}, {"id": "MIC-L2-037", "text": "Smallpox: systemic viral infection with a severe vesicular rash → pustules → crust → ends with a {{c1::permanent scar}}", "extra": "", "sec": "Part 04 · 4.2 Variola (smallpox)"}, {"id": "MIC-L2-038", "text": "Smallpox transmission: {{c1::respiratory route}} or {{c2::contact with dried crusts}} from skin lesions", "extra": "Transplacental spread belongs to HSV-2, monkeypox, parvovirus B19 and rubella — not variola.", "sec": "Part 04 · 4.2 Variola (smallpox)"}, {"id": "MIC-L2-039", "text": "Why smallpox is a serious biological threat today: {{c1::many people have not been vaccinated}} · {{c2::there is no treatment}} · {{c3::only 2 repositories of the virus, with concern about stocks in other nations}}", "extra": "The virus could be used as a biological weapon.", "sec": "Part 04 · 4.2 Variola (smallpox)"}, {"id": "MIC-L2-040", "text": "The 2 repositories of smallpox virus in the world: {{c1::the CDC (United States)}} & {{c2::Russia}}", "extra": "", "sec": "Part 04 · 4.2 Variola (smallpox)"}, {"id": "MIC-L2-041", "text": "Smallpox vaccine: {{c1::vaccinia virus}} (live attenuated avirulent variola), given by {{c2::skin scarification}}", "extra": "", "sec": "Part 04 · 4.3 Prevention & eradication of smallpox"}, {"id": "MIC-L2-042", "text": "Vaccination with vaccinia virus gives {{c1::life-long}} immunity to smallpox", "extra": "Quiz T/F: True.", "sec": "Part 04 · 4.3 Prevention & eradication of smallpox"}, {"id": "MIC-L2-043", "text": "Causes of successful smallpox eradication: {{c1::no carriers with latent infections}} · {{c2::vaccination gives life-long immunity}} · {{c3::only one stable serotype}}", "extra": "", "sec": "Part 04 · 4.3 Prevention & eradication of smallpox"}, {"id": "MIC-L2-044", "text": "Rash di /* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
const LAB = {};
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
