<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSK Book">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>MSK Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}
.op[disabled]{cursor:default}
.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}

idement + penicillin"]]}]}], "labName": "Recall · Gas Gangrene (2/2)"}, {"id": "p41", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0308"}, {"t": "check", "q": "Q0310"}]}, {"id": "p42", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0350"}, {"t": "flap", "q": "N-MIC-L3-07"}]}, {"id": "p43", "head": "Part 08 · Organisms Compared", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Organisms Compared", "sub": "Osteomyelitis vs septic arthritis · Lab tests & media at a glance · Clue → answer · The master table · Treatment at a glance"}, {"t": "h", "no": "8.1", "title": "Osteomyelitis vs septic arthritis"}, {"t": "list", "items": ["<b>Both:<\/b> S. aureus most common cause", "<b>Osteomyelitis X-ray:<\/b> <mark>lytic areas<\/mark>, <mark>periosteal elevation<\/mark>; septic arthritis: <mark>soft tissue swelling<\/mark>"]}, {"t": "h", "no": "8.2", "title": "Lab tests & media at a glance"}, {"t": "list", "items": ["<b>GBS:<\/b> bacitracin resistant, hippurate, CAMP +; TB: Z-N, Löwenstein–Jensen", "<b>Gonococcus:<\/b> Thayer Martin/chocolate, 5–10% CO₂; C. perfringens: Nagler, stormy milk"]}], "toc": ["08", "Organisms Compared"]}, {"id": "p44", "head": "Part 08 · Organisms Compared", "kind": "text", "blocks": [{"t": "h", "no": "8.3", "title": "Clue → answer"}, {"t": "list", "items": ["Pott's → M. tuberculosis; enteric fever osteomyelitis → Salmonella", "Exopigment/exotoxin A → Pseudomonas; red pigment → Serratia", "HLA-B27 after enteric infection → <mark>reactive arthritis<\/mark>"]}, {"t": "h", "no": "8.4", "title": "The master table"}, {"t": "list", "items": ["Organism-by-organism type, features, source, disease, treatment"]}, {"t": "h", "no": "8.5", "title": "Treatment at a glance"}, {"t": "list", "items": ["<b>GBS:<\/b> ampicillin + aminoglycoside/cephalosporin; gonococcus: ceftriaxone", "<b>Histoplasma:<\/b> itraconazole/amphotericin B; TB: multiple drugs", "<b>Gas gangrene:<\/b> debridement, clindamycin + penicillin, hyperbaric; reactive arthritis: NSAID"]}]}, {"id": "p45", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-mic-l3-7-0", "title": "Recall · Organisms Compared (1/2)", "groups": [{"title": "8.1 Osteomyelitis vs septic arthritis", "items": [["Both:", "S. aureus most common cause"], ["Osteomyelitis X-ray:", "lytic areas, periosteal elevation; septic arthritis: soft tissue swelling"]]}, {"title": "8.2 Lab tests & media at a glance", "items": [["GBS:", "bacitracin resistant, hippurate, CAMP +; TB: Z-N, Löwenstein–Jensen"], ["Gonococcus:", "Thayer Martin/chocolate, 5–10% CO₂; C. perfringens: Nagler, stormy milk"]]}, {"title": "8.3 Clue → answer", "items": [["Pott's →", "M. tuberculosis; enteric fever osteomyelitis → Salmonella"], ["Exopigment/exotoxin A →", "Pseudomonas; red pigment → Serratia"], ["HLA-B27 after enteric infection →", "reactive arthritis"]]}]}], "labName": "Recall · Organisms Compared (1/2)"}, {"id": "p46", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-mic-l3-7-1", "title": "Recall · Organisms Compared (2/2)", "groups": [{"title": "8.4 The master table", "items": [["Organism-by-organism type", "features, source, disease, treatment"]]}, {"title": "8.5 Treatment at a glance", "items": [["GBS:", "ampicillin + aminoglycoside/cephalosporin; gonococcus: ceftriaxone"], ["Histoplasma:", "itraconazole/amphotericin B; TB: multiple drugs"], ["Gas gangrene:", "debridement, clindamycin + penicillin, hyperbaric; reactive arthritis: NSAID"]]}]}], "labName": "Recall · Organisms Compared (2/2)"}, {"id": "p47", "head": "Part 09 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "09", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps · Numbers to remember"}, {"t": "h", "no": "9.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Q&amp;A recap of routes, osteomyelitis, organisms, synovial fluid, gonorrhoea, gas gangrene"]}, {"t": "h", "no": "9.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["Group B = Babies + Bacitracin-resistant; aseptic arthritis V-R-R; C. perfringens Double–Stormy–Nagler"]}, {"t": "h", "no": "9.3", "title": "Numbers to remember"}, {"t": "list", "items": ["Osteomyelitis peak 3–12 y, boys 2:1; GBS carriage 15–20%", "Septic fluid WBC 15,000 to &gt;100,000, PMNs ≥75%; gonococcal CO₂ 5–10%; Lancefield A–O"]}], "toc": ["09", "Rapid Revision"]}, {"id": "p48", "head": "Lab · Recall · Part 09", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-mic-l3-8-0", "title": "Recall · Rapid Revision", "groups": [{"title": "9.1 Must-know one-liners", "items": [["Q&amp;A recap of routes", "osteomyelitis, organisms, synovial fluid, gonorrhoea, gas gangrene"]]}, {"title": "9.2 Mnemonic vault & classic exam traps", "items": [["Group B =", "Babies + Bacitracin-resistant; aseptic arthritis V-R-R; C. perfringens Double–Stormy–Nagler"]]}, {"title": "9.3 Numbers to remember", "items": [["Osteomyelitis peak 3–12", "y, boys 2:1; GBS carriage 15–20%"], ["Septic fluid WBC 15,000 to", "&gt;100,000, PMNs ≥75%; gonococcal CO₂ 5–10%; Lancefield A–O"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p49", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Exopigment = Pseudomonas; red pigment = Serratia — both hospital-related, MDR"}, {"t": "note", "kind": "trap", "html": "Osteomyelitis extending into joint = septic arthritis; epiphyseal involvement disturbs growth"}, {"t": "note", "kind": "trap", "html": "Only septic synovial fluid is culture positive with PMNs ≥75% (inflammatory ≥50%, culture negative)"}, {"t": "note", "kind": "trap", "html": "Reactive arthritis follows bacterial infection yet antibiotics have NO role — NSAIDs first"}, {"t": "note", "kind": "trap", "html": "Gas gangrene: tachycardia disproportionate to fever; diagnosis clinical; spores rare in tissue"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p50", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "GBS is bacitracin resistant"}, {"t": "note", "kind": "trap", "html": "Hematogenous spread frequently involves vertebrae"}, {"t": "note", "kind": "trap", "html": "Rubella vaccine can also cause viral arthritis"}, {"t": "note", "kind": "trap", "html": "Gonococcus does not ferment maltose"}, {"t": "note", "kind": "cl", "html": "Bone infections difficult to treat — aggressive, prolonged, sometimes IV or multidrug antibiotics"}, {"t": "note", "kind": "cl", "html": "Gonococcal ophthalmia in infants rapidly leads to blindness if untreated"}]}, {"id": "p51", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0308": {"id": "Q0308", "stem": "Nagler's reaction is useful for the identification of which of the following organisms?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "C. perfringens is identified by the Nagler reaction on an egg yolk agar plate. It is the only Clostridium taught in this lecture; its other laboratory clues are a double zone of haemolysis on blood agar and 'stormy fermentation' in milk media.", "type": "mcq", "opts": ["Clostridium botulinum", "Clostridium difficile", "Clostridium perfringens", "Clostridium tetani"], "ans": 2}, "Q0310": {"id": "Q0310", "stem": "The stormy clot reaction (stormy fermentation in milk media) is useful in the identification of which one of the following microorganisms?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Anaerobic culture of C. perfringens in milk media gives 'stormy fermentation'. Together with a double zone of haemolysis on blood agar and the Nagler reaction on egg yolk agar, it forms the C. perfringens laboratory trio.", "type": "mcq", "opts": ["Clostridium botulinum", "Clostridium tetani", "Clostridium perfringens", "Clostridium difficile"], "ans": 2}, "Q0312": {"id": "Q0312", "stem": "Osteomyelitis is most commonly caused by which of the following organisms?", "top": false, "rep": "", "tag": "Final bank MIC Q29", "bank": true, "expl": "Osteomyelitis may be bacterial, viral or fungal, and Staph. aureus is the most common cause. Salmonella causes osteomyelitis only in the course of enteric fever or gastroenteritis, and H. influenzae is listed as a cause of non-gonococcal septic arthritis.", "type": "mcq", "opts": ["Staphylococcus aureus", "Streptococcus pyogenes", "Haemophilus influenzae", "Salmonella spp."], "ans": 0}, "Q0313": {"id": "Q0313", "stem": "A 25-year-old man presents to the Accident and Emergency Department complaining of fever, right knee pain and rigors. He has no previous relevant medical history and has never been sexually active. He recalls recently hurting his knee during a soccer match. The knee is hot and swollen on physical examination. A presumptive diagnosis of septic arthritis is made.\nWhat is the most likely cause?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "S. aureus is the most common cause of non-gonococcal septic arthritis, which typically presents in a monoarticular large weight-bearing joint such as the knee. N. gonorrhoeae causes gonococcal arthritis and is transmitted by sexual contact or at birth, which does not fit this patient; parvovirus B19 causes aseptic (viral) arthritis.", "type": "mcq", "opts": ["Neisseria gonorrhoeae", "Escherichia coli", "Parvovirus", "Staphylococcus aureus", "Human immunodeficiency virus"], "ans": 3}, "Q0314": {"id": "Q0314", "stem": "A 25-year-old man presents to the Accident and Emergency Department complaining of fever, right knee pain and rigors. He has no previous relevant medical history and has never been sexually active. He recalls recently hurting his knee during a soccer match. The knee is hot and swollen on physical examination. A presumptive diagnosis of septic arthritis is made.\nWhich combination of investigations is most appropriate to diagnose this condition?", "top": false, "rep": "", "tag": "Final bank MIC Q30", "bank": true, "expl": "The diagnosis of septic arthritis is laboratory — synovial fluid (joint aspirate) and blood culture in an acute case — plus radiology, which shows soft tissue swelling, then joint destruction if the infection progresses. Septic fluid is opaque with WBC 15,000 to &gt;100,000/mm³, PMNs ≥75% and a positive culture; options without both joint aspirate and blood culture miss the key laboratory tests.", "type": "mcq", "opts": ["Blood cultures, joint aspirate and radiology", "Full blood count and radiology", "CT scan and blood cultures", "Indium-labelled bone scan and blood cultures", "Mid-stream urine, full blood count and joint aspirate"], "ans": 0}, "Q0315": {"id": "Q0315", "stem": "A 2-day-old premature baby boy born to a 22-year-old woman developed pneumonia. The mother was healthy, but after the premature delivery she showed symptoms of urinary tract infection. A blood specimen was taken from the baby, and beta-haemolytic colonies were observed on the culture plate. Which is the most likely pathogen transferred from the mother to the baby?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Strept. agalactiae (group B streptococcus) is β haemolytic, lives in the vagina of 15–20% of women and infects the newborn during birth, with a higher risk after prolonged labour following rupture of the membranes. Of the organisms listed, it is the only one the lecture describes as passing from mother to newborn.", "type": "mcq", "opts": ["Streptococcus pyogenes", "Streptococcus agalactiae", "Enterococcus faecalis", "Streptococcus bovis"], "ans": 1}, "Q0331": {"id": "Q0331", "stem": "Which bacterium is responsible for causing syphilis?", "top": true, "rep": "asked 2 years", "tag": "Final bank MIC Q26", "bank": true, "expl": "The spirochetes that damage bone and joints are Borrelia burgdorferi (Lyme disease) and Treponema pallidum (syphilis). N. gonorrhoeae is a Gram-negative diplococcus that causes gonorrhoea and gonococcal arthritis, not syphilis.", "type": "mcq", "opts": ["Neisseria gonorrhoeae", "Treponema pallidum", "Chlamydia trachomatis", "Mycobacterium leprae", "Haemophilus ducreyi"], "ans": 1}, "Q0349": {"id": "Q0349", "stem": "A few days after a premature baby boy was born, he developed neonatal septicemia ending in osteomyelitis. The blood specimen was taken from the baby, showing Gram-positive cocci with beta-hemolytic colonies on the blood culture plate. Which microorganism transferred from the mother to the baby and caused infection?", "top": true, "rep": "asked 2 years", "tag": "Final bank MIC Q27", "bank": true, "expl": "Strept. agalactiae (group B streptococcus) is a β-haemolytic Gram-positive coccus carried in the vagina of 15–20% of women; the newborn is infected during birth, and it is the most common cause of neonatal septicaemia and meningitis. Strept. pyogenes is also β-haemolytic, but it is group A and is not described as passing from mother to newborn.", "type": "mcq", "opts": ["Streptococcus agalactiae", "Streptococcus mutans", "Streptococcus pyogenes", "Enterococcus faecalis", "Streptococcus bovis"], "ans": 0}, "Q0350": {"id": "Q0350", "stem": "Which one of the following microorganisms is responsible for gas gangrene?", "top": true, "rep": "asked 3 years", "tag": "Final bank MIC Q28", "bank": true, "expl": "Gas gangrene (myonecrosis) follows contamination of a wound with soil or faeces by C. perfringens, a large Gram-positive, spore-forming anaerobic rod whose spores germinate in tissue to produce alpha toxin and a lecithinase. It is the only Clostridium described as causing gas gangrene in this lecture.", "type": "mcq", "opts": ["Clostridium tetani", "Clostridium botulinum", "Clostridium perfringens", "Clostridium difficile"], "ans": 2}, "Q0378": {"id": "Q0378", "stem": "What is the most common causative organism of osteomyelitis in children and adults?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Staph. aureus is the most common cause of osteomyelitis; it is also the most common cause of non-gonococcal septic arthritis.", "type": "written", "keyhtml": "Staphylococcus aureus is the most common cause of osteomyelitis (the microbial etiology may be bacterial, viral or fungal)."}, "Q0379": {"id": "Q0379", "stem": "Which microorganism causes vertebral osteomyelitis known as Pott's disease?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "M. tuberculosis is a pulmonary infection transmitted by inhalation that causes vertebral osteomyelitis (Pott's disease) by hematogenous spread; hematogenous spread to bone frequently involves the vertebrae.", "type": "written", "keyhtml": "Mycobacterium tuberculosis (acid-fast bacilli; Z-N stain, culture on Löwenstein–Jensen medium), which reaches the vertebrae by hematogenous spread."}, "Q0380": {"id": "Q0380", "stem": "List two complications of untreated osteomyelitis.", "top": false, "rep": "", "tag": "Final bank MIC W8", "bank": true, "expl": "The lecture lists six complications of osteomyelitis (A to F): abscess, fistula or sinus, pathologic fracture, extension into the joint (septic arthritis), growth disturbance from epiphyseal involvement, and severe deformity with delayed treatment.", "type": "written", "keyhtml": "Any two of:\n• Abscess in soft tissue\n• Fistula or sinus formation\n• Pathologic fracture\n• Extension into the joint → septic arthritis\n• Growth disturbance due to epiphyseal involvement\n• Severe deformity with delayed treatment"}, "Q0381": {"id": "Q0381", "stem": "What laboratory tests are used to diagnose Neisseria gonorrhoeae as the cause of septic arthritis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "N. gonorrhoeae appears as intracellular Gram-negative diplococci in PMNs and is cultured on chocolate agar or Thayer Martin medium with 5–10% CO₂; it is oxidase positive and does not ferment maltose. Septic synovial fluid is culture positive, unlike inflammatory fluid.", "type": "written", "keyhtml": "• Specimens: in acute septic arthritis, synovial fluid (joint aspirate) and blood culture; for suspected gonorrhoea, urethral discharge (male) or endocervical swab (female)\n• Synovial fluid in septic arthritis: often &gt; 3.5 mL, opaque, yellow to green (frank pus), WBC 15,000 to &gt; 100,000/mm³, PMNs ≥ 75%, culture positive\n• Gram film: intracellular Gram-negative (kidney bean–shaped) diplococci in PMNs\n• Culture: chocolate agar or Thayer Martin medium in 5–10% CO₂\n• Identification: growth morphology, oxidase positive, sugars (maltose not fermented)\n• Commonly: genetic probes with amplification"}, "N-MIC-L3-01": {"id": "N-MIC-L3-01", "stem": "A 26-year-old man develops a painful, swollen right knee shortly after recovering from diarrhoea caused by Shigella. He is HLA-B27 positive. Which of the following is the first-line treatment?", "top": false, "rep": "", "tag": "Final bank MIC Q31", "bank": true, "expl": "Arthritis after an enteric infection (Campylobacter, Shigella, Salmonella, Chlamydia or Yersinia) in an HLA-B27 patient is reactive arthritis, a type of aseptic arthritis. Although it follows a bacterial infection, antibiotics have no role and an NSAID is first-line therapy; ceftriaxone is the treatment for gonococcal arthritis.", "type": "mcq", "opts": ["Ceftriaxone", "An NSAID", "Clindamycin and penicillin", "Ampicillin with an aminoglycoside", "Itraconazole"], "ans": 1}, "N-MIC-L3-02": {"id": "N-MIC-L3-02", "stem": "A patient develops osteomyelitis of the tibia after an orthopaedic operation in hospital. The isolate is a Gram-negative bacillus that produces an exopigment and exotoxin A, which decreases protein synthesis and causes tissue necrosis. It is resistant to several antibiotics. Which organism is most likely?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Pseudomonas aeruginosa produces endotoxin, exopigment, protease, haemolysin and exotoxin A (decreased protein synthesis → tissue necrosis), and multidrug resistance is common in this hospital-related organism. Serratia marcescens is also hospital related and MDR, but it is recognised by its red pigment, not exotoxin A.", "type": "mcq", "opts": ["Salmonella spp.", "Serratia marcescens", "Pseudomonas aeruginosa", "Pasteurella multocida"], "ans": 2}, "N-MIC-L3-03": {"id": "N-MIC-L3-03", "stem": "Synovial fluid aspirated from the swollen knee of a febrile patient is opaque and yellow-green. The WBC count is 80,000/mm³ with 90% PMNs, and bacteria grow on culture. How is this synovial fluid classified?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Septic fluid is opaque, yellow to green or frank pus, with WBC 15,000 to &gt;100,000/mm³, PMNs ≥75% and a positive culture. Inflammatory fluid can have a similar WBC count (2,000–100,000) with PMNs ≥50%, but its culture is negative.", "type": "mcq", "opts": ["Normal", "Non-inflammatory", "Inflammatory", "Septic"], "ans": 3}, "N-MIC-L3-04": {"id": "N-MIC-L3-04", "stem": "A 3-day-old baby develops ophthalmia. His mother has untreated endocervicitis. A Gram film of the eye exudate shows intracellular Gram-negative, kidney bean–shaped diplococci in PMNs. Which further test results would identify this organism?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Intracellular Gram-negative kidney bean–shaped diplococci in PMNs point to N. gonorrhoeae, transmitted to the infant at birth; untreated, infant ophthalmia rapidly leads to blindness. The gonococcus is oxidase positive and does not ferment maltose.", "type": "mcq", "opts": ["Oxidase negative; maltose fermented", "Oxidase positive; maltose fermented", "Oxidase positive; maltose not fermented", "Oxidase negative; maltose not fermented"], "ans": 2}, "N-MIC-L3-05": {"id": "N-MIC-L3-05", "stem": "A patient from an endemic area develops severe disease with bone involvement. The causative fungus is dimorphic, was acquired by inhalation and is seen inside cells in tissue. Which drug is used for this severe disease?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A dimorphic, endemic, intracellular fungus acquired by inhalation is Histoplasma capsulatum. Itraconazole is used for mild disease and amphotericin B for severe disease.", "type": "mcq", "opts": ["Itraconazole", "Ceftriaxone", "Clindamycin and penicillin", "An NSAID", "Amphotericin B"], "ans": 4}, "N-MIC-L3-06": {"id": "N-MIC-L3-06", "stem": "A 7-year-old boy has a painful, swollen leg, and osteomyelitis of the tibia is suspected. Which X-ray finding supports this diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In osteomyelitis the X-ray shows lytic areas and periosteal elevation. Soft tissue swelling, followed by joint destruction if the infection progresses, is the radiologic finding of septic arthritis.", "type": "mcq", "opts": ["Soft tissue swelling around the knee joint", "Lytic areas and periosteal elevation", "Destruction of the knee joint", "A normal X-ray, because the diagnosis is clinical"], "ans": 1}, "N-MIC-L3-07": {"id": "N-MIC-L3-07", "stem": "A farmer sustains a deep leg wound contaminated with soil. Two days later he has acute, increasing pain at the wound site, with tense, swollen tissue containing gas and an exudate. He has fever, sweating and pallor, and his tachycardia is out of proportion to the fever.\n(a) What is the most likely diagnosis and its causative organism?\n(b) Mention two laboratory features used to identify this organism.\n(c) Outline the treatment.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A wound contaminated with soil or faeces, rapidly increasing pain, tense tissue with gas, and tachycardia disproportionate to the fever are the features of gas gangrene. Its course is rapid with high mortality, so diagnosis is clinical.", "type": "written", "keyhtml": "(a) Gas gangrene (myonecrosis) caused by Clostridium perfringens (large Gram-positive, spore-forming, non-motile anaerobic rods); the diagnosis is clinical.\n(b) Any two of: double zone of haemolysis on blood agar; 'stormy fermentation' in milk media (anaerobic culture); Nagler reaction on an egg yolk agar plate.\n(c) Debridement with delayed closure, clindamycin and penicillin, and a hyperbaric chamber. Prevention: extensive debridement of the wound plus penicillin."}, "N-MIC-L3-08": {"id": "N-MIC-L3-08", "stem": "Enumerate the types of aseptic arthritis, giving the causes and the management of each where stated.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Aseptic arthritis is V-R-R: viral (immune complex), reactive (HLA-B27) and rheumatic fever (post-streptococcal), in contrast to septic (infective) arthritis.", "type": "written", "keyhtml": "• Viral (immune complex) arthritis: rubella (natural infection or vaccine), parvovirus B19, chronic HCV, HBV, arboviruses (Dengue virus)\n• Reactive arthritis (HLA-B27): follows Campylobacter, Shigella, Salmonella, Chlamydia or Yersinia infection; antibiotics have no role — an NSAID is first-line therapy\n• Rheumatic fever: immune-mediated post-streptococcal disease; prophylactic treatment"}, "N-MIC-L3-09": {"id": "N-MIC-L3-09", "stem": "Mention the distinguishing laboratory features of Streptococcus agalactiae (group B streptococcus), its reservoir, the diseases it causes in newborns and its treatment.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Group B = Babies + Bacitracin-resistant: GBS is β haemolytic, CAMP positive and hydrolyzes hippurate, colonizes the vagina and infects the newborn at birth, causing neonatal septicaemia and meningitis.", "type": "written", "keyhtml": "• Laboratory: Gram-positive cocci in chains, catalase negative; β haemolytic; bacitracin resistant; hydrolyzes hippurate; CAMP test positive\n• Reservoir: human vagina (15–20% of women) and GI tract; the newborn is infected during birth (risk increased with prolonged labour after rupture of the membranes)\n• Diseases: neonatal septicaemia and meningitis (the most common causal agent)\n• Treatment: ampicillin with an aminoglycoside or a cephalosporin"}, "N-MIC-L3-10": {"id": "N-MIC-L3-10", "stem": "A patient with no wound, fracture or recent surgery develops osteomyelitis after bacteria reach bone through the blood from another site. Which part of the skeleton does this route of infection frequently involve?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Bacteria reach bone either by direct introduction (wounds, fractures, surgical procedures) or by hematogenous spread from other sites, and hematogenous spread frequently involves the vertebrae, as in Pott's disease due to M. tuberculosis.", "type": "mcq", "opts": ["Skull", "Ribs", "Vertebrae", "Small bones of the hand"], "ans": 2}, "N-MIC-L3-11": {"id": "N-MIC-L3-11", "stem": "In which group is osteomyelitis most common?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Osteomyelitis may occur at any age, but it is most common at 3–12 years and affects boys twice as frequently as girls.", "type": "mcq", "opts": ["Boys aged 3–12 years", "Girls aged 3–12 years", "Adults over 60 years", "Newborns in the first month"], "ans": 0}, "TP-019": {"id": "TP-019", "stem": "A 52-year-old man complains of pain in multiple joints, and you diagnose the case as arthritis. List two microbiological agents that cause septic arthritis.", "top": true, "rep": "", "tag": "Final bank MIC W22", "bank": true, "expl": "Septic (infective) arthritis is either non-gonococcal, most commonly caused by S. aureus, or gonococcal, caused by N. gonorrhoeae. Its route of transmission and clinical picture are as in osteomyelitis.", "type": "written", "keyhtml": "Any two of:\n• Non-gonococcal arthritis: Staphylococcus aureus (the most common cause) · Haemophilus influenzae · Mycobacterium tuberculosis · Gram-negative bacilli\n• Gonococcal arthritis: Neisseria gonorrhoeae"}, "TP-060": {"id": "TP-060", "stem": "A patient presents with suspected septic arthritis. Which investigation provides the most definitive diagnosis?", "top": true, "rep": "", "tag": "Final bank MIC Q44", "bank": true, "expl": "In acute septic arthritis, synovial fluid (with a blood culture) is examined, and only septic fluid is culture positive — normal, non-inflammatory and inflammatory fluids are culture negative. Rheumatoid factor is a blood test for rheumatoid arthritis, and radiology shows only soft tissue swelling until the joint is destroyed.", "type": "mcq", "opts": ["ESR level", "MRI scan", "Synovial fluid culture", "Blood leukocyte count", "Rheumatoid factor"], "ans": 2}, "TP-092": {"id": "TP-092", "stem": "A 3-year-old child presents with fever and refusal to move the hip joint. Septic arthritis is suspected and synovial fluid analysis is performed. List two laboratory findings that support the diagnosis of septic arthritis.", "top": true, "rep": "", "tag": "Final bank MIC W25", "bank": true, "expl": "Septic fluid is the only culture-positive synovial fluid and has PMNs ≥ 75%. Inflammatory fluid can reach a similar WBC count (2,000–100,000) but has PMNs ≥ 50% and is culture negative.", "type": "written", "keyhtml": "Any two of (septic synovial fluid):\n• Clarity: opaque\n• Colour: yellow to green, frank pus\n• WBC: 15,000 to &gt; 100,000 per mm³\n• PMNs ≥ 75%\n• Culture positive\n(Also: volume often &gt; 3.5 mL in the knee; viscosity variable.)"}}, "labs": {}, "cards": [{"id": "MIC-L3-001", "text": "Bacteria reach bone by {{c1::direct introduction}} (through wounds, fractures or surgical procedures) or by {{c2::hematogenous spread}} in the blood from other sites", "extra": "", "sec": "Part 01 · 1.1 Routes of infection"}, {"id": "MIC-L3-002", "text": "Hematogenous spread of bacteria to bone frequently involves the {{c1::vertebrae}}", "extra": "e.g. Pott's disease (M. tuberculosis).", "sec": "Part 01 · 1.1 Routes of infection"}, {"id": "MIC-L3-003", "text": "Organisms that damage bone & joints: {{c1::Gram-positive cocci (staph & strep)}} · {{c2::spirochetes}} · {{c3::Neisseria gonorrhoeae}} · {{c4::Mycobacterium tuberculosis}}", "extra": "", "sec": "Part 01 · 1.2 Organisms that damage bone & joints"}, {"id": "MIC-L3-004", "text": "Spirochetes that damage bone & joints: Lyme disease = {{c1::Borrelia burgdorferi}}; syphilis = {{c2::Treponema pallidum}}", "extra": "Their toxins & virulence factors → bone/joint destruction or septic arthritis.", "sec": "Part 01 · 1.2 Organisms that damage bone & joints"}, {"id": "MIC-L3-005", "text": "Staph & strep cause many {{c1::cutaneous}} infections that may progress to osteomyelitis or infectious arthritis", "extra": "", "sec": "Part 01 · 1.2 Organisms that damage bone & joints"}, {"id": "MIC-L3-006", "text": "M. tuberculosis may spread {{c1::systemically}} and progress to bone infection and {{c2::necrosis}}", "extra": "", "sec": "Part 01 · 1.2 Organisms that damage bone & joints"}, {"id": "MIC-L3-007", "text": "Bone infections are difficult to treat — they need {{c1::aggressive and prolonged}} antibiotic therapy, sometimes {{c2::intravenous}} or {{c3::multidrug}}", "extra": "", "sec": "Part 01 · 1.2 Organisms that damage bone & joints"}, {"id": "MIC-L3-008", "text": "{{c1::Osteomyelitis}} = a progressive infection of one or multiple parts of the bone, classified as {{c2::acute or chronic}}", "extra": "", "sec": "Part 02 · Osteomyelitis — definition"}, {"id": "MIC-L3-009", "text": "Osteomyelitis age · sex: any age, most common at {{c1::3–12 years}} · boys : girls = {{c2::2 : 1}}", "extra": "", "sec": "Part 02 · Osteomyelitis — definition"}, {"id": "MIC-L3-010", "text": "Microbial etiology of osteomyelitis: {{c1::bacterial}} · {{c2::viral}} · {{c3::fungal}}", "extra": "", "sec": "Part 02 · 2.1 Microbial etiology"}, {"id": "MIC-L3-011", "text": "Most common cause of osteomyelitis: {{c1::Staphylococcus aureus}}", "extra": "Also the most common cause of non-gonococcal septic arthritis.", "sec": "Part 02 · 2.1 Microbial etiology"}, {"id": "MIC-L3-012", "text": "Genus Streptococcus: Gram-positive cocci in {{c1::chains}} · catalase {{c2::negative::+ or −}}", "extra": "", "sec": "Part 03 · 3.1 Genus Streptococcus"}, {"id": "MIC-L3-013", "text": "Streptococci are serogrouped with antibodies to the cell-wall {{c1::carbohydrates}} — {{c2::Lancefield}} groups A–O", "extra": "", "sec": "Part 03 · 3.1 Genus Streptococcus"}, {"id": "MIC-L3-014", "text": "{{c1::Streptococcus agalactiae}} = Lancefield group {{c2::B}} streptococcus (GBS)", "extra": "", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-015", "text": "GBS distinguishing features: {{c1::β::α, β or γ}} hemolytic · bacitracin {{c2::resistant::sensitive or resistant}} · {{c3::hydrolyzes hippurate}} · CAMP test {{c4::positive::+ or −}}", "extra": "Group B = Babies + Bacitracin-resistant.", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-016", "text": "GBS reservoir: human {{c1::vagina}} ({{c2::15–20%}} of women) and the {{c3::GI tract}}", "extra": "", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-017", "text": "GBS transmission: the newborn is infected {{c1::during birth}} — risk ↑ with {{c2::prolonged labour after rupture of membranes}}", "extra": "", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-018", "text": "GBS pathogenesis: {{c1::capsule}} · {{c2::β hemolysin}} · {{c3::CAMP factor}}", "extra": "", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-019", "text": "{{c1::Streptococcus agalactiae (GBS)}} is the most common cause of neonatal {{c2::septicaemia & meningitis}}", "extra": "", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-020", "text": "GBS treatment: {{c1::ampicillin}} with an {{c2::aminoglycoside or a cephalosporin}}", "extra": "", "sec": "Part 03 · 3.2 Streptococcus agalactiae (GBS)"}, {"id": "MIC-L3-021", "text": "M. tuberculosis: {{c1::acid-fast}} bacilli (because of its cell wall) — stained by {{c2::Ziehl–Neelsen (Z-N)}}", "extra": "Z-N shows red acid-fast bacilli.", "sec": "Part 03 · 3.3 Mycobacterium tuberculosis"}, {"id": "MIC-L3-022", "text": "M. tuberculosis culture medium: {{c1::Löwenstein–Jensen}}", "extra": "", "sec": "Part 03 · 3.3 Mycobacterium tuberculosis"}, {"id": "MIC-L3-023", "text": "{{c1::Pott's disease}} = {{c2::vertebral}} osteomyelitis caused by {{c3::M. tuberculosis}} via {{c4::hematogenous}} spread", "extra": "", "sec": "Part 03 · 3.3 Mycobacterium tuberculosis"}, {"id": "MIC-L3-024", "text": "M. tuberculosis: lung infection transmitted by {{c1::inhalation}} · prevention = {{c2::vaccine}} · treatment = {{c3::multiple drugs}}", "extra": "", "sec": "Part 03 · 3.3 Mycobacterium tuberculosis"}, {"id": "MIC-L3-025", "text": "Gram-negative bacilli that infect bone: {{c1::Salmonella spp.}} · {{c2::Pseudomonas aeruginosa}} · {{c3::Serratia marcescens}} · {{c4::Pasteurella multocida}}", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-026", "text": "Salmonella antigenic structures: {{c1::O}}, {{c2::H}} and {{c3::Vi}} antigens", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-027", "text": "{{c3::Salmonella spp.}}: transmitted by {{c1::ingestion of contaminated food or drink}}; causes osteomyelitis (hematogenous) in the course of {{c2::enteric fever or gastroenteritis}}", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-028", "text": "Pseudomonas aeruginosa produces: {{c1::endotoxin}} · {{c2::exopigment}} · {{c3::protease}} · {{c4::hemolysin}} · {{c5::exotoxin A}}", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-029", "text": "Pseudomonas exotoxin A: {{c1::↓ protein synthesis}} → {{c2::tissue necrosis}}", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-030", "text": "Pseudomonas aeruginosa and Serratia marcescens are both {{c1::hospital-related}}, with {{c2::multidrug resistance (MDR)}} common", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-031", "text": "Serratia marcescens: {{c1::non-motile::motile or non-motile}} Gram-negative bacillus · {{c2::opportunistic}} pathogen", "extra": "", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-032", "text": "Pigments — exopigment: {{c1::Pseudomonas aeruginosa}}; red pigment: {{c2::Serratia marcescens}}", "extra": "Pseudomonas = exoPigment · Serratia = Scarlet (red).", "sec": "Part 03 · 3.4 Gram-negative bacilli"}, {"id": "MIC-L3-033", "text": "Fungi that infect bone: Candida albicans = {{c1::yeast-like}} fungus; Histoplasma capsulatum = {{c2::dimorphic}} fungus", "extra": "", "sec": "Part 03 · 3.5 Fungal infections"}, {"id": "MIC-L3-034", "text": "Histoplasma capsulatum: {{c1::endemic}} in certain areas · infection by {{c2::inhalation}} · {{c3::intracellular}}", "extra": "", "sec": "Part 03 · 3.5 Fungal infections"}, {"id": "MIC-L3-035", "text": "Histoplasma treatment: mild disease → {{c1::itraconazole}}; severe disease → {{c2::amphotericin B}}", "extra": "", "sec": "Part 03 · 3.5 Fungal infections"}, {"id": "MIC-L3-036", "text": "Complications of osteomyelitis: {{c1::abscess in soft tissue}} · {{c2::fistula or sinus formation}} · {{c3::pathologic fracture}} · {{c4::extension into the joint (septic arthritis)}} · {{c5::growth disturbance}} · {{c6::severe deformity}}", "extra": "A → F: abscess · fistula/sinus · fracture · joint · growth · deformity.", "sec": "Part 04 · 4.1 Complications of osteomyelitis"}, {"id": "MIC-L3-037", "text": "Osteomyelitis complications by cause: extension into the joint → {{c1::septic arthritis}} · epiphyseal involvement → {{c2::growth disturbance}} · delayed treatment → {{c3::severe deformity}}", "extra": "", "sec": "Part 04 · 4.1 Complications of osteomyelitis"}, {"id": "MIC-L3-038", "text": "X-ray — osteomyelitis: {{c1::lytic areas}} + {{c2::periosteal elevation}}; septic arthritis: {{c3::soft tissue swelling}} → {{c4::joint destruction}} if the infection progresses", "extra": "Osteomyelitis diagnosis = A · laboratory + B · radiological.", "sec": "Part 08 · 8.1 Osteomyelitis vs septic arthritis"}, {"id": "MIC-L3-039", "text": "Arthritis = inflammation of the {{c1::surface of the cartilage}} lining the joint & the {{c2::synovial fluid}} that lubricates it", "extra": "", "sec": "Part 05 · Septic arthritis — definition"}, {"id": "MIC-L3-040", "text": "Most common presentation of arthritis: a {{c1::monoarticular}}, {{c2::large weight-bearing}} joint", "extra": "", "sec": "Part 05 · Septic arthritis — definition"}, {"id": "MIC-L3-041", "text": "Arthritis types — septic: {{c1::infective}}; aseptic: {{c2::viral}} · {{c3::reactive}} · {{c4::rheumatic fever}}", "extra": "Aseptic = V-R-R.", "sec": "Part 05 · Septic arthritis — definition"}, {"id": "MIC-L3-042", "text": "Non-gonococcal septic arthritis: {{c1::S. aureus}} (most common) · {{c2::H. influenzae}} · {{c3::M. tuberculosis}} · {{c4::Gram-negative bacilli}}", "extra": "", "sec": "Part 05 · 5.1 Microbial etiology of septic arthritis"}, {"id": "MIC-L3-043", "text": "Septic arthritis: route of transmission & clinical picture are {{c1::as in osteomyelitis}}", "extra": "Direct (wounds, fractures, surgery) or hematogenous.", "sec": "Part 05 · 5.1 Microbial etiology of septic arthritis"}, {"id": "MIC-L3-044", "text": "Septic arthritis diagnosis — I · laboratory (acute case): {{c1::synovial fluid}} and {{c2::blood culture}} · II · {{c3::radiologic}}", "extra": "", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-045", "text": "Synovial fluid volume (knee): normal {{c1::< 3.5 mL}}; non-inflammatory, inflammatory & septic often {{c2::> 3.5 mL}}", "extra": "", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-046", "text": "Synovial fluid clarity: normal {{c1::transparent}} · non-inflammatory {{c2::translucent}} · inflammatory {{c3::translucent–opaque}} · septic {{c4::opaque}}", "extra": "", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-047", "text": "Synovial fluid colour: normal {{c1::clear}} · non-inflammatory {{c2::yellow}} · inflammatory {{c3::yellow to opalescent}} · septic {{c4::yellow to green, frank pus}}", "extra": "", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-048", "text": "Synovial fluid viscosity: normal & non-inflammatory {{c1::high}} · inflammatory {{c2::low}} · septic {{c3::variable}}", "extra": "", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-049", "text": "Synovial fluid WBC per mm³: normal {{c1::< 200}} · non-inflammatory {{c2::0 to 2,000}} · inflammatory {{c3::2,000 to 100,000}} · septic {{c4::15,000 to > 100,000}}", "extra": "Inflammatory and septic counts overlap.", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-050", "text": "Synovial fluid PMNs: normal & non-inflammatory {{c1::< 25%}} · inflammatory {{c2::≥ 50%}} · septic {{c3::≥ 75%}}", "extra": "", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-051", "text": "Synovial fluid culture is positive only in {{c1::septic}} fluid — normal, non-inflammatory & inflammatory fluid are culture negative", "extra": "Septic fluid: opaque · ≥ 75% PMNs · culture +.", "sec": "Part 05 · 5.2 Laboratory diagnosis — synovial fluid"}, {"id": "MIC-L3-052", "text": "Neisseria gonorrhoeae: Gram-{{c1::negative::positive or negative}}, {{c2::kidney bean}}-shaped {{c3::diplococci}}", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-053", "text": "N. gonorrhoeae reservoir: {{c1::human genital tract}}; transmission: {{c2::sexual contact}} and {{c3::birth}}", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-054", "text": "N. gonorrhoeae pathogenesis: {{c1::pili}} · outer membrane proteins ({{c2::antigenic variation}}, adherence) · {{c3::IgA protease}}", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-055", "text": "Gonorrhoea in males: {{c1::urethritis}}, {{c2::proctitis}}", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-056", "text": "Gonorrhoea in females: {{c1::endocervicitis}} · {{c2::PID (contiguous spread)}} · {{c3::arthritis}} · {{c4::proctitis}}", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-057", "text": "Gonococcal infection in infants: {{c1::ophthalmia}} — rapidly leads to {{c2::blindness}} if untreated", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-058", "text": "Disseminated gonococcal disease: {{c1::arthritis}} + {{c2::skin lesions}}", "extra": "", "sec": "Part 05 · 5.3 Neisseria gonorrhoeae"}, {"id": "MIC-L3-059", "text": "Suspected gonorrhoea — specimen: male → {{c1::urethral discharge}}; female → {{c2::endocervical swab}}", "extra": "", "sec": "Part 05 · 5.4 Diagnosis of suspected gonorrhoea"}, {"id": "MIC-L3-060", "text": "Gonorrhoea Gram film: {{c1::intracellular}} Gram-negative diplococci in {{c2::PMNs}}", "extra": "", "sec": "Part 05 · 5.4 Diagnosis of suspected gonorrhoea"}, {"id": "MIC-L3-061", "text": "N. gonorrhoeae culture: {{c1::chocolate agar}} or {{c2::Thayer Martin}} medium, in {{c3::5–10% CO₂}}", "extra": "", "sec": "Part 05 · 5.4 Diagnosis of suspected gonorrhoea"}, {"id": "MIC-L3-062", "text": "N. gonorrhoeae identification: growth morphology · oxidase {{c1::positive::+ or −}} · sugars: maltose {{c2::not fermented::fermented or not}}", "extra": "Exam trap: gonococcus does not ferment maltose.", "sec": "Part 05 · 5.4 Diagnosis of suspected gonorrhoea"}, {"id": "MIC-L3-063", "text": "Gonorrhoea diagnosis — commonly used: {{c1::genetic probes with amplification}}", "extra": "", "sec": "Part 05 · 5.4 Diagnosis of suspected gonorrhoea"}, {"id": "MIC-L3-064", "text": "Treatment of gonorrhoea / gonococcal arthritis: {{c1::ceftriaxone}}", "extra": "", "sec": "Part 05 · 5.4 Diagnosis of suspected gonorrhoea"}, {"id": "MIC-L3-065", "text": "Viral (immune complex) arthritis: {{c1::rubella}} · {{c2::parvovirus B19}} · {{c3::chronic HCV, HBV}} · {{c4::arboviruses (Dengue virus)}}", "extra": "", "sec": "Part 06 · Aseptic arthritis"}, {"id": "MIC-L3-066", "text": "Rubella can cause viral arthritis after natural infection or after the {{c1::vaccine}}", "extra": "", "sec": "Part 06 · Aseptic arthritis"}, {"id": "MIC-L3-067", "text": "{{c1::Reactive arthritis}} (an aseptic arthritis) is associated with {{c2::HLA-B27}}", "extra": "", "sec": "Part 06 · Aseptic arthritis"}, {"id": "MIC-L3-068", "text": "Reactive arthritis follows infection with: {{c1::Campylobacter}} · {{c2::Shigella}} · {{c3::Salmonella}} · {{c4::Chlamydia}} · {{c5::Yersinia}}", "extra": "", "sec": "Part 06 · Aseptic arthritis"}, {"id": "MIC-L3-069", "text": "Reactive arthritis treatment: antibiotics have {{c1::no role}}; {{c2::NSAID}} is first-line", "extra": "Exam trap: it follows a bacterial infection, yet no antibiotics.", "sec": "Part 06 · Aseptic arthritis"}, {"id": "MIC-L3-070", "text": "Rheumatic fever: immune-mediated {{c1::post-streptococcal}} disease; management = {{c2::prophylactic treatment}}", "extra": "", "sec": "Part 06 · Aseptic arthritis"}, {"id": "MIC-L3-071", "text": "Clostridium perfringens: large Gram-{{c1::positive::positive or negative}}, {{c2::spore-forming}} rods · {{c3::non-motile::motile or non-motile}}", "extra": "", "sec": "Part 07 · 7.1 Clostridium perfringens — the organism"}, {"id": "MIC-L3-072", "text": "C. perfringens spores are {{c1::rare in tissue}}", "extra": "Classic exam trap.", "sec": "Part 07 · 7.1 Clostridium perfringens — the organism"}, {"id": "MIC-L3-073", "text": "C. perfringens lab trio: milk media (anaerobic (() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){

  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);
  if (rs.getPropertyValue('--ph') !== vph) rs.setProperty('--ph', vph);
  book.classList.toggle('single', mode === 'single');
  // a new size only reflows the CSS; the pages are rebuilt only when the book switches between one and two pages,
  // so a phone's sliding toolbar, the keyboard or a resizing frame can never reset the page you are reading
  if (opened && (force || mode !== drawnMode)) draw();
}
window.addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(function again(){ if (busy){ layout.t = setTimeout(again, 120); return; } layout(); }, 80);
});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){
      if (at + 1 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at, 'r'); lb.innerHTML = '<div class="pin"></div>'; setPage(pgL, at + 1, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)', opacity: 1}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .7}, {transform: 'rotateY(-180deg)', opacity: 0}], () => { at++; clearLeaf(); busy = false; mark(at); upd(); });
    } else {
      if (at - 1 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at - 1, 'r'); lb.innerHTML = '<div class="pin"></div>'; leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(-180deg)', opacity: 0}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .3}, {transform: 'rotateY(0deg)', opacity: 1}], () => { at--; setPage(pgL, at, 'r'); clearLeaf(); busy = false; upd(); });
    }
  }
}
function jump(i){
  i = Math.max(0, Math.min(N - 1, i)); closeOv();
  if (!opened) openBook(i); else { at = i; draw(); }
}
document.addEventListener('keydown', e => {
  if (!opened || document.querySelector('#ovs .ov')) { if (e.key === 'Escape') closeOv(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
let tx0 = null, ty0 = 0;
book.addEventListener('touchstart', e => { const t = e.touches[0]; if (e.target.closest('.nosw,input,textarea,button,svg')) { tx0 = null; return; } tx0 = t.clientX; ty0 = t.clientY; }, {passive: true});
book.addEventListener('touchend', e => { if (tx0 === null) return; const t = e.changedTouches[0]; const dx = t.clientX - tx0, dy = t.clientY - ty0; tx0 = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1); }, {passive: true});

/* ---------- home (closed book) ---------- */
function examDays(d){ const t = new Date(d + 'T00:00:00'); const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return Math.round((t - a) / 864e5); }
function chipFor(e){ const n = examDays(e.date); if (n < 0) return ''; return `<span class="cd">${esc(e.name)} · <b>${n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'}</b></span>`; }
function stats(){
  const nr = Object.keys(S.read).length;
  const ids = Object.keys(S.ans).filter(q => QS[q]); const ok = ids.filter(q => S.ans[q].ok).length;
  const learned = Object.values(S.cards).filter(c => c.step >= 2).length;
  return {nr, ok, n: ids.length, learned};
}
function home(){
  opened = false; book.hidden = true; $('#mnav').hidden = true; $('#pgind').textContent = '';
  const st = stats();
  const cont = S.last > 1 ? `Continue on page ${S.last}` : 'Open the book';
  $('#home').hidden = false;
  $('#home').innerHTML = `
  <div class="cover" id="cover">
    <div class="frame"></div>
    <div class="k">THE HELPERS · SEM 3 · 2026–27</div>
    <div class="t1">MSK</div>
    <div class="t2">${esc(BOOK.subject.toUpperCase())}</div>

  </div>
  <div class="side">
    ${BOOK.lib ? `<a class="libl" href="${esc(BOOK.lib)}">← All lectures</a>` : ''}
    <h1>${esc(BOOK.title)}</h1>

    <div class="stats">
      <div class="stat"><b>${st.nr}/${N}</b><span>pages read</span></div>
      <div class="stat"><b>${st.ok}/${st.n}</b><span>answered right</span></div>

    </div>

    <div class="hrow">
      <button class="hbtn" data-act="open-cards">Flashcards</button>

    </div>
  </div>`;
  $('#chap').textContent = BOOK.short;
}
function openBook(i){
  const go2 = () => { $('#home').hidden = true; book.hidden = false; opened = true; if (i !== undefined) at = i; layout(true); };
  const c = $('#cover');
  if (c && DUR && c.animate){ c.animate([{transform: 'perspective(1400px) rotateY(0)'}, {transform: 'perspective(1400px) rotateY(-80deg)', opacity: .2}], {duration: 520, easing: 'ease-in'}).onfinish = go2; }

/* ---------- block renderers ---------- */
H.part = b => `<div class="part"><span class="pn">${esc(b.no)}</span><div><small>Part ${esc(b.no)}</small><h2>${esc(b.title)}</h2>${b.sub ? `<p>${esc(b.sub)}</p>` : ''}</div><span class="big">${esc(b.no)}</span></div>`;
