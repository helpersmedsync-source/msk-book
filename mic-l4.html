{"id": "p45", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "MG is type II (antibody vs receptor), not type IV like RA &amp; MS"}, {"t": "note", "kind": "trap", "html": "RA has autoantibodies &amp; RF yet the lecture calls it T cell-mediated, type IV"}, {"t": "note", "kind": "trap", "html": "AS called a reactive arthritis with HLA-B27, but not all patients are B27 positive"}, {"t": "note", "kind": "trap", "html": "Botulinum blocks ACh release; tetanus prolongs ACh action by removing inhibition"}, {"t": "note", "kind": "trap", "html": "Botulism → flaccid; tetanus → spasmodic"}, {"t": "note", "kind": "trap", "html": "Tetanus from soil (C. tetani); botulism from stored food (C. botulinum)"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p46", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Psoriasis linked to HLA-B27 in this lecture"}, {"t": "note", "kind": "trap", "html": "SLE butterfly rash = immune complexes at dermal–epidermal junction"}, {"t": "note", "kind": "cl", "html": "RA drugs: prolonged use risks immunosuppression and infections"}]}, {"id": "p47", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0369": {"id": "Q0369", "stem": "What causes autoimmune diseases in general?", "top": false, "rep": "", "tag": "Final bank MIC W9", "bank": true, "expl": "Autoimmunity begins with failure of tolerance to self-antigens by immune cells developing in the fetal thymus, driven by genes, environment and hormones. In the musculoskeletal system, damage comes from immune complex deposition or from autoantibodies and inflammation directed against its tissues.", "type": "written", "keyhtml": "• Basic defect: failure of tolerance to self-antigens by immune cells undergoing development in the thymus in the fetus.\n• Contributing factors:\n  – Genetic factors: HLA genes (among the strongest genetic associations) and polymorphisms in non-HLA genes\n  – Environmental factors\n  – Hormonal triggers\n• In the musculoskeletal system, disease follows if antigen–antibody (immune) complexes deposit in tissues, or if autoantibodies and inflammatory response mechanisms are directed against the tissues and proteins of the musculoskeletal system."}, "Q0370": {"id": "Q0370", "stem": "What are the main genetic factors associated with autoimmune diseases?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "HLA genes are among the strongest genetic associations with autoimmune disease, and polymorphisms in non-HLA genes also contribute. The lecture links DR4 to RA, DR2 to MS, DR2/DR3 to SLE and B27 to ankylosing spondylitis and psoriasis.", "type": "written", "keyhtml": "• HLA genes — among the strongest genetic associations with autoimmune disease. In this lecture:\n  – HLA-DR4: rheumatoid arthritis\n  – HLA-DR2: multiple sclerosis\n  – HLA-DR2/DR3: SLE\n  – HLA-B27: ankylosing spondylitis and psoriasis\n• Polymorphisms in non-HLA genes also contribute."}, "Q0371": {"id": "Q0371", "stem": "What is the main defect in myasthenia gravis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In myasthenia gravis, anti-AChR autoantibodies bind the ACh receptors of the NMJ and reduce the ACh response at the motor endplate, causing muscle weakness such as ptosis. It is type II hypersensitivity, unlike RA and MS (type IV).", "type": "written", "keyhtml": "• Autoantibodies directed against acetylcholine (ACh) receptors of the neuromuscular junctions (NMJs).\n• They reduce the response of ACh at the motor endplate → muscle weakness (e.g. ptosis).\n• Type II hypersensitivity (antibody against a cell receptor)."}, "Q0372": {"id": "Q0372", "stem": "Describe briefly the mechanism of rheumatoid arthritis.", "top": false, "rep": "", "tag": "Final bank MIC W10", "bank": true, "expl": "Autoantibodies cause IgG deposits in the joints, giving chronic destructive inflammation with inflamed synovium, damaged articular cartilage, severe pain and bony fusion. Although rheumatoid factors and immune complexes are involved, the lecture calls RA T cell-mediated (type IV) and links it to HLA-DR4.", "type": "written", "keyhtml": "• Autoantibodies cause immunoglobulin (Ig)G deposits in the joints → chronic destructive inflammation of the joints.\n• Synovial membranes become inflamed, with marked damage to the articular cartilage → severe joint pain and bony fusion of the joints.\n• Thought to be T cell-mediated: autoantibodies with circulating rheumatoid factors and deposition of immune complexes induce inflammation in the joint synovium; CD4⁺ T-cell recognition of joint antigen → inflammatory cytokines → cartilage damage.\n• Associated with HLA-DR4; type IV hypersensitivity."}, "Q0373": {"id": "Q0373", "stem": "Which HLA type is associated with rheumatoid arthritis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Rheumatoid arthritis is associated with HLA-DR4. HLA-DR2 is linked to multiple sclerosis and HLA-DR2/DR3 to SLE.", "type": "written", "keyhtml": "HLA-DR4. (Rheumatoid arthritis is thought to be T cell-mediated — type IV hypersensitivity.)"}, "Q0374": {"id": "Q0374", "stem": "What is the mechanism of multiple sclerosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In multiple sclerosis, T cells destroy nerve sheath myelin in the white matter of the brain and spinal cord, which limits nerve AP transmission to skeletal muscle and causes paralysis. It is type IV hypersensitivity linked to HLA-DR2.", "type": "written", "keyhtml": "• T-cell responses destroy nerve sheath myelin (white matter of the brain and spinal cord).\n• Loss of myelin limits nerve action potential (AP) transmission to skeletal muscle → paralysis of skeletal muscles; a progressively debilitating disease.\n• Associated with HLA-DR2; type IV hypersensitivity."}, "Q0375": {"id": "Q0375", "stem": "What is the main autoimmune mechanism in systemic lupus erythematosus (SLE)?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In SLE, autoantibodies to nuclear antigens such as DNA form immune complexes in the joints and many other tissues (type III), causing tissue injury and inflammation. Deposition at the dermal–epidermal junction gives the butterfly rash.", "type": "written", "keyhtml": "• Autoantibodies to nuclear antigens such as DNA.\n• Type III hypersensitivity: immune complex formation in the joints and many other tissues → tissue injury and inflammation (synovitis, polyarthralgia).\n• Immune complexes deposited at the dermal–epidermal junction → erythematous 'butterfly' rash.\n• Associated with HLA-DR2/DR3."}, "Q0376": {"id": "Q0376", "stem": "Mention one diagnostic marker and one symptom of SLE.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "SLE is diagnosed by high titres of antinuclear antibodies (ANAs). Its effects include synovitis, polyarthralgia and an erythematous butterfly rash caused by immune complexes at the dermal–epidermal junction.", "type": "written", "keyhtml": "• Diagnostic marker: high titres of antinuclear antibodies (ANAs).\n• Symptom (any one): erythematous 'butterfly' rash (immune complexes at the dermal–epidermal junction), synovitis (synovial membrane inflammation) or polyarthralgia (multiple joint pains)."}, "Q0377": {"id": "Q0377", "stem": "What HLA types are associated with SLE?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "SLE is associated with HLA-DR2/DR3. HLA-DR2 alone is linked to multiple sclerosis and HLA-DR4 to rheumatoid arthritis.", "type": "written", "keyhtml": "HLA-DR2 and HLA-DR3."}, "N-MIC-L4-01": {"id": "N-MIC-L4-01", "stem": "The autoimmune diseases in this lecture are classified by the type of hypersensitivity that causes the tissue injury. Which of the following pairs is correctly matched?", "top": false, "rep": "", "tag": "Final bank MIC Q32", "bank": true, "expl": "Multiple sclerosis and rheumatoid arthritis are T cell-mediated, type IV. Myasthenia gravis is type II (autoantibodies against a cell receptor) and SLE is type III (immune complexes); RA is tempting as type III because of its immune complexes, but the lecture classes it as type IV.", "type": "mcq", "opts": ["Myasthenia gravis — type IV", "Systemic lupus erythematosus — type II", "Rheumatoid arthritis — type III", "Multiple sclerosis — type IV", "Myasthenia gravis — type III"], "ans": 3}, "N-MIC-L4-02": {"id": "N-MIC-L4-02", "stem": "A 32-year-old woman presents with ptosis and generalised muscle weakness. Her physician starts an anticholinesterase inhibitor and an immunosuppressive drug and plans a thymectomy. Which of the following best describes the mechanism of her disease?", "top": false, "rep": "", "tag": "Final bank MIC Q33", "bank": true, "expl": "Ptosis and weakness treated with anticholinesterase inhibitors, immunosuppressive drugs and thymectomy point to myasthenia gravis, where autoantibodies against ACh receptors of the NMJ reduce the ACh response at the motor endplate (type II). Blocking ACh vesicle release is the action of botulinum toxin, not an autoimmune mechanism.", "type": "mcq", "opts": ["T cells destroy the nerve sheath myelin of motor nerves", "A bacterial toxin blocks ACh release from synaptic vesicles", "Immune complexes deposit at the neuromuscular junction", "A bacterial toxin blocks the release of GABA and glycine", "Autoantibodies bind ACh receptors at the motor endplate"], "ans": 4}, "N-MIC-L4-03": {"id": "N-MIC-L4-03", "stem": "A 45-year-old woman has chronic, severe joint pain. Her synovial membranes are inflamed, there is marked damage to the articular cartilage and some joints show bony fusion. Circulating rheumatoid factors are detected. Which HLA association and hypersensitivity type apply to her disease?", "top": false, "rep": "", "tag": "Final bank MIC Q34", "bank": true, "expl": "Inflamed synovium, cartilage destruction, bony fusion and rheumatoid factors indicate rheumatoid arthritis, which is associated with HLA-DR4 and thought to be T cell-mediated (type IV). Immune complexes are deposited in its synovium, but type III is the type given for SLE (HLA-DR2/DR3).", "type": "mcq", "opts": ["HLA-DR4 — type IV", "HLA-DR2 — type IV", "HLA-DR2/DR3 — type III", "HLA-B27 — type II", "HLA-DR4 — type III"], "ans": 0}, "N-MIC-L4-04": {"id": "N-MIC-L4-04", "stem": "A 29-year-old woman presents with optic neuritis, diplopia, fatigue and urinary frequency. Over the following months she develops muscle weakness and ataxia. Which of the following best explains her disease?", "top": false, "rep": "", "tag": "Final bank MIC Q35", "bank": true, "expl": "Optic neuritis, diplopia, fatigue, weakness, ataxia and urinary symptoms are main symptoms of multiple sclerosis, in which T cells destroy nerve sheath myelin in the white matter of the brain and spinal cord (HLA-DR2, type IV). Anti-AChR autoantibodies cause myasthenia gravis, which acts at the NMJ rather than on myelin.", "type": "mcq", "opts": ["T cells destroy nerve sheath myelin in the brain and spinal cord", "Autoantibodies against ACh receptors reduce the endplate response", "A toxin blocks the release of GABA and glycine from inhibitory neurons", "Antinuclear antibodies form immune complexes in many tissues", "A toxin blocks ACh vesicle release at the neuromuscular junction"], "ans": 0}, "N-MIC-L4-05": {"id": "N-MIC-L4-05", "stem": "A 26-year-old woman presents with pain in several joints and synovitis. She also has an erythematous 'butterfly' rash. Which laboratory finding would best support the diagnosis?", "top": false, "rep": "", "tag": "Final bank MIC Q36", "bank": true, "expl": "Synovitis, polyarthralgia and a butterfly rash suggest SLE, which is diagnosed by high titres of antinuclear antibodies (ANAs) — autoantibodies to nuclear antigens such as DNA. Rheumatoid factors and HLA-DR4 belong to rheumatoid arthritis; SLE is linked to HLA-DR2/DR3.", "type": "mcq", "opts": ["Autoantibodies against acetylcholine receptors", "Circulating rheumatoid factors", "High titres of antinuclear antibodies", "HLA-B27 positivity", "HLA-DR4 positivity"], "ans": 2}, "N-MIC-L4-06": {"id": "N-MIC-L4-06", "stem": "A 28-year-old man has had inflammatory back pain for several months, with pain in his heels and an episode of uveitis. Imaging shows involvement of the sacroiliac joints. Which of the following statements about his condition is correct?", "top": false, "rep": "", "tag": "Final bank MIC Q37", "bank": true, "expl": "This is ankylosing spondylitis, an HLA-B27-associated reactive arthritis that can cause the spinal joints to fuse together. Symptoms first strike before age 45, it is more common in men (underdiagnosed in women), and only some, not all, patients are HLA-B27 positive.", "type": "mcq", "opts": ["It typically begins after the age of 45 years", "It is more common in women than in men", "It can cause the spinal joints to fuse together", "All patients are HLA-B27 positive", "It is caused by antinuclear antibodies forming immune complexes"], "ans": 2}, "N-MIC-L4-07": {"id": "N-MIC-L4-07", "stem": "A gardener who has handled poison ivy before pulls out the plant again and develops an inflamed rash on his forearms at the site of contact. The plant's oil (urushiol) acts as a hapten. Which cells recognise the hapten–self protein conjugate in the skin?", "top": false, "rep": "", "tag": "Final bank MIC Q38", "bank": true, "expl": "In contact dermatitis the hapten (e.g. poison ivy oil, urushiol) binds a self protein, and CD4⁺ T cells enter, recognise the hapten–protein conjugate and release chemokines and cytokines. Macrophages and other phagocytes enter only afterwards and produce the inflammation.", "type": "mcq", "opts": ["Macrophages", "CD4⁺ T cells", "B cells producing autoantibodies", "Basal keratinocytes"], "ans": 1}, "N-MIC-L4-08": {"id": "N-MIC-L4-08", "stem": "A 35-year-old man has chronic inflammation of the skin with scaling plaques on his back. A skin biopsy shows T-cell infiltration, and the lesions are thought to be triggered by bacterial superantigens. Which process underlies his scaling lesions?", "top": false, "rep": "", "tag": "Final bank MIC Q39", "bank": true, "expl": "Chronic scaling skin inflammation with T-cell infiltration and a superantigen trigger is psoriasis (HLA-B27 in this lecture), which results in hyperproliferation of basal keratinocytes. Immune complexes at the dermal–epidermal junction cause the butterfly rash of SLE, and hapten–protein recognition by CD4⁺ T cells is contact dermatitis.", "type": "mcq", "opts": ["Deposition of immune complexes at the dermal–epidermal junction", "Hyperproliferation of basal keratinocytes", "Increased secretion from the sebaceous glands", "Recognition of a hapten–protein conjugate by CD4⁺ T cells"], "ans": 1}, "N-MIC-L4-09": {"id": "N-MIC-L4-09", "stem": "A farmer develops spasmodic contractions of his muscles. The causative organism, a Gram-positive anaerobic bacillus, came from the soil. How does its toxin produce the spasms?", "top": false, "rep": "", "tag": "Final bank MIC Q40", "bank": true, "expl": "Spasm caused by a soil-borne Gram-positive anaerobic bacillus is tetanus: the C. tetani toxin reaches the inhibitory neuron by retrograde neuronal flow and blocks release of GABA and glycine, leaving motor neurons in unrestrained excitation. Blocking ACh vesicle release is the action of botulinum toxin, which causes flaccid paralysis instead.", "type": "mcq", "opts": ["It blocks the release of ACh from synaptic vesicles at the neuromuscular junction", "It induces autoantibodies against ACh receptors at the motor endplate", "It activates T cells that destroy the nerve sheath myelin", "It blocks the release of the inhibitory transmitters GABA and glycine"], "ans": 3}, "N-MIC-L4-10": {"id": "N-MIC-L4-10", "stem": "Autoimmune diseases arise from a combination of genetic, environmental and hormonal factors. Which of the following is among the strongest genetic associations with autoimmune disease?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Among the strongest genetic associations with autoimmune disease are the HLA genes. Polymorphisms in non-HLA genes also contribute, but less strongly, and hormonal and environmental factors are non-genetic triggers.", "type": "mcq", "opts": ["Polymorphisms in non-HLA genes", "HLA genes", "Hormonal triggers", "Environmental factors"], "ans": 1}, "N-MIC-L4-11": {"id": "N-MIC-L4-11", "stem": "A 50-year-old woman with rheumatoid arthritis has been treated for years with a corticosteroid, methotrexate and an anti-TNF-α drug. Which of the following statements about this treatment is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "RA drugs (NSAIDs, corticosteroids, methotrexate, anti-TNF-α) relieve pain and possibly slow the joint destruction. Their prolonged use risks immunosuppression, so infections can be a problem; improving neuromuscular signalling is the aim of myasthenia gravis treatment.", "type": "mcq", "opts": ["It cures the disease by removing rheumatoid factors from the blood", "It relieves pain and possibly slows the joint destruction", "It acts mainly by improving neuromuscular signalling", "It reverses the bony fusion of the affected joints", "Its prolonged use lowers the risk of infection"], "ans": 1}, "N-MIC-L4-12": {"id": "N-MIC-L4-12", "stem": "A 24-year-old woman with polyarthralgia and synovitis has an erythematous 'butterfly' rash and high titres of antinuclear antibodies. What causes her rash?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In SLE, autoantibodies to nuclear antigens form immune complexes, and their deposition at the dermal–epidermal junction gives the erythematous butterfly rash. T-cell infiltration with superantigens and keratinocyte hyperproliferation describe psoriasis.", "type": "mcq", "opts": ["Deposition of immune complexes at the dermal–epidermal junction", "Hyperproliferation of basal keratinocytes", "Recognition of a hapten–protein conjugate by CD4⁺ T cells", "Increased secretion from the sebaceous glands", "T-cell infiltration triggered by bacterial superantigens"], "ans": 0}, "N-MIC-L4-13": {"id": "N-MIC-L4-13", "stem": "Three members of a family develop flaccid paralysis of their muscles after eating food that had been stored at home. Which of the following statements about the causative toxin is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Flaccid paralysis after stored food is botulism: C. botulinum toxin passes from the gut into the circulation, is taken up by an axon and cleaved, and its A subunit blocks ACh release from synaptic vesicles. Retrograde flow to inhibitory neurons and blocking GABA and glycine describe tetanus toxin, which causes spasm.", "type": "mcq", "opts": ["It is produced by a Gram-negative bacillus found in soil", "It reaches inhibitory neurons by retrograde neuronal flow", "Its A subunit blocks ACh release from synaptic vesicles", "It blocks the release of GABA and glycine from inhibitory neurons", "It prolongs ACh action by removing inhibition of motor neurons"], "ans": 2}, "N-MIC-L4-14": {"id": "N-MIC-L4-14", "stem": "Which of the following pairs of HLA type and disease is correctly matched according to this lecture?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The lecture links HLA-B27 to ankylosing spondylitis and psoriasis. HLA-DR4 goes with rheumatoid arthritis, HLA-DR2 with multiple sclerosis and HLA-DR2/DR3 with SLE.", "type": "mcq", "opts": ["HLA-DR4 — multiple sclerosis", "HLA-DR2 — rheumatoid arthritis", "HLA-B27 — psoriasis", "HLA-B27 — systemic lupus erythematosus", "HLA-DR4 — ankylosing spondylitis"], "ans": 2}, "N-MIC-L4-15": {"id": "N-MIC-L4-15", "stem": "Which inflammatory skin disorder is attributed in this lecture to sebaceous gland secretions?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Acne is caused by sebaceous gland secretions. Eczema is described only as a common inflammatory skin disorder, psoriasis results from keratinocyte hyperproliferation, and contact dermatitis follows contact with substances such as poison ivy oil.", "type": "mcq", "opts": ["Eczema", "Acne", "Psoriasis", "Contact dermatitis"], "ans": 1}, "N-MIC-L4-16": {"id": "N-MIC-L4-16", "stem": "Compare botulinum toxin and tetanus toxin.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All rows come from the botulinum vs tetanus toxin table (8.1). Botulism = Blocked ACh → floppy; Tetanus = Tight muscles.", "type": "written", "keyhtml": "Feature: botulinum toxin | tetanus toxin\n• Organism: C. botulinum — Gram-positive anaerobic bacillus | C. tetani — Gram-positive anaerobic bacillus\n• Source: stored food | soil\n• Route: passes from the gut into the circulation → taken up by an axon and cleaved into A and B subunits | reaches the inhibitory neuron by retrograde neuronal flow\n• Action: blocks neuromuscular transmission — the A subunit blocks ACh vesicle release | prolongs ACh action by blocking release of the inhibitory neurotransmitters GABA and glycine → unrestrained excitation of motor neurons\n• Disease: botulism (muscle paralysis) | tetanus\n• Muscle: flaccid paralysis (no contraction) | spasmodic contraction"}, "N-MIC-L4-17": {"id": "N-MIC-L4-17", "stem": "Enumerate the main symptoms of multiple sclerosis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All symptoms come from the main symptoms of MS table (4.2), grouped by system.", "type": "written", "keyhtml": "• Central: fatigue, cognitive impairment, depression, anxiety, unstable mood\n• Visual: nystagmus, optic neuritis, diplopia\n• Speech and throat: dysarthria, dysphagia\n• Musculoskeletal: weakness, spasms, ataxia\n• Sensation: pain, hypoesthesias, paraesthesias\n• Bowel: incontinence, diarrhoea or constipation\n• Urinary: incontinence, frequency or retention"}, "N-MIC-L4-18": {"id": "N-MIC-L4-18", "stem": "Describe the steps of contact dermatitis, giving an example of the causative substance.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The steps and example come from the contact dermatitis box (7.2): hapten → hapten–protein conjugate → CD4⁺ T cells → macrophages → inflammation.", "type": "written", "keyhtml": "Example: toxic poison ivy oil (urushiol).\nSteps (second exposure):\n1. A chemically active compound (hapten) is applied to the skin.\n2. It binds a self protein → hapten–protein conjugate.\n3. CD4⁺ T cells enter, recognise the conjugate and release chemokines and cytokines.\n4. Macrophages and other phagocytes enter → inflammation at the contact site."}, "N-MIC-L4-19": {"id": "N-MIC-L4-19", "stem": "A 30-year-old man complains of inflammatory back pain for several months, with pain in his heels and an episode of uveitis. Imaging shows involvement of the sacroiliac joints.\na) What is the most likely diagnosis?\nb) Which HLA type is associated with it, and is it present in all patients?\nc) Mention other sites this disease can affect.\nd) How is it treated?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All points come from the ankylosing spondylitis definition and feature table (Part 06). Exam trap: AS is called an HLA-B27 reactive arthritis, yet not all patients are HLA-B27 positive.", "type": "written", "keyhtml": "a) Ankylosing spondylitis — a reactive arthritis; the cause is unknown, but there may be a link with previous exposure to certain bacterial infections. Symptoms first strike before age 45; more common in men (underdiagnosed in women); it can cause the spinal joints to fuse together.\nb) HLA-B27 — some, but not all, patients are HLA-B27 positive.\nc) Eyes (uveitis), shoulders, gut (IBD), sacroiliac joints, skin (psoriasis), knees, heels.\nd) It may respond to anti-inflammatory drugs — NSAIDs and/or biologics; treated by a rheumatologist."}, "N-MIC-L4-20": {"id": "N-MIC-L4-20", "stem": "Mention the treatment of myasthenia gravis and of rheumatoid arthritis according to this lecture.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Both lists come from the treatment sections of Parts 02 and 03 and the treatment-at-a-glance table (9.2).", "type": "written", "keyhtml": "Myasthenia gravis:\n• Immunosuppressive drugs, anticholinesterase inhibitors and thymectomy\n• These limit immune responsiveness and may improve neuromuscular signalling.\nRheumatoid arthritis:\n• NSAIDs, corticosteroids, methotrexate, anti-TNF-α\n• These relieve pain and possibly slow the joint destruction.\n• Prolonged use risks immunosuppression, and infections can also be problematic."}, "N-MIC-L4-21": {"id": "N-MIC-L4-21", "stem": "Classify the autoimmune disorders of this lecture according to the type of hypersensitivity, giving the mechanism of each type.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The classification comes from the hypersensitivity types box (1.2). Mnemonic: MG = 2 letters → type II; SLE = 3 letters → type III; RA &amp; MS → type IV (T cells).", "type": "written", "keyhtml": "• Type II — autoantibodies against a cell receptor: myasthenia gravis (antibodies against the ACh receptor).\n• Type III — immune complex formation in tissues: systemic lupus erythematosus.\n• Type IV — T cell-mediated: rheumatoid arthritis and multiple sclerosis."}, "TP-022": {"id": "TP-022", "stem": "A boy was injured by a piece of iron while playing in the street. One day later he complains of continuous contraction of the muscles all over his body, due to blocking of the inhibitory mechanisms, which prolongs the action of acetylcholine (ACh). What is the name of the microorganism responsible for this symptom?", "top": true, "rep": "", "tag": "Final bank MIC W27", "bank": true, "expl": "Tetanus toxin prolongs ACh action by blocking inhibitory mechanisms (release of GABA and glycine), giving spasmodic contraction. Botulinum toxin (C. botulinum, stored food) does the opposite: it blocks ACh release and causes flaccid paralysis.", "type": "written", "keyhtml": "Clostridium tetani (tetanus) — a Gram-positive anaerobic bacillus from the soil. Its tetanus toxin reaches the inhibitory neuron by retrograde neuronal flow and blocks the release of the inhibitory neurotransmitters GABA and glycine → unrestrained excitation of motor neurons → spasmodic contraction of muscle."}}, "labs": {}, "cards": [{"id": "MIC-L4-001", "text": "Autoimmunity: failure of {{c1::tolerance to self-antigens}} by immune cells developing in the {{c2::thymus in the fetus}}", "extra": "", "sec": "Part 01 · Autoimmune disorders — definition"}, {"id": "MIC-L4-002", "text": "Failed self-tolerance → MSK autoimmune disease if {{c1::antigen–antibody complexes deposit in tissues}}, or if {{c2::autoantibodies & inflammatory mechanisms}} are directed against MSK tissues and proteins", "extra": "", "sec": "Part 01 · Autoimmune disorders — definition"}, {"id": "MIC-L4-003", "text": "Causes of autoimmune disease: {{c1::genetic}} factors · {{c2::environmental}} factors · {{c3::hormonal}} triggers", "extra": "Autoimmunity = genes + environment + hormones.", "sec": "Part 01 · 1.1 Why autoimmunity develops"}, {"id": "MIC-L4-004", "text": "Among the strongest genetic associations with autoimmune disease: {{c1::HLA genes}}; polymorphisms in {{c2::non-HLA genes}} also contribute", "extra": "", "sec": "Part 01 · 1.1 Why autoimmunity develops"}, {"id": "MIC-L4-005", "text": "Hypersensitivity mechanisms — type II: {{c1::autoantibodies against a cell receptor}} · type III: {{c2::immune complex formation in tissues}} · type IV: {{c3::T cell-mediated}}", "extra": "", "sec": "Part 01 · 1.2 Hypersensitivity types"}, {"id": "MIC-L4-006", "text": "Hypersensitivity type — myasthenia gravis: {{c1::II}} · SLE: {{c2::III}} · rheumatoid arthritis: {{c3::IV}} · multiple sclerosis: {{c4::IV}}", "extra": "MG = 2 letters → II · SLE = 3 letters → III · RA & MS → IV (T cells).", "sec": "Part 01 · 1.2 Hypersensitivity types"}, {"id": "MIC-L4-007", "text": "Rheumatoid arthritis has autoantibodies, rheumatoid factors & immune complexes, yet the lecture classes it as type {{c1::IV}} ({{c2::T cell}}-mediated)", "extra": "Exam trap — not type III.", "sec": "Part 01 · 1.2 Hypersensitivity types"}, {"id": "MIC-L4-008", "text": "{{c3::Myasthenia gravis}}: autoantibodies against {{c1::acetylcholine (ACh) receptors}} of the {{c2::neuromuscular junction (NMJ)}}", "extra": "", "sec": "Part 02 · 2.1 Myasthenia gravis — mechanism"}, {"id": "MIC-L4-009", "text": "Myasthenia gravis: anti-AChR antibodies ↓ the ACh response at the {{c1::motor endplate}} → {{c2::muscle weakness}} (e.g. {{c3::ptosis}})", "extra": "", "sec": "Part 02 · 2.1 Myasthenia gravis — mechanism"}, {"id": "MIC-L4-010", "text": "Myasthenia gravis treatment: {{c1::immunosuppressive drugs}} · {{c2::anticholinesterase inhibitors}} · {{c3::thymectomy}}", "extra": "", "sec": "Part 02 · 2.2 Myasthenia gravis — treatment"}, {"id": "MIC-L4-011", "text": "Myasthenia gravis treatments limit {{c1::immune responsiveness}} and may improve {{c2::neuromuscular signalling}}", "extra": "", "sec": "Part 02 · 2.2 Myasthenia gravis — treatment"}, {"id": "MIC-L4-012", "text": "Rheumatoid arthritis: autoantibodies cause {{c1::IgG}} deposits in joints → {{c2::chronic destructive inflammation}}", "extra": "", "sec": "Part 03 · Rheumatoid arthritis — definition"}, {"id": "MIC-L4-013", "text": "RA joint damage: inflamed {{c1::synovial membranes}} + marked damage to the {{c2::articular cartilage}} → severe joint pain and {{c3::bony fusion}} of the joints", "extra": "", "sec": "Part 03 · 3.1 Rheumatoid arthritis — pathogenesis"}, {"id": "MIC-L4-014", "text": "RA is thought to be {{c1::T cell}}-mediated: autoantibodies with circulating {{c2::rheumatoid factors}} and deposited {{c3::immune complexes}} induce inflammation in the joint synovium", "extra": "", "sec": "Part 03 · 3.1 Rheumatoid arthritis — pathogenesis"}, {"id": "MIC-L4-015", "text": "RA cartilage damage: {{c1::CD4⁺ T-cell}} recognition of joint antigen → {{c2::inflammatory cytokines}}", "extra": "", "sec": "Part 03 · 3.1 Rheumatoid arthritis — pathogenesis"}, {"id": "MIC-L4-016", "text": "Rheumatoid arthritis HLA association: {{c1::HLA-DR4}}", "extra": "", "sec": "Part 03 · 3.1 Rheumatoid arthritis — pathogenesis"}, {"id": "MIC-L4-017", "text": "Rheumatoid arthritis treatment: {{c1::NSAIDs}} · {{c2::corticosteroids}} · {{c3::methotrexate}} · {{c4::anti-TNF-α}}", "extra": "", "sec": "Part 03 · 3.2 Rheumatoid arthritis — treatment"}, {"id": "MIC-L4-018", "text": "RA drugs {{c1::relieve pain}} and possibly {{c2::slow the joint destruction}}", "extra": "", "sec": "Part 03 · 3.2 Rheumatoid arthritis — treatment"}, {"id": "MIC-L4-019", "text": "Prolonged use of RA drugs risks {{c1::immunosuppression}} — {{c2::infections}} can also be a problem", "extra": "", "sec": "Part 03 · 3.2 Rheumatoid arthritis — treatment"}, {"id": "MIC-L4-020", "text": "{{c3::Multiple sclerosis}}: {{c1::T-cell}} responses destroy {{c2::nerve sheath myelin}} (white matter of brain & spinal cord)", "extra": "", "sec": "Part 04 · 4.1 Multiple sclerosis — mechanism"}, {"id": "MIC-L4-021", "text": "Multiple sclerosis: myelin loss → ↓ {{c1::nerve AP transmission}} to skeletal muscle → {{c2::paralysis of skeletal muscles}}", "extra": "A progressively debilitating disease.", "sec": "Part 04 · 4.1 Multiple sclerosis — mechanism"}, {"id": "MIC-L4-022", "text": "Multiple sclerosis HLA association: {{c1::HLA-DR2}}", "extra": "MS = 2 letters → DR2.", "sec": "Part 04 · 4.1 Multiple sclerosis — mechanism"}, {"id": "MIC-L4-023", "text": "MS — visual symptoms: {{c1::nystagmus}} · {{c2::optic neuritis}} · {{c3::diplopia}}", "extra": "", "sec": "Part 04 · 4.2 Main symptoms of MS"}, {"id": "MIC-L4-024", "text": "MS — central symptoms: {{c1::fatigue}} · {{c2::cognitive impairment}} · {{c3::depression}} · {{c4::anxiety}} · {{c5::unstable mood}}", "extra": "", "sec": "Part 04 · 4.2 Main symptoms of MS"}, {"id": "MIC-L4-025", "text": "MS — speech & throat symptoms: {{c1::dysarthria}} · {{c2::dysphagia}}", "extra": "", "sec": "Part 04 · 4.2 Main symptoms of MS"}, {"id": "MIC-L4-026", "text": "MS — musculoskeletal symptoms: {{c1::weakness}} · {{c2::spasms}} · {{c3::ataxia}}", "extra": "", "sec": "Part 04 · 4.2 Main symptoms of MS"}, {"id": "MIC-L4-027", "text": "MS — sensory symptoms: {{c1::pain}} · {{c2::hypoesthesias}} · {{c3::paraesthesias}}", "extra": "", "sec": "Part 04 · 4.2 Main symptoms of MS"}, {"id": "MIC-L4-028", "text": "MS — bowel: incontinence, {{c1::diarrhoea or constipation}}; urinary: incontinence, {{c2::frequency or retention}}", "extra": "", "sec": "Part 04 · 4.2 Main symptoms of MS"}, {"id": "MIC-L4-029", "text": "SLE is a chronic autoimmune inflammatory disease; in the joints it causes {{c1::synovitis}} (synovial membrane inflammation) and {{c2::polyarthralgia}} (multiple joint pains)", "extra": "", "sec": "Part 05 · SLE — definition"}, {"id": "MIC-L4-030", "text": "SLE mechanism: autoantibodies to {{c1::nuclear antigens such as DNA}} → {{c2::immune complex}} formation in joints & many tissues → tissue injury & inflammation", "extra": "", "sec": "Part 05 · 5.1 SLE — pathogenesis & diagnosis"}, {"id": "MIC-L4-031", "text": "SLE diagnosis: high titres of {{c1::antinuclear antibodies (ANAs)}}", "extra": "ANA = AntiNuclear.", "sec": "Part 05 · 5.1 SLE — pathogenesis & diagnosis"}, {"id": "MIC-L4-032", "text": "SLE skin: erythematous '{{c1::butterfly}}' rash — due to immune complex deposition at the {{c2::dermal–epidermal junction}}", "extra": "", "sec": "Part 05 · 5.1 SLE — pathogenesis & diagnosis"}, {"id": "MIC-L4-033", "text": "SLE HLA association: {{c1::HLA-DR2 / DR3}}", "extra": "", "sec": "Part 05 · 5.1 SLE — pathogenesis & diagnosis"}, {"id": "MIC-L4-034", "text": "Ankylosing spondylitis = a {{c1::reactive arthritis}} associated with {{c2::HLA-B27}}", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-035", "text": "Ankylosing spondylitis: cause {{c1::unknown}} — possible link with previous exposure to certain {{c2::bacterial infections}}", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-036", "text": "Ankylosing spondylitis: are all patients HLA-B27 positive? — {{c1::No — some, but not all, patients are HLA-B27 positive.}}", "extra": "Exam trap: the lecture still calls AS an HLA-B27-associated reactive arthritis.", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-037", "text": "Ankylosing spondylitis onset · sex: symptoms first strike before age {{c1::45}} · more common in {{c2::men}} (underdiagnosed in women)", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-038", "text": "Ankylosing spondylitis: {{c1::inflammatory back pain}} (and other joint pain); can cause the {{c2::spinal joints to fuse together}}", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-039", "text": "Ankylosing spondylitis — joints affected: {{c1::sacroiliac joints}} · {{c2::shoulders}} · {{c3::knees}} · {{c4::heels}}", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-040", "text": "Ankylosing spondylitis — other organs affected: eyes ({{c1::uveitis}}) · gut ({{c2::IBD}}) · skin ({{c3::psoriasis}})", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-041", "text": "Ankylosing spondylitis treatment: may respond to anti-inflammatory drugs — {{c1::NSAIDs}} and/or {{c2::biologics}}; treated by a {{c3::rheumatologist}}", "extra": "", "sec": "Part 06 · Ankylosing spondylitis"}, {"id": "MIC-L4-042", "text": "Inflammatory skin disorders arise by {{c1::direct contact on the epidermal surface}} or by {{c2::reacting to systemic immune responses}}", "extra": "", "sec": "Part 07 · 7.1 Inflammatory disorders of the skin"}, {"id": "MIC-L4-043", "text": "{{c2::Contact dermatitis}} is caused by substances such as {{c1::toxic poison ivy oil (urushiol)}}", "extra": "", "sec": "Part 07 · 7.2 Dermatitis, eczema & acne"}, {"id": "MIC-L4-044", "text": "Contact dermatitis (second exposure): {{c1::hapten}} applied to skin ▶ binds a self protein → {{c2::hapten–protein conjugate}} ▶ {{c3::CD4⁺ T cells}} recognise it & release chemokines and cytokines ▶ {{c4::macrophages & other phagocytes}} enter → inflammation", "extra": "", "sec": "Part 07 · 7.2 Dermatitis, eczema & acne"}, {"id": "MIC-L4-045", "text": "{{c2::Acne}} is caused by {{c1::sebaceous gland secretions}}", "extra": "Eczema is described only as a common inflammatory skin disorder.", "sec": "Part 07 · 7.2 Dermatitis, eczema & acne"}, {"id": "MIC-L4-046", "text": "{{c3::Psoriasis}}: chronic skin inflammation with {{c1::scaling}} — the result of {{c2::hyperproliferation of basal keratinocytes}}", "extra": "", "sec": "Part 07 · 7.3 Psoriasis"}, {"id": "MIC-L4-047", "text": "Psoriasis: may be related to {{c1::T cell infiltration}}; MHC allele association = {{c2::HLA-B27}}", "extra": "B27 → ankylosing spondylitis & psoriasis.", "sec": "Part 07 · 7.3 Psoriasis"}, {"id": "MIC-L4-048", "text": "Psoriasis trigger: responses to {{c1::environmental factors}} or {{c2::bacterial superantigens}}", "extra": "", "sec": "Part 07 · 7.3 Psoriasis"}, {"id": "MIC-L4-049", "text": "Botulinum & tetanus toxins both come from Gram-{{c1::positive::positive or negative}} {{c2::anaerobic}} bacilli (C. botulinum, C. tetani)", "extra": "", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-050", "text": "Source — C. botulinum: {{c1::stored food}}; C. tetani: {{c2::soil}}", "extra": "", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-051", "text": "Botulinum toxin blocks neuromuscular transmission by blocking {{c1::ACh vesicle release}}", "extra": "", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-052", "text": "Botulinum toxin route: passes from the {{c1::gut into the circulation}} → taken up by an {{c2::axon}} and cleaved into A & B subunits → the {{c3::A}} subunit blocks ACh release", "extra": "", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-053", "text": "Tetanus toxin blocks release of the inhibitory neurotransmitters {{c1::GABA & glycine}} → {{c2::unrestrained excitation}} of motor neurons", "extra": "", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-054", "text": "Tetanus toxin reaches the inhibitory neuron by {{c1::retrograde neuronal flow}}", "extra": "", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-055", "text": "Effect on ACh — botulinum toxin: {{c1::blocks ACh release}}; tetanus toxin: {{c2::prolongs ACh action}} (by blocking inhibitory mechanisms)", "extra": "Exam trap: tetanus removes the inhibitory brakes (GABA & glycine).", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-056", "text": "Muscle — botulism: {{c1::flaccid paralysis (no contraction)}}; tetanus: {{c2::spasmodic contraction}}", "extra": "Botulism = Blocked ACh → floppy · Tetanus = Tight muscles.", "sec": "Part 08 · 8.1 Botulinum vs tetanus toxin"}, {"id": "MIC-L4-057", "text": "HLA → disease: DR4 → {{c1::rheumatoid arthritis}} · DR2 → {{c2::multiple sclerosis}} · DR2/DR3 → {{c3::SLE}} · B27 → {{c4::ankylosing spondylitis & psoriasis}}", "extra": "MS = 2 letters → DR2.", "sec": "Part 09 · 9.1 HLA & hypersensitivity at a glance"}, {"id": "MIC-L4-058", "text": "Ptosis + muscle weakness, treated with anticholinesterase inhibitors & thymectomy → {{c1::myasthenia gravis}}", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}, {"id": "MIC-L4-059", "text": "Rheumatoid factors + inflamed synovium + bony fusion of joints → {{c1::rheumatoid arthritis}}", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}, {"id": "MIC-L4-060", "text": "Optic neuritis, diplopia, fatigue, weakness, ataxia, urinary symptoms → {{c1::multiple sclerosis}}", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}, {"id": "MIC-L4-061", "text": "High-titre ANA + butterfly rash + synovitis / polyarthralgia → {{c1::SLE}}", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}, {"id": "MIC-L4-062", "text": "Man < 45 with inflammatory back pain, sacroiliac involvement, uveitis, HLA-B27 → {{c1::ankylosing spondylitis}}", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}, {"id": "MIC-L4-063", "text": "Flaccid paralysis after eating stored food → {{c1::botulism}} ({{c2::C. botulinum}} toxin)", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}, {"id": "MIC-L4-064", "text": "Muscle spasm; soil organism; release of GABA & glycine blocked → {{c1::tetanus}} ({{c2::C. tetani}} toxin)", "extra": "", "sec": "Part 09 · 9.4 Clue → answer"}], "pracs": [], "lib": "msk.html", "prev": {"href": "mic-l3.html", "title": "Lecture 3 · Soft Tissue Infections"}, "next": null, "coverImg": "covers/Microbiology.jpg", "searchHint": "e.g. heels, positive, stored food"};
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){
  const r = document.documentElement;
  if (S.set.theme === 'light' || S.set.theme === 'dark') r.dataset.theme = S.set.theme; else r.removeAttribute('data-theme');
  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);
  if (rs.getPropertyValue('--ph') !== vph) rs.setProperty('--ph', vph);
  book.classList.toggle('single', mode === 'single');
  // a new size only reflows the CSS; the pages are rebuilt only when the book switches between one and two pages,
  // so a phone's sliding toolbar, the keyboard or a resizing frame can never reset the page you are reading
  if (opened && (force || mode !== drawnMode)) draw();
}
window.addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(function again(){ if (busy){ layout.t = setTimeout(again, 120); return; } layout(); }, 80);
});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;

  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>

H.recall = b => {

    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');

    ${nx ? `<a href="${esc(nx.href)}"><span><small>${esc(nx.label || 'Next lecture')}</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>${esc(pv.label || 'Previous lecture')}</small>${esc(pv.title)}</span><span>←</span></a>` : ''}

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;

A.retry = a => { delete S.ans[a.dataset.q]; save(); rerender(pageOf(a)); };
A.pred = a => { const p = S.pred[a.dataset.q] || {}; if (p.lift) return; p.pick = +a.dataset.i; S.pred[a.dataset.q] = p; save(); rerender(pageOf(a)); };
A.lift = a => { const q = QS[a.dataset.q]; const p = S.pred[q.id]; p.lift = 1; if (p.pick !== q.ans) S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.flap = a => { S.flap[a.dataset.q] = 1; save(); rerender(pageOf(a)); };

A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }

    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
