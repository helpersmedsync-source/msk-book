 "text", "blocks": [{"t": "check", "q": "N-PAR-L2-08"}, {"t": "check", "q": "Q0493"}]}, {"id": "p46", "head": "Part 04 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PAR-L2-06"}]}, {"id": "p47", "head": "Part 04 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0488"}]}, {"id": "p48", "head": "Part 05 · Bed Bugs & Fleas", "kind": "text", "blocks": [{"t": "part", "no": "05", "title": "Bed Bugs & Fleas", "sub": "Bed bugs — Cimex lectularius · Fleas · Itchy bites — tell them apart"}, {"t": "h", "no": "5.1", "title": "Bed bugs — Cimex lectularius", "top": true}, {"t": "list", "items": ["<mark>Temporary<\/mark> ectoparasite — visits host only for blood meal; all stages suck blood", "Feeds at night/dark; hides by day in cracks, walls, between mattresses, lays eggs there", "<mark>Nasty odour<\/mark> from special glands", "<mark>Reddish brown<\/mark>, dorsoventrally flattened, wingless, <mark>4–6 × 4 mm<\/mark>", "<b>Bites:<\/b> irritation, <mark>insomnia<\/mark>, allergic dermatitis — <mark>linear papular urticaria<\/mark>"]}, {"t": "h", "no": "5.2", "title": "Fleas", "top": true}, {"t": "list", "items": ["<mark>Obligatory temporary<\/mark> ectoparasites of man &amp; animals; both sexes suck blood", "Jump; <mark>2–3 mm<\/mark>, laterally compressed", "<b>Allergic dermatitis:<\/b> <mark>erythematous dot<\/mark> with swollen reddish patch"]}], "toc": ["05", "Bed Bugs & Fleas"]}, {"id": "p49", "head": "Part 05 · Bed Bugs & Fleas", "kind": "text", "blocks": [{"t": "list", "items": ["Vector of <mark>plague<\/mark> and <mark>endemic typhus<\/mark>"]}, {"t": "h", "no": "5.3", "title": "Itchy bites — tell them apart"}, {"t": "list", "items": ["<b>Bed bug:<\/b> linear papular urticaria + insomnia (arm, shoulder, back)", "<b>Flea:<\/b> erythematous dot with swollen halo (ankle, lower leg)", "Mosquito pictured for comparison only"]}]}, {"id": "p50", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-par-l2-4-0", "title": "Recall · Bed Bugs & Fleas (1/2)", "groups": [{"title": "5.1 Bed bugs — Cimex lectularius", "items": [["Temporary ectoparasite —", "visits host only for blood meal; all stages suck blood"], ["Feeds at night/dark; hides by", "day in cracks, walls, between mattresses, lays eggs there"], ["Nasty odour", "from special glands"], ["Reddish brown, dorsoventrally", "flattened, wingless, 4–6 × 4 mm"], ["Bites:", "irritation, insomnia, allergic dermatitis — linear papular urticaria"]]}, {"title": "5.2 Fleas", "items": [["Obligatory temporary ectoparasites of", "man &amp; animals; both sexes suck blood"], ["Jump; 2–3", "mm, laterally compressed"], ["Allergic dermatitis:", "erythematous dot with swollen reddish patch"], ["Vector of", "plague and endemic typhus"]]}]}], "labName": "Recall · Bed Bugs & Fleas (1/2)"}, {"id": "p51", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-par-l2-4-1", "title": "Recall · Bed Bugs & Fleas (2/2)", "groups": [{"title": "5.3 Itchy bites — tell them apart", "items": [["Bed bug:", "linear papular urticaria + insomnia (arm, shoulder, back)"], ["Flea:", "erythematous dot with swollen halo (ankle, lower leg)"], ["Mosquito pictured", "for comparison only"]]}]}], "labName": "Recall · Bed Bugs & Fleas (2/2)"}, {"id": "p52", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0481"}]}, {"id": "p53", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PAR-L2-01"}]}, {"id": "p54", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0483"}]}, {"id": "p55", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PAR-L2-02"}]}, {"id": "p56", "head": "Part 05 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-PAR-L2-11"}]}, {"id": "p57", "head": "Part 06 · Arthropods Compared", "kind": "text", "blocks": [{"t": "part", "no": "06", "title": "Arthropods Compared", "sub": "The master table · Doses that get swapped · Vectors & diseases · Ectoparasite types & development · Clinical clue → parasite · Spot the specimen"}, {"t": "h", "no": "6.1", "title": "The master table"}, {"t": "list", "items": ["Scabies, myiasis flies, lice, bed bug, flea — spread, site, lesion, diagnosis, treatment"]}, {"t": "h", "no": "6.2", "title": "Doses that get swapped"}, {"t": "list", "items": ["<b>Scabies:<\/b> permethrin 5% or lindane 1%", "<b>Lice:<\/b> lindane 1% or permethrin 1%, twice 1 week apart"]}, {"t": "h", "no": "6.3", "title": "Vectors & diseases"}, {"t": "list", "items": ["<b>Body louse:<\/b> <mark>epidemic<\/mark> typhus, trench fever, relapsing fever; head louse not a natural vector", "<b>Flea:<\/b> plague, <mark>endemic<\/mark> typhus; house fly: mechanical transmission, accidental myiasis"]}], "toc": ["06", "Arthropods Compared"]}, {"id": "p58", "head": "Part 06 · Arthropods Compared", "kind": "text", "blocks": [{"t": "h", "no": "6.4", "title": "Ectoparasite types & development"}, {"t": "list", "items": ["Lice <mark>permanent<\/mark>; bed bug <mark>temporary<\/mark>; flea <mark>obligatory temporary<\/mark>", "Flies <mark>complete<\/mark> metamorphosis; lice <mark>incomplete<\/mark>"]}, {"t": "h", "no": "6.5", "title": "Clinical clue → parasite"}, {"t": "list", "items": ["Night itch, finger burrows, whole family → scabies; immunodeficient crusting → Norwegian scabies", "Maggots in neglected wound → Lucilia, Calliphora, Chrysomyia"]}, {"t": "h", "no": "6.6", "title": "Spot the specimen"}, {"t": "list", "items": ["Oval mite; Musca M-slits; Sarcophaga open peritreme; Calliphora closed; flat bed bug; compressed flea"]}]}, {"id": "p59", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-par-l2-5-0", "title": "Recall · Arthropods Compared (1/2)", "groups": [{"title": "6.1 The master table", "items": [["Scabies, myiasis flies, lice, bed bug, flea —", "spread, site, lesion, diagnosis, treatment"]]}, {"title": "6.2 Doses that get swapped", "items": [["Scabies:", "permethrin 5% or lindane 1%"], ["Lice:", "lindane 1% or permethrin 1%, twice 1 week apart"]]}, {"title": "6.3 Vectors & diseases", "items": [["Body louse:", "epidemic typhus, trench fever, relapsing fever; head louse not a natural vector"], ["Flea:", "plague, endemic typhus; house fly: mechanical transmission, accidental myiasis"]]}, {"title": "6.4 Ectoparasite types & development", "items": [["Lice permanent; bed", "bug temporary; flea obligatory temporary"], ["Flies complete", "metamorphosis; lice incomplete"]]}]}], "labName": "Recall · Arthropods Compared (1/2)"}, {"id": "p60", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-par-l2-5-1", "title": "Recall · Arthropods Compared (2/2)", "groups": [{"title": "6.5 Clinical clue → parasite", "items": [["Night itch, finger burrows, whole family →", "scabies; immunodeficient crusting → Norwegian scabies"], ["Maggots in neglected wound →", "Lucilia, Calliphora, Chrysomyia"]]}, {"title": "6.6 Spot the specimen", "items": [["Oval mite; Musca M-slits; Sarcophaga", "open peritreme; Calliphora closed; flat bed bug; compressed flea"]]}]}], "labName": "Recall · Arthropods Compared (2/2)"}, {"id": "p61", "head": "Part 07 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps · Lecture MCQs — answer key"}, {"t": "h", "no": "7.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Q&amp;A recap of scabies, myiasis, lice, bed bugs, fleas"]}, {"t": "h", "no": "7.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["D-R-C scabies reservoirs; 5 fingers → 5%, 1 head → 1%; T-T-R body louse diseases"]}, {"t": "h", "no": "7.3", "title": "Lecture MCQs — answer key"}, {"t": "list", "items": ["<b>Scabies child:<\/b> 5% permethrin to patient and all household contacts", "<b>Hospital wound myiasis:<\/b> insecticide spraying + covering wounds", "<b>Head lice:<\/b> nits/adult lice on scalp hair"]}], "toc": ["07", "Rapid Revision"]}, {"id": "p62", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-par-l2-6-0", "title": "Recall · Rapid Revision", "groups": [{"title": "7.1 Must-know one-liners", "items": [["Q&amp;A recap of", "scabies, myiasis, lice, bed bugs, fleas"]]}, {"title": "7.2 Mnemonic vault & classic exam traps", "items": [["D-R-C scabies reservoirs; 5 fingers →", "5%, 1 head → 1%; T-T-R body louse diseases"]]}, {"title": "7.3 Lecture MCQs — answer key", "items": [["Scabies child:", "5% permethrin to patient and all household contacts"], ["Hospital wound myiasis:", "insecticide spraying + covering wounds"], ["Head lice:", "nits/adult lice on scalp hair"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p63", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Treat whole household in scabies, even asymptomatic"}, {"t": "note", "kind": "trap", "html": "Scabies = permethrin 5%; lice = permethrin 1%"}, {"t": "note", "kind": "trap", "html": "Scabies itch is type IV hypersensitivity"}, {"t": "note", "kind": "trap", "html": "Crusted scabies = immunodeficient, nosocomial"}, {"t": "note", "kind": "trap", "html": "Hospital wound myiasis → insecticide spraying &amp; covering wounds, not deworming/hand washing/isolation"}, {"t": "note", "kind": "trap", "html": "Head lice diagnosis = nits/adult lice on hair, not scrapings, burrows, linear urticaria or wound larvae"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p64", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Flesh flies are larviparous"}, {"t": "note", "kind": "trap", "html": "Musca causes accidental, not specific, myiasis"}, {"t": "note", "kind": "trap", "html": "Head louse not a natural vector; body louse is"}, {"t": "note", "kind": "trap", "html": "Lice incomplete metamorphosis; flies complete"}, {"t": "note", "kind": "trap", "html": "Lice treatment repeated after 1 week for surviving nits"}, {"t": "note", "kind": "trap", "html": "Bed bugs temporary; lice permanent; fleas obligatory temporary"}, {"t": "note", "kind": "cl", "html": "Nasal myiasis: obstruction, sneezing, epistaxis; can destroy bone, reach brain → death"}]}, {"id": "p65", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Aural myiasis: deafness, tinnitus, drum perforation"}, {"t": "note", "kind": "cl", "html": "Norwegian scabies is a source of nosocomial infection"}]}, {"id": "p66", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0386": {"id": "Q0386", "stem": "To which group of parasites does the itch mite belong?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The itch mite, Sarcoptes scabiei, is one of the arthropods of the skin, together with the myiasis-causing flies, lice, bed bugs and fleas. It is not a worm (nematode, cestode or trematode) or a protozoan.", "type": "mcq", "opts": ["Nematodes", "Cestodes", "Trematodes", "Arthropods", "Protozoa"], "ans": 3}, "Q0388": {"id": "Q0388", "stem": "Which of the following measures helps to prevent and control scabies?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Sarcoptes scabiei occurs worldwide in bad hygienic conditions and overcrowding and spreads by contact with an infected person, towels or bedding. The other measures do not interrupt this contact transmission.", "type": "mcq", "opts": ["Avoiding overcrowding and bad hygiene", "Avoiding swimming in infected water", "Avoiding eating improperly cooked beef", "Avoiding walking barefoot", "Proper inspection of meat in slaughterhouses"], "ans": 0}, "Q0389": {"id": "Q0389", "stem": "In what condition do Norwegian scabies occur?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAR Q30", "bank": true, "expl": "Norwegian (crusted) scabies, a generalized dermatitis with extensive scaling and crusting, occurs in immunodeficient individuals and is a source of nosocomial infection. Contact with an infected person, towels or bedding is how ordinary scabies is acquired, but it does not explain the crusted form.", "type": "mcq", "opts": ["Patients suffering from immunodeficiency conditions", "Patients suffering from intestinal parasites", "People in contact with infected patients", "Patients in contact with infected animals", "Patients suffering from lymphadenopathy"], "ans": 0}, "Q0401": {"id": "Q0401", "stem": "A patient complains of pruritus that gets worse at night, and on examination serpiginous burrows are detected between the fingers and toes. This patient is most likely suffering from:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Severe pruritus worse at night with serpiginous burrows between the fingers and toes is classic scabies. The itch is indeed an allergic (type IV hypersensitivity) response, but the burrows identify the mite as the cause.", "type": "mcq", "opts": ["Scabies", "Allergic reaction", "Cutaneous leishmaniasis", "Subcutaneous filariasis", "Calabar swelling"], "ans": 0}, "Q0424": {"id": "Q0424", "stem": "A 35-year-old man presents to his family physician with itching on his hands for 2 weeks. He states that several of his children have recently had similar symptoms. Physical examination reveals several red papules on his hands. The physician prescribes topical permethrin. Which of the following should also be considered as part of the management of this patient's condition?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Scabies spreads by contact with infected people, towels and bedding, so all clothes and fomites must be boiled and all family members treated, symptomatic or asymptomatic. Options limited to symptomatic contacts leave infected household members untreated.", "type": "mcq", "opts": ["Topical permethrin for the symptomatic children only", "Boiling the linens of the symptomatic children only", "Boiling the clothes and linens of every household member", "Topical permethrin for the symptomatic household contacts only"], "ans": 2}, "Q0425": {"id": "Q0425", "stem": "Case 1: A four-year-old girl presented with a one-month history of a scalp ulcer; it started as a painful itchy swelling in the occipital region (figure 1). Then the parents visualized the following inside the ulcer (figure 2). Surgical debridement was done, and a large number of larvae were extracted and sent to the Parasitology Department. Light microscopic appearance of the posterior spiracular plates showed the following criteria (figure 3).\n1. What is your diagnosis?\n2. Which fly larva is responsible, and on what criteria?\n3. How is this condition treated?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W13", "bank": true, "expl": "Maggots extracted from an ulcer mean cutaneous wound myiasis, and the larva is named from its posterior spiracles: three slits in a closed peritreme mark the Calliphora group. An opened peritreme would point to Sarcophaga or Wohlfahrtia, and M-shaped slits to Musca.", "img": ["figs/GR-19.jpg", "figs/GR-19_2.jpg", "figs/GR-19_3.jpg"], "cap": "1 = the scalp ulcer; 2 = what the parents saw inside the ulcer; 3 = posterior spiracular plates of the extracted larvae", "type": "written", "keyhtml": "1. Cutaneous (wound) myiasis caused by Calliphora larva: invasion of the scalp ulcer by the larvae (maggots) of a dipterous fly — an external myiasis.\n2. Calliphora larva (Calliphora group: Calliphora, Lucilia, Chrysomyia), identified by its posterior spiracles: 3 slits with a closed peritreme. (Musca: sinuous M-shaped slits with a button; Sarcophaga &amp; Wohlfahrtia: 3 straight slits with an opened peritreme.) Identification can be confirmed by breeding the larvae to the adult stage.\n3. Manual (surgical) removal of the larvae, with antiseptics and antibiotics for secondary infection."}, "Q0426": {"id": "Q0426", "stem": "Case 2: An 11-year-old girl came to hospital complaining of discomfort of the full body and itchiness for two weeks; it started interdigitally between her fingers, then spread to her wrist, armpits, back and her lower extremities. The itchiness worsens at night (figure 1). According to the girl, currently both her brothers are experiencing the same complaint. Apparently, she has a history of sharing the same room and bed with both her brothers (figure 2). Microscopic examination of skin scrapings showed the following (figure 3).\n1. What is your provisional diagnosis? On what criteria did you base your diagnosis?\n2. What is the causative parasite of this infection?\n3. How could you treat this patient?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W14", "bank": true, "expl": "Night-time pruritus, interdigital burrows and itchy contacts sharing a bed are the classic clues to scabies, and the mite or its eggs in skin scrapings confirm it. The whole household is treated because infection spreads by contact with infected persons, towels and bedding.", "img": ["figs/GR-20.jpg", "figs/GR-20_2.jpg", "figs/GR-20_3.jpg"], "cap": "1 = the girl's hand; 2 = the foot; 3 = microscopic examination of the skin scrapings", "type": "written", "keyhtml": "1. Scabies. Criteria:\n• Clinical picture: itching that worsens at night, starting between the fingers.\n• Skin lesion: serpiginous tracks (burrows).\n• Contacts (brothers sharing her room and bed) with the same complaint.\n• Microscopic examination of skin scrapings where Sarcoptes scabiei was detected.\n2. Sarcoptes scabiei (the itch mite): an oval mite 0.1–0.4 mm whose adults and larvae migrate in the epidermis, forming burrows.\n3. Hot soapy bath; permethrin 5% cream or lindane 1% (equally effective); boiling of all clothes and all fomites is essential; treatment of all family members (symptomatic or asymptomatic)."}, "Y26-036": {"id": "Y26-036", "stem": "A patient presented to the dermatology outpatient clinic in our hospital with severe inflammation in his gum. Worm-like structures were removed from this wound. How could you diagnose this case?", "top": true, "rep": "", "tag": "Final bank PAR Q31", "bank": true, "expl": "Worm-like maggots removed from a wound mean wound myiasis, which is diagnosed by identifying the larvae from the lesion by their posterior spiracles (and by breeding the larvae to the adult stage). Blood films, blood counts and antigen or antibody tests are not among the methods for myiasis; a daytime blood film is the test for Loa loa microfilariae.", "type": "mcq", "opts": ["Complete blood picture", "Detection of circulating antigen", "Microscopic examination of posterior spiracle of the removed larva", "Direct blood film", "Serological detection of antibodies"], "ans": 2}, "Q0429": {"id": "Q0429", "stem": "A 13-year-old boy presents with intense scalp itching for two weeks. His mother reports finding small white particles stuck to his hair. Examination shows excoriations and erythema at the nape of the neck (figure).\nWhat is your diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W15", "bank": true, "expl": "Nits glued to the hair with itchy, excoriated skin at the nape of the neck are the picture of head-lice infestation (pediculosis). Diagnosis is made by finding nits and/or adult lice on the scalp hair.", "img": ["figs/GR-21.jpg"], "cap": "The nape of the neck", "type": "written", "keyhtml": "Pediculosis capitis — head louse (Pediculus humanus capitis) infestation. Clues: the small white particles stuck to the hair are nits (eggs glued to the hair shaft, one per hair); excoriations and erythema of the scalp and posterior neck (nape) are common findings. Diagnosis rests on identifying nits and/or adult lice on the scalp hair."}, "Q0430": {"id": "Q0430", "stem": "A 15-year-old Chinese boy presented with a 1-month history of pruritic papules on his skin, especially between the fingers, which had poor response to both topical steroids and systemic antihistamines (figure). The patient stated that the itchiness got worse at night.\n1. What is your diagnosis?\n2. How was this case diagnosed?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W16", "bank": true, "expl": "Night-time itching with papules between the fingers that does not respond to steroids or antihistamines is the classic picture of scabies. It is confirmed by finding the mite or its eggs in skin scrapings, or the minute burrows with a hand lens.", "img": ["figs/GR-22.jpg"], "cap": "The patient's hand", "type": "written", "keyhtml": "1. Scabies (Sarcoptes scabiei).\n2. • Clinical picture: severe itching (worse at night) and the site of the lesions (between the fingers).\n• Finding the parasites or their eggs in skin scrapings made of the infected areas.\n• Examining the skin surface with a hand lens to find the minute burrows of the mite."}, "Q0431": {"id": "Q0431", "stem": "A farmer presents with a painful, boil-like lesion on his arm. On squeezing, a larva emerges from the central opening (figure). Cutaneous myiasis was confirmed.\nWhat are the types of cutaneous myiasis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W17", "bank": true, "expl": "Cutaneous myiasis has three forms — creeping eruption, nodular myiasis and wound myiasis — each caused by its own flies. A boil-like nodule from which a larva emerges fits nodular myiasis (Cordylobia, Dermatobia).", "img": ["figs/GR-24.jpg"], "cap": "The lesion on the arm being squeezed", "type": "written", "keyhtml": "1. Creeping eruption — Gastrophilus and Hypoderma.\n2. Nodular myiasis — Cordylobia and Dermatobia (a boil-like lesion with a larva emerging from it, as in this farmer).\n3. Wound myiasis — Lucilia, Calliphora, Chrysomyia and Cochliomyia."}, "Q0432": {"id": "Q0432", "stem": "A 72-year-old man presented with a complaint of repeated pain for two years after trauma to his right eyelid and aggravated symptoms with larvae wriggling out for 2 days (figure). External myiasis was confirmed.\nAt which other sites could external myiasis occur?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W18", "bank": true, "expl": "External myiasis affects the skin, eye, nose and ear. Urogenital myiasis (Fannia) belongs with intestinal and gastric myiasis as an internal form.", "img": ["figs/GR-25.jpg"], "cap": "The patient's right eye region", "type": "written", "keyhtml": "This patient has ocular myiasis (external ocular: Oestrus). Other sites of external myiasis:\n• Cutaneous: creeping eruption, nodular and wound myiasis.\n• Aural (ear): Sarcophaga, Wohlfahrtia, Chrysomyia.\n• Nasal (in chronic nasal discharge): Sarcophaga, Wohlfahrtia, Chrysomyia.\nUrogenital myiasis is internal (with intestinal and gastric myiasis), not external."}, "Q0433": {"id": "Q0433", "stem": "A man presents with abdominal pain and passage of small moving larvae in his stool after eating food left uncovered. Internal myiasis was confirmed.\nWhat are the different types of internal myiasis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W19", "bank": true, "expl": "Internal myiasis is intestinal, urogenital or gastric. Larvae passed in the stool after eating uncovered food indicate intestinal myiasis, which is treated with a saline purge.", "type": "written", "keyhtml": "1. Intestinal myiasis — in food (Musca, Sarcophaga &amp; Wohlfahrtia) or through the anus (Fannia); treated with a saline purge. This patient (larvae in the stool after eating uncovered food) has intestinal myiasis.\n2. Urogenital myiasis — Fannia.\n3. Gastric myiasis — Eristalis."}, "Q0473": {"id": "Q0473", "stem": "An 87-year-old woman was admitted with erythematous-desquamative plaques and an adherent grey scale with a thick crust with fissures on the scalp. The differential diagnosis included crusted scabies. The diagnosis of crusted scabies was confirmed, and treatment was initiated (figures).\nWhat is the predisposing factor for this condition?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAR W20", "bank": true, "expl": "Crusted (Norwegian) scabies is a generalized dermatitis with extensive scaling and crusting that occurs in immunodeficient individuals; it is also a source of nosocomial infection.", "img": ["figs/GR-23.jpg", "figs/GR-23_2.jpg"], "cap": "Skin lesions of the patient", "type": "written", "keyhtml": "Immunodeficiency: crusted (Norwegian) scabies — a generalized dermatitis with extensive scaling and crusting — occurs in immunodeficient individuals and is a source of nosocomial infection."}, "Q0476": {"id": "Q0476", "stem": "A man presents with abdominal pain and passage of small moving larvae in his stool after eating food left uncovered. Internal myiasis was confirmed. Which of the following flies is most likely involved?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAR Q24", "bank": true, "expl": "Eggs or larvae deposited on uncovered food and then swallowed cause accidental (intestinal) myiasis, classically by the house fly Musca domestica. Lucilia causes wound myiasis and Cordylobia nodular myiasis; Wohlfahrtia, a larviparous flesh fly, can also reach the gut in food but is mainly a semi-specific myiasis fly of wounds, the nose and the ear.", "type": "mcq", "opts": ["Wohlfahrtia magnifica", "Lucilia sericata", "Musca domestica", "Cordylobia anthropophaga"], "ans": 2}, "Q0478": {"id": "Q0478", "stem": "A female patient, 45 years old, was hospitalized due to ovarian cancer. During her clinical examination head lice were seen; dermatological examination showed the presence of nits and lice walking on her hair (figure).\n1. What is the medical importance of Pediculus humanus corporis?\n2. How does it compare with the head louse (Pediculus humanus capitis) found in this patient?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR W21", "bank": true, "expl": "Only the body louse is a vector — of epidemic typhus, trench fever and epidemic relapsing fever; the head louse causes pediculosis but is not a vector under natural circumstances.", "img": ["figs/GR-28.jpg"], "cap": "Dermatoscopic (left) and microscopic (right) views of the louse", "type": "written", "keyhtml": "1. Pediculus humanus corporis (body louse):\n• A vector transmitting epidemic typhus, epidemic relapsing fever and trench fever (5-day fever).\n• It causes pediculosis (vagabond's disease).\n2. The head louse also causes pediculosis but is not a vector under natural circumstances."}, "Q0479": {"id": "Q0479", "stem": "A farmer complains of foul-smelling discharge and crawling sensation in a neglected wound on his leg. Larvae are observed in the wound.\nWhat is the diagnosis, and which type of fly infestation does this represent?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAR W22", "bank": true, "expl": "Larvae in a neglected, foul-smelling wound are wound myiasis. These flies are necrobiots that normally feed on carcasses, so their invasion of diseased tissue is semi-specific myiasis, unlike the obligatory sarcobiots of specific myiasis.", "type": "written", "keyhtml": "• Diagnosis: wound myiasis (a cutaneous, external myiasis) — usually Lucilia, Calliphora, Chrysomyia (also Cochliomyia).\n• Type: semi-specific myiasis — the larvae are normally free-living necrobiots that attack carcasses but can infest necrotic/diseased tissue and neglected wounds (Calliphora, Lucilia, Sarcophaga, Wohlfahrtia); the larvae feed on the dead tissue."}, "Y26-045": {"id": "Y26-045", "stem": "Excoriations, erythema, pyoderma, and scaliness of the scalp and posterior neck are common findings in infection with:", "top": true, "rep": "", "tag": "Final bank PAR Q25", "bank": true, "expl": "Scaliness, excoriations, erythema and pyoderma of the scalp and posterior neck are the findings of pediculosis; the pamphlet places these on the head region (nape of the neck, behind the ears), i.e. the head louse, Pediculus humanus capitis. Pediculosis is also listed under the body louse, and Pediculus corporis is the only louse offered here, so it is the department's answer; if Pediculus humanus capitis is offered, choose it.", "type": "mcq", "opts": ["Pediculus corporis", "Pulex irritans", "Larva of Musca", "Larva of Wohlfahrtia", "Cimex lectularius"], "ans": 0}, "Q0481": {"id": "Q0481", "stem": "A 35-year-old woman complains of red, itchy linear papules on her arms and neck after staying in a hotel.\nWhat is the most likely cause of these lesions, and how does this parasite feed?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAR W23", "bank": true, "expl": "Itchy papules in lines (linear papular urticaria) after sleeping in a hotel point to bed bugs, temporary ectoparasites that suck blood at night and hide by day in cracks and between mattresses.", "type": "written", "keyhtml": "• Cause: Cimex lectularius (bed bug) bites — irritation, insomnia and allergic dermatitis in the form of linear papular urticaria ('breakfast, lunch and dinner' pattern).\n• Feeding: a temporary ectoparasite that visits the host only for a blood meal — nocturnal, blood-sucking (male, female and nymphs), usually at night or in dark rooms; by day it hides in cracks and crevices (walls, floors, between bed mattresses), where it lays its eggs."}, "Q0483": {"id": "Q0483", "stem": "A mother brings her child with multiple small red papules surrounded by a reddish halo on the legs after playing with the family cat.\n1. What parasite is responsible, and how is it transmitted?\n2. What is the medical importance of this parasite?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAR W24", "bank": true, "expl": "An erythematous dot with a swollen reddish halo on the legs after contact with a pet suggests flea bites. Besides allergic dermatitis, fleas are vectors of plague and endemic typhus.", "type": "written", "keyhtml": "1. Fleas (flea bites): obligatory temporary ectoparasites of man and animals (such as the cat); they move by jumping — from infested pets or the environment to humans — and both male and female suck blood.\n2. Annoyance and allergic dermatitis: an erythematous dot (papule with a central punctum) surrounded by a patch of swollen reddish skin, often on the legs and ankles; fleas are also vectors of plague and endemic typhus."}, "Q0486": {"id": "Q0486", "stem": "A child presents with pruritic papules and vesicles between the fingers. Skin scrapings show mites and eggs. Which of the following is the best management approach?", "top": false, "rep": "", "tag": "Final bank PAR Q34", "bank": true, "expl": "Scabies is treated with permethrin 5% cream (or lindane 1%), and all family members must be treated whether symptomatic or not, with boiling of clothes and fomites. Treating only the symptomatic patient is the classic trap.", "type": "mcq", "opts": ["Treat only the symptomatic patient", "Apply 5% permethrin cream to the patient and all household contacts", "Use oral antibiotics for 10 days", "Apply topical corticosteroids for 7 days"], "ans": 1}, "Q0487": {"id": "Q0487", "stem": "A hospital reports multiple cases of wound myiasis among immobile patients. Which preventive measure is most effective in reducing such infestations?", "top": false, "rep": "", "tag": "Final bank PAR Q35", "bank": true, "expl": "Wound myiasis is prevented by insecticides and protection of wounds, which stop flies reaching and depositing on the wounds. Deworming, hand washing and scabies isolation do not keep flies away from wounds.", "type": "mcq", "opts": ["Routine deworming of patients", "Regular spraying of insecticides and covering wounds", "Hand washing before feeding", "Isolation of patients with scabies"], "ans": 1}, "Q0488": {"id": "Q0488", "stem": "A 13-year-old boy is brought to the physician by his mother because of persistent 'dandruff'. She states that he has been constantly scratching his scalp for the past two weeks. Physical examination reveals several small white particles cemented securely to the hair shafts at the nape of the neck and behind the ears. Which of the following is the most appropriate recommendation for this patient?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAR Q33", "bank": true, "expl": "Small white particles glued to the hair shafts at the nape and behind the ears are nits, so this is head lice, treated with topical lindane 1% or permethrin 1%, twice, 1 week apart, to kill any nits that survived. Permethrin 5% is the scabies strength, mites in skin scrapings are the finding in scabies, and school exclusion is not among the listed control measures.", "type": "mcq", "opts": ["Permethrin 5% cream applied once to the whole body", "Exclusion from school activities until the infection has been eradicated", "Topical permethrin 1% applied to the scalp twice, 1 week apart", "Skin scrapings to look for mites before any treatment"], "ans": 2}, "Q0489": {"id": "Q0489", "stem": "Accidental myiasis is caused by larva of which of the following flies?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR Q26", "bank": true, "expl": "In accidental myiasis, eggs or larvae deposited on exposed food are swallowed, causing intestinal myiasis; the house fly Musca domestica (and Piophila) is responsible. Sarcophaga, Lucilia, Calliphora and Wohlfahrtia are necrobiots that cause semi-specific myiasis.", "type": "mcq", "opts": ["Lucilia", "Wohlfahrtia", "Musca domestica", "Sarcophaga", "Calliphora"], "ans": 2}, "Q0490": {"id": "Q0490", "stem": "A patient with severe pruritus that worsens at night presented to the outpatient dermatology clinic. On examination, serpiginous burrows were detected between fingers and toes. This patient is mostly infected with which of the following parasites?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAR Q27", "bank": true, "expl": "Severe pruritus worse at night with serpiginous burrows between the fingers and toes is classic scabies, caused by Sarcoptes scabiei, whose adults and larvae migrate in the epidermis and form burrows. Bed bugs (Cimex lectularius) also cause itching and insomnia at night, but their bites give linear papular urticaria, not burrows, and fly larvae cause myiasis.", "type": "mcq", "opts": ["Sarcoptes scabiei", "Larva of Wohlfahrtia", "Larva of Musca domestica", "Cimex lectularius", "House dust mite"], "ans": 0}, "Q0491": {"id": "Q0491", "stem": "A patient with creeping eruption is mostly suffering from which of the following types of myiasis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAR Q28", "bank": true, "expl": "Creeping eruption is a form of cutaneous myiasis (with nodular and wound myiasis), caused by Gastrophilus and Hypoderma. Ocular and aural myiasis are other external forms, while gastric and urogenital myiasis are internal.", "type": "mcq", "opts": ["Urogenital myiasis", "Gastric myiasis", "Aural myiasis", "Ocular myiasis", "Cutaneous myiasis"], "ans": 4}, "Q0492": {"id": "Q0492", "stem": "What is the main clinical presentation of scabies?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAR Q29", "bank": true, "expl": "The classic presentation of scabies is severe pruritus, worse at night — an allergic type IV hypersensitivity response to the burrowing mites. Papules and vesicles also appear, but the itching is the main complaint, and scratching leads to bleeding, scabs and secondary bacterial infection.", "type": "mcq", "opts": ["Papules on skin", "Skin ulcers", "Fever", "Pruritus and itching", "Lymph node enlargement"], "ans": 3}, "Q0493": {"id": "Q0493", "stem": "Excoriations, erythema, pyoderma and scaliness of the scalp and posterior neck are common findings in infection with:", "top": false, "rep": "asked 2 years", "tag": "Final bank PAR Q32", "bank": true, "expl": "Excoriations, erythema, pyoderma and scaliness of the scalp and posterior neck are the findings of pediculosis due to the head louse. Bed bug (Cimex) bites give linear papular urticaria, and flea bites an erythematous dot with a swollen reddish halo.", "type": "mcq", "opts": ["Pulex irritans", "Pediculus humanus capitis", "Cimex lectularius", "Larva of Musca", "Larva of Wohlfahrtia"], "ans": 1}, "N-PAR-L2-01": {"id": "N-PAR-L2-01", "stem": "A 30-year-old woman returns from a stay in an old hostel complaining of intensely itchy red papules arranged in lines on her arm, shoulder and back. The itching kept her awake at night. Her room had a nasty odour, and small insects were found hiding between the bed mattresses. Which of the following best describes the parasite responsible?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Linear papular urticaria with insomnia, a nasty odour from special glands and insects hiding between mattresses identify the bed bug (Cimex lectularius), a temporary ectoparasite that feeds at night and hides by day. The jumping, laterally compressed flea is an obligatory temporary ectoparasite whose bites leave an erythematous dot with a swollen halo, mainly around the ankles.", "type": "mcq", "opts": ["A temporary ectoparasite that visits the host only for a blood meal, usually at night", "A permanent ectoparasite that glues its eggs singly to the hair shaft", "An obligatory temporary ectoparasite that jumps and is compressed laterally", "A mite whose adults and larvae burrow in the epidermis", "A fly larva that invades the living tissues of the host"], "ans": 0}, "N-PAR-L2-02": {"id": "N-PAR-L2-02", "stem": "A 6-year-old boy who plays with the family cat develops multiple itchy erythematous dots, each surrounded by a patch of swollen reddish skin, around his ankles and lower legs. Which of the following is true of the parasite responsible?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "An erythematous dot with a swollen reddish halo around the ankles after contact with a pet is a flea bite; fleas are obligatory temporary ectoparasites in which both sexes suck blood, and they transmit plague and endemic typhus. Epidemic typhus and trench fever are carried by the body louse, and the dorsoventrally flattened 4–6 mm insect is the bed bug.", "type": "mcq", "opts": ["It is a permanent ectoparasite that lays nits on the hair", "Only the female sucks blood", "It is flattened dorsoventrally and measures 4–6 mm", "It is a vector of plague and endemic typhus", "It is a vector of epidemic typhus and trench fever"], "ans": 3}, "N-PAR-L2-03": {"id": "N-PAR-L2-03", "stem": "An elderly man with a long-standing discharging ear complains of deafness and tinnitus, and larvae are removed from his ear canal. Microscopy of their posterior spiracles shows three straight slits with an opened peritreme. Which fly is responsible?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Three straight slits in an opened (split) peritreme identify Sarcophaga (or Wohlfahrtia), flesh flies that cause nasal and aural myiasis. Calliphora, Lucilia and Chrysomyia also have three slits, but their peritreme is closed, while Musca has sinuous M-shaped slits with a button.", "type": "mcq", "opts": ["Musca domestica", "Sarcophaga", "Calliphora", "Lucilia", "Chrysomyia"], "ans": 1}, "N-PAR-L2-04": {"id": "N-PAR-L2-04", "stem": "Which of the following flies is larviparous, depositing larvae instead of eggs?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The flesh flies (Sarcophaga and Wohlfahrtia, family Sarcophagidae) are larviparous: they deposit larvae. Lucilia and Calliphora are metallic flies (Calliphoridae), Musca is the house fly, and Dermatobia lays its eggs on a mosquito.", "type": "mcq", "opts": ["Musca domestica", "Lucilia", "Calliphora", "Sarcophaga", "Dermatobia"], "ans": 3}, "N-PAR-L2-05": {"id": "N-PAR-L2-05", "stem": "A 65-year-old man with a chronic nasal discharge presents with nasal obstruction, sneezing and epistaxis, and larvae are seen emerging from his nose. Which group of flies most commonly causes this condition?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Nasal myiasis in a chronic discharge is caused by Sarcophaga, Wohlfahrtia and Chrysomyia; it is dangerous because it can destroy bone and reach the brain, causing death. Gastrophilus and Hypoderma cause creeping eruption, and Cordylobia and Dermatobia nodular cutaneous myiasis.", "type": "mcq", "opts": ["Sarcophaga, Wohlfahrtia and Chrysomyia", "Gastrophilus and Hypoderma", "Cordylobia and Dermatobia", "Musca domestica and Piophila", "Fannia and Eristalis"], "ans": 0}, "N-PAR-L2-06": {"id": "N-PAR-L2-06", "stem": "A 9-year-old girl with head lice is treated with topical permethrin 1%. Her mother is told to repeat the application after one week. What is the main reason for the second application?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Pediculicides (lindane 1% or permethrin 1%) are applied twice, 1 week apart, to kill any nits that survived treatment and to reduce reinfestation from fomites. Burrowing mites and a type IV hypersensitivity itch belong to scabies, not lice.", "type": "mcq", "opts": ["To kill any nits that survived the first treatment", "To kill mites burrowing in the epidermis", "To treat the type IV hypersensitivity reaction", "Because adult lice are not killed by the first application"], "ans": 0}, "N-PAR-L2-07": {"id": "N-PAR-L2-07", "stem": "A 10-year-old boy has itching that is worse at night, with burrows between his fingers, and mites are found in skin scrapings. Which topical treatment is indicated for him and all his family members?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Scabies is treated with permethrin 5% cream or lindane 1% (equally effective) for the patient and all family members. Permethrin 1%, malathion and topical ivermectin are lice treatments ('5 fingers → 5%, 1 head → 1%').", "type": "mcq", "opts": ["Permethrin 1%", "Permethrin 5% cream", "Lindane 5%", "Topical malathion", "Topical ivermectin"], "ans": 1}, "N-PAR-L2-08": {"id": "N-PAR-L2-08", "stem": "A 7-year-old child is brought with intense itching of the scalp, worst at the nape of the neck, and head lice are suspected. Which finding is most useful for diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Head lice are diagnosed by identifying nits (eggs glued to the hair shaft) and/or adult lice on the scalp hair. Mites in scrapings and burrows are the findings of scabies, linear papular urticaria points to bed bugs, and larvae in a wound to myiasis.", "type": "mcq", "opts": ["Mites or eggs in skin scrapings", "Minute burrows seen with a hand lens", "Nits and/or adult lice on the scalp hair", "Linear papular urticaria on the neck", "Larvae in a scalp wound"], "ans": 2}, "N-PAR-L2-09": {"id": "N-PAR-L2-09", "stem": "A homeless man is found to be heavily infested with body lice (Pediculus humanus corporis). Which of the following diseases can this louse transmit?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The body louse is the vector of epidemic typhus, trench fever (5-day fever) and epidemic relapsing fever (T-T-R). Plague and endemic typhus are transmitted by fleas, and blepharitis is the irritation caused by the pubic louse.", "type": "mcq", "opts": ["Plague", "Endemic typhus", "Trench fever", "Blepharitis"], "ans": 2}, "N-PAR-L2-10": {"id": "N-PAR-L2-10", "stem": "The larvae of a certain fly must live on a living host for part of their life cycle (obligatory sarcobiots), and the female fly lays her eggs on a mosquito. Which fly is this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Dermatobia causes specific myiasis and lays its eggs on a mosquito. Cordylobia also causes specific (nodular) myiasis, but it lays its eggs on clothes or the ground.", "type": "mcq", "opts": ["Cordylobia", "Dermatobia", "Lucilia", "Musca domestica", "Sarcophaga"], "ans": 1}, "N-PAR-L2-11": {"id": "N-PAR-L2-11", "stem": "Compare bed bugs and fleas regarding the type of ectoparasite, blood feeding, movement and morphology, skin lesion and medical importance.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The quickest discriminators are the lesion pattern (a line of papules with insomnia vs a dot with a swollen halo at the ankles) and the body shape (dorsoventrally flattened vs laterally compressed); only the flea is a vector, of plague and endemic typhus.", "type": "written", "keyhtml": "• Type: bed bug (Cimex lectularius), a temporary ectoparasite that visits the host only for a blood meal; flea, an obligatory temporary ectoparasite of man and animals.\n• Blood feeding: bed bug, male, female and nymphs suck blood, usually at night or in dark rooms, hiding by day in cracks, walls, floors and between mattresses (where it lays eggs); flea, both male and female suck blood.\n• Movement &amp; morphology: bed bug, wingless, reddish brown, flattened dorsoventrally, 4–6 × 4 mm, with a nasty odour from special glands; flea, jumps, 2–3 mm long, compressed laterally.\n• Skin lesion: bed bug, irritation, insomnia and allergic dermatitis as linear papular urticaria (arm, shoulder, back); flea, annoyance and allergic dermatitis, an erythematous dot surrounded by a patch of swollen reddish skin (ankle, lower leg).\n• Medical importance: bed bug, its bites; flea, its bites plus being a vector of plague and endemic typhus."}, "N-PAR-L2-12": {"id": "N-PAR-L2-12", "stem": "Classify myiasis according to the habits of the larvae, giving examples of the flies in each type.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Sarcobiots eat the living (specific), necrobiots eat the dead (semi-specific), and Musca is eaten by mistake (accidental).", "type": "written", "keyhtml": "1. Specific myiasis: the larvae must live on a living host for part of their life cycle (obligatory sarcobiots feeding on living tissue): Cordylobia, Oestrus, Gastrophilus, Hypoderma, Dermatobia. Dermatobia lays its eggs on a mosquito; Cordylobia on clothes or the ground.\n2. Semi-specific myiasis: the larvae are normally free-living necrobiots attacking carcasses, but can infest diseased tissue, neglected wounds, or a discharging ear or nose: Calliphora, Lucilia, Sarcophaga, Wohlfahrtia.\n3. Accidental myiasis: eggs or larvae deposited on exposed food are ingested by man, causing intestinal myiasis: Musca domestica, Piophila."}, "N-PAR-L2-13": {"id": "N-PAR-L2-13", "stem": "Mention how myiasis is diagnosed, describing the posterior spiracles of Musca, Sarcophaga and Calliphora larvae, and outline the treatment of myiasis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Musca → M-shaped slits; Sarcophaga → straight slits in a split-open peritreme; Calliphora → closed peritreme. Treatment follows the site: removal of larvae from accessible sites, a saline purge for the gut, douches or cystoscopy for the urogenital tract.", "type": "written", "keyhtml": "Diagnosis: identification of the larvae in the lesion by their posterior spiracles, and breeding of the larvae to the adult stage.\n• Musca domestica: sinuous, M-shaped slits; peritreme with a button; mouth hook and segmented body.\n• Sarcophaga &amp; Wohlfahrtia: 3 straight slits; opened peritreme.\n• Calliphora, Lucilia &amp; Chrysomyia: 3 slits; closed peritreme.\nTreatment: skin, nose, eye and ear, manual removal of the larvae; intestinal, saline purge; urogenital, douches or cystoscopy; antiseptics and antibiotics for secondary infection."}, "N-PAR-L2-14": {"id": "N-PAR-L2-14", "stem": "Mention the measures for the control and prevention of myiasis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Every measure aims to keep flies away from food and wounds; in a hospital outbreak of wound myiasis, insecticide spraying plus covering wounds is the key step.", "type": "written", "keyhtml": "Control: 1. Health education and covering food. 2. Environmental sanitation to reduce house-fly populations. 3. Physical and mechanical measures that prevent adult flies entering houses and hospitals. 4. Chemical: spraying insecticides.\nPrevention: insecticides; nets; protection of wounds; protection of food.\nIn hospitals, wound myiasis among immobile patients is best prevented by regular spraying of insecticides and covering wounds."}, "TP-064": {"id": "TP-064", "stem": "A 28-year-old nurse develops pruritic burrows on her hands after caring for a patient with a scaly rash. Scabies is confirmed. Which of the following is the most likely mode of infection?", "top": true, "rep": "", "tag": "Final bank PAR Q38", "bank": true, "expl": "Scabies is acquired by contact with an infected person or with infected towels or bedding; the adults and larvae then migrate in the epidermis and form burrows. Fleas are vectors of plague and endemic typhus, and the bite of the female sandfly transmits Leishmania.", "type": "mcq", "opts": ["Vector-borne via fleas", "Ingestion of eggs from contaminated food", "Direct skin contact with an infected person or fomites", "Bite of an infected mite", "Bite of a female sandfly"], "ans": 2}}, "labs": {}, "cards": [{"id": "PAR-L2-001", "text": "Scabies is caused by {{c1::Sarcoptes scabiei}} — the {{c2::itch mite}}", "extra": "", "sec": "Part 01 · Definition — Sarcoptes scabiei"}, {"id": "PAR-L2-002", "text": "The itch mite belongs to the {{c1::arthropods}} — like myiasis flies, lice, bed bugs and fleas", "extra": "Not a nematode, cestode, trematode or protozoan.", "sec": "Part 01 · Definition — Sarcoptes scabiei"}, {"id": "PAR-L2-003", "text": "Scabies distribution: {{c1::worldwide}}, in {{c2::bad hygienic conditions & overcrowding}}", "extra": "Avoiding these helps prevent scabies.", "sec": "Part 01 · 1.1 Sarcoptes scabiei at a glance"}, {"id": "PAR-L2-004", "text": "Sarcoptes scabiei reservoir hosts: {{c1::dog}} · {{c2::rabbit}} · {{c3::camel}}", "extra": "D-R-C.", "sec": "Part 01 · 1.1 Sarcoptes scabiei at a glance"}, {"id": "PAR-L2-005", "text": "Sarcoptes scabiei: size {{c1::0.1–0.4 mm}}, shape {{c2::oval}}", "extra": "", "sec": "Part 01 · 1.1 Sarcoptes scabiei at a glance"}, {"id": "PAR-L2-006", "text": "Scabies mode of infection: contact with an {{c1::infected person}}, or with infected {{c2::towels or bedding}}", "extra": "Hence the whole household is treated.", "sec": "Part 01 · 1.1 Sarcoptes scabiei at a glance"}, {"id": "PAR-L2-007", "text": "Sarcoptes scabiei: adults & larvae migrate in the {{c1::epidermis}} → {{c2::burrows}}", "extra": "", "sec": "Part 01 · 1.1 Sarcoptes scabiei at a glance"}, {"id": "PAR-L2-008", "text": "Scabies pathogenesis: mites migrate in the epidermis → {{c1::eggs deposited in the epidermis}} → severe itching & dermatitis → characteristic burrows", "extra": "", "sec": "Part 01 · 1.2 Pathogenesis"}, {"id": "PAR-L2-009", "text": "The severe itching of scabies is an {{c1::allergic}} response — a type {{c2::IV}} hypersensitivity reaction", "extra": "", "sec": "Part 01 · 1.2 Pathogenesis"}, {"id": "PAR-L2-010", "text": "Main presentation of classic scabies: severe {{c1::pruritus}}, worse at {{c2::night}}", "extra": "", "sec": "Part 01 · 1.3 Clinical picture"}, {"id": "PAR-L2-011", "text": "Scabies burrows: {{c1::serpiginous}} lines, often between the {{c2::fingers and toes}}", "extra": "", "sec": "Part 01 · 1.3 Clinical picture"}, {"id": "PAR-L2-012", "text": "Scabies papules also appear as multiple spherical {{c1::vesicles}}, {{c2::0.3–0.5 cm}}, with erosions that have healed and crusted", "extra": "", "sec": "Part 01 · 1.3 Clinical picture"}, {"id": "PAR-L2-013", "text": "Scratching in scabies → bleeding & scab formation → frequent {{c1::secondary bacterial infection}}", "extra": "", "sec": "Part 01 · 1.3 Clinical picture"}, {"id": "PAR-L2-014", "text": "Norwegian (crusted) scabies: a generalized dermatitis with extensive {{c1::scaling and crusting}}", "extra": "", "sec": "Part 01 · 1.3 Clinical picture"}, {"id": "PAR-L2-015", "text": "Norwegian (crusted) scabies occurs in {{c1::immunodeficient}} individuals and is a source of {{c2::nosocomial}} infection", "extra": "", "sec": "Part 01 · 1.3 Clinical picture"}, {"id": "PAR-L2-016", "text": "Scabies diagnosis: {{c1::clinical picture}} (severe itching + site of lesion) · {{c2::parasites or eggs in skin scrapings}} · a {{c3::hand lens}} to find the minute burrows", "extra": "Poor response to steroids & antihistamines is a clue.", "sec": "Part 01 · 1.4 Diagnosis"}, {"id": "PAR-L2-017", "text": "Scabies drugs: {{c1::permethrin 5%}} cream or {{c2::lindane 1%}} — equally effective", "extra": "After a hot soapy bath.", "sec": "Part 01 · 1.5 Treatment"}, {"id": "PAR-L2-018", "text": "Scabies: {{c1::boiling of all clothes and fomites}} is essential, and {{c2::all family members}} are treated — symptomatic or asymptomatic", "extra": "Never treat only the symptomatic patient.", "sec": "Part 01 · 1.5 Treatment"}, {"id": "PAR-L2-019", "text": "Permethrin strength — scabies: {{c1::5%}}; lice: {{c2::1%}}", "extra": "5 fingers → scabies 5% · 1 head → lice 1%.", "sec": "Part 01 · 1.5 Treatment"}, {"id": "PAR-L2-020", "text": "Myiasis = invasion of animal & human tissues by the {{c1::larval stages (maggots)}} of {{c2::dipterous flies}}", "extra": "", "sec": "Part 02 · Definition — Myiasis"}, {"id": "PAR-L2-021", "text": "Family Muscidae: {{c1::Musca domestica}} (house fly) · {{c2::Glossina}} (tsetse fly) · {{c3::Stomoxys calcitrans}} (stable fly)", "extra": "", "sec": "Part 02 · 2.1 Flies of medical importance"}, {"id": "PAR-L2-022", "text": "Metallic flies (Calliphoridae): {{c1::Calliphorinae}} (blue) · {{c2::Lucilia & Chrysomyia}} (green)", "extra": "", "sec": "Part 02 · 2.1 Flies of medical importance"}, {"id": "PAR-L2-023", "text": "Flesh flies (Sarcophagidae): {{c1::Sarcophaga}} & {{c2::Wohlfahrtia}} — {{c3::larviparous}} (deposit larvae)", "extra": "", "sec": "Part 02 · 2.1 Flies of medical importance"}, {"id": "PAR-L2-024", "text": "Flies undergo complete metamorphosis: egg → larva → {{c1::pupa}} → adult; the stage that causes myiasis = the {{c2::larva (maggot)}}", "extra": "", "sec": "Part 02 · 2.2 Development & medical importance"}, {"id": "PAR-L2-025", "text": "House fly (Musca) medical importance: {{c1::indirect mechanical transmission}} · {{c2::accidental myiasis}}", "extra": "Metallic & flesh flies cause semi-specific myiasis.", "sec": "Part 02 · 2.2 Development & medical importance"}, {"id": "PAR-L2-026", "text": "Specific myiasis: larvae must live on a {{c1::live host}} for part of the life cycle — obligatory {{c2::sarcobiots}} feeding on living tissue", "extra": "Sarcobiots eat the living.", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-027", "text": "Specific myiasis flies: {{c1::Cordylobia}} · {{c2::Oestrus}} · {{c3::Gastrophilus}} · {{c4::Hypoderma}} · {{c5::Dermatobia}}", "extra": "", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-028", "text": "Semi-specific myiasis: normally free-living larvae attacking carcasses ({{c1::necrobiots}}); can infest {{c2::diseased tissue & neglected wounds}}, or a discharging ear or nose", "extra": "Necrobiots eat the dead.", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-029", "text": "Semi-specific myiasis flies: {{c1::Calliphora}} · {{c2::Lucilia}} · {{c3::Sarcophaga}} · {{c4::Wohlfahrtia}}", "extra": "", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-030", "text": "Accidental myiasis: eggs or larvae deposited on exposed {{c1::food}} are ingested → {{c2::intestinal}} myiasis", "extra": "Musca is eaten by mistake.", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-031", "text": "Accidental myiasis flies: {{c1::Musca domestica}} & {{c2::Piophila}}", "extra": "Musca causes accidental, not specific, myiasis.", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-032", "text": "Egg-laying: {{c1::Dermatobia}} lays its eggs on a mosquito; {{c2::Cordylobia}} lays its eggs on clothes or the ground", "extra": "Both cause specific (nodular) myiasis.", "sec": "Part 02 · 2.3 Classification of myiasis by habits"}, {"id": "PAR-L2-033", "text": "External myiasis sites: {{c1::cutaneous}} · {{c2::ocular}} · {{c3::nasal}} · {{c4::aural}}", "extra": "", "sec": "Part 03 · 3.1 Classification by tissues invaded"}, {"id": "PAR-L2-034", "text": "Internal myiasis: {{c1::intestinal}} · {{c2::urogenital}} · {{c3::gastric}}", "extra": "Urogenital myiasis is internal, not external.", "sec": "Part 03 · 3.1 Classification by tissues invaded"}, {"id": "PAR-L2-035", "text": "Cutaneous myiasis forms: {{c1::creeping eruption}} · {{c2::nodular}} · {{c3::wound}} myiasis", "extra": "Creeping eruption = cutaneous (external) myiasis.", "sec": "Part 03 · 3.1 Classification by tissues invaded"}, {"id": "PAR-L2-036", "text": "Creeping eruption (cutaneous myiasis): {{c1::Gastrophilus}} & {{c2::Hypoderma}}", "extra": "", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-037", "text": "Nodular cutaneous myiasis (boil-like lesion, larva emerging): {{c1::Cordylobia}} & {{c2::Dermatobia}}", "extra": "", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-038", "text": "Wound myiasis: {{c1::Lucilia}} · {{c2::Calliphora}} · {{c3::Chrysomyia}} · {{c4::Cochliomyia}}", "extra": "", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-039", "text": "Wound myiasis in a neglected wound is {{c1::semi-specific}} myiasis — the larvae are {{c2::necrobiots}} feeding on dead tissue", "extra": "SGD 2 Case 11 key.", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-040", "text": "Nasal (in chronic discharge) & aural myiasis: {{c1::Sarcophaga}} · {{c2::Wohlfahrtia}} · {{c3::Chrysomyia}}", "extra": "", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-041", "text": "Ocular myiasis — external: {{c1::Oestrus}}; internal: {{c2::Oestrus, Gastrophilus & Hypoderma}}", "extra": "", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-042", "text": "Nasal myiasis: obstruction, sneezing, epistaxis — can {{c1::destroy bone & reach the brain}} → {{c2::death}}", "extra": "Nasal myiasis can be fatal.", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-043", "text": "Aural myiasis: {{c1::deafness}} · {{c2::tinnitus}} · {{c3::drum perforation}}", "extra": "", "sec": "Part 03 · 3.2 External myiasis"}, {"id": "PAR-L2-044", "text": "Intestinal myiasis — in food: {{c1::Musca, Sarcophaga & Wohlfahrtia}}; through the anus: {{c2::Fannia}}", "extra": "", "sec": "Part 03 · 3.3 Internal myiasis"}, {"id": "PAR-L2-045", "text": "Urogenital myiasis: {{c1::Fannia}}; gastric myiasis: {{c2::Eristalis}}", "extra": "Fannia = Far end (anus, urogenital) · Eristalis = stomach.", "sec": "Part 03 · 3.3 Internal myiasis"}, {"id": "PAR-L2-046", "text": "Myiasis diagnosis: larvae from the lesion identified by their {{c1::posterior spiracles}} · {{c2::breeding of the larvae to the adult stage}}", "extra": "Not blood films or serology.", "sec": "Part 03 · 3.4 Diagnosis — read the posterior spiracles"}, {"id": "PAR-L2-047", "text": "Musca domestica larva — posterior spiracles: {{c1::sinuous, M-shaped}} slits; peritreme with a {{c2::button}}", "extra": "Larva also shows a mouth hook and a segmented body.", "sec": "Part 03 · 3.4 Diagnosis — read the posterior spiracles"}, {"id": "PAR-L2-048", "text": "Posterior spiracles — Sarcophaga & Wohlfahrtia: 3 {{c1::straight}} slits, {{c2::opened::open or closed}} peritreme; Calliphora, Lucilia & Chrysomyia: 3 slits, {{c3::closed::open or closed}} peritreme", "extra": "Sarcophaga = Straight & Split · Calliphora = Closed.", "sec": "Part 03 · 3.4 Diagnosis — read the posterior spiracles"}, {"id": "PAR-L2-049", "text": "Spiracle → larva: 3 slits + closed peritreme → {{c1::Calliphora group}} · 3 straight slits + open peritreme → {{c2::Sarcophaga / Wohlfahrtia}} · M-shaped slits + button → {{c3::Musca}}", "extra": "Calliphora group = Calliphora, Lucilia, Chrysomyia.", "sec": "Part 03 · 3.4 Diagnosis — read the posterior spiracles"}, {"id": "PAR-L2-050", "text": "Myiasis treatment — skin, nose, eye, ear: {{c1::manual removal of larvae}} · intestinal: {{c2::saline purge}} · urogenital: {{c3::douches or cystoscopy}}", "extra": "All sites: antiseptics & antibiotics for secondary infection.", "sec": "Part 03 · 3.5 Treatment"}, {"id": "PAR-L2-051", "text": "Myiasis control: {{c1::health education & covering food}} · {{c2::environmental sanitation}} (fewer house flies) · {{c3::physical & mechanical}} (keep flies out of houses, hospitals) · {{c4::chemical — spraying insecticides}}", "extra": "", "sec": "Part 03 · 3.6 Control & prevention"}, {"id": "PAR-L2-052", "text": "Myiasis prevention: {{c1::insecticides}} · {{c2::nets}} · {{c3::protection of wounds}} · {{c4::protection of food}}", "extra": "", "sec": "Part 03 · 3.6 Control & prevention"}, {"id": "PAR-L2-053", "text": "Wound myiasis among immobile hospital patients — most effective measure: {{c1::regular spraying of insecticides}} and {{c2::covering wounds}}", "extra": "Not deworming, hand washing or scabies isolation.", "sec": "Part 03 · 3.6 Control & prevention"}, {"id": "PAR-L2-054", "text": "Lice: {{c1::bloodsucking}}, {{c2::wingless}}, {{c3::permanent}} ectoparasites", "extra": "", "sec": "Part 04 · Definition — Lice"}, {"id": "PAR-L2-055", "text": "Lice of man: head louse = {{c1::Pediculus humanus capitis}} · body louse = {{c2::Pediculus humanus corporis}} · pubic louse = {{c3::Phthirus pubis}}", "extra": "", "sec": "Part 04 · 4.1 The three lice & their medical importance"}, {"id": "PAR-L2-056", "text": "Body louse is the vector of: {{c1::epidemic typhus}} · {{c2::trench fever (5-day fever)}} · {{c3::epidemic relapsing fever}}", "extra": "T-T-R — Typhus, Trench fever, Relapsing fever.", "sec": "Part 04 · 4.1 The three lice & their medical importance"}, {"id": "PAR-L2-057", "text": "Pediculosis ({{c1::vagabond's disease}}) is caused by the head louse and also by the {{c2::body louse}}", "extra": "Quiz 2 Q5 key: P. corporis for scalp/neck findings (only louse offered). Pamphlet: head louse — pick capitis if offered.", "sec": "Part 04 · 4.1 The three lice & their medical importance"}, {"id": "PAR-L2-058", "text": "The head louse is {{c1::not a vector}} under natural circumstances", "extra": "The body louse is.", "sec": "Part 04 · 4.1 The three lice & their medical importance"}, {"id": "PAR-L2-059", "text": "Pubic louse (Phthirus pubis): irritation — {{c1::blepharitis}}", "extra": "", "sec": "Part 04 · 4.1 The three lice & their medical importance"}, {"id": "PAR-L2-060", "text": "Head lice are found commonly at the {{c1::nape of the neck}} or {{c2::behind the ears}}", "extra": "", "sec": "Part 04 · 4.2 Biology"}, {"id": "PAR-L2-061", "text": "Head lice spread by {{c1::physical contact}} and {{c2::sharing combs}} (also hats & clothing)", "extra": "", "sec": "Part 04 · 4.2 Biology"}, {"id": "PAR-L2-062", "text": "Nits = {{c1::eggs}} glued to the hair shaft — {{c2::a single egg}} per hair", "extra": "The 'dandruff' that will not brush off.", "sec": "Part 04 · 4.2 Biology"}, {"id": "PAR-L2-063", "text": "Lice are {{c1::voracious}} feeders and can cause {{c2::epidemics}}", "extra": "", "sec": "Part 04 · 4.2 Biology"}, {"id": "PAR-L2-064", "text": "Pediculosis findings: {{c1::excoriations}} · {{c2::erythema}} · {{c3::pyoderma}} · {{c4::scaliness}} of the scalp & posterior neck", "extra": "", "sec": "Part 04 · 4.3 Clinical picture & diagnosis"}, {"id": "PAR-L2-065", "text": "Head lice diagnosis: identification of {{c1::nits and/or adult lice}} on the {{c2::scalp hair}}", "extra": "Not mites in scrapings (scabies) or larvae in a wound (myiasis).", "sec": "Part 04 · 4.3 Clinical picture & diagnosis"}, {"id": "PAR-L2-066", "text": "Pediculicides: /* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
const LAB = {};
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {
  const st = lst(L.id, () => ({n: 0, wrong: 0, shake: null, order: shuffled(L.steps.map((_, i) => i), L.id + 's')}));
  const done = st.n >= L.steps.length; if (done) labDone(L.id);
  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>
   <div class="seqline">${st.n ? L.steps.slice(0, st.n).map((s, i) => `<span class="n">${i + 1}</span><span class="chip ok">${esc(s)}</span>`).join('') : '<span class="muted" style="font-size:.78em">Your order appears here.</span>'}</div>
   <div class="pool">${st.order.filter(i => i >= st.n).map(i => `<button class="chip ${st.shake === i ? 'shake' : ''}" data-act="qpick" data-l="${L.id}" data-i="${i}">${esc(L.steps[i])}</button>`).join('')}</div>
   ${done ? `<div class="done">✓ Correct order${L.mnemonic ? ' — ' + esc(L.mnemonic) : ''}${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ''}</div>` : (st.wrong ? `<div class="muted" style="font-size:.78em">Wrong tries: ${st.wrong}</div>` : '')}
   <div class="row"><button class="btn" data-act="qreset" data-l="${L.id}">Start again</button></div>`;
};
// --- labelled diagram ---
const DRAW = {};
LAB.diagram = L => {
  const st = lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.pins.map(p => p.id), L.id)}));
  const pins = L.pins.map((p, i) => {
    const shown = st.mode === 'labels' || (st.mode === 'test' && st.rev[p.id]);
    let c = st.mode === 'test' && st.rev[p.id] ? 'on' : '';
    if (st.mode === 'find' && st.fb && st.fb[2] === p.id) c = st.fb[0];
    const lx = p.lx !== undefined ? p.lx : p.x + 9, anchor = p.anchor || 'start';

  }).join('');

  }
  return `<div class="modes">${[['labels', 'Labels on'], ['test', 'Test me'], ['find', 'Find it']].map(([m, n]) => `<button class="mini ${st.mode === m ? 'on' : ''}" data-act="dmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}</div>
   <div class="svgw"><svg viewBox="${L.viewBox}" role="img" aria-label="${esc(L.title)}">${DRAW[L.draw] ? DRAW[L.draw]() : ''}${pins}</svg></div>
   ${st.mode === 'labels' ? `<ol class="key">${L.pins.map(p => `<li>${esc(p.name)}</li>`).join('')}</ol>` : st.mode === 'test' ? `<ol class="key">${L.pins.map(p => `<li>${st.rev[p.id] ? esc(p.name) : '<span class="muted">tap ' + (L.pins.indexOf(p) + 1) + ' to check</span>'}</li>`).join('')}</ol>` : ''}<div class="info">${info}</div>`;
};

  rerender(pageOf(a)); };

A.qpick = a => { const L = LABS[a.dataset.l], st = LS[L.id], i = +a.dataset.i; if (i === st.n){ st.n++; st.shake = null; } else { st.wrong++; st.shake = i; } rerender(pageOf(a)); };

A.dmode = a => { const L = LABS[a.dataset.l], st = LS[L.id]; st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(L.pins.map(p => p.id), String(Date.now())); rerender(pageOf(a)); };
A.pin = a => { const L = LABS[a.dataset.l], st = LS[L.id], id = a.dataset.id;

    if (id === t){ st.score += st.fb && st.fb[0] === 'bad' && st.fb[3] === t ? 0 : 1; st.qi++; st.fb = ['ok', '✓ Correct', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; rerender(pageOf(document.querySelector(`[data-l="${L.id}"]`) || a)); } }, 700); }
    else st.fb = ['bad', 'That is ' + L.pins.find(p => p.id === id).name + '. Try again.', id, t]; }
