<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSK Book">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>MSK Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}
.op[disabled]{cursor:default}
.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}

ng cycle:<\/b> resting, resorption, reversal, formation, mineralisation"]}], "toc": ["05", "The Metabolic Bone Diseases Compared"]}, {"id": "p72", "head": "Lab · Recall · Part 05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l1-2-4-0", "title": "Recall · The Metabolic Bone Diseases Compared", "groups": [{"title": " Master comparison table (osteoporosis, Paget, rickets/osteomalacia, hyperparathyroidism)", "items": [["Osteoporosis:", "low density, normal composition; normal labs; DEXA; fragility fracture"], ["Paget:", "osteoclast first then osteoblast; mosaic cement lines; sarcoma, heart failure"], ["Rickets/osteomalacia:", "faulty mineralisation; Looser zones; ↓ vit D, ↑ PTH, ↑ ALP"], ["Hyperparathyroidism:", "subperiosteal phalangeal resorption, brown tumours, cysts"], ["Osteomyelitis compared:", "acute pyogenic vs chronic suppurative vs tuberculous"], ["Dysplasias compared:", "OI (type I collagen), achondroplasia (FGFR3), osteopetrosis (osteoclast)"], ["Remodelling cycle:", "resting, resorption, reversal, formation, mineralisation"]]}]}], "labName": "Recall · The Metabolic Bone Diseases Compared"}, {"id": "p73", "head": "Part 06 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "06", "title": "Rapid Revision", "sub": "One-liners, mnemonics and exam traps"}, {"t": "h", "no": "", "title": "One-liners, mnemonics and exam traps"}, {"t": "list", "items": ["Fracture healing 1-3-6-9; intermediate callus becomes cortex", "Sequestrum Separated dead; Involucrum Invests; Cloaca Channel", "<b>Paget phases L-M-S:<\/b> lytic, mixed, sclerotic", "Rickets = Rapidly growing child; osteomalacia = mature adult", "Osteopetrosis = petros (stone); osteoclast cannot chew"]}], "toc": ["06", "Rapid Revision"]}, {"id": "p74", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l1-2-5-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonics and exam traps", "items": [["Fracture healing", "1-3-6-9; intermediate callus becomes cortex"], ["Sequestrum Separated", "dead; Involucrum Invests; Cloaca Channel"], ["Paget phases L-M-S:", "lytic, mixed, sclerotic"], ["Rickets =", "Rapidly growing child; osteomalacia = mature adult"], ["Osteopetrosis =", "petros (stone); osteoclast cannot chew"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p75", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "In osteoporosis serum Ca, PO4 and PTH are normal; abnormal chemistry points elsewhere"}, {"t": "note", "kind": "trap", "html": "Osteopetrotic bones are denser but more brittle — they fracture"}, {"t": "note", "kind": "trap", "html": "The intermediate callus remains; external and internal are removed"}, {"t": "note", "kind": "trap", "html": "Acute osteomyelitis in children is metaphyseal, not diaphyseal"}, {"t": "note", "kind": "trap", "html": "Tuberculous abscess is cold — no heat, no redness"}, {"t": "note", "kind": "trap", "html": "Achondroplasia is activation of FGFR3, not loss of function"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p76", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "In hyperparathyroidism PTH acts on osteoblast first (RANK-L), which drives osteoclast"}, {"t": "note", "kind": "trap", "html": "Secondary amyloidosis complicates both chronic suppurative and tuberculous osteomyelitis"}, {"t": "note", "kind": "cl", "html": "New intense pain and swelling in pagetic bone suggests Paget sarcoma (osteosarcoma, fibrosarcoma)"}, {"t": "note", "kind": "cl", "html": "Osteopetrosis was first genetic disease treated by bone marrow transplantation (osteoclast is marrow-derived)"}, {"t": "note", "kind": "cl", "html": "Blue sclerae: classic bedside clue of osteogenesis imperfecta"}, {"t": "note", "kind": "cl", "html": "TB caseous material may track down psoas sheath to appear in groin/thigh (psoas abscess)"}]}, {"id": "p77", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Y26-053": {"id": "Y26-053", "stem": "A 42-year-old man on vacation is involved in a skiing accident in which he sustains a right tibial diaphyseal fracture. The fracture is set with open reduction and internal fixation for proper alignment. His vacation is not over, and 1 week later, he is in the ski lodge, sitting by the fire with drink in hand. There are now more osteoclasts in the region of the fracture. What is the most likely function of these osteoclasts?", "top": true, "rep": "", "tag": "Final bank PAT Q9", "bank": true, "expl": "In fracture healing, osteoclasts clear the haematoma and the necrotic (dead) bone debris, and during remodelling they remove the external and internal callus — that is, they resorb bone. Laying down new osteoid is the job of osteoblasts, not osteoclasts.", "type": "mcq", "opts": ["Form collagen", "Resorb bone", "Synthesize osteoid", "Elaborate cytokines", "Divide"], "ans": 1}, "Y26-013": {"id": "Y26-013", "stem": "Which of the following is true about osteomyelitis?", "top": true, "rep": "", "tag": "Final bank PAT Q5", "bank": true, "expl": "Acute osteomyelitis usually spreads by the hematogenous route: bacteria (most often Staph. aureus) from a septic focus reach the bloodstream and seed the bone, mainly in children. It starts in the metaphysis, not the epiphysis, and the involucrum is new periosteal bone — the dead piece of bone is the sequestrum.", "type": "mcq", "opts": ["Epiphysis is the most common site", "Involucrum is a dead piece of bone", "Occurs commonly in old age", "Usually hematogenous spread"], "ans": 3}, "Y26-042": {"id": "Y26-042", "stem": "A 9-year-old boy has had pain in the area of the right hip for the past 3 weeks. On physical examination, his temperature is 38.2° C. There is swelling with marked tenderness to palpation in the area of the right hip, pain, and reduced range of motion. Radiographs of the pelvis and legs show areas of osteolysis and cortical erosion involving the femoral metaphysis, with adjacent soft-tissue swelling extending from the subperiosteal region, and apparent abscess formation. Which of the following organisms is most likely to produce these findings?", "top": true, "rep": "", "tag": "Final bank PAT Q1", "bank": true, "expl": "Fever, marked local pain and tenderness with a lytic metaphyseal lesion and a subperiosteal abscess in a child are acute haematogenous osteomyelitis, and Staph. aureus is its most common organism. Acute osteomyelitis is mainly a disease of children and starts in the metaphysis of long bones because of the slow blood flow there.", "type": "mcq", "opts": ["Salmonella enterica", "Staph. aureus", "H. influenzae", "Neisseria gonorrhoeae"], "ans": 1}, "Q0224": {"id": "Q0224", "stem": "What bone disorder is caused by an autosomal dominant defect in the synthesis of type I collagen?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT Q6", "bank": true, "expl": "Osteogenesis imperfecta (brittle bone disease) is autosomal dominant: a defect in type I collagen production with decreased bone mass. Achondroplasia is a point mutation activating FGFR3, osteopetrosis is reduced osteoclast-mediated resorption, and osteomyelitis is inflammation (infection) of bone and marrow.", "type": "mcq", "opts": ["Osteopetrosis", "Osteogenesis imperfecta", "Osteomyelitis", "Achondroplasia"], "ans": 1}, "Y26-041": {"id": "Y26-041", "stem": "A 6-year-old girl who was normal at birth now has bilateral hearing loss. Audiometry indicates bilateral mixed conductive and sensorineural hearing loss. Her sclerae have a bluish color, and her vision is 20/40. A radiograph shows that the femur is osteopenic with multiple fractures. Which of the following molecular mechanisms is most likely to produce these findings?", "top": true, "rep": "", "tag": "Final bank PAT Q2", "bank": true, "expl": "Blue sclerae, hearing loss and an osteopenic femur with multiple fractures are osteogenesis imperfecta (brittle bone disease), an autosomal dominant defect in type I collagen production with decreased bone mass. FGFR3-mediated inhibition of chondrocyte proliferation is achondroplasia (short limbs, not fractures with blue sclerae), and HGPRT deficiency is Lesch–Nyhan syndrome, a cause of secondary gout.", "type": "mcq", "opts": ["Fibroblast growth factor receptor 3 inhibition of cartilage proliferation", "Deficient hypoxanthine-guanine phosphoribosyltransferase (HGPRT) activity", "Diminished osteoprotegerin binding to macrophage RANK receptor", "Failure of type I collagen formation by osteoblasts"], "ans": 3}, "Y26-051": {"id": "Y26-051", "stem": "A 15-year-old boy experiences severe pain in the right leg after performing a gymnastic floor exercise. On physical examination, there is marked pain on palpation of the right lower thigh just above the knee. Radiographs show a pathologic fracture across a discrete, 3-cm lower femoral diaphyseal lesion that has central lucency with a thin sclerotic rim. The lesion is completely intramedullary and well circumscribed. A bone biopsy specimen of the affected region shows trabeculae of woven bone scattered in a background of fibroblastic proliferation. What is the most likely diagnosis?", "top": true, "rep": "", "tag": "Final bank PAT Q10", "bank": true, "expl": "Trabeculae of woven bone scattered in a background of fibroblastic proliferation, in a well-circumscribed intramedullary lesion with a thin sclerotic rim that has fractured, are fibrous dysplasia; a single affected bone makes it monostotic (the other type is polyostotic). Osteoid osteoma also has a lucent centre with a sclerotic rim and woven bone, but it is a &lt; 2 cm cortical nidus rimmed by prominent osteoblasts, with night pain relieved by aspirin.", "type": "mcq", "opts": ["Osteoid osteoma", "Enchondroma", "Osteogenic sarcoma", "Ewing sarcoma", "Monostotic fibrous dysplasia"], "ans": 4}, "Y26-088": {"id": "Y26-088", "stem": "Case: A 15-year-old boy experiences severe pain in the left hip after performing a gymnastic floor exercise. On physical examination, there is marked pain on palpation of the left hip. X-ray showed a fracture of the proximal femur and a lytic bone lesion at the fracture site surrounded with sclerosis (Figure A). A bone biopsy specimen of the affected region shows trabeculae of woven bone scattered in a background of fibroblastic proliferation (Figure B).\n1. What is the most likely diagnosis?\n2. What are the types of that disease?\n3. What are the possible other complications?", "top": true, "rep": "", "tag": "Final bank PAT W1", "bank": true, "expl": "Fibrous dysplasia is a tumour-like lesion (forming a mass) grouped with the developmental bone diseases; trabeculae of woven bone scattered in a fibroblastic background, in a lytic lesion with a sclerotic rim that has fractured, fit it. It may involve one bone (monostotic) or several bones (polyostotic).", "img": ["figs/GP-10.jpg", "figs/GP-10_2.jpg"], "cap": "Figure A: X-ray of the left hip; Figure B: bone biopsy (H&E)", "type": "written", "keyhtml": "1. Fibrous dysplasia.\n2. Monostotic and polyostotic.\n3. Deformities (shepherd deformity); anaemia, recurrent infections; malignant transformation."}, "Q0501": {"id": "Q0501", "stem": "Which of the following bone diseases is an acquired osteodystrophy?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Osteitis deformans is Paget disease of bone, one of the acquired osteodystrophies. Syndactyly is a dysostosis, and osteogenesis imperfecta and achondroplasia are dysplasias — all congenital osteodystrophies.", "type": "mcq", "opts": ["Syndactyly", "Osteogenesis imperfecta", "Achondroplasia", "Osteitis deformans"], "ans": 3}, "Y26-054": {"id": "Y26-054", "stem": "A 70-year-old man complains of right hip and thigh pain of several months' duration. On physical examination, he has reduced range of motion in both hips, but there is no tenderness or swelling on palpation. Radiographs of the pelvis and right leg show sclerotic, thickened cortical bone with a narrowed joint space near the acetabulum. Laboratory studies show a serum alkaline phosphatase level of 173 U/L, calcium of 9.5 mg/dL, and phosphorus of 3.4 mg/dL. A bone biopsy is done; the figure shows the microscopic appearance of the specimen. What condition is most likely to produce these findings?", "top": true, "rep": "", "tag": "Final bank PAT Q11", "bank": true, "expl": "Sclerotic, thickened bone of the pelvis and leg in an older man, with a biopsy showing disorganised cement lines in a mosaic pattern, is Paget disease of bone; its sclerotic phase is osteoblastic, and it can cause arthritis of nearby joints. Osteoarthritis narrows the joint space but does not thicken the cortex or give a mosaic pattern, and the normal calcium and phosphate argue against vitamin D deficiency.", "img": ["figs/Y26-054.jpg"], "cap": "H&E section of the bone biopsy", "type": "mcq", "opts": ["Osteochondroma", "Vitamin D deficiency", "Degenerative osteoarthritis", "Hyperparathyroidism", "Paget disease of bone"], "ans": 4}, "Q0503": {"id": "Q0503", "stem": "In patients with hyperparathyroidism, the bones may show:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The brown tumour of hyperparathyroidism is a large osteolytic lesion resembling a bone tumour, brown because of haemorrhage; 'osteitis' in osteitis fibrosa cystica means increased bone cell activity. Metaphyseal cupping and fraying are X-ray signs of rickets.", "type": "mcq", "opts": ["Large osteolytic lesions resembling tumours", "Metaphyseal cupping and fraying", "Decreased bone cell activity", "No cyst formation or haemorrhage"], "ans": 0}, "Y26-055": {"id": "Y26-055", "stem": "A 38-year-old man who is otherwise healthy has experienced chronic leg pain for the past 4 months. On physical examination, there is local swelling with tenderness just below the right patella. A radiograph of the right lower leg shows a 4-cm cystic area in the right tibial diaphysis without erosion of the cortex or soft-tissue mass. A biopsy specimen shows increased numbers of osteoclasts in this lesion and fibroblast proliferation. Which of the following underlying conditions is most likely to account for these findings?", "top": true, "rep": "", "tag": "Final bank PAT Q12", "bank": true, "expl": "A cystic lytic lesion with increased osteoclasts and fibrosis is the brown tumour of hyperparathyroidism (osteitis fibrosa cystica: increased bone cell activity, peritrabecular fibrosis, cysts). In an otherwise healthy man with no cause of prolonged hypocalcaemia, the hyperparathyroidism is primary, from a parathyroid adenoma. Giant cell tumour sits in the epiphysis and metaphysis around the knee and shows multinucleated giant cells with neoplastic stromal cells, not a diaphyseal cyst with fibrosis.", "type": "mcq", "opts": ["Secondary hyperparathyroidism", "Paget disease of bone", "Chronic osteomyelitis", "Parathyroid adenoma", "Giant-cell tumor of bone"], "ans": 3}, "Q0514": {"id": "Q0514", "stem": "Enumerate the stages of healing of bone fracture.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W8", "bank": true, "expl": "Remember 1–3–6–9: day 1 haematoma, week 3 soft callus, week 6 hard callus, week 9 remodelling. Throughout, osteoclasts clear dead tissue and osteoblasts lay down osteoid.", "type": "written", "keyhtml": "1. Haematoma (day 1): blood clot at the fracture site, followed by an acute inflammatory reaction (day 3 → 1 week).\n2. Soft callus (up to week 3): cartilage + non-calcified osteoid + granulation tissue.\n3. Hard callus (up to week 6): calcified osteoid = woven bone (external, intermediate and internal callus).\n4. Remodelling (up to week 9): lamellation; osteoclasts remove the external and internal callus, and the intermediate callus remains as the bone cortex."}, "Q0515": {"id": "Q0515", "stem": "Mention three complications of healing of bone fracture.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W9", "bank": true, "expl": "Delayed union and non-union are caused by the same factors that affect bone healing, such as infection, tumour, foreign body and poor immobilisation.", "type": "written", "keyhtml": "Any three of:\n1. Malunion — wrong alignment of the healed bone.\n2. Non-union — wide space between the fracture ends, or soft-tissue interposition.\n3. Delayed union — healing takes longer than expected.\n4. Infection (osteomyelitis).\n5. Avascular necrosis — loss of blood supply to the fragment."}, "Q0516": {"id": "Q0516", "stem": "The most common organism causing hematogenous osteomyelitis is ____.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W10", "bank": true, "expl": "Staph. aureus is the most common organism; it reaches the bone by haematogenous spread from a septic focus such as tonsillitis, otitis media or sinusitis, mainly in children.", "type": "written", "keyhtml": "Staphylococcus aureus (Staph. aureus)."}, "Q0517": {"id": "Q0517", "stem": "The most common part of bone to be affected in osteomyelitis is ____.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W11", "bank": true, "expl": "Acute (haematogenous) osteomyelitis usually starts in the metaphysis of a long bone because of frequent haematoma and slow blood flow there; Brodie's abscess of chronic suppurative osteomyelitis is also metaphyseal. (Tuberculous osteomyelitis, by contrast, mainly affects the thoracic and lumbar vertebrae.)", "type": "written", "keyhtml": "The metaphysis of a long bone."}, "Q0518": {"id": "Q0518", "stem": "Mention three complications of acute hematogenous osteomyelitis.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W12", "bank": true, "expl": "About 15–30% of cases become chronic suppurative osteomyelitis, mainly through delayed treatment, inadequate antibiotics, incomplete surgical debridement or weak immunity.", "type": "written", "keyhtml": "Any three of: septicaemia and toxaemia; systemic pyaemia; chronic suppurative osteomyelitis; chronic suppurative arthritis; direct spread of infection to nearby tissues."}, "Q0519": {"id": "Q0519", "stem": "Mention three complications of Pott's disease.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W13", "bank": true, "expl": "Pott disease is tuberculous osteomyelitis of the thoracic and lumbar vertebrae; its abscess is 'cold' because it lacks the heat and redness of a pyogenic abscess.", "type": "written", "keyhtml": "Any three of: kyphosis (necrosis and compressed vertebral fracture); cold abscess (extension to the soft tissue; may track down the psoas sheath as a psoas abscess); compression of the spinal cord → paraplegia, quadriplegia; secondary amyloidosis."}, "Q0535": {"id": "Q0535", "stem": "A 10-year-old girl sustained an open compound fracture of the right femur due to a fall. The fracture was set by external manipulation, and the skin wound is sutured, but nothing more is done. Six months later, she continues to have pain in the right leg, and a draining sinus tract has developed in the lateral lower right leg. A radiograph of the lower right leg is now most likely to show which of the following?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q3", "bank": true, "expl": "An infected open fracture that is left untreated becomes chronic suppurative osteomyelitis: dead bone separated from living bone (sequestrum) is surrounded by new periosteal bone (involucrum), and pus escapes through a draining sinus (cloaca). A destructive lytic focus with a sclerotic rim is the early X-ray of acute osteomyelitis, and a cortical nidus with surrounding sclerosis is osteoid osteoma.", "type": "mcq", "opts": ["Involucrum and sequestrum", "Cortical nidus with surrounding sclerosis", "Tumor mass with bony destruction", "Osteolysis with osteosclerosis"], "ans": 0}, "Q0549": {"id": "Q0549", "stem": "A 69-year-old man has noted increasing back and leg pain for 3 years. He has greater difficulty hearing on the left. On physical examination he has decreased range of motion at the hips. Radiographs reveal bony sclerosis of the sacroiliac, lower vertebral, and upper tibial regions. His hats don't even fit him anymore. Which of the following conditions is he most likely to have?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q18", "bank": true, "expl": "Bone pain, an enlarging skull (his hats no longer fit), hearing loss from cranial nerve impingement and sclerosis of the pelvis, lumbar spine and tibia in an older man fit Paget disease of bone in its sclerotic phase. Vitamin D deficiency gives osteopenia and Looser zones, not sclerosis or skull enlargement.", "type": "mcq", "opts": ["Metastatic adenocarcinoma", "Paget disease of bone", "Renal failure with renal osteodystrophy", "Osteoporosis", "Vitamin D deficiency"], "ans": 1}, "Q0550": {"id": "Q0550", "stem": "A 38-year-old woman has severe systemic lupus erythematosus with renal complications. She is treated with long-term corticosteroid therapy. Which of the following bone diseases is she most likely to develop?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Corticosteroids favour osteoclastic resorption and are listed among the risk factors for osteoporosis. Osteomalacia is faulty mineralisation from deficient vitamin D, phosphate or calcium, and rickets affects children before epiphyseal fusion.", "type": "mcq", "opts": ["Paget disease of bone", "Rickets", "Osteochondritis", "Osteoporosis", "Osteomalacia"], "ans": 3}, "Q0551": {"id": "Q0551", "stem": "An 80-year-old woman has had no major medical problems, but she has never been physically active for most of her life. One day she falls out of bed and immediately notes a sharp pain in her left hip. She is subsequently unable to ambulate without severe pain. Radiographs show not only a fracture of the left femoral head, but also a compressed fracture of T10. Which of the following conditions is she most likely to have?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q13", "bank": true, "expl": "A hip fracture after a fall from bed plus a vertebral compression fracture in an elderly, physically inactive woman is osteoporosis: the vertebrae, wrist and hips are its commonest fracture sites, and age, female sex and inactivity are risk factors. Osteogenesis imperfecta is a congenital type I collagen defect with blue sclerae and hearing loss.", "type": "mcq", "opts": ["Vitamin D deficiency", "Acute osteomyelitis", "Osteogenesis imperfecta", "Osteoporosis", "Metastatic breast carcinoma"], "ans": 3}, "Q0553": {"id": "Q0553", "stem": "A 29-year-old woman, G3, P2, gives birth to an infant following an uncomplicated pregnancy. The infant’s height is below the fifth percentile. On physical examination, the infant’s torso and head size are normal, but the extremities are short. The forehead appears prominent. Radiographs show short, slightly bowed long bones, but no osteopenia. The other two children in the family are of normal height. The affected child has no difficulty with activities of daily living after modifications are made in the home and school for short stature, and later becomes a physician. Which of the following conditions is likely to be present in this child?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q4", "bank": true, "expl": "Short limbs with a normal torso and head, a prominent forehead and short long bones without osteopenia in a healthy child with normal-height siblings is achondroplasia: an activating FGFR3 point mutation inhibits chondrocyte proliferation, stunting bones formed by endochondral ossification while intramembranous bones such as the cranial vault are spared. Rickets can also give a prominent frontal bone and bowed legs, but it is a vitamin D deficiency with craniotabes, rachitic rosary and genu varum rather than short limbs from birth.", "type": "mcq", "opts": ["Achondroplasia", "Hurler syndrome", "Osteogenesis imperfecta", "Rickets", "Scurvy"], "ans": 0}, "Q0554": {"id": "Q0554", "stem": "A social worker refers a 2-year-old child to the physician because of suspected child abuse with multiple bone fractures. On physical examination, the child has blue sclerae and diminished hearing in both ears. Radiographs of the child's extremities show recent and healing long bone fractures. Which of the following is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q14", "bank": true, "expl": "Multiple fractures with blue sclerae (the classic bedside clue) and hearing loss are osteogenesis imperfecta (brittle bone disease), an autosomal dominant type I collagen defect with decreased bone mass. Trauma alone does not explain the blue sclerae and deafness, and osteopetrosis gives fractures and hearing impairment from dense bone pressing on the nerves.", "type": "mcq", "opts": ["Trauma ('shaken child syndrome')", "Osteogenesis imperfecta", "Achondroplasia", "Rickets", "Osteopetrosis"], "ans": 1}, "Q0557": {"id": "Q0557", "stem": "Vitamin D deficiency in children results in:", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q19", "bank": true, "expl": "Vitamin D deficiency in children is rickets, faulty mineralisation before epiphyseal fusion; its specific signs include genu varum, craniotabes and delayed (not early) closure of the fontanelles. A lion-shaped face (leontiasis) is a feature of Paget disease of bone.", "type": "mcq", "opts": ["Early closure of the skull fontanelles", "Increased intestinal absorption of calcium", "Genu varum due to inadequate bone mineralization", "Lion-shaped bones of the face"], "ans": 2}, "Q0565": {"id": "Q0565", "stem": "Case: A 68-year-old female patient with a known history of chronic renal disease recently started corticosteroid therapy for the treatment of an allergic condition. She slipped during her shower and suffered from acute pain and swelling around her hip joint. After admission to the emergency room, her radiology revealed femoral neck fracture. During history taking she stated that her stature had decreased over the last ten years. Orthopedic surgery was done to treat her fracture, and she was discharged safely on physiotherapy and dietary supplements.\n1. What is the possible cause of her fracture? Why?\n2. What are the predisposing factors?\n3. What are the bone changes expected in her femoral bone biopsy?\n4. What investigations will you ask for?\n5. What is the suggested treatment plan?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W2", "bank": true, "expl": "Osteoporosis is silent until a fragility fracture of the hip, wrist or vertebrae; this postmenopausal woman on corticosteroids who has lost height fits it. The remaining bone is of normal composition, so serum calcium, phosphorus and PTH are normal (unlike osteomalacia), and a DEXA scan confirms the low bone density.", "aimg": ["figs/GP-05_ans.jpg", "figs/GP-05_ans2.jpg", "figs/GP-05_ans3.jpg", "figs/GP-05_ans4.jpg"], "acap": "Osteoporosis: definition and common fracture sites; clinical manifestations; normal vs osteoporotic bone (answer slides 30–31)", "type": "written", "keyhtml": "1. Osteoporosis — it is the common cause of femoral neck fracture in postmenopausal females (fracture after a minor slip; loss of height over years from vertebral collapse).\n2. Decreased estrogen (menopause); renal disease; corticosteroid therapy (also female sex and increasing age).\n3. Cortical bone thinning; subperiosteal and endosteal resorption; Haversian canal widening (thin, fragile trabeculae — the bone that remains is of normal composition).\n4. DEXA scan — measures bone density (diagnostic). Serum calcium, phosphorus, PTH and ALP — normal in osteoporosis (differentiates it from osteomalacia), because the bone that remains is of normal composition.\n5. Exercise; calcium and vitamin D intake; bisphosphonates (bind to bone and inhibit osteoclasts); estrogen replacement therapy (postmenopausal)."}, "Q0596": {"id": "Q0596", "stem": "Which of the following represents the soft callus stage of healing of a bone fracture?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q20", "bank": true, "expl": "The soft callus (up to week 3) consists of cartilage, non-calcified osteoid and granulation tissue. Calcified osteoid (woven bone) forms the hard callus, while haematoma and inflammatory cells belong to the first (haematoma) stage.", "type": "mcq", "opts": ["Calcified osteoid", "Haematoma collection", "Inflammatory cells", "Non-calcified osteoid"], "ans": 3}, "Q0597": {"id": "Q0597", "stem": "Which of the following defines the necrotic bone in chronic osteomyelitis?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q21", "bank": true, "expl": "The sequestrum is the dead piece of bone separated from living bone by osteoclasts. The involucrum is new periosteal bone laid around it, and the cloaca is the draining sinus through which pus escapes.", "type": "mcq", "opts": ["Involucrum", "Sequestrum", "Callus", "Cloaca"], "ans": 1}, "Q0605": {"id": "Q0605", "stem": "Case: A previously healthy 18-month-old boy presented at the emergency department with left hip pain and a limp following a minor trauma. His mother reported that he had presented fever for three days, cough and rhinitis about 15 days before the trauma, and had been treated with ibuprofen for 7 days. Examination: the child presented with a limited and painful range of motion of the left hip. Blood tests were performed and showed white blood cell (WBC): 23,000 cells/µL; neutrophils: 86%, elevated CRP and ESR. X-rays of the pelvis and left hip showed a lytic lesion of the proximal femoral metaphysis. The child was admitted. After orthopedic consultation, needle biopsy and drainage of the lesion was performed. Specimens were sent for histological and microbiological examination.\n1. What is the probable diagnosis? And predisposing factors?\n2. What is the most common route of infection?\n3. What are the possible causative organisms?\n4. Is it the typical site of infection?\n5. What are the possible complications?\n6. What are the differential diagnoses?\n7. What is the importance of needle biopsy?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W3", "bank": true, "expl": "A toddler with a lytic lesion of the femoral metaphysis two weeks after a respiratory infection has acute hematogenous osteomyelitis: bacteria, most often Staph. aureus, reach the bone through the blood from a septic focus and settle in the metaphysis, where blood flow is slow and haematoma frequent. Needle biopsy gives material for culture and rules out mimics such as Ewing's sarcoma.", "img": ["figs/GP-01.jpg", "figs/GP-01_2.jpg"], "cap": "X-ray of the pelvis and hips; needle bone biopsy (diagram)", "type": "written", "keyhtml": "1. Acute (primary) hematogenous osteomyelitis of the proximal femur. Predisposing factors: a recent septic focus (the respiratory infection 15 days earlier; typical foci are tonsillitis, otitis media and sinusitis); young age (mainly a disease of children); the minor trauma (frequent haematoma in the metaphysis).\n2. Blood stream infection (hematogenous spread).\n3. Staphylococcus aureus (most common), followed by Strept. pyogenes, Strept. pneumoniae and Gram-negative bacilli.\n4. Yes — primary hematogenous osteomyelitis most frequently involves the metaphysis of long bones: femur (23–29%), tibia (19–26%) and humerus (5–13%); the lower extremity is more commonly affected.\n5. Septic arthritis; subperiosteal abscess; deep vein thrombosis; progression to chronic osteomyelitis (also septicaemia/toxaemia and systemic pyaemia).\n6. Traumatic; rheumatologic; neoplastic diseases — tumours such as osteoid osteoma, leukaemia, Ewing's sarcoma and osteosarcoma.\n7. Culture of the specimen, and to secure the diagnosis: several conditions, especially Ewing's sarcoma, frequently mimic acute osteomyelitis, and a delay of the actual diagnosis would be detrimental."}, "Q0609": {"id": "Q0609", "stem": "Case: A 72-year-old man presented to the emergency department with a complaint of severe mid and upper back pain. He had a history of back pain, weight loss, night fever, lower limbs tingling and numbness for 3 months. On examination he had tender back, stiffness in the lumbar muscles, and paresthesia of lower limbs. CT chest showed right pleural thickening and effusion. X-rays of thoracolumbar spine showed destruction of T12 and L1. MRI of thoracolumbar spine reported destruction of T12 and L1 with large paraspinal mass with invasion of the spinal canal and compression of the spinal cord. CT-guided biopsy of the mass revealed granulomas with giant cells, histiocytes, lymphocytes and necrosis.\n1. What is your diagnosis?\n2. What is the most common route of infection?\n3. What are the most commonly affected bones in this case?\n4. What are the differential diagnoses for this case?\n5. What are the expected complications?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W4", "bank": true, "expl": "Granulomas with giant cells and necrosis destroying the T12 and L1 vertebrae identify tuberculous osteomyelitis of the spine (Pott disease), which reaches bone through the blood and mainly affects the thoracic and lumbar vertebrae. Necrosis with compressed fracture causes kyphosis, extension into soft tissue forms a 'cold' abscess, and cord compression causes paraplegia.", "img": ["figs/GP-02.jpg", "figs/GP-02_2.jpg", "figs/GP-02_3.jpg"], "cap": "Lateral X-ray and sagittal MRI of the thoracolumbar spine; CT-guided biopsy (H&E)", "type": "written", "keyhtml": "1. Pott's disease (PD), also known as tuberculosis spondylitis = tuberculous osteomyelitis of the spine.\n2. Hematogenous spread: Mycobacterium tuberculosis reaches the spine through the blood (Pott's disease is a combination of osteomyelitis and arthritis).\n3. The thoracolumbar vertebrae, usually more than one vertebra; the anterior aspect of the vertebral body.\n4. Metastatic disease (this case initially mimicked it); pyogenic spondylitis; miliary TB; other infections (actinomycosis, blastomycosis, brucellosis, candidiasis, cryptococcosis, histoplasmosis); osteoporotic spondylitis; multiple myeloma; lymphoma.\n5. Vertebral collapse and kyphosis; cold abscess formation (may track down the psoas sheath as a psoas abscess); spinal cord compression and neurologic deficits (paraplegia, quadriplegia); secondary amyloidosis."}, "Q0614": {"id": "Q0614", "stem": "Case: After an uncomplicated pregnancy, a 29-year-old woman gives birth to an infant less than the fifth percentile for height. On physical examination, the infant's head size was normal, but the forehead appears prominent. The extremities are short. The radiographs show short, slightly bowed long bones, but no osteopenia. The other two children in the family are of normal height. The affected child has no difficulty with activities of daily life, especially after modifications are made in the home and school for short stature, and later he becomes a physician.\n1. What is your diagnosis?\n2. What is the explanation of his symptoms and signs?\n3. Why are his siblings not affected?\n4. What do you expect to find in his X-ray?\n5. What is the main cell affected in this disease?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W5", "bank": true, "expl": "Short limbs with a normal-sized head are achondroplasia: an activating FGFR3 point mutation inhibits growth-plate chondrocytes, so bones formed by endochondral ossification are stunted while intramembranous bones are spared. The bone that does form is of good quality, so there is no osteopenia.", "aimg": ["figs/GP-03_ans.jpg"], "acap": "Achondroplasia features (answer slide 19)", "type": "written", "keyhtml": "1. Achondroplasia (a congenital dysplasia).\n2. Inhibition of chondrocyte proliferation, suppressing expansion of the epiphyseal growth plate: a point mutation of FGFR3 causes its constitutive activation, so long bones (bones formed by endochondral ossification) are severely stunted while intramembranous bones (cranial vault) are spared → short limbs with a normal-sized head and prominent forehead.\n3. Because it is a point mutation of FGFR3 that arose in him and was not inherited from his parents.\n4. Short, bowed long bones with no osteopenia (good bone quality).\n5. The chondrocyte (of the growth plate)."}, "Q0619": {"id": "Q0619", "stem": "Case: An 8-year-old female child who was normal at birth recently developed hearing loss and progressive bluish grey coloration of her sclera. Head CT showed maldevelopment of bones of middle ear with deficient ossification. Since then, she started using hearing aids. Five years later she suffered from multiple bony fractures with marked scoliosis of her backbone. A previous medical report from her dentist stated multiple dental abnormalities. Three years later her younger sister developed the same signs and symptoms.\n1. What is your diagnosis?\n2. What is the pathogenesis?\n3. Why did her sister develop the same disease?\n4. What are the other manifestations seen in this disease?\n5. Mention another name for this disease.", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W6", "bank": true, "expl": "Blue sclerae, hearing loss, dental abnormalities, repeated fractures and scoliosis in two sisters point to osteogenesis imperfecta, an autosomal dominant defect in type I collagen production that leaves too little bone. Dominant inheritance explains why the younger sister is affected too.", "img": ["figs/GP-04.jpg", "figs/GP-04_2.jpg"], "cap": "Clinical photographs and spine X-ray", "aimg": ["figs/GP-04_ans.jpg"], "acap": "Osteogenesis imperfecta summary (answer slide 25)", "type": "written", "keyhtml": "1. Osteogenesis imperfecta (brittle bone disease).\n2. A hereditary connective tissue disease resulting from a defect in type I collagen production, with decreased bone mass.\n3. Because it is a heritable autosomal dominant disease.\n4. Thin skin, laxity of joints, basilar skull deformities, easy bruisability (also triangular facies, macrocephaly, barrel chest, limb deformities, growth retardation).\n5. Brittle bone disease."}, "Q0629": {"id": "Q0629", "stem": "Case: An 80-year-old male patient with half-Egyptian, half-European family descent noticed pain around his knees and hips with bowing of his lower limbs and changes in his facial features, together with continuous attacks of headache. During history taking and examination, deteriorated vision and hearing were noticed with numbness in his arms. Radiology revealed diffuse fluffy cotton-wool-like lesions. His physician scheduled follow-up visits with a protocol including good diet and regular minor exercises suitable for age, with great caution to falls and traumas.\n1. What is your diagnosis? Why?\n2. What are the predisposing factors?\n3. What is the pathogenesis, and what are the phases of the disease?\n4. What is the reason for his symptoms and signs in view of your diagnosis?\n5. What are the expected complications?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W7", "bank": true, "expl": "Paget disease is increased bone destruction and remodelling in older adults, more common in people of European descent: osteoclasts act first and osteoblasts compensate, giving lytic, mixed and sclerotic phases. The disorganized new bone deforms the skeleton, and skull overgrowth compresses nerves, explaining the bowing, facial change, headache and failing vision and hearing.", "aimg": ["figs/GP-06_ans.jpg", "figs/GP-06_ans2.jpg", "figs/GP-06_ans3.jpg", "figs/GP-06_ans4.jpg", "figs/GP-06_ans5.jpg"], "acap": "Paget disease: pathophysiology and sites; X-rays of shoulder, skull and femur; bone-remodelling cycle; histology with osteoclasts (OCL); complications (answer slides 37–39)", "type": "written", "keyhtml": "1. Paget disease of bone (osteitis deformans): an elderly man of European descent with bone pain, bowed lower limbs, changed facial features, headache and failing vision and hearing, with diffuse fluffy cotton-wool lesions on X-ray.\n2. Old age; European descent.\n3. Increased osteoclastic activity → accelerated bone remodelling → osteoblast activity increases to compensate. Phases: lytic phase (osteoclast activity); mixed phase (resorption and compensation); sclerotic phase (osteoblastic predominance). Histology: woven bone with disorganized cement lines in a mosaic pattern; osteoclasts with multiple nuclei per cell.\n4. Continuous, irregular, disorganized bone resorption and deposition → bone disfigurement (bowing of long bones, facial changes) with compression effects (arthritis, headache, nerve affection — vision, hearing, numbness).\n5. Increased risk of bone fractures; Paget sarcoma; skull overgrowth → cranial nerve impingement (optic, auditory nerves); high-output heart failure."}, "Q0680": {"id": "Q0680", "stem": "A 17-year-old male presented with severe pain in his left knee joint. He had high-grade fever and increased ESR. X-ray revealed a well-defined cystic lesion containing a piece of necrotic bone. His doctor prescribed a strong course of antibiotics and recommended surgical removal of the necrotic bone. What is the term for the necrotic bone in this case?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q15", "bank": true, "expl": "A dead piece of bone separated from living bone in osteomyelitis is a sequestrum, and incomplete surgical debridement of necrotic bone is a cause of chronic infection. The involucrum is the new bone laid down by the periosteum around it, and the cloaca is the draining sinus through which pus escapes.", "type": "mcq", "opts": ["Sinus", "Cloaca", "Involucrum", "Sequestrum", "Granuloma"], "ans": 3}, "Q0681": {"id": "Q0681", "stem": "Postmenopausal women are liable to which of the following metabolic bone disorders secondary to lack of oestrogen production?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Oestrogen favours bone formation, so oestrogen deficiency at menopause is a major risk factor for osteoporosis, which is treated with oestrogen replacement in postmenopausal women. Osteomalacia results from deficient vitamin D, phosphate or calcium, and osteopetrosis is inherited.", "type": "mcq", "opts": ["Osteopetrosis", "Osteomalacia", "Paget disease of bone", "Osteoporosis"], "ans": 3}, "Q0685": {"id": "Q0685", "stem": "Osteogenesis imperfecta results from:", "top": false, "rep": "asked 3 years", "tag": "Extra practice", "bank": false, "expl": "Osteogenesis imperfecta is an autosomal dominant defect in type I collagen production with decreased bone mass. Vitamin D deficiency causes rickets and osteomalacia, and an accelerated rate of bone remodelling is the pathophysiology of Paget disease.", "type": "mcq", "opts": ["Decreased peak bone mass with ageing", "Defect in type I collagen protein", "Vitamin D deficiency", "Accelerated rate of bone remodelling"], "ans": 1}, "Q0722": {"id": "Q0722", "stem": "All of the following conditions may complicate Pott's disease EXCEPT:", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q22", "bank": true, "expl": "Pott disease is complicated by kyphosis (compressed vertebral fracture), cold abscess and spinal cord compression with paraplegia; the amyloidosis it causes is secondary, not primary.", "type": "mcq", "opts": ["Paraplegia", "Primary amyloidosis", "Cold abscess", "Kyphosis"], "ans": 1}, "Q0723": {"id": "Q0723", "stem": "Which of the following etiologic factors is responsible for osteogenesis imperfecta?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q23", "bank": true, "expl": "Osteogenesis imperfecta is autosomal dominant and results from defective type I collagen production, giving decreased bone mass. Vitamin D deficiency causes rickets and osteomalacia, and a lost balance between osteoclast and osteoblast underlies acquired disorders such as osteoporosis.", "type": "mcq", "opts": ["AR disorder of type IV collagen", "Vitamin D deficiency", "AD disorder of type I collagen", "Abnormal balance between osteoclast and osteoblast"], "ans": 2}, "Q0724": {"id": "Q0724", "stem": "Which of the following developmental disorders is caused by suppression of expansion of the epiphyseal growth plate?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q24", "bank": true, "expl": "In achondroplasia an activating FGFR3 point mutation inhibits chondrocyte proliferation and suppresses growth-plate expansion, severely stunting long-bone growth. Osteopetrosis is a failure of osteoclast resorption, and osteogenesis imperfecta a type I collagen defect.", "type": "mcq", "opts": ["Achondroplasia", "Osteopetrosis", "Osteoporosis", "Osteogenesis imperfecta"], "ans": 0}, "Q0725": {"id": "Q0725", "stem": "On biopsy, a mosaic pattern of lamellar bone is revealed. What disease is associated with these results?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT Q7", "bank": true, "expl": "Paget disease histology shows woven bone and irregular broad trabeculae with disorganised cement lines in a mosaic pattern, beside numerous large multinucleated osteoclasts. Osteopetrosis gives uniformly dense bone from reduced osteoclast resorption, and in osteoporosis the trabeculae are thin but of normal composition.", "type": "mcq", "opts": ["Sickle cell disease", "Osteopetrosis", "Osteoporosis", "Paget's disease of bone"], "ans": 3}, "Q0726": {"id": "Q0726", "stem": "Which of the following does NOT affect bone healing?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT Q8", "bank": true, "expl": "Nutrition and systemic diseases are systemic factors, and underlying bone pathology (tumours, osteoporosis) is a local factor that affects bone healing; arthroscopy is not among the factors.", "type": "mcq", "opts": ["Nutrition", "Underlying bone pathology", "Arthroscopy", "Systemic diseases"], "ans": 2}, "N-PAT-L1-2-01": {"id": "N-PAT-L1-2-01", "stem": "A 2-year-old child has a history of multiple bone fractures with minor trauma. On examination he has hepatosplenomegaly and palsies involving cranial nerves II, VII, and VIII. Laboratory studies show pancytopenia. Radiographs reveal diffusely and symmetrically sclerotic bones with poorly formed metaphyses. Molecular analysis of his bone reveals a defect in production of carbonic anhydrase to solubilize hydroxyapatite crystal. He is treated with bone marrow stem cell transplantation. Which of the following cells in his bones was most likely functionally deficient and replaced following transplantation?", "top": true, "rep": "", "tag": "Final bank PAT Q16", "bank": true, "expl": "Diffusely sclerotic yet fracture-prone bones with marrow failure (pancytopenia, hepatosplenomegaly) and cranial nerve palsies (blindness, facial palsy, deafness) are osteopetrosis, caused by reduced osteoclast-mediated bone resorption. The osteoclast is marrow-derived, which is why osteopetrosis was the first genetic disease treated with bone marrow transplantation; the osteoblast is not the defective cell.", "type": "mcq", "opts": ["Chondroblast", "Chondrocyte", "Osteoblast", "Osteoclast", "Osteocyte"], "ans": 3}, "N-PAT-L1-2-02": {"id": "N-PAT-L1-2-02", "stem": "A 15-year-old boy was treated 2 years ago with a short course of oral antibiotics for acute osteomyelitis of the tibia. He now has recurrent flare-ups of pain over the upper tibia. X-ray shows a circumscribed cavity in the metaphysis surrounded by sclerotic bone, and at surgery the cavity is filled with pus. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Inadequate antibiotics are a cause of the 15–30% of acute cases that become chronic suppurative osteomyelitis, which forms a Brodie's abscess: a pus-filled metaphyseal cavity surrounded by sclerotic bone in children and young adults, with acute flare-ups. A cold abscess is the soft-tissue extension of tuberculous osteomyelitis of the vertebrae.", "type": "mcq", "opts": ["Brodie's abscess", "Cold abscess of tuberculous osteomyelitis", "Subperiosteal abscess of acute osteomyelitis", "Brown tumour of hyperparathyroidism", "Paget sarcoma"], "ans": 0}, "N-PAT-L1-2-03": {"id": "N-PAT-L1-2-03", "stem": "A 45-year-old woman with a parathyroid adenoma complains of bone pain. Hand X-rays show subperiosteal bone resorption of the phalanges with cystic lesions. How does the raised parathyroid hormone (PTH) cause her bone resorption?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Raised PTH acts on the osteoblast first, stimulating RANK-L, which activates the osteoclast and drives bone resorption. The result is osteitis fibrosa cystica: subperiosteal resorption with thinned cortices, haemorrhage, cysts and brown tumours.", "type": "mcq", "opts": ["PTH stimulates osteoblast RANK-L, which activates the osteoclast", "PTH acts directly on the osteoclast without involving the osteoblast", "PTH inhibits the osteoblast, so new matrix is not mineralised", "PTH reduces osteoclast-mediated resorption, so bone becomes dense", "PTH inhibits chondrocyte proliferation at the growth plate"], "ans": 0}, "N-PAT-L1-2-04": {"id": "N-PAT-L1-2-04", "stem": "An 82-year-old man has had progressively worsening lower back, bilateral hip, and right shoulder pain for the past 6 years. He reports that he has had to buy larger hats. Radiographs show narrowing of joint spaces with adjacent bony sclerosis. A skull radiograph shows thickening but diminished density of the skull bones. A bone biopsy specimen at the iliac crest shows a loss of normal trabeculae, with a mosaic pattern and increased numbers of osteoclasts and osteoblasts. Which of the following complications is the patient most likely to experience as a result of this condition?", "top": true, "rep": "", "tag": "Final bank PAT Q17", "bank": true, "expl": "Years of bone and joint pain, an enlarging skull (larger hats) and a biopsy with a mosaic pattern and increased osteoclasts and osteoblasts in an elderly man are Paget disease of bone, which carries an increased risk of Paget sarcoma (osteosarcoma, fibrosarcoma). Its other listed complications are fractures, cranial nerve impingement from skull overgrowth and high-output heart failure.", "type": "mcq", "opts": ["Ankylosing spondylitis", "Enchondromatosis", "Fibrous dysplasia", "Osteoid osteoma", "Osteosarcoma"], "ans": 4}, "N-PAT-L1-2-05": {"id": "N-PAT-L1-2-05", "stem": "Bone biopsies from a 70-year-old man with Paget disease of the tibia show different phases of the disease. Which feature characterises the sclerotic phase?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Paget disease passes through a lytic phase (intense osteoclastic resorption), a mixed phase (resorption with compensatory bone formation) and a sclerotic phase (osteoblastic bone formation predominates); all three may co-exist in the same bone. Reduced osteoclast-mediated resorption is the defect of osteopetrosis.", "type": "mcq", "opts": ["Intense osteoclastic resorption", "Resorption with compensatory bone formation", "Predominant osteoblastic bone formation", "Faulty mineralisation of a normal matrix", "Reduced osteoclast-mediated resorption"], "ans": 2}, "N-PAT-L1-2-06": {"id": "N-PAT-L1-2-06", "stem": "A 25-year-old man's tibial shaft fracture is immobilised and heals without complication. By about week 6, a hard callus of woven bone has formed, made up of external, intermediate and internal callus. What happens to these calluses during remodelling (up to week 9)?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Remodelling lamellates the bone, and osteoclasts remove the external and internal callus; only the intermediate callus remains, becoming the bone cortex. Removal is the job of osteoclasts, whereas osteoblasts lay down osteoid.", "type": "mcq", "opts": ["Intermediate callus remains as the cortex; external and internal calluses are removed by osteoclasts", "External callus remains as the cortex; intermediate and internal calluses are removed by osteoclasts", "Internal callus remains as the cortex; external and intermediate calluses are removed by osteoblasts", "All three calluses remain and are lamellated to form a thickened cortex", "All three calluses are removed by osteoclasts and replaced by soft callus"], "ans": 0}, "N-PAT-L1-2-07": {"id": "N-PAT-L1-2-07", "stem": "A 7-year-old boy develops sudden high fever with chills and intense throbbing pain, swelling and redness over the lower end of his femur, two weeks after an attack of otitis media. Which investigation findings are expected?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A septic focus (otitis media), a child, the lower femoral metaphysis and an acute febrile, painful onset indicate acute haematogenous osteomyelitis; X-ray shows a destructive lytic focus surrounded by oedema and a sclerotic rim, and blood cultures are positive in 70%. Looser zones with metaphyseal cupping and fraying are the X-ray picture of rickets.", "type": "mcq", "opts": ["X-ray: destructive lytic focus with oedema and a sclerotic rim; blood cultures positive in about 70%", "X-ray: uniformly increased bone density; blood cultures negative", "X-ray: Looser zones with metaphyseal cupping and fraying; raised alkaline phosphatase", "X-ray: subperiosteal resorption of the phalanges with cysts; raised PTH", "DEXA: low bone density; normal serum calcium, phosphate and PTH"], "ans": 0}, "N-PAT-L1-2-08": {"id": "N-PAT-L1-2-08", "stem": "Describe the pathogenesis of acute haematogenous osteomyelitis, and define sequestrum, involucrum and cloaca.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Sequestrum is Separated and dead, Involucrum Invests it with new bone, and Cloaca is the Channel for pus.", "type": "written", "keyhtml": "• Organism: Staph. aureus (most common). Source: a septic focus (tonsillitis, otitis media, sinusitis). Mode: haematogenous spread. Patient: mainly children.\n• Site: the metaphysis of a long bone — frequent haematoma and slow blood flow.\n• Bacteria proliferate in the bone → inflammation and necrosis.\n• Spread along the Haversian system or the medullary cavity within the shaft, and to the periosteum.\n• Subperiosteal abscesses impair the blood supply → more necrosis, often with draining sinuses.\n• Sequestrum: a dead piece of bone separated from living bone by osteoclasts; it may pass through the sinus tract.\n• Involucrum: new bone created by the periosteum and deposited around the sequestrum.\n• Cloaca: the draining sinus through which pus escapes."}, "N-PAT-L1-2-09": {"id": "N-PAT-L1-2-09", "stem": "Compare osteogenesis imperfecta, achondroplasia and osteopetrosis regarding the genetic defect, the basic bone abnormality and the main clinical features.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "All three are congenital dysplasias: too little bone in osteogenesis imperfecta, a suppressed growth plate in achondroplasia, and too much but brittle bone in osteopetrosis.", "type": "written", "keyhtml": "Feature | Osteogenesis imperfecta | Achondroplasia | Osteopetrosis\nOther name | Brittle bone disease | — | Stone bone / marble bone disease\nGenetic defect | Autosomal dominant; defect in type I collagen production | Point mutation in FGFR3 → constitutive activation | AR or AD; a group of genetic disorders\nBasic abnormality | Decreased bone mass (too little bone) | Chondrocyte proliferation inhibited → growth-plate expansion suppressed → stunted long bones | Reduced osteoclast-mediated resorption → dense but brittle bone (too much bone)\nClinical features | Blue sclerae, triangular facies, macrocephaly, hearing loss, defective dentition, barrel chest, scoliosis, limb deformities, fractures, joint laxity, growth retardation, constipation &amp; sweating | Short proximal limbs, normal trunk length, large head; endochondral bones stunted, intramembranous bones spared | Deformity, fractures, bone ache; anaemia, recurrent infections, hepatosplenomegaly; blindness, facial &amp; cranial nerve palsies, hearing impairment\nLandmark | Blue sclerae = bedside clue | Activation (not loss) of FGFR3 | X-ray: uniformly ↑ density, loss of corticomedullary distinction; first genetic disease treated by bone marrow transplantation"}, "N-PAT-L1-2-10": {"id": "N-PAT-L1-2-10", "stem": "Enumerate the local and systemic factors that affect healing of a bone fracture.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The same factors cause delayed union and non-union of a fracture.", "type": "written", "keyhtml": "• Local: immobilisation (emphasised in the lecture); improper reduction (abnormal position); infection; debris or dead tissue in the wound; joint involvement; damage to nerves or blood vessels; bone pathology (tumours, osteoporosis).\n• Systemic: age; nutrition (vitamin or mineral deficiency); immune status; systemic diseases (chronic disease, diabetes); drugs (steroids); genetic disorders (haemophilia)."}, "TP-038": {"id": "TP-038", "stem": "A 9-year-old boy complains of 2 weeks of pain in the hip. His temperature is 38°C (101°F). An X-ray reveals a radiolucent defect in the upper femur, with abundant periosteal new bone formation. Fine-needle aspiration returns numerous neutrophils and cocci, and Staphylococcus aureus is cultured from the bone lesion. A biopsy shows a fragment of necrotic bone. Which of the following terms best describes the necrotic bone?", "top": true, "rep": "", "tag": "Final bank PAT Q76", "bank": true, "expl": "In osteomyelitis, a dead piece of bone separated from living bone by osteoclasts is a sequestrum. The involucrum is the new bone laid down by the periosteum around it (the periosteal new bone here), and the cloaca is the draining sinus through which pus escapes.", "type": "mcq", "opts": ["Brodie abscess", "Cloaca", "Involucrum", "Osteophyte", "Sequestrum"], "ans": 4}, "TP-039": {"id": "TP-039", "stem": "A 67-year-old man from England has developed bow legs and leg pain over 5 years, together with a change in his facial features. He also complains of progressive hearing loss over the last 2 years. A bone biopsy shows a mosaic pattern with prominent cement lines and increased osteoblastic and osteoclastic activity. This patient is at increased risk of developing which of the following diseases?", "top": true, "rep": "", "tag": "Final bank PAT Q77", "bank": true, "expl": "An elderly man of European descent with bowed legs, changed facial features (leontiasis), hearing loss and a mosaic pattern of cement lines with active osteoclasts and osteoblasts has Paget disease of bone. It increases the risk of fractures, Paget sarcoma (osteosarcoma, fibrosarcoma), cranial nerve impingement (optic, auditory) and high-output heart failure.", "type": "mcq", "opts": ["Amyloidosis", "Multiple myeloma", "Paget sarcoma", "Pulmonary embolism", "Renal failure"], "ans": 2}, "TP-070": {"id": "TP-070", "stem": "A 72-year-old woman develops vertebral compression fractures. Her bone mineral density is significantly reduced, but her serum calcium and phosphate levels are normal. Which diagnosis is most likely?", "top": true, "rep": "", "tag": "Final bank PAT Q78", "bank": true, "expl": "Osteoporosis is low bone density with increased fragility; the vertebrae, wrist and hips are the commonest fracture sites, and serum Ca, PO₄ and PTH are normal because the remaining bone is of normal composition. Rickets/osteomalacia show ↓ Ca, ↓ PO₄ and ↑ PTH, and hyperparathyroidism shows ↑ PTH.", "type": "mcq", "opts": ["Osteoporosis", "Rickets", "Osteomalacia", "Hyperparathyroidism", "Paget disease"], "ans": 0}, "TP-079": {"id": "
