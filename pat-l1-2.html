TP-079", "stem": "What is the primary initial cellular abnormality in Paget disease of bone?", "top": true, "rep": "", "tag": "Final bank PAT Q80", "bank": true, "expl": "In Paget disease increased osteoclastic activity comes first and accelerates bone remodelling, and osteoblast activity then increases to compensate (lytic → mixed → sclerotic phases). Osteoblastic bone formation predominates only in the later sclerotic phase, and faulty mineralization is rickets/osteomalacia.", "type": "mcq", "opts": ["Overactive osteoblasts producing excess osteoid", "Excessive and disordered bone resorption by osteoclasts", "Decreased mineralization of the bone matrix", "Autoimmune destruction of the synovial membrane", "Malignant transformation of mesenchymal stem cells"], "ans": 1}}, "labs": {}, "cards": [{"id": "PAT-L1-2-001", "text": "Fracture healing — the four stages in order: {{c1::haematoma}} → {{c2::soft callus}} → {{c3::hard callus}} → {{c4::remodelling}}", "extra": "Timing 1 – 3 – 6 – 9: day 1, week 3, week 6, week 9.", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-002", "text": "Fracture healing timing: haematoma on day {{c1::1}} · soft callus up to week {{c2::3}} · hard callus up to week {{c3::6}} · remodelling up to week {{c4::9}}", "extra": "Mnemonic 1 – 3 – 6 – 9.", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-003", "text": "After the fracture haematoma forms (day 1), an acute inflammatory reaction follows from {{c1::day 3 to 1 week}}", "extra": "", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-004", "text": "Soft callus (up to week 3) = {{c1::cartilage}} + {{c2::non-calcified osteoid}} + {{c3::granulation tissue}}", "extra": "Calcified osteoid belongs to the hard callus; haematoma and inflammatory cells to stage 1.", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-005", "text": "Hard callus (up to week 6) = {{c1::calcified}} osteoid = {{c2::woven}} bone", "extra": "It has external, intermediate and internal parts.", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-006", "text": "Remodelling of the hard callus: the {{c1::intermediate}} callus remains and becomes the {{c2::bone cortex}}; the external and internal callus are removed by {{c3::osteoclasts}}", "extra": "Remodelling (up to week 9) also lamellates the bone. Trap: only the intermediate callus survives.", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-007", "text": "Cells of fracture healing: {{c1::osteoclasts}} clear the haematoma and necrotic debris (they resorb bone); {{c2::osteoblasts}} lay down new osteoid", "extra": "More osteoclasts at a 1-week-old fracture → their job is to resorb bone.", "sec": "Part 01 · 1.1 The four stages of fracture healing"}, {"id": "PAT-L1-2-008", "text": "Local factors affecting bone healing: {{c1::immobilization}} · {{c2::improper reduction}} (abnormal position) · {{c3::infection}} / debris or dead tissue in the wound · {{c4::joint involvement}} · {{c5::damage to nerves or blood vessels}} · {{c6::bone pathology (tumours, osteoporosis)}}", "extra": "Immobilization is the starred (most emphasised) local factor.", "sec": "Part 01 · 1.2 Factors affecting bone healing"}, {"id": "PAT-L1-2-009", "text": "Systemic factors affecting bone healing: {{c1::age}} · {{c2::nutrition}} (vitamin / mineral deficiency) · {{c3::immune status}} · {{c4::systemic diseases}} (chronic disease, diabetes) · {{c5::drugs}} (steroids) · {{c6::genetic disorders}} (haemophilia)", "extra": "Arthroscopy is NOT a factor affecting bone healing (Formative 2 trap).", "sec": "Part 01 · 1.2 Factors affecting bone healing"}, {"id": "PAT-L1-2-010", "text": "Complications of fracture healing: {{c1::malunion}} · {{c2::non-union}} · {{c3::delayed union}} · {{c4::infection (osteomyelitis)}} · {{c5::avascular necrosis}}", "extra": "Avascular necrosis = loss of blood supply to the fragment.", "sec": "Part 01 · 1.3 Complications of fracture healing"}, {"id": "PAT-L1-2-011", "text": "<b>Malunion vs non-union<\/b><br>Malunion = healed bone in {{c1::wrong alignment}}<br>Non-union = {{c2::wide space}} between the fracture ends, or {{c3::soft tissue interposition}}", "extra": "Malunion is united but angulated; non-union leaves a persisting gap.", "sec": "Part 01 · 1.3 Complications of fracture healing"}, {"id": "PAT-L1-2-012", "text": "Delayed union (healing takes longer than expected) and non-union are caused by the same {{c1::factors that affect bone healing}} — infection, tumour, foreign body, poor immobilization", "extra": "", "sec": "Part 01 · 1.3 Complications of fracture healing"}, {"id": "PAT-L1-2-013", "text": "Osteomyelitis = inflammation of bone and {{c1::marrow}} and the surrounding soft tissue", "extra": "Osteo = bone, myelo = marrow; called acute, subacute or chronic according to the clinical duration.", "sec": "Part 02 · Osteomyelitis — definition"}, {"id": "PAT-L1-2-014", "text": "<b>Classification of osteomyelitis<\/b><br>Acute: hematogenous and {{c1::non-hematogenous}}<br>Chronic: {{c2::suppurative}} · {{c3::tuberculous}} · {{c4::syphilitic}}", "extra": "The two examinable forms are pyogenic and tuberculous.", "sec": "Part 02 · 2.1 Classification"}, {"id": "PAT-L1-2-015", "text": "Most common organism of acute hematogenous osteomyelitis: {{c1::Staphylococcus aureus}}", "extra": "", "sec": "Part 02 · 2.2 Predisposing factors of acute osteomyelitis"}, {"id": "PAT-L1-2-016", "text": "After Staph. aureus, other organisms of acute hematogenous osteomyelitis: {{c1::Strept. pyogenes}} · {{c2::Strept. pneumoniae}} · {{c3::Gram-negative bacilli}}", "extra": "Official GD 1 Case 1 answer; the pamphlet names only Staph. aureus.", "sec": "Part 02 · 2.2 Predisposing factors of acute osteomyelitis"}, {"id": "PAT-L1-2-017", "text": "Source of acute hematogenous osteomyelitis: a {{c1::septic focus}} — tonsillitis, otitis media, sinusitis", "extra": "", "sec": "Part 02 · 2.2 Predisposing factors of acute osteomyelitis"}, {"id": "PAT-L1-2-018", "text": "Usual route of acute osteomyelitis: {{c1::hematogenous}} spread — bacteria from a septic focus reach the bloodstream and seed the bone", "extra": "", "sec": "Part 02 · 2.2 Predisposing factors of acute osteomyelitis"}, {"id": "PAT-L1-2-019", "text": "Acute hematogenous osteomyelitis is mainly a disease of {{c1::children}}", "extra": "Trap: not old age.", "sec": "Part 02 · 2.2 Predisposing factors of acute osteomyelitis"}, {"id": "PAT-L1-2-020", "text": "Acute hematogenous osteomyelitis usually starts in the {{c1::metaphysis}} of a long bone", "extra": "Trap: not the epiphysis or the diaphysis.", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-021", "text": "The metaphysis is the usual site of acute osteomyelitis because of {{c1::slow blood flow}} and frequent {{c2::haematoma}} there", "extra": "", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-022", "text": "In acute osteomyelitis, bacteria proliferate (inflammation + necrosis) and spread along the {{c1::Haversian system}} or the {{c2::medullary cavity}} within the shaft, and to the {{c3::periosteum}}", "extra": "", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-023", "text": "In acute osteomyelitis, {{c1::subperiosteal abscesses}} impair the blood supply → more necrosis and often draining sinuses", "extra": "", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-024", "text": "<b>Osteomyelitis terms<\/b><br>{{c1::Sequestrum}} = dead piece of bone separated from living bone<br>{{c2::Involucrum}} = new periosteal bone deposited around it<br>{{c3::Cloaca}} = draining sinus through which pus escapes", "extra": "Sequestrum is Separated and dead · Involucrum Invests it with new bone · Cloaca is the Channel.", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-025", "text": "The sequestrum is separated from living bone by {{c1::osteoclasts}}; the involucrum is new bone laid down by the {{c2::periosteum}}", "extra": "The sequestrum may pass out through the sinus tract.", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-026", "text": "Open fracture left untreated, with a draining sinus months later → X-ray shows {{c1::sequestrum and involucrum}} (chronic osteomyelitis)", "extra": "Early acute osteomyelitis X-ray = lytic focus with a sclerotic rim.", "sec": "Part 02 · 2.3 Pathogenesis of acute osteomyelitis"}, {"id": "PAT-L1-2-027", "text": "Acute hematogenous osteomyelitis in children — commonest bones: {{c1::femur}} > {{c2::tibia}} > {{c3::humerus}}, at areas of {{c4::rapid growth}} or increased trauma risk", "extra": "Also the distal radius. GD: femur 23–29%, tibia 19–26%, humerus 5–13%; lower limb commoner.", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-028", "text": "Acute osteomyelitis presents with sudden-onset {{c1::high fever}} and chills, and intense {{c2::throbbing pain}} over the affected bone", "extra": "Also local oedema, tenderness, erythema and restricted movement; night sweats, malaise, weight loss.", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-029", "text": "Acute osteomyelitis X-ray: a destructive {{c1::lytic}} focus surrounded by oedema and a {{c2::sclerotic rim}}", "extra": "", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-030", "text": "Blood cultures in acute osteomyelitis are positive in {{c1::70%}} of cases", "extra": "Diagnosis: signs & symptoms, X-ray, blood cultures, biopsy.", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-031", "text": "Complications of acute hematogenous osteomyelitis: {{c1::septicaemia and toxaemia}} · {{c2::systemic pyaemia}} · {{c3::chronic suppurative osteomyelitis}} · {{c4::chronic suppurative arthritis}} · {{c5::direct spread to nearby tissues}}", "extra": "GD 1 Case 1 also lists subperiosteal abscess and deep vein thrombosis.", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-032", "text": "Needle biopsy in suspected acute osteomyelitis gives material for {{c1::culture}} and secures the diagnosis, because mimics — especially {{c2::Ewing's sarcoma}} — must not be missed", "extra": "Official GD 1 Case 1 answer.", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-033", "text": "Neoplastic differential diagnoses of acute osteomyelitis: {{c1::osteoid osteoma}} · {{c2::leukaemia}} · {{c3::Ewing's sarcoma}} · {{c4::osteosarcoma}}", "extra": "Official GD 1 Case 1 answer; the other DD groups are traumatic and rheumatologic.", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-034", "text": "Toddler with fever and a limp 2 weeks after a respiratory infection; lytic lesion of the proximal femoral metaphysis → {{c1::acute hematogenous osteomyelitis}}", "extra": "Predisposing: recent septic focus, young age, minor trauma (GD 1 Case 1).", "sec": "Part 02 · 2.4 Sites, clinical picture & diagnosis"}, {"id": "PAT-L1-2-035", "text": "{{c1::15–30%}} of acute osteomyelitis cases become chronic suppurative osteomyelitis", "extra": "", "sec": "Part 02 · 2.5 Chronic suppurative osteomyelitis"}, {"id": "PAT-L1-2-036", "text": "Why acute osteomyelitis becomes chronic: {{c1::delayed treatment}} · {{c2::inadequate antibiotics}} · {{c3::incomplete surgical debridement}} of necrotic bone · {{c4::weak immunity}}", "extra": "", "sec": "Part 02 · 2.5 Chronic suppurative osteomyelitis"}, {"id": "PAT-L1-2-037", "text": "Chronic suppurative osteomyelitis forms a {{c1::Brodie's abscess}}: a circumscribed cavity filled with pus, surrounded by {{c2::sclerotic bone}}", "extra": "", "sec": "Part 02 · 2.5 Chronic suppurative osteomyelitis"}, {"id": "PAT-L1-2-038", "text": "Brodie's abscess affects the {{c1::metaphysis}} of long bones in children and young adults; clinically it gives acute {{c2::flare-ups}}", "extra": "", "sec": "Part 02 · 2.5 Chronic suppurative osteomyelitis"}, {"id": "PAT-L1-2-039", "text": "Complications of chronic suppurative osteomyelitis: {{c1::pathological fracture}} · {{c2::secondary amyloidosis}}", "extra": "Secondary amyloidosis also complicates tuberculous osteomyelitis.", "sec": "Part 02 · 2.5 Chronic suppurative osteomyelitis"}, {"id": "PAT-L1-2-040", "text": "Tuberculous osteomyelitis reaches bone by {{c1::hematogenous}} spread (rarely direct extension or lymphatic spread)", "extra": "Seeds from a healed primary lung focus; reactivation → caseating granulomas eroding bone.", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-041", "text": "Tuberculous osteomyelitis mainly affects the {{c1::thoracic and lumbar vertebrae}} = {{c2::Pott}} disease", "extra": "", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-042", "text": "Pott disease (= tuberculosis {{c1::spondylitis}}) usually involves more than one vertebra, at the {{c2::anterior}} aspect of the vertebral body", "extra": "Official GD 1 Case 2 answer; Pott disease combines osteomyelitis and arthritis.", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-043", "text": "Complications of Pott disease: {{c1::kyphosis}} (necrosis + compressed fracture) · {{c2::cold abscess}} (soft-tissue extension) · {{c3::paraplegia / quadriplegia}} (cord compression) · {{c4::secondary amyloidosis}}", "extra": "Trap: secondary, not primary, amyloidosis.", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-044", "text": "A tuberculous abscess is called \"cold\" because it lacks the {{c1::heat and redness}} of an acute pyogenic abscess", "extra": "", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-045", "text": "Liquefied caseous material from spinal TB may track down the {{c1::psoas}} sheath and appear in the groin or thigh", "extra": "This is the psoas abscess.", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-046", "text": "Destructive thoracolumbar lesion (e.g. T12–L1); biopsy: {{c1::granulomas}} with giant cells, histiocytes, lymphocytes and necrosis → {{c2::Pott disease}}", "extra": "GD 1 Case 2: back pain, night fever, weight loss, paraspinal mass compressing the cord.", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-047", "text": "Differential diagnoses of Pott disease: {{c1::metastatic disease}} · {{c2::pyogenic spondylitis}} · {{c3::multiple myeloma}} · {{c4::lymphoma}} · miliary TB · osteoporotic spondylitis · other infections (e.g. brucellosis)", "extra": "Official GD 1 Case 2 answer; the case first mimicked metastatic disease.", "sec": "Part 02 · 2.6 Tuberculous osteomyelitis"}, {"id": "PAT-L1-2-048", "text": "<b>Congenital osteodystrophy<\/b><br>{{c1::Dysostosis}} = developmental anomaly<br>{{c2::Dysplasia}} = abnormal formation", "extra": "Bone dystrophy = disturbed bone growth, structure or development; congenital or acquired (environmental).", "sec": "Part 03 · 3.1 Congenital osteodystrophy"}, {"id": "PAT-L1-2-049", "text": "Dysostoses come from localized problems in the {{c1::migration of mesenchymal cells}} (and formation of condensations); dysplasias are {{c2::mutations}} that interfere with bone or cartilage formation, growth or matrix maintenance", "extra": "", "sec": "Part 03 · 3.1 Congenital osteodystrophy"}, {"id": "PAT-L1-2-050", "text": "Dysostoses: {{c1::aplasia}} · {{c2::extra bones}} (e.g. polydactyly) · {{c3::abnormal fusion}} of bones (e.g. syndactyly)", "extra": "", "sec": "Part 03 · 3.1 Congenital osteodystrophy"}, {"id": "PAT-L1-2-051", "text": "Congenital dysplasias: {{c1::osteogenesis imperfecta}} · {{c2::achondroplasia}} · {{c3::osteopetrosis}}", "extra": "", "sec": "Part 03 · 3.1 Congenital osteodystrophy"}, {"id": "PAT-L1-2-052", "text": "Osteogenesis imperfecta is also called {{c1::brittle bone}} disease", "extra": "", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-053", "text": "Osteogenesis imperfecta: {{c1::autosomal dominant::inheritance}} defect in {{c2::type I}} collagen production (by osteoblasts) → {{c3::decreased}} bone mass", "extra": "Dominant inheritance explains affected siblings; \"by osteoblasts\" is from the official quiz key.", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-054", "text": "The classic bedside clue of osteogenesis imperfecta: {{c1::blue sclerae}}", "extra": "", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-055", "text": "Osteogenesis imperfecta — head features: blue sclerae · {{c1::triangular facies}} · {{c2::macrocephaly}} · {{c3::hearing loss}} · {{c4::defective dentition}}", "extra": "", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-056", "text": "Osteogenesis imperfecta — body features: {{c1::barrel chest}} · {{c2::scoliosis}} · limb deformities · fractures · {{c3::joint laxity}} · growth retardation · constipation and sweating", "extra": "", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-057", "text": "Other features of osteogenesis imperfecta: {{c1::thin skin}} · {{c2::easy bruisability}} · {{c3::basilar skull deformities}} · joint laxity", "extra": "Official GD 1 Case 4 answer; not in the pamphlet.", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-058", "text": "Child with multiple fractures (suspected abuse) + blue sclerae + hearing loss → {{c1::osteogenesis imperfecta}}", "extra": "", "sec": "Part 03 · 3.2 Osteogenesis imperfecta"}, {"id": "PAT-L1-2-059", "text": "Achondroplasia: point mutation in {{c1::FGFR3}} causing its constitutive {{c2::activation}}", "extra": "FGFR3 = fibroblast growth factor receptor 3. Trap: activation, not loss of function.", "sec": "Part 03 · 3.3 Achondroplasia"}, {"id": "PAT-L1-2-060", "text": "In achondroplasia, activated FGFR3 inhibits proliferation of {{c1::chondrocytes}} → suppressed expansion of the {{c2::epiphyseal growth plate}} → severely stunted long bones", "extra": "The chondrocyte is the main cell affected (GD 1 Case 3).", "sec": "Part 03 · 3.3 Achondroplasia"}, {"id": "PAT-L1-2-061", "text": "Achondroplasia stunts only bones formed by {{c1::endochondral}} ossification; bones formed by {{c2::intramembranous}} ossification are spared", "extra": "Spared: cranial vault, maxilla / mandible, clavicle → short limbs with a relatively large head.", "sec": "Part 03 · 3.3 Achondroplasia"}, {"id": "PAT-L1-2-062", "text": "Achondroplasia appearance: short {{c1::proximal}} limbs, normal trunk length and a relatively {{c2::large head}}", "extra": "", "sec": "Part 03 · 3.3 Achondroplasia"}, {"id": "PAT-L1-2-063", "text": "Achondroplasia X-ray: short, slightly bowed long bones with {{c1::no osteopenia}} (good bone quality)", "extra": "Official GD 1 Case 3 answer.", "sec": "Part 03 · 3.3 Achondroplasia"}, {"id": "PAT-L1-2-064", "text": "Achondroplasia: why are the affected child's siblings of normal height? — {{c1::The FGFR3 point mutation arose in the child — it was not inherited from the parents}}", "extra": "Official GD 1 Case 3 answer.", "sec": "Part 03 · 3.3 Achondroplasia"}, {"id": "PAT-L1-2-065", "text": "Osteopetrosis ({{c2::AR or AD::inheritance}}): reduced {{c1::osteoclast}}-mediated bone resorption → defective bone remodelling", "extra": "\"Stone bone\" / marble bone disease — petros = stone: the osteoclast cannot chew.", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-066", "text": "Despite the excess bone, osteopetrotic bones are more {{c1::brittle}} than normal → fractures", "extra": "Trap: denser but weaker.", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-067", "text": "In osteopetrosis, anaemia, recurrent infections and hepatosplenomegaly occur because bone expansion narrows the {{c1::marrow cavity}} → {{c2::extramedullary haematopoiesis}}", "extra": "", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-068", "text": "In osteopetrosis, blindness, facial / cranial nerve palsies and hearing impairment are caused by {{c1::pressure on the nerves}} from the extra bone", "extra": "Skull: thickened sclerotic bone narrows the nerve foramina.", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-069", "text": "Osteopetrosis was the first genetic disease treated with {{c1::bone marrow transplantation}}, because the defective osteoclast is {{c2::marrow-derived}}", "extra": "", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-070", "text": "Osteopetrosis X-ray: uniformly increased bone density with loss of the {{c1::corticomedullary}} distinction", "extra": "", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-071", "text": "Child with repeated fractures, anaemia, hepatosplenomegaly, cranial nerve palsies and diffusely sclerotic bones → {{c1::osteopetrosis}}", "extra": "Deficient cell: the osteoclast — replaced by bone marrow transplantation.", "sec": "Part 03 · 3.4 Osteopetrosis"}, {"id": "PAT-L1-2-072", "text": "Tumour-like (mass-forming) developmental bone lesions: {{c1::fibrous dysplasia}} · simple bone cyst · aneurysmal bone cyst · {{c2::brown tumour}} of hyperparathyroidism", "extra": "Discussed further in the bone tumours lecture.", "sec": "Part 03 · Other developmental bone diseases"}, {"id": "PAT-L1-2-073", "text": "Fibrous dysplasia biopsy: trabeculae of {{c1::woven bone}} scattered in a background of {{c2::fibroblastic proliferation}}", "extra": "Official GD 2 Case 4 answer; the pamphlet only names fibrous dysplasia.", "sec": "Part 03 · Other developmental bone diseases"}, {"id": "PAT-L1-2-074", "text": "Teenager with a fracture through a lytic lesion with a sclerotic rim; biopsy: woven-bone trabeculae in a fibroblastic background → {{c1::fibrous dysplasia}}", "extra": "GD 2 Case 4 and L1–3 revision Q8 (15-year-old gymnast).", "sec": "Part 03 · Other developmental bone diseases"}, {"id": "PAT-L1-2-075", "text": "Types of fibrous dysplasia: {{c1::monostotic}} (one bone) and {{c2::polyostotic}} (several bones)", "extra": "Official GD 2 Case 4 answer.", "sec": "Part 03 · Other developmental bone diseases"}, {"id": "PAT-L1-2-076", "text": "Complications of fibrous dysplasia: {{c1::deformities (shepherd deformity)}} · {{c2::anaemia}} · {{c3::recurrent infections}} · {{c4::malignant transformation}}", "extra": "Official GD 2 Case 4 answer; pamphlet lists anaemia and infections only under osteopetrosis.", "sec": "Part 03 · Other developmental bone diseases"}, {"id": "PAT-L1-2-077", "text": "Acquired osteodystrophies: {{c1::osteoporosis}} · {{c2::Paget disease}} · {{c3::rickets / osteomalacia}} · {{c4::hyperparathyroidism}} · {{c5::renal osteodystrophy}}", "extra": "Paget disease = osteitis deformans.", "sec": "Part 04 · Acquired osteodystrophy"}, {"id": "PAT-L1-2-078", "text": "Commonest fracture sites in osteoporosis: {{c1::vertebrae}} · {{c2::wrist}} · {{c3::hips}}", "extra": "Osteoporosis = low bone density, increased fragility and susceptibility to fracture.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-079", "text": "Factors favouring bone resorption (osteoclast): {{c1::PTH}} · {{c2::corticosteroids}}", "extra": "Hence long-term steroids → osteoporosis.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-080", "text": "Factors favouring bone formation (osteoblast): {{c1::vitamin D}} · {{c2::calcitonin}} · {{c3::oestrogen and androgen}} receptors", "extra": "Hence menopause (oestrogen loss) → osteoporosis.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-081", "text": "Osteoporosis risk factors (patient): {{c1::female}} sex · {{c2::increasing age}} · {{c3::oestrogen deficiency / menopause}} · family history · low weight / BMI · {{c4::Caucasian or Asian}} race", "extra": "", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-082", "text": "Osteoporosis risk factors (intake, lifestyle, drugs): inadequate {{c1::calcium and vitamin D}} · lack of {{c2::physical activity}} · smoking, alcohol · {{c3::corticosteroids}} · {{c4::antiseizure drugs}}", "extra": "", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-083", "text": "Predisposing factors in a 68-year-old woman with an osteoporotic hip fracture: menopause, corticosteroid therapy and chronic {{c1::renal disease}}", "extra": "Official GD 1 Case 5 answer; renal disease is not in the pamphlet's risk list.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-084", "text": "Osteoporosis is the \"{{c1::silent}} disease\" — bone mass is lost over many years with no signs or symptoms", "extra": "Silent until a fracture.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-085", "text": "Osteoporosis signs: loss of {{c1::height}} · back pain · vertebral collapse = {{c2::dowager's hump}} · lumbar lordosis and kyphoscoliosis", "extra": "", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-086", "text": "Diagnostic test for osteoporosis: {{c1::DEXA scan}}, which measures bone density", "extra": "", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-087", "text": "Osteoporosis labs: serum Ca, PO₄ and PTH are {{c1::normal}}, because the remaining bone is of {{c2::normal composition}}", "extra": "Trap: abnormal chemistry points elsewhere (e.g. osteomalacia). GD: ALP also normal.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-088", "text": "Osteoporosis treatment: {{c1::exercise}} · {{c2::calcium and vitamin D}} · {{c3::bisphosphonates}} · {{c4::oestrogen replacement}} (postmenopausal)", "extra": "", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-089", "text": "{{c2::Bisphosphonates}} bind to bone and inhibit {{c1::osteoclasts}}", "extra": "", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-090", "text": "Osteoporotic femoral bone biopsy: cortical {{c1::thinning}} · subperiosteal and endosteal {{c2::resorption}} · {{c3::Haversian canal}} widening", "extra": "Official GD 1 Case 5 answer; pamphlet: thin, fragile trabeculae of normal composition.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-091", "text": "Elderly inactive woman: hip fracture after a fall from bed + T10 compression fracture → {{c1::osteoporosis}}", "extra": "Commonest fracture sites: vertebrae, wrist, hips.", "sec": "Part 04 · 4.1 Osteoporosis"}, {"id": "PAT-L1-2-092", "text": "Paget disease of bone is also called {{c1::osteitis deformans}}", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-093", "text": "Paget disease pathophysiology: ↑ {{c1::osteoclastic}} activity → accelerated bone remodelling → ↑ {{c2::osteoblast}} activity to compensate", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-094", "text": "Paget disease: onset in {{c1::older adults}}; more common in people of {{c2::European}} descent", "extra": "A common condition: 2–9% of older patients; prevalence rises with age.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-095", "text": "Sites of Paget disease: {{c1::skull}} · {{c2::lumbar vertebrae}} · {{c3::pelvis}} · {{c4::femur}} · {{c5::tibia}}", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-096", "text": "Paget disease phases in order: {{c1::lytic}} → {{c2::mixed}} → {{c3::sclerotic}}", "extra": "L – M – S; all three may co-exist in the same bone.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-097", "text": "<b>Paget phases<\/b><br>Lytic = intense {{c1::osteoclastic resorption}}<br>Mixed = resorption + compensatory bone formation<br>Sclerotic = {{c2::osteoblastic bone formation}} predominates", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-098", "text": "Paget disease histology: disorganised {{c1::cement lines}} in a {{c2::mosaic}} pattern", "extra": "Formative 1 wording: \"mosaic pattern of lamellar bone\" → Paget disease.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-099", "text": "Paget disease histology: numerous large {{c1::multinucleated osteoclasts}} beside {{c2::woven}} bone and irregular broad trabeculae", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-100", "text": "{{c1::75%}} of patients with Paget disease are asymptomatic", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-101", "text": "Paget disease clinical features: severe bone pain · {{c1::bowed tibia}} · {{c2::arthritis}} · {{c3::erythema / warmth}} over the bones", "extra": "Pain mainly in pelvis, femur and tibia.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-102", "text": "Paget disease of the skull: enlarged skull, lion-shaped face = {{c1::leontiasis}}, headache / migraine", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-103", "text": "Paget disease increases the risk of: {{c1::bone fractures}} · {{c2::Paget sarcoma}} · {{c3::cranial nerve impingement}} (optic, auditory) from skull overgrowth · {{c4::high-output heart failure}}", "extra": "", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-104", "text": "New intense pain and swelling in a pagetic bone → suspect {{c1::Paget sarcoma}} (osteosarcoma, fibrosarcoma)", "extra": "Alarm sign.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-105", "text": "Paget disease X-ray: diffuse fluffy {{c1::cotton-wool}} lesions", "extra": "From the GD 1 Case 6 vignette; not in the pamphlet.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-106", "text": "Paget symptoms: disorganized resorption and deposition → bone {{c1::disfigurement}} (bowing, facial change) and {{c2::compression}} of nerves (vision, hearing, numbness, headache)", "extra": "Official GD 1 Case 6 answer.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-107", "text": "Elderly man with bone pain, hats that no longer fit, hearing loss and sclerosis of the pelvis, spine and tibia → {{c1::Paget disease of bone}}", "extra": "Biopsy would show a mosaic pattern with many osteoclasts.", "sec": "Part 04 · 4.2 Paget disease of bone"}, {"id": "PAT-L1-2-108", "text": "Rickets / osteomalacia = faulty bone {{c1::mineralisation}} from deficient or impaired metabolism of vitamin D, phosphate or calcium", "extra": "Bone softening.", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-109", "text": "<b>Vitamin D deficiency<\/b><br>Children (before epiphyseal fusion) → {{c1::rickets}}<br>Adults → {{c2::osteomalacia}}", "extra": "Rickets = Rapidly growing child · osteomalacia = mature adult.", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-110", "text": "Rickets: vitamin D deficiency → growth retardation with {{c1::expansion}} of the growth plate", "extra": "Contrast achondroplasia: growth-plate expansion is suppressed.", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-111", "text": "Vitamin D activation: liver {{c1::25-hydroxylase}} → 25-(OH)-vitamin D; kidney {{c2::1-α-hydroxylase}} → 1,25-(OH)₂-vitamin D = {{c3::calcitriol}}", "extra": "Vitamin D must also be enough: food and sunlight exposure.", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-112", "text": "Calcitriol raises {{c1::calcium and phosphate}}: ↑ renal tubular Ca²⁺ reabsorption and ↑ intestinal Ca²⁺ and PO₄³⁻ absorption", "extra": "", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-113", "text": "Shared symptoms of rickets and osteomalacia: diffuse bone and joint pain · {{c1::proximal muscle weakness}} · bone fragility, fractures · {{c2::muscle spasms}} and numbness", "extra": "", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-114", "text": "Rickets-specific signs: {{c1::craniotabes}} · {{c2::delayed}} closure of fontanelles · prominent {{c3::frontal}} bone · {{c4::rachitic rosary}} · protruding abdomen · {{c5::genu varum}}", "extra": "Trap: fontanelles close late, not early.", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-115", "text": "Rickets / osteomalacia labs: ↓ vitamin D, ↓ Ca²⁺ → {{c1::↑ PTH}} → {{c2::↓ PO₄³⁻}}, with {{c3::↑ alkaline phosphatase}}", "extra": "Contrast osteoporosis: Ca, PO₄ and PTH all normal.", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-116", "text": "X-ray of rickets / osteomalacia: osteopenia and {{c1::Looser zones}} (pseudofractures)", "extra": "", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-117", "text": "Rickets X-ray: metaphyseal {{c1::cupping}}, {{c2::flaring}} and {{c3::fraying}}, with bowing of the legs", "extra": "", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-118", "text": "Rickets / osteomalacia treatment: {{c1::vitamin D}} supplementation + treat the underlying cause; prevention: vitamin D in {{c2::pregnancy}} and for neonates and infants", "extra": "", "sec": "Part 04 · 4.3 Rickets and osteomalacia"}, {"id": "PAT-L1-2-119", "text": "<b>Hyperparathyroidism<\/b><br>Primary = parathyroid {{c1::hyperplasia or adenoma}}<br>Secondary = prolonged {{c2::hypocalcaemia}} → compensatory PTH hypersecretion", "extra": "", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-120", "text": "↑ PTH acts first on the {{c1::osteoblast}}, stimulating {{c2::RANK-L}}, which activates the {{c3::osteoclast}} → bone resorption", "extra": "Trap: PTH drives the osteoclast indirectly, via the osteoblast.", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-121", "text": "The severe bone disease of hyperparathyroidism: {{c1::osteitis fibrosa cystica}} (von Recklinghausen's disease of bone)", "extra": "Now rare, because hyperparathyroidism is usually detected early.", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-122", "text": "<b>Osteitis fibrosa cystica — the name<\/b><br>Osteitis = {{c1::increased bone cell activity}}<br>Fibrosa = {{c2::peritrabecular fibrosis}}<br>Cystica = cystic {{c3::brown tumours}}", "extra": "", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-123", "text": "Brown tumour = a large {{c1::osteolytic}} lesion resembling a bone tumour; brown because of {{c2::haemorrhage}}", "extra": "", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-124", "text": "Hyperparathyroid bone histology: {{c1::osteoclasts}} tunnel into and dissect along the trabeculae, with peritrabecular {{c2::fibrosis}}", "extra": "Subperiosteal resorption → thinned cortices, haemorrhage and cysts.", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-125", "text": "Hyperparathyroidism X-ray: {{c1::subperiosteal}} bone resorption of the {{c2::phalanges}}, with cystic lesions", "extra": "", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-126", "text": "Otherwise healthy adult; cystic lytic bone lesion with ↑ osteoclasts and fibrosis → {{c1::brown tumour}} of {{c2::primary}} hyperparathyroidism", "extra": "Primary = parathyroid adenoma / hyperplasia; no cause of prolonged hypocalcaemia → not secondary.", "sec": "Part 04 · 4.4 Hyperparathyroidism"}, {"id": "PAT-L1-2-127", "text": "<b>Core defect<\/b><br>Osteoporosis = {{c1::low bone density}} (remaining bone is normal)<br>Rickets / osteomalacia = {{c2::faulty mineralisation}} of a normal matrix", "extra": "", "sec": "Part 05 · The metabolic bone diseases compared"}, {"id": "PAT-L1-2-128", "text": "<b>Labs<\/b><br>↓ Ca, ↓ PO₄, ↑ PTH, ↑ alkaline phosphatase → {{c1::rickets / osteomalacia}}<br>Normal Ca, PO₄ and PTH with low bone density → {{c2::osteoporosis}}", "extra": "", "sec": "Part 05 · The metabolic bone diseases compared"}, {"id": "PAT-L1-2-129", "text": "<b>Congenital dysplasias compared<\/b><br>Too little bone (type I collagen) → {{c1::osteogenesis imperfecta}}<br>Too much but brittle bone (osteoclast failure) → {{c2::osteopetrosis}}<br>Suppressed growth plate (FGFR3) → {{c3::achondroplasia}}", "extra": "", "sec": "Part 05 · The metabolic bone diseases compared"}, {"id": "PAT-L1-2-130", "text": "Bone remodelling cycle: resting → {{c1::resorption}} (osteoclast) → {{c2::reversal}} → {{c3::formation}} of osteoid (osteoblast) → {{c4::mineralisation}}", "extra": "Every metabolic bone disease disturbs one of these steps.", "sec": "Part 05 · Visual recap — the remodelling cycle"}], "lib": "./", "prev": null, "next": {"href": "pat-l3.html", "title": "Lecture 3 · Bone Tumours"}, "searchHint": "e.g. drugs, mutations, hearing loss"};
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){
  const r = document.documentElement;
  if (S.set.theme === 'light' || S.set.theme === 'dark') r.dataset.theme = S.set.theme; else r.removeAttribute('data-theme');
  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);
  if (rs.getPropertyValue('--ph') !== vph) rs.setProperty('--ph', vph);
  book.classList.toggle('single', mode === 'single');
  // a new size only reflows the CSS; the pages are rebuilt only when the book switches between one and two pages,
  // so a phone's sliding toolbar, the keyboard or a resizing frame can never reset the page you are reading
  if (opened && (force || mode !== drawnMode)) draw();
}
window.addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(function again(){ if (busy){ layout.t = setTimeout(again, 120); return; } layout(); }, 80);
});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){

const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';

}
const LAB = {};
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};

function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   <div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>
