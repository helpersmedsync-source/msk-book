"y": 78.83, "w": 12.99, "h": 6.33, "id": "l8"}, {"t": "Osteosarcoma", "x": 41.34, "y": 86.42, "w": 14.82, "h": 5.42, "id": "l9"}], "src": "From the practical slides · Lab 1 – Bone tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl127": {"id": "sl127", "type": "slide", "title": "osteosarcoma", "img": "prac/s127.jpg", "labels": [{"t": "Intramedullary", "x": 40.32, "y": 48.81, "w": 19.34, "h": 7.01, "id": "l0"}, {"t": "Hi gh", "x": 69.46, "y": 56.83, "w": 4.56, "h": 11.88, "id": "l1"}, {"t": "Osteoid producing", "x": 28.71, "y": 83.22, "w": 42.78, "h": 12.2, "id": "l2"}, {"t": "gr ad e", "x": 74.58, "y": 64.48, "w": 5.68, "h": 13.65, "id": "l3"}], "src": "From the practical slides · Lab 1 – Bone tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl128": {"id": "sl128", "type": "slide", "title": "Production osteoid of", "img": "prac/s128.jpg", "labels": [{"t": "Malignant osteoid", "x": 15.74, "y": 28.59, "w": 7.71, "h": 8.07, "id": "l0"}, {"t": "Malignant osteobalasts", "x": 15.43, "y": 54.99, "w": 9.5, "h": 8.07, "id": "l1"}, {"t": "Bone and soft tissue pathology.Andrew Horvai", "x": 13.4, "y": 96.65, "w": 17.56, "h": 2.04, "id": "l2"}], "src": "From the practical slides · Lab 1 – Bone tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl132": {"id": "sl132", "type": "slide", "title": "Giant Cell Tumor", "img": "prac/s132.jpg", "labels": [{"t": "Clinical keynotes:", "x": 15.02, "y": 22.27, "w": 23.97, "h": 7.23, "id": "l0"}, {"t": "of femur and radius, upper end of", "x": 15.47, "y": 51.14, "w": 39.86, "h": 6.33, "id": "l1"}, {"t": "tibia and humerus", "x": 15.47, "y": 60.48, "w": 21.48, "h": 6.33, "id": "l2"}], "src": "From the practical slides · Lab 1 – Bone tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "PAT-L3-001", "text": "Vitamin D deficiency in children before epiphyseal fusion = {{c1::rickets}}; in adults = {{c2::osteomalacia}}", "extra": "Same deficiency, different age: open growth plate → rickets.", "sec": "Part 01 · 1.1 Rickets vs osteomalacia"}, {"id": "PAT-L3-002", "text": "Rickets — the defect: growth retardation + {{c1::expansion of the growth plate}}", "extra": "Only possible before epiphyseal fusion.", "sec": "Part 01 · 1.1 Rickets vs osteomalacia"}, {"id": "PAT-L3-003", "text": "Osteomalacia — the defect: hypocalcaemia & hypophosphataemia → {{c1::impaired mineralization of bone matrix proteins}}", "extra": "Adult skeleton: the matrix fails to mineralize.", "sec": "Part 01 · 1.1 Rickets vs osteomalacia"}, {"id": "PAT-L3-004", "text": "Rickets-specific signs: {{c1::craniotabes}} · {{c2::delayed closure of fontanelles}} · {{c3::prominent frontal bone}} · {{c4::rachitic rosary}} · {{c5::protruding abdomen}} · {{c6::genu varum}}", "extra": "Osteomalacia has no specific signs — only the shared features.", "sec": "Part 01 · 1.1 Rickets vs osteomalacia"}, {"id": "PAT-L3-005", "text": "Features shared by rickets & osteomalacia: {{c1::diffuse bone & joint pain}} · {{c2::proximal muscle weakness}} · {{c3::bone fragility (↑↑ fracture risk)}} · {{c4::muscle spasms & numbness}}", "extra": "", "sec": "Part 01 · 1.1 Rickets vs osteomalacia"}, {"id": "PAT-L3-006", "text": "Vitamin D activation: {{c1::liver}} ({{c2::25-hydroxylase}}) → 25-(OH) vit D ▶ {{c3::kidney}} ({{c4::1-α-hydroxylase}}) → 1,25-(OH)₂ vit D (calcitriol)", "extra": "Vitamin D must be enough (food + sunlight) and must be activated.", "sec": "Part 01 · 1.2 Vitamin D — enough & activated"}, {"id": "PAT-L3-007", "text": "Actions of calcitriol: ↑ intestinal absorption of {{c1::Ca²⁺ & PO₄³⁻}} · ↑ renal tubular {{c2::Ca²⁺ reabsorption}}", "extra": "", "sec": "Part 01 · 1.2 Vitamin D — enough & activated"}, {"id": "PAT-L3-008", "text": "Vitamin D deficiency labs: blood Ca²⁺ {{c1::low::high or low}} · PTH {{c2::high (compensatory)::high or low}} · PO₄³⁻ {{c3::low::high or low}} · alkaline phosphatase {{c4::high::high or low}}", "extra": "Low Ca²⁺ drives PTH up; the raised PTH lowers phosphate.", "sec": "Part 01 · 1.3 Diagnosis & treatment"}, {"id": "PAT-L3-009", "text": "Treatment of rickets / osteomalacia: {{c1::vitamin D supplementation}} + {{c2::treat the underlying cause}}", "extra": "", "sec": "Part 01 · 1.3 Diagnosis & treatment"}, {"id": "PAT-L3-010", "text": "Prevention of rickets: vitamin D supplementation during {{c1::pregnancy}} and for {{c2::neonates & infants}}", "extra": "", "sec": "Part 01 · 1.3 Diagnosis & treatment"}, {"id": "PAT-L3-011", "text": "Hyperparathyroidism — primary: parathyroid {{c1::hyperplasia or adenoma}}; secondary: {{c2::prolonged hypocalcaemia}} → compensatory PTH hypersecretion", "extra": "", "sec": "Part 01 · 1.4 Hyperparathyroidism"}, {"id": "PAT-L3-012", "text": "Osteitis fibrosa cystica (the severe bone changes of hyperparathyroidism) is rare because hyperparathyroidism is usually {{c1::detected early}}", "extra": "Also called von Recklinghausen's disease of bone.", "sec": "Part 01 · 1.4 Hyperparathyroidism"}, {"id": "PAT-L3-013", "text": "Brown tumour of hyperparathyroidism: a large {{c1::osteolytic}} lesion resembling a bone tumour; brown due to {{c2::haemorrhage}}", "extra": "", "sec": "Part 01 · 1.4 Hyperparathyroidism"}, {"id": "PAT-L3-014", "text": "Osteitis fibrosa cystica — the name is the pathology: osteitis = {{c1::increased bone cell activity}} · fibrosa = {{c2::peritrabecular fibrosis}} · cystica = {{c3::cystic brown tumours}}", "extra": "", "sec": "Part 01 · 1.5 Osteitis fibrosa cystica"}, {"id": "PAT-L3-015", "text": "Osteitis fibrosa cystica X-ray: {{c1::subperiosteal bone resorption}} with cysts", "extra": "Subperiosteal resorption → thinned cortices, haemorrhage, cysts.", "sec": "Part 01 · 1.5 Osteitis fibrosa cystica"}, {"id": "PAT-L3-016", "text": "Osteitis fibrosa cystica microscopy: {{c1::osteoclasts}} tunnel into and dissect centrally along the length of the trabeculae", "extra": "", "sec": "Part 01 · 1.5 Osteitis fibrosa cystica"}, {"id": "PAT-L3-017", "text": "Osteogenic bone tumours — benign: {{c1::osteoma}} · {{c2::osteoid osteoma}} · {{c3::osteoblastoma}}; malignant: {{c4::osteosarcoma}}", "extra": "", "sec": "Part 02 · 2.1 The seven groups"}, {"id": "PAT-L3-018", "text": "Chondrogenic bone tumours — benign: {{c1::chondroma}} · {{c2::osteochondroma}} · {{c3::chondroblastoma}} · {{c4::chondromyxoid fibroma}}; malignant: {{c5::chondrosarcoma}}", "extra": "", "sec": "Part 02 · 2.1 The seven groups"}, {"id": "PAT-L3-019", "text": "Myelogenic bone tumours (both malignant): {{c1::plasma cell myeloma}} · {{c2::Ewing's tumour}}", "extra": "Ewing's is classed as myelogenic, not osteogenic.", "sec": "Part 02 · 2.1 The seven groups"}, {"id": "PAT-L3-020", "text": "Other groups of bone tumours — collagenous: {{c1::fibrosarcoma}} · vascular: {{c2::haemangioma}} (benign) / {{c3::angiosarcoma}} (malignant) · bone lymphoma: Hodgkin's & non-Hodgkin's", "extra": "", "sec": "Part 02 · 2.1 The seven groups"}, {"id": "PAT-L3-021", "text": "Site key — epiphysis + metaphysis, around the knee: {{c1::giant cell tumour}}", "extra": "", "sec": "Part 02 · 2.2 Regions of a long bone — the site key"}, {"id": "PAT-L3-022", "text": "Site key — metaphysis: cortex, benign → {{c1::osteoid osteoma}} · medulla, benign → {{c2::osteoblastoma}} · malignant bone-forming → {{c3::osteosarcoma}} · cartilage-capped outgrowth → {{c4::osteochondroma}}", "extra": "", "sec": "Part 02 · 2.2 Regions of a long bone — the site key"}, {"id": "PAT-L3-023", "text": "Site key — diaphysis (medullary cavity): benign cartilage → {{c1::enchondroma}} · malignant cartilage → {{c2::chondrosarcoma}} (+ metaphysis) · child, round cells → {{c3::Ewing's / PNET}}", "extra": "", "sec": "Part 02 · 2.2 Regions of a long bone — the site key"}, {"id": "PAT-L3-024", "text": "Osteoma: type = {{c1::compact (ivory)}} osteoma; common site = {{c2::skull}}", "extra": "", "sec": "Part 03 · 3.1 Osteoma"}, {"id": "PAT-L3-025", "text": "Osteoma age · sex: {{c1::40–50 years}} · {{c2::male > female}}", "extra": "", "sec": "Part 03 · 3.1 Osteoma"}, {"id": "PAT-L3-026", "text": "Osteoma gross: very dense compact bone forming a hard, smooth, {{c1::sessile}} mass", "extra": "CT: very dense, well-defined bony mass.", "sec": "Part 03 · 3.1 Osteoma"}, {"id": "PAT-L3-027", "text": "Microscopy of {{c2::osteoma}}: {{c1::lamellar}} bone", "extra": "Osteoid osteoma / osteoblastoma show woven bone instead.", "sec": "Part 03 · 3.1 Osteoma"}, {"id": "PAT-L3-028", "text": "Skull osteoma growing from the outer table → {{c1::disfigurement}}; from the inner table → {{c2::pressure on vital structures}}", "extra": "", "sec": "Part 03 · 3.1 Osteoma"}, {"id": "PAT-L3-029", "text": "Inner-table osteoma pressure effects: eyeball → {{c1::proptosis}} · paranasal sinus → {{c2::sinusitis}} · auditory meatus → {{c3::conductive deafness}}", "extra": "", "sec": "Part 03 · 3.1 Osteoma"}, {"id": "PAT-L3-030", "text": "Osteoid osteoma & osteoblastoma both affect age {{c1::10–30}}; osteoid osteoma is more common in {{c2::males}}", "extra": "", "sec": "Part 03 · 3.2 Osteoid osteoma"}, {"id": "PAT-L3-031", "text": "Osteoid osteoma gross: small, oval or round, well-defined {{c1::nidus}} with a {{c2::granular brownish-red}} centre", "extra": "", "sec": "Part 03 · 3.2 Osteoid osteoma"}, {"id": "PAT-L3-032", "text": "Osteoid osteoma microscopy: haphazard {{c1::woven (osteoid) bone}} trabeculae rimmed by prominent {{c2::osteoblasts}}; intertrabecular spaces filled by {{c3::vascular loose connective tissue}}", "extra": "GD figure: central woven bone surrounded by compact (sclerotic) bone.", "sec": "Part 03 · 3.2 Osteoid osteoma"}, {"id": "PAT-L3-033", "text": "Differential diagnosis of a painful knee in a child: {{c1::osteoid osteoma}} · {{c2::osteomyelitis}} · {{c3::Ewing sarcoma}} · {{c4::osteosarcoma}} · {{c5::rheumatologic causes}} · {{c6::trauma}}", "extra": "From the GD 2 osteoid osteoma case key.", "sec": "Part 03 · 3.2 Osteoid osteoma (GD 2 case key)"}, {"id": "PAT-L3-034", "text": "Osteoblastoma (the '{{c1::giant osteoid osteoma}}'): a rare, {{c2::non-metastasizing}} but locally destructive tumour of osteoblasts", "extra": "By definition larger than 1.5–2 cm.", "sec": "Part 03 · 3.3 Osteoblastoma"}, {"id": "PAT-L3-035", "text": "Osteoblastoma microscopy = {{c1::the central nidus of osteoid osteoma}}", "extra": "Woven bone + prominent osteoblasts + vascular stroma.", "sec": "Part 03 · 3.3 Osteoblastoma"}, {"id": "PAT-L3-036", "text": "Size — osteoid osteoma: {{c1::< 2 cm}}; osteoblastoma: {{c2::> 2 cm}}", "extra": "The 2-cm rule.", "sec": "Part 03 · 3.4 Osteoid osteoma vs osteoblastoma"}, {"id": "PAT-L3-037", "text": "Site of origin — osteoid osteoma: {{c1::cortex}} of the metaphysis (femur & tibia); osteoblastoma: {{c2::medulla}} of the metaphysis or the {{c3::vertebrae}}", "extra": "A vertebral site is specific to osteoblastoma.", "sec": "Part 03 · 3.4 Osteoid osteoma vs osteoblastoma"}, {"id": "PAT-L3-038", "text": "Pain — osteoid osteoma: {{c1::nocturnal, relieved by aspirin}}; osteoblastoma: {{c2::dull, achy, not relieved by aspirin}}", "extra": "One osteoblastoma slide says 'painless'; either way aspirin never helps it.", "sec": "Part 03 · 3.4 Osteoid osteoma vs osteoblastoma"}, {"id": "PAT-L3-039", "text": "X-ray — osteoid osteoma: lucent nidus surrounded by {{c1::dense sclerotic reactive bone}}; osteoblastoma: lucent area with {{c2::little or no}} reactive bone", "extra": "Sclerotic rim = calcification.", "sec": "Part 03 · 3.4 Osteoid osteoma vs osteoblastoma"}, {"id": "PAT-L3-040", "text": "Osteosarcoma age · sex: {{c1::second decade (10–25 years)}} · {{c2::male > female}}", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-041", "text": "Osteosarcoma site: {{c1::metaphysis}} of the {{c2::lower femur & upper tibia}} (or any bone)", "extra": "It may extend into the diaphysis, but it arises in the metaphysis.", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-042", "text": "Osteosarcoma gross: infiltrating tumour arising in the {{c1::medullary cavity}}, extending into the diaphysis, with {{c2::cortical destruction on both sides}}", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-043", "text": "Osteosarcoma microscopy: primitive bone trabeculae of dark-stained {{c1::calcified osteoid}} surrounded by {{c2::malignant osteoblasts}} with several {{c3::mitotic figures}}", "extra": "QB wording: large hyperchromatic pleomorphic spindle cells forming osteoid matrix.", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-044", "text": "Osteosarcoma radiographic types: {{c1::osteoblastic}} and {{c2::osteolytic}} (radiolucent lesion)", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-045", "text": "Early osteosarcoma X-ray: soft-tissue shadow with {{c1::ill-defined margins}} — early cortical destruction & {{c2::medullary infiltration}}", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-046", "text": "Characteristic X-ray of osteosarcoma: '{{c1::sun rays}}' (sunburst) + '{{c2::Codman's triangle}}'", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-047", "text": "Sun rays in osteosarcoma = neoplastic bone arising {{c1::perpendicular to the long axis}}", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-048", "text": "Codman's triangle = {{c1::reactive new bone}} formed where the tumour {{c2::lifts the periosteum off the cortex}}", "extra": "Tumour breaks cortex ▶ periosteum lifted ▶ reactive new bone at the junction.", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-049", "text": "Osteosarcoma spreads {{c1::early by blood}} — {{c2::lung}} metastases may be present at presentation; {{c3::lymphatic}} spread does not occur", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-050", "text": "Osteosarcoma direct spread presents as a {{c1::rapidly growing mass}}, with or without pain", "extra": "", "sec": "Part 03 · 3.5 Osteosarcoma"}, {"id": "PAT-L3-051", "text": "Solitary chondroma (enchondroma): a benign {{c1::intraosseous}} neoplasm composed of {{c2::hyaline cartilage}}", "extra": "", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-052", "text": "Cell that gives rise to an enchondroma (e.g. of a phalanx): {{c1::chondrocytes}}", "extra": "Micro shows hyaline cartilage and no bone trabeculae, so not osteoblasts.", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-053", "text": "Enchondroma site: {{c1::diaphysis (medullary cavity)}} of {{c2::short bones of the hand}} — metacarpals & phalanges (or any tubular bone)", "extra": "", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-054", "text": "Enchondroma X-ray: central, well-defined {{c1::radiolucent area}} with {{c2::foci of calcification}}", "extra": "", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-055", "text": "Enchondroma gross: {{c1::semitranslucent, glistening}} hyaline cartilage with foci of calcification", "extra": "", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-056", "text": "Enchondroma microscopy: {{c1::lobules of hyaline cartilage}}", "extra": "", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-057", "text": "Chondroma forms — solitary: enchondroma, {{c1::periosteal}} chondroma, {{c2::soft-tissue}} chondroma; multiple chondromas = {{c3::enchondromatosis}}", "extra": "", "sec": "Part 04 · 4.1 Solitary chondroma (enchondroma)"}, {"id": "PAT-L3-058", "text": "Osteochondroma (osteocartilaginous exostosis): a benign {{c1::cartilage-capped}} outgrowth attached to the underlying bone by a {{c2::bony stalk}}", "extra": "", "sec": "Part 04 · 4.2 Osteochondroma"}, {"id": "PAT-L3-059", "text": "{{c2::Osteochondroma}} is grossly {{c1::mushroom}}-shaped (1–20 cm; may be bilobed)", "extra": "Mushroom: cap = cartilage, stalk = bone.", "sec": "Part 04 · 4.2 Osteochondroma"}, {"id": "PAT-L3-060", "text": "Osteochondroma site: {{c1::metaphysis}} of long bones — {{c2::lower femur & upper tibia}}", "extra": "", "sec": "Part 04 · 4.2 Osteochondroma"}, {"id": "PAT-L3-061", "text": "Osteochondroma gross: stalk & head of woven bone whose marrow cavity is {{c1::continuous with that of the parent bone}}, covered by a {{c2::cartilaginous cap}}", "extra": "", "sec": "Part 04 · 4.2 Osteochondroma"}, {"id": "PAT-L3-062", "text": "Osteochondroma X-ray: well-circumscribed {{c1::knobby}} surface · {{c2::acute}} angle with the cortex · cap points {{c3::away from}} the adjacent epiphysis", "extra": "", "sec": "Part 04 · 4.2 Osteochondroma"}, {"id": "PAT-L3-063", "text": "{{c2::Chondrosarcoma}} is the {{c1::second}} most common malignant non-haematopoietic bone tumour", "extra": "Its grade determines its prognosis.", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-064", "text": "Chondrosarcoma age: older patients — peak incidence in the {{c1::6th decade}}", "extra": "", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-065", "text": "Chondrosarcoma site (central skeleton): {{c1::shoulder area}} · {{c2::pelvis}} · {{c3::proximal femur}} · {{c4::ribs}}", "extra": "Medullary cavity of the diaphysis; may occur in any bone.", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-066", "text": "Chondrosarcoma origin: primary ({{c1::de novo}}) or secondary on top of {{c2::multiple enchondromas}} or {{c3::osteochondroma}}", "extra": "", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-067", "text": "Chondrosarcoma X-ray: radiolucent with speckled calcifications — diffuse '{{c1::salt & pepper}}' or discrete '{{c2::popcorn}}' pattern", "extra": "", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-068", "text": "Chondrosarcoma gross: expansile {{c1::greyish-blue, glistening}} mass in the {{c2::medullary cavity}} of diaphysis & metaphysis", "extra": "", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-069", "text": "Chondrosarcoma microscopy: proliferated atypical pleomorphic {{c1::chondrocytes}} producing hyaline cartilage; a lacuna may contain {{c2::2 or more}} atypical cells", "extra": "", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-070", "text": "Chondrosarcoma (glistening bluish-white medullary mass, proximal femur) — the proliferating cell type is {{c1::chondroblasts}}", "extra": "Official key (L1–3 revision Q1). Pamphlet: atypical pleomorphic chondrocytes producing hyaline cartilage.", "sec": "Part 04 · 4.3 Chondrosarcoma"}, {"id": "PAT-L3-071", "text": "Chondrosarcoma prognosis is determined by its {{c1::grade}}", "extra": "", "sec": "Part 04 · 4.4 Grading = prognosis"}, {"id": "PAT-L3-072", "text": "Chondrosarcoma grades: I = {{c1::mild}} cellular atypia · II = {{c2::crowded}} cells, perhaps a few bizarre cells · III = '{{c3::ugly-looking}}'", "extra": "Mnemonic: Mild · Crowded · Ugly.", "sec": "Part 04 · 4.4 Grading = prognosis"}, {"id": "PAT-L3-073", "text": "Chondrosarcoma grade I microscopy: slightly anaplastic nuclei, {{c1::binucleate cells}}, {{c2::two cells in a lacuna}}, mitoses", "extra": "", "sec": "Part 04 · 4.4 Grading = prognosis"}, {"id": "PAT-L3-074", "text": "Chondrosarcoma grade by far most likely to metastasize: grade {{c1::III}} (includes {{c2::mesenchymal}} chondrosarcoma)", "extra": "", "sec": "Part 04 · 4.4 Grading = prognosis"}, {"id": "PAT-L3-075", "text": "A low-grade chondrosarcoma that recurs locally may come back at a {{c1::higher grade}}", "extra": "", "sec": "Part 04 · 4.4 Grading = prognosis"}, {"id": "PAT-L3-076", "text": "{{c1::Plasma cell myeloma}} is the most common {{c2::haematopoietic}} bone neoplasm", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-077", "text": "Multiple myeloma arises from the {{c1::plasma cells}} of the bone marrow", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-078", "text": "Myeloma site — any bone with haematopoietic marrow: {{c1::spine}} · {{c2::ribs}} · {{c3::skull}} · {{c4::pelvis}}", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-079", "text": "Myeloma X-ray: radiolucent lesions with {{c1::no sclerosis}}; multiple {{c2::punched-out}} lesions in the skull", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-080", "text": "Myeloma gross: multiple {{c1::red}} masses in the skull", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-081", "text": "Myeloma microscopy: sheets of {{c1::immature plasma cells}} — {{c2::eccentric}} nucleus, clumped chromatin, abundant amphophilic cytoplasm; many {{c3::binucleated}} cells", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-082", "text": "Myeloma serum & urine electrophoresis: {{c1::immunoglobulin spike}} & {{c2::Bence Jones proteinuria}} in {{c3::99%}}", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-083", "text": "Myeloma biochemistry: {{c1::hypercalcaemia}} & {{c2::hyperuricaemia}} (↑ osteoclastic activity) · {{c3::↑ ESR}} in some cases", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-084", "text": "In myeloma, pathological fracture and osteolytic lesions are due to {{c1::increased osteoclastic activity}}", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-085", "text": "{{c3::Multiple myeloma}} causes {{c1::primary}} amyloidosis → congestive heart failure, or {{c2::nephrotic syndrome & renal failure}}", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-086", "text": "Myeloma effects: {{c1::pathological fracture}} · {{c2::primary amyloidosis}} · {{c3::anaemia & thrombocytopenia}} · {{c4::hypercalcaemia & metastatic calcification}}", "extra": "FACT — Fracture · Amyloidosis · Cytopenias · Too much Ca²⁺.", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-087", "text": "Myeloma: anaemia & thrombocytopenia are due to {{c1::marrow replacement}}; the calcification is {{c2::metastatic}} (from hypercalcaemia)", "extra": "Not dystrophic.", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-088", "text": "Types of multiple myeloma: {{c1::symptomatic}} and {{c2::asymptomatic}}", "extra": "From the GD 2 myeloma case key; not in the pamphlet.", "sec": "Part 05 · 5.1 Plasma cell myeloma (GD 2 case key)"}, {"id": "PAT-L3-089", "text": "Myeloma complications: {{c1::renal failure}} · anaemia · {{c2::recurrent infection}} · primary amyloidosis", "extra": "GD 2 case key; recurrent infection is not in the pamphlet.", "sec": "Part 05 · 5.1 Plasma cell myeloma (GD 2 case key)"}, {"id": "PAT-L3-090", "text": "Monoclonal Ig spike + Bence Jones proteinuria + lytic skull lesions + anaemia → {{c1::multiple myeloma}}", "extra": "", "sec": "Part 05 · 5.1 Plasma cell myeloma"}, {"id": "PAT-L3-091", "text": "{{c3::Ewing's sarcoma / PNET}} is the {{c1::second}} most common bone tumour in children, after {{c2::osteosarcoma}}", "extra": "", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-092", "text": "Ewing's sarcoma / PNET genetics: {{c1::EWS/FLI}} gene mutation, from translocation {{c2::t(11;22)}}", "extra": "EWSR1–FLI1 fusion gene. t(11;22) is from the QB stems / GD key; the pamphlet says 'EWS/FLI gene mutation'.", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-093", "text": "Ewing's sarcoma site: {{c1::medullary cavity}} of the {{c2::diaphysis}}", "extra": "", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-094", "text": "Ewing's sarcoma gross: {{c1::tan-white}} with areas of {{c2::haemorrhage & necrosis}}", "extra": "", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-095", "text": "Ewing's sarcoma X-ray hallmark: lamellated periosteal reaction — '{{c1::onion skin}}'", "extra": "", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-096", "text": "Other Ewing's X-ray findings: {{c1::mottled (moth-eaten) osteolytic}} lesion; a {{c2::sunburst}} periosteal reaction may also be seen", "extra": "Sunburst is not unique to osteosarcoma; onion skin is the Ewing's hallmark.", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-097", "text": "Ewing's sarcoma microscopy: sheets of {{c1::small round blue cells}} (round cells with little cytoplasm)", "extra": "", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-098", "text": "Ewing's sarcoma: {{c1::Homer Wright}} rosettes may be seen — {{c2::neural}} differentiation, cells around a central fibrillary space", "extra": "", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-099", "text": "Ewing's sarcoma treatment: {{c1::chemotherapy}} & {{c2::surgical excision}} ± {{c3::radiation}}", "extra": "Not immediate amputation.", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET"}, {"id": "PAT-L3-100", "text": "Differential diagnosis of Ewing's sarcoma: {{c1::osteomyelitis}} · {{c2::rheumatoid arthritis}} · {{c3::osteosarcoma}} · {{c4::acute leukaemia / lymphoma}} · {{c5::metastatic neuroblastoma}}", "extra": "Fever, ↑ WBC/ESR and pus-like necrotic material make it mimic osteomyelitis.", "sec": "Part 05 · 5.2 Ewing's sarcoma / PNET (GD 2 case key)"}, {"id": "PAT-L3-101", "text": "Giant cell tumour: a {{c1::locally aggressive}} (potentially malignant) bone tumour of {{c2::unknown origin}}", "extra": "The only tumour in the 'unknown origin' group.", "sec": "Part 06 · 6.1 Giant cell tumour"}, {"id": "PAT-L3-102", "text": "Giant cell tumour site: {{c1::epiphysis & metaphysis}} around the knee (lower femur, upper tibia); also {{c2::upper humerus}} & {{c3::lower radius}}", "extra": "", "sec": "Part 06 · 6.1 Giant cell tumour"}, {"id": "PAT-L3-103", "text": "Giant cell tumour age · sex: {{c1::20–40 years}} · more in {{c2::females}}", "extra": "", "sec": "Part 06 · 6.1 Giant cell tumour"}, {"id": "PAT-L3-104", "text": "Giant cell tumour X-ray: radiolucent mass {{c1::expanding the bone}} with thinning of the cortex, traversed by {{c2::sclerotic lines}} → '{{c3::soap-bubble}}' appearance", "extra": "Seen at the epiphysio-metaphyseal area.", "sec": "Part 06 · 6.1 Giant cell tumour"}, {"id": "PAT-L3-105", "text": "Giant cell tumour gross: soft, {{c1::dark brown}}, fleshy, with {{c2::cystic formation}}", "extra": "", "sec": "Part 06 · 6.1 Giant cell tumour"}, {"id": "PAT-L3-106", "text": "Giant cell tumour microscopy: {{c1::multinucleated giant cells}} + {{c2::neoplastic stromal cells}}", "extra": "Biphasic: giant cells + mononuclear stromal cells.", "sec": "Part 06 · 6.1 Giant cell tumour"}, {"id": "PAT-L3-107", "text": "GCT grading by giant cells: grade I {{c1::numerous}} · grade II {{c2::less numerous}} · grade III {{c3::few}}", "extra": "Giant cells fall as the grade rises.", "sec": "Part 06 · 6.2 Microscopic grading of GCT"}, {"id": "PAT-L3-108", "text": "GCT grading by stromal cells: grade I {{c1::no atypia, rare mitosis}} · grade II {{c2::moderate atypia & mitoses}} · grade III {{c3::marked atypia, abundant mitoses}}", "extra": "", "sec": "Part 06 · 6.2 Microscopic grading of GCT"}, {"id": "PAT-L3-109", "text": "GCT is potentially malignant: grading has no value except for grade {{c1::III}} — even grade I can {{c2::recur after surgical excision}} and {{c3::metastasize to the lungs}}", "extra": "", "sec": "Part 06 · 6.2 Microscopic grading of GCT"}, {"id": "PAT-L3-110", "text": "The most common tumours of bone: {{c1::metastases}}", "extra": "", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-111", "text": "Adult bone metastases: > {{c1::75%}} originate from cancers of the {{c2::prostate}} · {{c3::breast}} · {{c4::kidney}} · {{c5::lung}}", "extra": "P-B-K-L.", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-112", "text": "Childhood sources of bone metastases: {{c1::neuroblastoma}} · {{c2::Wilms' tumour}} · {{c3::osteosarcoma}} · {{c4::Ewing sarcoma}} · {{c5::rhabdomyosarcoma}}", "extra": "", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-113", "text": "Bone metastases are typically {{c1::multifocal}}, but carcinoma of the {{c2::kidney}} & {{c3::thyroid}} gives solitary deposits", "extra": "The loners are K & T.", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-114", "text": "Commonest site of bone metastases: the {{c1::axial skeleton}} (vertebral column, pelvis, ribs, skull, sternum), plus {{c2::proximal femur & humerus}}", "extra": "", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-115", "text": "Bone metastases X-ray: purely {{c1::lytic}}, purely {{c2::blastic}}, or {{c3::mixed}}", "extra": "", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-116", "text": "Elderly patient with persistent back pain + hypercalcaemia (normal renal function) → most likely cause: {{c1::metastatic carcinoma}} to bone", "extra": "Official key. Pamphlet: metastases are the commonest bone tumours and favour the vertebral column.", "sec": "Part 06 · 6.3 Metastatic tumours"}, {"id": "PAT-L3-117", "text": "X-ray: radiolucent nidus < 2 cm with a dense sclerotic rim in the cortex → {{c1::osteoid osteoma}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-118", "text": "X-ray: sun rays + Codman's triangle → {{c1::osteosarcoma}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-119", "text": "X-ray: lamellated 'onion skin' periosteal reaction → {{c1::Ewing's sarcoma / PNET}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-120", "text": "X-ray: soap bubble at the epiphysio-metaphyseal area → {{c1::giant cell tumour}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-121", "text": "X-ray: multiple punched-out lucencies with no sclerosis (skull) → {{c1::plasma cell myeloma}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-122", "text": "X-ray: lucent lesion with 'salt & pepper' or 'popcorn' calcification → {{c1::chondrosarcoma}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-123", "text": "X-ray: central well-defined lucency with calcific foci in a short bone of the hand → {{c1::enchondroma}}", "extra": "", "sec": "Part 07 · 7.1 X-ray sign → tumour"}, {"id": "PAT-L3-124", "text": "Microscopy: woven bone trabeculae & bone marrow covered by a cap of cartilage → {{c1::osteochondroma}}", "extra": "", "sec": "Part 07 · Master table — microscopy"}, {"id": "PAT-L3-125", "text": "Microscopy: malignant osteoblasts around calcified osteoid, with mitoses → {{c1::osteosarcoma}}", "extra": "", "sec": "Part 07 · Master table — microscopy"}, {"id": "PAT-L3-126", "text": "Microscopy: atypical chondrocytes, ≥ 2 per lacuna → {{c1::chondrosarcoma}}", "extra": "", "sec": "Part 07 · Master table — microscopy"}, {"id": "PAT-L3-127", "text": "Microscopy: sheets of small round blue cells ± Homer Wright rosettes → {{c1::Ewing's sarcoma / PNET}}", "extra": "", "sec": "Part 07 · Master table — microscopy"}, {"id": "PAT-L3-128", "text": "Microscopy: multinucleated giant cells + neoplastic stromal cells → {{c1::giant cell tumour}}", "extra": "", "sec": "Part 07 · Master table — microscopy"}], "pracs": [{"href": "prac-pat-1.html", "title": "Pathology practical · Lab 1 – Bone tumours"}], "lib": "msk.html", "prev": {"href": "pat-l1-2.html", "title": "Lectures 1 & 2 · Pathology of Bone"}, "next": {"href": "pat-l4-1.html", "title": "Lecture 4 · Part 1 · Arthritis"}, "coverImg": "covers/Pathology.jpg", "searchHint": "e.g. acute, proptosis, plasma cells"};

const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];
  if (L.labels.length >= 2) modes.push(['test', 'Test me'], ['find', 'Find it']);
  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);
    if (mode === 'test') return st.rev[l.id] ? 'on' : 'cv';
    if (mode === 'find') return st.fb && st.fb[2] === l.id ? st.fb[0] : 'cv';
    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);
    if (st.sel === l.id) return 'sel';
    return '';
  };
  const pad = (b, k) => `left:${(b.x - k).toFixed(2)}%;top:${(b.y - k * 1.6).toFixed(2)}%;width:${(b.w + 2 * k).toFixed(2)}%;height:${(b.h + 3.2 * k).toFixed(2)}%`;
  const boxes = L.labels.map(l => {
    const c = cls(l);
    // a numbered legend: the label is covered, the number on the picture is the spot to tap
    const lab = `<button class="sb ${l.m && mode === 'find' ? (c === 'cv' ? 'cv' : '') : c}" style="${pad(l, .35)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="${mode === 'test' || mode === 'find' ? 'covered label' : esc(l.t)}"></button>`;
    const mk = l.m ? `<button class="sb mk ${mode === 'find' ? (st.fb && st.fb[2] === l.id ? st.fb[0] : '') : (c === 'cv' ? '' : c)}" style="${pad(l.m, .6)}" data-act="sl" data-l="${L.id}" data-id="${l.id}" aria-label="number ${esc(l.n)}"></button>` : '';
    return lab + mk;
  }).join('');
  let info = '';
  if (mode === 'labels'){
    const l = L.labels.find(x => x.id === st.sel), m = l && slmus(L, l);
    info = m ? `<h4>${esc(m.name)}</h4>${esc(m.note || '')}<div class="muted" style="margin-top:.25em">Nerve: ${esc(m.nerves.map(n => (L.act.nerves.find(x => x.id === n) || {}).name).filter(Boolean).join(' + ') || 'not used as an answer in this book')}</div>`
      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`
      : l ? `<h4>${esc(l.t)}</h4>` : `<span class="muted">${L.act ? 'Tap a muscle label to see its action and nerve.' : L.labels.some(x => x.nv) ? 'Tap a nerve to see the muscles it supplies. "Test me" covers the labels; "Find it" asks you to find each one.' : L.labels.length >= 2 ? 'The labels as printed on the slide. "Test me" covers them; "Find it" asks you to find each one.' : 'The slide as shown in the practical.'}</span>`;
  } else if (mode === 'test'){
    info = `<span class="muted">Name each covered label, then tap it to check. Uncovered ${Object.keys(st.rev).length} of ${L.labels.length}.</span>`;
  } else if (mode === 'find'){
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    const t = L.labels.find(x => x.id === target);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Tap "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(t.t)}</h4>${st.fb && st.fb[0] === 'bad' ? `<div class="fb bad">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its ${t.m ? 'number on the picture' : 'covered label'} · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){
    const ms = L.labels.map(l => slmus(L, l)).filter(Boolean);
    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};

    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');

  return `<div class="endnav">${(BOOK.pracs || []).map(p => `<a href="${esc(p.href)}"><span><small>Practical book · real slides</small>${esc(p.title)}</span><span>◉</span></a>`).join('')}
    ${nx ? `<a href="${esc(nx.href)}"><span><small>${esc(nx.label || 'Next lecture')}</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>${esc(pv.label || 'Previous lecture')}</small>${esc(pv.title)}</span><span>←</span></a>` : ''}
    ${BOOK.lib ? `<a href="${esc(BOOK.lib)}"><span><small>The MSK book</small>All subjects and lectures</span><span>≡</span></a>` : ''}</div>`;
};

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {

  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>

   ${done ? `<div class="done">✓ Correct order${L.mnemonic ? ' — ' + esc(L.mnemonic) : ''}${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ''}</div>` : (st.wrong ? `<div class="muted" style="font-size:.78em">Wrong tries: ${st.wrong}</div>` : '')}

};
// --- labelled diagram ---
const DRAW = {};
LAB.diagram = L => {
  const st = lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.pins.map(p => p.id), L.id)}));

A.cover = a => { const t = TB[a.dataset.t]; t.cv = !t.cv; t.rev = {}; rerender(pageOf(a)); };
A.rev = a => { const t = TB[a.dataset.t]; t.rev[a.dataset.c] = 1; rerender(pageOf(a)); };

A.retry = a => { delete S.ans[a.dataset.q]; save(); rerender(pageOf(a)); };
A.pred = a => { const p = S.pred[a.dataset.q] || {}; if (p.lift) return; p.pick = +a.dataset.i; S.pred[a.dataset.q] = p; save(); rerender(pageOf(a)); };
A.lift = a => { const q = QS[a.dataset.q]; const p = S.pred[q.id]; p.lift = 1; if (p.pick !== q.ans) S.mist[q.id] = 1; save(); rerender(pageOf(a)); };
A.flap = a => { S.flap[a.dataset.q] = 1; save(); rerender(pageOf(a)); };

A.map = a => { const L = LABS[a.dataset.l], st = LS[L.id];
  if (st.mode === 'explore') st.sel = st.sel === a.dataset.id ? null : a.dataset.id;
  else if (st.qi < L.tests.length){ const t = L.tests[st.order[st.qi]]; if (a.dataset.id === t.a){ st.score += st.fb && st.fb[0] === 'bad' ? 0 : 1; st.qi++; st.fb = null; toast('✓ Correct'); } else st.fb = ['bad', 'Not this one — ' + L.regions.find(r => r.id === a.dataset.id).name + '. Try again.']; }

  if (st.mode === 'explore') st.sel = st.sel && st.sel[0] === t && st.sel[1] === id ? null : [t, id];
  else if (t === 'n') st.cut[id] = !st.cut[id];

A.gmode = a => { const st = gstate(LABS[a.dataset.l]); st.mode = a.dataset.v; st.sel = null; rerender(pageOf(a)); };
A.gclear = a => { const st = gstate(LABS[a.dataset.l]); st.cut = {}; rerender(pageOf(a)); };
A.gcase = a => { const L = LABS[a.dataset.l], st = gstate(L), c = L.cases[+a.dataset.i]; st.cut = {}; c.cut.forEach(n => st.cut[n] = true); labDone(L.id); rerender(pageOf(a)); };
A.spick = a => { const st = LS[a.dataset.l]; st.sel = st.sel === a.dataset.id ? null : a.dataset.id; st.shake = null; rerender(pageOf(a)); };
A.sdrop = a => { const L = LABS[a.dataset.l], st = LS[L.id]; if (!st.sel) return; const it = L.items.find(x => x.id === st.sel);
  if (it.bin === a.dataset.b){ st.placed[it.id] = it.bin; st.sel = null; st.shake = null; } else { st.wrong++; st.shake = it.id; toast('Not there — try another box'); }
  rerender(pageOf(a)); };
A.sreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.qpick = a => { const L = LABS[a.dataset.l], st = LS[L.id], i = +a.dataset.i; if (i === st.n){ st.n++; st.shake = null; } else { st.wrong++; st.shake = i; } rerender(pageOf(a)); };
A.qreset = a => { delete LS[a.dataset.l]; rerender(pageOf(a)); };
A.slmode = a => { const L = LABS[a.dataset.l], st = slst(L); st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.sel = null; st.mv = null; st.cut = {}; st.order = shuffled(L.labels.map(l => l.id), String(Date.now())); slre(a); };
A.sl = a => { const L = LABS[a.dataset.l], st = slst(L), id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find'){ if (st.qi >= st.order.length) return; const t = st.order[st.qi];
    if (id === t){ if (!(st.fb && st.fb[0] === 'bad' && st.fb[3] === t)) st.score++; st.qi++; st.fb = ['ok', '✓', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; slre(a); } }, 650); }
    else st.fb = ['bad', 'Not that one. Try again.', id, t]; }
  else st.sel = st.sel === id ? null : id;
  slre(a); };
A.slmv = a => { const st = slst(LABS[a.dataset.l]); st.mv = st.mv === a.dataset.id ? null : a.dataset.id; slre(a); };
A.slcut = a => { const st = slst(LABS[a.dataset.l]); st.cut[a.dataset.id] = !st.cut[a.dataset.id]; slre(a); };
A.slbig = a => { const L = LABS[a.dataset.l]; ov(L.title || 'Practical slide', `<div class="slbig" data-big="${L.id}">${LAB.slide(L, true)}</div>`, 'wide'); };
function slre(a){
  const big = a.closest('[data-big]');
  if (big){ big.innerHTML = LAB.slide(LABS[big.dataset.big], true); const i = pageOf(document.querySelector(`#pgL [data-l="${big.dataset.big}"], #pgR [data-l="${big.dataset.big}"]`) || document.body); if (i >= 0) rerender(i); return; }
  rerender(pageOf(a));
}
A.dmode = a => { const L = LABS[a.dataset.l], st = LS[L.id]; st.mode = a.dataset.v; st.rev = {}; st.qi = 0; st.score = 0; st.fb = null; st.order = shuffled(L.pins.map(p => p.id), String(Date.now())); rerender(pageOf(a)); };
A.pin = a => { const L = LABS[a.dataset.l], st = LS[L.id], id = a.dataset.id;
  if (st.mode === 'test'){ if (st.rev[id]) delete st.rev[id]; else st.rev[id] = 1; }
  else if (st.mode === 'find' && st.qi < st.order.length){ const t = st.order[st.qi];
    if (id === t){ st.score += st.fb && st.fb[0] === 'bad' && st.fb[3] === t ? 0 : 1; st.qi++; st.fb = ['ok', '✓ Correct', id, t]; setTimeout(() => { if (st.fb && st.fb[2] === id){ st.fb = null; rerender(pageOf(document.querySelector(`[data-l="${L.id}"]`) || a)); } }, 700); }
    else st.fb = ['bad', 'That is ' + L.pins.find(p => p.id === id).name + '. Try again.', id, t]; }
  rerender(pageOf(a)); };

/* ---------- overlays ---------- */
function ov(title, body, cls){
  $('#ovs').innerHTML = `<div class="ov" data-act="ovbg"><div class="panel ${cls || ''}" role="dialog" aria-label="${esc(title)}"><div class="ph"><h2>${esc(title)}</h2><button class="x" data-act="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="pb" id="pbody">${body}</div></div></div>`;
}
function closeOv(){ $('#ovs').innerHTML = ''; if (!opened) home(); }
A.close = closeOv;
A.ovbg = (a, e) => { if (e.target === a) closeOv(); };
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1500); }

// contents
A['open-toc'] = () => {
  const items = BOOK.pages.map((p, i) => [p, i]).filter(([p]) => p.toc);
  const labs = BOOK.pages.map((p, i) => [p, i]).filter(([p]) => p.kind === 'lab');
  const marks = Object.keys(S.marks).map(Number).sort((a, b) => a - b);
  ov('Contents', `${BOOK.lib ? `<div class="endnav" style="margin-top:0"><a href="${esc(BOOK.lib)}"><span><small>The MSK book</small>All subjects and lectures</span><span>≡</span></a></div>` : ''}<div class="lst">${items.map(([p, i]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span><b>${esc(p.toc[0])}</b> · ${esc(p.toc[1])}</span></button>`).join('')}</div>
   <h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Labs</h3><div class="lst">${labs.map(([p, i]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>${esc(p.labName || p.head)}</span></button>`).join('')}</div>
   <h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Bookmarks</h3>${marks.length ? `<div class="lst">${marks.map(i => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>${esc(BOOK.pages[i].head || 'Page ' + i)}</span></button>`).join('')}</div>` : '<p class="muted">No bookmarks yet. Tap the ribbon at the top of a page.</p>'}`);
};
// search
function pageText(p){ const out = []; (p.blocks || []).forEach(b => { ['title', 'html', 'sub', 'hook'].forEach(k => { if (typeof b[k] === 'string') out.push(b[k]); }); if (b.items) out.push(b.items.join(' ')); if (b.rows) out.push(b.rows.flat().join(' ')); if (b.q && QS[b.q]) out.push(QS[b.q].stem); if (b.lab && LABS[b.lab]) out.push(LABS[b.lab].title + ' ' + LABS[b.lab].intro); }); return out.join(' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' '); }
const PT = BOOK.pages.map(pageText);
A['open-search'] = () => { ov('Search the book', `<input class="srch" id="sq" type="search" placeholder="${esc(BOOK.searchHint || 'Search this lecture')}" aria-label="Search"><div class="lst" id="sres"></div>`);
  const inp = $('#sq'); inp.focus(); inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase(); const r = $('#sres');
    if (q.length < 2){ r.innerHTML = ''; return; }
    const hits = [];
    PT.forEach((t, i) => { const j = t.toLowerCase().indexOf(q); if (j >= 0) hits.push([i, t.slice(Math.max(0, j - 40), j + q.length + 60)]); });
    r.innerHTML = hits.length ? hits.map(([i, s]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>…${esc(s)}…</span></button>`).join('') : '<p class="muted">Nothing found.</p>';
  }); };
// settings
A['open-set'] = () => {
  const seg = (k, vals) => `<div class="seg">${vals.map(([v, n]) => `<button class="${String(S.set[k]) === String(v) ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>`;
  ov('Settings', `<div class="setrow"><span>Theme</span>${seg('theme', [['system', 'Auto'], ['light', 'Day'], ['dark', 'Night']])}</div>
   <div class="setrow"><span>Text size</span>${seg('size', [[0.9, 'S'], [1, 'M'], [1.15, 'L']])}</div>
   <div class="setrow"><span>Rapid revision<br><small class="muted">Hides running text; keeps tables, notes, questions and labs.</small></span>${seg('rapid', [[false, 'Off'], [true, 'On']])}</div>
   <div class="setrow"><span>Progress<br><small class="muted">Saved in this browser only.</small></span><button class="btn" data-act="reset">Reset all progress</button></div>`);
};
A.set = a => { let v = a.dataset.v; if (a.dataset.k === 'size') v = +v; if (a.dataset.k === 'rapid') v = v === 'true'; S.set[a.dataset.k] = v; save(); applySet(); A['open-set'](); if (opened) draw(); };
A.reset = a => { if (a.dataset.sure){ S = JSON.parse(JSON.stringify(DEF)); for (const k in LS) delete LS[k]; save(); applySet(); closeOv(); toast('Progress reset'); if (opened) draw(); } else { a.dataset.sure = 1; a.textContent = 'Tap again to confirm'; } };

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>

</body>
