es · 9 of 11", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl127"}], "labName": "osteosarcoma"}, {"id": "p90", "head": "Real images · 10 of 11", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl128"}], "labName": "Production osteoid of"}, {"id": "p91", "head": "Real images · 11 of 11", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl132"}], "labName": "Giant Cell Tumor"}, {"id": "p92", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "h", "no": "?", "title": "Name it — spotter practice"}, {"t": "note", "kind": "hy", "title": "How it works", "html": "4 pictures from the practical slides of this lecture, each with its title and every label covered, in a new order. Say what it is out loud, then pick. Every one is also in Exam mode."}], "toc": ["?", "Name it — spotter practice"]}, {"id": "p93", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-132"}, {"t": "check", "q": "PRQ-112"}]}, {"id": "p94", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-123"}, {"t": "check", "q": "PRQ-117"}]}, {"id": "p95", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Osteoblastoma called 'painless' and 'dull achy' — but never relieved by aspirin; only OO gives night pain relieved by aspirin"}, {"t": "note", "kind": "trap", "html": "Osteoid osteoma arises in cortex; osteoblastoma in medulla"}, {"t": "note", "kind": "trap", "html": "Osteosarcoma spreads by blood, never lymphatics"}, {"t": "note", "kind": "trap", "html": "Sunburst also seen in Ewing's; onion skin is the Ewing's hallmark"}, {"t": "note", "kind": "trap", "html": "Chondrosarcoma may arise on multiple enchondromas or osteochondroma"}, {"t": "note", "kind": "trap", "html": "Recurring low-grade chondrosarcoma may return at a higher grade"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p96", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "GCT grading has no value except grade III; even grade I recurs and metastasizes to lungs"}, {"t": "note", "kind": "trap", "html": "Myeloma lesions are lucent with no sclerosis"}, {"t": "note", "kind": "trap", "html": "Kidney &amp; thyroid metastases are solitary, not multifocal"}, {"t": "note", "kind": "trap", "html": "Osteitis fibrosa cystica is rare — hyperparathyroidism detected early"}, {"t": "note", "kind": "trap", "html": "Metastases are not one of the seven primary groups yet are the most common bone tumours"}, {"t": "note", "kind": "cl", "html": "Osteoma inner-table pressure: proptosis, sinusitis, conductive deafness"}, {"t": "note", "kind": "cl", "html": "Osteosarcoma: lung metastasis may be present at presentation"}]}, {"id": "p97", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Myeloma: Ig spike and Bence Jones proteinuria in 99%; hypercalcaemia, hyperuricaemia"}, {"t": "note", "kind": "cl", "html": "Myeloma primary amyloidosis → congestive heart failure or nephrotic syndrome/renal failure"}, {"t": "note", "kind": "cl", "html": "Ewing's treated with chemotherapy &amp; surgical excision ± radiation"}]}, {"id": "p98", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Y26-040": {"id": "Y26-040", "stem": "A 19-year-old man falls and strikes his leg. He feels intense pain. On physical examination there is swelling in his lower leg. MR imaging is performed and shown in the figure with T1 weighting. Which of the following is the most likely diagnosis?", "top": true, "rep": "", "tag": "Final bank PAT Q25", "bank": true, "expl": "A metaphyseal tumour of the medullary cavity that destroys the cortex and forms a soft-tissue mass in a 19-year-old (10–25 years) is osteosarcoma, an infiltrating tumour with cortical destruction and a soft-tissue shadow. Giant cell tumour involves the epiphysis as well as the metaphysis in 20–40-year-olds, Ewing's sarcoma arises in the medulla of the diaphysis in children, and chondrosarcoma affects older patients.", "img": ["figs/Y26-040.jpg"], "cap": "Sagittal T1-weighted MR image of the injured leg", "type": "mcq", "opts": ["Chondrosarcoma", "Osteosarcoma", "Ewing sarcoma", "Giant cell tumor"], "ans": 1}, "Y26-043": {"id": "Y26-043", "stem": "A 38-year-old healthy man notes occasional pain in his right index finger when using a hammer. On palpation of the right proximal phalanx there is point tenderness. A radiograph shows a 1-cm oval lucency in this phalanx, with a surrounding rim of bright, radiodense bone. The microscopic appearance of the excised lesion is shown in the figure. Which of the following cells is most likely to have given rise to this lesion?", "top": true, "rep": "", "tag": "Final bank PAT Q26", "bank": true, "expl": "A lucent lesion of a phalanx whose microscopy shows hyaline cartilage with chondrocytes in lacunae is an enchondroma (solitary chondroma), a benign chondrogenic neoplasm of hyaline cartilage typical of the short bones of the hand. Osteoblasts would form woven bone, as in the nidus of osteoid osteoma, and no bone trabeculae are seen here.", "img": ["figs/Y26-043.jpg"], "cap": "Microscopic appearance of the excised phalangeal lesion", "type": "mcq", "opts": ["Chondrocytes", "Osteoblasts", "Giant cells", "Fibroblasts"], "ans": 0}, "Y26-049": {"id": "Y26-049", "stem": "A 23-year-old man has had pain in the area of the right knee for the past year. On physical examination, there is mild tenderness over a 2-cm focal area just below the patella laterally over the tibia. A radiograph of the right leg shows a 3-cm, broad-based excrescence projecting from the metaphyseal region of the upper tibia. The lesion is excised. The figure shows the gross appearance of the sectioned lesion. What is the most likely diagnosis?", "top": true, "rep": "", "tag": "Final bank PAT Q31", "bank": true, "expl": "A broad-based bony outgrowth projecting from the metaphysis of the upper tibia and capped by glistening cartilage is an osteochondroma (osteocartilaginous exostosis): a mushroom-shaped, cartilage-capped outgrowth attached to the bone by a bony stalk, typically at the metaphysis of the lower femur or upper tibia. Osteosarcoma favours the same site but is an infiltrating medullary tumour that destroys the cortex, with sun rays or Codman's triangle.", "img": ["figs/Y26-049.jpg"], "cap": "Gross appearance of the sectioned lesion", "type": "mcq", "opts": ["Ewing sarcoma", "Giant-cell tumor", "Osteoblastoma", "Osteochondroma", "Osteosarcoma"], "ans": 3}, "Q0520": {"id": "Q0520", "stem": "Compare between osteoid osteoma and osteoblastoma.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W18", "bank": true, "expl": "Both are benign osteogenic tumours of the 10–30 age group with the same histology, so the distinction rests on size (the 2-cm rule), site (cortex vs medulla/spine), bone reaction and response of pain to aspirin.", "type": "written", "keyhtml": "Feature | Osteoid osteoma | Osteoblastoma\nSize | Less than 2 cm | More than 2 cm\nSite of origin | Cortex of long bones (metaphysis of femur &amp; tibia) | Medullary cavity of long bone or spine (vertebrae)\nPain | Nocturnal, relieved by aspirin | Dull, achy, not responsive to aspirin\nBone reaction | Surrounded by dense (sclerotic) bone reaction | Little or no bone reaction\nAge | 10–30 | 10–30\nHistology | Woven bone + prominent osteoblasts + vascular stroma | Same as the nidus of osteoid osteoma"}, "Y26-050": {"id": "Y26-050", "stem": "A 13-year-old, previously healthy boy has been complaining of pain in the right leg for the past month. There is no history of trauma or recent illness. On physical examination, there is warmth and tenderness to palpation of the right lower thigh. His temperature is 39°C. Laboratory studies show WBC count, 15,200/mm3 with WBC differential count of 85% neutrophils. A radiograph of the right leg shows a 6-cm expansile mass in the diaphyseal region of the right lower femur that extends into the soft tissue and is covered by layers of reactive bone. A biopsy of the mass is done, and microscopic examination of the specimen shows sheets of closely packed primitive cells with small, uniform nuclei and only scant cytoplasm. Karyotypic analysis of the tumor cells shows a t(11;22) translocation. What is the most likely diagnosis?", "top": true, "rep": "", "tag": "Final bank PAT Q32", "bank": true, "expl": "An expansile diaphyseal mass in a child, covered by layers of reactive bone (the lamellated 'onion-skin' periosteal reaction) and made of sheets of primitive small round cells with scant cytoplasm, is Ewing's sarcoma/PNET, the second most common bone tumour in children, which carries the EWS/FLI gene mutation. Osteosarcoma affects the same age group but arises in the metaphysis and its malignant osteoblasts form osteoid.", "type": "mcq", "opts": ["Enchondroma", "Ewing sarcoma", "Giant-cell tumor", "Osteosarcoma", "Plasmacytoma"], "ans": 1}, "Q0522": {"id": "Q0522", "stem": "The characteristic X-ray feature of osteosarcoma is ____, while that of giant cell tumor of bone is ____.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W19", "bank": true, "expl": "Sun rays (neoplastic bone perpendicular to the long axis) plus Codman's triangle signal osteosarcoma. An expanded radiolucent mass with a thin cortex crossed by sclerotic lines (soap bubble) at the epiphysio-metaphyseal area signals giant cell tumour.", "type": "written", "keyhtml": "Osteosarcoma: sun-ray (sunburst) appearance with Codman's triangle. Giant cell tumour: soap-bubble appearance (radiolucent mass expanding the bone with a thin cortex traversed by sclerotic lines, at the epiphysio-metaphyseal area)."}, "Q0523": {"id": "Q0523", "stem": "Multiple myeloma arises from ____ of bone marrow.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W20", "bank": true, "expl": "Plasma cell myeloma, the most common haematopoietic bone neoplasm, arises from the plasma cells of the bone marrow.", "type": "written", "keyhtml": "The plasma cells."}, "Q0524": {"id": "Q0524", "stem": "Multiple myeloma is manifested by pathological fracture and osteolytic bone lesions due to ____ and is characterized by ____ type of amyloidosis.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W21", "bank": true, "expl": "In myeloma, pathological fracture (and hypercalcaemia) results from increased osteoclastic activity. The amyloidosis is primary, leading to congestive heart failure or nephrotic syndrome and renal failure.", "type": "written", "keyhtml": "Increased osteoclastic activity; primary amyloidosis."}, "Q0525": {"id": "Q0525", "stem": "Ewing sarcoma is more common in ____ age and is characterized microscopically by ____.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W22", "bank": true, "expl": "Ewing's sarcoma is the second most common bone tumour in children; microscopically it shows sheets of small round blue cells, sometimes with Homer Wright rosettes. The 'onion-skin' periosteal reaction is its X-ray sign, not a microscopic feature.", "type": "written", "keyhtml": "Childhood (young age); sheets of small round blue cells (round cells with little cytoplasm), and Homer Wright rosettes may be seen."}, "Q0536": {"id": "Q0536", "stem": "A 45-year-old man has experienced pain in the area of the left hip and upper thigh for the past 7 months. On physical examination, there is tenderness on deep palpation of the left side of the groin. There is a reduction in range of motion at the left hip. There is no swelling or warmth to the touch. Pelvic and left leg radiographs show an upper femoral mass lesion arising in the metaphyseal region and eroding the surrounding bone cortex with a sun-ray appearance. Which of the following cell types is most likely to be proliferating in this mass?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "A metaphyseal mass that erodes the cortex with a sun-ray appearance is osteosarcoma, a malignant osteogenic tumour whose microscopy shows malignant osteoblasts around calcified osteoid. Primitive neuroectodermal cells (Ewing's/PNET) can also give a sunburst, but Ewing's arises in the medullary cavity of the diaphysis and its hallmark is the onion-skin reaction.", "type": "mcq", "opts": ["Osteoblasts", "Chondroblasts", "Osteoclasts", "Primitive neuroectodermal cells", "Plasma cells"], "ans": 0}, "Q0537": {"id": "Q0537", "stem": "An 18-year-old man sees the physician because he has had pain around the right knee for the past 3 months. There are no physical findings except for local pain over the area of the distal right femur. A radiograph of the right leg shows an ill-defined mass involving the metaphyseal area of the distal right femur, and there is elevation of the adjacent periosteum. A bone biopsy specimen shows large, hyperchromatic, pleomorphic spindle cells forming an osteoid matrix. What is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q34", "bank": true, "expl": "A second-decade male with a metaphyseal distal-femoral mass, periosteal elevation and malignant cells forming osteoid has osteosarcoma. Ewing sarcoma arises in the medullary cavity of the diaphysis and is made of small round blue cells, not osteoid.", "type": "mcq", "opts": ["Ewing sarcoma", "Chondrosarcoma", "Giant-cell tumor of bone", "Fibrous dysplasia", "Osteosarcoma"], "ans": 4}, "Q0546": {"id": "Q0546", "stem": "An 11-year-old boy has pain in his left leg that has persisted for 3 weeks. On physical examination his temperature is 37.9°C. A radiograph of the leg reveals a mass in the diaphyseal region of the left femur with overlying cortical erosion and soft tissue extension. A bone biopsy is performed and the lesion on microscopic examination shows numerous small round blue cells arranged in rosettes. Karyotypic analysis of these cells shows t(11;22). Which of the following neoplasms is he most likely to have?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "A diaphyseal tumour in a child with sheets of small round blue cells forming (Homer Wright) rosettes is Ewing's sarcoma/PNET, the second most common bone tumour in children.", "type": "mcq", "opts": ["Ewing sarcoma", "Medulloblastoma", "Neuroblastoma", "Chondroblastoma", "Osteoblastoma"], "ans": 0}, "Q0552": {"id": "Q0552", "stem": "A 16-year-old boy has noted pain in his left knee after each hockey practice session for the past month. On examination there is tenderness to palpation of his left knee, with reduced range of motion. A plain film radiograph of the left leg reveals a mass of the proximal tibial metaphysis that erodes bone cortex, lifting up the periosteum where reactive new bone is apparent. The mass does not extend into the epiphyseal region. A bone biopsy is performed and microscopic examination shows atypical, elongated cells with hyperchromatic nuclei in an osteoid stroma. Which of the following neoplasms is he most likely to have?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "A metaphyseal mass in a teenager that breaks the cortex and lifts the periosteum with reactive new bone (Codman's triangle), with atypical cells in an osteoid stroma, is osteosarcoma. Ewing sarcoma arises in the medullary cavity of the diaphysis and shows small round blue cells, not osteoid.", "type": "mcq", "opts": ["Ewing sarcoma", "Osteosarcoma", "Chondrosarcoma", "Multiple myeloma", "Metastatic seminoma"], "ans": 1}, "Q0558": {"id": "Q0558", "stem": "A 51-year-old man has noted constant, dull right hip pain for the past 3 months. On physical examination he has diminished range of motion of the right hip. A radiograph reveals a 10 × 13 cm mass involving the right ischium of the pelvis. The mass has irregular borders and there are extensive areas of bony destruction along with some scattered calcifications. The lesion is resected, and grossly the mass has a bluish-white cut surface. Which of the following is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q35", "bank": true, "expl": "A large destructive pelvic mass in a man in his 50s, with speckled calcification and a bluish glistening cut surface, is chondrosarcoma (6th-decade peak, central skeleton including the pelvis). Enchondroma is a benign lesion of the short bones of the hand, and osteosarcoma affects the 10–25 age group.", "type": "mcq", "opts": ["Osteosarcoma", "Enchondroma", "Osteoblastoma", "Chondrosarcoma", "Paget sarcoma"], "ans": 3}, "Q0559": {"id": "Q0559", "stem": "A 45-year-old man has experienced pain in the area of the left hip and upper thigh for the past 7 months. On physical examination, there is tenderness on deep palpation of the left side of the groin. There is a reduction in range of motion at the left hip. Pelvic and left leg radiographs show an upper femoral mass lesion arising in the metaphyseal region and eroding the surrounding bone cortex. The proximal femur is excised and on sectioning has the gross appearance shown in the figure. Which of the following cell types is most likely to be proliferating in this mass?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q36", "bank": true, "expl": "A glistening, pale bluish-white mass filling the medullary cavity of the proximal femur in a middle-aged man is a chondrosarcoma, a tumour of older patients and the central skeleton (shoulder, pelvis, proximal femur, ribs) made of proliferating atypical chondrocytes producing hyaline cartilage, i.e. cartilage-forming cells. Osteoblasts would fit osteosarcoma, a tumour of the 10–25 age group that forms osteoid and shows sun rays or Codman's triangle on X-ray.", "img": ["figs/Q0559.jpg"], "cap": "Sectioned proximal femur (gross)", "type": "mcq", "opts": ["Osteoblasts", "Chondroblasts", "Osteoclasts", "Primitive neuroectodermal cells", "Plasma cells"], "ans": 1}, "Q0560": {"id": "Q0560", "stem": "A 30-year-old woman has experienced pain in the area of the left knee for 1 month. On physical examination, there is tenderness to palpation of the distal left thigh and knee. The area is firm, but there is no erythema or warmth. A radiograph of the left leg shows a 7-cm mass in the distal femoral epiphyseal area, with a “soap bubble” appearance. Microscopic examination of a curettage specimen of the lesion shows the findings in the figure. [Micrograph: numerous multinucleated giant cells scattered among neoplastic stromal cells.] The lesion recurs in the next year; it is excised and does not recur again. What is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q27", "bank": true, "expl": "A soap-bubble lucency at the epiphysis of the distal femur in a 20–40-year-old woman, with multinucleated giant cells and neoplastic stromal cells, is a giant cell tumour; it is locally aggressive and can recur after surgical excision. Ewing's sarcoma arises in the medullary cavity of the diaphysis in children with an onion-skin reaction, and myeloma gives punched-out lucencies with no sclerosis.", "type": "mcq", "opts": ["Ewing's sarcoma", "Osteosarcoma", "Multiple myeloma", "Giant cell tumor"], "ans": 3}, "Q0561": {"id": "Q0561", "stem": "A Ewing's tumor affecting the humerus most characteristically:", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "The Ewing's hallmark is the lamellated 'onion-skin' periosteal reaction. A sunburst can also appear in Ewing's, but it is not characteristic (it is the osteosarcoma sign); soap bubble is the sign of giant cell tumour, and treatment is chemotherapy and surgical excision ± radiation, not immediate amputation.", "type": "mcq", "opts": ["Is a metastasis from carcinoma of the thyroid", "Should be treated by immediate amputation", "Looks like a cut onion on X-ray", "Has a soap-bubble appearance on X-ray", "Displays sun-ray spicules on X-ray"], "ans": 2}, "Q0562": {"id": "Q0562", "stem": "Which bone tumour is associated with lifting of the periosteum off the bone, producing Codman's triangle and a sunburst appearance on X-ray?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "When the tumour breaks the cortex and lifts the periosteum, reactive new bone at the junction forms Codman's triangle; with sun rays this is osteosarcoma. Ewing sarcoma may show a sunburst, but its hallmark is the onion-skin reaction.", "type": "mcq", "opts": ["Osteosarcoma", "Osteoma", "Ewing sarcoma", "Chondroma"], "ans": 0}, "Q0570": {"id": "Q0570", "stem": "Case: An 8-year-old boy presented to his primary care physician with an 8-month history of intermittent right thigh pain. A hip X-ray film was read as normal, but ESR and CRP were reported to be slightly elevated. He was diagnosed with \"growth pain,\" and no intervention was recommended. Six months later, he was again seen by his physician with pain that worsened significantly during the 2 weeks prior to the most recent admission, which caused the boy to limp. Laboratory tests showed a white blood cell count of 12,800/µL (69.5% neutrophils). Radiology studies, including X-ray, MRI, and bone scan, demonstrated multiple lytic lesions (Figures A & B) in the right femur, and a working diagnosis of \"chronic osteomyelitis\" was made. An open biopsy of the proximal right femur was performed, and pus-like necrotic material was observed flowing from the periosteal area. The bone lesion was sampled for microscopic examination, and the necrotic material was collected for bacterial cultures. Histopathological examination revealed the changes shown in Figure C.\nFigures A (X-ray) & B (MRI): multiple lytic lesions in the diaphysis and metaphysis of the right femur. Figure C: small round cells with clear cytoplasm and frequent mitosis.\n1. What is your diagnosis?\n2. What are the specific radiologic findings of this lesion?\n3. What is the characteristic genetic insult in this lesion?\n4. What are the differential diagnoses?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W14", "bank": true, "expl": "A child with months of thigh pain, lytic lesions of the femoral diaphysis and sheets of small round cells has Ewing sarcoma, the second most common bone tumour of children; its X-ray hallmark is the lamellated 'onion-skin' periosteal reaction and its genetic marker the EWS/FLI fusion. Raised inflammatory markers and pus-like necrotic material make it mimic osteomyelitis.", "img": ["figs/GP-07.jpg", "figs/GP-07_2.jpg", "figs/GP-07_3.jpg"], "cap": "Figures A–B: X-ray and MRI of the right femur; Figure C: biopsy (H&E)", "type": "written", "keyhtml": "1. Ewing sarcoma (Ewing's sarcoma / PNET).\n2. Multiple lytic lesions (moth-eaten — mottled osteolytic), with multilayered periosteal reaction (lamellated, 'onion skin'-like).\n3. Characteristic translocation between EWSR1 and FLI1, resulting in the EWS-FLI1 fusion gene (EWS/FLI mutation).\n4. Inflammatory disease (osteomyelitis); rheumatoid arthritis; other malignant bone tumours (osteosarcoma); haematologic malignancies (acute leukaemia, lymphoma); metastatic tumour (neuroblastoma)."}, "Q0574": {"id": "Q0574", "stem": "Case: An 18-year-old man sees the physician because he has had pain around the right knee for the past 3 months. There are no physical findings except for local pain over the area of the distal right femur. X-ray of the right leg shows an ill-defined mass involving the metaphyseal area of the distal right femur, and there is elevation of the adjacent periosteum (Figure A). MRI showed extension to the soft tissue (Figure B). A bone biopsy specimen shows large, hyperchromatic, pleomorphic spindle cells forming an osteoid matrix (Figure C).\n1. What is the most likely diagnosis?\n2. What are the specific radiologic findings of this lesion?\n3. What is the common site for metastasis for that tumor?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W15", "bank": true, "expl": "A metaphyseal tumour of the distal femur in the second decade, with malignant cells forming osteoid, is osteosarcoma. Its X-ray signs are sun rays and Codman's triangle, and it spreads early by blood to the lungs, not by lymphatics.", "img": ["figs/GP-08.jpg", "figs/GP-08_2.jpg", "figs/GP-08_3.jpg"], "cap": "Figure A: X-rays of the distal right femur; Figure B: MRI; Figure C: biopsy (H&E)", "type": "written", "keyhtml": "1. Osteosarcoma.\n2. Destructive medullary lesion extending to the soft tissue; periosteal reaction — Codman triangle (reactive new bone where the tumour lifts the periosteum off the cortex) and sunburst pattern (sun rays: neoplastic bone perpendicular to the long axis).\n3. The lungs (early spread by blood; no lymphatic spread)."}, "Q0577": {"id": "Q0577", "stem": "Case: A 12-year-old girl has complained of sudden onset of severe pain in her left knee that has awakened her from sleep on several occasions during the past 6 weeks. For each episode, her mother has given her acetylsalicylic acid (aspirin), and the pain has been relieved. On physical examination, there are no remarkable findings. An X-ray imaging of the left knee shows a well-defined, 1-cm lucent area surrounded by a thin rim of bony sclerosis located in the proximal tibial cortex (Figure A). Curettage was done and sent for histopathology, which revealed the changes in Figure B.\nFigure B: central area of woven bone surrounded with compact bone.\n1. What is the most likely diagnosis?\n2. What are the specific clinical symptoms?\n3. What are the differential diagnoses of painful knee in children?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W16", "bank": true, "expl": "Night pain relieved by aspirin in a child, with a lucent nidus under 2 cm surrounded by a sclerotic rim in the tibial cortex, is osteoid osteoma. Osteoblastoma has the same histology but is larger than 2 cm, medullary or spinal, and aspirin does not relieve it.", "img": ["figs/GP-09.jpg", "figs/GP-09_2.jpg"], "cap": "Figure A: X-ray of the legs; Figure B: curettage specimen (H&E)", "type": "written", "keyhtml": "1. Osteoid osteoma.\n2. Painful, worse at night, relieved by NSAIDs (aspirin).\n3. Osteoid osteoma; osteomyelitis; Ewing sarcoma; osteosarcoma; rheumatologic causes; trauma."}, "Q0582": {"id": "Q0582", "stem": "Case: A 55-year-old male presents to your office with new symptoms of exertional fatigue. He is otherwise well with no significant past medical history. His hemoglobin is found to be low at 10.6 g/dL. He has normal serum ferritin, vitamin B12, and folic acid levels. Absolute neutrophil count is 1.3 × 10³/µL and platelets 117 × 10⁹/L. He has a creatinine of 0.9 mg/dL, calcium of 9.2 mg/dL, and albumin of 3.8 g/dL. A serum protein electrophoresis is performed that demonstrates a monoclonal IgA protein of 1.5 g/dL. A skeletal survey shows occult lytic lesions in the skull and bilateral humeri (Figure A). Bone marrow biopsy shows 30 percent involvement by abnormal appearing plasma cells (Figure B).\n1. What is the most likely diagnosis?\n2. What are the types of that disease?\n3. What are the possible complications?", "top": true, "rep": "asked 4 years", "tag": "Final bank PAT W17", "bank": true, "expl": "A monoclonal Ig spike, lytic skull and humeral lesions, cytopenias and abnormal marrow plasma cells indicate multiple myeloma, the most common haematopoietic bone neoplasm. Its effects follow FACT: Fracture, Amyloidosis (primary — heart failure, or nephrotic syndrome and renal failure), Cytopenias, Too much calcium.", "img": ["figs/GP-11.jpg", "figs/GP-11_2.jpg", "figs/GP-11_3.jpg"], "cap": "Figure A: skeletal survey (skull and shoulder); Figure B: bone marrow", "type": "written", "keyhtml": "1. Symptomatic multiple myeloma (plasma cell myeloma — a malignant myelogenic tumour of the bone-marrow plasma cells).\n2. Symptomatic and asymptomatic.\n3. Renal failure; anaemia; recurrent infection; primary amyloidosis (also pathological fracture, thrombocytopenia, hypercalcaemia and metastatic calcification)."}, "Q0598": {"id": "Q0598", "stem": "Which of the following features applies to osteoid osteoma?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q37", "bank": true, "expl": "Osteoid osteoma is a radiolucent nidus &lt; 2 cm surrounded by dense sclerotic reactive bone (sclerotic rim) in the cortex of the femur or tibia. A vertebral site, size &gt; 2 cm and pain not relieved by aspirin are features of osteoblastoma.", "type": "mcq", "opts": ["Most common in vertebral bodies", "Surrounded by a sclerotic rim", "Size larger than 2 cm", "Pain not relieved by aspirin"], "ans": 1}, "Q0690": {"id": "Q0690", "stem": "A 60-year-old man presented to the ER with a pathological fracture of his left femur. X-ray revealed an ill-defined mass at the epiphysis of the femur with a soap-bubble appearance. What are the expected microscopic features of this lesion?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "A soap-bubble lesion at the epiphysis is a giant cell tumour, which shows multinucleated giant cells and neoplastic stromal cells. Two or more atypical chondrocytes per lacuna indicate chondrosarcoma, the tempting choice at this age, but chondrosarcoma shows salt-and-pepper/popcorn calcification, not a soap bubble.", "type": "mcq", "opts": ["Biphasic tumor composed of giant cells and mononuclear stromal cells", "Sheets of malignant chondrocytes with more than 2 per lacuna", "Rosettes of small round cells", "Atypical osteoblasts with lace-like osteoid"], "ans": 0}, "Q0691": {"id": "Q0691", "stem": "A 60-year-old man presented to the ER with a pathological fracture of his left ribs. X-rays of the chest and skull revealed multiple osteolytic lesions in the skull. Bone marrow biopsy revealed sheets of malignant plasma cells. Which of the following clinical presentations is common in this case?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Plasma cell myeloma causes primary amyloidosis, which leads to congestive heart failure or nephrotic syndrome and renal failure. Calcification in myeloma is metastatic (from hypercalcaemia), not dystrophic, and electrophoresis shows an Ig spike in 99% of cases.", "type": "mcq", "opts": ["Dystrophic calcification", "Normal protein electrophoresis", "Hypocalcemia", "Primary amyloidosis"], "ans": 3}, "Q0692": {"id": "Q0692", "stem": "A 10-year-old boy presented with severe pain in his left lower limb. X-ray revealed a bony process from the cortex of the metaphysis of the lower tibia with a mushroom appearance. Microscopic examination revealed bone trabeculae covered by a cartilaginous cap. What is your diagnosis?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "A mushroom-shaped bony outgrowth from the metaphysis, with bone trabeculae and marrow under a cartilage cap, is an osteochondroma (osteocartilaginous exostosis). A chondroma is an intraosseous neoplasm of hyaline cartilage (lobules) in the medulla of the diaphysis, not a cartilage-capped outgrowth.", "type": "mcq", "opts": ["Osteoblastoma", "Chondroma", "Osteoid osteoma", "Osteochondroma"], "ans": 3}, "Q0693": {"id": "Q0693", "stem": "A 70-year-old with long-standing hypertension and increasing shoe size and cap size comes into your office. Her condition has progressed to a tumor. Radiological examination reveals a sunburst effect and Codman's triangle. What is the most common location of her tumor?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "A sunburst with Codman's triangle indicates osteosarcoma, which arises in the metaphysis (lower femur, upper tibia). It may extend into the diaphysis, but its site of origin is the metaphysis.", "type": "mcq", "opts": ["Metaphysis", "Diaphysis", "Epiphysis", "Metaphysis and diaphysis", "Diaphysis and epiphysis"], "ans": 0}, "Q0696": {"id": "Q0696", "stem": "A 10-year-old boy has had sudden onset of severe pain in his left knee that has awakened him from sleep on several occasions during the past 6 weeks. For each episode, his mother has given him acetylsalicylic acid (aspirin), and the pain has been relieved. On physical examination, there are no remarkable findings. A radiograph of the left knee shows a well-defined, 1-cm lucent area surrounded by a thin rim of bony sclerosis located in the proximal tibial cortex. The patient undergoes radioablation of the lesion, and the pain does not recur. What is the most likely diagnosis of this lesion?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q28", "bank": true, "expl": "Night pain relieved by aspirin with a well-defined lucent nidus &lt; 2 cm surrounded by sclerotic bone in the tibial cortex is osteoid osteoma. Osteoblastoma has the same histology but is larger than 2 cm, arises in the medulla or spine, has little or no bone reaction and its pain is not relieved by aspirin.", "type": "mcq", "opts": ["Enchondroma", "Osteochondroma", "Osteoblastoma", "Osteoid osteoma"], "ans": 3}, "Q0699": {"id": "Q0699", "stem": "Osteoid osteoma originates from the:", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "Osteoid osteoma arises in the cortex of the metaphysis (femur and tibia). Its look-alike osteoblastoma arises in the medullary cavity (or spine).", "type": "mcq", "opts": ["Periosteum", "Cortex", "Medullary cavity", "Epiphysis"], "ans": 1}, "Q0700": {"id": "Q0700", "stem": "In adults, bone secondaries most commonly arise from which primary tumour?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "In adults, more than 75% of bone metastases come from cancers of the prostate, breast, kidney and lung (P-B-K-L). Neuroblastoma, Wilms' tumour and rhabdomyosarcoma are the childhood sources.", "type": "mcq", "opts": ["Carcinoma of the breast", "Neuroblastoma", "Wilms' tumour", "Rhabdomyosarcoma"], "ans": 0}, "Q0728": {"id": "Q0728", "stem": "Which of the following bone tumors has a mushroom-shaped gross appearance?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q38", "bank": true, "expl": "An osteochondroma is a cartilage-capped outgrowth attached to the bone by a bony stalk: grossly mushroom-shaped, with marrow continuous with the parent bone. An ivory osteoma is a dense, smooth, sessile skull mass, and chondrosarcoma is an expansile greyish-blue glistening medullary mass.", "type": "mcq", "opts": ["Osteosarcoma", "Ivory osteoma", "Osteochondroma", "Chondrosarcoma"], "ans": 2}, "Q0729": {"id": "Q0729", "stem": "A 12-year-old boy presented with a rapidly growing mass above the left knee. X-ray revealed a lesion in the metaphysis of the lower left femur with a sunray appearance. What is your provisional diagnosis?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q39", "bank": true, "expl": "A rapidly growing mass in the metaphysis of the lower femur with a sun-ray appearance (neoplastic bone perpendicular to the long axis) at 10–25 years is osteosarcoma. Multiple myeloma gives punched-out lucencies without sclerosis, and osteoid osteoma is a small lucent nidus with a dense sclerotic rim.", "type": "mcq", "opts": ["Osteosarcoma", "Multiple myeloma", "Osteoid osteoma", "Ivory osteoma"], "ans": 0}, "Q0730": {"id": "Q0730", "stem": "Which of the following tumors is commonly associated with primary amyloidosis?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q40", "bank": true, "expl": "Primary amyloidosis is an effect of plasma cell myeloma, leading to congestive heart failure or nephrotic syndrome and renal failure. None of the other tumours is linked to amyloidosis in the lecture.", "type": "mcq", "opts": ["Chondrosarcoma", "Osteosarcoma", "Giant cell tumor", "Multiple myeloma"], "ans": 3}, "Q0731": {"id": "Q0731", "stem": "Which of the following tumors commonly presents in childhood?", "top": false, "rep": "asked 3 years", "tag": "Final bank PAT Q41", "bank": true, "expl": "Ewing's sarcoma/PNET is the second most common bone tumour in children, after osteosarcoma. Giant cell tumour affects 20–40-year-olds and chondrosarcoma peaks in the 6th decade.", "type": "mcq", "opts": ["Giant cell tumor", "Ewing sarcoma", "Chondrosarcoma", "Multiple myeloma"], "ans": 1}, "Q0732": {"id": "Q0732", "stem": "A 13-year-old boy presented with a pathological fracture of his left femur. X-ray revealed a sunray appearance and Codman's triangle. What is your diagnosis?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT Q29", "bank": true, "expl": "Sun rays (neoplastic bone arising perpendicular to the long axis) with Codman's triangle (reactive new bone where the tumour lifts the periosteum off the cortex) in a 13-year-old indicate osteosarcoma, whose age range is 10–25 years. Osteoid osteoma shows a lucent nidus &lt; 2 cm with a dense sclerotic rim, and osteoblastoma a lucency &gt; 2 cm with little or no reaction.", "type": "mcq", "opts": ["Osteosarcoma", "Osteoblastoma", "Osteochondroma", "Osteoid osteoma"], "ans": 0}, "Q0733": {"id": "Q0733", "stem": "Which of the following features is specific to osteoblastoma?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT Q30", "bank": true, "expl": "Osteoblastoma arises in the vertebrae and the medulla of the metaphysis, is larger than 2 cm and lacks the surrounding reactive bone. Pain relieved by aspirin, small size (&lt; 2 cm) and a dense sclerotic rim are the features of osteoid osteoma.", "type": "mcq", "opts": ["Present in the vertebral column", "Pain relieved by aspirin", "Small in size", "Surrounded by a sclerotic rim"], "ans": 0}, "N-PAT-L3-01": {"id": "N-PAT-L3-01", "stem": "A 2-year-old child is brought to the clinic with bone pain and muscle weakness. Examination shows craniotabes, delayed closure of the fontanelles, a prominent frontal bone, a rachitic rosary, a protruding abdomen and genu varum. Which set of laboratory findings is expected?", "top": false, "rep": "", "tag": "Final bank PAT Q42", "bank": true, "expl": "These are the specific signs of rickets (vitamin D deficiency before epiphyseal fusion). Low vitamin D lowers blood Ca²⁺, PTH rises in compensation and lowers PO₄³⁻, and alkaline phosphatase is also raised. A low PTH with high phosphate (option b) does not fit, because hypocalcaemia drives PTH up.", "type": "mcq", "opts": ["↓ Ca²⁺, ↑ PTH, ↓ PO₄³⁻, ↑ alkaline phosphatase", "↓ Ca²⁺, ↓ PTH, ↑ PO₄³⁻, normal alkaline phosphatase", "↑ Ca²⁺, ↓ PTH, ↓ PO₄³⁻, ↑ alkaline phosphatase", "↓ Ca²⁺, ↑ PTH, ↑ PO₄³⁻, ↓ alkaline phosphatase", "Normal Ca²⁺, normal PTH, normal PO₄³⁻, ↑ alkaline phosphatase"], "ans": 0}, "N-PAT-L3-02": {"id": "N-PAT-L3-02", "stem": "An 11-year-old boy has a tumour in the medullary cavity of the femoral diaphysis. Biopsy shows sheets of small round blue cells with Homer Wright rosettes, and molecular testing shows an EWS/FLI mutation. In the lecture's classification of bone tumours by tissue of origin, to which group does this tumour belong?", "top": false, "rep": "", "tag": "Final bank PAT Q43", "bank": true, "expl": "This is Ewing's sarcoma/PNET, which the classification places with plasma cell myeloma in the myelogenic group. The unknown-origin group holds only giant cell tumour, and the osteogenic group holds osteoma, osteoid osteoma, osteoblastoma and osteosarcoma.", "type": "mcq", "opts": ["Osteogenic", "Chondrogenic", "Collagenous", "Myelogenic", "Unknown origin"], "ans": 3}, "N-PAT-L3-03": {"id": "N-PAT-L3-03", "stem": "A 50-year-old woman with primary hyperparathyroidism due to a parathyroid adenoma has a large osteolytic lesion in a long bone that resembles a bone tumour. Grossly the lesion is brown and haemorrhagic, and microscopy shows osteoclasts tunnelling into and dissecting along the trabeculae. Which X-ray finding is also expected in this condition?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is osteitis fibrosa cystica with a brown tumour of hyperparathyroidism: subperiosteal resorption thins the cortices and causes haemorrhage and cysts, seen on X-ray as subperiosteal bone resorption with cysts. Onion skin, sun rays and a sclerotic-rim nidus are the signs of Ewing's, osteosarcoma and osteoid osteoma.", "type": "mcq", "opts": ["Subperiosteal bone resorption with cysts", "Lamellated 'onion-skin' periosteal reaction", "Sun rays with Codman's triangle", "Radiolucent nidus < 2 cm with a dense sclerotic rim", "Knobby outgrowth with its cap pointing away from the epiphysis"], "ans": 0}, "N-PAT-L3-04": {"id": "N-PAT-L3-04", "stem": "A 40-year-old woman with long-standing vitamin D deficiency complains of diffuse bone and joint pain, proximal muscle weakness and muscle spasms, and recently had a fracture after minor trauma. Which mechanism underlies her bone disease?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Vitamin D deficiency in an adult is osteomalacia: hypocalcaemia and hypophosphataemia impair the mineralization of bone matrix proteins. Expansion of the growth plate is rickets, which occurs only in children before epiphyseal fusion.", "type": "mcq", "opts": ["Impaired mineralization of bone matrix proteins due to hypocalcaemia and hypophosphataemia", "Expansion of the growth plate with growth retardation", "Increased bone cell activity with peritrabecular fibrosis and cysts", "Neoplastic proliferation of the plasma cells of the bone marrow"], "ans": 0}, "N-PAT-L3-05": {"id": "N-PAT-L3-05", "stem": "Vitamin D obtained from food and sunlight must be activated before it can act. In which organ is 25-(OH) vitamin D converted to active 1,25-(OH)₂ vitamin D (calcitriol)?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Liver 25-hydroxylase forms 25-(OH) vitamin D, then kidney 1-α-hydroxylase forms 1,25-(OH)₂ vitamin D (calcitriol). The intestine is a target of calcitriol (↑ Ca²⁺ and PO₄³⁻ absorption), not the site of activation.", "type": "mcq", "opts": ["Liver", "Kidney", "Small intestine", "Bone", "Parathyroid gland"], "ans": 1}, "N-PAT-L3-06": {"id": "N-PAT-L3-06", "stem": "A 45-year-old man has a hard, smooth, sessile mass of the skull. CT shows a very dense, well-defined bony mass, and microscopy shows lamellar bone. If the lesion grows from the inner table of the skull, which effect may result?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is a compact (ivory) osteoma; growth from the inner table presses on vital structures, causing eyeball proptosis, paranasal sinusitis or conductive deafness, whereas disfigurement is the effect of outer-table growth. Night pain relieved by aspirin belongs to osteoid osteoma.", "type": "mcq", "opts": ["Eyeball proptosis", "Disfigurement", "Night pain relieved by aspirin", "Early blood-borne lung metastasis", "Hypercalcaemia with Bence Jones proteinuria"], "ans": 0}, "N-PAT-L3-07": {"id": "N-PAT-L3-07", "stem": "A 30-year-old woman notices a swelling of the proximal phalanx of her right index finger. X-ray shows a central, well-defined radiolucent area in the diaphysis with foci of calcification. Curettage yields semitranslucent, glistening cartilage, and microscopy shows lobules of hyaline cartilage. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A central, well-defined lucency with calcific foci in the diaphysis of a short bone of the hand, made of lobules of hyaline cartilage, is a solitary enchondroma. Chondrosarcoma also shows lucency with calcification, but it affects older patients in the central skeleton and shows atypical pleomorphic chondrocytes.", "type": "mcq", "opts": ["Osteochondroma", "Enchondroma", "Chondrosarcoma", "Osteoid osteoma", "Giant cell tumour"], "ans": 1}, "N-PAT-L3-08": {"id": "N-PAT-L3-08", "stem": "A 58-year-old man has a chondrosarcoma of the pelvis resected. Regarding the grading of this tumour, which statement is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In chondrosarcoma the grade determines prognosis: grade I shows mild atypia, grade II crowded cells, and grade III 'ugly-looking' cells and is by far the most likely to metastasize (Mild · Crowded · Ugly). Mild atypia with two cells in a lacuna describes grade I, not grade II.", "type": "mcq", "opts": ["Grade I shows crowded cells with perhaps a few bizarre cells", "Grade III (including the mesenchymal type) is the most likely to metastasize", "The grade has little effect on the prognosis of chondrosarcoma", "Grade II shows mild atypia with binucleate cells, two cells in a lacuna", "Grade II is the 'ugly-looking' grade with the worst outlook"], "ans": 1}, "N-PAT-L3-09": {"id": "N-PAT-L3-09", "stem": "A 28-year-old woman has a giant cell tumour of the distal femur excised. Microscopy shows stromal cells with no atypia, rare mitoses and numerous giant cells. Why is this tumour still considered potentially malignant?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The lesion is grade I (no atypia, rare mitosis, numerous giant cells), but GCT grading has no value except for grade III: even grade I can recur after surgical excision and metastasize to the lungs. Numerous giant cells point to grade I; grade III has few giant cells.", "type": "mcq", "opts": ["Even grade I can recur after excision and metastasize to the lungs", "Its stromal cells always show marked atypia and abundant mitoses", "It belongs to the myelogenic group of bone tumours", "Numerous giant cells indicate a grade III lesion", "It arises from malignant osteoblasts forming osteoid"], "ans": 0}, "N-PAT-L3-10": {"id": "N-PAT-L3-10", "stem": "A 62-year-old patient has a single lytic deposit in the proximal femur, and the skeletal survey shows no other lesions. Biopsy confirms metastatic carcinoma. Which primary tumour is most likely to give a solitary bone deposit?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Bone metastases are typically multifocal, but carcinomas of the kidney and thyroid give solitary deposits (the 'loners', K &amp; T).", "type": "mcq", "opts": ["Carcinoma of the prostate", "Carcinoma of the breast", "Carcinoma of the lung", "Carcinoma of the kidney", "Neuroblastoma"], "ans": 3}, "N-PAT-L3-11": {"id": "N-PAT-L3-11", "stem": "Compare rickets and osteomalacia (age, defect and clinical features), and mention the laboratory findings and treatment of vitamin D deficiency.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The disease name depends on age: with an open growth plate it is rickets (the plate expands); in the adult skeleton it is osteomalacia (the matrix fails to mineralize).", "type": "written", "keyhtml": "• Both are vitamin D deficiency disorders.\n• Rickets: children, before epiphyseal fusion; growth retardation + expansion of the growth plate. Specific signs: craniotabes, delayed closure of fontanelles, prominent frontal bone, rachitic rosary, protruding abdomen, genu varum.\n• Osteomalacia: adults; hypocalcaemia &amp; hypophosphataemia → impaired mineralization of bone matrix proteins; no specific signs.\n• Shared features: diffuse bone &amp; joint pain, proximal muscle weakness, bone fragility with ↑ risk of fractures, muscle spasms &amp; numbness.\n• Labs: ↓ vitamin D, ↓ blood Ca²⁺ → compensatory ↑ PTH → ↓ PO₄³⁻; ↑ alkaline phosphatase.\n• Treatment: vitamin D supplementation + treat the underlying cause. Prevention: vitamin D during pregnancy and for neonates &amp; infants."}, "N-PAT-L3-12": {"id": "N-PAT-L3-12", "stem": "Giant cell tumour of bone: mention its site, age and sex, X-ray, gross and microscopic features, and explain why it is considered potentially malignant.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "GCT is the epiphysio-metaphyseal 'soap-bubble' tumour of young adults, and its behaviour cannot be predicted from grade except for grade III.", "type": "written", "keyhtml": "• Definition: a locally aggressive (potentially malignant) bone tumour of unknown origin.\n• Site: epiphysis &amp; metaphysis around the knee (lower femur, upper tibia), upper humerus, lower radius.\n• Age/sex: 20–40 years; more in females.\n• X-ray: radiolucent mass expanding the bone with thinning of the cortex, traversed by sclerotic lines → soap-bubble appearance at the epiphysio-metaphyseal area.\n• Gross: soft, dark brown, fleshy, with cystic formation.\n• Microscopy: multinucleated giant cells + neoplastic stromal cells. Grade I: no atypia, rare mitosis, numerous giant cells; grade II: moderate atypia &amp; mitoses, fewer giant cells; grade III: marked atypia, abundant mitoses, few giant cells.\n• Potentially malignant because grading is of no value except for grade III: even grade I can recur after surgical excision and metastasize to the lungs."}, "TP-018": {"id": "TP-018", "stem": "Case: A 65-year-old man presents with a pathological fracture of a rib. X-ray of the skull reveals multiple coin-shaped osteolytic lesions. Biopsy shows sheets of atypical plasma cells with pleomorphic, hyperchromatic nuclei.\na) What is your diagnosis?\nb) What is the expected result of serum protein electrophoresis in this case?\nc) Mention two possible complications of this case.", "top": true, "rep": "", "tag": "Final bank PAT W38", "bank": true, "expl": "A pathological fracture with multiple punched-out lytic skull lesions and sheets of atypical plasma cells is plasma cell myeloma, the most common haematopoietic bone neoplasm. Its effects follow FACT: Fracture, Amyloidosis (primary), Cytopenias, Too much calcium.", "type": "written", "keyhtml": "a) Plasma cell myeloma (multiple myeloma) — a malignant myelogenic bone tumour arising from the plasma cells of the bone marrow.\nb) An immunoglobulin (Ig) spike — with Bence Jones proteinuria on urine electrophoresis — present in 99% of cases.\nc) Any two of: • primary amyloidosis → congestive heart failure, or nephrotic syndrome &amp; renal failure; • anaemia &amp; thrombocytopenia (marrow replacement); • hypercalcaemia (↑ osteoclastic activity) → metastatic calcification; • (further) pathological fractures (↑ osteoclastic activity)."}, "TP-036": {"id": "TP-036", "stem": "A 17-year-old male presents with a 1-cm tumour in the femur. He also has severe pain, worse at night and relieved by over-the-counter anti-inflammatory agents. Which of the following is the most likely diagnosis?", "top": true, "rep": "", "tag": "Final bank PAT Q81", "bank": true, "expl": "A small (&lt; 2 cm) femoral lesion in a young male with nocturnal pain relieved by aspirin (an anti-inflammatory) is osteoid osteoma (10–30 years, cortex of the metaphysis of femur and tibia). Osteoblastoma has the same histology but is larger than 2 cm and its dull, achy pain is not relieved by aspirin.", "type": "mcq", "opts": ["Osteoblastoma", "Osteosarcoma", "Osteoid osteoma", "Chondroblastoma", "Chondrosarcoma"], "ans": 2}, "TP-037": {"id": "TP-037", "stem": "A 35-year-old woman has multiple cartilaginous lesions in the short bones of her hand. A radiograph of the hand reveals bulbous swellings. A biopsy shows lobules of hyaline cartilage with scattered zones of chondrocyte proliferation. This patient is at risk of which of the following bone diseases?", "top": true, "rep": "", "tag": "Final bank PAT Q82", "bank": true, "expl": "Multiple chondromas (lobules of hyaline cartilage) in the short bones of the hand are enchondromatosis. Chondrosarcoma arises either de novo or secondarily on top of multiple enchondromas or an osteochondroma.", "type": "mcq", "opts": ["Chondrosarcoma", "Giant cell tumour of bone", "Osteosarcoma", "Ewing sarcoma", "Synovial sarcoma"], "ans": 0}, "TP-109": {"id": "TP-109", "stem": "Case: A 50-year-old man suffers from anaemia. Blood examination shows hypercalcaemia and monoclonal immunoglobulins. X-ray reveals multiple lytic, punched-out lesions in the skull and both humeri. One year later, the patient develops renal failure.\na) What is the most likely bone lesion?\nb) Justify the cause of the hypercalcaemia and the renal failure in this case.", "top": true, "rep": "", "tag": "Final bank PAT W39", "bank": true, "expl": "Anaemia, a monoclonal immunoglobulin, hypercalcaemia and punched-out lytic skull lesions indicate plasma cell myeloma. Increased osteoclastic activity causes the hypercalcaemia, and the primary amyloidosis of myeloma leads to nephrotic syndrome and renal failure.", "type": "written", "keyhtml": "a) Plasma cell myeloma (multiple myeloma) — anaemia (marrow replacement), an immunoglobulin spike, hypercalcaemia and multiple punched-out radiolucent lesions with no sclerosis in the skull.\nb) • Hypercalcaemia: increased osteoclastic activity (bone resorption — the same ↑ osteoclastic activity also causes the pathological fractures).\n• Renal failure: primary amyloidosis of myeloma → nephrotic syndrome &amp; renal failure."}, "TP-110": {"id": "TP-110", "stem": "Complete the following: The characteristic X-ray feature of osteosarcoma is ____, while that of osteochondroma is ____.", "top": true, "rep": "", "tag": "Final bank PAT W40", "bank": true, "expl": "Sun rays (neoplastic bone perpendicular to the long axis) plus Codman's triangle (reactive bone where the tumour lifts the periosteum off the cortex) signal osteosarcoma. Osteochondroma is a cartilage-capped bony outgrowth whose knobby surface makes an acute angle with the cortex and points away from the epiphysis.", "type": "written", "keyhtml": "Osteosarcoma: sun-ray (sunburst) appearance with Codman's triangle. Osteochondroma: a well-circumscribed bony outgrowth (mushroom-shaped) from the metaphysis with a knobby surface, making an acute angle with the cortex, its cap pointing away from the adjacent epiphysis."}, "TP-119": {"id": "TP-119", "stem": "Give reason for the following effects in multiple myeloma:\n1. Pathological fracture\n2. Primary amyloidosis\n3. Anaemia & thrombocytopenia\n4. Hypercalcaemia & metastatic calcification", "top": true, "rep": "", "tag": "Final bank PAT W41", "bank": true, "expl": "Effects of myeloma: pathological fracture (↑ osteoclastic activity); primary amyloidosis → congestive heart failure, or nephrotic syndrome &amp; renal failure; anaemia &amp; thrombocytopenia — marrow replacement; hypercalcaemia &amp; metastatic calcification. Bence Jones proteinuria is found in 99%. Mnemonic FACT — Fracture · Amyloidosis · Cytopenias · Too much Ca²⁺.", "type": "written", "keyhtml": "1. Pathological fracture: due to ↑ osteoclastic activity from factors secreted by malignant plasma cells, causing osteolytic bone destruction.\n2. Primary amyloidosis: due to overproduction of Bence Jones proteins (light chains) depositing as AL amyloid in the heart (heart failure) and kidneys (nephrotic syndrome &amp; renal failure).\n3. Anaemia &amp; thrombocytopenia: due to bone marrow replacement by malignant plasma cells, suppressing normal blood cell formation.\n4. Hypercalcaemia &amp; metastatic calcification: due to severe bone resorption releasing calcium into the blood, which then deposits in normal soft tissues."}, "PRQ-132": {"id": "PRQ-132", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Chondroma", "Giant cell tumour", "Osteosarcoma", "Osteochondroma"], "ans": 1, "top": false, "rep": "", "tag": "Practical · Lab 1 – Bone tumours", "bank": false, "img": ["prac/q132.jpg"], "expl": "The practical slide \"Giant Cell Tumor\" (Lab 1 – Bone tumours)."}, "PRQ-112": {"id": "PRQ-112", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Chondroma", "Giant cell tumour", "Osteosarcoma", "Osteochondroma"], "ans": 0, "top": false, "rep": "", "tag": "Practical · Lab 1 – Bone tumours", "bank": false, "img": ["prac/q112.jpg"], "expl": "The practical slide \"Chondroma of Hand\" (Lab 1 – Bone tumours)."}, "PRQ-123": {"id": "PRQ-123", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Giant cell tumour", "Osteochondroma", "Osteosarcoma", "Chondroma"], "ans": 2, "top": false, "rep": "", "tag": "Practical · Lab 1 – Bone tumours", "bank": false, "img": ["prac/q123.jpg"], "expl": "The practical slide \"Osteosarcoma x ray\" (Lab 1 – Bone tumours)."}, "PRQ-117": {"id": "PRQ-117", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Osteosarcoma", "Osteochondroma", "Chondroma", "Giant cell tumour"], "ans": 1, "top": false, "rep": "", "tag": "Practical · Lab 1 – Bone tumours", "bank": false, "img": ["prac/q117.jpg"], "expl": "The practical slide \"Osteochondroma x-ray/ mushroom appearance\" (Lab 1 – Bone tumours)."}}, "labs": {"sl111": {"id": "sl111", "type": "slide", "title": "Malignant tumors Benign tumors", "img": "prac/s111.jpg", "labels": [{"t": "Osteosarcoma (gross + microscopic)", "x": 56.36, "y": 32.92, "w": 25.7, "h": 11.37, "id": "l0"}, {"t": "Locally malignant tumors", "x": 35.4, "y": 65.69, "w": 34.72, "h": 7.23, "id": "l1"}, {"t": "Giant cell tumor (microscopic )", "x": 35.97, "y": 80.49, "w": 34.04, "h": 6.03, "id": "l2"}], "src": "From the practical slides · Lab 1 – Bone tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl113": {"id": "sl113", "type": "slide", "title": "Bone tumours · slide 3", "img": "prac/s113.jpg", "labels": [{"t": "Left hand (Adult)", "x": 44.68, "y": 5.17, "w": 17.49, "h": 5.42, "id": "l0"}, {"t": "Specimen: Comment :", "x": 13.24, "y": 12.01, "w": 13.92, "h": 12.99, "id": "l1"}, {"t": "Cut surface : (mass)", "x": 13.24, "y": 25.75, "w": 20.24, "h": 5.42, "id": "l2"}, {"t": "Sum: single", "x": 13.24, "y": 33.75, "w": 11.81, "h": 5.42, "i
