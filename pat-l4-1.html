artilaginous matrix balance", "items": [["Chondrocytes balance synthesis (collagen", "II &amp; proteoglycans) vs degradation (matrix-degrading enzymes)"], ["Balance disturbed by", "aging, mechanical stresses, genetic factors, unknowns"]]}]}], "labName": "Recall · Osteoarthritis — Pathogenesis & Pathology (1/3)"}, {"id": "p40", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-5-1", "title": "Recall · Osteoarthritis — Pathogenesis & Pathology (2/3)", "groups": [{"title": "6.4 Evolution of osteoarthritis (stages 1–4)", "items": [["Stage 1:", "healthy cartilage lubricated by synovial fluid protects bone"], ["Stage 2:", "cartilage thins, then splits &amp; fissures through whole thickness"], ["Stage 3:", "erosion; fragments dislodged → free-floating particles; osteophytes at joint margins"], ["Stage 4:", "exposed subchondral bone thickened &amp; polished (ivory-like, eburnation)"], ["Stage 4:", "synovial fluid leaks through defects → bone cysts"]]}, {"title": "6.5 Normal vs osteoarthritis — morphology", "items": [["Thickened capsule; cyst", "formation; thickening of subchondral bone"], ["Cracking of cartilage", "osteophytes; synovial hypertrophy; polished (ivory-like) bone"]]}]}], "labName": "Recall · Osteoarthritis — Pathogenesis & Pathology (2/3)"}, {"id": "p41", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-5-2", "title": "Recall · Osteoarthritis — Pathogenesis & Pathology (3/3)", "groups": [{"title": "6.6 Radiologically", "items": [["Increased subchondral bone", "thickness; osteophyte (peripheral growth of bone)"], ["Cyst; loss of joint space", "X-ray knee shows narrow joint space and bone spur"]]}]}], "labName": "Recall · Osteoarthritis — Pathogenesis & Pathology (3/3)"}, {"id": "p42", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PAT-L4-1-09"}]}, {"id": "p43", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PAT-L4-1-06"}]}, {"id": "p44", "head": "Part 07 · OA — Clinical Features & Investigations", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "OA — Clinical Features & Investigations", "sub": "Clinical features of osteoarthritis · Hand changes in OA · Investigation"}, {"t": "h", "no": "7.1", "title": "Clinical features of osteoarthritis", "top": true, "rep": true}, {"t": "list", "items": ["Gradual onset usually above 50 years (primary); <mark>one or few<\/mark> joints", "<b>Joints:<\/b> <mark>hips<\/mark>, <mark>knees<\/mark>, lower lumbar and cervical vertebrae, <mark>phalangeal joints<\/mark>", "Stiffness and <mark>deep aching<\/mark> pain increasing with repeated use", "<mark>Crepitus<\/mark>: crackling from exposed bone surfaces rubbing", "Joint swelling with <mark>small effusion<\/mark>; Heberden nodes"]}, {"t": "h", "no": "7.2", "title": "Hand changes in OA"}, {"t": "list", "items": ["<b>Heberden's node:<\/b> small <mark>osteophytes<\/mark> on <mark>DIP<\/mark> joints", "<b>Bouchard's node:<\/b> <mark>PIP<\/mark> joints (figure label, older version)", "<mark>Square thumb<\/mark>: base of thumb (figure arrow, older version)"]}], "toc": ["07", "OA — Clinical Features & Investigations"]}, {"id": "p45", "head": "Part 07 · OA — Clinical Features & Investigations", "kind": "text", "blocks": [{"t": "list", "items": ["<b>Older mnemonic:<\/b> B before H, P before D"]}, {"t": "h", "no": "7.3", "title": "Investigation", "top": true, "rep": true}, {"t": "list", "items": ["<b>Bloods:<\/b> ESR, CRP (no RF)", "<b>4 cardinal X-ray signs:<\/b> subchondral sclerosis, osteophytes, narrowing of joint space, subchondral cysts"]}, {"t": "note", "kind": "mn", "html": "SONS"}]}, {"id": "p46", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-6-0", "title": "Recall · OA — Clinical Features & Investigations (1/2)", "groups": [{"title": "7.1 Clinical features of osteoarthritis", "items": [["Gradual onset usually above", "50 years (primary); one or few joints"], ["Joints:", "hips, knees, lower lumbar and cervical vertebrae, phalangeal joints"], ["Stiffness and deep", "aching pain increasing with repeated use"], ["Crepitus:", "crackling from exposed bone surfaces rubbing"], ["Joint swelling", "with small effusion; Heberden nodes"]]}, {"title": "7.2 Hand changes in OA", "items": [["Heberden's node:", "small osteophytes on DIP joints"], ["Bouchard's node:", "PIP joints (figure label, older version)"], ["Square thumb:", "base of thumb (figure arrow, older version)"], ["Older mnemonic:", "B before H, P before D"]]}]}], "labName": "Recall · OA — Clinical Features & Investigations (1/2)"}, {"id": "p47", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-6-1", "title": "Recall · OA — Clinical Features & Investigations (2/2)", "groups": [{"title": "7.3 Investigation", "items": [["Bloods:", "ESR, CRP (no RF)"], ["4 cardinal X-ray signs:", "subchondral sclerosis, osteophytes, narrowing of joint space, subchondral cysts"]]}]}], "labName": "Recall · OA — Clinical Features & Investigations (2/2)"}, {"id": "p48", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0534"}]}, {"id": "p49", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "Q0648"}]}, {"id": "p50", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0548"}]}, {"id": "p51", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0555"}, {"t": "check", "q": "N-PAT-L4-1-07"}]}, {"id": "p52", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0600"}]}, {"id": "p53", "head": "Part 08 · RA vs OA Compared", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "RA vs OA Compared", "sub": "RA vs OA — the lecture's table · Other differences / master table"}, {"t": "h", "no": "8.1", "title": "RA vs OA — the lecture's table", "top": true}, {"t": "list", "items": ["<b>Age:<\/b> RA any age (middle age) vs OA later in life", "<b>Onset:<\/b> RA rapid (weeks–months) vs OA slow (years)", "<b>Distribution:<\/b> RA <mark>symmetrical polyarthritis<\/mark> vs OA asymmetrical monoarthritis → polyarthritis", "<b>Joints:<\/b> RA small joints of hands/feet vs OA weight-bearing knees, hips", "<b>Morning stiffness:<\/b> RA <mark>&gt; 1 hour<\/mark> vs OA <mark>&lt; 1 hour<\/mark>, worse at end of day", "Systemic symptoms (fatigue, fever, night sweats) in RA only"]}, {"t": "h", "no": "8.2", "title": "Other differences / master table"}, {"t": "list", "items": ["RA autoimmune inflammatory vs OA degenerative", "<b>RA:<\/b> synovitis → pannus → ankylosis; OA: cartilage loss, osteophytes, eburnation, cysts", "<b>Bloods:<\/b> RA ESR, CRP, RF vs OA ESR, CRP"]}], "toc": ["08", "RA vs OA Compared"]}, {"id": "p54", "head": "Part 08 · RA vs OA Compared", "kind": "text", "blocks": [{"t": "list", "items": ["<b>X-ray:<\/b> RA osteopenia, erosions, uniform narrowing vs OA SONS", "<b>Older:<\/b> X-ray sign → disease table; joint space narrowing in both (uniform in RA)", "<b>Older mnemonic:<\/b> RA eats bone, OA builds bone"]}]}, {"id": "p55", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-7-0", "title": "Recall · RA vs OA Compared (1/2)", "groups": [{"title": "8.1 RA vs OA — the lecture's table", "items": [["Age:", "RA any age (middle age) vs OA later in life"], ["Onset:", "RA rapid (weeks–months) vs OA slow (years)"], ["Distribution:", "RA symmetrical polyarthritis vs OA asymmetrical monoarthritis → polyarthritis"], ["Joints:", "RA small joints of hands/feet vs OA weight-bearing knees, hips"], ["Morning stiffness:", "RA &gt; 1 hour vs OA &lt; 1 hour, worse at end of day"], ["Systemic symptoms (fatigue", "fever, night sweats) in RA only"]]}]}], "labName": "Recall · RA vs OA Compared (1/2)"}, {"id": "p56", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-7-1", "title": "Recall · RA vs OA Compared (2/2)", "groups": [{"title": "8.2 Other differences / master table", "items": [["RA autoimmune", "inflammatory vs OA degenerative"], ["RA:", "synovitis → pannus → ankylosis; OA: cartilage loss, osteophytes, eburnation, cysts"], ["Bloods:", "RA ESR, CRP, RF vs OA ESR, CRP"], ["X-ray:", "RA osteopenia, erosions, uniform narrowing vs OA SONS"], ["Older:", "X-ray sign → disease table; joint space narrowing in both (uniform in RA)"], ["Older mnemonic:", "RA eats bone, OA builds bone"]]}]}], "labName": "Recall · RA vs OA Compared (2/2)"}, {"id": "p57", "head": "Part 08 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "TP-072"}, {"t": "flap", "q": "Q0521"}]}, {"id": "p58", "head": "Part 08 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "TP-096"}]}, {"id": "p59", "head": "Part 09 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "09", "title": "Rapid Revision", "sub": "One-liners, mnemonics, numbers, spot the disease"}, {"t": "h", "no": "", "title": "One-liners, mnemonics, numbers, spot the disease"}, {"t": "list", "items": ["<b>Numbers:<\/b> 40–60 y RA onset; 3:1 F:M; 1 in 100; ≥ 3 joints; 4 of 7 criteria", "<b>Numbers:<\/b> RA stiffness &gt; 1 h; OA &gt; 50 y; 4 cardinal OA X-ray signs", "<b>Spot (older):<\/b> villous synovium/pannus = RA; eburnation, free cartilage fragments = OA"]}, {"t": "note", "kind": "mn", "html": "3 S's, LVSEF, NVLEMA, MATS+NRX, SONS"}], "toc": ["09", "Rapid Revision"]}, {"id": "p60", "head": "Lab · Recall · Part 09", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-1-8-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonics, numbers, spot the disease", "items": [["Numbers:", "40–60 y RA onset; 3:1 F:M; 1 in 100; ≥ 3 joints; 4 of 7 criteria"], ["Numbers:", "RA stiffness &gt; 1 h; OA &gt; 50 y; 4 cardinal OA X-ray signs"], ["Spot (older):", "villous synovium/pannus = RA; eburnation, free cartilage fragments = OA"], ["Mnemonics:", "3 S's, LVSEF, NVLEMA, MATS+NRX, SONS"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p61", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "RA typical joints are PIP &amp; MCP; Heberden's nodes (OA) are on DIP"}, {"t": "note", "kind": "trap", "html": "Fingers deviate ulnar, wrist deviates radial"}, {"t": "note", "kind": "trap", "html": "Onset: insidious on C/P slide but 'rapid, weeks to months' in RA vs OA table; OA slow (years)"}, {"t": "note", "kind": "trap", "html": "Rheumatoid factor is ± — may or may not be high; only one of 7 criteria"}, {"t": "note", "kind": "trap", "html": "Amyloidosis in RA is secondary"}, {"t": "note", "kind": "trap", "html": "Ankylosis order: fibrous first, then ossifies to bony"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p62", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "OA starts asymmetrical monoarthritis → becomes polyarthritis"}, {"t": "note", "kind": "trap", "html": "Morning stiffness: RA &gt; 1 h; OA &lt; 1 h, worse at end of day"}, {"t": "note", "kind": "trap", "html": "RF is RA blood test only; OA bloods are ESR &amp; CRP"}, {"t": "note", "kind": "trap", "html": "MRI = greatest sensitivity for synovitis; US = early soft-tissue lesions"}, {"t": "note", "kind": "cl", "html": "Rheumatoid nodules on extensor forearm: fibrinoid necrosis with palisaded histiocytes"}, {"t": "note", "kind": "cl", "html": "RA vasculitis → skin ulcers and Raynaud's phenomenon"}]}, {"id": "p63", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Crepitus in OA from exposed bone surfaces rubbing together"}, {"t": "note", "kind": "cl", "html": "OA pain and stiffness increase with repeated joint use"}]}, {"id": "p64", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0521": {"id": "Q0521", "stem": "Compare between rheumatoid arthritis and osteoarthritis.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W25", "bank": true, "expl": "RA is a rapid-onset, symmetrical, autoimmune polyarthritis of small joints with long morning stiffness and systemic symptoms. OA is a slow, degenerative disease of weight-bearing joints that starts asymmetrical and mono-articular, with short stiffness that worsens after activity.", "type": "written", "keyhtml": "Feature | Rheumatoid arthritis | Osteoarthritis\nNature | Multisystem autoimmune inflammatory condition | Degenerative joint disease\nAge of onset | Can happen at any age (more in middle age) | Usually later in life\nSpeed of onset | Rapid — weeks to months | Slow — over years\nDistribution | Symmetrical polyarthritis | Initially asymmetrical monoarthritis → polyarthritis\nJoints affected | Small joints of hands and feet (PIP, MCP) | Weight-bearing joints — knees, hips\nDuration of morning stiffness | Stiffness worse in the morning, &gt; 1 hour | Stiffness &lt; 1 hour, worse at the end of the day (after activity)\nSystemic symptoms | Fatigue, fever, night sweats | —\nBloods | ESR, CRP, RF | ESR, CRP\nX-ray | Peri-articular osteopenia, uniform symmetric joint-space narrowing, marginal subchondral erosions, subluxations | Subchondral sclerosis, osteophytes, narrowing of joint space, subchondral cysts (SONS)\nKey lesion | Chronic synovitis → pannus → erosion of cartilage &amp; bone → fibrous then bony ankylosis | Cartilage thinning, fissuring, erosion → eburnation, osteophytes, subchondral cysts\nHands | MCP/PIP swelling, flexion + ulnar deviation of fingers, radial deviation of wrist, swan-neck, boutonnière, rheumatoid nodules | Heberden's nodes (DIP), Bouchard's nodes (PIP), square thumb"}, "Q0530": {"id": "Q0530", "stem": "A 35-year-old woman has experienced malaise, fatigue, and joint pain for the past 5 months. She has had progressive loss of joint motion, making it more difficult to walk and to use her hands. On physical examination, the joint involvement is symmetric, and most of the affected joints are in the hands and feet. The involved joints are swollen and warm to the touch. The right second and third digits have a “swan neck” deformity, and there is ulnar deviation of both hands. Which of the following laboratory findings is most likely to be reported in this patient?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q48", "bank": true, "expl": "Symmetric involvement of the small joints of the hands and feet, a swan-neck deformity and ulnar deviation of the fingers, with fatigue and malaise, point to rheumatoid arthritis, whose blood tests are ESR, CRP and rheumatoid factor. Hyperuricaemia and calcium pyrophosphate crystals are the findings of gout and pseudogout, not RA.", "type": "mcq", "opts": ["Positive Borrelia burgdorferi serologic test", "Positive acid-fast stain of joint tissue", "Serum positive for rheumatoid factor", "Hyperuricemia", "Calcium pyrophosphate crystals in a joint aspirate"], "ans": 2}, "Q0534": {"id": "Q0534", "stem": "A 71-year-old man has experienced aching pain in the right knee, lower back, right distal fifth finger, and neck over the past 10 years. He notices that the joints feel slightly stiff in the morning, but this passes quickly. The pain is worse toward the end of the day. On physical examination, there is no joint swelling, warmth, or deformity. Some joint crepitus is audible on moving the knee. Laboratory studies show normal levels of serum calcium, phosphorus, alkaline phosphatase, and uric acid. What is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q44", "bank": true, "expl": "Years of aching pain in the knee, lower back, neck and a distal finger joint, brief morning stiffness (&lt; 1 hour), pain worse at the end of the day and crepitus in a patient above 50 are the picture of osteoarthritis, a degenerative joint disease. Rheumatoid arthritis gives symmetrical swelling of the small hand joints with morning stiffness &gt; 1 hour, and gout requires hyperuricaemia, whereas the uric acid here is normal.", "type": "mcq", "opts": ["Ankylosing spondylitis", "Gouty arthritis", "Osteoarthritis", "Rheumatoid arthritis"], "ans": 2}, "Q0548": {"id": "Q0548", "stem": "An otherwise healthy 44-year-old man with no prior medical history has had increasing back pain and right hip pain for the past decade. The pain is worse at the end of the day. On physical examination he has bony enlargement of the distal interphalangeal joints. A radiograph of the spine reveals prominent osteophytes involving the vertebral bodies. There is sclerosis with narrowing of the joint space at the right acetabulum on a radiograph of the pelvis. Which of the following diseases is he most likely to have?", "top": false, "rep": "", "tag": "Final bank PAT Q50", "bank": true, "expl": "Slowly progressive spine and hip pain worse at the end of the day, bony enlargement of the DIP joints (Heberden's nodes, small osteophytes) and osteophytes, sclerosis and joint-space narrowing on X-ray are osteoarthritis. RA affects the PIP and MCP joints and shows peri-articular osteopenia and marginal erosions instead.", "type": "mcq", "opts": ["Gout", "Rheumatoid arthritis", "Osteoarthritis", "Osteomyelitis"], "ans": 2}, "Q0555": {"id": "Q0555", "stem": "A 50-year-old man has experienced pain in his right knee for the past 4 years. The pain is worse when walking for longer distances. On physical examination there is no joint swelling, warmth, or erythema, but he does have decreased range of motion. Which of the following conditions is he most likely to have?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Years of knee pain that increases with repeated use, with reduced range of motion and no swelling, warmth or erythema, in a 50-year-old fits osteoarthritis: joint pain with functional limitation of a weight-bearing joint. Osteomalacia causes diffuse bone and joint pain with proximal muscle weakness rather than a single painful knee.", "type": "mcq", "opts": ["Osteoporosis", "Osteomalacia", "Osteoarthritis", "Osteopetrosis"], "ans": 2}, "Q0600": {"id": "Q0600", "stem": "A 60-year-old writer presented with chronic pain in the interphalangeal joints of his left hand that was exaggerated after coming back from work. On examination there was crepitus in the joints. What is the expected X-ray feature for this patient?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q45", "bank": true, "expl": "Chronic interphalangeal pain made worse by use, with crepitus, in a 60-year-old is osteoarthritis, whose X-ray signs are subchondral sclerosis, osteophytes (bone proliferation at the joint margins), narrowing of the joint space and subchondral cysts. Peri-articular osteopenia, ulnar deviation and swan-neck deformity are findings of rheumatoid arthritis.", "type": "mcq", "opts": ["Swan-neck appearance", "Periarticular osteopenia", "Periarticular osteophytes", "Ulnar deviation"], "ans": 2}, "Q0601": {"id": "Q0601", "stem": "Case: A 45-year-old woman presents with a six-month history of joint pain, stiffness in the morning lasting over an hour, and swelling in her wrists and small joints of her hands. Social history: works as a secretary and has been late for work; pain has disrupted her morning routine. Smokes 15 cigarettes/day. On examination: slightly swollen and tender MCP and PIP joints of both hands; firm, non-tender subcutaneous nodule at the elbow. Blood tests of CBC, creatinine, ESR, CRP, RF and anti-CCP were done. Imaging revealed soft-tissue swelling occupying the joint space, bony erosions, subluxation and periarticular osteopenia.\n1. What is your most likely diagnosis? And why?\n2. What are the most likely risk factors?\n3. Explain the pathogenesis of the disease.\n4. What is the most specific laboratory test for diagnosis?\n5. What are the gross & microscopic features?\n6. What are the differential diagnoses? And how to exclude other similar possibilities from history?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT W23", "bank": true, "expl": "Symmetric MCP/PIP arthritis with morning stiffness over an hour, a rheumatoid nodule and erosions with periarticular osteopenia point to rheumatoid arthritis, for which anti-CCP is the most specific test. It is an autoimmune chronic papillary synovitis: T-cell cytokines drive synovial hyperplasia and a pannus that erodes cartilage and bone.", "type": "written", "keyhtml": "1. Rheumatoid arthritis. Why: female (F : M = 3 : 1); symmetric polyarticular arthritis — small joints affected first (MCP &amp; PIP of both hands; DIP joints spared), then the wrist; morning stiffness &gt; 1 hour; subcutaneous rheumatoid nodule at the elbow; RF and anti-CCP requested; imaging: soft-tissue swelling, bony erosions, subluxation, periarticular osteopenia. Constitutional symptoms (weakness, malaise, low-grade fever) and extra-articular manifestations (e.g. anaemia, dyspnoea) may accompany it.\n2. Autoimmune disease in genetically susceptible persons (HLA-DR4) triggered by environmental factors — smoking (she smokes 15 cigarettes/day) and infection (parvovirus B19). [Genetic · environmental · autoimmune]\n3. Antigen (? virus) + genetic factors → T lymphocytes → cytokines, which act on:\n• B lymphocytes → antibodies (IgM) → antigen–antibody complexes;\n• endothelium → endothelial proliferation;\n• macrophages → cytokines → synovial cell hyperplasia and fibroblast proliferation, and (via chondrocytes &amp; osteoclasts) erosion of cartilage &amp; bone.\n4. Anti-CCP antibodies (antibodies against cyclic citrullinated peptides) — the most specific test for the diagnosis of rheumatoid arthritis.\n5. • Gross: synovium thickened, oedematous, with frond-like (villous) projections (pannus); destruction &amp; erosion of cartilage &amp; bone; ↓ joint space → fibrosis &amp; calcification → permanent ankylosis.\n• Microscopic (chronic papillary synovitis): synovial cell hyperplasia + infiltration of the synovial stroma by inflammatory cells — lymphocytes (mostly CD4+ T helper cells), B cells, plasma cells, macrophages — with granulation tissue (pannus).\n6. • Osteoarthritis: non-inflammatory; Heberden/Bouchard nodes; worse with activity; asymmetric.\n• Gout: acute monoarthritis (often); crystals in synovial fluid; tophi.\n• Septic arthritis: usually monoarticular; fever; high WBC count in synovial fluid.\n• Systemic lupus erythematosus (SLE): malar rash, oral ulcers, photosensitivity, ANA positive."}, "Q0648": {"id": "Q0648", "stem": "Case: A 51-year-old man has experienced aching pain in the right knee, lower back, right distal fifth finger, and neck over the past 10 years. He notices that the joints feel stiff in the morning, but this passes quickly. The pain is worse toward the end of the day. On physical examination, there is no joint swelling, warmth, or deformity. Some joint crepitus is audible on moving the knee. Laboratory studies show normal levels of serum calcium, phosphorus, alkaline phosphatase, and uric acid. X-ray revealed subchondral sclerosis, osteophytes, narrowing of joint space, subchondral cysts.\n1. What is your most likely diagnosis? And why?\n2. What are the most likely predisposing factors for this condition in light of the patient's history?\n3. Explain the pathogenesis of the disease.\n4. What are the differential diagnoses? And how to exclude other similar possibilities from history?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT W24", "bank": true, "expl": "Slow-onset pain of the knee, spine and a DIP joint with brief morning stiffness, end-of-day pain, crepitus, normal uric acid and the four X-ray signs (narrowing, osteophytes, subchondral sclerosis and cysts) make this osteoarthritis. Its root is a disturbed chondrocyte balance between matrix synthesis and degradation, which leads to cartilage loss, osteophytes, eburnation and bone cysts.", "aimg": ["figs/Q0651_ans.jpg", "figs/Q0651_ans2.jpg"], "acap": "RA vs OA comparison table; OA pathogenesis (chondrocyte stimulation → cartilage loss → subchondral changes)", "type": "written", "keyhtml": "1. Osteoarthritis (degenerative joint disease). Why: age above 50 with slow onset over 10 years; typical OA joints — knee, lower back (lumbar spine), neck (cervical spine) and a distal finger (DIP) joint; morning stiffness that passes quickly (&lt; 1 hour) with pain worse toward the end of the day (after activity); crepitus; no swelling, warmth or deformity (non-inflammatory); normal calcium, phosphorus, ALP and uric acid; X-ray shows the 4 cardinal signs — NOSS: Narrowing of joint space, Osteophytes, Subchondral sclerosis, Subchondral cysts.\n2. A wear-and-tear phenomenon: mechanical stresses; aging; female gender; genetic factors; obesity; high-impact physical activity; previous joint injury; rheumatoid arthritis or gout. (In the hand, OA affects the 1st carpometacarpal, DIP and PIP joints.) In his history: age (51, with a 10-year history) and long-standing mechanical stress on weight-bearing joints (knee, spine).\n3. • Initiating factors (aging, obesity, trauma, malalignment) → mechanical stress on joints → chondrocyte stimulation.\n• Early OA (repair): chondrocytes ↑ synthesis of type II collagen and proteoglycans.\n• Later: chondrocytes release degradative enzymes such as matrix metalloproteinases (MMPs) → loss of proteoglycans and collagen → cartilage softens, fibrillates and erodes.\n• Synovium and chondrocytes release IL-1, TNF-α, IL-6 and prostaglandins (mild inflammation).\n• Subchondral bone changes → sclerosis, cysts, osteophytes → clinical osteoarthritis (pain, stiffness, deformity).\n• (Lecture version: the chondrocytes' balance between matrix synthesis — collagen II &amp; proteoglycans — and degradation by matrix-degrading enzymes is disturbed by aging, mechanical stresses, genetic factors and unknowns → cartilage thins, splits &amp; fissures and erodes, with free-floating fragments; osteophytes; eburnation; bone cysts.)\n4. • Rheumatoid arthritis — excluded by the RA vs OA differences: slow onset over years (RA: weeks–months); asymmetric weight-bearing joints and a DIP joint (RA: symmetric small joints — MCP, PIP, wrist; DIP spared); joints not swollen, warm or tender (RA: tender, soft, warm joints); stiffness &lt; 1 hour, worse at the end of the day (RA: &gt; 1 hour, worse in the morning); no systemic or extra-articular features; in OA RF and anti-CCP are negative with normal ESR &amp; CRP.\n• Gout — excluded by the normal serum uric acid (gout is due to hyperuricaemia)."}, "Q0709": {"id": "Q0709", "stem": "Which of the following is a characteristic feature of rheumatoid arthritis (RA)?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q49", "bank": true, "expl": "Subcutaneous rheumatoid nodules on the extensor surface of the forearm are a systemic manifestation of RA and one of its seven diagnostic criteria. Asymmetric involvement and osteophytes are features of osteoarthritis, and high uric acid points to gout.", "type": "mcq", "opts": ["Asymmetric joint involvement", "Presence of rheumatoid nodules", "High levels of uric acid", "Formation of osteophytes"], "ans": 1}, "Q0734": {"id": "Q0734", "stem": "Which of the following clinical presentations applies to rheumatoid arthritis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q46", "bank": true, "expl": "Rheumatoid arthritis is a symmetrical polyarthropathy of small joints — the PIP and MCP joints of the hands and feet (the 3 S's) — and its stiffness is worse in the morning, lasting more than 1 hour. Involvement of the weight-bearing hips and knees and an initially asymmetrical mono-articular onset belong to osteoarthritis.", "type": "mcq", "opts": ["Bilateral symmetrical", "Oligoarticular", "Common affection of hip and knee joints", "Joint stiffness at night"], "ans": 0}, "Q0736": {"id": "Q0736", "stem": "A 72-year-old gentleman has presented to the acute medical unit (AMU) with progressively worsening shortness of breath. He also has digital clubbing, a dry cough and diffuse fine inspiratory crackles are noted on auscultation. Pulmonary nodules are found on the lungs on CT scan. Which of the following rheumatological conditions is most likely to have caused this pathology?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT Q47", "bank": true, "expl": "The lung lesions of rheumatoid arthritis are pleuritis, pleural effusion, rheumatoid nodules in the lung and diffuse or nodular pulmonary fibrosis, matching the nodules, clubbing and fine crackles here. Osteoarthritis is a degenerative joint disease without systemic manifestations.", "type": "mcq", "opts": ["Rheumatoid arthritis", "Osteoarthritis", "Reactive arthritis", "Systemic lupus erythematosus", "Psoriatic arthritis"], "ans": 0}, "N-PAT-L4-1-01": {"id": "N-PAT-L4-1-01", "stem": "A 60-year-old woman with long-standing rheumatoid arthritis has a knee that has become progressively stiff. A synovial specimen shows a thickened, oedematous synovium with frond-like (villous) projections; this tissue, made of inflammatory cells, granulation tissue and fibroblasts, grows over the articular cartilage. Which sequence describes how this tissue eventually fixes the joint?", "top": false, "rep": "", "tag": "Final bank PAT Q51", "bank": true, "expl": "This tissue is pannus: after it destroys the cartilage, it bridges the opposing bones to form a fibrous ankylosis, which eventually ossifies into a bony ankylosis (fibrous first, never the reverse). Thinning, fissuring, eburnation and osteophytes describe the evolution of osteoarthritis.", "type": "mcq", "opts": ["Erodes the articular cartilage → bridges the opposing bones → fibrous ankylosis → ossifies into bony ankylosis", "Erodes the articular cartilage → bridges the opposing bones → bony ankylosis → softens into fibrous ankylosis", "Cartilage thins and fissures → subchondral bone thickens and becomes polished → bone cysts form", "Cartilage fragments dislodge → osteophytes form at the joint margins → joint space is lost"], "ans": 0}, "N-PAT-L4-1-02": {"id": "N-PAT-L4-1-02", "stem": "A 47-year-old woman with rheumatoid arthritis has marginal erosions of the MCP joints on X-ray. In the pathogenesis of RA, the cytokines of which cell act on chondrocytes and osteoclasts to erode cartilage and bone?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "T-lymphocyte cytokines activate macrophages, and macrophage cytokines act on chondrocytes and osteoclasts to erode cartilage and bone (they also drive synovial cell hyperplasia and fibroblast proliferation). B lymphocytes instead produce IgM antibodies that form Ag–Ab complexes.", "type": "mcq", "opts": ["B lymphocyte", "Endothelial cell", "Macrophage", "Plasma cell", "Mast cell"], "ans": 2}, "N-PAT-L4-1-03": {"id": "N-PAT-L4-1-03", "stem": "A 52-year-old woman with long-standing rheumatoid arthritis has swelling of the metacarpophalangeal joints of both hands with flexion deformity of the fingers. Which finding is expected on examination of her hands?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In the rheumatoid hand, flexion deformity with ulnar deviation of the fingers is accompanied by radial deviation of the wrist, so the two deviate in opposite directions. The swan-neck deformity is PIP extension with DIP flexion, and Heberden's nodes with a square thumb describe the osteoarthritic hand.", "type": "mcq", "opts": ["Radial deviation of the fingers with ulnar deviation of the wrist", "Ulnar deviation of both the fingers and the wrist", "Swan-neck deformity with PIP flexion and DIP extension", "Ulnar deviation of the fingers with radial deviation of the wrist", "Heberden's nodes on the DIP joints with a square thumb"], "ans": 3}, "N-PAT-L4-1-04": {"id": "N-PAT-L4-1-04", "stem": "A 55-year-old woman with rheumatoid arthritis has a firm, non-tender subcutaneous nodule on the extensor surface of her forearm, which is excised. What is the expected microscopic appearance?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A subcutaneous rheumatoid nodule shows fibrinoid necrosis surrounded by a rim of palisaded histiocytes, lymphocytes and plasma cells. Synovial cell hyperplasia with granulation tissue is the microscopy of the rheumatoid synovium, and synovium growing on cartilage is the pannus, not the nodule.", "type": "mcq", "opts": ["Synovial cell hyperplasia with granulation tissue and a chronic inflammatory infiltrate", "Fibrinoid necrosis surrounded by a rim of palisaded histiocytes, lymphocytes and plasma cells", "White chalky urate aggregates with fibrosis and a giant cell reaction", "Synovium and stroma of inflammatory cells, granulation tissue and fibroblasts growing on cartilage"], "ans": 1}, "N-PAT-L4-1-05": {"id": "N-PAT-L4-1-05", "stem": "A 40-year-old woman with suspected early rheumatoid arthritis has normal hand radiographs. Regarding imaging in RA, which statement is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "MRI has the greatest sensitivity to detect synovitis and marrow changes, while ultrasound detects early soft-tissue lesions. RA X-rays show uniform symmetric joint-space narrowing with peri-articular osteopenia and marginal erosions; subchondral sclerosis and osteophytes are OA signs.", "type": "mcq", "opts": ["Ultrasound has the greatest sensitivity to detect marrow changes", "Plain X-ray detects early soft-tissue lesions before ultrasound does", "MRI has the greatest sensitivity to detect synovitis and marrow changes", "Subchondral sclerosis and osteophytes are typical radiographic changes of RA", "Joint-space narrowing in RA is typically asymmetric and non-uniform"], "ans": 2}, "N-PAT-L4-1-06": {"id": "N-PAT-L4-1-06", "stem": "A 68-year-old woman has a knee replacement for osteoarthritis. The resected joint surface shows exposed subchondral bone that is thickened and polished like ivory (eburnation), with small cysts in the bone beneath. How did these cysts form?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In advanced OA, synovial fluid leaks through defects in the residual cartilage and underlying bone to form bone cysts, while the exposed subchondral bone becomes thickened and polished (eburnation). Pannus erosion and osteoclasts activated by macrophage cytokines are RA mechanisms.", "type": "mcq", "opts": ["Pannus grew over the cartilage and eroded into the subchondral bone", "Osteoclasts activated by macrophage cytokines resorbed the subchondral bone", "Dislodged cartilage fragments became embedded in the subchondral bone", "Synovial fluid leaked through defects in the residual cartilage and underlying bone"], "ans": 3}, "N-PAT-L4-1-07": {"id": "N-PAT-L4-1-07", "stem": "A 64-year-old woman has hard bony swellings over the proximal interphalangeal (PIP) joints of several fingers and squaring of the base of the thumb; her DIP joints look normal. What are the PIP swellings?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In the OA hand, Bouchard's nodes sit on the PIP joints and Heberden's nodes (small osteophytes) on the DIP joints: B before H, P before D. Rheumatoid nodules are subcutaneous nodules of RA, typically on the extensor surface of the forearm.", "type": "mcq", "opts": ["Heberden's nodes", "Bouchard's nodes", "Rheumatoid nodules", "Tophi"], "ans": 1}, "N-PAT-L4-1-08": {"id": "N-PAT-L4-1-08", "stem": "A 39-year-old woman presents with pain and swelling of the small joints of both hands. Rheumatoid arthritis is diagnosed on clinical features when 4 of 7 criteria are present. Which of the following is one of these seven criteria?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The seven criteria are morning stiffness, arthritis in ≥ 3 joints, arthritis of typical hand joints, symmetric arthritis, rheumatoid nodules, serum rheumatoid factor and typical radiographic changes (MATS + NRX). ESR and CRP are part of the RA blood work-up but are not criteria, and osteophytes are an OA sign.", "type": "mcq", "opts": ["Raised ESR", "Raised CRP", "Serum rheumatoid factor", "Osteophytes on X-ray", "Asymmetric arthritis"], "ans": 2}, "N-PAT-L4-1-09": {"id": "N-PAT-L4-1-09", "stem": "A 58-year-old obese woman has osteoarthritis of the knee. Which process lies at the root of her disease?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In OA, chondrocytes balance synthesis of collagen II and proteoglycans against degradation by matrix-degrading enzymes, and aging, mechanical stresses, genetic factors and unknowns disturb this balance. T-cell stimulation, macrophage cytokines and IgM immune complexes belong to the pathogenesis of RA.", "type": "mcq", "opts": ["T-lymphocyte stimulation by an antigen (? virus) in a genetically predisposed host", "Imbalance between cartilage matrix synthesis and degradation by chondrocytes", "Macrophage cytokines driving synovial cell hyperplasia and pannus formation", "B-lymphocyte production of IgM antibodies forming antigen–antibody complexes", "Deposition of monosodium urate crystals in the joint"], "ans": 1}, "N-PAT-L4-1-10": {"id": "N-PAT-L4-1-10", "stem": "Define pannus. Describe the gross and microscopic pathology of the joint in rheumatoid arthritis, and mention the fate of the pannus.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The pannus is the destructive lesion of RA: inflamed synovium that erodes the cartilage and finally fixes the joint, first by fibrous and then by bony ankylosis.", "type": "written", "keyhtml": "• Pannus: a mass of synovium &amp; synovial stroma consisting of inflammatory cells, granulation tissue &amp; fibroblasts, which grows on the articular cartilage and causes its erosion.\n• Gross (chronic synovitis): synovial membrane thickened, oedematous, with frond-like (villous) projections (pannus formation); destruction &amp; erosion of cartilage &amp; bone; decrease in joint space followed by fibrosis &amp; calcification → permanent ankylosis.\n• Microscopy: synovial cell hyperplasia; granulation tissue; chronic inflammatory cellular infiltrate of lymphocytes (T), plasma cells, macrophages &amp; fibroblasts.\n• Fate: after the cartilage is destroyed, the pannus bridges the opposing bones → fibrous ankylosis, which eventually ossifies → bony ankylosis."}, "N-PAT-L4-1-11": {"id": "N-PAT-L4-1-11", "stem": "Enumerate the systemic manifestations of rheumatoid arthritis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "RA is a multisystem disease: Nice Vets Love Every Mammal, Always — Nodules, Vessels, Lung, Eye, Myocardium, Amyloidosis (secondary).", "type": "written", "keyhtml": "1. Subcutaneous rheumatoid nodules: extensor surface of the forearm; micro: fibrinoid necrosis surrounded by a rim of palisaded histiocytes, lymphocytes &amp; plasma cells.\n2. Blood vessels: vasculitis → skin ulcers; Raynaud's phenomenon.\n3. Lung: pleuritis, pleural effusion, rheumatoid nodules in the lung, diffuse or nodular pulmonary fibrosis.\n4. Ocular: keratitis, scleritis, granulomatous uveitis.\n5. Myocardial: arrhythmia, pericarditis.\n6. Amyloidosis: secondary.\nSystemic symptoms: fatigue, fever, night sweats."}, "N-PAT-L4-1-12": {"id": "N-PAT-L4-1-12", "stem": "A 45-year-old woman is diagnosed with rheumatoid arthritis. Which statement about the epidemiology of RA is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "RA can develop at any age but typically starts between 40 and 60 years. Females are affected three times as often as males (F : M = 3 : 1), and about 1 in 100 people develop RA at some stage in their life.", "type": "mcq", "opts": ["The male : female ratio is 3 : 1", "It does not develop before the age of 40", "It typically starts between 40 and 60 years", "About 1 in 1,000 people develop it at some stage in life"], "ans": 2}, "TP-017": {"id": "TP-017", "stem": "Case: A 40-year-old woman presents with severe pain and morning stiffness in both hands. She reports that, for more than one hour, she cannot do simple tasks such as preparing breakfast. Examination reveals a subcutaneous nodule on the back of her wrist.\na) What is your diagnosis?\nb) Mention two characteristic clinical features that diagnose this case.\nc) Give short notes on the pathogenesis of this lesion.", "top": true, "rep": "", "tag": "Final bank PAT W42", "bank": true, "expl": "Bilateral hand pain with morning stiffness lasting over an hour and a subcutaneous nodule in a middle-aged woman indicate rheumatoid arthritis. In osteoarthritis stiffness lasts under an hour and is worse at the end of the day, and there are no rheumatoid nodules.", "type": "written", "keyhtml": "a) Rheumatoid arthritis — a multisystem autoimmune inflammatory condition of the small joints of the hands and feet (female : male = 3 : 1; typically starts at 40–60 years).\nb) Any two of: • morning stiffness lasting more than 1 hour (here she cannot work for over an hour); • symmetric arthritis of the typical small hand joints (PIP &amp; MCP of both hands); • subcutaneous rheumatoid nodules on the extensor surface (here the back of the wrist). These are among the 7 diagnostic criteria, of which 4 are needed (morning stiffness · arthritis in ≥ 3 joints · arthritis of typical hand joints · symmetric arthritis · rheumatoid nodules · serum rheumatoid factor · typical radiographic changes).\nc) • Antigen (? virus) + genetic factors stimulate T lymphocytes, which release cytokines acting on 3 targets:\n  – B lymphocytes → antibodies (IgM) → antigen–antibody complexes;\n  – endothelium → endothelial (blood vessel) proliferation;\n  – macrophages → cytokines → synovial cell hyperplasia; chondrocytes &amp; osteoclasts → erosion of cartilage &amp; bone; fibroblast proliferation (fibrosis).\n• Result: chronic synovitis — thickened, oedematous synovium with frond-like (villous) projections = pannus (synovium &amp; stroma of inflammatory cells, granulation tissue &amp; fibroblasts) that grows on the articular cartilage and erodes it → fibrous ankylosis, which ossifies → bony ankylosis."}, "TP-072": {"id": "TP-072", "stem": "Which of the following clinical features is a key feature of osteoarthritis?", "top": true, "rep": "", "tag": "Final bank PAT Q85", "bank": true, "expl": "In osteoarthritis stiffness lasts less than an hour and is worse at the end of the day (after activity); onset is slow, over years, initially as an asymmetrical monoarthritis. Symmetrical polyarthritis, morning stiffness over an hour, rapid onset over weeks to months and systemic symptoms are features of rheumatoid arthritis.", "type": "mcq", "opts": ["Symmetrical polyarthritis", "Morning stiffness lasting more than one hour", "Rapid onset over weeks to months", "Joint stiffness that is worse at the end of the day, after activity", "Presence of systemic symptoms such as fever and fatigue"], "ans": 3}, "TP-096": {"id": "TP-096", "stem": "Case: A 45-year-old woman presents with a three-month history of aching and stiffness in both hands and feet. She reports that the stiffness is most severe in the morning, lasting for nearly two hours after she wakes up. Physical examination reveals swelling of the proximal interphalangeal (PIP) and metacarpophalangeal (MCP) joints of both hands.\na) What is your provisional diagnosis? Mention one differential diagnosis.\nb) Give short notes on the pathogenesis of this disease.", "top": true, "rep": "", "tag": "Final bank PAT W43", "bank": true, "expl": "Symmetric PIP and MCP swelling of both hands with morning stiffness of about two hours in a middle-aged woman is rheumatoid arthritis. Osteoarthritis is the main differential: its stiffness lasts under an hour and is worse at the end of the day (after activity), it starts as an asymmetrical monoarthritis of weight-bearing joints (knees, hips), and its hand nodes are Heberden (DIP) and Bouchard (PIP) nodes.", "type": "written", "keyhtml": "a) Provisional diagnosis: rheumatoid arthritis — middle-aged woman (F : M = 3 : 1; typically starts at 40–60 years); symmetrical polyarthritis of the small joints of hands and feet (PIP &amp; MCP); morning stiffness &gt; 1 hour; onset over weeks to months. Differential diagnosis: osteoarthritis — slow onset over years, initially asymmetrical monoarthritis of weight-bearing joints (knees, hips), stiffness &lt; 1 hour that is worse at the end of the day (after activity), Heberden (DIP) and Bouchard (PIP) nodes, no systemic symptoms. (Gouty arthritis is also accepted as a differential.)\nb) • Antigen (? virus) + genetic factors stimulate T lymphocytes, which release cytokines acting on 3 targets:\n  – B lymphocytes → antibodies (IgM) → antigen–antibody complexes;\n  – endothelium → endothelial (blood vessel) proliferation;\n  – macrophages → cytokines → synovial cell hyperplasia; chondrocytes &amp; osteoclasts → erosion of cartilage &amp; bone; fibroblast proliferation (fibrosis).\n• Result: chronic synovitis — thickened, oedematous synovium with frond-like (villous) projections = pannus (synovium &amp; stroma of inflammatory cells, granulation tissue &amp; fibroblasts) that grows on the articular cartilage and erodes it → fibrous ankylosis, which ossifies → bony ankylosis."}, "TP-059": {"id": "TP-059", "stem": "A 42-year-old woman presents with 3 months of bilateral hand pain and morning stiffness lasting more than 1 hour. Examination shows swelling of the metacarpal joints. Laboratory investigations came positive for rheumatoid factor (RF). What is RF?", "top": true, "rep": "", "tag": "Final bank PAT W44", "bank": true, "expl": "Serum rheumatoid factor is one of the blood tests in rheumatoid arthritis (ESR, CRP, RF) and one of the 7 diagnostic criteria, of which 4 are needed; it may or may not be high (±).", "type": "written", "keyhtml": "- It is a serum blood test used in the investigation of Rheumatoid Arthritis.\n- It is one of the 7 diagnostic criteria for Rheumatoid Arthritis.\n- It may or may not be high (±), meaning it is not required for every patient"}}, "labs": {}, "cards": [{"id": "PAT-L4-1-001", "text": "Rheumatoid arthritis is a {{c1::multisystem autoimmune inflammatory}} condition typically affecting the small joints of the hands and feet.", "extra": "Contrast: osteoarthritis is a degenerative joint disease.", "sec": "Part 01 · 1.1 Definition"}, {"id": "PAT-L4-1-002", "text": "The typical joints of rheumatoid arthritis are the {{c1::proximal interphalangeal (PIP)}} and {{c2::metacarpophalangeal (MCP)}} joints of the hands and feet.", "extra": "Trap: Heberden nodes of OA sit on the DIP joints.", "sec": "Part 01 · 1.1 Definition"}, {"id": "PAT-L4-1-003", "text": "Joint pattern of rheumatoid arthritis: {{c1::symmetrical}} {{c2::polyarthropathy}} of {{c3::small}} joints.", "extra": "Mnemonic 3 S's: Symmetrical · Several (poly) · Small.", "sec": "Part 01 · 1.1 Definition"}, {"id": "PAT-L4-1-004", "text": "Rheumatoid arthritis can start at any age, but typically starts between {{c1::40 and 60}} years.", "extra": "GD 3 RA-vs-OA table: RA can happen at any age; OA usually later in life.", "sec": "Part 01 · 1.2 Epidemiology"}, {"id": "PAT-L4-1-005", "text": "Rheumatoid arthritis female : male ratio = {{c1::3 : 1}}.", "extra": "Women are affected three times as often.", "sec": "Part 01 · 1.2 Epidemiology"}, {"id": "PAT-L4-1-006", "text": "About {{c1::1 in 100}} people develop rheumatoid arthritis at some stage in their life.", "extra": "A common arthritis.", "sec": "Part 01 · 1.2 Epidemiology"}, {"id": "PAT-L4-1-007", "text": "Site of the initial lesion: rheumatoid arthritis starts in the {{c1::synovium}}; osteoarthritis starts in the {{c2::articular cartilage}}.", "extra": "RA: synovitis & pannus erode cartilage and bone. OA: cartilage thins and fissures while subchondral bone thickens.", "sec": "Part 01 · 1.3 Normal joint structure — and the joint affected by RA"}, {"id": "PAT-L4-1-008", "text": "RA pathogenesis starts when an {{c1::antigen (? virus)}} acting with {{c2::genetic factors}} stimulates {{c3::T lymphocytes}}, which release cytokines.", "extra": "GD 3 adds: HLA-DR4 susceptibility; smoking and infection (parvovirus B19) as triggers.", "sec": "Part 02 · 2.1 Pathogenesis of rheumatoid arthritis"}, {"id": "PAT-L4-1-009", "text": "In RA, T-cell cytokines act on 3 targets: {{c1::B lymphocytes}} · {{c2::endothelium}} · {{c3::macrophages}}.", "extra": "Endothelium → endothelial proliferation (blood vessel proliferation).", "sec": "Part 02 · 2.1 Pathogenesis of rheumatoid arthritis"}, {"id": "PAT-L4-1-010", "text": "In RA, B lymphocytes produce {{c1::IgM}} antibodies that form {{c2::antigen–antibody complexes}}.", "extra": "B cell = the antibody arm; macrophage = the destructive arm.", "sec": "Part 02 · 2.1 Pathogenesis of rheumatoid arthritis"}, {"id": "PAT-L4-1-011", "text": "In RA, T-cell cytokines activate {{c1::macrophages}}, whose cytokines cause {{c2::synovial cell hyperplasia}}, {{c3::erosion of cartilage & bone}} and {{c4::fibroblast proliferation}}.", "extra": "The macrophage is the hub of destruction.", "sec": "Part 02 · 2.1 Pathogenesis of rheumatoid arthritis"}, {"id": "PAT-L4-1-012", "text": "In RA, cartilage & bone are eroded when macrophage cytokines activate {{c1::chondrocytes}} and {{c2::osteoclasts}}.", "extra": "Macrophage → cytokines → chondrocyte / osteoclast → erosion.", "sec": "Part 02 · 2.1 Pathogenesis of rheumatoid arthritis"}, {"id": "PAT-L4-1-013", "text": "Genetic and environmental risk factors of RA: {{c1::HLA-DR4}} susceptibility · {{c2::smoking}} · infection ({{c3::parvovirus B19}}).", "extra": "Official GD answer — not in the pamphlet. Pamphlet: antigen (? virus) + genetic factors.", "sec": "Part 02 · 2.1 Pathogenesis of rheumatoid arthritis"}, {"id": "PAT-L4-1-015", "text": "Expected microscopy of RA: {{c1::chronic inflammatory cells, mainly lymphocytes}} · {{c2::blood vessel proliferation}} · {{c3::synovial cell hyperplasia}} · {{c4::erosion of the cartilage}} · {{c5::fibrosis}}.", "extra": "Mnemonic: Lots of Vessels Swell, Erode, Fibrose.", "sec": "Part 02 · 2.2 What do you expect to see microscopically?"}, {"id": "PAT-L4-1-016", "text": "RA stage 4: {{c1::pannus}} with lymphoid follicles erodes the cartilage and subchondral bone (via {{c2::osteoclasts}}); {{c3::PMN leukocytes}} appear in the synovial fluid.", "extra": "Stage 3 before it: papillary synovium with nodules of lymphocytes & plasma cells.", "sec": "Part 02 · 2.3 The stage diagrams (1 – 5)"}, {"id": "PAT-L4-1-017", "text": "RA stage 5: destruction of the joint by {{c1::fibrosis}} and loss of articular cartilage, with {{c2::periarticular bone loss}}.", "extra": "End stage of the rheumatoid joint.", "sec": "Part 02 · 2.3 The stage diagrams (1 – 5)"}, {"id": "PAT-L4-1-018", "text": "Gross RA (chronic synovitis): the synovial membrane is thickened, oedematous, with {{c1::frond-like (villous)}} projections = {{c2::pannus}} formation.", "extra": "Then destruction & erosion of cartilage and bone.", "sec": "Part 03 · 3.1 Chronic synovitis — pannus formation"}, {"id": "PAT-L4-1-019", "text": "In RA, the decrease in joint space is followed by {{c1::fibrosis & calcification}} → permanent {{c2::ankylosis}}.", "extra": "Gross course of the rheumatoid joint.", "sec": "Part 03 · 3.1 Chronic synovitis — pannus formation"}, {"id": "PAT-L4-1-020", "text": "Microscopy of the RA synovium (3 features): {{c1::synovial cell hyperplasia}} · {{c2::granulation tissue}} · {{c3::chronic inflammatory cellular infiltrate}}.", "extra": "GD calls it chronic papillary synovitis.", "sec": "Part 03 · 3.2 Microscopic appearance"}, {"id": "PAT-L4-1-021", "text": "The chronic inflammatory infiltrate of the RA synovium: {{c1::lymphocytes (T)}} · {{c2::plasma cells}} · {{c3::macrophages}} · {{c4::fibroblasts}}.", "extra": "GD: the lymphocytes are mostly CD4+ T helper cells.", "sec": "Part 03 · 3.2 Microscopic appearance"}, {"id": "PAT-L4-1-022", "text": "Pannus = a mass of {{c1::synovium & synovial stroma}} that grows on the {{c2::articular cartilage}} and causes its {{c3::erosion}}.", "extra": "The destructive lesion of RA.", "sec": "Part 03 · 3.3 What is pannus?"}, {"id": "PAT-L4-1-023", "text": "Pannus is composed of {{c1::inflammatory cells}}, {{c2::granulation tissue}} and {{c3::fibroblasts}}.", "extra": "Same components as the RA synovial infiltrate.", "sec": "Part 03 · 3.3 What is pannus?"}, {"id": "PAT-L4-1-024", "text": "After the cartilage is destroyed, the pannus bridges the opposing bones → {{c1::fibrous}} ankylosis, which eventually ossifies → {{c2::bony}} ankylosis.", "extra": "Exam trap: fibrous first, then bony — never the reverse.", "sec": "Part 03 · 3.3 What is pannus?"}, {"id": "PAT-L4-1-025", "text": "RA course: symmetric polyarticular affection starting in small joints → {{c1::insidious}} onset of aching & stiffness → joint enlarges with {{c2::limitation of motion}} → later {{c3::complete ankylosis}}.", "extra": "C/P slide wording.", "sec": "Part 04 · 4.1 Clinical picture"}, {"id": "PAT-L4-1-026", "text": "Speed of onset — rheumatoid arthritis: {{c1::rapid (weeks to months)}}; osteoarthritis: {{c2::slow (over years)}}.", "extra": "Trap: the RA C/P slide calls the onset \"insidious\" — learn both phrasings.", "sec": "Part 04 · 4.1 Clinical picture"}, {"id": "PAT-L4-1-027", "text": "Rheumatoid arthritis: is a high rheumatoid factor always present? — {{c1::No — RF is ± (may or may not be high).}}", "extra": "It is only 1 of the 7 diagnostic criteria.", "sec": "Part 04 · 4.1 Clinical picture"}, {"id": "PAT-L4-1-028", "text": "Systemic symptoms of rheumatoid arthritis: {{c1::fatigue}} · {{c2::fever}} · {{c3::night sweats}}.", "extra": "OA has no systemic symptoms.", "sec": "Part 04 · 4.1 Clinical picture"}, {"id": "PAT-L4-1-029", "text": "Rheumatoid arthritis starts in the small joints of the hands & feet and later involves {{c1::large joints}} (wrist, elbow, ankles, knees).", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 04 · 4.1 Clinical picture"}, {"id": "PAT-L4-1-030", "text": "RA hand: MCP swelling with flexion deformity and {{c1::ulnar}} deviation of the fingers, and {{c2::radial}} deviation of the wrist.", "extra": "Fingers ulnar, wrist radial — opposite directions.", "sec": "Part 04 · 4.2 The hand in RA"}, {"id": "PAT-L4-1-031", "text": "In the RA hand, inflammation of the {{c1::tendons, ligaments & joint capsule}} adds to the deformity.", "extra": "Why the rheumatoid hand deforms.", "sec": "Part 04 · 4.2 The hand in RA"}, {"id": "PAT-L4-1-032", "text": "Two named finger deformities of the RA hand: {{c1::swan-neck}} deformity and {{c2::boutonnière}} deformity.", "extra": "Both appear with ulnar deviation and MCP swelling.", "sec": "Part 04 · 4.2 The hand in RA"}, {"id": "PAT-L4-1-033", "text": "Swan-neck deformity (RA) = PIP {{c1::extension}} + DIP {{c2::flexion}}.", "extra": "Boutonnière (figure label): lateral band volar to the axis of motion.", "sec": "Part 04 · 4.2 The hand in RA"}, {"id": "PAT-L4-1-034", "text": "Rheumatoid arthritis involves the MCP and PIP joints but spares the {{c1::DIP}} joints.", "extra": "Official GD answer — not in the pamphlet. DIP = OA (Heberden nodes).", "sec": "Part 04 · 4.2 The hand in RA"}, {"id": "PAT-L4-1-036", "text": "Systemic manifestations of RA: {{c1::subcutaneous rheumatoid nodules}} · {{c2::vasculitis (blood vessels)}} · {{c3::lung lesions}} · {{c4::ocular lesions}} · {{c5::myocardial lesions}} · {{c6::secondary amyloidosis}}.", "extra": "Mnemonic: Nice Vets Love Every Mammal, Always.", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-037", "text": "Subcutaneous rheumatoid nodules lie on the {{c1::extensor surface of the forearm}}.", "extra": "GD case: firm, non-tender nodule at the elbow.", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-038", "text": "Rheumatoid nodule microscopy: {{c1::fibrinoid necrosis}} surrounded by a rim of {{c2::palisaded histiocytes}}, lymphocytes & plasma cells.", "extra": "Not the synovial picture (hyperplasia + granulation tissue).", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-039", "text": "Vascular lesions of RA: vasculitis → {{c1::skin ulcers}}, and {{c2::Raynaud's phenomenon}}.", "extra": "Blood-vessel manifestation.", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-040", "text": "Lung lesions of RA: {{c1::pleuritis}} · {{c2::pleural effusion}} · {{c3::rheumatoid nodules in the lung}} · {{c4::diffuse or nodular pulmonary fibrosis}}.", "extra": "Fibrosis → crackles, clubbing, breathlessness.", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-041", "text": "Rheumatological disease causing pulmonary nodules and diffuse pulmonary fibrosis (crackles, clubbing): {{c1::rheumatoid arthritis}}.", "extra": "OA has no systemic manifestations.", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-042", "text": "Ocular lesions of RA: {{c1::keratitis}} · {{c2::scleritis}} · {{c3::granulomatous uveitis}}.", "extra": "", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-043", "text": "Myocardial lesions of RA: {{c1::arrhythmia}} and {{c2::pericarditis}}.", "extra": "", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-044", "text": "The amyloidosis complicating rheumatoid arthritis is {{c1::secondary}} amyloidosis.", "extra": "Trap: not primary.", "sec": "Part 04 · 4.3 Systemic manifestations"}, {"id": "PAT-L4-1-045", "text": "RA is diagnosed on clinical features when {{c1::4}} of the 7 criteria are present.", "extra": "Criteria 1–4 concern the joints.", "sec": "Part 05 · 5.1 Diagnosis"}, {"id": "PAT-L4-1-046", "text": "RA diagnostic criteria 1–4 (joints): {{c1::morning stiffness}} · {{c2::arthritis in ≥ 3 joints}} · {{c3::arthritis of typical hand joints}} · {{c4::symmetric arthritis}}.", "extra": "Mnemonic: MATS + NRX.", "sec": "Part 05 · 5.1 Diagnosis"}, {"id": "PAT-L4-1-047", "text": "RA diagnostic criteria 5–7: {{c1::rheumatoid nodules}} (skin) · {{c2::serum rheumatoid factor}} · {{c3::typical radiographic changes}}.", "extra": "ESR & CRP are investigations, not criteria.", "sec": "Part 05 · 5.1 Diagnosis"}, {"id": "PAT-L4-1-048", "text": "Blood tests in rheumatoid arthritis: {{c1::ESR}} · {{c2::CRP}} · {{c3::rheumatoid factor (RF)}}.", "extra": "OA bloods: ESR & CRP only — RF is an RA test.", "sec": "Part 05 · 5.2 Investigations"}, {"id": "PAT-L4-1-049", "text": "Expected lab finding in symmetric small-joint arthritis with swan-neck deformity and ulnar deviation: serum positive for {{c1::rheumatoid factor}}.", "extra": "Hyperuricaemia = gout; CPPD crystals = pseudogout.", "sec": "Part 05 · 5.2 Investigations"}, {"id": "PAT-L4-1-050", "text": "Most specific laboratory test for rheumatoid arthritis: {{c1::anti-CCP antibodies}} (against cyclic citrullinated peptides).", "extra": "GD 3: anti-CCP is among the case's blood tests and RA is anti-CCP+ in its RA-vs-OA table. Pamphlet bloods: ESR, CRP, RF.", "sec": "Part 05 · 5.2 Investigations"}, {"id": "PAT-L4-1-052", "text": "Radiographic features of RA: {{c1::peri-articular osteopenia}} · {{c2::uniform symmetric joint space narrowing}} · {{c3::marginal subchondral erosions}} · {{c4::joint subluxations}} · joint destruction & collapse.", "extra": "Hand X-ray: ↓ joint space, marginal erosions, ulnar deviation & dislocation.", "sec": "Part 05 · 5.2 Investigations"}, {"id": "PAT-L4-1-053", "text": "Imaging in RA: {{c1::MRI}} has the greatest sensitivity to detect synovitis and marrow changes; {{c2::ultrasound}} detects early soft-tissue lesions.", "extra": "Plain X-ray shows the later bony changes.", "sec": "Part 05 · 5.2 Investigations"}, {"id": "PAT-L4-1-054", "text": "Osteoarthritis = {{c1::degenerative joint disease}}: a clinical syndrome of joint pain accompanied by {{c2::functional limitation}}.", "extra": "Affects hips, knees and small joints of the hands. GD: a wear-and-tear phenomenon.", "sec": "Part 06 · 6.1 Definition"}, {"id": "PAT-L4-1-055", "text": "Risk factors of osteoarthritis: {{c1::increasing age}} · {{c2::women}} · {{c3::obesity}} · {{c4::joint injuries (sports / occupational repetitive stress load)}}.", "extra": "Plus mechanical stresses & genetic factors (pathogenesis).", "sec": "Part 06 · 6.2 Risk factors"}, {"id": "PAT-L4-1-056", "text": "OA risk factors added by the GD: {{c1::high-impact physical activity}} and previous {{c2::rheumatoid arthritis or gout}}.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 06 · 6.2 Risk factors"}, {"id": "PAT-L4-1-057", "text": "In OA, chondrocytes balance synthesis of {{c1::collagen II & proteoglycans}} against degradation by {{c2::matrix-degrading enzymes}}.", "extra": "OA = this balance is disturbed.", "sec": "Part 06 · 6.3 Pathogenesis — cartilaginous matrix"}, {"id": "PAT-L4-1-058", "text": "The OA cartilage balance is disturbed by: {{c1::aging}} · {{c2::mechanical stresses}} · {{c3::genetic factors}} · {{c4::unknowns}}.", "extra": "Not by T cells or immune complexes (= RA).", "sec": "Part 06 · 6.3 Pathogenesis — cartilaginous matrix"}, {"id": "PAT-L4-1-059", "text": "OA pathogenesis: early, chondrocytes {{c1::increase}} synthesis of collagen II & proteoglycans (repair); later they release {{c2::matrix metalloproteinases (MMPs)}} → matrix loss.", "extra": "Official GD answer — not in the pamphlet. Also IL-1, TNF-α, IL-6 & prostaglandins (mild inflammation).", "sec": "Part 06 · 6.3 Pathogenesis — cartilaginous matrix"}, {"id": "PAT-L4-1-060", "text": "OA stage 2: the cartilage becomes {{c1::thinner}}, then {{c2::splits & fissures}} through its whole thickness.", "extra": "Stage 1 = healthy cartilage lubricated by synovial fluid.", "sec": "Part 06 · 6.4 Evolution of osteoarthritis"}, {"id": "PAT-L4-1-061", "text": "OA stage 3: portions of cartilage erode and fragments dislodge to form {{c1::free-floating particles}} in the joint cavity.", "extra": "Osteophytes also appear at this stage.", "sec": "Part 06 · 6.4 Evolution of osteoarthritis"}, {"id": "PAT-L4-1-062", "text": "Osteophyte = {{c1::bone proliferation at the margins of the joint}} (a peripheral growth of bone).", "extra": "", "sec": "Part 06 · 6.4 Evolution of osteoarthritis"}, {"id": "PAT-L4-1-063", "text": "Eburnation (OA): the exposed {{c1::subchondral bone}} becomes thickened and {{c2::polished (ivory-like)}}.", "extra": "Stage 4 of OA.", "sec": "Part 06 · 6.4 Evolution of osteoarthritis"}, {"id": "PAT-L4-1-064", "text": "OA bone cysts form when {{c1::synovial fluid}} leaks through defects in the residual cartilage and underlying bone.", "extra": "Not by pannus or osteoclasts (= RA).", "sec": "Part 06 · 6.4 Evolution of osteoarthritis"}, {"id": "PAT-L4-1-065", "text": "OA morphology — cartilage & bone: {{c1::cracking of cartilage}} · {{c2::thickening of subchondral bone}} · {{c3::polished (ivory-like) bone}} · {{c4::cyst formation}} · {{c5::osteophytes}}.", "extra": "Normal-vs-OA diagram (7 labels).", "sec": "Part 06 · 6.5 Normal vs osteoarthritis"}, {"id": "PAT-L4-1-066", "text": "OA morphology — soft tissues: {{c1::synovial hypertrophy}} and a {{c2::thickened}} capsule.", "extra": "RA: inflamed synovium (chronic synovitis) & swollen capsule.", "sec": "Part 06 · 6.5 Normal vs osteoarthritis"}, {"id": "PAT-L4-1-067", "text": "The 4 cardinal X-ray signs of OA: {{c1::subchondral sclerosis}} · {{c2::osteophytes}} · {{c3::narrowing of joint space}} · {{c4::subchondral cysts}}.", "extra": "Mnemonic SONS (GD: NOSS).", "sec": "Part 06 · 6.6 Radiologically"}, {"id": "PAT-L4-1-068", "text": "Peri-articular {{c1::osteophytes}} = OA X-ray sign; peri-articular {{c2::osteopenia}} = RA X-ray sign.", "extra": "RA eats bone, OA builds bone.", "sec": "Part 06 · 6.6 Radiologically"}, {"id": "PAT-L4-1-069", "text": "Primary OA: symptoms develop gradually, usually above {{c1::50}} years, and affect {{c2::one or few}} joints.", "extra": "RA: any age, symmetrical polyarthritis.", "sec": "Part 07 · 7.1 Clinical features of osteoarthritis"}, {"id": "PAT-L4-1-070", "text": "Joints commonly involved in OA: {{c1::hips}} · {{c2::knees}} · {{c3::lower lumbar & cervical vertebrae}} · {{c4::phalangeal joints}}.", "extra": "RA vs OA table: weight-bearing joints (knees, hips).", "sec": "Part 07 · 7.1 Clinical features of osteoarthritis"}, {"id": "PAT-L4-1-071", "text": "OA pain: joint stiffness and {{c1::deep aching}} pain that {{c2::increases with repeated use}} of the joint.", "extra": "Improves with rest.", "sec": "Part 07 · 7.1 Clinical features of osteoarthritis"}, {"id": "PAT-L4-1-072", "text": "{{c1::Crepitus}}: a crackling sound caused by {{c2::exposed surfaces of bone rubbing}} against each other (OA).", "extra": "Classic OA examination sign.", "sec": "Part 07 · 7.1 Clinical features of osteoarthritis"}, {"id": "PAT-L4-1-073", "text": "Joint swelling in OA comes with a {{c1::small effusion}}.", "extra": "", "sec": "Part 07 · 7.1 Clinical features of osteoarthritis"}, {"id": "PAT-L4-1-074", "text": "Heberden nodes are small {{c1::osteophytes}} on the DIP joints (OA).", "extra": "Bony enlargement of the DIP joints.", "sec": "Part 07 · 7.2 Hand changes in OA"}, {"id": "PAT-L4-1-075", "text": "OA nodes: Heberden's on the {{c1::DIP}} joints; Bouchard's on the {{c2::PIP}} joints.", "extra": "B before H, P before D.", "sec": "Part 07 · 7.2 Hand changes in OA"}, {"id": "PAT-L4-1-076", "text": "The third OA hand sign, besides Heberden's and Bouchard's nodes: {{c1::square thumb}}.", "extra": "At the base of the thumb.", "sec": "Part 07 · 7.2 Hand changes in OA"}, {"id": "PAT-L4-1-077", "text": "In the hand, OA affects the DIP, PIP and {{c1::1st carpometacarpal}} joints; RA affects the PIP, {{c2::MCP}} and {{c3::wrist}}.", "extra": "GD RA-vs-OA table.", "sec": "Part 07 · 7.2 Hand changes in OA"}, {"id": "PAT-L4-1-078", "text": "Lab in osteoarthritis (GD): RF and anti-CCP {{c1::negative}}; ESR & CRP {{c2::normal}}.", "extra": "Pamphlet lists ESR & CRP as the OA bloods; RF is an RA test only.", "sec": "Part 07 · 7.3 Investigation"}, {"id": "PAT-L4-1-079", "text": "Distribution — rheumatoid arthritis: {{c1::symmetrical polyarthritis}}; osteoarthritis: {{c2::initially asymmetrical monoarthritis}} → polyarthritis.", "extra": "Bilateral symmetrical = RA.", "sec": "Part 08 · 8.1 RA vs OA — the lecture's table"}, {"id": "PAT-L4-1-080", "text": "Joints affected — rheumatoid arthritis: {{c1::small joints of hands and feet}}; osteoarthritis: {{c2::weight-bearing joints (knees, hips)}}.", "extra": "Hip & knee = OA.", "sec": "Part 08 · 8.1 RA vs OA — the lecture's table"}, {"id": "PAT-L4-1-081", "text": "Morning stiffness — rheumatoid arthritis: {{c1::> 1 hour}}, worse in the morning; osteoarthritis: {{c2::< 1 hour}}, worse at the end of the day (after activity).", "extra": "Stiffness that \"passes quickly\" = OA.", "sec": "Part 08 · 8.1 RA vs OA — the lecture's table"}, {"id": "PAT-L4-1-082", "text": "Years of knee, spine and distal-finger pain, brief morning stiffness, pain worse at the end of the day, crepitus, no swelling or warmth, normal uric acid → {{c1::osteoarthritis}}.", "extra": "Normal serum uric acid excludes gout (gout = hyperuricaemia).", "sec": "Part 08 · 8.1 RA vs OA — the lecture's table"}, {"id": "PAT-L4-1-083", "text": "Woman with symmetric MCP & PIP swelling, morning stiffness > 1 h, a nodule at the elbow, bony erosions and periarticular osteopenia → {{c1::rheumatoid arthritis}}.", "extra": "Most specific test: anti-CCP (GD).", "sec": "Part 08 · 8.1 RA vs OA — the lecture's table"}, {"id": "PAT-L4-1-084", "text": "Differential diagnosis of rheumatoid arthritis: {{c1::osteoarthritis}} · {{c2::gout}} · {{c3::septic arthritis}} · {{c4::SLE}}.", "extra": "Official GD answer — not in the pamphlet. Gout: crystals, tophi · septic: monoarticular, fever, high synovial WBC · SLE: malar rash, ANA+.", "sec": "Part 08 · 8.2 Other differences in this lecture"}, {"id": "PAT-L4-1-087", "text": "Joints feel — rheumatoid arthritis: {{c1::tender, soft, warm}}; osteoarthritis: {{c2::hard, bony}}.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 08 · 8.2 Other differences in this lecture"}], "lib": "./", "prev": {"href": "pat-l3.html", "title": "Lecture 3 · Bone Tumours"}, "next": {"href": "pat-l4-2.html", "title": "Lecture 4 · Part 2 · Diseases of the Joint"}, "searchHint": "e.g. aging, unknowns, skin ulcers"};
