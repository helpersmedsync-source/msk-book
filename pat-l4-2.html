<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSK Book">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>MSK Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}
.op[disabled]{cursor:default}
.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}

ed TGCT"]}], "toc": ["07", "Rapid Revision"]}, {"id": "p45", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l4-2-6-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonics, most-common facts, spot the diagnosis", "items": [["Most common form of gout:", "primary"], ["Ganglion size 1–1.5", "cm; diffuse TGCT 80% in knee"], ["Hyperuricaemia + mental", "retardation + self-mutilation = Lesch–Nyhan"], ["Painless nodule on finger tendon sheath =", "localized TGCT"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p46", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Suppurative → permanent deformities; rheumatic → leaves joints without complications"}, {"t": "note", "kind": "trap", "html": "Tuberculous arthritis ends in fibrous ankylosis; may arise from nearby TB osteomyelitis"}, {"t": "note", "kind": "trap", "html": "Primary gout is the most common form even though its cause is unknown"}, {"t": "note", "kind": "trap", "html": "Needle + negative = gout; rhomboid + weakly positive = pseudogout"}, {"t": "note", "kind": "trap", "html": "Gout → first MTP (great toe); pseudogout → knee"}, {"t": "note", "kind": "trap", "html": "Ganglion: not lined by epithelium, does not communicate with joint; synovial cyst lined by synovium"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p47", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "PVNS is the previous name of the diffuse type, not the localized"}, {"t": "note", "kind": "trap", "html": "TGCT is benign yet aggressive diffuse lesions can erode bone (older version)"}, {"t": "note", "kind": "trap", "html": "Traumatic arthritis can lead to osteoarthritis"}, {"t": "note", "kind": "trap", "html": "Chronic gout can cause renal failure (urate nephropathy)"}, {"t": "note", "kind": "cl", "html": "Acute gout: podagra, precipitated by alcohol or meat"}, {"t": "note", "kind": "cl", "html": "Charcot joint in diabetes mellitus or late syphilis"}]}, {"id": "p48", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Diffuse TGCT: knee pain, locking, swelling, decreased range of motion"}, {"t": "note", "kind": "cl", "html": "Lesch–Nyhan: mental retardation and self-mutilation with hyperuricaemia"}]}, {"id": "p49", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0529": {"id": "Q0529", "stem": "A 60-year-old man with a diagnosis of chronic myeloid leukemia is treated with intensive chemotherapy. He goes into remission, but develops pain in the left wrist. On physical examination, there is swelling and warmth on palpation of the wrist. Polarized light microscopy of fluid aspirated from the wrist joint shows needle-shaped crystals that display negative birefringence. Which of the following processes most likely played an important role in the pathogenesis of the patient's wrist pain?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q52", "bank": true, "expl": "Needle-shaped crystals with negative birefringence mean gout. Leukaemia and myeloproliferative disorders cause secondary gout because increased cell turnover leads to hyperuricaemia, so the dying leukaemic cells produce excess uric acid; the joint is injured by deposited urate crystals, not by leukaemic cells infiltrating the synovium.", "type": "mcq", "opts": ["Damage to the articular cartilage by chemotherapeutic agents", "Infiltration of the synovium by leukemic cells", "Synovial proliferation from cytokine secretion by leukemic cells", "Excessive production of uric acid from dying leukemic cells", "Hemorrhages into the joint as a result of deranged platelet function"], "ans": 3}, "Q0538": {"id": "Q0538", "stem": "For the past 4 months, a 51-year-old man has noticed episodes of intense local pain involving his left foot. Each episode follows a meal in which he consumes a bottle of wine, and the pain may last hours to several days. Physical examination identifies the left metatarsophalangeal joint as the focus of this pain. There is tenderness and swelling, but minimal loss of joint mobility. A painless, 2-cm nodule with overlying ulcerated skin is present on the lateral aspect of the metatarsophalangeal joint. Beneath the eroded skin is a chalky white deposit of soft material surrounded by erythematous soft tissue. A firm, 1-cm subcutaneous nodule is present on the extensor surface of the left elbow. The nodule is excised, and microscopy shows a tophus. Which of the following mechanisms is most important in causing joint injury in his disease?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q54", "bank": true, "expl": "Attacks in the metatarsophalangeal joint after alcohol, with chalky white deposits and a tophus, mean gout: monosodium urate crystals deposited in the joint trigger an acute inflammatory reaction. Calcium pyrophosphate dihydrate deposition causes pseudogout, which most often affects the knee and does not form uric acid tophi, and tuberculous infection ends in fibrous ankylosis.", "type": "mcq", "opts": ["Acute inflammatory reaction triggered by deposited monosodium urate crystals", "Chronic inflammation caused by Borrelia burgdorferi infection", "Deposition of calcium pyrophosphate dihydrate crystals in the joint", "Deposition of serum cholesterol into the synovium", "Granulomatous inflammation caused by Mycobacterium tuberculosis infection", "Reduced metabolism of homogentisic acid"], "ans": 0}, "Y26-056": {"id": "Y26-056", "stem": "For the past 4 months, a 51-year-old man has noticed episodes of intense local pain involving his left foot. Each episode follows a meal of meat, and the pain may last hours to several days. Physical examination identifies the left metatarsophalangeal joint as the focus of this pain. There is tenderness and swelling, but minimal loss of joint mobility. A painless, 2-cm nodule with overlying ulcerated skin is present on the lateral aspect of the metatarsophalangeal joint. Beneath the eroded skin is a chalky white deposit of soft material surrounded by erythematous soft tissue. A firm, 1-cm subcutaneous nodule is present on the extensor surface of the left elbow. The nodule is excised and has the microscopic appearance shown in the figure. [Figure not available — the question can be answered from the clinical findings.] What is your provisional diagnosis?", "top": true, "rep": "", "tag": "Final bank PAT Q53", "bank": true, "expl": "Attacks of intense pain in the metatarsophalangeal joint of the great toe after meat, with chalky white deposits in the soft tissue, are gouty arthritis: tophi are white, chalky aggregates of uric acid crystals with fibrosis and a giant-cell reaction, and the elbow nodule is another tophus. Rheumatoid nodules also lie on extensor surfaces, but RA is a symmetrical polyarthritis of the small joints of the hands and feet without chalky deposits.", "type": "mcq", "opts": ["Rheumatoid arthritis", "Osteoarthritis", "Gouty arthritis", "Septic arthritis", "Psoriatic arthritis", "TB arthritis"], "ans": 2}, "Q0652": {"id": "Q0652", "stem": "Case: A 10-year-old female child presents with a one-week history of joint pain, hotness, redness and swelling in her large joints, migratory, with response to aspirin. History of post-streptococcal infection in her tonsils in the preceding 3 weeks. Laboratory tests reveal raised ASO titer, ESR and C-reactive protein.\n1. What is your most likely diagnosis? And why?\n2. What are the most likely risk factors?\n3. What are the characteristic clinical findings?\n4. How to differentiate this case from suppurative arthritis?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W26", "bank": true, "expl": "A child with migratory, aspirin-responsive arthritis of large joints 3 weeks after a streptococcal throat infection, with a raised ASO titre, has acute rheumatic fever (rheumatic arthritis), an aseptic, reactive arthritis that leaves the joints without complications. Suppurative arthritis is a septic arthritis that can rapidly destroy a joint and produce permanent deformities.", "aimg": ["figs/Q0653_ans.jpg", "figs/Q0653_ans2.jpg"], "acap": "Clinical findings of acute rheumatic fever (Jones criteria); streptococcal throat infection and the organs affected", "type": "written", "keyhtml": "1. Acute rheumatic fever (ARF) — migratory polyarthritis type (rheumatic arthritis). Clues: a child; streptococcal throat (tonsil) infection 3 weeks earlier; migratory arthritis of large joints; dramatic response to aspirin; elevated ASO titre, ESR and CRP. Rheumatic arthritis is an acute, aseptic, reactive, post-streptococcal arthritis.\n2. Age 5–15 years (peak incidence); recent untreated group A streptococcal pharyngitis; overcrowded living conditions; recurrent sore throat without antibiotics; family history or genetic susceptibility.\n3. Jones criteria:\n• Major: migratory polyarthritis (large joints); carditis (pancarditis — myocarditis, pericarditis, valvulitis); subcutaneous nodules; erythema marginatum (non-itchy rash); Sydenham's chorea (involuntary movements).\n• Minor: fever; arthralgia; elevated ESR/CRP; prolonged PR interval on ECG.\n• Diagnosis requires 2 major, or 1 major + 2 minor, PLUS evidence of recent streptococcal infection (↑ ASO). In this case: major = migratory polyarthritis; minor = fever + ↑ ESR/CRP; evidence = ↑ ASO titre.\n4. • Rheumatic fever: multiple, migratory (large) joints; response to aspirin; sterile fluid (aseptic, reactive); leaves the joints without complications.\n• Septic (suppurative) arthritis: single joint; high fever; purulent aspirate; no NSAID response; organisms reach the joint by direct spread from nearby osteomyelitis, haematogenous spread from a septic focus or an open fracture; it can rapidly destroy the joint and produce permanent deformities."}, "Q0657": {"id": "Q0657", "stem": "Case: A 50-year-old man with sudden onset of severe pain, redness, and swelling in the right big toe. History of episodes of intense pain in the big toe that resolve within a few days; recent dietary change with increased meat and alcohol intake. Physical exam reveals: red, swollen, and tender metatarsophalangeal (MTP) joint in the right big toe. Lab findings are: elevated serum uric acid level (> 6 mg/dl); joint aspiration shows needle-shaped, negatively birefringent crystals.\n1. What's the diagnosis?\n2. What are the risk factors of this case?\n3. What are the characteristic histopathological findings?\n4. What are the complications?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W27", "bank": true, "expl": "Podagra after meat and alcohol, hyperuricaemia and needle-shaped, negatively birefringent monosodium urate crystals mean acute gout; the deposited crystals trigger a neutrophil-rich acute inflammatory reaction, and chronic gout forms tophi (urate crystals with foreign-body giant cells and fibrosis) and urate nephropathy.", "type": "written", "keyhtml": "1. Acute gouty arthritis: sudden onset of severe pain, redness and swelling of the 1st MTP joint (great toe — podagra; the most common first manifestation); hyperuricaemia; joint aspiration with needle-shaped, negatively birefringent (monosodium urate) crystals under polarized light → pathognomonic for gout.\n2. Men over 30 years; family history; obesity; hypertension; thiazide diuretics; excess alcohol use. A diet high in purines (meat) will not cause gout, but may trigger an attack in a susceptible person (alcohol or meat may precipitate acute gout).\n3. • Acute gout: neutrophil-rich inflammatory infiltrate surrounding monosodium urate (MSU) crystals — the deposited crystals trigger an acute inflammatory reaction.\n• Chronic gout: tophi — aggregates of urate crystals surrounded by foreign-body-type giant cells and fibrous tissue (white, chalky deposits in soft tissue and joints).\n• Crystals: long, slender, needle-shaped; yellow under parallel and blue under perpendicular light (negative birefringence).\n4. Chronic gouty arthritis; tophi formation; joint deformity; secondary osteoarthritis; tophi may form draining sinuses that may become infected; renal: stones, pyelonephritis, obstructive renal disease (urate nephropathy → renal failure)."}, "N-PAT-L4-2-01": {"id": "N-PAT-L4-2-01", "stem": "A 9-year-old girl develops painful, swollen large joints; over a few days the arthritis moves from the knee to the elbow and then to the ankle. She had a streptococcal sore throat 3 weeks earlier, the joint fluid is sterile, and her symptoms respond to aspirin. What is the expected outcome for her joints?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is rheumatic arthritis — aseptic, reactive, post-streptococcal, migratory, affecting large joints and responding to aspirin — and it leaves the joints without complications. Rapid destruction with permanent deformities is the outcome of suppurative arthritis, and fibrous ankylosis that of tuberculous arthritis.", "type": "mcq", "opts": ["Rapid joint destruction with permanent deformities", "Severe destruction ending in fibrous ankylosis", "Progression to osteoarthritis", "The joints are left without complications", "Erosion into the adjacent bone and soft tissue"], "ans": 3}, "N-PAT-L4-2-02": {"id": "N-PAT-L4-2-02", "stem": "A 64-year-old man with long-standing diabetes mellitus and numbness of both feet develops a progressively deformed and destroyed ankle joint. Joint fluid shows no crystals and no organisms. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Final bank PAT Q55", "bank": true, "expl": "Neuropathic arthritis (Charcot joint) is due to nerve destruction and is common in diabetes mellitus or as a late manifestation of syphilis. Tuberculous arthritis also destroys the joint, but it spreads from the blood or nearby tuberculous osteomyelitis and ends in fibrous ankylosis.", "type": "mcq", "opts": ["Tuberculous arthritis", "Neuropathic arthritis (Charcot joint)", "Suppurative arthritis", "Pseudogout", "Traumatic arthritis"], "ans": 1}, "N-PAT-L4-2-03": {"id": "N-PAT-L4-2-03", "stem": "A 70-year-old woman has an attack of pain and swelling of the right knee that resembles gout clinically. X-ray shows a line of calcification of the articular cartilage. Which synovial fluid finding is expected under polarized light?", "top": false, "rep": "", "tag": "Final bank PAT Q56", "bank": true, "expl": "Knee involvement with a line of calcification of the articular cartilage points to pseudogout (calcium pyrophosphate dihydrate deposition), whose crystals are rhomboid-shaped with weakly positive birefringence. Needle-shaped crystals with negative birefringence are the monosodium urate crystals of gout.", "type": "mcq", "opts": ["Long, slender, needle-shaped crystals with negative birefringence", "Rhomboid-shaped crystals with weakly positive birefringence", "Long, slender, needle-shaped crystals with weakly positive birefringence", "Rhomboid-shaped crystals with negative birefringence"], "ans": 1}, "N-PAT-L4-2-04": {"id": "N-PAT-L4-2-04", "stem": "A 28-year-old woman notices a small, 1.2-cm swelling on her wrist next to a tendon sheath. It is excised, and the pathologist reports a multiloculated cystic lesion formed by myxoid degeneration and softening of connective tissue. Which statement about this lesion is correct?", "top": false, "rep": "", "tag": "Final bank PAT Q57", "bank": true, "expl": "This is a ganglion: a small (1–1.5 cm), multiloculated cyst near joint capsules or tendon sheaths (the wrist is a common site), formed by myxoid degeneration; it is not lined by epithelium and does not communicate with the joint space. Herniation of synovium through the capsule describes a synovial cyst such as Baker's cyst.", "type": "mcq", "opts": ["It is a herniation of synovium through the joint capsule", "It is lined by epithelium and communicates with the joint space", "It is not lined by epithelium and does not communicate with the joint space", "It is a benign neoplasm of the tendon sheath that forms multinucleated giant cells"], "ans": 2}, "N-PAT-L4-2-05": {"id": "N-PAT-L4-2-05", "stem": "A 35-year-old man has had pain, swelling and episodes of 'locking' of his right knee, with decreased range of motion. Imaging shows the lesion eroding into the adjacent bone. At surgery, the synovium is a tangled red-brown mass of folds, nodules and finger-like projections infiltrating the subsynovial tissue. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Final bank PAT Q58", "bank": true, "expl": "The diffuse type (previously called pigmented villonodular tenosynovitis) typically presents in the knee (80%) with pain, locking, swelling and decreased motion, and aggressive lesions erode into bone; grossly it forms tangled red-brown folds, nodules and finger-like projections. The localized type is a solitary painless, well-circumscribed nodule of the wrist and finger tendon sheaths.", "type": "mcq", "opts": ["Diffuse-type tenosynovial giant-cell tumour", "Localized-type tenosynovial giant-cell tumour", "Baker's cyst", "Pseudogout", "Tuberculous arthritis"], "ans": 0}, "N-PAT-L4-2-06": {"id": "N-PAT-L4-2-06", "stem": "A 40-year-old woman has a solitary, painless nodule on the tendon sheath of her index finger. It is excised as a well-circumscribed, nodular, red-brown to orange-yellow mass attached to the synovium by a pedicle. Which microscopic finding is expected?", "top": false, "rep": "", "tag": "Final bank PAT Q59", "bank": true, "expl": "A solitary painless nodule of a finger tendon sheath, attached by a pedicle, is the localized tenosynovial giant-cell tumour (giant cell tumour of the tendon sheath); its neoplastic cells are polyhedral and resemble synoviocytes, with heavy macrophage infiltration, haemosiderin and multinucleated giant cells. Uric acid aggregates with fibrosis and a giant-cell reaction describe a gouty tophus, not this tumour.", "type": "mcq", "opts": ["Polyhedral synoviocyte-like cells with macrophages, haemosiderin and multinucleated giant cells", "Aggregates of uric acid crystals surrounded by fibrosis and a giant-cell reaction", "Multiloculated cystic spaces from myxoid degeneration with no epithelial lining", "A hyperplastic synovial lining with scattered inflammation"], "ans": 0}, "N-PAT-L4-2-07": {"id": "N-PAT-L4-2-07", "stem": "A 40-year-old man with tuberculous osteomyelitis of the femoral neck develops a chronic, progressive arthritis of the adjacent hip. What is the characteristic end-result of this chronic joint disease?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Tuberculous arthritis arises by haematogenous spread or from nearby tuberculous osteomyelitis, commonly involves the hips, knees and ankles, and as a chronic disease results in severe destruction with fibrous ankylosis. Progression to osteoarthritis is the outcome given for traumatic arthritis.", "type": "mcq", "opts": ["Severe destruction with fibrous ankylosis", "The joint is left without complications", "Progression to osteoarthritis", "Tophi in the soft tissue around the joint", "A line of calcification of the articular cartilage"], "ans": 0}, "N-PAT-L4-2-08": {"id": "N-PAT-L4-2-08", "stem": "A 3-year-old boy with mental retardation and self-mutilation has a markedly raised serum uric acid. How is his hyperuricaemia best classified?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Hyperuricaemia with mental retardation and self-mutilation is Lesch–Nyhan syndrome, an X-linked deficiency of hypoxanthine-guanine phosphoribosyl transferase (HGPRT) and a cause of secondary gout. Primary gout is the most common form, but its cause is unknown, so it does not fit a defined syndrome.", "type": "mcq", "opts": ["Primary gout — the aetiology of the hyperuricaemia is unknown", "Secondary gout — X-linked deficiency of HGPRT (Lesch–Nyhan syndrome)", "Secondary gout — increased cell turnover in a myeloproliferative disorder", "Secondary gout — decreased renal excretion of uric acid in renal insufficiency"], "ans": 1}, "N-PAT-L4-2-09": {"id": "N-PAT-L4-2-09", "stem": "A 60-year-old man with long-standing gout has a firm nodule on the ear that discharges white, chalky material. Microscopy shows aggregates of uric acid crystals with fibrosis and a giant-cell reaction. Which other complication of this stage of his disease should be looked for?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The nodule is a tophus, and chronic gout has two consequences: tophi and renal failure, as urate crystals deposit in the kidney tubules (urate nephropathy). A line of calcification of the articular cartilage is the X-ray sign of pseudogout, not gout.", "type": "mcq", "opts": ["Renal failure from urate crystals deposited in the kidney tubules", "Fibrous ankylosis of the hip", "A line of calcification of the articular cartilage of the knee", "Erosion of a synovial tumour into the adjacent bone", "Permanent deformities after rapid joint destruction"], "ans": 0}, "N-PAT-L4-2-10": {"id": "N-PAT-L4-2-10", "stem": "A 55-year-old man has a swelling in the popliteal fossa behind his knee. Excision shows a cyst formed by synovium that has herniated through the joint capsule; its synovial lining is hyperplastic with scattered inflammation. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Synovial cysts are herniations of synovium through joint capsules, their lining may be hyperplastic with scattered inflammation, and the commonest example is Baker's cyst in the popliteal fossa. A ganglion arises from myxoid degeneration of connective tissue and has no lining.", "type": "mcq", "opts": ["Ganglion", "Baker's cyst (synovial cyst)", "Localized tenosynovial giant-cell tumour", "Diffuse tenosynovial giant-cell tumour", "Gouty tophus"], "ans": 1}, "N-PAT-L4-2-11": {"id": "N-PAT-L4-2-11", "stem": "Which of the following is classified as an acute arthritis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The acute arthritides are suppurative, traumatic and rheumatic (STaR). Rheumatoid, osteoarthritis, gout and pseudogout, tuberculous and neuropathic arthritis are all chronic.", "type": "mcq", "opts": ["Tuberculous arthritis", "Neuropathic arthritis", "Traumatic arthritis", "Pseudogout", "Rheumatoid arthritis"], "ans": 2}, "N-PAT-L4-2-12": {"id": "N-PAT-L4-2-12", "stem": "Compare gout and pseudogout as regards: the crystal deposited, crystal shape, birefringence under polarized light, joint most commonly involved, and X-ray finding.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Gout is MSU deposition with needle-shaped, negatively birefringent crystals, classically in the first metatarsophalangeal joint. Pseudogout is CPPD deposition with rhomboid, weakly positive crystals, classically in the knee, with a line of calcification of the articular cartilage on X-ray.", "type": "written", "keyhtml": "• Crystal: gout — monosodium urate (MSU), due to hyperuricaemia; pseudogout — calcium pyrophosphate dihydrate (CPPD); it resembles gout clinically.\n• Crystal shape: gout — long, slender, needle-shaped; pseudogout — rhomboid-shaped.\n• Polarized light: gout — negative birefringence; pseudogout — weakly positive birefringence.\n• Joint most commonly involved: gout — first metatarsophalangeal joint (great toe, podagra); pseudogout — the knee.\n• X-ray: pseudogout — characteristic line of calcification of the articular cartilage."}, "N-PAT-L4-2-13": {"id": "N-PAT-L4-2-13", "stem": "Gout: define it, enumerate the causes of secondary gout, and mention the features of acute and chronic gout and the laboratory findings.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Gout is MSU crystal deposition due to hyperuricaemia; primary gout (cause unknown) is the most common form, and the secondary causes are leukaemia/myeloproliferative disorders, Lesch–Nyhan syndrome and renal insufficiency. Acute gout is podagra; chronic gout brings tophi and urate nephropathy.", "type": "written", "keyhtml": "• Definition: deposition of monosodium urate (MSU) crystals in tissues, especially the joints, due to hyperuricaemia (overproduction or decreased excretion of uric acid). Uric acid is derived from purine metabolism and excreted by the kidney.\n• Primary gout: the most common form; the aetiology of the hyperuricaemia is unknown.\n• Secondary gout: leukaemia &amp; myeloproliferative disorders (increased cell turnover); Lesch–Nyhan syndrome (X-linked HGPRT deficiency — mental retardation &amp; self-mutilation); renal insufficiency (decreased renal excretion of uric acid).\n• Acute gout: exquisitely painful arthritis of the great toe (podagra); MSU crystals deposited in the joint trigger an acute inflammatory reaction; alcohol or meat may precipitate it.\n• Chronic gout: tophi — white, chalky aggregates of uric acid crystals with fibrosis and a giant-cell reaction in soft tissue and joints; renal failure — urate crystals deposit in the kidney tubules (urate nephropathy).\n• Laboratory: hyperuricaemia in the blood; synovial fluid shows long, slender, needle-shaped MSU crystals with negative birefringence under polarized light."}, "N-PAT-L4-2-14": {"id": "N-PAT-L4-2-14", "stem": "Tenosynovial giant-cell tumour: define it, compare its diffuse and localized types (other name, site, presentation, behaviour and gross appearance), and describe its microscopic picture.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Tenosynovial giant-cell tumours are benign neoplasms of synovium, tendon sheaths and bursae. The diffuse type (ex-pigmented villonodular tenosynovitis) involves the knee and can erode bone, while the localized type is a solitary painless mass of wrist and finger tendon sheaths; both show synoviocyte-like cells, macrophages, haemosiderin and giant cells.", "type": "written", "keyhtml": "• Definition: a term for a group of closely related benign neoplasms involving synovial membranes, tendon sheaths and bursae; it has a localized and a diffuse variant.\n• Other name: diffuse — previously called pigmented villonodular tenosynovitis; localized — giant cell tumour of the tendon sheath.\n• Site: diffuse — typically the knee (80%); localized — tendon sheaths of the wrist and fingers.\n• Presentation: diffuse — pain, 'locking' and swelling with decreased range of motion; localized — a solitary painless mass.\n• Behaviour: diffuse — aggressive lesions erode into the bone and adjacent soft tissue.\n• Gross: both red-brown to mottled orange-yellow. Diffuse — synovium is a tangled red-brown fold with nodules and finger-like projections spreading along the articular surface and infiltrating the subsynovial tissue; localized — well-circumscribed and nodular, may be attached to the synovium by a pedicle.\n• Microscopy: neoplastic cells are polyhedral and resemble synoviocytes; heavily infiltrated by macrophages; often contain haemosiderin; form multinucleated giant cells."}, "N-PAT-L4-2-15": {"id": "N-PAT-L4-2-15", "stem": "Compare ganglion and synovial cyst as regards: nature, site, origin and lining. Mention the commonest example of a synovial cyst.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A ganglion is a 1–1.5 cm multiloculated cyst from myxoid degeneration near a joint capsule or tendon sheath (often the wrist), with no epithelial lining and no communication with the joint. A synovial cyst is synovium herniated through the capsule, e.g. Baker's cyst in the popliteal fossa.", "type": "written", "keyhtml": "• Nature: ganglion — small (1–1.5 cm), multiloculated cystic lesion of connective tissue; synovial cyst — herniation of synovium through the joint capsule.\n• Site: ganglion — near joint capsules or tendon sheaths; the wrist is a common site.\n• Origin: ganglion — myxoid degeneration and softening of connective tissue.\n• Lining: ganglion — not lined by epithelium and does not communicate with the joint space; synovial cyst — synovial lining, which may be hyperplastic with scattered inflammation.\n• Commonest example of a synovial cyst: Baker's cyst in the popliteal fossa."}, "N-PAT-L4-2-16": {"id": "N-PAT-L4-2-16", "stem": "Classify arthritis. Mention the routes of infection and the outcome of suppurative arthritis, and the outcomes of traumatic and tuberculous arthritis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Acute arthritis is suppurative, traumatic or rheumatic; chronic arthritis is rheumatoid, osteoarthritis, gout/pseudogout, tuberculous or neuropathic. Suppurative arthritis can rapidly destroy a joint with permanent deformities, traumatic arthritis can lead to osteoarthritis, and tuberculous arthritis ends in fibrous ankylosis.", "type": "written", "keyhtml": "• Arthritis = inflammation of the joints (cartilage and synovial membrane).\n• Acute: suppurative, traumatic, rheumatic.\n• Chronic: rheumatoid arthritis, osteoarthritis, gout &amp; pseudogout, tuberculous, neuropathic (Charcot joint).\n• Suppurative arthritis — routes: direct spread from nearby osteomyelitis; haematogenous spread from a septic focus; open fracture. Outcome: can rapidly destroy a joint and produce permanent deformities.\n• Traumatic arthritis: can lead to osteoarthritis.\n• Tuberculous arthritis: haematogenous or from nearby tuberculous osteomyelitis; hips, knees and ankles; chronic disease → severe destruction with fibrous ankylosis."}}, "labs": {}, "cards": [{"id": "PAT-L4-2-001", "text": "Arthritis = inflammation of the joints — of the {{c1::cartilage}} and the {{c2::synovial membrane}}.", "extra": "", "sec": "Part 01 · 1.1 Definition"}, {"id": "PAT-L4-2-002", "text": "Acute arthritis (3 types): {{c1::suppurative}} · {{c2::traumatic}} · {{c3::rheumatic}}.", "extra": "Mnemonic: STaR.", "sec": "Part 01 · 1.2 Classification"}, {"id": "PAT-L4-2-003", "text": "Chronic arthritis (5 types): {{c1::rheumatoid}} · {{c2::osteoarthritis}} · {{c3::gout & pseudogout}} · {{c4::tuberculous}} · {{c5::neuropathic}}.", "extra": "Mnemonic: Really Old Guys Take Naps.", "sec": "Part 01 · 1.2 Classification"}, {"id": "PAT-L4-2-004", "text": "Routes of suppurative arthritis: {{c1::direct spread from nearby osteomyelitis}} · {{c2::haematogenous from a septic focus}} · {{c3::open fracture}}.", "extra": "TB arthritis can likewise arise from nearby TB osteomyelitis.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-005", "text": "Outcome of suppurative arthritis: it can {{c1::rapidly destroy}} a joint and produce {{c2::permanent deformities}}.", "extra": "Opposite of rheumatic arthritis (no complications).", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-006", "text": "Traumatic arthritis can lead to {{c1::osteoarthritis}}.", "extra": "Acute arthritis type 2 of STaR.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-007", "text": "Rheumatic arthritis is {{c1::aseptic}}, {{c2::reactive}} and {{c3::post-streptococcal}}.", "extra": "Sterile joint fluid.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-008", "text": "Rheumatic arthritis affects {{c1::large}} joints, is {{c2::migratory}} and responds to {{c3::aspirin}}.", "extra": "Mnemonic LAMP: Large joints · Aspirin · Migratory · Post-streptococcal.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-009", "text": "Outcome of rheumatic arthritis: it leaves the joints {{c1::without complications}}.", "extra": "Suppurative arthritis → permanent deformities.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-010", "text": "Child with migratory arthritis of large joints 3 weeks after streptococcal tonsillitis, raised ASO titre, responding to aspirin → {{c1::acute rheumatic fever (rheumatic arthritis)}}.", "extra": "Aseptic, reactive, post-streptococcal arthritis.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-011", "text": "Rheumatic fever risk factors: peak age {{c1::5–15}} years · recent untreated {{c2::group A streptococcal pharyngitis}}.", "extra": "Official GD answer — not in the pamphlet. Also overcrowding, recurrent untreated sore throat, family history.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-012", "text": "Jones major criteria: {{c1::migratory polyarthritis}} · {{c2::carditis}} · {{c3::subcutaneous nodules}} · {{c4::erythema marginatum}} · {{c5::Sydenham's chorea}}.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-013", "text": "Jones minor criteria: {{c1::fever}} · {{c2::arthralgia}} · {{c3::raised ESR/CRP}} · {{c4::prolonged PR interval}}.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-014", "text": "Jones diagnosis of rheumatic fever: {{c1::2 major}} or {{c2::1 major + 2 minor}} criteria, plus evidence of recent streptococcal infection ({{c3::raised ASO titre}}).", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-015", "text": "Septic (suppurative) vs rheumatic arthritis: septic — {{c1::single}} joint, high fever, {{c2::purulent}} aspirate, no NSAID response; rheumatic — multiple migratory joints, {{c3::sterile}} fluid, aspirin response.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 01 · 1.3 I — Acute arthritis"}, {"id": "PAT-L4-2-016", "text": "Tuberculous arthritis arises by {{c1::haematogenous}} spread or from nearby {{c2::tuberculous osteomyelitis}}.", "extra": "A chronic arthritis.", "sec": "Part 01 · 1.4 II — Chronic arthritis"}, {"id": "PAT-L4-2-017", "text": "Joints commonly involved in tuberculous arthritis: {{c1::hips}} · {{c2::knees}} · {{c3::ankles}}.", "extra": "", "sec": "Part 01 · 1.4 II — Chronic arthritis"}, {"id": "PAT-L4-2-018", "text": "End-result of chronic tuberculous arthritis: severe destruction with {{c1::fibrous ankylosis}}.", "extra": "Traumatic → OA · rheumatic → no complications · suppurative → permanent deformities.", "sec": "Part 01 · 1.4 II — Chronic arthritis"}, {"id": "PAT-L4-2-019", "text": "Neuropathic arthritis, also known as {{c1::Charcot joint}}, is due to {{c2::nerve destruction}}.", "extra": "A chronic arthritis.", "sec": "Part 01 · 1.4 II — Chronic arthritis"}, {"id": "PAT-L4-2-020", "text": "Neuropathic (Charcot) arthritis is common in {{c1::diabetes mellitus}} or as a late manifestation of {{c2::syphilis}}.", "extra": "Charcot's 2 S's: Sugar & Syphilis.", "sec": "Part 01 · 1.4 II — Chronic arthritis"}, {"id": "PAT-L4-2-021", "text": "Gout = deposition of {{c1::monosodium urate (MSU)}} crystals in tissues, especially the {{c2::joints}}.", "extra": "", "sec": "Part 02 · 2.1 Definition & cause"}, {"id": "PAT-L4-2-022", "text": "Gout is due to {{c1::hyperuricaemia}}, from {{c2::overproduction}} or {{c3::decreased excretion}} of uric acid.", "extra": "", "sec": "Part 02 · 2.1 Definition & cause"}, {"id": "PAT-L4-2-023", "text": "Uric acid is derived from {{c1::purine}} metabolism and excreted by the {{c2::kidney}}.", "extra": "", "sec": "Part 02 · 2.1 Definition & cause"}, {"id": "PAT-L4-2-024", "text": "The most common form of gout is {{c1::primary}} gout, in which the cause of the hyperuricaemia is {{c2::unknown}}.", "extra": "The identifiable causes are the secondary ones.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-025", "text": "Causes of secondary gout: {{c1::leukaemia & myeloproliferative disorders}} · {{c2::Lesch–Nyhan syndrome}} · {{c3::renal insufficiency}}.", "extra": "Mnemonic 3 L's: Leukaemia · Lesch–Nyhan · Loss of renal function.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-026", "text": "Leukaemia & myeloproliferative disorders cause secondary gout through {{c1::increased cell turnover}} → hyperuricaemia.", "extra": "Renal insufficiency instead ↓ renal excretion of uric acid.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-027", "text": "Leukaemia patient after chemotherapy develops a wrist arthritis with needle-shaped, negatively birefringent crystals; mechanism: {{c1::excess uric acid production from dying leukaemic cells}}.", "extra": "Secondary gout — not leukaemic infiltration of the synovium.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-028", "text": "Lesch–Nyhan syndrome = {{c1::X-linked}} deficiency of {{c2::HGPRT}} (hypoxanthine-guanine phosphoribosyl transferase).", "extra": "A cause of secondary gout.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-029", "text": "Lesch–Nyhan syndrome presents with hyperuricaemia, {{c1::mental retardation}} and {{c2::self-mutilation}}.", "extra": "X-linked HGPRT deficiency.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-030", "text": "Renal insufficiency causes secondary gout by {{c1::decreased renal excretion}} of uric acid.", "extra": "", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-031", "text": "Gout risk factors: {{c1::men over 30}} · {{c2::family history}} · {{c3::obesity}} · {{c4::hypertension}} · {{c5::thiazide diuretics}} · {{c6::excess alcohol}}.", "extra": "Official GD answer — not in the pamphlet. A purine-rich diet (meat) does not cause gout but may trigger an attack.", "sec": "Part 02 · 2.2 Primary & secondary gout"}, {"id": "PAT-L4-2-032", "text": "Acute gout: exquisitely painful arthritis of the great toe = {{c1::podagra}}.", "extra": "GD: the most common first manifestation of gout.", "sec": "Part 02 · 2.3 Acute gout"}, {"id": "PAT-L4-2-033", "text": "In acute gout, MSU crystals deposited in the joint trigger an {{c1::acute inflammatory reaction}}.", "extra": "Mechanism of joint injury in gout.", "sec": "Part 02 · 2.3 Acute gout"}, {"id": "PAT-L4-2-034", "text": "Acute gout attacks may be precipitated by {{c1::alcohol}} or {{c2::meat}}.", "extra": "", "sec": "Part 02 · 2.3 Acute gout"}, {"id": "PAT-L4-2-035", "text": "Acute gout histology: a {{c1::neutrophil}}-rich inflammatory infiltrate surrounding MSU crystals.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 02 · 2.3 Acute gout"}, {"id": "PAT-L4-2-036", "text": "Big-toe MTP attack after meat & alcohol, serum uric acid > 6 mg/dl, needle-shaped negatively birefringent crystals → {{c1::acute gouty arthritis}}.", "extra": "Differential: pseudogout (rhomboid, weakly positive, knee).", "sec": "Part 02 · 2.3 Acute gout"}, {"id": "PAT-L4-2-037", "text": "Two consequences of chronic gout: {{c1::tophi}} and {{c2::renal failure (urate nephropathy)}}.", "extra": "", "sec": "Part 02 · 2.4 Chronic gout"}, {"id": "PAT-L4-2-038", "text": "Tophi: white, chalky aggregates of {{c1::uric acid crystals}} with {{c2::fibrosis}} and a {{c3::giant cell reaction}}, in soft tissue and joints.", "extra": "GD: foreign-body-type giant cells.", "sec": "Part 02 · 2.4 Chronic gout"}, {"id": "PAT-L4-2-039", "text": "Urate nephropathy: urate crystals deposit in the {{c1::kidney tubules}} → renal failure.", "extra": "Chronic gout.", "sec": "Part 02 · 2.4 Chronic gout"}, {"id": "PAT-L4-2-040", "text": "Recurrent MTP attacks after meat or wine, a chalky white deposit beside the joint, and an elbow nodule showing a tophus → {{c1::gouty arthritis}}.", "extra": "Rheumatoid nodules also sit on extensor surfaces, but have no chalky urate.", "sec": "Part 02 · 2.4 Chronic gout"}, {"id": "PAT-L4-2-041", "text": "Joint complications of gout: chronic gouty arthritis · tophi · joint deformity · {{c1::secondary osteoarthritis}}; tophi may form {{c2::draining sinuses}} that become infected.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 02 · 2.4 Chronic gout"}, {"id": "PAT-L4-2-042", "text": "Renal complications of gout: {{c1::stones}} · {{c2::pyelonephritis}} · {{c3::urate nephropathy}} → renal failure.", "extra": "Official GD answer — not in the pamphlet. Pamphlet: urate nephropathy only.", "sec": "Part 02 · 2.4 Chronic gout"}, {"id": "PAT-L4-2-043", "text": "Lab findings in gout: {{c1::hyperuricaemia}} in the blood; needle-shaped MSU crystals with negative birefringence in the synovial fluid.", "extra": "Normal uric acid argues against gout.", "sec": "Part 02 · 2.5 Laboratory findings"}, {"id": "PAT-L4-2-044", "text": "Under polarized light, gout crystals are {{c1::yellow}} when parallel and {{c2::blue}} when perpendicular = negative birefringence.", "extra": "Official GD answer — not in the pamphlet.", "sec": "Part 02 · 2.5 Laboratory findings"}, {"id": "PAT-L4-2-045", "text": "{{c1::Pseudogout}} resembles gout clinically but is due to deposition of calcium pyrophosphate dihydrate (CPPD).", "extra": "Pseudogout's P's: Pyrophosphate · weakly Positive.", "sec": "Part 03 · 3.1 Pseudogout"}, {"id": "PAT-L4-2-046", "text": "Crystal deposited — gout: {{c1::monosodium urate (MSU)}}; pseudogout: {{c2::calcium pyrophosphate dihydrate (CPPD)}}.", "extra": "", "sec": "Part 03 · 3.2 Gout vs pseudogout"}, {"id": "PAT-L4-2-047", "text": "Crystal shape — gout: {{c1::long, slender, needle-shaped}}; pseudogout: {{c2::rhomboid-shaped}}.", "extra": "Gout's N's: Needle · Negative.", "sec": "Part 03 · 3.2 Gout vs pseudogout"}, {"id": "PAT-L4-2-048", "text": "Birefringence under polarized light — gout: {{c1::negative}}; pseudogout: {{c2::weakly positive}}.", "extra": "Trap: never swap the pairs.", "sec": "Part 03 · 3.2 Gout vs pseudogout"}, {"id": "PAT-L4-2-049", "text": "Joint most commonly involved — gout: {{c1::first metatarsophalangeal joint}}; pseudogout: {{c2::knee}}.", "extra": "Great toe = podagra.", "sec": "Part 03 · 3.2 Gout vs pseudogout"}, {"id": "PAT-L4-2-050", "text": "X-ray in pseudogout: a characteristic line of {{c1::calcification of the articular cartilage}}.", "extra": "No such X-ray sign is given for gout.", "sec": "Part 03 · 3.2 Gout vs pseudogout"}, {"id": "PAT-L4-2-051", "text": "Tumours & tumour-like lesions of joints: {{c1::ganglion & synovial cysts}} and {{c2::tenosynovial giant-cell tumour}}.", "extra": "", "sec": "Part 04 · 4.1 Ganglions"}, {"id": "PAT-L4-2-052", "text": "Ganglion: a small ({{c1::1–1.5 cm}}), {{c2::multiloculated}} cystic lesion of connective tissue near joint capsules or tendon sheaths.", "extra": "Common site: the wrist.", "sec": "Part 04 · 4.1 Ganglions"}, {"id": "PAT-L4-2-053", "text": "Common site of a ganglion: the {{c1::wrist}}.", "extra": "Near joint capsules or tendon sheaths.", "sec": "Part 04 · 4.1 Ganglions"}, {"id": "PAT-L4-2-054", "text": "Ganglions arise through {{c1::myxoid degeneration}} and softening of connective tissue.", "extra": "Ganglion = Gel in a Gap.", "sec": "Part 04 · 4.1 Ganglions"}, {"id": "PAT-L4-2-055", "text": "A ganglion is {{c1::not lined by epithelium}} and {{c2::does not communicate}} with the joint space.", "extra": "Ganglion's 2 No's.", "sec": "Part 04 · 4.1 Ganglions"}, {"id": "PAT-L4-2-056", "text": "Synovial cyst = {{c1::herniation of synovium}} through the joint capsule.", "extra": "Ganglion instead = myxoid degeneration of connective tissue.", "sec": "Part 04 · 4.2 Synovial cysts"}, {"id": "PAT-L4-2-057", "text": "The lining of a synovial cyst is synovium that may be {{c1::hyperplastic}} with scattered {{c2::inflammation}}.", "extra": "A ganglion has no epithelial lining.", "sec": "Part 04 · 4.2 Synovial cysts"}, {"id": "PAT-L4-2-058", "text": "Commonest example of a synovial cyst: {{c1::Baker's cyst}} in the {{c2::popliteal fossa}}.", "extra": "", "sec": "Part 04 · 4.2 Synovial cysts"}, {"id": "PAT-L4-2-059", "text": "Tenosynovial giant-cell tumour = a group of closely related {{c1::benign neoplasms}} involving {{c2::synovial membranes, tendon sheaths and bursae}}.", "extra": "Two variants: localized and diffuse.", "sec": "Part 05 · 5.1 Definition"}, {"id": "PAT-L4-2-060", "text": "The diffuse type of tenosynovial giant-cell tumour was previously called {{c1::pigmented villonodular tenosynovitis}}.", "extra": "Trap: old name of the diffuse type, not the localized one.", "sec": "Part 05 · 5.2 Variants"}, {"id": "PAT-L4-2-061", "text": "The localized type of tenosynovial giant-cell tumour = {{c1::giant cell tumour of the tendon sheath}}.", "extra": "", "sec": "Part 05 · 5.2 Variants"}, {"id": "PAT-L4-2-062", "text": "Diffuse tenosynovial giant-cell tumour typically presents in the {{c1::knee}} ({{c2::80%}}).", "extra": "Diffuse = Destructive knee.", "sec": "Part 05 · 5.2 Variants"}, {"id": "PAT-L4-2-063", "text": "Diffuse tenosynovial giant-cell tumour presents with pain, {{c1::\"locking\"}} and swelling, with decreased range of motion.", "extra": "", "sec": "Part 05 · 5.2 Variants"}, {"id": "PAT-L4-2-064", "text": "Aggressive diffuse tenosynovial giant-cell tumours {{c1::erode into the bone}} and adjacent soft tissue.", "extra": "Trap: benign, yet the diffuse type can erode bone.", "sec": "Part 05 · 5.2 Variants"}, {"id": "PAT-L4-2-065", "text": "Localized tenosynovial giant-cell tumour: a {{c1::solitary painless}} mass of the tendon sheaths of the {{c2::wrist and fingers}}.", "extra": "Localized = Lone & painLess.", "sec": "Part 05 · 5.2 Variants"}, {"id": "PAT-L4-2-066", "text": "Gross colour of tenosynovial giant-cell tumours: {{c1::red-brown to mottled orange-yellow}}.", "extra": "Shared by both types.", "sec": "Part 05 · 5.3 Gross appearance"}, {"id": "PAT-L4-2-067", "text": "Gross diffuse tenosynovial giant-cell tumour: tangled red-brown folds, nodules and {{c1::finger-like projections}} spreading along the articular surface and infiltrating the {{c2::subsynovial tissue}}.", "extra": "", "sec": "Part 05 · 5.3 Gross appearance"}, {"id": "PAT-L4-2-068", "text": "Gross localized tenosynovial giant-cell tumour: /* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
const LAB = {};
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;

   <div class="pool">${st.order.filter(i => i >= st.n).map(i => `<button class="chip ${st.shake === i ? 'shake' : ''}" data-act="qpick" data-l="${L.id}" data-i="${i}">${esc(L.steps[i])}</button>`).join('')}</div>

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
