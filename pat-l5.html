a:<\/b> SCC loose C.T., few inflammatory cells vs BCC fibrous stroma with inflammatory cells"]}]}, {"id": "p44", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l5-6-0", "title": "Recall · Skin Lesions Compared (1/2)", "groups": [{"title": "7.1 Benign vs malignant — the lecture's table", "items": [["Growth:", "benign slow, expansion vs malignant rapid, infiltration"], ["Gross:", "benign small, well circumscribed ± capsule vs malignant large, infiltrative"], ["Malignant:", "ulceration, haemorrhage, necrosis, higher vascularity"], ["Malignant micro:", "↑ N/C ratio, ↑ chromatin, large nucleolus, pleomorphism, ↑ mitosis, loss of polarity"], ["Prognosis:", "benign rare recurrence, no metastasis, mass effect; malignant recurs, metastasizes, may be fatal"]]}]}], "labName": "Recall · Skin Lesions Compared (1/2)"}, {"id": "p45", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l5-6-1", "title": "Recall · Skin Lesions Compared (2/2)", "groups": [{"title": "7.2 SCC vs BCC", "items": [["Age:", "SCC 60 y vs BCC middle age/elderly"], ["Risk:", "SCC chronic skin ulcers vs BCC immunosuppression (both sun, fair skin)"], ["Gross:", "SCC raised everted edges vs BCC rodent ulcer inverted/beaded edge"], ["Micro:", "SCC epithelial pearls vs BCC peripheral palisading"], ["Stroma:", "SCC loose C.T., few inflammatory cells vs BCC fibrous stroma with inflammatory cells"]]}]}], "labName": "Recall · Skin Lesions Compared (2/2)"}, {"id": "p46", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PAT-L5-05"}, {"t": "flap", "q": "Q0528"}]}, {"id": "p47", "head": "Part 07 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-PAT-L5-06"}]}, {"id": "p48", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "One-liners, mnemonics, numbers, melanocytic tumors side by side"}, {"t": "h", "no": "", "title": "One-liners, mnemonics, numbers, melanocytic tumors side by side"}, {"t": "list", "items": ["<b>Numbers:<\/b> melanoma 40–70; T stage in mm; SCC 60 y; BCC shave biopsy 50% recurrence", "Pearls = SCC, Palisades = BCC; everted SCC, inverted BCC", "<b>Lecture resource:<\/b> Kaplan review for USMLE Step 1, pp 307–310"]}, {"t": "note", "kind": "mn", "html": "A-B-C-D melanoma; PARA-keratosis keeps nuclei; Munro on top, Kogoj lower"}], "toc": ["08", "Rapid Revision"]}, {"id": "p49", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l5-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonics, numbers, melanocytic tumors side by side", "items": [["Numbers:", "melanoma 40–70; T stage in mm; SCC 60 y; BCC shave biopsy 50% recurrence"], ["Mnemonics:", "A-B-C-D melanoma; PARA-keratosis keeps nuclei; Munro on top, Kogoj lower"], ["Pearls =", "SCC, Palisades = BCC; everted SCC, inverted BCC"], ["Lecture resource:", "Kaplan review for USMLE Step 1, pp 307–310"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p50", "head": "Real images · 1 of 14", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one. Every slide of the session is in the practical book: <a href=\"prac-pat-2.html\">Pathology practical · Lab 2 – Skin &amp; soft tissue tumours<\/a>."}, {"t": "lab", "lab": "sl138"}], "toc": ["◉", "Real images from the practical"], "labName": "Epithelial tumors"}, {"id": "p51", "head": "Real images · 2 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl143"}], "labName": ": Organ : Diagnosis"}, {"id": "p52", "head": "Real images · 3 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl146"}], "labName": "Malignant Tumors SQUAMOUS CELL CARCINOMA"}, {"id": "p53", "head": "Real images · 4 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl147"}], "labName": "Malignant Tumors SQUAMOUS CELL CARCINOMA"}, {"id": "p54", "head": "Real images · 5 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl148"}], "labName": "SQUAMOUS CELL CARCINOMA"}, {"id": "p55", "head": "Real images · 6 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl149"}], "labName": "SQUAMOUS CELL CARCINOMA"}, {"id": "p56", "head": "Real images · 7 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl150"}], "labName": "SQUAMOUS CELL CARCINOMA"}, {"id": "p57", "head": "Real images · 8 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl152"}], "labName": "Basal cell carcinoma"}, {"id": "p58", "head": "Real images · 9 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl153"}], "labName": "Basal cell carcinoma"}, {"id": "p59", "head": "Real images · 10 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl154"}], "labName": "Skin & soft tissue tumours · slide 18"}, {"id": "p60", "head": "Real images · 11 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl155"}], "labName": "Basal cell carcinoma"}, {"id": "p61", "head": "Real images · 12 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl156"}], "labName": "Basal cell carcinoma Basal cell carcinoma"}, {"id": "p62", "head": "Real images · 13 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl157"}], "labName": "Basal cell carcinoma"}, {"id": "p63", "head": "Real images · 14 of 14", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl159"}], "labName": "SKIN: normal histology"}, {"id": "p64", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "h", "no": "?", "title": "Name it — spotter practice"}, {"t": "note", "kind": "hy", "title": "How it works", "html": "4 pictures from the practical slides of this lecture, each with its title and every label covered, in a new order. Say what it is out loud, then pick. Every one is also in Exam mode."}], "toc": ["?", "Name it — spotter practice"]}, {"id": "p65", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-159"}, {"t": "check", "q": "PRQ-152"}]}, {"id": "p66", "head": "Real images · Name it", "kind": "text", "blocks": [{"t": "check", "q": "PRQ-145"}, {"t": "check", "q": "PRQ-161"}]}, {"id": "p67", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Giant congenital nevus carries risk of malignant melanoma"}, {"t": "note", "kind": "trap", "html": "Melanocytic nevus: malignant transformation rare; dysplastic nevus carries melanoma risk"}, {"t": "note", "kind": "trap", "html": "Familial melanoma: loss of P16 tumour suppressor gene"}, {"t": "note", "kind": "trap", "html": "Superficially spreading = epidermis; vertical, nodular = dermis"}, {"t": "note", "kind": "trap", "html": "Psoriasis is autoimmune with a clear genetic component"}, {"t": "note", "kind": "trap", "html": "BCC: very rare metastasis; shave biopsy → 50% recurrence"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p68", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "SCC edge raised everted vs BCC inverted/beaded; cell nest = SCC; palisading = BCC"}, {"t": "note", "kind": "cl", "html": "Melanoma T stage based on depth of invasion in mm"}, {"t": "note", "kind": "cl", "html": "Melanoma: local tumours excised; systemic disease chemotherapy or immunotherapy"}, {"t": "note", "kind": "cl", "html": "BCC rodent ulcer on face/nose (e.g. medial canthus)"}, {"t": "note", "kind": "cl", "html": "BCC: complete wide local excision curative"}]}, {"id": "p69", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0526": {"id": "Q0526", "stem": "____ nevus carries risk of malignant transformation.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W30", "bank": true, "expl": "Giant congenital nevus (birth mark) carries a risk of malignant melanoma, and dysplastic nevi — larger, more irregular and usually multiple — also carry a risk of melanoma. In an ordinary melanocytic nevus, by contrast, malignant transformation is rare.", "type": "written", "keyhtml": "Giant congenital nevus (birth mark) — carries a risk of malignant melanoma. (Dysplastic nevus also carries a risk of developing melanoma; in an ordinary melanocytic nevus malignant transformation is rare.)"}, "Q0527": {"id": "Q0527", "stem": "Mention the types of melanocytic nevus.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W31", "bank": true, "expl": "The three types of nevocellular nevus differ in appearance: junctional nevi are flat and brown to black, compound nevi are slightly elevated, and intradermal nevi are dome-shaped, warty or sessile and lighter in colour.", "type": "written", "keyhtml": "Melanocytic (nevocellular) nevus types:\n1. Junctional nevus: flat, brown to black.\n2. Compound nevus: slightly elevated, brown or light brown.\n3. Intradermal nevus: dome-shaped, warty or sessile; light brown or flesh-coloured.\n(Other nevi among the melanocytic tumours of skin: congenital nevus (birth mark) and dysplastic nevus.)"}, "Q0528": {"id": "Q0528", "stem": "The edges of the ulcers in squamous cell carcinoma are ____ and ____, while in basal cell carcinoma they are ____.", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W32", "bank": true, "expl": "Squamous cell carcinoma is a nodular mass that rapidly ulcerates with raised everted edges, whereas basal cell carcinoma forms a rodent ulcer with an inverted or beaded edge. Everted = SCC, inverted = BCC.", "type": "written", "keyhtml": "SCC: raised and everted (a nodular mass that rapidly ulcerates). BCC: inverted or beaded (rolled) edges — rodent ulcer."}, "Q0539": {"id": "Q0539", "stem": "A 49-year-old woman has been bothered for at least 20 years by recurring skin lesions that are most prominent over the elbows and knees and sometimes on the scalp and lumbosacral area. These skin lesions are silvery to salmon-coloured, 1- to 4-cm plaques with scaling. The lesions seem to form more readily at sites of minor trauma, such as a superficial abrasion. She has had increasing pain in her left hand and in her hips, more prominent on the left, over the past 2 years. On physical examination, she has yellow-brown discoloration with pitting of the fingernails. The distal interphalangeal joints of the second and third digits of the left hand are slightly swollen and tender. There is minimal reduction in left hip mobility and no swelling or warmth to the touch. A radiograph of the left hip shows minimal joint space narrowing and surface erosion. Bone density is not markedly reduced. During the next 10 years, the joint pain persists, but there is no joint destruction or deformity. She continues to have the same skin lesions. Which of the following is most likely to be seen on a biopsy specimen of these skin lesions?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q64", "bank": true, "expl": "Recurrent scaly plaques over the elbows, knees and scalp are psoriasis. Its microscopy shows hyperkeratosis, parakeratosis, club-shaped (elongated) rete ridges and Munro microabscesses in the stratum corneum; none of the other patterns is among its features.", "type": "mcq", "opts": ["Bandlike upper dermal infiltrate of lymphocytes", "Epidermal spongiosis with dermal edema and eosinophils", "Focal keratinocyte apoptosis", "Epidermal hyperkeratosis, parakeratosis, elongation of rete ridges, and microabscesses", "IgG deposited at the dermal-epidermal junction"], "ans": 3}, "Q0542": {"id": "Q0542", "stem": "A 68-year-old man visits the physician because of a slowly enlarging nodule on his right eyelid. On physical examination, there is a 0.3-cm pearly nodule on the upper eyelid near the lateral limbus of the right eye. The lesion is excised, but multiple frozen sections are made during the surgery to minimize the extent of the resection and preserve the eyelid. The microscopic appearance of the lesion is shown in the figure. What is the most likely diagnosis?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "An elderly patient with a slowly growing lesion on the face whose microscopy shows masses of basaloid cells with peripheral palisading has basal cell carcinoma. Malignant melanoma would instead show sheets and clusters of malignant melanocytes.", "img": ["figs/Q0542.jpg"], "cap": "Microscopic appearance of the excised eyelid lesion", "type": "mcq", "opts": ["Malignant melanoma", "Dermatofibroma", "Actinic keratosis", "Nevocellular nevus", "Basal cell carcinoma"], "ans": 4}, "Q0544": {"id": "Q0544", "stem": "A 10-year-old girl has a routine check of her health status. On physical examination, a flat, uniformly brown, 2-cm skin lesion is noted just above the right buttock. The lesion has been present since birth and has not changed in appearance. The figure shows the representative microscopic appearance of the lesion. What is the most likely diagnosis of this lesion?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q60", "bank": true, "expl": "A flat, uniformly brown, well-defined lesion that has stayed stable, made of bland nests of nevus cells at the dermoepidermal junction and in the dermis without atypia, is a benign melanocytic nevus, in which malignant transformation is rare. Malignant melanoma would be asymmetric with irregular borders, variegated colour and a large diameter, showing sheets and clusters of malignant melanocytes.", "img": ["figs/Q0544.jpg"], "cap": "Representative microscopic appearance of the skin lesion", "type": "mcq", "opts": ["Malignant melanoma", "Seborrheic keratosis", "Basal cell carcinoma", "Melanocytic nevus"], "ans": 3}, "Q0583": {"id": "Q0583", "stem": "Case: A 42-year-old Caucasian woman presents with a 2-year history of worsening thick, pink, scaly plaques on her back, abdomen, thighs and arms, which began after a period of difficult social conditions. The lesions are itchy, and she is distressed by their worsening and spread. On examination there are raised, well-defined erythematous plaques with irregular borders and silvery scales. A 4-mm punch biopsy is taken from a scaly plaque on the back and sent to the pathology lab.\n1. What is your most likely diagnosis, and why?\n2. Describe the expected microscopic picture of the biopsy.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Well-demarcated erythematous plaques with a silvery scale are the classic lesion of psoriasis, caused by increased proliferation and turnover of epidermal keratinocytes. The biopsy shows hyperkeratosis with parakeratosis, club-shaped rete ridges with thin suprapapillary plates, Munro microabscesses (stratum corneum), spongiform pustules of Kogoj (spinous or granular layer) and dilated vessels.", "type": "written", "keyhtml": "1. Psoriasis. Why: the classic psoriatic lesion is a well-demarcated erythematous plaque with a silvery scale (here, raised, well-defined erythematous plaques with silvery scales). The thick scaly plaques reflect the increased proliferation and turnover of epidermal keratinocytes in this autoimmune disorder with a clear genetic component.\n2. • Hyperkeratosis and parakeratosis (nucleated keratinocytes in the stratum corneum).\n• Thin suprapapillary epidermal plates and club-shaped rete ridges.\n• Spongiform pustules of Kogoj in the spinous or granular layer.\n• Munro microabscesses in the stratum corneum.\n• Dilated blood vessels with surrounding inflammation."}, "Q0587": {"id": "Q0587", "stem": "Case: A 50-year-old Chinese man moved to Hurghada to manage a large hotel beach restaurant. A year later he presented with an ulcer over his left cheek that had started as a papule, which soon became indurated, crusted and ulcerated, leaving an irregular ulcer with a beaded, rolled-in edge. On examination, the ulcer was fixed to the underlying cheek bone, and the regional lymph nodes (behind the ear, occipital, etc.) were not enlarged. Excision was done with a wide safety margin, removing part of the underlying bone, followed by ortho-plastic surgery and a skin graft.\n1. What is your most likely diagnosis, and why?\n2. What is the most likely predisposing factor for this condition in light of the patient's history?\n3. Explain the examination findings associated with this ulcer.\n4. Describe the expected microscopic picture of the specimen sent to the pathology lab.\n5. Explain the choice of surgical plan in the treatment of this condition.", "top": false, "rep": "", "tag": "Final bank PAT W33", "bank": true, "expl": "A rodent ulcer with an inverted, beaded edge on the sun-exposed face is basal cell carcinoma, made of nests of basaloid cells with peripheral palisading. It is locally malignant: it infiltrates (here into bone) but very rarely metastasizes, so complete wide local excision is curative, whereas a shave biopsy is followed by 50% recurrence.", "type": "written", "keyhtml": "1. Basal cell carcinoma (rodent ulcer). Why: middle-aged man; lesion on a sun-exposed area of the face; ulcer with an inverted (rolled-in), beaded edge = rodent ulcer; no regional lymph node enlargement (metastasis is very rare).\n2. Sun exposure: a year working at a beach restaurant in Hurghada, with the tumour on a sun-exposed area (the face). The other predisposing factors are fair skin and immunosuppression.\n3. • Fixation to the underlying bone: the tumour grows by local infiltration (the malignant mode of growth); BCC is a locally malignant neoplasm.\n• No regional lymph node enlargement: BCC very rarely metastasizes.\n4. • Malignant epithelial neoplasm covered by stratified squamous epithelium, with an area of surface ulceration.\n• The dermis is infiltrated by masses and nests of darkly stained blue malignant basaloid cells.\n• In each mass, the outer layer is formed of columnar cells arranged in a palisade (peripheral palisading); the inner cells are polygonal.\n• The cells have scanty cytoplasm and large oval hyperchromatic nuclei.\n• The masses are separated by fibrous stroma infiltrated by inflammatory cells.\n5. • BCC is locally malignant, so cure depends on complete removal: complete wide local excision is curative, whereas incomplete removal by shave biopsy is followed by recurrence in 50%.\n• The wide safety margin and removal of the infiltrated bone ensure complete excision.\n• Ortho-plastic surgery and a skin graft repair the defect left by the wide excision."}, "Q0592": {"id": "Q0592", "stem": "Case: A 20-year-old man, a known case of xeroderma pigmentosum, has a skin nodule on his right hand that has become larger and darker, with more irregular outlines, over the past 3 months. No other skin lesions are noted. Three nontender, enlarged lymph nodes are palpable in the right axilla. The lesion is excised, and microscopic examination shows a neoplasm composed of darkly pigmented polygonal and spindle cells with marked hyperchromatism and an increased nuclear/cytoplasmic ratio.\n1. What is your most likely diagnosis, and why?\n2. Describe the expected microscopic picture of the excised lesion.\n3. Suggest the medical advice / treatment plan for this patient.", "top": false, "rep": "", "tag": "Final bank PAT W34", "bank": true, "expl": "A pigmented lesion that enlarges, darkens and becomes irregular, with malignant pigmented cells and enlarged regional nodes, is malignant melanoma; microscopically it shows sheets and clusters of malignant melanocytes in the epidermis (superficially spreading) or dermis (vertical, nodular). Treatment follows the TNM stage: the primary lesion is excised, and because the enlarged axillary nodes suggest spread beyond the local tumour, systemic treatment by chemotherapy or immunotherapy is needed if spread is confirmed.", "type": "written", "keyhtml": "1. Malignant melanoma (malignancy of melanocytes), with probable spread to the axillary lymph nodes. Why: a pigmented lesion that is enlarging, darkening and becoming more irregular in outline (A-B-C-D: asymmetric, borders irregular, colour variegated, diameter large); malignant, darkly pigmented cells with hyperchromatism and ↑ N/C ratio; enlarged regional lymph nodes (malignant tumours metastasize).\n2. • Sheets and clusters of malignant melanocytes, either in the epidermis (superficially spreading type) or in the dermis (vertical, nodular type).\n• The cells show the characteristics of malignancy: ↑ N/C ratio, ↑ chromatin (hyperchromatism), large nucleoli, pleomorphism, ↑ mitoses and loss of polarity.\n3. • Stage the tumour by TNM: the T stage is based on the depth of invasion of the excised lesion, measured in mm; the enlarged axillary nodes are assessed for spread.\n• Local tumour: the primary lesion is treated by surgical excision (already done here).\n• This patient's enlarged axillary nodes suggest the tumour is no longer only local; if spread is confirmed, the disease is treated systemically by chemotherapy or immunotherapy.\n• Advise avoiding sun exposure and sunburn (predisposing factors)."}, "Q0658": {"id": "Q0658", "stem": "Case: A 58-year-old male presents with a dark, irregularly pigmented lesion on his left shoulder. The patient reports that the lesion has been present for several years but recently noticed changes in size, shape, and color. A 1.2-cm asymmetrical lesion with irregular borders and multiple shades of brown, black, and a slight red hue. The biopsy shows a malignant epithelioid and spindle cell proliferation extending into the reticular dermis with brown pigmentation. There is a high mitotic rate. Breslow thickness is measured at 2.0 mm. Ulceration is present, with an infiltrative growth pattern. Immunohistochemistry shows positivity for S-100 and HMB-45.\n1. What is the diagnosis?\n2. Why is immunohistochemistry with markers like S-100 and HMB-45 important in this diagnosis?\n3. What are the risk factors associated with melanoma that this patient presents?\n4. Discuss the prognosis for this patient. How would the presence of ulceration affect his prognosis?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W28", "bank": true, "expl": "An asymmetric, irregularly bordered, variegated pigmented lesion that has recently changed, with malignant pigmented cells invading the dermis, is malignant melanoma, which typically affects people aged 40–70 and may arise in a dysplastic nevus. Its prognosis follows the TNM stage, whose T stage is based on the depth of invasion measured in mm.", "aimg": ["figs/GQ-14_ans.jpg", "figs/GQ-14_ans2.jpg"], "acap": "Maturation sequence of nondysplastic melanocytic nevi (A normal skin, B junctional, C compound, D dermal, E dermal nevus with neurotization); congenital nevus vs melanoma", "type": "written", "keyhtml": "1. Melanoma (malignant melanoma — malignancy of melanocytes): a changing pigmented lesion that is asymmetric, with irregular borders and variegated colour (A-B-C-D), and malignant pigmented cells invading the reticular dermis (vertical, nodular type) with a high mitotic rate.\n2. To confirm the diagnosis (S-100 and HMB-45 positivity shows that the malignant cells are melanocytic) and to exclude mimics.\n3. Age (58 years — melanoma affects ages 40–70) and a nevus (a pre-existing pigmented lesion, present for years, that has changed; dysplastic nevus carries a risk of developing melanoma).\n4. Bad (poor) prognosis: prognosis follows the TNM stage, and the T stage is based on the depth of invasion, measured in mm — here deep invasion (Breslow thickness 2.0 mm, into the reticular dermis) with a high mitotic rate. Ulceration affects the stage, hence the prognosis of the case (it worsens it)."}, "Q0662": {"id": "Q0662", "stem": "Case: A 32-year-old woman presents with a complaint of itchy, scaly red patches on her elbows, knees, and scalp. She reports that these lesions have been present for the past 5 years, with intermittent flare-ups that worsen during the winter. The patient mentions that stress and lack of sleep seem to aggravate her symptoms. Known history of mild anxiety. Physical exam reveals well-demarcated, erythematous plaques with silvery-white scales on the extensor surfaces of the elbows and knees, as well as the scalp. Auspitz sign is positive. Nails show pitting and some onycholysis. Histopathology shows epidermal hyperplasia with elongated rete ridges, parakeratosis and Munro microabscesses, with dilated and tortuous blood vessels in the dermal papillae.\n1. What is the diagnosis of this case?\n2. What are the main histologic findings?\n3. What is meant by the Auspitz sign, parakeratosis and Munro microabscesses?\n4. What are the main risk factors and main methods of treatment?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W29", "bank": true, "expl": "Itchy, well-demarcated erythematous plaques with silvery scales on the elbows, knees and scalp are psoriasis, an autoimmune disorder with a clear genetic component. Parakeratosis means nucleated keratinocytes in the stratum corneum, where the Munro microabscesses also lie, while spongiform pustules of Kogoj sit lower, in the spinous or granular layer.", "aimg": ["figs/GQ-15_ans.jpg"], "acap": "Psoriasis — clinical photos", "type": "written", "keyhtml": "1. Psoriasis.\n2. • Epidermal hyperplasia with elongated (club-shaped) rete ridges and thin suprapapillary epidermal plates.\n• Hyperkeratosis with parakeratosis.\n• Munro microabscesses in the stratum corneum; spongiform pustules of Kogoj in the spinous or granular layer.\n• Dilated, tortuous blood vessels in the dermal papillae with surrounding inflammation.\n3. • Auspitz sign: appearance of pinpoint bleeding spots when the scales of a psoriatic lesion are scraped off.\n• Parakeratosis: nucleated cells (keratinocytes) in the corneal layer (stratum corneum).\n• Munro microabscesses: collections of neutrophils within the stratum corneum of the epidermis.\n4. • Risk factors: genetic predisposition (an autoimmune disorder with a clear genetic component); in this patient, flare-ups that worsen during the winter, stress and lack of sleep, with a history of mild anxiety.\n• Treatment: immunosuppressive therapy."}, "Q0718": {"id": "Q0718", "stem": "A basal cell carcinoma of the skin is removed by shave biopsy. Which of the following is the most likely complication?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q65", "bank": true, "expl": "BCC is a locally malignant neoplasm with very rare metastasis, so lymphatic and blood spread are exceptional. After a shave biopsy it recurs locally in 50% of cases; only complete wide local excision is curative.", "type": "mcq", "opts": ["Secondary infection", "Local recurrence", "Lymphatic spread", "Blood spread"], "ans": 1}, "Q0719": {"id": "Q0719", "stem": "A 60-year-old man presents to his surgeon with a mass on his cheek which has been growing rapidly for the past 2 months. On examination, the mass has an ulcerating surface with raised everted edges and a necrotic floor. Incisional biopsy reveals infiltration of the dermis by cell nests with central keratinization. What is your provisional diagnosis?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q66", "bank": true, "expl": "Age 60, a rapidly ulcerating mass with raised everted edges, and malignant squamous cells forming cell nests (epithelial pearls) of keratin are the features of squamous cell carcinoma. BCC forms a rodent ulcer with an inverted or beaded edge and shows basaloid nests with peripheral palisading, not cell nests.", "type": "mcq", "opts": ["Basal cell carcinoma", "Malignant melanoma", "Squamous cell carcinoma", "Melanocytic nevus"], "ans": 2}, "Q0720": {"id": "Q0720", "stem": "All of the following features are present in genital warts EXCEPT:", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q67", "bank": true, "expl": "Warts (squamous cell papilloma caused by HPV) show hyperkeratosis, acanthosis and papillomatosis. Munro microabscesses in the stratum corneum are a feature of psoriasis.", "type": "mcq", "opts": ["Papillomatosis", "Acanthosis", "Hyperkeratosis", "Munro microabscess"], "ans": 3}, "Q0721": {"id": "Q0721", "stem": "Which of the following factors determines the T stage in the assessment of malignant melanoma?", "top": false, "rep": "asked 2 years", "tag": "Extra practice", "bank": false, "expl": "In melanoma the T stage is based on the depth of invasion, measured in mm. Tumour size and horizontal (superficial) spread are not what it measures.", "type": "mcq", "opts": ["Tumor size", "Degree of local spread", "Vertical spread (depth of invasion)", "Degree of horizontal (superficial) spread"], "ans": 2}, "Q0737": {"id": "Q0737", "stem": "Which of the following types of nevus carries a high risk of malignant transformation?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q61", "bank": true, "expl": "Giant congenital nevus (birth mark) carries a risk of malignant melanoma. Junctional, compound and intradermal (dermal) nevi are types of nevocellular (melanocytic) nevus, in which malignant transformation is rare.", "type": "mcq", "opts": ["Junctional nevus", "Compound nevus", "Congenital nevus", "Dermal nevus"], "ans": 2}, "Q0738": {"id": "Q0738", "stem": "What is the most important prognostic factor in malignant melanoma?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q62", "bank": true, "expl": "The prognosis of malignant melanoma follows its TNM stage, and the T stage is based on the depth of invasion, measured in mm. Tumour size, location and the amount of melanin are not what the T stage of melanoma is based on.", "type": "mcq", "opts": ["Tumor size", "Tumor location", "Depth of invasion", "Amount of melanin pigmentation"], "ans": 2}, "Q0739": {"id": "Q0739", "stem": "What is the most characteristic feature of basal cell carcinoma?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q63", "bank": true, "expl": "Basal cell carcinoma shows masses and nests of basaloid cells whose outer columnar cells are arranged in a palisade (peripheral palisading). Cell nests (epithelial pearls) are the hallmark of squamous cell carcinoma, and acanthosis (a thickened prickle cell layer) is seen in warts.", "type": "mcq", "opts": ["Cell nest", "Acanthosis", "Peripheral palisading", "Melanin pigmentation"], "ans": 2}, "N-PAT-L5-01": {"id": "N-PAT-L5-01", "stem": "A 32-year-old woman has several pigmented skin lesions on her back. They are larger and more irregular than ordinary moles. Excision of one lesion shows melanocytes with cytologic and architectural atypia. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Dysplastic nevi are larger and more irregular than melanocytic nevi, are usually multiple, and show cytologic and architectural atypia; they carry a risk of developing melanoma. Malignant melanoma is diagnosed by sheets and clusters of malignant melanocytes in the epidermis or dermis.", "type": "mcq", "opts": ["Junctional nevus", "Compound nevus", "Intradermal nevus", "Dysplastic nevus", "Malignant melanoma"], "ans": 3}, "N-PAT-L5-02": {"id": "N-PAT-L5-02", "stem": "A 62-year-old fair-skinned man with a history of repeated sunburn has a single, enlarging skin lesion on his back with asymmetric, irregular borders and variegated brown, black and red colour. Which of the following is the expected microscopic picture?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A lesion with asymmetry, irregular borders, variegated colour and growing diameter (A-B-C-D) in a fair-skinned, sunburnt adult aged 40–70 is malignant melanoma, which shows sheets and clusters of malignant melanocytes in the epidermis (superficially spreading) or dermis (vertical, nodular). Basaloid nests with palisading and squamous cell nests belong to BCC and SCC respectively.", "type": "mcq", "opts": ["Sheets and clusters of malignant melanocytes", "Nests of basaloid cells with peripheral palisading", "Nests of malignant squamous cells with epithelial pearls (cell nests)", "Thin suprapapillary plates with Munro microabscesses", "Hyperkeratosis, acanthosis and papillomatosis"], "ans": 0}, "N-PAT-L5-03": {"id": "N-PAT-L5-03", "stem": "A skin biopsy from a scaly plaque on the elbow is reported to show parakeratosis. What does this term mean?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Parakeratosis means nucleated keratinocytes in the stratum corneum ('PARA-keratosis keeps the nuclei'). Increased keratinization is hyperkeratosis, a thickened prickle cell layer is acanthosis, and elongated rete ridges are papillomatosis.", "type": "mcq", "opts": ["Increased keratinization", "Thickened prickle cell layer", "Elongated rete ridges", "Presence of nucleated keratinocytes in the stratum corneum"], "ans": 3}, "N-PAT-L5-04": {"id": "N-PAT-L5-04", "stem": "A skin biopsy is reported as showing moderate dysplasia of the squamous epithelium. Which of the following findings is expected in this biopsy?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Dysplasia shows pleomorphism, hyperchromatic nuclei with a high N/C ratio, disordered tissue architecture and more mitotic figures than usual, and it is graded as mild, moderate or severe. The other options describe normal epithelium.", "type": "mcq", "opts": ["Pleomorphic, hyperchromatic nuclei with a high nuclear-cytoplasmic ratio", "Uniform nuclei with a low nuclear-cytoplasmic ratio", "Fewer mitotic figures than usual", "Normal, orderly tissue architecture"], "ans": 0}, "N-PAT-L5-05": {"id": "N-PAT-L5-05", "stem": "A 66-year-old man has a skin tumour excised from his forearm. Which of the following findings in the specimen indicates that the tumour is malignant rather than benign?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Malignant tumours grow by infiltration, are non-encapsulated, and show ulceration, haemorrhage and necrosis. Expansion, a capsule, the absence of features of malignancy and less vascularity are features of benign tumours.", "type": "mcq", "opts": ["Growth by expansion with a well-circumscribed outline", "A complete capsule", "Infiltrative margins with ulceration, haemorrhage and necrosis", "Well-differentiated cells without pleomorphism or increased mitoses", "Low vascularity"], "ans": 2}, "N-PAT-L5-06": {"id": "N-PAT-L5-06", "stem": "Compare squamous cell carcinoma and basal cell carcinoma of the skin as regards age, predisposing factors, gross picture, microscopic picture and behaviour.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Both arise in fair skin exposed to the sun, but the ulcer edge (everted in SCC, inverted or beaded in BCC) and the microscopy (pearls = SCC, palisades = BCC) separate them.", "type": "written", "keyhtml": "Feature | Squamous cell carcinoma | Basal cell carcinoma\nAge | 60 y | Middle age or elderly\nPredisposing factors | Sun exposure, fair skin, chronic skin ulcers | Fair skin, sun-exposed areas (face, nose), immunosuppression\nGross | Nodular mass which rapidly ulcerates, with raised everted edges | Rodent ulcer with an inverted or beaded edge\nMicroscopic | Masses &amp; nests of malignant squamous cells with epithelial pearls (cell nests); polygonal cells with abundant pink cytoplasm, pleomorphic hyperchromatic nuclei, prominent nucleoli, mitoses | Masses &amp; nests of malignant basaloid cells with peripheral palisading (outer columnar, inner polygonal cells); scanty cytoplasm, large oval hyperchromatic nuclei\nStroma | Loose C.T. with few inflammatory cells | Fibrous stroma infiltrated by inflammatory cells\nBehaviour | Malignant | Locally malignant (very rare metastasis); shave biopsy → 50% recurrence; complete wide local excision is curative"}, "N-PAT-L5-07": {"id": "N-PAT-L5-07", "stem": "Define hyperkeratosis, acanthosis, papillomatosis and parakeratosis. Which of these changes are seen in warts, and which in psoriasis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "These four terms describe epidermal changes: warts combine hyperkeratosis, acanthosis and papillomatosis, while psoriasis is marked by hyperkeratosis with parakeratosis.", "type": "written", "keyhtml": "• Hyperkeratosis: increased keratinization.\n• Acanthosis: thickened prickle cell layer.\n• Papillomatosis: elongated rete ridges.\n• Parakeratosis: presence of nucleated keratinocytes in the stratum corneum.\n• Warts (squamous cell papilloma caused by HPV): hyperkeratosis, acanthosis and papillomatosis.\n• Psoriasis: hyperkeratosis and parakeratosis, with club-shaped rete ridges, thin suprapapillary plates, Munro microabscesses, spongiform pustules of Kogoj and dilated vessels."}, "TP-076": {"id": "TP-076", "stem": "Microscopic examination of a skin biopsy reveals 'epithelial pearls' (cell nests) and polygonal cells with abundant pink cytoplasm. This finding is characteristic of:", "top": true, "rep": "", "tag": "Final bank PAT Q86", "bank": true, "expl": "Epithelial pearls (cell nests of central laminated keratin within masses of malignant squamous cells) and polygonal cells with abundant pink cytoplasm characterise well-differentiated squamous cell carcinoma. Basal cell carcinoma shows nests of basaloid cells with peripheral palisading and scanty cytoplasm instead.", "type": "mcq", "opts": ["Basal cell carcinoma", "Dysplastic nevus", "Well-differentiated squamous cell carcinoma", "Psoriasis", "Intradermal nevus"], "ans": 2}, "TP-095": {"id": "TP-095", "stem": "Case: A 70-year-old patient presents with a slow-growing, painless ulcer on the side of his nose. Incisional biopsy reveals infiltration of the dermis by aggregates of basaloid cells with peripheral palisading.\na) What is your provisional diagnosis? Mention one differential diagnosis.\nb) Describe the ulcer grossly.", "top": true, "rep": "", "tag": "Final bank PAT W45", "bank": true, "expl": "An ulcer on the nose (a sun-exposed area of the face) of an elderly patient, with dermal nests of basaloid cells showing peripheral palisading, is basal cell carcinoma, which forms a rodent ulcer with an inverted or beaded edge. Squamous cell carcinoma, the main differential, is a rapidly ulcerating nodular mass with raised everted edges and epithelial pearls.", "type": "written", "keyhtml": "a) Provisional diagnosis: basal cell carcinoma — elderly patient, sun-exposed area of the face (nose), dermis infiltrated by nests of malignant basaloid cells with peripheral (nuclear) palisading. Differential diagnosis: squamous cell carcinoma — a malignant skin tumour with sun exposure and fair skin as risk factors (about 60 years); a nodular mass that rapidly ulcerates with raised everted edges, showing nests of malignant squamous cells with epithelial pearls (cell nests).\nb) Rodent ulcer: an ulcer with an inverted (rolled) or beaded edge."}, "PRQ-159": {"id": "PRQ-159", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Basal cell carcinoma", "Normal skin", "Malignant melanoma", "Squamous cell carcinoma"], "ans": 1, "top": false, "rep": "", "tag": "Practical · Lab 2 – Skin & soft tissue tumours", "bank": false, "img": ["prac/q159.jpg"], "expl": "The practical slide \"SKIN: normal histology\" (Lab 2 – Skin & soft tissue tumours)."}, "PRQ-152": {"id": "PRQ-152", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Squamous cell carcinoma", "Malignant melanoma", "Basal cell carcinoma", "Normal skin"], "ans": 2, "top": false, "rep": "", "tag": "Practical · Lab 2 – Skin & soft tissue tumours", "bank": false, "img": ["prac/q152.jpg"], "expl": "The practical slide \"Basal cell carcinoma\" (Lab 2 – Skin & soft tissue tumours)."}, "PRQ-145": {"id": "PRQ-145", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Normal skin", "Malignant melanoma", "Basal cell carcinoma", "Squamous cell carcinoma"], "ans": 3, "top": false, "rep": "", "tag": "Practical · Lab 2 – Skin & soft tissue tumours", "bank": false, "img": ["prac/q145.jpg"], "expl": "The practical slide \"Malignant Tumors SQUAMOUS CELL CARCINOMA\" (Lab 2 – Skin & soft tissue tumours)."}, "PRQ-161": {"id": "PRQ-161", "type": "mcq", "stem": "Name it: what does this practical picture show?", "opts": ["Malignant melanoma", "Normal skin", "Squamous cell carcinoma", "Basal cell carcinoma"], "ans": 0, "top": false, "rep": "", "tag": "Practical · Lab 2 – Skin & soft tissue tumours", "bank": false, "img": ["prac/q161.jpg"], "expl": "The practical slide \"Malignant Melanoma of the skin M\" (Lab 2 – Skin & soft tissue tumours)."}}, "labs": {"sl138": {"id": "sl138", "type": "slide", "title": "Epithelial tumors", "img": "prac/s138.jpg", "labels": [{"t": "Benign", "x": 41.11, "y": 33.86, "w": 13.97, "h": 9.18, "id": "l0"}, {"t": "Squamous cell • papilloma", "x": 61.73, "y": 32.31, "w": 21.34, "h": 11.97, "id": "l1"}, {"t": "Malignant", "x": 38.21, "y": 70.63, "w": 19.77, "h": 9.18, "id": "l2"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl143": {"id": "sl143", "type": "slide", "title": ": Organ : Diagnosis", "img": "prac/s143.jpg", "labels": [{"t": "Skin mass", "x": 47.26, "y": 5.38, "w": 12.36, "h": 4.96, "id": "l0"}, {"t": "Squamous cell papilloma", "x": 34.52, "y": 20.68, "w": 29.99, "h": 4.96, "id": "l1"}, {"t": ": Nature of the lesion", "x": 10.05, "y": 30.5, "w": 28.68, "h": 6.25, "id": "l2"}, {"t": "Benign tumor—surface epithelial", "x": 10.13, "y": 39.28, "w": 39.14, "h": 4.96, "id": "l3"}, {"t": ": Comment", "x": 7.05, "y": 47.78, "w": 14.15, "h": 6.25, "id": "l4"}, {"t": "1. Papillary growth", "x": 2.85, "y": 58.23, "w": 19.38, "h": 4.14, "id": "l5"}, {"t": "2. Stratified squamous epithelial lining showing:", "x": 2.85, "y": 64.89, "w": 48.68, "h": 4.14, "id": "l6"}, {"t": "a) Hyperkeratosis (increased keratin)", "x": 2.85, "y": 71.56, "w": 36.61, "h": 4.14, "id": "l7"}, {"t": "b) Acanthosis (increased prickle cell layer)", "x": 2.85, "y": 78.23, "w": 42.21, "h": 4.14, "id": "l8"}, {"t": "c)Papillomatosis (elongated dermal papillae)", "x": 2.85, "y": 84.89, "w": 44.14, "h": 4.14, "id": "l9"}, {"t": "3. Branching fibrovascular connective tissue core", "x": 2.85, "y": 91.56, "w": 49.94, "h": 4.14, "id": "l10"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl146": {"id": "sl146", "type": "slide", "title": "Malignant Tumors SQUAMOUS CELL CARCINOMA", "img": "prac/s146.jpg", "labels": [{"t": "Stratified Squamous epithelium", "x": 24.93, "y": 30.49, "w": 9.4, "h": 13.41, "id": "l0"}, {"t": "Ulcer", "x": 59.93, "y": 45.3, "w": 4.53, "h": 4.52, "id": "l1"}, {"t": "Hair follicle", "x": 26.78, "y": 51.28, "w": 5.72, "h": 8.97, "id": "l2"}, {"t": "Sebaceous gland", "x": 25.11, "y": 68.97, "w": 9.17, "h": 8.97, "id": "l3"}, {"t": "Groups of malignant squamous epithelial cells", "x": 74.2, "y": 45.85, "w": 8.86, "h": 22.31, "id": "l4"}, {"t": "Epithelial Pearl (cell nest)", "x": 73.35, "y": 73.13, "w": 8.42, "h": 13.41, "id": "l5"}, {"t": "Normal free skin", "x": 35.93, "y": 93.3, "w": 14.35, "h": 4.52, "id": "l6"}, {"t": "Site of malignant ulcer", "x": 55.28, "y": 93.3, "w": 19.44, "h": 4.52, "id": "l7"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl147": {"id": "sl147", "type": "slide", "title": "Malignant Tumors SQUAMOUS CELL CARCINOMA", "img": "prac/s147.jpg", "labels": [{"t": "Stratified Squamous epithelium", "x": 15.53, "y": 21.17, "w": 21.76, "h": 3.61, "id": "l0"}, {"t": "malignant squamous epithelial Cell nest cells", "x": 50.74, "y": 23.25, "w": 27.76, "h": 13.41, "id": "l1"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl148": {"id": "sl148", "type": "slide", "title": "SQUAMOUS CELL CARCINOMA", "img": "prac/s148.jpg", "labels": [{"t": "Cell nest with central keratin pearls", "x": 15.44, "y": 17.18, "w": 35.58, "h": 5.42, "id": "l0"}, {"t": "Well differentiated squamous cell carcinoma", "x": 16.84, "y": 81.69, "w": 35.7, "h": 12.55, "id": "l1"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl149": {"id": "sl149", "type": "slide", "title": "SQUAMOUS CELL CARCINOMA", "img": "prac/s149.jpg", "labels": [{"t": "Ulcer", "x": 41.39, "y": 12.82, "w": 5.43, "h": 5.42, "id": "l0"}, {"t": "tumor", "x": 42.56, "y": 58.15, "w": 5.4, "h": 4.52, "id": "l1"}, {"t": "Moderately differentiated squamous cell carcinoma", "x": 16.32, "y": 83.58, "w": 64.56, "h": 7.23, "id": "l2"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl150": {"id": "sl150", "type": "slide", "title": "SQUAMOUS CELL CARCINOMA", "img": "prac/s150.jpg", "labels": [{"t": "Focal evidence of keratinization", "x": 15.13, "y": 27.56, "w": 28.53, "h": 4.75, "id": "l0"}, {"t": "Poorly differentiated squamous cell carcinoma", "x": 20.79, "y": 86.96, "w": 57.37, "h": 7.23, "id": "l1"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl152": {"id": "sl152", "type": "slide", "title": "Basal cell carcinoma", "img": "prac/s152.jpg", "labels": [{"t": "A locally malignant tumor ???", "x": 57.76, "y": 16.85, "w": 22.53, "h": 4.07, "id": "l0"}, {"t": "Ulcer at left side of nose", "x": 20.27, "y": 81.92, "w": 18.82, "h": 4.07, "id": "l1"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl153": {"id": "sl153", "type": "slide", "title": "Basal cell carcinoma", "img": "prac/s153.jpg", "labels": [{"t": "A locally malignant tumor ???", "x": 57.76, "y": 16.85, "w": 22.96, "h": 4.07, "id": "l0"}, {"t": "skin", "x": 41.38, "y": 27.89, "w": 3.1, "h": 4.07, "id": "l1"}, {"t": "Ulcer", "x": 74.96, "y": 28.65, "w": 5.34, "h": 5.42, "id": "l2"}, {"t": "Peripheral nuclear palisading", "x": 15.74, "y": 34.08, "w": 15.82, "h": 8.97, "id": "l3"}, {"t": "Normal free skin", "x": 35.93, "y": 93.3, "w": 14.35, "h": 4.52, "id": "l4"}, {"t": "Site of malignant ulcer", "x": 55.28, "y": 93.3, "w": 19.44, "h": 4.52, "id": "l5"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl154": {"id": "sl154", "type": "slide", "title": "Skin & soft tissue tumours · slide 18", "img": "prac/s154.jpg", "labels": [{"t": "Basal cell carcinoma", "x": 35.85, "y": 7.82, "w": 24.3, "h": 6.33, "id": "l0"}, {"t": "A locally malignant tumor", "x": 57.74, "y": 16.85, "w": 19.51, "h": 4.07, "id": "l1"}, {"t": "Skin", "x": 71.15, "y": 19.59, "w": 5.05, "h": 6.33, "id": "l2"}, {"t": "Ulcer", "x": 31.93, "y": 27.77, "w": 6.33, "h": 6.33, "id": "l3"}, {"t": "masses of malignant basaloid epithelial cells", "x": 14.23, "y": 40.94, "w": 13.54, "h": abels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl159": {"id": "sl159", "type": "slide", "title": "SKIN: normal histology", "img": "prac/s159.jpg", "labels": [{"t": "Epidermis and superficial dermis", "x": 22.11, "y": 22.0, "w": 13.47, "h": 8.07, "id": "l0"}, {"t": "Section in hair follicle", "x": 19.3, "y": 44.45, "w": 10.82, "h": 8.07, "id": "l1"}, {"t": "Sebaceous glands", "x": 23.27, "y": 76.55, "w": 8.1, "h": 8.07, "id": "l2"}, {"t": "Deep dermis and subcutaneous tissue", "x": 55.46, "y": 21.55, "w": 23.95, "h": 8.07, "id": "l3"}], "src": "From the practical slides · Lab 2 – Skin & soft tissue tumours", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "PAT-L5-001", "text": "Melanocytic tumors of skin: {{c1::congenital nevus (birth mark)}}, {{c2::nevocellular (melanocytic) nevus}}, {{c3::dysplastic nevus}} and {{c4::malignant melanoma}}.", "extra": "Three nevi + one malignancy.", "sec": "Part 01 · 1.1 Melanocytic tumors of skin"}, {"id": "PAT-L5-002", "text": "Nevi that carry a risk of malignant melanoma: {{c1::giant congenital nevus (birth mark)}} and {{c2::dysplastic nevus}}.", "extra": "Quiz trap: junctional, compound and intradermal (dermal) nevi are nevocellular types — malignant transformation rare.", "sec": "Part 01 · 1.2 Congenital nevus (birth mark) · melanocytic nevus"}, {"id": "PAT-L5-003", "text": "Melanocytic nevus: on {{c1::sun-exposed areas}}, {{c2::uniform tan to brown}} color, {{c3::well-defined sharp}} borders, {{c4::stable}} in shape and size; malignant transformation is {{c5::rare}}.", "extra": "Opposite of melanoma A-B-C-D (asymmetric, irregular borders, variegated color, large diameter).", "sec": "Part 01 · 1.2 Congenital nevus (birth mark) · melanocytic nevus"}, {"id": "PAT-L5-004", "text": "Types of nevocellular (melanocytic) nevus: {{c1::junctional}}, {{c2::compound}} and {{c3::intradermal}}.", "extra": "Congenital and dysplastic nevi are separate melanocytic tumors, not nevocellular types.", "sec": "Part 01 · 1.3 Nevocellular nevus — junctional, compound, intradermal"}, {"id": "PAT-L5-005", "text": "Nevocellular nevus shape — junctional: {{c1::flat}}; compound: {{c2::slightly elevated}}; intradermal: {{c3::dome-shaped, warty or sessile}}.", "extra": "Colors: junctional brown to black · compound brown or light brown · intradermal light brown or flesh-colored.", "sec": "Part 01 · 1.3 Nevocellular nevus — junctional, compound, intradermal"}, {"id": "PAT-L5-006", "text": "Nevocellular nevus color — the brown to black one is the {{c1::junctional}} nevus; the light brown or flesh-colored one is the {{c2::intradermal}} nevus.", "extra": "Compound nevus: brown or light brown, slightly elevated.", "sec": "Part 01 · 1.3 Nevocellular nevus — junctional, compound, intradermal"}, {"id": "PAT-L5-007", "text": "Dysplastic nevus: {{c1::larger and more irregular}} than melanocytic nevi, usually {{c2::multiple}}; microscopy shows {{c3::cytologic and architectural}} atypia.", "extra": "Carries a risk of developing melanoma.", "sec": "Part 01 · 1.4 Dysplastic nevus"}, {"id": "PAT-L5-008", "text": "Usual age of malignant melanoma (malignancy of melanocytes): {{c1::40–70}} years.", "extra": "Age is a risk factor in the GD melanoma case (58-year-old).", "sec": "Part 02 · 2.1 Melanoma — definition, age & predisposing factors"}, {"id": "PAT-L5-009", "text": "Predisposing factors of malignant melanoma: {{c1::sun exposure}}, {{c2::sunburn}}, {{c3::fair skin}}, {{c4::dysplastic nevus}} and {{c5::familial melanoma}}.", "extra": "Familial melanoma = loss of the P16 tumor suppressor gene.", "sec": "Part 02 · 2.1 Melanoma — definition, age & predisposing factors"}, {"id": "PAT-L5-010", "text": "Familial melanoma is associated with loss of the {{c1::P16}} tumor suppressor gene.", "extra": "Classic exam trap.", "sec": "Part 02 · 2.1 Melanoma — definition, age & predisposing factors"}, {"id": "PAT-L5-011", "text": "Most likely mutated gene in a sporadic (non-familial) malignant melanoma: {{c1::BRAF}}.", "extra": "QB key (2024–26; options ATM, BRAF, NF1, TSC1, XPA), not in pamphlet. Familial = P16 loss.", "sec": "Part 02 · 2.1 Melanoma — definition, age & predisposing factors"}, {"id": "PAT-L5-013", "text": "Gross malignant melanoma: {{c1::asymmetric}}, with {{c2::irregular}} borders, {{c3::variegated}} color and a {{c4::large}} diameter.", "extra": "Mnemonic A-B-C-D.", "sec": "Part 02 · 2.2 Melanoma — gross"}, {"id": "PAT-L5-014", "text": "Gross forms of malignant melanoma: {{c1::macule}}, {{c2::papule}} or {{c3::nodule}}.", "extra": "", "sec": "Part 02 · 2.2 Melanoma — gross"}, {"id": "PAT-L5-015", "text": "Microscopy of malignant melanoma: {{c1::sheets and clusters of malignant melanocytes}} in the epidermis or dermis.", "extra": "Not basaloid nests with palisading (BCC) or cell nests (SCC).", "sec": "Part 02 · 2.3 Microscopic features of MM"}, {"id": "PAT-L5-016", "text": "Melanoma cells in the epidermis = {{c1::superficially spreading}} type; in the dermis = {{c2::vertical (nodular)}} type.", "extra": "GD case: invasion into the reticular dermis = vertical, nodular type.", "sec": "Part 02 · 2.3 Microscopic features of MM"}, {"id": "PAT-L5-017", "text": "Melanoma prognosis follows the TNM stage; the T stage is based on {{c1::depth of invasion}}, measured in {{c2::mm}}.", "extra": "Depth of invasion = most important prognostic factor (not size, site or pigment).", "sec": "Part 02 · 2.4 Melanoma — prognostic factors"}, {"id": "PAT-L5-018", "text": "Melanoma treatment — local tumor: {{c1::surgical excision}}; systemic disease: {{c2::chemotherapy or immunotherapy}}.", "extra": "", "sec": "Part 02 · 2.4 Melanoma — prognostic factors"}, {"id": "PAT-L5-019", "text": "A melanoma invading the reticular dermis (Breslow thickness 2.0 mm) with a high mitotic rate has a {{c1::bad (poor)}} prognosis.", "extra": "Official GD answer: deep invasion → high T stage.", "sec": "Part 02 · 2.4 Melanoma — prognostic factors"}, {"id": "PAT-L5-020", "text": "Ulceration in a melanoma affects the {{c1::stage}}, and hence worsens the prognosis.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 02 · 2.4 Melanoma — prognostic factors"}, {"id": "PAT-L5-021", "text": "Immunohistochemistry of melanoma: positive for {{c1::S-100}} and {{c2::HMB-45}}.", "extra": "Markers given in the GD case; not in pamphlet.", "sec": "Part 02 · 2.3 Microscopic features of MM"}, {"id": "PAT-L5-022", "text": "Role of S-100 and HMB-45 immunohistochemistry in melanoma: to {{c1::confirm the diagnosis}} and to {{c2::exclude mimics}}.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 02 · 2.3 Microscopic features of MM"}, {"id": "PAT-L5-023", "text": "{{c1::Hyperkeratosis}} = {{c2::increased keratinization}}.", "extra": "Seen in warts and psoriasis.", "sec": "Part 03 · 3.1 Epidermal and dermal lesions — the terms"}, {"id": "PAT-L5-024", "text": "{{c1::Acanthosis}} = {{c2::thickened prickle cell layer}}.", "extra": "Seen in warts.", "sec": "Part 03 · 3.1 Epidermal and dermal lesions — the terms"}, {"id": "PAT-L5-025", "text": "{{c1::Papillomatosis}} = {{c2::elongated rete ridges}}.", "extra": "Seen in warts.", "sec": "Part 03 · 3.1 Epidermal and dermal lesions — the terms"}, {"id": "PAT-L5-026", "text": "{{c1::Parakeratosis}} = presence of {{c2::nucleated keratinocytes}} in the {{c3::stratum corneum}}.", "extra": "PARA-keratosis keeps the nuclei.", "sec": "Part 03 · 3.1 Epidermal and dermal lesions — the terms"}, {"id": "PAT-L5-027", "text": "Psoriasis: an {{c1::autoimmune}} disorder with a clear {{c2::genetic}} component, causing increased {{c3::proliferation and turnover}} of epidermal keratinocytes.", "extra": "", "sec": "Part 03 · 3.2 Psoriasis"}, {"id": "PAT-L5-028", "text": "Sites of psoriasis: {{c1::knees}}, {{c2::elbows}} and {{c3::scalp}}.", "extra": "Extensor surfaces of elbows and knees (GD case).", "sec": "Part 03 · 3.3 Psoriasis: gross"}, {"id": "PAT-L5-029", "text": "Classic psoriasis lesion: a well-demarcated {{c1::erythematous plaque}} with a {{c2::silvery scale}}.", "extra": "", "sec": "Part 03 · 3.3 Psoriasis: gross"}, {"id": "PAT-L5-030", "text": "Psoriasis microscopy (epidermis): {{c1::hyperkeratosis}}, {{c2::parakeratosis}}, {{c3::club-shaped}} rete ridges and {{c4::thin suprapapillary}} epidermal plates.", "extra": "Other features: Munro microabscess, spongiform pustules of Kogoj, dilated vessels.", "sec": "Part 03 · 3.4 Psoriasis microscopic"}, {"id": "PAT-L5-031", "text": "Psoriasis microscopy (abscesses & vessels): {{c1::Munro microabscesses}}, {{c2::spongiform pustules of Kogoj}} and {{c3::dilated blood vessels}} with surrounding inflammation.", "extra": "Epidermis: hyperkeratosis, parakeratosis, club-shaped rete ridges, thin suprapapillary plates.", "sec": "Part 03 · 3.4 Psoriasis microscopic"}, {"id": "PAT-L5-032", "text": "Psoriasis — Munro microabscess lies in the {{c1::stratum corneum}}; spongiform pustule of Kogoj lies in the {{c2::spinous or granular}} layer.", "extra": "Munro sits on top, Kogoj sits lower.", "sec": "Part 03 · 3.4 Psoriasis microscopic"}, {"id": "PAT-L5-033", "text": "Munro microabscesses are collections of {{c1::neutrophils}} within the stratum corneum.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 03 · 3.4 Psoriasis microscopic"}, {"id": "PAT-L5-034", "text": "{{c1::Auspitz}} sign (psoriasis) = {{c2::pinpoint bleeding spots}} when the scales are scraped off.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 03 · 3.3 Psoriasis: gross"}, {"id": "PAT-L5-035", "text": "Psoriasis — main risk factor: {{c1::genetic predisposition}}; flares aggravated by {{c2::stress}}, {{c3::lack of sleep}} and {{c4::winter}}.", "extra": "Official GD answer; pamphlet gives only the genetic/autoimmune basis.", "sec": "Part 03 · 3.2 Psoriasis"}, {"id": "PAT-L5-036", "text": "Main treatment of psoriasis: {{c1::immunosuppressive}} therapy.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 03 · 3.2 Psoriasis"}, {"id": "PAT-L5-038", "text": "Wart (verruca) = {{c1::squamous cell papilloma}} caused by {{c2::HPV}}.", "extra": "", "sec": "Part 04 · 4.1 Warts (squamous cell papilloma) — HPV / verruca"}, {"id": "PAT-L5-039", "text": "Types of warts: {{c1::plantar}}, {{c2::genital}}, {{c3::oral}} and other sites.", "extra": "", "sec": "Part 04 · 4.1 Warts (squamous cell papilloma) — HPV / verruca"}, {"id": "PAT-L5-040", "text": "Wart microscopy: {{c1::hyperkeratosis}}, {{c2::acanthosis}} and {{c3::papillomatosis}}.", "extra": "Munro microabscess is NOT a wart feature — it is psoriasis.", "sec": "Part 04 · 4.2 Warts — microscopic"}, {"id": "PAT-L5-041", "text": "Features of dysplasia: {{c1::pleomorphism}}, {{c2::hyperchromatic nuclei with a high N/C ratio}}, {{c3::disordered tissue architecture}} and {{c4::more abundant mitotic figures}}.", "extra": "Graded mild, moderate, severe.", "sec": "Part 04 · 4.3 Dysplasia"}, {"id": "PAT-L5-042", "text": "Usual age — SCC of skin: {{c1::60 years}}; BCC: {{c2::middle age or elderly}}.", "extra": "", "sec": "Part 07 · 7.2 SCC vs BCC"}, {"id": "PAT-L5-043", "text": "Risk factors of SCC of skin: {{c1::sun exposure}}, {{c2::fair skin}} and {{c3::chronic skin ulcers}}.", "extra": "Chronic skin ulcers → SCC; immunosuppression → BCC.", "sec": "Part 05 · 5.1 Squamous cell carcinoma — clinical & gross"}, {"id": "PAT-L5-044", "text": "Predisposing factors of BCC: {{c1::fair skin}}, {{c2::sun-exposed areas (face, nose)}} and {{c3::immunosuppression}}.", "extra": "Past-paper case (2024-25): a year working at a beach restaurant → sun exposure.", "sec": "Part 06 · 6.1 BCC — clinical features, gross & microscopic"}, {"id": "PAT-L5-045", "text": "Gross SCC of skin: a {{c1::nodular mass}} which {{c2::rapidly ulcerates}}.", "extra": "Edges raised and everted.", "sec": "Part 05 · 5.1 Squamous cell carcinoma — clinical & gross"}, {"id": "PAT-L5-046", "text": "Ulcer edge — SCC: {{c1::raised and everted}}; BCC: {{c2::inverted or beaded}}.", "extra": "Everted SCC · inverted BCC.", "sec": "Part 07 · 7.2 SCC vs BCC"}, {"id": "PAT-L5-047", "text": "The ulcer of basal cell carcinoma (inverted or beaded edge) is called a {{c1::rodent ulcer}}.", "extra": "", "sec": "Part 06 · 6.1 BCC — clinical features, gross & microscopic"}, {"id": "PAT-L5-048", "text": "Diagnostic microscopy — SCC: {{c1::epithelial pearls (cell nests)}}; BCC: {{c2::peripheral (nuclear) palisading}}.", "extra": "Pearls = SCC · Palisades = BCC.", "sec": "Part 07 · 7.2 SCC vs BCC"}, {"id": "PAT-L5-049", "text": "Epithelial pearl (cell nest) of SCC = central laminated dark red stained {{c1::keratin}} within a mass of malignant squamous cells.", "extra": "", "sec": "Part 05 · 5.4 SCC — section in skin"}, {"id": "PAT-L5-050", "text": "Tumor cells — SCC: polygonal, with {{c1::abundant pink}} cytoplasm; BCC: {{c2::scanty}} cytoplasm and large oval hyperchromatic nuclei.", "extra": "", "sec": "Part 07 · 7.2 SCC vs BCC"}, {"id": "PAT-L5-051", "text": "SCC nuclei: {{c1::pleomorphic and hyperchromatic}}, with prominent {{c2::nucleoli}} and {{c3::mitotic figures}}.", "extra": "Best seen in poorly differentiated SCC.", "sec": "Part 05 · 5.4 SCC — section in skin"}, {"id": "PAT-L5-052", "text": "Stroma — SCC: {{c1::loose C.T. with few inflammatory cells}}; BCC: {{c2::fibrous stroma infiltrated by inflammatory cells}}.", "extra": "", "sec": "Part 07 · 7.2 SCC vs BCC"}, {"id": "PAT-L5-053", "text": "BCC: the dermis is infiltrated by masses and nests of darkly stained blue malignant {{c1::basaloid}} cells.", "extra": "", "sec": "Part 06 · 6.4 BCC — section in skin"}, {"id": "PAT-L5-054", "text": "Each BCC mass: outer layer of {{c1::columnar}} cells arranged in a {{c2::palisade}}; inner cells are {{c3::polygonal}}.", "extra": "", "sec": "Part 06 · 6.4 BCC — section in skin"}, {"id": "PAT-L5-055", "text": "BCC is a {{c1::locally malignant}} neoplasm: metastasis is {{c2::very rare}}.", "extra": "Past-paper case (2024-25): no r function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

    let c = '';

    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};

// search
function pageText(p){ const out = []; (p.blocks || []).forEach(b => { ['title', 'html', 'sub', 'hook'].forEach(k => { if (typeof b[k] === 'string') out.push(b[k]); }); if (b.items) out.push(b.items.join(' ')); if (b.rows) out.push(b.rows.flat().join(' ')); if (b.q && QS[b.q]) out.push(QS[b.q].stem); if (b.lab && LABS[b.lab]) out.push(LABS[b.lab].title + ' ' + LABS[b.lab].intro); }); return out.join(' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' '); }
const PT = BOOK.pages.map(pageText);
A['open-search'] = () => { ov('Search the book', `<input class="srch" id="sq" type="search" placeholder="${esc(BOOK.searchHint || 'Search this lecture')}" aria-label="Search"><div class="lst" id="sres"></div>`);
  const inp = $('#sq'); inp.focus(); inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase(); const r = $('#sres');
    if (q.length < 2){ r.innerHTML = ''; return; }
    const hits = [];
    PT.forEach((t, i) => { const j = t.toLowerCase().indexOf(q); if (j >= 0) hits.push([i, t.slice(Math.max(0, j - 40), j + q.length + 60)]); });
    r.innerHTML = hits.length ? hits.map(([i, s]) => `<button class="it" data-act="jump" data-p="${i}"><span class="pgn">p. ${i}</span><span>…${esc(s)}…</span></button>`).join('') : '<p class="muted">Nothing found.</p>';
  }); };
// settings
A['open-set'] = () => {
  const seg = (k, vals) => `<div class="seg">${vals.map(([v, n]) => `<button class="${String(S.set[k]) === String(v) ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>`;
  ov('Settings', `<div class="setrow"><span>Theme</span>${seg('theme', [['system', 'Auto'], ['light', 'Day'], ['dark', 'Night']])}</div>
   <div class="setrow"><span>Text size</span>${seg('size', [[0.9, 'S'], [1, 'M'], [1.15, 'L']])}</div>
   <div class="setrow"><span>Rapid revision<br><small class="muted">Hides running text; keeps tables, notes, questions and labs.</small></span>${seg('rapid', [[false, 'Off'], [true, 'On']])}</div>
   <div class="setrow"><span>Progress<br><small class="muted">Saved in this browser only.</small></span><button class="btn" data-act="reset">Reset all progress</button></div>`);
};
A.set = a => { let v = a.dataset.v; if (a.dataset.k === 'size') v = +v; if (a.dataset.k === 'rapid') v = v === 'true'; S.set[a.dataset.k] = v; save(); applySet(); A['open-set'](); if (opened) draw(); };
A.reset = a => { if (a.dataset.sure){ S = JSON.parse(JSON.stringify(DEF)); for (const k in LS) delete LS[k]; save(); applySet(); closeOv(); toast('Progress reset'); if (opened) draw(); } else { a.dataset.sure = 1; a.textContent = 'Tap again to confirm'; } };

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>

</body>
</html>
