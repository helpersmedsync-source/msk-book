all · Soft Tissue Tumors Compared (2/2)", "groups": [{"title": "6.3 'Most common' facts", "items": [["Most common benign", "soft tissue tumor in adults: lipoma"], ["Most common malignant in adults:", "liposarcoma; in children: rhabdomyosarcoma"], ["Most common rhabdomyosarcoma site:", "head and neck; young girls: vagina (botryoid)"], ["Largest category of adult sarcomas:", "undifferentiated pleomorphic sarcoma"]]}]}], "labName": "Recall · Soft Tissue Tumors Compared (2/2)"}, {"id": "p40", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-PAT-L6-13"}]}, {"id": "p41", "head": "Part 07 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Rapid Revision", "sub": "One-liners, mnemonics, numbers"}, {"t": "h", "no": "", "title": "One-liners, mnemonics, numbers"}, {"t": "list", "items": ["Fat for adults, muscle for kids; Desmin → rhabdo, Calponin → leio", "<b>3 P's of superficial fibromatosis:<\/b> Palmar, Plantar, Penile", "<b>Numbers:<\/b> 77% leiomyoma; 25% fasciitis post-trauma; 50% palmar bilateral", "<b>Numbers:<\/b> desmoid 1–15 cm; synovial sarcoma 25–62% 5-y survival; UPS 10–20 cm"]}], "toc": ["07", "Rapid Revision"]}, {"id": "p42", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pat-l6-6-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, mnemonics, numbers", "items": [["Fat for adults, muscle for kids; Desmin →", "rhabdo, Calponin → leio"], ["3 P's of superficial fibromatosis:", "Palmar, Plantar, Penile"], ["Numbers:", "77% leiomyoma; 25% fasciitis post-trauma; 50% palmar bilateral"], ["Numbers:", "desmoid 1–15 cm; synovial sarcoma 25–62% 5-y survival; UPS 10–20 cm"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p43", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Nodular fasciitis is non-neoplastic"}, {"t": "note", "kind": "trap", "html": "Desmoid: no metastatic potential but locally aggressive and recurs"}, {"t": "note", "kind": "trap", "html": "Superficial fibromatosis males &gt; females; desmoid women teens to 30s"}, {"t": "note", "kind": "trap", "html": "Palmar fibromatosis bilateral in 50%; plantar bilaterality and contractures uncommon"}, {"t": "note", "kind": "trap", "html": "Synovial sarcoma: despite the name, cell of origin not clear"}, {"t": "note", "kind": "trap", "html": "Superficial leiomyosarcoma small, good prognosis; retroperitoneal large, nonresectable, causes death"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p44", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Cardiac rhabdomyoma is associated with tuberous sclerosis"}, {"t": "note", "kind": "cl", "html": "Dupuytren contracture: skin puckering, flexion contracture of 4th and 5th fingers"}, {"t": "note", "kind": "cl", "html": "Peyronie disease: abnormal penile curvature and/or urethral constriction"}, {"t": "note", "kind": "cl", "html": "Botryoid rhabdomyosarcoma in vagina of young girls"}, {"t": "note", "kind": "cl", "html": "Desmoid tumors often painful and recur after incomplete excision"}]}, {"id": "p45", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0531": {"id": "Q0531", "stem": "A 26-year-old man is struck in the left arm by a swinging steel beam at a construction site. On physical examination, a 4-cm area of the lateral upper left arm exhibits swelling and redness with pain on palpation. A radiograph of the left arm shows no fracture. Three weeks later, there now is a 2-cm, painful, well-circumscribed, subcutaneous mass at the site of the original injury. A radiograph shows a solid soft-tissue mass. Which of the following lesions is most likely to be present?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q68", "bank": true, "expl": "A nodule appearing at the site of a recent injury in a young adult is nodular fasciitis: a non-neoplastic lesion that is idiopathic or develops in response to trauma (25% of cases) and typically regresses spontaneously. Superficial fibromatosis is a benign fibroproliferative lesion of the palm, sole or penis (palmar, plantar, penile), not a post-traumatic nodule.", "type": "mcq", "opts": ["Malignant fibrous histiocytoma", "Organizing abscess", "Nodular fasciitis", "Superficial fibromatosis", "Lipoma"], "ans": 2}, "Q0532": {"id": "Q0532", "stem": "A 47-year-old man sees the physician because he has had dull, constant pain in the midsection of the right thigh for the past 4 months. On physical examination, there is pain on palpation of the anterior right thigh, which worsens slightly with movement. The right thigh appears to have a larger circumference than the left thigh. A radiograph of the right upper leg and pelvis shows no fracture, but there is an ill-defined soft-tissue mass anterior to the femur. MRI shows a 10 × 8 × 7 cm solid mass deep to the quadriceps, but it does not involve the femur. What is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q69", "bank": true, "expl": "A large, deep, ill-defined soft-tissue mass of the thigh in a middle-aged adult that spares the bone is best explained by liposarcoma, the most common malignant soft tissue tumour in adults. Rhabdomyosarcoma is the most common malignant soft tissue tumour in children, and osteosarcoma and chondrosarcoma are bone tumours, whereas the femur here is not involved.", "type": "mcq", "opts": ["Nodular fasciitis", "Liposarcoma", "Osteosarcoma", "Rhabdomyosarcoma", "Hemangioma", "Chondrosarcoma"], "ans": 1}, "Q0533": {"id": "Q0533", "stem": "A 66-year-old man has experienced pain in the area around the left knee for the past 6 weeks. He can recall no trauma to the leg. On physical examination, no mass is palpable; there is no warmth or swelling, and there is no loss of range of motion. MRI shows a well-circumscribed, 4-cm mass superior and inferior to the patella. The mass is within soft tissue, without bony erosion. A biopsy of the mass is done; microscopically, the specimen shows a biphasic pattern of spindle cells and epithelial cells forming glands. Karyotypic analysis of tumor cells shows a t(X;18) translocation. What is the most likely diagnosis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PAT Q70", "bank": true, "expl": "Synovial sarcoma mostly arises in the deep soft tissues of the lower extremity (knee and thigh), shows the characteristic t(X;18) translocation and can be biphasic (cuboidal epithelial + spindled mesenchymal differentiation). Leiomyosarcoma is made of malignant spindle cells in interweaving fascicles (calponin), and desmoid tumour carries APC or β-catenin mutations.", "type": "mcq", "opts": ["Leiomyosarcoma", "Synovial sarcoma", "Desmoid tumor", "Mesothelioma", "Osteoblastoma"], "ans": 1}, "Q0540": {"id": "Q0540", "stem": "A 32-year-old man comes to the physician because he has noticed a lump over his right flank. The lump is painless and has enlarged only slowly over the past 3 years. On physical examination, a soft 2-cm nodule is palpable in the subcutis of the right flank above the iliac crest. The lesion is excised. Grossly, it is circumscribed and has a uniformly yellow cut surface. Which of the following is the best advice to give the patient regarding these findings?", "top": false, "rep": "asked 2 years", "tag": "Final bank PAT Q71", "bank": true, "expl": "A slowly growing, soft, circumscribed subcutaneous nodule with a uniformly yellow (fatty) cut surface in an adult is a lipoma, the most common benign soft tissue tumour in adults. Benign tumours grow slowly by expansion, rarely recur and do not metastasize.", "type": "mcq", "opts": ["This mass is benign and is unlikely to recur", "More lesions will develop over time", "Metastases to regional lymph nodes are likely", "Other members of your family should be examined for similar lesions", "Antibiotic therapy will be needed"], "ans": 0}, "Q0669": {"id": "Q0669", "stem": "Case: A 32-year-old woman presents with a slowly enlarging, firm, and painless mass in her abdominal wall. She reports a history of abdominal surgery two years ago for an unrelated condition. Physical examination reveals an ill-defined, firm mass in the left lower quadrant. A biopsy is performed, and histopathological examination shows a proliferation of spindle cells with minimal atypia and mitotic activity. The tumor cells are arranged in long, sweeping fascicles within a collagenous stroma, with infiltrative growth into surrounding tissue. Immunohistochemistry is positive for beta-catenin and negative for S-100 and CD34.\n1. What is the diagnosis?\n2. What are the prognostic factors and recurrence risk?\n3. What are the commonest genes affected?\n4. What is the role of immunohistochemistry?\n5. What are the management options?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W35", "bank": true, "expl": "A poorly demarcated abdominal-wall mass of bland fibroblasts infiltrating neighbouring tissue, β-catenin positive, in a woman in her 30s is a desmoid tumour (deep fibromatosis), caused by APC or β-catenin mutations. It has no metastatic potential but is locally aggressive and frequently recurs after incomplete excision.", "type": "written", "keyhtml": "1. Deep fibromatosis (desmoid tumour): a woman in her teens–30s; abdominal wall (as in rectus sheath fibromatosis); ill-defined (poorly demarcated) mass; bland (benign) fibroblasts infiltrating neighbouring tissue; β-catenin positive on IHC.\n2. Incomplete excision leads to a high rate of recurrence: the tumour has no metastatic potential but is locally aggressive and frequently recurs after incomplete excision.\n3. APC and β-catenin genes.\n4. To exclude mimics: positive β-catenin supports desmoid tumour, and the negative markers (S-100, CD34) help exclude other spindle-cell tumours.\n5. Surgery (complete excision, since incomplete excision is followed by recurrence) and radiotherapy."}, "Q0672": {"id": "Q0672", "stem": "Case: A 10-year-old female presents with a rapidly growing mass in her vagina. Imaging shows a grape-like, solid, invasive lesion, and biopsy reveals small, round blue cells with rhabdomyoblastic differentiation. Immunohistochemistry is positive for desmin and myogenin.\n1. What is the diagnosis of this case?\n2. What are the main histologic findings?\n3. What is the role of immunohistochemistry (desmin, myogenin) in diagnosis?\n4. What are the treatment options?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W36", "bank": true, "expl": "Rhabdomyosarcoma is the most common malignant soft tissue tumour in children; its most common site is the head and neck, but the vagina is the classic site in young girls (botryoid type). Its characteristic cell, the rhabdomyoblast, is desmin positive, which confirms skeletal muscle differentiation.", "aimg": ["figs/GQ-17_ans.jpg", "figs/GQ-17_ans2.jpg"], "acap": "Botryoid rhabdomyosarcoma (vagina of a young girl) — low power and the subepithelial cambium layer", "type": "written", "keyhtml": "1. Botryoid rhabdomyosarcoma: a malignant tumour of skeletal muscle and the most common malignant soft tissue tumour in children; the vagina is its classic site in young girls (most common site overall: head and neck).\n2. Rhabdomyoblasts (the characteristic cells) in the subepithelial areas, forming a cambium layer.\n3. To confirm the diagnosis (desmin and myogenin mark rhabdomyoblastic — skeletal muscle — differentiation; the rhabdomyoblast is desmin positive) and to exclude mimics.\n4. Surgery, radiotherapy and chemotherapy."}, "Q0673": {"id": "Q0673", "stem": "Case: A 58-year-old man presents with a large, painless mass in his thigh that has been slowly enlarging over the past year. Imaging shows a heterogeneous, partially lipomatous mass. Biopsy reveals atypical lipoblasts with varying degrees of pleomorphism.\n1. What is the diagnosis?\n2. What are the differences between lipoma and liposarcoma in histology and imaging?\n3. What are the prognostic factors and recurrence risk?", "top": true, "rep": "asked 2 years", "tag": "Final bank PAT W37", "bank": true, "expl": "Atypical lipoblasts in a large thigh mass of an adult mean liposarcoma, the most common malignant soft tissue tumour in adults, whose characteristic cell is the lipoblast. Lipoma, the most common benign soft tissue tumour in adults, has no lipoblasts.", "aimg": ["figs/GQ-18_ans.jpg"], "acap": "Myxoid liposarcoma — gross", "type": "written", "keyhtml": "1. Liposarcoma: a malignant tumour of adipose tissue and the most common malignant soft tissue tumour in adults; the lipoblast is its characteristic cell.\n2. • Imaging: liposarcoma is a heterogeneous, partially lipomatous mass, in contrast to lipoma.\n• Histology: lipoblasts are absent in lipoma (a benign tumour of adipose tissue, the most common benign soft tissue tumour in adults), whereas the lipoblast is the characteristic cell of liposarcoma.\n3. • Type of liposarcoma: the myxoid type has a good prognosis.\n• Location: a deeper location has a worse prognosis.\n• Incomplete resection increases the risk of recurrence and metastasis.\n• (Accurate diagnosis, grade and stage all influence the prognosis of soft tissue tumours.)"}, "N-PAT-L6-01": {"id": "N-PAT-L6-01", "stem": "A 62-year-old woman is found to have a large retroperitoneal mass. Biopsy shows malignant spindle cells arranged in interweaving fascicles, and immunohistochemistry for calponin demonstrates bundles of muscle filaments. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Final bank PAT Q72", "bank": true, "expl": "Malignant spindle cells in interweaving fascicles, with muscle filament bundles shown by calponin, are leiomyosarcoma, which typically arises in the skin, the deep soft tissues of the extremities and the retroperitoneum. Undifferentiated pleomorphic sarcoma shows no demonstrable lineage differentiation (negative IHC), and leiomyoma is made of benign smooth muscle cells with few mitoses.", "type": "mcq", "opts": ["Leiomyoma", "Leiomyosarcoma", "Synovial sarcoma", "Deep fibromatosis (desmoid tumour)", "Undifferentiated pleomorphic sarcoma"], "ans": 1}, "N-PAT-L6-02": {"id": "N-PAT-L6-02", "stem": "A 3-year-old boy with tuberous sclerosis is found on echocardiography to have a cardiac tumour. Which tumour is most likely?", "top": false, "rep": "", "tag": "Final bank PAT Q73", "bank": true, "expl": "Rhabdomyoma is a benign tumour of skeletal muscle, and cardiac rhabdomyoma is associated with tuberous sclerosis. Rhabdomyosarcoma is its malignant counterpart and the most common malignant soft tissue tumour in children, but it is not the tumour linked to tuberous sclerosis.", "type": "mcq", "opts": ["Rhabdomyoma", "Rhabdomyosarcoma", "Leiomyoma", "Lipoma", "Leiomyosarcoma"], "ans": 0}, "N-PAT-L6-03": {"id": "N-PAT-L6-03", "stem": "A 68-year-old man has a 15-cm mass deep in the soft tissues of the thigh. The resected tumour is grey-white and fleshy, with areas of necrosis and haemorrhage. Microscopy shows sheets of large anaplastic cells with irregular, occasionally bizarre hyperchromatic nuclei and no demonstrable lineage differentiation, and immunohistochemistry is negative for any line of differentiation. What is the most likely diagnosis?", "top": false, "rep": "", "tag": "Final bank PAT Q74", "bank": true, "expl": "High-grade anaplastic cells with no lineage differentiation and negative IHC, in a large (10–20 cm), fleshy, deep thigh mass of an older adult, define undifferentiated pleomorphic sarcoma, the largest category of adult sarcomas, with a generally poor prognosis. Leiomyosarcoma would show spindle cells in interweaving fascicles with calponin-positive muscle filaments.", "type": "mcq", "opts": ["Liposarcoma", "Leiomyosarcoma", "Synovial sarcoma", "Undifferentiated pleomorphic sarcoma", "Rhabdomyosarcoma"], "ans": 3}, "N-PAT-L6-04": {"id": "N-PAT-L6-04", "stem": "A 58-year-old man has had slowly progressive difficulty straightening the ring and little fingers of his right hand. Examination shows irregular thickening of the palmar fascia, puckering of the overlying skin and a flexion contracture of the 4th and 5th fingers. Which statement about this condition is correct?", "top": false, "rep": "", "tag": "Final bank PAT Q75", "bank": true, "expl": "This is palmar fibromatosis (Dupuytren contracture), a superficial fibromatosis that is bilateral in 50% of affected individuals and affects males more than females. Spontaneous regression describes nodular fasciitis, while women in their teens–30s and APC/β-catenin mutations describe deep fibromatosis (desmoid tumour).", "type": "mcq", "opts": ["It is bilateral in 50% of affected individuals", "It is a non-neoplastic lesion that typically regresses spontaneously", "It most commonly affects women from their teens to their 30s", "It shows a characteristic t(X;18) translocation", "It typically shows APC or β-catenin gene mutations"], "ans": 0}, "N-PAT-L6-05": {"id": "N-PAT-L6-05", "stem": "Two patients are diagnosed with leiomyosarcoma: one has a small superficial tumour in the skin of the forearm, and the other has a large tumour of the retroperitoneum. Which statement best compares their expected outcomes?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Superficial leiomyosarcomas are usually small and have a good prognosis, whereas retroperitoneal tumours are usually large and nonresectable and cause death through local extension and metastasis. No metastatic potential with recurrence after incomplete excision describes the desmoid tumour.", "type": "mcq", "opts": ["Superficial: good prognosis; retroperitoneal: often nonresectable, with death from local extension and metastasis", "Superficial: poor prognosis; retroperitoneal: good prognosis after complete resection", "Both: no metastatic potential, but frequent recurrence after incomplete excision", "Both: spontaneous regression, with rare recurrence if excised", "Both: 5-year survival of 25–62%, depending on stage and patient age"], "ans": 0}, "N-PAT-L6-06": {"id": "N-PAT-L6-06", "stem": "A 42-year-old woman has a hysterectomy for another reason. The uterus contains a well-defined, firm 1.5-cm nodule. Microscopy shows benign smooth muscle cells with few mitoses and areas of myxoid change. What is the diagnosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Leiomyomas are benign smooth muscle tumours that arise predominantly in the uterus (77% of women); they are well-defined, usually &lt; 1 to 2 cm, and made of benign smooth muscle cells with few mitoses, sometimes with myxoid change. Leiomyosarcoma is composed of malignant spindle cells in interweaving fascicles.", "type": "mcq", "opts": ["Leiomyoma", "Leiomyosarcoma", "Rhabdomyoma", "Deep fibromatosis (desmoid tumour)", "Botryoid rhabdomyosarcoma"], "ans": 0}, "N-PAT-L6-07": {"id": "N-PAT-L6-07", "stem": "A 27-year-old woman has a painful, poorly demarcated, grey-white, rubbery 8-cm mass in the rectus sheath. Microscopy shows benign fibroblasts infiltrating the neighbouring muscle, and immunohistochemistry is positive for β-catenin. Which statement about this lesion is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "This is a desmoid tumour (deep fibromatosis) of a young woman: APC or β-catenin mutation, β-catenin positive, a poorly demarcated 1–15-cm mass of infiltrating benign fibroblasts. It has no metastatic potential but is locally aggressive and frequently recurs after incomplete excision; spontaneous regression describes nodular fasciitis.", "type": "mcq", "opts": ["It has no metastatic potential but frequently recurs after incomplete excision", "It affects males more frequently than females", "It is usually nonresectable and causes death through local extension and metastasis", "It shows a characteristic t(X;18) translocation", "It typically regresses spontaneously and rarely recurs if excised"], "ans": 0}, "N-PAT-L6-08": {"id": "N-PAT-L6-08", "stem": "A 6-year-old boy has a rapidly enlarging soft-tissue mass. Biopsy shows a malignant tumour whose characteristic cells, rhabdomyoblasts, are desmin positive. What is the most common site of this tumour?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Rhabdomyosarcoma (rhabdomyoblasts, desmin positive) is the most common malignant soft tissue tumour in children, and its most common site is the head and neck. The vagina is its classic site only in young girls (botryoid rhabdomyosarcoma).", "type": "mcq", "opts": ["Head and neck", "Vagina", "Retroperitoneum", "Deep soft tissues of the thigh", "Uterus"], "ans": 0}, "N-PAT-L6-09": {"id": "N-PAT-L6-09", "stem": "In the lecture's classification of soft tissue tumours, which tumour belongs to the group of uncertain origin?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Despite its name, the cell of origin of synovial sarcoma is not clear, so it is grouped with undifferentiated pleomorphic sarcoma as a tumour of uncertain origin. Nodular fasciitis is fibroblast (myofibroblast) derived, leiomyosarcoma smooth muscle derived, rhabdomyoma skeletal muscle derived and liposarcoma adipocyte derived.", "type": "mcq", "opts": ["Synovial sarcoma", "Nodular fasciitis", "Leiomyosarcoma", "Rhabdomyoma", "Liposarcoma"], "ans": 0}, "N-PAT-L6-10": {"id": "N-PAT-L6-10", "stem": "A 52-year-old man has abnormal curvature of the penis and symptoms of urethral constriction. Examination shows a firm thickening on the dorsolateral aspect of the penis. Which statement best describes this lesion?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Penile fibromatosis (Peyronie disease) usually occurs on the dorsolateral penis, causing abnormal curvature and/or urethral constriction; it is one of the 3 P's of superficial fibromatosis (palmar, plantar, penile), benign fibroproliferative lesions with abundant dense collagen. Deep fibromatosis is the desmoid tumour, a different entity.", "type": "mcq", "opts": ["A superficial fibromatosis: a benign fibroproliferative lesion with abundant dense collagen", "A deep fibromatosis with no metastatic potential but frequent local recurrence", "A non-neoplastic lesion that follows trauma and regresses spontaneously", "A benign smooth muscle tumour composed of cells with few mitoses", "A malignant spindle-cell tumour of smooth muscle origin"], "ans": 0}, "N-PAT-L6-11": {"id": "N-PAT-L6-11", "stem": "Compare superficial fibromatosis and deep fibromatosis (desmoid tumour).", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Superficial fibromatosis means the 3 P's, mostly in males; deep fibromatosis is the desmoid tumour of young women, which never metastasizes but infiltrates locally and recurs after incomplete excision.", "type": "written", "keyhtml": "• Both are fibroblast (myofibroblast)-derived fibromatoses.\n• Superficial fibromatosis: benign fibroproliferative lesions with abundant dense collagen; males &gt; females. Types (3 P's):\n  – Palmar (Dupuytren contracture): irregular thickening of the palmar fascia, bilateral in 50%; attachment to the skin → skin puckering; slowly progressive flexion contracture of the 4th &amp; 5th fingers.\n  – Plantar: the same process on the foot, but bilaterality and contractures are uncommon.\n  – Penile (Peyronie disease): dorsolateral penis → abnormal curvature and/or urethral constriction.\n• Deep fibromatosis (desmoid tumour): no metastatic potential but locally aggressive, often painful, and frequently recurs after incomplete excision; women from teens to 30s.\n  – Genetics/IHC: APC or β-catenin gene mutations; β-catenin positive on IHC.\n  – Gross: 1–15 cm, grey-white, rubbery, poorly demarcated.\n  – Microscopy: benign fibroblasts infiltrating neighbouring tissue (e.g. rectus sheath fibromatosis)."}, "N-PAT-L6-12": {"id": "N-PAT-L6-12", "stem": "Enumerate the classification of soft tissue tumours, naming the tumours in each group. What does this classification integrate, and what influences prognosis?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Soft tissue tumours are grouped by the tissue they differentiate towards; the two tumours of uncertain origin are synovial sarcoma and undifferentiated pleomorphic sarcoma.", "type": "written", "keyhtml": "• Adipocyte derived: lipoma, liposarcoma.\n• Skeletal muscle derived: rhabdomyoma, rhabdomyosarcoma.\n• Smooth muscle derived: leiomyoma, leiomyosarcoma.\n• Fibroblast (myofibroblast) derived: nodular fasciitis; fibromatoses (A. superficial; B. deep = desmoid tumour).\n• Tumours of uncertain origin: synovial sarcoma, undifferentiated pleomorphic sarcoma.\n• The classification integrates morphology (differentiation), immunohistochemistry and molecular diagnostics.\n• Accurate diagnosis, grade and stage all influence prognosis."}, "N-PAT-L6-13": {"id": "N-PAT-L6-13", "stem": "Mention the characteristic cell, immunohistochemical marker or genetic change of each of the following: (a) liposarcoma, (b) rhabdomyosarcoma, (c) leiomyosarcoma, (d) desmoid tumour, (e) synovial sarcoma, (f) undifferentiated pleomorphic sarcoma.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Desmin → rhabdo and calponin → leio; synovial sarcoma is 'X and 18'. Undifferentiated pleomorphic sarcoma is defined by the absence of any demonstrable lineage differentiation.", "type": "written", "keyhtml": "a) Liposarcoma: lipoblast (characteristic cell).\nb) Rhabdomyosarcoma: rhabdomyoblast (characteristic cell), desmin positive.\nc) Leiomyosarcoma: bundles of muscle filaments demonstrated by calponin (IHC).\nd) Desmoid tumour: APC or β-catenin gene mutations; β-catenin positive on IHC.\ne) Synovial sarcoma: characteristic t(X;18) translocation (immunostains EMA and TLE1).\nf) Undifferentiated pleomorphic sarcoma: negative immunohistochemistry for any differentiation."}, "TP-077": {"id": "TP-077", "stem": "Deep fibromatoses (desmoid tumours) are known for being locally aggressive and frequently recurring. Which gene mutations are typically associated with these tumours?", "top": true, "rep": "", "tag": "Final bank PAT Q87", "bank": true, "expl": "Desmoid tumours (deep fibromatosis) typically carry APC or β-catenin gene mutations, with positive β-catenin on immunohistochemistry; they do not metastasize but are locally aggressive and recur after incomplete excision. The t(X;18) translocation is characteristic of synovial sarcoma.", "type": "mcq", "opts": ["P53 or RB1", "APC or β-catenin", "BRCA1 or BRCA2", "t(X;18) translocation", "HER2/neu amplification"], "ans": 1}, "TP-078": {"id": "TP-078", "stem": "A 4-year-old girl presents with a 'grape-like' mass protruding from her vagina. Microscopic analysis shows desmin-positive rhabdomyoblasts. The most likely diagnosis is:", "top": true, "rep": "", "tag": "Final bank PAT Q88", "bank": true, "expl": "Rhabdomyosarcoma, the most common malignant soft tissue tumour in children, has the desmin-positive rhabdomyoblast as its characteristic cell, and the vagina of young girls is its classic site (botryoid type). Leiomyosarcoma consists of malignant spindle cells in interweaving fascicles demonstrated by calponin, not rhabdomyoblasts.", "type": "mcq", "opts": ["Leiomyosarcoma", "Botryoid rhabdomyosarcoma", "Deep fibromatosis", "Nodular fasciitis", "Synovial sarcoma"], "ans": 1}}, "labs": {}, "cards": [{"id": "PAT-L6-001", "text": "Groups of soft tissue tumors: {{c1::adipocyte}} derived, {{c2::skeletal muscle}} derived, {{c3::smooth muscle}} derived, {{c4::fibroblast (myofibroblast)}} derived and tumors of {{c5::uncertain origin}}.", "extra": "", "sec": "Part 01 · 1.1 Soft tissue tumors — classification"}, {"id": "PAT-L6-002", "text": "Fibroblast (myofibroblast)-derived lesions: {{c1::nodular fasciitis}}, {{c2::superficial fibromatosis}} and {{c3::deep fibromatosis (desmoid tumor)}}.", "extra": "", "sec": "Part 01 · 1.1 Soft tissue tumors — classification"}, {"id": "PAT-L6-003", "text": "Soft tissue tumors of uncertain origin: {{c1::synovial sarcoma}} and {{c2::undifferentiated pleomorphic sarcoma}}.", "extra": "", "sec": "Part 01 · 1.1 Soft tissue tumors — classification"}, {"id": "PAT-L6-004", "text": "Rhabdomyoma and rhabdomyosarcoma derive from {{c1::skeletal}} muscle; leiomyoma and leiomyosarcoma from {{c2::smooth}} muscle.", "extra": "", "sec": "Part 01 · 1.1 Soft tissue tumors — classification"}, {"id": "PAT-L6-005", "text": "Classification of soft tissue tumors integrates {{c1::morphology (differentiation)}}, {{c2::immunohistochemistry}} and {{c3::molecular diagnostics}}.", "extra": "", "sec": "Part 01 · 1.1 Soft tissue tumors — classification"}, {"id": "PAT-L6-006", "text": "Prognosis of soft tissue tumors is influenced by accurate {{c1::diagnosis}}, {{c2::grade}} and {{c3::stage}}.", "extra": "", "sec": "Part 01 · 1.1 Soft tissue tumors — classification"}, {"id": "PAT-L6-007", "text": "Most common benign soft tissue tumor in adults: {{c1::lipoma}}.", "extra": "Benign tumor of adipose tissue.", "sec": "Part 01 · 1.2 Adipocyte derived — lipoma & liposarcoma"}, {"id": "PAT-L6-008", "text": "Most common malignant soft tissue tumor — adults: {{c1::liposarcoma}}; children: {{c2::rhabdomyosarcoma}}.", "extra": "Fat for adults, muscle for kids.", "sec": "Part 06 · 6.3 \"Most common\" facts"}, {"id": "PAT-L6-009", "text": "{{c1::Lipoblast}} is the characteristic cell of {{c2::liposarcoma}}.", "extra": "Liposarcoma = malignant tumor of adipose tissue.", "sec": "Part 01 · 1.2 Adipocyte derived — lipoma & liposarcoma"}, {"id": "PAT-L6-010", "text": "Lipoma vs liposarcoma histology: lipoblasts are {{c1::absent}} in lipoma.", "extra": "Official GD answer; lipoblast = characteristic cell of liposarcoma.", "sec": "Part 01 · 1.2 Adipocyte derived — lipoma & liposarcoma"}, {"id": "PAT-L6-011", "text": "Imaging of liposarcoma (vs lipoma): a {{c1::heterogeneous, partially lipomatous}} mass.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 01 · 1.2 Adipocyte derived — lipoma & liposarcoma"}, {"id": "PAT-L6-012", "text": "Liposarcoma prognosis: {{c1::myxoid}} type has a good prognosis; a {{c2::deeper}} location is worse; {{c3::incomplete resection}} increases recurrence and metastasis.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 01 · 1.2 Adipocyte derived — lipoma & liposarcoma"}, {"id": "PAT-L6-013", "text": "An excised lipoma (soft, circumscribed, uniformly yellow cut surface) is benign, so it is {{c1::unlikely to recur}}.", "extra": "Benign tumors: recurrence rare, no metastasis.", "sec": "Part 01 · 1.2 Adipocyte derived — lipoma & liposarcoma"}, {"id": "PAT-L6-014", "text": "{{c1::Cardiac rhabdomyoma}} is associated with {{c2::tuberous sclerosis}}.", "extra": "Rhabdomyoma = benign tumor of skeletal muscle.", "sec": "Part 02 · 2.1 Rhabdomyoma"}, {"id": "PAT-L6-015", "text": "{{c1::Rhabdomyoblast}} is the characteristic cell of rhabdomyosarcoma; it is {{c2::desmin}} positive.", "extra": "Desmin → rhabdo · Calponin → leio.", "sec": "Part 02 · 2.2 Rhabdomyosarcoma"}, {"id": "PAT-L6-016", "text": "Rhabdomyosarcoma site — most common: {{c1::head and neck}}; classic in young girls: {{c2::vagina}}.", "extra": "Vaginal type = botryoid rhabdomyosarcoma.", "sec": "Part 02 · 2.2 Rhabdomyosarcoma"}, {"id": "PAT-L6-017", "text": "A grape-like vaginal mass in a young girl, with desmin-positive rhabdomyoblasts = {{c1::botryoid rhabdomyosarcoma}}.", "extra": "GD case: small round blue cells; desmin and myogenin positive.", "sec": "Part 02 · 2.2 Rhabdomyosarcoma"}, {"id": "PAT-L6-018", "text": "Botryoid rhabdomyosarcoma histology: rhabdomyoblasts in the {{c1::subepithelial}} areas, forming a {{c2::cambium layer}}.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 02 · 2.2 Rhabdomyosarcoma"}, {"id": "PAT-L6-019", "text": "Immunohistochemistry of rhabdomyosarcoma: positive for desmin and {{c1::myogenin}}.", "extra": "Myogenin is from the GD case; not in pamphlet.", "sec": "Part 02 · 2.2 Rhabdomyosarcoma"}, {"id": "PAT-L6-020", "text": "Role of immunohistochemistry (desmin/myogenin in rhabdomyosarcoma, β-catenin in desmoid tumor): to {{c1::confirm the diagnosis}} and to {{c2::exclude mimics}}.", "extra": "Official GD answer (not in pamphlet).", "sec": "Part 06 · 6.2 Characteristic cell, marker & genetics → tumor"}, {"id": "PAT-L6-021", "text": "Management — rhabdomyosarcoma: {{c1::surgery, radiotherapy and chemotherapy}}; desmoid tumor: {{c2::surgery and radiotherapy}}.", "extra": "Official GD answers (not in pamphlet).", "sec": "Part 06 · 6.1 Soft tissue tumors compared — master table"}, {"id": "PAT-L6-022", "text": "Leiomyomas arise predominantly in the {{c1::uterus}}, occurring in {{c2::77%}} of women.", "extra": "Benign smooth muscle tumors; also at other sites rich in smooth muscle.", "sec": "Part 03 · 3.1 Leiomyoma"}, {"id": "PAT-L6-023", "text": "Leiomyoma: grossly {{c1::well-defined}}, usually {{c2::< 1 to 2 cm}}; microscopy: benign smooth muscle cells with {{c3::few}} mitoses.", "extra": "May show myxoid change.", "sec": "Part 03 · 3.1 Leiomyoma"}, {"id": "PAT-L6-024", "text": "Sites of leiomyosarcoma: {{c1::skin}}, {{c2::deep soft tissues of the extremities}} and {{c3::retroperitoneum}}.", "extra": "", "sec": "Part 03 · 3.2 Leiomyosarcoma"}, {"id": "PAT-L6-025", "text": "Leiomyosarcoma — superficial: usually small, {{c1::good}} prognosis; retroperitoneal: usually large, {{c2::nonresectable}}, death by local extension and metastasis.", "extra": "", "sec": "Part 03 · 3.2 Leiomyosarcoma"}, {"id": "PAT-L6-026", "text": "Leiomyosarcoma grossly: usually {{c1::painless, firm}} masses.", "extra": "", "sec": "Part 03 · 3.2 Leiomyosarcoma"}, {"id": "PAT-L6-027", "text": "Leiomyosarcoma microscopy: malignant {{c1::spindle}} cells in {{c2::interweaving fascicles}}.", "extra": "", "sec": "Part 03 · 3.2 Leiomyosarcoma"}, {"id": "PAT-L6-028", "text": "{{c1::Calponin}} immunohistochemistry demonstrates bundles of muscle filaments in {{c2::leiomyosarcoma}}.", "extra": "Desmin → rhabdo · Calponin → leio.", "sec": "Part 03 · 3.2 Leiomyosarcoma"}, {"id": "PAT-L6-029", "text": "Nodular fasciitis is a {{c1::non-neoplastic}} lesion.", "extra": "Exam trap: not a true tumor.", "sec": "Part 04 · 4.1 Nodular fasciitis"}, {"id": "PAT-L6-030", "text": "Nodular fasciitis is idiopathic or develops in response to {{c1::trauma}} ({{c2::25%}} of cases).", "extra": "", "sec": "Part 04 · 4.1 Nodular fasciitis"}, {"id": "PAT-L6-031", "text": "Nodular fasciitis typically {{c1::regresses spontaneously}}; if excised, it {{c2::rarely recurs}}.", "extra": "", "sec": "Part 04 · 4.1 Nodular fasciitis"}, {"id": "PAT-L6-032", "text": "A painful, well-circumscribed subcutaneous nodule appearing weeks after trauma, at the injury site, in a young adult = {{c1::nodular fasciitis}}.", "extra": "Not superficial fibromatosis (palmar, plantar, penile).", "sec": "Part 04 · 4.1 Nodular fasciitis"}, {"id": "PAT-L6-033", "text": "Superficial fibromatosis: a group of benign {{c1::fibroproliferative}} lesions with abundant {{c2::dense collagen}}.", "extra": "", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-034", "text": "Who is affected — superficial fibromatosis: {{c1::males > females}}; deep fibromatosis (desmoid): {{c2::women from teens to 30s}}.", "extra": "", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-035", "text": "Types of superficial fibromatosis: {{c1::palmar}}, {{c2::plantar}} and {{c3::penile}}.", "extra": "3 P's.", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-036", "text": "{{c1::Dupuytren contracture}} = {{c2::palmar}} fibromatosis; {{c3::Peyronie disease}} = {{c4::penile}} fibromatosis.", "extra": "", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-037", "text": "Palmar fibromatosis (Dupuytren contracture) is bilateral in {{c1::50%}} of affected individuals.", "extra": "Plantar: bilaterality uncommon.", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-038", "text": "Dupuytren contracture: irregular thickening of the palmar fascia attached to the skin → skin {{c1::puckering}}; slowly progressive flexion contracture of the {{c2::4th and 5th}} fingers.", "extra": "", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-039", "text": "Plantar fibromatosis: the same process on the foot, but {{c1::bilaterality and contractures}} are uncommon.", "extra": "", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-040", "text": "Peyronie disease: usually on the {{c1::dorsolateral}} penis, causing abnormal {{c2::curvature}} and/or {{c3::urethral constriction}}.", "extra": "", "sec": "Part 04 · 4.2 Superficial fibromatosis"}, {"id": "PAT-L6-041", "text": "Desmoid tumor: {{c1::no}} metastatic potential, but {{c2::locally aggressive}} and frequently {{c3::recurs after incomplete excision}}.", "extra": "Often painful.", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-042", "text": "Genes mutated in desmoid tumor: {{c1::APC}} or {{c2::β-catenin}}.", "extra": "IHC: β-catenin positive.", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-043", "text": "Positive {{c1::β-catenin}} immunohistochemistry supports a {{c2::desmoid tumor (deep fibromatosis)}}.", "extra": "GD case: β-catenin positive; S-100 and CD34 negative.", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-044", "text": "Desmoid tumor gross: {{c1::1–15 cm}}, gray-white, rubbery, {{c2::poorly demarcated}} mass.", "extra": "", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-045", "text": "Desmoid tumor microscopy: {{c1::benign fibroblasts}} that {{c2::infiltrate}} neighboring tissues.", "extra": "", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-046", "text": "Rectus sheath fibromatosis (abdominal wall) is a {{c1::deep fibromatosis (desmoid tumor)}}.", "extra": "", "sec": "Part 04 · 4.3 Deep fibromatosis (desmoid tumor)"}, {"id": "PAT-L6-047", "text": "Synovial sarcoma: despite the name, its {{c1::cell of origin is not clear}}.", "extra": "Grouped as a tumor of uncertain origin.", "sec": "Part 05 · 5.1 Synovial sarcoma"}, {"id": "PAT-L6-048", "text": "Synovial sarcoma mostly arises in the deep soft tissues of the lower extremity: {{c1::knee and thigh}}.", "extra": "", "sec": "Part 05 · 5.1 Synovial sarcoma"}, {"id": "PAT-L6-049", "text": "{{c1::t(X;18)}} translocation is characteristic of {{c2::synovial sarcoma}}.", "extra": "Synovial sarcoma: X and 18.", "sec": "Part 05 · 5.1 Synovial sarcoma"}, {"id": "PAT-L6-050", "text": "Synovial sarcoma histology: {{c1::biphasic}} (cuboidal epithelial + spindled mesenchymal) or {{c2::monophasic}} (mostly mesenchymal).", "extra": "", "sec": "Part 05 · 5.1 Synovial sarcoma"}, {"id": "PAT-L6-051", "text": "Synovial sarcoma 5-year survival: {{c1::25–62%}}, depending on stage and patient age.", "extra": "", "sec": "Part 05 · 5.1 Synovial sarcoma"}, {"id": "PAT-L6-052", "text": "Synovial sarcoma immunostains: {{c1::EMA}} and {{c2::TLE1}}.", "extra": "", "sec": "Part 05 · 5.1 Synovial sarcoma"}, {"id": "PAT-L6-053", "text": "Undifferentiated pleomorphic sarcoma: malignant mesenchymal tumors with high-grade {{c1::pleomorphic}} cells that {{c2::cannot be classified into another category}}.", "extra": "", "sec": "Part 05 · 5.2 Undifferentiated pleomorphic sarcoma"}, {"id": "PAT-L6-054", "text": "Largest category of adult sarcomas: {{c1::undifferentiated pleomorphic sarcoma}}.", "extra": "", "sec": "Part 05 · 5.2 Undifferentiated pleomorphic sarcoma"}, {"id": "PAT-L6-055", "text": "Undifferentiated pleomorphic sarcoma: mostly in the deep soft tissues of the {{c1::thigh}} of {{c2::middle-aged or older}} adults; prognosis generally {{c3::poor}}.", "extra": "", "sec": "Part 05 · 5.2 Undifferentiated pleomorphic sarcoma"}, {"id": "PAT-L6-056", "text": "Undifferentiated pleomorphic sarcoma gross: usually {{c1::10–20 cm}}, gray-white, fleshy, with {{c2::necrosis and hemorrhage}}.", "extra": "", "sec": "Part 05 · 5.2 Undifferentiated pleomorphic sarcoma"}, {"id": "PAT-L6-057", "text": "Undifferentiated pleomorphic sarcoma microscopy: sheets of large {{c1::anaplastic}} cells with irregular, occasionally {{c2::bizarre hyperchromatic}} nuclei.", "extra": "No demonstrable lineage differentiation.", "sec": "Part 05 · 5.2 Undifferentiated pleomorphic sarcoma"}, {"id": "PAT-L6-058", "text": "Undifferentiated pleomorphic sarcoma immunohistochemistry: {{c1::negative}} for any line of differentiation.", "extra": "", "sec": "Part 05 · 5.2 Undifferentiated pleomorphic sarcoma"}], "pracs": [{"href": "prac-pat-2.html", "title": "Pathology practical · Lab 2 – Skin & soft tissue tumours"}], "lib": "msk.html", "prev": {"href": "pat-l5.html", "title": "Lecture 5 · Skin"}, "next": null, "coverImg": "covers/Pathology.jpg", "searchHint": "e.g. grade, myogenin, nonresectable"};
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N = BOOK.pages.length, QS = BOOK.questions, LABS = BOOK.labs;
const KEY = 'msk-book-' + BOOK.id + '-v1';
const DEF = {read:{}, ans:{}, pred:{}, flap:{}, self:{}, draft:{}, labs:{}, cards:{}, exams:[], mist:{}, marks:{}, set:{theme:'system', size:1, rapid:false}, last:1};
let S = JSON.parse(JSON.stringify(DEF));
try { const t = JSON.parse(localStorage.getItem(KEY) || 'null'); if (t && typeof t === 'object') for (const k in DEF) if (t[k] !== undefined) S[k] = t[k]; } catch (e) {}
let saveT = null;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 120); }
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const DUR = RM ? 0 : 720, EASE = 'cubic-bezier(.42,.02,.24,1)';

/* ---------- settings ---------- */
function applySet(){
  const r = document.documentElement;
  if (S.set.theme === 'light' || S.set.theme === 'dark') r.dataset.theme = S.set.theme; else r.removeAttribute('data-theme');
  r.style.setProperty('--fsz', S.set.size || 1);
  document.body.classList.toggle('rapid', !!S.set.rapid);
}
applySet();

/* ---------- geometry ---------- */
const stage = $('#stage'), book = $('#book'), pgL = $('#pgL'), pgR = $('#pgR'), leaf = $('#leaf'), lf = $('#lf'), lb = $('#lb');
let mode = 'spread', at = Math.min(Math.max(+S.last || 1, 0), N - 1), busy = false, opened = false, laid = false, drawnMode = null;
function layout(force){
  // layout-viewport size: on phones innerWidth/innerHeight grow while the page is zoomed out (pinch, or a page that overflowed for a moment)
  const de = document.documentElement, vw = de.clientWidth || window.innerWidth, vh = de.clientHeight || window.innerHeight;
  const lenient = laid && mode === 'spread';   // a little hysteresis: a window right at the edge can't flip between one and two pages
  const wide = lenient ? (vw >= 880 && vh >= 500) : (vw >= 900 && vh >= 520);
  $('#mnav').hidden = !(opened && !wide);
  const r = stage.getBoundingClientRect(); const W = r.width, H = r.height - 20;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const maxw = (W - 130) / 2; if (pw > maxw){ pw = maxw; ph = Math.min(H, pw / .72); } mode = 'spread'; }
  else { pw = Math.min(W - 4, 640); ph = Math.max(H, 200); mode = 'single'; }   // phone on its side: the page fits between the bars and scrolls inside
  laid = true;
  const rs = document.documentElement.style, vpw = Math.floor(pw) + 'px', vph = Math.floor(ph) + 'px';
  if (rs.getPropertyValue('--pw') !== vpw) rs.setProperty('--pw', vpw);
  if (rs.getPropertyValue('--ph') !== vph) rs.setProperty('--ph', vph);
  book.classList.toggle('single', mode === 'single');

  if (opened && (force || mode !== drawnMode)) draw();
}
window.addEventListener('resize', () => {
  clearTimeout(layout.t);
  layout.t = setTimeout(function again(){ if (busy){ layout.t = setTimeout(again, 120); return; } layout(); }, 80);
});

/* ---------- page rendering ---------- */
const H = {};   // block renderers
function P(i, side){
  if (i < 0 || i >= N) return `<div class="pin"></div>`;
  const pg = BOOK.pages[i];
  const head = pg.head ? `<div class="rh"><span>${esc(pg.head)}</span><span>${esc(BOOK.short)}</span></div>` : '';
  const body = (pg.blocks || []).map((b, k) => (H[b.t] ? H[b.t](b, pg, k) : '')).join('');
  const ribbon = pg.kind !== 'cover' ? `<button class="ribbon ${S.marks[i] ? 'on' : ''}" data-act="mark" data-p="${i}" aria-label="Bookmark this page"></button>` : '';
  return `<div class="pin" data-pid="${i}">${head}${body}</div>${ribbon}<div class="folio ${side || ''}">${i === 0 ? '' : i}</div>`;
}
function setPage(el, i, side){ el.dataset.page = i; el.innerHTML = P(i, side); }
function draw(){
  drawnMode = mode;
  const keep = {};
  for (const el of [pgL, pgR]){ const sc = el.querySelector('.pin'); if (sc && !el.hidden && el.dataset.page !== undefined) keep[el.dataset.page] = sc.scrollTop; }
  if (mode === 'spread'){
    const L = at - (at % 2);
    setPage(pgL, L, 'l'); setPage(pgR, L + 1, 'r'); pgR.hidden = false;
    mark(L); mark(L + 1);
  } else { setPage(pgL, at, 'r'); pgR.hidden = true; mark(at); }
  for (const el of [pgL, pgR]){ const t = keep[el.dataset.page], sc = el.querySelector('.pin'); if (t && sc) sc.scrollTop = t; }
  upd();
}
function mark(i){ if (i >= 0 && i < N && !S.read[i]){ S.read[i] = 1; save(); } }
function rerender(i){
  for (const el of [pgL, pgR]){
    if (el.hidden || +el.dataset.page !== i) continue;
    const sc = el.querySelector('.pin'); const top = sc ? sc.scrollTop : 0;
    el.innerHTML = P(i, el === pgL && mode === 'spread' ? 'l' : 'r');
    const ns = el.querySelector('.pin'); if (ns) ns.scrollTop = top;
  }
}
function pageOf(el){ const p = el.closest('[data-page]'); return p ? +p.dataset.page : -1; }
function upd(){
  S.last = at; save();
  const L = mode === 'spread' ? at - (at % 2) : at;
  const txt = mode === 'spread' ? (L === 0 ? `p. 1 of ${N - 1}` : `pp. ${L}–${Math.min(L + 1, N - 1)} of ${N - 1}`) : (at === 0 ? 'Contents' : `p. ${at} of ${N - 1}`);
  $('#pgind').textContent = opened ? txt : '';
  $('#mmid').textContent = (BOOK.pages[at].head || BOOK.short) + ' · ' + (at === 0 ? 'contents' : 'p. ' + at);
  const nr = Object.keys(S.read).length; $('#progi').style.width = Math.round(100 * nr / N) + '%';
  // the library's "Continue" button: which lecture and page this reader was on last
  try { localStorage.setItem('msk-last-book', JSON.stringify({id: BOOK.id, href: location.pathname.split('/').pop() || '', title: BOOK.title, page: at, t: Date.now()})); } catch (e) {}
  // the page number is kept in S.last only — never in the address bar: an embedded viewer treats a changed address
  // as a new page and reloads it, which made the book reload on every page turn
}

/* ---------- page turning ---------- */
function clearLeaf(){ leaf.hidden = true; leaf.getAnimations && leaf.getAnimations().forEach(a => a.cancel()); }
function anim(el, frames, done){
  if (!DUR || !el.animate){ done(); return; }
  leaf.style.setProperty('--dur', DUR + 'ms');
  const a = el.animate(frames, {duration: DUR, easing: EASE});
  a.onfinish = done; a.oncancel = done;
}
function go(dir){
  if (busy || !opened) return;
  if (mode === 'spread'){
    const L = at - (at % 2);
    if (dir > 0){
      if (L + 2 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = 'var(--pw)'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(L + 1, 'r'); lb.innerHTML = P(L + 2, 'l'); setPage(pgR, L + 3, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(-180deg)'}], () => { at = L + 2; setPage(pgL, L + 2, 'l'); clearLeaf(); busy = false; mark(at); mark(at + 1); upd(); });
    } else {
      if (L - 2 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'right center';
      lf.innerHTML = P(L, 'l'); lb.innerHTML = P(L - 1, 'r'); setPage(pgL, L - 2, 'l'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], () => { at = L - 2; setPage(pgR, L - 1, 'r'); clearLeaf(); busy = false; upd(); });
    }
  } else {
    if (dir > 0){
      if (at + 1 >= N) return toast('End of the lecture');
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at, 'r'); lb.innerHTML = '<div class="pin"></div>'; setPage(pgL, at + 1, 'r'); leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(0deg)', opacity: 1}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .7}, {transform: 'rotateY(-180deg)', opacity: 0}], () => { at++; clearLeaf(); busy = false; mark(at); upd(); });
    } else {
      if (at - 1 < 0) return;
      busy = true;
      leaf.style.left = '0px'; leaf.style.transformOrigin = 'left center';
      lf.innerHTML = P(at - 1, 'r'); lb.innerHTML = '<div class="pin"></div>'; leaf.hidden = false;
      anim(leaf, [{transform: 'rotateY(-180deg)', opacity: 0}, {transform: 'rotateY(-110deg)', opacity: .9, offset: .3}, {transform: 'rotateY(0deg)', opacity: 1}], () => { at--; setPage(pgL, at, 'r'); clearLeaf(); busy = false; upd(); });
    }
  }
}
function jump(i){
  i = Math.max(0, Math.min(N - 1, i)); closeOv();
  if (!opened) openBook(i); else { at = i; draw(); }
}
document.addEventListener('keydown', e => {
  if (!opened || document.querySelector('#ovs .ov')) { if (e.key === 'Escape') closeOv(); return; }
  if (e.target.closest && e.target.closest('input,textarea')) return;

function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}
    <text class="svgsm" x="8" y="254">${esc(L.caption || '')}</text></svg>`;
  let info;
  if (st.mode === 'explore'){
    const r = L.regions.find(x => x.id === st.sel);
    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};
// --- sorter ---
LAB.sort = L => {
  const st = lst(L.id, () => ({sel: null, placed: {}, wrong: 0, shake: null, order: shuffled(L.items.map(x => x.id), L.id)}));
  const pool = st.order.filter(id => !st.placed[id]);
  const it = id => L.items.find(x => x.id === id);
  const done = !pool.length; if (done) labDone(L.id);
  return `<div class="pool">${pool.map(id => `<button class="chip ${st.sel === id ? 'sel' : ''} ${st.shake === id ? 'shake' : ''}" data-act="spick" data-l="${L.id}" data-id="${id}">${esc(it(id).name)}</button>`).join('') || ''}</div>
   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}
   <div class="bins">${L.bins.map(b => `<button class="bin" data-act="sdrop" data-l="${L.id}" data-b="${b.id}"><h5>${esc(b.name)}</h5>${b.sub ? `<small>${esc(b.sub)}</small>` : ''}<span class="in">${st.order.filter(id => st.placed[id] === b.id).map(id => `<span class="chip ok">${esc(it(id).name)}</span>`).join('')}</span></button>`).join('')}</div>
   <div class="row"><button class="btn" data-act="sreset" data-l="${L.id}">Start again</button></div>`;
};
// --- sequence ---
LAB.seq = L => {
  const st = lst(L.id, () => ({n: 0, wrong: 0, shake: null, order: shuffled(L.steps.map((_, i) => i), L.id + 's')}));
  const done = st.n >= L.steps.length; if (done) labDone(L.id);
  return `<div class="info" style="min-height:0"><h4>${esc(L.prompt)}</h4></div>
   <div class="seqline">${st.n ? L.steps.slice(0, st.n).map((s, i) => `<span class="n">${i + 1}</span><span class="chip ok">${esc(s)}</span>`).join('') : '<span class="muted" style="font-size:.78em">Your order appears here.</span>'}</div>
   <div class="pool">${st.order.filter(i => i >= st.n).map(i => `<button class="chip ${st.shake === i ? 'shake' : ''}" data-act="qpick" data-l="${L.id}" data-i="${i}">${esc(L.steps[i])}</button>`).join('')}</div>
   ${done ? `<div class="done">✓ Correct order${L.mnemonic ? ' — ' + esc(L.mnemonic) : ''}${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ''}</div>` : (st.wrong ? `<div class="muted" style="font-size:.78em">Wrong tries: ${st.wrong}</div>` : '')}
   <div class="row"><button class="btn" data-act="qreset" data-l="${L.id}">Start again</button></div>`;
};
// --- labelled diagram ---
const DRAW = {};
LAB.diagram = L => {
  const st = lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.pins.map(p => p.id), L.id)}));
  const pins = L.pins.map((p, i) => {
    const shown = st.mode === 'labels' || (st.mode === 'test' && st.rev[p.id]);
    let c = st.mode === 'test' && st.rev[p.id] ? 'on' : '';
    if (st.mode === 'find' && st.fb && st.fb[2] === p.id) c = st.fb[0];
    const lx = p.lx !== undefined ? p.lx : p.x + 9, anchor = p.anchor || 'start';
    return `<g class="pinbtn ${c}" data-act="pin" data-l="${L.id}" data-id="${p.id}"><circle class="d" cx="${p.x}" cy="${p.y}" r="7"/><text x="${p.x}" y="${p.y + 2.8}" text-anchor="middle">${i + 1}</text>${shown ? `<text class="plab" x="${lx}" y="${p.ly !== undefined ? p.ly : p.y + 3}" text-anchor="${anchor}">${esc(p.short || p.name)}</text>` : ''}</g>`;
  }).join('');
  let info;
  if (st.mode === 'labels') info = `<span class="muted">All labels shown. Switch to "Test me" (tap a number to reveal it) or "Find it" (find the named structure).</span>`;
  else if (st.mode === 'test') info = `<span class="muted">Say the name of each numbered structure, then tap it to check. Revealed ${Object.keys(st.rev).length} of ${L.pins.length}.</span>`;
  else {
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Choose "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(L.pins.find(p => p.id === st.order[st.qi]).name)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its number · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  }
  return `<div class="modes">${[['labels', 'Labels on'], ['test', 'Test me'], ['find', 'Find it']].map(([m, n]) => `<button class="mini ${st.mode === m ? 'on' : ''}" data-act="dmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}</div>
   <div class="svgw"><svg viewBox="${L.viewBox}" role="img" aria-label="${esc(L.title)}">${DRAW[L.draw] ? DRAW[L.draw]() : ''}${pins}</svg></div>
   ${st.mode === 'labels' ? `<ol class="key">${L.pins.map(p => `<li>${esc(p.name)}</li>`).join('')}</ol>` : st.mode === 'test' ? `<ol class="key">${L.pins.map(p => `<li>${st.rev[p.id] ? esc(p.name) : '<span class="muted">tap ' + (L.pins.indexOf(p) + 1) + ' to check</span>'}</li>`).join('')}</ol>` : ''}<div class="info">${info}</div>`;
};
