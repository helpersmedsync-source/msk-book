ipocortin → ↓ PGs &amp; LTs"], ["↓ COX-2 expression", "↓ platelet-activating factor, ↓ interleukins (IL-2)"], ["Uses:", "anti-inflammatory and immunosuppressive"]]}]}], "labName": "Recall · [Part 2] Corticosteroids (1/2)"}, {"id": "p83", "head": "Lab · Recall · Part P2-05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l1-11-1", "title": "Recall · [Part 2] Corticosteroids (2/2)", "groups": [{"title": "P2-5.3 Steroids — systemic vs local therapy", "items": [["Systemic:", "anti-inflammatory &amp; immunosuppressive"], ["Local injection therapy in", "myofascial pain with local anaesthetic &amp; botulinum toxin"]]}]}], "labName": "Recall · [Part 2] Corticosteroids (2/2)"}, {"id": "p84", "head": "Part P2-05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHA-L1-05"}]}, {"id": "p85", "head": "Part P2-06 · [Part 2] Drugs Compared", "kind": "text", "blocks": [{"t": "part", "no": "P2-06", "title": "[Part 2] Drugs Compared", "sub": "Master comparison table"}, {"t": "h", "no": "P2-6.1", "title": "Master comparison table"}, {"t": "list", "items": ["Opioids, aspirin, reversible NSAIDs, celecoxib, acetaminophen, corticosteroids — mechanism, uses, side effects"]}], "toc": ["P2-06", "[Part 2] Drugs Compared"]}, {"id": "p86", "head": "Lab · Recall · Part P2-06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l1-12-0", "title": "Recall · [Part 2] Drugs Compared", "groups": [{"title": "P2-6.1 Master comparison table", "items": [["Opioids, aspirin, reversible NSAIDs", "celecoxib, acetaminophen, corticosteroids — mechanism, uses, side effects"]]}]}], "labName": "Recall · [Part 2] Drugs Compared"}, {"id": "p87", "head": "Part P2-07 · [Part 2] Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "P2-07", "title": "[Part 2] Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "P2-7.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Q&amp;A recap of analgesic classes, opioids, eicosanoids, COX, NSAIDs, acetaminophen, steroids"]}, {"t": "h", "no": "P2-7.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["MORPHINE side effects; SAIDS side effects &amp; uses; lowest dose shortest time"]}], "toc": ["P2-07", "[Part 2] Rapid Revision"]}, {"id": "p88", "head": "Lab · Recall · Part P2-07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l1-13-0", "title": "Recall · [Part 2] Rapid Revision", "groups": [{"title": "P2-7.1 Must-know one-liners", "items": [["Q&amp;A recap of analgesic", "classes, opioids, eicosanoids, COX, NSAIDs, acetaminophen, steroids"]]}, {"title": "P2-7.2 Mnemonic vault & classic exam traps", "items": [["MORPHINE side effects; SAIDS", "side effects &amp; uses; lowest dose shortest time"]]}]}], "labName": "Recall · [Part 2] Rapid Revision"}, {"id": "p89", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Tubocurarine crossed out — answer atracurium / mivacurium as competitive NMBs"}, {"t": "note", "kind": "trap", "html": "Succinylcholine phase II resembles non-depolarizing block"}, {"t": "note", "kind": "trap", "html": "Competitive block: diaphragm paralysed last; recovery in reverse"}, {"t": "note", "kind": "trap", "html": "MH is an idiosyncrasy reaction; dantrolene given i.v.; acts at SR"}, {"t": "note", "kind": "trap", "html": "LA blocks Na+ channels from inside; only unionized base enters, ionized form is active"}, {"t": "note", "kind": "trap", "html": "Acidity outside nerve → LA inactive; acidity inside → more active"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p90", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "PABA allergy = esters"}, {"t": "note", "kind": "trap", "html": "Botulinum ↓ ACh release; NMBs block postsynaptic receptor"}, {"t": "note", "kind": "trap", "html": "Only aspirin is irreversible (acetylation)"}, {"t": "note", "kind": "trap", "html": "NSAIDs ↑ bleeding time but normal PT/PTT"}, {"t": "note", "kind": "trap", "html": "COX-1 constitutive, COX-2 inducible, COX-3 only CNS"}, {"t": "note", "kind": "trap", "html": "Celecoxib ↑ CV risk, ↓ GI risk, no antiplatelet effect; ibuprofen/naproxen the reverse"}, {"t": "note", "kind": "trap", "html": "Acetaminophen is not an NSAID — crossed out of NSAID list; no anti-inflammatory/platelet effect"}]}, {"id": "p91", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Steroids act on PLA2 (via lipocortin); NSAIDs act on COX"}, {"t": "note", "kind": "trap", "html": "NSAIDs are tocolytic and close the PDA"}, {"t": "note", "kind": "cl", "html": "Malignant hyperthermia: rigidity, hyperthermia, lactic acidosis → dantrolene i.v. + cooling + correct acidosis"}, {"t": "note", "kind": "cl", "html": "Give acetaminophen to patients with coagulopathy or history of gastric ulcers"}, {"t": "note", "kind": "cl", "html": "Prescribe NSAIDs at lowest effective dose for shortest time"}, {"t": "note", "kind": "cl", "html": "COX-2 inhibitors carry increased cardiovascular event risk"}]}, {"id": "p92", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Spinal anaesthesia: hypotension/bradycardia, CSF-leak headache, respiratory paralysis, septic meningitis, urinary retention"}]}, {"id": "p93", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Y26-057": {"id": "Y26-057", "stem": "Which of the following correctly describes the actions of baclofen?", "top": true, "rep": "", "tag": "Final bank PHA Q1", "bank": true, "expl": "Baclofen is a centrally acting skeletal muscle relaxant (spasmolytic) that works as an agonist at gamma-aminobutyric acid (GABA) receptors to reduce excess muscle tone. Stopping Ca2+ release from the sarcoplasmic reticulum is how the direct relaxant dantrolene works, not baclofen.", "type": "mcq", "opts": ["Agonist at glutamate receptors", "Antagonist at neuronal nicotinic receptors", "Agonist at gamma-aminobutyric acid receptors", "Agonist at glycine receptors", "Antagonist at skeletal muscle ryanodine receptors"], "ans": 2}, "Y26-058": {"id": "Y26-058", "stem": "A patient is administered a skeletal muscle relaxant prior to abdominal surgery. The patient soon begins to exhibit hypotension, bronchospasm, and excessive bronchial and salivary secretions. Which of the following skeletal muscle relaxants did this patient most likely receive?", "top": true, "rep": "", "tag": "Final bank PHA Q2", "bank": true, "expl": "Tubocurarine (curare) is the original competitive neuromuscular blocker; it also releases histamine, which explains the hypotension, bronchospasm and excessive bronchial and salivary secretions. Baclofen and dantrolene are not neuromuscular blockers — dantrolene relaxes muscle directly by inhibiting Ca++ release from the sarcoplasmic reticulum.", "type": "mcq", "opts": ["Atracurium", "Baclofen", "Dantrolene", "Tubocurarine", "Vecuronium"], "ans": 3}, "Q0804": {"id": "Q0804", "stem": "A 58-year-old man complained to his physician of morning stiffness in the hip and knee and some joint stiffness after inactivity. Past medical history of the patient was significant for a myocardial infarction 6 months earlier. Further exams led to the diagnosis of osteoarthritis, and an analgesic pharmacotherapy was prescribed. Which of the following analgesic drugs would be contraindicated for this patient?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA Q13", "bank": true, "expl": "Celecoxib is the COX-2 selective NSAID and carries an increased risk of cardiovascular events (stroke and heart attack), because it blocks endothelial PGI2 while platelet TXA2 made by COX-1 is left unopposed. Diclofenac, piroxicam and ibuprofen still inhibit COX-1 and carry less CV risk (ibuprofen, a nonselective NSAID, has a decreased CV risk).", "type": "mcq", "opts": ["Diclofenac", "Piroxicam", "Celecoxib", "Acetaminophen", "Ibuprofen"], "ans": 2}, "Q0744": {"id": "Q0744", "stem": "Aspirin inhibits which of the following enzymes?", "top": false, "rep": "", "tag": "Final bank PHA Q21", "bank": true, "expl": "Aspirin acetylates and irreversibly inhibits cyclooxygenase (both COX-1 and COX-2), preventing conversion of arachidonic acid to prostaglandins. Lipoxygenase and the lipases are not named as aspirin targets; the only other enzyme blocked on this pathway is phospholipase A2, inhibited by corticosteroids through lipocortin.", "type": "mcq", "opts": ["Lipoprotein lipase", "Phospholipase D", "Lipoxygenase", "Cyclooxygenase"], "ans": 3}, "Q0747": {"id": "Q0747", "stem": "Which of the following patient characteristics is a possible reason for the use of celecoxib in the treatment of arthritis?", "top": false, "rep": "", "tag": "Final bank PHA Q22", "bank": true, "expl": "Celecoxib selectively inhibits COX-2 and spares the gastric mucosa from the effects of COX-1 inhibition, so it causes fewer ulcers and less bleeding than nonselective NSAIDs. That makes it the choice for a patient with a history of peptic ulcer; the pamphlet gives no reason to prefer it for the other histories.", "type": "mcq", "opts": ["History of type 2 Diabetes Mellitus", "History of gout", "History of peptic ulcer disease", "History of severe rash after treatment with a sulfonamide antibiotic"], "ans": 2}, "Q0751": {"id": "Q0751", "stem": "Which of the following actions of aspirin is manifested at the lowest dose?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA Q18", "bank": true, "expl": "Aspirin is cardioprotective at low doses: it irreversibly blocks platelet COX-1, which makes thromboxane A2, the promoter of platelet aggregation. Its analgesic, antipyretic and anti-inflammatory uses are not the actions linked to low doses.", "type": "mcq", "opts": ["Analgesic", "Antipyretic", "Anti-inflammatory", "Antiplatelet aggregatory"], "ans": 3}, "Q0753": {"id": "Q0753", "stem": "Which of the following is an advantage of celecoxib over most other NSAIDs?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA Q19", "bank": true, "expl": "In the stomach COX-1 stimulates synthesis of the cytoprotective PGE2 and PGI2; celecoxib selectively inhibits COX-2 and spares the gastric mucosa, so it causes fewer ulcers and less bleeding. Less bronchospasm or hypersensitivity is not among the advantages of COX-2 inhibitors, which are potent anti-inflammatory, antipyretic and analgesic action, less gastric upset and no effect on platelet aggregation.", "type": "mcq", "opts": ["Less risk of harm to the developing fetus in the third trimester", "Greater degree of efficacy in the treatment of rheumatoid arthritis", "Once-daily dosing allows the patient convenience", "Less risk of bronchospasm and hypersensitivity reactions", "Less inhibition of PGE2 effects on the gastric mucosa"], "ans": 4}, "Q0754": {"id": "Q0754", "stem": "A man aged 74 has moderate hypertension controlled with antihypertensive agents: hydrochlorothiazide 12.5 mg once daily and losartan 50 mg once daily. He is prescribed rofecoxib 50 mg (selective NSAID) once daily to control osteoarthritis pain. After 3 months of this therapy, his blood pressure begins to rise. This increase in blood pressure is most likely due to which of the following?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA Q20", "bank": true, "expl": "Prostaglandins increase renal blood flow; NSAIDs, coxibs included, decrease it, causing sodium and water retention, and the fall in renal PGE2 leads to oedema and a rise in blood pressure. Option b is wrong because rofecoxib is COX-2 selective and spares COX-1, and NSAIDs decrease rather than increase renal blood flow (option c).", "type": "mcq", "opts": ["Increased metabolism of losartan due to induction of CYP2C9 by rofecoxib", "Arteriolar contraction in the peripheral circulation caused by inhibition of COX-1 by rofecoxib", "Increased excretion of hydrochlorothiazide due to increased renal blood flow caused by rofecoxib", "Inhibition of COX-2 by rofecoxib, which leads to decreased renal blood flow", "Weight gain caused by rofecoxib’s ability to decrease basal metabolic rate"], "ans": 3}, "Q0755": {"id": "Q0755", "stem": "Which statement correctly describes the proposed mechanism of cardioprotection from low-dose aspirin?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q3", "bank": true, "expl": "Low-dose aspirin is cardioprotective because blocking platelet COX-1 lowers thromboxane A2, a vasoconstrictor that promotes platelet aggregation. Lowering endothelial prostacyclin (PGI2), a vasodilator that inhibits aggregation, would raise rather than reduce cardiovascular risk — that imbalance is how COX-2 inhibitors increase it.", "type": "mcq", "opts": ["Aspirin preferentially inhibits COX-2 to lead to a relative reduction in thromboxane A2 levels", "Aspirin preferentially inhibits COX-1 to lead to a relative reduction in thromboxane A2 levels", "Aspirin preferentially inhibits COX-2 to lead to a relative reduction in prostacyclin levels", "Aspirin preferentially inhibits COX-1 to lead to a relative reduction in prostacyclin levels"], "ans": 1}, "Q0757": {"id": "Q0757", "stem": "A 70-year-old man presents to his cardiologist with shortness of breath, crackles along both lung bases, and 1+ pitting edema in his lower extremities. His cardiologist diagnoses him with mild congestive heart failure and places him on a thiazide diuretic. Two days later, the patient comes to the emergency department obtunded and oliguric, with a highly elevated creatinine level of 8.3 mg/dL. His wife reports that the only medication that he took besides his diuretic was “some ibuprofen for his headache.” Which of the following is the most likely reason for this patient’s sudden renal failure?", "top": false, "rep": "", "tag": "Final bank PHA Q23", "bank": true, "expl": "NSAIDs such as ibuprofen decrease renal prostaglandins, and decreased prostacyclin (PGI2) leads to hyperkalaemia and acute renal failure; in the kidney, COX-1 prostaglandin production is at the afferent arteriole. NSAIDs decrease rather than increase prostaglandin production, which rules out options d and e.", "type": "mcq", "opts": ["Decrease of prostacyclin (PGI2) production in both arterioles of the kidney", "Decrease of prostacyclin (PGI2) production in the afferent arterioles of the kidney", "Decrease of prostacyclin (PGI2) production in the efferent arterioles of the kidney", "Increase of prostacyclin (PGI2) production in the afferent arterioles of the kidney", "Increase of prostacyclin (PGI2) production in the efferent arterioles of the kidney"], "ans": 1}, "Q0759": {"id": "Q0759", "stem": "Which of the following is the only local anesthetic that causes vasoconstriction and may result in an increase in blood pressure?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q4", "bank": true, "expl": "Cocaine is one of the ester local anaesthetics, with procaine and benzocaine. The usual cardiovascular side effects of local anaesthetics are bradycardia and hypotension; cocaine is the exception that causes vasoconstriction and can raise blood pressure.", "type": "mcq", "opts": ["Bupivacaine", "Cocaine", "Benzocaine", "Lidocaine", "Tetracaine"], "ans": 1}, "Q0760": {"id": "Q0760", "stem": "A 26-year-old woman with cerebral palsy complains of severe pain associated with spasms in her leg muscles. Which of the following drugs is used in cerebral palsy to reduce skeletal muscle spasticity by an action on cholinergic nerve endings?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q5", "bank": true, "expl": "Botulinum toxin is a peripheral skeletal muscle relaxant that blocks the release of ACh from vesicles at the motor (cholinergic) nerve ending, and it is used for spasticity conditions and pain management. Dantrolene also treats spastic muscle conditions, but it acts on the sarcoplasmic reticulum, not on the nerve ending.", "type": "mcq", "opts": ["Baclofen", "Botulinum toxin", "Dantrolene", "Diazepam", "Tubocurarine"], "ans": 1}, "Q0762": {"id": "Q0762", "stem": "A 62-year-old woman is being prepared for cardiac bypass surgery. Before she is intubated, she is given a skeletal muscle relaxant that causes her to have muscle fasciculations prior to muscle relaxation. Which of the following drugs was most likely administered?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q6", "bank": true, "expl": "Succinylcholine is the depolarizing blocker: its phase I block depolarizes the end plate without repolarization, giving initial muscle twitches (transient fasciculations) before flaccid paralysis. Atracurium is a competitive blocker that simply competes with ACh, so relaxation is not preceded by twitches.", "type": "mcq", "opts": ["Atracurium", "Succinylcholine", "Pancuronium", "Rocuronium", "Vecuronium"], "ans": 1}, "Q0764": {"id": "Q0764", "stem": "A 26-year-old woman undergoing surgery is given an inhalant anesthetic. She is also given an IV dose of succinylcholine. Within minutes, she develops a heart rate of 124/min and increasing core body temperature. Which of the following is the mechanism of action of the drug of choice for this patient’s condition?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q7", "bank": true, "expl": "A rising heart rate and core temperature after an inhalant anaesthetic plus succinylcholine indicate malignant hyperthermia, an idiosyncrasy reaction with sudden, prolonged Ca2+ release from the sarcoplasmic reticulum. The drug of choice is i.v. dantrolene, which inhibits Ca2+ release from the SR; competing with ACh at the motor end plate is how atracurium and mivacurium act.", "type": "mcq", "opts": ["It interferes with the release of Ca2+ from the sarcoplasmic reticulum", "It is a competitive antagonist of ACh at the motor end plate", "It is a GABA receptor agonist that enhances inhibition of nerve impulses", "It uncouples oxidative phosphorylation, thereby preventing heat formation"], "ans": 0}, "Q0770": {"id": "Q0770", "stem": "An 850-g (1.87-lb) baby boy, prematurely born at 27 weeks’ gestational age, was intubated immediately and placed on positive pressure assisted ventilation. On the third day of life, his nurse noticed that he had tachycardia and a widened pulse pressure. Color Doppler echocardiography showed reverse pulmonary artery flow in diastole. A treatment with intravenous indomethacin was started. Which of the following best explains the reason for that therapy?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA Q14", "bank": true, "expl": "Prostaglandins maintain the patency of the ductus arteriosus, so NSAIDs close a patent ductus, and indomethacin is the NSAID used for this. NSAIDs have no listed role in surfactant formation, lung maturation, valve thrombi or atrial contractility.", "type": "mcq", "opts": ["To decrease atrial contractility", "To close the patent ductus arteriosus", "To prevent thrombi on cardiac valves", "To increase lung surfactant formation", "To speed up the maturation of the lungs"], "ans": 1}, "Q0772": {"id": "Q0772", "stem": "Which statement correctly describes the pathophysiologic actions of prostaglandins at a target tissue?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q8", "bank": true, "expl": "Prostaglandins protect the gastric and duodenal mucosa against HCl and pepsin, including by reducing gastric acid secretion. The other options are reversed: prostaglandins increase renal blood flow, and it is their loss with NSAIDs that causes sodium and water retention and decreased mucus secretion.", "type": "mcq", "opts": ["Promote vasoconstriction in the kidneys", "Promote sodium and water retention in the kidneys", "Decrease secretion of mucus at the lining of the stomach", "Decrease secretion of gastric acid in the stomach"], "ans": 3}, "Q0798": {"id": "Q0798", "stem": "A 32-year-old woman presents for a right distal radius fracture. She requests regional anesthesia to help with her pain postoperatively. She reports that as a child, she had an allergic reaction to Novocain (procaine) at the dentist’s office. Which local anesthetic is appropriate for use in this patient?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q9", "bank": true, "expl": "Procaine is an ester, and the allergic dermatitis caused by local anaesthetics comes from the esters (via PABA formation), so an amide is needed. Ropivacaine is an amide (an 'i' before '-caine'), whereas chloroprocaine, benzocaine and tetracaine are esters with only the 'i' of 'caine'.", "type": "mcq", "opts": ["Chloroprocaine", "Benzocaine", "Ropivacaine", "Tetracaine"], "ans": 2}, "Q0799": {"id": "Q0799", "stem": "A 64-year-old man presents with mild to moderate musculoskeletal back pain. He states that he has tried acetaminophen without relief. His medical history includes diabetes, hypertension, hyperlipidemia, gastric ulcer (resolved), and coronary artery disease. Which is the most appropriate NSAID regimen to treat this patient’s pain?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q10", "bank": true, "expl": "With coronary artery disease, celecoxib (COX-2 selective, increased CV risk) and indomethacin (semiselective, caution with increased CV risk) are poor choices, while the nonselective naproxen has a lower CV risk. Naproxen carries a higher GI risk, so with his history of gastric ulcer it is combined with omeprazole rather than given alone.", "type": "mcq", "opts": ["Celecoxib", "Indomethacin and omeprazole", "Naproxen and omeprazole", "Naproxen"], "ans": 2}, "Q0800": {"id": "Q0800", "stem": "Which statement is correct regarding the difference between acetaminophen and naproxen?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q11", "bank": true, "expl": "Acetaminophen has no anti-inflammatory effect, does not affect platelet function or bleeding time, is the drug given to patients with a history of gastric ulcer and is a potent antipyretic, which rules out a, b and d. Compared with naproxen it carries less risk of cardiovascular events.", "type": "mcq", "opts": ["Acetaminophen has more anti-inflammatory effects compared with naproxen", "Acetaminophen has more GI side effects but less effects on bleeding compared with naproxen", "Acetaminophen has less risk for CV events compared with naproxen", "Acetaminophen has fewer antipyretic effects than naproxen"], "ans": 2}, "Q0805": {"id": "Q0805", "stem": "Paracetamol is preferred as an analgesic antipyretic over NSAIDs in the following cases EXCEPT:", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q12", "bank": true, "expl": "Paracetamol has no anti-inflammatory effect, so in gout an anti-inflammatory drug is needed — NSAIDs (or steroids) are the drugs commonly used in the acute attack. Paracetamol is the safer choice in peptic ulcer and bleeding disorders (it does not affect platelets) and in asthma, since COX-1/COX-2 inhibitors can cause aspirin-like asthma.", "type": "mcq", "opts": ["Bronchial asthma", "Gout", "Peptic ulcer", "Bleeding disorders"], "ans": 1}, "Q0808": {"id": "Q0808", "stem": "A 63-year-old woman recently diagnosed with osteoarthritis started treatment with ibuprofen. The biosynthesis of which of the following pairs of endogenous compounds was most likely inhibited by the drug?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA Q15", "bank": true, "expl": "Ibuprofen reversibly inhibits COX-1 and COX-2, so the endoperoxides that become thromboxane A2 and prostacyclin (PGI2) are not formed. Leukotrienes are reduced by corticosteroids acting earlier at phospholipase A2, not by COX inhibitors.", "type": "mcq", "opts": ["Prostaglandins and leukotrienes", "Thromboxanes and leukotrienes", "Prostacyclin and leukotrienes", "Prostaglandins and bradykinin", "Prostacyclin and thromboxanes"], "ans": 4}, "Q0810": {"id": "Q0810", "stem": "Which of the following statements about NSAIDs is correct?", "top": false, "rep": "", "tag": "Final bank PHA Q24", "bank": true, "expl": "Nonselective NSAIDs such as ibuprofen and naproxen inhibit both COX-1 and COX-2, lowering prostaglandins, including the cytoprotective PGE2 and PGI2 that COX-1 makes in the stomach. Selective COX-2 inhibitors cause fewer ulcers, not more, and NSAIDs reduce prostaglandin synthesis rather than increase it.", "type": "mcq", "opts": ["Selective COX-2 inhibitors have a higher risk of gastric ulceration than nonselective NSAIDs", "Nonselective NSAIDs inhibit both COX-1 and COX-2, leading to reduced prostaglandin synthesis and reduced gastric protection", "NSAIDs increase prostaglandin synthesis, leading to decreased renal blood flow", "COX-1 inhibitors primarily reduce inflammation without affecting platelet aggregation"], "ans": 1}, "Q0811": {"id": "Q0811", "stem": "A 62-year-old man complained to his physician of epigastric pain. The man had been taking several ibuprofen tablets each day for the past 2 weeks because of arthritic pain. Endoscopy disclosed two superficial ulcers near the stomach antrum. Increased gastric secretion of which of the following compounds most likely contributed to the patient’s disorder?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA Q16", "bank": true, "expl": "Gastric COX-1 makes PGE2, which protects the stomach mucosa against HCl and pepsin; ibuprofen blocks it, so the mucosa is left exposed to acid and ulcers form. NSAIDs decrease, rather than increase, mucus and bicarbonate secretion.", "type": "mcq", "opts": ["Hydrochloric acid", "Bicarbonate secretion", "Gastric mucus", "Gastrin", "Cholecystokinin"], "ans": 0}, "Q0812": {"id": "Q0812", "stem": "Aspirin differs from other NSAIDs in that it ________.", "top": false, "rep": "", "tag": "Final bank PHA W1", "bank": true, "expl": "The pamphlet names aspirin as the irreversible nonselective NSAID (acetylation of COX); ibuprofen, naproxen, indomethacin and ketorolac inhibit COX reversibly.", "type": "written", "keyhtml": "It acetylates and irreversibly inhibits cyclooxygenase (both COX-1 and COX-2), whereas the other NSAIDs (e.g. ibuprofen, naproxen, indomethacin, ketorolac) inhibit COX-1 and COX-2 reversibly."}, "Q0815": {"id": "Q0815", "stem": "The rationale behind the development of selective COX-2 inhibitors is ________.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "COX-1 in the stomach stimulates synthesis of the cytoprotective PGE2 and PGI2; COX-2 inhibitors spare the gastric mucosa from the effects of COX-1 inhibition, so they have less GI toxicity.", "type": "written", "keyhtml": "Fewer GI adverse effects (fewer ulcers, less bleeding): they spare the gastric mucosa, because the cytoprotective PGE2 and PGI2 of the stomach are made by COX-1, which they do not inhibit."}, "Q0816": {"id": "Q0816", "stem": "Concern has arisen because of a doubling in the incidence of ________ in patients taking rofecoxib. One possible explanation is that it inhibits COX-2-mediated production of the vasodilator PGI2 by endothelial cells, while not affecting the prothrombotic actions of COX-1 in platelets.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The SAIDS mnemonic lists stroke and heart attack as the COX-2 inhibitor side effect, and the thromboxane/prostacyclin imbalance explains it: endothelial PGI2 falls while platelet TXA2 is unopposed.", "type": "written", "keyhtml": "Heart attack and stroke (cardiovascular events).\n• Endothelial COX-2 → PGI2: vasodilation, anti-aggregation\n• Platelet COX-1 → TXA2: vasoconstriction, pro-aggregation\n• Blocking only COX-2 leaves TXA2 unopposed → increased cardiovascular risk"}, "N-PHA-L1-01": {"id": "N-PHA-L1-01", "stem": "A nerve impulse reaches the motor nerve ending of a skeletal muscle fibre; Ca++ enters and acetylcholine is released onto the nicotinic receptor of the motor end plate. To which part of this receptor does acetylcholine bind to open the channel?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The nicotinic receptor is a membrane ion channel of four peptides (2 α, one β, one δ), and acetylcholine combines with the two α subunits to open the channel and depolarize the end plate. Binding involves both α subunits, not the β or δ subunit.", "type": "mcq", "opts": ["The two α subunits", "The single β subunit", "The single δ subunit", "The β and δ subunits together", "One α subunit and the β subunit"], "ans": 0}, "N-PHA-L1-02": {"id": "N-PHA-L1-02", "stem": "A patient is paralysed with atracurium for abdominal surgery. At the end of the operation the block is allowed to wear off. Which muscles are expected to recover first?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Competitive blockers relax the face first, then the limbs, trunk and intercostals, and the diaphragm last; recovery occurs in reverse order, so the diaphragm recovers first. The face is the first to be paralysed and therefore the last to recover.", "type": "mcq", "opts": ["Facial muscles", "Limb muscles", "Trunk muscles", "Intercostal muscles", "Diaphragm"], "ans": 4}, "N-PHA-L1-03": {"id": "N-PHA-L1-03", "stem": "A dentist injects lidocaine around a tooth with a large abscess, but the patient still feels pain during the procedure. Which of the following best explains the poor effect of the local anaesthetic?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Only the free unionized base crosses the neuronal membrane; extracellular acidity, as in inflammation or an abscess, ionizes the base so it is not lipid soluble, cannot enter the nerve and is inactive. Lidocaine is an amide broken down by liver amidases, not tissue esterases, and small-diameter fibres are the most sensitive to block.", "type": "mcq", "opts": ["The acidic tissue ionizes the drug, so it cannot cross the nerve membrane", "The acidic tissue keeps the drug unionized, so it cannot block Na+ channels", "Tissue esterases in the abscess rapidly break down lidocaine", "The drug can block Na+ channels only from outside the nerve fibre", "Pain fibres resist the block because of their small diameter"], "ans": 0}, "N-PHA-L1-04": {"id": "N-PHA-L1-04", "stem": "A 58-year-old woman with chronic back pain has been taking regular acetaminophen, but her pain is now moderate to severe. According to the three-step analgesic ladder, which of the following is the most appropriate next step?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The ladder treats mild–moderate pain with a non-opioid (acetaminophen or an NSAID), moderate–severe pain with a mild opioid such as codeine with or without a non-opioid, and severe pain with a strong opioid such as morphine. Swapping to an NSAID stays on step 1, and morphine is kept for severe pain (step 3).", "type": "mcq", "opts": ["Add a mild opioid such as codeine", "Switch to a strong opioid such as morphine", "Replace acetaminophen with an NSAID", "Add a systemic corticosteroid"], "ans": 0}, "Q0806": {"id": "Q0806", "stem": "A 65-year-old man had been recently diagnosed with osteoarthritis. Six months ago, the patient suffered from peptic ulcer disease that healed after triple antiulcer therapy. Which of the following nonsteroidal anti-inflammatory drugs would be most appropriate for this patient?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA Q17", "bank": true, "expl": "Celecoxib selectively inhibits COX-2 and spares the gastric mucosa from the corrosive effect of COX-1 inhibition, so it carries a decreased risk of GI side effects (fewer ulcers and less bleeding). Ibuprofen, ketorolac, indomethacin and piroxicam also inhibit COX-1, so they carry a higher risk of peptic ulceration.", "type": "mcq", "opts": ["Piroxicam", "Indomethacin", "Ketorolac", "Celecoxib", "Ibuprofen"], "ans": 3}, "N-PHA-L1-05": {"id": "N-PHA-L1-05", "stem": "A patient with myofascial pain receives a local injection of a corticosteroid together with a local anaesthetic. Which of the following is a biochemical anti-inflammatory action of the corticosteroid?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Corticosteroids inhibit phospholipase A2 through lipocortin, reducing both prostaglandins and leukotrienes; they also lower COX-2 expression, platelet-activating factor and interleukins. Inhibiting COX-1 and COX-2 activity is how NSAIDs act, and Na+ channel block is how the local anaesthetic in the same injection works.", "type": "mcq", "opts": ["Inhibition of phospholipase A2 through lipocortin", "Irreversible acetylation of cyclooxygenase", "Reversible inhibition of COX-1 and COX-2 enzyme activity", "Blockade of voltage-dependent Na+ channels from inside the nerve fibre", "Blockade of acetylcholine release from motor nerve endings"], "ans": 0}, "N-PHA-L1-06": {"id": "N-PHA-L1-06", "stem": "A 60-year-old man with advanced liver cirrhosis needs a local anaesthetic for a minor procedure. The metabolism of which of the following local anaesthetics is most likely to be impaired?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Lidocaine is an amide (two 'i's), and amides are metabolized by liver amidases, so liver disease impairs its breakdown. Procaine, benzocaine and cocaine are esters, metabolized by plasma and tissue esterases.", "type": "mcq", "opts": ["Procaine", "Benzocaine", "Lidocaine", "Cocaine"], "ans": 2}, "N-PHA-L1-07": {"id": "N-PHA-L1-07", "stem": "Which of the following skeletal muscle relaxants acts directly on the muscle rather than at the neuromuscular junction?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Dantrolene is the direct skeletal muscle relaxant: it acts in the muscle by inhibiting Ca++ release from the sarcoplasmic reticulum. Atracurium, mivacurium and succinylcholine are neuromuscular blockers acting on the end-plate nicotinic receptor, and botulinum toxin blocks ACh release from the nerve ending.", "type": "mcq", "opts": ["Atracurium", "Succinylcholine", "Dantrolene", "Mivacurium", "Botulinum toxin"], "ans": 2}, "N-PHA-L1-08": {"id": "N-PHA-L1-08", "stem": "A hospital pharmacist is preparing a protocol for the neuromuscular blockers atracurium and succinylcholine. Which of the following is an indication for these drugs?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Neuromuscular blockers are used when a short period of skeletal muscle relaxation is needed: endotracheal intubation, orthopaedic manipulation, ECT and caesarean section (ICE-O). Malignant hyperthermia, neuroleptic malignant syndrome and spastic conditions are uses of dantrolene.", "type": "mcq", "opts": ["Electro-convulsive therapy", "Malignant hyperthermia", "Neuroleptic malignant syndrome", "Spastic muscle conditions", "Injection therapy for myofascial pain"], "ans": 0}, "N-PHA-L1-09": {"id": "N-PHA-L1-09", "stem": "A 40-year-old man with a spastic muscle condition is started on long-term oral dantrolene. Which of the following is a recognized side effect of this drug?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Dantrolene's side effects are the 3Ds: drowsiness, diarrhoea and liver damage. Allergic dermatitis belongs to the ester local anaesthetics, Reye syndrome to aspirin and aplastic anaemia to the NSAIDs.", "type": "mcq", "opts": ["Liver damage", "Allergic dermatitis", "Reye syndrome", "Aplastic anaemia", "Urinary retention"], "ans": 0}, "N-PHA-L1-10": {"id": "N-PHA-L1-10", "stem": "Which of the following correctly describes how a local anaesthetic such as lidocaine blocks nerve conduction?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The free unionized base crosses the neuronal membrane; inside the nerve it becomes ionized (the active form) and blocks voltage-dependent Na+ channels from inside, stabilizing the membrane. The unionized base is the form that crosses the membrane, not the form that blocks the channel.", "type": "mcq", "opts": ["The free unionized base blocks Na+ channels from outside the nerve fibre", "The ionized form, produced inside the nerve, blocks Na+ channels from inside", "The ionized form crosses the neuronal membrane and then blocks Ca2+ channels", "It opens K+ channels, causing hyperpolarization of the nerve fibre", "It blocks the release of acetylcholine from the nerve ending"], "ans": 1}, "N-PHA-L1-11": {"id": "N-PHA-L1-11", "stem": "A local anaesthetic is injected together with an α1 agonist. What is the purpose of this combination?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Co-administered α1 agonists decrease absorption of the local anaesthetic into the systemic circulation, which prolongs its effect and reduces toxicity. Acidity outside the nerve does the opposite of helping: the ionized base cannot enter the nerve and is inactive.", "type": "mcq", "opts": ["To reduce systemic absorption, prolonging the effect and reducing toxicity", "To acidify the tissue, increasing the active ionized form outside the nerve", "To speed up metabolism of the anaesthetic by liver amidases", "To increase spread of the anaesthetic into the systemic circulation", "To prevent allergic dermatitis caused by PABA"], "ans": 0}, "N-PHA-L1-12": {"id": "N-PHA-L1-12", "stem": "Morphine relieves pain by acting on μ opioid receptors. Which of the following describes the cellular mechanism of opioid analgesics?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Opiates facilitate the opening of K+ channels, causing hyperpolarization that inhibits Ca2+ channel opening and transmitter release; all opioid receptors (μ, δ, κ) act through G proteins and inhibition, not activation, of adenylate cyclase. Na+ channel block, COX inhibition and PLA2 inhibition are the mechanisms of local anaesthetics, NSAIDs and corticosteroids.", "type": "mcq", "opts": ["They facilitate K+ channel opening, causing hyperpolarization that inhibits Ca2+ channel opening and transmitter release", "They block voltage-dependent Na+ channels from inside the nerve fibre", "They inhibit cyclooxygenase, reducing prostaglandin synthesis", "They activate adenylate cyclase through G proteins, increasing transmitter release", "They inhibit phospholipase A2 through lipocortin"], "ans": 0}, "N-PHA-L1-13": {"id": "N-PHA-L1-13", "stem": "Eicosanoids such as prostaglandins, thromboxanes and leukotrienes are synthesized on demand from arachidonic acid. Which enzyme releases arachidonic acid from membrane phospholipids?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Eicosanoids are made mainly from arachidonic acid released from membrane lipids by phospholipase A2, the step corticosteroids inhibit through lipocortin. Cyclooxygenase acts next to form the endoperoxides, from which the two synthetases make TXA2 and PGI2.", "type": "mcq", "opts": ["Phospholipase A2", "Cyclooxygenase", "Thromboxane A2 synthetase", "Prostacyclin synthetase"], "ans": 0}, "N-PHA-L1-14": {"id": "N-PHA-L1-14", "stem": "A 19-year-old student takes a large overdose of paracetamol. Which organ toxicity is the main concern?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Significant hepatic necrosis can occur with high doses of acetaminophen. Peptic ulceration, renal damage, aplastic anaemia and bleeding are NSAID or aspirin side effects, and acetaminophen does not affect platelet function or bleeding time.", "type": "mcq", "opts": ["Hepatic necrosis", "Peptic ulceration", "Acute renal failure", "Aplastic anaemia", "Bleeding from platelet dysfunction"], "ans": 0}, "N-PHA-L1-15": {"id": "N-PHA-L1-15", "stem": "During surgery under general anaesthesia, a 25-year-old man suddenly develops generalized muscle rigidity and a rapidly rising body temperature; blood tests show lactic acidosis.\n(a) What is the most likely diagnosis, and what is its underlying mechanism?\n(b) Outline the treatment.\n(c) Give the mechanism of action, other uses and side effects of the drug of choice.", "top": false, "rep": "", "tag": "Final bank PHA W2", "bank": true, "expl": "All points come from Part 03: malignant hyperthermia and its D-C-A treatment in 3.1, and dantrolene's mechanism, uses and 3D side effects in 3.2.", "type": "written", "keyhtml": "(a) Malignant hyperthermia: an idiosyncrasy reaction due to sudden and prolonged ↑ release of Ca2+ from the sarcoplasmic reticulum → muscular rigidity, hyperthermia (oxidative metabolism) and lactic acidosis.\n(b) Treatment (D-C-A):\n• Dantrolene i.v. (drug of choice)\n• Cooling\n• Correction of acidosis\n(c) Dantrolene (direct skeletal muscle relaxant):\n• Mechanism: inhibits release of Ca++ from the sarcoplasmic reticulum\n• Other uses: spastic muscle conditions (oral and i.v.); neuroleptic malignant syndrome\n• Side effects (3D): drowsiness, diarrhoea, liver damage"}, "N-PHA-L1-16": {"id": "N-PHA-L1-16", "stem": "Compare competitive and depolarizing neuromuscular blockers (examples, mechanism and sequence of effect), and enumerate four uses of neuromuscular blockers.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Drawn from Part 02: the competitive vs depolarizing comparison in 2.2–2.4 and the uses in 2.5.", "type": "written", "keyhtml": "Competitive NMB:\n• Examples: atracurium, mivacurium\n• Mechanism: compete with ACh for nicotinic receptors in the motor end plate → paralysis\n• Sequence: relaxation starts in the face, then limbs, trunk, intercostals and lastly the diaphragm; recovery in reverse order\nDepolarizing NMB:\n• Example: succinylcholine\n• Mechanism: phase I (depolarization block): depolarization not followed by repolarization; phase II (desensitization block): the membrane repolarizes but the receptor is desensitized to ACh, similar to non-depolarizing block\n• Sequence: initial muscle twitches (transient fasciculations), then flaccid paralysis\nUses (a short period of skeletal muscle relaxation, ICE-O):\n• Endotracheal intubation\n• Orthopaedic manipulations, e.g. correction of joint dislocation\n• Electro-convulsive therapy (ECT)\n• Caesarean section"}, "TP-030": {"id": "TP-030", "stem": "A 50-year-old woman with moderately severe arthritis has been treated with nonsteroidal anti-inflammatory drugs for 3 months. She now complains of heartburn and indigestion. You give her a prescription for a drug to be taken along with the anti-inflammatory agent.\na) Which drug, often grouped with the NSAIDs, has analgesic and antipyretic actions but lacks an anti-inflammatory action?\nb) Among nonsteroidal anti-inflammatory drugs (NSAIDs), aspirin is unique. What is the main difference between aspirin and the other NSAIDs?", "top": true, "rep": "", "tag": "Final bank PHA W8", "bank": true, "expl": "Paracetamol weakly and reversibly inhibits COX with effects centred in the CNS, so it relieves pain and fever without reducing inflammation. Aspirin is the only NSAID that acetylates COX, so its inhibition is irreversible; the other NSAIDs inhibit COX-1 and COX-2 reversibly.", "type": "written", "keyhtml": "a) Paracetamol (acetaminophen):\n• Reversibly and weakly inhibits COX; it is inactivated peripherally and its effects are centred in the CNS\n• Analgesic and antipyretic, with no anti-inflammatory effect — so it is not considered a true NSAID\n• No effect on platelet function or bleeding time\nb) Aspirin acetylates and irreversibly inhibits cyclooxygenase (both COX-1 and COX-2), whereas the other NSAIDs (e.g. ibuprofen, naproxen, indomethacin, ketorolac) inhibit COX-1 and COX-2 reversibly."}, "TP-034": {"id": "TP-034", "stem": "Which of the following is the mechanism of the local anesthetic action of cocaine?", "top": true, "rep": "", "tag": "Final bank PHA Q49", "bank": true, "expl": "Cocaine is an ester local anaesthetic, and local anaesthetics block voltage-dependent Na+ channels from inside the nerve fibre; the block is greatest in fibres with high firing rates. Competitive antagonism at nicotinic receptors is how the competitive neuromuscular blockers (atracurium, mivacurium) act, and noradrenaline reuptake block is not a local anaesthetic mechanism.", "type": "mcq", "opts": ["Activation of G protein-linked membrane receptors", "Block of the reuptake of norepinephrine at sympathetic nerve endings", "Competitive pharmacologic antagonism of nicotinic receptors", "Inhibition of blood and tissue enzymes that hydrolyze acetylcholine", "Use-dependent blockade of voltage-gated sodium channels"], "ans": 4}, "TP-035": {"id": "TP-035", "stem": "Early in an anesthesia procedure, which includes the use of succinylcholine, a surgical patient develops severe muscle rigidity, hypertension, and hyperthermia. Which of the following is the most effective in the emergency management of malignant hyperthermia?", "top": true, "rep": "", "tag": "Final bank PHA Q50", "bank": true, "expl": "Malignant hyperthermia is an idiosyncrasy reaction with sudden, prolonged Ca2+ release from the sarcoplasmic reticulum, causing rigidity, hyperthermia and lactic acidosis. I.v. dantrolene, which inhibits Ca2+ release from the SR, is the drug of choice, with cooling and correction of acidosis; atracurium blocks nicotinic receptors at the end plate and botulinum toxin blocks ACh release, so neither acts at the SR.", "type": "mcq", "opts": ["Atracurium", "Botulinum toxin", "Dantrolene", "Baclofen", "Clonidine"], "ans": 2}, "TP-054": {"id": "TP-054", "stem": "Which of the following drugs inhibits thromboxane synthesis much more effectively than prostacyclin synthesis at a low dose?", "top": true, "rep": "", "tag": "Final bank PHA Q51", "bank": true, "expl": "Aspirin is the irreversible nonselective NSAID (it acetylates COX). It is cardioprotective at low doses and has antiplatelet activity, so it is the low-dose drug among these options. Platelet COX-1 makes thromboxane A2 (a vasoconstrictor that promotes platelet aggregation), while endothelial cells make prostacyclin (PGI2: a vasodilator that inhibits platelet aggregation), and cardiovascular risk follows the thromboxane/prostacyclin balance. That balance is why COX-2 inhibitors raise CV risk: they block endothelial PGI2 and leave platelet TXA2 unopposed. Ibuprofen and indomethacin reversibly inhibit COX-1 and COX-2, inhibiting production of prostaglandins and thromboxanes. Hydrocortisone acts earlier, on phospholipase A2 via lipocortin.", "type": "mcq", "opts": ["Aspirin", "Hydrocortisone", "Ibuprofen", "Indomethacin", "Zileuton"], "ans": 0}, "TP-121": {"id": "TP-121", "stem": "Why do cardiovascular events increase with the use of selective COX-2 NSAIDs?", "top": true, "rep": "", "tag": "Final bank PHA W9", "bank": true, "expl": "Selective COX-2 inhibitors block endothelial prostacyclin (PGI2: vasodilation, anti-aggregation), while platelet thromboxane A2 made by COX-1 (vasoconstriction, pro-aggregation) is left unopposed. This thromboxane/prostacyclin imbalance turns a dilated vessel wall with normal platelets into a constricted vessel with clumped platelets, so cardiovascular events increase.", "type": "written", "keyhtml": "Because there is an imbalance between prostacyclin and thromboxane A2."}}, "labs": {}, "cards": [{"id": "PHA-L1-001", "text": "Spasmolytics reduce excess {{c1::muscle tone or spasm}} in injury or CNS dysfunction, acting in the CNS, the spinal cord or {{c2::directly on the muscle}}", "extra": "", "sec": "Part 1 · 1.1 Classification of skeletal muscle relaxants"}, {"id": "PHA-L1-002", "text": "Skeletal muscle relaxant classes — direct SMR: {{c1::dantrolene}} · peripheral SMR: {{c2::neuromuscular blockers (competitive & depolarizing)}} · third class: {{c3::central}} SMR", "extra": "Dantrolene acts on the muscle itself, not at the NMJ.", "sec": "Part 1 · 1.1 Classification of skeletal muscle relaxants"}, {"id": "PHA-L1-003", "text": "Muscle spasm / strain → the {{c1::direct}} SMR (dantrolene) and the {{c2::central}} SMR — both circled on the slide", "extra": "", "sec": "Part 1 · 1.1 Classification of skeletal muscle relaxants"}, {"id": "PHA-L1-004", "text": "Baclofen acts as an {{c1::agonist at GABA (gamma-aminobutyric acid)}} receptors", "extra": "Official key (GD revision Q3); baclofen is not named in the handout. ↓ Ca²⁺ release from the SR is dantrolene.", "sec": "Part 1 · 1.1 Classification of skeletal muscle relaxants"}, {"id": "PHA-L1-005", "text": "Impulse arriving at the motor nerve ending → {{c1::Ca²⁺ influx}} and {{c2::acetylcholine release}}", "extra": "Skeletal muscles are supplied by somatic nerves.", "sec": "Part 1 · 1.2 The neuromuscular pathway"}, {"id": "PHA-L1-006", "text": "Released ACh diffuses across the synaptic cleft to the {{c1::nicotinic}} receptor on the {{c2::motor end plate}}", "extra": "", "sec": "Part 1 · 1.2 The neuromuscular pathway"}, {"id": "PHA-L1-007", "text": "Nicotinic receptor: a membrane {{c1::ion channel}} receptor of 4 peptides — {{c2::2 α, one β, one δ}}", "extra": "", "sec": "Part 1 · 1.3 The nicotinic receptor & contraction"}, {"id": "PHA-L1-008", "text": "ACh binds the {{c1::two α subunits}} of the nicotinic receptor → channel opens → {{c2::end plate depolarization}}", "extra": "Not the β or δ subunit.", "sec": "Part 1 · 1.3 The nicotinic receptor & contraction"}, {"id": "PHA-L1-009", "text": "Skeletal muscle contraction is induced by {{c1::Ca²⁺ release from the sarcoplasmic reticulum}}, initiating {{c2::excitation–contraction coupling}}", "extra": "", "sec": "Part 1 · 1.3 The nicotinic receptor & contraction"}, {"id": "PHA-L1-010", "text": "ACh is removed from the end plate by {{c1::diffusion}} and {{c2::acetylcholinesterase}}", "extra": "", "sec": "Part 1 · 1.3 The nicotinic receptor & contraction"}, {"id": "PHA-L1-011", "text": "Neuromuscular blockers act by blocking {{c1::postsynaptic ACh nicotinic receptors}} at the {{c2::motor end plate}}", "extra": "Botulinum toxin instead ↓ ACh release from the nerve ending.", "sec": "Part 1 · 2.1 Neuromuscular blockers"}, {"id": "PHA-L1-012", "text": "{{c1::Atracurium / mivacurium}} → {{c2::competitive}} neuromuscular blockers", "extra": "Exam trap: tubocurarine is crossed out on the slide — answer atracurium / mivacurium.", "sec": "Part 1 · 2.2 Competitive NMB"}, {"id": "PHA-L1-013", "text": "Competitive NMB — order of relaxation: face → {{c1::limbs}} → {{c2::trunk}} → {{c3::intercostals}} → {{c4::diaphragm}} (last)", "extra": "Face first, diaphragm last.", "sec": "Part 1 · 2.2 Competitive NMB"}, {"id": "PHA-L1-014", "text": "Competitive block wearing off — first muscle to recover: {{c1::diaphragm}}; last to recover: {{c2::face}}", "extra": "Recovery occurs in reverse order of relaxation.", "sec": "Part 1 · 2.2 Competitive NMB"}, {"id": "PHA-L1-015", "text": "{{c1::Tubocurarine}} given before surgery → hypotension, bronchospasm & excess bronchial / salivary secretions, due to {{c2::histamine}} release", "extra": "Official key (GD revision Q5). Handout: curare competes with ACh; histamine release not mentioned.", "sec": "Part 1 · 2.2 Competitive NMB"}, {"id": "PHA-L1-016", "text": "{{c1::Succinylcholine}} → the {{c2::depolarizing}} neuromuscular blocker", "extra": "", "sec": "Part 1 · 2.3 Depolarizing NMB — succinylcholine"}, {"id": "PHA-L1-017", "text": "Succinylcholine phase II ({{c1::desensitization}} block): the membrane {{c2::repolarizes}} but the receptor is desensitized to ACh — similar to {{c3::non-depolarizing}} block", "extra": "Phase I = depolarization block.", "sec": "Part 1 · 2.3 Depolarizing NMB — succinylcholine"}, {"id": "PHA-L1-018", "text": "Relaxant given before intubation causes muscle fasciculations before relaxation → {{c1::succinylcholine}}", "extra": "Atracurium only competes with ACh: relaxation starts in the face, no initial twitches.", "sec": "Part 1 · 2.3 Depolarizing NMB — succinylcholine"}, {"id": "PHA-L1-019", "text": "Action at the nicotinic receptor — competitive NMB: {{c1::competition with ACh}}; depolarizing NMB: {{c2::depolarization not followed by repolarization}} (phase I)", "extra": "", "sec": "Part 1 · 2.4 Competitive vs depolarizing NMB"}, {"id": "PHA-L1-020", "text": "Before paralysis — competitive NMB: relaxation starts in the {{c1::face}}; depolarizing NMB: {{c2::initial muscle twitches (transient fasciculations)}} → flaccid paralysis", "extra": "", "sec": "Part 1 · 2.4 Competitive vs depolarizing NMB"}, {"id": "PHA-L1-021", "text": "Later — competitive NMB: {{c1::recovery in reverse order}}; depolarizing NMB: {{c2::phase II desensitization block}}", "extra": "Phase II is similar to non-depolarizing block.", "sec": "Part 1 · 2.4 Competitive vs depolarizing NMB"}, {"id": "PHA-L1-022", "text": "Uses of NMBs (a short period of muscle relaxation): {{c1::endotracheal intubation}} · {{c2::orthopaedic manipulation (e.g. joint dislocation)}} · {{c3::electro-convulsive therapy}} · {{c4::caesarean section}}", "extra": "ICE-O.", "sec": "Part 1 · 2.5 Uses of neuromuscular blockers"}, {"id": "PHA-L1-023", "text": "Malignant hyperthermia: an {{c1::idiosyncrasy}} reaction — sudden & prolonged ↑ release of {{c2::Ca²⁺ from the sarcoplasmic reticulum}}", "extra": "", "sec": "Part 1 · 3.1 Malignant hyperthermia"}, {"id": "PHA-L1-024", "text": "Malignant hyperthermia features: {{c1::muscular rigidity}} · {{c2::hyperthermia}} · {{c3::lactic acidosis}}", "extra": "Hyperthermia comes from ↑ oxidative metabolism.", "sec": "Part 1 · 3.1 Malignant hyperthermia"}, {"id": "PHA-L1-025", "text": "Inhalant anaesthetic + i.v. succinylcholine, then within minutes tachycardia & rising core temperature → {{c1::malignant hyperthermia}}", "extra": "GD revision Q6 scenario; drug of choice: i.v. dantrolene.", "sec": "Part 1 · 3.1 Malignant hyperthermia"}, {"id": "PHA-L1-026", "text": "Treatment of malignant hyperthermia: {{c1::i.v. dantrolene (drug of choice)}} · {{c2::cooling}} · {{c3::correction of acidosis}}", "extra": "D-C-A.", "sec": "Part 1 · 3.1 Malignant hyperthermia"}, {"id": "PHA-L1-027", "text": "Malignant hyperthermia at the SR: ↑ mitochondrial {{c1::O₂ consumption}} · ↑ muscle filament {{c2::excitability}} · ↑ glycogen cleavage to {{c3::lactate}} → heat, rigidity & acidosis", "extra": "", "sec": "Part 1 · 3.1 Malignant hyperthermia"}, {"id": "PHA-L1-028", "text": "Dantrolene inhibits {{c1::Ca²⁺ release}} from the {{c2::sarcoplasmic reticulum}}", "extra": "Direct SMR — blocks the very step that runs wild in malignant hyperthermia.", "sec": "Part 1 · 3.2 Dantrolene"}, {"id": "PHA-L1-029", "text": "Dantrolene uses: {{c1::spastic muscle conditions}} (oral & i.v.) · {{c2::malignant hyperthermia}} (i.v., of choice) · {{c3::neuroleptic malignant syndrome}}", "extra": "", "sec": "Part 1 · 3.2 Dantrolene"}, {"id": "PHA-L1-030", "text": "Dantrolene side effects: {{c1::drowsiness}} · {{c2::diarrhoea}} · {{c3::liver damage}}", "extra": "3D — the slide's mnemonic.", "sec": "Part 1 · 3.2 Dantrolene"}, {"id": "PHA-L1-031", "text": "Injection (local) therapy in myofascial pain: {{c1::local anaesthetics}} · {{c2::botulinum toxin}} · {{c3::corticosteroids}}", "extra": "", "sec": "Part 1 · 4.1 Injection therapy in myofascial pain"}, {"id": "PHA-L1-032", "text": "Local anaesthetics: {{c1::reversible}} block of nerve conduction → transient localized loss of sensation {{c2::without significantly affecting consciousness}}", "extra": "", "sec": "Part 1 · 4.2 Local anaesthetics — definition"}, {"id": "PHA-L1-033", "text": "Local anaesthetic uses: {{c1::regional anaesthesia}} · {{c2::injection therapy in myofascial pain}}", "extra": "", "sec": "Part 1 · 4.2 Local anaesthetics — definition"}, {"id": "PHA-L1-034", "text": "Ester local anaesthetics: {{c1::cocaine}} · {{c2::procaine}} · {{c3::benzocaine}}", "extra": "Esters have only the 'i' of '-caine'.", "sec": "Part 1 · 4.3 LA classification — esters vs amides"}, {"id": "PHA-L1-035", "text": "Amide local anaesthetics: {{c1::lidocaine}} · {{c2::prilocaine}} · {{c3::dibucaine}} · {{c4::mepivacaine}}", "extra": "Am-i-des: two 'i's — one before '-caine', one inside it.", "sec": "Part 1 · 4.3 LA classification — esters vs amides"}, {"id": "PHA-L1-036", "text": "LA metabolism — esters: {{c1::plasma & tissue esterases}}; amides: {{c2::liver amidases}}", "extra": "So liver cirrhosis impairs amides (e.g. lidocaine).", "sec": "Part 1 · 4.3 LA classification — esters vs amides"}, {"id": "PHA-L1-037", "text": "{{c1::Cocaine}}: the only local anaesthetic that causes {{c2::vasoconstriction (may ↑ blood pressure)}}", "extra": "Official key (GD revision Q1). Handout: LA CVS effects are bradycardia & hypotension.", "sec": "Part 1 · 4.3 LA classification — esters vs amides"}, {"id": "PHA-L1-038", "text": "Allergy to procaine (Novocain, an ester) → use an {{c1::amide}} local anaesthetic, e.g. {{c2::ropivacaine}}", "extra": "Official key (GD revision Q7). Ester allergy comes via PABA; ropivacaine has an 'i' before '-caine'.", "sec": "Part 1 · 4.3 LA classification — esters vs amides"}, {"id": "PHA-L1-039", "text": "Local anaesthetics block {{c1::voltage-dependent Na⁺ channels}} from {{c2::inside}} the nerve fibre", "extra": "", "sec": "Part 1 · 4.4 LA mechanism of action"}, {"id": "PHA-L1-040", "text": "LA entry: the free {{c1::unionized base}} crosses the neuronal membrane → inside it becomes {{c2::ionized}} (the active form) → blocks Na⁺ channels", "extra": "Unionized enters; ionized acts.", "sec": "Part 1 · 4.4 LA mechanism of action"}, {"id": "PHA-L1-041", "text": "LA Na⁺ channel block → {{c1::membrane stabilization}} → ↓ impulse {{c2::generation and propagation}}", "extra": "", "sec": "Part 1 · 4.4 LA mechanism of action"}, {"id": "PHA-L1-042", "text": "Nerve fibres most sensitive to LA block: {{c1::smaller diameter}} with {{c2::high firing rates}}; recovery is in {{c3::reverse order}}", "extra": "", "sec": "Part 1 · 4.4 LA mechanism of action"}, {"id": "PHA-L1-043", "text": "LA & pH — extracellular acidity (inflammation, abscess): LA {{c1::inactive}}; intracellular acidity (from CO₂): LA {{c2::more active}}", "extra": "Acid outside ionizes the base before it can enter; acid inside makes more of the active ionized form.", "sec": "Part 1 · 4.5 LA absorption — effect of pH"}, {"id": "PHA-L1-044", "text": "Lidocaine fails in a tooth abscess: the acidic tissue {{c1::ionizes the base}}, so it is not lipid soluble and {{c2::cannot cross into the nerve}}", "extra": "", "sec": "Part 1 · 4.5 LA absorption — effect of pH"}, {"id": "PHA-L1-045", "text": "α₁ agonist added to a local anaesthetic → ↓ {{c1::systemic absorption}} → {{c2::prolonged effect}} and {{c3::↓ toxicity}}", "extra": "", "sec": "Part 1 · 4.5 LA absorption — effect of pH"}, {"id": "PHA-L1-046", "text": "LA side effects — CNS: {{c1::stimulation (convulsions), neurotoxicity}}; CVS: {{c2::bradycardia & hypotension (cardiotoxicity)}}", "extra": "Cocaine is the exception: vasoconstriction, may ↑ BP (official key).", "sec": "Part 1 · 4.6 Side effects of local anaesthetics"}, {"id": "PHA-L1-047", "text": "LA hypersensitivity: {{c1::allergic dermatitis}}, caused by {{c2::esters}} via {{c3::PABA}} formation", "extra": "PABA allergy = esters.", "sec": "Part 1 · 4.6 Side effects of local anaesthetics"}, {"id": "PHA-L1-048", "text": "Spinal anaesthesia side effects: {{c1::hypotension with bradycardia}} · {{c2::headache}} · {{c3::respiratory paralysis}} · {{c4::septic meningitis}} · {{c5::urinary retention}}", "extra": "Headache from CSF leakage; urinary retention from sacral parasympathetic block.", "sec": "Part 1 · 4.7 Side effects of spinal anaesthesia"}, {"id": "PHA-L1-049", "text": "{{c1::Botulinum toxin}} → a {{c2::peripheral}} skeletal muscle relaxant", "extra": "", "sec": "Part 1 · 5.1 Botulinum toxin"}, {"id": "PHA-L1-050", "text": "Botulinum toxin {{c1::blocks the release of ACh}} from the ACh-containing vesicles of the {{c2::motor nerve ending}}", "extra": "NMBs act after it — on the postsynaptic receptor.", "sec": "Part 1 · 5.1 Botulinum toxin"}, {"id": "PHA-L1-051", "text": "Botulinum toxin uses: {{c1::spasticity conditions}} + {{c2::pain management}}", "extra": "Marked important on the slide.", "sec": "Part 1 · 5.1 Botulinum toxin"}, {"id": "PHA-L1-052", "text": "Cerebral palsy spasticity — the drug that acts on cholinergic nerve endings: {{c1::botulinum toxin}}", "extra": "Dantrolene also treats spasticity but acts on the SR.", "sec": "Part 1 · 5.1 Botulinum toxin"}, {"id": "PHA-L1-053", "text": "Site of action — ACh vesicles of the motor nerve ending: {{c1::botulinum toxin}} · postsynaptic nicotinic receptor: {{c2::NMBs (atracurium, mivacurium, succinylcholine)}} · sarcoplasmic reticulum: {{c3::dantrolene}} · Na⁺ channel inside the nerve: {{c4::local anaesthetics}}", "extra": "", "sec": "Part 1 · 6.1 Site of action → drug"}, {"id": "PHA-L1-054", "text": "Analgesic classes: I {{c1::opioid (narcotic)}} · II {{c2::non-opioid analgesics & NSAIDs}} · III {{c3::mixed mechanism (opioid + non-opioid)}}", "extra": "Muscle / back pain → class II (arrow on the slide).", "sec": "Part 2 · 1.1 Classification of analgesics"}, {"id": "PHA-L1-055", "text": "{{c1::Tramadol}} → analgesic with a {{c2::mixed (opioid + non-opioid)}} mechanism", "extra": "", "sec": "Part 2 · 1.1 Classification of analgesics"}, {"id": "PHA-L1-056", "text": "Opioid receptor agonists: {{c1::morphine}} · {{c2::fentanyl}} · {{c3::codeine}} (also promedol, omnopon)", "extra": "", "sec": "Part 2 · 1.1 Classification of analgesics"}, {"id": "PHA-L1-057", "text": "Opioid agonist–antagonists & partial agonists: {{c1::pentazocine}} · {{c2::buprenorphine}}", "extra": "", "sec": "Part 2 · 1.1 Classification of analgesics"}, {"id": "PHA-L1-058", "text": "Opioid mechanism: facilitate {{c1::K⁺ channel opening}} → {{c2::hyperpolarization}} → inhibits {{c3::Ca²⁺ channel opening}} & transmitter release", "extra": "", "sec": "Part 2 · 1.2 Opioids"}, {"id": "PHA-L1-059", "text": "Opioid receptors & ligands: μ → {{c1::morphine}} · δ → {{c2::enkephalin}} · κ → {{c3::dynorphin}}", "extra": "", "sec": "Part 2 · 1.2 Opioids"}, {"id": "PHA-L1-060", "text": "All opioid receptors act through {{c1::G proteins}} and {{c2::inhibition of adenylate cyclase}}", "extra": "", "sec": "Part 2 · 1.2 Opioids"}, {"id": "PHA-L1-061", "text": "Analgesic ladder — step 1, mild–moderate pain: {{c1::non-opioid (acetaminophen or NSAID)}} · step 2, moderate–severe: {{c2::mild opioid (codeine) ± non-opioid}} · step 3, severe: {{c3::strong opioid (morphine) ± non-opioid}}", "extra": "", "sec": "Part 2 · 1.3 The three-step analgesic ladder"}, {"id": "PHA-L1-062", "text": "{{c1::Codeine}} = mild opioid (ladder step 2); {{c2::morphine}} = strong opioid (ladder step 3)", "extra": "", "sec": "Part 2 · 1.3 The three-step analgesic ladder"}, {"id": "PHA-L1-063", "text": "Opioid side effects: {{c1::sedation}} · {{c2::respiratory depression}} · {{c3::constipation}} · {{c4::nausea}} · {{c5::miosis (pinpoint pupils)}}", "extra": "MORPHINE: Myosis, Out of it, Respiratory depression, Pneumonia, Hypotension, Infrequency, Nausea, Emesis.", "sec": "Part 2 · 1.4 Opioid side effects"}, {"id": "PHA-L1-064", "text": "Opioids + other CNS-depressant drugs → {{c1::additive CNS depression}}", "extra": "", "sec": "Part 2 · 1.4 Opioid side effects"}, {"id": "PHA-L1-065", "text": "Morphine side effects also include: {{c1::aspiration pneumonia}} · {{c2::hypotension}} · {{c3::urinary retention}}", "extra": "The P, H and I of MORPHINE (I = infrequency: constipation, urinary retention).", "sec": "Part 2 · 1.4 Opioid side effects"}, {"id": "PHA-L1-066", "text": "Signs of opioid addiction: {{c1::euphoria}} · ↓ pain perception · {{c2::miosis}} · drowsiness, confusion, nausea · constipation · {{c3::head nodding}} · {{c4::hypothermia (< 35 °C)}} · {{c5::bradycardia (< 60/min) & low BP}} · {{c6::slurred speech}}", "extra": "", "sec": "Part 2 · 1.4 Opioid side effects"}, {"id": "PHA-L1-067", "text": "Eicosanoids are made mainly from {{c1::arachidonic acid}}, released from membrane lipids by {{c2::phospholipase A2}}", "extra": "", "sec": "Part 2 · 2.1 Eicosanoids"}, {"id": "PHA-L1-068", "text": "Eicosanoids: low resting levels — synthesized and released {{c1::on demand}} (IgE-mediated reactions, inflammatory mediators, trauma, heat, toxins)", "extra": "", "sec": "Part 2 · 2.1 Eicosanoids"}, {"id": "PHA-L1-069", "text": "Eicosanoid receptors are {{c1::G-protein–coupled}}, linked to second-messenger effector systems", "extra": "", "sec": "Part 2 · 2.1 Eicosanoids"}, {"id": "PHA-L1-070", "text": "Eicosanoids include: {{c1::leukotrienes}} · {{c2::prostaglandins}} · {{c3::thromboxanes}}", "extra": "", "sec": "Part 2 · 2.1 Eicosanoids"}, {"id": "PHA-L1-071", "text": "Autacoids act like {{c1::local hormones}} — {{c2::brief}} duration, acting {{c3::near their site of synthesis}}", "extra": "", "sec": "Part 2 · 2.1 Eicosanoids"}, {"id": "PHA-L1-072", "text": "Steroids (SAIDs, cortisol) act on {{c1::phospholipase A2}} via {{c2::lipocortin}}; NSAIDs act on {{c3::cyclooxygenase}}", "extra": "", "sec": "Part 2 · 2.2 Where SAIDs and NSAIDs act"}, {"id": "PHA-L1-073", "text": "Endoperoxides (made by COX) → {{c1::TXA₂}} via thromboxane A2 synthetase and {{c2::PGI₂}} via prostacyclin synthetase", "extra": "", "sec": "Part 2 · 2.2 Where SAIDs and NSAIDs act"}, {"id": "PHA-L1-074", "text": "Ibuprofen blocks synthesis of {{c1::prostacyclin and thromboxanes}}; leukotrienes fall only with {{c2::corticosteroids}} (PLA2 step)", "extra": "Quiz 1 Q4.", "sec": "Part 2 · 2.2 Where SAIDs and NSAIDs act"}, {"id": "PHA-L1-075", "text": "NSAID therapeutic effects (blocking PGs): analgesic in {{c1::superficial}} pains · anti-pyretic ({{c2::non-specific}}) · {{c3::anti-inflammatory}}", "extra": "Effects 1–3, circled on the slide.", "sec": "Part 2 · 2.3 Effects of PGs → effects of NSAIDs"}, {"id": "PHA-L1-076", "text": "Stomach — PGs: {{c1::protect the gastric & duodenal mucosa against HCl & pepsin}}; NSAIDs: {{c2::peptic ulceration}}", "extra": "", "sec": "Part 2 · 2.3 Effects of PGs → effects of NSAIDs"}, {"id": "PHA-L1-077", "text": "Kidney — PGs: {{c1::↑ renal blood flow}}; NSAIDs: {{c2::↓ RBF → Na⁺ & water retention}} (even nephropathy)", "extra": "", "sec": "Part 2 · 2.3 Effects of PGs → effects of NSAIDs"}, {"id": "PHA-L1-078", "text": "Uterus — PGs: {{c1::uterine stimulation (oxytocic)}}; NSAIDs: {{c2::uterine relaxants (tocolytics)}}", "extra": "", "sec": "Part 2 · 2.3 Effects of PGs → effects of NSAIDs"}, {"id": "PHA-L1-079", "text": "Ductus arteriosus — PGs: {{c1::maintain its patency}}; NSAIDs: {{c2::close a patent ductus arteriosus}}", "extra": "", "sec": "Part 2 · 2.3 Effects of PGs → effects of NSAIDs"}, {"id": "PHA-L1-080", "text": "Prostaglandins at the stomach {{c1::decrease::increase or decrease}} gastric acid secretion", "extra": "Official key (GD revision Q11). Handout: PGs protect the mucosa against HCl & pepsin.", "sec": "Part 2 · 2.3 Effects of PGs → effects of NSAIDs"}, {"id": "PHA-L1-081", "text": "COX-1 is {{c1::constitutive}} · COX-2 is {{c2::inducible}} · COX-3 is found {{c3::only in the CNS}}", "extra": "COX-1 sites: stomach, kidney, platelets, respiratory tract.", "sec": "Part 2 · 3.1 The three COX enzymes"}, {"id": "PHA-L1-082", "text": "Gastric COX-1 → {{c1::PGE₂ & PGI₂}}, which are {{c2::cytoprotective}}", "extra": "", "sec": "Part 2 · 3.1 The three COX enzymes"}, {"id": "PHA-L1-083", "text": "Renal COX-1 → {{c1::vasodilator}} PGs (e.g. PGE), acting at the {{c2::afferent arteriole}}", "extra": "", "sec": "Part 2 · 3.1 The three COX enzymes"}, {"id": "PHA-L1-084", "text": "COX-2 (inducible, CNS & peripheral tissues) → PGs causing {{c1::pain, fever & inflammation}}; COX-3 (CNS only) → PGs causing {{c2::pain & fever}}", "extra": "", "sec": "Part 2 · 3.1 The three COX enzymes"}, {"id": "PHA-L1-085", "text": "{{c3::COX-2 selective}} NSAIDs: {{c1::celecoxib}} · {{c2::rofecoxib}}", "extra": "", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-086", "text": "Semiselective NSAIDs: {{c1::etodolac}} · {{c2::indomethacin}} · {{c3::piroxicam}} · {{c4::nabumetone}} · {{c5::sulindac}}", "extra": "Diclofenac: semiselective in the table but non-selective in the COX figure.", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-087", "text": "Semiselective NSAIDs: ↑ affinity for {{c1::COX-2}} but still retain {{c2::COX-1}} activity → use with caution in patients at ↑ {{c3::CV risk}}", "extra": "", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-088", "text": "{{c1::Ibuprofen, naproxen}} → {{c2::nonselective}} NSAIDs", "extra": "", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-089", "text": "{{c1::Aspirin}} → the {{c2::irreversible nonselective}} NSAID", "extra": "", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-090", "text": "Celecoxib: CV events {{c1::↑::↑/↓}} · GI side effects {{c2::↓::↑/↓}} — ibuprofen / naproxen: CV events {{c3::↓::↑/↓}} · GI side effects {{c4::↑::↑/↓}}", "extra": "", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-091", "text": "Aspirin: {{c1::cardioprotective}} at low doses; GI side-effect risk {{c2::↑::↑/↓}}", "extra": "", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-092", "text": "Osteoarthritis + myocardial infarction 6 months ago → the analgesic to avoid: {{c1::celecoxib}}", "extra": "Official key (quiz 1 Q2): 'contraindicated' — COX-2 selective → ↑ CV events.", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-093", "text": "Osteoarthritis + healed peptic ulcer → the most appropriate NSAID: {{c1::celecoxib}}", "extra": "Spares the gastric mucosa from COX-1 inhibition.", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-094", "text": "Back pain not relieved by acetaminophen; coronary artery disease + past gastric ulcer → {{c1::naproxen}} + {{c2::omeprazole}}", "extra": "Official key (GD revision Q8). Naproxen: ↓ CV but ↑ GI risk, so add a PPI (not in the handout).", "sec": "Part 2 · 3.2 NSAIDs by COX selectivity"}, {"id": "PHA-L1-095", "text": "Aspirin {{c1::acetylates}} cyclooxygenase (COX-1 & COX-2) → blocks conversion of {{c2::arachidonic acid}} to prostaglandins", "extra": "", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-096", "text": "COX inhibition — aspirin: {{c1::irreversible}}; ibuprofen, naproxen, indomethacin, ketorolac: {{c2::reversible}}", "extra": "Only aspirin is irreversible (acetylation).", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-097", "text": "Aspirin & NSAIDs: ↑ {{c1::bleeding time}}, but {{c2::no effect on PT or PTT}}", "extra": "", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-098", "text": "Aspirin uses: {{c1::antipyretic, analgesic & anti-inflammatory}} · {{c2::antiplatelet}} · {{c3::osteoarthritis & inflammatory arthritis}}", "extra": "", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-099", "text": "Aspirin action manifested at the lowest dose: {{c1::antiplatelet aggregatory}}", "extra": "Formative 2 Q11; cardioprotective at low doses.", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-100", "text": "Low-dose aspirin cardioprotection: preferentially inhibits {{c1::COX-1}} → relative ↓ {{c2::thromboxane A2}}", "extra": "Official key (GD revision Q10). Handout: aspirin is nonselective; platelet COX-1 makes TXA₂.", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-101", "text": "Aspirin side effects: {{c1::gastric ulceration}} · {{c2::bleeding}} · {{c3::hyperventilation}} · {{c4::tinnitus}} · {{c5::Reye syndrome}}", "extra": "", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-102", "text": "NSAIDs that are not COX-2 selective cause side effects at the {{c1::kidney}}, {{c2::platelets}} (prevent coagulation) and {{c3::stomach}}", "extra": "", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-103", "text": "Give acetaminophen instead of NSAIDs in: {{c1::coagulopathy / bleeding disorders}} · {{c2::history of peptic ulcer}} · {{c3::bronchial asthma}}", "extra": "Asthma from the official key (GD revision Q17); COX-1/COX-2 inhibitors can cause aspirin-like asthma.", "sec": "Part 2 · 4.1 Aspirin"}, {"id": "PHA-L1-104", "text": "{{c1::Indomethacin}} is the NSAID used to {{c2::close a patent ductus arteriosus}}", "extra": "Quiz 1 Q3: premature baby given i.v. indomethacin.", "sec": "Part 2 · 4.2 NSAIDs"}, {"id": "PHA-L1-105", "text": "NSAID side effects: {{c1::renal damage}} · {{c2::aplastic anaemia}} · {{c3::GI distress & ulcers}} · {{c4::fluid retention}} · {{c5::hypertension}}", "extra": "", "sec": "Part 2 · 4.2 NSAIDs"}, {"id": "PHA-L1-106", "text": "NSAID upper GI adverse effects: {{c1::dyspepsia}} · {{c2::erosions}} · {{c3::anaemia from GI bleeding}} · {{c4::ulcers → bleeds / perforations}}", "extra": "Their anti-platelet effect adds to the blood loss.", "sec": "Part 2 · 4.2 NSAIDs"}, {"id": "PHA-L1-107", "text": "NSAID renal adverse effects: {{c1::renal dysfunction}} · {{c2::renal failure (acute / chronic)}} · {{c3::↑ blood pressure}} · {{c4::heart failure}}", "extra": "", "sec": "Part 2 · 4.2 NSAIDs"}, {"id": "PHA-L1-108", "text": "Celecoxib selectively inhibits COX-2 in {{c1::inflammatory cells}}, sparing the {{c2::gastric mucosa}} from COX-1 inhibition", "extra": "", "sec": "Part 2 · 4.3 COX-2 inhibitors (celecoxib)"}, {"id": "PHA-L1-109", "text": "Celecoxib uses: {{c1::anti-inflammatory}} and {{c2::analgesic}}", "extra": "", "sec": "Part 2 · 4.3 COX-2 inhibitors (celecoxib)"}, {"id": "PHA-L1-110", "text": "Celecoxib side effects: like other NSAIDs but {{c1::less GI mucosal toxicity}} (fewer ulcers & bleeds), plus a small ↑ risk of {{c2::cardiovascular events}}", "extra": "", "sec": "Part 2 · 4.3 COX-2 inhibitors (celecoxib)"}, {"id": "PHA-L1-111", "text": "Selective COX-2 inhibitor advantages: {{c1::potent anti-inflammatory}} · antipyretic & analgesic · {{c2::lower incidence of gastric upset}} · {{c3::no effect on platelet aggregation}}", "extra": "", "sec": "Part 2 · 4.3 COX-2 inhibitors (celecoxib)"}, {"id": "PHA-L1-112", "text": "Celecoxib's advantage over most NSAIDs (the rationale for COX-2 inhibitors): {{c1::less inhibition of PGE₂ effects on the gastric mucosa}} → fewer ulcers & less bleeding", "extra": "Formative 2 Q16 / Formative 3 Q15.", "sec": "Part 2 · 4.3 COX-2 inhibitors (celecoxib)"}, {"id": "PHA-L1-113", "text": "COX-1/COX-2 vs COX-2 inhibitors — analgesic: {{c1::+ vs ++}} · anti-inflammatory: {{c2::+ vs ++}} · antipyretic: {{c3::+ vs +}}", "extra": "Nice to know; analgesic & anti-inflammatory rows arrowed on the slide.", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-114", "text": "COX-1/COX-2 vs COX-2 inhibitors — antiplatelet: {{c1::+ vs −}} · gastric mucosal damage: {{c2::+++ vs +}}", "extra": "Nice to know.", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-115", "text": "COX-1/COX-2 vs COX-2 inhibitors — cardiotoxicity: {{c1::− vs ++}} · infertility: {{c2::− vs ++}}", "extra": "Nice to know; cardiotoxicity row arrowed on the slide.", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-116", "text": "COX-1/COX-2 vs COX-2 inhibitors — renal salt/water retention: {{c1::+ vs +}} · delay of labour: {{c2::++ vs +}} · ductus closure: {{c3::+ vs ?}} · aspirin-like asthma: {{c4::+ vs ?}}", "extra": "Nice to know.", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-117", "text": "Platelet COX-1 → {{c1::TXA₂}}: vasoconstriction, pro-aggregation · endothelial COX-2 → {{c2::PGI₂}}: vasodilation, anti-aggregation", "extra": "", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-118", "text": "Why selective COX-2 inhibitors ↑ CV risk: they block endothelial {{c1::PGI₂}} while platelet {{c2::TXA₂}} (COX-1) is left unopposed", "extra": "Thromboxane / prostacyclin imbalance → constricted vessel, clumped platelets.", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-119", "text": "Rofecoxib doubled the incidence of {{c1::heart attack & stroke}}", "extra": "Endothelial PGI₂ falls; platelet TXA₂ is untouched.", "sec": "Part 2 · 4.4 COX-1/COX-2 vs COX-2 inhibitors & CV risk"}, {"id": "PHA-L1-120", "text": "NSAID side effects (SAIDS): {{c1::swelling}} · {{c2::allergy}} · {{c3::impaired renal function}} · {{c4::damage to the stomach wall (ulcer)}} · {{c5::stroke & heart attack}} (COX-2 inhibitors)", "extra": "S-A-I-D-S — the slide's mnemonic.", "sec": "Part 2 · 4.5 Remember NSAIDs — SAIDS"}, {"id": "PHA-L1-121", "text": "NSAID uses (SAIDS): {{c1::strains}} · {{c2::arthritis}} · {{c3::inflammation}} · {{c4::DVT development}} · {{c5::sprains}}", "extra": "S-A-I-D-S — the slide's mnemonic.", "sec": "Part 2 · 4.5 Remember NSAIDs — SAIDS"}, {"id": "PHA-L1-122", "text": "When prescribing NSAIDs: the {{c1::lowest effective dose}} for the {{c2::shortest period of time}}", "extra": "", "sec": "Part 2 · 4.6 When prescribing NSAIDs"}, {"id": "PHA-L1-123", "text": "NSAIDs & coxibs ↓ renal {{c1::PGE₂}} → sodium retention: peripheral oedema, {{c2::↑ blood pressure}}, ↑ weight, CHF (rarely)", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-124", "text": "NSAIDs ↓ renal {{c1::PGI₂}} → {{c2::hyperkalaemia}} & {{c3::acute renal failure}}", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-125", "text": "Other NSAID renal effects: {{c1::nephrotic syndrome}} · {{c2::interstitial nephritis}}", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-126", "text": "BP rises on hydrochlorothiazide + losartan after adding rofecoxib → {{c1::COX-2 inhibition}} → {{c2::↓ renal blood flow}}", "extra": "Formative 3 Q2; coxibs ↓ PGE₂ → Na⁺ & water retention.", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-127", "text": "Ibuprofen in a CHF patient on a thiazide → acute renal failure from ↓ {{c1::PGI₂}} in the {{c2::afferent}} arterioles of the kidney", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-128", "text": "NSAIDs ⊣ gastric COX-1 → ↓ PGE₂ → ↓ {{c1::mucus}} · ↓ {{c2::bicarbonate}} · ↓ {{c3::mucosal blood flow}} → ulceration", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-129", "text": "NSAID gastric damage is mainly {{c1::systemic (post-absorptive)}}; topical irritation plays a {{c2::minor}} role", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-130", "text": "Ibuprofen-induced gastric ulcers: increased gastric secretion of {{c1::hydrochloric acid}} contributes", "extra": "Official key (quiz 1 Q5). Handout: ↓ PGE₂ → ↓ mucus, ↓ bicarbonate → ulcer with H⁺.", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-131", "text": "Platelet TXA₂ is blocked by {{c1::nonspecific NSAIDs / aspirin}}; endothelial PGI₂ is blocked by those {{c2::and by coxibs}}", "extra": "", "sec": "Part 2 · 4.7 NSAIDs — kidney, stomach, platelets & endothelium"}, {"id": "PHA-L1-132", "text": "Acetaminophen: {{c1::reversibly & weakly}} inhibits COX, is {{c2::peripherally inactivated}}; its effects are centred in the {{c3::CNS}}", "extra": "", "sec": "Part 2 · 4.8 Paracetamol (acetaminophen)"}, {"id": "PHA-L1-133", "text": "Acetaminophen uses: {{c1::antipyretic}} & {{c2::analgesic}} — {{c3::no}} effect on inflammation", "extra": "", "sec": "Part 2 · 4.8 Paracetamol (acetaminophen)"}, {"id": "PHA-L1-134", "text": "High-dose acetaminophen → {{c1::hepatic necrosis}}", "extra": "", "sec": "Part 2 · 4.8 Paracetamol (acetaminophen)"}, {"id": "PHA-L1-135", "text": "Acetaminophen {{c1::does not affect::affects or does not affect}} platelet function or bleeding time", "extra": "", "sec": "Part 2 · 4.8 Paracetamol (acetaminophen)"}, {"id": "PHA-L1-136", "text": "Acetaminophen is not a true NSAID: {{c1::potent}} antipyre
