<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand .bdg{width:28px;height:28px;align-self:center;flex:none}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover.cimg{background-size:cover;background-position:center;background-color:var(--leather);padding:0;justify-content:flex-end;overflow:hidden}
.cband{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px 20px;background:linear-gradient(rgba(5,14,38,0),rgba(5,14,38,.93) 46%);color:#fff;font:600 14px/1.38 var(--f-head);text-align:left}
.cband small{display:block;margin-bottom:3px;font:700 10px var(--f-head);letter-spacing:.16em;color:#9cc2ff;text-transform:uppercase}
.credit{display:flex;align-items:center;gap:8px;font:500 12.5px var(--f-head);color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.credit img{width:26px;height:26px}.credit b{font-weight:700;color:#fff}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}

.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}
.btn{font:600 .74em var(--f-head);padding:.5em .95em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--band);color:var(--band-ink);border-color:transparent}
.btn.lift{background:var(--sticky);color:var(--sticky-ink);border-color:transparent;font-family:var(--f-hand);font-size:1.05em;font-weight:700}
.flapc{margin-top:.5em;border-radius:.45em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 6px,var(--cover-2) 6px 12px);padding:.9em;text-align:center}
.ans{margin-top:.5em;padding:.6em .75em;border-left:.25em solid var(--ok);background:var(--ok-bg);border-radius:.3em;font-size:.92em;white-space:pre-line;line-height:1.45}
textarea.dr{width:100%;box-sizing:border-box;min-height:4.2em;margin-top:.4em;border:1px dashed var(--line);border-radius:.45em;background:var(--paper);color:var(--ink);font:inherit;font-size:.9em;padding:.5em;resize:vertical}

/* labs */
.labh{display:flex;align-items:center;gap:.55em;margin:0 0 .5em}
.labh .lb{flex:none;background:var(--red);color:#fff;font:700 .6em var(--f-head);letter-spacing:.16em;padding:.3em .65em;border-radius:.3em}
.labh h3{margin:0;font:700 1.08em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.labi{font-size:.88em;color:var(--ink-2);margin:.2em 0 .6em}
.modes{display:flex;flex-wrap:wrap;gap:.35em;margin:.3em 0 .6em}
.svgw{background:var(--paper-2);border:1px solid var(--line);border-radius:.6em;padding:.4em;margin:.3em 0}
.svgw svg{display:block;width:100%;height:auto;max-height:calc(var(--ph) * .44)}
.rg{cursor:pointer;stroke:var(--paper);stroke-width:2.5;transition:filter .15s, opacity .15s}
.rg:hover{filter:brightness(1.07)}
.rg.dim{opacity:.35}
.svgtxt{font:700 11px var(--f-head);fill:var(--ink);pointer-events:none;letter-spacing:.06em}
.svgsm{font:600 8.5px var(--f-head);fill:var(--muted);pointer-events:none;letter-spacing:.08em}
.pinbtn{cursor:pointer}
.pinbtn circle.d{fill:var(--card);stroke:var(--navy);stroke-width:1.6}
.pinbtn.on circle.d{fill:var(--sticky);stroke:var(--red)}
.pinbtn.ok circle.d{fill:var(--ok)}
.pinbtn.bad circle.d{fill:var(--bad)}
.pinbtn text{font:700 8px var(--f-head);fill:var(--navy-ink);pointer-events:none}
.plab{font:700 8.6px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;pointer-events:none}
.key{columns:2;column-gap:1.2em;margin:.3em 0 .4em;padding-left:1.6em;font-size:.8em;line-height:1.45}.key li{break-inside:avoid}
.info{background:var(--card);border:1px solid var(--line);border-radius:.55em;padding:.55em .7em;font-size:.88em;margin:.4em 0;min-height:2.6em}
.info h4{margin:0 0 .2em;font:700 .95em var(--f-head);color:var(--navy-ink)}
.fb{font:700 .8em var(--f-head);margin:.3em 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:.35em;margin:.4em 0 .7em;min-height:1.8em}
.chip{font:700 .74em var(--f-body);padding:.36em .62em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.2;text-align:left}
.chip.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.chip.hl{background:var(--band);color:var(--band-ink);border-color:transparent}
.chip.dim{opacity:.35}
.chip.cut{background:var(--bad);color:#fff;border-color:transparent}
.chip.lost{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chip.weak{background:#fff4d6;border-color:#e0a422;color:#8a5a00}
:root[data-theme="dark"] .chip.weak{background:#433513;color:#f3cf74}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.weak{background:#433513;color:#f3cf74} }
.chip.unk{border-style:dashed}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.4em,1fr));gap:.45em}
.bin{border:1.5px dashed var(--edge);border-radius:.6em;padding:.45em;min-height:4.2em;cursor:pointer;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:.3em;align-items:flex-start}
.bin:hover{border-color:var(--blue)}
.bin h5{margin:0;font:700 .68em var(--f-head);letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase}
.bin small{font-size:.66em;color:var(--muted);margin-top:-.25em}
.bin .in{display:flex;flex-wrap:wrap;gap:.25em}
.seqline{display:flex;flex-wrap:wrap;align-items:center;gap:.3em;min-height:2.2em;margin:.3em 0 .6em;padding:.4em;border-radius:.5em;background:var(--paper-2);border:1px solid var(--line)}
.seqline .n{font:700 .62em var(--f-head);color:var(--muted)}
.gcols{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:.5em}
.gcols h5{margin:0 0 .3em;font:700 .62em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcol{display:flex;flex-direction:column;gap:.3em;align-items:stretch}
.gcol .chip{font-size:.68em}
.st{font:700 .62em var(--f-head);padding:.12em .5em;border-radius:1em;margin-left:.3em;white-space:nowrap}
.st.lost{background:var(--bad);color:#fff}.st.weak{background:#e0a422;color:#fff}.st.ok{background:var(--ok);color:#fff}
.done{margin:.5em 0;padding:.5em .7em;border-radius:.45em;background:var(--ok-bg);color:var(--ok);font:700 .82em var(--f-head)}
.ref{margin-top:.8em;font:600 .62em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.title-page{display:flex;flex-direction:column;min-height:100%;justify-content:center;gap:.6em}
.kick{font:600 .66em var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.ttl{margin:0;font:700 1.95em/1.12 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sub{color:var(--ink-2);font-size:.95em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.6em 0}
.facts div{background:var(--paper-2);border:1px solid var(--line);border-radius:.55em;padding:.55em;text-align:center}
.facts b{display:block;font:700 1.35em var(--f-head);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.facts span{font:600 .58em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.map{list-style:none;padding:0;margin:.4em 0;display:flex;flex-direction:column;gap:.3em}
.map li button{width:100%;display:flex;align-items:center;gap:.6em;padding:.45em .55em;border-radius:.5em;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.map li button:hover{border-color:var(--blue)}
.map .mn{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--band-ink);font:700 .7em var(--f-head)}
.map .mt{flex:1;font:600 .86em var(--f-head);color:var(--navy-ink)}
.map .mp{font:600 .7em var(--f-head);color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:auto 1fr;gap:.35em .6em;align-items:center;font-size:.82em;margin:.5em 0}
.legend i{font-style:normal;width:1.8em;height:1.3em;border-radius:.25em;display:inline-block}
body.rapid .tx, body.rapid .hook{display:none}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,.55);padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:100%;overflow:auto;border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.45);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.ph h2{margin:0;font:700 17px var(--f-head);color:var(--navy-ink);flex:1;min-width:0}
.ph .x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.pb{padding:14px 16px 18px}
.pb .qb{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;font:600 13px var(--f-head);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--band);color:var(--band-ink)}
.fc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px 18px 16px;min-height:150px;font-size:17px;line-height:1.55;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.fc .ctx{font:600 11px var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.blank{display:inline-block;min-width:3.2em;border-radius:6px;padding:0 .35em;margin:0 .1em;background:var(--chip);border:1px dashed var(--blue);color:transparent;cursor:pointer;line-height:1.35}
.blank.r{background:var(--hl);border-style:solid;border-color:transparent;color:var(--ink);font-weight:700;cursor:default}
.fcx{margin-top:12px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;cursor:pointer;font:700 14px var(--f-head);color:var(--ink)}
.grade small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.grade .g0{border-color:var(--bad);color:var(--bad)}.grade .g1{border-color:var(--blue);color:var(--blue)}.grade .g2{border-color:var(--ok);color:var(--ok)}
.meter{display:flex;gap:14px;flex-wrap:wrap;font:600 12px var(--f-head);color:var(--muted);margin:10px 0}
.meter b{color:var(--navy-ink);font-variant-numeric:tabular-nums}
.big{font:700 40px var(--f-head);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.lst{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.lst button.it{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--ink);font-size:14px}
.lst .pgn{font:700 12px var(--f-head);color:var(--blue);flex:none;font-variant-numeric:tabular-nums}
input.srch{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px;font-size:15px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:9px 16px;border-radius:12px;font:600 13px var(--f-head);z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.35)}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* section priority chips */
.sh .sht{display:inline-flex;flex-wrap:wrap;gap:.3em;margin-left:auto}
.sh .sht .tg{font-size:.56em;white-space:nowrap}
/* recall lab: the start of each fact stays visible, the rest is covered until tapped */
.rcg{margin:.85em 0 .3em;font:700 .72em var(--f-head);letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase}
.rci{display:block;width:100%;text-align:left;margin:.3em 0;padding:.45em .6em;border-radius:.45em;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.92em;line-height:1.45;cursor:pointer}
.rci .cue{font-weight:700;color:var(--navy-ink)}
.rci .hid{color:transparent;border-radius:.25em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rci.on{border-color:var(--ok);background:var(--ok-bg)}
/* figures in questions */
.qf{margin:.5em 0 .6em;text-align:center}
.qf img{max-width:100%;max-height:calc(var(--ph) * .42);border-radius:.4em;border:1px solid var(--line);background:#fff}
.panel .qf img{max-height:46vh}
.qf figcaption{font-size:.74em;color:var(--muted);margin-top:.25em}
/* links back to the library and on to the next lecture */
.libl{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-head);color:#fff;text-decoration:none;padding:7px 12px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.endnav{display:flex;flex-direction:column;gap:.5em;margin:.8em 0}
.endnav a{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.7em .85em;border-radius:.6em;border:1px solid var(--line);background:var(--card);color:var(--navy-ink);text-decoration:none;font:600 .9em var(--f-head)}
.endnav a small{display:block;font:500 .78em var(--f-body);color:var(--muted)}
/* real-image lab: the slide picture with its own printed labels as tap targets */
.slw{position:relative;margin:.35em 0;border-radius:.5em;overflow:hidden;border:1px solid var(--line);background:#fff}
.slw img{display:block;width:100%;height:auto}
.slo{position:absolute;inset:0}
.sb{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:.3em;cursor:pointer;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.sb.cv{background:repeating-linear-gradient(135deg,#d6cfbe 0 5px,#e9e3d5 5px 10px);box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.sb.on{box-shadow:0 0 0 2px var(--ok)}
.sb.sel{box-shadow:0 0 0 3px #2e86de}
.sb.hl{box-shadow:0 0 0 3px #ffc928;animation:slpulse 1.3s ease-in-out infinite}
.sb.dim{background:rgba(255,255,255,.62)}
.sb.lost{box-shadow:0 0 0 3px #d64545;background:rgba(214,69,69,.28)}
.sb.weak{box-shadow:0 0 0 3px #e0a422;background:rgba(224,164,34,.25)}
.sb.ok{box-shadow:0 0 0 3px #1e9e62;background:rgba(30,158,98,.18)}
.sb.bad{box-shadow:0 0 0 3px #d64545;background:rgba(214,69,69,.22)}
.sb.mk{border-radius:50%}
@keyframes slpulse{0%,100%{box-shadow:0 0 0 3px #ffc928,0 0 4px 2px rgba(255,201,40,.55)}50%{box-shadow:0 0 0 3px #ffc928,0 0 16px 6px rgba(255,201,40,.95)}}
.slx .chiprow{display:flex;flex-wrap:wrap;gap:.3em;margin:.35em 0}
.panel.wide{width:min(1100px,100%)}
.slbig .slw{min-width:760px}
.slbigw{overflow:auto;-webkit-overflow-scrolling:touch}
/* iPhone/iPad: Safari zooms into any text field under 16px when it is tapped */
@supports (-webkit-touch-callout:none){ input.srch,textarea.dr{font-size:16px} }
</style>

</head>

<div id="app">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="Back to the cover"><img class="bdg" src="helpers_badge_64.png" alt="" onerror="this.remove()"><b>MSK<em class="bw"> Interactive</em> Book</b><span id="chap"></span></button>
    <div class="sp"></div>
    <span class="pgind" id="pgind"></span>
    <div class="prog" title="Pages read"><i id="progi" style="width:0"></i></div>
    <button class="ib" data-act="open-toc" aria-label="Contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lb">Contents</span></button>
    <button class="ib" data-act="open-search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="lb">Search</span></button>
    <button class="ib" data-act="open-cards" aria-label="Flashcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg><span class="lb">Flashcards</span></button>
    <button class="ib" data-act="open-exam" aria-label="Exam mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg><span class="lb">Exam</span></button>
    <button class="ib" data-act="open-mist" aria-label="Mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span class="lb">Mistakes</span></button>
    <button class="ib" data-act="open-set" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="lb">Settings</span></button>

  <main class="stage" id="stage">

      <div class="pg pg-l" id="pgL"></div>

      <div class="leaf" id="leaf" hidden><div class="face front" id="lf"></div><div class="face back" id="lb"></div></div>

      <button class="turn next" data-act="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="home" id="home"></div>
  </main>
  <nav class="mnav" id="mnav" hidden>
    <button data-act="prev" aria-label="Previous page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="mid" id="mmid"></span>
    <button data-act="next" aria-label="Next page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>

: "part", "no": "P2-04", "title": "[Part 2] Corticosteroids in RA", "sub": "Corticosteroids — the drug & its mechanism · Side effects in RA · How to limit corticosteroid toxicity"}, {"t": "h", "no": "P2-4.1", "title": "Corticosteroids — the drug & its mechanism"}, {"t": "list", "items": ["Dramatic effect at high doses; oral <mark>prednisone<\/mark> most common, <mark>4–5<\/mark>× cortisol potency", "Bind <mark>cytoplasmic<\/mark> receptors → <mark>nucleus<\/mark> → interfere with <mark>RNA processing<\/mark>", "Inhibit <mark>leukocyte chemotaxis<\/mark>; ↓ <mark>vascular permeability<\/mark>", "Inhibit cytokines and arachidonic acid metabolites", "Toxicity <mark>dose<\/mark>- and <mark>time<\/mark>-related"]}, {"t": "h", "no": "P2-4.2", "title": "Side effects in RA"}, {"t": "list", "items": ["<mark>Osteoporosis<\/mark> → <mark>non-traumatic fractures<\/mark>", "<mark>Diabetogenic<\/mark>; salt &amp; water <mark>retention<\/mark> → <mark>hypertension<\/mark>", "<mark>Cataract<\/mark>; ↑ bacterial &amp; opportunistic <mark>infections<\/mark> (<mark>herpes zoster<\/mark>, <mark>fungal<\/mark>)"]}], "toc": ["P2-04", "[Part 2] Corticosteroids in RA"]}, {"id": "p69", "head": "Part P2-04 · [Part 2] Corticosteroids in RA", "kind": "text", "blocks": [{"t": "h", "no": "P2-4.3", "title": "How to limit corticosteroid toxicity"}, {"t": "list", "items": ["<mark>Shortest time, lowest dose<\/mark>", "<mark>Intermittent high-dose pulses<\/mark> (monthly IV <mark>methylprednisolone<\/mark>)", "<mark>Intra-articular depot<\/mark> injection", "<b>Protect bone:<\/b> vitamin D, calcium, <mark>bisphosphonates<\/mark>"]}]}, {"id": "p70", "head": "Lab · Recall · Part P2-04", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-10-0", "title": "Recall · [Part 2] Corticosteroids in RA (1/2)", "groups": [{"title": "P2-4.1 Corticosteroids — the drug & its mechanism", "items": [["Dramatic effect at high", "doses; oral prednisone most common, 4–5× cortisol potency"], ["Bind cytoplasmic receptors →", "nucleus → interfere with RNA processing"], ["Inhibit leukocyte", "chemotaxis; ↓ vascular permeability"], ["Inhibit cytokines", "and arachidonic acid metabolites"], ["Toxicity dose-", "and time-related"]]}, {"title": "P2-4.2 Side effects in RA", "items": [["Osteoporosis →", "non-traumatic fractures"], ["Diabetogenic; salt &amp; water retention →", "hypertension"], ["Cataract; ↑ bacterial", "&amp; opportunistic infections (herpes zoster, fungal)"]]}]}], "labName": "Recall · [Part 2] Corticosteroids in RA (1/2)"}, {"id": "p71", "head": "Lab · Recall · Part P2-04", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-10-1", "title": "Recall · [Part 2] Corticosteroids in RA (2/2)", "groups": [{"title": "P2-4.3 How to limit corticosteroid toxicity", "items": [["Shortest time", "lowest dose"], ["Intermittent high-dose", "pulses (monthly IV methylprednisolone)"], ["Intra-articular depot", "injection"], ["Protect bone:", "vitamin D, calcium, bisphosphonates"]]}]}], "labName": "Recall · [Part 2] Corticosteroids in RA (2/2)"}, {"id": "p72", "head": "Part P2-04 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHA-L2-04"}]}, {"id": "p73", "head": "Part P2-04 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHA-L2-05"}]}, {"id": "p74", "head": "Part P2-04 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHA-L2-11"}, {"t": "flap", "q": "N-PHA-L2-18"}]}, {"id": "p75", "head": "Part P2-05 · [Part 2] DMARDs & Biologicals", "kind": "text", "blocks": [{"t": "part", "no": "P2-05", "title": "[Part 2] DMARDs & Biologicals", "sub": "Disease-modifying anti-rheumatic drugs (DMARDs) · Biological treatments"}, {"t": "h", "no": "P2-5.1", "title": "Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"t": "list", "items": ["Disparate compounds that retard bony erosions in RA", "<b>Classic:<\/b> gold (aurothiomalate), <mark>sulfasalazine<\/mark>, <mark>hydroxychloroquine<\/mark>, <mark>D-penicillamine<\/mark>", "<b>Immunosuppressive:<\/b> <mark>methotrexate<\/mark> (<mark>folic acid antagonist<\/mark>), <mark>azathioprine<\/mark> (<mark>antimetabolite<\/mark>), <mark>cyclophosphamide<\/mark> (alkylating), <mark>cyclosporin<\/mark>, <mark>leflunomide<\/mark> (<mark>pyrimidine antagonist<\/mark>)", "<mark>No single<\/mark> mechanism; delayed onset <mark>weeks to months<\/mark>; <mark>methotrexate<\/mark> most prescribed", "Potential toxicity → <mark>monitoring<\/mark>, start under <mark>rheumatologist<\/mark>; <mark>combinations<\/mark> superior"]}], "toc": ["P2-05", "[Part 2] DMARDs & Biologicals"]}, {"id": "p76", "head": "Part P2-05 · [Part 2] DMARDs & Biologicals", "kind": "text", "blocks": [{"t": "h", "no": "P2-5.2", "title": "Biological treatments"}, {"t": "list", "items": ["Monoclonal antibodies vs <mark>B cells<\/mark> or cytokines (<mark>TNF-α<\/mark>: adalimumab, infliximab, etanercept)", "Soluble <mark>TNF<\/mark> receptors, <mark>IL-1<\/mark> receptor antagonists (anakinra), <mark>IL-6<\/mark> receptor", "Suppress inflammation and prevent bony erosions", "<b>Limitations:<\/b> <mark>high cost<\/mark>, uncertain <mark>long-term safety<\/mark>"]}]}, {"id": "p77", "head": "Lab · Recall · Part P2-05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-11-0", "title": "Recall · [Part 2] DMARDs & Biologicals (1/2)", "groups": [{"title": "P2-5.1 Disease-modifying anti-rheumatic drugs (DMARDs)", "items": [["Disparate compounds that", "retard bony erosions in RA"], ["Classic:", "gold (aurothiomalate), sulfasalazine, hydroxychloroquine, D-penicillamine"], ["Immunosuppressive:", "methotrexate (folic acid antagonist), azathioprine (antimetabolite), cyclophosphamide (alkylating), cyclosporin, leflunomide (pyrimidine antagonist)"], ["No single mechanism; delayed", "onset weeks to months; methotrexate most prescribed"], ["Potential toxicity →", "monitoring, start under rheumatologist; combinations superior"]]}]}], "labName": "Recall · [Part 2] DMARDs & Biologicals (1/2)"}, {"id": "p78", "head": "Lab · Recall · Part P2-05", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-11-1", "title": "Recall · [Part 2] DMARDs & Biologicals (2/2)", "groups": [{"title": "P2-5.2 Biological treatments", "items": [["Monoclonal antibodies vs B", "cells or cytokines (TNF-α: adalimumab, infliximab, etanercept)"], ["Soluble TNF receptors", "IL-1 receptor antagonists (anakinra), IL-6 receptor"], ["Suppress inflammation", "and prevent bony erosions"], ["Limitations:", "high cost, uncertain long-term safety"]]}]}], "labName": "Recall · [Part 2] DMARDs & Biologicals (2/2)"}, {"id": "p79", "head": "Part P2-05 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHA-L2-06"}]}, {"id": "p80", "head": "Part P2-06 · [Part 2] Septic Arthritis & Osteomyelitis", "kind": "text", "blocks": [{"t": "part", "no": "P2-06", "title": "[Part 2] Septic Arthritis & Osteomyelitis", "sub": "Antibiotic therapy (self learning)"}, {"t": "h", "no": "P2-6.1", "title": "Antibiotic therapy (self learning)"}, {"t": "list", "items": ["Start provisional '<mark>best guess<\/mark>' antibiotic", "<b>Children:<\/b> <mark>anti-staphylococcal bactericidal<\/mark> antibiotic", "Adjust to <mark>antibiotic sensitivity<\/mark>", "No prolonged <mark>I.V<\/mark>.; switch to oral usually within <mark>3 days<\/mark>", "Total ~<mark>3 weeks<\/mark> minimizes recurrence"]}], "toc": ["P2-06", "[Part 2] Septic Arthritis & Osteomyelitis"]}, {"id": "p81", "head": "Lab · Recall · Part P2-06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-12-0", "title": "Recall · [Part 2] Septic Arthritis & Osteomyelitis", "groups": [{"title": "P2-6.1 Antibiotic therapy (self learning)", "items": [["Start provisional", "'best guess' antibiotic"], ["Children:", "anti-staphylococcal bactericidal antibiotic"], ["Adjust to", "antibiotic sensitivity"], ["No prolonged I.V.; switch", "to oral usually within 3 days"], ["Total ~3", "weeks minimizes recurrence"]]}]}], "labName": "Recall · [Part 2] Septic Arthritis & Osteomyelitis"}, {"id": "p82", "head": "Part P2-06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHA-L2-07"}]}, {"id": "p83", "head": "Part P2-07 · [Part 2] Drugs Compared", "kind": "text", "blocks": [{"t": "part", "no": "P2-07", "title": "[Part 2] Drugs Compared", "sub": "Anti-gout drugs — master table · RA drugs — master table · Scenario → drug · Look-alike pairs"}, {"t": "h", "no": "P2-7.1", "title": "Anti-gout drugs — master table"}, {"t": "list", "items": ["Colchicine, allopurinol, febuxostat, probenecid compared"]}, {"t": "h", "no": "P2-7.2", "title": "RA drugs — master table"}, {"t": "list", "items": ["Only DMARDs and biologicals prevent erosions"]}, {"t": "h", "no": "P2-7.3", "title": "Scenario → drug"}, {"t": "list", "items": ["Acute gout → NSAIDs/steroids; renal insufficiency → avoid colchicine", "Long-term steroid → vit D + calcium, bisphosphonate"]}, {"t": "h", "no": "P2-7.4", "title": "Look-alike pairs"}, {"t": "list", "items": ["Methotrexate (folate antagonist) vs leflunomide (pyrimidine antagonist)", "Azathioprine (antimetabolite) vs cyclophosphamide (alkylating); anti-TNF vs anakinra (IL-1)"]}], "toc": ["P2-07", "[Part 2] Drugs Compared"]}, {"id": "p84", "head": "Lab · Recall · Part P2-07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-13-0", "title": "Recall · [Part 2] Drugs Compared", "groups": [{"title": "P2-7.1 Anti-gout drugs — master table", "items": [["Colchicine, allopurinol", "febuxostat, probenecid compared"]]}, {"title": "P2-7.2 RA drugs — master table", "items": [["Only DMARDs", "and biologicals prevent erosions"]]}, {"title": "P2-7.3 Scenario → drug", "items": [["Acute gout →", "NSAIDs/steroids; renal insufficiency → avoid colchicine"], ["Long-term steroid →", "vit D + calcium, bisphosphonate"]]}, {"title": "P2-7.4 Look-alike pairs", "items": [["Methotrexate (folate", "antagonist) vs leflunomide (pyrimidine antagonist)"], ["Azathioprine (antimetabolite) vs", "cyclophosphamide (alkylating); anti-TNF vs anakinra (IL-1)"]]}]}], "labName": "Recall · [Part 2] Drugs Compared"}, {"id": "p85", "head": "Part P2-08 · [Part 2] Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "P2-08", "title": "[Part 2] Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps"}, {"t": "h", "no": "P2-8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Q&amp;A recap of gout, anti-gout drugs, RA drugs, steroids, DMARDs, antibiotics"]}, {"t": "h", "no": "P2-8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["Acute → calm cells, chronic → cut urate; CHOID steroid side effects; 3 &amp; 3 rule"]}], "toc": ["P2-08", "[Part 2] Rapid Revision"]}, {"id": "p86", "head": "Lab · Recall · Part P2-08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-pha-l2-14-0", "title": "Recall · [Part 2] Rapid Revision", "groups": [{"title": "P2-8.1 Must-know one-liners", "items": [["Q&amp;A recap of gout", "anti-gout drugs, RA drugs, steroids, DMARDs, antibiotics"]]}, {"title": "P2-8.2 Mnemonic vault & classic exam traps", "items": [["Acute →", "calm cells, chronic → cut urate; CHOID steroid side effects; 3 &amp; 3 rule"]]}]}], "labName": "Recall · [Part 2] Rapid Revision"}, {"id": "p87", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Calcium is only weakly anti-resorptive with mild fracture benefit"}, {"t": "note", "kind": "trap", "html": "Teriparatide is the only anabolic drug; calcitonin ↓ Ca whereas teriparatide may cause hypercalcaemia"}, {"t": "note", "kind": "trap", "html": "Bisphosphonate dosing ignores plasma PK — drug stays in bone"}, {"t": "note", "kind": "trap", "html": "Denosumab first line in high-risk patients"}, {"t": "note", "kind": "trap", "html": "Tamoxifen CI with DVT/PE history; endometrial carcinoma risk"}, {"t": "note", "kind": "trap", "html": "Anti-TNF can worsen heart failure and reactivate TB"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p88", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "OA is non-inflammatory; RA, gout, septic arthritis inflammatory"}, {"t": "note", "kind": "trap", "html": "Never oral steroids for OA; topical steroids no role"}, {"t": "note", "kind": "trap", "html": "Glucosamine not yet proven disease-modifying"}, {"t": "note", "kind": "trap", "html": "Long-term NSAIDs not recommended in elderly, renal impairment, antihypertensive users"}, {"t": "note", "kind": "trap", "html": "Gout hyperuricaemia mainly under-excretion"}, {"t": "note", "kind": "trap", "html": "XO inhibitors ineffective/may aggravate acute gout"}, {"t": "note", "kind": "trap", "html": "NSAIDs &amp; steroids more commonly used than colchicine acutely"}]}, {"id": "p89", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Only allopurinol used for tumour lysis &amp; urate stones; only it lists skin allergy"}, {"t": "note", "kind": "trap", "html": "NSAIDs don't prevent erosions; effect reverses on stopping"}, {"t": "note", "kind": "trap", "html": "Steroid side effects are dose- and time-related"}, {"t": "note", "kind": "trap", "html": "No prolonged I.V. antibiotics in septic arthritis/osteomyelitis"}, {"t": "note", "kind": "cl", "html": "Test for TB before starting TNF-α antagonists"}, {"t": "note", "kind": "cl", "html": "Probenecid raises plasma penicillin — prescribe penicillins with care"}]}, {"id": "p90", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "cl", "html": "Colchicine in renal insufficiency → severe diarrhoea &amp; GI haemorrhage"}, {"t": "note", "kind": "cl", "html": "Limit steroid toxicity: short/low dose, IV methylprednisolone pulses, intra-articular depot, bone protection"}, {"t": "note", "kind": "cl", "html": "Rofecoxib withdrawn for cardiovascular risk"}]}, {"id": "p91", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0745": {"id": "Q0745", "stem": "Denosumab, a RANK ligand (RANKL) inhibitor, is used for the treatment of which one of the following conditions?", "top": false, "rep": "", "tag": "Final bank PHA Q37", "bank": true, "expl": "Denosumab is a RANK ligand (RANKL) inhibitor used in osteoporosis, where it is first line in high-risk patients. The biological therapy for rheumatoid arthritis is the TNF-α antagonists, and osteoarthritis treatment is largely palliative (analgesics, NSAIDs, joint injections).", "type": "mcq", "opts": ["Systemic lupus erythematosus", "Osteoporosis", "Osteoarthritis", "Rheumatoid arthritis"], "ans": 1}, "Q0746": {"id": "Q0746", "stem": "The unique property of selective estrogen-receptor modulators (SERMs) is which one of the following?", "top": false, "rep": "", "tag": "Final bank PHA Q38", "bank": true, "expl": "SERMs (raloxifene, tamoxifen) activate estrogen receptors in bone and the cardiovascular system but are antagonists in breast and uterus, so they cut bone resorption without stimulating breast or uterus. They work through estrogen receptors, so option b is wrong.", "type": "mcq", "opts": ["Act as estrogen agonists in some tissues and antagonists in other tissues", "Produce an estrogenic effect without binding to estrogen receptors", "Inhibit the aromatase enzyme that is required for estrogen synthesis", "Have both estrogen and progesterone agonistic activity"], "ans": 0}, "Q0748": {"id": "Q0748", "stem": "A 50-year-old woman with rheumatoid arthritis is being considered for infliximab therapy. Which of the following tests should be performed before beginning treatment?", "top": false, "rep": "", "tag": "Final bank PHA Q39", "bank": true, "expl": "TNF-α antagonists such as infliximab can reactivate latent tuberculosis, so patients must be tested for TB before starting. The other tests are not the pre-treatment check named for anti-TNF therapy.", "type": "mcq", "opts": ["Liver function tests", "Test for latent tuberculosis", "Visual examination", "Pulmonary function tests"], "ans": 1}, "Q0749": {"id": "Q0749", "stem": "A patient began taking alendronate. She was advised to take it with a large amount of water and to remain upright for at least half an hour, until she had the first meal of the day. These instructions were given to reduce the risk of which of the following?", "top": false, "rep": "", "tag": "Final bank PHA Q40", "bank": true, "expl": "Bisphosphonates such as alendronate cause GI disturbances, including reflux oesophagitis and pill (corrosive) oesophagitis, and the water and upright position are meant to prevent this. Osteonecrosis, gallstones and constipation are not among the listed bisphosphonate side effects.", "type": "mcq", "opts": ["Erosive oesophagitis", "Osteonecrosis", "Cholelithiasis", "Constipation"], "ans": 0}, "Q0752": {"id": "Q0752", "stem": "Which of the following is the most widely used agent for the treatment of acute gouty arthritis?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA Q35", "bank": true, "expl": "NSAIDs such as indomethacin, and steroids, are potentially less toxic than colchicine, so they are more commonly used in an acute gout attack. Colchicine also relieves the attack but is more toxic, while probenecid and allopurinol lower urate for long-term prevention (xanthine oxidase inhibitors may even aggravate acute gout).", "type": "mcq", "opts": ["Phenylbutazone", "Colchicine", "Probenecid", "Allopurinol", "Indomethacin"], "ans": 4}, "Q0773": {"id": "Q0773", "stem": "A 70-year-old female is being started on ibandronate once monthly for the treatment of osteoporosis. Which of the following is important to communicate to this patient?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q25", "bank": true, "expl": "Bisphosphonates such as ibandronate cause GI disturbances including reflux oesophagitis and pill (corrosive) oesophagitis, so the patient stays upright after the dose to keep the tablet out of the oesophagus. Blood clots and leg cramps belong to other osteoporosis drugs — DVT/PE with SERMs and leg cramps with teriparatide.", "type": "mcq", "opts": ["Take this medication with orange juice to increase absorption", "Take this medication after meals to minimize stomach upset", "Remain upright for at least 60 minutes after taking this medication", "Adverse effects may include blood clots and leg cramps"], "ans": 2}, "Q0775": {"id": "Q0775", "stem": "Case: A 45-year-old man presents to urgent care with 2 days of left knee pain, swelling, and erythema without recent trauma. He is afebrile. White blood cell count, ESR, and CRP are mildly elevated. Knee X-ray shows a large joint effusion but is otherwise normal. On further questioning he reports a similar episode of acute onset joint pain and swelling involving the right 1st metatarsophalangeal joint 3 years ago.\n1. What is the most likely diagnosis?\n2. What is the mechanism of action of allopurinol?\n3. Outline the drug therapy.", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA W3", "bank": true, "expl": "Recurrent acute arthritis with an earlier first-MTP attack points to gout, caused by monosodium urate crystal deposition. Allopurinol inhibits xanthine oxidase and cuts uric acid synthesis, so it is for long-term prevention, while NSAIDs, steroids or colchicine treat the acute attack.", "aimg": ["figs/Q0775_ans.jpg", "figs/Q0775_ans2.jpg"], "acap": "Uric acid metabolism, and the purine breakdown pathway with the sites of action of gout drugs (staff answer slides).", "type": "written", "keyhtml": "1. Acute gout (gouty arthritis): hyperuricaemia with recurrent attacks of acute arthritis caused by deposition of monosodium urate crystals in distal joints (here an earlier attack in the 1st MTP joint). The acute attack is an interaction between neutrophils and the urate crystals. Hyperuricaemia is mainly due to under-excretion of uric acid; overproduction is less common.\n2. Allopurinol is a xanthine oxidase inhibitor: it blocks xanthine oxidase in the steps hypoxanthine → xanthine → uric acid, so ↓ synthesis of uric acid and ↓ serum urate.\n• Use: long-term prevention of gout (also urate nephrolithiasis and tumour lysis syndrome).\n• Ineffective in, and may aggravate, an acute attack.\n• Side effects: GI disturbances, LFT abnormalities, allergic skin reactions.\n3. • Acute attack: NSAIDs (e.g. indomethacin) and steroids — potentially less toxic, so more commonly used; colchicine (binds tubulin → ↓ neutrophil migration and degranulation) for relief or prophylaxis of the attack.\n• Hyperuricaemia / long-term prevention: xanthine oxidase inhibitors (allopurinol, febuxostat) make less uric acid; the uricosuric probenecid ↓ uric acid reabsorption in the PCT → ↑ excretion (needs adequate renal function; contraindicated with nephrolithiasis)."}, "Q0776": {"id": "Q0776", "stem": "Case: A 62-year-old woman presents with chronic left hip pain that is worse with activity. She has no history of trauma or malignancy. Left hip X-ray shows a bowing deformity of the proximal left femur, with expansion of the proximal femoral medullary space and proximal femoral cortical thickening. Lab evaluation reveals elevated alkaline phosphatase but normal serum calcium and phosphate. A nuclear medicine bone scan is performed to evaluate for other potential sites of involvement.\n1. What is the most likely diagnosis?\n2. Outline the drug therapy.", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA W4", "bank": true, "expl": "Paget disease results from aggressive localized osteoclastic activity followed by disorganized repair, so bisphosphonates, which bind bone and inhibit osteoclast-mediated resorption, are used to limit bone turnover. NSAIDs are added to control the bone pain.", "type": "written", "keyhtml": "1. Paget disease of bone — aggressive localized osteoclastic activity in bone followed by disorganized osteoblastic repair of bone.\n2. • NSAIDs — for control of bone pain.\n• Bisphosphonates (e.g. alendronate, zoledronate) — to limit bone turnover: they bind bone and inhibit osteoclast-mediated bone resorption (↓ activity of each osteoclast, ↓ recruitment and differentiation of osteoclast precursors, ↑ osteoclast apoptosis). Paget disease is a listed use (POMH: Paget, osteoporosis, metastatic bone disease, hypercalcaemia). Side effects: GI disturbances (dyspepsia, reflux and pill oesophagitis, peptic ulcer), bone pain.\n• Calcitonin also lists Paget disease among its uses (binds osteoclast receptors and inhibits their action)."}, "Y26-039": {"id": "Y26-039", "stem": "A 47-year-old man presents with acute pain in his big toe. Laboratory tests reveal a uric acid level of 10 mg/dL (normal up to 6 mg/dL). He is started on medication (Drug 1). Several days after the resolution of the acute attack, he is started on a second medication (Drug 2). Drug 2 decreases the serum and increases urine levels of uric acid. Which of the following is Drug 2?", "top": true, "rep": "", "tag": "Final bank PHA Q36", "bank": true, "expl": "Drug 2 is started after the attack, so it is a long-term urate-lowering drug; probenecid inhibits uric acid reabsorption in the proximal convoluted tubule, so serum urate falls while more uric acid is excreted in the urine. Allopurinol also lowers serum urate, but it makes less uric acid by inhibiting xanthine oxidase rather than making the kidney excrete more.", "type": "mcq", "opts": ["Probenecid", "Rasburicase", "Allopurinol", "Colchicine", "Indomethacin"], "ans": 0}, "Q0777": {"id": "Q0777", "stem": "Case: Mrs Gale reports that she has noticed the development of small painless nodular lumps over the extensor surfaces of both elbows. Her general practitioner explains that she has RA and that the lumps are rheumatoid nodules. She will need to be treated with a comprehensive management programme. She is referred to the local branch of the Arthritis Foundation for information and is advised to attend their patient education programme. She is recommended to undertake a period of rest and commenced on naproxen 500 mg b.d., a non-steroidal anti-inflammatory drug. She is referred to a rheumatologist for advice about the use of disease-modifying anti-rheumatic drugs.\nCorticosteroid treatment: Despite 2 weeks of complete rest and a course of naproxen, Mrs Gale has only partly improved, remains in pain and cannot function effectively. After a telephone call by her general practitioner to a rheumatologist, she is advised to commence oral prednisone 10 mg per day as a morning dose.\nTreatment with a disease-modifying anti-rheumatic drug: Mrs Gale has her first appointment with the rheumatologist. She has had a good symptomatic response to oral prednisone and has markedly reduced joint pain and stiffness. Nevertheless, the rheumatologist recommends that she be commenced on a disease-modifying anti-rheumatic drug. He discusses the various options available and they decide to add enteric-coated sulfasalazine initially at 500 mg per day. She is told about possible adverse drug effects and the need for regular blood counts to monitor for toxicity.\nResponse to drug treatment: 3 years later, Mrs Gale is managing reasonably well on treatment with prednisone 5 mg per day, sulfasalazine 2 g per day, vitamin D and a calcium supplement. She is able to help with the family business, but has persistent synovitis in her right knee, despite repeated intra-articular depot corticosteroid injections. The latter produce only temporary relief of symptoms.\n1. Why was she commenced on naproxen, and why is she still referred to a rheumatologist for a disease-modifying anti-rheumatic drug?\n2. What is the role of the oral prednisone?\n3. Why is sulfasalazine added although she has responded well to prednisone, and why are regular blood counts needed?\n4. Why is she kept on a low dose of prednisone with vitamin D and a calcium supplement, and what is the place of intra-articular depot corticosteroid injections?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA W5", "bank": true, "expl": "NSAIDs give fast symptomatic relief but do not stop erosions, steroids bridge the gap until the slow-acting DMARD works, and DMARDs such as sulfasalazine retard bony erosions. Steroid toxicity is dose- and time-related, so the dose is kept low and vitamin D and calcium protect the bone.", "aimg": ["figs/Q0777_ans.jpg"], "acap": "RA drug therapy: lines of treatment and the treatment pyramid (staff answer slide).", "type": "written", "keyhtml": "1. • Naproxen is an NSAID — the 1st-line, fast-acting drug for pain relief in RA: it ↓ joint inflammation by inhibiting inflammatory cyclooxygenase products, relieving joint pain, stiffness and swelling within hours to a few days.\n• NSAIDs give symptomatic relief only — they do not prevent joint erosions or damage, and the effect reverses rapidly on stopping. Only DMARDs and biological therapy induce remission and prevent joint destruction, and they are started under a rheumatologist's guidance — hence the referral.\n2. • Prednisone is a corticosteroid (4–5 times as potent as cortisol) used as bridge therapy: fast, dramatic control of the flare while the slow-acting DMARD takes effect.\n• Mechanism: binds cytoplasmic receptors → nucleus → interferes with RNA processing; inhibits leukocyte chemotaxis, ↓ vascular permeability, inhibits production of cytokines and arachidonic acid metabolites.\n3. • Sulfasalazine is a classic DMARD: DMARDs retard the development of bony erosions, induce remission and prevent joint destruction, which steroids and NSAIDs do not.\n• Delayed onset — weeks to months.\n• DMARDs have potential toxicity → careful, regular monitoring (hence the blood counts), with initiation under a rheumatologist.\n4. • Corticosteroid side effects are dose- and time-related (CHOID: cataract, hypertension from salt and water retention, osteoporosis → non-traumatic fractures, infections, diabetogenic), so the steroid is used for as short a time and at as low a dose as possible.\n• Vitamin D and calcium (± bisphosphonates) protect against steroid-induced osteoporosis.\n• Intra-articular depot injection is a local way to limit steroid toxicity, but its relief is only temporary — as in her right knee."}, "Q0778": {"id": "Q0778", "stem": "Case: A 55-year-old female came to a musculoskeletal specialist seeking advice for a 3-year history of progressively worsening pain in both knees. Her knees were stiff for about 20 minutes when she arose in the morning and for a few minutes after getting up from a chair during the day. She had difficulty walking > 30 minutes because of pain, and her symptoms were exacerbated by descending stairs. Although sitting and resting relieved her pain, she became stiff if she stayed in one position for too long. Her symptoms were worse on humid or cold days. She was slightly obese, with no other cardiovascular risk factors.\nMrs Jones was started on 325 mg of acetaminophen three times a day, but it did not alleviate her pain. Six weeks later, she was switched to 500 mg of naproxen twice a day, which improved her symptoms by about 50%. Tramadol, one to two 50-mg tablets every 6 hours as needed, was prescribed for breakthrough pain, and a proton pump inhibitor was added to the regimen to prevent gastric discomfort. After experiencing a severe effusion of her right knee with an inflammatory component, she received 3 spaced intra-articular steroid injections; this provided about 3 months of relief. However, when the pain returned following the third injection, she elected to have hyaluronic acid injections. The first treatment was given in a series of 3 injections. Viscosupplementation with hyaluronic acid provided 18 months of relief.\n1. What is the most likely diagnosis?\n2. Discuss the drug options for her condition: acetaminophen, NSAIDs, selective COX-2 inhibitors, intra-articular corticosteroid injection and viscosupplementation. Why was a proton pump inhibitor added?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHA W6", "bank": true, "expl": "Progressive pain in both weight-bearing knees in a 55-year-old points to osteoarthritis, the destruction of articular cartilage with ageing, whose treatment is largely palliative. Paracetamol and NSAIDs (lowest dose, shortest time) come first, then intra-articular steroid and hyaluronan injections.", "type": "written", "keyhtml": "1. Osteoarthritis (degenerative joint disease) — the most common, non-inflammatory joint disease: destruction of articular cartilage in weight-bearing joints (both knees), occurring with ageing. Treatment is largely palliative (analgesic and anti-inflammatory); prosthetic joints are common and effective.\n2. • Acetaminophen (paracetamol): regular oral use gives adequate pain control (intermittent use for activity-related pain); adding an NSAID gives extra relief and may lower overall NSAID use.\n• NSAIDs (e.g. naproxen, ibuprofen): often preferred for short-term relief, but side effects such as peptic ulcer are common — particularly in the elderly, reduced renal function and patients on antihypertensives — so use the lowest effective dose for the shortest duration; long-term NSAIDs are not recommended. Naproxen is nonselective (↑ GI risk, ↓ CV risk), so a proton pump inhibitor was added to protect the stomach.\n• Selective COX-2 inhibitors (celecoxib): efficacy equivalent to other NSAIDs with less GI toxicity, but ↑ risk of CV events → weigh benefit against risk (useful in patients with GI risk factors).\n• Intra-articular corticosteroid: oral steroids should never be used in OA and topical steroids have no role; soft-tissue/intra-articular injection (± local anaesthetic) gives temporary relief, usually 6–8 weeks, and the response wanes with repeated injections.\n• Viscosupplementation (intra-articular hyaluronan): hyaluronan is the main component of normal synovial fluid and is degraded in OA (↓ elasticity and viscosity); 3–5 weekly injections reduce pain and stiffness and improve physical disability for an average of ~6 months.\n• Tramadol (mixed opioid/non-opioid analgesic) covers breakthrough pain."}, "Q0780": {"id": "Q0780", "stem": "Case: A 59-year-old woman with menopause-associated osteoporosis presented with progressive loss of bone mass despite taking calcium and vitamin D supplements and being a nonsmoker. She was not receiving conventional osteoporosis treatment (e.g. bisphosphonates), hormone replacement therapy, or using natural or synthetic steroids. DXA was conducted in order to obtain several bone mineral density scans that provided evidence of progressive bone mineral density loss that was consistent with the advancement of osteopenia to osteoporosis.\n1. Is hormonal replacement therapy considered a safe strategy?\n2. What is the alternative therapeutic option?\n3. What is the first-line therapy in high-risk patients?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHA W7", "bank": true, "expl": "Long-term estrogen is linked to cardiovascular adverse effects and a possible rise in breast cancer, which led to SERMs that protect bone without stimulating breast or uterus. Denosumab, a RANKL inhibitor, is first line in high-risk patients.", "aimg": ["figs/Q0780_ans.jpg"], "acap": "Mechanism of action of the available osteoporosis therapies (staff answer slide; adapted from Boyle et al., Nature 2003).", "type": "written", "keyhtml": "1. No — not as a long-term strategy. Estrogen reduces osteoclastogenesis (↓ IL-1 and RANK) and was once the treatment of first choice in perimenopausal women, but long-term estrogen is linked to adverse cardiovascular effects and a possible ↑ risk of breast cancer.\n2. SERMs (selective estrogen-receptor modulators) — raloxifene, tamoxifen: agonists in bone (↓ resorption) and the cardiovascular system, antagonists in breast and uterus; used for osteoporosis prevention. Side effects: hot flashes, DVT and pulmonary embolism (tamoxifen contraindicated with a history of DVT/PE; may ↑ endometrial carcinoma).\n3. Denosumab — RANK ligand (RANKL) inhibitor; first line in high-risk patients."}, "Q0784": {"id": "Q0784", "stem": "Which of the following drugs inhibit osteoclastic activity more than osteoblastic activity and have been beneficial in osteoporosis, hypercalcemia of malignancy, and Paget disease?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q26", "bank": true, "expl": "Alendronate is a bisphosphonate: it binds bone and inhibits osteoclast-mediated resorption while only indirectly stimulating osteoblasts, and its uses are Paget disease, osteoporosis, metastatic bone disease and hypercalcaemia (POMH). Parathyroid hormone (teriparatide) is the anabolic drug that builds bone; calcitonin also inhibits osteoclasts but acts mainly to lower serum calcium, so the bisphosphonate is the expected answer.", "type": "mcq", "opts": ["Alendronate", "Calcitonin", "Fluoride", "Parathyroid hormone", "Vitamin D"], "ans": 0}, "Q0785": {"id": "Q0785", "stem": "Which of the following is useful in rheumatoid arthritis because it binds tumor necrosis factor alpha (TNF-alpha)?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q27", "bank": true, "expl": "Infliximab is a TNF-α antagonist (biological therapy) used in rheumatoid arthritis; it blocks the inflammatory cytokine TNF-α. Methotrexate (folic acid antagonist) and leflunomide (pyrimidine antagonist) are DMARDs that do not bind TNF-α.", "type": "mcq", "opts": ["Leflunomide", "Infliximab", "Methotrexate", "Paclitaxel", "Trastuzumab"], "ans": 1}, "Q0786": {"id": "Q0786", "stem": "A 47-year-old man presents with acute pain in his big toe. Laboratory tests reveal a uric acid level of 10 mg/dL. He is started on medication (Drug 1). Several days after the resolution of the acute attack, he is started on a second medication (Drug 2). Drug 2 decreases both the serum and urine levels of uric acid. Which of the following is Drug 2?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q28", "bank": true, "expl": "Drug 2 is started after the attack has resolved, so it is a long-term urate-lowering drug; allopurinol inhibits xanthine oxidase and reduces uric acid synthesis, so uric acid falls in both serum and urine. Probenecid lowers serum urate by increasing renal excretion, so urine uric acid rises instead.", "type": "mcq", "opts": ["Allopurinol", "Colchicine", "Indomethacin", "Probenecid", "Sulfinpyrazone"], "ans": 0}, "Q0787": {"id": "Q0787", "stem": "A 65-year-old woman consults a physician because the skin on her face feels too tight to her. The patient has also been experiencing tingling sensations on her face. Physical examination demonstrates that the patient’s facial bones are enlarged, particularly the mandible. Which of the following medications would be most helpful to her?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q29", "bank": true, "expl": "Enlargement of the facial bones (particularly the mandible) in an older woman points to Paget disease of bone, one of the listed uses of bisphosphonates (POMH — Paget, osteoporosis, metastatic bone disease, hypercalcaemia), which bind bone and inhibit osteoclast-mediated resorption. Colchicine is for gout and TNF inhibitors are for RA, psoriatic arthritis and ankylosing spondylitis.", "type": "mcq", "opts": ["Bicarbonate to alkalinize urine", "Bisphosphonates", "Colchicine", "Doxycycline", "Mannitol", "TNF inhibitors"], "ans": 1}, "Q0788": {"id": "Q0788", "stem": "Which of the following is correct regarding the pharmacokinetics of the bisphosphonates?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q30", "bank": true, "expl": "Oral bisphosphonates are poorly absorbed, and food or other medications greatly impair their absorption. Once absorbed they are retained in the skeleton for prolonged periods, so the usual plasma pharmacokinetics (such as a 4–6-hour half-life) do not describe them.", "type": "mcq", "opts": ["Bisphosphonates are well absorbed after oral administration", "Food or other medications greatly impair absorption of bisphosphonates", "Bisphosphonates are mainly metabolized via the cytochrome P450 system", "Elimination half-life of bisphosphonates ranges from 4 to 6 hours"], "ans": 1}, "Q0789": {"id": "Q0789", "stem": "A 65-year-old female has been diagnosed with postmenopausal osteoporosis. She has no history of fractures and no other medical conditions. Which of the following would be most appropriate for management of her osteoporosis?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q31", "bank": true, "expl": "With no fractures or other conditions she is not a high-risk patient, so denosumab (first line in high-risk patients) is not needed; an oral bisphosphonate such as alendronate, which binds bone and inhibits osteoclast-mediated resorption, is the appropriate choice. Teriparatide is the anabolic drug, and raloxifene is used for osteoporosis prevention.", "type": "mcq", "opts": ["Alendronate", "Calcitonin", "Denosumab", "Raloxifene", "Teriparatide"], "ans": 0}, "Q0790": {"id": "Q0790", "stem": "A 55-year-old female has been diagnosed with postmenopausal osteoporosis. She has a past medical history of ethanol abuse, alcoholic liver disease, erosive esophagitis, and hypothyroidism. Which of the following would be the primary reason oral bisphosphonates should be used with caution in this patient?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q32", "bank": true, "expl": "Oral bisphosphonates cause GI disturbances — dyspepsia, reflux oesophagitis, peptic ulcers and pill (corrosive) oesophagitis — so pre-existing erosive oesophagitis is the main reason for caution. Liver disease is not a listed concern with bisphosphonates.", "type": "mcq", "opts": ["Age", "Erosive esophagitis", "Liver disease", "Thyroid disease"], "ans": 1}, "Q0791": {"id": "Q0791", "stem": "A 64-year-old male presents with signs and symptoms of an acute gouty flare. His doctor wishes to treat him accordingly to improve his symptoms. Which of the following strategies would be the LEAST likely to acutely improve his gout symptoms and pain?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q33", "bank": true, "expl": "Probenecid is a uricosuric for chronic gout: it lowers urate over time and does not relieve an acute attack. Naproxen (an NSAID) and prednisone (a steroid) are the drugs more commonly used in the acute attack, and colchicine also gives relief.", "type": "mcq", "opts": ["Naproxen", "Colchicine", "Probenecid", "Prednisone"], "ans": 2}, "Q0803": {"id": "Q0803", "stem": "A 49-year-old alcoholic businessman complains of 2 days of severe worsening pain with redness and swelling of his first metatarsophalangeal joint. He has no history of injury or trauma. He is afebrile with no constitutional symptoms. Which of the following drugs is the most appropriate pharmacotherapy?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHA Q34", "bank": true, "expl": "Acute pain, redness and swelling of the first MTP joint in an alcoholic man is an acute gout attack; NSAIDs such as indomethacin (and steroids) are less toxic than colchicine and are more commonly used in the acute attack. Allopurinol and probenecid lower urate for long-term prevention — xanthine oxidase inhibitors are ineffective in, and may aggravate, acute gout.", "type": "mcq", "opts": ["Allopurinol", "Indomethacin", "Colestipol", "Pravastatin", "Probenecid"], "ans": 1}, "N-PHA-L2-01": {"id": "N-PHA-L2-01", "stem": "A 52-year-old man has recurrent attacks of acute arthritis, and his serum uric acid is raised. Which of the following is the most common cause of hyperuricaemia in gout?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In gout, hyperuricaemia is mainly caused by under-excretion of uric acid. Overprodu
