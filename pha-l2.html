ction (inborn errors of metabolism, increased availability of purines) is the less common cause.", "type": "mcq", "opts": ["Under-excretion of uric acid by the kidney", "Overproduction of uric acid due to an inborn error of metabolism", "Overproduction of uric acid due to increased availability of purines", "Increased renal excretion of uric acid"], "ans": 0}, "N-PHA-L2-02": {"id": "N-PHA-L2-02", "stem": "A 45-year-old woman with rheumatoid arthritis takes paracetamol every 4–6 hours. Her pain is eased, but the swelling of her finger joints is unchanged. Which of the following best explains this?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In RA, paracetamol gives pain relief only, with no anti-inflammatory effect; it is given every 4–6 hours and seldom causes side effects. A delayed onset of weeks to months describes DMARDs, and phospholipase A2 is where corticosteroids act.", "type": "mcq", "opts": ["Paracetamol has no anti-inflammatory effect", "Paracetamol has a delayed onset of weeks to months", "Paracetamol acts by inhibiting phospholipase A2", "Side effects limit paracetamol to very low doses"], "ans": 0}, "N-PHA-L2-03": {"id": "N-PHA-L2-03", "stem": "A 50-year-old man with rheumatoid arthritis has taken ibuprofen alone for 6 months. His joint pain, stiffness and swelling improved within a few days of starting it. Which of the following is correct about continuing ibuprofen alone?", "top": false, "rep": "", "tag": "Final bank PHA Q41", "bank": true, "expl": "NSAIDs reduce joint pain, stiffness and swelling within hours to days by inhibiting inflammatory COX products, but they do not prevent joint erosions, and the effect rapidly reverses on stopping. Only DMARDs and biological therapies induce remission and prevent joint destruction.", "type": "mcq", "opts": ["It will not prevent joint erosions or damage", "It will induce remission of the disease", "It will retard the development of bony erosions", "Its benefit will persist for months after stopping it", "It reduces inflammation by blocking TNF-α"], "ans": 0}, "N-PHA-L2-04": {"id": "N-PHA-L2-04", "stem": "A 58-year-old woman with a flare of rheumatoid arthritis is started on oral prednisone. Which of the following is a mechanism by which it reduces joint inflammation?", "top": false, "rep": "", "tag": "Final bank PHA Q42", "bank": true, "expl": "Corticosteroids bind cytoplasmic receptors, are transported into the nucleus and interfere with RNA processing; they also inhibit leukocyte chemotaxis, reduce vascular permeability and inhibit cytokines and arachidonic acid metabolites. Binding tubulin is the action of colchicine, and xanthine oxidase inhibition is that of allopurinol and febuxostat.", "type": "mcq", "opts": ["Binds cytoplasmic receptors and interferes with RNA processing", "Binds tubulin and depolymerizes microtubules in neutrophils", "Inhibits xanthine oxidase and lowers uric acid synthesis", "Selectively inhibits COX-2 found in inflammatory cells", "Acts as a monoclonal antibody that neutralises TNF-α"], "ans": 0}, "N-PHA-L2-05": {"id": "N-PHA-L2-05", "stem": "A 62-year-old woman has rheumatoid arthritis that has been controlled with high-dose oral prednisone for 2 years. Which of the following adverse effects is she most likely to develop?", "top": false, "rep": "", "tag": "Final bank PHA Q43", "bank": true, "expl": "Corticosteroid toxicity in RA is dose- and time-related: osteoporosis with non-traumatic fractures, diabetogenic effects, salt and water retention with hypertension, cataract and infections (CHOID). Steroids raise blood glucose and blood pressure, so hypoglycaemia and hypotension are wrong.", "type": "mcq", "opts": ["Hypoglycaemia", "Hypotension", "Cataract", "Tinnitus", "Leg cramps"], "ans": 2}, "N-PHA-L2-06": {"id": "N-PHA-L2-06", "stem": "A 40-year-old woman with established rheumatoid arthritis is referred to a rheumatologist, who starts the most widely prescribed disease-modifying anti-rheumatic drug (DMARD). Which of the following correctly names this drug and its class?", "top": false, "rep": "", "tag": "Final bank PHA Q44", "bank": true, "expl": "Methotrexate, a folic acid antagonist, is the most widely prescribed DMARD. Leflunomide is a pyrimidine antagonist, azathioprine an antimetabolite and cyclophosphamide an alkylating agent, and the antimalarial DMARD is hydroxychloroquine.", "type": "mcq", "opts": ["Methotrexate — folic acid antagonist", "Leflunomide — alkylating agent", "Azathioprine — pyrimidine antagonist", "Cyclophosphamide — antimetabolite", "Sulfasalazine — antimalarial"], "ans": 0}, "N-PHA-L2-07": {"id": "N-PHA-L2-07", "stem": "A 6-year-old child is suspected of having acute osteomyelitis of the tibia. Which of the following best describes the recommended antibiotic approach?", "top": false, "rep": "", "tag": "Final bank PHA Q45", "bank": true, "expl": "A provisional (\"best guess\") antibiotic is started at once — in children an anti-staphylococcal bactericidal drug — and then adjusted to sensitivity. Evidence does not support prolonged I.V. use, so oral therapy usually starts within 3 days, and about 3 weeks in total minimises recurrence (the 3 &amp; 3 rule).", "type": "mcq", "opts": ["Start an anti-staphylococcal bactericidal drug, switch to oral within about 3 days, total about 3 weeks", "Withhold antibiotics until sensitivity results are available, then give I.V. therapy for 3 weeks", "Start a best-guess antibiotic and continue it intravenously for the whole 3-week course", "Start an anti-staphylococcal bactericidal drug by mouth for 3 days, then stop", "Start broad I.V. cover and continue it for 3 months to prevent recurrence"], "ans": 0}, "N-PHA-L2-08": {"id": "N-PHA-L2-08", "stem": "A 66-year-old woman with early osteoarthritis of the knee has persistent pain localised to the joint. Her physician considers corticosteroid therapy. Which of the following is correct?", "top": false, "rep": "", "tag": "Final bank PHA Q46", "bank": true, "expl": "In early knee OA, infiltrating the painful region with steroid and local anaesthetic may improve symptoms; intra-articular steroid relief usually lasts 6–8 weeks and wanes with repeated injections. Oral steroids should never be used for OA and topical steroids have no role (the small gains belong to anti-inflammatory gels, and ~6 months of relief to hyaluronan).", "type": "mcq", "opts": ["Oral corticosteroids are suitable for long-term control of OA pain", "Topical corticosteroid creams give small improvements in pain and stiffness", "Infiltrating the painful region with a steroid and local anaesthetic may improve symptoms", "Each repeated intra-articular injection gives a longer response than the one before", "A single intra-articular steroid injection usually relieves pain for about 6 months"], "ans": 2}, "N-PHA-L2-09": {"id": "N-PHA-L2-09", "stem": "A 76-year-old man with osteoarthritis of both knees has reduced renal function and takes antihypertensive medication. Which of the following is the most appropriate long-term drug for his pain?", "top": false, "rep": "", "tag": "Final bank PHA Q47", "bank": true, "expl": "Long-term NSAIDs such as diclofenac are not recommended in the elderly, in reduced renal function or in patients taking antihypertensives, because side effects are common in these groups; regular oral paracetamol gives adequate pain relief in OA. Corticosteroids should never be given orally for OA, and topical steroids have no role.", "type": "mcq", "opts": ["Regular oral paracetamol", "Oral diclofenac", "Oral prednisone", "Topical corticosteroid cream"], "ans": 0}, "N-PHA-L2-10": {"id": "N-PHA-L2-10", "stem": "A 70-year-old woman with osteoporosis needs a drug that builds new bone rather than only slowing bone resorption. Which of the following acts in this way?", "top": false, "rep": "", "tag": "Final bank PHA Q48", "bank": true, "expl": "Teriparatide (recombinant PTH) is the only anabolic drug: it acts on osteoblasts through the Wnt pathway to form new bone, increasing BMD and reducing vertebral and hip fractures. Bisphosphonates, denosumab, calcitonin and SERMs are all anti-resorptive.", "type": "mcq", "opts": ["Teriparatide", "Alendronate", "Denosumab", "Calcitonin", "Raloxifene"], "ans": 0}, "N-PHA-L2-11": {"id": "N-PHA-L2-11", "stem": "A 55-year-old woman with rheumatoid arthritis needs corticosteroids for repeated flare-ups. Which of the following approaches would best limit corticosteroid toxicity?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Steroid toxicity is dose- and time-related, so steroids are given for as short a time and at as low a dose as possible, as intermittent high-dose pulses (monthly I.V. methylprednisolone) or as intra-articular depot injections. Bone is protected with vitamin D, calcium and bisphosphonates.", "type": "mcq", "opts": ["Use the highest dose for the longest time to prevent relapse", "Inject a depot preparation into the affected joint", "Stop calcium and vitamin D once steroids are started", "Give daily high-dose oral prednisone rather than monthly pulses"], "ans": 1}, "N-PHA-L2-12": {"id": "N-PHA-L2-12", "stem": "A patient with hypercalcaemia associated with malignancy is given calcitonin. Which of the following explains how it lowers serum calcium?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Calcitonin binds receptors on osteoclasts and inhibits bone resorption, and in the kidney reduces proximal tubular reabsorption of Ca2+ and phosphate, so blood calcium and phosphate fall. Stimulating DCT calcium absorption and osteoblasts describes teriparatide, which can cause hypercalcaemia.", "type": "mcq", "opts": ["Inhibits osteoclasts and reduces renal reabsorption of calcium", "Stimulates calcium absorption in the distal convoluted tubule", "Activates osteoblasts through the Wnt anabolic pathway", "Increases calcium absorption from the gut", "Neutralises RANK ligand as a monoclonal antibody"], "ans": 0}, "N-PHA-L2-13": {"id": "N-PHA-L2-13", "stem": "A 70-year-old man with chronic renal insufficiency develops an acute attack of gout. Why should colchicine be avoided in this patient?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Colchicine causes severe diarrhoea and GI haemorrhage with large doses, or with standard doses in renal insufficiency, so NSAIDs or steroids are used instead. Being ineffective in an acute attack describes xanthine oxidase inhibitors, and raising penicillin levels and the nephrolithiasis contraindication belong to probenecid.", "type": "mcq", "opts": ["Even standard doses can cause severe diarrhoea and GI haemorrhage", "It is ineffective in, and may aggravate, an acute attack", "It raises plasma penicillin levels", "It is contraindicated with a history of nephrolithiasis", "It commonly causes allergic skin reactions"], "ans": 0}, "N-PHA-L2-14": {"id": "N-PHA-L2-14", "stem": "A 50-year-old man with chronic gout, normal renal function and no history of kidney stones is started on probenecid. Which of the following is correct about this drug?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Probenecid is a uricosuric: it inhibits uric acid reabsorption in the proximal convoluted tubule, increasing its excretion, and is used in chronic gout. It needs adequate renal function, is contraindicated with nephrolithiasis and raises plasma penicillin levels.", "type": "mcq", "opts": ["It inhibits uric acid reabsorption in the PCT", "It inhibits xanthine oxidase to reduce uric acid synthesis", "It is the preferred drug during an acute gout attack", "It is safe in patients with a history of nephrolithiasis", "It lowers plasma penicillin levels"], "ans": 0}, "N-PHA-L2-15": {"id": "N-PHA-L2-15", "stem": "A 60-year-old woman with knee osteoarthritis asks about taking glucosamine and chondroitin sulphate. Which of the following is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Glucosamine and chondroitin (from marine fish and mammalian cartilage) may give symptom relief equivalent to NSAIDs with greatly reduced adverse effects. They need 3–6 weeks to work, can have a sustained effect after stopping, and are not yet a proven disease-modifying agent.", "type": "mcq", "opts": ["They may give relief similar to NSAIDs with far fewer adverse effects", "They relieve pain within 24 hours of the first dose", "They are a proven disease-modifying agent for osteoarthritis", "Their benefit stops as soon as treatment is stopped", "They are produced from plant sources"], "ans": 0}, "N-PHA-L2-16": {"id": "N-PHA-L2-16", "stem": "Which of the following statements about calcium and vitamin D in osteoporosis is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The elderly may be vitamin D deficient, so supplementation is recommended in institutionalized elderly subjects; low vitamin D reduces gut calcium absorption, raising PTH, which mobilises calcium from bone. Calcium is only weakly anti-resorptive with a mild fracture benefit, and the only anabolic drug is teriparatide.", "type": "mcq", "opts": ["Vitamin D supplementation is recommended in institutionalized elderly subjects", "Calcium is a strong anti-resorptive that greatly reduces fracture risk", "Low vitamin D increases calcium absorption from the gut", "Low vitamin D lowers parathyroid hormone secretion", "Calcium is the only anabolic agent for osteoporosis"], "ans": 0}, "N-PHA-L2-17": {"id": "N-PHA-L2-17", "stem": "A 58-year-old woman with a history of pulmonary embolism is being considered for drug therapy to prevent osteoporosis. Which of the following drugs is contraindicated in her?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "SERMs increase the risk of DVT and pulmonary embolism, and tamoxifen is contraindicated in patients with a history of either. Tamoxifen may also increase the risk of endometrial carcinoma through its partial agonist effect.", "type": "mcq", "opts": ["Tamoxifen", "Alendronate", "Calcitonin", "Denosumab", "Teriparatide"], "ans": 0}, "N-PHA-L2-18": {"id": "N-PHA-L2-18", "stem": "Mention the side effects of corticosteroids in rheumatoid arthritis, and how their toxicity can be limited.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Corticosteroids are dramatic in RA but toxic at high doses for prolonged periods (CHOID). Toxicity is limited by short, low-dose use, monthly I.V. pulses, intra-articular depots and bone protection.", "type": "written", "keyhtml": "Side effects (dose- and time-related; CHOID):\n• Osteoporosis → eventual non-traumatic fractures\n• Diabetogenic (interfere with glucose metabolism)\n• Salt and water retention → may precipitate or worsen hypertension\n• Cataract (interfere with lens metabolism)\n• ↑ Susceptibility to bacterial and opportunistic infections (e.g. herpes zoster, fungal infections)\nLimiting toxicity:\n1. Use for as short a time and at as low a dose as possible\n2. Intermittent high-dose pulses, e.g. monthly I.V. methylprednisolone\n3. Intra-articular injection of depot preparations\n4. Protect bone: vitamin D and calcium, bisphosphonates"}, "N-PHA-L2-19": {"id": "N-PHA-L2-19", "stem": "Compare paracetamol and NSAIDs in the treatment of rheumatoid arthritis.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Both give symptomatic relief only: paracetamol eases pain without anti-inflammatory action, while NSAIDs also reduce inflammation within hours to days. Neither prevents joint erosions.", "type": "written", "keyhtml": "Feature | Paracetamol | NSAIDs (e.g. ibuprofen, diclofenac)\nAction | Pain relief only — no anti-inflammatory effect | ↓ Joint inflammation by inhibiting inflammatory cyclooxygenase products (COX-1/COX-2)\nOnset / use | Every 4–6 hours for pain relief if necessary | Act quickly — within hours to a few days; 1st line pain relief\nBenefit | Seldom produces side effects; well tolerated | ↓ Joint pain, stiffness and swelling (symptomatic relief)\nLimits | No effect on inflammation | Do not prevent joint erosions; effect rapidly reverses on stopping; CV risk, especially COX-2 selective (rofecoxib withdrawn)"}, "TP-025": {"id": "TP-025", "stem": "A 59-year-old woman with menopause-associated osteoporosis presented with progressive loss of bone mass despite taking calcium and vitamin D supplements and being a nonsmoker. She was not receiving conventional osteoporosis treatment (bisphosphonates, e.g. alendronate) or hormone replacement therapy. DXA was conducted to obtain several bone mineral density scans that provided evidence of progressive bone mineral density loss consistent with the advancement of osteopenia to osteoporosis.\na) Which of the above-mentioned agents inhibits osteoclastic activity more than osteoblastic activity and has been beneficial in osteoporosis, hypercalcemia of malignancy and Paget disease?\nb) What is the first-line therapy in high-risk patients?", "top": true, "rep": "", "tag": "Final bank PHA W10", "bank": true, "expl": "Alendronate is a bisphosphonate: it binds bone and blocks osteoclast-mediated resorption, stimulating osteoblasts only indirectly, and its uses are Paget disease, osteoporosis, metastatic bone disease and hypercalcaemia. Calcium is only weakly anti-resorptive, and denosumab, a RANKL inhibitor, is the first-line drug in high-risk patients.", "type": "written", "keyhtml": "a) Bisphosphonates — alendronate:\n• Bind to bone and inhibit osteoclast-mediated bone resorption, while only indirectly stimulating osteoblast activity\n• Uses (POMH): Paget disease, osteoporosis, metastatic bone disease, hypercalcaemia\nb) Denosumab — a RANK ligand (RANKL) inhibitor (RANKL can no longer activate RANK on osteoclasts); first line in high-risk patients."}, "TP-027": {"id": "TP-027", "stem": "What is the mechanism of action of probenecid?", "top": true, "rep": "", "tag": "Final bank PHA W11", "bank": true, "expl": "Probenecid lowers urate by making the kidney excrete more of it. Allopurinol and febuxostat work the other way — they inhibit xanthine oxidase so less uric acid is made.", "type": "written", "keyhtml": "Probenecid is a uricosuric agent:\n• It inhibits the (re)absorption of uric acid in the proximal convoluted tubule (PCT) → ↑ uric acid excretion in the urine → ↓ serum urate\n• Use: chronic gout ('excrete more' uric acid) — it requires adequate renal function and is contraindicated with a history of nephrolithiasis"}, "TP-028": {"id": "TP-028", "stem": "Mention one pharmacological agent that could be used in the therapy of acute gouty arthritis.", "top": true, "rep": "", "tag": "Final bank PHA W12", "bank": true, "expl": "Acute gout is an interaction between neutrophils and urate crystals, so acute drugs calm the cells: NSAIDs and steroids (less toxic, so used more often) or colchicine. Urate-lowering drugs — allopurinol, febuxostat, probenecid — are for long-term prevention.", "type": "written", "keyhtml": "Any one of:\n• NSAIDs (e.g. indomethacin) — potentially less toxic than colchicine, so more commonly used in the acute attack\n• Corticosteroids (steroids) — also more commonly used, being less toxic\n• Colchicine — binds tubulin and depolymerizes microtubules → ↓ neutrophil migration into the joint and degranulation; used for relief (or prophylaxis) of the acute attack\n(Not xanthine oxidase inhibitors — ineffective in, and may aggravate, acute gout; not probenecid — used in chronic gout.)"}, "TP-061": {"id": "TP-061", "stem": "A 55-year-old male with recurrent gout is started on allopurinol to lower his uric acid. His doctor also prescribes a low dose of colchicine for the first six months of treatment. Why is colchicine co-prescribed when starting a urate-lowering therapy like allopurinol?", "top": true, "rep": "", "tag": "Final bank PHA Q52", "bank": true, "expl": "Colchicine is used for prophylaxis as well as relief of acute gout attacks, while xanthine oxidase inhibitors such as allopurinol are ineffective in, and may aggravate, acute gout. Low-dose colchicine therefore covers the start of urate-lowering therapy; none of the other options is a use of colchicine.", "type": "mcq", "opts": ["To increase the absorption of allopurinol", "To prevent an acute gout flare triggered by the rapid mobilization of urate crystals", "To protect the kidneys from allopurinol toxicity", "To treat the patient's underlying hypertension", "To prolong the duration of action of allopurinol"], "ans": 1}, "TP-097": {"id": "TP-097", "stem": "A patient has experienced three gout attacks in the last year. Their serum uric acid level is elevated. The physician wants to initiate long-term therapy to lower uric acid production.\na) Which medication acts by inhibiting the enzyme xanthine oxidase to decrease uric acid synthesis?\nb) What is the acute pharmacological management for this patient's condition? Name two classes of medications.", "top": true, "rep": "", "tag": "Final bank PHA W13", "bank": true, "expl": "Allopurinol and febuxostat inhibit xanthine oxidase, so less uric acid is made — chronic prevention only, as they may worsen an acute attack. The acute attack is treated with NSAIDs or steroids, which are less toxic than colchicine and so are used more often.", "type": "written", "keyhtml": "a) Allopurinol (febuxostat acts the same way) — a xanthine oxidase inhibitor → ↓ synthesis of uric acid; used for long-term prevention of gout (also urate nephrolithiasis and tumour lysis syndrome). It is ineffective in, and may aggravate, an acute attack.\nb) For the acute attack:\n• NSAIDs (e.g. indomethacin)\n• Corticosteroids (steroids)\nBoth are potentially less toxic than colchicine, so they are more commonly used; colchicine also relieves the acute attack."}, "TP-098": {"id": "TP-098", "stem": "A 70-year-old female, who recently suffered a vertebral compression fracture, has a DEXA scan revealing severe osteoporosis. She has no other significant medical history. What is the first-line class of drug therapy for this patient?", "top": true, "rep": "", "tag": "Final bank PHA W14", "bank": true, "expl": "Denosumab is the first-line in high-risk patients. It is a RANK ligand (RANKL) inhibitor: RANKL cannot activate RANK on osteoclasts.", "type": "written", "keyhtml": "RANK ligand (RANKL) inhibitor — denosumab.\nDenosumab is the first-line in high-risk patients.\n(RANKL cannot activate RANK on osteoclasts.)"}, "TP-122": {"id": "TP-122", "stem": "Why shouldn't xanthine oxidase inhibitors be used in acute gout?", "top": true, "rep": "", "tag": "Final bank PHA W16", "bank": true, "expl": "Xanthine oxidase inhibitors (allopurinol, febuxostat) reduce uric acid synthesis and are for chronic use, to prevent gout by lowering serum urate; they are ineffective in, and may aggravate, acute gout. The acute attack is treated by calming the cells — NSAIDs and steroids (less toxic, so more commonly used) or colchicine.", "type": "written", "keyhtml": "Because xanthine oxidase inhibitors (allopurinol, febuxostat) are for chronic use — long-term prevention of gout by lowering serum urate (↓ uric acid synthesis) — and they are ineffective in acute gout and may aggravate (worsen) it."}}, "labs": {}, "cards": [{"id": "PHA-L2-001", "text": "Osteoporosis = an imbalance in remodelling: a relative ↑ in {{c1::resorption}} not matched by a concomitant ↑ in {{c2::formation}}", "extra": "Osteoclasts dig, osteoblasts can't keep up.", "sec": "L2 Part 1 · Part 01 · Osteoporosis — definition"}, {"id": "PHA-L2-002", "text": "Osteoporotic bone matrix is {{c1::normally mineralized}} — there is simply {{c2::less bone}}", "extra": "", "sec": "L2 Part 1 · Part 01 · Osteoporosis — definition"}, {"id": "PHA-L2-003", "text": "Two ways to treat osteoporosis: {{c1::anti-resorptive}} drugs that hold back osteoclasts · the {{c2::anabolic}} drug that builds new bone", "extra": "", "sec": "L2 Part 1 · Part 01 · Osteoporosis — definition"}, {"id": "PHA-L2-004", "text": "Anti-resorptive osteoporosis drugs: {{c1::bisphosphonates}} · {{c2::calcitonin}} · {{c3::denosumab}} · {{c4::estrogen / SERMs}} · {{c5::calcium}}", "extra": "Every osteoporosis drug except teriparatide.", "sec": "L2 Part 1 · Part 01 · Osteoporosis — definition"}, {"id": "PHA-L2-005", "text": "Denosumab is a {{c1::RANK ligand (RANKL) inhibitor}} — RANKL can no longer activate {{c2::RANK}} on osteoclasts", "extra": "", "sec": "L2 Part 1 · Part 01 · 1.1 Where the osteoporosis drugs act"}, {"id": "PHA-L2-006", "text": "Denosumab (RANKL inhibitor) is used to treat {{c1::osteoporosis}}", "extra": "Not RA (that is anti-TNF) and not OA (treatment is palliative).", "sec": "L2 Part 1 · Part 01 · 1.1 Where the osteoporosis drugs act"}, {"id": "PHA-L2-007", "text": "First-line osteoporosis drug in high-risk patients: {{c1::denosumab}}", "extra": "", "sec": "L2 Part 1 · Part 01 · 1.1 Where the osteoporosis drugs act"}, {"id": "PHA-L2-008", "text": "Calcium is only a {{c1::weak}} anti-resorptive — it may reduce {{c2::negative calcium balance}} and so reduce bone resorption", "extra": "It supports — it doesn't replace — the main drugs.", "sec": "L2 Part 1 · Part 01 · 1.2 Calcium & vitamin D"}, {"id": "PHA-L2-009", "text": "Calcium in older age: can prevent bone loss in {{c1::postmenopausal women}}; linked to only a {{c2::mild}} ↓ in fracture risk", "extra": "", "sec": "L2 Part 1 · Part 01 · 1.2 Calcium & vitamin D"}, {"id": "PHA-L2-010", "text": "Vitamin D supplementation is recommended in {{c1::institutionalized elderly}} subjects", "extra": "The elderly may be vitamin D deficient.", "sec": "L2 Part 1 · Part 01 · 1.2 Calcium & vitamin D"}, {"id": "PHA-L2-011", "text": "Low vitamin D thins bone: ↓ gut {{c1::Ca²⁺ absorption}} → low Ca²⁺ → ↑ {{c2::PTH}} → Ca²⁺ mobilized from bone (reservoir depleted)", "extra": "", "sec": "L2 Part 1 · Part 01 · 1.2 Calcium & vitamin D"}, {"id": "PHA-L2-012", "text": "Drug class of alendronate, risedronate, ibandronate and zoledronate: {{c1::bisphosphonates}}", "extra": "All end in -dronate (also clodronate, etidronate, pamidronate, tiludronate). Fosamax = alendronate.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-013", "text": "Bisphosphonates bind to {{c1::bone}}, inhibit {{c2::osteoclast}}-mediated bone resorption and indirectly stimulate {{c3::osteoblast}} activity", "extra": "Concentrated under osteoclasts in newly mineralizing bone.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-014", "text": "Bisphosphonates cut resorption 3 ways: ↓ {{c1::activity of each osteoclast}} · ↓ {{c2::activation frequency}} (recruitment & differentiation of precursors) · ↑ {{c3::osteoclast apoptosis}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-015", "text": "Bisphosphonates ↓ the activity of each osteoclast by inhibiting {{c1::lysosomal enzymes}} and {{c2::lactate production}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-016", "text": "Bisphosphonate uses: {{c1::Paget disease}} · {{c2::osteoporosis}} · {{c3::metastatic bone disease}} · {{c4::hypercalcaemia}}", "extra": "Mnemonic: POMH.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-017", "text": "Bisphosphonate side effects — GI: {{c1::dyspepsia}} · {{c2::reflux oesophagitis}} · {{c3::peptic ulcers}} · {{c4::pill (corrosive) oesophagitis}}; other: {{c5::bone pain}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-018", "text": "Oral bisphosphonates must be used with caution in a patient with {{c1::erosive oesophagitis}}", "extra": "Pill (corrosive) oesophagitis is one of their side effects.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-019", "text": "Oral bisphosphonate counselling: take with a large amount of {{c1::water}} and remain {{c2::upright}} — to reduce the risk of {{c3::erosive (pill) oesophagitis}}", "extra": "Keeps the tablet out of the oesophagus.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-020", "text": "Monthly oral ibandronate: remain upright for at least {{c1::60 minutes}} after taking it", "extra": "Official key (GD revision Q12); the timing is not in the pamphlet.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision Q12 key)"}, {"id": "PHA-L2-021", "text": "Absorption of oral bisphosphonates is greatly impaired by {{c1::food or other medications}}", "extra": "Official key (GD revision Q19); not in the pamphlet. So not with juice or after meals.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision Q19 key)"}, {"id": "PHA-L2-022", "text": "Bisphosphonates are retained in the {{c1::skeleton}} for prolonged periods, so the usual {{c2::plasma pharmacokinetics}} do not apply to dosing", "extra": "A plasma half-life figure doesn't describe them.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-023", "text": "Bisphosphonate regimens run from {{c1::daily oral}} to {{c2::once-yearly I.V.}} — the drugs differ in {{c3::binding affinity to hydroxyapatite}} and potency", "extra": "Weekly / monthly oral and 3-monthly I.V. lie in between.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates"}, {"id": "PHA-L2-024", "text": "Inhibits osteoclastic more than osteoblastic activity; helps osteoporosis, hypercalcaemia of malignancy & Paget disease: {{c1::alendronate}}", "extra": "Official key (GD revision Q13): the bisphosphonate, not calcitonin.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision Q13 key)"}, {"id": "PHA-L2-025", "text": "Postmenopausal osteoporosis, no fractures, no other conditions (not high-risk) → most appropriate: {{c1::alendronate}} (oral bisphosphonate)", "extra": "Official key (GD revision Q20). Denosumab = first line only in high-risk patients.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision Q20 key)"}, {"id": "PHA-L2-026", "text": "Paget disease of bone = aggressive localized {{c1::osteoclastic}} activity followed by disorganized {{c2::osteoblastic}} repair", "extra": "Official GD case 2 key; the disease itself is taught in Pathology.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision case 2 key)"}, {"id": "PHA-L2-027", "text": "Paget disease drug therapy: {{c1::NSAIDs}} to control bone pain + {{c2::bisphosphonates}} to limit bone turnover", "extra": "GD case 2 key. Calcitonin also lists Paget disease among its uses.", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision case 2 key)"}, {"id": "PHA-L2-028", "text": "62-y woman, activity-related hip pain, bowed proximal femur with medullary expansion & cortical thickening, ↑ alkaline phosphatase, normal Ca²⁺ & PO₄³⁻ → {{c1::Paget disease of bone}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision case 2)"}, {"id": "PHA-L2-029", "text": "65-y woman, enlarged facial bones (esp. mandible), tight facial skin, facial tingling → {{c1::Paget disease}} → most helpful drug: {{c2::bisphosphonates}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.1 Bisphosphonates (GD revision Q18)"}, {"id": "PHA-L2-030", "text": "Calcitonin binds receptors on {{c1::osteoclasts}} and inhibits their action → ↓ bone resorption → ↓ blood {{c2::calcium and phosphate}}", "extra": "Calci-TONE-in tones down serum calcium.", "sec": "L2 Part 1 · Part 02 · 2.2 Calcitonin"}, {"id": "PHA-L2-031", "text": "Calcitonin in the kidney: ↓ reabsorption of {{c1::Ca²⁺ and phosphate}} in the {{c2::proximal}} tubules", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.2 Calcitonin"}, {"id": "PHA-L2-032", "text": "Calcitonin uses: {{c1::hypercalcaemia}} · {{c2::neoplasia}} · {{c3::Paget disease}} · {{c4::postmenopausal osteoporosis}} · {{c5::corticosteroid-induced osteoporosis}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.2 Calcitonin"}, {"id": "PHA-L2-033", "text": "Calcitonin side effects: {{c1::nausea}} · {{c2::vomiting}} · {{c3::tingling sensation in the hands}} · {{c4::unpleasant taste in the mouth}}", "extra": "", "sec": "L2 Part 1 · Part 02 · 2.2 Calcitonin"}, {"id": "PHA-L2-034", "text": "Opposite calcium effects — calcitonin: serum Ca²⁺ {{c1::falls::rises or falls}}; teriparatide: can cause {{c2::hypercalcaemia::hyper- or hypocalcaemia}}", "extra": "Classic exam trap.", "sec": "L2 Part 1 · Part 02 · 2.2 Calcitonin"}, {"id": "PHA-L2-035", "text": "Teriparatide = {{c1::recombinant parathyroid hormone}} (PTH analog)", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.1 Teriparatide (recombinant parathyroid hormone)"}, {"id": "PHA-L2-036", "text": "The only anabolic (bone-forming) osteoporosis drug: {{c1::teriparatide}}", "extra": "One builder — every other osteoporosis drug is anti-resorptive.", "sec": "L2 Part 1 · Part 03 · 3.1 Teriparatide (recombinant parathyroid hormone)"}, {"id": "PHA-L2-037", "text": "Teriparatide acts on {{c1::osteoblasts}} through the {{c2::Wnt}} (anabolic) pathway → new bone formation", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.1 Teriparatide (recombinant parathyroid hormone)"}, {"id": "PHA-L2-038", "text": "Teriparatide acts through a {{c1::G protein–coupled}} receptor: stimulates Ca²⁺ absorption in the renal {{c2::distal convoluted tubules}} and Ca²⁺ release from bone", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.1 Teriparatide (recombinant parathyroid hormone)"}, {"id": "PHA-L2-039", "text": "Teriparatide builds new bone → ↑ {{c1::BMD}} and ↓ risk of {{c2::vertebral and hip}} fracture", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.1 Teriparatide (recombinant parathyroid hormone)"}, {"id": "PHA-L2-040", "text": "Teriparatide side effects: {{c1::nausea}} · {{c2::headache}} · {{c3::dizziness}} · {{c4::hypercalcaemia}} · {{c5::leg cramps}}", "extra": "Leg cramps → teriparatide; blood clots → SERMs.", "sec": "L2 Part 1 · Part 03 · 3.1 Teriparatide (recombinant parathyroid hormone)"}, {"id": "PHA-L2-041", "text": "Estrogen ↓ {{c1::osteoclastogenesis}} by ↓ production of cytokines such as {{c2::IL-1}} and {{c3::RANK}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.2 Role of estrogen"}, {"id": "PHA-L2-042", "text": "In the past, {{c1::estrogen replacement therapy}} was the first-choice osteoporosis treatment in most {{c2::perimenopausal}} women", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.2 Role of estrogen"}, {"id": "PHA-L2-043", "text": "Long-term estrogen is linked to adverse {{c1::cardiovascular}} effects and a possible ↑ risk of {{c2::breast cancer}} → led to the development of {{c3::SERMs}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.2 Role of estrogen"}, {"id": "PHA-L2-044", "text": "Estrogen on osteoclasts: {{c1::↑::↑ or ↓}} apoptosis · ↓ {{c2::RANKL-induced differentiation}} → ↓ bone resorption", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.2 Role of estrogen"}, {"id": "PHA-L2-045", "text": "Estrogen on osteoblasts: {{c1::↓::↑ or ↓}} apoptosis · ↓ oxidative stress · ↓ {{c2::NF-κB}} activity → maintenance of bone formation", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.2 Role of estrogen"}, {"id": "PHA-L2-046", "text": "Estrogen on osteocytes: ↓ apoptosis → ↓ activation of {{c1::bone remodelling}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.2 Role of estrogen"}, {"id": "PHA-L2-047", "text": "Examples of SERMs (selective estrogen-receptor modulators): {{c1::raloxifene}} · {{c2::tamoxifen}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-048", "text": "Unique property of SERMs: estrogen {{c1::agonists}} in some tissues and {{c2::antagonists}} in others", "extra": "They act through estrogen receptors — not by aromatase inhibition.", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-049", "text": "SERM action — bone: {{c1::agonist::agonist or antagonist}} · cardiovascular system: {{c2::agonist::agonist or antagonist}} · breast: {{c3::antagonist::agonist or antagonist}} · uterus: {{c4::antagonist::agonist or antagonist}}", "extra": "Bone & Blood vessels say YES · Breast & womb say NO (tamoxifen: a partial 'yes' in the womb).", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-050", "text": "SERMs also inhibit {{c1::cytokines}} and {{c2::osteoclast recruitment}}, and block {{c3::PTH}}'s bone-resorbing, calcium-mobilizing action", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-051", "text": "SERM uses: {{c1::osteoporosis prevention}} · {{c2::breast cancer}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-052", "text": "SERM side effects: {{c1::hot flashes}} (vasomotor symptoms, flushing) · ↑ risk of {{c2::DVT}} and {{c3::pulmonary embolism}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-053", "text": "Tamoxifen is contraindicated in patients with a history of {{c1::DVT or pulmonary embolism}}", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-054", "text": "Tamoxifen may ↑ the risk of {{c1::endometrial carcinoma}} via its {{c2::partial agonist}} effect", "extra": "", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-055", "text": "Tamoxifen partial-agonist effects: ↑ {{c1::thromboembolism}} · ↑ {{c2::uterine cancer}} · prevents {{c3::bone demineralization}} · {{c4::favourable lipid}} patterns", "extra": "Its competitive antagonism in the breast → inhibition of tumour growth.", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs)"}, {"id": "PHA-L2-056", "text": "Postmenopausal osteoporosis (GD case 5): long-term HRT a safe strategy? {{c1::No}} · alternative: {{c2::SERMs}} · first line in high-risk patients: {{c3::denosumab}}", "extra": "HRT: cardiovascular adverse effects + possible ↑ breast cancer.", "sec": "L2 Part 1 · Part 03 · 3.3 Selective estrogen-receptor modulators (SERMs) (GD revision case 5 key)"}, {"id": "PHA-L2-057", "text": "Osteoarthritis ({{c1::degenerative joint disease}}) is the most common {{c2::non-inflammatory}} disorder of movable joints", "extra": "", "sec": "L2 Part 1 · Part 04 · 4.1 Classification of joint disorders"}, {"id": "PHA-L2-058", "text": "Major types of inflammatory arthritis: {{c1::rheumatoid}} · {{c2::gouty}} · {{c3::infectious (septic)}} arthritis", "extra": "Osteoarthritis is non-inflammatory.", "sec": "L2 Part 1 · Part 04 · 4.1 Classification of joint disorders"}, {"id": "PHA-L2-059", "text": "Causes of inflammatory joint disease: {{c1::infection}} · {{c2::injury}} · {{c3::genetic factors}} · {{c4::autoimmunity}}", "extra": "", "sec": "L2 Part 1 · Part 04 · 4.1 Classification of joint disorders"}, {"id": "PHA-L2-060", "text": "TNF-α antagonists (biological therapy): {{c1::adalimumab}} · {{c2::certolizumab}} · {{c3::etanercept}} · {{c4::golimumab}} · {{c5::infliximab}}", "extra": "A Certain Elephant Got Infected — so screen for TB.", "sec": "L2 Part 1 · Part 04 · 4.2 TNF-α antagonists"}, {"id": "PHA-L2-061", "text": "Infliximab is useful in RA because it binds and blocks the inflammatory cytokine {{c1::TNF-α}}", "extra": "Methotrexate and leflunomide are DMARDs that don't bind TNF-α.", "sec": "L2 Part 1 · Part 04 · 4.2 TNF-α antagonists"}, {"id": "PHA-L2-062", "text": "TNF-α antagonist uses: {{c1::rheumatoid arthritis}} · {{c2::psoriasis}} · {{c3::psoriatic arthritis}} · {{c4::ankylosing spondylitis}}", "extra": "", "sec": "L2 Part 1 · Part 04 · 4.2 TNF-α antagonists"}, {"id": "PHA-L2-063", "text": "TNF-α antagonist side effects: {{c1::hypersensitivity}} · {{c2::infection}} · {{c3::exacerbation of heart failure}} · {{c4::neuropathy}} · {{c5::malignancy}} risk", "extra": "", "sec": "L2 Part 1 · Part 04 · 4.2 TNF-α antagonists"}, {"id": "PHA-L2-064", "text": "Before starting a TNF-α antagonist (e.g. infliximab), test for {{c1::latent tuberculosis}} — these drugs can {{c2::reactivate}} it", "extra": "", "sec": "L2 Part 1 · Part 04 · 4.2 TNF-α antagonists"}, {"id": "PHA-L2-065", "text": "Actions of TNF-α: {{c1::bone resorption}} · {{c2::fever}} · {{c3::acute-phase proteins}} · {{c4::lymphocyte activation}} · {{c5::endothelial activation}}", "extra": "", "sec": "L2 Part 1 · Part 04 · 4.2 TNF-α antagonists"}, {"id": "PHA-L2-066", "text": "Osteoarthritis: destruction of {{c1::articular cartilage}} in weight-bearing joints and fingers — the most common joint disease", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated"}, {"id": "PHA-L2-067", "text": "Osteoarthritis occurs with {{c1::ageing}}, or with {{c2::trauma}} in younger people", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated"}, {"id": "PHA-L2-068", "text": "Drug treatment of osteoarthritis is largely {{c1::palliative}} — analgesic and anti-inflammatory therapies", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated"}, {"id": "PHA-L2-069", "text": "In osteoarthritis, surgical insertion of {{c1::prosthetic joints}}, particularly {{c2::hips and knees}}, is common and effective", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated"}, {"id": "PHA-L2-070", "text": "55-y slightly obese woman: 3 y of worsening pain in both knees, ~20 min morning stiffness, worse walking & on stairs, relieved by rest → {{c1::osteoarthritis}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated (GD revision case 4)"}, {"id": "PHA-L2-071", "text": "Oral osteoarthritis drugs: {{c1::analgesics (paracetamol)}} · {{c2::NSAIDs}} · {{c3::COX-2 selective NSAIDs}} · {{c4::glucosamine & chondroitin sulphate}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated"}, {"id": "PHA-L2-072", "text": "Topical / injectable osteoarthritis therapies: {{c1::capsaicin}} · {{c2::anti-inflammatory gels}} · {{c3::intra-articular hyaluronan}} · {{c4::intra- / periarticular corticosteroids}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.1 Osteoarthritis — what is being treated"}, {"id": "PHA-L2-073", "text": "Paracetamol in osteoarthritis: {{c1::regular}} oral use gives adequate pain control; {{c2::intermittent}} use helps activity-related pain", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-074", "text": "Paracetamol + NSAID in osteoarthritis: added pain relief, and may lower overall {{c1::NSAID use}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-075", "text": "NSAIDs in osteoarthritis: {{c1::individual variability}} in efficacy and toxicity → worth trying several NSAID regimens", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-076", "text": "NSAIDs are often preferred over paracetamol for {{c1::short-term}} osteoarthritis relief — but {{c2::side effects}} are common", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-077", "text": "NSAID side effects are common particularly in the {{c1::elderly}}, in {{c2::reduced renal function}} and in patients taking {{c3::antihypertensives}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-078", "text": "NSAIDs in osteoarthritis: all guidelines — the {{c1::lowest dose}} for the {{c2::shortest duration}} possible; long-term NSAIDs not recommended", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-079", "text": "Elderly OA patient with reduced renal function, on antihypertensives — most appropriate long-term drug: {{c1::regular oral paracetamol}}", "extra": "Avoid long-term NSAIDs; never oral steroids in OA.", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-080", "text": "Selective COX-2 inhibitors (e.g. {{c1::celecoxib}}) appear to have {{c2::equivalent}} efficacy to the available NSAIDs", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs"}, {"id": "PHA-L2-081", "text": "Selective COX-2 inhibitors — weigh benefit vs risk: {{c1::less GI toxicity}} vs ↑ risk of {{c2::cardiovascular events}}", "extra": "GD case 4 key; the pamphlet shows only a benefit / risk scale.", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs (GD revision case 4 key)"}, {"id": "PHA-L2-082", "text": "OA patient on naproxen: a {{c1::proton pump inhibitor}} is added to protect the stomach — naproxen is a {{c2::non-selective}} NSAID (↑ GI risk)", "extra": "GD case 4 key; not in the pamphlet.", "sec": "L2 Part 1 · Part 05 · 5.2 Oral therapy — paracetamol & NSAIDs (GD revision case 4 key)"}, {"id": "PHA-L2-083", "text": "Glucosamine & chondroitin sulphate are produced from {{c1::marine fish}} and {{c2::mammalian cartilage}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.3 Glucosamine & chondroitin sulphate"}, {"id": "PHA-L2-084", "text": "Glucosamine & chondroitin: symptom relief {{c1::equivalent to NSAIDs}} with {{c2::greatly reduced}} adverse effects", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.3 Glucosamine & chondroitin sulphate"}, {"id": "PHA-L2-085", "text": "Glucosamine & chondroitin need {{c1::3–6 weeks}} to provide benefit, but can have a {{c2::sustained effect after cessation}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.3 Glucosamine & chondroitin sulphate"}, {"id": "PHA-L2-086", "text": "Long-term ({{c1::2–3 years}}) glucosamine & chondroitin is linked to slower cartilage degeneration — but it is {{c2::not yet a proven}} disease-modifying agent", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.3 Glucosamine & chondroitin sulphate"}, {"id": "PHA-L2-087", "text": "Glucosamine & chondroitin: an {{c1::anabolic}} effect on cartilage + an {{c2::anti-inflammatory}} effect", "extra": "NSAID-like relief without NSAID-like toxicity, but slow to start.", "sec": "L2 Part 1 · Part 05 · 5.3 Glucosamine & chondroitin sulphate"}, {"id": "PHA-L2-088", "text": "Topical anti-inflammatory gels & creams in osteoarthritis: {{c1::small}} improvements in pain and stiffness", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-089", "text": "Corticosteroids in osteoarthritis — oral: {{c1::never used}} · topical: {{c2::no role}} · soft-tissue & intra-articular injection: {{c3::widely used}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-090", "text": "Intra-articular corticosteroid in osteoarthritis: relief usually lasts {{c1::6–8 weeks}}; the response {{c2::wanes}} with repeated injections", "extra": "GD case 4 notes give a wider range: a few days to > 6 months.", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-091", "text": "Early knee osteoarthritis: infiltrating the painful region with {{c1::steroid}} + {{c2::local anaesthetic}} may improve symptoms", "extra": "A peripatellar steroid + anaesthetic injection may also relieve pain.", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-092", "text": "Hyaluronan is the main component of normal {{c1::synovial fluid}}; osteoarthritis degrades it → ↓ {{c2::elasticity & viscosity}}", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-093", "text": "Viscosupplementation = intra-articular {{c1::hyaluronan}}, given as {{c2::3–5}} weekly injections", "extra": "", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-094", "text": "Intra-articular hyaluronan ↓ pain & stiffness and improves physical disability for an average of {{c1::6 months}}", "extra": "GD case 4 notes: 6 months to 1 year, repeated every 4–6 months.", "sec": "L2 Part 1 · Part 05 · 5.4 Topical & injectable therapy"}, {"id": "PHA-L2-095", "text": "Gout: a metabolic condition with ↑ blood {{c1::uric acid}}, deposited as {{c2::sodium urate crystals}} in distal joints and other tissues", "extra": "", "sec": "L2 Part 2 · Part 01 · 1.1 What gout is"}, {"id": "PHA-L2-096", "text": "Main cause of hyperuricaemia in gout: {{c1::under-excretion}} of uric acid; overproduction is {{c2::less common}}", "extra": "Classic exam trap.", "sec": "L2 Part 2 · Part 01 · 1.1 What gout is"}, {"id": "PHA-L2-097", "text": "Causes of uric acid overproduction: {{c1::inborn errors of metabolism}} · ↑ availability of {{c2::purines}}", "extra": "", "sec": "L2 Part 2 · Part 01 · 1.1 What gout is"}, {"id": "PHA-L2-098", "text": "Gouty arthritis: hyperuricaemia + recurrent attacks of acute arthritis caused by deposition of {{c1::monosodium urate}} crystals", "extra": "", "sec": "L2 Part 2 · Part 01 · 1.2 Gouty arthritis"}, {"id": "PHA-L2-099", "text": "Gout crystal deposits (tophi) may be seen in {{c1::soft tissue}} and in the {{c2::kidney}} (urolithiasis)", "extra": "", "sec": "L2 Part 2 · Part 01 · 1.2 Gouty arthritis"}, {"id": "PHA-L2-100", "text": "Acute gout: an interaction between the inflammatory system — particularly {{c1::neutrophils}} — and monosodium urate crystals", "extra": "", "sec": "L2 Part 2 · Part 01 · 1.2 Gouty arthritis"}, {"id": "PHA-L2-101", "text": "45-y man: 2 days of painful, swollen, red knee, no trauma, afebrile, effusion on X-ray; similar attack in the 1st MTP joint 3 y ago → {{c1::acute gout (gouty arthritis)}}", "extra": "", "sec": "L2 Part 2 · Part 01 · 1.2 Gouty arthritis (GD revision case 1)"}, {"id": "PHA-L2-102", "text": "Gout drug targets — acute attack: the {{c1::neutrophil}}; prevention: the {{c2::serum urate}} level", "extra": "Acute → calm the cells · chronic → cut the urate.", "sec": "L2 Part 2 · Part 01 · 1.2 Gouty arthritis"}, {"id": "PHA-L2-103", "text": "Colchicine binds {{c1::tubulin}} → depolymerizes {{c2::microtubules}} → prevents neutrophil migration into the joint and interferes with motility & {{c3::degranulation}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.1 Colchicine"}, {"id": "PHA-L2-104", "text": "Colchicine use: {{c1::prophylaxis}} or {{c2::relief}} of an acute gout attack", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.1 Colchicine"}, {"id": "PHA-L2-105", "text": "Colchicine side effects: {{c1::GI disturbances}} (nausea, vomiting, abdominal pain) · {{c2::hepatic toxicity}} · rarely {{c3::neuromyotoxicity}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.1 Colchicine"}, {"id": "PHA-L2-106", "text": "Colchicine causes severe {{c1::diarrhoea}} and {{c2::GI haemorrhage}} with large doses — or with standard doses in {{c3::renal insufficiency}}", "extra": "So in renal insufficiency, treat acute gout with NSAIDs or steroids instead.", "sec": "L2 Part 2 · Part 02 · 2.1 Colchicine"}, {"id": "PHA-L2-107", "text": "Colchicine also blocks {{c1::mitosis}} → concerns about {{c2::fertility & pregnancy}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.1 Colchicine"}, {"id": "PHA-L2-108", "text": "Allopurinol and febuxostat: {{c1::xanthine oxidase}} inhibitors → ↓ {{c2::synthesis}} of uric acid", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat"}, {"id": "PHA-L2-109", "text": "Allopurinol blocks xanthine oxidase at two steps: {{c1::hypoxanthine → xanthine}} and {{c2::xanthine → uric acid}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat (GD revision case 1 key)"}, {"id": "PHA-L2-110", "text": "Allopurinol uses: long-term prevention of {{c1::gout}} + prevention of {{c2::urate nephrolithiasis}} and {{c3::tumour lysis syndrome}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat"}, {"id": "PHA-L2-111", "text": "Allopurinol side effects: {{c1::GI disturbances}} · {{c2::LFT abnormalities}} · {{c3::allergic skin reactions}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat"}, {"id": "PHA-L2-112", "text": "Febuxostat: use = {{c1::long-term prevention of gout}}; side effects = GI disturbances & {{c2::LFT abnormalities}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat"}, {"id": "PHA-L2-113", "text": "Look-alike XO inhibitors: the one also used for urate stones & tumour lysis syndrome, and the only one listing allergic skin reactions: {{c1::allopurinol}}", "extra": "Febuxostat: long-term gout prevention only; GI & LFT side effects.", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat"}, {"id": "PHA-L2-114", "text": "Xanthine oxidase inhibitors are {{c1::ineffective}} in, and may {{c2::aggravate}}, an acute gout attack", "extra": "For chronic use only — to lower serum urate.", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat"}, {"id": "PHA-L2-115", "text": "Urate-lowering drug started after the acute attack — serum ↓, urine ↑ uric acid: {{c1::probenecid}}; serum ↓, urine ↓ uric acid: {{c2::allopurinol}}", "extra": "Uricosuric pushes urate into the urine; the XO inhibitor makes less of it.", "sec": "L2 Part 2 · Part 02 · 2.2 Xanthine oxidase inhibitors — allopurinol, febuxostat (GD revision Q16 · Formative 3 Q23 keys)"}, {"id": "PHA-L2-116", "text": "Probenecid: drug class = {{c1::uricosuric}} agent", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.3 Probenecid — uricosuric agent"}, {"id": "PHA-L2-117", "text": "Probenecid inhibits uric acid (re)absorption in the {{c1::proximal convoluted tubule}} → ↑ uric acid excretion", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.3 Probenecid — uricosuric agent"}, {"id": "PHA-L2-118", "text": "Probenecid use: {{c1::chronic}} gout", "extra": "Not for the acute attack.", "sec": "L2 Part 2 · Part 02 · 2.3 Probenecid — uricosuric agent"}, {"id": "PHA-L2-119", "text": "Probenecid requires adequate {{c1::renal function}} and is contraindicated with a history of {{c2::nephrolithiasis}}", "extra": "Needs working kidneys without stones.", "sec": "L2 Part 2 · Part 02 · 2.3 Probenecid — uricosuric agent"}, {"id": "PHA-L2-120", "text": "Probenecid side effects: {{c1::dyspepsia}} · {{c2::peptic ulceration}} · occasional hypersensitivity as {{c3::skin rashes}}", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.3 Probenecid — uricosuric agent"}, {"id": "PHA-L2-121", "text": "Probenecid ↑ plasma {{c1::penicillin}} levels — prescribe that antibiotic with care", "extra": "Pee out urate, keep in penicillin.", "sec": "L2 Part 2 · Part 02 · 2.3 Probenecid — uricosuric agent"}, {"id": "PHA-L2-122", "text": "Drugs for an acute gout attack: {{c1::NSAIDs}} · {{c2::steroids}} · {{c3::colchicine}}", "extra": "Acute → calm the cells.", "sec": "L2 Part 2 · Part 02 · 2.4 Acute attack vs long-term prevention"}, {"id": "PHA-L2-123", "text": "Long-term gout prevention — make less uric acid: {{c1::allopurinol}} / {{c2::febuxostat}}; excrete more: {{c3::probenecid}}", "extra": "Chronic → cut the urate.", "sec": "L2 Part 2 · Part 02 · 2.4 Acute attack vs long-term prevention"}, {"id": "PHA-L2-124", "text": "Acute gout — colchicine is {{c1::more::more or less}} toxic; NSAIDs & steroids are {{c2::less::more or less}} toxic, so they are used more commonly", "extra": "", "sec": "L2 Part 2 · Part 02 · 2.4 Acute attack vs long-term prevention"}, {"id": "PHA-L2-125", "text": "Most widely used agent for acute gouty arthritis: an NSAID, e.g. {{c1::indomethacin}}", "extra": "Formative 3 Q3 key; indomethacin is an NSAID (Lecture 1).", "sec": "L2 Part 2 · Part 02 · 2.4 Acute attack vs long-term prevention (Formative 3 Q3 key)"}, {"id": "PHA-L2-126", "text": "49-y alcoholic man, 2 days of severe pain, redness & swelling of the 1st MTP joint, no trauma, afebrile → {{c1::acute gout}} → most appropriate drug: {{c2::indomethacin}}", "extra": "Not allopurinol or probenecid — they are for long-term prevention.", "sec": "L2 Part 2 · Part 02 · 2.4 Acute attack vs long-term prevention (GD revision Q15 key)"}, {"id": "PHA-L2-127", "text": "Least likely to acutely improve a gout flare (vs naproxen, colchicine, prednisone): {{c1::probenecid}}", "extra": "A uricosuric for chronic gout.", "sec": "L2 Part 2 · Part 02 · 2.4 Acute attack vs long-term prevention (GD revision Q22 key)"}, {"id": "PHA-L2-128", "text": "Rheumatoid arthritis: an {{c1::autoimmune}} disease that causes chronic {{c2::destructive}} inflammation in joints", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.1 Rheumatoid arthritis"}, {"id": "PHA-L2-129", "text": "RA aetiology (thought {{c1::T cell}}–mediated): circulating {{c2::rheumatoid factors}} → {{c3::immune-complex}} deposition → synovial inflammation", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.1 Rheumatoid arthritis"}, {"id": "PHA-L2-130", "text": "Four RA drug groups: {{c1::paracetamol & NSAIDs}} · {{c2::steroids}} · {{c3::DMARDs}} · {{c4::biological therapies}}", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.2 Drugs used in the treatment of RA"}, {"id": "PHA-L2-131", "text": "RA drug goals — paracetamol & NSAIDs: {{c1::pain relief}} · steroids: {{c2::control flare-ups}} · DMARDs: {{c3::control symptoms & slow structural damage}} · biologicals: {{c4::halt or reverse bone erosion}}", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.2 Drugs used in the treatment of RA"}, {"id": "PHA-L2-132", "text": "Steroids in RA can be given {{c1::orally}}, as {{c2::intra-articular}} injections or as {{c3::intramuscular depot}} injections", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.2 Drugs used in the treatment of RA"}, {"id": "PHA-L2-133", "text": "RA order of use — 1st line, fast-acting pain relief: {{c1::NSAIDs}}; bridge therapy: {{c2::corticosteroids}}; 2nd line, slow-acting DMARD: {{c3::methotrexate}}", "extra": "The steroid bridges the gap until the slow DMARD works.", "sec": "L2 Part 2 · Part 03 · 3.2 Drugs used in the treatment of RA"}, {"id": "PHA-L2-134", "text": "RA treatment pyramid — base: {{c1::physiotherapy / OT / rest / education}} → NSAID / analgesia → prednisone → DMARD", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.2 Drugs used in the treatment of RA"}, {"id": "PHA-L2-135", "text": "RA — paracetamol: {{c1::no anti-inflammatory effect}} (pain relief only); NSAIDs: ↓ joint inflammation by inhibiting inflammatory {{c2::cyclooxygenase}} products", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.3 Analgesics & NSAIDs in RA"}, {"id": "PHA-L2-136", "text": "Paracetamol in RA: every {{c1::4–6 hours}} for pain if necessary; {{c2::seldom}} produces side effects (well tolerated)", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.3 Analgesics & NSAIDs in RA"}, {"id": "PHA-L2-137", "text": "NSAIDs in RA act within {{c1::hours to a few days}}, ↓ joint pain, stiffness and swelling", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.3 Analgesics & NSAIDs in RA"}, {"id": "PHA-L2-138", "text": "NSAIDs in RA do not prevent {{c1::joint erosions or damage}}, and their effect {{c2::rapidly reverses}} on stopping", "extra": "Symptomatic relief only.", "sec": "L2 Part 2 · Part 03 · 3.3 Analgesics & NSAIDs in RA"}, {"id": "PHA-L2-139", "text": "Where they block arachidonic acid metabolism — corticosteroids: {{c1::phospholipase A2}}; NSAIDs: {{c2::COX-1 / COX-2}}", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.3 Analgesics & NSAIDs in RA"}, {"id": "PHA-L2-140", "text": "RA drugs that induce remission and prevent joint destruction: {{c1::DMARDs}} and {{c2::biological therapy}}", "extra": "Analgesics relieve pain; NSAIDs & steroids only reduce inflammation.", "sec": "L2 Part 2 · Part 03 · 3.4 Principles of drug treatment in RA"}, {"id": "PHA-L2-141", "text": "NSAID cardiovascular risk, particularly COX-2 selective inhibitors: {{c1::rofecoxib}} was withdrawn from the market", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.4 Principles of drug treatment in RA"}, {"id": "PHA-L2-142", "text": "RA patient on naproxen still referred for a DMARD: NSAIDs give {{c1::symptomatic relief only}} (no protection from erosions), and DMARDs are started under a {{c2::rheumatologist}}", "extra": "", "sec": "L2 Part 2 · Part 03 · 3.4 Principles of drug treatment in RA (GD revision case 3 key)"}, {"id": "PHA-L2-143", "text": "Most commonly used corticosteroid in RA: oral {{c1::prednisone}}, {{c2::4–5}} times as potent as cortisol", "extra": "Its effect in RA at high doses is dramatic.", "sec": "L2 Part 2 · Part 04 · 4.1 Corticosteroids — the drug & its mechanism"}, {"id": "PHA-L2-144", "text": "Corticosteroids bind {{c1::cytoplasmic}} receptors → transported into the {{c2::nucleus}} → interfere with {{c3::RNA processing}} of proteins", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.1 Corticosteroids — the drug & its mechanism"}, {"id": "PHA-L2-145", "text": "Corticosteroid anti-inflammatory actions: inhibit {{c1::leukocyte chemotaxis}} · ↓ {{c2::vascular permeability}} · inhibit production of {{c3::cytokines & arachidonic acid metabolites}}", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.1 Corticosteroids — the drug & its mechanism"}, {"id": "PHA-L2-146", "text": "Corticosteroid toxicity is {{c1::dose}}- and {{c2::time}}-related — toxic at high doses for prolonged periods", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.1 Corticosteroids — the drug & its mechanism"}, {"id": "PHA-L2-147", "text": "Corticosteroid side effects in RA: {{c1::cataract}} · {{c2::hypertension}} · {{c3::osteoporosis}} · {{c4::infections}} · {{c5::diabetogenic}}", "extra": "CHOID.", "sec": "L2 Part 2 · Part 04 · 4.2 Side effects in RA"}, {"id": "PHA-L2-148", "text": "Steroid side-effect routes: osteoporosis → eventual {{c1::non-traumatic fractures}} · salt & water {{c2::retention}} → hypertension · interfere with {{c3::lens}} metabolism → cataract", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.2 Side effects in RA"}, {"id": "PHA-L2-149", "text": "Corticosteroids ↑ susceptibility to bacterial and opportunistic infections, e.g. {{c1::herpes zoster}} and {{c2::fungal}} infections", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.2 Side effects in RA"}, {"id": "PHA-L2-150", "text": "Limiting corticosteroid toxicity: {{c1::shortest time, lowest dose}} · {{c2::intermittent high-dose pulses}} · {{c3::intra-articular depot}} injection · {{c4::drugs to protect bone}}", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.3 How to limit corticosteroid toxicity"}, {"id": "PHA-L2-151", "text": "Corticosteroid pulse therapy in RA: monthly I.V. {{c1::methylprednisolone}}", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.3 How to limit corticosteroid toxicity"}, {"id": "PHA-L2-152", "text": "Bone protection on long-term steroids: {{c1::vitamin D & calcium}} · {{c2::bisphosphonates}}", "extra": "", "sec": "L2 Part 2 · Part 04 · 4.3 How to limit corticosteroid toxicity"}, {"id": "PHA-L2-153", "text": "Intra-articular depot corticosteroid: a {{c1::local}} way to limit steroid toxicity, but its relief is only {{c2::temporary}}", "extra": "GD case 3: persistent knee synovitis despite repeated depot injections.", "sec": "L2 Part 2 · Part 04 · 4.3 How to limit corticosteroid toxicity (GD revision case 3 key)"}, {"id": "PHA-L2-154", "text": "DMARDs: disparate compounds sharing the potential to {{c1::retard the development of bony erosions}} in RA", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-155", "text": "Classic DMARDs: {{c1::gold compounds}} (sodium aurothiomalate) · {{c2::sulfasalazine}} · the antimalarial {{c3::hydroxychloroquine}} · {{c4::D-penicillamine}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-156", "text": "Immunosuppressive DMARDs: {{c1::methotrexate}} · {{c2::azathioprine}} · {{c3::cyclophosphamide}} · {{c4::cyclosporin}} · {{c5::leflunomide}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-157", "text": "Methotrexate: {{c1::folic acid antagonist}}; leflunomide: {{c2::pyrimidine antagonist}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-158", "text": "Azathioprine: {{c1::antimetabolite}}; cyclophosphamide: {{c2::alkylating agent}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-159", "text": "Most widely prescribed DMARD: {{c1::methotrexate}}", "extra": "Methotrexate = the Main one.", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-160", "text": "DMARDs: {{c1::no single}} mechanism by which they work", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-161", "text": "Onset — NSAIDs & steroids: {{c1::hours to days}}; DMARDs: {{c2::weeks to months}}", "extra": "DMARDs are Slow but Structure-Saving.", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-162", "text": "All DMARDs have potential toxicity → careful, regular {{c1::monitoring}}; initiation under the guidance of a {{c2::rheumatologist}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-163", "text": "DMARD {{c1::combinations}} with different mechanisms & toxicity profiles are superior to single agents", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs)"}, {"id": "PHA-L2-164", "text": "RA case (GD 3): sulfasalazine — a {{c1::classic DMARD}} — is added despite a good prednisone response, as it {{c2::retards bony erosions}}; regular {{c3::blood counts}} monitor its toxicity", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.1 Disease-modifying anti-rheumatic drugs (DMARDs) (GD revision case 3 key)"}, {"id": "PHA-L2-165", "text": "Biological RA treatments — monoclonal antibodies against {{c1::B cells}} or against inflammatory cytokines, e.g. {{c2::TNF-α}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.2 Biological treatments"}, {"id": "PHA-L2-166", "text": "Soluble cytokine receptors / antagonists in RA: soluble {{c1::TNF}} receptors · {{c2::IL-1}} receptor antagonists · {{c3::IL-6}} receptor", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.2 Biological treatments"}, {"id": "PHA-L2-167", "text": "Adalimumab, infliximab, etanercept: block {{c1::TNF-α}}; anakinra: recombinant human {{c2::IL-1 antagonist}}", "extra": "", "sec": "L2 Part 2 · Part 05 · 5.2 Biological treatments"}, {"id": "PHA-L2-168", "text": "Limitations of biological therapy: {{c1::high cost}} · uncertainty about {{c2::long-term safety}}", "extra": "Yet highly effective at suppressing inflammation and preventing bony erosions.", "sec": "L2 Part 2 · Part 05 · 5.2 Biological treatments"}, {"id": "PHA-L2-169", "text": "Septic arthritis / osteomyelitis: start a provisional ('{{c1::best guess}}') antibiotic; the precise choice depends on {{c2::antibiotic sensitivity}}", "extra": "", "sec": "L2 Part 2 · Part 06 · 6.1 Antibiotic therapy"}, {"id": "PHA-L2-170", "text": "Child with suspected acute osteomyelitis or septic arthritis: start an {{c1::anti-staphylococcal bactericidal}} antibiotic", "extra": "", "sec": "L2 Part 2 · Part 06 · 6.1 Antibiotic therapy"}, {"id": "PHA-L2-171", "text": "Septic arthritis / osteomyelitis: prolonged {{c1::I.V.}} antibiotics are not supported — switch to oral once the patient feels better and eats, usually within {{c2::3 days}}", "extra": "", "sec": "L2 Part 2 · Part 06 · 6.1 Antibiotic therapy"}, {"id": "PHA-L2-172", "text": "Total antibiotic course in septic arthritis / osteomyelitis: {{c1::3 weeks}} — probably adequate to minimize recurrence", "extra": "3 & 3 rule: 3 days to oral · 3 weeks in total.", "sec": "L2 Part 2 · Part 06 · 6.1 Antibiotic therapy"}], "pracs": [], "lib": "msk.html", "prev": {"href": "pha-l1.html", "title": "Lecture 1 · Muscle Pain"}, "next": null, "coverImg": "covers/Pharmacology.jpg", "searchHint": "e.g. NF-κB, synthesis, hypertension"};

    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};
H.recall = b => {
  const st = S.labs[b.id] || {}, rv = st.r || {}; let n = 0, k = 0;
  const body = b.groups.map(g => `<div class="rcg">${esc(g.title)}</div>` + g.items.map(it => { const i = n++, on = !!rv[i]; if (on) k++;
    return `<button class="rci ${on ? 'on' : ''}" data-act="rcv" data-l="${b.id}" data-i="${i}"><span class="cue">${it[0]}</span>${it[1] ? ` <span class="${on ? '' : 'hid'}">${it[1]}</span>` : ''}</button>`; }).join('')).join('');
  return `<div class="labh"><span class="lb">LAB</span><h3>${esc(b.title)}</h3></div>
    <p class="labi">Say the rest of each line out loud, then tap it to check. Tap again to cover it. <b>${k}/${n}</b> uncovered.</p>
    <div class="modes"><button class="mini" data-act="rcall" data-l="${b.id}" data-n="${n}">Uncover all</button><button class="mini" data-act="rcno" data-l="${b.id}">Cover all</button></div>${body}`;

H.end = () => {

    ${nx ? `<a href="${esc(nx.href)}"><span><small>${esc(nx.label || 'Next lecture')}</small>${esc(nx.title)}</span><span>→</span></a>` : ''}
    ${pv ? `<a href="${esc(pv.href)}"><span><small>${esc(pv.label || 'Previous lecture')}</small>${esc(pv.title)}</span><span>←</span></a>` : ''}
