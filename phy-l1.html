/b> nerve → ACh → EPP → muscle AP → T tubule → SR Ca2+ → troponin C → sliding → Ca2+ pumped back", "T tubule Transmits, SR Stores; thin filaments 'ATT'", "I band and H zone shrInk; A band Always the same"]}, {"t": "note", "kind": "mn", "html": "dArk = A band, lIght = I band; TRIad = 1 + 2"}], "toc": ["06", "Rapid Revision"]}, {"id": "p40", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l1-5-0", "title": "Recall · Rapid Revision", "groups": [{"title": " One-liners, the whole lecture in one chain, mnemonics, traps", "items": [["Chain:", "nerve → ACh → EPP → muscle AP → T tubule → SR Ca2+ → troponin C → sliding → Ca2+ pumped back"], ["Mnemonics:", "dArk = A band, lIght = I band; TRIad = 1 + 2"], ["T tubule Transmits", "SR Stores; thin filaments 'ATT'"], ["I band and H", "zone shrInk; A band Always the same"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p41", "head": "More questions", "kind": "text", "blocks": [{"t": "flap", "q": "Q0851"}, {"t": "flap", "q": "Q0856"}], "toc": ["+", "More questions"]}, {"id": "p42", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "The A band never changes length — only I band and H zone shrink"}, {"t": "note", "kind": "trap", "html": "The filaments slide; they do not shorten"}, {"t": "note", "kind": "trap", "html": "Relaxation needs ATP too (Ca2+ pump) — not passive"}, {"t": "note", "kind": "trap", "html": "Skeletal is striated and voluntary; cardiac is striated but involuntary"}, {"t": "note", "kind": "trap", "html": "Ca2+ for contraction comes from SR, not T tubule — T tubule only carries impulse"}, {"t": "note", "kind": "trap", "html": "The EPP is not the action potential; it triggers it"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p43", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Two calcium roles: nerve-terminal Ca2+ releases ACh; SR Ca2+ binds troponin C"}]}, {"id": "p44", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0818": {"id": "Q0818", "stem": "Which of the following temporal sequences of excitation–contraction coupling in skeletal muscle is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The action potential travels along the sarcolemma, the T tubules carry it inwards, and this causes release of Ca²⁺ from the SR; Ca²⁺ then binds troponin C before cross bridges bind and ATP is split. Option d puts SR Ca²⁺ release before T-tubule depolarization, which reverses the order.", "type": "mcq", "opts": ["Increased intracellular Ca²⁺, action potential in the muscle membrane, cross-bridge formation", "Action potential in the muscle membrane, depolarization of the T tubules, release of Ca²⁺ from the sarcoplasmic reticulum", "Action potential in the muscle membrane, splitting of ATP, binding of Ca²⁺ to troponin C", "Release of Ca²⁺ from the sarcoplasmic reticulum, depolarization of the T tubules, binding of Ca²⁺ to troponin C"], "ans": 1}, "Q0822": {"id": "Q0822", "stem": "When acetylcholine binds the nicotinic receptors of the motor end plate, several events follow. Which of the following is conducted along the muscle fibre rather than staying local to the end plate?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "ACh opens the ligand channels of the end plate and the Na⁺ influx depolarizes it, producing the end plate potential, a local, graded and transient depolarization. The EPP triggers the action potential, and only the action potential is conducted along the muscle fibres.", "type": "mcq", "opts": ["Opening of ligand-gated Na⁺ channels", "The end plate potential (EPP)", "The action potential", "Exit of K⁺ through ligand-gated channels", "Destruction of acetylcholine by acetylcholinesterase"], "ans": 2}, "Q0832": {"id": "Q0832", "stem": "Enumerate the events occurring at the myoneural (neuromuscular) junction.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The neuromuscular transmission steps come from 5.3 (with the cleft and channels from 5.2), and the contraction and relaxation steps come from the excitation–contraction coupling sequence in Part 04 and the ATP high-yield box in 3.2.", "type": "written", "keyhtml": "1. A nerve impulse arrives at the motor nerve terminal → voltage-gated Ca²⁺ channels open → increased permeability to Ca²⁺.\n2. Ca²⁺ diffuses into the interior of the axon terminal → rupture of the vesicles and release of acetylcholine (ACh) into the synaptic cleft (30–50 nm wide).\n3. ACh crosses the cleft and attaches to its receptors on the motor end plate (postsynaptic membrane): the nicotinic receptors.\n4. The receptor ligand channels open → Na⁺ influx → depolarization of the postsynaptic membrane = end plate potential (EPP).\n5. The EPP triggers an action potential that is conducted along the muscle fibres and initiates contraction: the T tubules carry it inwards → Ca²⁺ is released from the SR → Ca²⁺ binds troponin C → the thin filaments slide over the thick filaments (ATP is the energy source for sliding).\n6. The EPP is transient because ACh is degraded (to CoA and choline) by the acetylcholinesterase enzyme in the synaptic cleft.\n7. Ca²⁺ is then pumped actively back into its intracellular stores (SR) → relaxation (ATP is also the energy source for Ca²⁺ reuptake)."}, "Q0838": {"id": "Q0838", "stem": "Compare skeletal muscle and cardiac muscle.", "top": false, "rep": "", "tag": "Final bank PHY W3", "bank": true, "expl": "Every row comes from the pamphlet's comparison table of the three muscle types (1.2) and its high-yield note.", "type": "written", "keyhtml": "Feature: skeletal muscle | cardiac muscle\n• Control: voluntary | involuntary\n• Cross striations: striated | striated\n• Nerve supply: somatic | autonomic\n• Location: attached to the skeleton | in the wall of the heart\n• Function: movement of joints, maintenance of posture and stability | movement of blood\nKey point: striation and voluntary control coincide only in skeletal muscle; cardiac muscle is striated but involuntary, and skeletal muscle is the only type with a somatic nerve supply."}, "Q0841": {"id": "Q0841", "stem": "Define the motor unit.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The definition and the fibre numbers are those given in the pamphlet's motor unit section (5.1).", "type": "written", "keyhtml": "• A motor unit consists of a motor neuron and the muscle fibres supplied by it.\n• The number of muscle fibres in each unit varies with the delicacy of the movement:\n  – Fine, delicate movements (e.g. eye muscles): fewer than 10 muscle fibres per motor unit\n  – Coarse movements (e.g. gastrocnemius): 1000–2000 muscle fibres per motor unit"}, "Q0844": {"id": "Q0844", "stem": "What is the T tubule, and what is its function?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The pamphlet describes the T tubules as membrane invaginations that contain ECF and transmit the action potential to the interior of the fibre; the SR, not the T tubule, stores the Ca²⁺.", "type": "written", "keyhtml": "• T (transverse) tubules are invaginations of the muscle fibre membrane into the interior of the fibre, crossing from one side to the opposite side; they contain extracellular fluid.\n• Function: they transmit the action potential to the interior (deep parts) of the muscle fibre, where it causes release of Ca²⁺ from the terminal cisternae of the SR (1 T tubule + 2 terminal cisternae = a triad)."}, "Q0849": {"id": "Q0849", "stem": "The function of calcium during the cross-bridge cycle is:", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q1", "bank": true, "expl": "At low cytosolic Ca²⁺, tropomyosin covers the binding sites on actin; when Ca²⁺ rises it binds troponin, the troponin–tropomyosin complex moves, and the exposed sites let the cross bridges bind and generate force. Ca²⁺ does not act on myosin: bending of the myosin head follows its binding to actin.", "type": "mcq", "opts": ["Prevent rigor mortis from occurring", "Bind troponin and release the inhibition of myosin binding sites on actin", "Induce a conformational change in the myosin molecule, so it can perform a power stroke", "Cause detachment of the myosin head and actin complex"], "ans": 1}, "Q0850": {"id": "Q0850", "stem": "The action potential in skeletal muscles:", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q2", "bank": true, "expl": "Spread of the muscle action potential along the T tubules causes release of Ca²⁺ from the sarcoplasmic reticulum, the first step of excitation–contraction coupling. It does not start in the nerve terminal: the end plate potential at the motor end plate triggers it, and it is then conducted along the muscle fibres.", "type": "mcq", "opts": ["Has no refractory period", "Is similar in shape to that of cardiac muscle, but takes less time", "Causes the release of calcium from sarcoplasmic reticulum", "Usually starts in the nerve terminal"], "ans": 2}, "Y26-008": {"id": "Y26-008", "stem": "At the neuromuscular junction, which of the following ions inhibits neuromuscular transmission?", "top": true, "rep": "", "tag": "Final bank PHY Q9", "bank": true, "expl": "Magnesium is the ion that inhibits neuromuscular transmission. Calcium, the tempting distractor, is needed for transmission: the arriving impulse lets Ca²⁺ diffuse into the nerve terminal, which ruptures the vesicles and releases ACh, and Na⁺ influx at the motor end plate then produces the end plate potential.", "type": "mcq", "opts": ["Sodium", "Magnesium", "Chloride", "Potassium", "Calcium"], "ans": 1}, "Q0856": {"id": "Q0856", "stem": "Case: Sameh was a 45-year-old man. His wife found him dead in their apartment when she returned from her work at 3 PM, and called in the police. During investigation, the doorman said that one of Sameh's friends visited him around noon but he could not remember the time exactly. After calling up the man, who turned out to be Mr Farid (one of Mr Sameh's acquaintances), he admitted visiting Mr Sameh at 1 PM. After further investigation it was found that Mr Sameh was an abusive husband, and he was involved in gambling and lost all his money, as well as stealing from his wife and also losing that money. And it turned out that Mr Farid was one of the people Mr Sameh gambled with, and he owed him money before his death. The final verdict came when the surveillance cameras' footage was unloaded and they found out that Mr Farid was in the house as early as 10:30 AM and not 1 PM as he had claimed. The forensic doctor said that Mr Sameh was killed around 11 AM.\n1. What is rigor mortis?\n2. What is the mechanism of rigor mortis?\n3. How did the doctor know the time of death?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY W1", "bank": true, "expl": "ATP is needed both for sliding of the filaments and for Ca²⁺ reuptake and relaxation; once ATP runs out after death, the actin–myosin bonds cannot be broken and the muscles stiffen. Because rigor mortis follows a fixed time course (starts about 2 hours after death, complete by 6–8 hours, gone by about 24 hours), its stage helps estimate the time of death.", "aimg": ["figs/GH-02_ans.jpg"], "acap": "Rigor mortis", "type": "written", "keyhtml": "1. Rigor mortis is the post-mortem stiffening of muscles caused by depletion of adenosine triphosphate (ATP) from the muscles; ATP is necessary for the breakdown of the actin–myosin bond (cross bridges) in the muscle fibres.\n2. Mechanism:\n• Cessation of the oxygen supply stops aerobic respiration in the cells → lack of ATP production.\n• The actin and myosin filaments, which form a bond during contraction, cannot undergo breakdown (detach).\n• This inhibition of actin–myosin breakdown causes post-mortem stiffening of the muscle fibres.\n• In the last phase, the actin–myosin complex starts disintegrating due to proteolysis, so the stiffness dissolves.\n• Rigor mortis generally disappears 24 hours after death, followed by a phase known as secondary flaccidity.\n3. Through the post-mortem stiffening (rigor mortis):\n• Rigor mortis is useful in estimating the time of death, and it indicates whether or not a body has been moved.\n• It appears about 2 hours after death in the muscles of the face, progresses to the limbs over the next few hours, and is complete 6–8 hours after death.\n• It then stays for another 12 hours (until about 24 hours after death) and then disappears."}, "Q0857": {"id": "Q0857", "stem": "In skeletal muscle, which of the following events occurs before depolarization of the T tubules in the mechanism of excitation-contraction coupling?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q3", "bank": true, "expl": "The action potential travels along the sarcolemma first; the T tubules then carry it inwards, causing Ca²⁺ release from the SR, and Ca²⁺ then binds troponin C. Ca²⁺ uptake into the SR by the pump comes last, at relaxation.", "type": "mcq", "opts": ["Depolarization of the sarcolemmal membrane", "Uptake of Ca²⁺ into the SR by Ca²⁺-adenosine triphosphatase (ATPase)", "Opening of Ca²⁺ release channels on the sarcoplasmic reticulum (SR)", "Binding of Ca²⁺ to troponin C"], "ans": 0}, "Q0858": {"id": "Q0858", "stem": "The role of transverse tubules in the excitation of skeletal muscle contraction is:", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q4", "bank": true, "expl": "T tubules are invaginations of the membrane into the fibre that contain extracellular fluid and transmit the action potential to its interior. The Ca²⁺ for contraction comes from the sarcoplasmic reticulum, not through the T tubule, which only carries the impulse; storing Ca²⁺ is also the SR's job.", "type": "mcq", "opts": ["To provide an inward path for the spread of muscle action potential", "To connect the sarcomeres end-to-end", "To serve as the storage site for calcium ions", "To allow entrance of Ca²⁺ through Ca²⁺ channels during the action potential"], "ans": 0}, "Q0859": {"id": "Q0859", "stem": "Normal relaxation of the skeletal muscle is due to:", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q5", "bank": true, "expl": "On completing contraction, Ca²⁺ is pumped actively back into its intracellular stores (the SR), which causes relaxation, so ATP is needed for relaxation too. Breakdown of acetylcholine by acetylcholinesterase only makes the end plate potential transient, and a fall in ATP would hinder relaxation.", "type": "mcq", "opts": ["A decrease in ATP concentration within the sarcomere", "Active transport of Ca²⁺ into the sarcoplasmic reticulum", "An increase in intracellular pH", "Breakdown of acetylcholine at motor end plate"], "ans": 1}, "Q0861": {"id": "Q0861", "stem": "Which of the following causes rigor in skeletal muscle?", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q6", "bank": true, "expl": "ATP is needed for each new cross-bridge cycle and for pumping Ca²⁺ back into the SR, so relaxation is an active process; when ATP falls, the muscle cannot relax and stays stiff (in fatigue, ATP depletion likewise causes contracture, an incomplete relaxation). A rise in intracellular Ca²⁺ only switches on cross-bridge cycling, which still needs ATP to continue and to relax.", "type": "mcq", "opts": ["An increase in adenosine triphosphate (ATP) level", "No action potentials in motoneurons", "An increase in intracellular Ca²⁺ level", "A decrease in ATP level"], "ans": 3}, "Q0863": {"id": "Q0863", "stem": "Contraction of skeletal muscles does NOT require:", "top": true, "rep": "asked 4 years", "tag": "Final bank PHY Q7", "bank": true, "expl": "The Ca²⁺ for contraction comes from the sarcoplasmic reticulum, not from the extracellular fluid in the T tubule, which only carries the impulse. The action potential, the myosin cross bridges and troponin (the Ca²⁺-binding protein) are all needed; extracellular Ca²⁺ enters the nerve terminal to release ACh, not the muscle fibre.", "type": "mcq", "opts": ["Troponin", "Myosin", "Influx of extracellular Ca²⁺", "An action potential"], "ans": 2}, "Q0866": {"id": "Q0866", "stem": "The function of T tubules is:", "top": true, "rep": "asked 2 years", "tag": "Final bank PHY Q10", "bank": true, "expl": "T tubules are invaginations of the sarcolemma that conduct the impulse (action potential) into the deep parts of the muscle fibre. Storing and releasing Ca²⁺ is the job of the sarcoplasmic reticulum, which has a Ca²⁺ pump in its wall.", "type": "mcq", "opts": ["Conducts the electrical impulse into the deep parts of the muscle", "Stores and releases Na⁺", "Stores and releases Ca²⁺", "Formed of contractile elements", "It is the main source of energy"], "ans": 0}, "Q0867": {"id": "Q0867", "stem": "On arrival of a nerve impulse at the nerve terminal, which channels open?", "top": true, "rep": "asked 2 years", "tag": "Final bank PHY Q11", "bank": true, "expl": "The arriving impulse increases the permeability of the motor nerve terminal to Ca²⁺ through its voltage-gated Ca²⁺ channels; Ca²⁺ diffuses into the axon, ruptures the vesicles and releases ACh into the synaptic cleft. The Na⁺ channels of the junction are ligand channels on the motor end plate, opened only after ACh binds its nicotinic receptor.", "type": "mcq", "opts": ["Voltage-gated magnesium channels", "Voltage-gated chloride channels", "Voltage-gated sodium channels", "Voltage-gated calcium channels", "Voltage-gated potassium channels"], "ans": 3}, "Q0868": {"id": "Q0868", "stem": "As regards the process of excitation–contraction coupling:", "top": true, "rep": "asked 2 years", "tag": "Final bank PHY Q12", "bank": true, "expl": "ATP is needed twice: for sliding of the filaments (contraction) and for active reuptake of Ca²⁺ into the SR (relaxation). Relaxation is therefore an active, energy-consuming process, not a passive one.", "type": "mcq", "opts": ["Both contraction and relaxation are active processes", "Both contraction and relaxation are passive processes", "Contraction is an active process while relaxation is passive", "Contraction is a passive process while relaxation is active"], "ans": 0}, "Q0869": {"id": "Q0869", "stem": "The calcium ion released from the sarcoplasmic reticulum in muscle contraction binds to:", "top": true, "rep": "asked 3 years", "tag": "Final bank PHY Q13", "bank": true, "expl": "Troponin has the binding sites for Ca²⁺; when Ca²⁺ fills them, troponin changes shape and position and the troponin–tropomyosin complex moves, exposing the active sites on actin. Tropomyosin does not bind Ca²⁺ — at low Ca²⁺ it covers the binding sites on actin.", "type": "mcq", "opts": ["Actin", "Troponin", "Tropomyosin", "T tubules"], "ans": 1}, "Q0870": {"id": "Q0870", "stem": "If you wanted to pick up something heavier than your pencil (as a book), you would need to have a stronger muscle contraction. In what way might you do this?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHY Q8", "bank": true, "expl": "A motor unit is a motor neuron and the muscle fibres supplied by it, so stimulating more motor units brings more muscle fibres into the contraction. Decreasing the frequency of stimulation does the opposite: as stimuli come faster, the responses build up (staircase, clonus, complete tetanus) and tension rises.", "type": "mcq", "opts": ["Stimulate more motor units.", "Decrease the frequency of stimulation.", "Decrease the refractory period.", "Block the acetylcholinesterase at the neuromuscular junction."], "ans": 0}, "Q0851": {"id": "Q0851", "stem": "Case: An 11-year-old male patient reported to the medical clinic with a history of generalized weakness for more than six years. Over the years, he received treatment in several hospitals where the definitive diagnosis was not reached. He received several empirical treatments like multivitamins and antibiotics, with minimal to no clinical improvement. The parent reports a history of poor performance in school, repeated falls, inability to keep up with peers during sports due to excessive fatigue, progressive muscle weakness, and inability to climb stairs. There was no history of muscle pain, preceding trauma, or clinical features suggestive of an infection. Family history revealed that his maternal uncle, currently in his late teens, has experienced similar symptoms and is now bedridden.\nOn examination, the child has slight wasting, fully conscious with cognitive assessment score of 20, which indicates significant impairment of cognitive function. Furthermore, he was afebrile (36.7 °C), and exhibits a waddling gait, toe walking, reduced power of proximal muscles of the lower limbs, calf hypertrophy. Cranial nerve examination was unremarkable, and there were no apparent signs of either upper or lower motor neuron lesions.\n1. What is the most probable diagnosis?\n2. What are the most common symptoms of this disease?\n3. What is the proper management of this case?\n4. What is the differential diagnosis of this case?\n5. What is the difference between this disease and myasthenia gravis?", "top": true, "rep": "asked 3 years", "tag": "Final bank PHY W2", "bank": true, "expl": "Frequent falls, difficulty climbing stairs, toe walking, a waddling gait and calf pseudohypertrophy in a boy whose maternal uncle is affected fit Duchenne muscular dystrophy, an X-linked myopathy caused by a defect in dystrophin, which binds actin to the sarcolemma and extracellular matrix, so its loss leads to atrophy of muscle fibres. The lesion is in the muscle itself, whereas in myasthenia gravis the problem is at the neuromuscular junction.", "img": ["figs/GH-01.jpg"], "cap": "Clinical photograph of the patient (lateral view)", "aimg": ["figs/GH-01_ans.jpg", "figs/GH-01_ans2.jpg", "figs/GH-01_ans3.jpg"], "acap": "Stages of Duchenne muscular dystrophy (title-slide illustration); gait in Duchenne dystrophy (symptoms slide); neuromuscular diseases of childhood by site — differential diagnosis", "type": "written", "keyhtml": "1. Muscular dystrophy — most likely Duchenne muscular dystrophy (DMD).\n• Muscular dystrophy is a group of disorders that involve a progressive loss of muscle mass and consequent loss of strength; the main forms may affect up to 1 in every 5000 males; the most common form is Duchenne muscular dystrophy.\n• DMD is a progressive inherited (X-linked) myopathy with an early onset in childhood. Mutations in the dystrophin gene lead to progressive muscle fibre degeneration and weakness.\n• It progresses to the bed-bound state in the second decade of life, and patients are usually prone to respiratory or heart complications.\n2. Early symptoms of Duchenne dystrophy: frequent falls • difficulty climbing stairs • difficulty rising from a lying and sitting position • trouble running • walking on the toes • muscle pain and stiffness • pseudohypertrophy of the calf muscles • waddling gait.\n3. Management:\n• There is no cure for any form of muscular dystrophy, but treatment of some forms can extend the time the patient remains mobile and help heart and lung muscle strength.\n• Conservative management, active physiotherapy, genetic counselling and other supportive therapies hold the key to successful management.\n• Periodic follow-up of the cardiac state and of respiratory infections.\n4. Differential diagnosis — the neuromuscular diseases (NMDs) of childhood, by site of the lesion:\n• Spinal cord: anterior horn cell (AHC) disorders\n• Peripheral nerve: peripheral neuropathy\n• Neuromuscular junction: diseases of the neuromuscular junction (NMJ)\n• Muscle: muscular dystrophies (Duchenne, Becker), metabolic myopathies, congenital myopathies\n5. Key difference: in myasthenia gravis the problem is at the level of the neuromuscular junction, while in muscular dystrophy the lesion is in the muscle.\n• Cause: MD — group of inherited diseases with abnormalities in genes | MG — autoimmune disorder with antibodies that block acetylcholine receptors\n• Muscle involvement: MD — weakness and wasting away of muscle tissue | MG — weakness at the neuromuscular junctions\n• Age of onset: MD — varies from birth to adulthood | MG — any age, but often young adulthood\n• Symptom progression: MD — gradual loss of muscle mass and strength | MG — fluctuating weakness, often worse with activity\n• Treatment: MD — no definitive cure, only symptomatic management | MG — no definitive cure, but treatment helps manage symptoms (neostigmine)"}, "N-PHY-L1-01": {"id": "N-PHY-L1-01", "stem": "A student compares the three types of muscle. Which of the following features is shared by skeletal and cardiac muscle?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Both skeletal and cardiac muscle are striated, but striation and voluntary control coincide only in skeletal muscle. Cardiac muscle is involuntary with an autonomic supply, and skeletal muscle is the only type with a somatic nerve supply.", "type": "mcq", "opts": ["Voluntary control", "Somatic nerve supply", "Cross striations", "Attachment to the skeleton", "Autonomic nerve supply"], "ans": 2}, "N-PHY-L1-02": {"id": "N-PHY-L1-02", "stem": "Electron micrographs of the same sarcomere are taken at rest and at the peak of a contraction. Which of the following has the same length in both images?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "During contraction the thin filaments slide along the thick filaments: the I bands disappear, the H zone is reduced and the Z lines get closer, so the sarcomere shortens. The A band is the length of the thick filament, and the filaments slide without shortening, so it stays constant.", "type": "mcq", "opts": ["I band", "H zone", "A band", "Sarcomere (Z line to Z line)"], "ans": 2}, "N-PHY-L1-03": {"id": "N-PHY-L1-03", "stem": "Skeletal muscle helps control body temperature. At rest, about what proportion of the body's heat production is due to muscle activity?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "50% of heat production at rest is due to muscle activity, and heat production rises much further during exercise. 40% is the share of body weight formed by skeletal muscle, not its share of heat production.", "type": "mcq", "opts": ["10%", "25%", "40%", "50%", "90%"], "ans": 3}, "N-PHY-L1-04": {"id": "N-PHY-L1-04", "stem": "A triad seen in an electron micrograph of a skeletal muscle fibre is formed of:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "At their ends near the T tubules, the longitudinal tubules (SR) enlarge into terminal cisternae; one T tubule with a terminal cistern on either side is a triad (TRIad = 1 + 2). The cisternae store Ca²⁺, and the T tubule brings the action potential to them.", "type": "mcq", "opts": ["One T tubule and two terminal cisternae of the SR", "Two T tubules and one terminal cistern of the SR", "One T tubule, one terminal cistern and one myofibril", "Three terminal cisternae of the SR", "One sarcomere and its two Z lines"], "ans": 0}, "N-PHY-L1-05": {"id": "N-PHY-L1-05", "stem": "Which of the following describes the myosin heads (cross bridges) of the thick filament?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Each myosin molecule has a tail and two heads (the cross bridges), and each head has ATP-binding and actin-binding sites. The Ca²⁺ binding sites belong to troponin, tropomyosin wraps around actin, and actin forms two coiled chains; all three are thin-filament proteins.", "type": "mcq", "opts": ["They have ATP-binding and actin-binding sites", "They have the binding sites for Ca²⁺", "They wrap around the chain of actin", "They form two long chains coiled around each other", "They are part of the thin filament"], "ans": 0}, "N-PHY-L1-06": {"id": "N-PHY-L1-06", "stem": "A recording from a single skeletal muscle fibre shows its action potential and the tension it develops. Which of the following describes the timing of these two events?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The muscle fibre action potential comes first and is over quickly. A latent period separates it from the start of tension, which then rises and falls over a much longer time than the action potential.", "type": "mcq", "opts": ["The action potential comes first and is brief; tension starts after a latent period and lasts much longer", "Tension starts first; the action potential follows after a latent period and lasts longer", "Both start together with no latent period, and the action potential outlasts the tension", "The action potential comes first; tension starts at once and ends with the action potential"], "ans": 0}, "N-PHY-L1-07": {"id": "N-PHY-L1-07", "stem": "A neurologist explains that the precision of a movement depends on the size of its motor units. A motor unit consists of:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A motor unit is a motor neuron plus the muscle fibres it supplies; the number of fibres varies with the delicacy of the movement (eye muscles fewer than 10, gastrocnemius 1000–2000). The segment between two Z lines is a sarcomere, and one T tubule with two terminal cisternae is a triad.", "type": "mcq", "opts": ["A motor neuron and the muscle fibres supplied by it", "A single muscle fibre and its motor end plate", "A fascicle of muscle fibres wrapped by perimysium", "The segment of a myofibril between two Z lines", "One T tubule and two terminal cisternae"], "ans": 0}, "N-PHY-L1-08": {"id": "N-PHY-L1-08", "stem": "An experimental drug inhibits the acetylcholinesterase enzyme in the synaptic cleft of a neuromuscular junction. Which of the following is the expected direct effect?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The end plate potential is transient because acetylcholinesterase in the synaptic cleft degrades ACh; if the enzyme is inhibited, ACh is not removed and the EPP lasts longer. Ca²⁺ entry, ACh release and receptor binding all happen before the enzyme acts, so they are not blocked.", "type": "mcq", "opts": ["The end plate potential is prolonged", "Acetylcholine is not released from the vesicles", "Ca²⁺ cannot enter the nerve terminal", "Acetylcholine cannot bind the nicotinic receptors", "Ca²⁺ is not released from the sarcoplasmic reticulum"], "ans": 0}, "N-PHY-L1-09": {"id": "N-PHY-L1-09", "stem": "During dissection of a skeletal muscle, a student identifies the connective tissue sheath that wraps each bundle (fascicle) of muscle fibres. This sheath is the:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Perimysium wraps each fascicle; epimysium wraps the whole muscle, and endomysium lies between the individual muscle fibres. The sheaths carry the blood vessels of the muscle, and the tendon attaches it to bone.", "type": "mcq", "opts": ["Epimysium", "Perimysium", "Endomysium", "Tendon", "Sarcolemma"], "ans": 1}, "N-PHY-L1-10": {"id": "N-PHY-L1-10", "stem": "Enumerate the steps of excitation–contraction coupling in skeletal muscle.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "These are the eight steps of excitation–contraction coupling listed in Part 04, with the ATP high-yield point from 3.2.", "type": "written", "keyhtml": "1. Spread of the action potential along the T tubules causes release of Ca²⁺ from the sarcoplasmic reticulum.\n2. Ca²⁺ binds to troponin C.\n3. The troponin–tropomyosin complex moves, exposing the active site on actin.\n4. The myosin heads (cross bridges) bind to the actin filaments.\n5. Bending of the myosin head occurs.\n6. The thin filaments slide on the thick filaments, with ATP breakdown.\n7. A new cycle is repeated with a new ATP molecule.\n8. On completing contraction, Ca²⁺ is pumped actively back to its intracellular stores → muscle relaxation.\nNote: ATP is used twice, for sliding (contraction) and for Ca²⁺ reuptake (relaxation), so relaxation is active."}, "N-PHY-L1-11": {"id": "N-PHY-L1-11", "stem": "Describe the changes that occur in the sarcomere during skeletal muscle contraction, and explain how calcium activates cross-bridge cycling.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The band changes come from 3.1 and the low vs high Ca²⁺ states from 3.2.", "type": "written", "keyhtml": "Changes in the sarcomere:\n• The thin filaments slide along the thick filaments; the filaments slide, they never shorten.\n• The I bands disappear, while the A bands remain constant.\n• The H zone is reduced.\n• The two Z lines get closer, so the sarcomere shortens.\nActivation by calcium:\n• Low cytosolic Ca²⁺ (relaxed): tropomyosin covers the binding site on actin, so the energised cross bridge cannot bind.\n• High cytosolic Ca²⁺ (activated): Ca²⁺ binds troponin → the troponin–tropomyosin complex moves → the cross-bridge binding sites are exposed → the cross bridge binds actin and generates force.\n• Cross-bridge movement pulls the thin filaments of both halves of the sarcomere towards its centre.\n• ATP is needed for sliding (contraction) and for Ca²⁺ reuptake (relaxation)."}}, "labs": {}, "cards": [{"id": "PHY-L1-001", "text": "Functionally, muscles are machines that convert stored chemical energy into {{c1::mechanical energy (work)}} and {{c2::heat}}", "extra": "", "sec": "Part 01 · Definition"}, {"id": "PHY-L1-002", "text": "Muscle share of body weight: all muscle {{c1::50%}} · skeletal muscle {{c2::40%}} · smooth + cardiac together {{c3::10%}}", "extra": "", "sec": "Part 01 · 1.1 Muscle mass & the three types"}, {"id": "PHY-L1-003", "text": "Cardiac muscle — striations: {{c1::striated::striated or plain}} · control: {{c2::involuntary::voluntary or involuntary}}", "extra": "Striation + voluntary control coincide only in skeletal muscle — the most tested line of the table.", "sec": "Part 01 · 1.2 Types of muscle — the comparison table"}, {"id": "PHY-L1-004", "text": "Nerve supply — skeletal muscle: {{c1::somatic}}; cardiac & smooth muscle: {{c2::autonomic}}", "extra": "Skeletal muscle is the only type with a somatic supply.", "sec": "Part 01 · 1.2 Types of muscle — the comparison table"}, {"id": "PHY-L1-005", "text": "Feature shared by skeletal and cardiac muscle: {{c1::cross striations}}; smooth muscle is {{c2::plain (non-striated)}}", "extra": "", "sec": "Part 01 · 1.2 Types of muscle — the comparison table"}, {"id": "PHY-L1-006", "text": "Location — skeletal: {{c1::attached to the skeleton}} · cardiac: {{c2::in the wall of the heart}} · smooth: {{c3::in the wall of viscera}}", "extra": "", "sec": "Part 01 · 1.2 Types of muscle — the comparison table"}, {"id": "PHY-L1-007", "text": "Functions — skeletal: {{c1::movement of joints; maintaining posture & stability}} · cardiac: {{c2::movement of blood}} · smooth: {{c3::movement of contents}}", "extra": "", "sec": "Part 01 · 1.2 Types of muscle — the comparison table"}, {"id": "PHY-L1-008", "text": "Functions of skeletal muscle: {{c1::movement}} of the body or a part of it · {{c2::maintenance of body posture}} · {{c3::control of body temperature}}", "extra": "", "sec": "Part 01 · 1.3 Functions of skeletal muscle"}, {"id": "PHY-L1-009", "text": "Skeletal muscle maintains body posture by its {{c1::tonic contraction and muscle tone}}", "extra": "", "sec": "Part 01 · 1.3 Functions of skeletal muscle"}, {"id": "PHY-L1-010", "text": "At rest, {{c1::50%}} of the body's heat production is due to muscle activity; during exercise it is {{c2::much increased}}", "extra": "40% is skeletal muscle's share of body weight — don't swap.", "sec": "Part 01 · 1.3 Functions of skeletal muscle"}, {"id": "PHY-L1-011", "text": "Connective tissue sheaths: whole muscle → {{c1::epimysium}} · each fascicle → {{c2::perimysium}} · between individual muscle fibres → {{c3::endomysium}}", "extra": "The sheaths carry the blood vessels of the muscle.", "sec": "Part 02 · 2.1 Gross anatomy & connective tissue sheaths"}, {"id": "PHY-L1-012", "text": "Muscle organisation: fibres are grouped into {{c1::fascicles}}; the muscle is attached to bone by a {{c2::tendon}}", "extra": "", "sec": "Part 02 · 2.1 Gross anatomy & connective tissue sheaths"}, {"id": "PHY-L1-013", "text": "Each skeletal muscle fibre contains: {{c1::myofibrils}} (the contractile machinery) · {{c2::mitochondria}} · {{c3::many nuclei (multinucleated)}} · {{c4::two types of tubules}}", "extra": "", "sec": "Part 02 · 2.2 The muscle fibre (muscle cell)"}, {"id": "PHY-L1-014", "text": "Longitudinal tubules (SR) lie {{c1::parallel to the myofibril}}; near the T tubules their ends enlarge into the {{c2::terminal cisternae}}", "extra": "", "sec": "Part 02 · 2.3 The tubular system"}, {"id": "PHY-L1-015", "text": "Triad = {{c1::1 T tubule}} + {{c2::2 terminal cisternae of the SR}}", "extra": "TRIad: 1 + 2 = 3.", "sec": "Part 02 · 2.3 The tubular system"}, {"id": "PHY-L1-016", "text": "Functions of the sarcoplasmic reticulum: {{c1::stores Ca²⁺ in very high concentration}} in its cisternae · has a {{c2::Ca²⁺ pump}} in its wall", "extra": "", "sec": "Part 02 · 2.3 The tubular system"}, {"id": "PHY-L1-017", "text": "T tubules: invaginations of the {{c1::muscle fibre membrane}} into the interior of the fibre, crossing from one side to the other; they contain {{c2::extracellular fluid}}", "extra": "", "sec": "Part 02 · 2.3 The tubular system"}, {"id": "PHY-L1-018", "text": "Function of the T tubules: {{c1::transmit the action potential to the interior (deep parts) of the muscle fibre}}", "extra": "T tubule = Transmits the impulse · SR = Stores the calcium.", "sec": "Part 02 · 2.3 The tubular system"}, {"id": "PHY-L1-019", "text": "Skeletal muscle contraction does NOT require {{c1::influx of extracellular Ca²⁺}} — its Ca²⁺ comes from the {{c2::sarcoplasmic reticulum}}", "extra": "The T tubule only carries the impulse; it is not the Ca²⁺ source.", "sec": "Part 02 · 2.3 The tubular system; Part 06 · Exam traps"}, {"id": "PHY-L1-020", "text": "Myofibril proteins — thick filament: {{c1::myosin}}; thin filaments: {{c2::actin}} · {{c3::tropomyosin}} · {{c4::troponin}}", "extra": "Thin = \"ATT\": Actin, Troponin, Tropomyosin.", "sec": "Part 02 · 2.4 Myofibrils — the muscle proteins"}, {"id": "PHY-L1-021", "text": "Each myosin molecule has a {{c1::tail}} + {{c2::2 heads}}; the myosin heads are called {{c3::cross bridges}}", "extra": "", "sec": "Part 02 · 2.4 Myofibrils — the muscle proteins"}, {"id": "PHY-L1-022", "text": "The myosin head (cross bridge) has {{c1::ATP-binding}} sites and {{c2::actin-binding}} sites", "extra": "", "sec": "Part 02 · 2.4 Myofibrils — the muscle proteins"}, {"id": "PHY-L1-023", "text": "Actin: {{c1::spherical}} molecules forming {{c2::2 long chains that coil around each other}}", "extra": "", "sec": "Part 02 · 2.4 Myofibrils — the muscle proteins"}, {"id": "PHY-L1-024", "text": "Tropomyosin {{c1::wraps around the chain of actin}} and is connected to {{c2::troponin}}", "extra": "", "sec": "Part 02 · 2.4 Myofibrils — the muscle proteins"}, {"id": "PHY-L1-025", "text": "Ca²⁺ released from the SR binds to {{c1::troponin (troponin C)}}, which then changes its {{c2::shape and position}}", "extra": "Not actin, not tropomyosin — troponin holds the Ca²⁺ binding sites.", "sec": "Part 02 · 2.4 Myofibrils — the muscle proteins; Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-026", "text": "The {{c1::sarcomere}} is the functional unit of skeletal muscle, bounded by two {{c2::Z lines}}", "extra": "Its repeated pattern of thick and thin filaments makes skeletal muscle look striated.", "sec": "Part 02 · 2.5 The sarcomere"}, {"id": "PHY-L1-027", "text": "Sarcomere bands: {{c1::A band}} = the central dark band · {{c2::I bands}} = the two peripheral light bands", "extra": "dArk = A band · lIght = I band.", "sec": "Part 02 · 2.5 The sarcomere"}, {"id": "PHY-L1-028", "text": "Sarcomere lines: {{c1::M line}} = middle line · {{c2::H zone}} = region around the M line · {{c3::Z line}} = boundary of the sarcomere", "extra": "", "sec": "Part 02 · 2.5 The sarcomere"}, {"id": "PHY-L1-029", "text": "During contraction the {{c1::thin}} filaments slide along the {{c2::thick}} filaments — the filaments themselves {{c3::never shorten}}", "extra": "", "sec": "Part 03 · 3.1 What happens during contraction"}, {"id": "PHY-L1-030", "text": "Sarcomere during contraction: I bands {{c1::disappear}} · A band {{c2::remains constant}} · H zone {{c3::is reduced}} · Z lines {{c4::get closer (sarcomere shortens)}}", "extra": "I band and H zone shrInk — the A band is Always the same.", "sec": "Part 03 · 3.1 What happens during contraction"}, {"id": "PHY-L1-031", "text": "The A band keeps its length during contraction because it equals {{c1::the length of the thick filament}}", "extra": "Only the non-overlap regions (I band, H zone) shrink.", "sec": "Part 03 · 3.1 What happens during contraction"}, {"id": "PHY-L1-032", "text": "Low cytosolic Ca²⁺ (relaxed): {{c1::tropomyosin}} covers the binding site on actin, so the energised cross bridge {{c2::cannot bind actin}}", "extra": "", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-033", "text": "High cytosolic Ca²⁺: Ca²⁺ binds troponin → {{c1::the troponin–tropomyosin complex moves}} → {{c2::cross-bridge binding sites on actin are exposed}} → the cross bridge binds actin and {{c3::generates force}}", "extra": "", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-034", "text": "Function of Ca²⁺ in the cross-bridge cycle: to bind {{c1::troponin}} and {{c2::release the inhibition of the myosin binding sites on actin}}", "extra": "Calcium is the switch: low Ca²⁺ → sites covered; high Ca²⁺ → sites exposed.", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-035", "text": "Cross-bridge movement pulls the thin filaments of both halves of the sarcomere {{c1::towards its centre}}, so the two {{c2::Z lines}} approach each other", "extra": "", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-036", "text": "ATP is needed twice in skeletal muscle: for {{c1::sliding of the filaments (contraction)}} and for {{c2::Ca²⁺ reuptake into the SR (relaxation)}}", "extra": "", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-037", "text": "In skeletal muscle, contraction and relaxation are both {{c1::active::active or passive}} (energy-consuming) processes", "extra": "Relaxation needs ATP for the SR Ca²⁺ pump — it is not passive.", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium"}, {"id": "PHY-L1-038", "text": "Normal relaxation of skeletal muscle is due to {{c1::active transport (pumping) of Ca²⁺ back into the sarcoplasmic reticulum}}", "extra": "Not ACh breakdown — that only makes the EPP transient.", "sec": "Part 03 · 3.2 Activation of cross-bridge cycling by calcium; Part 04 · The 8 steps of excitation–contraction coupling"}, {"id": "PHY-L1-039", "text": "E–C coupling 1–4: the AP spreads along the {{c1::T tubules}} → {{c2::Ca²⁺ is released from the sarcoplasmic reticulum}} ▶ Ca²⁺ binds troponin C ▶ {{c3::the troponin–tropomyosin complex moves}}, exposing the active site on actin ▶ {{c4::the myosin heads (cross bridges) bind actin}}", "extra": "", "sec": "Part 04 · The 8 steps of excitation–contraction coupling"}, {"id": "PHY-L1-040", "text": "E–C coupling 5–8: {{c1::bending of the myosin head}} ▶ thin filaments slide on thick filaments, with {{c2::ATP breakdown}} ▶ a new cycle repeats with {{c3::a new ATP molecule}} ▶ on completing contraction, {{c4::Ca²⁺ is pumped actively back into its intracellular stores}} → relaxation", "extra": "", "sec": "Part 04 · The 8 steps of excitation–contraction coupling"}, {"id": "PHY-L1-041", "text": "E–C coupling: the event just before T-tubule depolarization is {{c1::the action potential along the sarcolemma}}; the event just after is {{c2::release of Ca²⁺ from the SR}}", "extra": "Then Ca²⁺ binds troponin C; Ca²⁺ uptake into the SR comes last (relaxation).", "sec": "Part 04 · The 8 steps of excitation–contraction coupling; Part 06 · The whole lecture in one chain"}, {"id": "PHY-L1-042", "text": "Timing: the muscle fibre action potential comes first and is {{c1::over quickly}}; after a {{c2::latent period}}, tension rises and falls over a {{c3::much longer}} time", "extra": "", "sec": "Part 04 · 4.1 The latent period"}, {"id": "PHY-L1-043", "text": "Motor unit = {{c1::a motor neuron}} + {{c2::the muscle fibres supplied by it}}", "extra": "", "sec": "Part 05 · 5.1 The motor unit"}, {"id": "PHY-L1-044", "text": "Muscle fibres per motor unit — fine, delicate movements (eye muscles): {{c1::< 10}}; coarse movements (gastrocnemius): {{c2::1000–2000}}", "extra": "The number varies with the delicacy of the movement.", "sec": "Part 05 · 5.1 The motor unit"}, {"id": "PHY-L1-045", "text": "To develop a stronger contraction (lifting a book rather than a pencil): {{c1::stimulate more motor units}}", "extra": "Official key (Physiology quiz 3): more motor units → more muscle fibres contracting.", "sec": "Part 05 · 5.1 The motor unit"}, {"id": "PHY-L1-046", "text": "Three parts of the neuromuscular junction: {{c1::motor neuron (presynaptic axon)}} · {{c2::synaptic cleft}} · {{c3::motor end plate (postsynaptic membrane)}}", "extra": "", "sec": "Part 05 · 5.2 Structure of the neuromuscular junction"}, {"id": "PHY-L1-047", "text": "The presynaptic axon terminal of the NMJ contains: {{c1::acetylcholine vesicles}} · {{c2::mitochondria}} · {{c3::voltage-gated Ca²⁺ channels}}", "extra": "", "sec": "Part 05 · 5.2 Structure of the neuromuscular junction"}, {"id": "PHY-L1-048", "text": "Synaptic cleft of the NMJ: {{c1::30–50 nm}} wide; contains ECF (Na⁺, Cl⁻) and the enzyme {{c2::acetylcholinesterase}}", "extra": "", "sec": "Part 05 · 5.2 Structure of the neuromuscular junction"}, {"id": "PHY-L1-049", "text": "Motor end plate receptors: a {{c1::binding protein}} that unites with the transmitter + ligand channels — {{c2::Na⁺}} channels (entry) and {{c3::K⁺}} channels (exit)", "extra": "", "sec": "Part 05 · 5.2 Structure of the neuromuscular junction"}, {"id": "PHY-L1-050", "text": "On arrival of a nerve impulse at the motor nerve terminal, {{c1::voltage-gated Ca²⁺ channels}} open → increased permeability to Ca²⁺", "extra": "The Na⁺ channels are ligand channels on the end plate, opened later by ACh.", "sec": "Part 05 · 5.3 Mechanism of neuromuscular transmission"}, {"id": "PHY-L1-051", "text": "Neuromuscular transmission: Ca²⁺ enters the axon → {{c1::the vesicles rupture, releasing ACh}} into the cleft → ACh binds the {{c2::nicotinic}} receptor → {{c3::Na⁺ influx}} → depolarization = {{c4::end plate potential (EPP)}}", "extra": "", "sec": "Part 05 · 5.3 Mechanism of neuromuscular transmission"}, {"id": "PHY-L1-052", "text": "The end plate potential is a {{c1::local, graded}} depolarization of the end plate; only the {{c2::action potential}} it triggers is conducted along the muscle fibres", "extra": "The EPP is not the action potential; it triggers it.", "sec": "Part 05 · 5.3 Mechanism of neuromuscular transmission"}, {"id": "PHY-L1-053", "text": "The EPP is transient because ACh is degraded to {{c1::CoA and choline}} by {{c2::acetylcholinesterase}} in the synaptic cleft", "extra": "Inhibit the enzyme → ACh is not removed and the EPP is prolonged.", "sec": "Part 05 · 5.3 Mechanism of neuromuscular transmission"}, {"id": "PHY-L1-054", "text": "Two Ca²⁺ roles: at the nerve terminal, Ca²⁺ entering via voltage-gated channels {{c1::releases ACh}}; inside the muscle fibre, Ca²⁺ from the SR {{c2::binds troponin C}}", "extra": "", "sec": "Part 05 · 5.3 Mechanism of neuromuscular transmission"}, {"id": "PHY-L1-055", "text": "Ion that inhibits neuromuscular transmission: {{c1::magnesium (Mg²⁺)}}", "extra": "Official key (Formative 1); not in the pamphlet. Ca²⁺ is needed for ACh release.", "sec": "Part 05 · 5.3 Mechanism of neuromuscular transmission"}, {"id": "PHY-L1-056", "text": "Boy: repeated falls, can't climb stairs, waddling gait, toe walking, weak proximal lower-limb muscles, calf hypertrophy; maternal uncle bedridden with the same → {{c1::Duchenne muscular dystrophy}}", "extra": "GD 1 case key.", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-057", "text": "Muscular dystrophy = a group of disorders with {{c1::progressive loss of muscle mass}} and consequent loss of strength; the most common form is {{c2::Duchenne}}", "extra": "Main forms may affect up to 1 in 5000 males. GD 1 case key; not in the pamphlet.", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-058", "text": "Duchenne muscular dystrophy: a progressive inherited {{c1::X-linked}} myopathy with early onset in {{c2::childhood}}, due to mutations in the {{c3::dystrophin}} gene", "extra": "Mutation → progressive muscle fibre degeneration and weakness.", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-059", "text": "Duchenne course: progresses to the {{c1::bed-bound}} state in the {{c2::second decade}}; patients are prone to {{c3::respiratory or heart}} complications", "extra": "GD 1 case key; not in the pamphlet.", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-060", "text": "Early Duchenne symptoms — function: {{c1::frequent falls}} · {{c2::difficulty climbing stairs}} · {{c3::difficulty rising from lying & sitting}} · {{c4::trouble running}}", "extra": "", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-061", "text": "Early Duchenne symptoms — gait & muscles: {{c1::walking on the toes}} · {{c2::waddling gait}} · {{c3::pseudohypertrophy of the calf muscles}} · {{c4::muscle pain & stiffness}}", "extra": "", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-062", "text": "Muscular dystrophy treatment: {{c1::no cure}} for any form; treatment can extend the time the patient remains {{c2::mobile}} and help heart & lung muscle strength", "extra": "GD 1 case key; not in the pamphlet.", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-063", "text": "Duchenne management: {{c1::conservative management}} · {{c2::active physiotherapy}} · {{c3::genetic counselling}} · supportive therapy + periodic follow-up of {{c4::the cardiac state & respiratory infections}}", "extra": "", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-064", "text": "DD of childhood neuromuscular disease by site — spinal cord: {{c1::anterior horn cell disorders}} · nerve: peripheral neuropathy · NMJ: NMJ diseases · muscle: {{c2::muscular dystrophies (Duchenne, Becker)}}, {{c3::metabolic myopathies}}, {{c4::congenital myopathies}}", "extra": "", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-065", "text": "Muscular dystrophy vs myasthenia gravis — site of the lesion: MD {{c1::the muscle}}; MG {{c2::the neuromuscular junction}}", "extra": "The key difference in the GD 1 key.", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-066", "text": "Cause — muscular dystrophy: {{c1::inherited gene abnormalities}}; myasthenia gravis: {{c2::autoimmune antibodies that block ACh receptors}}", "extra": "", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-067", "text": "Course — muscular dystrophy: {{c1::gradual}} loss of muscle mass & strength; myasthenia gravis: {{c2::fluctuating weakness, worse with activity}}", "extra": "", "sec": "Group discussion 1 · Muscular dystrophy (case key)"}, {"id": "PHY-L1-068", "text": "Age of onset — muscular dystrophy: {{c1::birth to adulthood}}; myasthenia gravis: any age, (() => {

const LAB = {};          // lab renderers by type (declared before the first one below)
// --- real image: the slide's own labels become covers, targets and muscle hotspots ---
function slst(L){ return lst(L.id, () => ({mode: 'labels', rev: {}, qi: 0, score: 0, fb: null, order: shuffled(L.labels.map(l => l.id), L.id), mv: null, cut: {}, sel: null})); }
function slmus(L, l){ return L.act && l.mu ? L.act.muscles[l.mu] : null; }
function slcutn(L, n, cut){ const par = (L.act && L.act.par) || {}; for (let k = n, i = 0; k && i < 6; k = par[k], i++) if (cut[k]) return true; return false; }
function slstat(m, cut, L){ if (!m || !m.nerves.length) return ''; const c = m.nerves.filter(n => slcutn(L, n, cut)).length; return c === m.nerves.length ? 'lost' : c ? 'weak' : ''; }
LAB.slide = (L, big) => {
  const st = slst(L), mode = st.mode;
  const modes = [['labels', 'Labels on']];

  if (L.act) modes.push(['move', 'Movements'], ['cut', 'Cut a nerve']);
  const target = st.order[st.qi];
  const cls = l => {
    const m = slmus(L, l);

    if (mode === 'move' && st.mv) return m && m.moves.includes(st.mv) ? 'hl' : 'dim';
    if (mode === 'cut') return slstat(m, st.cut, L);

  const boxes = L.labels.map(l => {

      : l && l.nv ? `<h4>${esc(l.t)}</h4><div>Supplies: <b>${esc(l.nv.own.join(', ') || '—')}</b></div>${l.nv.via.map(([n, ms]) => `<div style="margin-top:.2em">Through ${esc(n)}: <b>${esc(ms.join(', '))}</b></div>`).join('')}<div class="muted" style="font-size:.85em;margin-top:.25em">From the pamphlet muscle tables.</div>`
      : l ? `<h4>${esc(l.t)}</h4>` : `<span class="muted">${L.act ? 'Tap a muscle label to see its action and nerve.' : L.labels.some(x => x.nv) ? 'Tap a nerve to see the muscles it supplies. "Test me" covers the labels; "Find it" asks you to find each one.' : L.labels.length >= 2 ? 'The labels as printed on the slide. "Test me" covers them; "Find it" asks you to find each one.' : 'The slide as shown in the practical.'}</span>`;
  } else if (mode === 'test'){
    info = `<span class="muted">Name each covered label, then tap it to check. Uncovered ${Object.keys(st.rev).length} of ${L.labels.length}.</span>`;
  } else if (mode === 'find'){
    const done = st.qi >= st.order.length; if (done) labDone(L.id);
    const t = L.labels.find(x => x.id === target);
    info = done ? `<h4>Score: ${st.score}/${st.order.length}</h4><span class="muted">Tap "Find it" again for a new round.</span>`
      : `<h4>Find: ${esc(t.t)}</h4>${st.fb && st.fb[0] === 'bad' ? `<div class="fb bad">${esc(st.fb[1])}</div>` : `<span class="muted">Tap its ${t.m ? 'number on the picture' : 'covered label'} · ${st.qi + 1} of ${st.order.length} · score ${st.score}</span>`}`;
  } else if (mode === 'move'){
    const on = L.labels.filter(l => { const m = slmus(L, l); return m && st.mv && m.moves.includes(st.mv); }).map(l => slmus(L, l).name);
    info = `<div class="chiprow">${L.act.moves.map(v => `<button class="chip ${st.mv === v.id ? 'hl' : ''}" data-act="slmv" data-l="${L.id}" data-id="${v.id}">${esc(v.name)}</button>`).join('')}</div>`
      + (st.mv ? `<span class="muted">On this picture: <b>${esc(on.join(', ') || 'none')}</b></span>` : '<span class="muted">Pick a movement to light up the muscles on this picture that perform it.</span>');
  } else if (mode === 'cut'){
    const ms = L.labels.map(l => slmus(L, l)).filter(Boolean);
    const lost = ms.filter(m => slstat(m, st.cut, L) === 'lost').map(m => m.name), weak = ms.filter(m => slstat(m, st.cut, L) === 'weak').map(m => m.name);
    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;
    const above = nerves.filter(n => st.cut[n.id] && Object.keys(par).some(c => par[c] === n.id)).map(n => `Cut above its branch${Object.keys(par).filter(c => par[c] === n.id).length > 1 ? 'es' : ''}: <b>${esc(n.name)}</b> takes ${esc(Object.keys(par).filter(c => par[c] === n.id).map(nm).join(' and '))} with it.`);
    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
  }
  return `<div class="slx"><div class="modes">${modes.map(([m, n]) => `<button class="mini ${mode === m ? 'on' : ''}" data-act="slmode" data-l="${L.id}" data-v="${m}">${n}</button>`).join('')}${big ? '' : `<button class="mini" data-act="slbig" data-l="${L.id}" title="Open larger">⤢ Larger</button>`}</div>
    <div class="${big ? 'slbigw' : ''}"><div class="slw"><img src="${esc(L.img)}" alt="${esc(L.title || 'Practical slide')}" loading="lazy"><div class="slo">${boxes}</div></div></div>
    <div class="info">${info}</div></div>`;
};

/* ---------- labs ---------- */
const LS = {};
function lst(id, init){ return LS[id] || (LS[id] = init()); }
function rnd(seed){ let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function shuffled(arr, seed){ const r = rnd(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function labDone(id){ if (!S.labs[id] || !S.labs[id].done){ S.labs[id] = {done: true}; save(); } }
function labHTML(L, pg){
  const head = `<div class="labh"><span class="lb">LAB</span><h3>${esc(L.title)}</h3></div><div class="labi">${L.intro}</div>`;
  const foot = L.src ? `<div class="ref">${esc(L.src)}</div>` : L.ref ? `<div class="ref">From the pamphlet · ${esc(L.ref)}</div>` : '';
  return `<div class="labx nosw">${head}${LAB[L.type](L)}${foot}</div>`;
}
// --- region map (cross-section) ---
function sector(cx, cy, rx, ry, a1, a2){
  const p = a => [cx + rx * Math.cos(a * Math.PI / 180), cy + ry * Math.sin(a * Math.PI / 180)];
  const [x1, y1] = p(a1), [x2, y2] = p(a2); const large = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
LAB.map = L => {
  const st = lst(L.id, () => ({sel: null, mode: 'explore', qi: 0, score: 0, fb: null, order: shuffled(L.tests.map((_, i) => i), L.id)}));
  const cx = 160, cy = 128, rx = 136, ry = 108;
  const regs = L.regions.map(r => {
    const on = st.sel === r.id, dim = st.sel && !on && st.mode === 'explore';
    return `<path class="rg ${dim ? 'dim' : ''}" d="${sector(cx, cy, rx, ry, r.a1, r.a2)}" fill="${r.color}" data-act="map" data-l="${L.id}" data-id="${r.id}" ${on ? 'stroke="var(--navy)" stroke-width="4"' : ''}/>`;
  }).join('');
  const labels = L.regions.map(r => { const m = (r.a1 + ((r.a2 - r.a1 + 360) % 360) / 2) * Math.PI / 180; return `<text class="svgtxt" text-anchor="middle" x="${(cx + rx * .62 * Math.cos(m)).toFixed(1)}" y="${(cy + ry * .62 * Math.sin(m) + 4).toFixed(1)}">${esc(r.short)}</text>`; }).join('');
  const septa = L.regions.map(r => { const a = r.a1 * Math.PI / 180; return `<line x1="${(cx + 26 * Math.cos(a)).toFixed(1)}" y1="${(cy + 26 * Math.sin(a)).toFixed(1)}" x2="${(cx + rx * Math.cos(a)).toFixed(1)}" y2="${(cy + ry * Math.sin(a)).toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="4 3"/>`; }).join('');
  const svg = `<svg viewBox="0 0 320 262" role="img" aria-label="${esc(L.title)}">${regs}${septa}
    <circle cx="${cx}" cy="${cy}" r="26" fill="var(--bone)" stroke="var(--ink-2)" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="11" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="1"/>
    <text class="svgsm" x="${cx}" y="${cy + 42}" text-anchor="middle">FEMUR</text>${labels}

    info = r ? `<h4>${esc(r.name)}</h4>${r.html}` : `<span class="muted">Tap a compartment to see its muscles and its nerve.</span>`;
  } else {
    const done = st.qi >= L.tests.length;
    info = done ? `<h4>Score: ${st.score}/${L.tests.length}</h4><span class="muted">Press "Test me" again for a new round.</span>`
      : `<h4>${esc(L.tests[st.order[st.qi]].q)}</h4>${st.fb ? `<div class="fb ${st.fb[0]}">${esc(st.fb[1])}</div>` : '<span class="muted">Tap the compartment.</span>'}`;
    if (done) labDone(L.id);
  }
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="explore">Explore</button><button class="mini ${st.mode === 'test' ? 'on' : ''}" data-act="mapmode" data-l="${L.id}" data-v="test">Test me</button>${st.mode === 'test' ? `<span class="muted" style="font-size:.75em;align-self:center">Question ${Math.min(st.qi + 1, L.tests.length)} of ${L.tests.length} · score ${st.score}</span>` : ''}</div>
    <div class="svgw">${svg}</div><div class="info">${info}</div>`;
};
// --- nerve / muscle / movement graph with nerve cuts ---
function gstate(L){ return lst(L.id, () => ({sel: null, cut: {}, mode: 'explore'})); }
function mstat(m, cut){ if (!m.nerves.length) return 'unk'; const c = m.nerves.filter(n => cut[n]).length; return c === 0 ? 'ok' : c === m.nerves.length ? 'lost' : 'weak'; }
LAB.graph = L => {
  const st = gstate(L);
  const M = L.muscles, byId = {}; M.forEach(m => byId[m.id] = m);
  let hlN = {}, hlM = {}, hlV = {};
  if (st.mode === 'explore' && st.sel){
    const [t, id] = st.sel;
    if (t === 'n'){ hlN[id] = 1; M.forEach(m => { if (m.nerves.includes(id)){ hlM[m.id] = 1; m.moves.forEach(v => hlV[v] = 1); } }); }
    if (t === 'm'){ const m = byId[id]; hlM[id] = 1; m.nerves.forEach(n => hlN[n] = 1); m.moves.forEach(v => hlV[v] = 1); }
    if (t === 'v'){ hlV[id] = 1; M.forEach(m => { if (m.moves.includes(id)){ hlM[m.id] = 1; m.nerves.forEach(n => hlN[n] = 1); } }); }
  }
  const any = st.mode === 'explore' && st.sel;
  const ch = (t, id, name, extra) => {
    let c = '';
    if (st.mode === 'explore'){ if (any) c = ((t === 'n' ? hlN : t === 'm' ? hlM : hlV)[id]) ? 'hl' : 'dim'; }
    else { if (t === 'n' && st.cut[id]) c = 'cut'; if (t === 'm'){ const s = mstat(byId[id], st.cut); c = s === 'lost' ? 'lost' : s === 'weak' ? 'weak' : s === 'unk' ? 'unk' : ''; } if (t === 'v') c = extra || ''; }
    return `<button class="chip ${c}" data-act="g" data-l="${L.id}" data-t="${t}" data-id="${id}">${t === 'n' && st.mode === 'cut' ? (st.cut[id] ? '✂ ' : '') : ''}${esc(name)}</button>`;
  };
  // movement status
  const vstat = {};
  let summary = '';
  if (st.mode === 'cut'){
    const lines = [];
    L.moves.forEach(v => {
      const ms = M.filter(m => m.moves.includes(v.id) && m.nerves.length);
      const lost = ms.filter(m => mstat(m, st.cut) === 'lost'), weak = ms.filter(m => mstat(m, st.cut) === 'weak');
      const s = lost.length === ms.length && ms.length ? 'lost' : (lost.length || weak.length) ? 'weak' : 'ok';
      vstat[v.id] = s;
      if (s !== 'ok'){
        const still = ms.filter(m => mstat(m, st.cut) !== 'lost').map(m => m.name + (mstat(m, st.cut) === 'weak' ? ' (partly)' : ''));
        lines.push(`<div><b>${esc(v.name)}</b><span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAKENED'}</span>${still.length ? `<br><span class="muted" style="font-size:.9em">Still working: ${esc(still.join(', '))}</span>` : ''}</div>`);
      }
    });
    const nc = Object.keys(st.cut).filter(k => st.cut[k]).length;
    summary = nc ? (lines.length ? lines.join('') : '<span class="muted">No movement is affected.</span>') : '<span class="muted">Tap a nerve to cut it, or choose a case below.</span>';
  } else {
    const sel = st.sel; let t = '<span class="muted">Tap any nerve, muscle or movement to light up everything connected to it.</span>';
    if (sel){ const [k, id] = sel; const item = k === 'n' ? L.nerves.find(x => x.id === id) : k === 'm' ? byId[id] : L.moves.find(x => x.id === id); t = `<h4>${esc(item.name)}</h4>${item.note ? esc(item.note) : ''}`; }
    summary = t;
  }
  const vchip = v => ch('v', v.id, v.name, st.mode === 'cut' ? (vstat[v.id] === 'lost' ? 'lost' : vstat[v.id] === 'weak' ? 'weak' : '') : '');
  return `<div class="modes"><button class="mini ${st.mode === 'explore' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="explore">Explore links</button><button class="mini ${st.mode === 'cut' ? 'on' : ''}" data-act="gmode" data-l="${L.id}" data-v="cut">Cut a nerve</button>${st.mode === 'cut' ? `<button class="mini" data-act="gclear" data-l="${L.id}">Heal all</button>` : ''}</div>
    ${st.mode === 'cut' ? `<div class="modes">${L.cases.map((c, i) => `<button class="mini" data-act="gcase" data-l="${L.id}" data-i="${i}">${esc(c.name)}</button>`).join('')}</div>` : ''}
    <div class="gcols"><div class="gcol"><h5>Nerves</h5>${L.nerves.map(n => ch('n', n.id, n.name)).join('')}</div>
    <div class="gcol"><h5>Muscles</h5>${M.map(m => ch('m', m.id, m.name)).join('')}</div>
    <div class="gcol"><h5>Movements</h5>${L.moves.map(vchip).join('')}</div></div>
    <div class="info">${summary}</div>${L.footnote ? `<div class="muted" style="font-size:.74em">${L.footnote}</div>` : ''}`;
};

   ${done ? `<div class="done">✓ All sorted${st.wrong ? ` · ${st.wrong} wrong tr${st.wrong === 1 ? 'y' : 'ies'}` : ' with no mistakes'}</div>` : `<div class="muted" style="font-size:.78em;margin:-.3em 0 .5em">${st.sel ? 'Now tap the right box.' : 'Tap an item, then tap its box.'}${st.wrong ? ` Wrong tries: ${st.wrong}.` : ''}</div>`}

A['open-set'] = () => {
  const seg = (k, vals) => `<div class="seg">${vals.map(([v, n]) => `<button class="${String(S.set[k]) === String(v) ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>`;
  ov('Settings', `<div class="setrow"><span>Theme</span>${seg('theme', [['system', 'Auto'], ['light', 'Day'], ['dark', 'Night']])}</div>
   <div class="setrow"><span>Text size</span>${seg('size', [[0.9, 'S'], [1, 'M'], [1.15, 'L']])}</div>
   <div class="setrow"><span>Rapid revision<br><small class="muted">Hides running text; keeps tables, notes, questions and labs.</small></span>${seg('rapid', [[false, 'Off'], [true, 'On']])}</div>
   <div class="setrow"><span>Progress<br><small class="muted">Saved in this browser only.</small></span><button class="btn" data-act="reset">Reset all progress</button></div>`);
};
A.set = a => { let v = a.dataset.v; if (a.dataset.k === 'size') v = +v; if (a.dataset.k === 'rapid') v = v === 'true'; S.set[a.dataset.k] = v; save(); applySet(); A['open-set'](); if (opened) draw(); };
A.reset = a => { if (a.dataset.sure){ S = JSON.parse(JSON.stringify(DEF)); for (const k in LS) delete LS[k]; save(); applySet(); closeOv(); toast('Progress reset'); if (opened) draw(); } else { a.dataset.sure = 1; a.textContent = 'Tap again to confirm'; } };

/* ---------- flashcards (spaced repetition) ---------- */
const STEPS = [60e3, 600e3, 864e5, 1728e5, 3456e5, 6912e5];
const STEPN = ['1 min', '10 min', '1 day', '2 days', '4 days', '8 days'];
let FC = null;
function fcQueue(mode){
  const now = Date.now(); const c = BOOK.cards;
  if (mode === 'cram') return c.map(x => x.id);
  const due = c.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).map(x => x.id);
  const fresh = c.filter(x => !S.cards[x.id]).map(x => x.id);
  return due.concat(fresh);
}
function cloze(t, rev, all){
  let k = 0;
  return esc(t).replace(/\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g, (m, n, ans, hint) => { const i = k++; const r = all || rev[i]; return `<span class="blank ${r ? 'r' : ''}" data-act="fcb" data-i="${i}">${r ? ans : (hint ? esc(hint) : '·····')}</span>`; });
}
A['open-cards'] = () => { FC = {mode: 'learn', q: fcQueue('learn'), i: 0, rev: {}, all: false}; fcDraw(); };
function fcDraw(){
  const c = FC.q[FC.i] ? BOOK.cards.find(x => x.id === FC.q[FC.i]) : null;
  const now = Date.now(); const due = BOOK.cards.filter(x => S.cards[x.id] && S.cards[x.id].due <= now).length; const fresh = BOOK.cards.filter(x => !S.cards[x.id]).length; const learned = Object.values(S.cards).filter(x => x.step >= 2).length;
  const top = `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg"><button class="${FC.mode === 'learn' ? 'on' : ''}" data-act="fcmode" data-v="learn">Due &amp; new</button><button class="${FC.mode === 'cram' ? 'on' : ''}" data-act="fcmode" data-v="cram">Cram all</button></div>
   <div class="meter"><span>Due <b>${due}</b></span><span>New <b>${fresh}</b></span><span>Learned <b>${learned}/${BOOK.cards.length}</b></span></div></div>`;
  let body;
  if (!c){
    const nxt = Object.values(S.cards).map(x => x.due).filter(d => d > now).sort((a, b) => a - b)[0];
    body = `<div class="fc" style="text-align:center"><div class="big">✓</div><p>All caught up${FC.mode === 'cram' ? ' — you went through every card' : ''}.</p>${nxt ? `<p class="muted">Next card is due ${new Date(nxt).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'})}.</p>` : ''}<div class="row" style="justify-content:center"><button class="btn pri" data-act="fcmode" data-v="cram">Cram all cards</button></div></div>`;
  } else {
    const nb = (c.text.match(/\{\{c\d+::/g) || []).length; const allShown = FC.all || Object.keys(FC.rev).length >= nb;
    const s = S.cards[c.id]; const step = s ? s.step : -1;
    const lab = i => STEPN[Math.min(Math.max(i, 0), STEPS.length - 1)];
    body = `<div class="fc"><div class="ctx">${esc(c.sec)} · card ${FC.i + 1} of ${FC.q.length}</div><div>${cloze(c.text, FC.rev, FC.all)}</div>${allShown && c.extra ? `<div class="fcx">${esc(c.extra)}</div>` : ''}</div>
      ${allShown ? `<div class="grade"><button class="g0" data-act="fcg" data-v="0">Again<small>${lab(0)}</small></button><button class="g1" data-act="fcg" data-v="1">Good<small>${lab(step + 1)}</small></button><button class="g2" data-act="fcg" data-v="2">Easy<small>${lab(step + 2)}</small></button></div>`
      : `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn pri" data-act="fcall">Show answer</button><span class="muted" style="font-size:12px">or tap each blank</span></div>`}`;
  }
  ov('Flashcards · ' + BOOK.short, top + body);
}
A.fcmode = a => { FC = {mode: a.dataset.v, q: fcQueue(a.dataset.v), i: 0, rev: {}, all: false}; fcDraw(); };
A.fcb = a => { FC.rev[a.dataset.i] = 1; fcDraw(); };
A.fcall = () => { FC.all = true; fcDraw(); };
A.fcg = a => { const id = FC.q[FC.i]; const v = +a.dataset.v; const s = S.cards[id] || {step: -1};
  if (v === 0) s.step = 0; else s.step = Math.min((s.step < 0 ? -1 : s.step) + v, STEPS.length - 1);
  s.due = Date.now() + STEPS[Math.max(s.step, 0)]; S.cards[id] = s; save();
  if (v === 0 && FC.mode === 'learn') FC.q.push(id);
  FC.i++; FC.rev = {}; FC.all = false; fcDraw(); };

/* ---------- exam mode & mistakes ---------- */
let EX = null;
const MCQ = Object.values(QS).filter(q => q.type === 'mcq');
A['open-exam'] = () => {
  const nB = MCQ.filter(q => q.bank).length;
  if (!nB){ EX = EX || {}; EX.all = true; }
  const past = S.exams.slice(-5).reverse();
  ov('Exam mode · ' + BOOK.short, `<p>${nB ? `Questions from the Final question bank for this lecture${MCQ.length > nB ? ', plus checked extra practice questions' : ''}` : 'Name-it questions on the practical pictures'}. You see your score, your time and every mistake at the end.</p>
   <div class="setrow"><span>Questions</span><div class="seg">${[10, 20, 0].filter(n => !n || n < MCQ.length).map(n => `<button data-act="exstart" data-n="${n}">${n || 'All ' + MCQ.length}</button>`).join('')}</div></div>
   ${nB ? `<div class="setrow"><span>Only Final-bank questions</span><div class="seg"><button class="${!(EX && EX.all) ? 'on' : ''}" data-act="exonly" data-v="1">Yes (${nB})</button><button class="${EX && EX.all ? 'on' : ''}" data-act="exonly" data-v="0">Add extras (${MCQ.length})</button></div></div>` : ''}
   ${past.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Past attempts</h3><div class="lst">${past.map(x => `<div class="it" style="cursor:default;border:1px solid var(--line);border-radius:10px;padding:8px 11px"><b>${x.score}/${x.n}</b>&nbsp; <span class="muted">${new Date(x.date).toLocaleString([], {weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'})} · ${Math.max(1, Math.round(x.secs / 60))} min</span></div>`).join('')}</div>` : ''}`);
};
A.exonly = a => { EX = EX || {}; EX.all = a.dataset.v === '0'; A['open-exam'](); };
A.exstart = a => {
  const all = EX && EX.all; const pool = MCQ.filter(q => all || q.bank);
  const n = +a.dataset.n || pool.length; const qs = shuffled(pool.map(q => q.id), String(Date.now())).slice(0, Math.min(n, pool.length));
  EX = {all, qs, i: 0, picks: {}, t0: Date.now(), kind: 'exam'}; exDraw();
};
function exDraw(){
  if (EX.i >= EX.qs.length) return exEnd();
  const q = QS[EX.qs[EX.i]];
  if (EX.kind === 'retry'){
    const p = EX.picks[q.id];
    const st = p !== undefined ? {pick: p, show: true} : null;
    ov('Mistakes · retry ' + (EX.i + 1) + ' of ' + EX.qs.length, `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, st, 'exp')}${p !== undefined ? `<div class="res ${p === q.ans ? 'ok' : 'bad'}">${p === q.ans ? '✓ Correct — removed from your mistakes' : '✗ The answer is ' + 'ABCDEFGH'[q.ans]}</div><div class="ex">${q.expl}</div><div class="row"><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next question' : 'Finish'}</button></div>` : ''}</div>`);
    return;
  }
  const p = EX.picks[q.id];
  ov(`Question ${EX.i + 1} of ${EX.qs.length}`, `<div class="meter"><span>Answered <b>${Object.keys(EX.picks).length}</b></span><span>Time <b id="extime">0:00</b></span></div>
   <div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, p !== undefined ? {pick: p} : null, 'exp')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn" data-act="exback" ${EX.i ? '' : 'disabled'}>Back</button><button class="btn pri" data-act="exnext">${EX.i + 1 < EX.qs.length ? 'Next' : 'Finish exam'}</button></div>`);
  tick();
}
function tick(){ const el = $('#extime'); if (!el || !EX) return; const s = Math.round((Date.now() - EX.t0) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); clearTimeout(tick.t); tick.t = setTimeout(tick, 1000); }
A.exp = a => { const q = QS[a.dataset.q], i = +a.dataset.i;
  if (EX.kind === 'retry'){ if (EX.picks[q.id] !== undefined) return; EX.picks[q.id] = i; S.ans[q.id] = {pick: i, ok: i === q.ans, t: Date.now()}; if (i === q.ans) delete S.mist[q.id]; save(); exDraw(); return; }
  EX.picks[q.id] = i; exDraw(); };
A.exnext = () => { EX.i++; exDraw(); };
A.exback = () => { if (EX.i) EX.i--; exDraw(); };
function exEnd(){
  clearTimeout(tick.t);
  if (EX.kind === 'retry'){ const left = Object.keys(S.mist).length; ov('Mistakes', `<div class="fc" style="text-align:center"><div class="big">${EX.qs.filter(id => EX.picks[id] === QS[id].ans).length}/${EX.qs.length}</div><p>${left ? left + ' questions still in your mistakes list.' : 'Your mistakes list is empty.'}</p></div>`); return; }
  const secs = Math.round((Date.now() - EX.t0) / 1000); let score = 0; const wrong = [];
  EX.qs.forEach(id => { const q = QS[id], p = EX.picks[id]; const ok = p === q.ans; if (ok){ score++; delete S.mist[id]; } else { S.mist[id] = 1; wrong.push([q, p]); } S.ans[id] = {pick: p === undefined ? -1 : p, ok, t: Date.now()}; });
  S.exams.push({date: Date.now(), n: EX.qs.length, score, secs}); save();
  ov('Exam result', `<div class="fc" style="text-align:center"><div class="big">${score}/${EX.qs.length}</div><p>${Math.round(100 * score / EX.qs.length)}% · ${Math.floor(secs / 60)} min ${secs % 60} s</p></div>
   ${wrong.length ? `<h3 style="font:700 15px var(--f-head);margin:16px 0 4px">Review your mistakes</h3>${wrong.map(([q, p]) => `<div class="qb"><div class="qh">${qtags(q)}</div><div class="qs">${esc(q.stem)}</div>${qimg(q)}${opts(q, {pick: p === undefined ? -1 : p, show: true}, 'none')}<div class="ex">${q.expl}</div></div>`).join('')}` : '<p style="text-align:center">No mistakes. Well done.</p>'}
   <div class="row"><button class="btn pri" data-act="open-exam">New exam</button>${wrong.length ? '<button class="btn" data-act="open-mist">Retry my mistakes</button>' : ''}</div>`);
  if (opened) draw();
}
A['open-mist'] = () => {
  const ids = Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq');
  const later = Object.keys(S.self).filter(id => S.self[id] === 'later' && QS[id]);
  ov('My mistakes', `${ids.length ? `<p>${ids.length} question${ids.length > 1 ? 's' : ''} you got wrong. Retry them; a right answer removes it from the list.</p><div class="row"><button class="btn pri" data-act="mretry">Retry all</button></div>
    <div class="lst">${ids.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem)}</span></button>`).join('')}</div>` : '<p class="muted">No mistakes yet. Wrong answers in check questions, predictions and exams collect here.</p>'}
    ${later.length ? `<h3 style="font:700 14px var(--f-head);margin:16px 0 6px">Written answers to review</h3><div class="lst">${later.map(id => `<button class="it" data-act="jumpq" data-q="${id}"><span class="pgn">${esc(QS[id].tag.replace('Final bank ', ''))}</span><span>${esc(QS[id].stem.split('\n')[0])}</span></button>`).join('')}</div>` : ''}`);
};
A.mretry = () => { const ids = shuffled(Object.keys(S.mist).filter(id => QS[id] && QS[id].type === 'mcq'), String(Date.now())); if (!ids.length) return; EX = {qs: ids, i: 0, picks: {}, t0: Date.now(), kind: 'retry'}; exDraw(); };
A.jumpq = a => { const id = a.dataset.q; const i = BOOK.pages.findIndex(p => (p.blocks || []).some(b => b.q === id)); if (i >= 0) jump(i); else toast('This question is only in exam mode'); };
A.none = () => {};

/* ---------- start ---------- */
function start(){
  if (!BOOK.cards.length) document.querySelectorAll('.bar [data-act="open-cards"]').forEach(b => b.remove());
  if (!MCQ.length) document.querySelectorAll('.bar [data-act="open-exam"]').forEach(b => b.remove());
  if (!Object.keys(QS).length) document.querySelectorAll('.bar [data-act="open-mist"]').forEach(b => b.remove());
  layout();
  home();   // the cover's "Continue on page N" button returns to the saved page
}
start();
})();
</script>

</body>
</html>
