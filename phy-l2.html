<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand .bdg{width:28px;height:28px;align-self:center;flex:none}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover.cimg{background-size:cover;background-position:center;background-color:var(--leather);padding:0;justify-content:flex-end;overflow:hidden}
.cband{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px 20px;background:linear-gradient(rgba(5,14,38,0),rgba(5,14,38,.93) 46%);color:#fff;font:600 14px/1.38 var(--f-head);text-align:left}
.cband small{display:block;margin-bottom:3px;font:700 10px var(--f-head);letter-spacing:.16em;color:#9cc2ff;text-transform:uppercase}
.credit{display:flex;align-items:center;gap:8px;font:500 12.5px var(--f-head);color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.credit img{width:26px;height:26px}.credit b{font-weight:700;color:#fff}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}

.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}
.btn{font:600 .74em var(--f-head);padding:.5em .95em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--band);color:var(--band-ink);border-color:transparent}
.btn.lift{background:var(--sticky);color:var(--sticky-ink);border-color:transparent;font-family:var(--f-hand);font-size:1.05em;font-weight:700}
.flapc{margin-top:.5em;border-radius:.45em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 6px,var(--cover-2) 6px 12px);padding:.9em;text-align:center}
.ans{margin-top:.5em;padding:.6em .75em;border-left:.25em solid var(--ok);background:var(--ok-bg);border-radius:.3em;font-size:.92em;white-space:pre-line;line-height:1.45}
textarea.dr{width:100%;box-sizing:border-box;min-height:4.2em;margin-top:.4em;border:1px dashed var(--line);border-radius:.45em;background:var(--paper);color:var(--ink);font:inherit;font-size:.9em;padding:.5em;resize:vertical}

/* labs */
.labh{display:flex;align-items:center;gap:.55em;margin:0 0 .5em}
.labh .lb{flex:none;background:var(--red);color:#fff;font:700 .6em var(--f-head);letter-spacing:.16em;padding:.3em .65em;border-radius:.3em}
.labh h3{margin:0;font:700 1.08em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.labi{font-size:.88em;color:var(--ink-2);margin:.2em 0 .6em}
.modes{display:flex;flex-wrap:wrap;gap:.35em;margin:.3em 0 .6em}
.svgw{background:var(--paper-2);border:1px solid var(--line);border-radius:.6em;padding:.4em;margin:.3em 0}
.svgw svg{display:block;width:100%;height:auto;max-height:calc(var(--ph) * .44)}
.rg{cursor:pointer;stroke:var(--paper);stroke-width:2.5;transition:filter .15s, opacity .15s}
.rg:hover{filter:brightness(1.07)}
.rg.dim{opacity:.35}
.svgtxt{font:700 11px var(--f-head);fill:var(--ink);pointer-events:none;letter-spacing:.06em}
.svgsm{font:600 8.5px var(--f-head);fill:var(--muted);pointer-events:none;letter-spacing:.08em}
.pinbtn{cursor:pointer}
.pinbtn circle.d{fill:var(--card);stroke:var(--navy);stroke-width:1.6}
.pinbtn.on circle.d{fill:var(--sticky);stroke:var(--red)}
.pinbtn.ok circle.d{fill:var(--ok)}
.pinbtn.bad circle.d{fill:var(--bad)}
.pinbtn text{font:700 8px var(--f-head);fill:var(--navy-ink);pointer-events:none}
.plab{font:700 8.6px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;pointer-events:none}
.key{columns:2;column-gap:1.2em;margin:.3em 0 .4em;padding-left:1.6em;font-size:.8em;line-height:1.45}.key li{break-inside:avoid}
.info{background:var(--card);border:1px solid var(--line);border-radius:.55em;padding:.55em .7em;font-size:.88em;margin:.4em 0;min-height:2.6em}
.info h4{margin:0 0 .2em;font:700 .95em var(--f-head);color:var(--navy-ink)}
.fb{font:700 .8em var(--f-head);margin:.3em 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:.35em;margin:.4em 0 .7em;min-height:1.8em}
.chip{font:700 .74em var(--f-body);padding:.36em .62em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;line-height:1.2;text-align:left}
.chip.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok);cursor:default}
.chip.hl{background:var(--band);color:var(--band-ink);border-color:transparent}
.chip.dim{opacity:.35}
.chip.cut{background:var(--bad);color:#fff;border-color:transparent}
.chip.lost{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.chip.weak{background:#fff4d6;border-color:#e0a422;color:#8a5a00}
:root[data-theme="dark"] .chip.weak{background:#433513;color:#f3cf74}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.weak{background:#433513;color:#f3cf74} }
.chip.unk{border-style:dashed}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.4em,1fr));gap:.45em}
.bin{border:1.5px dashed var(--edge);border-radius:.6em;padding:.45em;min-height:4.2em;cursor:pointer;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:.3em;align-items:flex-start}
.bin:hover{border-color:var(--blue)}
.bin h5{margin:0;font:700 .68em var(--f-head);letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase}
.bin small{font-size:.66em;color:var(--muted);margin-top:-.25em}
.bin .in{display:flex;flex-wrap:wrap;gap:.25em}
.seqline{display:flex;flex-wrap:wrap;align-items:center;gap:.3em;min-height:2.2em;margin:.3em 0 .6em;padding:.4em;border-radius:.5em;background:var(--paper-2);border:1px solid var(--line)}
.seqline .n{font:700 .62em var(--f-head);color:var(--muted)}
.gcols{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:.5em}
.gcols h5{margin:0 0 .3em;font:700 .62em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcol{display:flex;flex-direction:column;gap:.3em;align-items:stretch}
.gcol .chip{font-size:.68em}
.st{font:700 .62em var(--f-head);padding:.12em .5em;border-radius:1em;margin-left:.3em;white-space:nowrap}
.st.lost{background:var(--bad);color:#fff}.st.weak{background:#e0a422;color:#fff}.st.ok{background:var(--ok);color:#fff}
.done{margin:.5em 0;padding:.5em .7em;border-radius:.45em;background:var(--ok-bg);color:var(--ok);font:700 .82em var(--f-head)}
.ref{margin-top:.8em;font:600 .62em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.title-page{display:flex;flex-direction:column;min-height:100%;justify-content:center;gap:.6em}
.kick{font:600 .66em var(--f-head);letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.ttl{margin:0;font:700 1.95em/1.12 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sub{color:var(--ink-2);font-size:.95em}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.6em 0}
.facts div{background:var(--paper-2);border:1px solid var(--line);border-radius:.55em;padding:.55em;text-align:center}
.facts b{display:block;font:700 1.35em var(--f-head);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.facts span{font:600 .58em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.map{list-style:none;padding:0;margin:.4em 0;display:flex;flex-direction:column;gap:.3em}
.map li button{width:100%;display:flex;align-items:center;gap:.6em;padding:.45em .55em;border-radius:.5em;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;color:var(--ink)}
.map li button:hover{border-color:var(--blue)}
.map .mn{flex:none;width:1.9em;height:1.9em;border-radius:50%;display:grid;place-items:center;background:var(--band);color:var(--band-ink);font:700 .7em var(--f-head)}
.map .mt{flex:1;font:600 .86em var(--f-head);color:var(--navy-ink)}
.map .mp{font:600 .7em var(--f-head);color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:auto 1fr;gap:.35em .6em;align-items:center;font-size:.82em;margin:.5em 0}
.legend i{font-style:normal;width:1.8em;height:1.3em;border-radius:.25em;display:inline-block}
body.rapid .tx, body.rapid .hook{display:none}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,10,20,.55);padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);color:var(--ink);width:min(680px,100%);max-height:100%;overflow:auto;border-radius:16px;box-shadow:0 30px 60px rgba(0,0,0,.45);font-size:15px;line-height:1.5;display:flex;flex-direction:column}
.ph{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.ph h2{margin:0;font:700 17px var(--f-head);color:var(--navy-ink);flex:1;min-width:0}
.ph .x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center}
.pb{padding:14px 16px 18px}
.pb .qb{font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;font:600 13px var(--f-head);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--band);color:var(--band-ink)}
.fc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px 18px 16px;min-height:150px;font-size:17px;line-height:1.55;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.fc .ctx{font:600 11px var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.blank{display:inline-block;min-width:3.2em;border-radius:6px;padding:0 .35em;margin:0 .1em;background:var(--chip);border:1px dashed var(--blue);color:transparent;cursor:pointer;line-height:1.35}
.blank.r{background:var(--hl);border-style:solid;border-color:transparent;color:var(--ink);font-weight:700;cursor:default}
.fcx{margin-top:12px;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;cursor:pointer;font:700 14px var(--f-head);color:var(--ink)}
.grade small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.grade .g0{border-color:var(--bad);color:var(--bad)}.grade .g1{border-color:var(--blue);color:var(--blue)}.grade .g2{border-color:var(--ok);color:var(--ok)}
.meter{display:flex;gap:14px;flex-wrap:wrap;font:600 12px var(--f-head);color:var(--muted);margin:10px 0}
.meter b{color:var(--navy-ink);font-variant-numeric:tabular-nums}
.big{font:700 40px var(--f-head);color:var(--navy-ink);font-variant-numeric:tabular-nums}
.lst{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.lst button.it{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--ink);font-size:14px}
.lst .pgn{font:700 12px var(--f-head);color:var(--blue);flex:none;font-variant-numeric:tabular-nums}
input.srch{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px;font-size:15px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:9px 16px;border-radius:12px;font:600 13px var(--f-head);z-index:60;box-shadow:0 10px 24px rgba(0,0,0,.35)}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* section priority chips */
.sh .sht{display:inline-flex;flex-wrap:wrap;gap:.3em;margin-left:auto}
.sh .sht .tg{font-size:.56em;white-space:nowrap}
/* recall lab: the start of each fact stays visible, the rest is covered until tapped */
.rcg{margin:.85em 0 .3em;font:700 .72em var(--f-head);letter-spacing:.06em;color:var(--navy-ink);text-transform:uppercase}
.rci{display:block;width:100%;text-align:left;margin:.3em 0;padding:.45em .6em;border-radius:.45em;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.92em;line-height:1.45;cursor:pointer}
.rci .cue{font-weight:700;color:var(--navy-ink)}
.rci .hid{color:transparent;border-radius:.25em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rci.on{border-color:var(--ok);background:var(--ok-bg)}
/* figures in questions */
.qf{margin:.5em 0 .6em;text-align:center}
.qf img{max-width:100%;max-height:calc(var(--ph) * .42);border-radius:.4em;border:1px solid var(--line);background:#fff}
.panel .qf img{max-height:46vh}
.qf figcaption{font-size:.74em;color:var(--muted);margin-top:.25em}
/* links back to the library and on to the next lecture */
.libl{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--f-head);color:#fff;text-decoration:none;padding:7px 12px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18)}
.endnav{display:flex;flex-direction:column;gap:.5em;margin:.8em 0}
.endnav a{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.7em .85em;border-radius:.6em;border:1px solid var(--line);background:var(--card);color:var(--navy-ink);text-decoration:none;font:600 .9em var(--f-head)}
.endnav a small{display:block;font:500 .78em var(--f-body);color:var(--muted)}
/* real-image lab: the slide picture with its own printed labels as tap targets */
.slw{position:relative;margin:.35em 0;border-radius:.5em;overflow:hidden;border:1px solid var(--line);background:#fff}
.slw img{display:block;width:100%;height:auto}
.slo{position:absolute;inset:0}
.sb{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:.3em;cursor:pointer;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.sb.cv{background:repeating-linear-gradient(135deg,#d6cfbe 0 5px,#e9e3d5 5px 10px);box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.sb.on{box-shadow:0 0 0 2px var(--ok)}
.sb.sel{box-shadow:0 0 0 3px #2e86de}
.sb.hl{box-shadow:0 0 0 3px #ffc928;animation:slpulse 1.3s ease-in-out infinite}
.sb.dim{background:rgba(255,255,255,.62)}
.sb.lost{box-shadow:0 0 0 3px #d64545;background:rgba(214,69,69,.28)}
.sb.weak{box-shadow:0 0 0 3px #e0a422;background:rgba(224,164,34,.25)}
.sb.ok{box-shadow:0 0 0 3px #1e9e62;background:rgba(30,158,98,.18)}
.sb.bad{box-shadow:0 0 0 3px #d64545;background:rgba(214,69,69,.22)}
.sb.mk{border-radius:50%}
@keyframes slpulse{0%,100%{box-shadow:0 0 0 3px #ffc928,0 0 4px 2px rgba(255,201,40,.55)}50%{box-shadow:0 0 0 3px #ffc928,0 0 16px 6px rgba(255,201,40,.95)}}
.slx .chiprow{display:flex;flex-wrap:wrap;gap:.3em;margin:.35em 0}
.panel.wide{width:min(1100px,100%)}
.slbig .slw{min-width:760px}
.slbigw{overflow:auto;-webkit-overflow-scrolling:touch}
/* iPhone/iPad: Safari zooms into any text field under 16px when it is tapped */
@supports (-webkit-touch-callout:none){ input.srch,textarea.dr{font-size:16px} }
</style>

</head>

<div id="app">
  <header class="bar">
    <button class="brand" data-act="home" aria-label="Back to the cover"><img class="bdg" src="helpers_badge_64.png" alt="" onerror="this.remove()"><b>MSK<em class="bw"> Interactive</em> Book</b><span id="chap"></span></button>
    <div class="sp"></div>
    <span class="pgind" id="pgind"></span>
    <div class="prog" title="Pages read"><i id="progi" style="width:0"></i></div>
    <button class="ib" data-act="open-toc" aria-label="Contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lb">Contents</span></button>
    <button class="ib" data-act="open-search" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="lb">Search</span></button>
    <button class="ib" data-act="open-cards" aria-label="Flashcards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg><span class="lb">Flashcards</span></button>
    <button class="ib" data-act="open-exam" aria-label="Exam mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 2h3v15H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg><span class="lb">Exam</span></button>
    <button class="ib" data-act="open-mist" aria-label="Mistakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg><span class="lb">Mistakes</span></button>
    <button class="ib" data-act="open-set" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="lb">Settings</span></button>

  <main class="stage" id="stage">

      <div class="pg pg-l" id="pgL"></div>

      <div class="leaf" id="leaf" hidden><div class="face front" id="lf"></div><div class="face back" id="lb"></div></div>

      <button class="turn next" data-act="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="home" id="home"></div>
  </main>
  <nav class="mnav" id="mnav" hidden>
    <button data-act="prev" aria-label="Previous page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="mid" id="mmid"></span>
    <button data-act="next" aria-label="Next page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>

ometric 0"]}, {"t": "h", "no": "7.2", "title": "Smooth muscle — contraction vs relaxation"}, {"t": "list", "items": ["<b>Contraction:<\/b> depolarization, ligand channels, ↑ IP3, CICR, MLCK, MLC phosphorylated", "<b>Relaxation:<\/b> hyperpolarization, cAMP/cGMP, ↓ IP3, ↑ SR Ca2+-ATPase, MLC phosphatase"]}], "toc": ["07", "Master Comparison"]}, {"id": "p42", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l2-6-0", "title": "Recall · Master Comparison", "groups": [{"title": "7.1 The four changes during contraction", "items": [["Electrical:", "RMP −90, FL −65, 120 mV, 1–4 ms, 3–5 m/s, contraction after 2 ms"], ["Chemical:", "2 ATP + lactic acid vs 38 ATP; ATP ~6 s, CrP ~10 s"], ["Thermal:", "100–1000× rest, 40–50% work, 50–60% heat"], ["Mechanical efficiency:", "isotonic 40–50%, isometric 0"]]}, {"title": "7.2 Smooth muscle — contraction vs relaxation", "items": [["Contraction:", "depolarization, ligand channels, ↑ IP3, CICR, MLCK, MLC phosphorylated"], ["Relaxation:", "hyperpolarization, cAMP/cGMP, ↓ IP3, ↑ SR Ca2+-ATPase, MLC phosphatase"]]}]}], "labName": "Recall · Master Comparison"}, {"id": "p43", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps · Self-test from the lecture"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["<b>Energy source of exhausted muscle:<\/b> ADP", "Isotonic needs more O2 and nutrients than isometric"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["Every Cell Tries Moving; Deeper Bigger Longer Slower; 6–10–40–Hours; 2 vs 38", "Iso-TONIC = same tone; Iso-METRIC = same metre; GUBU unitary"]}, {"t": "h", "no": "8.3", "title": "Self-test from the lecture"}, {"t": "list", "items": ["<b>Isotonic contraction:<\/b> muscle shortening occurs (correct answer)", "Zero efficiency, heavy load, marked tension rise, no work all describe isometric"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p44", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l2-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Energy source of exhausted muscle:", "ADP"], ["Isotonic needs more", "O2 and nutrients than isometric"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["Every Cell Tries Moving", "Deeper Bigger Longer Slower; 6–10–40–Hours; 2 vs 38"], ["Iso-TONIC =", "same tone; Iso-METRIC = same metre; GUBU unitary"]]}, {"title": "8.3 Self-test from the lecture", "items": [["Isotonic contraction:", "muscle shortening occurs (correct answer)"], ["Zero efficiency, heavy load", "marked tension rise, no work all describe isometric"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p45", "head": "Real images · 1 of 2", "kind": "lab", "blocks": [{"t": "h", "no": "◉", "title": "Real images from the practical"}, {"t": "note", "kind": "def", "title": "Real images", "html": "Pictures from this year's practical slides that belong to this lecture, with their own labels. <b>Test me<\/b> covers the labels and <b>Find it<\/b> asks you to find each one. Every slide of the session is in the practical book: <a href=\"prac-phy-1.html\">Physiology practical · EMG I – Standard &amp; integrated EMG<\/a>."}, {"t": "lab", "lab": "sl310"}], "toc": ["◉", "Real images from the practical"], "labName": "EXPERIMENTAL METHODS"}, {"id": "p46", "head": "Real images · 2 of 2", "kind": "lab", "blocks": [{"t": "lab", "lab": "sl314"}], "labName": "C. DATA RECORDING"}, {"id": "p47", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "After its AP a nerve fibre releases ACh, whereas a muscle fibre contracts (after ~2 ms)"}, {"t": "note", "kind": "trap", "html": "Muscle firing level is −65 mV (−55 mV is nerve)"}, {"t": "note", "kind": "trap", "html": "Muscle AP is longer than nerve AP but conducts far slower"}, {"t": "note", "kind": "trap", "html": "Lactic acid = anaerobic (2 ATP), not aerobic"}, {"t": "note", "kind": "trap", "html": "More than half the energy is lost as heat"}, {"t": "note", "kind": "trap", "html": "Isometric: no work, zero efficiency — but tension increases and force maximal"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p48", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Isotonic needs more O2 &amp; nutrients than isometric; its tension stays constant"}, {"t": "note", "kind": "trap", "html": "Smooth muscle has no troponin/tropomyosin — calmodulin instead"}, {"t": "note", "kind": "trap", "html": "Unphosphorylated MLC = relaxation (very low affinity)"}, {"t": "note", "kind": "trap", "html": "cAMP/cGMP relax smooth muscle (inhibit Ca2+ channels)"}, {"t": "note", "kind": "trap", "html": "Gap junctions = unitary; multiunit has little or no coupling"}, {"t": "note", "kind": "trap", "html": "MLC slide label reads 'relaxation' by mistake — binding = contraction"}]}, {"id": "p49", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"Q0827": {"id": "Q0827", "stem": "In isotonic contraction, the length of the muscle fibre is ____, while the tension developed remains the same.", "top": false, "rep": "", "tag": "Final bank PHY W4", "bank": true, "expl": "In isotonic contraction the muscle shortens and moves a light or moderate load while its tension stays constant (iso-TONIC = same tone). In isometric contraction it is the length that stays constant while the tension rises.", "type": "written", "keyhtml": "Shortened."}, "Q0829": {"id": "Q0829", "stem": "In contrast to striated muscle, smooth muscle lacks ____.", "top": false, "rep": "", "tag": "Final bank PHY W5", "bank": true, "expl": "Striated muscle is regulated by troponin and tropomyosin, whereas smooth muscle lacks both and uses calmodulin: the Ca²⁺–calmodulin complex activates myosin light-chain kinase (MLCK). In both types, tension is produced by actin–myosin binding.", "type": "written", "keyhtml": "Troponin and tropomyosin (smooth muscle has calmodulin instead)."}, "Q0874": {"id": "Q0874", "stem": "As regards isotonic contraction:", "top": true, "rep": "asked 2 years", "tag": "Final bank PHY Q14", "bank": true, "expl": "In isotonic contraction the muscle shortens and moves a light or moderate load, with maximum mechanical efficiency (40–50%) and constant tension. A heavy load, zero efficiency and a marked rise in tension all describe isometric contraction.", "type": "mcq", "opts": ["Muscle shortening occurs", "It occurs when muscle contracts against a heavy load", "Mechanical efficiency is zero", "Muscle tension increases markedly"], "ans": 0}, "N-PHY-L2-01": {"id": "N-PHY-L2-01", "stem": "In a physiology practical, a student records an action potential from an isolated nerve fibre and another from a skeletal muscle fibre. Compared with the nerve fibre action potential, the skeletal muscle fibre action potential:", "top": false, "rep": "", "tag": "Final bank PHY Q15", "bank": true, "expl": "The muscle AP lasts 1–4 msec (nerve 0.5–1 msec) but is conducted at only 3–5 m/sec (nerve up to 120 m/sec): Deeper, Bigger, Longer, Slower. A firing level of −55 mV and release of acetylcholine after the AP belong to the nerve fibre; the muscle fires at −65 mV and contracts after about 2 msec.", "type": "mcq", "opts": ["Arises from a less negative resting membrane potential", "Reaches its firing level at −55 mV", "Has a smaller spike potential", "Lasts longer and is conducted more slowly", "Is followed by release of acetylcholine"], "ans": 3}, "N-PHY-L2-02": {"id": "N-PHY-L2-02", "stem": "Compare between the action potential of a nerve fibre and that of a skeletal muscle fibre.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Compared with the nerve, the muscle AP starts from a more negative RMP, fires at −65 mV, is bigger and longer, but conducts far more slowly (Deeper, Bigger, Longer, Slower).", "type": "written", "keyhtml": "• Resting membrane potential: nerve −70 mV; muscle −90 mV\n• Firing level: nerve −55 mV; muscle −65 mV\n• Magnitude of spike potential: nerve 105 mV; muscle 120 mV\n• Duration of AP: nerve 0.5–1 msec; muscle 1–4 msec\n• Velocity of conduction: nerve up to 120 m/sec; muscle 3–5 m/sec\n• After the AP: nerve releases acetylcholine; muscle contracts after about 2 msec"}, "N-PHY-L2-03": {"id": "N-PHY-L2-03", "stem": "A skeletal muscle fibre at its resting membrane potential receives a small graded (local) depolarization. At which membrane potential will this depolarization reach firing level and trigger an action potential?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The muscle fibre rests at −90 mV, and a local potential rises to the threshold (firing level) of −65 mV. −55 mV is the firing level of a nerve fibre and −70 mV is the nerve's resting membrane potential.", "type": "mcq", "opts": ["−90 mV", "−70 mV", "−65 mV", "−55 mV"], "ans": 2}, "N-PHY-L2-04": {"id": "N-PHY-L2-04", "stem": "While recording a skeletal muscle action potential, a student notices that after repolarization the membrane potential briefly becomes more negative than the resting level of −90 mV. This phase is due to:", "top": false, "rep": "", "tag": "Final bank PHY Q16", "bank": true, "expl": "Hyperpolarization occurs because voltage-gated K⁺ channels remain open after the potential reaches the resting level, so the potential dips below the RMP. Opening of Na⁺ channels causes depolarization, and closure of Na⁺ channels (with K⁺ channel opening) causes repolarization.", "type": "mcq", "opts": ["Opening of voltage-gated Na⁺ channels", "Closure of voltage-gated Na⁺ channels", "Persistent opening of voltage-gated K⁺ channels", "A local graded potential"], "ans": 2}, "N-PHY-L2-05": {"id": "N-PHY-L2-05", "stem": "Which of the following statements about excitation–contraction coupling in skeletal muscle is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The muscle AP comes first and the rise in tension follows it; the delay between them is the latent period. The contraction lasts much longer than the brief AP, and it is the nerve fibre, not the muscle fibre, that releases acetylcholine after its AP.", "type": "mcq", "opts": ["The rise in tension starts before the muscle action potential", "The muscle action potential lasts longer than the contraction", "After its action potential, the muscle fibre releases acetylcholine", "Tension begins after a latent period that follows the action potential"], "ans": 3}, "N-PHY-L2-06": {"id": "N-PHY-L2-06", "stem": "An isolated muscle is stimulated repeatedly in an experiment until it becomes exhausted. In this exhausted state, energy for further contraction is obtained from:", "top": false, "rep": "", "tag": "Final bank PHY Q17", "bank": true, "expl": "When the other sources are exhausted, the exhausted muscle obtains its energy from ADP. Stored ATP and creatine phosphate are used first, then glycogen anaerobically and several fuels aerobically, so these are already used up in an exhausted muscle.", "type": "mcq", "opts": ["Creatine phosphate", "Glycogen by anaerobic glycolysis", "Fatty acids by aerobic oxidation", "ADP", "Stored ATP"], "ans": 3}, "N-PHY-L2-07": {"id": "N-PHY-L2-07", "stem": "Which of the following correctly matches a source of energy for muscle contraction with its pathway and yield?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Glycogen and glucose broken down by anaerobic glycolysis yield 2 ATP + lactic acid, while fatty acids, amino acids and glucose oxidized aerobically via the Krebs cycle yield 38 ATP (2 vs 38). Direct phosphorylation is the creatine phosphate route (CrP + ADP → ATP).", "type": "mcq", "opts": ["Glycogen — anaerobic glycolysis — 2 ATP and lactic acid", "Fatty acids — anaerobic glycolysis — 38 ATP", "Glucose — aerobic oxidation (Krebs cycle) — 2 ATP and lactic acid", "Amino acids — direct phosphorylation — 38 ATP", "ADP — aerobic oxidation (Krebs cycle) — 38 ATP"], "ans": 0}, "N-PHY-L2-08": {"id": "N-PHY-L2-08", "stem": "Enumerate the sources of energy for skeletal muscle contraction, mentioning the pathway and yield of each.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Energy sources are used in order: stored ATP, creatine phosphate, anaerobic glycolysis (2 ATP + lactic acid) and aerobic oxidation (38 ATP); the exhausted muscle obtains energy from ADP.", "type": "written", "keyhtml": "• Stored ATP and creatine phosphate — used first (ATP ~6 s, CrP ~10 s); CrP + ADP → ATP (direct phosphorylation)\n• Glycogen and glucose — anaerobic oxidation (glycolysis) → 2 ATP + lactic acid (up to ~30–40 s)\n• Fatty acids, amino acids and glucose — aerobic oxidation (Krebs cycle) → 38 ATP (prolonged exercise, hours)\n• Exhausted muscle — energy from ADP when the other sources are exhausted"}, "N-PHY-L2-09": {"id": "N-PHY-L2-09", "stem": "A sprinter runs all-out for about 30 seconds. Once the stored ATP and creatine phosphate have been used up in the first seconds, which of the following mainly supplies energy for the rest of the sprint?", "top": false, "rep": "", "tag": "Final bank PHY Q18", "bank": true, "expl": "Stored ATP lasts about 6 s and creatine phosphate about 10 s; glycogen is then broken down anaerobically up to about 30–40 s, giving 2 ATP + lactic acid (6 – 10 – 40 – Hours). The aerobic pathway (38 ATP from several fuels) supplies prolonged exercise lasting hours.", "type": "mcq", "opts": ["Glycogen by anaerobic glycolysis, yielding 2 ATP and lactic acid", "Fatty acids by aerobic oxidation, yielding 38 ATP", "Creatine phosphate by direct phosphorylation of ADP", "Glucose by aerobic oxidation, yielding 2 ATP and lactic acid", "Amino acids by anaerobic glycolysis, yielding 38 ATP"], "ans": 0}, "N-PHY-L2-10": {"id": "N-PHY-L2-10", "stem": "During a strong contraction, heat production in a skeletal muscle rises to about 100–1000 times its resting level. What fraction of the energy used in contraction is liberated as heat?", "top": false, "rep": "", "tag": "Final bank PHY Q19", "bank": true, "expl": "Only 40–50% of the energy used in contraction is converted into work, and the remaining 50–60% (more than half) is liberated as heat. 40–50% is the work fraction, which also equals the maximum mechanical efficiency of isotonic contraction.", "type": "mcq", "opts": ["10–20%", "25–35%", "40–50%", "50–60%", "70–80%"], "ans": 3}, "N-PHY-L2-11": {"id": "N-PHY-L2-11", "stem": "Which of the following statements about heat production in skeletal muscle is correct?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Heat is produced in two phases: initial heat during muscle exercise and delayed heat after it. More than half the energy (50–60%) is liberated as heat, and heat production during contraction is about 100–1000 times the resting level.", "type": "mcq", "opts": ["Initial heat is produced after the muscle exercise ends", "Delayed heat is produced after the muscle exercise ends", "Most of the energy used in contraction is converted into work", "Heat production during contraction is 40–50% of the resting level"], "ans": 1}, "N-PHY-L2-12": {"id": "N-PHY-L2-12", "stem": "A weightlifter strains to lift a barbell that is too heavy for him. The bar does not leave the floor and his arm muscles do not shorten. Which of the following is true of this contraction?", "top": false, "rep": "", "tag": "Final bank PHY Q20", "bank": true, "expl": "Straining against a heavy load without shortening is isometric contraction: no movement, no work and zero efficiency, yet tension increases and the force developed is maximal. A 40–50% efficiency, constant tension and the greater O₂ and nutrient requirement all belong to isotonic contraction.", "type": "mcq", "opts": ["Its mechanical efficiency is maximal, at 40–50%", "External work is done because the muscle contracts", "Muscle tension increases and the force developed is maximal", "It needs more O₂ and nutrients than an isotonic contraction", "Muscle tension stays constant while muscle length changes"], "ans": 2}, "N-PHY-L2-13": {"id": "N-PHY-L2-13", "stem": "Which of the following is greater in isotonic contraction than in isometric contraction?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Isotonic contraction moves a light or moderate load and needs more O₂ and nutrients than isometric contraction. Isometric contraction is against a heavy load, with increased tension and maximal force.", "type": "mcq", "opts": ["Force developed", "Rise in muscle tension", "Load against which the muscle contracts", "O₂ and nutrient requirement"], "ans": 3}, "N-PHY-L2-14": {"id": "N-PHY-L2-14", "stem": "Compare between isotonic and isometric muscle contraction.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Iso-TONIC keeps the same tone (tension constant, length changes), while iso-METRIC keeps the same length (tension rises, no work, zero efficiency, maximal force).", "type": "written", "keyhtml": "• Load: isotonic light or moderate; isometric heavy\n• Muscle length: isotonic shortens; isometric not shortened\n• Movement: isotonic moves; isometric no movement\n• Work: isotonic done; isometric no work\n• Mechanical efficiency: isotonic maximum (40–50%); isometric zero\n• O₂ and nutrient requirement: isotonic greater; isometric lesser\n• Muscle tension: isotonic constant; isometric increased\n• Force developed: isotonic not maximal; isometric maximal"}, "N-PHY-L2-15": {"id": "N-PHY-L2-15", "stem": "Which of the following describes the cells of the smooth muscle layer in the wall of the ureter?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Smooth muscle cells are fusiform (spindle-shaped) with one central nucleus; they are non-striated, involuntary and produce slow, wave-like contractions. The ureter is unitary smooth muscle with gap-junction coupling, so 'little or no coupling' (multiunit) does not apply.", "type": "mcq", "opts": ["Striated cells under voluntary control", "Fusiform cells, each with one central nucleus", "Cells regulated by troponin and tropomyosin", "Cells with little or no coupling, each a separate motor unit", "Cells that produce rapid contractions"], "ans": 1}, "N-PHY-L2-16": {"id": "N-PHY-L2-16", "stem": "During micturition, action potentials occur simultaneously in all the smooth muscle cells of the urinary bladder, so that the whole organ contracts and empties at once. This coordinated behaviour is due to:", "top": false, "rep": "", "tag": "Final bank PHY Q21", "bank": true, "expl": "The bladder is unitary smooth muscle: its cells are linked by gap junctions, low-resistance pathways for current flow that permit electrical coupling, so the entire organ contracts at once. Separate motor units, dense postganglionic innervation and little or no coupling describe multiunit smooth muscle.", "type": "mcq", "opts": ["Gap junctions that provide low-resistance pathways for current flow", "Each fibre behaving as a separate motor unit", "Dense postganglionic innervation of every individual fibre", "Troponin and tropomyosin regulating all the fibres together", "Little or no electrical coupling between the cells"], "ans": 0}, "N-PHY-L2-17": {"id": "N-PHY-L2-17", "stem": "Which of the following smooth muscles shows little or no coupling between its cells, so that each fibre behaves as a separate motor unit regulated by postganglionic autonomic fibres?", "top": false, "rep": "", "tag": "Final bank PHY Q22", "bank": true, "expl": "Multiunit smooth muscle (iris, ciliary muscles of the lens) has little or no coupling, each fibre acting as a separate motor unit densely innervated by postganglionic parasympathetic and sympathetic fibres. The GIT, uterus, bladder and ureter are unitary smooth muscle linked by gap junctions (GUBU).", "type": "mcq", "opts": ["Smooth muscle of the GIT wall", "Uterine smooth muscle", "Ureteric smooth muscle", "Smooth muscle of the iris", "Urinary bladder smooth muscle"], "ans": 3}, "N-PHY-L2-18": {"id": "N-PHY-L2-18", "stem": "Compare between unitary (single-unit) and multiunit smooth muscle.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Unitary smooth muscle is united by gap junctions and contracts as one organ (GUBU: GIT, uterus, bladder, ureter), while multiunit smooth muscle has many separate units under dense autonomic innervation (the eye).", "type": "written", "keyhtml": "• Sites: unitary — GIT, bladder, uterus, ureter; multiunit — iris, ciliary muscles of the lens\n• Coupling: unitary — cells linked by gap junctions (low-resistance pathways for current flow) → electrical coupling; multiunit — little or no coupling between cells\n• Behaviour: unitary — contracts in a coordinated fashion, the whole organ at once (e.g. APs occur simultaneously in all bladder cells so the entire organ contracts); multiunit — each fibre behaves as a separate motor unit (similar to skeletal muscle)\n• Nerve supply: multiunit — densely innervated by postganglionic parasympathetic and sympathetic fibres that regulate its function"}, "N-PHY-L2-19": {"id": "N-PHY-L2-19", "stem": "In an experiment, drug X is added to a bath containing a strip of intestinal smooth muscle and a skeletal muscle. On stimulation, the skeletal muscle contracts normally but the smooth muscle fails to contract. Drug X most likely blocks:", "top": false, "rep": "", "tag": "Final bank PHY Q23", "bank": true, "expl": "Smooth muscle lacks troponin and tropomyosin and uses calmodulin instead: Ca²⁺–calmodulin activates MLCK to start contraction. Troponin and tropomyosin are present only in striated muscle, while tension in both types depends on actin–myosin binding, so blocking actin or myosin would stop both muscles.", "type": "mcq", "opts": ["Troponin", "Tropomyosin", "Calmodulin", "Actin", "Myosin"], "ans": 2}, "N-PHY-L2-20": {"id": "N-PHY-L2-20", "stem": "When the cytosolic Ca²⁺ concentration in a smooth muscle cell falls to a low level, which enzyme becomes dominant?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "High cytosolic Ca²⁺ lets MLCK dominate, whereas low cytosolic Ca²⁺ lets MLC phosphatase dominate and the muscle relaxes (Kinase Kontracts, Phosphatase Pauses). Phospholipase C acts in the IP₃ pathway that raises Ca²⁺.", "type": "mcq", "opts": ["Myosin light-chain kinase (MLCK)", "Myosin light-chain (MLC) phosphatase", "Phospholipase C", "Myosin ATPase"], "ans": 1}, "N-PHY-L2-21": {"id": "N-PHY-L2-21", "stem": "Which of the following sequences of events correctly leads to contraction of smooth muscle?", "top": false, "rep": "", "tag": "Final bank PHY Q24", "bank": true, "expl": "A rise in cytosolic Ca²⁺ forms Ca²⁺–calmodulin, which activates MLCK; MLCK phosphorylates the myosin light chains, myosin ATPase activity rises and myosin binds actin, giving cross-bridge cycling and tension. Smooth muscle has no troponin, and MLCK must be activated by Ca²⁺–calmodulin before it can phosphorylate MLC.", "type": "mcq", "opts": ["↑ Ca²⁺ → Ca²⁺–calmodulin → ↑ MLCK → MLC phosphorylation → cross-bridge cycling", "↑ Ca²⁺ → Ca²⁺–troponin → ↑ MLCK → MLC phosphorylation → cross-bridge cycling", "↑ Ca²⁺ → ↑ MLCK → Ca²⁺–calmodulin → MLC phosphorylation → cross-bridge cycling", "↓ Ca²⁺ → Ca²⁺–calmodulin → ↑ MLCK → MLC phosphorylation → cross-bridge cycling", "↑ Ca²⁺ → Ca²⁺–calmodulin → MLC phosphorylation → ↑ MLCK → cross-bridge cycling"], "ans": 0}, "N-PHY-L2-22": {"id": "N-PHY-L2-22", "stem": "A hormone binds a G-protein-coupled receptor on a smooth muscle cell and activates phospholipase C. The rise in cytosolic Ca²⁺ produced through this pathway is due to:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In the IP₃ route, hormone → receptor → G protein → phospholipase C splits PIP₂ → IP₃, which opens the SR channel and releases Ca²⁺. Increased SR Ca²⁺-ATPase activity and cGMP lower Ca²⁺ and relax smooth muscle.", "type": "mcq", "opts": ["IP₃ formed from PIP₂ opening SR channels to release Ca²⁺", "Depolarization opening voltage-gated Ca²⁺ channels", "Increased activity of the SR Ca²⁺-ATPase pump", "cGMP directly opening membrane Ca²⁺ channels", "Activation of myosin light-chain phosphatase"], "ans": 0}, "N-PHY-L2-23": {"id": "N-PHY-L2-23", "stem": "a) Mention three mechanisms that increase intracellular Ca²⁺ in smooth muscle.\nb) Enumerate four mechanisms that cause relaxation of smooth muscle.", "top": false, "rep": "", "tag": "Final bank PHY W6", "bank": true, "expl": "Ca²⁺ rises by the V-L-I routes: voltage-gated channels, ligand-gated channels and IP₃-triggered release from the SR. Relaxation reverses these: hyperpolarization, cAMP/cGMP, less IP₃ and more SR Ca²⁺-ATPase activity.", "type": "written", "keyhtml": "a) Mechanisms that raise intracellular Ca²⁺ (V-L-I):\n• Depolarization opens voltage-gated Ca²⁺ channels → Ca²⁺ entry\n• Hormones/neurotransmitters open ligand-gated Ca²⁺ channels → Ca²⁺ entry\n• Hormones/neurotransmitters → receptor → G protein → phospholipase C splits PIP₂ → IP₃ → opens SR channel → Ca²⁺ release from the SR\n(Ca²⁺ entering through voltage- or ligand-gated channels also triggers Ca²⁺-induced Ca²⁺ release from the SR.)\n\nb) Relaxation occurs when intracellular Ca²⁺ falls below the level needed to form Ca²⁺–calmodulin complexes (Help Calcium Into Pumps):\n• Hyperpolarization closes voltage-gated Ca²⁺ channels\n• cAMP and cGMP directly inhibit Ca²⁺ channels\n• Decreased IP₃ production → less Ca²⁺ release from the SR\n• Increased SR Ca²⁺-ATPase activity pumps Ca²⁺ back into the SR\n(With low Ca²⁺, MLC phosphatase dominates.)"}, "N-PHY-L2-24": {"id": "N-PHY-L2-24", "stem": "In an organ-bath experiment, adding an agent that raises cAMP to a strip of vascular smooth muscle makes the strip relax. This relaxing effect of cAMP is due to:", "top": false, "rep": "", "tag": "Final bank PHY Q25", "bank": true, "expl": "cAMP and cGMP relax smooth muscle by directly inhibiting Ca²⁺ channels, so Ca²⁺ falls below the level needed to form Ca²⁺–calmodulin. Ligand-gated channels, increased IP₃, Ca²⁺-induced Ca²⁺ release and depolarization all raise Ca²⁺ and cause contraction.", "type": "mcq", "opts": ["Direct inhibition of Ca²⁺ channels", "Opening of ligand-gated Ca²⁺ channels", "Increased IP₃ production", "Ca²⁺-induced Ca²⁺ release from the SR", "Depolarization opening voltage-gated Ca²⁺ channels"], "ans": 0}, "TP-011": {"id": "TP-011", "stem": "Mention 2 criteria of isometric muscle contraction.", "top": true, "rep": "", "tag": "Final bank PHY W11", "bank": true, "expl": "In isometric contraction the muscle length stays the same while tension rises, so no work is done and efficiency is zero, yet the force developed is maximal. Isotonic contraction is the opposite: the muscle shortens against a light or moderate load with constant tension.", "type": "written", "keyhtml": "Any two of:\n• Occurs against a heavy load\n• The muscle contracts but is not shortened (length constant) → no movement\n• No work is done → mechanical efficiency is zero\n• Muscle tension increases\n• The force developed is maximal\n• Lesser O₂ and nutrient requirement than isotonic contraction"}, "TP-052": {"id": "TP-052", "stem": "Which of the following muscle proteins plays an important role in contraction of both smooth and striated muscle?", "top": true, "rep": "", "tag": "Final bank PHY Q39", "bank": true, "expl": "In both striated and smooth muscle, tension is produced by actin–myosin binding. Troponin and tropomyosin regulate striated muscle only, whereas smooth muscle lacks them and uses calmodulin instead.", "type": "mcq", "opts": ["Calmodulin", "Troponin", "Tropomyosin", "Actin", "Fibrin"], "ans": 3}}, "labs": {"sl310": {"id": "sl310", "type": "slide", "title": "EXPERIMENTAL METHODS", "img": "prac/s310.jpg", "labels": [{"t": "A. SETUP", "x": 4.56, "y": 32.98, "w": 13.03, "h": 5.93, "id": "l0"}, {"t": "CH 1", "x": 53.5, "y": 33.94, "w": 3.55, "h": 3.33, "id": "l1"}], "src": "From the practical slides · EMG I – Standard & integrated EMG", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}, "sl314": {"id": "sl314", "type": "slide", "title": "C. DATA RECORDING", "img": "prac/s314.jpg", "labels": [{"t": "EMG", "x": 62.01, "y": 30.1, "w": 3.75, "h": 3.33, "id": "l0"}, {"t": "Integrated EMG", "x": 60.08, "y": 76.17, "w": 12.23, "h": 3.33, "id": "l1"}], "src": "From the practical slides · EMG I – Standard & integrated EMG", "intro": "A real practical slide with its own labels. \"Test me\" covers them; \"Find it\" asks you to find each one."}}, "cards": [{"id": "PHY-L2-001", "text": "Four changes in muscle during contraction: {{c1::electrical}} · {{c2::chemical}} · {{c3::thermal}} · {{c4::mechanical}}", "extra": "Every Cell Tries Moving (the lecture order).", "sec": "Part 01 · 1.1 Changes that occur in muscle during contraction"}, {"id": "PHY-L2-002", "text": "Resting membrane potential — nerve fibre: {{c1::−70 mV}}; skeletal muscle fibre: {{c2::−90 mV}}", "extra": "", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-003", "text": "Firing level — nerve fibre: {{c1::−55 mV}}; skeletal muscle fibre: {{c2::−65 mV}}", "extra": "", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-004", "text": "Magnitude of the spike potential — nerve fibre: {{c1::105 mV}}; skeletal muscle fibre: {{c2::120 mV}}", "extra": "", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-005", "text": "Duration of the action potential — nerve fibre: {{c1::0.5–1 msec}}; skeletal muscle fibre: {{c2::1–4 msec}}", "extra": "", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-006", "text": "Conduction velocity of the AP — nerve fibre: {{c1::up to 120 m/sec}}; skeletal muscle fibre: {{c2::3–5 m/sec}}", "extra": "", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-007", "text": "After its action potential — a nerve fibre {{c1::releases acetylcholine}}; a muscle fibre {{c2::contracts (after ~2 msec)}}", "extra": "Exam trap: don't swap them.", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-008", "text": "Compared with the nerve AP, the muscle AP starts from a {{c1::more negative}} RMP, is {{c2::bigger}} and {{c3::longer}}, but conducts {{c4::far more slowly}}", "extra": "Muscle AP = Deeper · Bigger · Longer · Slower (−90 mV · 120 mV · 1–4 ms · 3–5 m/s).", "sec": "Part 01 · 1.2 Nerve fibre vs muscle fibre"}, {"id": "PHY-L2-009", "text": "Muscle AP phase in which a small graded depolarization rises to the firing level (−65 mV): the {{c1::local potential}}", "extra": "", "sec": "Part 01 · 1.3 The muscle action potential"}, {"id": "PHY-L2-010", "text": "Muscle AP — depolarization: {{c1::opening of voltage-gated Na⁺ channels}}; repolarization: {{c2::closure of Na⁺ channels + opening of voltage-gated K⁺ channels}}", "extra": "", "sec": "Part 01 · 1.3 The muscle action potential"}, {"id": "PHY-L2-011", "text": "Hyperpolarization after the muscle AP (a dip below the RMP) is due to {{c1::voltage-gated K⁺ channels remaining open}} after the potential reaches the resting level", "extra": "", "sec": "Part 01 · 1.3 The muscle action potential"}, {"id": "PHY-L2-012", "text": "The muscle AP comes {{c1::before::before or after}} the rise in tension; the delay between them = the {{c2::latent period}}; the contraction lasts {{c3::much longer}} than the AP", "extra": "", "sec": "Part 01 · 1.4 Excitation–contraction coupling"}, {"id": "PHY-L2-013", "text": "Energy sources used first in contraction: {{c1::stored ATP}} (~6 s), then {{c2::creatine phosphate}} (~10 s)", "extra": "", "sec": "Part 02 · 2.1 Sources of energy for contraction"}, {"id": "PHY-L2-014", "text": "Creatine phosphate pathway: CrP + {{c1::ADP}} → ATP = {{c2::direct phosphorylation}}", "extra": "", "sec": "Part 02 · 2.1 Sources of energy for contraction"}, {"id": "PHY-L2-015", "text": "Glycogen & glucose → {{c1::anaerobic}} oxidation (glycolysis) → {{c2::2 ATP + lactic acid}}", "extra": "Lactic acid = anaerobic, not aerobic.", "sec": "Part 02 · 2.1 Sources of energy for contraction"}, {"id": "PHY-L2-016", "text": "Fatty acids, amino acids & glucose → {{c1::aerobic}} oxidation ({{c2::Krebs cycle}}) → {{c3::38 ATP}}", "extra": "2 vs 38: anaerobic vs aerobic.", "sec": "Part 02 · 2.1 Sources of energy for contraction"}, {"id": "PHY-L2-017", "text": "Energy source of the exhausted muscle (when the other sources are exhausted): {{c1::ADP}}", "extra": "", "sec": "Part 02 · 2.1 Sources of energy for contraction"}, {"id": "PHY-L2-018", "text": "Order of energy sources during exercise: stored ATP ~{{c1::6 s}} → CrP ~{{c2::10 s}} → glycogen (anaerobic) up to ~{{c3::30–40 s}} → aerobic pathway for {{c4::hours}}", "extra": "6 – 10 – 40 – Hours.", "sec": "Part 02 · 2.2 Energy sources during muscle exercise"}, {"id": "PHY-L2-019", "text": "During contraction, heat production in the muscle is about {{c1::100–1000}} times its resting level", "extra": "", "sec": "Part 03 · 3.1 Heat production"}, {"id": "PHY-L2-020", "text": "Energy used in contraction: {{c1::40–50%}} → work; {{c2::50–60%}} → heat", "extra": "More than half becomes heat; 40–50% = maximum efficiency of isotonic contraction.", "sec": "Part 03 · 3.1 Heat production"}, {"id": "PHY-L2-021", "text": "Two phases of heat production: {{c1::initial}} heat — during muscle exercise; {{c2::delayed}} heat — after muscle exercise", "extra": "", "sec": "Part 03 · 3.2 Two phases of heat production"}, {"id": "PHY-L2-022", "text": "Load — isotonic: {{c1::light or moderate}}; isometric: {{c2::heavy}}", "extra": "", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-023", "text": "Muscle length — isotonic: {{c1::shortens}}; isometric: {{c2::not shortened}}", "extra": "", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-024", "text": "Movement & work — isotonic: {{c1::moves, work done}}; isometric: {{c2::no movement, no work}}", "extra": "", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-025", "text": "Mechanical efficiency — isotonic: {{c1::maximum (40–50%)}}; isometric: {{c2::zero}}", "extra": "", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-026", "text": "The greater O₂ & nutrient requirement belongs to {{c1::isotonic::isotonic or isometric}} contraction", "extra": "Isometric needs less, though its tension rises.", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-027", "text": "Muscle tension — isotonic: {{c1::constant}}; isometric: {{c2::increased}}", "extra": "Iso-TONIC = same tone (tension constant) · Iso-METRIC = same metre (length constant).", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-028", "text": "Force developed — isotonic: {{c1::not maximal}}; isometric: {{c2::maximal}}", "extra": "Exam trap: isometric does no work at zero efficiency, yet its force is maximal.", "sec": "Part 04 · 4.2 Isotonic vs isometric contraction"}, {"id": "PHY-L2-029", "text": "Lifting a bucket (muscle shortens) = {{c1::isotonic}} contraction; straining at a bar too heavy to move = {{c2::isometric}} contraction", "extra": "", "sec": "Part 04 · 4.3 Picture it"}, {"id": "PHY-L2-030", "text": "Smooth muscle cells: {{c1::fusiform (spindle-shaped)}} · {{c2::one central nucleus}} · {{c3::non-striated}} · {{c4::involuntary}} · {{c5::slow, wave-like}} contractions", "extra": "", "sec": "Part 05 · 5.1 Features of smooth muscle"}, {"id": "PHY-L2-031", "text": "Smooth muscle lies in the walls of {{c1::hollow organs}}, where it produces {{c2::motility}} and maintains {{c3::tension}}", "extra": "Sites: GIT, bladder, uterus, vasculature, ureters, bronchioles and the eye muscles.", "sec": "Part 05 · 5.1 Features of smooth muscle"}, {"id": "PHY-L2-032", "text": "Unitary (single-unit) smooth muscle sites: {{c1::GIT}} · {{c2::uterus}} · {{c3::bladder}} · {{c4::ureter}}", "extra": "GUBU — Unitary = United by gap junctions.", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-033", "text": "Multiunit smooth muscle sites: {{c1::iris}} · {{c2::ciliary muscles of the lens}}", "extra": "Multiunit = Many separate units — the eye.", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-034", "text": "Unitary smooth muscle: cells linked by {{c1::gap junctions}} → {{c2::electrical coupling}} → {{c3::the whole organ contracts at once}}", "extra": "", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-035", "text": "Gap junctions = {{c1::low-resistance pathways for current flow}} that permit electrical coupling between cells", "extra": "", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-036", "text": "Urinary bladder: APs occur {{c1::simultaneously in all its smooth muscle cells}}, so the entire organ contracts (and empties) at once", "extra": "The unitary smooth muscle example.", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-037", "text": "Multiunit smooth muscle: {{c1::little or no coupling}} between cells — each fibre behaves as a {{c2::separate motor unit}} (like skeletal muscle)", "extra": "", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-038", "text": "Multiunit smooth muscle is regulated by dense innervation from {{c1::postganglionic parasympathetic and sympathetic}} fibres", "extra": "", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-039", "text": "Nerve supply — single-unit smooth muscle: a nerve fibre with {{c1::varicosities}} over the sheet; multi-unit: {{c2::individual synapses}}", "extra": "", "sec": "Part 05 · 5.2 Unitary vs multiunit smooth muscle"}, {"id": "PHY-L2-040", "text": "Smooth muscle lacks {{c1::troponin & tropomyosin}} — it has {{c2::calmodulin}} instead", "extra": "", "sec": "Part 06 · 6.1 Smooth vs striated muscle — the key difference"}, {"id": "PHY-L2-041", "text": "Smooth muscle: ↑ cytosolic Ca²⁺ forms Ca²⁺–calmodulin, which activates {{c1::MLCK (myosin light-chain kinase)}}", "extra": "Striated muscle uses troponin instead.", "sec": "Part 06 · 6.1 Smooth vs striated muscle — the key difference"}, {"id": "PHY-L2-042", "text": "In both striated and smooth muscle, tension is produced by {{c1::actin–myosin binding}}", "extra": "", "sec": "Part 06 · 6.1 Smooth vs striated muscle — the key difference"}, {"id": "PHY-L2-043", "text": "MLC switch: high cytosolic Ca²⁺ → {{c1::MLCK}} dominates; low cytosolic Ca²⁺ → {{c2::MLC phosphatase}} dominates", "extra": "Kinase Kontracts, Phosphatase Pauses.", "sec": "Part 06 · 6.2 The myosin light-chain (MLC) switch; Part 07 · 7.2 Smooth muscle — contraction vs relaxation"}, {"id": "PHY-L2-044", "text": "Myosin light chain — phosphorylated: {{c1::high}} affinity for actin (binds → power stroke); not phosphorylated: {{c2::very low}} affinity (no interaction)", "extra": "", "sec": "Part 06 · 6.2 The myosin light-chain (MLC) switch; Part 07 · 7.2 Smooth muscle — contraction vs relaxation"}, {"id": "PHY-L2-045", "text": "Smooth muscle contraction cascade: ↑ cytosolic Ca²⁺ → {{c1::Ca²⁺–calmodulin}} → ↑ {{c2::MLCK}} → {{c3::MLC phosphorylation}} → ↑ {{c4::myosin ATPase activity}} → myosin~P binds actin → cross-bridge cycling → tension", "extra": "", "sec": "Part 06 · 6.3 Contraction cascade"}, {"id": "PHY-L2-046", "text": "Smooth muscle Ca²⁺ rises by: depolarization → {{c1::voltage-gated Ca²⁺ channels}} · hormones/NT → {{c2::ligand-gated Ca²⁺ channels}} · hormones/NT → {{c3::IP₃}} → Ca²⁺ release from the SR", "extra": "V-L-I: Voltage-gated · Ligand-gated · IP₃ → SR.", "sec": "Part 06 · 6.4 How intracellular Ca²⁺ rises — regulation"}, {"id": "PHY-L2-047", "text": "IP₃ route: hormone → receptor → {{c1::G protein}} → {{c2::phospholipase C}} splits {{c3::PIP₂}} → IP₃ → opens the SR channel → Ca²⁺ release", "extra": "", "sec": "Part 06 · 6.4 How intracellular Ca²⁺ rises — regulation"}, {"id": "PHY-L2-048", "text": "In smooth muscle, Ca²⁺ entering through voltage- or ligand-gated channels triggers {{c1::Ca²⁺-induced Ca²⁺ release}} from the SR", "extra": "An ATP-driven SR pump returns the Ca²⁺ into the SR.", "sec": "Part 06 · 6.4 How intracellular Ca²⁺ rises — regulation"}, {"id": "PHY-L2-049", "text": "Smooth muscle relaxes when intracellular Ca²⁺ falls below the level needed to form {{c1::Ca²⁺–calmodulin complexes}}", "extra": "", "sec": "Part 06 · 6.5 Relaxation of smooth muscle"}, {"id": "PHY-L2-050", "text": "Smooth muscle relaxation: {{c1::hyperpolarization}} closes voltage-gated Ca²⁺ channels · {{c2::cAMP & cGMP}} inhibit Ca²⁺ channels · {{c3::↓ IP₃ production}} · {{c4::↑ SR Ca²⁺-ATPase activity}} pumps Ca²⁺ back into the SR", "extra": "Help Calcium Into Pumps.", "sec": "Part 06 · 6.5 Relaxation of smooth muscle"}, {"id": "PHY-L2-051", "text": "cAMP and cGMP relax smooth muscle by {{c1::directly inhibiting Ca²⁺ channels}}", "extra": "", "sec": "Part 06 · 6.5 Relaxation of smooth muscle"}], "pracs": [{"href": "prac-phy-1.html", "title": "Physiology practical · EMG I – Standard & integrated EMG"}], "lib": "./", "prev": {"href": "phy-l1.html", "title": "Lecture 1 · Skeletal Muscle I"}, "next": {"href": "phy-l3.html", "title": "Lecture 3 · Skeletal Muscle Physiology III"}, "coverImg": "covers/Physiology.jpg", "searchHint": "e.g. heavy, isotonic, not maximal"};

function P(i, side){

    const nerves = L.act.nerves, par = L.act.par || {}, nm = id => (nerves.find(x => x.id === id) || {}).name || id;

    const mv = L.act.moves.map(v => { const by = ms.filter(m => m.moves.includes(v.id) && m.nerves.length); if (!by.length) return null;
      const s = by.every(m => slstat(m, st.cut, L) === 'lost') ? 'lost' : by.some(m => slstat(m, st.cut, L)) ? 'weak' : ''; return s ? [v.name, s] : null; }).filter(Boolean);
    info = `<div class="chiprow">${nerves.map(n => { const on = slcutn(L, n.id, st.cut), via = on && !st.cut[n.id];
        return `<button class="chip ${on ? 'cut' : ''}" data-act="slcut" data-l="${L.id}" data-id="${n.id}"${via ? ' title="Cut with the nerve it branches from"' : ''}>${on ? '✂ ' : ''}${esc(n.name)}</button>`; }).join('')}</div>`
      + (Object.values(st.cut).some(Boolean) ? `${above.map(t => `<div class="muted" style="font-size:.88em">${t}</div>`).join('')}<div><b>Paralysed:</b> ${esc(lost.join(', ') || 'none')}${weak.length ? ` · <b>weakened:</b> ${esc(weak.join(', '))}` : ''}</div>${mv.length ? `<div style="margin-top:.2em">${mv.map(([n, s]) => `<span class="st ${s}">${s === 'lost' ? 'LOST' : 'WEAK'}</span> ${esc(n)}`).join(' &nbsp; ')}</div>` : ''}<div class="muted" style="font-size:.85em">Counting only the muscles on this picture.</div>`
        : '<span class="muted">Tap a nerve to cut it. The muscles it supplies turn red.</span>');
