<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1834">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MSK Book">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>MSK Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: a Helpers-blue cloth volume lying open on a walnut desk — two pages per spread on wide screens, one page on phones;
   text pages face lab pages; sticky notes, red section numbers and lift-the-flap questions like a real study book. */
:root{
  --desk:#6a4a30; --desk-2:#4f3522; --paper:#fbf9f3; --paper-2:#f1ece0; --edge:#ddd3bd;
  --ink:#1c2333; --ink-2:#4b5569; --muted:#7c8597; --line:#e3dccb; --card:#ffffff;
  --navy:#0b1f45; --navy-ink:#0b1f45; --band:#0b1f45; --band-ink:#ffffff; --blue:#2e86de; --red:#d64545;
  --ok:#1e9e62; --ok-bg:#e6f6ee; --bad:#d64545; --bad-bg:#fdeceb; --chip:#edf3fb; --hl:#fff0a1;
  --sticky:#ffe57a; --sticky-ink:#3a3000; --trap-bg:#fdf0ef; --mn:#7b4fc9; --mn-bg:#f3eefb; --cl:#13836f; --cl-bg:#e8f5f2; --def-bg:#edf3fb; --nb-bg:#f2f2ef;
  --cover-1:#d9d2c2; --cover-2:#e8e2d4; --leather:#11295a; --leather-2:#0a1c40; --gold:#d9b45e;
  --bar:rgba(10,24,52,.86); --bar-ink:#f4f6fb; --skin:#f6e3d3; --musc:#e8a8a0; --musc-2:#d98c84; --bone:#fbf6ea;
  --fsz:1; --pw:520px; --ph:720px;
  --f-head:'Poppins','Segoe UI',system-ui,sans-serif; --f-body:'Lato','Segoe UI',system-ui,sans-serif; --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#2b2019; --desk-2:#1e1610; --paper:#1d222c; --paper-2:#181c24; --edge:#2b3240;
  --ink:#e8e4d9; --ink-2:#b8b3a6; --muted:#8c92a2; --line:#323a49; --card:#232a36;
  --navy:#9cc2ff; --navy-ink:#cfe0ff; --band:#163a73; --band-ink:#eef3ff; --blue:#6aaef5; --red:#ef7b7b;
  --ok:#3fcf8e; --ok-bg:#16352a; --bad:#f07c7c; --bad-bg:#3b1f22; --chip:#243148; --hl:#5b4c12;
  --sticky:#5a4c1c; --sticky-ink:#f6eab8; --trap-bg:#3a2224; --mn:#b59af0; --mn-bg:#2d2540; --cl:#5fd1bb; --cl-bg:#18322e; --def-bg:#1f2b40; --nb-bg:#262a31;
  --cover-1:#303747; --cover-2:#3a4254; --leather:#0f2550; --leather-2:#08183a; --gold:#d6b25e;
  --bar:rgba(8,12,22,.9); --bar-ink:#eef1f7; --skin:#4a3b34; --musc:#8a4d48; --musc-2:#a65d57; --bone:#d9d3c4;
  color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);
  background:
    radial-gradient(120% 90% at 50% 38%, rgba(255,240,215,.10), transparent 62%),
    repeating-linear-gradient(91deg, rgba(0,0,0,.045) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(89.3deg, rgba(255,255,255,.025) 0 1px, transparent 1px 31px),
    repeating-linear-gradient(90.6deg, rgba(0,0,0,.035) 0 6px, transparent 6px 57px),
    linear-gradient(180deg, var(--desk), var(--desk-2));
  background-color:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:hidden}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:6px;height:50px;margin-top:8px;padding:0 8px 0 12px;border-radius:14px;background:var(--bar);color:var(--bar-ink);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand b{font:700 15px var(--f-head);letter-spacing:.01em;white-space:nowrap}
.brand span{font:500 11px var(--f-head);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.pgind{font:600 12px var(--f-head);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:0;background:transparent;color:var(--bar-ink);cursor:pointer;font:600 12px var(--f-head)}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:18px;height:18px;flex:none}
.ib .lb{white-space:nowrap}
.ib.on{background:rgba(255,255,255,.16)}
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;width:70px}
.prog i{display:block;height:100%;background:var(--gold)}
@media (max-width:1100px){ .ib .lb{display:none} }
.brand .bw{font-style:normal}
@media (max-width:640px){ .brand span,.brand .bw,.prog,.pgind{display:none} .bar{gap:2px;padding:0 4px 0 10px} .ib{padding:0 7px} }

/* ---------- desk & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px;perspective-origin:50% 50%}
.book.single{width:var(--pw)}
.book::before{content:"";position:absolute;inset:-9px -12px -11px -12px;border-radius:12px;background:linear-gradient(90deg,var(--leather-2),var(--leather) 6%,var(--leather) 94%,var(--leather-2));box-shadow:0 28px 50px rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35)}
.book.single::before{inset:-7px -9px -9px -9px}
.pg{position:absolute;top:0;width:var(--pw);height:var(--ph);background:var(--paper);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.pg-l{left:0;border-radius:6px 2px 2px 6px;background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%);
  box-shadow:-2px 0 0 var(--edge),-4px 0 0 var(--paper-2),-6px 1px 0 var(--edge)}
.pg-r{left:var(--pw);border-radius:2px 6px 6px 2px;background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%);
  box-shadow:2px 0 0 var(--edge),4px 0 0 var(--paper-2),6px 1px 0 var(--edge)}
.book.single .pg-l{border-radius:4px 6px 6px 4px;background:linear-gradient(to right,rgba(0,0,0,.10),transparent 5%),var(--paper);box-shadow:3px 0 0 var(--edge),5px 1px 0 var(--paper-2)}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:6}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 40%,rgba(255,255,255,.05) 70%,rgba(0,0,0,.10));animation:shade var(--dur,700ms) ease-in-out}
@keyframes shade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border-radius:12px;border:0;background:rgba(0,0,0,.28);color:#fff;cursor:pointer;z-index:8;display:grid;place-items:center}
.turn:hover{background:rgba(0,0,0,.45)}
.turn svg{width:22px;height:22px}
.turn.prev{left:-56px}.turn.next{right:-56px}
.book.single .turn{display:none}
.mnav{display:none}
@media (max-width:899px), (max-height:519px){ .mnav{display:flex} }
.mnav{flex:none;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px}
.mnav button{flex:none;height:42px;min-width:56px;border-radius:12px;border:0;background:var(--bar);color:var(--bar-ink);font:600 13px var(--f-head);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px}
.mnav .mid{flex:1;text-align:center;color:#fff;font:600 12px var(--f-head);text-shadow:0 1px 2px rgba(0,0,0,.4);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- closed book (home) ---------- */
.home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;padding:12px;overflow:auto;z-index:9}
.cover{position:relative;width:min(340px,82vw);aspect-ratio:.72;border-radius:6px 16px 16px 6px;color:var(--gold);
  background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.08),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),linear-gradient(135deg,var(--leather),var(--leather-2));
  box-shadow:inset 10px 0 0 rgba(0,0,0,.28),inset 13px 0 0 rgba(255,255,255,.05),0 26px 46px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 26px 24px 36px;box-sizing:border-box;transform-origin:left center}
.cover .frame{position:absolute;inset:14px 14px 14px 24px;border:1px solid rgba(217,180,94,.55);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover .k{font:600 10px var(--f-head);letter-spacing:.32em;opacity:.85}
.cover .t1{font:700 clamp(44px,13vw,64px)/1 var(--f-head);letter-spacing:.04em;margin:14px 0 2px;color:var(--gold)}
.cover .t2{font:600 20px var(--f-head);letter-spacing:.06em;color:#f3e6c4}
.cover .rule{width:56%;height:1px;background:rgba(217,180,94,.6);margin:16px 0}
.cover .t3{font:500 13px/1.45 var(--f-head);color:#eadcb8;max-width:16em}
.cover .t4{margin-top:18px;font:italic 400 12px var(--f-body);color:#d9c9a0;opacity:.85}
.side{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);color:#fff}
.side h1{font:700 22px/1.2 var(--f-head);margin:0;text-wrap:balance;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.side p{margin:0;font-size:14px;line-height:1.5;color:#f1e8dc;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cd{font:600 12px var(--f-head);padding:6px 11px;border-radius:20px;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.18)}
.cd b{color:var(--gold)}
.hbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:0;cursor:pointer;font:600 14px var(--f-head);background:var(--card);color:var(--navy-ink);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hbtn.pri{background:var(--gold);color:#1d1606}
.hbtn svg{width:18px;height:18px}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.32);border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.12)}
.stat b{display:block;font:700 18px var(--f-head);color:#fff;font-variant-numeric:tabular-nums}
.stat span{font:500 10.5px var(--f-head);letter-spacing:.05em;color:#e8dcc6;text-transform:uppercase}

/* ---------- page content ---------- */
.pin{position:absolute;inset:0;padding:6.2% 7% 8.2% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;box-sizing:border-box;
  font-size:clamp(12px, calc(var(--pw) * .0262 * var(--fsz)), 19px);line-height:1.5;scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.pg-l .pin{padding-right:8.4%}.pg-r .pin{padding-left:8.6%}
.rh{display:flex;justify-content:space-between;gap:1em;padding-right:2.6em;font:600 .6em var(--f-head);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 1em;padding-bottom:.6em;border-bottom:1px solid var(--line)}
.folio{position:absolute;bottom:2.6%;font:600 .78em var(--f-head);color:var(--muted);font-size:clamp(10px,calc(var(--pw)*.022),14px)}
.pg-l .folio,.leaf .folio.l{left:7%}.pg-r .folio,.leaf .folio.r{right:7%}.book.single .folio{right:7%;left:auto}
.ribbon{position:absolute;top:-2px;right:9%;width:clamp(16px,calc(var(--pw)*.04),24px);height:clamp(34px,calc(var(--pw)*.085),52px);border:0;padding:0;cursor:pointer;background:var(--line);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);opacity:.75;z-index:2}
.ribbon.on{background:var(--red);opacity:1}
.part{display:flex;gap:.8em;align-items:center;background:var(--band);color:var(--band-ink);border-radius:.6em;padding:.85em 1em;margin:0 0 1em;position:relative;overflow:hidden}
.part .pn{flex:none;width:2.4em;height:2.4em;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font:700 .95em var(--f-head);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.part small{display:block;font:600 .6em var(--f-head);letter-spacing:.16em;opacity:.8;text-transform:uppercase}
.part h2{margin:.05em 0 0;font:700 1.18em/1.2 var(--f-head);text-wrap:balance}
.part p{margin:.25em 0 0;font-size:.78em;opacity:.85}
.part .big{position:absolute;right:.2em;bottom:-.25em;font:700 3.6em/1 var(--f-head);opacity:.09}
.sh{display:flex;align-items:center;gap:.55em;margin:1.1em 0 .45em;font:700 1.02em/1.25 var(--f-head);color:var(--navy-ink);text-wrap:balance}
.sh .num{flex:none;min-width:2.1em;height:2.1em;padding:0 .2em;border-radius:1.05em;display:grid;place-items:center;background:var(--red);color:#fff;font:700 .66em var(--f-head);letter-spacing:.02em;box-sizing:border-box}
.hook{font:italic 400 1em/1.45 var(--f-body);color:var(--ink-2);margin:.2em 0 .6em;padding-left:.7em;border-left:2px solid var(--red)}
.tx{margin:.45em 0}
.ls{margin:.4em 0 .6em;padding-left:1.1em}.ls li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.note{margin:.85em 0;padding:.65em .8em .7em;border-radius:.45em;position:relative}
.note .nl{display:block;font:700 .6em var(--f-head);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2em}
.n-hy{background:var(--sticky);color:var(--sticky-ink);border-radius:2px;transform:rotate(-1deg);box-shadow:0 .35em .7em rgba(0,0,0,.18);margin:1.1em .2em}
.n-hy::before{content:"";position:absolute;top:-.55em;left:50%;width:4.4em;height:1.1em;transform:translateX(-50%) rotate(2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.n-hy .nl{font:700 1.3em/1 var(--f-hand);letter-spacing:0;text-transform:none;margin-bottom:.25em}
.n-trap{background:var(--trap-bg);border-left:.28em solid var(--red)}.n-trap .nl{color:var(--red)}
.n-mn{background:var(--mn-bg);border-left:.28em solid var(--mn)}.n-mn .nl{color:var(--mn)}
.n-cl{background:var(--cl-bg);border-left:.28em solid var(--cl)}.n-cl .nl{color:var(--cl)}
.n-def{background:var(--def-bg);border-left:.28em solid var(--blue)}.n-def .nl{color:var(--blue)}
.n-nb{background:var(--nb-bg);border-left:.28em solid var(--muted)}.n-nb .nl{color:var(--muted)}
.tbl{margin:.8em 0}
.tbl-h{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.35em}
.tbl-h span{font:700 .66em var(--f-head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:.84em;line-height:1.38}
.tbl th{background:var(--band);color:var(--band-ink);font:600 .82em var(--f-head);letter-spacing:.03em;text-align:left;padding:.45em .5em}
.tbl th:first-child{border-radius:.35em 0 0 0}.tbl th:last-child{border-radius:0 .35em 0 0}
.tbl td{padding:.42em .5em;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700;color:var(--navy-ink)}
.tbl td.cv{cursor:pointer;color:transparent;border-radius:.3em;background:repeating-linear-gradient(135deg,var(--cover-1) 0 5px,var(--cover-2) 5px 10px);-webkit-user-select:none;user-select:none}
.tbl td.cv *{visibility:hidden}
.mini{font:600 .7em var(--f-head);padding:.38em .75em;border-radius:2em;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.mini.on{background:var(--band);color:var(--band-ink);border-color:transparent}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;margin:.7em 0}
.flow span{background:var(--chip);border:1px solid var(--line);border-radius:.4em;padding:.3em .55em;font-size:.86em}
.flow i{font-style:normal;color:var(--red);font-weight:700}

/* questions */
.qb{border:1px solid var(--line);background:var(--card);border-radius:.6em;padding:.7em .8em .8em;margin:.9em 0}
.qh{display:flex;flex-wrap:wrap;align-items:center;gap:.35em .5em;font:700 .58em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.tg{font:600 1em var(--f-head);letter-spacing:.06em;padding:.15em .55em;border-radius:1em;background:var(--chip);color:var(--ink-2)}
.tg.top{background:#fff1cf;color:#8a5a00}
:root[data-theme="dark"] .tg.top{background:#4a3a12;color:#f6d27a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tg.top{background:#4a3a12;color:#f6d27a} }
.qs{font-weight:700;margin:.5em 0 .55em;line-height:1.42}
.op{display:flex;gap:.6em;align-items:flex-start;width:100%;text-align:left;padding:.45em .6em;margin:.32em 0;border-radius:.5em;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.95em;line-height:1.35;cursor:pointer}
.op:hover{border-color:var(--blue)}
.op .lt{flex:none;width:1.55em;height:1.55em;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 .72em var(--f-head);color:var(--ink-2);margin-top:.05em}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}.op.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg)}.op.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}
.op.pick{border-color:var(--blue);background:var(--chip)}
.op[disabled]{cursor:default}
.res{font:700 .8em var(--f-head);margin:.5em 0 .1em}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.ex{margin-top:.45em;padding:.55em .7em;border-left:.25em solid var(--blue);background:var(--chip);border-radius:.3em;font-size:.9em;line-height:1.45}
.ex b{color:var(--navy-ink)}
.row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center;margin-top:.55em}

nses side by side"}, {"t": "h", "no": "6.1", "title": "Where the next stimulus falls decides the response"}, {"t": "list", "items": ["Low frequency, after relaxation → staircase", "Increased frequency, during relaxation → clonus", "Further increased, during contraction → <mark>complete tetanus<\/mark>"]}, {"t": "h", "no": "6.2", "title": "Low frequency → staircase phenomenon (treppe)"}, {"t": "list", "items": ["Stimuli fall immediately after relaxation phases → <mark>separate<\/mark> twitches", "First few contractions <mark>gradually increase in strength<\/mark>", "<b>Cause:<\/b> muscle <mark>warmer<\/mark> and more Ca2+ inside fibres"]}], "toc": ["06", "Successive Stimuli & Tetanus"]}, {"id": "p37", "head": "Part 06 · Successive Stimuli & Tetanus", "kind": "text", "blocks": [{"t": "h", "no": "6.3", "title": "Frequency increased → clonus (incomplete tetanus)"}, {"t": "list", "items": ["Stimuli fall during relaxation phases of preceding twitches", "Clonus = <mark>rapid repeated contractions<\/mark>; unfused, tension oscillates"]}, {"t": "h", "no": "6.4", "title": "Further increased → complete tetanus"}, {"t": "list", "items": ["Stimuli fall during contraction phases", "Persistent Ca2+ release → <mark>continuous contraction<\/mark>", "<mark>Tetanus<\/mark> = <mark>continuous contraction<\/mark> from <mark>fusion of successive contractions<\/mark>", "<mark>Tetanus<\/mark> is the common type of contraction in the human body"]}, {"t": "h", "no": "6.5", "title": "The three responses side by side"}, {"t": "list", "items": ["<b>Staircase:<\/b> separate twitches; clonus: unfused; complete tetanus: fused"]}, {"t": "note", "kind": "mn", "html": "A-R-C: After relaxation, in Relaxation, in Contraction"}]}, {"id": "p38", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l3-5-0", "title": "Recall · Successive Stimuli & Tetanus (1/2)", "groups": [{"title": "6.1 Where the next stimulus falls decides the response", "items": [["Low frequency, after relaxation →", "staircase"], ["Increased frequency, during relaxation →", "clonus"], ["Further increased, during contraction →", "complete tetanus"]]}, {"title": "6.2 Low frequency → staircase phenomenon (treppe)", "items": [["Stimuli fall immediately after relaxation phases →", "separate twitches"], ["First few", "contractions gradually increase in strength"], ["Cause:", "muscle warmer and more Ca2+ inside fibres"]]}, {"title": "6.3 Frequency increased → clonus (incomplete tetanus)", "items": [["Stimuli fall during", "relaxation phases of preceding twitches"], ["Clonus =", "rapid repeated contractions; unfused, tension oscillates"]]}]}], "labName": "Recall · Successive Stimuli & Tetanus (1/2)"}, {"id": "p39", "head": "Lab · Recall · Part 06", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l3-5-1", "title": "Recall · Successive Stimuli & Tetanus (2/2)", "groups": [{"title": "6.4 Further increased → complete tetanus", "items": [["Stimuli fall", "during contraction phases"], ["Persistent Ca2+ release →", "continuous contraction"], ["Tetanus =", "continuous contraction from fusion of successive contractions"], ["Tetanus is the common", "type of contraction in the human body"]]}, {"title": "6.5 The three responses side by side", "items": [["Staircase:", "separate twitches; clonus: unfused; complete tetanus: fused"], ["Mnemonic A-R-C:", "After relaxation, in Relaxation, in Contraction"]]}]}], "labName": "Recall · Successive Stimuli & Tetanus (2/2)"}, {"id": "p40", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "flap", "q": "N-PHY-L3-15"}, {"t": "check", "q": "Q0875"}]}, {"id": "p41", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "N-PHY-L3-14"}, {"t": "check", "q": "Q0817"}]}, {"id": "p42", "head": "Part 06 · Check yourself", "kind": "text", "blocks": [{"t": "check", "q": "Q0824"}]}, {"id": "p43", "head": "Part 07 · Master Comparison", "kind": "text", "blocks": [{"t": "part", "no": "07", "title": "Master Comparison", "sub": "Endurance side vs strength side · Everything that changes the twitch · Fatigue — causes vs delayers · Numbers to remember · Key definitions in one place"}, {"t": "h", "no": "7.1", "title": "Endurance side vs strength side"}, {"t": "list", "items": ["<b>Type I/endurance:<\/b> aerobic, red, fatigue-resistant; training ↑ mitochondria, capillaries, myoglobin", "<b>Type II/strength:<\/b> anaerobic, pale; training → hypertrophy, ↑ enzymes"]}, {"t": "h", "no": "7.2", "title": "Everything that changes the twitch"}, {"t": "list", "items": ["Warming stronger/shorter; cooling opposite; &gt;45 °C heat rigor", "Fatigue weaker, phases prolonged esp. relaxation, contracture"]}, {"t": "h", "no": "7.3", "title": "Fatigue — causes vs delayers"}, {"t": "list", "items": ["<b>Causes:<\/b> lactic acid, glycogen depletion, ACh depletion, CNS failure", "<b>Delayers:<\/b> CVS, CNS alternation, hormones"]}], "toc": ["07", "Master Comparison"]}, {"id": "p44", "head": "Part 07 · Master Comparison", "kind": "text", "blocks": [{"t": "h", "no": "7.4", "title": "Numbers to remember"}, {"t": "list", "items": ["3–5 s ATP; 8–10 s CrP; ~90 s glycogen; 2 min O2", "2 ATP vs 38 ATP; 15 ms / 25 ms; &gt; 45 °C heat rigor"]}, {"t": "h", "no": "7.5", "title": "Key definitions in one place"}, {"t": "list", "items": ["SMT, latent period, fatigue, contracture, heat rigor, staircase, clonus, tetanus"]}]}, {"id": "p45", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l3-6-0", "title": "Recall · Master Comparison (1/2)", "groups": [{"title": "7.1 Endurance side vs strength side", "items": [["Type I/endurance:", "aerobic, red, fatigue-resistant; training ↑ mitochondria, capillaries, myoglobin"], ["Type II/strength:", "anaerobic, pale; training → hypertrophy, ↑ enzymes"]]}, {"title": "7.2 Everything that changes the twitch", "items": [["Warming stronger/shorter; cooling", "opposite; &gt;45 °C heat rigor"], ["Fatigue weaker", "phases prolonged esp. relaxation, contracture"]]}, {"title": "7.3 Fatigue — causes vs delayers", "items": [["Causes:", "lactic acid, glycogen depletion, ACh depletion, CNS failure"], ["Delayers:", "CVS, CNS alternation, hormones"]]}]}], "labName": "Recall · Master Comparison (1/2)"}, {"id": "p46", "head": "Lab · Recall · Part 07", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l3-6-1", "title": "Recall · Master Comparison (2/2)", "groups": [{"title": "7.4 Numbers to remember", "items": [["3–5 s ATP; 8–10", "s CrP; ~90 s glycogen; 2 min O2"], ["2 ATP vs 38 ATP", "15 ms / 25 ms; &gt; 45 °C heat rigor"]]}, {"title": "7.5 Key definitions in one place", "items": [["SMT, latent period, fatigue", "contracture, heat rigor, staircase, clonus, tetanus"]]}]}], "labName": "Recall · Master Comparison (2/2)"}, {"id": "p47", "head": "Part 08 · Rapid Revision", "kind": "text", "blocks": [{"t": "part", "no": "08", "title": "Rapid Revision", "sub": "Must-know one-liners · Mnemonic vault & classic exam traps · Self-test from the lecture"}, {"t": "h", "no": "8.1", "title": "Must-know one-liners"}, {"t": "list", "items": ["Anaerobic system useful early because heart and lungs take time to raise O2", "Commonest contraction type in the body: tetanus"]}, {"t": "h", "no": "8.2", "title": "Mnemonic vault & classic exam traps"}, {"t": "list", "items": ["R-G-T; Can Generals Run?; ONE SLOW RED OX; A-R-C"]}, {"t": "h", "no": "8.3", "title": "Self-test from the lecture"}, {"t": "list", "items": ["Repetitive stimulation increases strength due to ↑ myoplasmic Ca2+ concentration"]}], "toc": ["08", "Rapid Revision"]}, {"id": "p48", "head": "Lab · Recall · Part 08", "kind": "lab", "blocks": [{"t": "recall", "id": "rc-phy-l3-7-0", "title": "Recall · Rapid Revision", "groups": [{"title": "8.1 Must-know one-liners", "items": [["Anaerobic system useful early because", "heart and lungs take time to raise O2"], ["Commonest contraction type in the body:", "tetanus"]]}, {"title": "8.2 Mnemonic vault & classic exam traps", "items": [["R-G-T; Can Generals", "Run?; ONE SLOW RED OX; A-R-C"]]}, {"title": "8.3 Self-test from the lecture", "items": [["Repetitive stimulation increases strength", "due to ↑ myoplasmic Ca2+ concentration"]]}]}], "labName": "Recall · Rapid Revision"}, {"id": "p49", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "h", "no": "!", "title": "Exam traps & clinical points"}, {"t": "note", "kind": "trap", "html": "Slide labels creatine phosphate 'with oxygen' though O2 supply rises only within 2 min"}, {"t": "note", "kind": "trap", "html": "CrP is fastest but shortest; aerobic is slowest but longest"}, {"t": "note", "kind": "trap", "html": "Lactic acid = anaerobic glycogen system"}, {"t": "note", "kind": "trap", "html": "Type I has low glycogen and small motor units; Type II high glycogen, large motor units"}, {"t": "note", "kind": "trap", "html": "Type II (not I) serves fine movements (extraocular, upper limb)"}, {"t": "note", "kind": "trap", "html": "Endurance ↑ myoglobin; strength ↑ actin &amp; myosin"}], "toc": ["!", "Exam traps & clinical"]}, {"id": "p50", "head": "Exam traps & clinical", "kind": "text", "blocks": [{"t": "note", "kind": "trap", "html": "Relaxation (25 ms) is longer than contraction and is active (Ca2+ reuptake)"}, {"t": "note", "kind": "trap", "html": "Warming shortens phases; fatigue prolongs them, relaxation most (ATP needed to relax)"}, {"t": "note", "kind": "trap", "html": "Neuromuscular fatigue = ACh depletion in fast-powerful activity"}, {"t": "note", "kind": "trap", "html": "Staircase = separate twitches, not fused"}, {"t": "note", "kind": "trap", "html": "Clonus = stimuli in relaxation; tetanus = stimuli in contraction"}]}, {"id": "p51", "head": "End of the lecture", "kind": "text", "blocks": [{"t": "h", "no": "✓", "title": "End of the lecture"}, {"t": "progress"}, {"t": "actions"}, {"t": "end"}], "toc": ["✓", "End of the lecture"]}], "questions": {"N-PHY-L3-01": {"id": "N-PHY-L3-01", "stem": "Which energy system supplies a working muscle at a very high rate, but only for about 8–10 seconds?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Creatine phosphate, a high-energy compound in all muscle cells, is broken down (creatine phosphate + ADP → creatine kinase → creatine + ATP) to supply energy at a very high rate for about 8–10 s. Stored ATP lasts only 3–5 s, anaerobic glycogen about 90 s and aerobic respiration several hours.", "type": "mcq", "opts": ["ATP stored in the muscle", "Creatine phosphate", "Anaerobic breakdown of glycogen", "Aerobic respiration", "Breakdown of body protein"], "ans": 1}, "N-PHY-L3-02": {"id": "N-PHY-L3-02", "stem": "About 30 seconds into a maximal sprint, a runner's stored ATP and creatine phosphate are largely used up, and his leg muscles now rely mainly on glycogen broken down without oxygen. Which of the following is true of this energy system?", "top": false, "rep": "", "tag": "Final bank PHY Q33", "bank": true, "expl": "Glycogen broken down without oxygen gives 2 ATP with lactic acid as a by-product and lasts about 90 s; because it needs about 12 chemical reactions it is slower than creatine phosphate. Dependence on O₂, 38 ATP and supply for hours all belong to aerobic respiration.", "type": "mcq", "opts": ["It supplies energy at a higher rate than creatine phosphate", "It depends on oxygen delivered by the heart and lungs", "It produces lactic acid as a by-product", "It yields 38 ATP", "It can supply ATP for several hours"], "ans": 2}, "Q0871": {"id": "Q0871", "stem": "The main source of muscle energy that supplies muscle with a high level of ATP lasting for hours is:", "top": true, "rep": "asked 3 years", "tag": "Final bank PHY Q26", "bank": true, "expl": "The aerobic pathway is the slowest system but yields 38 ATP and can supply ATP for several hours or longer, as long as the fuel lasts. Stored ATP and creatine phosphate (CrP + ADP → ATP) last only seconds, and anaerobic glycolysis yields just 2 ATP plus lactic acid.", "type": "mcq", "opts": ["ATP stored in the muscle", "ADP and creatine phosphate", "Anaerobic glycolysis", "Aerobic glycolysis"], "ans": 3}, "N-PHY-L3-03": {"id": "N-PHY-L3-03", "stem": "Which source of glucose for aerobic respiration in working muscle is used only in extreme cases, such as starvation?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Glucose for aerobic respiration comes from the muscle cells, the intestine (food), liver glycogen and muscle fat, and only in extreme cases such as starvation from body protein (My Meal Lasts For Proteins).", "type": "mcq", "opts": ["Body protein", "Liver glycogen", "Glucose from food in the intestine", "Fat reserves in the muscles", "The remaining glucose supply in the muscle cells"], "ans": 0}, "N-PHY-L3-04": {"id": "N-PHY-L3-04", "stem": "Compare the three biochemical systems that produce ATP for muscle contraction as regards fuel, speed, duration and ATP yield.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The three systems trade speed for staying power: creatine phosphate is fastest but shortest (8–10 s), anaerobic glycogen is intermediate (≈90 s, 2 ATP + lactic acid) and aerobic respiration is slowest but lasts hours (38 ATP).", "type": "written", "keyhtml": "Order of use: stored ATP (3–5 s) → creatine phosphate → glycogen (anaerobic) → aerobic respiration.\n\n1) Creatine phosphate\n• Fuel: high-energy creatine phosphate present in all muscle cells (creatine phosphate + ADP → creatine kinase → creatine + ATP)\n• Speed: very high rate\n• Duration: about 8–10 s\n• Yield: makes more ATP quickly\n\n2) Glycogen (anaerobic)\n• Fuel: large muscle stores of glycogen → glucose; oxygen not needed\n• Speed: slower — about 12 chemical reactions\n• Duration: about 90 s\n• Yield: 2 ATP, with lactic acid as by-product\n\n3) Aerobic respiration\n• Fuel: glucose from muscle cells, intestine (food), liver glycogen, muscle fat and, in extreme cases (starvation), body protein; needs O₂ (supply to muscle starts within 2 min)\n• Speed: slowest of all three\n• Duration: several hours or longer, as long as fuel lasts\n• Yield: 38 ATP"}, "Q0830": {"id": "Q0830", "stem": "A sprinter in a 100 m race has more ____ muscle fibres.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A 100 m sprint is high-intensity, short-duration exercise, which relies on Type II fast glycolytic (fast-twitch) fibres; these are pale because of their low myoglobin content.", "type": "written", "keyhtml": "White (pale) — fast glycolytic (Type II) fibres."}, "Q0831": {"id": "Q0831", "stem": "A long-distance (marathon) runner has more ____ muscle fibres.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Marathon running is low-intensity, long-duration endurance exercise, which relies on Type I slow oxidative (slow-twitch) fibres; these are deep red because of their high myoglobin content and are highly fatigue-resistant.", "type": "written", "keyhtml": "Red — slow oxidative (Type I) fibres."}, "Q0840": {"id": "Q0840", "stem": "Mention the types of skeletal muscle fibres.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Skeletal muscle fibres are named by speed and metabolism: Type I slow oxidative (red, endurance) and Type II fast glycolytic (pale, strength).", "type": "written", "keyhtml": "• Type I = slow oxidative fibres (slow-twitch; red — high myoglobin); aerobic (oxidative) metabolism; suited to endurance\n• Type II = fast glycolytic fibres (fast-twitch; pale/white — low myoglobin); anaerobic (glycolytic) metabolism; suited to strength"}, "Q0823": {"id": "Q0823", "stem": "Red muscle fibres:", "top": false, "rep": "", "tag": "Final bank PHY Q29", "bank": true, "expl": "Red (Type I, slow oxidative) fibres owe their colour to a high myoglobin content and are also high in mitochondria and capillaries. Easy fatigue, high glycogen, low capillary density and short-duration or fine movements are features of the pale Type II fibres.", "type": "mcq", "opts": ["Are suitable for quick movements", "Fatigue easily", "Have a high myoglobin content", "Are rich in glycogen", "Have a low capillary density"], "ans": 2}, "Q0825": {"id": "Q0825", "stem": "Which of the following is a characteristic of white (pale) muscle fibres?", "top": false, "rep": "", "tag": "Final bank PHY Q30", "bank": true, "expl": "White (pale) fibres are Type II fast glycolytic fibres: large motor units, high glycogen and anaerobic glycolysis as the ATP source. High mitochondria, aerobic metabolism and high myoglobin are features of Type I (red) fibres.", "type": "mcq", "opts": ["They are responsible for slower muscle movements", "They have a high mitochondrial content", "They primarily use aerobic metabolism", "They have large motor units", "They contain high amounts of myoglobin"], "ans": 3}, "Q0839": {"id": "Q0839", "stem": "Compare between red and white skeletal muscle fibres.", "top": false, "rep": "", "tag": "Final bank PHY W7", "bank": true, "expl": "Everything that serves O₂ (mitochondria, capillaries, myoglobin) is high in red Type I fibres, which resist fatigue; pale Type II fibres have high glycogen and large motor units yet serve fine movements of the eye and upper limb.", "type": "written", "keyhtml": "Feature | Red — slow oxidative (Type I) | White/pale — fast glycolytic (Type II)\n• Myoglobin / colour: high (red) | low (pale)\n• ATP source: aerobic glycolysis | anaerobic glycolysis\n• Mitochondrial content: high | low\n• Capillary density: high | low\n• Glycogen content: low | high\n• Motor unit size: small | large\n• Fatigue resistance (endurance): high | low\n• Body distribution: back and lower limb | extraocular and upper limb\n• Function: long-duration exercise, keeping body position against gravity | short-duration exercise, fine movements\n• Linked exercise type: endurance (low intensity, long duration) | strength (high intensity, short duration)"}, "Q0872": {"id": "Q0872", "stem": "Slow oxidative muscle fibers (Type I) are characterized by:", "top": true, "rep": "asked 3 years", "tag": "Final bank PHY Q27", "bank": true, "expl": "Type I fibres have high mitochondrial content, capillary density and myoglobin (red colour) and obtain ATP by aerobic glycolysis. A pale colour, low myoglobin and anaerobic glycolysis describe Type II fast glycolytic fibres.", "type": "mcq", "opts": ["Pale color", "Obtain energy from anaerobic glycolysis", "High capillary density and mitochondria", "Low myoglobin"], "ans": 2}, "N-PHY-L3-05": {"id": "N-PHY-L3-05", "stem": "Fast glycolytic (Type II) fibres predominate in muscles that:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Type II fibres are found in the extraocular and upper limb muscles and serve short-duration exercise and fine movements. Keeping posture against gravity, long-duration exercise, aerobic glycolysis and high capillary density are Type I features (back and lower limb).", "type": "mcq", "opts": ["Keep the body position against gravity", "Perform long-duration exercise", "Perform fine movements, such as the extraocular muscles", "Depend on aerobic glycolysis for ATP", "Have a high capillary density"], "ans": 2}, "Q0837": {"id": "Q0837", "stem": "Explain the adaptation of skeletal muscle to training (strength and endurance exercise).", "top": false, "rep": "", "tag": "Final bank PHY W8", "bank": true, "expl": "Strength training builds size (hypertrophy from more actin and myosin), while endurance training builds the O₂ machinery: more mitochondria, capillaries, oxidative enzymes and myoglobin (Strength = Size; Endurance = Engines + Roads + O₂ store).", "type": "written", "keyhtml": "A) Strength exercise (high intensity, short duration, e.g. weight lifting):\n• Muscle hypertrophy due to ↑ synthesis of actin and myosin filaments\n• ↑ Enzymatic activity\n\nB) Endurance exercise (low intensity, long duration, e.g. running and swimming — 'aerobic exercise'):\n• ↑ Number of mitochondria\n• ↑ Number of capillaries around the muscle fibres\n• ↑ Activity of oxidative enzymes (e.g. ATPase and lipase)\n• ↑ Myoglobin content\n\nEndurance training raises the Type I (slow-twitch) features — mitochondria, capillaries, myoglobin; strength is linked to Type II (fast-twitch) fibres."}, "N-PHY-L3-06": {"id": "N-PHY-L3-06", "stem": "A medical student begins a six-month programme of long-distance running and swimming. Which of the following changes is expected in his leg muscles?", "top": false, "rep": "", "tag": "Final bank PHY Q34", "bank": true, "expl": "Running and swimming are endurance (aerobic) exercise, which increases mitochondria, capillaries around the fibres, oxidative enzymes and myoglobin content. Hypertrophy from increased synthesis of actin and myosin is the effect of strength exercise such as weight lifting.", "type": "mcq", "opts": ["Hypertrophy due to increased synthesis of actin and myosin filaments", "Increased myoglobin content", "Fewer capillaries around the muscle fibres", "Fewer mitochondria", "Greater reliance on anaerobic glycolysis for ATP"], "ans": 1}, "N-PHY-L3-09": {"id": "N-PHY-L3-09", "stem": "Define simple muscle twitch and describe its phases.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "A simple muscle twitch has three phases: latent period, contraction (about 15 msec, actin sliding over myosin) and relaxation (about 25 msec, active Ca²⁺ reuptake into the SR) — 'Lag → 15 up → 25 down'.", "type": "written", "keyhtml": "Definition: a single brief muscle contraction followed by relaxation, caused by a single maximal stimulation of skeletal muscle.\n\nPhases:\n1) Latent period — the time between application of the stimulus and the beginning of muscle response (contraction). It represents the time needed for:\n• Conduction of the nerve impulse through the motor nerve fibres\n• Production of the end-plate potential\n• Production and conduction of the action potential along the muscle fibres\n• Shortening of the muscle\n2) Contraction phase — the muscle shortens and performs work, due to sliding of actin over myosin; about 15 msec.\n3) Relaxation phase — the muscle relaxes and returns to its original length, due to active reuptake of Ca²⁺ ions into the SR; about 25 msec."}, "N-PHY-L3-07": {"id": "N-PHY-L3-07", "stem": "The latent period of a simple muscle twitch represents the time needed for:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "The latent period, between the stimulus and the beginning of contraction, covers conduction of the nerve impulse through the motor nerve fibres, production of the end-plate potential, production and conduction of the muscle AP and shortening of the muscle. Ca²⁺ reuptake into the SR and return to the original length belong to the relaxation phase.", "type": "mcq", "opts": ["Conduction of the nerve impulse and production of the end-plate potential", "Active reuptake of Ca²⁺ ions into the SR", "Return of the muscle to its original length", "Fusion of successive contractions", "Recovery of the muscle's ability to contract after rest"], "ans": 0}, "N-PHY-L3-08": {"id": "N-PHY-L3-08", "stem": "In a physiology practical, a single maximal stimulus is applied to an isolated skeletal muscle and a simple muscle twitch is recorded. Which of the following is true of the relaxation phase of this twitch?", "top": false, "rep": "", "tag": "Final bank PHY Q35", "bank": true, "expl": "The relaxation phase (about 25 msec) is longer than the contraction phase (about 15 msec) and is active, due to reuptake of Ca²⁺ into the SR. Sliding of actin over myosin causes the contraction phase, the end-plate potential is produced in the latent period, and fatigue prolongs relaxation most.", "type": "mcq", "opts": ["It lasts about 15 msec, shorter than the contraction phase", "It is due to sliding of actin over myosin", "It is due to active reuptake of Ca²⁺ ions into the SR", "It includes production of the end-plate potential", "It is the phase least prolonged by fatigue"], "ans": 2}, "Q0873": {"id": "Q0873", "stem": "The effect of warming in simple muscle twitch:", "top": true, "rep": "asked 3 years", "tag": "Final bank PHY Q28", "bank": true, "expl": "Warming accelerates the metabolic reactions and decreases muscle viscosity, giving a stronger contraction and shortening of all phases of the SMT. A weaker contraction with longer phases is the effect of cooling, and protein denaturation with stiffening (heat rigor) follows excessive warming above 45 °C.", "type": "mcq", "opts": ["Sustained weakness of muscle contraction", "Weaker contraction than normal and elongation of all phases", "Denaturation of muscle proteins and muscle stiffening", "Stronger contraction than normal and shortening of all phases"], "ans": 3}, "N-PHY-L3-10": {"id": "N-PHY-L3-10", "stem": "In a physiology practical, an isolated skeletal muscle is stimulated repeatedly until it becomes fatigued. Compared with its first twitch, which of the following describes the late twitches?", "top": false, "rep": "", "tag": "Final bank PHY Q36", "bank": true, "expl": "Fatigue decreases the strength of contraction and prolongs all phases of the SMT, especially relaxation, because ATP (needed for relaxation) is depleted; incomplete relaxation (contracture) may follow. Stronger contractions with shorter phases follow warming, and gradually strengthening separate twitches are the staircase phenomenon.", "type": "mcq", "opts": ["Stronger contractions with shortening of all phases", "Weaker contractions with prolongation of all phases, especially relaxation", "Weaker contractions with prolongation of the contraction phase only", "Separate twitches that gradually increase in strength", "Denaturation of muscle proteins with muscle stiffening"], "ans": 1}, "N-PHY-L3-11": {"id": "N-PHY-L3-11", "stem": "Contracture, seen in a fatigued skeletal muscle, is best described as:", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Contracture is a state of sustained weak contraction followed by incomplete relaxation, due to depletion of ATP, which is needed for muscle relaxation. Stiffening above 45 °C is heat rigor, fusion of contractions is tetanus, rapid repeated contractions are clonus and gradually strengthening twitches are the staircase phenomenon.", "type": "mcq", "opts": ["Sustained weak contraction followed by incomplete relaxation, due to depletion of ATP", "Muscle stiffening due to denaturation of muscle proteins above 45 °C", "Continuous contraction resulting from fusion of successive contractions", "Rapid repeated contractions of the muscle", "Separate twitches that gradually increase in strength"], "ans": 0}, "Q0826": {"id": "Q0826", "stem": "Muscular fatigue occurs partly due to depletion of energy stores inside the muscle, such as ____.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Muscular fatigue results from accumulation of lactic acid (rising intracellular acidity inhibits the key enzymes of energy pathways) and depletion of energy stores such as glycogen. Depletion of ACh at the motor end plate causes neuromuscular, not muscular, fatigue.", "type": "written", "keyhtml": "Glycogen."}, "Q0834": {"id": "Q0834", "stem": "What are the causes of muscle fatigue?", "top": false, "rep": "", "tag": "Final bank PHY W9", "bank": true, "expl": "Fatigue has three causes, from muscle to brain (M-N-C): muscular (lactic acid and glycogen depletion), neuromuscular (ACh depletion at the end plate) and central psychological (the CNS no longer adequately activates the motor neurons).", "type": "written", "keyhtml": "A) Muscular fatigue\n• Accumulation of lactic acid with increase in the intracellular acidity → inhibition of the key enzymes in energy pathways\n• Depletion of energy stores inside the muscle, e.g. glycogen\n\nB) Neuromuscular fatigue\n• Due to depletion of ACh stores at the motor end plate, as the rate of ACh release is more than its rate of synthesis\n• Occurs during fast-powerful activities\n\nC) Central psychological fatigue\n• Occurs when the central nervous system no longer adequately activates the motor neurons supplying the working muscles\n• An athlete's performance depends not only on the physical state of his muscles but also on the will to win — the 'ability to overcome psychological fatigue'"}, "Q0835": {"id": "Q0835", "stem": "What are the causes of muscular fatigue?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Muscular fatigue arises inside the muscle itself: lactic acid raises intracellular acidity and inhibits the key enzymes of energy pathways, and energy stores such as glycogen are depleted. ACh depletion (neuromuscular) and CNS failure (central) are the other two types of fatigue.", "type": "written", "keyhtml": "• Accumulation of lactic acid with increase in the intracellular acidity → inhibition of the key enzymes in energy pathways\n• Depletion of energy stores inside the muscle, e.g. glycogen"}, "Q0836": {"id": "Q0836", "stem": "What is the cause of central psychological fatigue?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "In central psychological fatigue the muscles themselves can still work, but the CNS no longer adequately activates the motor neurons supplying them, so performance also depends on the will to win.", "type": "written", "keyhtml": "• Central psychological fatigue occurs when the central nervous system no longer adequately activates the motor neurons supplying the working muscles.\n• An athlete's performance depends not only on the physical state of his muscles but also on the will to win — the 'ability to overcome psychological fatigue'."}, "N-PHY-L3-12": {"id": "N-PHY-L3-12", "stem": "A weightlifter performing repeated fast, powerful lifts develops neuromuscular fatigue. Which of the following is the cause of this type of fatigue?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Neuromuscular fatigue is due to depletion of ACh stores at the motor end plate, because ACh is released faster than it is synthesised; it occurs during fast-powerful activities. Lactic acid and glycogen depletion cause muscular fatigue, and CNS failure causes central psychological fatigue.", "type": "mcq", "opts": ["Accumulation of lactic acid with increased intracellular acidity", "Depletion of glycogen stores inside the muscle", "Depletion of ACh stores at the motor end plate", "Failure of the CNS to adequately activate the motor neurons", "Denaturation of muscle proteins with muscle stiffening"], "ans": 2}, "N-PHY-L3-13": {"id": "N-PHY-L3-13", "stem": "Which of the following helps to delay muscle fatigue inside the body?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Fatigue is delayed by the CVS (O₂ and nutrients in, metabolites out), the CNS (not all fibres contract at the same time but alternate) and hormones such as adrenaline, noradrenaline, cortisol, thyroxine and insulin. The other options are causes of muscular or neuromuscular fatigue.", "type": "mcq", "opts": ["Alternation by the CNS between contracted and relaxed fibres", "Accumulation of lactic acid in the muscle", "Depletion of glycogen stores inside the muscle", "Release of ACh faster than its synthesis", "Increased intracellular acidity"], "ans": 0}, "N-PHY-L3-15": {"id": "N-PHY-L3-15", "stem": "Describe the response of a skeletal muscle to successive stimuli as the frequency of stimulation is increased.", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Where the next stimulus lands decides the response (A-R-C): after relaxation → staircase, in relaxation → clonus, in contraction → complete tetanus; calcium explains the rise in strength.", "type": "written", "keyhtml": "1) Low frequency — staircase phenomenon (treppe)\n• Stimuli fall immediately after the relaxation phases of the preceding twitches → separate twitches\n• The first few contractions gradually increase in strength\n• Cause: the 2nd stimulus finds the muscle in a better physiological condition — warmer, with more Ca²⁺ ions inside the muscle fibres\n\n2) Increased frequency — clonus (incomplete tetanus)\n• Stimuli fall during the relaxation phases of the preceding twitches\n• Clonus = rapid repeated contractions of the muscle (unfused; tension oscillates)\n\n3) Further increased frequency — complete tetanus\n• Stimuli fall during the contraction phases of the preceding twitches\n• Persistent release of Ca²⁺ ions → continuous contraction\n• Tetanus = continuous contraction resulting from fusion of successive contractions produced by rapid successive stimulation; it is the common type of muscle contraction in the human body"}, "Q0875": {"id": "Q0875", "stem": "Repetitive stimulation of a skeletal muscle fibre will cause an increase in contractile strength due to an increase in which of the following?", "top": false, "rep": "", "tag": "Final bank PHY Q31", "bank": true, "expl": "Repeated stimuli raise strength through calcium: in the staircase phenomenon more Ca²⁺ is present inside the fibres, and in tetanus the stimuli cause persistent Ca²⁺ release. The lecture does not explain the increase by changes in cross-bridge duration, the end-plate potential or the number of myofibrils.", "type": "mcq", "opts": ["The duration of cross-bridge cycling", "The concentration of calcium in the myoplasm", "The magnitude of the end-plate potential", "The number of muscle myofibrils generating tension", "The velocity of muscle contraction"], "ans": 1}, "N-PHY-L3-14": {"id": "N-PHY-L3-14", "stem": "In a physiology practical, the frequency of stimulation of an isolated skeletal muscle is increased so that each stimulus falls during the relaxation phase of the preceding twitch. Which response is recorded?", "top": false, "rep": "", "tag": "Final bank PHY Q37", "bank": true, "expl": "Stimuli falling during the relaxation phases give clonus (incomplete tetanus): rapid repeated contractions with oscillating tension. Stimuli immediately after relaxation give the staircase phenomenon, and stimuli during the contraction phases give complete tetanus (A-R-C).", "type": "mcq", "opts": ["Staircase phenomenon (treppe)", "Clonus (incomplete tetanus)", "Complete tetanus", "Contracture", "A single simple muscle twitch"], "ans": 1}, "Q0817": {"id": "Q0817", "stem": "Repeated stimulation of a skeletal muscle fibre causes a sustained contraction (tetanus). Accumulation of which ion in the intracellular fluid is responsible for the tetanus?", "top": false, "rep": "", "tag": "Final bank PHY Q32", "bank": true, "expl": "When stimuli fall during the contraction phases of the preceding twitches, they cause persistent release of Ca²⁺ ions, which leads to continuous contraction (complete tetanus). The same ion explains the staircase phenomenon, where more Ca²⁺ is present inside the fibres.", "type": "mcq", "opts": ["Na⁺", "K⁺", "Cl⁻", "Mg²⁺", "Ca²⁺"], "ans": 4}, "Q0824": {"id": "Q0824", "stem": "Which of the following is true of skeletal muscle cells?", "top": false, "rep": "", "tag": "Extra practice", "bank": false, "expl": "Skeletal muscle can be tetanized: rapid successive stimuli falling during the contraction phases cause persistent Ca²⁺ release and fusion of successive contractions. Tetanus is the common type of muscle contraction in the human body.", "type": "mcq", "opts": ["They act as a syncytium", "They have muscarinic cholinergic receptors", "They depend on extracellular calcium for contraction", "They have calmodulin instead of troponin", "They can be tetanized"], "ans": 4}, "TP-068": {"id": "TP-068", "stem": "A 30-year-old athlete undergoes a muscle biopsy. The sample shows increased mitochondria and capillary density. These findings correspond to which muscle fiber type?", "top": true, "rep": "", "tag": "Final bank PHY Q40", "bank": true, "expl": "Type I slow oxidative (slow-twitch) fibres have high mitochondrial content, capillary density and myoglobin, and endurance training increases exactly these features. Fast-twitch fibres (type 2a or 2b, pale) have few mitochondria and few capillaries.", "type": "mcq", "opts": ["Fast glycolytic fibers", "Fast oxidative fibers", "Type IIb fibers", "White muscle fibers", "Slow-twitch oxidative fibers"], "ans": 4}, "TP-100": {"id": "TP-100", "stem": "List \"in order\" the three biochemical systems for producing ATP in muscle during exercise.", "top": true, "rep": "", "tag": "Final bank PHY W13", "bank": true, "expl": "ATP is not stored to a great extent, so muscle must make more quickly: creatine phosphate is fastest but shortest, anaerobic glycogen breakdown is intermediate, and aerobic respiration is slowest but lasts for hours.", "type": "written", "keyhtml": "(Stored ATP is used first but lasts only about 3–5 s.)\n1. Creatine phosphate — creatine phosphate + ADP → (creatine kinase) → creatine + ATP; very high rate, about 8–10 s.\n2. Glycogen — anaerobic glycolysis, O₂ not needed; about 12 chemical reactions; about 90 s; 2 ATP + lactic acid.\n3. Aerobic respiration — O₂ supply starts within 2 minutes; slowest, but lasts several hours or longer; 38 ATP."}}, "labs": {}, "cards": [{"id": "PHY-L3-001", "text": "At rest, skeletal muscle consumes energy for: {{c1::maintenance of the resting membrane potential}} · {{c2::synthesis of glycogen}} · {{c3::keeping muscle tone}}", "extra": "R-G-T: RMP · Glycogen synthesis · Tone. During exercise, energy consumption increases.", "sec": "Part 01 · 1.1 Energy changes in skeletal muscle"}, {"id": "PHY-L3-002", "text": "The source of energy that powers contraction in working muscle is {{c1::ATP}}; it is {{c2::not stored to a great extent}} in cells, so making more ATP must start quickly once contraction starts", "extra": "", "sec": "Part 01 · 1.2 Origins of the energy for muscle contraction"}, {"id": "PHY-L3-003", "text": "ATP-producing systems, in order of use: stored ATP ▶ {{c1::creatine phosphate}} ▶ {{c2::glycogen (anaerobic)}} ▶ {{c3::aerobic respiration}}", "extra": "\"Can Generals Run?\" — timeline 5 s · 10 s · 90 s · 2 min.", "sec": "Part 01 · 1.2 Origins of the energy for muscle contraction"}, {"id": "PHY-L3-004", "text": "The little ATP stored in muscle cells is used immediately but lasts only about {{c1::3–5 seconds}}", "extra": "", "sec": "Part 01 · 1.3 System 1 — Creatine phosphate"}, {"id": "PHY-L3-005", "text": "Creatine phosphate supplies a working muscle at a {{c1::very high rate}}, but only for about {{c2::8–10 seconds}}", "extra": "Fastest but shortest of the three systems.", "sec": "Part 01 · 1.3 System 1 — Creatine phosphate"}, {"id": "PHY-L3-006", "text": "Creatine phosphate + ADP → creatine + {{c2::ATP}}, catalysed by {{c1::creatine kinase}}", "extra": "Creatine phosphate = a high-energy compound present in all muscle cells.", "sec": "Part 01 · 1.3 System 1 — Creatine phosphate"}, {"id": "PHY-L3-007", "text": "The anaerobic glycogen system produces enough energy to last about {{c1::90 seconds}}", "extra": "Fuel: the large muscle stores of glycogen → glucose.", "sec": "Part 01 · 1.4 System 2 — Glycogen (anaerobic, without oxygen) · 2 ATP"}, {"id": "PHY-L3-008", "text": "Glycogen supplies energy more slowly than creatine phosphate because making ATP from it takes about {{c1::12 chemical reactions}}", "extra": "", "sec": "Part 01 · 1.4 System 2 — Glycogen (anaerobic, without oxygen) · 2 ATP"}, {"id": "PHY-L3-009", "text": "The anaerobic glycogen system is useful early in exercise because the {{c1::heart and lungs}} take some time to {{c2::increase the O₂ supply}} to the muscles", "extra": "Oxygen is not needed for this system.", "sec": "Part 01 · 1.4 System 2 — Glycogen (anaerobic, without oxygen) · 2 ATP"}, {"id": "PHY-L3-010", "text": "By-product of making ATP without oxygen (anaerobic glycogen system): {{c1::lactic acid}}", "extra": "Glycolysis: glucose → 2 ATP + pyruvate; no O₂ → lactic acid to blood.", "sec": "Part 01 · 1.4 System 2 — Glycogen (anaerobic, without oxygen) · 2 ATP"}, {"id": "PHY-L3-011", "text": "Within {{c1::2 minutes}} of exercise, the body starts to supply working muscles with oxygen → aerobic respiration", "extra": "", "sec": "Part 01 · 1.5 System 3 — Aerobic respiration (with oxygen) · 38 ATP"}, {"id": "PHY-L3-012", "text": "The main source of muscle energy that supplies a high level of ATP lasting for hours: {{c1::aerobic glycolysis (aerobic respiration)}}", "extra": "Stored ATP and creatine phosphate last seconds; anaerobic glycolysis ~90 s.", "sec": "Part 01 · 1.5 System 3 — Aerobic respiration (with oxygen) · 38 ATP"}, {"id": "PHY-L3-013", "text": "Aerobic respiration is the {{c1::slowest::fastest or slowest}} of the three ATP systems, yet supplies ATP for {{c2::several hours or longer}} (as long as fuel lasts)", "extra": "CrP is fastest but shortest; aerobic is slowest but longest.", "sec": "Part 01 · 1.5 System 3 — Aerobic respiration (with oxygen) · 38 ATP"}, {"id": "PHY-L3-014", "text": "ATP yield — anaerobic glycogen system: {{c1::2 ATP}}; aerobic respiration: {{c2::38 ATP}}", "extra": "\"2 vs 38\".", "sec": "Part 01 · 1.6 The three systems compared"}, {"id": "PHY-L3-015", "text": "Glucose for aerobic respiration comes from: {{c1::remaining glucose in the muscle cells}} · {{c2::food in the intestine}} · {{c3::liver glycogen}} · {{c4::fat reserves in the muscles}} · {{c5::body protein}} (only in extreme cases, e.g. starvation)", "extra": "\"My Meal Lasts For Proteins\" — Muscle · Meal · Liver · Fat · Protein (last resort).", "sec": "Part 01 · 1.5 System 3 — Aerobic respiration (with oxygen) · 38 ATP"}, {"id": "PHY-L3-016", "text": "Aerobic (cellular) respiration takes place in the {{c1::mitochondria}}: glucose, pyruvic acid or fatty acids + O₂ → ATP + heat + {{c2::CO₂ + H₂O}}", "extra": "", "sec": "Part 01 · 1.5 System 3 — Aerobic respiration (with oxygen) · 38 ATP"}, {"id": "PHY-L3-017", "text": "Skeletal muscle fibre types: Type I = {{c1::slow oxidative}} fibres; Type II = {{c2::fast glycolytic}} fibres", "extra": "\"ONE SLOW RED OX\" — Type 1 · Slow · Red (myoglobin) · Oxidative.", "sec": "Part 02 · 2.1 Two types of skeletal muscle fibre"}, {"id": "PHY-L3-018", "text": "A 100 m sprinter has more {{c1::pale (white), fast glycolytic — Type II}} fibres; a marathon runner has more {{c1::red, slow oxidative — Type I}} fibres", "extra": "Strength ↔ fast-twitch (pale); endurance ↔ slow-twitch (deep red).", "sec": "Part 02 · 2.1 Two types of skeletal muscle fibre"}, {"id": "PHY-L3-019", "text": "ATP source — Type I fibres: {{c1::aerobic glycolysis}}; Type II fibres: {{c1::anaerobic glycolysis}}", "extra": "", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-020", "text": "Mitochondrial content & capillary density — Type I (slow oxidative): {{c1::high}}; Type II (fast glycolytic): {{c1::low}}", "extra": "Everything that serves O₂ is high in Type I.", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-021", "text": "Myoglobin content — Type I: {{c1::high → red}}; Type II: {{c1::low → pale}}", "extra": "", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-022", "text": "Fatigue resistance (endurance) — Type I: {{c1::high}}; Type II: {{c1::low}}", "extra": "Type II fibres fatigue easily.", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-023", "text": "Glycogen content — Type I: {{c1::low}}; Type II: {{c1::high}}", "extra": "Trap: the oxidative Type I fibre has LOW glycogen.", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-024", "text": "Motor unit size — Type I: {{c1::small}}; Type II: {{c1::large}}", "extra": "Trap: Type II has large motor units yet does the fine movements.", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-025", "text": "Body distribution — Type I fibres: {{c1::back and lower limb}}; Type II fibres: {{c2::extraocular and upper limb}}", "extra": "", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-026", "text": "Function — Type I: {{c1::long-duration exercise · keeping body position against gravity}}; Type II: {{c2::short-duration exercise · fine movements}}", "extra": "Trap: Type II (not I) serves fine movements.", "sec": "Part 02 · 2.2 Slow oxidative (I) vs fast glycolytic (II)"}, {"id": "PHY-L3-027", "text": "Strength exercise = {{c1::high intensity · short duration}}; endurance exercise = {{c1::low intensity · long duration}}", "extra": "", "sec": "Part 03 · 3.1 Types of muscular exercise"}, {"id": "PHY-L3-028", "text": "Example of strength exercise: {{c1::weight lifting}}; of endurance (\"aerobic\") exercise: {{c2::running and swimming}}", "extra": "", "sec": "Part 03 · 3.1 Types of muscular exercise"}, {"id": "PHY-L3-029", "text": "Strength training → muscle {{c1::hypertrophy}} due to ↑ synthesis of {{c2::actin and myosin}} filaments, and ↑ {{c3::enzymatic activity}}", "extra": "Strength = Size.", "sec": "Part 03 · 3.1 Types of muscular exercise"}, {"id": "PHY-L3-030", "text": "Endurance training → ↑ number of {{c1::mitochondria}} · ↑ number of {{c2::capillaries}} around the fibres · ↑ activity of {{c3::oxidative enzymes}} (e.g. ATPase and lipase) · ↑ {{c4::myoglobin}} content", "extra": "Endurance = Engines + Roads + O₂ store — exactly the Type I features.", "sec": "Part 03 · 3.1 Types of muscular exercise"}, {"id": "PHY-L3-031", "text": "Simple muscle twitch = a single brief muscle contraction followed by relaxation, caused by a {{c1::single maximal stimulation}} of skeletal muscle", "extra": "", "sec": "Part 04 · 4.1 Definition & phases"}, {"id": "PHY-L3-032", "text": "Phases of the simple muscle twitch, in order: {{c1::latent period}} → {{c2::contraction phase}} → {{c3::relaxation phase}}", "extra": "", "sec": "Part 04 · 4.1 Definition & phases"}, {"id": "PHY-L3-033", "text": "Latent period = the time between {{c1::application of the stimulus}} and {{c2::the beginning of muscle response (contraction)}}", "extra": "", "sec": "Part 04 · 4.2 Latent period"}, {"id": "PHY-L3-034", "text": "The latent period represents the time needed for: {{c1::conduction of the nerve impulse through the motor nerve fibres}} · {{c2::production of the end-plate potential}} · {{c3::production & conduction of the action potential along the muscle fibres}} · {{c4::shortening of the muscle}}", "extra": "", "sec": "Part 04 · 4.2 Latent period"}, {"id": "PHY-L3-035", "text": "Contraction phase of the SMT: the muscle shortens and performs work, due to {{c1::sliding of actin over myosin}}", "extra": "", "sec": "Part 04 · 4.3 Contraction vs relaxation phase"}, {"id": "PHY-L3-036", "text": "Relaxation phase of the SMT: the muscle returns to its original length, due to {{c1::active reuptake of Ca²⁺ ions into the SR}}", "extra": "Relaxation is active — it needs Ca²⁺ reuptake.", "sec": "Part 04 · 4.3 Contraction vs relaxation phase"}, {"id": "PHY-L3-037", "text": "SMT durations — contraction phase: about {{c1::15 msec}}; relaxation phase: about {{c2::25 msec}}", "extra": "\"Lag → 15 up → 25 down\" — relaxation is the longer phase.", "sec": "Part 04 · 4.3 Contraction vs relaxation phase"}, {"id": "PHY-L3-038", "text": "Effect of warming on the simple muscle twitch: {{c1::stronger::stronger or weaker}} contraction than normal and {{c1::shortening::shortening or prolongation}} of all phases", "extra": "", "sec": "Part 05 · 5.1 Effect of temperature on the SMT"}, {"id": "PHY-L3-039", "text": "Warming strengthens the twitch and shortens its phases due to: {{c1::acceleration of the metabolic reactions}} + {{c2::decreased viscosity of the muscle}}", "extra": "", "sec": "Part 05 · 5.1 Effect of temperature on the SMT"}, {"id": "PHY-L3-040", "text": "Cooling of the muscle → {{c1::weaker::stronger or weaker}} contraction and {{c1::longer::shorter or longer}} phases of the SMT", "extra": "Cooling produces the opposite effects of warming.", "sec": "Part 05 · 5.1 Effect of temperature on the SMT"}, {"id": "PHY-L3-041", "text": "Excessive warming (> {{c1::45 °C}}) → denaturation of muscle proteins and muscle stiffening = {{c2::heat rigor}}", "extra": "", "sec": "Part 05 · 5.1 Effect of temperature on the SMT"}, {"id": "PHY-L3-042", "text": "Fatigue = the {{c1::temporary}} decrease in muscle force of contraction due to {{c2::previous contractile activity}}", "extra": "With rest, the muscle recovers its ability to contract on re-stimulation.", "sec": "Part 05 · 5.2 Effect of fatigue on the SMT"}, {"id": "PHY-L3-043", "text": "Fatigue on the SMT: {{c1::decreased strength}} of contraction · prolongation of all phases, especially the {{c2::relaxation}} phase · {{c3::contracture}} (incomplete relaxation)", "extra": "Relaxation suffers most because ATP is needed to relax; warming shortens phases, fatigue prolongs them.", "sec": "Part 05 · 5.2 Effect of fatigue on the SMT"}, {"id": "PHY-L3-044", "text": "Contracture = sustained weak muscle contraction followed by {{c1::incomplete relaxation}}, due to depletion of {{c2::ATP}}", "extra": "ATP is important for muscle relaxation.", "sec": "Part 05 · 5.2 Effect of fatigue on the SMT"}, {"id": "PHY-L3-045", "text": "Causes (types) of fatigue: {{c1::muscular}} · {{c2::neuromuscular}} · {{c3::central psychological}}", "extra": "M-N-C: Muscle · NMJ (ACh) · Central.", "sec": "Part 05 · 5.3 Causes of fatigue"}, {"id": "PHY-L3-046", "text": "Muscular fatigue: accumulation of {{c1::lactic acid}} → ↑ intracellular acidity → {{c2::inhibition of the key enzymes in energy pathways}}", "extra": "", "sec": "Part 05 · 5.3 Causes of fatigue"}, {"id": "PHY-L3-047", "text": "Muscular fatigue: depletion of energy stores inside the muscle, e.g. {{c1::glycogen}}", "extra": "", "sec": "Part 05 · 5.3 Causes of fatigue"}, {"id": "PHY-L3-048", "text": "Neuromuscular fatigue: depletion of {{c1::ACh stores at the motor end plate}}, as the rate of ACh release is {{c2::more than its rate of synthesis}}; occurs during {{c3::fast-powerful}} activities", "extra": "", "sec": "Part 05 · 5.3 Causes of fatigue"}, {"id": "PHY-L3-049", "text": "Central psychological fatigue: the {{c1::central nervous system}} no longer adequately activates the {{c2::motor neurons}} supplying the working muscles", "extra": "", "sec": "Part 05 · 5.3 Causes of fatigue"}, {"id": "PHY-L3-050", "text": "An athlete's performance depends not only on the physical state of his muscles but also on the {{c1::will to win}} — the \"ability to overcome psychological fatigue\"", "extra": "", "sec": "Part 05 · 5.3 Causes of fatigue"}, {"id": "PHY-L3-051", "text": "Inside the body, muscle fatigue is delayed by: {{c1::the cardiovascular system}} · {{c2::the CNS}} · {{c3::hormones}}", "extra": "C-C-H: Circulation · CNS alternation · Hormones.", "sec": "Part 05 · 5.4 What delays muscle fatigue inside the body"}, {"id": "PHY-L3-052", "text": "The CVS delays fatigue by supplying the muscles with {{c1::O₂ and nutrients}} and removing the {{c2::metabolites}}", "extra": "", "sec": "Part 05 · 5.4 What delays muscle fatigue inside the body"}, {"id": "PHY-L3-053", "text": "The CNS delays fatigue: not all fibres contract at the same time — instead there is {{c1::alternation between contracted and relaxed fibres}}", "extra": "", "sec": "Part 05 · 5.4 What delays muscle fatigue inside the body"}, {"id": "PHY-L3-054", "text": "Hormones that delay muscle fatigue: {{c1::adrenaline}} · {{c2::noradrenaline}} · {{c3::cortisol}} · {{c4::thyroxine}} · {{c5::insulin}}", "extra": "", "sec": "Part 05 · 5.4 What delays muscle fatigue inside the body"}, {"id": "PHY-L3-055", "text": "Successive stimuli — next stimulus falls immediately after the relaxation phase → {{c1::staircase phenomenon (treppe)}} · during the relaxation phase → {{c2::clonus (incomplete tetanus)}} · during the contraction phase → {{c3::complete tetanus}}", "extra": "A-R-C. Rising frequency: low → staircase, increased → clonus, further increased → complete tetanus.", "
