<section class="page" data-t="Coronaviruses" data-g="compare" data-p="Part 03 · Coronaviruses">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Coronaviruses</b><span>Common cold · SARS · MERS · COVID-19</span></div></div>
  <h3><i>3.1</i>Four members, four stories</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · pick one</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="c">Coronavirus</button><button class="chip sm" data-v="s">SARS-CoV</button><button class="chip sm" data-v="m">MERS-CoV</button><button class="chip sm" data-v="v">SARS-CoV-2</button></div>
    <div class="msg" data-for="c">The <b>second most common cause of the common cold</b>, with a winter/spring peak incidence.</div>
    <div class="msg" data-for="s"><b>Severe acute respiratory syndrome.</b> Reservoir: birds and small mammals (cats); the original case is thought to have jumped from animal to human. Transmission: respiratory droplets; the virus is also found in urine, sweat and feces. An <b>atypical pneumonia</b>: fever above 38.0 °C, flu-like illness, dry cough, dyspnea and progressive hypoxia; chest x-ray may show a patchy distribution of focal interstitial infiltrates. Diagnosis includes travel history, antibody detection, RT-PCR and isolation in culture. Treatment is supportive; ribavirin and interferon are promising.</div>
    <div class="msg" data-for="m"><b>Middle East respiratory syndrome.</b> Reservoir: <b>bats and camels</b>; disease and transmission are similar to SARS. It caused an outbreak of pneumonia and respiratory failure in Saudi Arabia and other countries of the region. Most patients who died had medical co-morbidities. Contact with bats or camels leads to the initial human infections, which can then pass from person to person.</div>
    <div class="msg" data-for="v"><b>COVID-19</b> is the disease caused by SARS-CoV-2. WHO first learned of this new virus on 31 December 2019, after a report of a cluster of cases of viral pneumonia in China. SARS-CoV and MERS-CoV also caused large outbreaks, with mortality of 10–30%.</div>
  </div>
  <h3><i>3.2</i>COVID-19: how far it goes</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Course</th><th>Clinical manifestations</th><th>Frequency</th></tr>
      <tr><td class="k">A · Asymptomatic</td><td>Absence of clinical manifestations</td><td>40%</td></tr>
      <tr><td class="k">B · Mild</td><td>Fever, dry cough, sore throat, runny nose, sneezing, fatigue, myalgia, headache, smell loss; atypical: nausea, vomiting, diarrhea, abdominal pain</td><td>40%</td></tr>
      <tr><td class="k">C · Moderate</td><td>Mild to moderate pneumonia: persistent fever, dry cough, dyspnea, fast breathing</td><td>15%</td></tr>
      <tr><td class="k">D · Severe</td><td>Dyspnea, hypoxia, more than 50% lung involvement, severe respiratory distress; patients show clinical worsening</td><td rowspan="2">5%</td></tr>
      <tr><td class="k">E · Critical</td><td>Severe shortness of breath, chest pain, movement impairment, loss of speech, with complications</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="note">About <b>80% recover</b> without hospital treatment; about 15% become seriously ill and require oxygen; 5% become critically ill and need intensive care.</div>
</section>

<section class="page" data-t="COVID-19 · the rest" data-g="reveal cards" data-p="Part 03 · Coronaviruses">
  <h3><i>3.3</i>What the lecture adds</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Complications leading to death</small><span>Respiratory failure, acute respiratory distress syndrome (ARDS), sepsis and septic shock, thromboembolism, multiorgan failure, or <b>cytokine storm</b>.</span></div>
    <div class="rvc" data-rv><small>Cytokine release syndrome</small><span>A vital factor that aggravates disease progression. Higher levels of <b>IL-6 and IL-10</b>, and lower levels of <b>CD4+ and CD8+ T cells</b>, have been observed, and correlate with the severity of disease.</span></div>
    <div class="rvc" data-rv><small>Modes of transmission</small><span>Droplets · indirectly through contaminated surfaces or fomites · faeco-oral transmission.</span></div>
    <div class="rvc" data-rv><small>Incubation period</small><span>4–6 days; symptoms within 14 days from infection.</span></div>
    <div class="rvc" data-rv><small>Diagnosis</small><span><b>RT-PCR</b> is the most commonly used molecular test, from a nose or throat swab. <b>Rapid antigen tests</b> detect viral proteins: cheaper and faster, but generally less accurate. <b>Antibody tests</b> show whether someone has had an infection in the past.</span></div>
    <div class="rvc" data-rv><small>Vaccine platforms</small><span>At least 13 different vaccines have been administered. <b>mRNA:</b> Pfizer (2 doses, 21 days apart), Moderna (2 doses, 28 days apart). <b>Viral vector:</b> Johnson &amp; Johnson (single dose), AstraZeneca (2 doses, 8–12 weeks apart), SII/Covishield, Sputnik V. <b>Inactivated virus:</b> Sinopharm, SinoVac (2 doses, 3–4 weeks).</span></div>
  </div>
</section>

<section class="page" data-t="Measles and the paramyxoviruses" data-g="recall table" data-p="Part 04 · Paramyxoviruses and CMV">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Paramyxoviruses and CMV</b><span>Measles · RSV · parainfluenza · cytomegalovirus · hantavirus</span></div></div>
  <h3><i>4.1</i>Measles virus</h3>
  <p>A single serotype; H-glycoprotein and fusion protein; <mark>no neuraminidase</mark>. Reservoir: human respiratory tract; transmission by the respiratory route. It causes <b>cell-to-cell fusion</b> into giant cells, so the virus can escape immune detection.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>The disease: the 3 Cs</small><span><b>Cough, coryza and conjunctivitis</b>, with photophobia · <b>Koplik spots</b> → maculopapular rash from the ears (head and neck) downwards → <b>giant cell pneumonia</b> (Warthin–Finkeldey cells).</span></div>
    <div class="rvc" data-rv><small>The late complication</small><span><b>Subacute sclerosing panencephalitis:</b> a rare late complication, mean time 7–10 years. A mutant measles virus persists in the brain and acts as a slow virus, causing chronic CNS degeneration.</span></div>
    <div class="rvc" data-rv><small>Diagnosis, treatment, prevention</small><span>Serology · supportive treatment, ribavirin (experimental) · live, attenuated vaccine (MMR).</span></div>
  </div>
</section>

<section class="page" data-t="Parainfluenza · RSV · hMPV" data-g="recall table" data-p="Part 04 · Paramyxoviruses and CMV">
  <h3><i>4.2</i>The other three paramyxoviruses</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Virus</th><th>Diseases</th><th>Treatment / prevention</th></tr>
      <tr><td class="k">Parainfluenza</td><td>Older children and adults: subglottal swelling, hoarse barking cough. Infants: colds, bronchiolitis, pneumonia, croup</td><td>Supportive; none</td></tr>
      <tr><td class="k">RSV</td><td>Adults: colds. Infants and premature babies: bronchiolitis and necrosis of bronchioles; atypical pneumonia with low fever, tachypnea, tachycardia and expiratory wheeze</td><td>Ribavirin and anti-RSV antibodies; <b>palivizumab</b> blocks the fusion protein</td></tr>
      <tr><td class="k">Human metapneumovirus</td><td>Common cold (15% in children), bronchiolitis, pneumonia</td><td>Supportive; none</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
</section>

<section class="page" data-t="Cytomegalovirus · hantavirus" data-g="reveal cards" data-p="Part 04 · Paramyxoviruses and CMV">
  <h3><i>4.3</i>Cytomegalovirus</h3>
  <p>Reservoir: humans. Transmission: saliva. CMV infects salivary gland epithelial cells and establishes a <mark>persistent infection</mark> in fibroblasts, epithelial cells and macrophages, with latency in mononuclear cells.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Diseases</small><span><b>Heterophile-negative mononucleosis</b> in children and adults. In immunocompromised patients: interstitial pneumonitis to severe systemic infection, due to reactivation in a transplanted organ or in an AIDS patient.</span></div>
    <div class="rvc" data-rv><small>Diagnosis</small><span><b>Owl-eye inclusion</b> ("sight-o-megalo-virus") in biopsy material and urine · basophilic intranuclear inclusions · serology, DNA detection, virus culture.</span></div>
    <div class="rvc" data-rv><small>Treatment</small><span>Supportive for healthy patients; <b>ganciclovir or foscarnet</b> ± human immunoglobulin for the immunocompromised.</span></div>
  </div>
  <h3><i>4.4</i>Hantavirus (sin nombre)</h3>
  <ul>
    <li><b>Transmission:</b> rodent excreta, four-corners region, rainy season. Infection occurs through <mark>inhalation of aerosols of infected rodent excreta</mark> (urine, feces, saliva). <b>No human-to-human transmission.</b></li>
    <li><b>Hantavirus pulmonary syndrome:</b> cough, myalgia, dyspnea, tachycardia, pulmonary edema and effusion, and hypotension, often leading to respiratory failure. Mortality 50%.</li>
    <li><b>Diagnosis:</b> RT-PCR; detection of specific antibodies in serum by ELISA.</li>
  </ul>
</section>

  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>The organism</b><span>Morphology · staining · culture · virulence factors</span></div></div>
  <h3><i>1.1</i>Why it will not Gram stain</h3>
  <div class="ix" data-ix="field" data-start="tb">
    <div class="cap"><span>Live · the Ziehl–Neelsen film</span><em>schematic field</em></div>

"tb":"<b>Ziehl–Neelsen stain:</b> red <b>acid-fast, alcohol-fast</b> bacilli against a blue background of host cells. M. tuberculosis is <b>not stained by the Gram stain</b> because its cell wall contains a high amount of lipids, including <b>mycolic acids</b>, which form a waxy layer that makes it impermeable to most stains. So it can be classified as neither Gram positive nor Gram negative.",

<section class="page" data-t="What it is" data-g="sorting game" data-p="Part 01 · The organism">
  <h3><i>1.2</i>What it is</h3>
  <ul>
    <li><mark>Acid-fast, alcohol-fast</mark> · <mark>obligate aerobic</mark> · non-spore formers · <mark>facultative intracellular</mark> organisms.</li>
    <li><b>No exotoxins and no endotoxins</b>: they have polysaccharide but no lipid A.</li>
  </ul>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · what does each virulence factor do?</span><em data-k="n"></em></div>

    <div class="chips" style="justify-content:center"><button class="chip sm" data-b="0">Sulfolipids</button><button class="chip sm" data-b="1">Serpentine cord factor</button><button class="chip sm" data-b="2">Mycolic acid</button></div>
    <div class="msg" data-k="fb"></div>
    <script type="application/json">[
["Prevents phagosome and lysosome fusion",0,"Sulfolipids. This is how the organism survives inside the macrophage."],
["Hooks the bacilli together into a cord on fluid media",1,"The serpentine cord factor."],

  <div class="note">The lecture also lists <b>ESAT-6 protein</b> among the virulence factors. They are <b>sensitive to heat, UV light, alcohol and phenol</b>, and are destroyed by pasteurization.</div>

<section class="page" data-t="Culture and species" data-g="recall table" data-p="Part 01 · The organism">
  <h3><i>1.3</i>Culture characteristics</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>M. tuberculosis in the laboratory</th></tr>
      <tr><td class="k">Selective medium</td><td>Löwenstein–Jensen medium; also Dorset's egg and Middlebrook broth</td></tr>
      <tr><td class="k">Growth rate</td><td>Slow: 2–8 weeks</td></tr>
      <tr><td class="k">Atmosphere</td><td>6–8% CO₂ enhances growth</td></tr>
      <tr><td class="k">Faster growth in broth</td><td>With palmitic acid</td></tr>
      <tr><td class="k">Why a selective medium?</td><td>It is a slow grower: rapid growers would consume all the nutrients, and the specimen is contaminated by many types of flora</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <h3><i>1.4</i>The medically important species</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · pick a species</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="t">M. tuberculosis</button><button class="chip sm" data-v="b">M. bovis</button><button class="chip sm" data-v="l">M. leprae</button><button class="chip sm" data-v="a">Atypical (NTM)</button></div>
    <div class="msg" data-for="t">The etiologic agent of <b>pulmonary tuberculosis</b> in humans.</div>
    <div class="msg" data-for="b">The etiologic agent of TB <b>in cattle and humans</b>. The organism is secreted in milk; humans are infected by <b>ingestion of milk</b> from infected cattle, causing <b>intestinal tuberculosis</b>.</div>
    <div class="msg" data-for="l">Causes <b>leprosy</b>.</div>
    <div class="msg" data-for="a"><b>Non-tuberculosis mycobacteria</b> with worldwide distribution: <b>M. avium, M. kansasii, M. intracellulare</b>. Opportunistic; they cause chronic pulmonary lung disease simulating tuberculosis in immunosuppressed patients. <b>No human-to-human transmission</b>, and they are <b>resistant to antituberculosis drugs</b>.</div>
  </div>
</section>

<section class="page" data-t="Typical or saprophytic?" data-g="recall table" data-p="Part 01 · The organism">
  <h3><i>1.5</i>Typical against saprophytic mycobacteria</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Typical mycobacteria</th><th>Saprophytic or NTM</th></tr>
      <tr><td class="k">Incubation time</td><td>Slow grower</td><td>Rapid grower</td></tr>
      <tr><td class="k">Pigmentation</td><td>Non-pigmented</td><td>Pigmented</td></tr>
      <tr><td class="k">ZN stain</td><td>Acid fast and alcohol fast</td><td>Acid fast but not alcohol fast</td></tr>
      <tr><td class="k">Example</td><td>M. tuberculosis</td><td>M. smegmatis: an environmental acid-fast bacillus, not associated with human illness</td></tr>
    </table>

  </div>
</section>

<section class="page" data-t="Primary tuberculosis" data-g="tap in order" data-p="Part 02 · Primary and secondary disease">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Primary and secondary disease</b><span>Ghon's focus · latency · reactivation · miliary spread</span></div></div>
  <h3><i>2.1</i>Mode of transmission</h3>
  <p><b>Air-borne:</b> the bacilli are carried by air or droplet infection.</p>
  <h3><i>2.2</i>Primary tuberculosis, step by step</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>The bacilli are engulfed by alveolar macrophages</li><li>They replicate intracellularly</li><li>Formation of tubercles: epithelioid cells, lymphocytes and giant cells</li><li>Development of delayed hypersensitivity after 6 weeks</li><li>This pulmonary lesion is <b>Ghon's focus</b></li><li>Ghon's focus plus the enlarged lymph nodes is <b>Ghon's complex</b></li></ol>
  </div>
</section>

<section class="page" data-t="Latent and secondary disease" data-g="reveal cards" data-p="Part 02 · Primary and secondary disease">
  <h3><i>2.3</i>Latent and secondary disease</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>What happens after the primary infection?</small><span>Some organisms remain viable in a <b>dormant form</b>. The lesion undergoes fibrosis.</span></div>
    <div class="rvc" data-rv><small>How often does it come back?</small><span>Reactivation occurs in about <b>10%</b> of patients.</span></div>
    <div class="rvc" data-rv><small>Two causes of reactivation</small><span>Exogenous reinfection, and immunosuppression.</span></div>
    <div class="rvc" data-rv><small>Where does it reactivate?</small><span>At the <b>apex</b> of the lung.</span></div>
    <div class="rvc" data-rv><small>Miliary tuberculosis</small><span>Dissemination of bacilli through the <b>blood stream</b> to many organs such as brain, bone and kidney, causing meningitis, renal tuberculosis and bone infection: <b>tuberculosis in all organs</b>. Seen at all ages; it can occur at any stage after the primary infection.</span></div>
  </div>
</section>

<section class="page" data-t="Immunity in tuberculosis" data-g="tap in order" data-p="Part 03 · The immune response">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>The immune response</b><span>Innate immunity · cell-mediated immunity · the granuloma</span></div></div>
  <h3><i>3.1</i>Why innate immunity is not enough</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · two cells, two failures</span><em></em></div>
    <div class="chips"><button class="chip" data-v="m">Macrophages</button><button class="chip" data-v="n">Neutrophils</button></div>
    <div class="msg" data-for="m">The bacillus is taken into the phagosome, but its <b>sulfolipids inhibit phagolysosome fusion</b>, so the lysosomes never reach it.</div>
    <div class="msg" data-for="n">Neutrophils are attracted to the bacilli but <b>fail to kill them, because they lack the lipase enzyme</b>.</div>
  </div>
  <h3><i>3.2</i>Cell-mediated immunity takes over</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>The antigen-presenting cell migrates into the lymph node to meet the specific T helper cells</li><li>It presents antigen and releases <b>IL-12</b>; NK cells release interferon</li><li><b>IL-2</b> stimulates the proliferation of clones of T cells; memory cells are formed</li><li>Effector T helper cells travel to the site of infection</li><li>Effector Th1 produces <b>IL-2, interferon and TNF-β</b>, which repeatedly activate macrophages</li><li>The activated macrophages become <b>epithelioid cells</b> and form a <b>granuloma</b>, which prevents the spread of the bacteria</li></ol>
  </div>
  <div class="note"><b>T cytotoxic (CD8+) cells</b> contribute to the immune response against M. tuberculosis by <b>direct killing</b>.</div>
</section>

<section class="page" data-t="Active or latent?" data-g="compare" data-p="Part 04 · Diagnosis">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Diagnosis</b><span>Active against latent · the sputum · rapid methods</span></div></div>
  <h3><i>4.1</i>Two pictures, side by side</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Active or reactivated TB</th><th>Latent TB</th></tr>
      <tr><td class="k">Symptoms</td><td>Cough, fever and night sweats, weight loss, fatigue, weakness</td><td>Asymptomatic</td></tr>
      <tr><td class="k">Sputum smear and culture</td><td>Positive</td><td>Negative</td></tr>
      <tr><td class="k">Tuberculin test</td><td>Positive</td><td>Positive</td></tr>
      <tr><td class="k">QuantiFERON test</td><td>Positive</td><td>Positive</td></tr>
      <tr><td class="k">Contagious?</td><td>Can be transmitted to others</td><td>Not contagious</td></tr>
      <tr><td class="k">Treatment</td><td>Full drug combination</td><td>No treatment, or monotherapy</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="note"><b>QuantiFERON is the gold standard test in latent TB.</b> Notice that neither skin test nor QuantiFERON can separate active from latent disease on its own: the sputum does that.</div>
</section>

<section class="page" data-t="The sputum specimen" data-g="tap in order" data-p="Part 04 · Diagnosis">
  <h3><i>4.2</i>The sputum specimen</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step</span><em data-k="n"></em></div>
    <ol class="stp"><li>Use a suitable sterile, dry, wide-neck, leak-proof container</li><li>Avoid contamination of the rim and outside of the container</li><li>Most patients need coaching in how to cough up phlegm from deep in the chest</li><li>Early morning samples are greatly helpful: <b>three consecutive days</b> are recommended for isolation of M. tuberculosis</li><li>Adding <b>5% glycerin</b> favours the growth of M. tuberculosis but not M. bovis</li></ol>
  </div>
</section>

<section class="page" data-t="Rapid methods · QuantiFERON" data-g="reveal cards" data-p="Part 04 · Diagnosis">
  <h3><i>4.3</i>Four rapid methods</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>BACTEC system</small><span>Culture on media containing <b>labelled palmitic acid</b>. The growing bacteria use the palmitic acid and release radioactive CO₂, which the machine detects.</span></div>
    <div class="rvc" data-rv><small>Mycobacteria indicator tube</small><span>Culture on fluid media containing a <b>fluorescence sensor</b>: when the mycobacteria consume O₂ they produce fluorescence, detected by UV.</span></div>
    <div class="rvc" data-rv><small>PCR</small><span>Detection of DNA.</span></div>
    <div class="rvc" data-rv><small>QuantiFERON TB test</small><span>Measures the <b>interferon gamma</b> released when the blood of a patient with tuberculosis or latent infection is mixed with specific proteins derived from the tubercle bacillus: <b>ESAT-6, CFP-10 and TB7.7</b>. Sensitized Th1 cells release IL-2, INF-γ and TNF-β; the INF-γ is measured by ELISA in 16–24 hours.</span></div>
  </div>
  <h3><i>4.4</i>Four advantages of QuantiFERON</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each one</span><em data-k="n"></em></div>
    <ol class="stp"><li>The result is available within 24 hours</li><li>It requires only 1 visit</li><li>No false positive, because it is not affected by BCG or non-tuberculous mycobacteria</li><li>It is more specific than the tuberculin test, for the same reason</li></ol>
  </div>
</section>

  <h3><i>5.1</i>Read the induration</h3>
  <div class="ix" data-ix="ppd">
    <div class="cap"><span>Live · drag the slider</span><em>induration <b data-k="mm">10 mm</b> · <b data-k="res">Positive</b></em></div>

    <input type="range" min="0" max="20" step="1" value="10" aria-label="Induration in millimetres">
    <div class="msg" data-k="msg"></div>
  </div>
</section>

<section class="page" data-t="How the test is done" data-g="recall table" data-p="Part 05 · The tuberculin test">
  <h3><i>5.2</i>How the test is done</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · how the test is done</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Tuberculin skin test</th></tr>
      <tr><td class="k">Material</td><td>Purified protein derivative (PPD)</td></tr>
      <tr><td class="k">Amount</td><td>0.1 ml of PPD</td></tr>
      <tr><td class="k">Type of injection</td><td>Intradermal, in the forearm</td></tr>
      <tr><td class="k">Best time to read</td><td>After 48–72 hours</td></tr>
      <tr><td class="k">A positive test</td><td>Red induration measuring not less than 9 mm</td></tr>
      <tr><td class="k">Type of reaction</td><td>Delayed hypersensitivity</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="note"><b>Mechanism.</b> The induration is due to accumulation of antigen-specific T lymphocytes that are activated and release mediators (IL-1, IL-2, INF, TNF-β) which attract macrophages and polymorphs to the site of injection.</div>
</section>

<section class="page" data-t="Reading it wrongly" data-g="sorting game" data-p="Part 05 · The tuberculin test">
  <h3><i>5.3</i>Why a test can mislead</h3>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · tap the right column</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>This tuberculin result is…</small><b data-k="card" style="font-size:1.02em;line-height:1.35"></b></div></div>
    <div class="chips" style="justify-content:center"><button class="chip sm" data-b="0">True positive</button><button class="chip sm" data-b="1">False positive</button><button class="chip sm" data-b="2">True negative</button><button class="chip sm" data-b="3">False negative</button></div>
    <div class="msg" data-k="fb"></div>
    <script type="application/json">[

["Infection with a cross-reacting mycobacterium",1,"The same reason."],

  <h3><i>5.4</i>Four uses of the test</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each one</span><em data-k="n"></em></div>
    <ol class="stp"><li>To diagnose active infection in infants and young children</li><li>To measure the prevalence of infection in an area</li><li>As an indication of successful BCG vaccination</li><li>To test cell-mediated immunity</li></ol>
  </div>
</section>

<section class="page" data-t="Prevention and treatment" data-g="recall" data-p="Part 06 · BCG and treatment">
  <div class="part"><div class="pn">06</div><div><small>PART 06</small><b>BCG and treatment</b><span>The vaccine · the drugs</span></div></div>
  <h3><i>6.1</i>Immunization by BCG</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>What is in it?</small><span>A <b>living attenuated vaccine</b> prepared from attenuated <b>M. bovis</b> tubercle bacilli, called BCG (bacillus Calmette–Guérin).</span></div>
    <div class="rvc" data-rv><small>How is it given?</small><span>A single dose of <b>0.1 ml intradermally in the deltoid region</b>. It is <b>compulsory in Egypt</b>.</span></div>
    <div class="rvc" data-rv><small>The one exception</small><span>For infants up to 3–6 months who were not vaccinated, a tuberculin test should be done first. Only the <b>negative</b> infants are given the vaccine.</span></div>
    <div class="rvc" data-rv><small>Newer vaccine</small><span>Recombinant BCG vaccine.</span></div>
  </div>
  <h3><i>6.2</i>Treatment of active tuberculosis</h3>
  <ul>
    <li>The most commonly used antituberculous drugs are <mark>isoniazid, rifampicin and streptomycin</mark>, for <mark>6–18 months</mark>.</li>
    <li>A <b>drug combination</b> should be used, to prevent drug resistance.</li>
  </ul>
  <div class="note">This is the microbiology view of tuberculosis. The <b>pathology</b> of the tubercle, caseation and the primary complex is in Pathology lecture 2; read the two together.</div>
</section>

<section class="page" data-t="Cryptococcus neoformans" data-g="reveal cards" data-p="Part 02 · Cryptococcus and Aspergillus">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Cryptococcus and Aspergillus</b><span>The two opportunists</span></div></div>
  <h3><i>2.1</i>Cryptococcus pneumonia</h3>
  <p>An <mark>opportunistic</mark> pathogen affecting mainly the immunosuppressed. Infection occurs by <mark>inhalation of spores</mark>. It causes pneumonia, which then spreads systemically to the meninges, causing <b>meningitis</b>.</p>
  <div class="ix"><div class="cap"><span>Recall · four laboratory methods</span><em></em></div>
    <div class="rvc" data-rv><small>1 · India ink</small><span>A direct test to demonstrate yeast cells surrounded by a <b>gelatinous polysaccharide capsule</b>.</span></div>
    <div class="rvc" data-rv><small>2 · Direct immunofluorescence</small><span>Shows the organism directly in the specimen.</span></div>
    <div class="rvc" data-rv><small>3 · Latex agglutination</small><span>Latex coated with antibody. Particularly valuable for <b>CSF in meningitis</b>, where it is <b>more sensitive than the direct India ink test</b>.</span></div>
    <div class="rvc" data-rv><small>4 · Culture</small><span>On Sabouraud's dextrose agar or blood agar: <b>mucoid colonies after 1–2 days</b>.</span></div>
  </div>
</section>

<section class="page" data-t="Pulmonary aspergillosis" data-g="reveal cards" data-p="Part 02 · Cryptococcus and Aspergillus">
  <h3><i>2.2</i>Pulmonary aspergillosis</h3>
  <p>An opportunistic <b>filamentous</b> fungus; hyphae are the filamentous cellular units of moulds. The most important species are <mark>A. fumigatus, A. niger, A. flavus</mark>. Infection occurs by inhalation of the spores (conidia).</p>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · which clinical condition?</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="loc">Localized · A. niger</button><button class="chip sm" data-v="ball">Aspergilloma</button><button class="chip sm" data-v="all">Allergic</button><button class="chip sm" data-v="inv">Invasive</button><button class="chip sm" data-v="chr">Chronic pulmonary</button></div>
    <div class="msg" data-for="loc">Localized infections caused by <b>Aspergillus niger</b>: sinusitis, keratitis, otomycosis.</div>
    <div class="msg" data-for="ball"><b>Aspergilloma (fungus ball)</b>, in immunocompromised persons, especially in <b>tuberculosis cavities</b>. Systemic aspergillosis is caused by A. fumigatus.</div>
    <div class="msg" data-for="all"><b>Allergic aspergillosis</b>, a <b>type I hypersensitivity</b>: the <b>most common type</b> of aspergillosis.</div>
    <div class="msg" data-for="inv"><b>Invasive aspergillosis.</b></div>
    <div class="msg" data-for="chr"><b>Chronic pulmonary aspergillosis.</b></div>
  </div>
  <div class="note"><b>Laboratory diagnosis of pulmonary aspergillosis.</b> Chest x-ray: fungal ball. Specimen: bronchial lavage, sputum, or biopsy from the fungus ball. Direct smear with lactophenol cotton blue: septate hyphae with the aspergillus head. Culture on SDA: <b>surface colour green, velvety or powdery; reverse colour cream or tan</b>. Molecular diagnosis by PCR.</div>
</section>

<section class="page" data-t="Coccidioidomycosis" data-g="tap in order" data-p="Part 03 · The dimorphic three">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>The dimorphic three</b><span>Coccidioides · Histoplasma · Blastomyces</span></div></div>
  <h3><i>3.1</i>Acute coccidioidomycosis: valley fever</h3>
  <p>Caused by <mark>Coccidioides immitis</mark>, a dimorphic soil fungus of the division Ascomycota. Mainly in the south-west USA and northern Mexico, in the warm and dry summer and fall months. Up to <b>50% of people in endemic areas</b> have been exposed to its spores.</p>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · the environmental and in vivo cycle</span><em data-k="n"></em></div>
    <ol class="stp"><li>In the environment it grows as a mycelium and produces sturdy chains of asexual spores called <b>arthroconidia</b></li><li>Inhalation of the arthroconidia, which are highly infectious: the <b>infective stage</b></li><li>They are phagocytosed by macrophages and develop into the tissue form, a <b>spherule</b></li><li>Each spherule enlarges and generates a large number of spores by multiple divisions</li><li>It ruptures and releases the spores into the surrounding tissue</li></ol>
  </div>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · what happens next depends on immunity</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="a">Immunocompetent</button><button class="chip sm" data-v="b">Symptomatic</button><button class="chip sm" data-v="c">Uncommon</button></div>
    <div class="msg" data-for="a"><b>Asymptomatic</b> in most cases, when cell-mediated immunity is good.</div>
    <div class="msg" data-for="b">A <b>flu-like illness (valley fever)</b>, or pneumonia.</div>
    <div class="msg" data-for="c"><b>Dissemination</b>, which is uncommon. There is <b>no human-to-human transmission</b>.</div>
  </div>
  <div class="note"><b>Laboratory diagnosis.</b> Specimens: sputum or tissue biopsy. Microscopy shows the characteristic <b>spherules and endospores</b>. Culture on SDA at 25–30 °C, but the arthroconidia are highly infectious and a serious danger to laboratory personnel. Serology: <b>latex agglutination is the best diagnostic test</b>.</div>
</section>

<section class="page" data-t="Histoplasmosis · blastomycosis" data-g="recall table" data-p="Part 03 · The dimorphic three">
  <h3><i>3.2</i>Histoplasma capsulatum</h3>
  <p>Causes <b>histoplasmosis</b>, the <mark>most common fungal systemic disease affecting humans</mark>. The fungus becomes a pathogenic yeast at 37 °C. Despite the name, it is <b>not capsulated</b>.</p>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · mode of transmission</span><em data-k="n"></em></div>
    <ol class="stp"><li>Bat, bird or pigeon excretion contaminates the soil</li><li><b>Inhalation of microconidia spores</b>: the portal of entry</li><li>Phagocytosed by the macrophage, where it becomes a yeast</li><li>Strong cell-mediated immunity: a <b>granuloma</b>, and the patient is asymptomatic</li><li>Weak cell-mediated immunity: <b>dissemination</b>, which <b>resembles tuberculosis</b></li></ol>
  </div>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · laboratory diagnosis</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Step</th><th>Detail</th></tr>
      <tr><td class="k">Specimens</td><td>Sputum in acute pulmonary disease; serum in chronic pulmonary disease</td></tr>
      <tr><td class="k">Culture at 22 °C</td><td>Sabouraud dextrose agar, to demonstrate the <b>hyphal form</b></td></tr>
      <tr><td class="k">Culture at 37 °C</td><td>Glucose cysteine agar, to demonstrate the <b>yeast form</b></td></tr>
      <tr><td class="k">Direct immunofluorescence</td><td>Shows the yeast cells</td></tr>
      <tr><td class="k">Serology</td><td>Detection of antibodies</td></tr>
      <tr><td class="k">Histoplasmin skin test</td><td><b>Not used for diagnosis</b>, but in epidemiological surveys</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
</section>

<section class="page" data-t="Pulmonary blastomycosis" data-g="recall" data-p="Part 03 · The dimorphic three">
  <h3><i>3.3</i>Pulmonary blastomycosis</h3>
  <ul>
    <li>Caused by <mark>Blastomyces dermatitidis</mark>, a dimorphic fungus of moist soil, wood, swamp and waterways. More common in males. North America (Ohio and Mississippi river valleys, Great Lakes), also Canada, Africa and India.</li>
    <li><b>No association with birds or mammals</b> has been established; it affects humans and animals (dogs).</li>
    <li><b>High risk:</b> hunters and forestry workers; people with a weak immune system (organ transplant, HIV/AIDS, diabetes mellitus, viral hepatitis, lymphoma or leukaemia, steroid medication).</li>
    <li><b>Pathogenesis:</b> inhalation of microconidia spores (lollipop) → phagocytosed by macrophage → yeast. No human-to-human transmission. Asymptomatic disease is <b>uncommon</b>; dissemination is the most common outcome.</li>
    <li><b>Diagnosis:</b> sputum or biopsy; 10% KOH mount shows <b>double-walled yeast cells with large broad-based buds</b>; culture as a mould at 25 °C converting to yeast at 37 °C; serology by complement fixation, immunodiffusion or enzyme immunoassay.</li>
  </ul>
</section>

  <h3><i>1.2</i>The two rules of antibiotic therapy</h3>
  <ul>

  <h3><i>2.1</i>Work through the algorithm</h3>
  <p>Treatment of CAP is predominantly <mark>empiric</mark>: it is started without knowing the causative pathogen. Patients are sorted into two broad categories, outpatient and inpatient.</p>

<section class="page" data-t="Hospital pneumonia" data-g="recall table" data-p="Part 03 · Hospital-associated pneumonia">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Hospital-associated pneumonia</b><span>HCAP · HAP · VAP · early and late onset</span></div></div>
  <h3><i>3.1</i>The names and the rules</h3>
  <ul>
    <li>"Nosocomial pneumonia" has been replaced by <mark>health care–associated (HCAP)</mark>, <mark>hospital-associated (HAP)</mark> and <mark>ventilator-associated (VAP)</mark> pneumonia.</li>
    <li>Selection is <b>empirical and broad spectrum</b>; once culture and susceptibility are available the therapy should be <b>narrowed (de-escalation)</b> to cover the identified pathogens.</li>
    <li>Two factors drive the empirical choice: <b>onset time after admission</b>, and <b>risk factors for MDR organisms</b>.</li>
  </ul>
</section>

<section class="page" data-t="Early or late onset" data-g="recall table" data-p="Part 03 · Hospital-associated pneumonia">
  <h3><i>3.2</i>Early onset or late onset?</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Early onset (under 5 days), no MDR risk</th><th>Late onset or MDR risk</th></tr>
      <tr><td class="k">Most frequent pathogens</td><td>S. pneumoniae, H. influenzae, methicillin-susceptible S. aureus (MSSA), enteric gram-negative bacilli</td><td>P. aeruginosa, extended-spectrum β-lactamase–producing K. pneumoniae, MRSA</td></tr>
      <tr><td class="k">Empirical choice</td><td>A third-generation cephalosporin (ceftriaxone or cefotaxime); or a respiratory fluoroquinolone (gemifloxacin, levofloxacin, moxifloxacin); or ampicillin/sulbactam; or ertapenem</td><td>Must cover <b>P. aeruginosa</b>, which then often covers the other gram-negative pathogens</td></tr>
      <tr><td class="k">Available agents</td><td>As above</td><td>Cefepime, ceftazidime, imipenem, meropenem, piperacillin/tazobactam, ticarcillin/clavulanate, levofloxacin, ciprofloxacin, gentamicin, tobramycin, amikacin</td></tr>
      <tr><td class="k">If MRSA is suspected</td><td>—</td><td>Add <b>vancomycin or linezolid</b> to the regimen</td></tr>
    </table>

  </div>
</section>

<section class="page" data-t="VAP and HAP" data-g="compare" data-p="Part 03 · Hospital-associated pneumonia">
  <h3><i>3.3</i>The two ward algorithms</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · pick a situation</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="v0">VAP · no MDR risk</button><button class="chip sm" data-v="v1">VAP · MDR risk</button><button class="chip sm" data-v="h0">HAP · low mortality risk</button><button class="chip sm" data-v="h1">HAP · high mortality risk</button></div>
    <div class="msg" data-for="v0">A <b>single antipseudomonal agent</b> with at least 90% empiric activity on the local ICU antibiogram: cefepime, imipenem, levofloxacin, meropenem or piperacillin/tazobactam.</div>
    <div class="msg" data-for="v1">An <b>antipseudomonal β-lactam</b> (aztreonam, cefepime, ceftazidime, imipenem, meropenem, piperacillin/tazobactam) <b>plus an antipseudomonal fluoroquinolone</b> (ciprofloxacin or levofloxacin). The same combination is used when a single agent has less than 90% empiric activity locally. Add <b>vancomycin or linezolid</b> where MRSA is a concern.</div>
    <div class="msg" data-for="h0">If local MRSA prevalence is <b>20% or less</b>: a single antipseudomonal agent (cefepime, imipenem, levofloxacin, meropenem, piperacillin/tazobactam). If local MRSA prevalence is <b>above 20% or not known</b>: add <b>linezolid or vancomycin</b>.</div>
    <div class="msg" data-for="h1">An <b>antipseudomonal β-lactam</b> (aztreonam, cefepime, ceftazidime, imipenem, meropenem, piperacillin/tazobactam) <b>plus either</b> an antipseudomonal fluoroquinolone (ciprofloxacin or levofloxacin) <b>or</b> an aminoglycoside (amikacin, gentamicin or tobramycin), <b>and</b> linezolid or vancomycin.</div>
  </div>
  <div class="note">The lecture presents all of this as flow charts. Work through the live algorithm on the previous page for CAP, and use this page for the hospital algorithms.</div>
</section>

<section class="page" data-t="Drug therapy of cough" data-g="tap in order" data-p="Part 04 · Cough and secretions">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Cough and secretions</b><span>The reflex · expectorants · mucolytics</span></div></div>
  <h3><i>4.1</i>The cough reflex</h3>
  <p>Cough is a <mark>protective reflex</mark>.</p>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Cough receptors are located in the <b>pharynx, larynx, trachea and bronchi</b></li><li>Irritation of the respiratory airway generates cough impulses</li><li>They are carried by <b>afferent fibers</b> originating from irritant receptors in the respiratory passage</li><li>They relay in the <b>cough center in the medulla oblongata</b></li></ol>
  </div>
  <h3><i>4.2</i>Two groups of drug</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare</span><em></em></div>
    <div class="chips"><button class="chip" data-v="e">Expectorants</button><button class="chip" data-v="m">Mucolytics</button></div>
    <div class="msg" data-for="e"><b>Expectorants (cough stimulants)</b> increase the volume of bronchial secretion and facilitate removal of respiratory tract secretions by coughing.</div>
    <div class="msg" data-for="m"><b>Mucolytic</b> refers to the breakdown or lysis of mucus. Mucolytics help the action of expectorants.</div>
  </div>
</section>

<section class="page" data-t="Guaifenesin and acetylcysteine" data-g="recall table" data-p="Part 04 · Cough and secretions">
  <h3><i>4.3</i>The two named drugs</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Guaifenesin (expectorant)</th><th>N-acetylcysteine (mucolytic)</th></tr>
      <tr><td class="k">Mechanism</td><td>Reduces the viscosity of tracheal and bronchial secretions</td><td>Cleaves <b>disulfide bonds</b> in mucous glycoproteins, loosening thick sputum; also a <b>glutathione donor</b> in acetaminophen overdose</td></tr>
      <tr><td class="k">Clinical uses</td><td>An expectorant in over-the-counter medications, and in intensive care to help patients on mechanical ventilation clear secretions</td><td>Cystic fibrosis, tracheostomy care, any respiratory condition with abnormal or inspissated mucous secretions, and acetaminophen overdose</td></tr>
      <tr><td class="k">Side effects</td><td>Minimal toxicity</td><td>Minimal toxicity</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="note">The lecture's objectives also name <b>antitussive, anti-secretory and nasal decongestant</b> agents, and it has a slide headed "Cough suppressants (antitussives)", but the file carries no content under it. Ask for that slide in this year's lecture.</div>
</section>

<section class="page" data-t="Which group of drug?" data-g="sorting game" data-p="Part 05 · Put it together">
  <div class="part"><div class="pn">05</div><div><small>PART 05</small><b>Put it together</b><span>Sorting the regimens · the lecture's two cases</span></div></div>
  <h3><i>5.1</i>Name the group</h3>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · tap the group</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>Which group does it belong to?</small><b data-k="card" style="font-size:1.05em"></b></div></div>
    <div class="chips" style="justify-content:center"><button class="chip sm" data-b="0">Macrolide</button><button class="chip sm" data-b="1">Respiratory fluoroquinolone</button><button class="chip sm" data-b="2">β-lactam</button><button class="chip sm" data-b="3">Aminoglycoside</button><button class="chip sm" data-b="4">Anti-MRSA</button></div>
    <div class="msg" data-k="fb"></div>

["Tobramycin",3,"With amikacin and gentamicin."],
["Linezolid",4,"With vancomycin, added when MRSA is suspected."],

  </div>
  <h3><i>5.2</i>Doxycycline: where does it fit?</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Previously healthy outpatient</small><span>A first-line option alongside a macrolide.</span></div>
    <div class="rvc" data-rv><small>Outpatient with comorbidity who had antibiotics recently</small><span>An acceptable <b>alternative to a macrolide</b>, when a different class is needed.</span></div>
    <div class="rvc" data-rv><small>Inpatient not in the ICU</small><span>May be combined with an IV β-lactam, in place of an advanced macrolide.</span></div>
  </div>
</section>

<section class="page" data-t="The lecture's two cases" data-g="2 cases" data-p="Part 05 · Put it together">
  <h3><i>5.3</i>Case 1</h3>
  <p style="font-size:.92em">A <b>68-year-old man</b> developed a harsh, productive cough four days before being seen. The sputum is thick and yellow. He developed fever, shaking chills and malaise, and one day ago pain in his right chest that intensifies with inspiration. He had a chronic smoker's cough for 10 or 15 years, mild and non-productive, most often in the early morning. He smoked 2 packs a day for 50 years; a retired truck driver treated for mild hypertension and bronchitis. <b>BP</b> 152/90, <b>heart rate</b> 112 and regular, <b>respiratory rate</b> 24. Both lungs resonant except the right mid-anterior and right mid-lateral fields, which are dull; bilateral diminished vesicular breath sounds. <b>WBC</b> 17,000/mm³ with 70% neutrophils, 15% bands, 15% lymphocytes. Chest x-ray revealed an acute pneumonia in the <b>right middle lobe</b>; he was treated with antibiotics as an outpatient and improved over 10 days.</p>
  <div class="ix"><div class="cap"><span>Recall · tap for the lecture's answer</span><em></em></div>
    <div class="rvc" data-rv><small>What would you prescribe? Penicillin or not? How long?</small><span>A <b>macrolide</b> is an effective agent, as the emergence of <b>penicillin-resistant strains</b> is of great concern. A third-generation cephalosporin (<b>ceftriaxone</b>) is also effective. Duration around <b>7–10 days</b>.</span></div>
  </div>
</section>

<section class="page" data-t="Case 2" data-g="case" data-p="Part 05 · Put it together">
  <h3><i>5.4</i>Case 2</h3>
  <p style="font-size:.92em">A <b>15-year-old girl</b> with a history of hay fever develops fever, headache and malaise for 4 days, followed by a <b>non-productive cough</b> and scratchy throat. Despite chicken soup and orange juice the cough and fever persist. On examination temperature 39 °C, pulse 90, BP 110/70, respiratory rate 20. Examination is unremarkable except for scattered rales over the left lower lung. Chest x-ray reveals a <b>patchy left lower lobe infiltrate</b>. She makes a heroic effort but is unable to produce sputum.</p>
  <div class="ix"><div class="cap"><span>Recall · tap for the lecture's answer</span><em></em></div>
    <div class="rvc" data-rv><small>What would you prescribe? Penicillin or not? How long?</small><span>The same answer: a <b>macrolide</b>, because of penicillin-resistant strains; a third-generation cephalosporin (ceftriaxone) is also effective. Duration around <b>7–10 days</b>.</span></div>
    <div class="rvc" data-rv><small>Why does this pattern fit an atypical pneumonia?</small><span>A teenager with a <b>dry, non-productive cough</b>, a patchy infiltrate and no sputum to send: the picture of atypical pneumonia. The microbiology lecture puts Mycoplasma pneumoniae at the top of that list for this age group.</span></div>
  </div>
</section>

<template data-book="pha-l2" data-subj="Pharmacology" data-lec="L2" data-title="Drug therapy of bronchial asthma" data-short="Pharmacology L2">
<section class="page" data-t="Bronchial asthma" data-g="reveal cards" data-p="Part 01 · The disease and the plan">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Bronchial asthma</b><span>What goes wrong · early and late responses · the drug groups</span></div></div>
  <h3><i>1.1</i>What asthma is</h3>
  <p>An <mark>inflammatory disease</mark> associated with bronchial hyperreactivity (BHR), bronchospasm, increased mucus secretion, edema and cellular infiltration.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Early asthmatic response (EAR)</small><span>Lasts 30 to 60 minutes. Bronchospasm from the actions of released histamine and leukotrienes.</span></div>
    <div class="rvc" data-rv><small>Late asthmatic response (LAR)</small><span>Infiltration of eosinophils and lymphocytes into the airways → bronchoconstriction and inflammation with mucous plugging.</span></div>
    <div class="rvc" data-rv><small>Management includes</small><span>Bronchodilators for short-term relief. Anti-inflammatory agents that reduce bronchial hyperactivity and protect against cellular infiltration.</span></div>
  </div>
  <h3><i>1.2</i>The drug groups</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each group in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Bronchodilators: sympathomimetics (β₂-adrenergic agonists), anticholinergics (ipratropium), methylxanthines (aminophylline, theophylline)</li><li>Corticosteroids</li><li>Mast cell stabilizers (ketotifen, cromoglycate)</li><li>Leukotriene antagonists (zileuton, zafirlukast, montelukast)</li><li>Monoclonal antibodies (omalizumab)</li></ol>
  </div>
</section>

<section class="page" data-t="Treat the airway" data-g="live airway" data-p="Part 01 · The disease and the plan">
  <h3><i>1.3</i>Treat the airway: pick a drug and watch</h3>

<section class="page" data-t="β₂ agonists · the cAMP map" data-g="tap a drug" data-p="Part 02 · Bronchodilators">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Bronchodilators</b><span>β₂ agonists · muscarinic antagonists · methylxanthines</span></div></div>
  <h3><i>2.1</i>Where each drug acts</h3>
  <div class="ix" data-ix="hl" data-start="b2">
    <div class="cap"><span>Live · tap a drug</span><em>orange = its target</em></div>

      <g class="n"><rect x="318" y="8" width="38" height="22" rx="6"/><text x="337" y="23" text-anchor="middle">AMP</text></g>
      <path class="ed" d="M58 19h18M168 19h18M238 19h14M306 19h12M212 30v14"/>
      <g class="n good"><rect x="150" y="44" width="124" height="22" rx="6"/><text x="212" y="59" text-anchor="middle">Smooth muscle relaxation</text></g>

    <div class="chips"><button class="chip sm" data-v="b2">β₂ agonists</button><button class="chip sm" data-v="th">Theophylline</button><button class="chip sm" data-v="m">Ipratropium</button><button class="chip sm" data-v="crom">Cromolyn</button><button class="chip sm" data-v="mont">Montelukast</button><button class="chip sm" data-v="zil">Zileuton</button><button class="chip sm" data-v="oma">Omalizumab</button><button class="chip sm" data-v="ster">Glucocorticoids</button></div>
    <div class="msg" data-for="b2"><b>β₂ agonists</b> act on β₂ receptors of adenyl cyclase, the enzyme that converts ATP to cyclic AMP. More cyclic AMP in bronchial smooth muscle → relaxation.</div>
    <div class="msg" data-for="th"><b>Theophylline</b> inhibits phosphodiesterase (PDE), the enzyme that breaks down cyclic AMP, and antagonizes adenosine (a bronchoconstrictor).</div>
    <div class="msg" data-for="m"><b>Ipratropium and tiotropium</b> antagonize acetylcholine at muscarinic (M₃) receptors on bronchial smooth muscle and reduce secretions from mucous glands.</div>

    <div class="msg" data-for="oma"><b>Omalizumab</b> is an anti-IgE monoclonal antibody.</div>
    <div class="msg" data-for="ster"><b>Glucocorticoids</b> block mediator release and decrease BHR by decreasing prostaglandins, leukotrienes and inflammatory interleukins.</div>

<section class="page" data-t="β₂ agonists in detail" data-g="reveal cards" data-p="Part 02 · Bronchodilators">
  <h3><i>2.2</i>Inhaled β₂-adrenergic selective agonists</h3>
  <ul>
    <li><b>Short acting:</b> <mark>albuterol, levalbuterol</mark> (also terbutaline). <b>Long acting:</b> <mark>salmeterol, formoterol</mark>.</li>
    <li>Long-acting drugs may decrease night-time attacks (<mark>prophylaxis only</mark>) and permit dosage reduction of other agents.</li>
  </ul>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Clinical uses (6)</small><span>Alleviate acute bronchospasm in acute asthma exacerbations (most common) · prophylaxis against exercise-induced asthma · bronchospasm in COPD · during general anesthesia · in NRDS or RSV infection · rapid treatment of critical hyperkalemia (drive K⁺ into cells).</span></div>
    <div class="rvc" data-rv><small>Side effects</small><span>Tachycardia and palpitations (some β₁ effects; levalbuterol is more β₂ selective than albuterol and causes less tachycardia) · tremors, anxiety · hypokalemia.</span></div>
    <div class="rvc" data-rv><small>Aerosol forms</small><span>Low potential for systemic toxicity, but may cause anxiety, muscle tremors and cardiovascular toxicity with overuse.</span></div>
  </div>
  <h3><i>2.3</i>Muscarinic antagonists</h3>
  <ul>
    <li><mark>Ipratropium</mark> (short acting), <mark>tiotropium</mark> (long acting); by inhalation.</li>
    <li><b>Uses:</b> COPD maintenance therapy and asthma exacerbations. May be safer than β agonists in patients with cardiovascular disease.</li>
    <li><mark>Drugs of choice in bronchospasm caused by β blockers.</mark></li>
    <li><b>Side effects:</b> nasal mucosa dryness, xerostomia, bronchitis, sinusitis (minor atropine-like effects).</li>
  </ul>
</section>

<section class="page" data-t="Methylxanthines · PDE4 inhibitors" data-g="reveal cards" data-p="Part 02 · Bronchodilators">
  <h3><i>2.4</i>Methylxanthines: theophylline</h3>
  <ul>
    <li>Bronchodilation through inhibition of phosphodiesterase → ↑ cyclic AMP; also antagonism of adenosine. Also thought to increase the contraction force of the diaphragm by increasing Ca²⁺ uptake into the muscle.</li>
    <li><b>Uses:</b> asthma controller medication and treatment for COPD; mainly adjunctive. Aminophylline IV is sometimes used in bronchospasm or status asthmaticus.</li>
  </ul>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Why is it a last-line controller?</small><span>Narrow therapeutic index (window), which predisposes to toxicity. Used in patients with poorly controlled asthma.</span></div>
    <div class="rvc" data-rv><small>Toxicity</small><span>Tremor, irritability, nausea, vomiting, diarrhea, tachyarrhythmia (↑ HR, arrhythmias) and CNS excitation.</span></div>
    <div class="rvc" data-rv><small>Toxicity is increased by</small><span>Erythromycin, cimetidine and fluoroquinolones. Many drug interactions.</span></div>
  </div>
  <h3><i>2.5</i>Phosphodiesterase-4 inhibitors: roflumilast</h3>
  <ul>
    <li>Selectively inhibits PDE4 → accumulation of cyclic AMP within inflammatory and structural cells important in the pathogenesis of <mark>COPD</mark>.</li>
    <li><b>Use:</b> treatment of COPD. <b>Side effects:</b> headache, diarrhea, weight loss.</li>
  </ul>
</section>

<section class="page" data-t="Anti-inflammatory drugs" data-g="compare" data-p="Part 03 · Anti-inflammatory and preventive drugs">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Anti-inflammatory and preventive drugs</b><span>Corticosteroids · cromolyn · leukotriene inhibitors · omalizumab</span></div></div>
  <h3><i>3.1</i>Corticosteroids</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare the two routes</span><em></em></div>
    <div class="chips"><button class="chip" data-v="i">Inhaled</button><button class="chip" data-v="o">Oral and IV</button></div>
    <div class="msg" data-for="i"><b>Drugs:</b> beclomethasone, budesonide, fluticasone, mometasone (also flunisolide).<br><b>Use:</b> <b>first-line asthma controller medications</b>; used by inhalation for both acute attacks and prophylaxis.<br><b>Toxicity:</b> minimal systemic absorption, so minimal toxicity. May cause <b>oropharyngeal candidiasis</b>, prevented with spacers and gargling.<br>Low dosage may also prevent the desensitization of β receptors that can occur with overuse of β₂ agonists.</div>
    <div class="msg" data-for="o"><b>Drugs:</b> prednisone, dexamethasone.<br><b>Use:</b> asthma exacerbations unresponsive to other measures; generally reserved for severe acute attacks.<br><b>Side effects:</b> osteoporosis, immunosuppression, hypertension, Cushing syndrome, hyperglycemia, cataracts, glaucoma, fluid retention, avascular necrosis of the femoral head, depression, mania, adrenal insufficiency on cessation.</div>
  </div>
  <h3><i>3.2</i>Cromolyn</h3>
  <ul>
    <li>Mast cell stabilizer (blocks histamine release) and anti-inflammatory agent. <b>Prophylactic:</b> decreases symptoms and BHR, especially responses to allergens.</li>
    <li><b>Uses:</b> asthma controller medication; allergic rhinitis.</li>
    <li>Minimal systemic toxicity, but may cause <mark>throat irritation and cough</mark>, relieved by a β₂ agonist.</li>
  </ul>
</section>

<section class="page" data-t="Leukotriene inhibitors · omalizumab" data-g="reveal cards" data-p="Part 03 · Anti-inflammatory and preventive drugs">
  <h3><i>3.3</i>Leukotriene inhibitors</h3>
  <p>Leukotrienes are mediators synthesized by leukocytes that promote <mark>bronchoconstriction and neutrophil chemotaxis</mark>.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Montelukast, zafirlukast: uses</small><span>Asthma controller medication; especially useful in <b>triad asthma</b> (asthma induced by aspirin, NSAID use). Used prophylactically for many forms of asthma, including antigen, exercise or drug-induced. Montelukast is also indicated for acute prevention of exercise-induced bronchoconstriction and for allergic rhinitis.</span></div>
    <div class="rvc" data-rv><small>Montelukast, zafirlukast: side effects</small><span>Minimal toxicity. Headache can be a side effect.</span></div>
    <div class="rvc" data-rv><small>Zileuton</small><span>Selectively inhibits 5-lipoxygenase → decreases formation of all leukotrienes. Asthma controller medication, adjunctive to steroids, with a more rapid onset (1–3 hours). Minimal toxicity.</span></div>
  </div>
  <h3><i>3.4</i>Omalizumab</h3>
  <ul>
    <li>An <mark>anti-IgE monoclonal antibody</mark>.</li>
    <li><b>Use:</b> asthma that is poorly controlled with steroids or beta agonists. Minimal toxicity.</li>
  </ul>
  <div class="note"><b>COPD</b> (emphysema, chronic bronchitis): multiple bronchodilators are used, including β₂ agonists and M blockers, and the PDE4 inhibitor roflumilast.</div>
</section>

  <h3><i>1.1</i>Who it is</h3>
  <p>One of the parasitic <mark>trematodes</mark>. It causes <b>paragonimiasis</b>: a parasitic lung infection and a <mark>foodborne disease</mark>.</p>
  <div class="ix" data-ix="recall">

      <tr><td class="k">Definitive host</td><td>Human</td></tr>
      <tr><td class="k">Reservoir hosts</td><td>Dogs, cats, pigs, wolf and fox</td></tr>

<section class="page" data-t="Acute and chronic disease" data-g="compare" data-p="Part 01 · The oriental lung fluke">
  <h3><i>1.3</i>Two phases: what the fluke does and what the patient feels</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · pick a phase</span><em></em></div>
    <div class="chips"><button class="chip" data-v="a">Acute · 2 months</button><button class="chip" data-v="c">Chronic · 3 to 4 months</button></div>
    <div class="msg" data-for="a"><b>Pathogenesis.</b> Occurs during <b>migration of the immature flukes</b> in the lung, with high eosinophilia. Pulmonary migration may cause acute pneumonitis with haemorrhage, eosinophilic infiltration and pleural effusion.<br><b>Clinical picture.</b> Begins 2 months after ingestion of metacercaria: abdominal pain, diarrhea, nausea and vomiting, urticaria. A few days later: fever, pleuritic chest pain that increases with respiration, dyspnea, cough.</div>
    <div class="msg" data-for="c"><b>Pathogenesis.</b> The parasites are inside <b>cysts in the lung</b>. The inflammatory response around juvenile flukes, adults and eggs starts as granulomatous, followed by formation of thick fibrous cyst walls. Infection can persist for several years.<br><b>Clinical picture.</b> Begins 3 to 4 months after infection: low grade fever, night sweats, <b>haemoptysis</b>, dyspnea, chest pain.</div>
  </div>
  <h3><i>1.4</i>Inside the chronic cyst</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>What does the capsule look like?</small><span>The adult lives within <b>fibrotic greyish white capsules</b>, surrounded by thick, blood-streaked, necrotic, reddish brown exudate.</span></div>
    <div class="rvc" data-rv><small>What does the exudate contain?</small><span>Numerous <b>eggs</b> and <b>Charcot–Leyden crystals</b>.</span></div>
    <div class="rvc" data-rv><small>What happens to the eggs?</small><span>They are either trapped in the tissues, where they provoke granulomas, or expelled in the sputum during cough, and in stool if swallowed.</span></div>
  </div>
</section>

<section class="page" data-t="Diagnosis" data-g="tap the egg" data-p="Part 01 · The oriental lung fluke">
  <h3><i>1.5</i>Diagnosis</h3>
  <p><b>Clinical:</b> geographical distribution and a history of eating crabs or crayfish. <b>Laboratory, direct:</b> microscopic detection of <mark>eggs in sputum or stool</mark>.</p>

<section class="page" data-t="House dust mites" data-g="tap the room" data-p="Part 02 · House dust mites">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>House dust mites</b><span>Where they live · what they cause · diagnosis · control</span></div></div>
  <h3><i>2.1</i>Meet the mite</h3>
  <ul>
    <li>Very small mites (<mark>0.3 mm</mark>), <b>worldwide</b>. <mark>Dermatophagoides</mark> is the commonest dust mite.</li>
    <li>Their main food is <b>human skin scales</b> and other organic debris.</li>
    <li><b>Life cycle:</b> incomplete metamorphosis. Eggs hatch giving larvae that moult into nymphs, then adults.</li>
  </ul>
  <h3><i>2.2</i>Mite-proof the bedroom</h3>
  <div class="ix" data-ix="hl" data-start="bed">
    <div class="cap"><span>Live · tap a part of the room</span><em>orange = selected</em></div>
    <svg class="map" viewBox="0 0 360 160">
      <rect x="0" y="0" width="360" height="118" fill="#f4efe4"/><rect x="0" y="118" width="360" height="42" fill="#e2d6c2"/>
      <g class="zn" data-on="air"><rect x="24" y="14" width="74" height="60" rx="3"/></g><path d="M61 14v60M24 44h74" stroke="#c9b49a" stroke-width="2" style="pointer-events:none"/><text class="lbl" x="61" y="88" text-anchor="middle">window</text>
      <g class="zn" data-on="bed"><rect x="126" y="70" width="132" height="44" rx="6"/><rect x="118" y="44" width="16" height="74" rx="4"/><rect x="140" y="58" width="42" height="18" rx="8"/></g><text class="lbl" x="200" y="97" text-anchor="middle" style="pointer-events:none">bed, sheets, blankets</text>
      <g class="zn" data-on="carpet"><path d="M96 128h196l22 26H74z"/></g><text class="lbl" x="194" y="146" text-anchor="middle" style="pointer-events:none">carpet and furniture</text>
      <g class="zn" data-on="spray"><rect x="302" y="62" width="26" height="52" rx="5"/><rect x="309" y="50" width="12" height="12" rx="2"/></g><text class="lbl" x="315" y="40" text-anchor="middle">spray</text>
    </svg>

function fit(cv){
  const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1), W = Math.round(r.width * d), H = Math.round(r.height * d);

  const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, W, H); ctx.lineJoin = ctx.lineCap = 'round';
  return {ctx, W, H, u: W / 360, f: (s, w = 600) => `${w} ${s * W / 360}px Poppins, sans-serif`};
}

/* O2 dissociation curve */

/* oxygen dissociation curves side by side: how much O2 is unloaded between lungs (100) and tissues (40) */

/* acid-base: CO2 is set by the lungs, HCO3 by the kidneys; pH follows Henderson-Hasselbalch */

  $$('[data-v]', root).forEach(b => b.onclick = () => { [tc, th] = PRE[b.dataset.v]; });
  out('comp').onclick = () => { const c = vc, h = vh, p = pH(c, h); if (p > 7.35 && p < 7.45) return;
    const goal = p < 7.4 ? 7.36 : 7.44, resp = c > 45 || c < 35, r = Math.pow(10, goal - 6.1);

    const c0 = vc, h0 = vh, p = pH(c0, h0);
    const c = fit(cv); if (!c) return; const {ctx, W, H, u, f} = c, x0 = 14 * u, x1 = W - 14 * u, y = H * .5, hb = 15 * u, X = v => x0 + (Math.max(6.7, Math.min(8.1, v)) - 6.7) / 1.4 * (x1 - x0);
    const band = (a, b, col) => { ctx.fillStyle = col; ctx.fillRect(X(a), y - hb / 2, X(b) - X(a), hb); };
    band(6.7, 6.8, '#3b3b46'); band(6.8, 7.35, '#f2a09a'); band(7.35, 7.45, '#9bd8b7'); band(7.45, 8, '#a9cdf5'); band(8, 8.1, '#3b3b46');
    ctx.font = f(7, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#7a1f1f'; ctx.fillText('ACIDOSIS', X(7.08), y); ctx.fillStyle = '#11694a'; ctx.fillText('NORMAL', X(7.4), y - hb / 2 - 7 * u); ctx.fillStyle = '#1f4f8a'; ctx.fillText('ALKALOSIS', X(7.72), y);
    ctx.fillStyle = '#5b6375'; ctx.font = f(6.6); for (const v of [6.8, 7.35, 7.45, 8]) ctx.fillText(v, X(v), y + hb / 2 + 7 * u); ctx.fillText('death', X(6.75), y - hb / 2 - 7 * u); ctx.fillText('death', X(8.05), y - hb / 2 - 7 * u);
    const nx = X(p); ctx.fillStyle = '#0b1f45'; ctx.beginPath(); ctx.moveTo(nx, y - hb / 2 + 2 * u); ctx.lineTo(nx - 6 * u, y - hb / 2 - 9 * u); ctx.lineTo(nx + 6 * u, y - hb / 2 - 9 * u); ctx.closePath(); ctx.fill(); ctx.fillRect(nx - u, y - hb / 2, 2 * u, hb);
    const ch = c0 > 45, cl = c0 < 35, hh = h0 > 26, hl = h0 < 22; let d, m;
    if (p < 7.35){

      else if (ch){ d = 'Respiratory acidosis'; m = '<b>Hypoventilation:</b> alveolar ventilation is not adequate to allow CO₂ removal, and CO₂ rises. Causes: respiratory depression, narcotics overdose, CNS depression, COPD, pneumothorax, atelectasis.' + (hh ? ' <b>Compensating:</b> the kidney retains an increased amount of HCO₃⁻ to raise the pH.' : ' Press Compensate to see the kidney respond.'); }

/* alveoli under the microscope: one pattern per chip */
IX.micro = root => {

  bs.forEach(b => b.onclick = () => go(b.dataset.v)); go(k);

  const M = {
    normal: ['#e07a8a', 1.6, null, 0, 0, 0, 0, 0, 0, 0, 0], cong: ['#d23b4a', 4, ['#f6c9cf', .5], 2, 0, 0, 0, 0, 0, 0, 0],
    red: ['#d23b4a', 3.4, ['#f3b6b6', .8], 16, 9, 1, 0, 0, 0, 0, 0], grey: ['#b9a7a0', 2.2, ['#d9d2cb', .85], 1, 14, 1, 0, 0, 0, 0, 0], reso: ['#e07a8a', 1.8, ['#efe7e2', .35], 0, 2, 0, 3, 0, 0, 0, 0],
    supp: ['#d23b4a', 2.6, ['#e9e2a8', .75], 2, 22, 0, 0, 0, 0, 0, 0], viral: ['#c98aa8', 6, null, 0, 0, 0, 0, 0, 0, 14, 0],
    dad1: ['#c96b7c', 2.4, ['#f7dfe3', .7], 5, 4, 0, 0, 1, 0, 0, 0], dad2: ['#c98aa8', 4.2, ['#f7dfe3', .2], 0, 1, 0, 0, 0, 6, 0, 5], dad3: ['#7d8fb3', 8, null, 0, 0, 0, 0, 0, 2, 0, 2],
    edema: ['#d23b4a', 3.6, ['#f6cfd8', .85], 0, 0, 0, 1, 0, 0, 0, 0], emph: ['#e07a8a', 1.3, null, 0, 0, 0, 0, 0, 0, 0, 0], honey: ['#7d8fb3', 7, null, 0, 0, 0, 0, 0, 7, 0, 0]

      if (m[5]){ ctx.globalAlpha = .6 * fade; ctx.strokeStyle = '#e58aa0'; ctx.lineWidth = .9 * u; for (let i = 0; i < 7; i++){ ctx.beginPath(); ctx.moveTo(x + (rnd(id + i) - .5) * r * 1.5, y + (rnd(id + i + 9) - .5) * r * 1.5); ctx.lineTo(x + (rnd(id + i + 4) - .5) * r * 1.5, y + (rnd(id + i + 13) - .5) * r * 1.5); ctx.stroke(); } ctx.globalAlpha = 1; }   // fibrin mesh
      const put = (n, salt, draw) => { const skip = k === 'supp' && rnd(id) > .6; for (let i = 0; i < (skip ? 0 : n); i++){ const a = rnd(id * 13 + i + salt) * 6.28, d = Math.sqrt(rnd(id * 5 + i + salt + 1)) * r * .68; ctx.globalAlpha = fade; draw(x + Math.cos(a) * d + Math.sin(clock + i) * .4 * u, y + Math.sin(a) * d); ctx.globalAlpha = 1; } };
      put(m[3], 0, (px, py) => { ctx.fillStyle = '#d23b4a'; ctx.beginPath(); ctx.arc(px, py, 2.2 * u, 0, 7); ctx.fill(); });
      put(m[4], 50, (px, py) => { ctx.fillStyle = '#e9dff5'; ctx.beginPath(); ctx.arc(px, py, 2.9 * u, 0, 7); ctx.fill(); ctx.fillStyle = '#5b3d9a'; for (const o of [-1, 0, 1]){ ctx.beginPath(); ctx.arc(px + o * 1.3 * u, py + (o ? .5 : -.7) * u, 1.05 * u, 0, 7); ctx.fill(); } });

  };
};

/* protease against anti-protease: tilt the balance and the alveolar walls go */
IX.seesaw = root => {
  const cv = $('canvas', root), msg = $('[data-k=msg]', root), T = JSON.parse($('script', root).textContent), bs = $$('[data-v]', root);
  const G = {n: [3, 3], smoke: [6, 1.5], a1: [3, .4]}; let k = 'n', el = 3, at = 3, ang = 0, dmg = 0;
  const go = v => { k = v; if (v === 'n') dmg = 0; bs.forEach(b => b.classList.toggle('on', b.dataset.v === k)); msg.innerHTML = T[k]; };
  bs.forEach(b => b.onclick = () => go(b.dataset.v)); go('n');
  return dt => {
    el += (G[k][0] - el) * Math.min(1, dt * 2); at += (G[k][1] - at) * Math.min(1, dt * 2);
    const target = Math.max(-.32, Math.min(.32, (at - el) * .09)); ang += (target - ang) * Math.min(1, dt * 3); dmg = Math.min(1, dmg + Math.max(0, -ang - .03) * dt * .9);
    const c = fit(cv); if (!c) return; const {ctx, W, H, u, f} = c, cx = W / 2, cy = H * .36, L = W * .3;
    ctx.fillStyle = '#5b6375'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx - 12 * u, cy + 26 * u); ctx.lineTo(cx + 12 * u, cy + 26 * u); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.fillStyle = '#0b1f45'; ctx.fillRect(-L, -2.5 * u, 2 * L, 5 * u);
    const pan = (x, n, col, lab) => { ctx.save(); ctx.translate(x, 0); ctx.rotate(-ang); const cnt = Math.max(0, Math.round(n * 2)); for (let i = 0; i < cnt; i++){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc((i % 4 - 1.5) * 9 * u, -8 * u - Math.floor(i / 4) * 9 * u, 4.2 * u, 0, 7); ctx.fill(); } ctx.font = f(7.2, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = col; ctx.fillText(lab, 0, 7 * u); ctx.restore(); };
    pan(-L * .8, el, '#d64545', 'Elastase (protease)'); pan(L * .8, at, '#1e9e62', 'α1-antitrypsin (anti-protease)'); ctx.restore();
    const y0 = H * .68, n = 12, w = (W - 24 * u) / n, hh = H * .24;

      if (i && !gone){ ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + hh); ctx.stroke(); } else if (i){ ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 + hh * .2); ctx.moveTo(x, y0 + hh); ctx.lineTo(x, y0 + hh * .82); ctx.stroke(); } }
    ctx.strokeStyle = '#e07a8a'; ctx.beginPath(); ctx.moveTo(12 * u, y0); ctx.lineTo(12 * u, y0 + hh); ctx.moveTo(W - 12 * u, y0); ctx.lineTo(W - 12 * u, y0 + hh); ctx.stroke();
    ctx.font = f(6.8, 600); ctx.fillStyle = '#8c92a2'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(dmg > .15 ? 'alveolar septa destroyed: enlarged air spaces, loss of elastic recoil' : 'alveolar septa intact', W / 2, y0 - 4 * u);

/* ---------- 3D x-ray chest (three.js, all geometry generated in code) ---------- */
IX.chest = root => {

  const seg = (k, fn) => $$(`[data-k=${k}] button`, page).forEach(b => b.onclick = () => { $$(`[data-k=${k}] button`, page).forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); });
  seg('mode', v => { forced = v === 'forced'; });
  seg('ctl', v => { ctl = v; if (v !== 'auto' && ph !== v){ ph = v; p = 0; } });
  const chips = {}; $$('[data-g]', page).forEach(c => chips[c.dataset.g] = c);
  const glow = {dia: 0, ext: 0, acc: 0, int: 0, abd: 0};
  let gl = null;
  const T3 = window.THREE;
  if (T3){ try { gl = build3D(T3); } catch (e){ console.warn('3D unavailable', e); gl = null; } }

  function logic(dt){

    const kind = ph === 'pause' ? 'rest' : ph === 'in' || forced ? 'active' : 'passive';

    const m = ph === 'pause' ? '<b>Rest.</b> A short pause after expiration, about 0.7 s.'

      : ph === 'in' ? '<b>Accessory muscles join in</b>: sternocleidomastoid, scaleni, pectoralis minor, serratus anterior and latissimus dorsi increase the thoracic volume further. Pressure falls to about −20 mmHg.'
      : '<b>Now expiration is active.</b> Abdominal muscles raise intra-abdominal pressure and push the diaphragm up; internal intercostals pull the ribs downward and inward. Pressure rises to about +30 mmHg.';
    if (msg.innerHTML !== m && msg.dataset.m !== ph + forced){ msg.innerHTML = m; msg.dataset.m = ph + forced; }

  function build3D(THREE){
    const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, alpha: false, powerPreference: 'default'});
