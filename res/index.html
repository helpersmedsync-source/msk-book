    <div class="msg" data-for="ant"><b>Anterior mediastinum.</b> The small interval between the sternum and the anterior surface of the pericardium. It contains <b>fat and areolar tissue</b> and the <b>inferior part of the thymus gland</b>. A thymoma can develop in the anterior or superior mediastinum.</div>
    <div class="msg" data-for="mid"><b>Middle mediastinum.</b> Located between the anterior and posterior mediastinum; it contains the <b>heart and great vessels</b>.</div>
    <div class="msg" data-for="post"><b>Posterior mediastinum.</b> <b>Anteriorly:</b> behind the posterior surface of the pericardium. <b>Posteriorly:</b> in front of the thoracic vertebrae T5 to T12. <b>Inferiorly:</b> closed off by the diaphragm.</div>

  <h3><i>2.1</i>Count them: 4 · 4 · 3 · 2 · 1 · 1</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>

  <div class="note">The <b>pulmonary trunk and arteries</b> are located completely in the <b>middle</b> mediastinum and are <b>not</b> found in the superior mediastinum.</div>
  <h3><i>2.2</i>Clinical correlate: the recurrent laryngeal nerve</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · left or right?</span><em></em></div>

    <div class="msg" data-for="l">The <b>left</b> recurrent laryngeal nerve curves under the <b>aortic arch distal to the ligamentum arteriosum</b>, where it may be damaged by pathology such as malignancy or an aneurysm of the aortic arch, resulting in <b>paralysis of the left vocal folds</b>.</div>
    <div class="msg" data-for="r">The <b>right</b> laryngeal nerve is <b>not affected</b> by aortic arch pathology, because it arises from the right vagus nerve in the root of the neck and passes under the <b>subclavian artery</b>.</div>

  <ul>

<section class="page" data-t="Epithelia · the nasal cavity" data-g="pick a region" data-p="Part 01 · Plan of the system">
  <h3><i>1.4</i>Epithelia of the respiratory tract</h3>
  <p>The lining <mark>varies along the tract</mark>.</p>
  <ul>
    <li><b>Respiratory epithelium</b> lines the nasal cavity and nasopharynx, and the superior portion of the lower tract (trachea and bronchi).</li>
    <li><b>Simple squamous epithelium</b> forms the gas exchange surfaces (alveolar ducts, sacs and alveoli). The distance between air and blood in the capillaries is <mark>less than 1 µm</mark>.</li>
  </ul>
  <h3><i>1.5</i>The nasal cavity: three linings</h3>
  <div class="ix" data-ix="hl" data-start="ves">

    <div class="msg" data-for="ves"><b>Vestibule (anterior part).</b> Lined with <b>skin</b>. Thick short hairs help trap small particles from the incoming air (filtering).</div>
    <div class="msg" data-for="res"><b>Respiratory part (posterior).</b> Lined with <b>respiratory epithelium</b>. It has three lateral bony shelves: the superior, middle and inferior nasal conchae, which swirl the incoming air. Many venous plexuses in the lamina propria warm and humidify the air.</div>
    <div class="msg" data-for="olf"><b>Olfactory part (superior).</b> Lined by <b>olfactory epithelium</b>, in the roof of the nasal cavity and on the superior nasal conchae. Odor perception.</div>

<section class="page" data-t="Olfactory epithelium" data-g="reveal cards" data-p="Part 02 · Nose, sinuses and pharynx">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Nose, sinuses and pharynx</b><span>Olfactory epithelium · paranasal sinuses · nasopharynx</span></div></div>
  <h3><i>2.1</i>Olfactory epithelium</h3>
  <p>A <mark>modified pseudostratified columnar ciliated epithelium</mark> made of three cells, with Bowman glands beneath it.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>1 · Olfactory cells</small><span>Bipolar nerve cells. Contain olfactory vesicles with several <b>olfactory cilia (long, non-motile)</b>. They act as receptors for odor.</span></div>
    <div class="rvc" data-rv><small>2 · Supporting cells</small><span>Apically located nuclei. Have many microvilli.</span></div>
    <div class="rvc" data-rv><small>3 · Basal stem cells</small><span>Regenerative cells.</span></div>
    <div class="rvc" data-rv><small>Bowman glands</small><span><b>Serous</b> glands. Their watery secretion dissolves odorous substances so the olfactory cilia can detect them, and flushes the surface for a new odor stimulus.</span></div>
  </div>
  <h3><i>2.2</i>Olfactory against respiratory epithelium</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Olfactory</th><th>Respiratory</th></tr>
      <tr><td class="k">Where</td><td>Roof of the nasal cavity, superior conchae</td><td>Nasal cavity, nasopharynx, trachea and bronchi</td></tr>
      <tr><td class="k">Cells</td><td>Olfactory, supporting, basal stem cells</td><td>Ciliated, goblet, basal, brush, neuroendocrine cells</td></tr>
      <tr><td class="k">Cilia</td><td>Long and non-motile: odor receptors</td><td>Motile: beat towards the pharynx</td></tr>
      <tr><td class="k">Secretion</td><td>Watery, from serous Bowman glands</td><td>Mucus, from goblet cells and seromucous glands</td></tr>
    </table>

  </div>
</section>

<section class="page" data-t="Sinuses · pharynx · larynx" data-g="compare" data-p="Part 02 · Nose, sinuses and pharynx">
  <h3><i>2.3</i>Paranasal sinuses</h3>
  <ul>
    <li>Air-filled, hollowed-out portions of bones: <mark>frontal sinus, ethmoidal air cells, maxillary sinus, sphenoidal sinus</mark>.</li>
    <li>Lined with thin respiratory epithelium. Their mucus moistens and cleans the nasal cavity surfaces.</li>
  </ul>
  <h3><i>2.4</i>Nasopharynx</h3>
  <ul>
    <li>The pharynx is shared by the respiratory and digestive systems. The nasopharynx is the posterior continuation of the nasal cavities and has the openings of the right and left auditory (Eustachian) tubes.</li>
    <li>Lined with respiratory epithelium; the lamina propria contains serous and mucous glands and lymphoid tissue (the <mark>pharyngeal tonsils</mark>).</li>
  </ul>
  <div class="note"><b>Clinical correlation.</b> <b>Adenoid:</b> inflamed pharyngeal tonsils. <b>Sinusitis:</b> obstruction of sinus drainage into the nasal cavity, with inflammation and pain over the affected area; the most common cause is viral upper respiratory infection.</div>
  <h3><i>2.5</i>Larynx and epiglottis</h3>
  <ul>
    <li>A cartilaginous tube connecting the pharynx with the trachea: three <b>hyaline</b> cartilages (such as the thyroid) and <b>elastic</b> cartilage (such as the epiglottis).</li>
    <li>It protects the glottis and makes the voice ("voice box"). The epiglottis closes the air passage during swallowing.</li>
  </ul>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · which epithelium covers it?</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="a">Epiglottis · lingual surface</button><button class="chip sm" data-v="b">Epiglottis · base of laryngeal surface</button><button class="chip sm" data-v="c">Vocal folds</button><button class="chip sm" data-v="d">Rest of the larynx</button></div>
    <div class="msg" data-for="a">The epiglottis is a flap-like upward extension of the anterior wall of the larynx into the pharynx. Its lingual surface and the upper part of its laryngeal surface are covered by <b>stratified squamous non-keratinized epithelium</b>.</div>
    <div class="msg" data-for="b">The basal part of the laryngeal surface is covered by <b>respiratory epithelium</b>.</div>
    <div class="msg" data-for="c">The vocal folds (vocal cords) contain the <b>vocal ligaments</b> (elastic fibers) and the <b>vocalis muscle</b> (skeletal muscle). Their vibrations produce sound waves. Covered with <b>stratified squamous non-keratinized epithelium</b>.</div>
    <div class="msg" data-for="d"><b>Respiratory epithelium.</b></div>
  </div>
</section>

<section class="page" data-t="The trachea · wall in four layers" data-g="tap a layer" data-p="Part 03 · Trachea and its epithelium">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Trachea and its epithelium</b><span>Four layers · five cells · the mucociliary escalator</span></div></div>
  <h3><i>3.1</i>The trachea (windpipe)</h3>
  <p>Extends from the larynx to its bifurcation at the <mark>carina</mark>, where the primary bronchi begin. Its C-shaped cartilages prevent collapse and overexpansion.</p>
  <div class="ix" data-ix="hl" data-start="m1">
    <div class="cap"><span>Live · tap a layer of the wall</span><em>cross-section, schematic</em></div>
    <svg class="map" viewBox="0 -18 360 206">
      <ellipse cx="120" cy="-4" rx="34" ry="10" fill="#fbe3e6" stroke="#d9a2ad" stroke-width="1.2"/><text class="lbl s" x="120" y="-1" text-anchor="middle">esophagus</text>
      <path class="zn" data-on="m4" fill-rule="evenodd" d="M30 95a90 90 0 1 0 180 0a90 90 0 1 0-180 0zM38 95a82 82 0 1 0 164 0a82 82 0 1 0-164 0z"/>

      <text class="lbl" x="230" y="33">1 · Mucosa</text><text class="lbl" x="230" y="67">2 · Submucosa</text><text class="lbl s" x="230" y="78">purple = seromucous glands</text>
      <text class="lbl" x="230" y="107">3 · Hyaline cartilage ring</text><text class="lbl" x="230" y="147">4 · Adventitia</text><text class="lbl" x="230" y="-3">Trachealis muscle</text>

    <div class="msg" data-for="m1"><b>Mucosa.</b> (a) Respiratory epithelium: pseudostratified ciliated columnar. (b) Lamina propria: loose vascular connective tissue. (c) Muscularis mucosa.</div>
    <div class="msg" data-for="m2"><b>Submucosa.</b> Connective tissue with blood vessels, lymphatic nodules and nerves. It also contains the tracheal (<b>seromucous</b>) glands.</div>
    <div class="msg" data-for="m3"><b>Incomplete muscularis (fibrocartilaginous layer).</b> 16–20 C-shaped <b>hyaline cartilage</b> rings keep the trachea open. Their free ends are directed posteriorly and replaced by the <b>trachealis muscle</b>, which eases the passage of food in the esophagus.</div>
    <div class="msg" data-for="m4"><b>Adventitia.</b> Dense fibroelastic connective tissue.</div>
  </div>
</section>

<section class="page" data-t="The living epithelium" data-g="live figure" data-p="Part 03 · Trachea and its epithelium">
  <h3><i>3.2</i>Respiratory epithelium: watch it work</h3>
  <p>Pseudostratified columnar epithelium of <mark>five cell types</mark>. Tap a cell in the drawing, or a name below.</p>
  <div class="ix" data-ix="epi">
    <div class="cap"><span>Live · the mucociliary escalator</span><em>schematic</em></div>
    <canvas class="plot" style="aspect-ratio:1/.6;background:#f4f9ff;cursor:pointer"></canvas>
    <div class="chips"><button class="chip sm" data-g="cell" data-v="c">Ciliated columnar</button><button class="chip sm" data-g="cell" data-v="g">Goblet</button><button class="chip sm" data-g="cell" data-v="b">Basal</button><button class="chip sm" data-g="cell" data-v="r">Brush</button><button class="chip sm" data-g="cell" data-v="k">Neuroendocrine (K)</button></div>
    <div class="msg" data-k="msg"></div>
    <script type="application/json">{
"normal":"<b>The mucociliary escalator.</b> Goblet cells secrete mucus that traps dust, bacteria and viruses. The beating cilia move this sticky layer toward the pharynx, where it is swallowed.",
"c":"<b>Ciliated columnar cells (30%).</b> Each has 200–300 cilia that beat towards the pharynx to move mucus out. The apical part contains many mitochondria: ATP for ciliary beating.",
"g":"<b>Goblet cells (30%).</b> A flask-shaped apex filled with mucin granules; the narrow basal part holds the nucleus, RER, Golgi complex and mitochondria. Their mucus traps dust, bacteria and viruses and absorbs noxious gases such as ozone and sulfur dioxide.",
"b":"<b>Short basal cells (30%).</b> They sit on the basal lamina but are short and do not reach the surface. They are stem cells: they divide and replace ciliated and goblet cells.",
"r":"<b>Brush cells (3%).</b> Slender columnar cells with microvilli. They may be depleted goblet cells, or sensory receptor cells, as there are many nerve endings on their basal surface.",
"k":"<b>Pulmonary neuroendocrine cells (3%).</b> Also called APUD cells, DNES cells, Kulchitsky or K cells. Similar to the endocrine cells of the gut: basal secretory granules release hormones into the lamina propria that affect nearby cells. <b>Bronchial tumors arise from Kulchitsky cells.</b>"
}</script>
  </div>
  <div class="note"><b>Why "pseudostratified"?</b> Every cell sits on the same basal lamina, but only some reach the surface.</div>
</section>

<section class="page" data-t="When the escalator fails" data-g="live figure" data-p="Part 01 · Trachea and mucus clearance">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Trachea and mucus clearance</b><span>The wall · the epithelium · what goes wrong</span></div></div>
  <h3><i>1.1</i>The trachea</h3>
  <p>A hollow tube about <mark>10 cm long and 2 cm in diameter</mark>, from the larynx to its bifurcation at the carina. The primary (extrapulmonary) bronchi have the <b>same structure</b> as the trachea. Four layers: mucosa, submucosa, incomplete muscularis (fibrocartilaginous coat), adventitia.</p>
  <h3><i>1.2</i>Break the escalator, then read why</h3>
  <div class="ix" data-ix="epi">
    <div class="cap"><span>Live · tracheal epithelium in health and disease</span><em>schematic</em></div>
    <canvas class="plot" style="aspect-ratio:1/.6;background:#f4f9ff"></canvas>
    <div class="chips"><button class="chip sm" data-g="st" data-v="normal">Normal</button><button class="chip sm" data-g="st" data-v="cf">Cystic fibrosis</button><button class="chip sm" data-g="st" data-v="kart">Kartagener syndrome</button><button class="chip sm" data-g="st" data-v="irr">Irritation</button><button class="chip sm" data-g="st" data-v="meta">Years of irritation</button></div>
    <div class="msg" data-k="msg"></div>
    <script type="application/json">{
"normal":"<b>Normal.</b> Goblet cells secrete a polysaccharide mucus, supplemented by the submucosal mixed glands. It traps particles and the beating cilia move the sticky layer toward the pharynx, where it is swallowed: the <b>mucociliary escalator system</b>.",
"cf":"<b>Cystic fibrosis.</b> The secreted mucus is thick or viscous and the cilia cannot move it toward the pharynx. Patients have frequent infections of the respiratory system: failure of the mucociliary escalator.",
"kart":"<b>Kartagener syndrome.</b> Patients lacking <b>dynein</b> have immotile cilia. Their cilia cannot move the mucus layer with its trapped bacteria, so they have many respiratory problems. Males also possess immotile sperm.",
"irr":"<b>Irritation</b> (cigarettes, car exhaust, industrial fumes, repeated viral and bacterial infection). The ciliated cells become taller, and the number of goblet cells and submucosal glands increases.",
"meta":"<b>Metaplasia.</b> After years of irritation the epithelium may be replaced by <b>stratified squamous epithelium</b>, which is more resistant to damage. This process is reversible. Many lung cancers are derived from stratified squamous epithelium that developed from metaplasia."
}</script>
  </div>
  <div class="note"><b>Remember the cilium.</b> 9 peripheral doublet microtubules of tubulin; the arms are the motor protein dynein, which causes the cilia to bend. If mucosal clearance is ineffective, infection or <b>pneumoconiosis</b> (dust-related disease) may follow.</div>
</section>

<section class="page" data-t="Bronchioles · Clara cells" data-g="reveal cards" data-p="Part 02 · Down the bronchial tree">
  <h3><i>2.3</i>Bronchioles</h3>
  <ul>
    <li>Three types: <b>primary (preterminal)</b>, <b>terminal</b> and <b>respiratory</b> bronchioles.</li>
    <li><b>Mucosa:</b> simple columnar ciliated epithelium that becomes cuboidal in smaller bronchioles, with an additional cell, the <mark>Clara cell</mark>; lamina propria of thin elastic connective tissue.</li>
    <li><b>Muscle layer:</b> spirally arranged smooth muscle. <b>Outer layer:</b> fibroelastic connective tissue.</li>
  </ul>
  <h3><i>2.4</i>Clara cells (bronchiolar secretory cells)</h3>
  <p>Non-ciliated columnar cells with a rounded apex that projects above the other cells. The cytoplasm contains Golgi, RER, SER, mitochondria and secretory granules.</p>
  <div class="ix"><div class="cap"><span>Recall · four functions, tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>1 · Secretory</small><span>Produce <b>surfactant-like material</b> that reduces the surface tension of the bronchioles and prevents their collapse.</span></div>
    <div class="rvc" data-rv><small>2 · Stem cell</small><span>Can divide to regenerate both themselves and ciliated cells.</span></div>
    <div class="rvc" data-rv><small>3 · Detoxification</small><span>Inactivate harmful substances in the inspired air: detoxification of airborne toxins (oxidase activity).</span></div>
    <div class="rvc" data-rv><small>4 · Chloride transport</small><span>Involved in chloride ion transport into the lumens of the terminal bronchioles. <b>Cystic fibrosis</b> can result in abnormally thick mucus, in part due to defective chloride transport by Clara cells.</span></div>
  </div>
</section>

<section class="page" data-t="Pneumocytes · surfactant" data-g="sorting game" data-p="Part 03 · The alveolus">
  <h3><i>3.2</i>Type I or type II?</h3>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · tap the right cell</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>Which pneumocyte?</small><b data-k="card" style="font-size:1.15em"></b></div></div>
    <div class="chips" style="justify-content:center"><button class="chip" data-b="0">Type I</button><button class="chip" data-b="1">Type II</button></div>
    <div class="msg" data-k="fb"></div>

]</script>
  </div>
  <h3><i>3.3</i>Respiratory distress syndrome</h3>
  <p>Associated with premature infants; caused by a <mark>deficiency of surfactant</mark>.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>When does surfactant appear?</small><span>First detected at <b>28 weeks</b> of pregnancy, after which premature babies are capable of respiratory survival. Between 28 weeks and term (40 weeks) the amount may be inadequate, and artificial respiratory assistance may be needed.</span></div>
    <div class="rvc" data-rv><small>Why give the mother corticosteroids?</small><span>Corticosteroids induce the fetal synthesis of surfactant, so they are given to mothers who will electively deliver early.</span></div>
    <div class="rvc" data-rv><small>Why infants of diabetic mothers?</small><span>High insulin levels in diabetic mothers antagonize the effects of corticosteroids, so their infants have a higher incidence of respiratory distress syndrome.</span></div>
    <div class="rvc" data-rv><small>What happens to surfactant after secretion?</small><span>Most is recycled back to type II cells for reutilization; some undergoes phagocytosis by macrophages.</span></div>
  </div>
</section>

<section class="page" data-t="Septum · barrier · macrophages" data-g="tap in order" data-p="Part 03 · The alveolus">
  <h3><i>3.4</i>Interalveolar septum</h3>
  <ul>
    <li>The partition between two adjacent alveoli, interrupted by the pores of Kohn.</li>
    <li><b>Formed of:</b> alveolar epithelium on either side; a rich capillary network arising from the pulmonary artery; a network of elastic, reticular and collagenous fibers. Also cells such as mast cells, macrophages and fibroblasts.</li>
    <li><mark>Elastic fibers</mark> are responsible for the stretching and recoiling of the alveoli during respiration.</li>
  </ul>
  <h3><i>3.5</i>Blood–gas barrier: from air to blood</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each layer in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Pulmonary surfactant</li><li>Type I pneumocytes</li><li>Fused basal lamina of the type I cell and the capillary endothelium</li><li>Endothelium of the blood capillaries</li></ol>
  </div>
  <h3><i>3.6</i>Alveolar macrophages by name</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · same cell, two names</span><em></em></div>
    <div class="chips"><button class="chip" data-v="d">Dust cells</button><button class="chip" data-v="h">Heart failure cells</button></div>
    <div class="msg" data-for="d">Lung macrophages in the alveolar lumen that have phagocytosed <b>dust particles</b>.</div>
    <div class="msg" data-for="h">Lung macrophages in the alveolar lumen that have phagocytosed <b>extravasated blood</b> in cases of congestive heart failure.</div>
  </div>
  <h3><i>3.7</i>Pleura</h3>
  <p>The serous membrane covering the lung: a parietal and a visceral layer with a film of liquid in the cavity between them. Each layer is connective tissue covered by simple squamous epithelium (<mark>mesothelium</mark>).</p>
</section>

  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Oxygen and the cell</b><span>Cellular respiration · oxidative phosphorylation</span></div></div>
  <h3><i>1.1</i>The biochemical job of the respiratory system</h3>
  <ul>
    <li>The oxidative metabolism of cells is supported by <b>oxygen</b>; the waste product of metabolism, <b>carbon dioxide</b>, is removed from the body.</li>
    <li>The respiratory system moves gases between blood and air so that <mark>hypoxia</mark> (reduced oxygen in tissues) and <mark>acid–base disturbances</mark> (from altered CO₂) are minimized.</li>
  </ul>
  <h3><i>1.2</i>Cellular respiration</h3>

<section class="page" data-t="The oxygen dissociation curve" data-g="live curve" data-p="Part 02 · Hemoglobin and oxygen">

  <h3><i>2.1</i>Shift the curve and count the oxygen delivered</h3>
  <p>O₂ partial pressure on the horizontal axis, O₂ saturation on the vertical axis: an <mark>S-shaped</mark> relationship.</p>

"r":"<b>Right shift: decreased affinity for O₂.</b> Caused by ↑ PCO₂, ↑ H⁺ (↓ pH), ↑ 2,3-DPG and ↑ temperature. This is the <b>Bohr effect</b>, and it helps unload O₂ in the tissues: watch the bar grow.",

<section class="page" data-t="Bohr against Haldane" data-g="sorting game" data-p="Part 02 · Hemoglobin and oxygen">
  <h3><i>2.2</i>Two properties of hemoglobin</h3>
  <ul>
    <li><b>Bohr effect:</b> decreased affinity of hemoglobin for <mark>O₂</mark> with increased CO₂ or decreased pH. Helps unload O₂ in tissues.</li>
    <li><b>Haldane effect:</b> decreased affinity of hemoglobin for <mark>CO₂</mark> caused by O₂ binding to hemoglobin in the lungs. Facilitates unloading of CO₂ there; with less O₂ bound, more CO₂ loads onto hemoglobin in the tissues.</li>
  </ul>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · Bohr or Haldane?</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>Which effect?</small><b data-k="card" style="font-size:1.12em"></b></div></div>
    <div class="chips" style="justify-content:center"><button class="chip" data-b="0">Bohr effect</button><button class="chip" data-b="1">Haldane effect</button></div>
    <div class="msg" data-k="fb"></div>
    <script type="application/json">[
["Occurs in the tissues",0,"The Bohr effect occurs in tissues; the Haldane effect occurs in the lungs."],
["Describes the release of CO₂",1,"Haldane: release of CO₂. Bohr: release of O₂."],
["Effective under low blood pH",0,"Bohr is effective under low blood pH, Haldane under high blood pH."],
["Caused by the uptake of O₂ in the lungs",1,"Bohr is caused by the take-up of CO₂ from the tissues."],
["Shifts the O₂ dissociation curve to the right",0,"A shift to the right in response to an increase in PCO₂ or a decrease in pH."],
["Decreased CO₂ affinity of Hb as blood O₂ rises",1,"That is the definition of the Haldane effect."],
["Facilitates the release of O₂ at tissues",0,"Protons reduce the O₂ affinity of Hb."]

  </div>
  <h3><i>2.3</i>How protons do it</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Tissues are more acidic than the lungs: CO₂ + H₂O → H₂CO₃ → HCO₃⁻ + H⁺</li><li>Protons reduce the O₂ affinity of Hb, so O₂ is released into the tissues; the free Hb binds two protons</li><li>In the lungs the protons are released and react with HCO₃⁻ to form CO₂ gas (HCO₃⁻ + H⁺ → CO₂ + H₂O)</li><li>The proton-poor Hb now has greater affinity for O₂</li></ol>
  </div>
  <div class="note">The Bohr effect removes insoluble CO₂ from the blood stream and produces soluble bicarbonate.</div>
</section>

<section class="page" data-t="Anemia, polycythemia, CO" data-g="live curve" data-p="Part 02 · Hemoglobin and oxygen">
  <h3><i>2.4</i>Same PO₂, different amount of oxygen</h3>
  <div class="ix" data-ix="o2c" data-start="n">
    <div class="cap"><span>Live · pick a condition</span><em>schematic curves</em></div>
    <canvas class="plot" style="aspect-ratio:1/.6"></canvas>
    <div class="chips"><button class="chip sm" data-v="n">Normal</button><button class="chip sm" data-v="an">Anemia</button><button class="chip sm" data-v="po">Polycythemia</button><button class="chip sm" data-v="co">Carbon monoxide</button></div>
    <div class="msg" data-k="msg"></div>
    <script type="application/json">{
"n":"<b>Normal.</b> Oxygen is transported primarily by red blood cell hemoglobin, with small quantities dissolved in plasma.",
"an":"<b>Anemia</b> (low hemoglobin levels) alters the oxygen <b>concentration</b> (mL O₂ / 100 mL of blood), not the PO₂ of blood, and limits the oxygen capacity available to tissues.",
"po":"<b>Polycythemia</b> (high hemoglobin levels) raises the oxygen concentration. Again the PO₂ of blood is not changed.",
"co":"<b>Carbon monoxide poisoning.</b> CO binds to hemoglobin, preventing the binding and carrying of O₂, so tissues do not receive enough for cell survival. Treatment: <b>hyperbaric oxygen</b> (oxygen at high partial pressures, to load more oxygen into plasma and RBCs)."
}</script>
  </div>
  <h3><i>2.5</i>Hemoglobin against myoglobin</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare</span><em></em></div>
    <div class="chips"><button class="chip" data-v="h">Hemoglobin</button><button class="chip" data-v="m">Myoglobin</button><button class="chip" data-v="c">How is CO₂ carried?</button></div>
    <div class="msg" data-for="h">In erythrocytes; transports oxygen from lungs to tissues. A <b>heme</b> (iron-containing porphyrin ring) binds oxygen, and the heme oxygen affinity <b>increases as oxygen binds</b>: the globin switches between low-affinity and high-affinity forms.</div>
    <div class="msg" data-for="m">In heart and skeletal muscle; binds oxygen <b>more tightly</b> than hemoglobin and serves as a <b>storage site</b> for oxygen in tissues. Its affinity does not change with binding.</div>
    <div class="msg" data-for="c">Primarily in <b>bicarbonate (HCO₃⁻)</b> form, with small amounts on hemoglobin and dissolved in plasma.</div>
  </div>
</section>

<section class="page" data-t="2,3-BPG in the red cell" data-g="tap the map" data-p="Part 02 · Hemoglobin and oxygen">
  <h3><i>2.6</i>Four factors that affect O₂ binding</h3>
  <p>They reduce the ability of hemoglobin to bind O₂ so it can be easily delivered to the tissues: <mark>PO₂</mark>, <mark>pH</mark> of the environment, <mark>PCO₂</mark> and the availability of <mark>2,3-BPG</mark>.</p>
  <h3><i>2.7</i>Glycolysis in the erythrocyte and the 2,3-BPG shunt</h3>
  <div class="ix" data-ix="hl" data-start="main">
    <div class="cap"><span>Live · tap a route</span><em>orange = the route</em></div>
    <svg class="map pw" viewBox="0 0 360 130">
      <g class="n" data-on="main shunt"><rect x="100" y="6" width="160" height="24" rx="6"/><text x="180" y="22" text-anchor="middle">1,3-Bisphosphoglycerate</text></g>
      <g class="n" data-on="main"><rect x="6" y="52" width="128" height="26" rx="13"/><text x="70" y="69" text-anchor="middle">Phosphoglycerate kinase</text></g>
      <g class="n good" data-on="main"><rect x="6" y="96" width="92" height="22" rx="6"/><text x="52" y="111" text-anchor="middle">ADP → ATP</text></g>
      <g class="n" data-on="shunt"><rect x="252" y="36" width="60" height="24" rx="12"/><text x="282" y="52" text-anchor="middle">Mutase</text></g>
      <g class="n bad" data-on="shunt act"><rect x="226" y="68" width="128" height="24" rx="6"/><text x="290" y="84" text-anchor="middle">2,3-BPG</text></g>
      <g class="n" data-on="shunt"><rect x="252" y="100" width="80" height="24" rx="12"/><text x="292" y="116" text-anchor="middle">Phosphatase</text></g>
      <g class="n" data-on="main shunt"><rect x="118" y="100" width="118" height="24" rx="6"/><text x="177" y="116" text-anchor="middle">3-Phosphoglycerate</text></g>
      <path class="ed" d="M150 30v22h-16M70 78v18M134 65h30v35M230 30l40 6M282 60v8M290 92v8M252 112h-16"/>
    </svg>
    <div class="chips"><button class="chip sm" data-v="main">Usual route</button><button class="chip sm" data-v="shunt">The shunt</button><button class="chip sm" data-v="act">What 2,3-BPG does</button></div>
    <div class="msg" data-for="main"><b>Usual route.</b> The red blood cell has no mitochondria and depends totally on <b>anaerobic glycolysis</b> for ATP (2 ATP per glucose). Phosphoglycerate kinase makes ATP as 1,3-BPG becomes 3-phosphoglycerate.</div>
    <div class="msg" data-for="shunt"><b>The shunt.</b> Erythrocytes have <b>bisphosphoglycerate mutase</b>, which produces 2,3-BPG from 1,3-BPG. A phosphatase then gives 3-phosphoglycerate. This route skips the kinase step: <b>net ATP production = 0</b>.</div>
    <div class="msg" data-for="act"><b>2,3-BPG</b> binds to adult hemoglobin (HbA) and decreases its affinity for oxygen, so O₂ delivery to tissues increases: a shift of the curve to the right, as at high altitudes. It does <b>not</b> bind to HbF.</div>
  </div>
</section>

<section class="page" data-t="Acid–base: the words" data-g="recall table" data-p="Part 03 · Acid–base balance">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Acid–base balance</b><span>Definitions · buffers · the four disorders · compensation</span></div></div>
  <h3><i>3.1</i>Definitions</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Term</th><th>Meaning</th></tr>
      <tr><td class="k">Acid</td><td>Proton donor</td></tr>
      <tr><td class="k">Base</td><td>Proton acceptor</td></tr>
      <tr><td class="k">pH</td><td>Negative log of H⁺ activity</td></tr>
      <tr><td class="k">Acidemia</td><td>Arterial blood pH below 7.35</td></tr>
      <tr><td class="k">Alkalemia</td><td>Arterial blood pH above 7.45</td></tr>
      <tr><td class="k">Acidosis, alkalosis</td><td>Pathological states leading to acidemia and alkalemia</td></tr>
      <tr><td class="k">Buffer</td><td>Mixture of a weak acid and a salt of its conjugate base; resists changes in pH when a strong acid or base is added</td></tr>
      <tr><td class="k">pK</td><td>pH at which a buffer exists in equal proportions of its acid and conjugate base</td></tr>
      <tr><td class="k">Buffer value (β)</td><td>Amount of base required to change pH by one unit</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <h3><i>3.2</i>The bicarbonate buffer</h3>
  <ul>
    <li>H⁺ levels in the blood are kept within narrow limits by buffering systems such as proteins (hemoglobin) and HCO₃⁻. Negatively charged HCO₃⁻ binds H⁺ and lowers acidity.</li>
    <li><mark>H₂O + CO₂ ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</mark>, catalyzed by <b>carbonic anhydrase</b>; the balance can be shifted right or left.</li>
    <li>It regulates blood pH powerfully because CO₂ and HCO₃⁻ can be regulated independently, by the <b>lungs</b> and the <b>kidneys</b>.</li>
  </ul>
</section>

<section class="page" data-t="The acid–base lab" data-g="live figure" data-p="Part 03 · Acid–base balance">
  <h3><i>3.3</i>The acid–base lab: move CO₂ and HCO₃⁻, watch the pH</h3>
  <div class="ix" data-ix="abg">
    <div class="cap"><span>Live · Henderson–Hasselbalch</span><em>pH = pK + log [HCO₃⁻] / [CO₂]</em></div>
    <canvas class="plot" style="aspect-ratio:1/.24;background:#fbf7ef"></canvas>
    <div class="big2" style="grid-template-columns:1fr 1.5fr"><div><small>pH</small><b data-k="ph">7.40</b></div><div><small>State</small><b data-k="dx" style="font-size:1.25em;line-height:1.5">Normal</b></div></div>
    <div class="sl"><span>CO₂ · set by the lungs</span><span>PCO₂ <b data-k="cv">40</b> mm Hg</span></div>
    <input type="range" min="20" max="80" step="1" value="40" data-k="c" aria-label="Carbon dioxide">
    <div class="sl"><span>HCO₃⁻ · set by the kidneys</span><span>HCO₃⁻ <b data-k="hv">24</b> mmol/L</span></div>
    <input type="range" min="10" max="40" step="1" value="24" data-k="h" aria-label="Bicarbonate">
    <div class="chips"><button class="chip sm" data-v="hypo">Hypoventilation</button><button class="chip sm" data-v="hyper">Hyperventilation</button><button class="chip sm" data-v="mac">Lose HCO₃⁻</button><button class="chip sm" data-v="mal">Gain HCO₃⁻</button><button class="chip sm" data-v="norm">Reset</button><button class="btn" data-k="comp" style="margin-left:auto">Compensate</button></div>
    <div class="msg" data-k="msg"></div>
  </div>
  <div class="note"><b>So:</b> acidosis is either increased CO₂ or decreased HCO₃⁻. Alkalosis is either decreased CO₂ or increased HCO₃⁻. <span style="opacity:.75">The mm Hg and mmol/L numbers on the sliders are standard reference values added to drive the figure; the lecture gives the equation only.</span></div>
</section>

<section class="page" data-t="Disorders and compensation" data-g="reveal cards" data-p="Part 03 · Acid–base balance">
  <h3><i>3.4</i>Naming a disorder</h3>
  <ul>
    <li><b>Respiratory:</b> abnormal processes that alter pH through a primary change in <mark>PCO₂</mark>. <b>Metabolic:</b> through a primary change in <mark>[HCO₃⁻]</mark>.</li>
    <li><b>Simple</b> disorder: a single primary disorder. <b>Mixed</b>: more primary disorders present simultaneously.</li>
  </ul>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Respiratory acidosis: six causes</small><span>Respiratory depression · narcotics overdose · CNS depression · COPD · pneumothorax · atelectasis. Pulmonary obstruction increases CO₂, which makes the pH fall.</span></div>
    <div class="rvc" data-rv><small>Respiratory acidosis: compensation</small><span>The kidney retains an increased amount of HCO₃⁻ to increase the pH.</span></div>
    <div class="rvc" data-rv><small>Respiratory alkalosis: causes</small><span>Blood pH above 7.45 due to an issue with respiration. Anything that leads to hyperventilation: anxiety, pregnancy, respiratory conditions and mechanical ventilation (ventilator-induced hyperventilation).</span></div>
    <div class="rvc" data-rv><small>Why is compensation of metabolic alkalosis weak?</small><span>Lowering ventilation to raise CO₂ is not very effective: once O₂ reaches low levels, the peripheral chemoreceptors are triggered by low O₂ to increase ventilation.</span></div>
  </div>
  <h3><i>3.5</i>Ventilation answers acidemia</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>H⁺ or CO₂ production leads to acidemia or ↑ PCO₂</li><li>Sensed by peripheral or central chemoreceptors</li><li>They stimulate the respiratory control center</li><li>↑ Ventilation → ↑ CO₂ excretion</li><li>Plasma pH returns closer to normal (pH 7.4)</li></ol>
  </div>
</section>

<section class="page" data-t="Anti-inflammatory agents" data-g="tap the map" data-p="Part 04 · Anti-inflammatory agents">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Anti-inflammatory agents</b><span>Arachidonic acid · glucocorticoids · NSAIDs</span></div></div>
  <h3><i>4.1</i>Where each drug blocks inflammation</h3>
  <div class="ix" data-ix="hl" data-start="path">
    <div class="cap"><span>Live · tap a drug</span><em>orange = where it acts</em></div>
    <svg class="map pw" viewBox="0 0 360 150">
      <g class="n" data-on="path"><rect x="6" y="6" width="148" height="22" rx="6"/><text x="80" y="21" text-anchor="middle">Membrane phospholipids</text></g>
      <g class="n" data-on="path"><rect x="30" y="36" width="100" height="22" rx="11"/><text x="80" y="51" text-anchor="middle">Phospholipase A₂</text></g>
      <g class="n" data-on="path"><rect x="26" y="66" width="108" height="22" rx="6"/><text x="80" y="81" text-anchor="middle">Arachidonic acid</text></g>
      <g class="n" data-on="path nsaid"><rect x="26" y="96" width="108" height="22" rx="11"/><text x="80" y="111" text-anchor="middle">Cyclooxygenase</text></g>
      <g class="n bad" data-on="path"><rect x="6" y="126" width="148" height="20" rx="6"/><text x="80" y="140" text-anchor="middle">Prostaglandins · leukotrienes</text></g>
      <path class="ed" d="M80 28v8M80 58v8M80 88v8M80 118v8"/>
      <g class="n" data-on="gc"><rect x="196" y="6" width="158" height="22" rx="6"/><text x="275" y="21" text-anchor="middle">Corticosteroid enters the cell</text></g>
      <g class="n" data-on="gc"><rect x="196" y="38" width="158" height="22" rx="11"/><text x="275" y="53" text-anchor="middle">Cytoplasmic receptor</text></g>
      <g class="n" data-on="gc"><rect x="196" y="70" width="158" height="22" rx="6"/><text x="275" y="85" text-anchor="middle">Nucleus: binds GREs on genes</text></g>
      <g class="n good" data-on="gc"><rect x="196" y="102" width="158" height="34" rx="6"/><text x="275" y="116" text-anchor="middle">Altered transcription:</text><text x="275" y="128" text-anchor="middle">fewer inflammatory mediators</text></g>
      <path class="ed" d="M275 28v10M275 60v10M275 92v10M196 119h-42v12"/>
    </svg>
    <div class="chips"><button class="chip sm" data-v="path">The pathway</button><button class="chip sm" data-v="gc">Glucocorticoids</button><button class="chip sm" data-v="nsaid">Aspirin, ibuprofen</button></div>
    <div class="msg" data-for="path"><b>The inflammatory pathway.</b> During the inflammatory response, the metabolites of arachidonic acid (<b>eicosanoids</b>) are released from cell membrane phospholipids by <b>phospholipase A₂</b> and further converted by cyclooxygenases to prostaglandins and leukotrienes: major contributors to inflammation.</div>
    <div class="msg" data-for="gc"><b>Glucocorticoids</b> bind to cytosolic steroid receptors (heat-shock protein hsp90 is released), translocate to the nucleus, bind to glucocorticoid response elements (GREs) and alter responsive genes to reduce inflammatory mediators. Used in asthma, chronic bronchitis, sarcoidosis, and hypersensitivity and interstitial lung diseases.</div>
    <div class="msg" data-for="nsaid"><b>NSAIDs.</b> Aspirin and ibuprofen <b>acetylate cyclooxygenase</b> (prostaglandin synthase) to block prostaglandin synthesis: reduced inflammation, reduced fever, reduced pain.</div>
  </div>
  <div class="note">Many inflammatory diseases of the lung are treated with anti-inflammatory glucocorticoids to reduce the pulmonary immune responses causing the disease.</div>
</section>

  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Rhinosinusitis</b><span>Paranasal sinuses · causes · presentation · treatment</span></div></div>
  <h3><i>1.1</i>Paranasal sinuses</h3>
  <ul>
    <li>Hollow, air-filled cavities surrounding the nose, lined with mucus, draining into the nasal cavity. They humidify inspired air.</li>
    <li>Four groups: <mark>frontal, sphenoid, ethmoid and maxillary</mark>.</li>
  </ul>
  <h3><i>1.2</i>How a sinus gets infected</h3>
  <p><b>Rhinosinusitis</b> is inflammation of the paranasal sinuses.</p>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · the vicious circle</span><em data-k="n"></em></div>
    <ol class="stp"><li>Obstruction: sinus drainage into the nasal cavity becomes blocked, typically by mucus</li><li>Stasis</li><li>Infection, which adds to the obstruction</li></ol>
  </div>
  <h3><i>1.3</i>Causes</h3>
  <div class="ix" data-ix="recall">

      <tr><td class="k">Usual cause</td><td>Viral upper respiratory tract infections</td></tr>
      <tr><td class="k">Streptococcus pneumoniae</td><td>40% of secondary bacterial infections</td></tr>
      <tr><td class="k">Haemophilus influenzae</td><td>35%</td></tr>
      <tr><td class="k">Moraxella catarrhalis</td><td>5%</td></tr>

<section class="page" data-t="Viral or bacterial sinusitis?" data-g="compare" data-p="Part 01 · Rhinosinusitis">
  <h3><i>1.4</i>Presentation</h3>
  <ul>
    <li>Tenderness to palpation and a sensation of <mark>"fullness"</mark> in the affected paranasal regions (may mimic toothache); rarely, earache.</li>
  </ul>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · is it still viral?</span><em></em></div>
    <div class="chips"><button class="chip" data-v="v">Viral URI</button><button class="chip" data-v="b">Bacterial on top</button></div>
    <div class="msg" data-for="v">Typically <b>self-limiting</b>. Antibiotics are generally <b>not indicated</b> for sinusitis.</div>
    <div class="msg" data-for="b">Suspect it when there is <b>fever and purulent nasal discharge</b>, or when viral URI symptoms <b>persist or worsen after 1–2 weeks</b>. Antibiotics are indicated if it is complicated by bacterial infection, or if symptoms have persisted longer than 10 days.</div>
  </div>
  <h3><i>1.5</i>Diagnosis</h3>
  <ul>
    <li>Primarily <b>clinical suspicion</b> based on history and physical examination.</li>
    <li>CT scan can show <mark>air-fluid levels</mark>.</li>
  </ul>
</section>

  <h3><i>2.1</i>Definition and classes</h3>
  <p><b>Pneumonia</b> is consolidation of lung tissue by an <mark>intra-alveolar inflammatory exudate of infective origin</mark>. By pattern: lobar pneumonia, bronchopneumonia. By agent: bacterial, viral, fungal, rickettsial, chlamydial and protozoal.</p>

<section class="page" data-t="Pneumonia under the microscope" data-g="live figure" data-p="Part 02 · Pneumonia">
  <h3><i>2.3</i>Now look inside the alveoli</h3>
  <div class="ix" data-ix="micro" data-start="normal">

<section class="page" data-t="Diffuse alveolar damage" data-g="live figure" data-p="Part 02 · Pneumonia">

  <p>DAD shows injury to <mark>alveolar lining and endothelial cells</mark>, pulmonary edema, <mark>hyaline membrane</mark> formation, and later proliferative changes of alveolar and bronchiolar lining cells and interstitial cells.</p>

    <div class="msg" data-k="msg"></div>

"dad1":"<b>Exudative (acute) phase.</b> Neutrophil-mediated inflammation damages the alveolar capillary barrier (alveolar epithelium and endothelium), increases its permeability and causes intra-alveolar hemorrhage and edema. Protein-rich edema interacts with surfactant, so pulmonary compliance decreases. <b>Hyaline membranes</b> (the pink lining) develop on the alveolar wall where epithelium is denuded.",

<section class="page" data-t="Tuberculosis · the organism" data-g="compare" data-p="Part 01 · Tuberculosis">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Tuberculosis</b><span>Organism · pathogenesis · granuloma · primary and secondary · spread</span></div></div>
  <h3><i>1.1</i>Why it matters again</h3>
  <p>An important <mark>infectious granulomatous</mark> disease. After its incidence declined with effective antibiotics, it has risen again because of <b>AIDS</b> (immunity) and <b>multidrug-resistant strains</b> of tubercle bacilli.</p>
  <h3><i>1.2</i>Mycobacterium tuberculosis</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · know the organism</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="h">Human type</button><button class="chip sm" data-v="b">Bovine type</button><button class="chip sm" data-v="w">Waxy lipid coat</button><button class="chip sm" data-v="p">Protein part</button><button class="chip sm" data-v="s">Survival</button></div>
    <div class="msg" data-for="h">Infection by <b>inhalation</b>.</div>
    <div class="msg" data-for="b">Infection by <b>infected milk</b>.</div>
    <div class="msg" data-for="w">Responsible for the <b>resistance of the organism to destruction by macrophages</b>.</div>
    <div class="msg" data-for="p">Responsible for the <b>immunologic activity</b>.</div>
    <div class="msg" data-for="s">An aerobic, non-motile organism. It resists drying outside the body, but it may be killed by <b>sunlight</b>.</div>
  </div>
  <h3><i>1.3</i>Pathogenesis, step by step</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>TB bacilli are ingested by macrophages, which cannot kill them</li><li>The macrophages transform into epithelioid cells and form a granuloma</li><li>TB-laden macrophages are carried through lymphatic vessels (lymphangitis) to regional lymph nodes (lymphadenitis), because immunity has not developed yet</li><li>After about 3 weeks: antigen-presenting cells introduce the organism to T helper cells, whose cytokines make macrophages proliferate and better able to ingest and kill</li><li>T helper cells activate T cytotoxic cells, whose mediators kill the TB-laden macrophages at the center of the granuloma: caseation (delayed, type IV hypersensitivity)</li></ol>
  </div>
</section>

<section class="page" data-t="Spread and complications" data-g="recall table" data-p="Part 01 · Tuberculosis">

      <tr><td class="k">Blood</td><td>The focus opens into a vein: miliary (disseminated) TB</td></tr>

<section class="page" data-t="Sarcoidosis" data-g="sorting game" data-p="Part 02 · Sarcoidosis">

  <h3><i>2.1</i>What it is</h3>
  <ul>
    <li>A multisystem disease of <b>unknown cause</b> with <mark>naked non-caseating granulomas</mark> in many tissues and organs; in the thoracic organs in 90% of cases.</li>
    <li>Adults between 20 and 40 years; rare below 10. No distinct sex predilection.</li>
    <li><b>Pathogenesis:</b> disordered immune regulation in genetically predisposed persons; a cell-mediated (type IV hypersensitivity) reaction.</li>
  </ul>
  <h3><i>2.2</i>TB or sarcoidosis?</h3>
  <div class="ix" data-ix="sort">

  <h3><i>2.3</i>Diagnosis and course</h3>

    <div class="rvc" data-rv><small>Course and prognosis</small><span>Unpredictable. <b>65–70%</b>: recovery with minimal or no residual manifestations. <b>20%</b>: permanent lung dysfunction or visual impairment. <b>10–15%</b>: complicated by cor pulmonale.</span></div>

<section class="page" data-t="Edema · pulmonary edema" data-g="sorting game" data-p="Part 03 · Vascular disorders">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Vascular disorders</b><span>Causes of edema · pulmonary edema</span></div></div>
  <h3><i>3.1</i>Edema</h3>
  <p>Accumulation of fluid in the <mark>interstitial tissue, serous cavities or lung alveoli</mark>.</p>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · five causes with an example</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Mechanism</th><th>Example</th></tr>
      <tr><td class="k">↓ Osmotic pressure in blood (albumin)</td><td>Liver disease, glomerulonephritis, malnutrition</td></tr>
      <tr><td class="k">↑ Osmotic pressure in interstitial tissue</td><td>Listed on the slide without an example</td></tr>
      <tr><td class="k">↑ Hydrostatic pressure in blood (chronic venous congestion)</td><td>Heart failure</td></tr>
      <tr><td class="k">Lymphatic obstruction</td><td>Elephantiasis</td></tr>
      <tr><td class="k">↑ Capillary permeability</td><td>Acute inflammation</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <h3><i>3.2</i>Pulmonary edema</h3>
  <p>Fluid accumulation within the lungs, usually due to an imbalance of <b>Starling forces</b> or <b>endothelial injury</b>.</p>
  <h3><i>3.3</i>Which force failed?</h3>
  <div class="ix" data-ix="sort">

  <h3><i>2.1</i>Tip the balance</h3>
  <p><b>Emphysema:</b> permanent enlargement of air spaces <mark>distal to the terminal bronchioles</mark>, with destruction of their walls. It is due to an imbalance between protease (elastase) and anti-protease (anti-elastase) activities in the lung.</p>

"smoke":"<b>Cigarette smoking.</b> Particles, chemicals and reactive oxygen species cause inflammation → activation of neutrophils → release of elastase (<b>↑ elastase activity</b>). At the same time oxidants inhibit the action of antitrypsin (<b>↓ anti-elastase activity</b>). Result: tissue destruction.",

  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>The upper respiratory tract</b><span>Definitions · the common cold · who causes what</span></div></div>
  <h3><i>1.1</i>Three definitions</h3>
  <ul>
    <li><b>Respiratory tract infection (RTI):</b> any infectious disease of the upper or lower respiratory tract.</li>
    <li><b>Upper (URTIs):</b> the common cold, otitis media, sinusitis, pharyngitis/tonsillitis, epiglottitis and laryngotracheitis.</li>
    <li><b>Lower (LRTIs):</b> any infection in the lungs or <mark>below the voice box</mark>: pneumonia, bronchitis, bronchiolitis and tuberculosis.</li>
  </ul>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · upper or lower?</span><em data-k="n"></em></div>

    <div class="msg" data-k="fb"></div>
    <script type="application/json">[
["Otitis media",0,"An upper respiratory tract infection."],["Bronchiolitis",1,"Lower: below the voice box."],["Epiglottitis",0,"Upper."],["Tuberculosis",1,"Lower."],["Sinusitis",0,"Upper."],["Pneumonia",1,"Lower."],["Pharyngitis",0,"Upper."],["Bronchitis",1,"Lower."]
]</script>
  </div>
  <h3><i>1.2</i>The setting</h3>
  <ul>
    <li>The mouth and nose connect directly with the environment; some non-pathogenic microbes normally live in the nasopharynx and respiratory tract.</li>
    <li><mark>Viruses cause the majority</mark> of upper respiratory infections (rhinitis, pharyngitis, sinusitis, bronchitis).</li>
    <li>Host defenses: neutralizing toxins with antibodies, phagocytic destruction of bacteria, and complement for direct lysis.</li>
  </ul>
</section>

  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Clinical manifestations</small><span>After an incubation period of <b>48–72 hours</b>: nasal discharge and obstruction, sneezing, sore throat and cough, in adults and children. Myalgia and headache may be present. High fever is rare.</span></div>

<section class="page" data-t="Streptococcus pneumoniae" data-g="reveal cards" data-p="Part 03 · The three commonest bacteria">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>The three commonest bacteria</b><span>S. pneumoniae · H. influenzae · Moraxella catarrhalis</span></div></div>
  <h3><i>3.1</i>Streptococcus pneumoniae</h3>
  <p><b>Reservoir:</b> human upper respiratory tract. <b>Transmission:</b> respiratory droplets.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Four virulence factors</small><span><b>Polysaccharide capsule</b> (the major one) · IgA protease · teichoic acid · <b>pneumolysin O</b>: a hemolysin/cytolysin that damages respiratory epithelium, inhibits the leukocyte respiratory burst and inhibits classical complement fixation.</span></div>
    <div class="rvc" data-rv><small>Diseases</small><span><b>Typical pneumonia</b>: the most common cause (especially in decade 6 of life), with shaking chills, high fever, lobar consolidation and blood-tinged "rusty" sputum · adult meningitis · otitis media and sinusitis in children (most common cause).</span></div>
    <div class="rvc" data-rv><small>Laboratory diagnosis</small><span>Gram stain and culture of CSF or sputum on blood agar · <b>Quellung reaction</b> positive: swelling of the capsule with type-specific antiserum (no longer used, but still tested) · latex particle agglutination for capsular antigen in CSF.</span></div>
    <div class="rvc" data-rv><small>Treatment</small><span>Beta-lactams for bacterial pneumonia; ceftriaxone or cefotaxime for adult meningitis.</span></div>
  </div>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · two vaccines</span><em></em></div>
    <div class="chips"><button class="chip" data-v="a">Pediatric · PCV</button><button class="chip" data-v="b">Adult · PPV</button></div>
    <div class="msg" data-for="a"><b>Pneumococcal conjugate vaccine:</b> 13 of the most common serotypes, conjugated to diphtheria toxoid. Prevents invasive disease.</div>
    <div class="msg" data-for="b"><b>Pneumococcal polysaccharide vaccine:</b> 23 of the most common capsular serotypes.</div>
  </div>
  <div class="note"><b>Viridans streptococci.</b> Dextran (biofilm)-mediated adherence onto tooth enamel or damaged heart valves: <b>dental caries</b> (S. mutans) and subacute <b>infective endocarditis</b>. Prophylactic antibiotics before dental work for those with damaged valves.</div>
</section>

<section class="page" data-t="H. influenzae · Moraxella" data-g="recall table" data-p="Part 03 · The three commonest bacteria">
  <h3><i>3.2</i>Haemophilus influenzae</h3>
  <p><b>Reservoir:</b> human nasopharynx. <b>Transmission:</b> respiratory droplets, shared toys.</p>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · its diseases</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Disease</th><th>Who, or which strain</th></tr>
      <tr><td class="k">Meningitis</td><td>Epidemic in unvaccinated children aged 3 months to 2 years</td></tr>
      <tr><td class="k">Otitis media</td><td>Usually nontypeable strains (no capsule)</td></tr>
      <tr><td class="k">Bronchitis</td><td>Exacerbations in smokers with COPD</td></tr>
      <tr><td class="k">Pneumonia</td><td>1–24 months; rare in vaccinated children; smokers</td></tr>
      <tr><td class="k">Epiglottitis</td><td>Unvaccinated toddlers; "cherry red" epiglottis; "thumb sign"</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Diagnosis</small><span>Swabs, sputum, pus, blood or CSF culture on <b>chocolate agar</b>; PCR; antigen detection of the capsule (latex particle agglutination).</span></div>
    <div class="rvc" data-rv><small>Prophylaxis</small><span><b>Hib conjugate vaccine</b> (capsular polysaccharide conjugated to a protein), at 2, 4, 6 months and at 12–15 months. May be given with DPT (DPTH).</span></div>
    <div class="rvc" data-rv><small>Treatment</small><span>Amoxicillin ± clavulanate for mucosal infections; cefotaxime or ceftriaxone in meningitis. Check nasal carriage before release; rifampin if still colonized.</span></div>
    <div class="rvc" data-rv><small>Why rare in the first 2 months of life?</small><span>Maternal anticapsular antibodies. Most cases occur in children under 2 years.</span></div>
  </div>
  <h3><i>3.3</i>Moraxella catarrhalis</h3>
  <p>Endotoxin may play a role. <b>Diseases:</b> otitis media, sinusitis; bronchitis and bronchopneumonia in elderly patients with COPD. <b>Treatment:</b> amoxicillin and clavulanate, or a second- or third-generation cephalosporin.</p>
</section>

  <h3><i>4.2</i>Two diseases of the mouth</h3>

    <div class="msg" data-for="v"><b>Acute necrotizing ulcerative gingivitis (trench mouth).</b> A grayish pseudomembrane develops along the gum margins; the gums bleed easily and the breath is foul. <b>Organisms:</b> Treponema vincentii with fusiform bacilli. <b>Seen by:</b> dark-field microscopy, Gram-stained film, Fontana stain.</div>

<section class="page" data-t="Streptococcus pyogenes" data-g="sorting game" data-p="Part 02 · Group A streptococcus">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Group A streptococcus</b><span>Virulence factors · pharyngitis and scarlet fever · the laboratory</span></div></div>
  <h3><i>2.1</i>What each factor does</h3>
  <p><b>Reservoir:</b> human throat and skin. <b>Transmission:</b> direct contact; respiratory droplets.</p>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · tap the factor</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>Which factor?</small><b data-k="card" style="font-size:1.05em;line-height:1.35"></b></div></div>

    <div class="msg" data-k="fb"></div>
    <script type="application/json">[
["Antiphagocytic; associated with acute glomerulonephritis and rheumatic fever",0,"M protein."],
["An immunogenic hemolysin/cytolysin",1,"Streptolysin O. Anti-streptolysin O titres are used in serological diagnosis."],
["A hemolysin/cytolysin that is not immunogenic",2,"Streptolysin S."],
["Breaks down the fibrin clot",3,"Streptokinase, a spreading factor."],

<section class="page" data-t="Scarlet fever · laboratory" data-g="tap in order" data-p="Part 02 · Group A streptococcus">
  <h3><i>2.2</i>Pharyngitis and scarlet fever</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare</span><em></em></div>
    <div class="chips"><button class="chip" data-v="p">Pharyngitis</button><button class="chip" data-v="s">Scarlet fever</button></div>
    <div class="msg" data-for="p">Abrupt onset of sore throat, fever, malaise and headache; tonsillar abscesses and tender anterior cervical lymph nodes.</div>
    <div class="msg" data-for="s">The above, followed by a blanching <b>"sandpaper" rash</b> (palms and soles are usually spared), <b>circumoral pallor</b>, <b>strawberry tongue</b>, and nausea/vomiting. Caused by the erythrogenic toxin; highly contagious; common in children; spread by droplets or direct contact. Spot diagnosis: rash and strawberry tongue.</div>
  </div>
  <h3><i>2.3</i>Laboratory diagnosis</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step</span><em data-k="n"></em></div>
    <ol class="stp"><li>Specimen: throat swab</li><li>Rapid strep test: if positive, antibiotics can be prescribed; if negative, do a culture</li><li>Direct smear stained with Gram: Gram-positive cocci arranged in chains</li><li>Culture on blood agar for identification</li><li>Schultz–Charlton test: intradermal injection of antitoxin makes the erythematous area around it disappear (in vivo toxin neutralization)</li><li>Serology: positive anti-streptolysin O titres</li></ol>
  </div>
  <div class="note"><b>Why culture children?</b> Untreated scarlet fever or strep throat in children and teens may lead to <b>rheumatic fever</b>. Adults are generally not at risk, so a throat culture after a negative rapid test is usually not necessary for them.</div>
</section>

<section class="page" data-t="Diphtheria" data-g="tap in order" data-p="Part 03 · Diphtheria and whooping cough">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Diphtheria and whooping cough</b><span>Toxin-mediated disease of the throat and airway</span></div></div>
  <h3><i>3.1</i>Corynebacterium diphtheriae</h3>
  <p><b>Reservoir:</b> throat and nasopharynx. <b>Transmission:</b> bacterium or phage via respiratory droplets. Toxin-producing strains carry the toxin genes on a <mark>β-prophage</mark> (lysogeny).</p>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · how the disease unfolds</span><em data-k="n"></em></div>
    <ol class="stp"><li>The organism is not invasive: it colonizes the epithelium of the oropharynx (or skin in cutaneous diphtheria)</li><li>Diphtheria toxin (A–B component) inhibits protein synthesis by adding ADP-ribose to eEF-2</li><li>Oropharynx: dirty gray pseudomembrane</li><li>Extension into the larynx and trachea: obstruction</li><li>Systemic circulation: heart and nerve damage</li></ol>
  </div>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>The disease</small><span>Sore throat with pseudomembrane, <b>bull neck</b>, potential respiratory obstruction, myocarditis, cardiac dysfunction, recurrent laryngeal nerve palsy, lower limb polyneuritis, renal failure.</span></div>
    <div class="rvc" data-rv><small>Diagnosis</small><span>Gram-positive rods with metachromatic (blue and red) granules · <b>Elek test</b> to document toxin production (ELISA for toxin is now the gold standard).</span></div>
    <div class="rvc" data-rv><small>Treatment and prevention</small><span>Erythromycin <b>and antitoxin</b>. Toxoid vaccine, part of DTaP, DTP or Td; boosters at 10-year intervals.</span></div>
  </div>
</section>

<section class="page" data-t="Bordetella pertussis" data-g="sorting game" data-p="Part 03 · Diphtheria and whooping cough">
  <h3><i>3.2</i>Bordetella pertussis</h3>
  <p>A mucosal surface pathogen. <b>Reservoir:</b> human (vaccinated). <b>Transmission:</b> respiratory droplets. It attaches to nasopharyngeal ciliated epithelial cells; its toxins damage the respiratory epithelium, giving a cough with an inspiratory <mark>"whoop"</mark>.</p>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · tap the factor</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>Which factor of B. pertussis?</small><b data-k="card" style="font-size:1.05em;line-height:1.35"></b></div></div>
    <div class="chips" style="justify-content:center"><button class="chip sm" data-b="0">Filamentous hemagglutinin</button><button class="chip sm" data-b="1">Adenylate cyclase toxin</button><button class="chip sm" data-b="2">Tracheal cytotoxin</button><button class="chip sm" data-b="3">Pertussis toxin</button></div>
    <div class="msg" data-k="fb"></div>
    <script type="application/json">[
["Attachment to ciliated epithelial cells",0,"Filamentous hemagglutinin; pertussis toxin on the outer membrane aids attachment."],
["Impairs leukocyte chemotaxis, inhibits phagocytosis, causes local edema",1,"Adenylate cyclase toxin."],
["Interferes with ciliary action; kills ciliated cells",2,"Tracheal cytotoxin."],
["ADP ribosylation of Gi",3,"Pertussis toxin: an A and B component, outer membrane protein toxin."]
]</script>
  </div>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Diagnosis</small><span>Fastidious: <b>Regan–Lowe</b> or <b>Bordet–Gengou</b> media, by direct cough plates or nasopharyngeal cultures; difficult to culture from the middle of the paroxysmal stage on. Direct immunofluorescence on a nasopharyngeal smear; PCR and serology.</span></div>
    <div class="rvc" data-rv><small>Treatment</small><span>Supportive care (hospitalization if under 6 months); <b>erythromycin for 14 days</b>, including all household contacts.</span></div>
    <div class="rvc" data-rv><small>Prevention</small><span>DTaP vaccine (acellular pertussis: filamentous hemagglutinin plus pertussis toxoid). Immunity wanes in 5–7 years; babies are born with little or no immunity from the mother.</span></div>
  </div>
</section>

  <h3><i>4.1</i>Build the virus</h3>
  <div class="ix" data-ix="virion" data-start="herpes">

    <canvas class="plot" style="aspect-ratio:1/.44"></canvas>
    <div class="chips"><button class="chip sm" data-v="herpes">Herpesviridae</button><button class="chip sm" data-v="adeno">Adenoviridae</button><button class="chip sm" data-v="picorna">Picornaviridae</button></div>

"adeno":"<b>Adenoviridae:</b> dsDNA, non-enveloped, with hexons, pentons and fibers. Over 50 serotypes. Penton fibers act as hemagglutinin and are toxic to cells. <b>Acute respiratory disease and pneumonia</b>: children, young military recruits, college students (serotypes 4 and 7): cough, conjunctivitis, fever, pharyngitis, hoarseness. Prevention: live, non-attenuated vaccine.",

}</script>
  </div>
  <h3><i>4.2</i>How EBV causes mononucleosis</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step</span><em data-k="n"></em></div>
    <ol class="stp"><li>Transmitted in saliva; infects nasopharyngeal epithelial cells, salivary and lymphoid tissues</li><li>Latent infection of B cells: EBV binds CD21 and acts as a B-cell mitogen</li><li>Atypical reactive T cells (Downey cells) appear, up to 70% of the WBC count</li><li>Heterophile antibodies are produced, due to B-cell mitogenesis</li></ol>
  </div>
</section>

<section class="page" data-t="Infectious mononucleosis" data-g="recall" data-p="Part 04 · Viral sore throats">
  <h3><i>4.3</i>The disease and its diagnosis</h3>
  <p><b>Heterophile-positive mononucleosis</b> (glandular fever, "kissing disease"): fatigue, fever, sore throat, lymphadenopathy, splenomegaly, typically in a young adult. 90% of adults are seropositive without symptoms.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Blood picture</small><span>Increased leucocytic count, absolute lymphocytosis, monocytosis and <b>atypical lymphocytes</b>.</span></div>
    <div class="rvc" data-rv><small>Heterophile antibodies</small><span>B cells transformed by EBV produce antibodies that agglutinate <b>sheep red blood cells</b>: the <b>Paul–Bunnell test</b> (tube agglutination) or <b>monospot test</b> (slide agglutination).</span></div>
    <div class="rvc" data-rv><small>Finding the virus</small><span>EBV antigen or DNA in peripheral lymphocytes, saliva, throat washings or lymphoid tissue, by DNA hybridization and PCR.</span></div>
  </div>
  <h3><i>4.4</i>EBV and malignancy</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Condition</th><th>Key fact</th></tr>
      <tr><td class="k">Lymphoproliferative disease</td><td>Immunocompromised patients: T cells cannot control B-cell growth</td></tr>
      <tr><td class="k">Hairy oral leukoplakia</td><td>Hyperproliferation of lingual epithelial cells; AIDS patients</td></tr>
      <tr><td class="k">Burkitt lymphoma</td><td>Maxilla, mandible, abdomen; Africa; malaria as cofactor</td></tr>
      <tr><td class="k">Nasopharyngeal carcinoma</td><td>Asia (most common cancer in southern China); epithelial origin</td></tr>
      <tr><td class="k">Lymphomas</td><td>Hodgkin and non-Hodgkin</td></tr>
    </table>

</section>

<section class="page" data-t="Klebsiella · Pseudomonas" data-g="reveal cards" data-p="Part 02 · Typical pneumonia">
  <h3><i>2.2</i>Klebsiella pneumoniae</h3>
  <p><b>Reservoir:</b> human colon and upper respiratory tract. <b>Transmission:</b> endogenous. <b>Pathogenesis:</b> capsule; endotoxin (fever, inflammation, shock).</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Who gets it?</small><span>Community-acquired, most often <b>older men</b> with chronic lung disease, <b>alcoholism</b> or diabetes. (It is not the most common cause of pneumonia in alcoholics; S. pneumoniae is.)</span></div>
    <div class="rvc" data-rv><small>What is special about the disease?</small><span>Frequent <b>abscesses</b> make it hard to treat; the fatality rate is high. Sputum is thick and bloody (<b>currant jelly</b>) but not foul smelling as in anaerobic aspiration pneumonia.</span></div>
    <div class="rvc" data-rv><small>Diagnosis and treatment</small><span>Culture of sputum on MacConkey's agar: mucoid lactose fermenter. Third-generation cephalosporin.</span></div>
  </div>
</section>

<section class="page" data-t="Pseudomonas aeruginosa" data-g="reveal cards" data-p="Part 02 · Typical pneumonia">
  <h3><i>2.3</i>Pseudomonas aeruginosa</h3>
  <p><b>Reservoir:</b> ubiquitous in water and soil. <b>Transmission:</b> water aerosols, raw vegetables, flowers.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Pathogenesis</small><span>Endotoxin: inflammation and Gram-negative shock · <b>exotoxin A ADP-ribosylates eEF-2</b>, inhibiting protein synthesis (like diphtheria toxin); the liver is the primary target · capsule/slime layer allows pulmonary microcolonies that resist phagocytosis.</span></div>
    <div class="rvc" data-rv><small>Who gets which disease?</small><span><b>Neutropenic</b> patients: pneumonia and septicemia · <b>chronic granulomatous disease</b>: pneumonias, septicemias · diabetics: osteomyelitis (diabetic foot) · swimmers, diabetics, pierced ears: otitis externa · <b>cystic fibrosis</b>: early pulmonary colonization, recurrent pneumonia.</span></div>
    <div class="rvc" data-rv><small>Treatment</small><span>Antipseudomonal penicillin and an aminoglycoside. Susceptibilities are important: drug resistance is very common.</span></div>
  </div>
</section>

<section class="page" data-t="Atypical pneumonia" data-g="live figure" data-p="Part 03 · Atypical pneumonia">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Atypical pneumonia</b><span>Mycoplasma · Chlamydia · Legionella · Coxiella</span></div></div>
  <h3><i>3.1</i>The five causative agents</h3>
  <p>Slower onset, less severe symptoms, non-productive cough, patchy interstitial pattern on chest x-ray.</p>
  <div class="ix" data-ix="field" data-start="myco">
    <div class="cap"><span>Live · pick an organism</span><em>schematic field</em></div>
    <canvas class="plot" style="aspect-ratio:1/.56;background:#1d2230"></canvas>

"legion":"<b>Legionella pneumophila.</b> <b>Stains poorly with the standard Gram stain</b> (it is Gram negative). Fastidious: it needs increased <b>iron and cysteine</b> for culture (BCYE: buffered charcoal yeast extract). Facultative intracellular."

<section class="page" data-t="Mycoplasma pneumoniae" data-g="reveal cards" data-p="Part 03 · Atypical pneumonia">
  <h3><i>3.2</i>Mycoplasma pneumoniae</h3>
  <p><b>Reservoir:</b> human respiratory tract. <b>Transmission:</b> respiratory droplets, close contact: families, military recruits, medical school classes, college dorms.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Pathogenesis</small><span>A <b>surface parasite</b>, not invasive. Attaches to respiratory epithelium via <b>P1 protein</b> and inhibits ciliary action. Produces hydrogen peroxide, superoxide radicals and cytolytic enzymes that damage the epithelium, leading to necrosis and a bad hacking cough (<b>walking pneumonia</b>). It also acts as a superantigen, eliciting IL-1, IL-6 and TNF-α.</span></div>
    <div class="rvc" data-rv><small>Disease</small><span>Walking pneumonia · pharyngitis · the <b>most common atypical pneumonia</b> (along with viruses) in young adults.</span></div>
    <div class="rvc" data-rv><small>Diagnosis</small><span>Primarily clinical; PCR and nucleic acid probes. ELISA and immunofluorescence are sensitive and specific. <b>Cold agglutinins</b> (autoantibody to RBCs) are nonspecific and positive in only 65% of cases.</span></div>
    <div class="rvc" data-rv><small>Treatment</small><span>Erythromycin, azithromycin, clarithromycin. <b>No cephalosporin or penicillin</b>: there is no cell wall for them to act on.</span></div>
  </div>
</section>

<section class="page" data-t="Chlamydiaceae" data-g="recall table" data-p="Part 03 · Atypical pneumonia">
  <h3><i>3.3</i>Family Chlamydiaceae</h3>
  <ul>
    <li><b>Obligate intracellular</b> bacteria that <mark>cannot make ATP</mark>; the cell wall lacks muramic acid; elementary body and reticulate body; <b>not seen on Gram stain</b>.</li>
    <li><b>Chlamydophila pneumoniae:</b> atypical pneumonia; sputum with intracytoplasmic inclusions.</li>
    <li><b>Chlamydophila psittaci:</b> atypical pneumonia with exposure to <b>parrots</b>.</li>
    <li><b>Laboratory diagnosis:</b> PCR, nucleic acid amplification test.</li>
  </ul>
</section>

<section class="page" data-t="Legionella · Coxiella" data-g="recall table" data-p="Part 03 · Atypical pneumonia">
  <h3><i>3.4</i>Legionella pneumophila</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Legionella pneumophila</th></tr>
      <tr><td class="k">Reservoir</td><td>Rivers, streams, amebae; air-conditioning water cooling tanks</td></tr>
      <tr><td class="k">Transmission</td><td>Aerosols from contaminated air-conditioning; <b>no human-to-human transmission</b></td></tr>
      <tr><td class="k">Predisposing factors</td><td>Smokers over 55 with high alcohol intake; immunosuppressed patients such as renal transplant patients</td></tr>
      <tr><td class="k">Legionnaires disease</td><td>Severe pneumonia, often unilateral and lobar; hyponatremia; mental confusion; diarrhea (no Legionella in the GI tract)</td></tr>
      <tr><td class="k">Pontiac fever</td><td>Mild flu-like syndrome; no fatalities</td></tr>
      <tr><td class="k">Diagnosis</td><td><b>Urinary antigen test</b> (serogroup 1); direct fluorescent antibody on biopsy</td></tr>
      <tr><td class="k">Treatment</td><td>Fluoroquinolone (levofloxacin) or macrolide (azithromycin), with rifampin in immunocompromised patients</td></tr>
      <tr><td class="k">Prevention</td><td>Routine decontamination of air-conditioner cooling tanks</td></tr>

  <h3><i>3.5</i>Coxiella burnetii</h3>
  <p>Obligate intracellular with <mark>spore-like characteristics</mark>; lives inside phagolysosomes. A zoonosis of sheep and goats, inhaled from dried placental material. <b>Q fever:</b> atypical pneumonia, hepatitis or endocarditis. <b>Diagnosis:</b> serologic detection of Phase II LPS antigen in acute disease, Phase I and II in chronic disease. <b>Treatment:</b> doxycycline.</p>
</section>

<section class="page" data-t="Asthma in the lecture" data-g="tap in order" data-p="Part 04 · Asthma">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Asthma</b><span>The immunology slide in this lecture</span></div></div>
  <h3><i>4.1</i>Bronchial asthma</h3>
  <p>An obstructive disease characterized by <mark>bronchoconstriction, increased mucus production, hypertrophied bronchial smooth muscle</mark>, and airway hyperactivity to stimuli such as cold air and inhaled exogenous antigens. Many patients also have atopic disease such as eczema, related to environmental allergen exposure (<b>type I hypersensitivity</b>).</p>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · what the mediators do</span><em data-k="n"></em></div>
    <ol class="stp"><li>An inhaled allergen meets mast cells and polymorphonuclear neutrophils, which release inflammatory mediators</li><li>The mediators induce mucus secretion and cause leakiness in the bronchiole epithelium</li><li>They increase capillary permeability</li><li>They induce contraction of bronchial smooth muscle</li><li>The bronchial lumen is reduced by constriction and mucus hypersecretion: shortness of breath</li></ol>
  </div>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · the three treatments named here</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="a">Inhaled corticosteroids</button><button class="chip sm" data-v="b">Bronchodilators</button><button class="chip sm" data-v="c">Mast cell stabilizers</button></div>
    <div class="msg" data-for="a">Decrease mucus and proinflammatory cytokines in the lungs.</div>
    <div class="msg" data-for="b">Relax bronchial smooth muscle.</div>
    <div class="msg" data-for="c">Inhibit release of inflammatory cytokines and histamine.</div>
  </div>
  <div class="note">Asthma is a <b>reversible</b> airway obstruction. Bronchospasms triggered by cold air, viral infections and exercise may stimulate the same airway inflammation. The drugs themselves are covered in the Pharmacology lecture.</div>
</section>
