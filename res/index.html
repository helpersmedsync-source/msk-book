const BOOKS = $$('template[data-book]').map(t => ({id: t.dataset.book, subj: t.dataset.subj, title: t.dataset.title, short: t.dataset.short, lec: t.dataset.lec, tpl: t,
  pages: [...t.content.querySelectorAll('section.page')].map(s => [s.dataset.t, s.dataset.g || ''])}));
const byId = id => BOOKS.find(b => b.id === id);

/* progress: kept on the device, merged with the cloud copy when signed in */
const Prog = {
  key: 'helpers.' + MODULE.id + '.v1', data: {v: 1, t: 0, books: {}}, subs: [],
  load(){ try { const d = JSON.parse(localStorage.getItem(this.key)); if (d && d.books) this.data = d; } catch (e){} },
  save(){ this.data.t = Date.now(); try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e){} this.subs.forEach(f => f()); },
  book(id){ return this.data.books[id] || (this.data.books[id] = {r: [], q: null, last: 0, t: 0}); },
  read(id, i){ const b = this.book(id); if (!b.r.includes(i)){ b.r.push(i); b.t = Date.now(); this.save(); } },
  at(id, i){ const b = this.book(id); if (b.last !== i){ b.last = i; b.t = Date.now(); this.save(); } },
  quiz(id, r, n){ const b = this.book(id); if (!b.q || r > b.q[0]){ b.q = [r, n]; } b.t = Date.now(); this.save(); },
  pct(bk){ const b = this.data.books[bk.id]; return b ? Math.min(1, b.r.length / (bk.pages.length + 1)) : 0; },
  merge(remote){
    let changed = false; const L = this.data.books;
    for (const id in (remote && remote.books) || {}){
      const R = remote.books[id], l = L[id];
      if (!l){ L[id] = R; changed = true; continue; }
      const r = [...new Set([...(l.r || []), ...(R.r || [])])]; if (r.length !== l.r.length){ l.r = r; changed = true; }
      if (R.q && (!l.q || R.q[0] > l.q[0])){ l.q = R.q; changed = true; }
      if ((R.t || 0) > (l.t || 0)){ l.last = R.last; l.t = R.t; changed = true; }
    }
    if (changed){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e){} }
    return changed;
  }
};

/* who is using the site: set on the welcome page, shared by every page */
const Sess = { get(){ try { const s = JSON.parse(localStorage.getItem('helpers.session') || 'null'); return s && s.mode ? s : null; } catch (e){ return null; } }, set(s){ try { s ? localStorage.setItem('helpers.session', JSON.stringify(s)) : localStorage.removeItem('helpers.session'); } catch (e){} } };
/* compare two objects whatever order their keys come back in */
const cmpData = d => stable(Object.assign({}, d || {}, {t: 0}));
const stable = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a, x) => (a[x] = v[x], a), {}) : Array.isArray(v) && k === 'r' ? [...v].sort((a, b) => a - b) : v);
/* cloud sync: Google sign-in + one small document per student (Firebase, free plan) */
const Sync = {
  state: FB ? 'out' : 'off', user: null, err: '', _t: 0, _ref: null, _api: null,
  async init(){
    if (!FB) return;
    try {
      const B = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-';
      const [A, U, F] = await Promise.all([import(B + 'app.js'), import(B + 'auth.js'), import(B + 'firestore.js')]);
      const app = A.initializeApp(FB), auth = U.getAuth(app), db = F.getFirestore(app); this._api = {U, F, auth, db};
      U.onAuthStateChanged(auth, u => {
        this.user = u; this.state = u ? 'in' : 'out'; if (this._off){ this._off(); this._off = null; }
        const old = Sess.get() || {};
        if (u) Sess.set({mode: 'user', uid: u.uid, name: u.displayName || '', email: u.email || '', nick: old.uid === u.uid || old.mode === 'guest' ? old.nick || '' : ''});
        else if (old.mode === 'user'){ Sess.set(null); location.href = '../'; return; }
        if (u){
          this._ref = F.doc(db, 'progress', u.uid);
          this._off = F.onSnapshot(this._ref, s => {
            const had = s.exists(), D = had ? s.data() : {}, nk = D.nick, se = Sess.get();
            if (nk && se && se.nick !== nk){ se.nick = nk; Sess.set(se); }
            const ch = had && Prog.merge(D[MODULE.id]); this.doc = D;
            if (ch) Prog.subs.forEach(f => f());
            if (!had || cmpData(D[MODULE.id]) !== cmpData(Prog.data)) this.push(1500);
            this.stamp = Date.now(); paintAcct(); },
            e => { this.err = e.code || String(e); this.state = 'err'; paintAcct(); });
        }
        paintAcct();
      });
    } catch (e){ this.state = 'err'; this.err = 'Could not reach the sync service'; paintAcct(); }
  },
  signIn(){ const {U, auth} = this._api || {}; if (!U) return; const p = new U.GoogleAuthProvider(); U.signInWithPopup(auth, p).catch(e => { if (/popup|operation-not-supported/.test(e.code || '')) U.signInWithRedirect(auth, p); else { this.err = e.code || String(e); paintAcct(); } }); },
  signOut(){ const {U, auth} = this._api || {}; Sess.set(null); if (U) U.signOut(auth).then(() => { location.href = '../'; }, () => { location.href = '../'; }); else location.href = '../'; },
  push(wait = 12000){ if (this.state !== 'in') return; clearTimeout(this._t); this._t = setTimeout(() => this.flush(), wait); },
  flush(){
    if (this.state !== 'in' || !this._ref) return; clearTimeout(this._t); const {F} = this._api;
    const c = this.doc ? Board.calc() : null, data = {[MODULE.id]: Prog.data, name: this.user.displayName || '', email: this.user.email || '', seen: Date.now()};
    if (c){ data.xp = {[MODULE.id]: c.me.xp}; data.wk = {id: c.wk, base: c.base}; }
    F.setDoc(this._ref, data, {merge: true}).then(() => { this.stamp = Date.now(); paintAcct(); Board.write(c); }).catch(e => { this.err = e.code || String(e); paintAcct(); });
  }
};
Prog.subs.push(() => Sync.push());
document.addEventListener('visibilitychange', () => { if (document.hidden) Sync.flush(); });

const inApp = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|; wv\)/i.test(navigator.userAgent);
function paintAcct(){
  const b = $('#acct'), u = Sync.user; if (!b) return;
  b.classList.toggle('on', Sync.state === 'in');
  const se = Sess.get() || {}, nick = se.nick || '';
  $('.lb', b).textContent = Sync.state === 'in' ? nick || (u.displayName || 'Signed in').split(' ')[0] : nick || (Sync.state === 'off' ? 'Guest' : 'Sign in');
  const box = $('#acctbox'); if (!box) return;
  let h;
  if (Sync.state === 'off') h = `<p><b>Progress is saved on this device.</b> Sign-in and syncing between your phone and laptop are built in and will be switched on when the book moves to its permanent address.</p>`;
  else if (Sync.state === 'in') h = `<p>Signed in as <b>${u.displayName || u.email}</b>.</p><p>Username: <b>${nick || 'not set'}</b> · <a href="../#settings">Change</a>${Sync.doc && Sync.doc.hide ? ' · hidden from the leaderboard' : ''}</p><p>XP: <b>${xpOf().xp}</b> · <a href="../board/">Leaderboard</a></p><p>Your progress follows you to any device where you sign in with this Google account.${Sync.stamp ? ' Last synced ' + new Date(Sync.stamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) + '.' : ''}</p><div class="row"><button class="btn gh" data-act="signout">Sign out</button></div>`;
  else h = `<p><b>Keep your progress on every device.</b> Sign in once with Google on your phone and your laptop, and the pages you read and your quiz scores stay together.</p><p style="font-size:.85em;color:var(--ink-2)">The MedSync team admins can see names and progress to improve the books. The leaderboard shows only your username and XP.</p>${inApp ? '<p class="note">This looks like an in-app browser. Google blocks sign-in here: open the page in Chrome or Safari first.</p>' : ''}<div class="row"><button class="btn" data-act="signin">Continue with Google</button></div><p style="font-size:.85em;color:var(--ink-2)">You are browsing as a guest: progress stays on this device only. <a href="../#settings">Username and settings</a></p>`;
  if (Sync.err) h += `<p style="font-size:.8em;color:var(--red)">Sync problem: ${Sync.err}</p>`;
  box.innerHTML = h;

/* ----- library ----- */
const lib = $('#lib'), app = $('#app');
const ring = p => `<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#e3ded0" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="${p >= 1 ? '#1e9e62' : '#2e86de'}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(p * 94.2).toFixed(1)} 94.2" transform="rotate(-90 18 18)"/>${p >= 1 ? '<path d="M12 18.500l4 4 8-9" fill="none" stroke="#1e9e62" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' : `<text x="18" y="22" text-anchor="middle">${Math.round(p * 100)}</text>`}</svg>`.replace('18.500', '18.5');
function paintLib(){
  const done = BOOKS.filter(b => Prog.pct(b) >= 1).length, tot = MODULE.subjects.reduce((n, s) => n + s.lectures.length, 0);
  let last = null; for (const b of BOOKS){ const d = Prog.data.books[b.id]; if (d && d.t && (!last || d.t > Prog.data.books[last.id].t)) last = b; }
  let h = `<div class="hero"><div><div class="kick">${MODULE.kicker}</div><h1>${MODULE.title}</h1><p>${BOOKS.length} of ${tot} lectures are ready as interactive books. ${done ? done + ' finished.' : 'Pick one to start.'}</p></div>`;
  if (last){ const d = Prog.data.books[last.id]; h += `<button class="cont" data-open="${last.id}"><small>Continue</small><b>${last.title}</b><span>${last.subj} · page ${Math.min(d.last + 1, last.pages.length + 1)}</span></button>`; }
  h += '</div>' + toolStrip();
  for (const s of MODULE.subjects){
    h += `<section class="subj"><h2><i style="background:${s.color}"></i>${s.name}<span>${s.lectures.filter(l => byId(l.id)).length} / ${s.lectures.length}</span></h2><div class="shelf">`;
    for (const l of s.lectures){
      const b = byId(l.id);
      if (!b){ h += `<div class="bk soon"><div class="sp" style="background:${s.color}"></div><div class="bd"><small>${l.lec}</small><b>${l.title}</b><em>Coming next</em></div></div>`; continue; }
      const p = Prog.pct(b), d = Prog.data.books[b.id], tags = [...new Set(b.pages.map(x => x[1]).filter(Boolean))].slice(0, 3);
      h += `<button class="bk" data-open="${b.id}"><div class="sp" style="background:${s.color}"></div><div class="bd"><small>${b.lec}</small><b>${b.title}</b><div class="tg">${tags.map(t => `<i>${t}</i>`).join('')}</div><em>${b.pages.length + 1} pages${d && d.q ? ' · quiz ' + d.q[0] + '/' + d.q[1] : ''}</em></div>${ring(p)}</button>`;
    }
    h += '</div></section>';
  }
  h += `<p class="foot">${MODULE.note}</p>`;
  $('#libin').innerHTML = h;
}

/* ----- book ----- */
let paused = false, pf = null, flipping = false, ticks = [], disposers = [], mode = '', lastW = 0, lastH = 0, at = 0, cur = null, PAGES = [];
const wrap = $('#bookwrap'), stage = $('#stage');
function dims(){
  const W = stage.clientWidth, H = stage.clientHeight - 20, wide = W >= 900 && H >= 500;
  let pw, ph;
  if (wide){ ph = Math.min(H, 940); pw = ph * .72; const mx = (W - 150) / 2; if (pw > mx){ pw = mx; ph = Math.min(H, pw / .66); } }
  else { pw = Math.min(W - 6, 640); ph = Math.max(H, 260); }
  return {pw: Math.floor(pw), ph: Math.floor(ph), mode: wide ? 'spread' : 'single'};
}
function unmount(){ disposers.forEach(f => { try { f(); } catch (e){} }); disposers = []; ticks = []; if (pf){ pf.destroy(); pf = null; } wrap.innerHTML = ''; }
function mount(){
  unmount();
  const d = dims(); mode = d.mode; lastW = stage.clientWidth; lastH = stage.clientHeight;
  document.body.classList.toggle('single', mode === 'single');
  wrap.innerHTML = '<div class="book" id="book"></div>';
  const book = wrap.firstChild, bw = mode === 'spread' ? d.pw * 2 : d.pw, secs = [...cur.tpl.content.cloneNode(true).querySelectorAll('section.page')];
  const nx = BOOKS[BOOKS.indexOf(cur) + 1];
  const cover = document.createElement('section'); cover.className = 'page'; cover.dataset.p = cur.subj + ' · ' + cur.lec;
  cover.innerHTML = `<div class="cover"><div class="kick">${MODULE.kicker}</div><h1>${cur.title}</h1><p class="hand">${cur.subj} · ${cur.lec}</p><ul class="toc" id="toc"></ul><div class="note"><b>How to use it.</b> Drag a page corner or swipe to turn. Every blue-labelled box is live: tap, drag or slide it. Turn on <b>Sound</b> to hear the figures that breathe.</div></div>`;
  secs.unshift(cover);
  if (secs.length % 2){ const end = document.createElement('section'); end.className = 'page'; end.dataset.p = 'End of the lecture'; end.innerHTML = `<div class="endp"><div class="kick">End of the lecture</div><h1>Well done.</h1><p>Your place and your quiz score are saved.</p><div class="row" style="justify-content:center">${nx ? `<button class="btn" data-open="${nx.id}">Next: ${nx.title}</button>` : ''}<button class="btn gh" data-act="home">Back to the library</button></div></div>`; secs.push(end); }
  PAGES = secs.map((s, i) => [i ? (s.dataset.t || 'End') : 'Contents', s.dataset.g || '']);
  secs.forEach((s, i) => { s.classList.add(i % 2 ? 'pr' : 'pl'); const pin = document.createElement('div'); pin.className = 'pin'; pin.innerHTML = `<div class="rh"><span>${s.dataset.p || ''}</span><span>${cur.short}</span></div>`; while (s.firstChild) pin.appendChild(s.firstChild); pin.insertAdjacentHTML('beforeend', `<span class="pno">${i + 1}</span>`); s.appendChild(pin); book.appendChild(s); });
  book.style.width = bw + 'px'; book.style.height = d.ph + 'px'; book.style.setProperty('--pw', d.pw + 'px'); book.style.setProperty('--ph', d.ph + 'px'); stage.style.setProperty('--bw', bw + 'px');
  const toc = $('#toc', book), rd = Prog.book(cur.id).r;
  PAGES.forEach((p, i) => { if (!i || !secs[i].dataset.t) return; const li = document.createElement('li'); li.innerHTML = `<button data-go="${i}"><b>${i + 1}</b><span>${p[0]}${p[1] ? `<i class="tag">${p[1]}</i>` : ''}</span>${rd.includes(i) ? '<em>read</em>' : ''}</button>`; toc.appendChild(li); });
  $$('[data-rv]', book).forEach(e => { e.classList.add('hid'); e.onclick = () => e.classList.toggle('hid'); });
  at = Math.min(at, PAGES.length - 1);
  pf = FlipBook(book, $$('.page', book), {pw: d.pw, ph: d.ph, mode, start: at, time: 600, onflip: i => { at = i; upd(); }, onstate: s => { flipping = s; }});
  at = pf.index;
  $$('[data-ix]', book).forEach(el => { const f = IX[el.dataset.ix]; if (!f) return; let t; try { t = f(el); } catch (e){ console.warn('figure failed', el.dataset.ix, e); return; } if (typeof t === 'function') ticks.push([el, t]); else if (t && t.tick){ ticks.push([el, t.tick]); if (t.dispose) disposers.push(t.dispose); } });
  flipping = false; upd();
}
function upd(){
  const n = PAGES.length, L = mode === 'spread' ? at - at % 2 : at, st = mode === 'spread' ? 2 : 1;
  $('#ind').textContent = mode === 'spread' ? `pp. ${L + 1}–${Math.min(L + 2, n)} of ${n}` : `p. ${at + 1} of ${n}`;
  $('#prog').style.width = Math.round((L + st) / n * 100) + '%';
  $('#mmid').textContent = PAGES[at][0] + ' · p. ' + (at + 1);
  $$('[data-act=prev]').forEach(b => b.disabled = L <= 0); $$('[data-act=next]').forEach(b => b.disabled = L + st >= n);
  for (let i = L; i < L + st && i < n; i++) Prog.read(cur.id, i);
  Prog.at(cur.id, L);
}
function goTo(i){ if (!pf) return; closeOv(); const L = mode === 'spread' ? i - i % 2 : i, st = mode === 'spread' ? 2 : 1; if (L === at) return; if (L === at + st) pf.next(); else if (L === at - st) pf.prev(); else pf.jump(L); }
function closeOv(){ $$('.ov').forEach(o => o.hidden = true); }
function openBook(id, keep){
  const b = byId(id); if (!b) return home();
  if (b.tpl.content.querySelector('[data-ix=chest],[data-3d]') && !window.THREE && !b._tried){ b._tried = 1; const s = document.createElement('script'); s.src = 'three.min.js'; s.onload = s.onerror = () => openBook(id, keep); document.head.appendChild(s); return; }
  cur = b; at = keep ? at : (Prog.data.books[id] ? Prog.data.books[id].last || 0 : 0);
  lib.hidden = true; app.hidden = false; $('#bsub').textContent = b.subj + ' · ' + b.lec + ' · ' + b.title;
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e){}
  mount();
}
function home(){
  unmount(); cur = null; app.hidden = true; lib.hidden = false; document.body.classList.remove('single'); paintLib();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e){}
}
document.addEventListener('ixdone', e => { if (cur) Prog.quiz(cur.id, e.detail.r, e.detail.n); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o){ closeOv(); at = 0; return openBook(o.dataset.open); }
  const g = e.target.closest('[data-go]'); if (g) return goTo(+g.dataset.go);
  const b = e.target.closest('[data-act]'); if (!b){ if (e.target.classList.contains('ov')) closeOv(); return; }
  const a = b.dataset.act;
  if (a === 'next' && pf) pf.next(); else if (a === 'prev' && pf) pf.prev();
  else if (a === 'sound') b.classList.toggle('on', Snd.toggle());
  else if (a === 'home') { closeOv(); home(); }
  else if (a === 'toc'){ $('#ovl').innerHTML = PAGES.map((p, i) => `<li><button data-go="${i}"><b>${i + 1}</b><span>${p[0]}</span><em>${p[1]}</em></button></li>`).join(''); $('#ov').hidden = false; }
  else if (a === 'acct'){ paintAcct(); $('#ovacct').hidden = false; }
  else if (a === 'signin') Sync.signIn(); else if (a === 'signout') Sync.signOut();
  else if (a === 'close') closeOv();
});
document.addEventListener('keydown', e => { if (paused || e.target.tagName === 'INPUT') return; if (e.key === 'Escape') closeOv(); if (!pf) return; if (e.key === 'ArrowRight') pf.next(); if (e.key === 'ArrowLeft') pf.prev(); });
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => {
  if (!cur) return; const W = stage.clientWidth, H = stage.clientHeight, d = dims();
  if (d.mode !== mode || Math.abs(W - lastW) > 24 || Math.abs(H - lastH) > lastH * .14) mount();   // a phone's sliding toolbar never rebuilds the page
}, 220); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && byId(id)){ if (!cur || cur.id !== id){ at = 0; openBook(id); } } else if (cur) home(); });

let lastT = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  if (cur && !flipping && !paused) for (const [el, f] of ticks){ if (el.offsetParent !== null) f(dt, t / 1000); }   // figures rest while a page is turning
  Snd.flush();
}
function start(){
  Prog.load(); Prog.subs.push(() => { if (!cur && !paused) paintLib(); }); paintAcct();
  const id = location.hash.slice(1);
  if (id && byId(id)) openBook(id); else home();
  if (['qb', 'mist', 'cards', 'search', 'perf'].includes(id)){ try { history.replaceState(null, '', location.pathname + location.search); } catch (e){} openTool(id); }
  requestAnimationFrame(frame); Sync.init();
}

/* ---------- study tools: question bank and exams, mistakes, flashcards, search, performance, XP ---------- */

/* ----- the extra progress kept next to pages and quiz scores ----- */
const PX = () => { const d = Prog.data; d.qb = d.qb || {}; d.fg = d.fg || {}; d.fc = d.fc || {}; d.ex = d.ex || []; d.d = d.d || []; return d; };
(() => {
  const save0 = Prog.save.bind(Prog), merge0 = Prog.merge.bind(Prog);
  Prog.save = function(){ const d = PX(), k = dayKey(); if (!d.d.includes(k)){ d.d.push(k); d.d = d.d.slice(-120); } save0(); };
  Prog.merge = function(R){
    let ch = merge0(R); if (!R) return ch; const L = PX();
    for (const k in R.qb || {}){ const r = R.qb[k], l = L.qb[k]; if (!l || r[0] > l[0] || (r[0] === l[0] && r[3] > l[3])){ if (!l || l.join() !== r.join()){ L.qb[k] = r; ch = true; } } }
    for (const k in R.fg || {}){ const r = R.fg[k], l = L.fg[k]; if (l === undefined || Math.abs(r) > Math.abs(l)){ if (l !== r){ L.fg[k] = r; ch = true; } } }
    for (const k in R.fc || {}){ const r = R.fc[k], l = L.fc[k]; if (!l || r[4] > l[4]){ if (!l || l.join() !== r.join()){ L.fc[k] = r; ch = true; } } }
    const have = new Set(L.ex.map(e => e[0])); for (const e of R.ex || []) if (!have.has(e[0])){ L.ex.push(e); ch = true; }
    L.ex.sort((a, b) => a[0] - b[0]); if (L.ex.length > 40) L.ex = L.ex.slice(-40);
    const ds = new Set(L.d); for (const x of R.d || []) if (!ds.has(x)){ ds.add(x); ch = true; } L.d = [...ds].sort().slice(-120);
    if (ch){ try { localStorage.setItem(Prog.key, JSON.stringify(Prog.data)); } catch (e){} }
    return ch;
  };
})();

/* ----- XP: one number for the leaderboard, built only from things that cannot be farmed ----- */
function xpOf(d = PX()){
  let pg = 0, fin = 0, qz = 0, qc = 0, fc = 0, fm = 0;
  for (const b of BOOKS){ const x = d.books[b.id]; if (!x) continue; const n = (x.r || []).length; pg += n; if (n >= b.pages.length + 1) fin++; if (x.q) qz += x.q[0]; }
  for (const k in d.qb || {}) if (QM[k] && d.qb[k][1] > 0) qc++;
  for (const k in d.fc || {}){ const c = d.fc[k]; if (!CM[k]) continue; if (c[3] > 0) fc++; if (c[1] >= 7) fm++; }
  return {xp: pg + 10 * fin + 3 * qz + 5 * qc + fc + 2 * fm, pg, fin, qz, qc, fc, fm};
}
function streak(d = PX()){
  const s = new Set(d.d); let n = 0, t = Date.now(); if (!s.has(dayKey(t))) t -= 864e5;
  while (s.has(dayKey(t))){ n++; t -= 864e5; } return n;
}
/* weeks run Saturday to Friday, like the university week */
function weekId(t = Date.now()){ const n = new Date(t), d = new Date(n.getFullYear(), n.getMonth(), n.getDate()); d.setDate(d.getDate() - (d.getDay() + 1) % 7); return 's' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }

    if (base == null || base > tot) base = tot;
    try { localStorage.setItem('helpers.wk', JSON.stringify({id: wk, base})); } catch (e){}
    return {me, all, tot, wk, base, wxp: tot - base};
  },
  /* called after each cloud save: the public board row holds only the username and the numbers */
  write(c){

      (perfOpen === o.s.name ? o.s.lectures.filter(l => byId(l.id)).map(l => { const qs = QB.filter(q => q.b === l.id), u = qs.filter(q => d.qb[q.id]), r = u.filter(q => d.qb[q.id][2] === 1).length; return `<tr class="t-lr"><td>${l.lec} · ${l.title}</td><td class="n">${u.length}/${qs.length}</td><td class="w">${bar(pct(u.length, qs.length), '#9cc2ff')}</td><td class="n">${u.length ? pct(r, u.length) + '%' : '–'}</td><td class="w">${u.length ? bar(pct(r, u.length), pct(r, u.length) >= 65 ? '#1e9e62' : pct(r, u.length) >= 45 ? '#e0a422' : '#d64545') : ''}</td></tr>`; }).join('') : '')).join('')}</table></section>
   <section class="t-card"><h3>Weakest lectures</h3>${weak.length ? weak.map(o => `<div class="t-weak"><span>${o.b.short} · ${o.b.title}</span><b>${pct(o.r, o.n)}%</b><button class="lnk" data-retry="${o.b.id}" data-all-q="1">Practise</button></div>`).join('') : '<p class="t-hint">Answer at least three questions from a lecture to see it here.</p>'}</section>
   <section class="t-card"><h3>Last four weeks</h3><div class="t-cal">${days.map(k => `<i class="${act.has(k) ? 'on' : ''}" title="${k}"></i>`).join('')}</div><p class="t-hint">A filled square is a day you studied. ${streak(d) ? 'Current streak: ' + streak(d) + ' day' + (streak(d) > 1 ? 's' : '') + '.' : 'Study today to start a streak.'}</p></section>
   <section class="t-card wide"><h3>How XP is counted</h3><p class="t-hint" style="margin:0">1 per page read · 10 per lecture finished · 3 per correct answer in your best lecture quiz · 5 per bank question you have ever answered correctly · 1 per flashcard reviewed · 2 more once a card is learnt (interval of a week or more). Repeating the same questions or pages does not add more, so the leaderboard rewards covering the material.</p>
    <p class="t-hint">Your XP: <b>${x.pg}</b> pages · <b>${x.fin}</b> lectures finished · <b>${x.qz}</b> quiz points · <b>${x.qc}</b> questions mastered · <b>${x.fc}</b> cards reviewed · <b>${x.fm}</b> learnt = <b>${x.xp} XP</b>.</p>
    <div class="t-acts"><a class="btn gh" href="../board/" style="text-decoration:none">Open the leaderboard</a><button class="btn gh" data-t="reset">Reset question bank history</button></div></section></div>`;
}

/* ----- events ----- */
function openBookAt(id, p){ closeTool(); at = p || 0; openBook(id, true); }
TBOX.addEventListener('click', e => {
  const t = e.target;
  const sx = t.closest('[data-sx]'); if (sx && X){ e.stopPropagation(); const it = X.items[X.at], k = +sx.dataset.sx; it.st = it.st.includes(k) ? it.st.filter(x => x !== k) : it.st.concat(k); if (it.sel === k && it.st.includes(k)) it.sel = null; return exDraw(); }
  const op = t.closest('[data-opt]'); if (op && X && Tools.view === 'exam'){ const it = X.items[X.at]; if (X.review || (X.tutor && it.sub)) return; const k = +op.dataset.opt; it.sel = k; it.st = it.st.filter(x => x !== k); return exDraw(); }
  const qi = t.closest('[data-qi]'); if (qi) return exGo(+qi.dataset.qi);
  const xb = t.closest('[data-x]'); if (xb && X){
    const a = xb.dataset.x, it = X.items[X.at];
    if (a === 'nav'){ X.nav = !X.nav; return exDraw(); }
    if (a === 'flag'){ it.fl = !it.fl; return exDraw(); }
    if (a === 'prev') return exGo(X.at - 1);
    if (a === 'submit'){ if (it.sel == null) return; it.sub = true; return exDraw(); }
    if (a === 'next'){ if (X.at === X.items.length - 1){ if (X.review){ Tools.view = 'results'; return drawTool(); } return exConfirmEnd(); } return exGo(X.at + 1); }
    if (a === 'end') return exConfirmEnd();
    if (a === 'results'){ Tools.view = 'results'; return drawTool(); }
  }
  const tv = t.closest('[data-tv]'); if (tv){ FC = null; Tools.view = tv.dataset.tv; drawTool(); TBOX.scrollTop = 0; return; }
  const ob = t.closest('[data-ob]'); if (ob) return openBookAt(ob.dataset.ob, 0);
  const obp = t.closest('[data-obp]'); if (obp){ const [b, p] = obp.dataset.obp.split(':'); return openBookAt(b, +p); }
  const pl = t.closest('[data-pool]'); if (pl){ QS.pool = pl.dataset.pool; saveQS(); return drawTool(); }
  const sc = t.closest('[data-sec]'); if (sc){ QS.sec = +sc.dataset.sec; saveQS(); return drawTool(); }
  const lc = t.closest('[data-lec]'); if (lc){ const id = lc.dataset.lec; QS.off = QS.off.includes(id) ? QS.off.filter(x => x !== id) : QS.off.concat(id); saveQS(); return drawTool(); }
  const al = t.closest('[data-all]'); if (al){ QS.off = al.dataset.all === '1' ? [] : BOOKS.map(b => b.id); saveQS(); return drawTool(); }
  const fa = t.closest('[data-fall]'); if (fa){ FS.off = fa.dataset.fall === '1' ? [] : BOOKS.map(b => b.id); saveFS(); return drawTool(); }
  const nn = t.closest('[data-newn]'); if (nn){ FS.newN = +nn.dataset.newn; saveFS(); return drawTool(); }
  const mt = t.closest('[data-mt]'); if (mt){ mistTab = mt.dataset.mt; return drawTool(); }
  const uf = t.closest('[data-unflag]'); if (uf){ PX().fg[uf.dataset.unflag] = -Date.now(); Prog.save(); return drawTool(); }
  const po = t.closest('[data-po]'); if (po){ perfOpen = perfOpen === po.dataset.po ? '' : po.dataset.po; return drawTool(); }
  const rt = t.closest('[data-retry]'); if (rt){
    const d = PX(), b = rt.dataset.retry;
    let ids = rt.dataset.allQ ? QB.filter(q => q.b === b).map(q => q.id) : (mistTab === 'wrong' ? QB.filter(q => d.qb[q.id] && d.qb[q.id][2] === 0) : QB.filter(q => d.fg[q.id] > 0)).filter(q => b === 'all' || q.b === b).map(q => q.id);
    if (ids.length) startExam(shuffle(ids), {tutor: true, timed: false}); return;
  }
  const rq = t.closest('[data-rq]'); if (rq && X){ X.review = true; Tools.view = 'exam'; X.at = +rq.dataset.rq; return exDraw(); }
  const g = t.closest('[data-g]'); if (g) return grade(+g.dataset.g);
  const act = t.closest('[data-t]'); if (!act) return;
  const a = act.dataset.t;
  if (a === 'close') return closeTool();
  if (a === 'start'){ const av = qbAvail(); if (!av.length) return; const d = PX(); const pick = shuffle(av).sort((p, q) => (d.qb[p.id] ? 1 : 0) - (d.qb[q.id] ? 1 : 0)).slice(0, Math.min(QS.n, av.length)).map(q => q.id); return startExam(shuffle(pick)); }
  if (a === 'resume'){ try { X = JSON.parse(localStorage.getItem(EX_KEY)); } catch (e){ X = null; } if (X){ X.nav = innerWidth >= 900; Tools.view = 'exam'; runClock(); exDraw(); } return; }
  if (a === 'discard'){ try { localStorage.removeItem(EX_KEY); } catch (e){} return drawTool(); }
  if (a === 'review'){ X.review = true; X.at = 0; Tools.view = 'exam'; return exDraw(); }
  if (a === 'retry'){ const ids = X.items.filter(i => i.sel !== QM[i.id].a).map(i => i.id); return startExam(shuffle(ids), {tutor: true, timed: false}); }
  if (a === 'study') return fcStart(false);
  if (a === 'cram') return fcStart(true);
  if (a === 'flip'){ if (FC && !FC.flip){ FC.flip = true; cardDraw(); } return; }
  if (a === 'srchq'){ const ids = srchQs(srchTerms()).map(q => q.id); if (ids.length) startExam(shuffle(ids), {tutor: true, timed: false}); return; }
  if (a === 'reset'){ if (act.dataset.sure !== '1'){ act.dataset.sure = '1'; act.textContent = 'Tap again to reset: answers, marks and test history'; return; } const d = PX(); d.qb = {}; d.fg = {}; d.ex = []; Prog.save(); return drawTool(); }
});
TBOX.addEventListener('contextmenu', e => { const op = e.target.closest('[data-opt]'); if (!op || !X || Tools.view !== 'exam' || X.review) return; const it = X.items[X.at]; if (X.tutor && it.sub) return; e.preventDefault(); const k = +op.dataset.opt; it.st = it.st.includes(k) ? it.st.filter(x => x !== k) : it.st.concat(k); if (it.sel === k) it.sel = null; exDraw(); });
TBOX.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.qs){ QS[t.dataset.qs] = t.checked; saveQS(); return drawTool(); }
  if (t.dataset.subj != null){ const s = MODULE.subjects.find(x => x.name === t.dataset.subj), ids = s.lectures.map(l => l.id); QS.off = t.checked ? QS.off.filter(x => !ids.includes(x)) : [...new Set(QS.off.concat(ids))]; saveQS(); return drawTool(); }
  if (t.dataset.fb){ const id = t.dataset.fb; FS.off = t.checked ? FS.off.filter(x => x !== id) : FS.off.concat(id); saveFS(); return drawTool(); }
});
TBOX.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.qn != null){ QS.n = +t.value; saveQS(); const o = $('#qnout'); if (o) o.textContent = t.value; const h = t.closest('.t-start').querySelector('.t-hint'); if (h && QS.timed) h.firstChild.textContent = `Block time ${mmss(QS.n * QS.sec)}.`; return; }
  if (t.id === 'tq'){ srchQ = t.value; clearTimeout(t._d); t._d = setTimeout(() => { const r = $('#tres'); if (r) r.innerHTML = srchRes(); }, 140); }
});
document.addEventListener('keydown', e => {
  if (!Tools.on) return;
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'range'){ if (e.key === 'Escape'){ e.target.blur(); } return; }
  if (Tools.view === 'exam' && X && !document.querySelector('body > .ov')){
    const it = X.items[X.at], k = e.key.toLowerCase(), q = QM[it.id];
    if (/^[a-h]$/.test(k) && LET.indexOf(k.toUpperCase()) < q.o.length && !X.review && !(X.tutor && it.sub)){ it.sel = LET.indexOf(k.toUpperCase()); return exDraw(); }
    if (/^[1-8]$/.test(k) && +k <= q.o.length && !X.review && !(X.tutor && it.sub)){ it.sel = +k - 1; return exDraw(); }
    if (k === 'arrowright' || k === 'n'){ e.preventDefault(); return X.at < X.items.length - 1 ? exGo(X.at + 1) : null; }
    if (k === 'arrowleft' || k === 'p'){ e.preventDefault(); return exGo(X.at - 1); }
    if (k === 'm' && !X.review){ it.fl = !it.fl; return exDraw(); }
    if (k === 'enter'){ e.preventDefault(); if (!X.review && X.tutor && !it.sub){ if (it.sel != null){ it.sub = true; exDraw(); } return; } return X.at < X.items.length - 1 ? exGo(X.at + 1) : (X.review ? (Tools.view = 'results', drawTool()) : exConfirmEnd()); }
    return;
  }
  if (Tools.view === 'card' && FC){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); if (!FC.flip){ FC.flip = true; cardDraw(); } else if (!FC.cram) grade(2); else grade(2); return; }
    if (FC.flip && /^[1-4]$/.test(e.key)){ const g = +e.key - 1; if (FC.cram) grade(g === 0 ? 0 : 2); else grade(g); }
    return;
  }
  if (e.key === 'Escape') closeTool();
});
window.addEventListener('beforeunload', () => { if (X && !X.done) saveExam(); });

/* the strip of tools under the library heading */
function toolStrip(){
  const d = PX(), wrong = QB.filter(q => d.qb[q.id] && d.qb[q.id][2] === 0).length, fcn = fcCounts(BOOKS.map(b => b.id)), used = QB.filter(q => d.qb[q.id]).length, x = xpOf(d), st = streak(d);
  const it = [['qb', ICO.q, 'Question bank', used ? `${used} of ${QB.length} used` : `${QB.length} questions`], ['mist', ICO.x, 'Mistakes', wrong ? wrong + ' to retry' : 'none yet'], ['cards', ICO.cards, 'Flashcards', fcn.due ? fcn.due + ' due today' : CARDS.length + ' cards'], ['search', ICO.find, 'Search', 'every page'], ['perf', ICO.chart, 'Performance', x.xp + ' XP' + (st ? ' · ' + st + '-day streak' : '')]];
  return `<div class="tstrip">${it.map(t => `<button data-tool="${t[0]}">${t[1]}<b>${t[2]}</b><small>${t[3]}</small></button>`).join('')}<a href="../board/">${ICO.cup}<b>Leaderboard</b><small>this week</small></a></div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b){ closeOv(); openTool(b.dataset.tool); } });

/* start once every part of the page is defined */
if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]).then(start); else start();

</script>
