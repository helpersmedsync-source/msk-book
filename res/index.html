<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Interactive Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&display=swap">
<style>:root{
  --navy:#0b1f45;--navy-2:#163a73;--blue:#2e86de;--sky:#9cc2ff;--red:#d64545;--green:#1e9e62;--amber:#e0a422;--hl:#ffe793;
  --paper:#fbfaf4;--paper-2:#f3f0e4;--line:#e3ded0;--ink:#232a36;--ink-2:#5b6375;--edge:#b8b3a6;
  --f-head:"Poppins",system-ui,sans-serif;--f-body:"Lato",system-ui,sans-serif;--f-hand:"Caveat",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{overflow:hidden;color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;background:#3a271b}
/* the desk texture sits on its own layer so it is painted once, never while a page turns */
.desk{position:fixed;inset:0;z-index:-1;transform:translateZ(0);will-change:transform;contain:strict;
  background:
    radial-gradient(120% 90% at 50% 38%,rgba(255,240,215,.10),transparent 62%),
    repeating-linear-gradient(91deg,rgba(0,0,0,.045) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(89deg,rgba(255,255,255,.02) 0 3px,transparent 3px 17px),
    linear-gradient(180deg,#4a3324,#3a271b)}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;padding:8px 14px 0}
.bar{flex:none;display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:12px;padding:9px 14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.bar .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2e86de,#9cc2ff);display:grid;place-items:center;flex:none}
.bar .ttl{font:700 15px var(--f-head);white-space:nowrap}
.bar .sub{font:500 12px var(--f-head);color:#b9c7e6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar .sp{flex:1}
.bar .ind{font:600 12px var(--f-head);color:#dfe8fb;white-space:nowrap}
.bar .prog{width:70px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.bar .prog i{display:block;height:100%;width:0;background:#ffc928;transition:width .3s}
.ib{background:none;border:0;display:flex;align-items:center;gap:6px;font:600 12.5px var(--f-head);padding:6px 8px;border-radius:8px;white-space:nowrap}
.ib:hover{background:rgba(255,255,255,.1)}
.ib svg{width:17px;height:17px}
.ib.on{background:#ffc928;color:var(--navy)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.bookwrap{position:relative}
.bookwrap::before{content:"";position:absolute;inset:-9px -12px -11px;border-radius:12px;background:linear-gradient(90deg,#071634,var(--navy) 6%,var(--navy) 94%,#071634);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.book{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.page{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);display:none}
.page.show{display:block}
.fl-clip{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;z-index:5;display:none;pointer-events:none;will-change:transform}
.fl-inner{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.fl-back{position:absolute;left:0;top:0;overflow:hidden;will-change:transform;background:var(--paper)}
.fl-back.blank{background:linear-gradient(90deg,#e9e4d4,#f6f3e9 35%,#ece7d8)}
.fl-back .page{left:0!important}
.fl-s1,.fl-s2{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;will-change:transform,opacity}
.fl-s1{background:linear-gradient(to right,rgba(0,0,0,0),rgba(0,0,0,.05) 50%,rgba(0,0,0,.24) 95%,rgba(255,255,255,.3))}
.fl-s2{background:linear-gradient(to right,rgba(0,0,0,.36),rgba(0,0,0,.1) 40%,rgba(0,0,0,0))}
.fl-ush{position:absolute;top:0;overflow:hidden;z-index:4;display:none;pointer-events:none}
.turn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:64px;border:0;border-radius:10px;background:rgba(20,12,6,.55);color:#fff;display:grid;place-items:center;z-index:5}
.turn svg{width:22px;height:22px}
.turn.prev{left:max(4px,calc(50% - var(--bw,600px)/2 - 64px))}.turn.next{right:max(4px,calc(50% - var(--bw,600px)/2 - 64px))}
.turn:disabled{opacity:.25}
.mnav{flex:none;display:none;align-items:center;gap:8px;padding:6px 2px 8px;color:#fff}
.mnav button{width:44px;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.mnav .mid{flex:1;text-align:center;font:600 12px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.single .mnav{display:flex}body.single .turn{display:none}body.single .bar .sub,body.single .bar .prog,body.single .ib .lb{display:none}
body.single .app{padding:6px 6px 0}body.single .bookwrap::before{inset:-4px -3px -5px}

/* pages */
.page{background-color:var(--paper);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.page.pl{background:linear-gradient(to left,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(90deg,var(--paper-2),var(--paper) 3%)}
.page.pr{background:linear-gradient(to right,rgba(0,0,0,.13),rgba(0,0,0,.03) 4%,transparent 9%),linear-gradient(270deg,var(--paper-2),var(--paper) 3%)}
.pin{position:absolute;inset:0;padding:5.4% 7% 7.4%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  font-size:clamp(11.5px,calc(var(--pw,520px)*.0255),18px);line-height:1.45;scrollbar-width:thin}
.rh{display:flex;justify-content:space-between;gap:1em;font:600 .56em var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:#8c92a2;border-bottom:1px solid var(--line);padding-bottom:.8em;margin-bottom:1em;white-space:nowrap}
.rh span{overflow:hidden;text-overflow:ellipsis}
.pno{position:absolute;bottom:2.4%;font:600 .68em var(--f-head);color:#8c92a2}.pl .pno{left:7%}.pr .pno{right:7%}
.part{display:flex;gap:.8em;align-items:center;background:var(--navy);color:#fff;border-radius:.6em;padding:.7em 1em;margin:0 0 .8em}
.part .pn{flex:none;width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;background:var(--blue);font:700 .95em var(--f-head);box-shadow:0 0 0 2px #fff inset}
.part small{display:block;font:600 .56em var(--f-head);letter-spacing:.16em;opacity:.8}
.part b{display:block;font:700 1.12em/1.2 var(--f-head)}
.part span{display:block;font-size:.74em;opacity:.85;line-height:1.3}
h3{display:flex;align-items:center;gap:.5em;margin:.7em 0 .35em;font:700 1.04em/1.25 var(--f-head);color:var(--navy)}
h3 i{flex:none;font:700 .62em var(--f-head);font-style:normal;background:var(--red);color:#fff;border-radius:50%;width:2.1em;height:2.1em;display:grid;place-items:center}
p{margin:.3em 0}
ul{margin:.25em 0;padding-left:1.15em}li{margin:.18em 0}
mark{background:var(--hl);color:inherit;padding:0 .14em;border-radius:.18em}
.hand{font:700 1.25em var(--f-hand);color:var(--navy-2)}
.note{background:#fff7d6;border-left:.25em solid var(--amber);border-radius:.4em;padding:.45em .7em;font-size:.86em;margin:.5em 0}

/* interactive cards */
.ix{position:relative;background:#fff;border:1px solid var(--line);border-radius:.8em;padding:.6em;margin:.4em 0 .5em;box-shadow:0 1px 0 rgba(0,0,0,.03);touch-action:pan-y}
.ix .cap{display:flex;align-items:center;justify-content:space-between;gap:.5em;font:700 .6em var(--f-head);letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:.4em}
.ix .cap em{font-style:normal;color:#8c92a2;letter-spacing:.06em;text-transform:none;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.35em;margin:.35em 0}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:.28em .8em;font:600 .74em var(--f-head);color:var(--ink);transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.lit{background:#ffedd8;border-color:#f08a24;color:#a14a00}
.chip.lit2{background:#efe4ff;border-color:#8a55e0;color:#5a2bb0}
.chip.lit3{background:#dff5ea;border-color:var(--green);color:#11694a}
.chip.sm{font-size:.66em;padding:.2em .65em}
.row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;margin-top:.45em}
.read div{background:var(--paper-2);border-radius:.5em;padding:.35em .5em}
.read small{display:block;font:600 .56em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:#8c92a2}
.read b{font:700 .95em var(--f-head);color:var(--navy);font-variant-numeric:tabular-nums}
.lst{list-style:none;padding:0;margin:.3em 0 0;display:grid;gap:.1em;text-align:center;font:600 .78em var(--f-head);color:#b3b8c6}
.lst li{margin:0;transition:all .2s}.lst li.on{color:var(--navy);font-size:1.18em}
.lst li small{font-weight:500;opacity:.8}
.book canvas.trace{display:block;width:100%;height:5.2em;background:linear-gradient(#f7f9ff,#eef3ff);border-radius:.5em}
svg.lungs{display:block;width:62%;margin:0 auto}
input[type=range]{width:100%;accent-color:var(--blue);margin:.2em 0;height:1.6em}
.sl{display:flex;justify-content:space-between;font:600 .66em var(--f-head);color:var(--ink-2)}
.msg{font-size:.84em;background:var(--paper-2);border-radius:.5em;padding:.45em .65em;margin-top:.4em;min-height:3.2em}
.msg b{color:var(--navy)}

/* 3D chest */
.x3{background:#04060b;border-color:#111a2c;color:#dfe8fb;padding:0;overflow:hidden}
.x3 .cap{position:absolute;left:.9em;top:.8em;right:.9em;color:#9cc2ff;z-index:2;pointer-events:none}
.x3 .cap em{color:#7f8db0}
.book .x3 canvas{display:block;width:100%;aspect-ratio:1/.98;touch-action:none;cursor:grab}
.x3 canvas:active{cursor:grabbing}
.x3 .lab{position:absolute;left:0;top:0;font:600 .58em var(--f-head);color:#ffd9a8;background:rgba(10,14,24,.72);border:1px solid rgba(255,170,90,.5);border-radius:99px;padding:.1em .6em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;will-change:transform}
.x3 .lab.v{border-color:rgba(170,130,255,.6);color:#e0d2ff}.x3 .lab.g{border-color:rgba(90,220,160,.6);color:#c9f5df}
.x3 .hud{position:absolute;left:.7em;right:.7em;bottom:.6em;display:flex;justify-content:space-between;align-items:flex-end;gap:.5em;pointer-events:none}
.x3 .hud .ph{font:700 1em var(--f-head)}.x3 .hud .ph small{display:block;font:600 .62em var(--f-head);color:#9fb0d4;letter-spacing:.06em}
.x3 .hud .pr{text-align:right;font:700 1.3em var(--f-head);font-variant-numeric:tabular-nums}.x3 .hud .pr small{display:block;font:600 .48em var(--f-head);color:#9fb0d4;letter-spacing:.08em;text-transform:uppercase}
.x3 .nogl{display:none;padding:3em 1.2em;text-align:center;font-size:.85em;color:#9fb0d4}
.book .x3.fail canvas{display:none}.x3.fail .nogl{display:block}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:.28em .85em;font:600 .74em var(--f-head)}
.seg button.on{background:var(--navy);color:#fff}

/* recall table */
table.rt{width:100%;border-collapse:separate;border-spacing:.25em;font-size:.8em}
table.rt th{font:700 .8em var(--f-head);color:#fff;background:var(--navy);border-radius:.4em;padding:.35em .4em}
table.rt td{background:var(--paper-2);border-radius:.4em;padding:.35em .5em;vertical-align:middle;position:relative;cursor:pointer;min-height:2.4em}
table.rt td.k{background:none;font:700 .76em var(--f-head);color:var(--ink-2);cursor:default;width:22%}
table.rt td.hid{color:transparent;user-select:none}
table.rt td.hid::after{content:"tap";position:absolute;inset:0;display:grid;place-items:center;font:600 .8em var(--f-head);color:#a7adbb;background:repeating-linear-gradient(135deg,#ece8da 0 6px,#f3f0e4 6px 12px);border-radius:.4em}

/* centres map */
svg.map{display:block;width:100%}
.map .nd{cursor:pointer}
.map .nd rect{fill:#fff;stroke:var(--navy);stroke-width:1.6;transition:all .2s}
.map .nd text{font:700 9.5px var(--f-head);fill:var(--navy);pointer-events:none}
.map .nd.on rect{fill:var(--navy)}.map .nd.on text{fill:#fff}
.map .nd.fire rect{fill:#ffedd8;stroke:#f08a24}
.map .mu rect{fill:#eef3ff;stroke:#9cc2ff;stroke-width:1.2}.map .mu text{font:600 8.5px var(--f-head);fill:var(--navy-2)}
.map .mu.fire rect{fill:#ffedd8;stroke:#f08a24}
.map .ed{fill:none;stroke:#c3c9d6;stroke-width:1.8}
.map .ed.on{stroke:var(--green);stroke-width:2.6;stroke-dasharray:5 6;animation:march .6s linear infinite}
.map .ed.inh.on{stroke:var(--red)}
.map .sg{font:700 10px var(--f-head);fill:#9aa1b1}.map .sg.on{fill:var(--green)}.map .sg.inh.on{fill:var(--red)}
.map .rg{font:700 8px var(--f-head);letter-spacing:.14em;fill:#a7adbb}
@keyframes march{to{stroke-dashoffset:-11}}
.steps{display:flex;align-items:center;gap:.4em;margin-top:.3em}
.steps .dots{flex:1;display:flex;gap:.3em;justify-content:center}
.steps .dots i{width:.55em;height:.55em;border-radius:50%;background:var(--line)}.steps .dots i.on{background:var(--navy)}
.btn[hidden]{display:none}
.btn{border:0;background:var(--navy);color:#fff;border-radius:99px;padding:.3em .9em;font:600 .74em var(--f-head)}
.btn.gh{background:var(--paper-2);color:var(--navy)}

.book canvas.chem{display:block;width:100%;aspect-ratio:1/.62;border-radius:.5em;background:#f7f9ff}
.drive{height:.7em;border-radius:99px;background:var(--paper-2);overflow:hidden;margin-top:.25em}
.drive i{display:block;height:100%;width:20%;background:linear-gradient(90deg,#2e86de,#d64545);border-radius:99px;transition:width .25s}

/* reflex */
.arc{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.3em;align-items:stretch;margin-top:.4em}
.arc .cd{background:var(--paper-2);border-radius:.5em;padding:.4em .5em;font-size:.76em;position:relative;cursor:pointer;min-height:6.5em}
.arc .cd small{display:block;font:700 .72em var(--f-head);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:.2em}
.arc .cd.hid span{visibility:hidden}
.arc .cd.hid::after{content:"tap to reveal";position:absolute;inset:1.6em .3em .3em;display:grid;place-items:center;font:600 .86em var(--f-head);color:#a7adbb;background:repeating-linear-gradient(135deg,#ece8da 0 6px,#f3f0e4 6px 12px);border-radius:.4em}
.arc .ar{align-self:center;color:#a7adbb;font-weight:700}

/* quiz */
.q{margin:.5em 0 .7em}
.q p{font-weight:700;color:var(--navy);margin:0 0 .3em;font-size:.92em}
.q .op{display:grid;grid-template-columns:1fr 1fr;gap:.3em}
.q .op button{border:1.5px solid var(--line);background:#fff;border-radius:.5em;padding:.35em .55em;font-size:.8em;text-align:left}
.q .op button.ok{background:#dff5ea;border-color:var(--green);color:#11694a;font-weight:700}
.q .op button.no{background:#fde4e4;border-color:var(--red);color:#a12525}
.q .why{font-size:.76em;color:var(--ink-2);margin-top:.25em;display:none}.q.done .why{display:block}
.score{font:700 .9em var(--f-head);color:var(--navy);text-align:center;margin-top:.4em}

/* contents */
.cover h1{font:700 1.9em/1.1 var(--f-head);color:var(--navy);margin:.3em 0 .1em}
.cover .kick{font:700 .62em var(--f-head);letter-spacing:.18em;color:var(--blue);text-transform:uppercase}
.toc{list-style:none;padding:0;margin:.6em 0}
.toc li{margin:0;border-bottom:1px dashed var(--line)}
.toc button{display:flex;width:100%;gap:.6em;align-items:baseline;border:0;background:none;padding:.42em 0;text-align:left;font-size:.92em}
.toc button b{font:700 .8em var(--f-head);color:var(--red);width:1.6em}
.toc button span{flex:1}.toc button em{font:600 .72em var(--f-head);font-style:normal;color:#8c92a2}
.toc .tag{font:700 .58em var(--f-head);letter-spacing:.08em;background:#eef3ff;color:var(--navy-2);border-radius:99px;padding:.1em .6em;margin-left:.4em;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(10,8,6,.55);z-index:50;display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.ov .box{background:var(--paper);border-radius:14px;padding:16px 18px;width:min(440px,100%);max-height:86vh;overflow:auto;font-size:15px}
.ov h2{font:700 17px var(--f-head);color:var(--navy);margin:0 0 6px}

.steps[hidden]{display:none}
.ix .cap .seg button{font-size:1.2em;letter-spacing:0;text-transform:none;padding:.25em .8em}
.q .op button{padding:.5em .65em;font-size:.86em}
.q p{font-size:1em;margin-bottom:.5em}
.qbar{display:flex;gap:.3em;justify-content:center;margin:.2em 0 .6em}
.qbar i{width:1.6em;height:.3em;border-radius:99px;background:var(--line)}.qbar i.ok{background:var(--green)}.qbar i.no{background:var(--red)}.qbar i.cur{background:var(--navy)}
.fin{text-align:center;padding:1.2em 0}.fin b{display:block;font:700 2.4em var(--f-head);color:var(--navy)}

/* shared figure pieces */
.stp{list-style:none;counter-reset:s;padding:0;margin:.3em 0;display:grid;gap:.3em;cursor:pointer}
.stp li{counter-increment:s;margin:0;background:var(--paper-2);border-radius:.5em;padding:.4em .6em .4em 2.4em;position:relative;font-size:.86em;transition:opacity .2s}
.stp li::before{content:counter(s);position:absolute;left:.55em;top:.35em;width:1.5em;height:1.5em;border-radius:50%;background:var(--navy);color:#fff;font:700 .78em var(--f-head);display:grid;place-items:center}
.stp li.hid{color:transparent;background:repeating-linear-gradient(135deg,#ece8da 0 6px,#f3f0e4 6px 12px)}
.stp li.hid.nx{outline:2px dashed var(--blue);outline-offset:-2px}.stp li.hid.nx::after{content:"tap for the next step";position:absolute;left:2.6em;top:.4em;color:#8c92a2;font:600 .9em var(--f-head)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:.4em;margin:.4em 0}
.big2 div{background:var(--paper-2);border-radius:.6em;padding:.4em;text-align:center}
.big2 small{display:block;font:600 .64em var(--f-head);letter-spacing:.1em;color:#8c92a2}.big2 b{font:700 1.7em var(--f-head);color:var(--navy)}
.mini{font-size:.82em}.up{color:var(--red);font-weight:700}.dn{color:var(--blue);font-weight:700}
.book canvas.plot{display:block;width:100%;aspect-ratio:1/.6;background:linear-gradient(#f7f9ff,#eef3ff);border-radius:.5em}
[data-for][hidden]{display:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.endp{text-align:center;padding-top:28%}.endp h1{font:700 2em var(--f-head);color:var(--navy);margin:.2em 0}
.toc button em{color:var(--green)}

/* library */
#lib{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
#lib[hidden],#app[hidden]{display:none}
.lbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#libin{max-width:1080px;margin:0 auto;padding:18px 16px 40px;color:#f4efe6}
.hero{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.hero .kick{font:700 11px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:#ffc928}
.hero h1{font:700 clamp(26px,5vw,40px)/1.1 var(--f-head);margin:6px 0}
.hero p{margin:0;color:#d9cfc0;font-size:15px}
.cont{border:0;text-align:left;background:#ffc928;color:var(--navy);border-radius:14px;padding:12px 16px;min-width:230px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.cont small{display:block;font:700 10px var(--f-head);letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.cont b{display:block;font:700 16px var(--f-head)}.cont span{font-size:12.5px}
.subj h2{display:flex;align-items:center;gap:10px;font:700 17px var(--f-head);margin:26px 0 10px}

<template data-book="phy-l1" data-subj="Physiology" data-lec="L1" data-title="Organization and pulmonary function tests" data-short="Physiology L1">
<section class="page" data-t="Pleura and airways" data-g="reveal cards" data-p="Part 01 · Organization of the respiratory system">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Organization of the respiratory system</b><span>Pleura · airways · respiratory unit · respiratory membrane</span></div></div>
  <h3><i>1.1</i>Pleura</h3>
  <ul>
    <li>Each lung is enclosed by a <mark>bilayered serous membrane</mark>, the pleura or pleural sac.</li>
    <li><b>Visceral layer</b> (inner): attached firmly to the surface of the lungs. <b>Parietal layer</b> (outer): attached to the wall of the thoracic cavity.</li>
    <li>The two layers are close but not attached, separated by only <mark>a few milliliters of intrapleural fluid</mark>, which lubricates the surfaces so they slide over each other during breathing.</li>
    <li><mark>Intrapleural pressure (Pip)</mark>, also termed intrathoracic pressure, makes the lungs and thoracic wall move in and out together during normal breathing.</li>
  </ul>
  <h3><i>1.2</i>The airways</h3>
  <p>All the tubes through which air flows between the external environment and the alveoli.</p>
  <div class="ix" data-ix="pick">
    <div class="cap"><span>Live · tap a part</span><em></em></div>
    <div class="chips"><button class="chip" data-v="u">Upper air passages</button><button class="chip" data-v="c">Conducting zone</button><button class="chip" data-v="r">Respiratory zone</button></div>
    <div class="msg" data-for="u"><b>Upper air passages:</b> the nose, pharynx and larynx.</div>
    <div class="msg" data-for="c"><b>Conducting zone</b> (lower air passages): the tracheobronchial tree, from the trachea to the terminal bronchioles.<br><b>Functions:</b> conducts air to the respiratory zone; defensive, due to mucus, cilia and phagocytes; warming of air; adds water vapor to inspired air; phonation.</div>
    <div class="msg" data-for="r"><b>Respiratory zone</b> (lower air passages): respiratory bronchioles and lung alveoli.<br><b>Function:</b> exchange of gases.</div>
  </div>
</section>

<section class="page" data-t="Respiratory unit · pneumocytes" data-g="picker" data-p="Part 01 · Organization of the respiratory system">
  <h3><i>1.3</i>The respiratory unit</h3>
  <p>The <mark>structural and functional unit of the lung</mark>. Exchange of gases occurs only in this part of the respiratory tract.</p>
  <div class="ix" data-ix="steps">
    <div class="cap"><span>Recall · tap each part in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Respiratory bronchioles</li><li>Alveolar ducts (each respiratory bronchiole divides into them)</li><li>Alveolar sacs (each duct enters one; a cluster of alveoli)</li><li>Alveoli: pouches about 0.2 to 0.5 mm in diameter, lined by epithelial cells</li></ol>
  </div>
  <h3><i>1.4</i>Alveolar cells (pneumocytes)</h3>
  <div class="ix" data-ix="pick">
    <div class="cap"><span>Live · compare</span><em></em></div>
    <div class="chips"><button class="chip" data-v="1">Type I</button><button class="chip" data-v="2">Type II</button></div>
    <div class="msg" data-for="1"><b>Type I alveolar cells:</b> squamous epithelial cells forming about <b>95%</b> of the total number of cells. They form the site of gaseous exchange between the alveolus and blood.</div>
    <div class="msg" data-for="2"><b>Type II alveolar cells:</b> cuboidal; about <b>5%</b> of alveolar cells. They secrete alveolar fluid and <b>surfactant</b>.</div>
  </div>
  <h3><i>1.5</i>Pulmonary surfactant</h3>
  <ul style="font-size:.92em">
    <li>A mixture of <mark>phospholipids and protein</mark>.</li>
    <li>It <mark>lowers the surface tension</mark> of the water layer at the alveolar surface: the lungs are easier to expand.</li>
    <li>A deep breath increases its secretion (by stretching the type II cells); its concentration decreases when breaths are small.</li>
    <li>Production in the fetal lung occurs in <mark>late gestation</mark>.</li>
  </ul>
</section>

<section class="page" data-t="Respiratory membrane · function tests" data-g="reveal cards" data-p="Part 01 · Organization of the respiratory system">
  <h3><i>1.6</i>Respiratory membrane</h3>
  <ul>
    <li>The membranous structure through which the exchange of gases occurs. It separates air in the alveoli from blood in the capillary.</li>
    <li>Formed by the <mark>alveolar membrane and capillary membrane</mark>.</li>
    <li>Surface area <mark>70 square meters</mark>; thickness <mark>0.5 micron</mark>.</li>
    <li>Gas exchange occurs by <mark>simple diffusion</mark>.</li>
  </ul>
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Pulmonary function tests</b><span>Tests used to evaluate the functions of the respiratory system</span></div></div>
  <h3><i>2.1</i>Indications and types</h3>
  <div class="ix">
    <div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Indications</small><span>1. Detect lung disease, either obstructive or restrictive. 2. Evaluate the extent and monitor the course of disease. 3. Evaluate treatment with bronchodilators.</span></div>
    <div class="rvc" data-rv><small>Static tests</small><span>Lung volumes (4 volumes) and lung capacities (4 capacities).</span></div>
    <div class="rvc" data-rv><small>Dynamic tests</small><span>Timed vital capacity and maximum breathing capacity.</span></div>
  </div>
</section>

<section class="page" data-t="Lung volumes and capacities" data-g="live spirogram" data-p="Part 02 · Pulmonary function tests">
  <h3><i>2.2</i>The spirogram: tap a volume or capacity</h3>
  <div class="ix" data-ix="spiro">
    <div class="cap"><span>Live · tap a name</span><em>values for a healthy young adult</em></div>
    <canvas class="plot" data-k="cv" style="aspect-ratio:1/.62"></canvas>
    <div class="chips" data-k="vol"><button class="chip sm" data-v="TV">Tidal volume</button><button class="chip sm" data-v="IRV">Inspiratory reserve</button><button class="chip sm" data-v="ERV">Expiratory reserve</button><button class="chip sm" data-v="RV">Residual volume</button></div>
    <div class="chips" data-k="cap2"><button class="chip sm" data-v="IC">Inspiratory capacity</button><button class="chip sm" data-v="FRC">Functional residual capacity</button><button class="chip sm" data-v="VC">Vital capacity</button><button class="chip sm" data-v="TLC">Total lung capacity</button></div>
    <div class="msg" data-k="msg"></div>
  </div>
  <p style="font-size:.9em">All pulmonary volumes and capacities are about <mark>20 to 25 percent less in women</mark> than in men, and greater in large and athletic people than in small and asthenic people.</p>
</section>

<section class="page" data-t="Timed vital capacity" data-g="live curves" data-p="Part 02 · Pulmonary function tests">
  <h3><i>2.3</i>Timed vital capacity (forced expiratory volumes)</h3>
  <ul style="font-size:.92em">
    <li>A measurement of vital capacity in unit time.</li>
    <li>The person inspires maximally, then exhales into the spirometer with maximal expiratory effort, as rapidly and as completely as possible.</li>
    <li>Normally the whole FVC is expelled in <mark>4 seconds</mark>. FEV₁ is <mark>83%</mark>, FEV₂ <mark>93%</mark>, FEV₃ <mark>97%</mark>.</li>
  </ul>
  <div class="ix" data-ix="fev">
    <div class="cap"><span>Live · pick a pattern</span><em>volumes from the lecture figure</em></div>
    <canvas class="plot" data-k="cv" style="aspect-ratio:1/.58"></canvas>
    <div class="row" style="justify-content:center"><div class="seg" data-k="pt"><button class="on" data-v="n">Normal</button><button data-v="o">Obstructive</button><button data-v="r">Restrictive</button></div></div>
    <div class="read"><div><small>FEV₁</small><b data-k="f1">–</b></div><div><small>FVC</small><b data-k="fvc">–</b></div><div><small>FEV₁ / FVC</small><b data-k="ra">–</b></div></div>
    <div class="msg" data-k="msg"></div>
  </div>
</section>

<section class="page" data-t="Obstructive vs restrictive" data-g="recall table" data-p="Part 02 · Pulmonary function tests">
  <h3><i>2.4</i>Obstructive vs restrictive: fill it from memory</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Obstructive</th><th>Restrictive</th></tr>
      <tr><td class="k">Characterized by</td><td>Increased airway resistance, measured as a decrease in expiratory flow</td><td>Increased elastic recoil (decreased lung compliance), measured as a decrease in all lung volumes</td></tr>
      <tr><td class="k">Examples</td><td>Chronic bronchitis, asthma, emphysema</td><td>ARDS; interstitial lung diseases such as sarcoidosis and idiopathic pulmonary fibrosis</td></tr>
      <tr><td class="k">Total lung capacity</td><td>Normal or larger than normal</td><td>Smaller than normal</td></tr>
      <tr><td class="k">Forced expiration from TLC</td><td>A smaller than normal volume is slowly expired</td><td>The smaller volume is expired quickly and more completely than normal</td></tr>
      <tr><td class="k">FVC</td><td>May or may not be reduced; diminished if severe enough</td><td>Low, with low FRC and RV: the critical distinction</td></tr>
      <tr><td class="k">FEV₁ / FVC</td><td>Decreased</td><td>Often increased (FEV₁ is also reduced)</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="note"><b>Indicators of restrictive disease:</b> reduced vital capacity with low lung volumes.</div>
</section>

<section class="page" data-t="Ventilation and breathing reserve" data-g="live calculator" data-p="Part 02 · Pulmonary function tests">
  <h3><i>2.5</i>Pulmonary ventilation</h3>
  <p>Tidal volume × respiratory rate. At rest: 500 ml/breath × 12 breaths/minute = <mark>6000 ml of air per minute</mark>.</p>
  <h3><i>2.6</i>Maximal breathing capacity (MBC, MVV)</h3>
  <ul style="font-size:.92em">
    <li>The maximal volume of air that can be breathed per minute using the fastest rate and deepest respiratory effort possible.</li>
    <li>The subject breathes as fast and as deep as possible for <mark>15 seconds</mark> (to avoid fatigue of the respiratory muscles); the recorded volume is <mark>multiplied by 4</mark>.</li>
    <li>Normally <mark>80–160 L/min</mark> for males and <mark>60–120 L/min</mark> for females.</li>
  </ul>
  <h3><i>2.7</i>Breathing reserve and dyspnea index</h3>
  <div class="ix" data-ix="dysp">
    <div class="cap"><span>Live · slide the MBC</span><em>pulmonary ventilation held at 6 L/min</em></div>
    <div class="sl"><span>Maximal breathing capacity</span><span data-k="mv">100 L/min</span></div>
    <input type="range" min="8" max="160" value="100" data-k="m" aria-label="Maximal breathing capacity">
    <div class="read"><div><small>Breathing reserve</small><b data-k="br">–</b></div><div><small>Dyspnea index</small><b data-k="di">–</b></div><div><small>Dyspnea?</small><b data-k="dy">–</b></div></div>
    <div class="msg" data-k="msg"></div>
  </div>
  <ul style="font-size:.92em">
    <li><b>Breathing reserve</b> = MBC − pulmonary ventilation = 100 − 6 = <mark>94 L/min</mark>.</li>
    <li><b>Dyspnea index</b> = breathing reserve ÷ MBC; usually about <mark>90%</mark>. Below <mark>60%</mark>, dyspnea occurs.</li>
  </ul>
</section>

  <p style="font-size:.9em;color:var(--ink-2)">Eight questions, one at a time. Every answer is on the pages you just turned.</p>

<template data-book="phy-l2" data-subj="Physiology" data-lec="L2" data-title="Transport of gases" data-short="Physiology L2">
<section class="page" data-t="Gas exchange" data-g="tap the sites" data-p="Part 01 · Gas exchange">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Gas exchange</b><span>The journey of an oxygen molecule · diffusion · gas tensions</span></div></div>
  <h3><i>1.1</i>The journey of an oxygen molecule</h3>
  <p>The oxygen delivery system needs <mark>the lungs</mark> and <mark>the CVS</mark>. To reach the tissues, an oxygen molecule should:</p>
  <div class="ix" data-ix="steps">
    <div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Be introduced into the alveoli</li><li>Cross the alveolocapillary membrane</li><li>Bind hemoglobin in RBCs</li><li>Circulate with blood</li><li>Dissociate from hemoglobin to be taken by tissue cells</li></ol>
  </div>
  <div class="note">Any obstacle in this journey results in decreased O₂ tension at the tissues, i.e. <b>hypoxia</b>.</div>
  <h3><i>1.2</i>Diffusion across the alveolocapillary membrane</h3>
  <ul><li><b>ΔP</b>: directly proportional</li><li><b>Surface area</b> of the membrane: directly proportional</li><li><b>Thickness</b> of the membrane: inversely proportional</li></ul>
</section>

<section class="page" data-t="Gas tensions" data-g="picker" data-p="Part 01 · Gas exchange">
  <h3><i>1.3</i>Gas tensions from air to venous blood</h3>
  <div class="ix" data-ix="pick">
    <div class="cap"><span>Live · tap a site</span><em>mmHg</em></div>
    <div class="chips"><button class="chip" data-v="air">Air</button><button class="chip" data-v="alv">Alveoli</button><button class="chip" data-v="art">Arterial blood</button><button class="chip" data-v="ven">Venous blood</button></div>
    <div class="big2" data-for="air"><div><small>PO₂</small><b>160</b></div><div><small>PCO₂</small><b>0.3</b></div></div>
    <div class="big2" data-for="alv"><div><small>PO₂</small><b>105</b></div><div><small>PCO₂</small><b>40</b></div></div>
    <div class="big2" data-for="art"><div><small>PO₂</small><b>100</b></div><div><small>PCO₂</small><b>40</b></div></div>
    <div class="big2" data-for="ven"><div><small>PO₂</small><b>40</b></div><div><small>PCO₂</small><b>46</b></div></div>
  </div>
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Transport of oxygen</b><span>Two forms · definitions · the dissociation curve</span></div></div>
  <h3><i>2.1</i>Oxygen is carried in two forms</h3>
  <div class="ix" data-ix="pick">
    <div class="cap"><span>Live · compare the two forms</span><em></em></div>
    <div class="chips"><button class="chip" data-v="p">Physical solution · 1.5%</button><button class="chip" data-v="c">Chemical combination · 98.5%</button></div>
    <div class="msg" data-for="p"><b>Nature:</b> free O₂ molecules dissolved in plasma.<br><b>Amount:</b> arterial 0.3 ml/100 ml blood; venous 0.13 ml/100 ml blood.<br><b>Importance:</b> it determines the O₂ tension of blood, which determines the direction and rate of diffusion of O₂. Physical O₂ is essential for determining the amount of O₂ in chemical combination.</div>
    <div class="msg" data-for="c"><b>Nature:</b> O₂ molecules carried in chemical combination with Hb. One Hb molecule can combine with 4 molecules of O₂.<br><b>Amount:</b> arterial 19 ml/100 ml blood; venous 14 ml/100 ml blood.<br><b>Importance:</b> the main bulk of O₂ supply to tissues: 98.5% of O₂ transported by blood.</div>
  </div>
</section>

<section class="page" data-t="Four definitions" data-g="reveal cards" data-p="Part 02 · Transport of oxygen">
  <h3><i>2.2</i>Four definitions: say it, then reveal</h3>
  <div class="ix">
    <div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>1 · O₂ content of the blood</small><span>The amount of O₂ present in 100 ml blood in chemical combination with Hb. About <b>19 ml/100 ml</b> in arteries and <b>14 ml/100 ml</b> in venous blood, so about <b>5 ml O₂</b> are transported to the tissues by each 100 ml blood (19 − 14).</span></div>
    <div class="rvc" data-rv><small>2 · O₂ capacity of the blood</small><span>The volume of O₂ present in 100 ml blood in chemical combination when the Hb is <b>fully saturated</b>. Hb content is about 15 gm% and each gram combines with 1.33 ml O₂: 15 × 1.33 = 19.95, i.e. <b>20 ml O₂/100 ml</b> arterial blood.</span></div>
    <div class="rvc" data-rv><small>3 · O₂ percentage saturation</small><span>The percent of Hb saturated with O₂ in 100 ml blood. Arterial blood is only <b>95%</b> saturated (not 100%) because of <b>physiological shunts</b>: some venous blood from bronchial and coronary veins is added to the arterial blood.</span></div>
    <div class="rvc" data-rv><small>4 · Coefficient of O₂ utilization</small><span>The percent of O₂ in arterial blood which is taken by the tissues = (arterial content − venous content) ÷ arterial content = (19 − 14) ÷ 19 = <b>25%</b>. It increases to <b>75%</b> during muscular exercise.</span></div>
  </div>
</section>

<section class="page" data-t="O₂ dissociation curve" data-g="live curve" data-p="Part 02 · Transport of oxygen">
  <h3><i>2.3</i>The O₂ dissociation curve: slide and shift it</h3>
  <p style="font-size:.9em">The relation between O₂ tension in the blood and O₂ % saturation of Hb.</p>
  <div class="ix" data-ix="odc">
    <div class="cap"><span>Live · slide the O₂ tension</span><em>curve drawn to pass through the lecture's points</em></div>
    <canvas class="plot" data-k="cv"></canvas>
    <div class="sl"><span>O₂ tension</span><span data-k="pv">100 mmHg</span></div>
    <input type="range" min="5" max="110" value="100" data-k="p" aria-label="Oxygen tension">
    <div class="row" style="justify-content:center"><div class="seg" data-k="sh"><button data-v="l">Shift to left</button><button class="on" data-v="n">Normal</button><button data-v="r">Shift to right</button></div></div>
    <div class="msg" data-k="msg"></div>
  </div>
  <ul style="font-size:.9em">
    <li>It is <mark>S shaped</mark>.</li>
    <li>The upper part is <mark>flat</mark>: from 100 to 60 mmHg the saturation falls only from <mark>97% to 90%</mark>.</li>
  </ul>
</section>

<section class="page" data-t="Reading and shifting the curve" data-g="recall" data-p="Part 02 · Transport of oxygen">
  <h3><i>2.4</i>Reading the curve</h3>
  <ul>
    <li>At O₂ tension <mark>40 mmHg</mark> the saturation is <mark>75%</mark>: only 22% of O₂ is given to the tissues during rest; the rest is an <mark>O₂ reserve</mark> for emergency conditions.</li>
    <li>In the <mark>steep part</mark>, below 40, saturation falls markedly as more O₂ is released. This occurs in muscular exercise, when venous O₂ tension drops to <mark>20 mmHg or less</mark>.</li>
  </ul>
  <h3><i>2.5</i>Factors that shift the curve</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Shift to right</th><th>Shift to left</th></tr>
      <tr><td class="k">Meaning</td><td>Hb gives more O₂ to the tissues (low affinity)</td><td>Hb gives less O₂ to the tissues (high affinity)</td></tr>
      <tr><td class="k">H⁺</td><td>Increased (acidity)</td><td>Decreased</td></tr>
      <tr><td class="k">CO₂</td><td>Increased</td><td>Decreased</td></tr>
      <tr><td class="k">Temperature</td><td>Increased</td><td>Decreased</td></tr>
      <tr><td class="k">2,3-DPG</td><td>Increased</td><td>Decreased</td></tr>
      <tr><td class="k">Also</td><td>Muscle exercise: hot tissues, increased acidity, high CO₂ tension</td><td>Carbon monoxide poisoning</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <p style="font-size:.9em">2,3-DPG is a byproduct of glucose breakdown. The affinity of Hb for CO is <mark>210 times</mark> its affinity for O₂.</p>
</section>

<section class="page" data-t="Transport of CO₂" data-g="reveal cards" data-p="Part 03 · Transport of carbon dioxide">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Transport of carbon dioxide</b><span>Two forms · tidal CO₂ · handling in the RBC</span></div></div>
  <h3><i>3.1</i>CO₂ in the blood</h3>
  <p>Each 100 ml of arterial blood entering the tissues already carries <mark>48–52 ml CO₂</mark> in two forms.</p>
  <div class="ix">
    <div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>CO₂ in physical solution</small><span>Free CO₂ molecules dissolved in plasma. About <b>3 ml/100 ml</b> arterial blood. It determines the CO₂ tension of the blood, which determines the direction and rate of diffusion of CO₂.</span></div>
    <div class="rvc" data-rv><small>CO₂ in chemical combination</small><span><b>45 ml/100 ml</b> blood: as <b>bicarbonate</b> and as <b>carbamino compound</b>.</span></div>
    <div class="rvc" data-rv><small>Tidal CO₂</small><span>The amount of CO₂ given by the tissues to 100 ml arterial blood passing through them: about <b>4 ml/100 ml</b>. So venous CO₂ is about <b>52 ml/100 ml</b> blood.</span></div>
  </div>
  <h3><i>3.2</i>CO₂ handling in the RBC</h3>
  <div class="ix" data-ix="steps">
    <div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>CO₂ leaves the tissue, crosses the capillary wall and plasma; some stays dissolved</li><li>CO₂ enters the RBC</li><li>Carbonic anhydrase: CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻</li><li>HCO₃⁻ leaves the RBC in exchange for Cl⁻</li><li>H⁺ is taken up by Hb (HHb)</li><li>Some CO₂ combines with Hb (HbCO₂, carbamino)</li></ol>
  </div>
</section>

<section class="page" data-t="Hypoxia: four types" data-g="picker" data-p="Part 04 · Hypoxia and cyanosis">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Hypoxia and cyanosis</b><span>O₂ deficiency at tissue level</span></div></div>
  <h3><i>4.1</i>Hypoxia: pick a type</h3>
  <p style="font-size:.9em">Decreased O₂ supply to tissues, or defective O₂ utilization by the tissues.</p>
  <div class="ix" data-ix="pick">
    <div class="cap"><span>Live · tap a type</span><em></em></div>
    <div class="chips"><button class="chip" data-v="h">Hypoxic</button><button class="chip" data-v="a">Anemic</button><button class="chip" data-v="s">Stagnant</button><button class="chip" data-v="t">Histotoxic</button></div>
    <div data-for="h"><div class="msg"><b>Hypoxic hypoxia.</b> The O₂ tension in arterial blood is reduced. The commonest type.<br><b>Causes:</b> decreased PO₂ in inspired air (high altitudes); hypoventilation from disease in centre, nerve, muscle, thoracic cage or lung (obstructive and restrictive lung diseases, depression of the respiratory centre as by morphine poisoning); decreased diffusion of O₂ from alveoli to blood (alveolo-capillary block: thickening of the pulmonary membrane as in pulmonary fibrosis).</div>
      <table class="mini"><tr><th></th><th>PO₂</th><th>O₂ content</th><th>% sat</th></tr><tr><td>Arterial</td><td class="dn">↓</td><td class="dn">↓</td><td class="dn">↓</td></tr><tr><td>Venous</td><td class="dn">↓</td><td class="dn">↓</td><td class="dn">↓</td></tr><tr><td>Cyanosis</td><td colspan="3"><b>Present</b></td></tr></table></div>
    <div data-for="a"><div class="msg"><b>Anemic hypoxia.</b> The amount of Hb available to carry O₂ is decreased, but arterial O₂ tension is normal.<br><b>Causes:</b> all types of anemia (quantitative deficiency in Hb); carbon monoxide poisoning (qualitative deficiency in Hb).</div>
      <table class="mini"><tr><th></th><th>PO₂</th><th>O₂ content</th><th>% sat</th></tr><tr><td>Arterial</td><td>Normal</td><td class="dn">↓</td><td>Normal</td></tr><tr><td>Venous</td><td class="dn">↓</td><td class="dn">↓</td><td class="dn">↓</td></tr><tr><td>Cyanosis</td><td colspan="3"><b>Absent</b></td></tr></table></div>
    <div data-for="s"><div class="msg"><b>Stagnant (ischemic) hypoxia.</b> Blood flow to the tissues is low, so sufficient O₂ is not delivered. O₂ tension and Hb are normal.<br><b>Causes:</b> general: decreased cardiac output as in heart failure; local: reduced flow to a specific area, as thrombus or embolism.</div>
      <table class="mini"><tr><th></th><th>PO₂</th><th>O₂ content</th><th>% sat</th></tr><tr><td>Arterial</td><td>Normal</td><td>Normal</td><td>Normal</td></tr><tr><td>Venous</td><td class="dn">↓</td><td class="dn">↓</td><td class="dn">↓</td></tr><tr><td>Cyanosis</td><td colspan="3"><b>Present</b></td></tr></table></div>
    <div data-for="t"><div class="msg"><b>Histotoxic hypoxia.</b> Tissue cells cannot use the O₂ supplied: a toxic agent poisons the tissue oxidative enzymes. Arterial O₂ tension and blood flow are normal.<br><b>Causes:</b> cyanide poisoning (inhibits cytochrome oxidase); alcoholic poisoning (alcohol blocks dehydrogenase).</div>
      <table class="mini"><tr><th></th><th>PO₂</th><th>O₂ content</th><th>% sat</th></tr><tr><td>Arterial</td><td>Normal</td><td>Normal</td><td>Normal</td></tr><tr><td>Venous</td><td class="up">↑</td><td class="up">↑</td><td class="up">↑</td></tr><tr><td>Cyanosis</td><td colspan="3"><b>Absent</b></td></tr></table></div>
  </div>
</section>

<section class="page" data-t="CO poisoning · cyanosis" data-g="reveal cards" data-p="Part 04 · Hypoxia and cyanosis">
  <h3><i>4.2</i>Carbon monoxide poisoning</h3>
  <ul>
    <li>CO combines with Hb to form <mark>carboxyhemoglobin (HbCO)</mark>; Hb's affinity for CO is <mark>210 times</mark> its affinity for O₂. Hb combined with CO cannot combine with O₂.</li>
    <li><b>Symptoms:</b> headaches, nausea and vomiting; <mark>cherry red</mark> colour of the skin; death if <mark>70% or more</mark> of Hb is converted to carboxy-Hb.</li>
    <li><b>Treatment:</b> immediate removal from the contaminated atmosphere; artificial respiration with oxygen.</li>
  </ul>
  <h3><i>4.3</i>Cyanosis</h3>
  <p>Blue coloration of the skin and mucous membrane due to an increased amount of <mark>reduced Hb</mark> in the blood of superficial capillaries. It occurs when reduced Hb is at least <mark>5 gm%</mark> in the capillary blood.</p>
  <div class="ix">
    <div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Central (general) cyanosis</small><span>Generalized all over the body. Occurs in hypoxic hypoxia and stagnant hypoxia from generalized causes, e.g. heart failure.</span></div>
    <div class="rvc" data-rv><small>Peripheral cyanosis</small><span>Localized at an area of impaired blood flow due to vasoconstriction, thrombi or emboli.</span></div>
    <div class="rvc" data-rv><small>Factors affecting cyanosis</small><span>Skin pigmentation: difficult to see in dark skin. Thickness of the skin: most apparent in thin skin areas, e.g. lips and fingers.</span></div>
    <div class="rvc" data-rv><small>Cyanosis does not appear in…</small><span>Histotoxic hypoxia, anemic hypoxia and CO poisoning. In CO poisoning the cherry red colour masks it. In anemic hypoxia Hb is low, so reduced Hb stays below the threshold for cyanosis.</span></div>
  </div>
</section>

<section class="page" data-t="Pneumotaxic signal · ramp" data-g="slider" data-p="Part 02 · Respiratory centres">
  <h3><i>2.2</i>Turn the pneumotaxic signal up and down</h3>
  <div class="ix" data-ix="pneumo">
    <div class="cap"><span>Live · slide it</span><em>trace window: 30 s</em></div>
    <canvas class="trace" data-k="tr" style="height:6.2em"></canvas>
    <input type="range" min="0" max="100" value="50" data-k="sl" aria-label="Pneumotaxic signal strength">
    <div class="sl"><span>Weak signal</span><span>Strong signal</span></div>
    <div class="read"><div><small>Pneumotaxic signal</small><b data-k="s">–</b></div><div><small>Inspiration lasts</small><b data-k="ti">–</b></div><div><small>Respiratory rate</small><b data-k="rr">–</b></div></div>
  </div>
  <ul>
    <li>The pneumotaxic centre <mark>turns off inspiration</mark>, limits the size of the tidal volume and, secondarily, regulates the respiratory rate.</li>
    <li><b>Strong signal:</b> inspiration may reach <mark>0.5 s</mark>; rate <mark>30–40/min</mark>.</li>
    <li><b>Weak signal:</b> inspiration may reach <mark>2 s</mark>; rate <mark>3–5/min</mark>.</li>
  </ul>
  <h3><i>2.3</i>The inspiratory ramp signal</h3>
  <div class="ix" data-ix="ramp">
    <div class="cap"><span>Live · DRG discharge</span><em>one breath after another</em></div>
    <canvas class="trace" data-k="tr" style="height:4.2em"></canvas>
  </div>
  <p style="font-size:.9em">DRG signals <mark>begin weakly and increase steadily</mark> (a ramp), then <mark>stop suddenly</mark>; expiration occurs, then a new cycle starts. Output reaches the diaphragm through the <mark>phrenic nerve</mark>.</p>
</section>

<section class="page" data-t="Chemical regulation" data-g="blood gases" data-p="Part 03 · Regulation of respiration">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Regulation of respiration</b><span>Chemical regulation · nervous regulation</span></div></div>

    <div class="drive"><i data-k="dr"></i></div>
    <div class="msg" data-k="msg"></div>
  </div>
</section>

<section class="page" data-t="Chemoreceptors · higher centres" data-g="triggers" data-p="Part 03 · Regulation of respiration">
  <h3><i>3.2</i>Central vs peripheral chemoreceptors</h3>
  <ul>
    <li><b>Central</b> (medulla oblongata): stimulated by <mark>increased H⁺ in the CSF</mark>. H⁺ does not pass the blood–brain barrier; CO₂ enters the CSF and reacts with H₂O to give carbonic acid, which dissociates into HCO₃⁻ and H⁺.</li>
    <li><b>Peripheral</b> (aortic and carotid bodies): <mark>decreased PO₂ is the main stimulus</mark>; increased CO₂ and decreased pH are weaker stimuli. Afferents travel in the <mark>vagus and glossopharyngeal</mark> nerves to the dorsal inspiratory area.</li>
    <li>The respiratory centre is stimulated <mark>more by a rise in CO₂</mark> than by a drop in O₂, and only when arterial PO₂ falls <mark>below 60 mmHg</mark>.</li>
  </ul>
  <h3><i>3.3</i>Higher centres: try each one</h3>
  <div class="ix" data-ix="higher">
    <div class="cap"><span>Live · tap a trigger</span><em data-k="src"></em></div>
    <canvas class="trace" data-k="tr"></canvas>
    <div class="chips">
      <button class="chip sm on" data-v="rest">Resting</button><button class="chip sm" data-v="hyper">Voluntary hyperventilation</button><button class="chip sm" data-v="apnea">Voluntary apnea</button>
      <button class="chip sm" data-v="mpain">Mild pain</button><button class="chip sm" data-v="spain">Severe pain</button><button class="chip sm" data-v="temp">Raised temperature</button>
      <button class="chip sm" data-v="memo">Mild emotion</button><button class="chip sm" data-v="semo">Severe emotion</button>
    </div>
    <div class="msg" data-k="msg"></div>
  </div>
</section>

<section class="page" data-t="Reflexes" data-g="build the arc" data-p="Part 03 · Regulation of respiration">
  <h3><i>3.4</i>Reflexes from the body: build each arc</h3>
  <div class="ix" data-ix="reflex">
    <div class="cap"><span>Recall · pick a reflex, then reveal</span><em data-k="grp"></em></div>
    <div class="chips" data-k="list"></div>
    <div class="arc"><div class="cd hid" data-c="0"><small>Trigger</small><span></span></div><div class="ar">→</div><div class="cd hid" data-c="1"><small>Pathway</small><span></span></div><div class="ar">→</div><div class="cd hid" data-c="2"><small>Response</small><span></span></div></div>
  </div>
  <div class="note"><b>Do not mix them up.</b> Sneezing: forced expiration against an <b>opened</b> glottis. Cough: deep forced expiration against a <b>closed</b> glottis which opens suddenly.</div>
  <ul>
    <li><b>Afferents from other systems:</b> respiratory, cardiovascular, skeletal muscle, viscera.</li>
    <li>Proprioceptor impulses help <mark>increase ventilation during exercise</mark>.</li>
  </ul>
</section>

<section class="page" data-t="The pleura" data-g="tap the pleura" data-p="Part 01 · The pleura">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>The pleura</b><span>Layers · parts · nerve supply · recesses</span></div></div>
  <h3><i>1.1</i>Two layers, one sac</h3>
  <ul>
    <li>The serous membrane that invests the lungs in the <mark>lateral compartments</mark> of the thoracic cavity.</li>
    <li><b>Parietal pleura</b> lines and attaches to the inner surfaces of the chest wall, diaphragm and mediastinum.</li>
    <li><b>Visceral layer</b> reflects from the parietal layer at the hilum, is firmly attached to the lung and follows all its fissures and lobes. The two are <mark>continuous at the root of the lung</mark>.</li>
  </ul>
  <h3><i>1.2</i>Parts of the parietal pleura</h3>
  <div class="ix" data-ix="hl" data-start="cos">
    <div class="cap"><span>Live · tap a part of the sac</span><em>schematic, one lung from the front</em></div>
    <svg class="map" viewBox="0 0 340 196" style="max-height:15em">
      <path d="M126 58Q150 20 176 58Q226 104 220 166Q166 142 112 166Q106 108 126 58Z" fill="#ffd9de" stroke="#b5566a" stroke-width="1.5"/>
      <text class="rg" x="150" y="112">LUNG</text>
      <path class="seg" data-v="cer" d="M118 52Q150 4 186 52"/><path class="seg" data-v="cos" d="M190 56Q246 102 234 176"/>
      <path class="seg" data-v="dia" d="M230 180Q166 150 104 180"/><path class="seg" data-v="med" d="M100 176Q92 110 114 56"/>
      <text class="rg" x="150" y="10" text-anchor="middle">CERVICAL</text><text class="rg" x="250" y="110">COSTAL</text><text class="rg" x="166" y="192" text-anchor="middle">DIAPHRAGMATIC</text><text class="rg" x="88" y="110" text-anchor="end">MEDIASTINAL</text>
    </svg>
    <div class="msg" data-for="cer"><b>Cervical pleura.</b> Projects up into the neck about <b>one inch above the medial 1/3 of the clavicle</b>. It lines the under surface of the suprapleural membrane.</div>
    <div class="msg" data-for="cos"><b>Costal pleura.</b> Lines the back of the sternum, the ribs and costal cartilages, the intercostal spaces and the sides of the vertebral bodies. <b>Nerve:</b> intercostal nerves.</div>
    <div class="msg" data-for="dia"><b>Diaphragmatic pleura.</b> Covers the thoracic (upper) surface of the diaphragm. <b>Nerves:</b> peripheral portions by the intercostal nerves; the central portion by the phrenic nerve.</div>
    <div class="msg" data-for="med"><b>Mediastinal pleura.</b> Covers the mediastinum. At the hilum it is reflected onto the vessels and bronchi and is continuous with the visceral pleura. <b>Nerve:</b> phrenic nerve.</div>
  </div>
</section>

<section class="page" data-t="Pleural pain · recesses" data-g="pain map" data-p="Part 01 · The pleura">
  <h3><i>1.3</i>Where does pleurisy hurt?</h3>
  <p>The parietal pleura has extensive <mark>somatic sensory</mark> innervation. Inflammation of the parietal layers (pleurisy) produces sharp pain upon respiration.</p>
  <div class="ix" data-ix="hl" data-start="cos">
    <div class="cap"><span>Live · inflame a part, see the pain</span><em>orange = where it is felt</em></div>
    <svg class="map" viewBox="0 0 340 150" style="max-height:11em">
      <path d="M150 6h40v20c0 8 50 12 70 30v88H80V56c20-18 70-22 70-30z" fill="#f3e6d8" stroke="#c9b49a" stroke-width="1.5"/>
      <path class="zn" data-on="med" d="M84 54c14-12 36-18 56-22v14c-18 4-40 12-56 26zM256 54c-14-12-36-18-56-22v14c18 4 40 12 56 26z"/>
      <path class="zn" data-on="cos" d="M92 84h64v18H92z"/>
      <text class="rg" x="170" y="20" text-anchor="middle">NECK</text><text class="rg" x="262" y="48">SHOULDER C3–5</text><text class="rg" x="124" y="118" text-anchor="middle">CHEST WALL</text>
    </svg>
    <div class="chips"><button class="chip sm" data-v="cos">Costal pleura</button><button class="chip sm" data-v="med">Mediastinal pleura</button><button class="chip sm" data-v="vis">Visceral pleura</button></div>
    <div class="msg" data-for="cos"><b>Costal inflammation</b> produces <b>local dermatome pain of the chest wall</b>, through the intercostal nerves.</div>
    <div class="msg" data-for="med"><b>Mediastinal irritation</b> produces <b>referred pain to the shoulder dermatomes of C3–5</b>, through the phrenic nerve.</div>
    <div class="msg" data-for="vis"><b>Visceral pleura</b> is supplied by visceral sensory nerves that course with the autonomic nerves, not by the somatic nerves of the parietal layer.</div>
  </div>
  <h3><i>1.4</i>Pleural recesses</h3>
  <p>Potential spaces <mark>not occupied by lung tissue except during deep inspiration</mark>.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Costodiaphragmatic recesses</small><span>Spaces below the inferior borders of the lungs where the costal and diaphragmatic pleura are in contact.</span></div>
    <div class="rvc" data-rv><small>Costomediastinal recess</small><span>Where the costal and mediastinal parietal pleura meet. On the left it is the space left by the cardiac notch of the left lung, occupied by the lingula during inspiration.</span></div>
  </div>
</section>

<section class="page" data-t="Surface anatomy: lower borders" data-g="breathe in" data-p="Part 02 · Surface anatomy">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Surface anatomy</b><span>Lung against pleura · anterior borders · fissures</span></div></div>
  <h3><i>2.1</i>6–8–10 against 8–10–12: take a deep breath</h3>
  <div class="ix" data-ix="borders">
    <div class="cap"><span>Live · slide to breathe in</span><em>red = lung · blue = pleura</em></div>
    <canvas class="plot" style="aspect-ratio:1/.62"></canvas>
    <input type="range" min="0" max="100" value="0" aria-label="Depth of inspiration">
    <div class="sl"><span>Quiet breathing</span><span>Deep inspiration</span></div>
    <div class="msg" data-k="msg"></div>
  </div>
  <ul>
    <li><b>Apex</b> of lung and pleura: one inch above the medial 1/3 of the clavicle.</li>
    <li><b>Inferior border</b>, both a line convex downwards starting at the xiphisternal junction. Lung ends opposite the <mark>10th thoracic spine</mark>, pleura opposite the <mark>12th</mark>, each 2.5 cm lateral to the median plane.</li>
    <li><b>Posterior border:</b> from there upwards along the vertebral column to the apex.</li>
  </ul>
</section>

<section class="page" data-t="Anterior borders · fissures" data-g="recall table" data-p="Part 02 · Surface anatomy">
  <h3><i>2.2</i>Anterior borders: right against left</h3>
  <p>Both begin at the apex, descend behind the sternoclavicular joint and <mark>meet in the median plane at the 2nd costal cartilage</mark>.</p>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th></th><th>Right</th><th>Left</th></tr>
      <tr><td class="k">Pleura</td><td>Continues vertically in the median plane to the xiphisternal junction</td><td>Vertical to the 4th costal cartilage, then turns left and descends along the left border of the sternum to the xiphisternal junction</td></tr>
      <tr><td class="k">Lung</td><td>Continues vertically in the median plane to the xiphisternal junction</td><td>Vertical to the 4th costal cartilage, then turns left and descends behind the 5th and 6th costal cartilages, ½ inch lateral to the left border of the sternum</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <div class="note"><b>Bare area of the pericardium:</b> the part of the pericardium left uncovered by the left lung but covered by the left pleura only.</div>
  <h3><i>2.3</i>Fissures</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Oblique fissure</small><span>A line from the 4th thoracic / 3rd thoracic spine, running obliquely to end at the 6th costal cartilage.</span></div>
    <div class="rvc" data-rv><small>Transverse fissure (right lung only)</small><span>A line from the 4th right costal cartilage to meet the oblique fissure.</span></div>
  </div>
</section>

<section class="page" data-t="The lungs · where to listen" data-g="stethoscope game" data-p="Part 03 · The lungs">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>The lungs</b><span>Lobes · breath sounds · blood supply · lymph</span></div></div>
  <h3><i>3.1</i>Right against left</h3>
  <ul>
    <li><b>Right lung:</b> larger; <mark>two fissures</mark>; superior, middle and inferior lobes.</li>
    <li><b>Left lung:</b> smaller; <mark>one fissure</mark>; superior and inferior lobes. Its superior lobe has the <mark>lingula</mark>, a tongue-like extension homologous to the right middle lobe.</li>
    <li>The heart, near the <b>cardiac notch</b>, and other adjacent organs make impressions on the lung surfaces.</li>
  </ul>
  <h3><i>3.2</i>Place the stethoscope</h3>
  <div class="ix" data-ix="find">
    <div class="cap"><span>Game · tap the drawing</span><em>schematic lobes</em></div>
    <div class="msg" data-k="q" style="min-height:0;font-weight:700;color:var(--navy)"></div>
    <svg class="map" viewBox="0 0 360 140" style="max-height:11.5em">

      <path class="zn" data-z="la" d="M148 10l-16 6-4 18h32l-2-16z"/><path class="zn" data-z="ls" d="M128 34h32l14 18 6 26-8 26-22-4-18-4-6-18z"/><path class="zn" data-z="ll" d="M132 96l18 4-4 16-22-4z"/><path class="zn" data-z="li" d="M172 104l-22-4-4 16-20 10h62l-4-44z"/>

      <path class="zn" data-z="ps" d="M250 12l16 6 4 28h-34l4-24zM314 12l-16 6-4 28h34l-4-24z"/><path class="zn" data-z="pi" d="M236 46h34l4 80h-48zM294 46h34l10 80h-48z"/>

<section class="page" data-t="Blood supply · lymph" data-g="trace the lymph" data-p="Part 03 · The lungs">
  <h3><i>3.3</i>Two circulations</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare</span><em></em></div>
    <div class="chips"><button class="chip" data-v="p">Pulmonary</button><button class="chip" data-v="b">Systemic (bronchial)</button></div>
    <div class="msg" data-for="p"><b>Responsible for gas exchange.</b> Deoxygenated blood is carried to the alveoli by branches of the pulmonary artery. Gas exchange occurs in the alveolar capillary network, and the oxygenated blood returns to the heart through the pulmonary veins.</div>
    <div class="msg" data-for="b"><b>Bronchial arteries</b> deliver oxygenated blood to the bronchi, the respiratory bronchioles and the visceral pleura.</div>
  </div>
  <h3><i>3.4</i>Lymphatic drainage: follow the lymph</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each station in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Superficial plexus (immediately deep to the visceral pleura) and deep plexus (begins deeply in the lungs; drains through pulmonary nodes along the bronchial tree toward the hilum)</li><li>Bronchopulmonary (hilar) nodes, at the hilum: receive lymph from both plexuses</li><li>Tracheobronchial nodes, at the bifurcation of the trachea</li><li>Bronchomediastinal nodes and trunk, on the right and left sides of the trachea</li><li>Right lymphatic duct, or the thoracic duct on the left: both drain into the junction of the internal jugular and subclavian veins</li></ol>
  </div>
  <div class="note"><b>Clinical correlate.</b> Lymph from the <b>lower lobe of the left lung</b> also drains across the midline into the right bronchomediastinal trunk and nodes, then on to the right lymphatic duct. Important with metastasis of lung cancer.</div>
</section>

<section class="page" data-t="Bronchial tree · segments" data-g="reveal cards" data-p="Part 04 · Bronchial tree and development">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Bronchial tree and development</b><span>Main, lobar and segmental bronchi · segments · embryology</span></div></div>
  <h3><i>4.1</i>The tracheobronchial tree</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each division in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Trachea: the trunk of the tree</li><li>Two main bronchi, one for each lung</li><li>Lobar (secondary) bronchi, to the corresponding lung lobes</li><li>Segmental (tertiary) bronchi, which supply the bronchopulmonary segments</li></ol>
  </div>
  <ul>
    <li><b>Right bronchus</b> starts dividing <mark>before piercing the hilum</mark>: superior lobar bronchus (<mark>eparterial</mark>) and middle and inferior lobar bronchus (<mark>hyparterial</mark>).</li>
    <li><b>Left bronchus</b> divides <mark>within the left lung</mark> into superior and inferior lobar bronchi.</li>
  </ul>
  <h3><i>4.2</i>Bronchopulmonary segment</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Definition</small><span>An area of the lung supplied by a segmental bronchus and its accompanying branch of the pulmonary artery.</span></div>
    <div class="rvc" data-rv><small>Veins</small><span>Tributaries of the pulmonary vein tend to pass intersegmentally, between and around the margins of the segments.</span></div>
    <div class="rvc" data-rv><small>Shape</small><span>An irregular cone: apex at the origin of the segmental bronchus, base projected peripherally onto the surface of the lung.</span></div>
    <div class="rvc" data-rv><small>Why it matters</small><span>The smallest functionally independent region of a lung, and the smallest region that can be isolated and removed without affecting the adjacent segments.</span></div>
  </div>
</section>

<section class="page" data-t="Development" data-g="timeline" data-p="Part 04 · Bronchial tree and development">
  <h3><i>4.3</i>Development of the lower respiratory system</h3>
  <div class="ix" data-ix="hl" data-start="a">
    <div class="cap"><span>Live · step through time</span><em></em></div>
    <div class="seg" style="display:flex;width:100%"><button style="flex:1" data-v="a">Week 4</button><button style="flex:1" data-v="b">Lung bud</button><button style="flex:1" data-v="c">By month 6</button><button style="flex:1" data-v="d">Weeks 25–28</button></div>
    <div class="msg" data-for="a"><b>Week 4.</b> The trachea, bronchi and lungs begin as a single <b>respiratory (laryngotracheal) diverticulum</b> of endoderm from the ventral wall of the foregut. Respiratory epithelium develops from <b>endoderm</b>; muscles, connective tissues and cartilages from <b>mesoderm</b>.</div>
    <div class="msg" data-for="b"><b>Lung bud.</b> The diverticulum enlarges distally to form the lung bud. The <b>tracheoesophageal septum</b> forms to separate the esophagus from the trachea. The diverticulum and lung bud then bifurcate into the 2 bronchial buds.</div>
    <div class="msg" data-for="c"><b>By month 6.</b> The bronchial buds undergo a series of divisions to form the major part of the bronchial tree: main, secondary and tertiary bronchi. The tertiary segmental bronchi are related to the bronchopulmonary segments.</div>
    <div class="msg" data-for="d"><b>Weeks 25–28: the critical time.</b> Type I and II pneumocytes are present; gas exchange and surfactant production are possible. Premature fetuses born during this time can survive with intensive care. The amount of surfactant production is critical.</div>
  </div>
  <h3><i>4.4</i>Tracheoesophageal fistula</h3>
  <p>An abnormal communication between the trachea and esophagus caused by a <mark>malformation of the tracheoesophageal septum</mark>.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Generally associated with</small><span>Esophageal atresia and polyhydramnios · regurgitation of milk · gagging and cyanosis after feeding · abdominal distention after crying · reflux of gastric contents into the lungs, causing pneumonitis.</span></div>
    <div class="rvc" data-rv><small>Most common site</small><span>In 90% of cases, between the esophagus and the distal third of the trachea.</span></div>
  </div>
</section>

  <ul>
    <li><b>Upper respiratory tract:</b> nasal cavity and paranasal sinuses; nasopharynx, oropharynx and laryngopharynx.</li>

<section class="page" data-t="Epithelia · the nasal cavity" data-g="pick a region" data-p="Part 01 · Plan of the system">
  <h3><i>1.4</i>Epithelia of the respiratory tract</h3>
  <p>The lining <mark>varies along the tract</mark>.</p>
  <ul>
    <li><b>Respiratory epithelium</b> lines the nasal cavity and nasopharynx, and the superior portion of the lower tract (trachea and bronchi).</li>
    <li><b>Simple squamous epithelium</b> forms the gas exchange surfaces (alveolar ducts, sacs and alveoli). The distance between air and blood in the capillaries is <mark>less than 1 µm</mark>.</li>
  </ul>
  <h3><i>1.5</i>The nasal cavity: three linings</h3>
  <div class="ix" data-ix="hl" data-start="ves">
    <div class="cap"><span>Live · tap a part of the nose</span><em>orange = selected</em></div>

    <div class="msg" data-for="ves"><b>Vestibule (anterior part).</b> Lined with <b>skin</b>. Thick short hairs help trap small particles from the incoming air (filtering).</div>

</section>

<section class="page" data-t="Olfactory epithelium" data-g="reveal cards" data-p="Part 02 · Nose, sinuses and pharynx">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Nose, sinuses and pharynx</b><span>Olfactory epithelium · paranasal sinuses · nasopharynx</span></div></div>
  <h3><i>2.1</i>Olfactory epithelium</h3>
  <p>A <mark>modified pseudostratified columnar ciliated epithelium</mark> made of three cells, with Bowman glands beneath it.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>1 · Olfactory cells</small><span>Bipolar nerve cells. Contain olfactory vesicles with several <b>olfactory cilia (long, non-motile)</b>. They act as receptors for odor.</span></div>
    <div class="rvc" data-rv><small>2 · Supporting cells</small><span>Apically located nuclei. Have many microvilli.</span></div>
    <div class="rvc" data-rv><small>3 · Basal stem cells</small><span>Regenerative cells.</span></div>
    <div class="rvc" data-rv><small>Bowman glands</small><span><b>Serous</b> glands. Their watery secretion dissolves odorous substances so the olfactory cilia can detect them, and flushes the surface for a new odor stimulus.</span></div>
  </div>
  <h3><i>2.2</i>Olfactory against respiratory epithelium</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>

      <tr><th></th><th>Olfactory</th><th>Respiratory</th></tr>

      <tr><td class="k">Cells</td><td>Olfactory, supporting, basal stem cells</td><td>Ciliated, goblet, basal, brush, neuroendocrine cells</td></tr>
      <tr><td class="k">Cilia</td><td>Long and non-motile: odor receptors</td><td>Motile: beat towards the pharynx</td></tr>
      <tr><td class="k">Secretion</td><td>Watery, from serous Bowman glands</td><td>Mucus, from goblet cells and seromucous glands</td></tr>
    </table>

</section>

<section class="page" data-t="Sinuses · pharynx · larynx" data-g="compare" data-p="Part 02 · Nose, sinuses and pharynx">
  <h3><i>2.3</i>Paranasal sinuses</h3>
  <ul>
    <li>Air-filled, hollowed-out portions of bones: <mark>frontal sinus, ethmoidal air cells, maxillary sinus, sphenoidal sinus</mark>.</li>
    <li>Lined with thin respiratory epithelium. Their mucus moistens and cleans the nasal cavity surfaces.</li>
  </ul>
  <h3><i>2.4</i>Nasopharynx</h3>
  <ul>
    <li>The pharynx is shared by the respiratory and digestive systems. The nasopharynx is the posterior continuation of the nasal cavities and has the openings of the right and left auditory (Eustachian) tubes.</li>
    <li>Lined with respiratory epithelium; the lamina propria contains serous and mucous glands and lymphoid tissue (the <mark>pharyngeal tonsils</mark>).</li>
  </ul>
  <div class="note"><b>Clinical correlation.</b> <b>Adenoid:</b> inflamed pharyngeal tonsils. <b>Sinusitis:</b> obstruction of sinus drainage into the nasal cavity, with inflammation and pain over the affected area; the most common cause is viral upper respiratory infection.</div>
  <h3><i>2.5</i>Larynx and epiglottis</h3>
  <ul>
    <li>A cartilaginous tube connecting the pharynx with the trachea: three <b>hyaline</b> cartilages (such as the thyroid) and <b>elastic</b> cartilage (such as the epiglottis).</li>
    <li>It protects the glottis and makes the voice ("voice box"). The epiglottis closes the air passage during swallowing.</li>
  </ul>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · which epithelium covers it?</span><em></em></div>
    <div class="chips"><button class="chip sm" data-v="a">Epiglottis · lingual surface</button><button class="chip sm" data-v="b">Epiglottis · base of laryngeal surface</button><button class="chip sm" data-v="c">Vocal folds</button><button class="chip sm" data-v="d">Rest of the larynx</button></div>
    <div class="msg" data-for="a">The epiglottis is a flap-like upward extension of the anterior wall of the larynx into the pharynx. Its lingual surface and the upper part of its laryngeal surface are covered by <b>stratified squamous non-keratinized epithelium</b>.</div>
    <div class="msg" data-for="b">The basal part of the laryngeal surface is covered by <b>respiratory epithelium</b>.</div>
    <div class="msg" data-for="c">The vocal folds (vocal cords) contain the <b>vocal ligaments</b> (elastic fibers) and the <b>vocalis muscle</b> (skeletal muscle). Their vibrations produce sound waves. Covered with <b>stratified squamous non-keratinized epithelium</b>.</div>
    <div class="msg" data-for="d"><b>Respiratory epithelium.</b></div>
  </div>
</section>

<section class="page" data-t="The trachea · wall in four layers" data-g="tap a layer" data-p="Part 03 · Trachea and its epithelium">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Trachea and its epithelium</b><span>Four layers · five cells · the mucociliary escalator</span></div></div>
  <h3><i>3.1</i>The trachea (windpipe)</h3>
  <p>Extends from the larynx to its bifurcation at the <mark>carina</mark>, where the primary bronchi begin. Its C-shaped cartilages prevent collapse and overexpansion.</p>
  <div class="ix" data-ix="hl" data-start="m1">

    <div class="msg" data-for="m1"><b>Mucosa.</b> (a) Respiratory epithelium: pseudostratified ciliated columnar. (b) Lamina propria: loose vascular connective tissue. (c) Muscularis mucosa.</div>
    <div class="msg" data-for="m2"><b>Submucosa.</b> Connective tissue with blood vessels, lymphatic nodules and nerves. It also contains the tracheal (<b>seromucous</b>) glands.</div>
    <div class="msg" data-for="m3"><b>Incomplete muscularis (fibrocartilaginous layer).</b> 16–20 C-shaped <b>hyaline cartilage</b> rings keep the trachea open. Their free ends are directed posteriorly and replaced by the <b>trachealis muscle</b>, which eases the passage of food in the esophagus.</div>
    <div class="msg" data-for="m4"><b>Adventitia.</b> Dense fibroelastic connective tissue.</div>
  </div>
</section>

<section class="page" data-t="The living epithelium" data-g="live figure" data-p="Part 03 · Trachea and its epithelium">
  <h3><i>3.2</i>Respiratory epithelium: watch it work</h3>
  <p>Pseudostratified columnar epithelium of <mark>five cell types</mark>. Tap a cell in the drawing, or a name below.</p>
  <div class="ix" data-ix="epi">
    <div class="cap"><span>Live · the mucociliary escalator</span><em>schematic</em></div>
    <canvas class="plot" style="aspect-ratio:1/.6;background:#f4f9ff;cursor:pointer"></canvas>
    <div class="chips"><button class="chip sm" data-g="cell" data-v="c">Ciliated columnar</button><button class="chip sm" data-g="cell" data-v="g">Goblet</button><button class="chip sm" data-g="cell" data-v="b">Basal</button><button class="chip sm" data-g="cell" data-v="r">Brush</button><button class="chip sm" data-g="cell" data-v="k">Neuroendocrine (K)</button></div>
    <div class="msg" data-k="msg"></div>
    <script type="application/json">{
"normal":"<b>The mucociliary escalator.</b> Goblet cells secrete mucus that traps dust, bacteria and viruses. The beating cilia move this sticky layer toward the pharynx, where it is swallowed.",
"c":"<b>Ciliated columnar cells (30%).</b> Each has 200–300 cilia that beat towards the pharynx to move mucus out. The apical part contains many mitochondria: ATP for ciliary beating.",
"g":"<b>Goblet cells (30%).</b> A flask-shaped apex filled with mucin granules; the narrow basal part holds the nucleus, RER, Golgi complex and mitochondria. Their mucus traps dust, bacteria and viruses and absorbs noxious gases such as ozone and sulfur dioxide.",
"b":"<b>Short basal cells (30%).</b> They sit on the basal lamina but are short and do not reach the surface. They are stem cells: they divide and replace ciliated and goblet cells.",
"r":"<b>Brush cells (3%).</b> Slender columnar cells with microvilli. They may be depleted goblet cells, or sensory receptor cells, as there are many nerve endings on their basal surface.",
"k":"<b>Pulmonary neuroendocrine cells (3%).</b> Also called APUD cells, DNES cells, Kulchitsky or K cells. Similar to the endocrine cells of the gut: basal secretory granules release hormones into the lamina propria that affect nearby cells. <b>Bronchial tumors arise from Kulchitsky cells.</b>"
}</script>
  </div>
  <div class="note"><b>Why "pseudostratified"?</b> Every cell sits on the same basal lamina, but only some reach the surface.</div>
</section>

<section class="page" data-t="Five cells from memory" data-g="recall table" data-p="Part 03 · Trachea and its epithelium">
  <h3><i>3.3</i>The five cells: fill the table from memory</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>

      <tr><td class="k">Small granule (K) cell</td><td>3%</td><td>Basal granules; DNES (APUD) cell</td><td>Neuroendocrine: secretes hormones such as catecholamines and serotonin</td></tr>

  </div>
  <h3><i>3.4</i>Which lining?</h3>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · tap the right epithelium</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>What lines it?</small><b data-k="card"></b></div></div>

  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Trachea and mucus clearance</b><span>The wall · the epithelium · what goes wrong</span></div></div>
  <h3><i>1.1</i>The trachea</h3>
  <p>A hollow tube about <mark>10 cm long and 2 cm in diameter</mark>, from the larynx to its bifurcation at the carina. The primary (extrapulmonary) bronchi have the <b>same structure</b> as the trachea. Four layers: mucosa, submucosa, incomplete muscularis (fibrocartilaginous coat), adventitia.</p>
  <h3><i>1.2</i>Break the escalator, then read why</h3>
  <div class="ix" data-ix="epi">
    <div class="cap"><span>Live · tracheal epithelium in health and disease</span><em>schematic</em></div>

    <div class="msg" data-k="msg"></div>

"normal":"<b>Normal.</b> Goblet cells secrete a polysaccharide mucus, supplemented by the submucosal mixed glands. It traps particles and the beating cilia move the sticky layer toward the pharynx, where it is swallowed: the <b>mucociliary escalator system</b>.",
"cf":"<b>Cystic fibrosis.</b> The secreted mucus is thick or viscous and the cilia cannot move it toward the pharynx. Patients have frequent infections of the respiratory system: failure of the mucociliary escalator.",
"kart":"<b>Kartagener syndrome.</b> Patients lacking <b>dynein</b> have immotile cilia. Their cilia cannot move the mucus layer with its trapped bacteria, so they have many respiratory problems. Males also possess immotile sperm.",

  <div class="note"><b>Remember the cilium.</b> 9 peripheral doublet microtubules of tubulin; the arms are the motor protein dynein, which causes the cilia to bend. If mucosal clearance is ineffective, infection or <b>pneumoconiosis</b> (dust-related disease) may follow.</div>
