<section class="page" data-t="Bronchioles · Clara cells" data-g="reveal cards" data-p="Part 02 · Down the bronchial tree">
  <h3><i>2.3</i>Bronchioles</h3>
  <ul>
    <li>Three types: <b>primary (preterminal)</b>, <b>terminal</b> and <b>respiratory</b> bronchioles.</li>
    <li><b>Mucosa:</b> simple columnar ciliated epithelium that becomes cuboidal in smaller bronchioles, with an additional cell, the <mark>Clara cell</mark>; lamina propria of thin elastic connective tissue.</li>
    <li><b>Muscle layer:</b> spirally arranged smooth muscle. <b>Outer layer:</b> fibroelastic connective tissue.</li>
  </ul>
  <h3><i>2.4</i>Clara cells (bronchiolar secretory cells)</h3>
  <p>Non-ciliated columnar cells with a rounded apex that projects above the other cells. The cytoplasm contains Golgi, RER, SER, mitochondria and secretory granules.</p>
  <div class="ix"><div class="cap"><span>Recall · four functions, tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>1 · Secretory</small><span>Produce <b>surfactant-like material</b> that reduces the surface tension of the bronchioles and prevents their collapse.</span></div>
    <div class="rvc" data-rv><small>2 · Stem cell</small><span>Can divide to regenerate both themselves and ciliated cells.</span></div>
    <div class="rvc" data-rv><small>3 · Detoxification</small><span>Inactivate harmful substances in the inspired air: detoxification of airborne toxins (oxidase activity).</span></div>
    <div class="rvc" data-rv><small>4 · Chloride transport</small><span>Involved in chloride ion transport into the lumens of the terminal bronchioles. <b>Cystic fibrosis</b> can result in abnormally thick mucus, in part due to defective chloride transport by Clara cells.</span></div>
  </div>
</section>

  <h3><i>3.3</i>Respiratory distress syndrome</h3>
  <p>Associated with premature infants; caused by a <mark>deficiency of surfactant</mark>.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>When does surfactant appear?</small><span>First detected at <b>28 weeks</b> of pregnancy, after which premature babies are capable of respiratory survival. Between 28 weeks and term (40 weeks) the amount may be inadequate, and artificial respiratory assistance may be needed.</span></div>
    <div class="rvc" data-rv><small>Why give the mother corticosteroids?</small><span>Corticosteroids induce the fetal synthesis of surfactant, so they are given to mothers who will electively deliver early.</span></div>
    <div class="rvc" data-rv><small>Why infants of diabetic mothers?</small><span>High insulin levels in diabetic mothers antagonize the effects of corticosteroids, so their infants have a higher incidence of respiratory distress syndrome.</span></div>
    <div class="rvc" data-rv><small>What happens to surfactant after secretion?</small><span>Most is recycled back to type II cells for reutilization; some undergoes phagocytosis by macrophages.</span></div>
  </div>
</section>

<section class="page" data-t="Septum · barrier · macrophages" data-g="tap in order" data-p="Part 03 · The alveolus">
  <h3><i>3.4</i>Interalveolar septum</h3>
  <ul>
    <li>The partition between two adjacent alveoli, interrupted by the pores of Kohn.</li>
    <li><b>Formed of:</b> alveolar epithelium on either side; a rich capillary network arising from the pulmonary artery; a network of elastic, reticular and collagenous fibers. Also cells such as mast cells, macrophages and fibroblasts.</li>
    <li><mark>Elastic fibers</mark> are responsible for the stretching and recoiling of the alveoli during respiration.</li>
  </ul>
  <h3><i>3.5</i>Blood–gas barrier: from air to blood</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each layer in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Pulmonary surfactant</li><li>Type I pneumocytes</li><li>Fused basal lamina of the type I cell and the capillary endothelium</li><li>Endothelium of the blood capillaries</li></ol>
  </div>
  <h3><i>3.6</i>Alveolar macrophages by name</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · same cell, two names</span><em></em></div>
    <div class="chips"><button class="chip" data-v="d">Dust cells</button><button class="chip" data-v="h">Heart failure cells</button></div>
    <div class="msg" data-for="d">Lung macrophages in the alveolar lumen that have phagocytosed <b>dust particles</b>.</div>
    <div class="msg" data-for="h">Lung macrophages in the alveolar lumen that have phagocytosed <b>extravasated blood</b> in cases of congestive heart failure.</div>
  </div>
  <h3><i>3.7</i>Pleura</h3>
  <p>The serous membrane covering the lung: a parietal and a visceral layer with a film of liquid in the cavity between them. Each layer is connective tissue covered by simple squamous epithelium (<mark>mesothelium</mark>).</p>
</section>

<section class="page" data-t="Why cells need oxygen" data-g="tap the map" data-p="Part 01 · Oxygen and the cell">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Oxygen and the cell</b><span>Cellular respiration · oxidative phosphorylation</span></div></div>
  <h3><i>1.1</i>The biochemical job of the respiratory system</h3>
  <ul>
    <li>The oxidative metabolism of cells is supported by <b>oxygen</b>; the waste product of metabolism, <b>carbon dioxide</b>, is removed from the body.</li>
    <li>The respiratory system moves gases between blood and air so that <mark>hypoxia</mark> (reduced oxygen in tissues) and <mark>acid–base disturbances</mark> (from altered CO₂) are minimized.</li>
  </ul>
  <h3><i>1.2</i>Cellular respiration</h3>
  <div class="ix" data-ix="hl" data-start="p1">

<section class="page" data-t="The oxygen dissociation curve" data-g="live curve" data-p="Part 02 · Hemoglobin and oxygen">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>Hemoglobin and oxygen</b><span>The curve · Bohr and Haldane · what changes O₂ binding</span></div></div>
  <h3><i>2.1</i>Shift the curve and count the oxygen delivered</h3>
  <p>O₂ partial pressure on the horizontal axis, O₂ saturation on the vertical axis: an <mark>S-shaped</mark> relationship.</p>
  <div class="ix" data-ix="odc2" data-start="n">
    <div class="cap"><span>Live · pick a curve</span><em>unloaded from lungs to tissues: <b data-k="un">–</b></em></div>
    <canvas class="plot" style="aspect-ratio:1/.6"></canvas>
    <div class="chips"><button class="chip sm" data-v="n">Normal HbA</button><button class="chip sm" data-v="r">Right shift</button><button class="chip sm" data-v="l">Left shift</button><button class="chip sm" data-v="bpg">More 2,3-BPG</button><button class="chip sm" data-v="hbf">HbF</button><button class="chip sm" data-v="mb">Myoglobin</button></div>
    <div class="msg" data-k="msg"></div>
    <script type="application/json">{
"n":"<b>Normal adult hemoglobin.</b> Lung PO₂ is 100 mm Hg, so Hb is fully saturated. Tissue PO₂ is 40 mm Hg, so saturation falls and O₂ is delivered to the tissues. The bar on the right shows how much is unloaded.",
"r":"<b>Right shift: decreased affinity for O₂.</b> Caused by ↑ PCO₂, ↑ H⁺ (↓ pH), ↑ 2,3-DPG and ↑ temperature. This is the <b>Bohr effect</b>, and it helps unload O₂ in the tissues: watch the bar grow.",
"l":"<b>Left shift: increased affinity for O₂.</b> Caused by ↓ PCO₂, ↓ H⁺ (high pH), ↓ 2,3-DPG, ↓ temperature and HbF. It helps loading of O₂ in the lungs, but less is released at the tissues.",
"bpg":"<b>More 2,3-BPG.</b> It binds to HbA and decreases its affinity for oxygen, so O₂ delivery to tissues increases. An increase in erythrocyte 2,3-BPG shifts the curve to the right, as at high altitudes.",
"hbf":"<b>Fetal hemoglobin.</b> 2,3-BPG does not bind to HbF, so HbF has a higher affinity for oxygen than maternal HbA. This allows transplacental passage of oxygen from mother to fetus.",
"mb":"<b>Myoglobin</b> (heart and skeletal muscle) binds oxygen more tightly than hemoglobin and serves as a storage site for oxygen in tissues. Its affinity does not change with binding, so the curve is not S-shaped."
}</script>
  </div>
  <div class="note"><b>P50</b> is the pressure at which Hb is 50% saturated with O₂. High affinity → slow unloading → <b>low</b> P50. Low affinity → fast unloading → <b>high</b> P50.</div>
</section>

<section class="page" data-t="Bohr against Haldane" data-g="sorting game" data-p="Part 02 · Hemoglobin and oxygen">
  <h3><i>2.2</i>Two properties of hemoglobin</h3>
  <ul>
    <li><b>Bohr effect:</b> decreased affinity of hemoglobin for <mark>O₂</mark> with increased CO₂ or decreased pH. Helps unload O₂ in tissues.</li>
    <li><b>Haldane effect:</b> decreased affinity of hemoglobin for <mark>CO₂</mark> caused by O₂ binding to hemoglobin in the lungs. Facilitates unloading of CO₂ there; with less O₂ bound, more CO₂ loads onto hemoglobin in the tissues.</li>
  </ul>
  <div class="ix" data-ix="sort">
    <div class="cap"><span>Game · Bohr or Haldane?</span><em data-k="n"></em></div>
    <div class="big2" style="grid-template-columns:1fr"><div><small>Which effect?</small><b data-k="card" style="font-size:1.12em"></b></div></div>
    <div class="chips" style="justify-content:center"><button class="chip" data-b="0">Bohr effect</button><button class="chip" data-b="1">Haldane effect</button></div>
    <div class="msg" data-k="fb"></div>
    <script type="application/json">[
["Occurs in the tissues",0,"The Bohr effect occurs in tissues; the Haldane effect occurs in the lungs."],
["Describes the release of CO₂",1,"Haldane: release of CO₂. Bohr: release of O₂."],
["Effective under low blood pH",0,"Bohr is effective under low blood pH, Haldane under high blood pH."],
["Caused by the uptake of O₂ in the lungs",1,"Bohr is caused by the take-up of CO₂ from the tissues."],
["Shifts the O₂ dissociation curve to the right",0,"A shift to the right in response to an increase in PCO₂ or a decrease in pH."],
["Decreased CO₂ affinity of Hb as blood O₂ rises",1,"That is the definition of the Haldane effect."],
["Facilitates the release of O₂ at tissues",0,"Protons reduce the O₂ affinity of Hb."]
]</script>
  </div>
  <h3><i>2.3</i>How protons do it</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Tissues are more acidic than the lungs: CO₂ + H₂O → H₂CO₃ → HCO₃⁻ + H⁺</li><li>Protons reduce the O₂ affinity of Hb, so O₂ is released into the tissues; the free Hb binds two protons</li><li>In the lungs the protons are released and react with HCO₃⁻ to form CO₂ gas (HCO₃⁻ + H⁺ → CO₂ + H₂O)</li><li>The proton-poor Hb now has greater affinity for O₂</li></ol>
  </div>
  <div class="note">The Bohr effect removes insoluble CO₂ from the blood stream and produces soluble bicarbonate.</div>
</section>

<section class="page" data-t="Anemia, polycythemia, CO" data-g="live curve" data-p="Part 02 · Hemoglobin and oxygen">
  <h3><i>2.4</i>Same PO₂, different amount of oxygen</h3>
  <div class="ix" data-ix="o2c" data-start="n">
    <div class="cap"><span>Live · pick a condition</span><em>schematic curves</em></div>
    <canvas class="plot" style="aspect-ratio:1/.6"></canvas>
    <div class="chips"><button class="chip sm" data-v="n">Normal</button><button class="chip sm" data-v="an">Anemia</button><button class="chip sm" data-v="po">Polycythemia</button><button class="chip sm" data-v="co">Carbon monoxide</button></div>
    <div class="msg" data-k="msg"></div>
    <script type="application/json">{
"n":"<b>Normal.</b> Oxygen is transported primarily by red blood cell hemoglobin, with small quantities dissolved in plasma.",
"an":"<b>Anemia</b> (low hemoglobin levels) alters the oxygen <b>concentration</b> (mL O₂ / 100 mL of blood), not the PO₂ of blood, and limits the oxygen capacity available to tissues.",
"po":"<b>Polycythemia</b> (high hemoglobin levels) raises the oxygen concentration. Again the PO₂ of blood is not changed.",
"co":"<b>Carbon monoxide poisoning.</b> CO binds to hemoglobin, preventing the binding and carrying of O₂, so tissues do not receive enough for cell survival. Treatment: <b>hyperbaric oxygen</b> (oxygen at high partial pressures, to load more oxygen into plasma and RBCs)."
}</script>
  </div>
  <h3><i>2.5</i>Hemoglobin against myoglobin</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare</span><em></em></div>
    <div class="chips"><button class="chip" data-v="h">Hemoglobin</button><button class="chip" data-v="m">Myoglobin</button><button class="chip" data-v="c">How is CO₂ carried?</button></div>
    <div class="msg" data-for="h">In erythrocytes; transports oxygen from lungs to tissues. A <b>heme</b> (iron-containing porphyrin ring) binds oxygen, and the heme oxygen affinity <b>increases as oxygen binds</b>: the globin switches between low-affinity and high-affinity forms.</div>
    <div class="msg" data-for="m">In heart and skeletal muscle; binds oxygen <b>more tightly</b> than hemoglobin and serves as a <b>storage site</b> for oxygen in tissues. Its affinity does not change with binding.</div>
    <div class="msg" data-for="c">Primarily in <b>bicarbonate (HCO₃⁻)</b> form, with small amounts on hemoglobin and dissolved in plasma.</div>
  </div>
</section>

<section class="page" data-t="2,3-BPG in the red cell" data-g="tap the map" data-p="Part 02 · Hemoglobin and oxygen">
  <h3><i>2.6</i>Four factors that affect O₂ binding</h3>
  <p>They reduce the ability of hemoglobin to bind O₂ so it can be easily delivered to the tissues: <mark>PO₂</mark>, <mark>pH</mark> of the environment, <mark>PCO₂</mark> and the availability of <mark>2,3-BPG</mark>.</p>
  <h3><i>2.7</i>Glycolysis in the erythrocyte and the 2,3-BPG shunt</h3>
  <div class="ix" data-ix="hl" data-start="main">
    <div class="cap"><span>Live · tap a route</span><em>orange = the route</em></div>
    <svg class="map pw" viewBox="0 0 360 130">
      <g class="n" data-on="main shunt"><rect x="100" y="6" width="160" height="24" rx="6"/><text x="180" y="22" text-anchor="middle">1,3-Bisphosphoglycerate</text></g>
      <g class="n" data-on="main"><rect x="6" y="52" width="128" height="26" rx="13"/><text x="70" y="69" text-anchor="middle">Phosphoglycerate kinase</text></g>
      <g class="n good" data-on="main"><rect x="6" y="96" width="92" height="22" rx="6"/><text x="52" y="111" text-anchor="middle">ADP → ATP</text></g>
      <g class="n" data-on="shunt"><rect x="252" y="36" width="60" height="24" rx="12"/><text x="282" y="52" text-anchor="middle">Mutase</text></g>
      <g class="n bad" data-on="shunt act"><rect x="226" y="68" width="128" height="24" rx="6"/><text x="290" y="84" text-anchor="middle">2,3-BPG</text></g>
      <g class="n" data-on="shunt"><rect x="252" y="100" width="80" height="24" rx="12"/><text x="292" y="116" text-anchor="middle">Phosphatase</text></g>
      <g class="n" data-on="main shunt"><rect x="118" y="100" width="118" height="24" rx="6"/><text x="177" y="116" text-anchor="middle">3-Phosphoglycerate</text></g>
      <path class="ed" d="M150 30v22h-16M70 78v18M134 65h30v35M230 30l40 6M282 60v8M290 92v8M252 112h-16"/>
    </svg>
    <div class="chips"><button class="chip sm" data-v="main">Usual route</button><button class="chip sm" data-v="shunt">The shunt</button><button class="chip sm" data-v="act">What 2,3-BPG does</button></div>
    <div class="msg" data-for="main"><b>Usual route.</b> The red blood cell has no mitochondria and depends totally on <b>anaerobic glycolysis</b> for ATP (2 ATP per glucose). Phosphoglycerate kinase makes ATP as 1,3-BPG becomes 3-phosphoglycerate.</div>
    <div class="msg" data-for="shunt"><b>The shunt.</b> Erythrocytes have <b>bisphosphoglycerate mutase</b>, which produces 2,3-BPG from 1,3-BPG. A phosphatase then gives 3-phosphoglycerate. This route skips the kinase step: <b>net ATP production = 0</b>.</div>
    <div class="msg" data-for="act"><b>2,3-BPG</b> binds to adult hemoglobin (HbA) and decreases its affinity for oxygen, so O₂ delivery to tissues increases: a shift of the curve to the right, as at high altitudes. It does <b>not</b> bind to HbF.</div>
  </div>
</section>

<section class="page" data-t="Acid–base: the words" data-g="recall table" data-p="Part 03 · Acid–base balance">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Acid–base balance</b><span>Definitions · buffers · the four disorders · compensation</span></div></div>
  <h3><i>3.1</i>Definitions</h3>
  <div class="ix" data-ix="recall">
    <div class="cap"><span>Recall · tap a cell</span><em data-k="n"></em></div>
    <table class="rt">
      <tr><th>Term</th><th>Meaning</th></tr>
      <tr><td class="k">Acid</td><td>Proton donor</td></tr>
      <tr><td class="k">Base</td><td>Proton acceptor</td></tr>
      <tr><td class="k">pH</td><td>Negative log of H⁺ activity</td></tr>
      <tr><td class="k">Acidemia</td><td>Arterial blood pH below 7.35</td></tr>
      <tr><td class="k">Alkalemia</td><td>Arterial blood pH above 7.45</td></tr>
      <tr><td class="k">Acidosis, alkalosis</td><td>Pathological states leading to acidemia and alkalemia</td></tr>
      <tr><td class="k">Buffer</td><td>Mixture of a weak acid and a salt of its conjugate base; resists changes in pH when a strong acid or base is added</td></tr>
      <tr><td class="k">pK</td><td>pH at which a buffer exists in equal proportions of its acid and conjugate base</td></tr>
      <tr><td class="k">Buffer value (β)</td><td>Amount of base required to change pH by one unit</td></tr>
    </table>
    <div class="row" style="justify-content:flex-end;margin-top:.3em"><button class="btn gh" data-a="hide">Hide all</button><button class="btn" data-a="show">Reveal all</button></div>
  </div>
  <h3><i>3.2</i>The bicarbonate buffer</h3>
  <ul>
    <li>H⁺ levels in the blood are kept within narrow limits by buffering systems such as proteins (hemoglobin) and HCO₃⁻. Negatively charged HCO₃⁻ binds H⁺ and lowers acidity.</li>
    <li><mark>H₂O + CO₂ ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</mark>, catalyzed by <b>carbonic anhydrase</b>; the balance can be shifted right or left.</li>
    <li>It regulates blood pH powerfully because CO₂ and HCO₃⁻ can be regulated independently, by the <b>lungs</b> and the <b>kidneys</b>.</li>
  </ul>
</section>

<section class="page" data-t="The acid–base lab" data-g="live figure" data-p="Part 03 · Acid–base balance">
  <h3><i>3.3</i>The acid–base lab: move CO₂ and HCO₃⁻, watch the pH</h3>
  <div class="ix" data-ix="abg">
    <div class="cap"><span>Live · Henderson–Hasselbalch</span><em>pH = pK + log [HCO₃⁻] / [CO₂]</em></div>
    <canvas class="plot" style="aspect-ratio:1/.24;background:#fbf7ef"></canvas>
    <div class="big2" style="grid-template-columns:1fr 1.5fr"><div><small>pH</small><b data-k="ph">7.40</b></div><div><small>State</small><b data-k="dx" style="font-size:1.25em;line-height:1.5">Normal</b></div></div>
    <div class="sl"><span>CO₂ · set by the lungs</span><span>PCO₂ <b data-k="cv">40</b> mm Hg</span></div>
    <input type="range" min="20" max="80" step="1" value="40" data-k="c" aria-label="Carbon dioxide">
    <div class="sl"><span>HCO₃⁻ · set by the kidneys</span><span>HCO₃⁻ <b data-k="hv">24</b> mmol/L</span></div>
    <input type="range" min="10" max="40" step="1" value="24" data-k="h" aria-label="Bicarbonate">
    <div class="chips"><button class="chip sm" data-v="hypo">Hypoventilation</button><button class="chip sm" data-v="hyper">Hyperventilation</button><button class="chip sm" data-v="mac">Lose HCO₃⁻</button><button class="chip sm" data-v="mal">Gain HCO₃⁻</button><button class="chip sm" data-v="norm">Reset</button><button class="btn" data-k="comp" style="margin-left:auto">Compensate</button></div>
    <div class="msg" data-k="msg"></div>
  </div>
  <div class="note"><b>So:</b> acidosis is either increased CO₂ or decreased HCO₃⁻. Alkalosis is either decreased CO₂ or increased HCO₃⁻. <span style="opacity:.75">The mm Hg and mmol/L numbers on the sliders are standard reference values added to drive the figure; the lecture gives the equation only.</span></div>
</section>

<section class="page" data-t="Disorders and compensation" data-g="reveal cards" data-p="Part 03 · Acid–base balance">
  <h3><i>3.4</i>Naming a disorder</h3>
  <ul>
    <li><b>Respiratory:</b> abnormal processes that alter pH through a primary change in <mark>PCO₂</mark>. <b>Metabolic:</b> through a primary change in <mark>[HCO₃⁻]</mark>.</li>
    <li><b>Simple</b> disorder: a single primary disorder. <b>Mixed</b>: more primary disorders present simultaneously.</li>
  </ul>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Respiratory acidosis: six causes</small><span>Respiratory depression · narcotics overdose · CNS depression · COPD · pneumothorax · atelectasis. Pulmonary obstruction increases CO₂, which makes the pH fall.</span></div>
    <div class="rvc" data-rv><small>Respiratory acidosis: compensation</small><span>The kidney retains an increased amount of HCO₃⁻ to increase the pH.</span></div>
    <div class="rvc" data-rv><small>Respiratory alkalosis: causes</small><span>Blood pH above 7.45 due to an issue with respiration. Anything that leads to hyperventilation: anxiety, pregnancy, respiratory conditions and mechanical ventilation (ventilator-induced hyperventilation).</span></div>
    <div class="rvc" data-rv><small>Why is compensation of metabolic alkalosis weak?</small><span>Lowering ventilation to raise CO₂ is not very effective: once O₂ reaches low levels, the peripheral chemoreceptors are triggered by low O₂ to increase ventilation.</span></div>
  </div>
  <h3><i>3.5</i>Ventilation answers acidemia</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each step in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>H⁺ or CO₂ production leads to acidemia or ↑ PCO₂</li><li>Sensed by peripheral or central chemoreceptors</li><li>They stimulate the respiratory control center</li><li>↑ Ventilation → ↑ CO₂ excretion</li><li>Plasma pH returns closer to normal (pH 7.4)</li></ol>
  </div>
</section>

<section class="page" data-t="Anti-inflammatory agents" data-g="tap the map" data-p="Part 04 · Anti-inflammatory agents">
  <div class="part"><div class="pn">04</div><div><small>PART 04</small><b>Anti-inflammatory agents</b><span>Arachidonic acid · glucocorticoids · NSAIDs</span></div></div>
  <h3><i>4.1</i>Where each drug blocks inflammation</h3>
  <div class="ix" data-ix="hl" data-start="path">
    <div class="cap"><span>Live · tap a drug</span><em>orange = where it acts</em></div>
    <svg class="map pw" viewBox="0 0 360 150">
      <g class="n" data-on="path"><rect x="6" y="6" width="148" height="22" rx="6"/><text x="80" y="21" text-anchor="middle">Membrane phospholipids</text></g>
      <g class="n" data-on="path"><rect x="30" y="36" width="100" height="22" rx="11"/><text x="80" y="51" text-anchor="middle">Phospholipase A₂</text></g>
      <g class="n" data-on="path"><rect x="26" y="66" width="108" height="22" rx="6"/><text x="80" y="81" text-anchor="middle">Arachidonic acid</text></g>
      <g class="n" data-on="path nsaid"><rect x="26" y="96" width="108" height="22" rx="11"/><text x="80" y="111" text-anchor="middle">Cyclooxygenase</text></g>
      <g class="n bad" data-on="path"><rect x="6" y="126" width="148" height="20" rx="6"/><text x="80" y="140" text-anchor="middle">Prostaglandins · leukotrienes</text></g>
      <path class="ed" d="M80 28v8M80 58v8M80 88v8M80 118v8"/>
      <g class="n" data-on="gc"><rect x="196" y="6" width="158" height="22" rx="6"/><text x="275" y="21" text-anchor="middle">Corticosteroid enters the cell</text></g>
      <g class="n" data-on="gc"><rect x="196" y="38" width="158" height="22" rx="11"/><text x="275" y="53" text-anchor="middle">Cytoplasmic receptor</text></g>
      <g class="n" data-on="gc"><rect x="196" y="70" width="158" height="22" rx="6"/><text x="275" y="85" text-anchor="middle">Nucleus: binds GREs on genes</text></g>
      <g class="n good" data-on="gc"><rect x="196" y="102" width="158" height="34" rx="6"/><text x="275" y="116" text-anchor="middle">Altered transcription:</text><text x="275" y="128" text-anchor="middle">fewer inflammatory mediators</text></g>
      <path class="ed" d="M275 28v10M275 60v10M275 92v10M196 119h-42v12"/>
    </svg>
    <div class="chips"><button class="chip sm" data-v="path">The pathway</button><button class="chip sm" data-v="gc">Glucocorticoids</button><button class="chip sm" data-v="nsaid">Aspirin, ibuprofen</button></div>
    <div class="msg" data-for="path"><b>The inflammatory pathway.</b> During the inflammatory response, the metabolites of arachidonic acid (<b>eicosanoids</b>) are released from cell membrane phospholipids by <b>phospholipase A₂</b> and further converted by cyclooxygenases to prostaglandins and leukotrienes: major contributors to inflammation.</div>
    <div class="msg" data-for="gc"><b>Glucocorticoids</b> bind to cytosolic steroid receptors (heat-shock protein hsp90 is released), translocate to the nucleus, bind to glucocorticoid response elements (GREs) and alter responsive genes to reduce inflammatory mediators. Used in asthma, chronic bronchitis, sarcoidosis, and hypersensitivity and interstitial lung diseases.</div>
    <div class="msg" data-for="nsaid"><b>NSAIDs.</b> Aspirin and ibuprofen <b>acetylate cyclooxygenase</b> (prostaglandin synthase) to block prostaglandin synthesis: reduced inflammation, reduced fever, reduced pain.</div>
  </div>
  <div class="note">Many inflammatory diseases of the lung are treated with anti-inflammatory glucocorticoids to reduce the pulmonary immune responses causing the disease.</div>
</section>

<section class="page" data-t="Bronchial asthma" data-g="reveal cards" data-p="Part 01 · The disease and the plan">
  <div class="part"><div class="pn">01</div><div><small>PART 01</small><b>Bronchial asthma</b><span>What goes wrong · early and late responses · the drug groups</span></div></div>
  <h3><i>1.1</i>What asthma is</h3>
  <p>An <mark>inflammatory disease</mark> associated with bronchial hyperreactivity (BHR), bronchospasm, increased mucus secretion, edema and cellular infiltration.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Early asthmatic response (EAR)</small><span>Lasts 30 to 60 minutes. Bronchospasm from the actions of released histamine and leukotrienes.</span></div>
    <div class="rvc" data-rv><small>Late asthmatic response (LAR)</small><span>Infiltration of eosinophils and lymphocytes into the airways → bronchoconstriction and inflammation with mucous plugging.</span></div>
    <div class="rvc" data-rv><small>Management includes</small><span>Bronchodilators for short-term relief. Anti-inflammatory agents that reduce bronchial hyperactivity and protect against cellular infiltration.</span></div>
  </div>
  <h3><i>1.2</i>The drug groups</h3>
  <div class="ix" data-ix="steps"><div class="cap"><span>Recall · tap each group in order</span><em data-k="n"></em></div>
    <ol class="stp"><li>Bronchodilators: sympathomimetics (β₂-adrenergic agonists), anticholinergics (ipratropium), methylxanthines (aminophylline, theophylline)</li><li>Corticosteroids</li><li>Mast cell stabilizers (ketotifen, cromoglycate)</li><li>Leukotriene antagonists (zileuton, zafirlukast, montelukast)</li><li>Monoclonal antibodies (omalizumab)</li></ol>
  </div>
</section>

    <div class="msg" data-for="th"><b>Theophylline</b> inhibits phosphodiesterase (PDE), the enzyme that breaks down cyclic AMP, and antagonizes adenosine (a bronchoconstrictor).</div>
    <div class="msg" data-for="m"><b>Ipratropium and tiotropium</b> antagonize acetylcholine at muscarinic (M₃) receptors on bronchial smooth muscle and reduce secretions from mucous glands.</div>
    <div class="msg" data-for="crom"><b>Cromolyn</b> prevents degranulation of pulmonary mast cells and decreases release of histamine, PAF and LTC₄ from inflammatory cells.</div>

    <div class="msg" data-for="oma"><b>Omalizumab</b> is an anti-IgE monoclonal antibody.</div>
    <div class="msg" data-for="ster"><b>Glucocorticoids</b> block mediator release and decrease BHR by decreasing prostaglandins, leukotrienes and inflammatory interleukins.</div>

<section class="page" data-t="β₂ agonists in detail" data-g="reveal cards" data-p="Part 02 · Bronchodilators">
  <h3><i>2.2</i>Inhaled β₂-adrenergic selective agonists</h3>
  <ul>
    <li><b>Short acting:</b> <mark>albuterol, levalbuterol</mark> (also terbutaline). <b>Long acting:</b> <mark>salmeterol, formoterol</mark>.</li>
    <li>Long-acting drugs may decrease night-time attacks (<mark>prophylaxis only</mark>) and permit dosage reduction of other agents.</li>
  </ul>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Clinical uses (6)</small><span>Alleviate acute bronchospasm in acute asthma exacerbations (most common) · prophylaxis against exercise-induced asthma · bronchospasm in COPD · during general anesthesia · in NRDS or RSV infection · rapid treatment of critical hyperkalemia (drive K⁺ into cells).</span></div>
    <div class="rvc" data-rv><small>Side effects</small><span>Tachycardia and palpitations (some β₁ effects; levalbuterol is more β₂ selective than albuterol and causes less tachycardia) · tremors, anxiety · hypokalemia.</span></div>
    <div class="rvc" data-rv><small>Aerosol forms</small><span>Low potential for systemic toxicity, but may cause anxiety, muscle tremors and cardiovascular toxicity with overuse.</span></div>
  </div>
  <h3><i>2.3</i>Muscarinic antagonists</h3>
  <ul>
    <li><mark>Ipratropium</mark> (short acting), <mark>tiotropium</mark> (long acting); by inhalation.</li>
    <li><b>Uses:</b> COPD maintenance therapy and asthma exacerbations. May be safer than β agonists in patients with cardiovascular disease.</li>
    <li><mark>Drugs of choice in bronchospasm caused by β blockers.</mark></li>
    <li><b>Side effects:</b> nasal mucosa dryness, xerostomia, bronchitis, sinusitis (minor atropine-like effects).</li>
  </ul>
</section>

<section class="page" data-t="Methylxanthines · PDE4 inhibitors" data-g="reveal cards" data-p="Part 02 · Bronchodilators">
  <h3><i>2.4</i>Methylxanthines: theophylline</h3>
  <ul>
    <li>Bronchodilation through inhibition of phosphodiesterase → ↑ cyclic AMP; also antagonism of adenosine. Also thought to increase the contraction force of the diaphragm by increasing Ca²⁺ uptake into the muscle.</li>
    <li><b>Uses:</b> asthma controller medication and treatment for COPD; mainly adjunctive. Aminophylline IV is sometimes used in bronchospasm or status asthmaticus.</li>
  </ul>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Why is it a last-line controller?</small><span>Narrow therapeutic index (window), which predisposes to toxicity. Used in patients with poorly controlled asthma.</span></div>
    <div class="rvc" data-rv><small>Toxicity</small><span>Tremor, irritability, nausea, vomiting, diarrhea, tachyarrhythmia (↑ HR, arrhythmias) and CNS excitation.</span></div>
    <div class="rvc" data-rv><small>Toxicity is increased by</small><span>Erythromycin, cimetidine and fluoroquinolones. Many drug interactions.</span></div>
  </div>
  <h3><i>2.5</i>Phosphodiesterase-4 inhibitors: roflumilast</h3>
  <ul>
    <li>Selectively inhibits PDE4 → accumulation of cyclic AMP within inflammatory and structural cells important in the pathogenesis of <mark>COPD</mark>.</li>
    <li><b>Use:</b> treatment of COPD. <b>Side effects:</b> headache, diarrhea, weight loss.</li>
  </ul>
</section>

<section class="page" data-t="Anti-inflammatory drugs" data-g="compare" data-p="Part 03 · Anti-inflammatory and preventive drugs">
  <div class="part"><div class="pn">03</div><div><small>PART 03</small><b>Anti-inflammatory and preventive drugs</b><span>Corticosteroids · cromolyn · leukotriene inhibitors · omalizumab</span></div></div>
  <h3><i>3.1</i>Corticosteroids</h3>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · compare the two routes</span><em></em></div>
    <div class="chips"><button class="chip" data-v="i">Inhaled</button><button class="chip" data-v="o">Oral and IV</button></div>
    <div class="msg" data-for="i"><b>Drugs:</b> beclomethasone, budesonide, fluticasone, mometasone (also flunisolide).<br><b>Use:</b> <b>first-line asthma controller medications</b>; used by inhalation for both acute attacks and prophylaxis.<br><b>Toxicity:</b> minimal systemic absorption, so minimal toxicity. May cause <b>oropharyngeal candidiasis</b>, prevented with spacers and gargling.<br>Low dosage may also prevent the desensitization of β receptors that can occur with overuse of β₂ agonists.</div>
    <div class="msg" data-for="o"><b>Drugs:</b> prednisone, dexamethasone.<br><b>Use:</b> asthma exacerbations unresponsive to other measures; generally reserved for severe acute attacks.<br><b>Side effects:</b> osteoporosis, immunosuppression, hypertension, Cushing syndrome, hyperglycemia, cataracts, glaucoma, fluid retention, avascular necrosis of the femoral head, depression, mania, adrenal insufficiency on cessation.</div>
  </div>
  <h3><i>3.2</i>Cromolyn</h3>
  <ul>
    <li>Mast cell stabilizer (blocks histamine release) and anti-inflammatory agent. <b>Prophylactic:</b> decreases symptoms and BHR, especially responses to allergens.</li>
    <li><b>Uses:</b> asthma controller medication; allergic rhinitis.</li>
    <li>Minimal systemic toxicity, but may cause <mark>throat irritation and cough</mark>, relieved by a β₂ agonist.</li>
  </ul>
</section>

<section class="page" data-t="Leukotriene inhibitors · omalizumab" data-g="reveal cards" data-p="Part 03 · Anti-inflammatory and preventive drugs">
  <h3><i>3.3</i>Leukotriene inhibitors</h3>
  <p>Leukotrienes are mediators synthesized by leukocytes that promote <mark>bronchoconstriction and neutrophil chemotaxis</mark>.</p>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Montelukast, zafirlukast: uses</small><span>Asthma controller medication; especially useful in <b>triad asthma</b> (asthma induced by aspirin, NSAID use). Used prophylactically for many forms of asthma, including antigen, exercise or drug-induced. Montelukast is also indicated for acute prevention of exercise-induced bronchoconstriction and for allergic rhinitis.</span></div>
    <div class="rvc" data-rv><small>Montelukast, zafirlukast: side effects</small><span>Minimal toxicity. Headache can be a side effect.</span></div>
    <div class="rvc" data-rv><small>Zileuton</small><span>Selectively inhibits 5-lipoxygenase → decreases formation of all leukotrienes. Asthma controller medication, adjunctive to steroids, with a more rapid onset (1–3 hours). Minimal toxicity.</span></div>
  </div>
  <h3><i>3.4</i>Omalizumab</h3>
  <ul>
    <li>An <mark>anti-IgE monoclonal antibody</mark>.</li>
    <li><b>Use:</b> asthma that is poorly controlled with steroids or beta agonists. Minimal toxicity.</li>
  </ul>
  <div class="note"><b>COPD</b> (emphysema, chronic bronchitis): multiple bronchodilators are used, including β₂ agonists and M blockers, and the PDE4 inhibitor roflumilast.</div>
</section>

<section class="page" data-t="Acute and chronic disease" data-g="compare" data-p="Part 01 · The oriental lung fluke">

    <div class="chips"><button class="chip" data-v="a">Acute · 2 months</button><button class="chip" data-v="c">Chronic · 3 to 4 months</button></div>
    <div class="msg" data-for="a"><b>Pathogenesis.</b> Occurs during <b>migration of the immature flukes</b> in the lung, with high eosinophilia. Pulmonary migration may cause acute pneumonitis with haemorrhage, eosinophilic infiltration and pleural effusion.<br><b>Clinical picture.</b> Begins 2 months after ingestion of metacercaria: abdominal pain, diarrhea, nausea and vomiting, urticaria. A few days later: fever, pleuritic chest pain that increases with respiration, dyspnea, cough.</div>
    <div class="msg" data-for="c"><b>Pathogenesis.</b> The parasites are inside <b>cysts in the lung</b>. The inflammatory response around juvenile flukes, adults and eggs starts as granulomatous, followed by formation of thick fibrous cyst walls. Infection can persist for several years.<br><b>Clinical picture.</b> Begins 3 to 4 months after infection: low grade fever, night sweats, <b>haemoptysis</b>, dyspnea, chest pain.</div>

<section class="page" data-t="House dust mites" data-g="tap the room" data-p="Part 02 · House dust mites">
  <div class="part"><div class="pn">02</div><div><small>PART 02</small><b>House dust mites</b><span>Where they live · what they cause · diagnosis · control</span></div></div>
  <h3><i>2.1</i>Meet the mite</h3>
  <ul>
    <li>Very small mites (<mark>0.3 mm</mark>), <b>worldwide</b>. <mark>Dermatophagoides</mark> is the commonest dust mite.</li>
    <li>Their main food is <b>human skin scales</b> and other organic debris.</li>
    <li><b>Life cycle:</b> incomplete metamorphosis. Eggs hatch giving larvae that moult into nymphs, then adults.</li>
  </ul>
  <h3><i>2.2</i>Mite-proof the bedroom</h3>
  <div class="ix" data-ix="hl" data-start="bed">
    <div class="cap"><span>Live · tap a part of the room</span><em>orange = selected</em></div>

    <div class="msg" data-for="bed"><b>Beds are the most important, and sometimes the only, breeding site.</b> Control: regular vacuum cleaning of beds, and frequent washing of sheets and blankets.</div>
    <div class="msg" data-for="carpet"><b>House dust on the floors and the furniture.</b> Control: regular vacuum cleaning of carpets and furniture.</div>
    <div class="msg" data-for="air"><b>The largest numbers of mites are found in warm, damp and inadequately aired houses.</b> Control: bedrooms and living rooms should be aired regularly.</div>

<section class="page" data-t="What mites cause" data-g="reveal cards" data-p="Part 02 · House dust mites">
  <h3><i>2.3</i>Medical importance</h3>
  <p>The bodies of living or dead mites and their <mark>faeces</mark> contain potent <mark>allergens</mark> that produce allergic reactions in sensitized individuals.</p>
  <div class="ix" data-ix="pick"><div class="cap"><span>Live · route of exposure</span><em></em></div>
    <div class="chips"><button class="chip" data-v="i">Inhalation</button><button class="chip" data-v="c">Contact</button></div>
    <div class="msg" data-for="i">Inhalation of house dust loaded with certain mites, their faeces, and other debris and fungi associated with them produces <b>bronchial asthma</b> and <b>allergic rhinitis</b>, especially in children.</div>
    <div class="msg" data-for="c">Contact with dust loaded with other types causes severe <b>atopic dermatitis</b>.</div>
  </div>
  <h3><i>2.4</i>Clinical picture and diagnosis</h3>
  <div class="ix"><div class="cap"><span>Recall · tap a card</span><em></em></div>
    <div class="rvc" data-rv><small>Clinical picture</small><span><b>Perennial rhinitis</b>: sneezing, runny nose, coughing, watery eyes · <b>bronchial asthma</b>: wheezing, dyspnea · more in children, year round.</span></div>
    <div class="rvc" data-rv><small>Diagnosis 1 · the dust</small><span>Dust samples taken from houses are examined microscopically to detect mites.</span></div>
    <div class="rvc" data-rv><small>Diagnosis 2 · allergy skin test</small><span>Usually carried out on the forearm. The skin is observed for signs of allergic reaction after <b>15 minutes</b>: a red, itchy bump where the dust mite extract was pricked onto the skin.</span></div>
    <div class="rvc" data-rv><small>Diagnosis 3 · immunodiagnosis</small><span>Detection of <b>IgE and IgG4</b>.</span></div>
  </div>
</section>

/* O2 dissociation curve */

    const c = fit(cv); if (!c) return; const {ctx, W, H, u, f} = c, p = +sl.value;
    const x0 = 34 * u, y0 = H - 26 * u, x1 = W - 10 * u, y1 = 10 * u, X = v => x0 + v / 110 * (x1 - x0), Y = v => y0 - v / 100 * (y0 - y1);

    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; for (const v of [0, 25, 50, 75, 100]){ ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1, Y(v)); ctx.stroke(); ctx.fillText(v + '%', x0 - 4 * u, Y(v)); }

    const curve = (k, col, w, dash) => { ctx.beginPath(); for (let v = 0; v <= 110; v += 1){ const x = X(v), y = Y(sat(v, P50[k])); v ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.strokeStyle = col; ctx.lineWidth = w * u; ctx.setLineDash(dash ? [4 * u, 4 * u] : []); ctx.stroke(); ctx.setLineDash([]); };

    else if (p >= 60) m = '<b>Flat upper part.</b> Between 100 and 60 mmHg the saturation changes little: 97% down to 90% only. Reading here: about ' + Math.round(s) + '%.';
    else if (p >= 40) m = '<b>Towards the tissues at rest.</b> At 40 mmHg the saturation is 75%: only 22% of O₂ is given to the tissues; the rest is the O₂ reserve. Reading here: about ' + Math.round(s) + '%.';

/* spirogram with volumes and capacities */
IX.spiro = root => {

    IRV: [3000, 6000, 'Inspiratory reserve volume', 'the volume that can be inspired above tidal volume during maximal inspiration. Approximately <b>3000 ml</b>.'],
    ERV: [1000, 2500, 'Expiratory reserve volume', 'the volume that can be expired following expiration of a tidal volume, during maximal expiration. Approximately <b>1500 ml</b>.'],
    RV: [0, 1000, 'Residual volume', 'the volume remaining in the lungs following maximal expiration. Approximately <b>1000 ml</b>.'],
    IC: [2500, 6000, 'Inspiratory capacity (IC)', 'the total volume inspired during maximal inspiration = tidal volume + inspiratory reserve volume = 500 + 3000 = <b>3500 ml</b>.'],

  $$('[data-v]', root).forEach(b => b.onclick = () => set(b.dataset.v)); set('TV');
  const T = 14, vol = t => { t = ((t % T) + T) % T; const tid = 2750 - 250 * Math.cos(Math.PI * t);
    if (t < 5) return tid; if (t < 6.6) return 2500 + 3500 * ease((t - 5) / 1.6); if (t < 9.6) return 6000 - 5000 * ease((t - 6.6) / 3); if (t < 11) return 1000 + 1500 * ease((t - 9.6) / 1.4); return 2750 - 250 * Math.cos(Math.PI * (t - 11)); };
  return dt => {
    clock += dt; const c = fit(cv); if (!c) return; const {ctx, W, H, u, f} = c;
    const x0 = 36 * u, x1 = W - 58 * u, y0 = H - 10 * u, y1 = 10 * u, X = t => x0 + t / T * (x1 - x0), Y = v => y0 - v / 6200 * (y0 - y1), d = D[cur];
    ctx.fillStyle = 'rgba(46,134,222,.14)'; ctx.fillRect(x0, Y(d[1]), x1 - x0 + 8 * u, Y(d[0]) - Y(d[1]));
    ctx.strokeStyle = '#e3ded0'; ctx.lineWidth = u; ctx.font = f(7); ctx.fillStyle = '#8c92a2'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (const v of [0, 1000, 2500, 3000, 6000]){ ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1 + 8 * u, Y(v)); ctx.stroke(); ctx.fillText(v, x0 - 3 * u, Y(v)); }
    ctx.beginPath(); for (let t = 0; t <= T; t += .05){ const x = X(t), y = Y(vol(t)); t ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.strokeStyle = '#0b1f45'; ctx.lineWidth = 2.4 * u; ctx.stroke();
    const bx = x1 + 14 * u; ctx.strokeStyle = '#2e86de'; ctx.lineWidth = 2 * u; ctx.beginPath(); ctx.moveTo(bx - 4 * u, Y(d[1])); ctx.lineTo(bx, Y(d[1])); ctx.lineTo(bx, Y(d[0])); ctx.lineTo(bx - 4 * u, Y(d[0])); ctx.stroke();
    ctx.fillStyle = '#163a73'; ctx.font = f(9, 700); ctx.textAlign = 'left'; ctx.fillText(cur, bx + 5 * u, (Y(d[0]) + Y(d[1])) / 2);
    const t = clock % T; ctx.fillStyle = '#ff5c8a'; ctx.beginPath(); ctx.arc(X(t), Y(vol(t)), 4.2 * u, 0, 7); ctx.fill();
    const dv = vol(t + .05) - vol(t); if (Math.abs(dv) > 2) Snd.ask(Math.min(1, Math.abs(dv) / 90), dv > 0);
  };
};

/* forced expiration: normal, obstructive, restrictive */

  const set = v => { cur = v; t0 = clock; $$('[data-k=pt] button', root).forEach(b => b.classList.toggle('on', b.dataset.v === v)); const d = D[v]; $('[data-k=f1]', root).textContent = d[0].toFixed(1) + ' L'; $('[data-k=fvc]', root).textContent = d[1].toFixed(1) + ' L'; $('[data-k=ra]', root).textContent = d[2]; msg.innerHTML = d[4]; };

    for (let v = 0; v <= 5; v++){ ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1, Y(v)); ctx.stroke(); ctx.fillText(v, x0 - 4 * u, Y(v)); }

    ctx.fillStyle = D[cur][3]; ctx.beginPath(); ctx.arc(X(el), Y(V(cur, el)), 4.2 * u, 0, 7); ctx.fill();

    ctx.fillStyle = '#f6d98a'; ctx.beginPath(); for (let k = 0; k <= 60; k++){ const an = k / 60 * 6.283, r = rl - R * .01 + Math.sin(an * 9 + 1) * R * .012; k ? ctx.lineTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r) : ctx.moveTo(cx + Math.cos(an) * r, cy + Math.sin(an) * r); } ctx.fill();   // epithelium

    const mx = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
    mx.forEach((q, k) => { const x = cx + q[0] * R * .93, y = cy + q[1] * R * .8; ctx.fillStyle = '#7a4fd0'; ctx.beginPath(); ctx.arc(x, y, 7 * u, 0, 7); ctx.fill();
      for (let j = 0; j < 5; j++){ const t = (clock * .5 + j / 5 + k * .13) % 1; if (t > cur.a) continue; ctx.fillStyle = `rgba(214,69,69,${1 - t})`; ctx.beginPath(); ctx.arc(x + (cx - x) * t * .5 + Math.sin(j * 9) * 5 * u, y + (cy - y) * t * .5 + Math.cos(j * 7) * 5 * u, 1.8 * u, 0, 7); ctx.fill(); } });

    ctx.fillStyle = '#c96b7c'; for (let i = 0; i < 9; i++){ ctx.beginPath(); ctx.ellipse(W * (.06 + i * .11), yb + (H - yb) * (.45 + .2 * Math.sin(i * 2.3)), 7 * u, 2.2 * u, i, 0, 7); ctx.globalAlpha = .35; ctx.fill(); } ctx.globalAlpha = 1;

        ctx.beginPath();
        if (t === 'g'){ ctx.moveTo(x + w * .36, yb); ctx.lineTo(x + w * .36, yb - (yb - yt) * .42); ctx.bezierCurveTo(x - w * .04, yb - (yb - yt) * .6, x + w * .02, yt, x + w * .5, yt); ctx.bezierCurveTo(x + w * .98, yt, x + w * 1.04, yb - (yb - yt) * .6, x + w * .64, yb - (yb - yt) * .42); ctx.lineTo(x + w * .64, yb); }

  for (let i = 0; i < 26; i++) gas.push({an: Math.random() * 6.28, t: Math.random(), o: i % 2 === 0});
  const mark = () => { $$('[data-v]', root).forEach(b => b.classList.toggle('on', b.dataset.v === sel)); msg.innerHTML = T[sel]; };

      for (let k = 0; k < 5; k++){ const an = a[0] + ((clock * .22 + k / 5 + j * .1) % 1) * (a[1] - a[0]); ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.ellipse(cx + Math.cos(an) * (R + R0 * .16), cy + Math.sin(an) * (R + R0 * .16), R0 * .06, R0 * .035, an + 1.57, 0, 7); ctx.fill(); } });

  const nx = BOOKS[BOOKS.indexOf(cur) + 1];
  const cover = document.createElement('section'); cover.className = 'page'; cover.dataset.p = cur.subj + ' · ' + cur.lec;
  cover.innerHTML = `<div class="cover"><div class="kick">${MODULE.kicker}</div><h1>${cur.title}</h1><p class="hand">${cur.subj} · ${cur.lec}</p><ul class="toc" id="toc"></ul><div class="note"><b>How to use it.</b> Drag a page corner or swipe to turn. Every blue-labelled box is live: tap, drag or slide it. Turn on <b>Sound</b> to hear the figures that breathe.</div></div>`;
  secs.unshift(cover);
  if (secs.length % 2){ const end = document.createElement('section'); end.className = 'page'; end.dataset.p = 'End of the lecture'; end.innerHTML = `<div class="endp"><div class="kick">End of the lecture</div><h1>Well done.</h1><p>Your place and your quiz score are saved.</p><div class="row" style="justify-content:center">${nx ? `<button class="btn" data-open="${nx.id}">Next: ${nx.title}</button>` : ''}<button class="btn gh" data-act="home">Back to the library</button></div></div>`; secs.push(end); }
  PAGES = secs.map((s, i) => [i ? (s.dataset.t || 'End') : 'Contents', s.dataset.g || '']);
  secs.forEach((s, i) => { s.classList.add(i % 2 ? 'pr' : 'pl'); const pin = document.createElement('div'); pin.className = 'pin'; pin.innerHTML = `<div class="rh"><span>${s.dataset.p || ''}</span><span>${cur.short}</span></div>`; while (s.firstChild) pin.appendChild(s.firstChild); pin.insertAdjacentHTML('beforeend', `<span class="pno">${i + 1}</span>`); s.appendChild(pin); book.appendChild(s); });
  book.style.width = bw + 'px'; book.style.height = d.ph + 'px'; book.style.setProperty('--pw', d.pw + 'px'); book.style.setProperty('--ph', d.ph + 'px'); stage.style.setProperty('--bw', bw + 'px');
  const toc = $('#toc', book), rd = Prog.book(cur.id).r;
  PAGES.forEach((p, i) => { if (!i || !secs[i].dataset.t) return; const li = document.createElement('li'); li.innerHTML = `<button data-go="${i}"><b>${i + 1}</b><span>${p[0]}${p[1] ? `<i class="tag">${p[1]}</i>` : ''}</span>${rd.includes(i) ? '<em>read</em>' : ''}</button>`; toc.appendChild(li); });
  $$('[data-rv]', book).forEach(e => { e.classList.add('hid'); e.onclick = () => e.classList.toggle('hid'); });
  at = Math.min(at, PAGES.length - 1);
  pf = FlipBook(book, $$('.page', book), {pw: d.pw, ph: d.ph, mode, start: at, time: 600, onflip: i => { at = i; upd(); }, onstate: s => { flipping = s; }});
  at = pf.index;
  $$('[data-ix]', book).forEach(el => { const f = IX[el.dataset.ix]; if (!f) return; let t; try { t = f(el); } catch (e){ console.warn('figure failed', el.dataset.ix, e); return; } if (typeof t === 'function') ticks.push([el, t]); else if (t && t.tick){ ticks.push([el, t.tick]); if (t.dispose) disposers.push(t.dispose); } });
  flipping = false; upd();
}
function upd(){
  const n = PAGES.length, L = mode === 'spread' ? at - at % 2 : at, st = mode === 'spread' ? 2 : 1;
  $('#ind').textContent = mode === 'spread' ? `pp. ${L + 1}–${Math.min(L + 2, n)} of ${n}` : `p. ${at + 1} of ${n}`;
  $('#prog').style.width = Math.round((L + st) / n * 100) + '%';
  $('#mmid').textContent = PAGES[at][0] + ' · p. ' + (at + 1);
  $$('[data-act=prev]').forEach(b => b.disabled = L <= 0); $$('[data-act=next]').forEach(b => b.disabled = L + st >= n);
  for (let i = L; i < L + st && i < n; i++) Prog.read(cur.id, i);
  Prog.at(cur.id, L);
}
function goTo(i){ if (!pf) return; closeOv(); const L = mode === 'spread' ? i - i % 2 : i, st = mode === 'spread' ? 2 : 1; if (L === at) return; if (L === at + st) pf.next(); else if (L === at - st) pf.prev(); else pf.jump(L); }
function closeOv(){ $$('.ov').forEach(o => o.hidden = true); }
function openBook(id, keep){
  const b = byId(id); if (!b) return home();
  if (b.tpl.content.querySelector('[data-ix=chest],[data-3d]') && !window.THREE && !b._tried){ b._tried = 1; const s = document.createElement('script'); s.src = 'three.min.js'; s.onload = s.onerror = () => openBook(id, keep); document.head.appendChild(s); return; }
  cur = b; at = keep ? at : (Prog.data.books[id] ? Prog.data.books[id].last || 0 : 0);
  lib.hidden = true; app.hidden = false; $('#bsub').textContent = b.subj + ' · ' + b.lec + ' · ' + b.title;
  try { if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id); } catch (e){}
  mount();
}
function home(){
  unmount(); cur = null; app.hidden = true; lib.hidden = false; document.body.classList.remove('single'); paintLib();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e){}
}
document.addEventListener('ixdone', e => { if (cur) Prog.quiz(cur.id, e.detail.r, e.detail.n); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o){ closeOv(); at = 0; return openBook(o.dataset.open); }
  const g = e.target.closest('[data-go]'); if (g) return goTo(+g.dataset.go);
  const b = e.target.closest('[data-act]'); if (!b){ if (e.target.classList.contains('ov')) closeOv(); return; }
  const a = b.dataset.act;
  if (a === 'next' && pf) pf.next(); else if (a === 'prev' && pf) pf.prev();
  else if (a === 'sound') b.classList.toggle('on', Snd.toggle());
  else if (a === 'home') { closeOv(); home(); }
  else if (a === 'toc'){ $('#ovl').innerHTML = PAGES.map((p, i) => `<li><button data-go="${i}"><b>${i + 1}</b><span>${p[0]}</span><em>${p[1]}</em></button></li>`).join(''); $('#ov').hidden = false; }
  else if (a === 'acct'){ paintAcct(); $('#ovacct').hidden = false; }
  else if (a === 'signin') Sync.signIn(); else if (a === 'signout') Sync.signOut();
  else if (a === 'close') closeOv();
});
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'Escape') closeOv(); if (!pf) return; if (e.key === 'ArrowRight') pf.next(); if (e.key === 'ArrowLeft') pf.prev(); });
let rsT; window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => {
  if (!cur) return; const W = stage.clientWidth, H = stage.clientHeight, d = dims();
  if (d.mode !== mode || Math.abs(W - lastW) > 24 || Math.abs(H - lastH) > lastH * .14) mount();   // a phone's sliding toolbar never rebuilds the page
}, 220); });
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id && byId(id)){ if (!cur || cur.id !== id){ at = 0; openBook(id); } } else if (cur) home(); });

let lastT = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  if (cur && !flipping) for (const [el, f] of ticks){ if (el.offsetParent !== null) f(dt, t / 1000); }   // figures rest while a page is turning
  Snd.flush();
}
function start(){ Prog.load(); Prog.subs.push(() => { if (!cur) paintLib(); }); paintAcct(); const id = location.hash.slice(1); if (id && byId(id)) openBook(id); else home(); requestAnimationFrame(frame); Sync.init(); }
if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]).then(start); else start();

</script>
