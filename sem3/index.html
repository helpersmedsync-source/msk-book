<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semester 3 · The Helpers Interactive Books</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="../common.css">
<style>.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}#notice{margin-bottom:16px}#notice:empty{display:none}.mod{min-height:230px}</style></head><body>
<div id="bar"></div>
<div class="wrap">
  <div class="hero"><small>Year 2 · Semester 3</small><h1>Semester 3 modules</h1><p>Every lecture as a book you can turn, tap and test yourself on. Pick a module.</p></div>
  <div id="notice"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="../gate.js"></script>
<script src="../fb.js"></script>
<script src="../hub.js"></script>
<script>
const MODS = [
  {id: 'msk', name: 'MSK', long: 'Musculoskeletal module', color: '#d64545', status: 'done', url: '../msk.html', text: '34 lecture books and 13 practical books, with labs on the real practical slides.'},
  {id: 'res', name: 'RES', long: 'Respiratory module', color: '#2e86de', status: 'prog', url: '../res/', text: 'All 22 lectures as books, plus a question bank with timed tests, flashcards and search. Updates come with this year\'s lectures.'},
  {id: 'cvs', name: 'CVS', long: 'Cardiovascular module', color: '#8a55e0', status: 'soon', url: '', text: 'Starts when the module starts.'}
];
const LAB = {done: 'Finished', prog: 'In progress', soon: 'Coming soon'};
function paint(cfg){
  const m = (cfg && cfg.modules) || {};
  document.getElementById('notice').innerHTML = cfg && cfg.notice ? '<div class="note"></div>' : '';
  if (cfg && cfg.notice) document.querySelector('#notice .note').textContent = cfg.notice;
  let res = ''; try { const d = JSON.parse(localStorage.getItem('helpers.res.v1')); const n = d ? Object.values(d.books).filter(b => b.r && b.r.length).length : 0; if (n) res = `<p><b>${n}</b> book${n > 1 ? 's' : ''} opened on this device.</p>`; } catch (e){}
  document.getElementById('grid').innerHTML = MODS.map(x => {
    const st = (m[x.id] && m[x.id].status) || x.status, url0 = (m[x.id] && m[x.id].url) || x.url, url = x.id === 'msk' && (url0 === '../' || url0 === '..') ? '../msk.html' : url0, open = st !== 'soon' && url;
    return `<${open ? `a href="${url}"` : 'div'} class="card mod ${open ? '' : 'soon'}" style="--c:${x.color}"><span><span class="tag ${st}">${LAB[st]}</span></span><h2>${x.name}</h2><p><b>${x.long}.</b> ${x.text}</p>${x.id === 'res' && open ? res : ''}<span class="go">${open ? 'Open the books →' : 'Not open yet'}</span></${open ? 'a' : 'div'}>`;
  }).join('');
}
paint(null); Hub.bar([['Semester 3', '']]);
Hub.init().then(async () => { try { if (!Hub._api) return; const {F, db} = Hub._api, s = await F.getDoc(F.doc(db, 'site', 'config')); if (s.exists()) paint(s.data()); } catch (e){} });
</script></body></html>
